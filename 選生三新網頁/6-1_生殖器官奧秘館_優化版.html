const CONTENT={"pptText": {"1": "6-1 \n生殖\n系統\n6-1.1 \n男性的生殖系統\n6-1.2 \n女性的生殖系統", "2": "腹面觀\n側面\n觀\n6-1.1 \n男性的生殖系統\n輸尿管\n輸精管\n膀胱\n儲\n精囊（\n1\n 對）\n攝護\n腺（\n1\n 個）\n尿道球\n腺（\n1\n 對）\n陰莖\n尿道\n陰囊\n副睪\n睪丸\n配合課本 \nP178\n灰色構造並非生殖系統\n註", "3": "6-1.1 \n男性的生殖系統\n◆ 由許多彎曲的\n細精管\n與其間\n的\n\n間\n質細胞\n構成\n細精管\n間質細胞\n睪丸\n配合課本 \nP178", "4": "◆ \n細精管管壁\n上的\n精原細胞\n會先分化為\n精母細胞\n，再經減數分裂形成\n精子\n6-1.1 \n男性的生殖系統\n◆ \n間質細胞\n可分泌\n睪固酮\n睪丸\n細精管\n間質細胞\n配合課本 \nP178", "5": "6-1.1 \n男性的生殖系統\n腹面觀\n儲\n精囊（\n1\n 對）\n攝護\n腺（\n1\n 個）\n尿道球\n腺（\n1\n 對）\n◇\n \n精子\n成熟，獲得運動與受精能力\n◇\n \n暫時儲存精子\n◇ \n輸送\n精子\n◇\n \n分泌\n弱鹼性\n液體\n→ 提供精子養分，促進其活動\n→ 和精子混合形成精液\n→ \n中和陰道的酸性環境，提高精子存活率\n又稱前列腺\n①\n②\n③\n④\n配合課本 \nP178\n細精管\n輸尿管\n膀胱\n陰莖\n尿道\n睪丸\n陰囊\n輸精管\n副睪\n睪丸", "6": "◇ \n為性交器官，性興奮時會因充血而勃起\n6-1.1 \n男性的生殖系統\n◇\n \n性高潮時，輸精管末端的平滑肌收縮，引發射精，將精液排出體外\n配合課本 \nP178\n腹面觀\n儲\n精囊（\n1\n 對）\n攝護\n腺（\n1\n 個）\n尿道球\n腺（\n1\n 對）\n細精管\n輸尿管\n膀胱\n陰莖\n尿道\n睪丸\n陰囊\n輸精管\n副睪\n睪丸", "7": "6-1.2 \n女性的生殖系統\n膀胱\n尿道\n輸卵管\n卵巢\n陰道\n陰道口\n子宮頸\n輸卵管\n開口\n子宮平滑肌\n子宮內膜\n子宮\n配合課本 \nP179\n灰色構造並非生殖系統\n註", "8": "6-1.2 \n女性的生殖系統\n◆ \n位於骨盆腔內，左右各一，內含許多\n濾泡\n卵巢\n濾泡\n配合課本 \nP179", "9": "◆ \n出生時\n6-1.2 \n女性的生殖系統\n→ \n濾泡細胞\n能分泌\n動情素\n→ \n濾泡\n由一個\n初級卵母細胞\n及周圍的\n濾泡細胞\n構成\n濾泡\n卵巢\n濾泡\n濾泡細胞\n初級卵母細胞\n→ \n濾泡\n已形成\n配合課本 \nP179\n、\n183", "10": "◆ \n青春期開始\n6-1.2 \n女性的生殖系統\n發育中的濾泡\n排卵\n（ 次級\n卵母\n細胞 ）\n成熟的濾泡\n次級卵母細胞\n黃體\n卵巢\n濾泡細胞\n初級卵母細胞\n濾泡\n→ \n每個月左、右卵巢會同時有十幾個濾泡發育\n→ \n通常僅有\n一個\n優勢濾泡能完成成熟並排卵\n配合課本 \nP179\n、\n183", "11": "6-1.2 \n女性的生殖系統\n①\n②\n③\n次級卵母細胞在輸卵管\n上皮細胞的纖毛\n擺動下，經輸卵管末端的\n喇叭狀開口\n進入輸卵管\n通常在輸卵管中完成受精作用\n輸卵管\n卵巢\n子宮\n陰道\n陰道口\n輸卵管\n開口\n子宮頸\n配合課本 \nP179", "12": "6-1.2 \n女性的生殖系統\n輸卵管\n卵巢\n子宮\n陰道\n陰道口\n輸卵管\n開口\n子宮頸\n子宮平滑肌\n子宮內膜\n◇ \n由平滑肌與子宮內膜構成\n◇ \n囊胚著\n床與胚胎發育的場所\n◇ \n子宮下方，與陰道相連\n◇ \n性交時容納陰莖的通道\n◇ \n分娩時胎兒娩出的產道\n配合課本 \nP179\n①\n②\n③", "13": "  \nQuestion\n1\n.\n \n生殖\n是生物重要的生命現象，有關人類生殖的敘述，下列何者正確\n？　\n(\nA)\n人類所有的生殖構造皆為兩兩成對，在出生時皆已發育成熟且具備\n功能　\n(\nB)\n成熟的女性每個月排卵後，卵巢中的濾泡隨即開始再次發育\n成熟　\n(\nC)\n精子在副睪中暫存並成熟，之後與儲精囊、攝護腺及尿道球腺的分泌物混合成\n精液　\n(\nD)\n卵巢內有許多濾泡細胞及次級卵母細胞，成熟的濾泡會排出完成減數分裂的卵。\n解答\n：\n(\nC)\n13", "14": "  \nQuestion\n解析\n：\n(\nA)\n人類的生殖構造並非全部兩兩成對，\n例如\n：\n男性\n的攝護腺、女性的子宮。\n(B)\n卵巢週期中，濾泡在排卵後會形成黃體，等黃體萎縮後才會再開始下一次週期。\n(D)\n濾泡由許多濾泡細胞及初級卵母細胞所組成。成熟的濾泡所排出的「卵」實際上是發展到次級卵母細胞階段。\n14", "15": "  \nQuestion\n2\n.\n 人類\n兩性生殖系統構造中，下列何組功能\n最不對等\n？　\n(\nA)\n睪丸與\n卵巢　\n(\nB)\n儲精囊與\n子宮　\n(\nC)\n細精管旁的間質細胞與卵巢的濾泡\n細胞　\n(\nD)\n細精管與濾泡。\n解答\n：\n(B)\n解析\n：\n(\nA)\n皆為生殖器官。\n(B)\n儲精囊分泌精液，子宮則為胚胎發育處。\n(C)\n皆為\n分泌\n性激素\n的細胞。\n(D)\n細精管產生精子，濾泡內具發育之卵母細胞。\n15"}, "lessons": [{"id": "b3-c61-l01", "t": "生殖系統：製造、輸送與支持", "sec": "s1", "slide": 1, "sourceSlides": [1], "sourcePages": [], "src": "原PPT第 1 頁；課本 P178", "figSpec": {"image": "PPT01S3"}, "txt": "<ul><li>有性生殖透過配子結合，讓遺傳訊息傳向下一代。</li><li>本章分清生殖腺、管道、附屬腺體與外生殖器的不同任務。</li><li>器官的位置、細胞的作用與物質流向，要分層閱讀。</li><li>圖中鄰近的泌尿構造用於定位，不因此全屬生殖系統。</li></ul><p class=\"think\">一個系統是否只靠製造配子的器官就能完成所有功能？</p><div class=\"ex\"><h4>為什麼要生殖</h4><p>生物藉由生殖將基因傳給後代，使族群穩定延續。人類行<b>有性生殖</b>：雌、雄配子結合產生新生命。</p></div><div class=\"ex\"><h4>本節兩段</h4><ul><li>6-1.1 男性的生殖系統</li><li>6-1.2 女性的生殖系統</li></ul></div><div class=\"ex\"><h4>讀圖方法</h4><p>先分清楚三類功能：<b>製造配子</b>、<b>輸送與支持</b>、<b>提供胚胎發育</b>。</p></div>", "tb": []}, {"id": "b3-c61-l02", "t": "男性全景：兩個視角，同一條路", "sec": "s1", "slide": 2, "sourceSlides": [2], "sourcePages": [1], "src": "原PPT第 2 頁；課本 P178", "figSpec": {"image": "male"}, "txt": "<ul><li>側面觀看前後關係，腹面觀看成對與中央構造。</li><li>睪丸位於陰囊內；副睪貼近睪丸，接續輸精管。</li><li>攝護腺為一個；儲精囊與尿道球腺各一對，並非所有器官成對。</li><li>輸尿管與膀胱屬泌尿構造；輸尿管與輸精管名稱相近而流向不同。</li></ul><p class=\"think\">從兩個視角追蹤輸精管，是否真的進入膀胱腔？</p><div class=\"ex\"><h4>男性生殖系統</h4><p>包括睪丸、副睪、輸精管、儲精囊、攝護腺（前列腺）、尿道球腺、陰莖及陰囊。</p></div><div class=\"ex\"><h4>讀圖提醒</h4><ul><li>圖有腹面觀與側面觀，是同一套構造的兩個角度。</li><li>灰色構造（如膀胱、輸尿管）<b>不屬於生殖系統</b>。</li><li>尿道是精液與尿液的共同出口。</li></ul></div>", "tb": [["BOOK1", "P178 完整課本頁"]]}, {"id": "b3-c61-l03", "t": "睪丸微觀：管內與管間的分工", "sec": "s1", "slide": 3, "sourceSlides": [3], "sourcePages": [], "src": "原PPT第 3 頁；課本 P178", "figSpec": {"image": "PPT03S3"}, "txt": "<ul><li>睪丸包含許多細長盤曲的細精管。</li><li>配子形成位於細精管；間質細胞位於管與管之間。</li><li>間質細胞產生睪固酮，經體液與血液傳遞，與精子沿管道移動不同。</li><li>同一器官可同時有生殖與內分泌功能。</li></ul><p class=\"think\">若一條輸送管道阻斷，能直接推論所有激素分泌都停止嗎？</p><div class=\"ex\"><h4>睪丸的構造</h4><p>人類睪丸位於<b>陰囊</b>內，由許多彎曲的<b>細精管</b>與其間的<b>間質細胞</b>構成。</p></div><div class=\"ex\"><h4>分工</h4><ul><li><b>細精管</b>：產生精子。</li><li><b>間質細胞</b>：分泌睪固酮。</li></ul></div><div class=\"ex\"><h4>記法</h4><p>管內造精子，管間分泌激素。</p></div>", "tb": []}, {"id": "b3-c61-l04", "t": "從精原細胞到精子：分裂與分化", "sec": "s1", "slide": 4, "sourceSlides": [4], "sourcePages": [], "src": "原PPT第 4 頁；課本 P178", "figSpec": {"image": "PPT04S3"}, "txt": "<ul><li>精原細胞先進入精母細胞的發育路徑。</li><li>精母細胞經減數分裂形成單倍體精細胞。</li><li>精細胞再經分化，形成具特殊頭部與尾部的精子。</li><li>減數分裂改變染色體套數，形態分化不等於再做一次減數分裂。</li></ul><p class=\"think\">得到單倍體細胞與具備精子形態，為何要用兩個不同箭頭？</p><div class=\"scope-note\">機制補充：減數分裂形成精細胞，之後經形態分化成精子；不能把兩個過程視為同一事件。支持細胞留在細精管上皮，並不脫離變成精子。<a href=\"https://openstax.org/books/anatomy-and-physiology/pages/27-1-anatomy-and-physiology-of-the-male-reproductive-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote source-correction\">機制補充：減數分裂形成精細胞，之後經形態分化成精子；不能把兩個過程視為同一事件。支持細胞留在細精管上皮，並不脫離變成精子。<a href=\"https://openstax.org/books/anatomy-and-physiology/pages/27-1-anatomy-and-physiology-of-the-male-reproductive-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a><small>原文閱讀前先看來源補充；原文保留供查對</small></div><div class=\"ex\"><h4>精子的來源</h4><p>細精管管壁上的<b>精原細胞</b>先分化為<b>精母細胞</b>，再經<b>減數分裂</b>形成精子。</p></div><div class=\"ex\"><h4>小提醒</h4><p>精原細胞→精母細胞是分化；精母細胞→精子才經減數分裂（細節見 6-2）。</p></div>", "tb": []}, {"id": "b3-c61-l05", "t": "副睪：成熟、暫存與獲能的界線", "sec": "s1", "slide": 5, "sourceSlides": [5], "sourcePages": [], "src": "原PPT第 5 頁；課本 P178", "figSpec": {"image": "PPT05S3"}, "txt": "<ul><li>離開睪丸的精子進入副睪，在此進一步成熟與暫存。</li><li>成熟包含運動等功能的發展，不等於所有受精準備皆已完成。</li><li>獲能通常在射出後於女性生殖道發生，也可在適當體外條件誘發。</li><li>儲精囊的名稱不能取代副睪的儲藏與成熟功能。</li></ul><p class=\"think\">能移動的精子，是否一定已具備完成受精的全部條件？</p><div class=\"scope-note\">來源補充：副睪中的成熟使精子逐步具備運動等功能，但不代表受精的全部準備已完成；射出後通常仍需在女性生殖道經歷「獲能」，適當體外條件亦可誘發。原文「獲得受精能力」需加此範圍。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK26843/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote source-correction\">來源補充：副睪中的成熟使精子逐步具備運動等功能，但不代表受精的全部準備已完成；射出後通常仍需在女性生殖道經歷「獲能」，適當體外條件亦可誘發。原文「獲得受精能力」需加此範圍。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK26843/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a><small>原文閱讀前先看來源補充；原文保留供查對</small></div><div class=\"ex\"><h4>副睪</h4><p>精子產生後離開睪丸，進入副睪。</p></div><div class=\"ex\"><h4>功能</h4><ul><li>暫時<b>儲存</b>精子。</li><li>精子在此<b>成熟</b>，獲得運動與受精能力。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>精子在睪丸「生成」、在副睪「成熟」，兩者不同。</p></div>", "tb": []}, {"id": "b3-c61-l06", "t": "精子輸送：管道與共同出口", "sec": "s1", "slide": 5, "sourceSlides": [5], "sourcePages": [], "src": "原PPT第 5 頁；課本 P178", "figSpec": {"image": "male"}, "txt": "<ul><li>細精管形成精子，經睪丸內外導管進入副睪。</li><li>副睪後接輸精管；再經射精管將精子與分泌液送入尿道。</li><li>男性尿道是排尿與排精的共同末端通道，不表示兩者通常同時排出。</li><li>輸精管繞近膀胱，並非開口於膀胱內儲存精子。</li></ul><p class=\"think\">「位置靠近」與「腔室相通」，要靠圖中哪種證據區別？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology/pages/27-1-anatomy-and-physiology-of-the-male-reproductive-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>精子的輸送路徑</h4><p>成熟精子經<b>輸精管</b>輸送，途中與附屬腺體的分泌液混合，最後由尿道排出。</p></div><div class=\"ex\"><h4>路線</h4><p>睪丸（細精管）→ 副睪 → 輸精管 → 尿道 → 體外。</p></div>", "tb": []}, {"id": "b3-c61-l07", "t": "三種附屬腺體：精液的來源", "sec": "s1", "slide": 5, "sourceSlides": [5], "sourcePages": [], "src": "原PPT第 5 頁；課本 P178", "figSpec": {"image": "PPT05S3"}, "txt": "<ul><li>儲精囊、攝護腺與尿道球腺的分泌物，參與構成精液。</li><li>精子是細胞；精液則包含精子與液體成分。</li><li>教材強調養分、活動條件及降低陰道酸性環境的影響。</li><li>精液整體的性質不宜直接套到每一種分泌液；比例也不是所有人固定相同。</li></ul><p class=\"think\">只觀察到排出液體，是否就能證明其中一定有精子？</p><div class=\"scope-note\">適用範圍：精液是精子與多種分泌液的混合物；整體弱鹼性不表示每種腺液的酸鹼性、比例與功能完全相同。儲精囊主要分泌液體，不能由名稱推成精子的主要儲藏場所。<a href=\"https://openstax.org/books/anatomy-and-physiology/pages/27-1-anatomy-and-physiology-of-the-male-reproductive-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote source-correction\">適用範圍：精液是精子與多種分泌液的混合物；整體弱鹼性不表示每種腺液的酸鹼性、比例與功能完全相同。儲精囊主要分泌液體，不能由名稱推成精子的主要儲藏場所。<a href=\"https://openstax.org/books/anatomy-and-physiology/pages/27-1-anatomy-and-physiology-of-the-male-reproductive-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a><small>原文閱讀前先看來源補充；原文保留供查對</small></div><div class=\"ex\"><h4>三種附屬腺體</h4><p>儲精囊、攝護腺與尿道球腺分泌的液體與精子混合，形成弱鹼性的<b>精液</b>。</p></div><div class=\"ex\"><h4>功能</h4><ul><li>提供精子養分。</li><li>促進精子活動。</li><li>中和女性陰道的酸性環境，提高精子存活率。</li></ul></div><div class=\"ex\"><h4>小提醒</h4><p>精子只占精液的一部分；多數成分來自附屬腺體。</p></div>", "tb": []}, {"id": "b3-c61-l08", "t": "勃起與射精：不同的作用層次", "sec": "s1", "slide": 6, "sourceSlides": [6], "sourcePages": [], "src": "原PPT第 6 頁；課本 P178", "figSpec": {"image": "PPT06S3"}, "txt": "<ul><li>性興奮時陰莖充血，引發勃起。</li><li>管道與附屬腺體協同作用，將精子和分泌物送往尿道。</li><li>向外排出精液還涉及協同肌肉收縮，並非只靠單一末端管道。</li><li>血液充血與精液沿管道排出，不是同一種流體或同一事件。</li></ul><p class=\"think\">勃起、精液形成與精液排出，如何拆成三個可檢核的步驟？</p><div class=\"scope-note\">機制補充：勃起的血管充血與精液排出是不同過程。射精涉及將精子與腺液送入尿道，以及協同肌肉收縮向外排出；輸精管末端收縮是其中一部分，不能解釋成唯一作用者。<a href=\"https://openstax.org/books/anatomy-and-physiology/pages/27-1-anatomy-and-physiology-of-the-male-reproductive-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote source-correction\">機制補充：勃起的血管充血與精液排出是不同過程。射精涉及將精子與腺液送入尿道，以及協同肌肉收縮向外排出；輸精管末端收縮是其中一部分，不能解釋成唯一作用者。<a href=\"https://openstax.org/books/anatomy-and-physiology/pages/27-1-anatomy-and-physiology-of-the-male-reproductive-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a><small>原文閱讀前先看來源補充；原文保留供查對</small></div><div class=\"ex\"><h4>勃起與射精</h4><p>陰莖是性交器官，兩者是不同的作用。</p></div><div class=\"ex\"><h4>分辨</h4><ul><li><b>勃起</b>：性興奮時陰莖因<b>充血</b>而勃起。</li><li><b>射精</b>：性高潮時輸精管末端的<b>平滑肌收縮</b>，將精液排出體外。</li></ul></div>", "tb": []}, {"id": "b3-c61-l09", "t": "陰囊的位置：構造與環境", "sec": "s1", "slide": 2, "sourceSlides": [2, 6], "sourcePages": [], "src": "原PPT第 2–6 頁；課本 P178", "figSpec": {"image": "male"}, "txt": "<ul><li>圖中睪丸位於陰囊內，位置在腹腔之外。</li><li>一般而言，較核心體溫低的局部環境有利正常精子形成。</li><li>不能只從示意圖讀出每個人的溫度或精子數量。</li><li>陰囊不是分泌精液的附屬腺體，也不是副睪的替代名稱。</li></ul><p class=\"think\">若圖沒有溫度標尺，能否拿它量出固定差幾度？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology/pages/27-1-anatomy-and-physiology-of-the-male-reproductive-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>陰囊</h4><p>人類睪丸位於陰囊內，即位於腹腔外。</p></div><div class=\"ex\"><h4>構造與環境</h4><p>陰囊是包住睪丸的構造，使睪丸處於體外的位置；課本此處著重位置與構造，溫度對精子生成的影響未在此詳述。</p></div>", "tb": []}, {"id": "b3-c61-l10", "t": "女性全景：生殖道與泌尿道", "sec": "s2", "slide": 7, "sourceSlides": [7], "sourcePages": [2], "src": "原PPT第 7 頁；課本 P179", "figSpec": {"image": "female"}, "txt": "<ul><li>卵巢與輸卵管成對；子宮與陰道承擔不同的支持與通道功能。</li><li>子宮頸為子宮下端與陰道相連的部位。</li><li>側面觀看到膀胱、尿道位於生殖道前方，兩者各有開口。</li><li>卵巢、膀胱、子宮三種構造，分屬不同任務，不以顏色代替標示判讀。</li></ul><p class=\"think\">女性尿道與陰道的出口是否能合併成同一條管道？</p><div class=\"ex\"><h4>女性生殖系統</h4><p>主要由<b>卵巢、輸卵管、子宮、陰道</b>組成。</p></div><div class=\"ex\"><h4>讀圖提醒</h4><ul><li>腹面觀與側面觀看同一套構造。</li><li>灰色的膀胱與尿道<b>不屬於生殖系統</b>，生殖道與泌尿道是分開的開口。</li></ul></div>", "tb": [["BOOK2", "P179 完整課本頁"]]}, {"id": "b3-c61-l11", "t": "卵巢中的濾泡：細胞與支持", "sec": "s2", "slide": 8, "sourceSlides": [8, 9], "sourcePages": [], "src": "原PPT第 8–9 頁；課本 P179", "figSpec": {"image": "PPT08S3"}, "txt": "<ul><li>卵巢位於骨盆腔左右各一；其內可見不同發育階段的濾泡。</li><li>初級卵母細胞與周圍的濾泡細胞，身分及功能不同。</li><li>濾泡發育涉及卵母細胞與周圍體細胞的互動，不能只看成單一卵子變大。</li><li>教材以濾泡細胞分泌動情素概括；發育中濾泡的激素產生涉及不同體細胞合作。</li></ul><p class=\"think\">配子前驅細胞與激素分泌細胞，是否一定是同一個細胞？</p><div class=\"scope-note\"><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK278951/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>卵巢與濾泡</h4><p>卵巢位於骨盆腔內，左右各一，內含許多<b>濾泡</b>。</p></div><div class=\"ex\"><h4>濾泡的組成</h4><ul><li>一個<b>初級卵母細胞</b>。</li><li>周圍的<b>濾泡細胞</b>，能分泌<b>動情素</b>。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>濾泡不是卵本身，而是「卵母細胞＋支持細胞」的單位。</p></div>", "tb": []}, {"id": "b3-c61-l12", "t": "出生與青春期：已存在不等於成熟", "sec": "s2", "slide": 9, "sourceSlides": [9], "sourcePages": [], "src": "原PPT第 9 頁；課本 P179", "figSpec": {"image": "PPT09S3"}, "txt": "<ul><li>出生時卵巢已有含初級卵母細胞的濾泡。</li><li>初級卵母細胞長期停留於減數分裂Ⅰ前期。</li><li>青春期後部分濾泡進一步發育；不是出生時每個構造皆有成熟成人功能。</li><li>PPT標註P179、183；本地課本PDF只有P178–179，後續週期細節屬補充參考。</li></ul><p class=\"think\">看到已形成的細胞，為何不能推論已能完成配子釋放？</p><div class=\"scope-note\">機制補充：出生時的初級卵母細胞與排卵的次級卵母細胞不同。人類通常排出停於減數分裂Ⅱ中期的次級卵母細胞，受精相關活化後才完成第二次減數分裂；不把排卵當成已完成全部減數分裂。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK26842/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>時間軸</h4><p>女性<b>出生時</b>，卵巢中的濾泡已大致形成。</p></div><div class=\"ex\"><h4>但是</h4><p>「已形成」不等於「已成熟」。要到<b>青春期</b>開始，濾泡才進入每月的發育週期。</p></div>", "tb": []}, {"id": "b3-c61-l13", "t": "濾泡發育與排卵：通常一個，並非固定", "sec": "s2", "slide": 10, "sourceSlides": [10], "sourcePages": [], "src": "原PPT第 10 頁；課本 P179", "figSpec": {"image": "PPT10S3"}, "txt": "<ul><li>教材描述一群濾泡開始發育，通常有一個成為排卵的優勢濾泡。</li><li>通常不等於每次一定一個，也不表示左右卵巢嚴格輪流。</li><li>排卵後，剩餘濾泡組織可形成黃體；它不是排出的卵母細胞。</li><li>濾泡發育、優勢選擇與排卵三件事，不能合併成「每月全部成熟」。</li></ul><p class=\"think\">有濾泡正在長大，是否已足以證明即將排卵？</p><div class=\"scope-note\">來源校正：PPT14「等黃體萎縮後才會再開始」是週期的簡化，不宜推成黃體期所有濾泡完全停止發育。人類縱向超音波研究觀察到一週期內可有多波濾泡發育；發育、成為優勢濾泡與排卵不同。原第1題答案C保留；B的「開始再次發育成熟」用語亦有歧義，改作來源判讀不自動評分。<a href=\"https://pubmed.ncbi.nlm.nih.gov/12849812/\" target=\"_blank\" rel=\"noopener noreferrer\">人類濾泡波研究</a></div><div class=\"quote source-correction\">來源校正：PPT14「等黃體萎縮後才會再開始」是週期的簡化，不宜推成黃體期所有濾泡完全停止發育。人類縱向超音波研究觀察到一週期內可有多波濾泡發育；發育、成為優勢濾泡與排卵不同。原第1題答案C保留；B的「開始再次發育成熟」用語亦有歧義，改作來源判讀不自動評分。<a href=\"https://pubmed.ncbi.nlm.nih.gov/12849812/\" target=\"_blank\" rel=\"noopener noreferrer\">人類濾泡波研究</a><small>原文閱讀前先看來源補充；原文保留供查對</small></div><div class=\"ex\"><h4>每月的濾泡發育</h4><p>自青春期起，每個月左、右卵巢會同時有十幾個濾泡發育。</p></div><div class=\"ex\"><h4>結果</h4><ul><li>通常僅有<b>一個優勢濾泡</b>完成成熟並排卵。</li><li>排卵後，濾泡形成<b>黃體</b>。</li><li>黃體萎縮後，才會開始下一次週期。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>「通常」一個，並非固定；其餘濾泡不會成熟排卵。</p></div>", "tb": []}, {"id": "b3-c61-l14", "t": "排出的細胞：減數分裂尚未全部完成", "sec": "s2", "slide": 10, "sourceSlides": [10, 14], "sourcePages": [], "src": "原PPT第 10–14 頁；課本 P179", "figSpec": {"image": "PPT10S3"}, "txt": "<ul><li>人類通常排出次級卵母細胞，不是初級卵母細胞。</li><li>次級卵母細胞為單倍體，但染色體仍各有兩條姐妹染色分體。</li><li>其通常停在減數分裂Ⅱ中期；受精相關活化才完成後續分裂。</li><li>染色體套數與DNA含量不同；「單倍體」不等於已完成所有分裂。</li></ul><p class=\"think\">若卵母細胞已是單倍體，還有哪一種分離尚未完成？</p><div class=\"scope-note\">機制補充：出生時的初級卵母細胞與排卵的次級卵母細胞不同。人類通常排出停於減數分裂Ⅱ中期的次級卵母細胞，受精相關活化後才完成第二次減數分裂；不把排卵當成已完成全部減數分裂。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK26842/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote source-correction\">機制補充：出生時的初級卵母細胞與排卵的次級卵母細胞不同。人類通常排出停於減數分裂Ⅱ中期的次級卵母細胞，受精相關活化後才完成第二次減數分裂；不把排卵當成已完成全部減數分裂。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK26842/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a><small>原文閱讀前先看來源補充；原文保留供查對</small></div><div class=\"ex\"><h4>排出的是什麼</h4><p>排卵時排出的不是完成減數分裂的卵，而是<b>次級卵母細胞</b>。</p></div><div class=\"ex\"><h4>延伸</h4><p>減數分裂尚未全部完成；細節在 6-2、6-3 說明（受精後才完成）。</p></div>", "tb": []}, {"id": "b3-c61-l15", "t": "輸卵管：接取與輸送", "sec": "s2", "slide": 11, "sourceSlides": [11], "sourcePages": [], "src": "原PPT第 11 頁；課本 P179", "figSpec": {"image": "PPT11S3"}, "txt": "<ul><li>排卵後的卵母細胞可由輸卵管漏斗部附近接取。</li><li>漏斗部與卵巢鄰近，但不是與卵巢緊密封閉相通。</li><li>原教材強調上皮纖毛擺動；管壁肌肉等亦參與輸送。</li><li>纖毛、卵母細胞與精子不是同一作用者，需看清流向與移動條件。</li></ul><p class=\"think\">如果只知道纖毛在動，還缺哪種資料才能評估輸送效果？</p><div class=\"scope-note\">適用範圍：輸卵管漏斗部鄰近卵巢，並非與卵巢封閉相接的管道。原圖突出纖毛作用，實際輸送亦涉及管壁平滑肌等因素；一般受精部位為輸卵管壺腹，胚胎著床部位通常為子宮內膜。<a href=\"https://openstax.org/books/anatomy-and-physiology/pages/27-2-anatomy-and-physiology-of-the-female-reproductive-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote source-correction\">適用範圍：輸卵管漏斗部鄰近卵巢，並非與卵巢封閉相接的管道。原圖突出纖毛作用，實際輸送亦涉及管壁平滑肌等因素；一般受精部位為輸卵管壺腹，胚胎著床部位通常為子宮內膜。<a href=\"https://openstax.org/books/anatomy-and-physiology/pages/27-2-anatomy-and-physiology-of-the-female-reproductive-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a><small>原文閱讀前先看來源補充；原文保留供查對</small></div><div class=\"ex\"><h4>輸卵管</h4><p>排出的次級卵母細胞在輸卵管上皮細胞的<b>纖毛擺動</b>下，經末端的<b>喇叭狀開口</b>進入輸卵管。</p></div><div class=\"ex\"><h4>受精地點</h4><p>若遇到精子，<b>通常在輸卵管中</b>完成受精作用。</p></div>", "tb": []}, {"id": "b3-c61-l16", "t": "受精與著床：不同的時間與地點", "sec": "s2", "slide": 11, "sourceSlides": [11, 12], "sourcePages": [], "src": "原PPT第 11–12 頁；課本 P179", "figSpec": {"image": "female"}, "txt": "<ul><li>受精通常在輸卵管發生，常以壺腹部為典型部位。</li><li>受精後早期胚胎一邊卵裂，一邊朝子宮移動。</li><li>胚胎發育至囊胚後通常在子宮內膜著床。</li><li>卵巢排卵、配子結合與胚胎著床是三件事，不互為同義詞。</li></ul><p class=\"think\">若把子宮的著床功能改寫成通常受精場所，哪一段路徑會出錯？</p><div class=\"scope-note\">適用範圍：輸卵管漏斗部鄰近卵巢，並非與卵巢封閉相接的管道。原圖突出纖毛作用，實際輸送亦涉及管壁平滑肌等因素；一般受精部位為輸卵管壺腹，胚胎著床部位通常為子宮內膜。<a href=\"https://openstax.org/books/anatomy-and-physiology/pages/27-2-anatomy-and-physiology-of-the-female-reproductive-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>受精與著床</h4><p>兩件事的時間與地點不同。</p></div><div class=\"ex\"><h4>比較</h4><ul><li><b>受精</b>：通常在輸卵管。</li><li><b>著床</b>：囊胚在子宮內膜，之後在子宮發育。</li></ul></div>", "tb": []}, {"id": "b3-c61-l17", "t": "子宮壁：肌肉與內膜的分工", "sec": "s2", "slide": 12, "sourceSlides": [12], "sourcePages": [], "src": "原PPT第 12 頁；課本 P179", "figSpec": {"image": "PPT12S3"}, "txt": "<ul><li>子宮含平滑肌，內側為子宮內膜。</li><li>內膜為通常著床與支持胚胎發育的部位，隨生殖週期改變。</li><li>子宮肌層的收縮與內膜的支持功能不同。</li><li>子宮下端的子宮頸接向陰道，陰道是性交及出生時的通道。</li></ul><p class=\"think\">同在子宮壁的兩層構造，是否能交換成同一種功能？</p><div class=\"ex\"><h4>子宮</h4><p>主要由<b>平滑肌</b>與<b>子宮內膜</b>構成。</p></div><div class=\"ex\"><h4>分工</h4><ul><li>子宮內膜：囊胚著床與胚胎發育之處。</li><li>平滑肌：構成子宮壁。</li><li>子宮下方為<b>子宮頸</b>，與陰道相連。</li></ul></div><div class=\"ex\"><h4>陰道</h4><p>性交時容納陰莖的通道，也是分娩時胎兒娩出的<b>產道</b>。</p></div>", "tb": []}, {"id": "b3-c61-l18", "t": "兩性比較：功能相近不等於構造相同", "sec": "s3", "slide": 2, "sourceSlides": [2, 7, 15], "sourcePages": [], "src": "原PPT第 2–15 頁；課本 P178–179", "figSpec": {"pair": ["male", "female"]}, "txt": "<ul><li>睪丸與卵巢同為生殖腺，具有配子與性激素相關功能。</li><li>細精管與濾泡都有配子發育相關作用，但構造與細胞階段不同。</li><li>間質細胞與發育濾泡的體細胞可比較激素分泌角色。</li><li>儲精囊分泌精液成分，子宮支持著床與胚胎發育，功能並不對等。</li></ul><p class=\"think\">比較功能、位置與發育來源，是否是在回答同一個問題？</p><div class=\"scope-note\">比較範圍：原題比較功能，並非宣稱構造完全相同或逐項具有發育同源性。儲精囊分泌的是精液的一部分，不是獨自產生整份精液。<a href=\"https://openstax.org/books/anatomy-and-physiology/pages/27-1-anatomy-and-physiology-of-the-male-reproductive-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>兩性比較</h4><p>功能相近不等於構造相同。</p></div><div class=\"ex\"><h4>對應</h4><ul><li>睪丸 ↔ 卵巢：都是生殖腺，產生配子並分泌性激素。</li><li>細精管 ↔ 濾泡：與配子生成相關，但構造不同。</li><li>間質細胞 ↔ 濾泡細胞：都分泌性激素。</li><li>儲精囊 ↔ 子宮：<b>功能不對等</b>：一個分泌精液，一個供胚胎發育。</li></ul></div>", "tb": []}, {"id": "b3-c61-l19", "t": "原題一：每個選項的限定詞", "sec": "s4", "slide": 13, "sourceSlides": [13, 14], "sourcePages": [], "src": "原PPT第 13–14 頁；課本 P178–179／原題", "figSpec": {"image": "PPT13S3"}, "txt": "<ul><li>原第1題答案C：副睪成熟暫存，附屬腺分泌物混合成精液。</li><li>A把所有構造成對與出生即成熟合併，均過度概括。</li><li>B的「開始再次發育成熟」未明定細胞群與觀察時點，不宜改讀成立即全部成熟；原解析以黃體萎縮為發育門檻亦需限定。</li><li>D混淆初級與次級卵母細胞，並把排卵誤當成減數分裂全部完成。</li></ul><p class=\"think\">哪個選項錯在細胞身分，哪個錯在把通常現象寫成必然？</p><div class=\"scope-note\">來源校正：PPT14「等黃體萎縮後才會再開始」是週期的簡化，不宜推成黃體期所有濾泡完全停止發育。人類縱向超音波研究觀察到一週期內可有多波濾泡發育；發育、成為優勢濾泡與排卵不同。原第1題答案C保留；B的「開始再次發育成熟」用語亦有歧義，改作來源判讀不自動評分。<a href=\"https://pubmed.ncbi.nlm.nih.gov/12849812/\" target=\"_blank\" rel=\"noopener noreferrer\">人類濾泡波研究</a>；機制補充：出生時的初級卵母細胞與排卵的次級卵母細胞不同。人類通常排出停於減數分裂Ⅱ中期的次級卵母細胞，受精相關活化後才完成第二次減數分裂；不把排卵當成已完成全部減數分裂。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK26842/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote source-correction\">來源校正：PPT14「等黃體萎縮後才會再開始」是週期的簡化，不宜推成黃體期所有濾泡完全停止發育。人類縱向超音波研究觀察到一週期內可有多波濾泡發育；發育、成為優勢濾泡與排卵不同。原第1題答案C保留；B的「開始再次發育成熟」用語亦有歧義，改作來源判讀不自動評分。<a href=\"https://pubmed.ncbi.nlm.nih.gov/12849812/\" target=\"_blank\" rel=\"noopener noreferrer\">人類濾泡波研究</a>；機制補充：出生時的初級卵母細胞與排卵的次級卵母細胞不同。人類通常排出停於減數分裂Ⅱ中期的次級卵母細胞，受精相關活化後才完成第二次減數分裂；不把排卵當成已完成全部減數分裂。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK26842/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a><small>原文閱讀前先看來源補充；原文保留供查對</small></div><div class=\"ex\"><h4>原題一</h4><p>答案 <b>(C)</b>：精子在副睪暫存並成熟，之後與儲精囊、攝護腺及尿道球腺的分泌物混合成精液。</p></div><div class=\"ex\"><h4>逐項</h4><ul><li>(A) 並非全部成對（如攝護腺、子宮）；出生時也未全部成熟。</li><li>(B) 排卵後濾泡形成黃體，黃體萎縮後才開始下一週期。</li><li>(C) 正確。</li><li>(D) 濾泡由濾泡細胞與<b>初級卵母細胞</b>組成；排出的是次級卵母細胞。</li></ul></div>", "tb": []}, {"id": "b3-c61-l20", "t": "原題二：先界定比較的功能", "sec": "s4", "slide": 15, "sourceSlides": [15], "sourcePages": [], "src": "原PPT第 15 頁；課本 P178–179／原題", "figSpec": {"image": "PPT15S3"}, "txt": "<ul><li>原第2題答案B：儲精囊與子宮功能最不對等。</li><li>A比較生殖腺；C比較激素分泌相關細胞；D比較配子發育構造。</li><li>功能相近不表示相同的組織構造、染色體狀態或發育來源。</li><li>原解析「儲精囊分泌精液」需讀成分泌精液的一部分。</li></ul><p class=\"think\">對等是針對哪一項功能？若換成組織形態，會得到相同結論嗎？</p><div class=\"scope-note\">比較範圍：原題比較功能，並非宣稱構造完全相同或逐項具有發育同源性。儲精囊分泌的是精液的一部分，不是獨自產生整份精液。<a href=\"https://openstax.org/books/anatomy-and-physiology/pages/27-1-anatomy-and-physiology-of-the-male-reproductive-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote source-correction\">比較範圍：原題比較功能，並非宣稱構造完全相同或逐項具有發育同源性。儲精囊分泌的是精液的一部分，不是獨自產生整份精液。<a href=\"https://openstax.org/books/anatomy-and-physiology/pages/27-1-anatomy-and-physiology-of-the-male-reproductive-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a><small>原文閱讀前先看來源補充；原文保留供查對</small></div><div class=\"ex\"><h4>原題二</h4><p>先界定要比較的是「功能」。答案 <b>(B)</b>。</p></div><div class=\"ex\"><h4>逐項</h4><ul><li>(A) 睪丸與卵巢皆為生殖器官。</li><li>(B) 儲精囊分泌精液；子宮是胚胎發育處，功能最不對等。</li><li>(C) 間質細胞與濾泡細胞皆分泌性激素。</li><li>(D) 細精管產生精子；濾泡內有發育中的卵母細胞。</li></ul></div>", "tb": []}], "questions": [{"t": "男性構造的三種角色", "q": "將構造與功能分類，每類兩張。", "learn": 2, "tag": "male", "hint": "先分清細胞在哪裡形成，在哪裡移動。", "why": "精子生成、運輸與分泌液來源不同。", "sub": "原PPT第 3 頁；課本 P178", "refs": [{"src": "PPT03S3", "cap": "教材來源圖"}], "legacyQuestion": 1, "kind": "drag", "slots": [{"id": "g0s0", "label": "配子形成與成熟", "group": 0}, {"id": "g0s1", "label": "配子形成與成熟", "group": 0}, {"id": "g1s0", "label": "輸送與出口", "group": 1}, {"id" /", "waves": "https://pubmed.ncbi.nlm.nih.gov/12849812/", "ovary": "https://www.ncbi.nlm.nih.gov/books/NBK278951/"}, "sourceCorrections": [{"pages": [178], "ppt": [4], "note": "機制補充：減數分裂形成精細胞，之後經形態分化成精子；不能把兩個過程視為同一事件。支持細胞留在細精管上皮，並不脫離變成精子。<a href=\"https://openstax.org/books/anatomy-and-physiology/pages/27-1-anatomy-and-physiology-of-the-male-reproductive-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>"}, {"pages": [178], "ppt": [5], "note": "來源補充：副睪中的成熟使精子逐步具備運動等功能，但不代表受精的全部準備已完成；射出後通常仍需在女性生殖道經歷「獲能」，適當體外條件亦可誘發。原文「獲得受精能力」需加此範圍。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK26843/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>；適用範圍：精液是精子與多種分泌液的混合物；整體弱鹼性不表示每種腺液的酸鹼性、比例與功能完全相同。儲精囊主要分泌液體，不能由名稱推成精子的主要儲藏場所。<a href=\"https://openstax.org/books/anatomy-and-physiology/pages/27-1-anatomy-and-physiology-of-the-male-reproductive-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>"}, {"pages": [178], "ppt": [6], "note": "機制補充：勃起的血管充血與精液排出是不同過程。射精涉及將精子與腺液送入尿道，以及協同肌肉收縮向外排出；輸精管末端收縮是其中一部分，不能解釋成唯一作用者。<a href=\"https://openstax.org/books/anatomy-and-physiology/pages/27-1-anatomy-and-physiology-of-the-male-reproductive-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>"}, {"pages": [179], "ppt": [9, 10], "note": "機制補充：出生時的初級卵母細胞與排卵的次級卵母細胞不同。人類通常排出停於減數分裂Ⅱ中期的次級卵母細胞，受精相關活化後才完成第二次減數分裂；不把排卵當成已完成全部減數分裂。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK26842/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>"}, {"pages": [179], "ppt": [11], "note": "適用範圍：輸卵管漏斗部鄰近卵巢，並非與卵巢封閉相接的管道。原圖突出纖毛作用，實際輸送亦涉及管壁平滑肌等因素；一般受精部位為輸卵管壺腹，胚胎著床部位通常為子宮內膜。<a href=\"https://openstax.org/books/anatomy-and-physiology/pages/27-2-anatomy-and-physiology-of-the-female-reproductive-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>"}, {"pages": [179], "ppt": [14], "note": "來源校正：PPT14「等黃體萎縮後才會再開始」是週期的簡化，不宜推成黃體期所有濾泡完全停止發育。人類縱向超音波研究觀察到一週期內可有多波濾泡發育；發育、成為優勢濾泡與排卵不同。原第1題答案C保留；B的「開始再次發育成熟」用語亦有歧義，改作來源判讀不自動評分。<a href=\"https://pubmed.ncbi.nlm.nih.gov/12849812/\" target=\"_blank\" rel=\"noopener noreferrer\">人類濾泡波研究</a>；機制補充：出生時的初級卵母細胞與排卵的次級卵母細胞不同。人類通常排出停於減數分裂Ⅱ中期的次級卵母細胞，受精相關活化後才完成第二次減數分裂；不把排卵當成已完成全部減數分裂。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK26842/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>"}, {"pages": [178, 179], "ppt": [15], "note": "比較範圍：原題比較功能，並非宣稱構造完全相同或逐項具有發育同源性。儲精囊分泌的是精液的一部分，不是獨自產生整份精液。<a href=\"https://openstax.org/books/anatomy-and-physiology/pages/27-1-anatomy-and-physiology-of-the-male-reproductive-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>"}]};

  if(best<length){const s=node.textContent.slice(from,best),breakAt=Math.max(s.lastIndexOf('。'),s.lastIndexOf('；'),s.lastIndexOf('，'));if(breakAt>Math.max(20,s.length*.55))best=from+breakAt+1;}
  parts.push(fragment(from,best));from=best;

}
function paginateReading(){
 if(!READING)return;const i=READING.tab,g=READING.groups[i];if(g.notes)return;const pane=el('reading-pane-'+i),body=pane.querySelector('.reading-body'),pager=pane.querySelector('.reading-pager');pager.hidden=false;
 const key=[i,body.clientWidth,body.clientHeight,ST.font,innerWidth>900].join(':');if(READING.cache===key){renderReading();return;}
 const pages=[[]];body.replaceChildren();
 if(innerWidth<=900){pages[0]=g.nodes.map(x=>x.cloneNode(true));}
 else for(const original of g.nodes){let node=original.cloneNode(true);body.append(node);if(body.scrollHeight<=body.clientHeight+1){pages.at(-1).push(node);continue;}node.remove();if(pages.at(-1).length){pages.push([]);body.replaceChildren();}body.append(node);if(body.scrollHeight<=body.clientHeight+1){pages.at(-1).push(node);continue;}
  body.replaceChildren();const parts=splitBlock(original,body);for(const part of parts){if(pages.at(-1).length)pages.push([]);pages.at(-1).push(part);}body.replaceChildren(...pages.at(-1));
 }
 READING.pages[i]=pages;READING.cache=key;READING.indices[i]=Math.min(READING.indices[i],pages.length-1);renderReading();
}
function renderReading(){if(!READING)return;const i=READING.tab,pages=READING.pages[i];if(!pages)return;const pane=el('reading-pane-'+i),j=READING.indices[i];pane.querySelector('.reading-body').replaceChildren(...pages[j].map(x=>x.cloneNode(true)));const pager=pane.querySelector('.reading-pager');pager.hidden=pages.length<2;pager.querySelector('span').textContent=`${j+1} / ${pages.length} 頁`;const b=pager.querySelectorAll('button');b[0].disabled=j===0;b[1].disabled=j===pages.length-1;bindZoom(pane);}
function fitLessonTable(){if(!tableState)return;const {table,rows,pager}=tableState,canvas=table.closest('.figure-canvas');rows.forEach(r=>r.hidden=false);if(innerWidth<=900){tableState.count=rows.length;tableState.index=0;}else{const head=table.rows[0].getBoundingClientRect().height,room=canvas.clientHeight-head-2;let height=0,count=0;for(const row of rows){const h=row.getBoundingClientRect().height;if(height+h>room&&count)break;height+=h;count++;}tableState.count=Math.max(1,count);tableState.index=Math.max(0,Math.min(Math.ceil(rows.length/tableState.count)-1,tableState.index));}

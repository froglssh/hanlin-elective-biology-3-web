const CONTENT={"lessons": [{"id": "b3-c22-l01", "t": "一餐的旅程：消化、吸收、運輸", "sec": "s1", "slide": 1, "sourceSlides": [1, 2, 3], "sourcePages": [1], "src": "原PPT第 1–3 頁；課本 P45–46", "figSpec": {"image": "PPT08S3"}, "txt": "<ul><li>消化把食物加工成可吸收的形式；吸收是跨越腸道上皮進入體內。</li><li>多醣、蛋白質與核酸等須經水解；水、無機鹽及多數維生素不需先被消化。</li><li>脂質的水解、分散與包裝是不同步驟；吸收後仍需運輸到其他組織。</li></ul><p class=\"think\">食物已進到胃裡，等於養分已進入血液嗎？</p><div class=\"ex\"><h4>為什麼要吃東西</h4><p>生物體由多種有機物組成。動物必須藉由<b>攝食</b>取得合成有機物的原料；食物經消化系統消化、吸收後，再由循環系統運送到全身利用。</p></div><div class=\"ex\"><h4>什麼是消化</h4><p>消化是指食物中的<b>大分子分解為小分子</b>的過程。水、礦物質和大部分維生素本來就是小分子，可以直接吸收；多醣類、脂質、蛋白質、核酸是大分子，必須先分解才能被細胞吸收。</p></div><div class=\"ex\"><h4>本節兩大問題</h4><ul><li>2-2.1 人體的消化構造與食物的消化</li><li>2-2.2 養分的吸收與運輸：吸收的養分如何在體內運輸？</li></ul></div><div class=\"ex\"><h4>深入解說：一口食物的四個步驟</h4><p>從吃下食物到細胞利用，可以拆成四步：<b>①攝食</b>（把食物放進口）→ <b>②消化</b>（大分子水解成小分子）→ <b>③吸收</b>（小分子穿過小腸上皮進入體內）→ <b>④運輸與利用</b>（由血液、淋巴送到各組織細胞）。「食物進了胃」只是在消化道內，消化道的管腔相當於體外環境，只有養分被吸收、跨過上皮進入組織液與血液後，才算真正進入「體內」。</p></div><div class=\"ex\"><h4>什麼要消化、什麼不必</h4><ul><li><b>必須消化</b>：多醣（澱粉）、蛋白質、脂質（三酸甘油酯）、核酸——分子太大，無法通過細胞膜。</li><li><b>不必消化</b>：水、無機鹽、單醣（葡萄糖、果糖）、胺基酸、大部分維生素——本來就是小分子。</li><li>消化靠<b>水解</b>：加入水分子，把大分子的化學鍵切開（見酵素總表）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>食物已進到胃裡，等於養分已進入血液嗎？</p><p><b>答：</b>不等於。食物還在消化道內，要先消化成小分子，再被小腸吸收才進入血液。</p></div>", "tb": [["BOOK1", "P45 完整課本頁"]]}, {"id": "b3-c22-l02", "t": "乳化與水解：顆粒小不等於分子小", "sec": "s1", "slide": 4, "sourceSlides": [4, 5], "sourcePages": [], "src": "原PPT第 4–5 頁；課本 P45–46", "figSpec": {"image": "PPT05S3"}, "txt": "<ul><li>研磨、攪拌與乳化增加接觸面積，屬物理性作用。</li><li>膽鹽把大油滴分散為小油滴，不切開三酸甘油酯的化學鍵。</li><li>胰脂酶主要產生單酸甘油酯及脂肪酸；與乳化作用分工。</li></ul><p class=\"think\">把油滴變小後，是否就已完成脂質的化學性消化？</p><div class=\"scope-note\">原PPT5以甘油與脂肪酸概括脂質水解；主要胰脂酶產物應配合PPT33的單酸甘油酯與脂肪酸理解。</div><div class=\"ex\"><h4>消化的兩種類型</h4><p>消化可分為<b>物理性消化</b>與<b>化學性消化</b>。</p></div><div class=\"ex\"><h4>物理性消化</h4><ul><li>食物經過蠕動推進，並被研磨、攪拌、乳化等物理作用。</li><li>使食物顆粒變小，增加與消化液接觸的面積。</li><li>例如膽鹽把大油滴乳化成小油滴，但油滴的成分（三酸甘油酯）並沒有改變。</li></ul></div><div class=\"ex\"><h4>化學性消化</h4><ul><li>消化酶把大分子分解為小分子養分。</li><li>例如脂肪酶把三酸甘油酯分解為甘油與脂肪酸。</li></ul></div><div class=\"ex\"><h4>重點</h4><p>「顆粒變小」不等於「分子變小」：乳化只是物理性消化，水解才是化學性消化。</p></div><div class=\"ex\"><h4>深入解說：脂質為什麼需要「乳化」</h4><p>三酸甘油酯不溶於水，在腸內以大油滴的形式存在，只有油滴的表面能與水溶性的胰脂酶接觸。<b>膽鹽</b>的分子一端親水、一端親脂，會附著在油滴表面，把大油滴分散成許多極小的油滴（乳糜微粒前的微小顆粒），總表面積大增，酵素就能更有效地作用。就像洗碗精把油污分散在水中。乳化沒有切斷化學鍵，三酸甘油酯仍然是三酸甘油酯，所以只是<b>物理性消化</b>。</p></div><div class=\"ex\"><h4>兩個步驟，分工明確</h4><ul><li><b>膽鹽（膽汁）</b>：增加表面積，物理性。</li><li><b>胰脂酶</b>：把三酸甘油酯水解為單酸甘油酯與脂肪酸，化學性。</li><li>兩者缺一，脂肪消化效率都會大減；膽鹽不足會導致脂肪便。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>把油滴變小後，是否就已完成脂質的化學性消化？</p><p><b>答：</b>還沒有。油滴變小只是增加接觸面積；要靠脂酶水解化學鍵，才改變分子本身。</p></div>", "tb": []}, {"id": "b3-c22-l03", "t": "囊狀與管狀：比較開口和分工", "sec": "s1", "slide": 6, "sourceSlides": [6], "sourcePages": [], "src": "原PPT第 6 頁；課本 P45–46", "figSpec": {"image": "cavity"}, "txt": "<ul><li>水螅的囊狀消化腔只有一個開口，兼具攝食與殘渣排出功能。</li><li>蚯蚓的管狀消化道由口至肛門，可分段處理食物。</li><li>構造與食性、生活方式相關，不用單一高低等階梯描述演化。</li></ul><p class=\"think\">有兩個開口，會如何改變攝食與各區分工？</p><div class=\"scope-note\">水螅的開口稱口，不能將其描述為另有一個真正肛門。<a href=\"https://openstax.org/books/biology-2e/pages/34-1-digestive-systems\" target=\"_blank\" rel=\"noopener noreferrer\">動物消化構造參考</a></div><div class=\"ex\"><h4>不同動物的消化構造</h4><p>因體型大小與攝食方式不同，消化構造差異很大（知識補給站）。</p></div><div class=\"ex\"><h4>兩個例子</h4><ul><li><b>水螅</b>：消化腔呈囊袋狀，只有<b>一個開口</b>（食物與廢物同一個口進出）。</li><li><b>蚯蚓</b>：消化道呈管狀，<b>頭、尾兩端各有一個開口</b>，由口、咽、食道、嗉囊、砂囊、腸到肛門，分段分工。</li></ul></div><div class=\"ex\"><h4>比較重點</h4><p>看<b>開口數目</b>，以及是否有分段構造。管狀消化道讓食物單向前進，各段可以分工。</p></div><div class=\"ex\"><h4>深入解說：單口與雙口的差別</h4><p>只有一個開口的消化腔（水螅）必須「同一個口進、同一個口出」，攝食與排遺不能同時進行，每個區域也很難專職分工。有兩個開口的管狀消化道，食物<b>單向前進</b>，口端不斷攝食，肛門端不斷排遺，中間的各段可以像生產線一樣依序專門化——咀嚼、儲存、研磨、消化、吸收、水分回收，效率大幅提高。</p></div><div class=\"ex\"><h4>蚯蚓消化道的分工</h4><ul><li><b>口、咽</b>：攝食、吸入食物。</li><li><b>食道</b>：運送。</li><li><b>嗉囊</b>：暫時儲存食物。</li><li><b>砂囊</b>：吞入的砂粒磨碎食物（類似牙齒）。</li><li><b>腸</b>：消化與吸收。</li><li><b>肛門</b>：排出殘渣。</li></ul></div><div class=\"ex\"><h4>補充</h4><p>水螅的囊狀構造稱「消化循環腔」，開口就是口，不是另有肛門；這類比較要用「構造與食性、生活方式適應」，而不是排成高低階梯。</p></div>", "tb": []}, {"id": "b3-c22-l04", "t": "消化道與消化腺：兩種路徑", "sec": "s1", "slide": 7, "sourceSlides": [7, 8], "sourcePages": [], "src": "原PPT第 7–8 頁；課本 P45–46", "figSpec": {"image": "PPT08S3"}, "txt": "<ul><li>食物依序經口腔、咽、食道、胃、小腸、大腸，再由肛門排出。</li><li>消化腺製造分泌物；肝、胰等的分泌物經導管進入消化道。</li><li>食物不會依序穿過肝臟、胰臟或膽囊；養分吸收後才由體液運輸。</li></ul><p class=\"think\">畫出「食物走的線」與「消化液走的線」，兩者在哪裡會合？</p><div class=\"ex\"><h4>兩個組成</h4><p>人體的消化系統包括<b>消化道</b>與<b>消化腺</b>。</p></div><div class=\"ex\"><h4>分工</h4><ul><li><b>消化道</b>：食物在人體中移動的通道。</li><li><b>消化腺</b>：分泌消化液，把食物消化到可讓細胞吸收的程度。</li></ul></div><div class=\"ex\"><h4>消化道的順序與功能</h4><p>口腔 → 咽 → 食道 → 胃 → 小腸 → 大腸 → 肛門。主要功能包括<b>碾細、拌合、推送食物及吸收養分</b>。</p></div><div class=\"ex\"><h4>深入解說：消化道與消化腺的區別</h4><p><b>消化道</b>是一條連續的管子，食物真的走過去；<b>消化腺</b>則是「旁邊的工廠」，分泌消化液透過導管送進消化道。唾腺、肝臟、胰臟、膽囊雖然與消化有關，但<b>食物不會經過它們</b>。胃腺、小腸腺則位於消化道的管壁內（黏膜層），分泌物直接進入管腔。</p></div><div class=\"ex\"><h4>兩條路線</h4><ul><li><b>食物路線</b>：口腔 → 咽 → 食道 → 胃 → 小腸（十二指腸 → 空腸 → 迴腸）→ 大腸 → 肛門。</li><li><b>消化液路線</b>：唾腺 → 口腔；胃腺 → 胃；肝（經膽囊）、胰 → 十二指腸；小腸腺 → 小腸。</li><li>兩條路線在<b>消化道的管腔</b>中會合，消化液與食物混合。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>食物會依序穿過肝臟、胰臟、膽囊嗎？</p><p><b>答：</b>不會。它們是消化腺，只有分泌物（膽汁、胰液）經導管進入十二指腸；食物始終在消化道內。</p></div>", "tb": []}, {"id": "b3-c22-l05", "t": "四層管壁：位置支持功能", "sec": "s1", "slide": 9, "sourceSlides": [9], "sourcePages": [2], "src": "原PPT第 9 頁；課本 P45–46", "figSpec": {"image": "layers"}, "txt": "<ul><li>由內而外為黏膜、黏膜下層、肌肉層及漿膜的教材模型。</li><li>黏膜參與分泌、保護及吸收；黏膜下層含血管、淋巴管與神經。</li><li>肌肉層一般含環肌與縱肌；胃另有斜行肌，部位間構造不同。</li></ul><p class=\"think\">吸收面、運輸管與推送肌肉各位於哪一層？</p><div class=\"scope-note\">這是典型胃腸管壁模型；黏膜不只有上皮，食道部分肌肉為骨骼肌，部分消化道外層為外膜。不能把「全部都是平滑肌」套到每一部位。</div><div class=\"ex\"><h4>消化道管壁由內而外有四層（圖 2－14）</h4><p>黏膜層、黏膜下層、肌肉層、漿膜層。</p></div><div class=\"ex\"><h4>各層的特色</h4><ul><li><b>黏膜層</b>：最內層，為上皮組織；養分吸收的部位；有腺體，分泌黏液與消化液。</li><li><b>黏膜下層</b>：含血管、神經和淋巴管。</li><li><b>肌肉層</b>：平滑肌，不同部位厚度不同，一般都含<b>縱肌與環肌</b>。</li><li><b>漿膜層</b>：最外層，為結締組織。</li></ul></div><div class=\"ex\"><h4>小結</h4><p>肌肉層的收縮與舒張交替進行，推動食物前進。</p></div><div class=\"ex\"><h4>深入解說：由內而外，各層的任務</h4><p><b>黏膜層</b>是和食物直接接觸的一層，上皮負責保護與吸收，腺體分泌黏液與消化液；<b>黏膜下層</b>含較大的血管、淋巴管和神經，是「運輸管線」，把吸收的養分帶走；<b>肌肉層</b>由內環肌、外縱肌兩層平滑肌組成，交替收縮推動食物；<b>漿膜層</b>是最外層薄薄的結締組織與上皮，保護消化道並減少與周圍器官的摩擦。</p></div><div class=\"ex\"><h4>與第 1-1 節的連結</h4><ul><li>整條消化道壁就是一個「<b>四類組織合作</b>」的好例子：上皮（黏膜）、結締（黏膜下層、漿膜）、肌肉（肌肉層）、神經（腸壁內的神經叢）。</li><li>小腸壁的結構與胃壁相似，只是黏膜形成絨毛，增加吸收面積。</li></ul></div><div class=\"ex\"><h4>範圍提醒</h4><p>這是胃腸道的典型模型：食道上段的肌肉是骨骼肌（所以吞嚥的開始是隨意的），胃多一層斜行肌，部分消化道的最外層是外膜而不是漿膜；不要把「全部都是平滑肌」套用到每個部位。</p></div>", "tb": [["BOOK2", "P46 完整課本頁"]]}, {"id": "b3-c22-l06", "t": "口腔：形成可吞嚥的食團", "sec": "s2", "slide": 10, "sourceSlides": [10], "sourcePages": [], "src": "原PPT第 10 頁；課本 P46–48", "figSpec": {"image": "PPT10S3"}, "txt": "<ul><li>牙齒切細、磨碎食物；舌協助與唾液拌合。</li><li>食團經吞嚥進入食道；吞嚥與蠕動是相關但不同的動作。</li><li>澱粉的初步化學性消化從口腔即可開始，不是從胃才開始。</li></ul><p class=\"think\">嚼碎食物和唾液澱粉酶作用，各改變哪個尺度？</p><div class=\"ex\"><h4>口腔的工作</h4><p>口腔內有牙齒、舌與唾液。</p></div><div class=\"ex\"><h4>分工</h4><ul><li><b>齒</b>：切細、磨碎食物（物理性消化）。</li><li><b>舌</b>：把嚼細的食物與唾液拌合，使食物成為滑潤的<b>食團</b>，利於吞嚥。</li><li>唾液中含澱粉酶，開始分解澱粉（化學性消化）。</li></ul></div><div class=\"ex\"><h4>下一步</h4><p>濕潤的食團經吞嚥送入食道。</p></div><div class=\"ex\"><h4>深入解說：口腔裡同時發生三件事</h4><p>①<b>牙齒的物理性消化</b>：門牙切、犬齒撕、臼齒磨，使食物顆粒變小，增加與消化液的接觸面積。②<b>舌的拌合</b>：把食物與唾液混合，形成滑潤的食團。③<b>唾液澱粉酶的化學性消化</b>：開始把澱粉分解成麥芽糖與短鏈多醣。多嚼幾下飯，會感覺有一點甜味，就是澱粉被分解出麥芽糖。</p></div><div class=\"ex\"><h4>兩個尺度要分清楚</h4><ul><li>咀嚼：改變食物<b>顆粒大小</b>（尺度：毫米），不改變分子。</li><li>唾液澱粉酶：改變<b>分子大小</b>（尺度：奈米），把長鏈澱粉切短。</li><li>兩者互相配合：顆粒越小，酵素越容易接觸到澱粉。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>嚼碎食物和唾液澱粉酶作用，各改變哪個尺度？</p><p><b>答：</b>嚼碎改變的是<b>顆粒</b>的大小（物理性）；唾液澱粉酶改變的是<b>分子</b>的大小（化學性）。</p></div>", "tb": []}, {"id": "b3-c22-l07", "t": "蠕動：追蹤收縮波與位移", "sec": "s2", "slide": 11, "sourceSlides": [11, 12], "sourcePages": [], "src": "原PPT第 11–12 頁；課本 P46–48", "figSpec": {"image": "peristalsis"}, "txt": "<ul><li>環肌與縱肌協調，形成沿消化道推進的收縮波。</li><li>比較圖中的A、B固定位置，觀察食團是否向前移動。</li><li>蠕動不單靠重力，不能把胃腸想成食物自由落下的水管。</li></ul><p class=\"think\">要證明食團前進，必須相對哪個固定標記比較？</p><div class=\"ex\"><h4>蠕動</h4><p>食團藉由各位置的<b>環肌與縱肌</b>逐步收縮，由食道推送到胃，這樣的推送動作稱為<b>蠕動</b>（圖 2－15a）。</p></div><div class=\"ex\"><h4>蠕動的三個步驟</h4><ul><li>環肌收縮，把食團向前推送。</li><li>環肌舒張、縱肌收縮，使食團的相對位置前移。</li><li>環肌再次收縮，把食團向前推。</li></ul></div><div class=\"ex g\"><h4>怎麼讀圖</h4><p>圖中 A、B 兩條虛線之間，表示食團通過的同一段消化道。比較食團的位置，就能看出收縮波往前移。</p></div><div class=\"ex\"><h4>深入解說：蠕動波如何推動食團</h4><p>消化道的環肌與縱肌像「擠牙膏」一樣協調：食團<b>後方</b>的環肌收縮，把食團向前擠；食團<b>前方</b>的環肌舒張，管腔擴大，讓食團有空間進入。縱肌的收縮則縮短管段，使管壁向前「套」過食團。這樣的收縮波一路向前傳遞，把食團送向下一段。所以即使倒立喝水，水仍然能進入胃，因為推動力來自肌肉，不是重力。</p></div><div class=\"ex\"><h4>判讀蠕動圖的方法</h4><ul><li>在圖上找兩條固定的標記線（A、B 虛線）。</li><li>比較食團與標記線的<b>相對位置</b>：如果食團從 A 線附近移到 B 線附近，就是向前移動。</li><li>只看到一張靜態圖，無法確認食團有沒有移動，必須比較連續畫面。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>要證明食團前進，必須相對哪個固定標記比較？</p><p><b>答：</b>要有<b>固定不動的參考標記</b>（如圖中 A、B 兩條虛線），比較不同時間食團相對於標記的位置。</p></div>", "tb": []}, {"id": "b3-c22-l08", "t": "胃的三層肌肉：攪拌成食糜", "sec": "s2", "slide": 13, "sourceSlides": [13, 14, 15], "sourcePages": [], "src": "原PPT第 13–15 頁；課本 P46–48", "figSpec": {"image": "stomach"}, "txt": "<ul><li>胃是可擴張及收縮的囊狀器官，內壁具有褶皺。</li><li>縱肌、環肌與斜行肌的配合可擠壓與攪拌。</li><li>食團與胃液混合、加工成食糜；物理與化學作用可同時進行。</li></ul><p class=\"think\">胃內分泌液增加，但完全不攪拌，會影響什麼？</p><div class=\"ex\"><h4>胃的構造</h4><p>胃是<b>膨大且可收縮的囊狀構造</b>，內壁褶皺多、肌肉層厚。</p></div><div class=\"ex\"><h4>三層肌肉</h4><p>除了縱肌與環肌，還多一層<b>斜行肌</b>（圖 2－15b）。三種肌肉配合收縮，可反覆擠壓與攪拌食團，把食團磨成更細的<b>食糜</b>，並與胃液充分混合。</p></div><div class=\"ex\"><h4>兩端的構造</h4><p>胃以<b>賁門</b>與食道連接，下端以<b>幽門</b>與十二指腸相接。</p></div><div class=\"ex\"><h4>深入解說：胃為什麼是「攪拌機」</h4><p>胃能容納大量食物（成人約 1～1.5 L）。三層肌肉分別向不同方向收縮：縱肌縮短、環肌縮窄、斜行肌扭轉擠壓，合起來能在胃腔中把食物反覆擠壓、翻動，使食團與胃液均勻混合，最後磨成糊狀的<b>食糜</b>。胃蠕動約每 20 秒一次，餐後胃排空時間因食物成分而不同，富含脂肪的食物停留較久。</p></div><div class=\"ex\"><h4>物理與化學同時進行</h4><ul><li>物理性：三層肌肉攪拌、胃壁褶皺增加表面積。</li><li>化學性：鹽酸使蛋白質變性並活化胃蛋白酶，胃蛋白酶把蛋白質水解成多肽。</li><li>胃液中的黏液保護胃壁不被酸與酵素消化。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>胃內分泌液增加，但完全不攪拌，會影響什麼？</p><p><b>答：</b>胃液只能與食團表面接觸，內部食物無法被充分混合與分解，消化效率下降，食團也不易磨成食糜。</p></div>", "tb": []}, {"id": "b3-c22-l09", "t": "賁門與幽門：控制進入與分段排空", "sec": "s2", "slide": 16, "sourceSlides": [16], "sourcePages": [], "src": "原PPT第 16 頁；課本 P46–48", "figSpec": {"image": "stomach"}, "txt": "<ul><li>食道與胃交界的功能性下食道括約機制有助限制逆流。</li><li>幽門位於胃與十二指腸交界，調整食糜進入小腸的速率。</li><li>括約肌控制通過，不代表整個胃腔在每次開啟時一次排空。</li></ul><p class=\"think\">為何讓食糜分段進入小腸，比一次全部排入更容易協調？</p><div class=\"scope-note\">教材以「賁門括約肌」簡稱防逆流機制；人體下食道括約肌為功能性高壓區，並與橫膈等協作，不是獨立厚環的簡單活門。</div><div class=\"ex\"><h4>賁門括約肌</h4><p>位於<b>胃和食道之間</b>。控制食物由食道進入胃，也防止食物由胃逆行回到食道。</p></div><div class=\"ex\"><h4>幽門括約肌</h4><p>位於<b>胃和十二指腸之間</b>。開闔可讓食糜<b>分段</b>流入小腸。</p></div><div class=\"ex\"><h4>小結</h4><p>兩者都是括約肌（環狀肌），用「收縮關閉、舒張開放」控制食物通過。</p></div><div class=\"ex\"><h4>深入解說：兩個括約肌的角色</h4><p><b>賁門</b>（胃的入口）平時維持收縮，吞嚥時才放鬆，使食物進入胃後不易逆流回食道；賁門功能不佳時，胃酸會逆流到食道，造成胸口灼熱（胃食道逆流）。<b>幽門</b>（胃的出口）則像一個「閥門」，每次只讓少量食糜通過，使十二指腸有時間中和酸性、與膽汁和胰液混合。若食糜一次全部進入小腸，消化液來不及處理，小腸也會被胃酸傷害。</p></div><div class=\"ex\"><h4>括約肌的運作</h4><ul><li>括約肌是<b>環狀肌</b>：收縮＝關閉，舒張＝打開。</li><li>賁門括約肌、幽門括約肌都受神經與激素調節。</li><li>幽門的開啟受腸抑胃泌素影響（見後面的消化液調控）。</li></ul></div><div class=\"ex\"><h4>補充</h4><p>教材以「賁門括約肌」簡稱防逆流機制；實際上人體的下食道括約肌是食道末端的高壓區，並與橫膈肌共同協作，並非一個獨立的厚環。</p></div>", "tb": []}, {"id": "b3-c22-l10", "t": "小腸：蠕動與分節的不同證據", "sec": "s2", "slide": 17, "sourceSlides": [17, 18, 19], "sourcePages": [3], "src": "原PPT第 17–19 頁；課本 P46–48", "figSpec": {"image": "segmentation"}, "txt": "<ul><li>小腸依序為十二指腸、空腸、迴腸，是主要消化吸收部位。</li><li>蠕動以推進為主；分節以局部環肌交替收縮、拌合為主。</li><li>分節增加食糜與消化液、吸收面的接觸；不是完全毫無位移。</li></ul><p class=\"think\">只看到一張腸管收縮圖，能判定食物整體推進的方向嗎？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/23-2-digestive-system-processes-and-regulation\" target=\"_blank\" rel=\"noopener noreferrer\">蠕動與分節運動參考</a></div><div class=\"ex\"><h4>小腸</h4><p>小腸是消化道中<b>最長</b>的部分，依序是十二指腸、空腸、迴腸。最前段彎曲呈 C 型，約 12 指幅寬的部位稱為十二指腸。</p></div><div class=\"ex\"><h4>小腸的兩種運動</h4><ul><li><b>蠕動</b>：縱肌與環肌收縮，推進食糜。</li><li><b>分節運動</b>：環肌在食糜所經過的腸管多處作節律性收縮，把食糜分成許多段；原收縮處舒張時，原舒張處收縮，食糜又重新分節，反覆進行。</li></ul></div><div class=\"ex\"><h4>分節運動的好處</h4><p>使食糜與消化液充分拌合；使食糜與腸壁緊密接觸，有助於吸收；擠壓腸壁，有助於血液與淋巴回流。</p></div><div class=\"ex\"><h4>深入解說：小腸為什麼是「主戰場」</h4><p>小腸全長約 6～7 公尺（活體約 3～5 公尺），內壁有環狀褶皺、絨毛、微絨毛三重構造，吸收面積可達上百平方公尺。十二指腸（約 25 公分）接收胃來的食糜，並加入膽汁、胰液，是<b>消化最活躍</b>的部位；空腸與迴腸則以<b>吸收</b>為主。蠕動與分節運動合作：蠕動是長距離推進；分節是原地來回擠壓混合。</p></div><div class=\"ex\"><h4>蠕動 vs 分節運動</h4><ul><li><b>蠕動</b>：縱肌與環肌配合，形成向前推進的收縮波 → <b>推進</b>。</li><li><b>分節運動</b>：環肌在多處同時收縮，把腸管分成許多小段，下一刻收縮處放鬆、放鬆處收縮 → <b>拌合與接觸</b>。</li><li>分節運動並非完全不移動，只是淨位移很小，目的是增加與消化液、腸壁的接觸。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>只看到一張腸管收縮圖，能判定食物整體推進的方向嗎？</p><p><b>答：</b>不能。單張圖只顯示某一刻的收縮位置，要判定推進需觀察連續時間的位移，且分節運動本身不以推進為主。</p></div>", "tb": [["BOOK3", "P47 完整課本頁"]]}, {"id": "b3-c22-l11", "t": "大腸與排遺：回收剩餘水分", "sec": "s2", "slide": 20, "sourceSlides": [20], "sourcePages": [4], "src": "原PPT第 20 頁；課本 P46–48", "figSpec": {"image": "PPT20S3"}, "txt": "<ul><li>大腸包括盲腸、結腸及直腸，與小腸相連。</li><li>糞便含未消化殘渣、微生物、脫落細胞、分泌物及水。</li><li>排遺是消化道殘渣排出；排泄代謝廢物是不同的概念。</li></ul><p class=\"think\">糞便是否完全由原封不動的食物構成？</p><div class=\"ex\"><h4>大腸的組成</h4><p>大腸包括盲腸、結腸及直腸。大腸前端與小腸相連，相連處延伸出一盲管，稱為盲腸。</p></div><div class=\"ex\"><h4>到達大腸的是什麼</h4><p>主要是未消化的食物殘渣、消化道分泌物、脫落的腸壁細胞、細菌及少量水分。這些共同組成<b>糞便</b>，最後經肛門排出，稱為<b>排遺</b>。</p></div><div class=\"ex\"><h4>大腸的吸收</h4><p>剩餘的水、維生素及無機鹽，可在大腸繼續被吸收。</p></div><div class=\"ex\"><h4>深入解說：大腸做什麼</h4><p>大腸約 1.5 公尺，不分泌消化酶，主要工作是<b>回收剩餘的水分與無機鹽</b>，並把殘渣整理成糞便。小腸每天送進大腸的液體約 1.5 L，大腸吸收其中大部分，只留下約 100 mL 隨糞便排出。如果大腸水分吸收不足就會腹瀉；水分吸收過多、糞便停留過久則會便秘。</p></div><div class=\"ex\"><h4>糞便的組成</h4><ul><li>未消化的食物殘渣（如纖維素）。</li><li>消化道的分泌物與脫落的腸壁細胞。</li><li>大量細菌（約占乾重的 1／3～1／2）。</li><li>水分（約 75%）。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p><b>排遺</b>是未被吸收的殘渣排出體外；<b>排泄</b>是排出細胞代謝產生的廢物（如尿素、CO₂）。兩者概念不同。糞便不是原封不動的食物。</p></div>", "tb": [["BOOK4", "P48 完整課本頁"]]}, {"id": "b3-c22-l12", "t": "食性適應：發酵位置不都相同", "sec": "s2", "slide": 21, "sourceSlides": [21, 22], "sourcePages": [], "src": "原PPT第 21–22 頁；課本 P46–48", "figSpec": {"image": "diet"}, "txt": "<ul><li>相對體型比較，植食性哺乳動物常有較長的消化道與發酵空間。</li><li>兔等可利用較大的盲腸；反芻動物主要利用前胃共生菌發酵。</li><li>牛是具有四個胃室的複胃，不是四個彼此獨立的胃。</li></ul><p class=\"think\">盲腸大和具有反芻胃室，是同一套發酵配置嗎？</p><div class=\"scope-note\">原PPT「具有多個胃」以胃室理解；不把示例「最長」推為所有物種的絕對排名。<a href=\"https://openstax.org/books/biology-2e/pages/34-1-digestive-systems\" target=\"_blank\" rel=\"noopener noreferrer\">反芻與後腸發酵參考</a></div><div class=\"ex\"><h4>消化道與食性</h4><p>胃腸道各部位與身體的比例，和動物的食性有密切關係（圖 2－16）。</p></div><div class=\"ex\"><h4>三類哺乳動物</h4><ul><li><b>肉食性</b>：消化道通常較短，盲腸短且細小。</li><li><b>非反芻類植食性</b>：消化道較長，盲腸長且粗大。</li><li><b>反芻類植食性</b>：消化道最長，具有多個胃。</li></ul></div><div class=\"ex\"><h4>為什麼植食性動物盲腸粗大</h4><p>盲腸較粗、較長，可供聚集大量微生物，作為纖維素分解及發酵的場所。人類及肉食性動物的盲腸通常很短。</p></div><div class=\"ex\"><h4>深入解說：植物的纖維素誰來消化</h4><p>動物的基因組中沒有纖維素酶，因此無法直接消化植物細胞壁的纖維素。草食動物靠消化道中的<b>共生微生物</b>發酵纖維素，把它變成短鏈脂肪酸等，供宿主吸收利用。發酵需要時間和空間，所以植食動物的消化道比肉食動物更長、更大。肉類容易消化，因此肉食動物的消化道較短。</p></div><div class=\"ex\"><h4>兩種發酵策略</h4><ul><li><b>前腸發酵（反芻動物，如牛、羊）</b>：胃分成多室（瘤胃、蜂巢胃、重瓣胃、皺胃），瘤胃中的微生物先發酵纖維素；食物還會回到口中再次咀嚼（反芻）。</li><li><b>後腸發酵（如兔、馬）</b>：以盲腸／大腸為發酵空間，盲腸長而粗大。</li><li>肉食動物：盲腸短細，發酵不重要。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>盲腸大和具有反芻胃室，是同一套發酵配置嗎？</p><p><b>答：</b>不是。反芻動物的發酵在<b>胃（前腸）</b>進行；盲腸粗大者的發酵在<b>盲腸／大腸（後腸）</b>進行，位置與效率都不同。</p></div>", "tb": []}, {"id": "b3-c22-l13", "t": "把運動、消化與吸收分開比較", "sec": "s2", "slide": 23, "sourceSlides": [23], "sourcePages": [], "src": "原PPT第 23 頁；課本 P46–48", "figSpec": {"image": "PPT23S3"}, "txt": "<ul><li>口腔嚼細並吞嚥；食道推送；胃攪拌；小腸推進與拌合。</li><li>運動不是水解酵素；消化完成也不代表已跨過上皮。</li><li>把位置、動作、物質變化分開記錄，才能解釋整段流程。</li></ul><p class=\"think\">同一份食物的「位置改變」與「分子改變」可如何分別畫圖？</p><div class=\"ex\"><h4>三種不同的概念</h4><p>運動方式、消化、吸收是不同的層次，不要混為一談。</p></div><div class=\"ex\"><h4>依部位整理運動方式</h4><ul><li>口腔：嚼細、吞嚥。</li><li>食道：蠕動。</li><li>胃：蠕動，並由三層肌肉攪拌成食糜。</li><li>小腸：蠕動與分節運動。</li><li>大腸：蠕動，形成排遺。</li></ul></div><div class=\"ex\"><h4>小提醒</h4><p>蠕動是「推進」，分節運動是「攪拌與接觸」；兩者的肌肉收縮方式不同。</p></div><div class=\"ex\"><h4>深入解說：用三條時間軸整理整段消化</h4><p>同一口食物，可以用三個問題來追蹤：①<b>位置</b>——現在在消化道的哪一段？（運動：吞嚥、蠕動、分節）②<b>分子</b>——大分子被切成什麼？（化學性消化：各種酵素水解）③<b>跨越</b>——有沒有穿過上皮進入體內？（吸收）三個問題的答案常常不同：食物在胃的位置、澱粉在口腔被切成麥芽糖、而吸收主要在小腸。把三者分開，才能解釋整個流程。</p></div><div class=\"ex\"><h4>各部位運動方式（對應表）</h4><ul><li>口腔：咀嚼（物理）、吞嚥。</li><li>食道：蠕動，把食團送入胃。</li><li>胃：蠕動＋三層肌攪拌。</li><li>小腸：蠕動＋分節運動。</li><li>大腸：蠕動，形成糞便；另有集團蠕動。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>同一份食物的「位置改變」與「分子改變」可如何分別畫圖？</p><p><b>答：</b>位置改變畫成沿消化道前進的箭頭（運動）；分子改變畫成大分子 → 小分子的反應箭頭（酵素水解），兩者是兩張不同的圖。</p></div>", "tb": []}, {"id": "b3-c22-l14", "t": "腸內菌：功能依群落與條件改變", "sec": "s2", "slide": 24, "sourceSlides": [24, 25], "sourcePages": [9], "src": "原PPT第 24–25 頁；課本 P46–48", "figSpec": {"image": "microbiome"}, "txt": "<ul><li>部分共生微生物可分解、發酵宿主不能直接消化的物質。</li><li>菌相與食物、部位及環境有關；教材數量是範例與數量級。</li><li>部分菌可合成維生素或參與防禦；不是每種菌都相同有益。</li></ul><p class=\"think\">由菌數多就能推論健康更好，還是需要菌種與功能的證據？</p><div class=\"scope-note\">原文「降低大腸癌罹患率」不應推成所有腸內菌皆有保護作用。保留原句供對照，教學限定為菌群功能與情境相關，不能由菌數直接推得疾病風險。</div><div class=\"ex\"><h4>什麼是腸內菌</h4><p>動物腸胃中常有共生的微生物，消化道中的微生物統稱為<b>腸內菌</b>。植食性動物本身沒有纖維素酶，要靠胃腸中的微生物協助分解纖維素。</p></div><div class=\"ex\"><h4>種類與數量會變</h4><p>因動物的生活環境、生理狀況、腸道部位及食物而改變。人體胃內為強酸環境，腸內菌少；由十二指腸到結腸，種類與數量逐漸增加：小腸後段每公克約 10⁷ 個，大腸內每公克約 10¹⁰ 個。</p></div><div class=\"ex\"><h4>腸內菌的作用</h4><ul><li>合成維生素 B 群及維生素 K。</li><li>形成屏障、抑制有害菌繁殖、降低大腸癌罹患率。</li><li>調節宿主胃腸道的代謝與免疫功能。</li></ul></div><div class=\"ex\"><h4>抗生素不是萬靈丹</h4><p>濫用抗生素可能使腸內菌大量死亡，或讓病原菌有機會大量繁殖。</p></div><div class=\"ex\"><h4>深入解說：腸內菌的角色（兼顧謹慎）</h4><p>人體腸道內的微生物（腸道菌叢）數量龐大、種類多樣，與宿主是共生關係：它們能發酵人體無法消化的纖維，產生短鏈脂肪酸供大腸細胞利用；合成部分維生素 B 群與 K；佔據空間，抑制病原菌的生長；還能影響免疫系統的成熟。但菌的組成會隨飲食、年齡、抗生素與疾病而改變，<b>不是菌數越多就越健康</b>，也不是所有種類都有益。</p></div><div class=\"ex\"><h4>怎麼理解課本的「菌數」</h4><ul><li>胃酸強，菌少；小腸後段每公克約 10⁷ 個；大腸每公克約 10¹⁰ 個，這些是<b>數量級</b>的概念。</li><li>菌的功能要看「種類與功能的證據」，不能只看總數。</li><li>課本提到「降低大腸癌罹患率」，宜理解為特定條件下的研究發現，不可推論所有腸內菌都有保護作用。</li></ul></div><div class=\"ex\"><h4>抗生素提醒</h4><p>抗生素殺的是細菌，不分「好菌」與「壞菌」；不當使用可能破壞菌叢平衡，也促成抗藥性。遵循醫師處方使用。</p></div>", "tb": [["BOOK9", "P53 完整課本頁"]]}, {"id": "b3-c22-l15", "t": "唾腺與澱粉酶：分泌處不等於作用終點", "sec": "s3", "slide": 26, "sourceSlides": [26, 27], "sourcePages": [], "src": "原PPT第 26–27 頁；課本 P49–51", "figSpec": {"image": "PPT27S3"}, "txt": "<ul><li>腮腺、頷下腺及舌下腺分泌唾液，潤滑食物並開始澱粉消化。</li><li>唾液澱粉酶產生麥芽糖與短鏈多醣，尚不是全部葡萄糖。</li><li>教材pH範圍作為消化環境示例，不當成任何時間都固定的值。</li></ul><p class=\"think\">澱粉變成麥芽糖後，還需哪類酵素才能變成單醣？</p><div class=\"ex\"><h4>人體的消化液</h4><p>包括唾液、胃液、膽汁、胰液及小腸液，分別由唾腺、胃腺、肝臟、胰臟、小腸腺分泌。</p></div><div class=\"ex\"><h4>唾液</h4><ul><li>pH 約 6.35～6.85。</li><li>由唾腺分泌，共三對：腮腺、舌下腺、頜下腺。</li><li><b>唾液澱粉酶</b>：將澱粉、肝糖分解為麥芽糖與短鏈多醣。</li><li>黏液：溶解、潤滑食物。</li></ul></div><div class=\"ex\"><h4>小提醒</h4><p>唾液澱粉酶在口腔開始作用；「分泌處」和「作用終點」不一定相同。</p></div><div class=\"ex\"><h4>深入解說：酵素的「接力」</h4><p>澱粉的消化是接力賽：<b>唾液澱粉酶</b>（口腔）把澱粉切成麥芽糖和短鏈多醣 → 食團進入胃，強酸使唾液澱粉酶失活 → <b>胰澱粉酶</b>（小腸）繼續切成雙醣 → <b>腸雙醣酶</b>（小腸上皮細胞膜上）把麥芽糖切成 2 個葡萄糖，才能吸收。每一棒酵素都有最適 pH：唾液約 6.35～6.85（近中性）、胃液約 1.0～3.5（強酸）、胰液約 8.0～8.3（鹼性）。</p></div><div class=\"ex\"><h4>三對唾腺</h4><ul><li><b>腮腺</b>：位於耳前下方，分泌量大、以漿液為主。</li><li><b>頜下腺</b>：位於下頜骨內側。</li><li><b>舌下腺</b>：位於舌下，分泌黏稠液體。</li><li>三對唾腺都經導管開口於口腔，平時少量分泌，進食時增加。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>澱粉變成麥芽糖後，還需哪類酵素才能變成單醣？</p><p><b>答：</b>需要<b>腸雙醣酶</b>（麥芽糖酶），位於小腸上皮細胞膜上，把雙醣水解成單醣。</p></div>", "tb": []}, {"id": "b3-c22-l16", "t": "唾腺開口：從構造提出觀察問題", "sec": "s3", "slide": 28, "sourceSlides": [28], "sourcePages": [5], "src": "原PPT第 28 頁；課本 P49–51", "figSpec": {"image": "PPT28S3"}, "txt": "<ul><li>教材觀察舌繫帶附近的隆起及唾腺開口，連結分泌物的出口。</li><li>可先用鏡子辨認位置；圖中的標示不代表全部唾腺只有兩個出口。</li><li>觀察與刺激是不同步驟，記錄看到的構造，不以未做的動作冒充結果。</li></ul><p class=\"think\">你能分清開口、導管和製造分泌物的腺體嗎？</p><div class=\"ex\"><h4>自己觀察唾腺開口（知識補給站）</h4><p>捲起舌頭照鏡子，在口腔底部<b>舌繫帶兩側</b>各有一個圓形小隆起，上面有小孔，是<b>頜下腺與舌下腺的共同開口</b>。用棉棒輕觸就會流口水。</p></div><div class=\"ex\"><h4>從構造提出問題</h4><p>為什麼這個位置會流口水？唾腺的開口在哪裡？不同的唾腺開口是否在同一處？可以動手觀察，再對照課本。</p></div><div class=\"ex\"><h4>深入解說：動手觀察的科學訓練</h4><p>這個知識補給站不是在背資料，而是在示範<b>「觀察 → 提出問題 → 對照課本」</b>的步驟：先自己看到舌繫帶兩側的小隆起（唾腺開口），再問「為什麼碰到它會流口水？」「是不是所有唾腺都在這裡開口？」最後看課本確認：頜下腺和舌下腺的導管共同開口在這個位置，而腮腺則開口於頰內、靠近上臼齒的位置。</p></div><div class=\"ex\"><h4>記錄觀察的原則</h4><ul><li>先<b>描述看到的</b>（位置、形狀、有無小孔）。</li><li>再<b>寫做了什麼</b>（如用棉棒輕觸）與<b>發生什麼</b>（有無流口水）。</li><li>不能把沒做的動作寫成結果；觀察與推論要分開。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>你能分清開口、導管和製造分泌物的腺體嗎？</p><p><b>答：</b><b>開口</b>是導管在口腔的出口；<b>導管</b>是通道；<b>腺體</b>在深處，是製造唾液的細胞團。我們用鏡子看到的是開口。</p></div>", "tb": [["BOOK5", "P49 完整課本頁"]]}, {"id": "b3-c22-l17", "t": "胃腺三種細胞：活化與保護", "sec": "s3", "slide": 29, "sourceSlides": [29, 30, 31], "sourcePages": [6], "src": "原PPT第 29–31 頁；課本 P49–51", "figSpec": {"image": "gastric"}, "txt": "<ul><li>壁細胞分泌鹽酸；主細胞先分泌無活性的胃蛋白酶原。</li><li>酸性胃腔促進活化，胃蛋白酶再水解蛋白質成肽。</li><li>黏液、碳酸氫鹽及上皮屏障共同保護；不表示胃壁完全無蛋白質。</li></ul><p class=\"think\">若主細胞直接分泌大量活性蛋白酶，會增加什麼風險？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/23-4-the-stomach\" target=\"_blank\" rel=\"noopener noreferrer\">胃腺與黏膜保護參考</a></div><div class=\"ex\"><h4>胃液</h4><p>pH 約 1.0～3.5，由胃壁的<b>胃腺</b>分泌。胃腺中有三種細胞（圖 2－17）。</p></div><div class=\"ex\"><h4>三種細胞</h4><ul><li><b>壁細胞</b>：分泌<b>鹽酸</b>，造成酸性環境，可殺菌，並活化胃蛋白酶原。</li><li><b>主細胞</b>：分泌<b>胃蛋白酶原</b>（沒有酵素活性），經鹽酸活化成<b>胃蛋白酶</b>後，在酸性環境下把蛋白質分解成多肽。</li><li><b>黏液細胞</b>：分泌黏液，保護胃壁不受強酸傷害。</li></ul></div><div class=\"ex\"><h4>活化的順序</h4><p>胃蛋白酶原 + 鹽酸 → 胃蛋白酶 → 分解蛋白質。這樣設計，可避免胃腺細胞本身被消化。</p></div><div class=\"ex\"><h4>深入解說：為什麼要先做成「酶原」</h4><p>蛋白酶如果一製造出來就有活性，會先把製造它的主細胞分解掉。所以主細胞先分泌<b>胃蛋白酶原</b>（沒有活性的前驅物），酵素原被送到胃腔、遇到<b>鹽酸</b>後才切掉一小段胜肽，成為有活性的<b>胃蛋白酶</b>；胃蛋白酶本身還能活化更多酶原（正回饋式放大）。這是一種「<b>送到現場才啟動</b>」的保護設計。</p></div><div class=\"ex\"><h4>三種細胞的分工</h4><ul><li>壁細胞：分泌 HCl → 殺菌、活化酶原、使蛋白質變性易被水解。</li><li>主細胞：分泌胃蛋白酶原。</li><li>黏液細胞：分泌黏液與碳酸氫鹽，形成保護層。</li><li>（課外）胃壁細胞還分泌內在因子，幫助維生素 B₁₂ 吸收。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>若主細胞直接分泌大量活性蛋白酶，會增加什麼風險？</p><p><b>答：</b>胃壁本身的蛋白質可能被消化，造成胃黏膜受損、胃潰瘍。酶原設計與黏液保護共同降低這個風險。</p></div>", "tb": [["BOOK6", "P50 完整課本頁"]]}, {"id": "b3-c22-l18", "t": "胰液：酵素與碳酸氫鹽分工", "sec": "s3", "slide": 32, "sourceSlides": [32, 33], "sourcePages": [], "src": "原PPT第 32–33 頁；課本 P49–51", "figSpec": {"image": "enzymes"}, "txt": "<ul><li>胰臟外分泌經導管向十二指腸提供酵素與碳酸氫鹽。</li><li>澱粉酶、蛋白酶、脂酶與核酸酶各有基質；碳酸氫鹽中和酸。</li><li>部分蛋白酶以酵素原分泌，在小腸活化；不能說所有胰酵素皆是酵素原。</li></ul><p class=\"think\">含有酵素但沒有適合的pH，能保證有效水解嗎？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/23-6-accessory-organs-in-digestion-the-liver-pancreas-and-gallbladder\" target=\"_blank\" rel=\"noopener noreferrer\">胰液與酵素原活化參考</a></div><div class=\"ex\"><h4>胰液</h4><p>pH 約 8.0～8.3，由胰臟分泌，經導管注入十二指腸。含有可分解醣類、蛋白質、脂質、核酸的消化酶，並含大量碳酸氫鹽。</p></div><div class=\"ex\"><h4>胰液的成分</h4><ul><li><b>胰澱粉酶</b>：多醣 → 雙醣。</li><li><b>胰蛋白酶</b>：多肽 → 短肽。</li><li><b>胰脂酶</b>：中性脂 → 單酸甘油酯與脂肪酸。</li><li><b>胰核酸酶</b>：核酸 → 核苷酸。</li><li><b>碳酸氫鹽</b>：中和胃酸。</li></ul></div><div class=\"ex\"><h4>分工</h4><p>酵素負責分解，碳酸氫鹽負責提供合適的酸鹼環境。</p></div><div class=\"ex\"><h4>深入解說：為什麼胰液要含碳酸氫鹽</h4><p>食糜從胃來到十二指腸時，pH 約 1～3，酸度遠超胰臟酵素的適合範圍（約 pH 8）。如果酸性不被中和，胰澱粉酶、胰蛋白酶、胰脂酶都無法有效作用，還可能傷害腸黏膜。胰液中的<b>碳酸氫鹽</b>（HCO₃⁻）能中和胃酸，把十二指腸內的環境調成弱鹼性，這才讓酵素「有舞台可以表演」。所以胰液是「酵素 ＋ 環境調節劑」的組合。</p></div><div class=\"ex\"><h4>胰液的四大類酵素（對照表）</h4><ul><li>胰澱粉酶：多醣 → 雙醣（麥芽糖）。</li><li>胰蛋白酶（及相關蛋白酶）：多肽 → 短肽。</li><li>胰脂酶：三酸甘油酯 → 單酸甘油酯 ＋ 脂肪酸。</li><li>胰核酸酶：DNA、RNA → 核苷酸。</li></ul></div><div class=\"ex\"><h4>補充</h4><p>部分胰蛋白酶以<b>酶原</b>形式（如胰蛋白酶原）分泌，進入小腸後由腸激酶活化。因此不能說所有胰酵素都是酶原；澱粉酶、脂酶在分泌時就是活性狀態。</p></div>", "tb": []}, {"id": "b3-c22-l19", "t": "膽汁：肝製造、膽囊儲存", "sec": "s3", "slide": 34, "sourceSlides": [34], "sourcePages": [7], "src": "原PPT第 34 頁；課本 P49–51", "figSpec": {"image": "PPT34S3"}, "txt": "<ul><li>肝臟製造膽汁；膽囊儲存、濃縮並排出膽汁。</li><li>膽鹽乳化脂質，增加胰脂酶接觸面積；膽汁本身不含消化酵素。</li><li>膽汁走膽管到十二指腸，不是經血管把膽汁直接倒入腸腔。</li></ul><p class=\"think\">膽汁增加後，為何脂質水解可更有效卻不算膽鹽在水解？</p><div class=\"ex\"><h4>膽汁</h4><p>pH 約 7.8，由<b>肝臟</b>分泌，儲存在<b>膽囊</b>，需要時經導管注入十二指腸。食糜進入十二指腸會刺激膽囊排出膽汁。</p></div><div class=\"ex\"><h4>成分與功用</h4><ul><li><b>膽鹽</b>：乳化脂質，把大油滴變成小油滴，幫助脂質分解。</li><li><b>碳酸氫鹽</b>：中和胃酸。</li></ul></div><div class=\"ex\"><h4>重點</h4><p>膽汁是<b>不含酵素</b>的鹼性液體，作用是物理性的乳化，不是化學性的分解。</p></div><div class=\"ex\"><h4>深入解說：膽汁的來龍去脈</h4><p>肝細胞持續製造膽汁，沒有進食時，膽汁先送到<b>膽囊</b>儲存並濃縮；食糜（尤其含脂肪）進入十二指腸時，會刺激小腸分泌 CCK，使膽囊收縮，膽汁經<b>膽管</b>流入十二指腸。膽汁的成分包括膽鹽、膽色素（紅血球分解的產物，使糞便呈黃褐色）、膽固醇、碳酸氫鹽等，但<b>不含消化酶</b>。</p></div><div class=\"ex\"><h4>常見混淆</h4><ul><li>膽汁「幫助」脂質消化，但<b>不是酵素</b>，也不進行化學性水解。</li><li>膽囊只是儲存器官，不製造膽汁；切除膽囊後，肝臟仍可分泌膽汁，只是不能濃縮和一次大量釋放。</li><li>膽汁走的是<b>膽管</b>（導管），不是血管。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>膽汁增加後，為何脂質水解可更有效卻不算膽鹽在水解？</p><p><b>答：</b>因為膽鹽只是把油滴<b>乳化成小油滴</b>，增加胰脂酶的接觸面積；真正切斷化學鍵的是胰脂酶。</p></div>", "tb": [["BOOK7", "P51 完整課本頁"]]}, {"id": "b3-c22-l20", "t": "小腸液與刷狀緣：液體和酵素位置", "sec": "s3", "slide": 35, "sourceSlides": [35, 36], "sourcePages": [], "src": "原PPT第 35–36 頁；課本 P49–51", "figSpec": {"image": "enzymes"}, "txt": "<ul><li>小腸液供應水、黏液與適合的局部環境。</li><li>多種完成水解的酵素位於上皮細胞刷狀緣，不是全都游離在液體中。</li><li>腸雙醣酶、肽酶與核苷相關酵素完成不同養分的後段加工。</li></ul><p class=\"think\">上皮表面受損，可能同時影響哪兩種功能？</p><div class=\"ex\"><h4>小腸液</h4><p>pH 約 7.5～8.9，由<b>小腸腺</b>分泌（位於小腸黏膜層），為鹼性，除了中和胃酸，也提供水分以利水解作用。</p></div><div class=\"ex\"><h4>小腸上皮細胞膜上的酵素</h4><ul><li><b>腸雙醣酶</b>：雙醣 → 單醣。</li><li><b>腸肽酶</b>：短肽 → 胺基酸。</li><li><b>腸核苷酸酶</b>：核苷酸 → 核苷與磷酸。</li><li><b>腸核苷酶</b>：核苷 → 含氮鹼基與五碳醣。</li></ul></div><div class=\"ex\"><h4>另外還有</h4><p>黏液（保護腸壁）與碳酸氫鹽（中和胃酸）。小腸消化酶主要位於<b>小腸上皮細胞膜</b>上。</p></div><div class=\"ex\"><h4>深入解說：最後一步在「膜上」完成</h4><p>小腸腔中的液體主要含胰液的酵素與小腸液的水分、黏液；而最後一步的水解酵素（腸雙醣酶、腸肽酶、腸核苷酸酶、腸核苷酶）是<b>鑲嵌在上皮細胞微絨毛膜上</b>的蛋白質。這種設計的好處是：水解一完成，產物<b>立刻就在吸收面上被吸收</b>，不會漂在腸腔中被細菌利用或被稀釋。所以刷狀緣受損（如乳糜瀉、腸道感染）時，消化與吸收會同時受影響。</p></div><div class=\"ex\"><h4>小腸液的作用</h4><ul><li>含水分，使食糜維持適當稀度，有利水解。</li><li>含黏液，保護腸壁。</li><li>含碳酸氫鹽，協助中和胃酸。</li><li>pH 約 7.5～8.9，偏鹼性。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>上皮表面受損，可能同時影響哪兩種功能？</p><p><b>答：</b><b>消化</b>（膜上酵素流失）與<b>吸收</b>（吸收面積與載體蛋白減少）。</p></div>", "tb": []}, {"id": "b3-c22-l21", "t": "酵素總表：先對基質，再追蹤產物", "sec": "s3", "slide": 37, "sourceSlides": [37, 38], "sourcePages": [], "src": "原PPT第 37–38 頁；課本 P49–51", "figSpec": {"image": "enzymes"}, "txt": "<ul><li>醣：澱粉→較短糖鏈、雙醣→單醣；蛋白質：蛋白質→肽→胺基酸。</li><li>脂質：三酸甘油酯→主要為單酸甘油酯與脂肪酸。</li><li>核酸：核酸→核苷酸→核苷與磷酸→含氮鹼基與五碳醣。</li></ul><p class=\"think\">麥芽糖、核苷酸與單酸甘油酯是否都是完全相同的「最後一步」？</p><div class=\"scope-note\">表2–1是本課選定酵素的比較表；表中的「－」不代表該器官完全沒有其他酵素，例如胃另有脂酶。</div><div class=\"ex g\"><h4>表 2－1　各種消化酶</h4><p>讀法：先找<b>基質</b>（醣類、蛋白質、脂質、核酸），再追蹤<b>產物</b>，最後看是哪個腺體分泌的。</p></div><div class=\"ex\"><h4>醣類與蛋白質</h4><ul><li>唾腺：唾液澱粉酶，澱粉、肝糖 → 麥芽糖、短鏈多醣。</li><li>胰臟：胰澱粉酶，多醣 → 雙醣。</li><li>小腸上皮細胞：腸雙醣酶，雙醣 → 單醣。</li><li>胃腺：胃蛋白酶，蛋白質 → 多肽。</li><li>胰臟：胰蛋白酶，多肽 → 短肽。</li><li>小腸上皮細胞：腸肽酶，短肽 → 胺基酸。</li></ul></div><div class=\"ex\"><h4>脂質與核酸</h4><ul><li>胰臟：胰脂酶，中性脂 → 單酸甘油酯與脂肪酸。</li><li>胰臟：胰核酸酶，DNA、RNA → 核苷酸。</li><li>小腸上皮細胞：腸核苷酸酶，核苷酸 → 核苷與磷酸；腸核苷酶，核苷 → 含氮鹼基與五碳醣。</li></ul></div><div class=\"ex\"><h4>深入解說：怎麼讀酵素總表</h4><p>讀表有三個層次：①<b>基質</b>（酵素作用的對象，如澱粉、蛋白質）；②<b>產物</b>（水解後得到的較小分子）；③<b>分泌處</b>（唾腺、胃腺、胰臟、小腸上皮細胞）。同一種基質通常有「<b>接力</b>」：蛋白質 →（胃蛋白酶）→ 多肽 →（胰蛋白酶）→ 短肽 →（腸肽酶）→ 胺基酸。最終吸收的是<b>單體</b>：葡萄糖／果糖／半乳糖、胺基酸、脂肪酸與單酸甘油酯、核苷酸被分解到的小分子。</p></div><div class=\"ex\"><h4>四大類養分的消化終點</h4><ul><li>醣類 → <b>單醣</b>（葡萄糖等）。</li><li>蛋白質 → <b>胺基酸</b>（也可吸收少量二肽、三肽）。</li><li>脂質 → <b>脂肪酸 ＋ 單酸甘油酯</b>（主要）。</li><li>核酸 → <b>核苷酸 → 核苷與磷酸 → 含氮鹼基與五碳醣</b>。</li></ul></div><div class=\"ex\"><h4>範圍提醒</h4><p>表中沒有列出的酵素不代表不存在，例如胃也有少量胃脂酶。這份表是課本選定的主要酵素。</p></div>", "tb": []}, {"id": "b3-c22-l22", "t": "乳糖的情境：水解不足與發酵", "sec": "s3", "slide": 39, "sourceSlides": [39], "sourcePages": [], "src": "原PPT第 39 頁；課本 P49–51", "figSpec": {"image": "lactose"}, "txt": "<ul><li>乳糖酶活性不足時，部分乳糖可能未充分水解而進入大腸。</li><li>未吸收溶質及發酵產物影響水分分布；微生物發酵也可產氣。</li><li>不同製品與個人的耐受不同，不能由教材例子保證某製品一定無症狀。</li></ul><p class=\"think\">如何區分「酵素不足」與「微生物發酵」在流程中的位置？</p><div class=\"scope-note\">這是消化機制的情境分析；飲用牛乳後不適的原因不只有乳糖，不能由單一症狀直接判定。</div><div class=\"ex\"><h4>牛乳與優酪乳（知識補給站）</h4><p>牛乳含豐富的蛋白質、鈣質與<b>乳糖</b>。有些人喝牛乳會腹瀉，是因為缺乏分解乳糖所需的<b>乳糖酶</b>。</p></div><div class=\"ex\"><h4>為什麼會腹脹、腹瀉</h4><ul><li>過多的乳糖進入大腸，被微生物發酵，產生大量氣體，造成<b>腹脹</b>。</li><li>未分解的糖分與發酵產物使腸道滲透壓升高，腸道水量增加，引起<b>腹瀉</b>。</li></ul></div><div class=\"ex\"><h4>改喝優酪乳</h4><p>優酪乳中的乳酸桿菌可將乳糖分解，所以比較不會不舒服。</p></div><div class=\"ex\"><h4>深入解說：乳糖不耐症的機制</h4><p>乳糖是由葡萄糖與半乳糖組成的雙醣，必須由小腸上皮細胞的<b>乳糖酶</b>水解成單醣才能吸收。許多成人在斷奶之後乳糖酶活性逐漸下降，喝牛奶後大量乳糖到達大腸：①被腸內菌發酵，產生氣體（H₂、CO₂、甲烷）→ 腹脹、排氣；②乳糖本身與發酵產物提高腸腔滲透壓，使水分滯留或被拉入腸腔 → 腹瀉。</p></div><div class=\"ex\"><h4>如何區分兩個環節</h4><ul><li><b>酵素不足</b>：在小腸（消化階段）缺少乳糖酶，乳糖無法被水解吸收。</li><li><b>微生物發酵</b>：在大腸（後續處理階段），菌把未吸收的乳糖發酵。</li><li>症狀來自後者，但根本原因是前者。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>牛奶引起不適的原因不只有乳糖（如牛奶蛋白過敏），不能由單一症狀直接判定；優酪乳、無乳糖牛奶或補充乳糖酶，都是緩解乳糖不耐的做法，個人耐受性不同。</p></div>", "tb": []}, {"id": "b3-c22-l23", "t": "神經調控：食物尚未入胃也有反應", "sec": "s4", "slide": 40, "sourceSlides": [40, 41], "sourcePages": [], "src": "原PPT第 40–41 頁；課本 P51–53", "figSpec": {"image": "PPT40S3"}, "txt": "<ul><li>看到、聞到或想到食物，可經神經整合影響分泌。</li><li>口腔刺激及胃部伸展也可引起反應；神經與局部腸神經協作。</li><li>交感及副交感影響依器官和分泌成分而異，不能套成所有器官只開或只關。</li></ul><p class=\"think\">「聞到食物→流口水」與「胃酸變化→小腸激素」訊息路徑有何不同？</p><div class=\"scope-note\">教材把恐懼時唾液減少概括為交感抑制；交感也能影響唾液蛋白分泌，應避免全有或全無的說法。</div><div class=\"ex\"><h4>消化液的調控</h4><p>大部分消化液的分泌可受<b>神經系統與激素</b>共同調控，但<b>唾液只受神經系統調控</b>。</p></div><div class=\"ex\"><h4>唾液</h4><ul><li>平時少量持續分泌，維持口腔濕潤。</li><li>進食前看到、嗅到、想到美食 → 大腦整合 → 腦幹（延腦）→ 副交感神經 → 唾腺分泌增加。</li><li>食物進入口腔 → 受器 → 感覺神經 → 延腦 → 副交感神經 → 唾腺分泌增加。</li><li>恐懼、焦慮 → 交感神經 → 抑制唾液分泌。</li></ul></div><div class=\"ex\"><h4>胃液（神經部分）</h4><ul><li>看到、聞到、想到美食，或食物進入胃，都可刺激相關神經促進胃液分泌。</li><li>情緒也會影響胃液分泌。</li></ul></div><div class=\"ex\"><h4>深入解說：消化液分泌的三個階段</h4><p>胃液的調控可分為：<b>頭期</b>（看到、聞到、想到食物，經神經促進分泌，還沒吃就開始）、<b>胃期</b>（食物進入胃，伸展與化學刺激促進分泌）、<b>腸期</b>（食糜進入小腸，經激素回饋抑制胃液，並調控胰液、膽汁）。唾液是例外，<b>只受神經調控</b>，不受激素影響。</p></div><div class=\"ex\"><h4>神經反射路徑（以唾液為例）</h4><ul><li>看到食物 → 大腦整合 → 延腦的唾液分泌中樞 → <b>副交感神經</b> → 唾腺分泌增加。</li><li>食物進入口腔 → 口腔受器 → 感覺神經 → 延腦 → 副交感神經 → 唾腺。</li><li>恐懼、焦慮 → <b>交感神經</b> → 唾液變少（口乾）。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>自主神經對器官的作用是「依器官而異」的，不是簡單的「交感＝抑制、副交感＝促進」；交感神經對唾腺的蛋白質分泌也有促進作用，課本採簡化說法。</p></div>", "tb": []}, {"id": "b3-c22-l24", "t": "胃泌素：刺激、分泌處與標的", "sec": "s4", "slide": 42, "sourceSlides": [42], "sourcePages": [8], "src": "原PPT第 42 頁；課本 P51–53", "figSpec": {"image": "hormones"}, "txt": "<ul><li>食物及胃部刺激促進胃泌素釋放，胃泌素再促進胃液分泌。</li><li>激素由分泌細胞進入血液，作用於具有受器的標的。</li><li>腸抑胃泌素是教材的功能性總稱，不是一種獨立、唯一的分子。</li></ul><p class=\"think\">激素分泌在胃，就只能作用於製造它的那一顆細胞嗎？</p><div class=\"ex\"><h4>胃液還受激素控制</h4><p>兩類激素：胃泌素（促進）與腸抑胃泌素（抑制）。</p></div><div class=\"ex\"><h4>胃泌素</h4><ul><li>分泌處：胃幽門部上皮細胞。</li><li>刺激：食物中的肽類、酒精、咖啡因。</li><li>功能：刺激胃液分泌。</li></ul></div><div class=\"ex\"><h4>腸抑胃泌素（包括胰泌素、膽囊收縮素）</h4><ul><li>分泌處：十二指腸上皮細胞。</li><li>刺激：進入十二指腸的食糜過酸或脂質多。</li><li>功能：抑制胃液分泌和胃的蠕動。</li></ul></div><div class=\"ex\"><h4>深入解說：激素是怎麼「送貨」的</h4><p>胃泌素由<b>胃幽門部的內分泌細胞</b>製造，釋放到組織液後進入<b>血液</b>，隨血流到達全身，但只有帶有胃泌素<b>受體</b>的細胞（如胃腺的壁細胞）才會有反應，這些細胞稱為標的細胞。所以激素不是只在製造它的那顆細胞作用，而是「<b>遠距離、有選擇</b>」地傳遞訊息。</p></div><div class=\"ex\"><h4>刺激 → 激素 → 效果（本卡兩條）</h4><ul><li><b>胃泌素</b>：蛋白質分解的肽類、酒精、咖啡因 → 幽門部細胞分泌 → 促進胃液（含胃酸）分泌。</li><li><b>腸抑胃泌素</b>（胰泌素、CCK）：十二指腸中食糜過酸或脂質多 → 十二指腸細胞分泌 → 抑制胃液分泌與胃蠕動。</li></ul></div><div class=\"ex\"><h4>補充</h4><p>「腸抑胃泌素」是依功能歸類的名稱，不是單一分子，課本將胰泌素與膽囊收縮素歸於此類。</p></div>", "tb": [["BOOK8", "P52 完整課本頁"]]}, {"id": "b3-c22-l25", "t": "胰泌素與CCK：酸度和脂質的訊號", "sec": "s4", "slide": 43, "sourceSlides": [43, 44], "sourcePages": [], "src": "原PPT第 43–44 頁；課本 P51–53", "figSpec": {"image": "hormones"}, "txt": "<ul><li>酸性食糜促胰泌素，主要促進富含碳酸氫鹽的分泌。</li><li>脂質及蛋白水解產物促CCK，促胰酵素分泌及膽囊收縮。</li><li>膽汁製造、膽囊排空和胰液分泌是三個不同事件。</li></ul><p class=\"think\">兩種激素都影響胰臟，為何仍需分開記錄？</p><div class=\"ex\"><h4>胰液的調控</h4><ul><li><b>胰泌素</b>：酸性食糜刺激十二指腸上皮細胞分泌，刺激胰臟分泌富含碳酸氫鹽的胰液。</li><li><b>膽囊收縮素（CCK）</b>：脂質、多肽刺激十二指腸上皮細胞分泌，刺激胰臟分泌富含消化酶的胰液。</li></ul></div><div class=\"ex\"><h4>膽汁的調控</h4><ul><li>胰泌素：刺激肝臟分泌膽汁。</li><li>膽囊收縮素：刺激膽囊收縮，使膽汁排入十二指腸。</li></ul></div><div class=\"ex\"><h4>記憶方式</h4><p><b>酸</b> → 胰泌素 → 要中和 → 碳酸氫鹽；<b>脂質、多肽</b> → CCK → 要消化 → 消化酶、排膽汁。</p></div><div class=\"ex\"><h4>深入解說：兩種激素對應兩種需求</h4><p>十二指腸需要解決兩個問題：①食糜太<b>酸</b>→ 要中和；②食糜含<b>脂質與蛋白質</b>→ 要消化。<b>胰泌素</b>對付第一個問題：酸 → 促進胰臟分泌大量碳酸氫鹽（也促進肝分泌膽汁）。<b>膽囊收縮素（CCK）</b>對付第二個問題：脂質、肽 → 促進胰臟分泌酵素，並使膽囊收縮排出膽汁。這是典型的「<b>需要什麼就送什麼</b>」的回饋。</p></div><div class=\"ex\"><h4>三個不同的事件</h4><ul><li><b>膽汁製造</b>（肝）：胰泌素促進。</li><li><b>膽囊排空</b>：CCK 促進。</li><li><b>胰液分泌</b>：胰泌素 → 碳酸氫鹽；CCK → 酵素。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>兩種激素都影響胰臟，為何仍需分開記錄？</p><p><b>答：</b>因為它們促進的是胰液的<b>不同成分</b>（碳酸氫鹽 vs 酵素），觸發條件也不同（酸 vs 脂質、肽），混在一起會誤判作用。</p></div>", "tb": []}, {"id": "b3-c22-l26", "t": "小腸局部調控：分泌與接觸", "sec": "s4", "slide": 45, "sourceSlides": [45], "sourcePages": [], "src": "原PPT第 45 頁；課本 P51–53", "figSpec": {"image": "PPT45S3"}, "txt": "<ul><li>食糜進入小腸會刺激局部受器與分泌反應。</li><li>腸神經與自主神經參與調節，不必每次都先經意識指揮。</li><li>增加液體與黏液有助水解環境和保護，不是單純增加食物濃度。</li></ul><p class=\"think\">如果只有消化酵素而缺少水，水解作用會有什麼限制？</p><div class=\"ex\"><h4>小腸液的調控</h4><p>主要受<b>神經系統</b>調控。進入小腸的食糜會刺激位於小腸黏膜層中的小腸腺，使小腸液分泌增加。</p></div><div class=\"ex\"><h4>對照</h4><p>唾液只受神經調控；胃液、胰液、膽汁受神經與激素共同調控；小腸液主要受神經（局部接觸刺激）調控。</p></div><div class=\"ex\"><h4>深入解說：小腸的「局部反射」</h4><p>小腸壁內有自己的神經網路（腸神經系統），食糜接觸腸壁、腸壁被拉伸時，不需要大腦介入，局部就會增加小腸液分泌和腸蠕動。這就是課本說的「<b>主要受神經調控</b>」：由局部接觸刺激決定。小腸液的分泌量大，成人每天可達約 1～2 L，但大部分很快被重新吸收。</p></div><div class=\"ex\"><h4>四種消化液的調控方式對照</h4><ul><li>唾液：只受神經。</li><li>胃液：神經＋激素（胃泌素促進、腸抑胃泌素抑制）。</li><li>胰液、膽汁：神經＋激素（胰泌素、CCK）。</li><li>小腸液：主要受局部神經。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>如果只有消化酵素而缺少水，水解作用會有什麼限制？</p><p><b>答：</b>水解反應需要<b>水分子</b>參與，且酵素需在水溶液中才能與基質接觸；缺水時反應受限，所以小腸液提供水分很重要。</p></div>", "tb": []}, {"id": "b3-c22-l27", "t": "讀促進與抑制箭頭：協調排空", "sec": "s4", "slide": 46, "sourceSlides": [46, 47], "sourcePages": [], "src": "原PPT第 46–47 頁；課本 P51–53", "figSpec": {"image": "hormones"}, "txt": "<ul><li>先讀刺激→分泌處→激素→標的反應，再讀圖中的＋與－。</li><li>小腸接受酸性或高脂食糜後，抑制胃的持續大量排空可協調加工能力。</li><li>酸經中和後原刺激減弱，是負回饋；作用有「增加」不等於正回饋。</li></ul><p class=\"think\">分泌增加卻削弱原刺激，應判定哪一類回饋？</p><div class=\"ex g\"><h4>圖 2－18　調節消化液分泌的激素</h4><p>圖中「＋」代表促進，「－」代表抑制。</p></div><div class=\"ex\"><h4>四個箭頭</h4><ul><li>胃幽門處細胞分泌胃泌素 → 經血液循環 → 刺激胃液分泌（＋）。</li><li>酸性食糜刺激胰泌素分泌；多肽與脂質刺激膽囊收縮素分泌。</li><li>胰泌素 → 胰液（富含碳酸氫鹽）、膽汁（＋）；膽囊收縮素 → 胰液（富含消化酶）、膽囊收縮（＋）。</li><li>胰泌素與膽囊收縮素合稱<b>腸抑胃泌素</b>，抑制胃液分泌和胃的蠕動（－）。</li></ul></div><div class=\"ex\"><h4>意義</h4><p>胃排空太快、食糜太酸或太油時，腸會抑制胃，讓食糜分段進入小腸、與消化液配合。</p></div><div class=\"ex\"><h4>深入解說：圖中的「＋」與「－」怎麼讀</h4><p>圖中以「＋」表示促進、「－」表示抑制。可以追蹤四條路：①食物肽等 → 幽門細胞 → 胃泌素 → 胃液（＋）；②酸 → 胰泌素 → 胰液（碳酸氫鹽）、膽汁（＋）；③脂質／肽 → CCK → 胰液（酵素）、膽囊收縮（＋）；④胰泌素＋CCK（腸抑胃泌素）→ 胃液與胃蠕動（－）。最後一條讓「胃送來的太多太酸」時，腸能叫胃「慢一點」。</p></div><div class=\"ex\"><h4>為什麼是負回饋</h4><ul><li>胰泌素使碳酸氫鹽增加 → 酸度降低 → 原來的「酸」刺激消失 → 胰泌素分泌減少。</li><li>腸抑胃泌素抑制胃排空 → 進入十二指腸的酸變少 → 刺激減弱。</li><li>「分泌增加」不等於正回饋；只要結果削弱了原刺激，就是負回饋。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>分泌增加卻削弱原刺激，應判定哪一類回饋？</p><p><b>答：</b><b>負回饋</b>。判斷標準是結果對原刺激的影響，而不是分泌量增加或減少。</p></div>", "tb": []}, {"id": "b3-c22-l28", "t": "吸收部位：小腸和大腸不是同等分工", "sec": "s5", "slide": 48, "sourceSlides": [48], "sourcePages": [], "src": "原PPT第 48 頁；課本 P54–55", "figSpec": {"image": "PPT48S3"}, "txt": "<ul><li>小腸是水與多數養分吸收的主要場所。</li><li>大腸吸收剩餘水分、離子及部分微生物產物，不是水的唯一吸收處。</li><li>教材胃可吸收酒精或部分物質；不表示胃是一般養分的主要吸收站。</li></ul><p class=\"think\">只說「大腸吸水」會漏掉哪個重要部位？</p><div class=\"ex\"><h4>各部位的吸收</h4><p>不同部位的吸收功能並不相同。</p></div><div class=\"ex\"><h4>依部位整理</h4><ul><li>口腔：無。</li><li>食道：無。</li><li>胃：酒精、某些藥物。</li><li>小腸：水和養分吸收的<b>最重要</b>部位。</li><li>大腸：剩餘的水、維生素及無機鹽。</li></ul></div><div class=\"ex\"><h4>小結</h4><p>小腸負責主要的吸收，大腸則回收剩餘的水、維生素與無機鹽，兩者不是同等分工。</p></div><div class=\"ex\"><h4>深入解說：吸收部位的比較</h4><p><b>小腸</b>：吸收量最大（每天約 9 L 液體進出，絕大多數水被小腸吸收）、種類最多（醣、胺基酸、脂質、維生素、無機鹽、水），因為有最大的吸收面積。<b>大腸</b>：回收殘餘的水與電解質，以及腸內菌產生的維生素 K、短鏈脂肪酸。<b>胃</b>：吸收有限，酒精與部分脂溶性藥物可以直接經胃壁吸收，這也是喝酒後很快有反應的原因。<b>口腔、食道</b>：一般不吸收（舌下含片是特例）。</p></div><div class=\"ex\"><h4>常見陷阱</h4><ul><li>不要說「大腸負責吸水」，卻忘了<b>小腸</b>才是吸水最多的地方。</li><li>「胃能吸收酒精」不等於「胃是主要吸收站」。</li><li>口腔與食道主要是運輸，不是吸收。</li></ul></div>", "tb": []}, {"id": "b3-c22-l29", "t": "褶皺、絨毛、微絨毛：三個尺度", "sec": "s5", "slide": 49, "sourceSlides": [49, 50], "sourcePages": [10], "src": "原PPT第 49–50 頁；課本 P54–55", "figSpec": {"image": "PPT49S3"}, "txt": "<ul><li>環狀褶皺是管壁折疊；絨毛由多個細胞形成；微絨毛是單一上皮細胞表面突起。</li><li>絨毛上皮為單層；其內有微血管網及乳糜管。</li><li>增加面積、縮短跨上皮距離與提供運輸管路，三種構造互相配合。</li></ul><p class=\"think\">微絨毛內也各有一條乳糜管嗎？</p><div class=\"ex\"><h4>擴大吸收面積的三個尺度</h4><p>小腸內壁有<b>環狀褶皺</b>，分布著許多指狀<b>絨毛</b>；絨毛上皮細胞又有微細的突起，稱為<b>微絨毛</b>（圖 2－19a），大幅增加表面積。</p></div><div class=\"ex\"><h4>絨毛的構造（圖 2－19b）</h4><ul><li>由單層柱狀上皮細胞（具微絨毛）構成。</li><li>絨毛腔內有<b>微血管網</b>，中央有一條<b>乳糜管</b>（微淋管的一種）。</li><li>微血管運輸水溶性養分，乳糜管運輸脂溶性養分。</li></ul></div><div class=\"ex\"><h4>深入解說：吸收面積如何被放大</h4><p>小腸的吸收面積靠「三級放大」：①<b>環狀褶皺</b>（管壁折疊，約 3 倍）；②<b>絨毛</b>（褶皺上指狀突起，約 10 倍）；③<b>微絨毛</b>（細胞膜突起，約 20 倍）。三者相乘約 600 倍，使小腸吸收面積達到約 200 平方公尺（接近一個網球場）。每條絨毛中央有微血管網與一條乳糜管，吸收後的養分可立即被帶走，維持濃度差，讓吸收持續進行。</p></div><div class=\"ex\"><h4>三個尺度比較</h4><ul><li><b>環狀褶皺</b>：器官層級，肉眼可見。</li><li><b>絨毛</b>：由多個細胞形成，約 0.5～1 mm。</li><li><b>微絨毛</b>：單一細胞表面突起，約 1 µm，需電子顯微鏡才看得清楚。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>微絨毛內也各有一條乳糜管嗎？</p><p><b>答：</b>沒有。微絨毛是細胞表面的突起，構造內是細胞骨架；乳糜管位於每條<b>絨毛</b>的中央。</p></div>", "tb": [["BOOK10", "P54 完整課本頁"]]}, {"id": "b3-c22-l30", "t": "葡萄糖吸收：梯度由哪裡來？", "sec": "s5", "slide": 51, "sourceSlides": [51, 52, 53], "sourcePages": [], "src": "原PPT第 51–53 頁；課本 P54–55", "figSpec": {"image": "water"}, "txt": "<ul><li>基底側Na⁺／K⁺幫浦耗ATP，維持細胞內較低的Na⁺。</li><li>頂端Na⁺與葡萄糖共同運輸利用梯度，屬次級主動運輸。</li><li>葡萄糖由基底側載體以促進性擴散離開；果糖進入的機制不同。</li></ul><p class=\"think\">共同運輸蛋白不直接分解ATP，為何仍不是被動的促進性擴散？</p><div class=\"scope-note\">原PPT52把Na⁺－葡萄糖共同運輸寫成促進性擴散，須修正分類；胺基酸、離子與維生素各有機制，不能用一種幫浦概括全部。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/23-7-chemical-digestion-and-absorption-a-closer-look\" target=\"_blank\" rel=\"noopener noreferrer\">養分運輸機制參考</a></div><div class=\"ex\"><h4>水溶性養分</h4><p>胺基酸、無機鹽、大多數單醣及水溶性維生素等。</p></div><div class=\"ex\"><h4>吸收路徑</h4><ul><li>由小腸腔進入絨毛上皮細胞：主要靠<b>主動運輸</b>。</li><li>由上皮細胞進入絨毛腔：靠<b>促進性擴散</b>。</li><li>進入絨毛腔後，擴散進入微血管。</li></ul></div><div class=\"ex\"><h4>以葡萄糖為例（圖 2－19）</h4><ul><li>(a) Na⁺-K⁺ 幫浦以主動運輸方式（耗 ATP）建立細胞內的 Na⁺ 濃度梯度差。</li><li>(b) 利用 Na⁺－葡萄糖運輸蛋白，將葡萄糖以促進性擴散的方式帶入細胞內。</li><li>(c) 最後葡萄糖以促進性擴散方式送到絨毛腔。</li><li>綜合 (a) 與 (b)：搬運葡萄糖需要能量。</li></ul></div><div class=\"ex\"><h4>深入解說：葡萄糖是怎麼被「拉」進細胞的</h4><p>小腸腔中的葡萄糖濃度常低於細胞內，若只靠擴散進不來。身體的解法是兩步：<b>①基底側的 Na⁺－K⁺ 幫浦</b>消耗 ATP，把 Na⁺ 打出細胞，使細胞內 Na⁺ 濃度很低；<b>②頂端的共同運輸蛋白</b>讓 Na⁺ 順著濃度梯度流入細胞，同時把葡萄糖「<b>搭便車</b>」一起帶進去。這種利用另一種物質的梯度作為動力的運輸稱為<b>次級主動運輸</b>，最終的能量來源仍是 ATP。葡萄糖再經基底側的載體以促進性擴散離開細胞，進入組織液與微血管。</p></div><div class=\"ex\"><h4>分類提醒</h4><ul><li>課本圖把共同運輸蛋白那一步標為「促進性擴散」；較精確的分類是<b>次級（協同）主動運輸</b>，因為它逆著葡萄糖濃度梯度，且間接依賴 ATP 建立的鈉梯度。</li><li>整體而言，搬運葡萄糖<b>需要能量</b>，這也是課本結論。</li><li>胺基酸、離子、維生素各有不同的運輸蛋白，不能用同一種幫浦概括。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>共同運輸蛋白不直接分解 ATP，為何仍不是被動的促進性擴散？</p><p><b>答：</b>因為它利用的是由 ATP 建立的 <b>Na⁺ 濃度梯度</b>，能讓葡萄糖逆濃度梯度進入細胞；單純的促進性擴散只能順梯度。</p></div>", "tb": []}, {"id": "b3-c22-l31", "t": "肝門脈：先經肝，再回心", "sec": "s5", "slide": 54, "sourceSlides": [54, 55], "sourcePages": [11], "src": "原PPT第 54–55 頁；課本 P54–55", "figSpec": {"image": "portal"}, "txt": "<ul><li>絨毛微血管→肝門靜脈→肝臟微血管網→肝靜脈→下大靜脈→心臟。</li><li>門脈連接兩個微血管網；不是從肝臟流出的那條血管。</li><li>肝臟接收肝動脈和肝門靜脈供血，兩者都帶來氧與物質，比例與條件相關。</li></ul><p class=\"think\">用「進肝」與「出肝」標記，可如何分清三條血管？</p><div class=\"scope-note\">肝門靜脈也供應重要部分的氧，不能把供氧全部歸於肝動脈；門脈較低含氧量不等於完全無氧。</div><div class=\"ex\"><h4>肝門靜脈</h4><p>養分經消化道吸收後，<b>水溶性養分</b>會經由肝門靜脈運送到肝臟進行初步處理。肝門靜脈是除了肝動脈以外會進入肝臟的血管，是肝臟特有的循環路徑，稱為<b>肝門脈系統</b>，屬於體循環的一部分。</p></div><div class=\"ex\"><h4>水溶性養分的路徑</h4><ul><li>小腸絨毛的微血管 → 肝門靜脈 → 肝臟 → 肝靜脈 → 下大靜脈 → 心臟 → 全身。</li></ul></div><div class=\"ex\"><h4>小結</h4><p>消化道吸收的水溶性養分會先經過肝臟，再回到心臟。</p></div><div class=\"ex\"><h4>深入解說：肝臟的兩條入口</h4><p>肝臟同時接收兩條供血：<b>肝動脈</b>（來自主動脈，帶來充氧血，供應肝細胞氧氣）與<b>肝門靜脈</b>（來自消化道與脾臟，帶來剛吸收的養分，含氧量較低，但仍提供肝約一半的氧）。兩者在肝內的肝竇（特殊微血管）混合，與肝細胞交換物質後，經<b>肝靜脈</b>流出，匯入下大靜脈回心。肝門脈連接「兩個微血管網」：腸道的微血管網與肝臟的肝竇，所以叫門脈系統。</p></div><div class=\"ex\"><h4>先過肝的好處</h4><ul><li><b>代謝與儲存</b>：葡萄糖合成肝糖、其他單醣轉為葡萄糖。</li><li><b>解毒</b>：藥物、酒精、腸道吸收的有害物質在肝臟被分解。</li><li><b>調節血中養分濃度</b>：避免餐後血糖與胺基酸濃度驟升。</li><li><b>製造血漿蛋白</b>：如白蛋白。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>用「進肝」與「出肝」標記，可如何分清三條血管？</p><p><b>答：</b><b>肝動脈</b>、<b>肝門靜脈</b>＝進肝；<b>肝靜脈</b>＝出肝。肝門靜脈名稱含「門」，意思是它是進肝的門戶，並不是從肝流出的血管。</p></div>", "tb": [["BOOK11", "P55 完整課本頁"]]}, {"id": "b3-c22-l32", "t": "脂質包裝：乳糜微粒在細胞內形成", "sec": "s5", "slide": 56, "sourceSlides": [56, 57, 58], "sourcePages": [], "src": "原PPT第 56–58 頁；課本 P54–55", "figSpec": {"image": "lipids"}, "txt": "<ul><li>長鏈脂肪酸與單酸甘油酯進入上皮後，可再合成三酸甘油酯。</li><li>與蛋白質及其他脂質組裝成乳糜微粒，再由胞吐作用離開細胞。</li><li>乳糜微粒進入乳糜管；不能把未加工的大油滴直接塞進淋巴管。</li></ul><p class=\"think\">微膠粒和乳糜微粒的組成位置、作用及路徑是否相同？</p><div class=\"scope-note\">本圖是主要膳食長鏈脂質的簡化路徑。短鏈脂肪酸等可走門脈，脂質進細胞也涉及載體；不是所有脂質都只用同一路徑。</div><div class=\"ex\"><h4>脂溶性養分</h4><p>例如脂肪酸、單酸甘油酯。</p></div><div class=\"ex\"><h4>吸收路徑</h4><ul><li>由小腸腔進入絨毛上皮細胞：<b>簡單擴散</b>。</li><li>在上皮細胞內與蛋白質形成<b>乳糜微粒</b>。</li><li>由上皮細胞進入絨毛腔：<b>胞吐作用</b>。</li><li>經乳糜管壁的細胞間隙進入乳糜管。</li></ul></div><div class=\"ex\"><h4>圖中細胞內的步驟</h4><ul><li>(a) 單酸甘油酯與脂肪酸藉簡單擴散進入細胞。</li><li>(b) 有些單酸甘油酯和脂肪酸合成三酸甘油酯（內質網）。</li><li>(c) 脂質和蛋白質形成乳糜微粒（內質網、高基氏體）。</li><li>(d) 乳糜微粒藉胞吐作用進入絨毛腔。</li></ul></div><div class=\"ex\"><h4>深入解說：脂質吸收的四個動作</h4><p>①<b>膽鹽微膠粒</b>把單酸甘油酯與脂肪酸帶到上皮細胞表面；②它們以簡單擴散穿過細胞膜（脂溶性）；③進入細胞後，在<b>滑面內質網</b>重新組合成<b>三酸甘油酯</b>；④與蛋白質、磷脂質在粗糙內質網與高基氏體包裝成<b>乳糜微粒</b>，以胞吐作用釋出細胞。乳糜微粒的直徑約 0.1～1 µm，太大無法穿過微血管壁，只能進入乳糜管。</p></div><div class=\"ex\"><h4>微膠粒 vs 乳糜微粒</h4><ul><li><b>微膠粒</b>：在腸腔中，由膽鹽包著脂肪酸與單酸甘油酯，是運輸到上皮的「接駁車」，不進細胞。</li><li><b>乳糜微粒</b>：在上皮細胞內形成，裡面是重組的三酸甘油酯，是運出細胞的「包裹」。</li><li>兩者組成位置、功能與路徑都不同。</li></ul></div><div class=\"ex\"><h4>範圍提醒</h4><p>課本是長鏈脂質的簡化路徑。短鏈與中鏈脂肪酸較易溶於水，可直接進入微血管、經肝門脈運送，不一定經過乳糜微粒。</p></div>", "tb": []}, {"id": "b3-c22-l33", "t": "乳糜管：入口構造與顆粒大小", "sec": "s5", "slide": 59, "sourceSlides": [59, 60], "sourcePages": [], "src": "原PPT第 59–60 頁；課本 P54–55", "figSpec": {"image": "lacteal"}, "txt": "<ul><li>乳糜管是微淋巴管，重疊內皮入口及不連續基底膜有助顆粒進入。</li><li>一般絨毛血管與乳糜管的屏障不同，乳糜微粒主要進淋巴。</li><li>盲端表示末端不與另一血管接通，不表示管壁整面密封。</li></ul><p class=\"think\">同樣由單層細胞構成，為何不能推定兩種管壁通透性相同？</p><div class=\"ex\"><h4>為什麼脂溶性養分走乳糜管</h4><p>主要是因為微血管與乳糜管的<b>構造</b>不同（知識補給站）。</p></div><div class=\"ex\"><h4>比較</h4><ul><li><b>微血管</b>：單層內皮細胞，外面有基底膜，會阻隔乳糜微粒通過。</li><li><b>乳糜管</b>（微淋管的一種）：單層內皮細胞，基底膜較薄而不連續，內皮細胞部分交疊，形成<b>狹縫狀的開口</b>。</li></ul></div><div class=\"ex\"><h4>結論</h4><p>乳糜微粒無法通過微血管，但可以通過乳糜管壁的細胞間隙進入乳糜管，再被運送。</p></div><div class=\"ex\"><h4>深入解說：為什麼是乳糜管，不是微血管</h4><p>乳糜微粒很大，要通過一道屏障才能被運走。<b>微血管</b>的內皮細胞緊密相連，外有連續的基底膜，乳糜微粒過不去；<b>乳糜管</b>是微淋管，內皮細胞像屋瓦一樣部分重疊，形成「單向小門」，外側基底膜也不連續，大顆粒可以擠進去。所以大的脂質顆粒走淋巴，小的水溶性分子走血液。</p></div><div class=\"ex\"><h4>兩種管道比較</h4><ul><li>微血管：基底膜完整，通透性選擇性高，適合水溶性小分子。</li><li>乳糜管：基底膜不連續、內皮重疊，通透性高，適合大分子、顆粒。</li><li>兩者都是單層細胞，但「單層」不等於「通透性相同」，細胞連接方式與基底膜才是關鍵。</li></ul></div>", "tb": []}, {"id": "b3-c22-l34", "t": "脂質回到血液：先走淋巴的迴路", "sec": "s5", "slide": 61, "sourceSlides": [61], "sourcePages": [], "src": "原PPT第 61 頁；課本 P54–55", "figSpec": {"image": "portal"}, "txt": "<ul><li>乳糜管→較大淋巴管→胸管→左側靜脈交界→上大靜脈→右心房。</li><li>之後再循血液迴路到全身；教材圖省略肺循環，不能直接畫右心房到主動脈。</li><li>先避開肝門脈首站，不等於終生不經肝；殘粒仍可被肝處理。</li></ul><p class=\"think\">「淋巴先回心」與「永遠繞過肝臟」為何不同？</p><div class=\"ex\"><h4>脂溶性養分的路徑</h4><p>乳糜微粒進入乳糜管後，走的是<b>淋巴循環</b>，不先經過肝臟。</p></div><div class=\"ex\"><h4>路徑</h4><ul><li>小腸絨毛的乳糜管 → 較大的淋巴管 → 胸管（左淋巴總管）→ 上大靜脈 → 心臟 → 全身。</li></ul></div><div class=\"ex\"><h4>對照水溶性養分</h4><p>水溶性：微血管 → 肝門靜脈 → 肝臟 → 肝靜脈 → 下大靜脈 → 心臟；脂溶性：乳糜管 → 淋巴 → 上大靜脈 → 心臟。兩條路徑進入心臟的血管不同。</p></div><div class=\"ex\"><h4>深入解說：脂溶性養分的路徑</h4><p>乳糜管 → 較大的淋巴管 → 胸管（左淋巴總管）→ 左鎖骨下靜脈 → 上大靜脈 → 右心房 → 右心室 → 肺循環 → 左心房 → 左心室 → 全身。課本簡圖省略肺循環，所以看起來像右心房直接到全身，實際上要先經過肺才能回到左心室。進入血液後，乳糜微粒中的三酸甘油酯會被血管壁上的酵素（脂蛋白脂酶）水解，供脂肪組織、肌肉利用，殘餘的粒子最後才被肝臟吸收。</p></div><div class=\"ex\"><h4>兩條路徑對照</h4><ul><li><b>水溶性</b>：絨毛微血管 → 肝門靜脈 → 肝臟 → 肝靜脈 → 下大靜脈 → 右心房。</li><li><b>脂溶性</b>：乳糜管 → 淋巴 → 胸管 → 上大靜脈 → 右心房。</li><li>兩者匯入心臟的血管不同，且脂溶性路徑先避開肝門脈這一站。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>「淋巴先回心」與「永遠繞過肝臟」為何不同？</p><p><b>答：</b>淋巴路徑只是避開了<b>第一次</b>通過肝門脈；脂質進入全身循環後，血液仍會流經肝臟，乳糜微粒殘粒也由肝臟處理。</p></div>", "tb": []}, {"id": "b3-c22-l35", "t": "腦力激盪：肝門脈缺席的推論範圍", "sec": "s6", "slide": 62, "sourceSlides": [62], "sourcePages": [], "src": "原PPT第 62 頁；課本 P54–55／原題", "figSpec": {"image": "portal"}, "txt": "<ul><li>肝門脈讓腸道吸收的多種物質先經肝臟代謝、儲存與處理。</li><li>若先進全身循環，首次通過肝臟的順序改變；血中濃度需依物質及條件推論。</li><li>正常可溶性養分不會只因未先經肝，就在微血管末端直接堵塞。</li></ul><p class=\"think\">由「失去第一站的代謝」到「造成堵塞」，還缺少哪些證據？</p><div class=\"scope-note\">原PPT62「人體無法吸收的雜質進入血液」與「大量養分堵塞微血管」不作為本題的可靠推論。若能從腸腔進血就已被吸收；肝處理也不是全部物質都能完全去除。</div><div class=\"ex\"><h4>腦力激盪</h4><p>若消化道與肝臟之間沒有肝門靜脈，而是血液流經消化道後先回心、再循環全身，可能有什麼影響？</p></div><div class=\"ex\"><h4>參考答案的要點</h4><p>肝門靜脈的主要功能，是把消化道吸收的養分送到肝臟<b>代謝與儲存</b>；其中也包含人體無法利用的雜質、毒素，這些物質會先在肝臟<b>解毒</b>。若沒有這一步，有害物質可能隨血液流經全身，危害組織與器官。</p></div><div class=\"ex\"><h4>小提醒</h4><p>原簡報答案還提到大量養分可能堵塞微血管末端；這個推論超出課本內容，不宜當作一定會發生的結果。推論時要區分「課本明確寫出的功能」與「進一步的推測」。</p></div><div class=\"ex\"><h4>深入解說：怎麼回答這類「推論題」</h4><p>建議用三段式：①<b>課本明確寫出的事實</b>（肝門脈讓養分先到肝臟，肝臟負責代謝、儲存與解毒）；②<b>假設改變後的邏輯結果</b>（沒有肝門脈 → 小腸血液先回心再到全身 → 吸收的物質不經肝臟處理就進入全身）；③<b>可能後果</b>（未經解毒的物質、藥物、毒素濃度較高；餐後血糖與血中養分波動可能更大）。不要寫課本沒有依據的推論，例如「養分會堵塞微血管」。</p></div><div class=\"ex\"><h4>區分事實與推測</h4><ul><li>事實：肝臟能代謝、儲存養分，並解毒。</li><li>合理推論：缺少首次通過肝臟的處理，有害物質可能直接進入全身。</li><li>超出範圍：養分堵塞微血管——這不是課本內容，也沒有生理依據。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>由「失去第一站的代謝」到「造成堵塞」，還缺少哪些證據？</p><p><b>答：</b>缺少證明養分<b>會</b>在微血管末端聚集並阻塞的機制與數據。能被吸收進血液的小分子本來就是溶解狀態，並不會因為沒經肝臟就堵塞。</p></div>", "tb": []}, {"id": "b3-c22-l36", "t": "原題一：甲乙丙丁與戊的角色", "sec": "s6", "slide": 63, "sourceSlides": [63, 64], "sourcePages": [], "src": "原PPT第 63–64 頁；課本 P54–55／原題", "figSpec": {"image": "originalAbsorb"}, "txt": "<ul><li>甲是題圖的主動運輸模型，乙促進性擴散；丙簡單擴散，丁胞吐。</li><li>戊為乳糜微粒，在上皮細胞內組裝，原題正答C。</li><li>依此圖分類，胞吐與載體型主動運輸分開；胞吐仍需能量。</li></ul><p class=\"think\">耗能就一定屬題目所稱的「主動運輸」嗎？</p><div class=\"ex\"><h4>原題一（原簡報第 63 頁）</h4><p>圖為小腸養分吸收示意圖：甲、乙為水溶性養分吸收的主要方式，丙、丁為脂溶性養分吸收的方式。下列敘述何者正確？</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 從小腸腔進入絨毛上皮細胞的方式，甲、丙皆須消耗能量</li><li>(B) 從絨毛上皮細胞離開進入絨毛腔的方式，乙、丁皆不耗能</li><li>(C) 戊在絨毛上皮細胞內才合成</li><li>(D) 甲、丁都屬於主動運輸</li></ul></div><div class=\"ex\"><h4>答案：(C)</h4><p>先辨認：甲為主動運輸、乙為促進性擴散、丙為簡單擴散、丁為胞吐作用、戊為乳糜微粒。乳糜微粒是在上皮細胞內形成的。</p></div><div class=\"ex\"><h4>其他選項</h4><ul><li>(A) 丙是簡單擴散，不耗能。</li><li>(B) 乙是促進性擴散，不耗能；丁是胞吐作用，需耗能。</li><li>(D) 丁是胞吐作用，是大分子離開細胞的方式，不是主動運輸。</li></ul></div><div class=\"ex\"><h4>深入解說：先分類再逐項判斷</h4><p>解這類圖形題的順序：①依題幹判斷甲乙是水溶性、丙丁是脂溶性；②分類：甲＝主動運輸（耗能，逆梯度）、乙＝促進性擴散（不耗能，需載體）、丙＝簡單擴散（不耗能，不需載體）、丁＝胞吐作用（耗能，大分子出細胞）、戊＝乳糜微粒。③「從腔進入上皮」的步驟是甲、丙；「從上皮進入絨毛腔」的步驟是乙、丁。④逐項核對耗能與否。</p></div><div class=\"ex\"><h4>三種跨膜方式的快速比較</h4><ul><li>簡單擴散：順梯度、不耗能、不需載體（脂溶性小分子）。</li><li>促進性擴散：順梯度、不耗能、需載體（如葡萄糖離開細胞）。</li><li>主動運輸：逆梯度、耗能、需載體。</li><li>胞吐／胞吞：大分子或顆粒，耗能，不歸類為本題的「主動運輸」。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>耗能就一定屬題目所稱的「主動運輸」嗎？</p><p><b>答：</b>不一定。本題把<b>胞吐</b>另外分類；胞吐雖然耗能，但運輸的是被膜包裹的大分子，與載體蛋白逆梯度運輸不同。</p></div>", "tb": []}, {"id": "b3-c22-l37", "t": "原題二：肝胰膽的分泌物流向", "sec": "s6", "slide": 65, "sourceSlides": [65, 66], "sourcePages": [], "src": "原PPT第 65–66 頁；課本 P54–55／原題", "figSpec": {"image": "originalOrgans"}, "txt": "<ul><li>甲肝臟、乙膽汁、丙膽囊、丁胰液、戊胰臟；己膽管、庚胰管、辛共同開口、壬十二指腸。</li><li>肝臟分泌膽汁並可儲存肝醣，原題正答A。</li><li>胰液走胰管入腸；胰島激素進血，是外分泌與內分泌的區別。</li></ul><p class=\"think\">「胰臟有內分泌」能證明胰液也進血嗎？</p><div class=\"ex\"><h4>原題二（原簡報第 65 頁）</h4><p>右圖為消化系統構造示意圖，其中乙、丁為分泌物。下列敘述何者正確？</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 甲構造是人體最大的腺體，可以分泌消化液及儲存醣類</li><li>(B) 乙消化液會暫存在丙當中，等到酸性食糜進入壬再排出，以便活化乙中的酵素</li><li>(C) 戊構造具有內分泌和外分泌的功能，所分泌的丁物質可以進入庚送到血液循環中</li><li>(D) 食物的消化從胃開始，到了壬部位幾乎已經完成消化吸收的工作</li></ul></div><div class=\"ex\"><h4>答案：(A)</h4><p>先辨認：甲肝臟、乙膽汁、丙膽囊、丁胰液、戊胰臟、己膽管、庚胰管、辛膽管與胰管的共同開口、壬十二指腸。肝臟是人體最大的腺體，可分泌膽汁並儲存肝糖。</p></div><div class=\"ex\"><h4>其他選項</h4><ul><li>(B) 膽汁不含酵素，含膽鹽，可乳化脂質。</li><li>(C) 胰臟有內分泌與外分泌功能，但胰液是進入十二指腸，不進入血液循環。</li><li>(D) 消化從口腔開始；十二指腸是主要消化部位，吸收則還包含之後的小腸。</li></ul></div><div class=\"ex\"><h4>深入解說：肝、胰、膽的導管系統</h4><p>肝臟製造膽汁 → 經肝管、膽管；沒有進食時流入膽囊儲存，進食時經膽管與胰管匯合處的共同開口（壺腹）進入十二指腸。胰臟有兩種功能：<b>外分泌</b>——胰液（消化液）經胰管進入十二指腸；<b>內分泌</b>——胰島分泌胰島素、升糖素，直接進入血液（見 1-2）。所以「胰臟有內分泌」不能推論「胰液進血液」。</p></div><div class=\"ex\"><h4>逐項核對</h4><ul><li>(A) 肝臟是人體最大的腺體，分泌膽汁、儲存肝糖。✔</li><li>(B) 膽汁不含酵素，所以沒有「活化酵素」的問題。</li><li>(C) 胰液經胰管進入十二指腸，不進血液。</li><li>(D) 消化從口腔就開始，十二指腸並非吸收的終點。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>「胰臟有內分泌」能證明胰液也進血嗎？</p><p><b>答：</b>不能。內分泌產物（胰島素、升糖素）進血；外分泌產物（胰液）經導管進十二指腸，是兩套不同的輸出方式。</p></div>", "tb": []}, {"id": "b3-c22-l38", "t": "原題三：混合產物是條件證據", "sec": "s6", "slide": 67, "sourceSlides": [67, 68, 69], "sourcePages": [], "src": "原PPT第 67–69 頁；課本 P54–55／原題", "figSpec": {"image": "originalMix"}, "txt": "<ul><li>原題模型推得W膽汁、X唾液、Y胃液、Z胰液；正答A、C、D。</li><li>較小脂肪顆粒是乳化線索；單酸甘油酯與脂肪酸才是水解線索。</li><li>含Y的混合液未充分水解某基質，不能直接說其他液體沒該酵素。</li></ul><p class=\"think\">要驗證酵素來源，還需要控制pH、時間、溫度和用量中的哪些量？</p><div class=\"scope-note\">依原題條件作答，答案不改。實際混合實驗須量pH與活性；原PPT69「胃液會分解其他消化液酵素」不是所有條件下都能單憑產物證明的唯一機制。</div><div class=\"ex\"><h4>原題三（原簡報第 67 頁）</h4><p>小翰取得病患的不同消化液 W、X、Y、Z（來源紀錄遺失，只知沒有腸液），把澱粉、蛋白質、脂肪等養分加入不同消化液的混合液，兩兩交叉比對得到產物表。下列哪些正確？（多選）</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) W 可能是膽汁</li><li>(B) X 的消化液中具有脂肪酶</li><li>(C) Y 的消化液中具有蛋白酶</li><li>(D) 若在 X＋Z 兩組中多加入 W 消化液，單酸甘油酯的含量會提高</li><li>(E) Z 的消化液同時具有物理性消化與化學性消化的功能</li></ul></div><div class=\"ex\"><h4>答案：(A)(C)(D)</h4><p>W 是膽汁、X 是唾液、Y 是胃液、Z 是胰液。W 能使脂肪變成較小顆粒（乳化），所以是膽汁。</p></div><div class=\"ex\"><h4>其他選項</h4><ul><li>(B) X 能分解澱粉，應含澱粉酶，不是脂肪酶。</li><li>(E) Z 是胰液，能分解澱粉、蛋白質與脂肪，只有化學性消化，沒有物理性消化。</li></ul></div><div class=\"ex\"><h4>解題線索</h4><p>Y（胃液）為強酸，且含蛋白酶，會把混合液中其他消化液的酵素分解，所以含 Y 的組合產物會有所不同。解題時要把「產物」當作條件證據，一組一組比對。</p></div><div class=\"ex\"><h4>深入解說：把表格當成「偵探線索」</h4><p>這題給的是混合後的產物表，要反推 W、X、Y、Z。推理線索：<b>W</b> 使脂肪變成「較小顆粒」但沒有產生新的小分子 → 乳化 → 膽汁；<b>X</b> 能分解澱粉 → 澱粉酶；沒有蛋白酶與脂酶的證據 → 唾液；<b>Y</b> 能分解蛋白質 → 蛋白酶；在強酸中才有活性 → 胃液；<b>Z</b> 能分解澱粉、蛋白質、脂肪 → 胰液。注意題目說「沒有腸液」，這是重要的排除條件。</p></div><div class=\"ex\"><h4>為什麼加入 W 會使單酸甘油酯增加</h4><ul><li>單酸甘油酯是胰脂酶水解脂肪的產物（Z 含脂酶）。</li><li>加入膽汁（W）會把脂肪乳化成更小的油滴，增加胰脂酶接觸面積，水解更多 → 單酸甘油酯增加。</li><li>所以 (D) 正確。</li></ul></div><div class=\"ex\"><h4>範圍提醒</h4><p>實際混合實驗必須控制 pH、時間、溫度與用量，才能嚴謹比較酵素活性；胃液強酸可使其他酵素失活，是混合液產物不同的合理原因之一，但不是所有條件都能單憑產物就證明唯一機制。</p></div>", "tb": []}], "questions": [{"t": "物理與化學性消化", "q": "將六種變化依是否水解化學鍵歸類。", "learn": 1, "tag": "enzyme", "hint": "顆粒、油滴與分子不是相同尺度。", "why": "乳化使接觸面積增加，但不把三酸甘油酯切成產物；水解才改變分子。", "sub": "原PPT第 4–5 頁；課本 P45–46", "refs": [{"src": "PPT05S3", "cap": "教材來源圖"}], "kind": "drag", "slots": [{"id": "g0s0", "label": "物理性消化", "group": 0}, {"id": "g0s1", "label": "物理性消化", "group": 0}, {"id": "g0s2", "label": "物理性消化", "group": 0}, {"id": "g1s0", "label": "化學性消化", "group": 1}, {"id": "g1s1", "label": "化學性消化", "group": 1}, {"id": "g1s2", "label": "化學性消化", "group": 1}], "pi g4s0", "g5s0": "ag5s0"}, "pre": {}, "id": "b3-c22-q13"}, {"t": "路徑說法的限定", "q": "哪些敘述保留了必要條件？（選3項）", "learn": 34, "tag": "transport", "hint": "不要用「所有」「永遠」取代條件。", "why": "顆粒形式、物質種類與推論的證據要保留；淋巴先回靜脈，小腸是主要吸水處。", "sub": "原PPT第 62 頁；課本 P54–55／原題", "refs": [{"src": "portal", "cap": "教材來源圖"}], "kind": "multi", "opts": [{"t": "乳糜微粒先走淋巴，殘粒仍可被肝處理", "ok": true, "tag": "transport"}, {"t": "所有淋巴最後直接倒入左心室", "ok": false, "tag": "transport"}, {"t": "大腸是全身唯一吸收水分的場所", "ok": false, "tag": "transport"}, {"t": "短鏈脂肪酸等可由門脈輸送", "ok": true, "tag": "transport"}, {"t": "可溶性養分不會只因先不經肝就直接堵塞", "ok": true, "tag": "transport"}], "fig": "portal", "figCaption": "教材原圖", "id": "b3-c22-q18"}, {"t": "原題一：養分吸收示意圖", "q": "下圖是小腸養分吸收的示意圖，甲、乙為水溶性養分吸收的主要方式，丙、丁為脂溶性養分吸收的方式。請根據本圖判斷下列敘述何者正確？", "learn": 35, "tag": "absorb", "hint": "先依圖中界線辨認進入、離開與細胞內形成。", "why": "原PPT63–64正答C。甲為主動運輸模型、乙促進性擴散、丙簡單擴散、丁胞吐、戊乳糜微粒。胞吐需能量，但在本題與載體型主動運輸分開分類。", "sub": "原PPT第 63–64 頁；課本 P54–55／原題", "refs": [{"src": "originalAbsorb", "cap": "教材來源圖"}], "kind": "single", "opts": [{"t": "從小腸腔進入絨毛上皮細胞的方式，甲、丙皆須消耗能量", "ok": false, "tag": "absorb"}, {"t": "從絨毛上皮細胞離開進入絨毛腔的方式乙、丁皆不耗能", "ok": false, "tag": "absorb"}, {"t": "戊在絨毛上皮細胞內才合成", "ok": true, "tag": "absorb"}, {"t": "甲、丁都屬於主動運輸", "ok": false, "tag": "absorb"}], "fig": "originalAbsorb", "figCaption": "原PPT63：左側葡萄糖、胺基酸等；右側脂肪酸、單酸甘油酯等", "originalPPTQuestion": "1", "id": "b3-c22-q19"}, {"t": "原題二：消化系統構造", "q": "右圖為消化系統構造示意圖，其中乙、丁為分泌物，下列敘述何者正確？", "learn": 36, "tag": "enzyme", "hint": "以導管流向與分泌物性質核對。", "why": "原PPT65–66正答A。甲肝、乙膽汁、丙膽囊、丁胰液、戊胰。膽汁無酵素；胰液入十二指腸不進血，消化從口腔開始，吸收也不只在十二指腸。", "sub": "原PPT第 65–66 頁；課本 P54–55／原題", "refs": [{"src": "originalOrgans", "cap": "教材來源圖"}], "kind": "single", "opts": [{"t": "乙消化液會暫存在丙當中，等到酸性食糜進入壬再排出，以便活化乙中的酵素", "ok": false, "tag": "enzyme"}, {"t": "戊構造具有內分泌和外分泌的功能，所分泌的丁物質可以進入庚送到血液循環中", "ok": false, "tag": "enzyme"}, {"t": "食物的消化從胃開始，到了壬部位幾乎已經完成消化吸收的工作", "ok": false, "tag": "enzyme"}, {"t": "甲構造是人體最大的腺體，可以分泌消化液及儲存醣類", "ok": true, "tag": "enzyme"}], "fig": "originalOrgans", "figCaption": "原PPT原圖", "originalPPTQuestion": "2", "id": "b3-c22-q20"}, {"t": "原題三：消化液交叉比對", "q": "小翰在醫學院取得病患的不同消化液進行分析，但編號 W、X、Y、Z 的消化液來源紀錄遺失了，僅知樣本中沒有腸液。小翰將澱粉、蛋白質、脂肪等養分加入不同消化液的混合液，進行交叉比對後得到右側表格，請問下列敘述哪些正確？", "learn": 37, "tag": "evidence", "hint": "先對照出現「較小脂肪顆粒」的組合，再看水解產物；未水解不等於沒有酵素。", "why": "原PPT67–69正答A、C、D。W膽汁、X唾液、Y胃液、Z胰液。W提供乳化、Y提供蛋白酶；依原題模型加入W可助胰脂酶接觸基質。含Y時產物須連同酸度解釋，實際實驗應控制pH、反應時間、溫度與酵素用量。", "sub": "原PPT第 67–69 頁；課本 P54–55／原題", "refs": [{"src": "originalMix", "cap": "教材來源圖"}], "kind": "multi", "opts": [{"t": "W 可能是膽汁", "ok": true, "tag": "evidence"}, {"t": "X 的消化液中具有脂肪酶", "ok": false, "tag": "evidence"}, {"t": "Y 的消化液中具有蛋白酶", "ok": true, "tag": "evidence"}, {"t": "若在 X＋Z 兩組中多加入 W 消化液，單酸甘油酯的含量會提高", "ok": true, "tag": "evidence"}, {"t": "Z 的消化液同時具有物理性消化與化學性消化的功能", "ok": false, "tag": "evidence"}], "fig": "originalMix", "figCaption": "原PPT68完整資料表 · 文字忠實重排", "originalPPTQuestion": "3", "originalPrompt": "小翰在醫學院取得病患的不同消化液進行分析，但編號 W、X、Y、Z 的消化液來源紀錄遺失了，僅知樣本中沒有腸液。小翰將澱粉、蛋白質、脂肪等養分加入不同消化液的混合液，進行交叉比對後得到下頁表格，請問下列敘述哪些正確？", "sourceTable": [["W+X", "麥芽糖、蛋白質、較小脂肪顆粒"], ["W+Y", "澱粉、多肽、較小脂肪顆粒"], ["W+Z", "麥芽糖、多肽、單酸甘油酯、脂肪酸"], ["X+Y", "麥芽糖、多肽、脂肪"], ["Y+Z", "麥芽糖、多肽、脂肪"], ["X+Z", "麥芽糖、多肽、單酸甘油酯、脂肪酸"]], "id": "b3-c22-q21"}, {"t": "腦力激盪：用證據修正推論", "q": "若腸道血液先回心再經全身，記錄肝處理順序可能如何改變，並指出圖中不能直接證明的影響。", "learn": 34, "tag": "evidence", "hint": "先寫正常的門脈路徑，再區分代謝順序、濃度與堵塞等不同推論。", "why": "本題保存討論紀錄，不自動判分。", "sub": "原PPT第 62 頁；課本 P54–55／原題", "refs": [{"src": "portal", "cap": "教材來源圖"}], "kind": "reflection", "fig": "portal", "reflectionLabel": "你的證據與推論", "reflectionPlaceholder": "正常路徑：…\n順序改變可能影響：…\n仍需證據：…", "reviewPrompts": ["標出進肝與出肝的血管", "區分代謝順序與濃度測量", "不把未經肝直接等同血管堵塞"], "id": "b3-c22-q22"}], "tags": {"structure": ["構造與運動", "連結管壁位置、運動方式與功能。", "原PPT第 17–19 頁；課本 P46–48"], "enzyme": ["酵素與消化", "區分來源、基質、產物和作用環境。", "原PPT第 37–38 頁；課本 P49–51"], "hormone": ["神經與激素", "追蹤刺激、分泌處及標的反應。", "原PPT第 46–47 頁；課本 P51–53"], "absorb": ["跨膜吸收", "分清ATP、梯度、載體與胞吐。", "原PPT第 51–53 頁；課本 P54–55"], "transport": ["血液與淋巴", "依顆粒及血管連接追蹤路徑。", "原PP 此外來自消化道的大量營養若未經過處理與吸收，也可能在流經心臟等處的微血管時造成微血管末端堵塞，嚴重可能危害生命。\n62", "63": "  \nQuestion\n1\n. \n下圖是小腸養分吸收的示意圖，甲、乙為水溶性養分吸收的主要方式，丙、丁為脂溶性養分吸收的方式。請根據本圖判斷下列敘述何者正確？\n(A)\n從小腸腔進入絨毛上皮細胞的方式，甲、丙皆須消耗能量　\n(B)\n從絨毛上皮細胞離開進入絨毛腔的方式乙、丁皆不耗能　\n(C)\n戊在絨毛上皮細胞內才合成　\n(D)\n甲、丁都屬於主動運輸。\n63\n解答\n：\n(C)\n小腸腔\n絨毛上皮細胞\n絨毛腔\n葡萄糖、胺基酸等水溶性養分\n脂肪酸、單酸甘油酯等脂溶性養分", "64": "  \nQuestion\n解析\n：\n甲為主動運輸、乙為促進性擴散、丙為簡單擴散、丁為胞吐作用、戊為乳糜微粒。\n(A)\n丙為簡單擴散，不耗能。\n(B)\n乙為促進性擴散，不耗能；丁為胞吐作用，需耗能。\n(D)\n丁為胞吐作用，是大分子離開細胞的方式，非主動運輸。\n64", "65": "  \nQuestion\n2.\n \n右\n圖為消化系統構造示意圖，其中乙、丁為分泌物，下列敘述何者正確？　\n(A)\n甲構造是人體最大的腺體，可以分泌消化液及儲存醣類　\n(B)\n乙消化液會暫存在丙當中，等到酸性食糜進入壬再排出，以便活化乙中的酵素　\n(C)\n戊構造具有內分泌和外分泌的功能，所分泌的丁物質可以進入庚送到血液循環中　\n\n(\nD)\n食物的消化從胃開始，到了壬部位幾乎已經完成消化吸收的工作。\n解答\n：\n(\nA\n)\n65", "66": "  \nQuestion\n解析\n：\n甲\n為肝臟、乙為膽汁、丙為膽囊、丁為胰液、戊為胰臟、己為膽管、庚為胰管、辛為\n膽管與胰管的共同\n開口、壬為\n十二指腸。\n(B)\n膽汁中不含酵素，但是含有膽鹽可乳化脂質。\n(C)\n胰臟具有內分泌和外分泌的功能，所分泌的胰液是進入十二指腸中，而不進入血液循環。\n(D)\n食物的消化從口腔開始，到了壬（十二指腸）是主要消化的部位，而吸收則不只在壬（十二指腸），應該還包含壬（十二指腸）之後的小腸部位。\n66", "67": "  \nQuestion\n3. \n小翰在醫學院取得病患的不同消化液進行分析，但編號 \nW\n、\nX\n、\nY\n、\nZ \n的消化液來源紀錄遺失了，僅知樣本中沒有腸液。小翰將澱粉、蛋白質、脂肪等養分加入不同消化液的混合液，進行交叉比對後得到下頁表格，請問下列敘述哪些正確？\n67", "68": "  \nQuestion\n(A) W \n可能是膽汁\n　\n(B) X \n的消化液中具有脂肪酶　\n(C) Y \n的消化液中具有蛋白酶　\n(D)\n若在 \nX\n＋\nZ \n兩組中多加入 \nW \n消化液，單酸甘油酯的含量會提高　\n(E) \nZ\n 的\n消化液同時具有物理性消化與化學性消化的功能。\n解答\n：\n(A)(C)(D)\n消化液\n與消化液作用的產物\nW+X\n麥芽糖、蛋白質、較小脂肪顆粒\nW+Y\n澱粉、多肽、較小脂肪顆粒\nW+Z\n麥芽糖、多肽、單酸甘油酯、脂肪酸\nX+Y\n麥芽糖、\n多肽、脂肪\nY+Z\n麥芽糖、\n多肽、脂肪\nX+Z\n麥芽糖、多肽、單酸甘油酯、脂肪酸\n68", "69": "  \nQuestion\n解析\n：\nW \n為膽汁、\nX \n為唾液、\nY \n為胃液、\nZ \n為胰液。\nY\n（胃液）為強酸，且具有蛋白酶，會將環境中其他消化液中的酵素分解。\n(B) X \n可分解澱粉，應具有澱粉酶。\n(E) \nZ\n 可\n將脂肪分解為單酸甘油酯及脂肪酸，且可分解澱粉與蛋白質，應為胰液，胰液不具物理性消化功能。\n69"}, "originalCount": 1, "legacyCount": 8, "originalPPTQuestions": {"1": [2], "2": [0], "3": [0, 2, 3]}, "references": [{"title": "absorb", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/23-7-chemical-digestion-and-absorption-a-closer-look"}, {"title": "accessory", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/23-6-accessory-organs-in-digestion-the-liver-pancreas-and-gallbladder"}, {"title": "stomach", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/23-4-the-stomach"}, {"title": "intestine", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/23-5-the-small-and-large-intestines"}, {"title": "animals", "url": "https://openstax.org/books/biology-2e/pages/34-1-digestive-systems"}, {"title": "process", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/23-2-digestive-system-processes-and-regulation"}]};

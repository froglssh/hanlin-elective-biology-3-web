。進入小腸的<br>食糜，除了刺激管壁的縱肌與環肌產生蠕動推進食糜外，環肌本<br>身還會在食糜所經過的腸管多處部位作節律性的收縮，把食糜分<br>成許多段，稱為分節運動（圖 2－15d）。在分節運動中，當原先<br>收縮處的環肌開始舒張時，原舒張處則收縮，食糜又重新分節，如<br>此反覆進行可使食糜與消化液充分拌合，食糜與腸道壁緊密接觸<br>則有助於吸收，擠壓腸壁更有助於血液與淋巴的回流。<br>蠕動　peristalsis<br>分節運動　segmentation movement<br> 圖2－14　<br>消化道的管壁分層<br>黏<br>膜<br>層<br>漿<br>膜<br>層<br>黏<br>膜<br>下<br>層<br>肌<br>肉<br>層<br>46　選修生物 Ⅲ (全)<br><small>課本PDF第 2 頁，印刷P46（文字抽取原文）</small></div>", "tb": [["BOOK2", "P46 完整課本頁"]]}, {"id": "b3-c22-l06", "t": "口腔：形成可吞嚥的食團", "sec": "s2", "slide": 10, "sourceSlides": [10], "sourcePages": [], "src": "原PPT第 10 頁；課本 P46–48", "figSpec": {"image": "PPT10S3"}, "txt": "<ul><li>牙齒切細、磨碎食物；舌協助與唾液拌合。</li><li>食團經吞嚥進入食道；吞嚥與蠕動是相關但不同的動作。</li><li>澱粉的初步化學性消化從口腔即可開始，不是從胃才開始。</li></ul><p class=\"think\">嚼碎食物和唾液澱粉酶作用，各改變哪個尺度？</p><div class=\"quote\">2-2.1 <br>人體的消化構造與食物的消化<br>口腔<br>◆<br> <br>齒<br>：<br>切<br>細<br>、磨碎<br>食物<br>◆<br> <br>舌<br>：<br>拌合唾液和食物，利於吞嚥<br>◆<br> 食物在口腔形成<br>食團<br>，藉由吞嚥進入食道<br>人體的消化<br>道<br>配合課本 <br>P46<br>口腔<br>齒<br>舌<small>原PPT第 10 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c22-l07", "t": "蠕動：追蹤收縮波與位移", "sec": "s2", "slide": 11, "sourceSlides": [11, 12], "sourcePages": [], "src": "原PPT第 11–12 頁；課本 P46–48", "figSpec": {"image": "peristalsis"}, "txt": "<ul><li>環肌與縱肌協調，形成沿消化道推進的收縮波。</li><li>比較圖中的A、B固定位置，觀察食團是否向前移動。</li><li>蠕動不單靠重力，不能把胃腸想成食物自由落下的水管。</li></ul><p class=\"think\">要證明食團前進，必須相對哪個固定標記比較？</p><div class=\"quote\">消化道的蠕動<br>食道<br>◆<br> 食團<br>藉各位置的環肌與縱肌逐步收縮，<br>由食道推送至胃，這樣的推送動作稱為<br>蠕動<br>B<br>① 環<br>肌收縮將食團向前推送<br>② 環<br>肌<br>舒張<br>，縱肌收縮時，使食團的相對位置前移<br>③ 環<br>肌收縮，可再次將食團向前推<br>食道<br>A<br>2-2.1 <br>人體的消化構造與食物的消化<br>人體的消化<br>道<br>配合課本 <br>P46<br>、<br>47<small>原PPT第 11 頁（完整原文）</small></div><div class=\"quote\">2-2.1 <br>人體的消化構造與食物的消化<br>口腔<br>咽<br>食道<br>食道的蠕動<br>人體的消化<br>道<br>補充<small>原PPT第 12 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c22-l08", "t": "胃的三層肌肉：攪拌成食糜", "sec": "s2", "slide": 13, "sourceSlides": [13, 14, 15], "sourcePages": [], "src": "原PPT第 13–15 頁；課本 P46–48", "figSpec": {"image": "stomach"}, "txt": "<u <br> <br>分泌處<br>：<br>由<br>肝臟<br>分泌，儲存<br>在膽囊<br>，需要時由<br>導管<br><br>注入<br>十二指腸<br>◇ 成分與功用<br>：<br>▪ <br>膽鹽<br>：<br>乳化脂質<br>▪<br> 碳酸氫鹽<br>：<br>中和胃酸<br>大油滴<br>脂肪小球<br>膽鹽<br>2-2.1 <br>人體的消化構造與食物的消化<br>配合課本 <br>P51<br>人體的消化腺與消化液<small>原PPT第 34 頁（完整原文）</small></div><div class=\"quote\">小腸中的消化液包括胰液、膽汁及小腸液。胰液<br>由胰臟分泌，其中含有可分解醣類、蛋白質、脂質、<br>核酸的消化<br>（表 2－1），並含有大量的碳酸氫鹽，<br>可中和胃酸。膽汁由肝臟分泌後儲存在膽囊，食糜進<br>入十二指腸可刺激膽囊排出膽汁。膽汁是不含酵素的鹼<br>性液體，具中和胃酸、乳化脂質以幫助脂質分解的功<br>能。小腸液由小腸腺分泌，小腸液亦為鹼性，除可中<br>和胃酸外，並提供水分以利水解作用進行。小腸消化<br>主要位於小腸上皮細胞膜，可水解雙醣、短<br>及核<br>酸<br>（表 2－1）。<br>人體消化液分泌的調控<br>大部分消化液的分泌可受神經系統及激素的共同調<br>控，但唾液的分泌僅受神經系統調控。<br>唾液平時以少量持續性的分泌以維持口腔的溼<br>潤，當食物色、香、味、觸覺的刺激或想起美食時，<br>都會經由神經系統發出訊息，刺激唾腺以增加唾液分<br>泌。這個過程由口腔中的受器受食物刺激，促使感覺神<br>經元將訊息傳到延腦，再由延腦將訊息傳到唾腺，刺<br>激唾腺增加唾液的分泌。但在恐懼或焦慮的心理影響<br>下，神經作用會使唾液的分泌減少。<br>胃液的分泌可受神經系統的調控，看到、聞到、想<br>到美食，或食物進入胃產生的觸動，均可刺激相關神經<br>促進胃液分泌，甚至情緒也會影響胃液分泌。<br>第 2 章  循環與消化　51<br><small>課本PDF第 7 頁，印刷P51（文字抽取原文）</small></div>", "tb": [["BOOK7", "P51 完整課本頁"]]}, {"id": "b3-c22-l20", "t": "小腸液與刷狀緣：液體和酵素位置", "sec": "s3", "slide": 35, "sourceSlides": [35, 36], "sourcePages": [], "src": "原PPT第 35–36 頁；課本 P49–51", "figSpec": {"image": "enzymes"}, "txt": "<ul><li>小腸液供應水、黏液與適合的局部環境。</li><li>多種完成水解的酵素位於上皮細胞刷狀緣，不是全都游離在液體中。</li><li>腸雙醣酶、肽酶與核苷相關酵素完成不同養分的後段加工。</li></ul><p class=\"think\">上皮表面受損，可能同時影響哪兩種功能？</p><div class=\"quote\">小腸液<br>◇<br> <br>pH<br>＝<br>7.5<br>～<br>8.9<br>◇<br> <br>分泌處<br>：<br>小腸腺<br>▪ 位於小腸黏膜層<br>◇ 成分與功用<br>：<br>▪ <br>腸雙醣酶<br>：<br>將雙醣分解成單醣<br>麥芽糖<br>葡萄糖<br>腸雙醣酶<br>▪ <br>腸肽酶<br>：<br>將短肽分解成胺基酸<br>短肽<br>胺基酸<br>腸肽酶<br>2-2.1 <br>人體的消化構造與食物的消化<br>配合課本 <br>P49<br>、<br>51<br>人體的消化腺與消化液<small>原PPT第 35 頁（完整原文）</small></div><div class=\"quote\">▪ <br>腸核苷酶<br>：<br>將核苷分解成含氮鹼基與五碳醣<br>核苷酸<br>腸核苷酶<br>五碳醣、含氮鹼基<br>▪ <br>腸核苷酸酶<br>：<br>將核苷酸分解成核苷與磷酸<br>磷酸<br>腸核苷酸酶<br>核苷<br>核苷<br>▪ <br>黏液<br>：<br>保護腸壁<br>▪<br> 碳酸氫鹽<br>：<br>中和胃酸<br>2-2.1 <br>人體的消化構造與食物的消化<br>配合課本 <br>P49<br>、<br>51<br>人體的消化腺與消化液<small>原PPT第 36 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c22-l21", "t": "酵素總表：先對基質，再追蹤產物", "tb": []}, {"id": "b3-c22-l31", "t": "肝門脈：先經肝，再回心", "sec": "s5", "slide": 54, "sourceSlides": [54, 55], "sourcePages": [11], "src": "原PPT第 54–55 頁；課本 P54–55", "figSpec": {"image": "portal"}, "txt": "<ul><li>絨毛微血管→肝門靜脈→肝臟微血管網→肝靜脈→下大靜脈→心臟。</li><li>門脈連接兩個微血管網；不是從肝臟流出的那條血管。</li><li>肝臟接收肝動脈和肝門靜脈供血，兩者都帶來氧與物質，比例與條件相關。</li></ul><p class=\"think\">用「進肝」與「出肝」標記，可如何分清三條血管？</p><div class=\"scope-note\">肝門靜脈也供應重要部分的氧，不能把供氧全部歸於肝動脈；門脈較低含氧量不等於完全無氧。</div><div class=\"quote\">④<br> 運輸<br>的路徑<br>：<br>小腸絨毛的微血管<br>肝門靜脈<br>心臟<br>肝臟<br>消化道<br>上大靜脈<br>下大靜脈<br>肝靜脈<br>肝門靜脈<br>淋巴管<br>2-2.2 <br>養分的吸收與運輸<br>肝臟<br>下大靜脈<br>心臟<br>肝靜脈<br>全身<br>主動脈<br>肝動脈<br>至消化道的動脈<br>胸管（左淋巴總管）<br>配合課本 <br>P54<br>、<br>55<small>原PPT第 54 頁（完整原文）</small></div><div class=\"quote\">◇ 屬於體循環的一部分<br>2-2.2 <br>養分的吸收與運輸<br>◆ 肝門脈系統<br>：<br>消化道的微血管<br>肝門靜脈<br>肝臟<br>心臟<br>肝臟<br>消化道<br>上大靜脈<br>下大靜脈<br>肝靜脈<br>肝門靜脈<br>淋巴管<br>主動脈<br>肝動脈<br>至消化道的動脈<br>◇<br> 路徑<br>：<br>◇ 肝門靜脈是除了肝動脈以外會進入肝臟的血管，是肝臟特有的循環路徑<br>胸管（左淋巴總管）<br>配合課本 <br>P55<small>原PPT第 55 頁（完整原文）</small></div><div class=\"quote\">肝門脈系統　hepatic portal system<br>  圖 2－20　<br>養分吸收後的運輸路徑示意圖。<br> 為脂溶性營養素的運輸途<br>徑，<br> 為水溶性營養素的運輸途徑。<br>養分經消化道吸收後，水溶性養分會經由肝門靜脈運<br>送到肝臟進行初步處理。肝門靜脈是除了肝動脈以外會進入<br>肝臟的血管，特稱為「肝門脈系統」，是肝臟特有的循環路<br>徑，屬於體循環的一部分。離開肝臟後，水溶性養分再經由<br>肝靜脈、下大靜脈匯入心臟；脂溶性養分則經由左淋巴總管<br>進入上大靜脈匯入心臟；接著再經血液循環供應養分給全身<br>細胞（圖 2－20）。<br>食糜中的水分及各種養分，在小腸消化後大多已被小腸<br>吸收。剩餘的水、維生素及無機鹽可在大腸繼續被吸收。最<br>後未被吸收的食物殘渣會形成糞便，經由肛門排出體外。<br>若消化道與肝臟之間沒<br>有肝門靜脈，而是血液流經<br>消化道後先回心、接著再循<br>環到全身，可能會有什麼影<br>響？<br>腦力激盪<br>微血管與乳糜管的差異<br>為何脂溶性養分經由乳<br>糜管運輸，而不是藉由血管<br>運輸呢？主要是因為兩者<br>「構造」的不同。微血管與<br>乳糜管皆由單層內皮細胞構<br>成，在微血管內皮細胞外具<br>有基底膜，會阻隔使乳糜微<br>粒無法通過。乳糜管屬於微<br>淋管的一種，基底膜較薄也<br>不連續，且內皮細胞部分交<br>疊，會形成狹縫狀的開口<br>（下圖），因此乳糜微粒無<br>法通過微血管，但可以通過<br>乳糜管壁的細胞間隙進入乳<br>糜管而被人體吸收。<br>內皮細胞<br>淋巴<br>乳糜微粒<br>知識補給站<br>至消化道<br>的動脈<br>微血管<br>下大靜脈<br>上大靜脈<br>胸管<br>（左淋巴總管）<br>肝靜脈<br>肝門靜脈<br>肝動脈<br>主動脈<br>淋巴管<br>心臟<br>肝臟<br>消化道<br>第 2 章  循環與消化　55<br><small>課本PDF第 11 頁，印刷P55（文字抽取原文）</small></div>", "tb": [["BOOK11", "P55 完整課本頁"]]}, {"id": "b3-c22-l32", "t": "脂質包裝：乳糜微粒在細胞內形成", "sec": "s5", "slide": 56, "sourceSlides": [56, 57, 58], "sourcePages": [], "src": "原PPT第 56–58 頁；課本 P54–55", "figSpec": {"image": "lipids"}, "txt": "<ul><li>長鏈脂肪酸與單酸甘油酯進入上皮後，可再合成三酸甘油酯。</li><li>與蛋白質及其他脂質組裝成乳糜微粒，再由胞吐作用離開細胞。</li><li>乳糜微粒進入乳糜管；不能把未加工的大油滴直接塞進淋巴管。</li></ul><p class=\"think\">微膠粒和乳糜微粒的組成位置、作用及路徑是否相同？</p><div class=\"scope-note\">本圖是主要膳食長鏈脂質的簡化路徑。短鏈脂肪酸等可走門脈，脂質進細胞也涉及載體；不是所有脂質都只用同一路徑。</div><div class=\"quote\">①<br> 例如<br>：<br>脂肪酸<br>、<br>單酸甘油<br>酯<br>②<br> 絨毛<br>上皮細胞吸收方式<br>：<br>2-2.2 <br>養分的吸收與運輸<br>脂溶性養分<br>▪ 藉<br>簡單擴散<br>，由小腸腔進入小腸絨毛上皮細胞<br>▪ 與小腸絨毛上皮細胞中的蛋白質形成<br>乳糜微粒<br>▪ 藉<br>胞吐作用<br>，由小腸絨毛上皮細胞進入絨毛腔<br>配合課本 <br>P54<small>原PPT第 56 頁（完整原文）</small></div><div class=\"quote\">乳糜微粒<br>乳糜微粒<br>脂肪酸<br>胞吐作用<br>簡單擴散<br>磷脂質<br>、<br><br>脂<br>溶性養分、蛋白質<br>乳糜微粒<br>三酸甘油酯<br>（內質網）<br>乳糜微粒<br>（<br>內質網、高基氏體<br>）<br>小腸腔<br>絨毛腔<br>絨毛上皮細胞<br>2-2.2 <br>養分的吸收與運輸<br>◆ 以單酸甘油酯和脂肪酸為例<br>：<br>脂肪酸<br>甘油<br>脂肪酸<br>(a<br>)<br> 單<br>酸甘油酯和脂肪酸藉簡單擴散進入細胞<br>(b<br>)<br> 有些<br>單酸甘油酯和脂肪酸合成三酸甘油酯<br>(c<br>)<br> 脂<br>質和蛋白質形成乳糜微粒<br>(d<br>)<br> 乳糜<br>微粒藉胞吐作用進入絨毛腔<br>甘油<br>脂肪酸<br>脂肪酸<br>配合課本 <br>P54<small>原PPT第 57 頁（完整原文）</small></div><div class=\"quote\">小腸絨毛上皮細胞<br>乳糜管<br>微血管<br>脂溶性養分<br>③<br> 養分<br>進入絨毛腔後，<br>經由乳糜管壁的<br>細胞間隙<br>進入乳糜管<br>2-2.2 <br>養分的吸收與運輸<br>配合課本 <br>P54<small>原PPT第 58 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c22-l33", "t": "乳糜管：入口構造與顆粒大小", "sec": "s5", "slide": 59, "sourceSlides": [59, 60], "sourcePages": [], "src": "原PPT第 59–60 頁；課本 P54–55", "figSpec": {"image": "lacteal"}, "txt": "<ul><li>乳糜管是微淋巴管，重疊內皮入口及不連續基底膜有助顆粒進入。</li><li>一般絨毛血管與乳糜管的屏障不同，乳糜微粒主要進淋巴。</li><li>盲端表示末端不與另一血管接通，不表示管壁整面密封。</li></ul><p class=\"think\">同樣由單層細胞構成，為何不能推定兩種管壁通透性相同？</p><div class=\"quote\">  <br>知識補給站<br>微血管和乳糜管的差異<br>       為何脂溶性養分經由乳糜管運輸，而不是藉由血管運輸呢？主要是因為兩者「構造」的不同。<br>       微血管與乳糜管皆由單層內皮細胞構成，在微血管內皮細胞外具有基底膜，會阻隔使乳糜微粒無法通過。<br>配合課本 <br>P55<br>59<small>原PPT第 59 頁（完整原文）</small></div><div class=\"quote\">  <br>知識補給站<br>微血管和乳糜管的差異<br>       乳糜管屬於微淋管的一種，基底膜較薄也不連續，且內皮細胞部分交疊，會形成狹縫狀的開口，因此乳糜微粒無法通過微血管，但可以通過乳糜管壁的細胞間隙進入乳糜管而被人體吸收。<br>乳糜微粒<br>內皮細胞<br>淋巴<br>60<br>配合課本 <br>P55<small>原PPT第 60 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c22-l34", "t": "脂質回到血液：先走淋巴的迴路", "sec": "s5", "slide": 61, "sourceSlides": [61], "sourcePages": [], "src": "原PPT第 61 頁；課本 P54–55", "figSpec": {"image": "portal"}, "txt": "<ul><li>乳糜管→較大淋巴管→胸管→左側靜脈交界→上大靜脈→右心房。</li><li>之後再循血液迴路到全身；教材圖省略肺循環，不能直接畫右心房到主動脈。</li><li>先避開肝門脈首站，不等於終生不經肝；殘粒仍可被肝處理。</li></ul><p class=\"think\">「淋巴先回心」與「永遠繞過肝臟」為何不同？</p><div class=\"quote\">心臟<br>肝臟<br>消化道<br>上大靜脈<br>下大靜脈<br>肝靜脈<br>肝門靜脈<br>淋巴管<br>④ <br>運輸<br>的路徑<br>：<br>小腸絨毛的乳糜管<br>較大的淋巴管<br>胸管（左淋巴總管）<br>心臟<br>全身<br>上大靜脈<br>2-2.2 <br>養分的吸收與運輸<br>主動脈<br>肝動脈<br>至消化道的動脈<br>胸管（左淋巴總管）<br>配合課本 <br>P54<br>、<br>55<small>原PPT第 61 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c22-l35", "t": "腦力激盪：肝門脈缺席的推論範圍", "sec": "s6", "slide": 62, "sourceSlides": [62], "sourcePages": [], "src": "原PPT第 62 頁；課本 P54–55／原題", "figSpec": {"image": "portal"}, "txt": "<ul><li>肝門脈讓腸道吸收的多種物質先經肝臟代謝、儲存與處理。</li><li>若先進全身循環，首次通過肝臟的順序改變；血中濃度需依物質及條件推論。</li><li>正常可溶性養分不會只因未先經肝，就在微血管末端直接堵塞。</li></ul><p class=\"think\">由「失去第一站的代謝」到「造成堵塞」，還缺少哪些證據？</p><div class=\"scope-note\">原PPT62「人體無法吸收的雜質進入血液」與「大量養分堵塞微血管」不作為本題的可靠推論。若能從腸腔進血就已被吸收；肝處理也不是全部物質都能完全去除。</div><div class=\"quote\">  <br>腦力激盪<br>若消化道與肝臟之間沒有肝門靜脈，而是血液流經消化道後先回心、接著再循環到全身，可能會有什麼影響？<br>配合課本 <br>P55<br>答<br>：<br>肝門靜脈主要功能為將消化道吸收的養分送到肝臟代謝與儲存，其中也包含人體無法吸收的雜質、毒素等，這些物質會先送至肝臟進行解毒的工作，若沒有經過此道程序，而是隨血液送到心臟、接著循環全身，這些對人體有害的物質可能會隨著血液流經全身，進而危害體內的組織與器官；此外來自消化道的大量營養若未經過處理與吸收，也可能在流經心臟等處的微血管時造成微血管末端堵塞，嚴重可能危害生命。<br>62<small>原PPT第 62 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c22-l36", "t": "原題一：甲乙丙丁與戊的角色", "sec": "s6", "slide": 63, "sourceSlides": [63, 64], "sourcePages": [], "src": "原PPT第 63–64 頁；課本 P54–55／原題", "figSpec": {"image": "originalAbsorb"}, "txt": "<ul><li>甲是題圖的主動運輸模型，乙促進性擴散；丙簡單擴散，丁胞吐。</li><li>戊為乳糜微粒，在上皮細胞內組裝，原題正答C。</li><li>依此圖分類，胞吐與載體型主動運輸分開；胞吐仍需能量。</li></ul><p class=\"think\">耗能就一定屬題目所稱的「主動運輸」嗎？</p><div class=\"quote\">  <br>Question<br>1<br>. <br>下圖是小腸養分吸收的示意圖，甲、乙為水溶性養分吸收的主要方式，丙、丁為脂溶性養分吸收的方式。請根據本圖判斷下列敘述何者正確？<br>(A)<br>從小腸腔進入絨毛上皮細胞的方式，甲、丙皆須消耗能量　<br>(B)<br>從絨毛上皮細胞離開進入絨毛腔的方式乙、丁皆不耗能　<br>(C)<br>戊在絨毛上皮細胞內才合成　<br>(D)<br>甲、丁都屬於主動運輸。<br>63<br>解答<br>：<br>(C)<br>小腸腔<br>絨毛上皮細胞<br>絨毛腔<br>葡萄糖、胺基酸等水溶性養分<br>脂肪酸、單酸甘油酯等脂溶性養分<small>原PPT第 63 頁（完整原文）</small></div><div class=\"quote\">  <br>Question<br>解析<br>：<br>甲為主動運輸、乙為促進性擴散、丙為簡單擴散、丁為胞吐作用、戊為乳糜微粒。<br>(A)<br>丙為簡單擴散，不耗能。<br>(B)<br>乙為促進性擴散，不耗能；丁為胞吐作用，需耗能。<br>(D)<br>丁為胞吐作用，是大分子離開細胞的方式，非主動運輸。<br>64<small>原PPT第 64 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c22-l37", "t": "原題二：肝胰膽的分泌物流向", "sec": "s6", "slide": 65, "sourceSlides": [65, 66], "sourcePages": [], "src": "原PPT第 65–66 頁；課本 P54–55／原題", "figSpec": {"image": "originalOrgans"}, "txt": "<ul><li>甲肝臟、乙膽汁、丙膽囊、丁胰液、戊胰臟；己膽管、庚胰管、辛共同開口、壬十二指腸。</li><li>肝臟分泌膽汁並可儲存肝醣，原題正答A。</li><li>胰液走胰管入腸；胰島激素進血，是外分泌與內分泌的區別。</li></ul><p class=\"think\">「胰臟有內分泌」能證明胰液也進血嗎？</p><div class=\"quote\">  <br>Question<br>2.<br> <br>右<br>圖為消化系統構造示意圖，其中乙、丁為分泌物，下列敘述何者正確？　<br>(A)<br>甲構造是人體最大的腺體，可以分泌消化液及儲存醣類　<br>(B)<br>乙消化液會暫存在丙當中，等到酸性食糜進入壬再排出，以便活化乙中的酵素　<br>(C)<br>戊構造具有內分泌和外分泌的功能，所分泌的丁物質可以進入庚送到血液循環中　<br><br>(<br>D)<br>食物的消化從胃開始，到了壬部位幾乎已經完成消化吸收的工作。<br>解答<br>：<br>(<br>A<br>)<br>65<small>原PPT第 65 頁（完整原文）</small></div><div class=\"quote\">  <br>Question<br>解析<br>：<br>甲<br>為肝臟、乙為膽汁、丙為膽囊、丁為胰液、戊為胰臟、己為膽管、庚為胰管、辛為<br>膽管與胰管的共同<br>開口、壬為<br>十二指腸。<br>(B)<br>膽汁中不含酵素，但是含有膽鹽可乳化脂質。<br>(C)<br>胰臟具有內分泌和外分泌的功能，所分泌的胰液是進入十二指腸中，而不進入血液循環。<br>(D)<br>食物的消化從口腔開始，到了壬（十二指腸）是主要消化的部位，而吸收則不只在壬（十二指腸），應該還包含壬（十二指腸）之後的小腸部位。<br>66<small>原PPT第 66 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c22-l38", "t": "原題三：混合產物是條件證據", "sec": "s6", "slide": 67, "sourceSlides": [67, 68, 69], "sourcePages": [], "src": "原PPT第 67–69 頁；課本 P54–55／原題", "figSpec": {"image": "originalMix"}, "txt": "<ul><li>原題模型推得W膽汁、X唾液、Y胃液、Z胰液；正答A、C、D。</li><li>較小脂肪顆粒是乳化線索；單酸甘油酯與脂肪酸才是水解線索。</li><li>含Y的混合液未充分水解某基質，不能直接說其他液體沒該酵素。</li></ul><p class=\"think\">要驗證酵素來源，還需要控制pH、時間、溫度和用量中的哪些量？</p><div class=\"scope-note\">依原題條件作答，答案不改。實際混合實驗須量pH與活性；原PPT69「胃液會分解其他消化液酵素」不是所有條件下都能單憑產物證明的唯一機制。</div><div class=\"quote\">  <br>Question<br>3. <br>小翰在醫學院取得病患的不同消化液進行分析，但編號 <br>W<br>、<br>X<br>、<br>Y<br>、<br>Z <br>的消化液來源紀錄遺失了，僅知樣本中沒有腸液。小翰將澱粉、蛋白質、脂肪等養分加入不同消化液的混合液，進行交叉比對後得到下頁表格，請問下列敘述哪些正確？<br>67<small>原PPT第 67 頁（完整原文）</small></div><div class=\"quote\">  <br>Question<br>(A) W <br>可能是膽汁<br>　<br>(B) X <br>的消化液中具有脂肪酶　<br>(C) Y <br>的消化液中具有蛋白酶　<br>(D)<br>若在 <br>X<br>＋<br>Z <br>兩組中多加入 <br>W <br>消化液，單酸甘油酯的含量會提高　<br>(E) <br>Z<br> 的<br>消化液同時具有物理性消化與化學性消化的功能。<br>解答<br>：<br>(A)(C)(D)<br>消化液<br>與消化液作用的產物<br>W+X<br>麥芽糖、蛋白質、較小脂肪顆粒<br>W+Y<br>澱粉、多肽、較小脂肪顆粒<br>W+Z<br>麥芽糖、多肽、單酸甘油酯、脂肪酸<br>X+Y<br>麥芽糖、<br>多肽、脂肪<br>Y+Z<br>麥芽糖、<br>多肽、脂肪<br>X+Z<br>麥芽糖、多肽、單酸甘油酯、脂肪酸<br>68<small>原PPT第 68 頁（完整原文）</small></div><div class=\"quote\">  <br>Question<br>解析<br>：<br>W <br>為膽汁、<br>X <br>為唾液、<br>Y <br>為胃液、<br>Z <br>為胰液。<br>Y<br>（胃液）為強酸，且具有蛋白酶，會將環境中其他消化液中的酵素分解。<br>(B) X <br>可分解澱粉，應具有澱粉酶。<br>(E) <br>Z<br> 可<br>將脂肪分解為單酸甘油酯及脂肪酸，且可分解澱粉與蛋白質，應為胰液，胰液不具物理性消化功能。<br>69<small>原PPT第 69 頁（完整原文）</small></div>", "tb": []}], "questions": [{"t": "物理與化學性消化", "q": "將六種變化依是否水解化學鍵歸類。", "learn": 1, "tag": "enzyme", "hint": "顆粒、油滴與分子不是相同尺度。", "why": "乳化使接觸面積增加，但不把三酸甘油酯切成產物；水解才改變分子。", "sub": "原PPT第 4–5 頁；課本 P45–46", "refs": [{"src": "PPT05S3", "cap": "教材來源圖"}], "kind": "drag", "slots": [{"id": "g0s0", "label": "物理性消化", "group": 0}, {"id": "g0s1", "label": "物理性消化", "group": 0}, {"id": "g0s2", "label": "物理性消化", "group": 0}, {"id": "g1s0", "label": "化學性消化", "group": 1}, {"id": "g1s1", "label": "化學性消化", "group": 1}, {"id": "g1s2", "label": "化學性消化", "group": 1}], "pieces": [{"id": "ag0s0", "label": "牙齒磨碎食物", "group": 0}, {"id": "ag0s1", "label": "胃肌攪拌食團", "group": 0}, {"id": "ag0s2", "label": "膽鹽分散油滴", "group": 0}, {"id": "ag1s0", "label": "澱粉酶分解糖鏈", "group": 1}, {"id": "ag1s1", "label": "胃蛋白酶水解蛋白", "group": 1}, {"id": "ag1s2", "label": "胰脂酶水解三酸甘油酯", "group": 1}], "sol": {"g0s0": "ag0s0", "g0s1": "ag0s1", "g0s2": "ag0s2", "g1s0": "ag1s0", "g1s1": "ag1s1", "g1s2": "ag1s2"}, "pre": {}, "id":  "id": "b3-c22-q03"}, {"t": "課本圖貼標籤：養分吸收後的運輸路徑", "q": "依課本圖2–20，把標籤放回圖上的編號格：血管、淋巴管與肝臟。", "learn": 30, "tag": "transport", "hint": "綠色箭頭是水溶性養分：消化道→肝門靜脈→肝臟→肝靜脈→下大靜脈；粉紅色箭頭是脂溶性養分：淋巴管→胸管→上大靜脈。", "why": "水溶性養分經微血管匯入肝門靜脈，先到肝臟，再由肝靜脈、下大靜脈回心臟；脂溶性養分經淋巴管、胸管（左淋巴總管）匯入左鎖骨下靜脈，再入上大靜脈。", "sub": "課本 P55 圖2–20", "refs": [{"src": "mk_portal", "cap": "養分運輸路徑（標籤已遮蓋）"}], "kind": "drag", "mask": "mk_portal", "ar": 0.9618, "layout": "side", "slots": [{"id": "s0", "label": "上大靜脈", "group": 0, "x": 9.6, "y": 16.41, "v": false, "w": false}, {"id": "s1", "label": "下大靜脈", "group": 1, "x": 9.6, "y": 35.04, "v": false, "w": false}, {"id": "s2", "label": "肝靜脈", "group": 2, "x": 8.25, "y": 42.18, "v": false, "w": false}, {"id": "s3", "label": "肝門靜脈", "group": 3, "x": 9.6, "y": 62.6, "v": false, "w": false}, {"id": "s4", "label": "淋巴管", "group": 4, "x": 8.17, "y": 71.72, "v": false, "w": false}, {"id": "s5", "label": "主動脈", "group": 5, "x": 84.01, "y": 25.76, "v": false, "w": false}, {"id": "s6", "label": "肝動脈", "group": 6, "x": 84.01, "y": 50.99, "v": false, "w": false}, {"id": "s7", "label": "胸管（左淋巴總管）", "group": 7, "x": 57.02, "y": 37.48, "v": false, "w": false}, {"id": "s8", "label": "微血管", "group": 8, "x": 36.11, "y": 37.98, "v": false, "w": false}, {"id": "s9", "label": "肝臟", "group": 9, "x": 42.94, "y": 59.77, "v": false, "w": false}], "pieces": [{"id": "a0", "label": "上大靜脈", "group": 0}, {"id": "a1", "label": "下大靜脈", "group": 1}, {"id": "a2", "label": "肝靜脈", "group": 2}, {"id": "a3", "label": "肝門靜脈", "group": 3}, {"id": "a4", "label": "淋巴管", "group": 4}, {"id": "a5", "label": "主動脈", "group": 5}, {"id": "a6", "label": "肝動脈", "group": 6}, {"id": "a7", "label": "胸管（左淋巴總管）", "group": 7}, {"id": "a8", "label": "微血管", "group": 8}, {"id": "a9", "label": "肝臟", "group": 9}, {"id": "a10", "label": "腸繫膜", "group": 100}, {"id": "a11", "label": "膽管", "group": 101}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2", "s3": "a3", "s4": "a4", "s5": "a5", "s6": "a6", "s7": "a7", "s8": "a8", "s9": "a9"}, "pre": {"s0": ": "大腸是全身唯一吸收水分的場所", "ok": false, "tag": "transport"}, {"t": "短鏈脂肪酸等可由門脈輸送", "ok": true, "tag": "transport"}, {"t": "可溶性養分不會只因先不經肝就直接堵塞", "ok": true, "tag": "transport"}], "fig": "portal", "figCaption": "教材原圖", "id": "b3-c22-q18"}, {"t": "原題一：養分吸收示意圖", "q": "下圖是小腸養分吸收的示意圖，甲、乙為水溶性養分吸收的主要方式，丙、丁為脂溶性養分吸收的方式。請根據本圖判斷下列敘述何者正確？", "learn": 35, "tag": "absorb", "hint": "先依圖中界線辨認進入、離開與細胞內形成。", "why": "原PPT63–64正答C。甲為主動運輸模型、乙促進性擴散、丙簡單擴散、丁胞吐、戊乳糜微粒。胞吐需能量，但在本題與載體型主動運輸分開分類。", "sub": "原PPT第 63–64 頁；課本 P54–55／原題", "refs": [{"src": "originalAbsorb", "cap": "教材來源圖"}], "kind": "single", "opts": [{"t": "從小腸腔進入絨毛上皮細胞的方式，甲、丙皆須消耗能量", "ok": false, "tag": "absorb"}, {"t": "從絨毛上皮細胞離開進入絨毛腔的方式乙、丁皆不耗能", "ok": false, "tag": "absorb"}, {"t": "戊在絨毛上皮細胞內才合成", "ok": true, "tag": "absorb"}, {"t": "甲、丁都屬於主動運輸", "ok": false, "tag": "absorb"}], "fig": "originalAbsorb", "figCaption": "原PPT63：左側葡萄糖、胺基酸等；右側脂肪酸、單酸甘油酯等", "originalPPTQuestion": "1", "id": "b3-c22-q19"}, {"t": "原題二：消化系統構造", "q": "右圖為消化系統構造示意圖，其中乙、丁為分泌物，下列敘述何者正確？", "learn": 36, "tag": "enzyme", "hint": "以導管流向與分泌物性質核對。", "why": "原PPT65–66正答A。甲肝、乙膽汁、丙膽囊、丁胰液、戊胰。膽汁無酵素；胰液入十二指腸不進血，消化從口腔開始，吸收也不只在十二指腸。", "sub": "原PPT第 65–66 頁；課本 P54–55／原題", "refs": [{"src": "originalOrgans", "cap": "教材來源圖"}], "kind": "single", "opts": [{"t": "乙消化液會暫存在丙當中，等到酸性食糜進入壬再排出，以便活化乙中的酵素", "ok": false, "tag": "enzyme"}, {"t": "戊構造具有內分泌和外分泌的功能，所分泌的丁物質可以進入庚送到血液循環中", "ok": false, "tag": "enzyme"}, {"t": "食物的消化從胃開始，到了壬部位幾乎已經完成消化吸收的工作", "ok": false, "tag": "enzyme"}, {"t": "甲構造是人體最大的腺體，可以分泌消化液及儲存醣類", "ok": true, "tag": "enzyme"}], "fig": "originalOrgans", "figCaption": "原PPT原圖", "originalPPTQuestion": "2", "id": "b3-c22-q20"}, {"t": "原題三：消化液交叉比對", "q": "小翰在醫學院取得病患的不同消化液進行分析，但編號 W、X、Y、Z 的消化液來源紀錄遺失了，僅知樣本中沒有腸液。小翰將澱粉、蛋白質、脂肪等養分加入不同消化液的混合液，進行交叉比對後得到右側表格，請問下列敘述哪些正確？", "learn": 37, "tag": "evidence", "hint": "先對照出現「較小脂肪顆粒」的組合，再看水解產物；未水解不等於沒有酵素。", "why": "原PPT67–69正答A、C、D。W膽汁、X唾液、Y胃液、Z胰液。W提供乳化、Y提供蛋白酶；依原題模型加入W可助胰脂酶接觸基質。含Y時產物須連同酸度解釋，實際實驗應控制pH、反應時間、溫度與酵素用量。", "sub": "原PPT第 67–69 頁；課本 P54–55／原題", "r 2.2 \n養分的吸收與運輸\n肝臟\n下大靜脈\n心臟\n肝靜脈\n全身\n主動脈\n肝動脈\n至消化道的動脈\n胸管（左淋巴總管）\n配合課本 \nP54\n、\n55", "55": "◇ 屬於體循環的一部分\n2-2.2 \n養分的吸收與運輸\n◆ 肝門脈系統\n：\n消化道的微血管\n肝門靜脈\n肝臟\n心臟\n肝臟\n消化道\n上大靜脈\n下大靜脈\n肝靜脈\n肝門靜脈\n淋巴管\n主動脈\n肝動脈\n至消化道的動脈\n◇\n 路徑\n：\n◇ 肝門靜脈是除了肝動脈以外會進入肝臟的血管，是肝臟特有的循環路徑\n胸管（左淋巴總管）\n配合課本 \nP55", "56": "①\n 例如\n：\n脂肪酸\n、\n單酸甘油\n酯\n②\n 絨毛\n上皮細胞吸收方式\n：\n2-2.2 \n養分的吸收與運輸\n脂溶性養分\n▪ 藉\n簡單擴散\n，由小腸腔進入小腸絨毛上皮細胞\n▪ 與小腸絨毛上皮細胞中的蛋白質形成\n乳糜微粒\n▪ 藉\n胞吐作用\n，由小腸絨毛上皮細胞進入絨毛腔\n配合課本 \nP54", "57": "乳糜微粒\n乳糜微粒\n脂肪酸\n胞吐作用\n簡單擴散\n磷脂質\n、\n\n脂\n溶性養分、蛋白質\n乳糜微粒\n三酸甘油酯\n（內質網）\n乳糜微粒\n（\n內質網、高基氏體\n）\n小腸腔\n絨毛腔\n絨毛上皮細胞\n2-2.2 \n養分的吸收與運輸\n◆ 以單酸甘油酯和脂肪酸為例\n：\n脂肪酸\n甘油\n脂肪酸\n(a\n)\n 單\n酸甘油酯和脂肪酸藉簡單擴散進入細胞\n(b\n)\n 有些\n單酸甘油酯和脂肪酸合成三酸甘油酯\n(c\n)\n 脂\n質和蛋白質形成乳糜微粒\n(d\n)\n 乳糜\n微粒藉胞吐作用進入絨毛腔\n甘油\n脂肪酸\n脂肪酸\n配合課本 \nP54", "58": "小腸絨毛上皮細胞\n乳糜管\n微血管\n脂溶性養分\n③\n 養分\n進入絨毛腔後，\n經由乳糜管壁的\n細胞間隙\n進入乳糜管\n2-2.2 \n養分的吸收與運輸\n配合課本 \nP54", "59": "  \n知識補給站\n微血管和乳糜管的差異\n       為何脂溶性養分經由乳糜管運輸，而不是藉由血管運輸呢？主要是因為兩者「構造」的不同。\n       微血管與乳糜管皆由單層內皮細胞構成，在微血管內皮細胞外具有基底膜，會阻隔使乳糜微粒無法通過。\n配合課本 \nP55\n59", "60": "  \n知識補給站\n微血管和乳糜管的差異\n       乳糜管屬於微淋管的一種，基底膜較薄也不連續，且內皮細胞部分交疊，會形成狹縫狀的開口，因此乳糜微粒無法通過微血管，但可以通過乳糜管壁的細胞間隙進入乳糜管而被人體吸收。\n乳糜微粒\n內皮細胞\n淋巴\n60\n配合課本 \nP55", "61": "心臟\n肝臟\n消化道\n上大靜脈\n下大靜脈\n肝靜脈\n肝門靜脈\n淋巴管\n④ \n運輸\n的路徑\n：\n小腸絨毛的乳糜管\n較大的淋巴管\n胸管（左淋巴總管）\n心臟\n全身\n上大靜脈\n2-2.2 \n養分的吸收與運輸\n主動脈\n肝動脈\n至消化道的動脈\n胸管（左淋巴總管）\n配合課本 \nP54\n、\n55", "62": "  \n腦力激盪\n若消化道與肝臟之間沒有肝門靜脈，而是血液流經消化道後先回心、接著再循環到全身，可能會有什麼影響？\n配合課本 \nP55\n答\n：\n肝門靜脈主要功能為將消化道吸收的養分送到肝臟代謝與儲存，其中也包含人體無法吸收的雜質、毒素等，這些物質會先送至肝臟進行解毒的工作，若沒有經過此道程序，而是隨血液送到心臟、接著循環全身，這些對人體有害的物質可能會隨著血液流經全身，進而危害體內的組織與器官；此外來自消化道的大量營養若未經過處理與吸收，也可能在流經心臟等處的微血管時造成微血管末端堵塞，嚴重可能危害生命。\n62", "63": "  \nQuestion\n1\n. \n下圖是小腸養分吸收的示意圖，甲、乙為水溶性養分吸收的主要方式，丙、丁為脂溶性養分吸收的方式。請根據本圖判斷下列敘述何者正確？\n(A)\n從小腸腔進入絨毛上皮細胞的方式，甲、丙皆須消耗能量　\n(B)\n從絨毛上皮細胞離開進入絨毛腔的方式乙、丁皆不耗能　\n(C)\n戊在絨毛上皮細胞內才合成　\n(D)\n甲、丁都屬於主動運輸。\n63\n解答\n：\n(C)\n小腸腔\n絨毛上皮細胞\n絨毛腔\n葡萄糖、胺基酸等水溶性養分\n脂肪酸、單酸甘油酯等脂溶性養分", "64": "  \nQuestion\n解析\n：\n甲為主動運輸、乙為促進性擴散、丙為簡單擴散、丁為胞吐作用、戊為乳糜微粒。\n(A)\n丙為簡單擴散，不耗能。\n(B)\n乙為促進性擴散，不耗能；丁為胞吐作用，需耗能。\n(D)\n丁為胞吐作用，是大分子離開細胞的方式，非主動運輸。\n64", "65": "  \nQuestion\n2.\n \n右\n圖為消化系統構造示意圖，其中乙、丁為分泌物，下列敘述何者正確？　\n(A)\n甲構造是人體最大的腺體，可以分泌消化液及儲存醣類　\n(B)\n乙消化液會暫存在丙當中，等到酸性食糜進入壬再排出，以便活化乙中的酵素　\n(C)\n戊構造具有內分泌和外分泌的功能，所分泌的丁物質可以進入庚送到血液循環中　\n\n(\nD)\n食物的消化從胃開始，到了壬部位幾乎已經完成消化吸收的工作。\n解答\n：\n(\nA\n)\n65", "66": "  \nQuestion\n解析\n：\n甲\n為肝臟、乙為膽汁、丙為膽囊、丁為胰液、戊為胰臟、己為膽管、庚為胰管、辛為\n膽管與胰管的共同\n開口、壬為\n十二指腸。\n(B)\n膽汁中不含酵素，但是含有膽鹽可乳化脂質。\n(C)\n胰臟具有內分泌和外分泌的功能，所分泌的胰液是進入十二指腸中，而不進入血液循環。\n(D)\n食物的消化從口腔開始，到了壬（十二指腸）是主要消化的部位，而吸收則不只在壬（十二指腸），應該還包含壬（十二指腸）之後的小腸部位。\n66", "67": "  \nQuestion\n3. \n小翰在醫學院取得病患的不同消化液進行分析，但編號 \nW\n、\nX\n、\nY\n、\nZ \n的消化液來源紀錄遺失了，僅知樣本中沒有腸液。小翰將澱粉、蛋白質、脂肪等養分加入不同消化液的混合液，進行交叉比對後得到下頁表格，請問下列敘述哪些正確？\n67", "68": "  \nQuestion\n(A) W \n可能是膽汁\n　\n(B) X \n的消化液中具有脂肪酶　\n(C) Y \n的消化液中具有蛋白酶　\n(D)\n若在 \nX\n＋\nZ \n兩組中多加入 \nW \n消化液，單酸甘油酯的含量會提高　\n(E) \nZ\n 的\n消化液同時具有物理性消化與化學性消化的功能。\n解答\n：\n(A)(C)(D)\n消化液\n與消化液作用的產物\nW+X\n麥芽糖、蛋白質、較小脂肪顆粒\nW+Y\n澱粉、多肽、較小脂肪顆粒\nW+Z\n麥芽糖、多肽、單酸甘油酯、脂肪酸\nX+Y\n麥芽糖、\n多肽、脂肪\nY+Z\n麥芽糖、\n多肽、脂肪\nX+Z\n麥芽糖、多肽、單酸甘油酯、脂肪酸\n68", "69": "  \nQuestion\n解析\n：\nW \n為膽汁、\nX \n為唾液、\nY \n為胃液、\nZ \n為胰液。\nY\n（胃液）為強酸，且具有蛋白酶，會將環境中其他消化液中的酵素分解。\n(B) X \n可分解澱粉，應具有澱粉酶。\n(E) \nZ\n 可\n將脂肪分解為單酸甘油酯及脂肪酸，且可分解澱粉與蛋白質，應為胰液，胰液不具物理性消化功能。\n69"}, "originalCount": 1, "legacyCount": 8, "originalPPTQuestions": {"1": [2], "2": [0], "3": [0, 2, 3]}, "references": [{"title": "absorb", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/23-7-chemical-digestion-and-absorption-a-closer-look"}, {"title": "accessory", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/23-6-accessory-organs-in-digestion-the-liver-pancreas-and-gallbladder"}, {"title": "stomach", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/23-4-the-stomach"}, {"title": "intestine", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/23-5-the-small-and-large-intestines"}, {"title": "animals", "url": "https://openstax.org/books/biology-2e/pages/34-1-digestive-systems"}, {"title": "process", "url": "https:

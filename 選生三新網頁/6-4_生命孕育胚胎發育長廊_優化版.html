const CONTENT={"pptText": {"1": "6-4 \n胚胎發育與懷孕\n6-4.1 \n胚胎發育\n6-4.2 \n懷孕與分娩\n6-4.3 \n產前遺傳篩檢\n1", "2": "◆ \n胚胎發育\n是指受精卵在女性體內進行\n細胞分裂\n、\n生長\n與\n分化\n，最終形成完整個體的過程\n6-4.1 \n胚胎發育\n◆ \n約\n歷時 \n38 \n週\n，分為\n胚胎期\n與\n胎兒期\n兩階段\n配合課本 \nP189", "3": "6-4.1 \n胚胎發育\n① 排卵\n次級卵母細胞\n濾泡成熟排出次級卵母細胞\n配合課本 \nP188\n、\n189", "4": "① 排卵\n次級卵母細胞\n6-4.1 \n胚胎發育\n② 受精\n濾泡成熟排出次級卵母細胞\n在輸卵管前端\n受精\n受精卵\n胚胎期\n配合課本 \nP188\n、\n189", "5": "① 排卵\n次級卵母細胞\n6-4.1 \n胚胎發育\n② 受精\n受精卵\n◇ \n受精卵藉輸卵管的平滑肌收縮與上皮細胞纖毛擺動往子宮移動\n◇ 受精\n後 \n1\n 天\n：\n受精卵\n進行\n卵裂\n③ 開始卵裂\n胚胎期\n配合課本 \nP188\n、\n189\n濾泡成熟排出次級卵母細胞\n在輸卵管前端\n受精", "6": "① 排卵\n次級卵母細胞\n6-4.1 \n胚胎發育\n② 受精\n受精卵\n③ 開始卵裂\n卵裂\n細胞數量增加，但整體大小變化不明顯\n受精後\n第 \n3\n～\n4 \n天\n：\n \n形成\n囊胚\n並\n進入子宮\n④ 形成囊胚\n胚胎期\n配合課本 \nP188\n、\n189", "7": "① 排卵\n次級卵母細胞\n6-4.1 \n胚胎發育\n② 受精\n受精卵\n③ 開始卵裂\n④ 形成囊胚\n \n囊胚\n◇\n \n中空球狀\n囊胚腔\n滋胚層\n內\n細胞團\n◇\n \n外層為\n滋胚層\n，\n可分泌酵素協助著床\n◇\n \n內部為\n內細胞團\n胚胎期\n配合課本 \nP188\n、\n189", "8": "① 排卵\n次級卵母細胞\n6-4.1 \n胚胎發育\n② 受精\n受精卵\n③ 開始卵裂\n④ 形成囊胚\n囊胚腔\n滋胚層\n內細胞團\n⑤ 著床\n受精後\n第 \n7\n～\n10 \n天\n：\n \n完成\n著床\n胚胎期\n配合課本 \nP188\n、\n189", "9": "① 排卵\n次級卵母細胞\n6-4.1 \n胚胎發育\n② 受精\n受精卵\n③ 開始卵裂\n胚胎期\n④ 形成囊胚\n囊胚腔\n滋胚層\n內\n細胞團\n⑤ 著床\n囊胚形成\n絨毛膜\n並參與\n胎盤\n形成，而\n內細胞團\n將發育為\n胎兒\n配合課本 \nP188\n、\n189", "10": "6-4.1 \n胚胎發育\n胚胎期\n內細胞團\n分化為三個\n胚層\n：\n◇ \n外胚層\n：\n形成\n表皮、神經系統\n◇ \n中\n胚層\n：\n形成\n骨骼、肌肉、心血管系統\n◇ \n內\n胚層\n：\n形成\n消化道與呼吸道的內襯\n配合課本 \nP188\n、\n189\n囊胚形成\n絨毛膜\n並參與\n胎盤\n形成，而\n內細胞團\n將發育為\n胎兒\n絨毛膜\n將發育為胎兒的部分\n外胚層\n中胚層\n內胚層", "11": "6-4.1 \n胚胎發育\n胚胎期\n至此胚胎期結束，\n歷經\n第 \n1\n～\n8 \n週，是器官初步建立的關鍵時期\n配合課本 \nP188\n、\n189\n絨毛膜\n將發育為胎兒的部分\n外胚層\n中胚層\n內胚層", "12": "6-4.1 \n胚胎發育\n胎兒期\n◆\n 胚胎周圍形成四種胚外膜，具有保護與支持胚胎生長的功能\n◇\n \n羊膜\n：\n包圍\n胚胎，內含羊水，可緩衝外力與避免乾燥\n◇ \n絨毛\n膜\n：\n可\n分泌人類絨毛膜促\n性腺素\n（\nhCG\n），在懷孕早期維持黃體功能，也是驗孕的依據。\n◇\n \n卵黃\n囊\n：\n提供\n胚胎早期營養並參與造血\n◇ \n尿\n囊\n：\n儲存\n廢物並參與臍帶形成\n第 \n9 \n週起\n配合課本 \nP189", "13": "6-4.1 \n胚胎發育\n胎兒期\n◆ \n器官\n開始成熟，神經連結增多、骨骼鈣化、肌肉生長，胎盤持續提供氧氣與營養\n◆ \n胎兒\n體重迅速增加，肺部發育完成，為出生做準備\n配合課本 \nP189", "14": "6-4.2 \n懷孕與分娩\n◆ 此期間內，母體與胎兒之間的營養、氣體及廢物交換，主要透過\n胎盤\n與\n臍帶\n進行\n◆ 當受精卵成功著床並開始胚胎發育後，母體會進入妊娠狀態，即一般所說的懷孕\n配合課本 \nP190", "15": "6-4.2 \n懷孕與分娩\n絨毛膜\n子宮內膜\n胎盤\n◇ 由\n胎兒的絨毛膜\n與\n母體的子宮內膜\n共同組成\n◇ 貼附於子宮內壁\n胎盤\n胎盤\n子宮外壁\n羊膜\n羊水\n配合課本 \nP190", "16": "6-4.2 \n懷孕與分娩\n絨毛膜\n子宮內膜\n胎盤\n胎盤\n子宮外壁\n羊膜\n羊水\n→ \n母體的抗體\n可\n進入胎兒體內，提供被動免疫保護\n◇ 胎盤\n密布血管\n→ 胎兒與母體的血液不會直接混合\n→\n 胎兒與母體\n進行氣體與物質的交換\n血腔\n母體的靜脈\n母體\n的動脈\n胎兒的動脈\n胎兒的靜脈\n配合課本 \nP190\n、\n191\n產生二氧化碳、尿素等代謝廢物\n提供氧氣、葡萄糖、胺基酸、水分及各種營養物質", "17": "→ 協助維持子宮內膜的穩定與母體的妊娠狀態\n→\n \n如 \nhCG\n、\n動情素\n與\n黃體素\n◇ 胎盤可\n分泌激素\n絨毛膜\n子宮內膜\n胎盤\n胎盤\n子宮外壁\n羊膜\n羊水\n血腔\n母體的靜脈\n母體\n的動脈\n胎兒的動脈\n胎兒的靜脈\n6-4.2 \n懷孕與分娩\n配合課本 \nP190\n、\n191", "18": "絨毛膜\n子宮內膜\n胎盤\n胎盤\n子宮外壁\n羊膜\n羊水\n血腔\n母體的靜脈\n母\n體的動脈\n6-4.2 \n懷孕與分娩\n◇\n 連接胎兒與胎盤\n◇ \n包含兩條臍動脈與一\n條\n\n臍\n靜脈\n→ \n臍動脈負責將胎兒\n血液\n\n中的\n廢物送至胎盤\n臍帶\n→ \n臍靜脈將含氧氣與\n養分\n\n的\n血液送回胎兒體內\n臍帶\n臍\n靜脈（ \n1\n 條 ）\n臍\n動脈（ \n2\n 條 ）　\n配合課本 \nP190\n、\n191", "19": "◆ 隨著胎兒逐漸發育，子宮體積與重量也大幅增加，子宮壁變得更具彈性，以容納胎兒、羊水與胎盤\n◆ 到了懷孕末期，胎兒體重接近出生重量，各器官發育完成，特別是肺部已具備呼吸功能\n6-4.2 \n懷孕與分娩\n配合課本 \nP191", "20": "◆ 分娩（又稱生產）\n6-4.2 \n懷孕與分娩\n◇ \n胎兒自母體娩出的過程\n◇ \n通常發生於懷孕約第 \n38\n～\n40 \n週\n◇ \n過程\n：\n胎兒成熟、子宮擴張至一定程度\n母體會釋放催產素刺激子宮平滑肌收縮\n引發正回饋機制，使收縮逐漸加強並更具規律性\n子宮收縮會進一步刺激催產素分泌\n子宮頸擴張，胎兒經由產道（陰道）娩出，完成出生\n胎兒娩出後，胎盤也會隨之排出母體\n配合課本 \nP191", "21": "6-4.3 \n產前遺傳篩檢\n◆ 提早評估胎兒是否可能帶有異常染色體或遺傳疾病\n，\n\n協助\n家庭做出充分準備\n◆ 多為非侵入性或低風險技術，可依懷孕週數與\n個別\n\n情況\n選擇進行\n配合課本 \nP192", "22": "母血篩檢\n◆ \n時間\n：\n通常\n於懷孕第 \n10\n～\n20 \n週間進行\n◆ \n方式\n：\n檢測\n母體血液中特定激素與蛋白質濃度\n◆ \n優點\n：\n安全\n且無侵入性\n6-4.3 \n產前遺傳篩檢\n◆ 常\n搭配孕婦年齡與超音波數據，可推估胎兒異常的風險高低\n◆ \n缺點\n：\n僅\n能提供風險評估，無法確診\n母血篩檢\n羊膜穿刺術\n絨毛膜取樣術\n配合課本 \nP192", "23": "◆ 高風險族群\n◆ \n時間\n：\n通常\n於懷孕約 \n10\n～\n13 \n週進行\n◆ \n方法\n：\n透過\n陰道或腹部穿刺方式，取出部分胎盤絨毛膜組織進行染色體與基因分析\n◆ \n優點\n：\n可\n較早得知結果\n6-4.3 \n產前遺傳篩檢\n絨毛膜取樣術\n◆ \n缺點\n：\n風險\n高於母血篩檢與羊膜穿刺術\n配合課本 \nP192\n母血篩檢\n羊膜穿刺術\n絨毛膜取樣術", "24": "6-4.3 \n產前遺傳篩檢\n羊膜穿刺術\n◆ \n時間\n：\n多\n在懷孕約 \n16\n～\n20 \n週進行\n◆ \n方式\n：\n藉\n由細針穿刺孕婦腹部，抽取少量羊水，分析其中脫落的胎兒細胞與代謝物質\n◆ 高風險族群\n◆ 可\n診斷多種\n染色體異常、神經管缺陷與某些單基因遺傳疾病\n◆ \n優點\n：\n準確率\n高\n◆ \n缺點\n：\n屬於\n侵入性檢查，需經醫師專業評估後進行\n配合課本 \nP192\n母血篩檢\n羊膜穿刺術\n絨毛膜取樣術", "25": "  \nQuestion\n1\n.\n \n人體\n的胚胎發育過程中，受精卵會一邊發生卵裂，一邊向子宮方向移動，試問受精卵在發生卵裂過程時，細胞的分裂以及細胞的總體積變化情形分別為何？　\n(A)\n細胞核分裂，細胞質分裂，細胞總體積明顯變大　\n(B)\n細胞核分裂，細胞質分裂，細胞總體積大致不變　\n(C)\n細胞核分裂，細胞質不分裂，細胞總體積明顯變大　\n(D)\n細胞核不分裂，細胞質分裂，細胞總體積大致不變。\n解答\n：\n(\nB) \n解析\n：\n受精卵發生卵裂的過程，細胞的數目會增多，但總體積大致不變。\n25", "26": "  \nQuestion\n2\n.\n 下列\n有關人類懷孕時期的生理特性，下列敘述何者\n錯誤\n？　\n(\nA)\n受精卵到達子宮後的第 \n6 \n天，囊胚開始嵌入增厚的子宮內膜中進行著\n床　\n(\nB)\n懷孕是自受精至胎兒產出前的過程，平均約需 \n267 \n天　\n(\nC)\n胚胎發育的前 \n2 \n個月稱為胚胎\n期　\n(\nD)\n胎兒藉由臍帶與胎盤從母體獲得氧氣與養分，並排出二氧化碳與其他廢物。\n解答\n：\n(A)\n解析\n：\n(\nA)\n卵受精後的第 \n6 \n天，囊胚便已在子宮內開始嵌入增厚的子宮內膜進行著床。\n26"}, "lessons": [{"id": "b3-c64-l01", "t": "從一個細胞到出生：本節的三條線", "sec": "s1", "slide": 1, "sourceSlides": [1], "sourcePages": [1], "src": "原PPT第1頁；課本P188–192", "figSpec": {"image": "path-full"}, "txt": "<h3>教學重點</h3><ul><li>發育線：卵裂、囊胚、著床、胚層與胎兒生長。</li><li>支持線：胚外膜、胎盤、臍帶與母體。</li><li>證據線：原圖、時間起點、風險與診斷分開判讀。</li></ul><p class=\"thinking\"><strong>想一想</strong> 發育、物質交換與檢查結果，分別回答什麼問題？</p><div class=\"quote\">6-4 <br>胚胎發育與懷孕<br>6-4.1 <br>胚胎發育<br>6-4.2 <br>懷孕與分娩<br>6-4.3 <br>產前遺傳篩檢<br>1<small>原PPT第1頁（完整原文）</small></div><div class=\"quote\">受精卵<br>次級卵母細胞<br>2受精<br>1排卵<br>3開始卵裂<br>-4 胚胎發育與懷孕<br>6<br>受精後，發育中的受精卵會藉由輸卵管平滑肌的收縮與上皮細胞<br>的纖毛擺動往子宮移動。到達子宮後，囊胚埋入子宮內膜中完成著床<br>並持續發育，直到胎兒成熟娩出，此過程稱為懷孕。<br> 圖 6－7　<br>胚胎由受精至著床的主要變化示意圖。1濾泡成熟排出次級卵母細胞，2在輸卵管前<br>端受精後，受精卵經3卵裂的過程，會逐漸形成4囊胚，5囊胚著床於子宮內膜。<br>卵裂　cleavage<br>囊胚　blastula<br>滋胚層　trophoblast<br>著床　implantation<br>外胚層　ectoderm<br>中胚層　mesoderm<br>內胚層　endoderm<br>胚胎期　embryonic stage<br>胚外膜　extraembryonic membrane<br>188　選修生物 Ⅲ (全)<br><small>課本PDF第1頁，印刷P188（完整抽取原文；位置與字形以完整頁圖為準）</small></div>", "tb": [["book1", "P188完整課本頁"]]}, {"id": "b3-c64-l02", "t": "兩種時鐘：受精後發育齡與孕週", "sec": "s1", "slide": 2, "sourceSlides": [2], "sourcePages": [], "src": "原PPT第2頁；課本P188–192", "figSpec": {"image": "PPT02S3"}, "txt": "<h3>教學重點</h3><ul><li>原教材全程約38週，從受精後發育歷程理解。</li><li>臨床孕週通常從末次月經首日計算。</li><li>讀任何「第幾週」先確認起點，不只比較數字。</li></ul><table><tr><th>時計</th><th>起點</th><th>典型關係</th></tr><tr><td>受精後發育齡</td><td>受精</td><td>約38週到出生</td></tr><tr><td>臨床孕週</td><td>末次月經首日</td><td>典型週期約多2週</td></tr></table><p class=\"thinking\"><strong>想一想</strong> 為什麼「受精後38週」與「孕40週」可能指近似時段？</p><div class=\"scope-note\">時間基準：教材的約38週與第1–8週／第9週起，依受精後發育齡理解；臨床孕週通常由末次月經首日算起，典型週期約多2週。兩者不能直接互換，個別週期與臨床定年亦會影響換算。<a href=\"https://medlineplus.gov/ency/article/002398.htm\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a></div><div class=\"quote\">◆ <br>胚胎發育<br>是指受精卵在女性體內進行<br>細胞分裂<br>、<br>生長<br>與<br>分化<br>，最終形成完整個體的過程<br>6-4.1 <br>胚胎發育<br>◆ <br>約<br>歷時 <br>38 <br>週<br>，分為<br>胚胎期<br>與<br>胎兒期<br>兩階段<br>配合課本 <br>P189<small>原PPT第2頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l03", "t": "排卵與受精：路徑的起點", "sec": "s1", "slide": 3, "sourceSlides": [3, 4], "sourcePages": [], "src": "原PPT第3–4頁；課本P188–192", "figSpec": {"image": "path-full"}, "txt": "<h3>教學重點</h3><ul><li>排出的是次級卵母細胞。</li><li>受精通常發生在輸卵管前端。</li><li>受精位置與著床位置不同；圖6-7的①②⑤不能混為同一事件。</li></ul><p class=\"thinking\"><strong>想一想</strong> 如果將受精位置畫在子宮內膜，會混淆哪兩件事？</p><div class=\"quote\">6-4.1 <br>胚胎發育<br>① 排卵<br>次級卵母細胞<br>濾泡成熟排出次級卵母細胞<br>配合課本 <br>P188<br>、<br>189<small>原PPT第3頁（完整原文）</small></div><div class=\"quote\">① 排卵<br>次級卵母細胞<br>6-4.1 <br>胚胎發育<br>② 受精<br>濾泡成熟排出次級卵母細胞<br>在輸卵管前端<br>受精<br>受精卵<br>胚胎期<br>配合課本 <br>P188<br>、<br>189<small>原PPT第4頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l04", "t": "運送與卵裂：兩個同時發生的過程", "sec": "s1", "slide": 5, "sourceSlides": [5], "sourcePages": [], "src": "原PPT第5頁；課本P188–192", "figSpec": {"image": "path-full"}, "txt": "<h3>教學重點</h3><ul><li>輸卵管平滑肌收縮及上皮纖毛擺動，協助向子宮移動。</li><li>移動過程同時發生早期分裂。</li><li>不是精子尾巴推著胚胎游向子宮，也不是只靠重力。</li></ul><p class=\"thinking\"><strong>想一想</strong> 運送是位移，卵裂是細胞變化；如何各自觀察？</p><div class=\"quote\">① 排卵<br>次級卵母細胞<br>6-4.1 <br>胚胎發育<br>② 受精<br>受精卵<br>◇ <br>受精卵藉輸卵管的平滑肌收縮與上皮細胞纖毛擺動往子宮移動<br>◇ 受精<br>後 <br>1<br> 天<br>：<br>受精卵<br>進行<br>卵裂<br>③ 開始卵裂<br>胚胎期<br>配合課本 <br>P188<br>、<br>189<br>濾泡成熟排出次級卵母細胞<br>在輸卵管前端<br>受精<small>原PPT第5頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l05", "t": "卵裂：數目增加，整體不明顯變大", "sec": "s1", "slide": 6, "sourceSlides": [6], "sourcePages": [], "src": "原PPT第6頁；課本P188–192", "figSpec": {"image": "PPT06S3"}, "txt": "<h3>教學重點</h3><ul><li>卵裂包含核分裂與細胞質分裂，分裂球數目增加。</li><li>早期總體積大致不變，平均每個細胞變小。</li><li>不把所有人類卵裂寫成完全沒有G1/G2或永遠同步的整齊倍增。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若整體體積相近，細胞從2個變成8個，平均體積如何？</p><div class=\"scope-note\">來源差異：原教材寫受精後第3–4天形成囊胚並入子宮，屬簡化時序；現代人類發育資料常以約第5天為囊胚期。進入子宮、形成囊胚、開始著床與完成著床是不同事件，不能把「到達後第6天」當成「受精後第6天」。原文與原題保留，不以精確日數作新增判分題。<a href=\"https://www.nature.com/articles/s41596-023-00802-1\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a></div><div class=\"quote\">① 排卵<br>次級卵母細胞<br>6-4.1 <br>胚胎發育<br>② 受精<br>受精卵<br>③ 開始卵裂<br>卵裂<br>細胞數量增加，但整體大小變化不明顯<br>受精後<br>第 <br>3<br>～<br>4 <br>天<br>：<br> <br>形成<br>囊胚<br>並<br>進入子宮<br>④ 形成囊胚<br>胚胎期<br>配合課本 <br>P188<br>、<br>189<small>原PPT第6頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l06", "t": "囊胚：細胞層、細胞團與腔", "sec": "s1", "slide": 7, "sourceSlides": [7], "sourcePages": [2], "src": "原PPT第7頁；課本P188–192", "figSpec": {"image": "blastocyst"}, "txt": "<h3>教學重點</h3><ul><li>外圍滋胚層與偏在一側的內細胞團分工不同。</li><li>囊胚腔是腔，不是第三群細胞。</li><li>由圖形判讀中空囊胚，不用教材簡化日數判定所有胚胎。</li></ul><p class=\"thinking\"><strong>想一想</strong> 為什麼囊胚腔不能直接和內細胞團配對為相同構造？</p><div class=\"scope-note\">譜系補充：內細胞團的胚體相關細胞具多能性，不等同單細胞可獨自形成完整個體的全能性。羊膜不能直接列為滋胚層的產物；絨毛膜也涉及胚外中胚層，原教材的譜系為概念簡化。<a href=\"https://www.nature.com/articles/s41556-025-01696-9\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a></div><div class=\"quote\">① 排卵<br>次級卵母細胞<br>6-4.1 <br>胚胎發育<br>② 受精<br>受精卵<br>③ 開始卵裂<br>④ 形成囊胚<br> <br>囊胚<br>◇<br> <br>中空球狀<br>囊胚腔<br>滋胚層<br>內<br>細胞團<br>◇<br> <br>外層為<br>滋胚層<br>，<br>可分泌酵素協助著床<br>◇<br> <br>內部為<br>內細胞團<br>胚胎期<br>配合課本 <br>P188<br>、<br>189<small>原PPT第7頁（完整原文）</small></div><div class=\"quote\">5著床<br>外胚層<br>絨毛膜<br>中胚層<br>內胚層<br>4形成囊胚<br>內細胞團<br>滋胚層<br>囊胚腔<br>6-4.1 胚胎發育<br>胚胎發育是指受精卵在女性體內進行細胞分裂、<br>生長與分化，最終形成完整個體的過程。全程約歷時 <br>38 週，分為胚胎期與胎兒期兩階段。<br>受精後約 1 天，受精卵開始卵裂，細胞數量增<br>加，但整體大小變化不明顯。受精後約在第 3∼4 天<br>形成囊胚並進入子宮，囊胚為中空球狀，外層為滋胚<br>層，內部為內細胞團。滋胚層可分泌酵素協助著床<br>（約在第 7∼10 天完成），之後形成絨毛膜並參與胎<br>盤形成，而內細胞團將發育為胎兒。<br>著床後，內細胞團分化為三個胚層：外胚層形成<br>表皮與神經系統；中胚層形成骨骼、肌肉與心血管系<br>統；內胚層發育為消化道與呼吸道的內襯等。此階段<br>為胚胎期（第 1∼8 週），是器官初步建立的關鍵時<br>期。<br>同時，胚胎周圍也形成四種胚外膜，具有保護與<br>支持胚胎生長的功能：羊膜包圍胚胎，內含羊水，可<br>緩衝外力與避免乾燥。絨毛膜可分泌人類絨毛膜促性<br>腺素（hCG），在懷孕早期維持黃體功能，也是驗孕<br>的依據。卵黃囊提供胚胎早期營養並參與造血。尿囊<br>儲存廢物並參與臍帶形成。<br>第 9 週起進入胎兒期，器官開始成熟，神經連結<br>增多、骨骼鈣化、肌肉生長，胎盤持續提供氧氣與營<br>養。孕期末期，胎兒體重迅速增加，肺部發育完成，<br>為出生做準備。<br>卵黃囊　yolk sac<br>尿囊　allantois<br>胎兒期　fetal stage<br>羊膜　amnion<br>絨毛膜　chorion<br>人類絨毛膜促性腺素　human chorionic gonadotropin, hCG<br>第 6 章  生殖　189<br><small>課本PDF第2頁，印刷P189（完整抽取原文；位置與字形以完整頁圖為準）</small></div>", "tb": [["book2", "P189完整課本頁"]]}, {"id": "b3-c64-l07", "t": "著床：開始、進行與完成分開", "sec": "s1", "slide": 8, "sourceSlides": [8], "sourcePages": [], "src": "原PPT第8頁；課本P188–192", "figSpec": {"pair": ["path-left", "path-right"]}, "txt": "<h3>教學重點</h3><ul><li>囊胚附著並侵入子宮內膜，是漸進過程。</li><li>原教材約第7–10天完成；開始與完成不同。</li><li>不把受精後日數改算成抵達子宮之後的日數。</li></ul><p class=\"thinking\"><strong>想一想</strong> 「受精後第6天」和「到子宮後第6天」的起點相同嗎？</p><div class=\"scope-note\">來源差異：原教材寫受精後第3–4天形成囊胚並入子宮，屬簡化時序；現代人類發育資料常以約第5天為囊胚期。進入子宮、形成囊胚、開始著床與完成著床是不同事件，不能把「到達後第6天」當成「受精後第6天」。原文與原題保留，不以精確日數作新增判分題。<a href=\"https://www.nature.com/articles/s41596-023-00802-1\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a></div><div class=\"quote\">① 排卵<br>次級卵母細胞<br>6-4.1 <br>胚胎發育<br>② 受精<br>受精卵<br>③ 開始卵裂<br>④ 形成囊胚<br>囊胚腔<br>滋胚層<br>內細胞團<br>⑤ 著床<br>受精後<br>第 <br>7<br>～<br>10 <br>天<br>：<br> <br>完成<br>著床<br>胚胎期<br>配合課本 <br>P188<br>、<br>189<small>原PPT第8頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l08", "t": "譜系：滋胚層與內細胞團", "sec": "s1", "slide": 9, "sourceSlides": [9], "sourcePages": [], "src": "原PPT第9頁；課本P188–192", "figSpec": {"image": "blastocyst"}, "txt": "<h3>教學重點</h3><ul><li>滋胚層參與胚外支持結構與胎盤胎兒部分。</li><li>內細胞團參與胚體發育；不能把它所有成員都說成全能單細胞。</li><li>細胞譜系圖是來源關係，不是每個構造都有相同功能。</li></ul><p class=\"thinking\"><strong>想一想</strong> 羊膜、絨毛膜與胎兒本體可以直接歸成同一來源嗎？</p><div class=\"scope-note\">譜系補充：內細胞團的胚體相關細胞具多能性，不等同單細胞可獨自形成完整個體的全能性。羊膜不能直接列為滋胚層的產物；絨毛膜也涉及胚外中胚層，原教材的譜系為概念簡化。<a href=\"https://www.nature.com/articles/s41556-025-01696-9\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a></div><div class=\"quote\">① 排卵<br>次級卵母細胞<br>6-4.1 <br>胚胎發育<br>② 受精<br>受精卵<br>③ 開始卵裂<br>胚胎期<br>④ 形成囊胚<br>囊胚腔<br>滋胚層<br>內<br>細胞團<br>⑤ 著床<br>囊胚形成<br>絨毛膜<br>並參與<br>胎盤<br>形成，而<br>內細胞團<br>將發育為<br>胎兒<br>配合課本 <br>P188<br>、<br>189<small>原PPT第9頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l09", "t": "三胚層：從組織層次判斷", "sec": "s1", "slide": 10, "sourceSlides": [10], "sourcePages": [], "src": "原PPT第10頁；課本P188–192", "figSpec": {"image": "layers"}, "txt": "<h3>教學重點</h3><ul><li>外胚層形成表皮、神經系統。</li><li>中胚層形成骨骼、肌肉與心血管系統。</li><li>內胚層形成消化道與呼吸道內襯；不代表整個腸道所有組織都來自內胚層。</li></ul><p class=\"thinking\"><strong>想一想</strong> 腸道上皮與腸壁平滑肌是否同一胚層？</p><div class=\"quote\">6-4.1 <br>胚胎發育<br>胚胎期<br>內細胞團<br>分化為三個<br>胚層<br>：<br>◇ <br>外胚層<br>：<br>形成<br>表皮、神經系統<br>◇ <br>中<br>胚層<br>：<br>形成<br>骨骼、肌肉、心血管系統<br>◇ <br>內<br>胚層<br>：<br>形成<br>消化道與呼吸道的內襯<br>配合課本 <br>P188<br>、<br>189<br>囊胚形成<br>絨毛膜<br>並參與<br>胎盤<br>形成，而<br>內細胞團<br>將發育為<br>胎兒<br>絨毛膜<br>將發育為胎兒的部分<br>外胚層<br>中胚層<br>內胚層<small>原PPT第10頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l10", "t": "胚胎期：器官初步建立", "sec": "s1", "slide": 11, "sourceSlides": [11], "sourcePages": [], "src": "原PPT第11頁；課本P188–192", "figSpec": {"image": "layers"}, "txt": "<h3>教學重點</h3><ul><li>原教材第1–8週為胚胎期，按受精後發育齡理解。</li><li>三胚層分化與器官形成並非只有大小變化。</li><li>胚胎期結束不代表器官功能完全成熟。</li></ul><p class=\"thinking\"><strong>想一想</strong> 初步建立器官，和出生後能獨立運作，有何差別？</p><div class=\"scope-note\">時間基準：教材的約38週與第1–8週／第9週起，依受精後發育齡理解；臨床孕週通常由末次月經首日算起，典型週期約多2週。兩者不能直接互換，個別週期與臨床定年亦會影響換算。<a href=\"https://medlineplus.gov/ency/article/002398.htm\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a></div><div class=\"quote\">6-4.1 <br>胚胎發育<br>胚胎期<br>至此胚胎期結束，<br>歷經<br>第 <br>1<br>～<br>8 <br>週，是器官初步建立的關鍵時期<br>配合課本 <br>P188<br>、<br>189<br>絨毛膜<br>將發育為胎兒的部分<br>外胚層<br>中胚層<br>內胚層<small>原PPT第11頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l11", "t": "四種胚外膜：支持功能總覽", "sec": "s2", "slide": 12, "sourceSlides": [12], "sourcePages": [], "src": "原PPT第12頁；課本P188–192", "figSpec": {"image": "PPT12S3"}, "txt": "<h3>教學重點</h3><ul><li>羊膜、絨毛膜、卵黃囊與尿囊各有角色。</li><li>胚外膜與三胚層不是同一種分類。</li><li>胚外膜在早期即形成，不能因簡報將它放在胎兒期標題下就說第9週才出現。</li></ul><p class=\"thinking\"><strong>想一想</strong> 支持環境和形成胚體組織，為什麼應分開歸類？</p><div class=\"scope-note\">時間與物種：胚外膜在早期發育即開始形成，不是到胎兒期第9週才首次出現。人類尿囊為小型暫時構造，與臍部及尿囊管發育相關；不把鳥／爬蟲類蛋內尿囊的大量儲廢功能原封不動套在人類。胎兒主要經胎盤向母體排出代謝廢物。<a href=\"https://pubmed.ncbi.nlm.nih.gov/34854363/\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a></div><div class=\"quote\">6-4.1 <br>胚胎發育<br>胎兒期<br>◆<br> 胚胎周圍形成四種胚外膜，具有保護與支持胚胎生長的功能<br>◇<br> <br>羊膜<br>：<br>包圍<br>胚胎，內含羊水，可緩衝外力與避免乾燥<br>◇ <br>絨毛<br>膜<br>：<br>可<br>分泌人類絨毛膜促<br>性腺素<br>（<br>hCG<br>），在懷孕早期維持黃體功能，也是驗孕的依據。<br>◇<br> <br>卵黃<br>囊<br>：<br>提供<br>胚胎早期營養並參與造血<br>◇ <br>尿<br>囊<br>：<br>儲存<br>廢物並參與臍帶形成<br>第 <br>9 <br>週起<br>配合課本 <br>P189<small>原PPT第12頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l12", "t": "羊膜與羊水：保護的環境", "sec": "s2", "slide": 12, "sourceSlides": [12], "sourcePages": [], "src": "原PPT第12頁；課本P188–192", "figSpec": {"image": "fetus"}, "txt": "<h3>教學重點</h3><ul><li>羊膜包圍羊膜腔，內含羊水。</li><li>羊水可緩衝外力，提供活動與發育空間。</li><li>羊膜不等於整個子宮壁，也不能將羊水只說成羊膜單獨製造。</li></ul><p class=\"thinking\"><strong>想一想</strong> 原圖中胎兒接觸的液體和外部子宮壁之間有什麼構造？</p><div class=\"scope-note\">譜系補充：內細胞團的胚體相關細胞具多能性，不等同單細胞可獨自形成完整個體的全能性。羊膜不能直接列為滋胚層的產物；絨毛膜也涉及胚外中胚層，原教材的譜系為概念簡化。<a href=\"https://www.nature.com/articles/s41556-025-01696-9\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a></div><div class=\"quote\">6-4.1 <br>胚胎發育<br>胎兒期<br>◆<br> 胚胎周圍形成四種胚外膜，具有保護與支持胚胎生長的功能<br>◇<br> <br>羊膜<br>：<br>包圍<br>胚胎，內含羊水，可緩衝外力與避免乾燥<br>◇ <br>絨毛<br>膜<br>：<br>可<br>分泌人類絨毛膜促<br>性腺素<br>（<br>hCG<br>），在懷孕早期維持黃體功能，也是驗孕的依據。<br>◇<br> <br>卵黃<br>囊<br>：<br>提供<br>胚胎早期營養並參與造血<br>◇ <br>尿<br>囊<br>：<br>儲存<br>廢物並參與臍帶形成<br>第 <br>9 <br>週起<br>配合課本 <br>P189<small>原PPT第12頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l13", "t": "絨毛膜與hCG：早期支持訊號", "sec": "s2", "slide": 12, "sourceSlides": [12, 17], "sourcePages": [], "src": "原PPT第12–17頁；課本P188–192", "figSpec": {"image": "placenta"}, "txt": "<h3>教學重點</h3><ul><li>絨毛膜的滋胚層相關組織分泌hCG。</li><li>hCG在早期維持黃體功能，支持黃體素作用。</li><li>驗孕的hCG訊號不等於已查明著床位置或全部發育狀況。</li></ul><p class=\"thinking\"><strong>想一想</strong> 檢出一種激素，能否回答所有發育問題？</p><div class=\"quote\">6-4.1 <br>胚胎發育<br>胎兒期<br>◆<br> 胚胎周圍形成四種胚外膜，具有保護與支持胚胎生長的功能<br>◇<br> <br>羊膜<br>：<br>包圍<br>胚胎，內含羊水，可緩衝外力與避免乾燥<br>◇ <br>絨毛<br>膜<br>：<br>可<br>分泌人類絨毛膜促<br>性腺素<br>（<br>hCG<br>），在懷孕早期維持黃體功能，也是驗孕的依據。<br>◇<br> <br>卵黃<br>囊<br>：<br>提供<br>胚胎早期營養並參與造血<br>◇ <br>尿<br>囊<br>：<br>儲存<br>廢物並參與臍帶形成<br>第 <br>9 <br>週起<br>配合課本 <br>P189<small>原PPT第12頁（完整原文）</small></div><div class=\"quote\">→ 協助維持子宮內膜的穩定與母體的妊娠狀態<br>→<br> <br>如 <br>hCG<br>、<br>動情素<br>與<br>黃體素<br>◇ 胎盤可<br>分泌激素<br>絨毛膜<br>子宮內膜<br>胎盤<br>胎盤<br>子宮外壁<br>羊膜<br>羊水<br>血腔<br>母體的靜脈<br>母體<br>的動脈<br>胎兒的動脈<br>胎兒的靜脈<br>6-4.2 <br>懷孕與分娩<br>配合課本 <br>P190<br>、<br>191<small>原PPT第17頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l14", "t": "卵黃囊與尿囊：人類的範圍", "sec": "s2", "slide": 12, "sourceSlides": [12], "sourcePages": [], "src": "原PPT第12頁；課本P188–192", "figSpec": {"image": "PPT12S3"}, "txt": "<h3>教學重點</h3><ul><li>卵黃囊參與早期營養與造血。</li><li>人類尿囊與臍部／尿囊管發育相關。</li><li>原文儲廢功能需有物種限制；胎兒廢物主要經胎盤交換交由母體處理。</li></ul><p class=\"thinking\"><strong>想一想</strong> 人類、鳥與爬蟲類的尿囊，能否用同一句功能描述？</p><div class=\"scope-note\">時間與物種：胚外膜在早期發育即開始形成，不是到胎兒期第9週才首次出現。人類尿囊為小型暫時構造，與臍部及尿囊管發育相關；不把鳥／爬蟲類蛋內尿囊的大量儲廢功能原封不動套在人類。胎兒主要經胎盤向母體排出代謝廢物。<a href=\"https://pubmed.ncbi.nlm.nih.gov/34854363/\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a></div><div class=\"quote\">6-4.1 <br>胚胎發育<br>胎兒期<br>◆<br> 胚胎周圍形成四種胚外膜，具有保護與支持胚胎生長的功能<br>◇<br> <br>羊膜<br>：<br>包圍<br>胚胎，內含羊水，可緩衝外力與避免乾燥<br>◇ <br>絨毛<br>膜<br>：<br>可<br>分泌人類絨毛膜促<br>性腺素<br>（<br>hCG<br>），在懷孕早期維持黃體功能，也是驗孕的依據。<br>◇<br> <br>卵黃<br>囊<br>：<br>提供<br>胚胎早期營養並參與造血<br>◇ <br>尿<br>囊<br>：<br>儲存<br>廢物並參與臍帶形成<br>第 <br>9 <br>週起<br>配合課本 <br>P189<small>原PPT第12頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l15", "t": "胎兒期：生長與功能成熟", "sec": "s2", "slide": 13, "sourceSlides": [13, 19], "sourcePages": [], "src": "原PPT第13–19頁；課本P188–192", "figSpec": {"image": "fetus"}, "txt": "<h3>教學重點</h3><ul><li>按受精後齡，第9週起進入胎兒期。</li><li>神經、骨骼、肌肉與體重持續發育。</li><li>胎兒由胎盤取得氧氣；呼吸樣運動不等於已靠肺吸入空氣。</li></ul><p class=\"thinking\"><strong>想一想</strong> 胎兒的肺在發育，氧氣卻主要來自哪裡？</p><div class=\"scope-note\">發育補充：胎兒期重點是生長與功能逐步成熟；器官初步形成不代表所有功能已完成。肺與神經系統等仍持續發育，不能把教材「發育完成」當成每個個體所有器官完全成熟的保證。<a href=\"https://medlineplus.gov/ency/article/002398.htm\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a></div><div class=\"quote\">6-4.1 <br>胚胎發育<br>胎兒期<br>◆ <br>器官<br>開始成熟，神經連結增多、骨骼鈣化、肌肉生長，胎盤持續提供氧氣與營養<br>◆ <br>胎兒<br>體重迅速增加，肺部發育完成，為出生做準備<br>配合課本 <br>P189<small>原PPT第13頁（完整原文）</small></div><div class=\"quote\">◆ 隨著胎兒逐漸發育，子宮體積與重量也大幅增加，子宮壁變得更具彈性，以容納胎兒、羊水與胎盤<br>◆ 到了懷孕末期，胎兒體重接近出生重量，各器官發育完成，特別是肺部已具備呼吸功能<br>6-4.2 <br>懷孕與分娩<br>配合課本 <br>P191<small>原PPT第19頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l16", "t": "胎兒在母體內：辨認三種邊界", "sec": "s3", "slide": 14, "sourceSlides": [14, 15], "sourcePages": [3], "src": "原PPT第14–15頁；課本P188–192", "figSpec": {"image": "fetus"}, "txt": "<h3>教學重點</h3><ul><li>子宮壁屬母體；羊膜包圍胎兒的液體環境。</li><li>胎盤附著子宮內壁，臍帶連接胎兒與胎盤。</li><li>完整圖6-8a保留，可與局部交換圖對照。</li></ul><p class=\"thinking\"><strong>想一想</strong> 羊水、胎兒血與母血，是同一個液體空間嗎？</p><div class=\"quote\">6-4.2 <br>懷孕與分娩<br>◆ 此期間內，母體與胎兒之間的營養、氣體及廢物交換，主要透過<br>胎盤<br>與<br>臍帶<br>進行<br>◆ 當受精卵成功著床並開始胚胎發育後，母體會進入妊娠狀態，即一般所說的懷孕<br>配合課本 <br>P190<small>原PPT第14頁（完整原文）</small></div><div class=\"quote\">6-4.2 <br>懷孕與分娩<br>絨毛膜<br>子宮內膜<br>胎盤<br>◇ 由<br>胎兒的絨毛膜<br>與<br>母體的子宮內膜<br>共同組成<br>◇ 貼附於子宮內壁<br>胎盤<br>胎盤<br>子宮外壁<br>羊膜<br>羊水<br>配合課本 <br>P190<small>原PPT第15頁（完整原文）</small></div><div class=\"quote\">a<br>b<br>臍帶<br>臍動脈 (2 條)<br>臍靜脈 (1 條)<br>母體的<br>靜脈<br>子宮內膜<br>母體的<br>動脈<br>血腔<br>子宮外壁<br>子宮外壁<br>羊膜<br>羊膜<br>胎盤<br>胎盤<br>羊水<br>羊水<br>絨毛膜<br>血流方向<br>胎盤　placenta<br> 圖 6－8　a胎兒在母體內；b胎盤與臍帶的構造。<br>整體而言，胚胎發育是一個從單一受精卵開<br>始，逐步分化出各種器官的過程。三種胚層與四<br>種胚外膜密切合作，使新生命得以順利孕育與誕<br>生。<br>6-4.2 懷孕與分娩<br>當受精卵成功著床並開始胚胎發育後，母體<br>會進入妊娠狀態，即一般所說的懷孕。此期間<br>內，母體與胎兒之間的營養、氣體及廢物交換，<br>主要透過胎盤與臍帶進行。<br>胎盤由胎兒來源的絨毛膜與母體子宮內膜共<br>同組成，貼附於子宮內壁，是懷孕期間最重要的<br>物質交換構造（圖 6－8）。<br>190　選修生物 Ⅲ (全)<br><small>課本PDF第3頁，印刷P190（完整抽取原文；位置與字形以完整頁圖為準）</small></div>", "tb": [["book3", "P190完整課本頁"]]}, {"id": "b3-c64-l17", "t": "胎盤：母體與胎兒共同參與", "sec": "s3", "slide": 15, "sourceSlides": [15], "sourcePages": [], "src": "原PPT第15頁；課本P188–192", "figSpec": {"pair": ["fetus", "placenta"]}, "txt": "<h3>教學重點</h3><ul><li>胎兒來源的絨毛膜與母體子宮內膜共同參與胎盤。</li><li>胎盤不是只屬母體的一塊血管，也不是胎兒的一段腸道。</li><li>結構來源和物質來源是不同問題。</li></ul><p class=\"thinking\"><strong>想一想</strong> 母體提供氧氣，是否表示胎盤全部是母體細胞？</p><div class=\"quote\">6-4.2 <br>懷孕與分娩<br>絨毛膜<br>子宮內膜<br>胎盤<br>◇ 由<br>胎兒的絨毛膜<br>與<br>母體的子宮內膜<br>共同組成<br>◇ 貼附於子宮內壁<br>胎盤<br>胎盤<br>子宮外壁<br>羊膜<br>羊水<br>配合課本 <br>P190<small>原PPT第15頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l18", "t": "交換界面：分隔循環也能交換", "sec": "s3", "slide": 16, "sourceSlides": [16], "sourcePages": [], "src": "原PPT第16頁；課本P188–192", "figSpec": {"image": "placenta"}, "txt": "<h3>教學重點</h3><ul><li>母血在絨毛間的血腔，胎兒血在絨毛內血管。</li><li>氧氣、營養與代謝物跨界面交換。</li><li>用箭頭判讀方向，不把兩條循環畫成直接相通。</li></ul><p class=\"thinking\"><strong>想一想</strong> 沒有母血直接流入臍帶，胎兒為何仍能得到氧？</p><div class=\"scope-note\">範圍補充：正常胎盤交換模型中，母血與胎兒血循環分隔，物質跨屏障交換；不是母體血管直接接到臍血管。這不等於任何細胞永不跨越：人類研究可測到少量母胎細胞移行，不能寫「絕對零混合／零通過」。<a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC2923456/\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a></div><div class=\"quote\">6-4.2 <br>懷孕與分娩<br>絨毛膜<br>子宮內膜<br>胎盤<br>胎盤<br>子宮外壁<br>羊膜<br>羊水<br>→ <br>母體的抗體<br>可<br>進入胎兒體內，提供被動免疫保護<br>◇ 胎盤<br>密布血管<br>→ 胎兒與母體的血液不會直接混合<br>→<br> 胎兒與母體<br>進行氣體與物質的交換<br>血腔<br>母體的靜脈<br>母體<br>的動脈<br>胎兒的動脈<br>胎兒的靜脈<br>配合課本 <br>P190<br>、<br>191<br>產生二氧化碳、尿素等代謝廢物<br>提供氧氣、葡萄糖、胺基酸、水分及各種營養物質<small>原PPT第16頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l19", "t": "交換的方向：營養、廢物與抗體", "sec": "s3", "slide": 16, "sourceSlides": [16], "sourcePages": [4], "src": "原PPT第16頁；課本P188–192", "figSpec": {"image": "placenta"}, "txt": "<h3>教學重點</h3><ul><li>氧氣與葡萄糖等由母體方向供給胎兒。</li><li>二氧化碳、尿素等經胎盤移向母體。</li><li>可跨胎盤的母源抗體主要為IgG，提供被動免疫；不把所有抗體一律視為可通過。</li></ul><p class=\"thinking\"><strong>想一想</strong> 抗體能跨界面，是否表示整個母體循環直接流入胎兒？</p><div class=\"scope-note\">範圍補充：正常胎盤交換模型中，母血與胎兒血循環分隔，物質跨屏障交換；不是母體血管直接接到臍血管。這不等於任何細胞永不跨越：人類研究可測到少量母胎細胞移行，不能寫「絕對零混合／零通過」。<a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC2923456/\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a></div><div class=\"quote\">6-4.2 <br>懷孕與分娩<br>絨毛膜<br>子宮內膜<br>胎盤<br>胎盤<br>子宮外壁<br>羊膜<br>羊水<br>→ <br>母體的抗體<br>可<br>進入胎兒體內，提供被動免疫保護<br>◇ 胎盤<br>密布血管<br>→ 胎兒與母體的血液不會直接混合<br>→<br> 胎兒與母體<br>進行氣體與物質的交換<br>血腔<br>母體的靜脈<br>母體<br>的動脈<br>胎兒的動脈<br>胎兒的靜脈<br>配合課本 <br>P190<br>、<br>191<br>產生二氧化碳、尿素等代謝廢物<br>提供氧氣、葡萄糖、胺基酸、水分及各種營養物質<small>原PPT第16頁（完整原文）</small></div><div class=\"quote\">胎盤內密布血管，儘管胎兒與母體的血液不會直接混合，<br>但雙方可透過胎盤進行氣體與物質的交換。母體所提供的氧<br>氣、葡萄糖、胺基酸、水分及各種營養物質，會經由胎盤運<br>送至胎兒體內，支持其生長與發育；同時，胎兒產生的二氧<br>化碳、尿素等代謝廢物，則會透過胎盤進入母體血液後排出。<br>此外，胎盤還能讓母體的抗體進入胎兒體內，提供被動免疫保<br>護。在內分泌方面，胎盤也能分泌多種激素，如 hCG、動情素<br>與黃體素，協助維持子宮內膜的穩定與母體的妊娠狀態。胎盤<br>不僅是物質交換的構造，也是支持胎兒發育不可或缺的一環。<br>連接胎兒與胎盤的是臍帶，其中包含兩條臍動脈與一條臍<br>靜脈。臍動脈負責將胎兒血液中的廢物送至胎盤，臍靜脈則將<br>含氧氣與養分的血液送回胎兒體內，確保胎兒生長所需。隨著<br>胎兒逐漸發育，子宮體積與重量也大幅增加，子宮壁變得更具<br>彈性，以容納胎兒、羊水與胎盤。到了懷孕末期，胎兒體重接<br>近出生重量，各器官發育完成，特別是肺部已具備呼吸功能。<br>分娩（又稱生產）是胎兒自母體娩出的過程，通常發生於<br>懷孕約第 38∼40 週。當胎兒成熟、子宮擴張至一定程度，母<br>體會釋放催產素，刺激子宮平滑肌收縮。子宮收縮會進一步刺<br>激催產素分泌，引發正回饋機制，使收縮逐漸加強並更具規律<br>性，同時子宮頸擴張，胎兒經由產道（陰道）娩出，完成出<br>生。胎兒娩出後，胎盤也會隨之排出母體。<br>整體而言，懷孕期間胎盤與臍帶連結胎兒與母體，負責物<br>質交換與激素調控，而分娩則標誌著新生命與外界接觸的開<br>始，象徵懷孕階段的圓滿完成。<br>臍帶　umbilical cord<br>第 6 章  生殖　191<br><small>課本PDF第4頁，印刷P191（完整抽取原文；位置與字形以完整頁圖為準）</small></div>", "tb": [["book4", "P191完整課本頁"]]}, {"id": "b3-c64-l20", "t": "胎盤的內分泌：支持妊娠", "sec": "s3", "slide": 17, "sourceSlides": [17], "sourcePages": [], "src": "原PPT第17頁；課本P188–192", "figSpec": {"image": "PPT17S3"}, "txt": "<h3>教學重點</h3><ul><li>hCG早期支持黃體功能。</li><li>胎盤分泌動情素與黃體素等，支持妊娠環境。</li><li>交換器官與內分泌器官可以是同一構造。</li></ul><p class=\"thinking\"><strong>想一想</strong> 只用營養交換解釋胎盤，還漏了哪一類功能？</p><div class=\"quote\">→ 協助維持子宮內膜的穩定與母體的妊娠狀態<br>→<br> <br>如 <br>hCG<br>、<br>動情素<br>與<br>黃體素<br>◇ 胎盤可<br>分泌激素<br>絨毛膜<br>子宮內膜<br>胎盤<br>胎盤<br>子宮外壁<br>羊膜<br>羊水<br>血腔<br>母體的靜脈<br>母體<br>的動脈<br>胎兒的動脈<br>胎兒的靜脈<br>6-4.2 <br>懷孕與分娩<br>配合課本 <br>P190<br>、<br>191<small>原PPT第17頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l21", "t": "臍帶兩動一靜：以胎兒為基準", "sec": "s3", "slide": 18, "sourceSlides": [18], "sourcePages": [], "src": "原PPT第18頁；課本P188–192", "figSpec": {"image": "placenta"}, "txt": "<h3>教學重點</h3><ul><li>通常有兩條臍動脈，由胎兒流向胎盤。</li><li>一條臍靜脈，由胎盤流回胎兒，含氧與養分相對較高。</li><li>動／靜脈名稱取決於流向心臟的關係，不由含氧量直接命名。</li></ul><p class=\"thinking\"><strong>想一想</strong> 把「動脈一定高氧」套到臍帶，會發生什麼錯誤？</p><div class=\"quote\">絨毛膜<br>子宮內膜<br>胎盤<br>胎盤<br>子宮外壁<br>羊膜<br>羊水<br>血腔<br>母體的靜脈<br>母<br>體的動脈<br>6-4.2 <br>懷孕與分娩<br>◇<br> 連接胎兒與胎盤<br>◇ <br>包含兩條臍動脈與一<br>條<br><br>臍<br>靜脈<br>→ <br>臍動脈負責將胎兒<br>血液<br><br>中的<br>廢物送至胎盤<br>臍帶<br>→ <br>臍靜脈將含氧氣與<br>養分<br><br>的<br>血液送回胎兒體內<br>臍帶<br>臍<br>靜脈（ <br>1<br> 條 ）<br>臍<br>動脈（ <br>2<br> 條 ）　<br>配合課本 <br>P190<br>、<br>191<small>原PPT第18頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l22", "t": "分娩正回饋：訊號如何放大", "sec": "s3", "slide": 20, "sourceSlides": [20], "sourcePages": [], "src": "原PPT第20頁；課本P188–192", "figSpec": {"image": "PPT20S3"}, "txt": "<h3>教學重點</h3><ul><li>子宮收縮推動胎兒，增加子宮頸牽張。</li><li>牽張相關訊號促使催產素釋放，進一步加強子宮收縮。</li><li>教材描述的是放大迴路；不是所有分娩啟動因素的完整模型。</li></ul><p class=\"thinking\"><strong>想一想</strong> 胎兒娩出解除持續牽張後，迴路的輸入如何改變？</p><div class=\"quote\">◆ 分娩（又稱生產）<br>6-4.2 <br>懷孕與分娩<br>◇ <br>胎兒自母體娩出的過程<br>◇ <br>通常發生於懷孕約第 <br>38<br>～<br>40 <br>週<br>◇ <br>過程<br>：<br>胎兒成熟、子宮擴張至一定程度<br>母體會釋放催產素刺激子宮平滑肌收縮<br>引發正回饋機制，使收縮逐漸加強並更具規律性<br>子宮收縮會進一步刺激催產素分泌<br>子宮頸擴張，胎兒經由產道（陰道）娩出，完成出生<br>胎兒娩出後，胎盤也會隨之排出母體<br>配合課本 <br>P191<small>原PPT第20頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l23", "t": "產前檢查：先問能回答什麼", "sec": "s4", "slide": 21, "sourceSlides": [21], "sourcePages": [5], "src": "原PPT第21頁；課本P188–192", "figSpec": {"image": "screening"}, "txt": "<h3>教學重點</h3><ul><li>篩檢評估風險，診斷針對特定項目確認。</li><li>檢查種類、取樣來源與結果範圍分開比較。</li><li>知道結果可為照護做準備，不以檢查結果衡量生命價值。</li></ul><p class=\"thinking\"><strong>想一想</strong> 高風險結果是否等於胎兒一定有該疾病？</p><div class=\"scope-note\">判讀補充：母血篩檢評估風險，陽性不等於確診，陰性不保證沒有疾病。傳統血清激素／蛋白篩檢與cfDNA篩檢不是同一技術；cfDNA主要反映胎盤來源訊號。絨毛膜取樣及羊膜穿刺屬診斷取樣，但只回答實際檢測的項目，不保證排除所有疾病。<a href=\"https://www.acog.org/womens-health/faqs/prenatal-genetic-screening-tests\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a>；<a href=\"https://www.acog.org/womens-health/faqs/prenatal-genetic-diagnostic-tests\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a></div><div class=\"quote\">6-4.3 <br>產前遺傳篩檢<br>◆ 提早評估胎兒是否可能帶有異常染色體或遺傳疾病<br>，<br><br>協助<br>家庭做出充分準備<br>◆ 多為非侵入性或低風險技術，可依懷孕週數與<br>個別<br><br>情況<br>選擇進行<br>配合課本 <br>P192<small>原PPT第21頁（完整原文）</small></div><div class=\"quote\">檢<br>查<br>胎<br>兒<br>染<br>色<br>體<br>的<br>方<br>法<br>母血篩檢<br>（檢查母親血液）<br>羊膜穿刺術<br>絨毛膜取樣術<br>6-4.3 產前遺傳篩檢<br>隨著醫學進步，孕期中除了常規健康檢查外，也可透過產前遺傳篩檢，提早評估胎兒<br>是否可能帶有異常染色體或遺傳疾病，協助家庭做出充分準備。這類檢查多為非侵入性或<br>低風險技術，可依懷孕週數與個別情況選擇進行（圖 6－9）。<br>最常見的方法是母血篩檢，通常於懷孕第 10∼20 週間進行。藉著檢測母體血液中特<br>定激素與蛋白質濃度，搭配孕婦年齡與超音波數據，推估胎兒異常的風險高低。此法安全<br>且無侵入性，但僅能提供風險評估，無法確診。若母血篩檢結果顯示高風險，或有家族遺<br>傳病史，醫師可能進一步建議進行絨毛膜取樣術或羊膜穿刺術。<br>絨毛膜取樣術通常於懷孕約 10∼13 週進行，透過陰道或腹部穿刺方式，取出部分胎<br>盤絨毛膜組織進行染色體與基因分析，優點是可較早得知結果，但風險高於母血篩檢與羊<br>膜穿刺術。羊膜穿刺術則多在懷孕約 16∼20 週進行，藉由細針穿刺孕婦腹部，抽取少量<br>羊水，分析其中脫落的胎兒細胞與代謝物質。羊膜穿刺術能診斷多種染色體異常、神經管<br>缺陷與某些單基因遺傳疾病，準確率高，但屬於侵入性檢查，需經醫師專業評估後進行。<br>整體而言，產前遺傳篩檢能協助父母與醫療人員提早掌握胎兒狀況，減少遺傳疾病帶<br>來的風險與衝擊。選擇檢查方式時應考量孕婦年齡、家族病史及個人意願，在專業醫師指<br>導下做出最合適的選擇。<br> 圖 6－9　產前遺傳篩檢可透過染色體核型與生化分析來進行，目前主要有圖中的三種方法。<br>192　選修生物 Ⅲ (全)<br><small>課本PDF第5頁，印刷P192（完整抽取原文；位置與字形以完整頁圖為準）</small></div>", "tb": [["book5", "P192完整課本頁"]]}, {"id": "b3-c64-l24", "t": "母血篩檢：風險不是答案", "sec": "s4", "slide": 22, "sourceSlides": [22], "sourcePages": [], "src": "原PPT第22頁；課本P188–192", "figSpec": {"image": "screening"}, "txt": "<h3>教學重點</h3><ul><li>原教材重點為血清激素／蛋白與其他資料的整合。</li><li>cfDNA是另一類母血篩檢，不能和傳統血清方法混稱。</li><li>低風險不保證沒有異常，高風險也不是確診。</li></ul><p class=\"thinking\"><strong>想一想</strong> 結果「風險較高」和「已確認疾病」需要相同證據嗎？</p><div class=\"scope-note\">判讀補充：母血篩檢評估風險，陽性不等於確診，陰性不保證沒有疾病。傳統血清激素／蛋白篩檢與cfDNA篩檢不是同一技術；cfDNA主要反映胎盤來源訊號。絨毛膜取樣及羊膜穿刺屬診斷取樣，但只回答實際檢測的項目，不保證排除所有疾病。<a href=\"https://www.acog.org/womens-health/faqs/prenatal-genetic-screening-tests\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a>；<a href=\"https://www.acog.org/womens-health/faqs/prenatal-genetic-diagnostic-tests\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a></div><div class=\"quote\">母血篩檢<br>◆ <br>時間<br>：<br>通常<br>於懷孕第 <br>10<br>～<br>20 <br>週間進行<br>◆ <br>方式<br>：<br>檢測<br>母體血液中特定激素與蛋白質濃度<br>◆ <br>優點<br>：<br>安全<br>且無侵入性<br>6-4.3 <br>產前遺傳篩檢<br>◆ 常<br>搭配孕婦年齡與超音波數據，可推估胎兒異常的風險高低<br>◆ <br>缺點<br>：<br>僅<br>能提供風險評估，無法確診<br>母血篩檢<br>羊膜穿刺術<br>絨毛膜取樣術<br>配合課本 <br>P192<small>原PPT第22頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l25", "t": "絨毛膜取樣：看取的是哪一側", "sec": "s4", "slide": 23, "sourceSlides": [23], "sourcePages": [], "src": "原PPT第23頁；課本P188–192", "figSpec": {"image": "screening"}, "txt": "<h3>教學重點</h3><ul><li>取胎盤絨毛組織作特定染色體／基因分析。</li><li>胎盤來源與胎兒細胞來源要分清，結果需結合檢驗範圍解讀。</li><li>原教材的時程和風險敘述保留為來源，不當作固定個人處置規則。</li></ul><p class=\"thinking\"><strong>想一想</strong> 如果只知道取樣位置，是否已知道它能檢出所有疾病？</p><div class=\"scope-note\">檢查時程與風險：原教材列的孕週供來源閱讀，不是人人適用的檢查時間表。不同方法、檢驗項目與專業條件影響效益和風險；不沿用舊頁固定流產百分比或「零風險」，也不把兩種侵入取樣的風險排成永遠固定高低。知情討論後可選擇接受或拒絕檢查，不用結果評價生命價值。<a href=\"https://www.acog.org/clinical/clinical-guidance/practice-advisory/articles/2026/01/screening-for-fetal-chromosomal-abnormalities\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a>；<a href=\"https://www.acog.org/womens-health/faqs/prenatal-genetic-diagnostic-tests\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a></div><div class=\"quote\">◆ 高風險族群<br>◆ <br>時間<br>：<br>通常<br>於懷孕約 <br>10<br>～<br>13 <br>週進行<br>◆ <br>方法<br>：<br>透過<br>陰道或腹部穿刺方式，取出部分胎盤絨毛膜組織進行染色體與基因分析<br>◆ <br>優點<br>：<br>可<br>較早得知結果<br>6-4.3 <br>產前遺傳篩檢<br>絨毛膜取樣術<br>◆ <br>缺點<br>：<br>風險<br>高於母血篩檢與羊膜穿刺術<br>配合課本 <br>P192<br>母血篩檢<br>羊膜穿刺術<br>絨毛膜取樣術<small>原PPT第23頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l26", "t": "羊膜穿刺：樣本與檢測項目", "sec": "s4", "slide": 24, "sourceSlides": [24], "sourcePages": [], "src": "原PPT第24頁；課本P188–192", "figSpec": {"image": "screening"}, "txt": "<h3>教學重點</h3><ul><li>取少量羊水，分析其中細胞或相關物質。</li><li>羊水採樣不是直接抽取胎兒血液。</li><li>可檢出哪些問題取決於安排的檢驗；陰性不等於排除全部疾病。</li></ul><p class=\"thinking\"><strong>想一想</strong> 同樣是羊水樣本，不同分析是否可能回答不同問題？</p><div class=\"scope-note\">判讀補充：母血篩檢評估風險，陽性不等於確診，陰性不保證沒有疾病。傳統血清激素／蛋白篩檢與cfDNA篩檢不是同一技術；cfDNA主要反映胎盤來源訊號。絨毛膜取樣及羊膜穿刺屬診斷取樣，但只回答實際檢測的項目，不保證排除所有疾病。<a href=\"https://www.acog.org/womens-health/faqs/prenatal-genetic-screening-tests\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a>；<a href=\"https://www.acog.org/womens-health/faqs/prenatal-genetic-diagnostic-tests\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a></div><div class=\"quote\">6-4.3 <br>產前遺傳篩檢<br>羊膜穿刺術<br>◆ <br>時間<br>：<br>多<br>在懷孕約 <br>16<br>～<br>20 <br>週進行<br>◆ <br>方式<br>：<br>藉<br>由細針穿刺孕婦腹部，抽取少量羊水，分析其中脫落的胎兒細胞與代謝物質<br>◆ 高風險族群<br>◆ 可<br>診斷多種<br>染色體異常、神經管缺陷與某些單基因遺傳疾病<br>◆ <br>優點<br>：<br>準確率<br>高<br>◆ <br>缺點<br>：<br>屬於<br>侵入性檢查，需經醫師專業評估後進行<br>配合課本 <br>P192<br>母血篩檢<br>羊膜穿刺術<br>絨毛膜取樣術<small>原PPT第24頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l27", "t": "原題一：卵裂的數量與體積", "sec": "s4", "slide": 25, "sourceSlides": [25], "sourcePages": [], "src": "原PPT第25頁；課本P188–192", "figSpec": {"image": "PPT25S3"}, "txt": "<h3>教學重點</h3><ul><li>完整保留原題與四選項，原答案B。</li><li>核與細胞質皆分裂，細胞數增加。</li><li>早期總體積大致不變，平均分裂球變小。</li></ul><p class=\"thinking\"><strong>想一想</strong> 將「細胞變多」直接推成「總體積增大」，缺少什麼條件？</p><div class=\"quote\">  <br>Question<br>1<br>.<br> <br>人體<br>的胚胎發育過程中，受精卵會一邊發生卵裂，一邊向子宮方向移動，試問受精卵在發生卵裂過程時，細胞的分裂以及細胞的總體積變化情形分別為何？　<br>(A)<br>細胞核分裂，細胞質分裂，細胞總體積明顯變大　<br>(B)<br>細胞核分裂，細胞質分裂，細胞總體積大致不變　<br>(C)<br>細胞核分裂，細胞質不分裂，細胞總體積明顯變大　<br>(D)<br>細胞核不分裂，細胞質分裂，細胞總體積大致不變。<br>解答<br>：<br>(<br>B) <br>解析<br>：<br>受精卵發生卵裂的過程，細胞的數目會增多，但總體積大致不變。<br>25<small>原PPT第25頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c64-l28", "t": "原題二：查清時間起點", "sec": "s4", "slide": 26, "sourceSlides": [26], "sourcePages": [], "src": "原PPT第26頁；課本P188–192", "figSpec": {"image": "PPT26S3"}, "txt": "<h3>教學重點</h3><ul><li>完整保留原題與原答案A。</li><li>錯誤關鍵是「到達子宮後第6天」與「受精後第6天」不同。</li><li>原題的約267天、前2個月等按原教材語境理解，不能和所有臨床孕週等同。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若時間起點沒有標明，單看「第6天」能判斷嗎？</p><div class=\"scope-note\">原題定位：兩道原題題幹、A–D與原答案完整保留。原題二選A，錯誤關鍵是把時間起點移成「到達子宮後」；其餘時間敘述按原教材模型閱讀，再分辨受精後發育齡與孕週。<a href=\"https://medlineplus.gov/ency/article/002398.htm\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a></div><div class=\"quote\">  <br>Question<br>2<br>.<br> 下列<br>有關人類懷孕時期的生理特性，下列敘述何者<br>錯誤<br>？　<br>(<br>A)<br>受精卵到達子宮後的第 <br>6 <br>天，囊胚開始嵌入增厚的子宮內膜中進行著<br>床　<br>(<br>B)<br>懷孕是自受精至胎兒產出前的過程，平均約需 <br>267 <br>天　<br>(<br>C)<br>胚胎發育的前 <br>2 <br>個月稱為胚胎<br>期　<br>(<br>D)<br>胎兒藉由臍帶與胎盤從母體獲得氧氣與養分，並排出二氧化碳與其他廢物。<br>解答<br>：<br>(A)<br>解析<br>：<br>(<br>A)<br>卵受精後的第 <br>6 <br>天，囊胚便已在子宮內開始嵌入增厚的子宮內膜進行著床。<br>26<small>原PPT第26頁（完整原文）</small></div>", "tb": []}], "questions": [{"t": "三胚層：組織歸屬", "q": "將6張組織卡分到三個胚層。", "learn": 8, "tag": "layers", "hint": "每組2張，注意是器官的哪一種組織。", "why": "內襯與肌肉層可以來自不同胚層，不能整個器官一概而論。", "sub": "原PPT第10頁；課本P188–192", "refs": [{"src": "layers", "cap": "教材來源圖"}], "legacyQuestion": 1, "kind": "drag", "slots": [{"id": "g0s0", "label": "外胚層", "group": 0}, {"id": "g0s1", "label": "外胚層", "group": 0}, {"id": "g1s0", "label": "中胚層", "group": 1}, {"id": "g1s1", "label": "中胚層", "group": 1}, {"id": "g2s0", "label": "內胚層", "group": 2}, {"id": "g2s1", "label": "內胚層", "group": 2}], "pieces": [{"id": "ag0s0", "label": "神經系統", "group": 0}, {"id": "ag0s1", "label": "皮膚表皮", "group": 0}, {"id": "ag1s0", "label": "骨骼與肌肉", "group": 1}, {"id": "ag1s1", "label": "心血管系統", "group": 1}, {"id": "ag2s0", "label": "消化道內襯", "group": 2}, {"id": "ag2s1", "label": "呼吸道內襯", "group": 2}], "sol": {"g0s0": "ag0s0", "g0s1": "ag0s1", "g1s0": "ag1s0", "g1s1": "ag1s1", "g2s0": "ag2s0", "g2s1": "ag2s1"}, "pre": {}, "id": "b3-c64-q01"}, {"t": "兩種時鐘：先選起點", "q": "逐小題辨認計時與事件。", "learn": 1, "tag": "time", "hint": "題目問時計，不用數字硬配。", "why": "典型約2週是計時基準差，不是每個個體的精確定年。", "sub": "原PPT第2頁；課本P188–192", "refs": [{"src": "PPT02S3", "cap": "教材來源圖"}], "kind": "fill", "fig": "PPT02S3", "figCaption": "教材原圖（完整標示）", "imageW 否說明仍未知的項目", "是否尊重個人選擇與生命尊嚴"], "id": "b3-c64-q24"}], "tags": {"development": ["卵裂與囊胚", "細胞數、總體積、構造與分化分開。", "P188–189；PPT3–9、25"], "time": ["日齡、孕週與事件起點", "先指定受精、月經或抵達起點；開始與完成分開。", "P188–189、191；PPT2、8、26"], "layers": ["胚層與組織來源", "表皮、神經、中胚層組織與內襯，避免整器官概括。", "P189；PPT10–11"], "membrane": ["胚外膜與物種範圍", "早期支持構造、羊膜來源與人類尿囊功能分開。", "P189；PPT12"], "flow": ["臍帶血流方向", "以胎兒心臟為基準，兩動一靜，方向不靠氧量命名。", "P190–191；PPT18"], "exchange": ["胎盤界面與交換", "循環分隔不等於所有物質／細胞不能通過。", "P190–191；PPT15–16"], "hormone": ["hCG與胎盤內分泌", "早期黃體支持與後續妊娠環境；訊號不保證一切正常。", "P189、191；PPT12、17"], "feedback": ["分娩正回饋", "刺激、訊號、收縮與牽張回路，以及輸入解除。", "P191；PPT20"], "test": ["篩檢、診斷與檢測範圍", "風險不是確診，取樣位置與分析方法及範圍分開。", "P192；PPT21–24"], "evidence": ["原圖、來源與知情選擇", "不從示意圖補造臨床數字；尊重生命與選擇。", "P188–192；PPT1–26"]}, "conceptMap": {"development": 5, "time": 1, "layers": 8, "membrane": 13, "flow": 20, "exchange": 17, "hormone": 12, "feedback": 21, "test": 22, "evidence": 22}, "originalCount": 2, "source": {"pptPages": 26, "bookPages": 5, "printedPages": "188–192"}, "originalPPTQuestions": {"1": {"page": 25, "stem": "人體的胚胎發育過程中，受精卵會一邊發生卵裂，一邊向子宮方向移動，試問受精卵在發生卵裂過程時，細胞的分裂以及細胞的總體積變化情形分別為何？", "options": ["細胞核分裂，細胞質分裂，細胞總體積明顯變大", "細胞核分裂，細胞質分裂，細胞總體積大致不變", "細胞核分裂，細胞質不分裂，細胞總體積明顯變大", "細胞核不分裂，細胞質分裂，細胞總體積大致不變。"], "answers": ["B"], "grading": "single"}, "2": {"page": 26, "stem": "下列有關人類懷孕時期的生理特性，下列敘述何者錯誤？", "options": ["受精卵到達子宮後的第 6 天，囊胚開始嵌入增厚的子宮內膜中進行著床", "懷孕是自受精至胎兒產出前的過程，平均約需 267 天", "胚胎發育的前 2 個月稱為胚胎期", "胎兒藉由臍帶與胎盤從母體獲得氧氣與養分，並排出二氧化碳與其他廢物。"], "answers": ["A"], "grading": "single"}}, "references": {"age": "https://medlineplus.gov/ency/article/002398.htm", "blast": "https://www.nature.com/articles/s41596-023-00802-1", "lineage": "https://www.nature.com/articles/s41556-025-01696-9", "allantois": "https://pubmed.ncbi.nlm.nih.gov/34854363/", "blood": "https://pmc.ncbi.nlm.nih.gov/articles/PMC2923456/", "screen": "https://www.acog.org/womens-health/faqs/prenatal-genetic-screening-tests", "diagnosis": "https://www.acog.org/womens-health/faqs/prenatal-genetic-diagnostic-tests", "choice": "https://www.acog.org/clinical/clinical-guidance/practice-advisory/articles/2026/01/screening-for-fetal-chromosomal-abnormalities"}, "sourceCorrections": [{"pages": [188, 189, 190, 191, 192], "ppt": [2, 11, 13, 19, 20, 26], "note": "時間基準：教材的約38週與第1–8週／第9週起，依受精後發育齡理解；臨床孕週通常由末次月經首日算起，典型週期約多2週。兩者不能直接互換，個別週期與臨床定年亦會影響換算。<a href=\"https://medlineplus.gov/ency/article/002398.htm\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a>"}, {"pages": [188, 189, 190, 191, 192], "ppt": [6, 8, 26], "note": "來源差異：原教材寫受精後第3–4天形成囊胚並入子宮，屬簡化時序；現代人類發育資料常以約第5天為囊胚期。進入子宮、形成囊胚、開始著床與完成著床是不同事件，不能把「到達後第6天」當成「受精後第6天」。原文與原題保留，不以精確日數作新增判分題。<a href=\"https://www.nature.com/articles/s41596-023-00802-1\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a>"}, {"pages": [188, 189, 190, 191, 192], "ppt": [7, 9, 10, 12], "note": "譜系補充：內細胞團的胚體相關細胞具多能性，不等同單細胞可獨自形成完整個體的全能性。羊膜不能直接列為滋胚層的產物；絨毛膜也涉及胚外中胚層，原教材的譜系為概念簡化。<a href=\"https://www.nature.com/articles/s41556-025-01696-9\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a>"}, {"pages": [188, 189, 190, 191, 192], "ppt": [12], "note": "時間與物種：胚外膜在早期發育即開始形成，不是到胎兒期第9週才首次出現。人類尿囊為小型暫時構造，與臍部及尿囊管發育相關；不把鳥／爬蟲類蛋內尿囊的大量儲廢功能原封不動套在人類。胎兒主要經胎盤向母體排出代謝廢物。<a href=\"https://pubmed.ncbi.nlm.nih.gov/34854363/\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a>"}, {"pages": [188, 189, 190, 191, 192], "ppt": [16], "note": "範圍補充：正常胎盤交換模型中，母血與胎兒血循環分隔，物質跨屏障交換；不是母體血管直接接到臍血管。這不等於任何細胞永不跨越：人類研究可測到少量母胎細胞移行，不能寫「絕對零混合／零通過」。<a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC2923456/\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a>"}, {"pages": [188, 189, 190, 191, 192], "ppt": [13, 19], "note": "發育補充：胎兒期重點是生長與功能逐步成熟；器官初步形成不代表所有功能已完成。肺與神經系統等仍持續發育，不能把教材「發育完成」當成每個個體所有器官完全成熟的保證。<a href=\"https://medlineplus.gov/ency/article/002398.htm\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a>"}, {"pages": [188, 189, 190, 191, 192], "ppt": [21, 22, 24], "note": "判讀補充：母血篩檢評估風險，陽性不等於確診，陰性不保證沒有疾病。傳統血清激素／蛋白篩檢與cfDNA篩檢不是同一技術；cfDNA主要反映胎盤來源訊號。絨毛膜取樣及羊膜穿刺屬診斷取樣，但只回答實際檢測的項目，不保證排除所有疾病。<a href=\"https://www.acog.org/womens-health/faqs/prenatal-genetic-screening-tests\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a>；<a href=\"https://www.acog.org/womens-health/faqs/prenatal-genetic-diagnostic-tests\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a>"}, {"pages": [188, 189, 190, 191, 192], "ppt": [21, 23, 24], "note": "檢查時程與風險：原教材列的孕週供來源閱讀，不是人人適用的檢查時間表。不同方法、檢驗項目與專業條件影響效益和風險；不沿用舊頁固定流產百分比或「零風險」，也不把兩種侵入取樣的風險排成永遠固定高低。知情討論後可選擇接受或拒絕檢查，不用結果評價生命價值。<a href=\"https://www.acog.org/clinical/clinical-guidance/practice-advisory/articles/2026/01/screening-for-fetal-chromosomal-abnormalities\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a>；<a href=\"https://www.acog.org/womens-health/faqs/prenatal-genetic-diagnostic-tests\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a>"}, {"pages": [188, 189, 190, 191, 192], "ppt": [25, 26], "note": "原題定位：兩道原題題幹、A–D與原答案完整保留。原題二選A，錯誤關鍵是把時間起點移成「到達子宮後」；其餘時間敘述按原教材模型閱讀，再分辨受精後發育齡與孕週。<a href=\"https://medlineplus.gov/ency/article/002398.htm\" target=\"_blank\" rel=\"noopener noreferrer\">來源與範圍參考</a>"}]};

function splitBlock(node,body){
 // Range fragments keep inline emphasis and every character when a long paragraph needs another page.
 const length=node.textContent.length;if(!length)return [node];const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT),texts=[];let n,offset=0;while(n=walker.nextNode()){texts.push({node:n,start:offset,end:offset+n.length});offset+=n.length;}

 const parts=[];let from=0;while(from<length){let lo=from+1,hi=length,best=lo;while(lo<=hi){const mid=(lo+hi)>>1,c=fragment(from,mid);body.replaceChildren(c);if(body.scrollHeight<=body.clientHeight+1){best=mid;lo=mid+1;}else hi=mid-1;}

  parts.push(fragment(from,best));from=best;

}
function paginateReading(){

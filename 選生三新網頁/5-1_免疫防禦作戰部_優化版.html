const CONTENT={"pptText": {"1": "5\n-1 \n免疫系統\n5-1.1 \n白血球的種類\n5-1.2 \n淋巴器官\n5-1.3 \n免疫反應\n1", "2": "5\n-1 \n免疫系統\n◆ 免疫反應牽涉多種分子、細胞、組織及器官的合作\n→ \n淋巴循環系統\n在免疫防禦中扮演關鍵角色\n→ 透過\n心血管循環系統\n與\n淋巴循環系統\n彼此相互聯繫\n淋巴\n循環\n系統\n胸腺\n脾臟\n淋巴管\n淋巴結\n骨髓\n配合課本 \nP44\n、\n142", "3": "5-1.1 \n白血球的種類\n◆ 白血球是人體的免疫細胞\n◆ 正常成人每微\n升（\nμL\n）血液\n中約\n有 \n4000\n～\n9000\n 個\n白血球\n◆ \n種類繁多\n，共同參與免疫防禦\n配合課本 \nP142", "4": "5-1.1 \n白血球的種類\n造血幹細胞\n骨髓先驅細胞\n淋巴先驅細胞\n分化\n骨髓中\nB\n細胞\nT\n細胞\n自然殺手細胞\n樹\n突\n細胞\n單核球\n肥大\n細胞\n嗜中性球\n紅血球\n巨\n核\n細胞\n巨\n噬\n細胞\n嗜酸性球\n嗜鹼性球\n血小板\n分化\n分化\n配合課本 \nP143\n顆粒球", "5": "  \n知識補給站\n自然殺手\n細胞（\nNK\n）\n       自然殺手細胞是一種參與先天性防禦的淋巴球，能辨識\n腫瘤細胞\n及\n被病毒感染的細胞\n，並\n釋放物質破壞目標細胞\n。在對抗腫瘤細胞時，自然殺手細胞是強而有力的武器，體積雖比腫瘤細胞小，但能黏附在腫瘤細胞上，將其破壞並清除（右圖）。\n利用掃描式電子顯微鏡觀察，自然殺手細胞（橘紅色）接觸腫瘤細胞（淺藍色）\n配合課本 \nP143\n5\n10\n \nµm", "6": "5-1.1 \n白血球的種類\n◆ \n下表為\n血液檢查報告\n單\n：\n（紅\n字代表\n異常）（\n1\n \nμL\n＝\n0.001 mL\n；\n1 dL\n＝\n100 \nmL\n）\n配合課本 \nP144", "7": "5-1.1 \n白血球的種類\n◆ \n根據白血球數量的變化，可推測人體可能正面臨的外來威脅\n→ 可能為病毒感染\n◇ 嗜中性球增加\n→ 可能為細菌感染\n◇ 嗜酸性球\n增加\n→ 可能為寄生蟲感染\n◇ 淋巴球增加\n配合課本 \nP144\n◆ 臨床\n上，血液檢查報告可結合病史與其他檢查結果進行疾病診斷", "8": "  \n知識補給站\n病原體\n       在空氣、食品、飲水、甚至人體內外，有許多會\n引起疾病的生物或物質\n，稱為\n病原體\n，由\n病原體感染宿主而引起的疾病\n即為\n傳染病\n。\n       病原體的種類很多，包括病毒、細菌、菌物、原生生物和多細胞的寄生蟲等，其中針對病毒、細菌及寄生蟲等病原體介紹如下：\n流行性感冒病毒\n配合課本 \nP145\n100\n \nnm\n8", "9": "  \n知識補給站\n病原體\n腺病毒\n蛋白質殼體\n醣蛋白\nDNA\n◆\n \n病毒\n◇ 構造\n▪ \n核心\n：\n成\n分為核酸\n→ \nDNA \n病毒\n：\n腺\n病毒\n、\n天花病毒、\nB \n型\n肝炎病毒等\n▪ \n殼\n體\n：\n成\n分為蛋白質\n▫ 依核酸不同，可\n分為\n→ \nRNA \n病毒\n：\n流行性感冒\n病毒、人類免疫缺失症病毒（\nHIV\n）、\n新冠\n肺炎病毒等\n配合課本 \nP145\n9", "10": "  \n知識補給站\n病原體\n▪ \n套膜\n▫ \n有些病毒\n有\n▫ 在殼體之外\n▫ 組成類似細胞膜\n新冠\n病毒（\nSARS-CoV-2\n）\n醣蛋白\n套膜\nRNA \n與\n蛋白質\n殼體\n▪ \n醣蛋白\n▫ \n可\n與宿主細胞表面特定受體結合，進入宿主細胞內\n▫ \n在套膜或殼體上\n配合課本 \nP145\n10", "11": "  \n知識補給站\n病原體\n◇ \n病毒可能誘發宿主細胞的基因突變導致癌症\n◇ \n病毒缺乏酵素系統，所以必須在宿主細胞內進行增殖\n▪ \nB \n型肝炎病毒\n可能導致\n肝癌\n▪ \n人類乳突病毒\n可能導致\n子宮頸癌\n與\n頭頸癌\n配合課本 \nP145\n11", "12": "  \n知識補給站\n病原體\n◇ \n部分種類會引起人類或動、植物的疾病\n◆\n \n細菌\n◇ \n分類\n：\n原\n核生物\n配合課本 \nP145\n結核桿菌\n1\n \nµm\n12", "13": "  \n知識補給站\n病原體\n◇ 有些細菌侵入宿主的組織或細胞後，會產生毒素\n外毒素\n內毒素\n成　分\n蛋白質\n多為脂多醣\n產生機制\n由細菌分泌到細胞外\n在細菌破裂時被釋出\n毒　性\n較強\n較弱\n◇ 細菌產生的毒素\n分為外毒素與\n內毒素\n：\n配合課本 \nP145\n13", "14": "  \n知識補給站\n病原體\n▪\n 單細胞\n生物\n：\n◆ \n寄生蟲\n◇ \n種類\n：\n單細胞\n原生生物或多細胞動物\n◇ \n傳播\n：\n食物\n、飲水、飛沫、蚊蟲叮咬或傷口入侵\n▫ 阿米巴原\n蟲\n：\n阿米巴\n痢疾；\n由\n受汙染的飲水傳播\n▫ \n瘧原蟲\n：\n瘧疾\n；\n由蚊蟲叮咬傳播\n▫ 蟯蟲、蛔蟲、\n絛蟲\n：\n寄生\n於腸道\n▪ 多細胞\n動物\n：\n▫ 中華\n肝吸蟲\n：\n寄生\n於肝臟\n配合課本 \nP145\n絛蟲\n2\n \ncm\n14", "15": "5-1.2 \n淋巴器官\n初級淋巴器官\n胸腺\n骨髓\n◆ \n初級淋巴器官\n◇ 是淋巴球製造或發育成熟的地方\n骨髓\n▪ B \n細胞發育成熟的場所\n▪ 含\n造血幹細胞，\n可分化為所有血球細胞\n◇ 包括\n骨髓\n、\n胸腺\n◆ 分為\n初級淋巴器官\n與\n次級淋巴器官\n配合課本 \nP146", "16": "5-1.2 \n淋巴器官\n胸腺\n骨髓\n▪ 嬰兒期開始發育，至青春期最為發達，成年後則逐漸退化，由脂肪組織等填充取代\n胸腺\n▪ 位於心臟的腹面上方\n▪ 分為左、右兩葉\n初級淋巴器官\n配合課本 \nP146", "17": "▪ 骨髓中形成\n的 \nT \n細胞可在胸腺中發育成熟\n5-1.2 \n淋巴器官\n骨髓\n造血幹細胞\n淋巴先驅細胞\n進入胸腺\n胸腺\n分化發育\n成熟\n的 \nT\n 細胞\n成熟\n的 \nB\n 細胞\n分化發育\n配合課本 \nP146\n、\n147", "18": "5-1.2 \n淋巴器官\n次級淋巴器官\n扁桃腺\n淋巴結\n◆ \n次級淋巴器官\n◇ 包括\n扁桃腺\n、\n淋巴結\n及\n脾臟\n等\n◇ 是淋巴球執行免疫反應的重要場所\n脾臟\n配合課本 \nP146\n、\n147", "19": "◆ 免疫\n過程\n：\n5-1.2 \n淋巴器官\n淋巴結\n脾臟\n病原體穿透皮膚或黏膜\n皮膚或黏膜\n組織中\n的吞噬細胞\n辨識並吞噬\n病原體\n吞噬細胞\n進入鄰近的次級淋巴器官\n◇ 扁桃腺\n：\n攔截\n經由口腔與鼻腔進入的病原體\n◇ \n淋巴結\n：\n過濾\n淋巴中的異物\n◇ \n脾臟\n：\n過濾\n血液中的異物\n包括嗜中性球\n、\n巨\n噬細胞及樹突細胞\n扁桃腺\n次級淋巴器官\n配合課本 \nP146\n、\n147", "20": "5-1.2 \n淋巴器官\n淋巴結\n脾臟\n吞噬細胞活化次級淋巴器官中特定淋巴球\n特定淋巴球進行大量增殖與分化，引發免疫反應\n扁桃腺\n次級淋巴器官\n配合課本 \nP146\n、\n147", "21": "       當免疫細胞大量聚集\n於次級淋巴器官\n並進行活化時，可能導致該部位出現發炎與腫大，如感冒時出現的扁桃腺發炎或淋巴結腫大，即是免疫反應活躍的表現。\n5-1.2 \n淋巴器官\n正常的扁桃腺\n發炎時的扁桃腺\n配合課本 \nP146\n、\n147", "22": "5-1.3 \n免疫反應\n皮膜屏障\n第三道防線\n第一道防線\n第二道防線\n免疫反應\n後天性免疫\n先天\n性免疫\n非專一性防禦\n專一性防禦\n體液免疫\n細胞媒介免疫\n吞噬作用\n發炎反應\n化學\n物質（補\n體、干擾素\n等）\n自然殺手細胞\n配合課本 \nP148", "23": "◆ \n先天性免疫\n又稱\n非專一性防禦\n◆ \n後天性免疫\n又稱\n專一性防禦\n5-1.3 \n免疫反應\n→與生俱來，未針對特定對象，沒有記憶性\n→需經訓練、活化，針對特定對象，有記憶性\n補充", "24": "後\n天性免疫\n5-1.3 \n免疫反應\n先天性免疫\n皮膜屏障\n自然殺手細胞\n樹突細胞\n嗜中性球\n巨噬細胞\n吞噬細胞\n化學\n物質\n（補\n體、干擾素\n等）\n第三道防線\n細胞媒介免疫\nB\n細胞\n漿細胞\n抗體\n分泌\nT\n 細胞\n抗原呈現細胞\n細菌\nT\n 細胞\n作用\n第二道防線\n第一道防線\n體液免疫\n配合課本 \nP148\n24", "25": "  \nQuestion\n1. \n白血球是體內重要的免疫細胞，下列有關各種白血球的敘述何者正確\n？　\n(\nA)\n嗜鹼性球無吞噬功能，不屬於\n白血球\n\n(\nB)\n樹突細胞可自單核球或骨髓的原始髓細胞分化而\n來\n\n(\nC)\n巨噬細胞也屬於顆粒性白血球，吞噬能力較強 \n　\n(D)\n \nB\n 細胞\n由來自骨髓的原始淋巴球分化，\nT \n細胞則由來自胸腺的原始淋巴球分化。\n解答\n：\n(\nB)\n \n解析\n：\n(\nA)\n嗜鹼性球雖無吞噬功能，但仍屬於顆粒性白血球\n。\n(\nC)\n巨噬細胞屬於單核性白血球\n。\n(\nD)\n淋巴球皆來自骨髓的原始淋巴球分化，\nB \n細胞繼續在骨髓發育成熟，\nT \n細胞則在胸腺發育成熟。\n25", "26": "  \nQuestion\n2. \n下列有關淋巴器官的敘述，何者正確\n？　\n(\nA)\n各種血球生成及成熟的部位屬於初級淋巴\n器官　\n(\nB)\n初級淋巴器官皆可生成\n血球　\n(\nC)\n次級淋巴器官僅可過濾淋巴中的\n病原體　\n(\nD)\n淋巴結平均分布在身體各處。\n解答\n：\n(\nA)\n \n解\n析\n：\n(\nB)\n初級淋巴器官包括骨髓與胸腺，骨髓可生成各種血球，胸腺負責 \nT \n細胞的成熟。\n(C)\n次級淋巴器官包括脾臟、淋巴結及扁桃腺，脾臟可過濾血液，淋巴結負責過濾淋巴。\n(D)\n淋巴結主要分布於頸部、腋下、鼠蹊部及內臟周圍，並非平均分布。\n26"}, "lessons": [{"id": "b3-c51-l01", "t": "防禦是一張網：細胞、器官與循環", "sec": "s1", "slide": 1, "sourceSlides": [1, 2], "sourcePages": [1], "src": "原PPT第 1–2 頁；課本 P142–144", "figSpec": {"image": "organs"}, "txt": "<ul><li>免疫反應牽涉分子、細胞、組織與器官共同合作。</li><li>心血管與淋巴循環聯繫不同部位，讓細胞及訊息移動。</li><li>是否感染同時受接觸程度、傳播途徑及宿主防禦等影響，不能只看單一因素。</li></ul><p class=\"think\">局部組織的入侵訊息，如何傳到淋巴器官？</p><div class=\"quote\">5<br>-1 <br>免疫系統<br>5-1.1 <br>白血球的種類<br>5-1.2 <br>淋巴器官<br>5-1.3 <br>免疫反應<br>1<small>原PPT第 1 頁（完整原文）</small></div><div class=\"quote\">5<br>-1 <br>免疫系統<br>◆ 免疫反應牽涉多種分子、細胞、組織及器官的合作<br>→ <br>淋巴循環系統<br>在免疫防禦中扮演關鍵角色<br>→ 透過<br>心血管循環系統<br>與<br>淋巴循環系統<br>彼此相互聯繫<br>淋巴<br>循環<br>系統<br>胸腺<br>脾臟<br>淋巴管<br>淋巴結<br>骨髓<br>配合課本 <br>P44<br>、<br>142<small>原PPT第 2 頁（完整原文）</small></div><div class=\"quote\">人體的免疫反應牽涉多種分子、細胞、組織及器官的合作，<br>並透過心血管循環系統與淋巴循環系統彼此相互聯繫，其中淋巴<br>循環系統在免疫防禦中扮演關鍵角色。日常生活中，流感病毒隨<br>著患者的飛沫四處飛散，但並非每個人都會生病，因為是否會得<br>流感，和個人的免疫力強弱、傳染途徑及接觸病毒的程度等密切<br>有關。<br>5-1.1 白血球的種類<br>人體血液中含有多種各具功能的白血球，共同參與免疫防<br>禦。這些白血球是由骨髓中的造血幹細胞分化而來，造血幹細胞<br>先分化為骨髓先驅細胞與淋巴先驅細胞，骨髓先驅細胞除了分化<br>為紅血球與巨核細胞外，亦會分化形成嗜中性球、嗜酸性球、嗜<br>鹼性球、肥大細胞及單核球，其中單核球亦可進一步分化為巨噬<br>細胞或樹突細胞。淋巴先驅細胞則分化為T 細胞、B 細胞及自然<br>殺手細胞等。樹突細胞除了可由單核球分化而來，亦可由骨髓先<br>驅細胞與淋巴先驅細胞直接分化形成（圖5－1）。<br>白血球是人體的免疫細胞，正常成人每微升（μL）血液中約<br>有4000∼9000 個白血球。多樣化的免疫細胞各司其職，並在相<br>互協助下，共同執行人體的防禦功能。<br>-1 免疫系統<br>5<br>造血幹細胞　hematopoietic stem cell<br>嗜中性球　neutrophil<br>嗜酸性球　eosinophil<br>嗜鹼性球　basophil<br>班上同學得了流行性感冒，在教室內打噴嚏且沒有戴口罩，幾天後，<br>其他同學也陸續出現相似的症狀，為什麼會有這樣的情況發生？為何有些<br>同學會得流感，有些卻不會呢？<br>肥大細胞　mast cell<br>單核球　monocyte<br>巨噬細胞　macrophage<br>樹突細胞　dendritic cell<br>142　選修生物 Ⅲ (全)<br><small>課本PDF第 1 頁，印刷P142（文字抽取原文；以完整頁圖核對）</small></div>", "tb": [["BOOK1", "P142 完整課本頁"]]}, {"id": "b3-c51-l02", "t": "從共同起點，看見不同血球", "sec": "s1", "slide": 3, "sourceSlides": [3, 4], "sourcePages": [2], "src": "原PPT第 3–4 頁；課本 P142–144", "figSpec": {"image": "lineage"}, "txt": "<ul><li>各類血球源自骨髓造血幹細胞，教材分為骨髓及淋巴先驅兩大支。</li><li>B、T與NK屬淋巴球；紅血球、血小板不能因出現在同圖就稱白血球。</li><li>教材正常成人約4000–9000個/μL是概括範圍；檢驗單仍依其列出的參考區間判讀。</li></ul><p class=\"think\">從血小板沿箭頭回溯，會直接回到單核球嗎？</p><div class=\"quote\">5-1.1 <br>白血球的種類<br>◆ 白血球是人體的免疫細胞<br>◆ 正常成人每微<br>升（<br>μL<br>）血液<br>中約<br>有 <br>4000<br>～<br>9000<br> 個<br>白血球<br>◆ <br>種類繁多<br>，共同參與免疫防禦<br>配合課本 <br>P142<small>原PPT第 3 頁（完整原文）</small></div><div class=\"quote\">5-1.1 <br>白血球的種類<br>造血幹細胞<br>骨髓先驅細胞<br>淋巴先驅細胞<br>分化<br>骨髓中<br>B<br>細胞<br>T<br>細胞<br>自然殺手細胞<br>樹<br>突<br>細胞<br>單核球<br>肥大<br>細胞<br>嗜中性球<br>紅血球<br>巨<br>核<br>細胞<br>巨<br>噬<br>細胞<br>嗜酸性球<br>嗜鹼性球<br>血小板<br>分化<br>分化<br>配合課本 <br>P143<br>顆粒球<small>原PPT第 4 頁（完整原文）</small></div><div class=\"quote\">B 細胞<br>T 細胞<br>自然殺手細胞<br>樹突細胞<br>單核球<br>肥大細胞<br>嗜中性球<br>嗜酸性球<br>嗜鹼性球<br>紅血球<br>巨核細胞<br>血小板<br>巨噬細胞<br>顆粒球<br>造血幹細胞<br>淋巴先驅細胞<br>骨髓先驅細胞<br> 圖5－1　血液中血球的種類及其細胞起源<br>自然殺手細胞（NK）<br>自然殺手細胞是一種參與先天性防禦的淋巴球，能辨識腫瘤<br>細胞及被病毒感染的細胞，並釋放物質以破壞目標細胞。在對抗<br>腫瘤細胞時，自然殺手細胞是強而有力的武器，體積雖比腫瘤細<br>胞小，但能黏附在腫瘤細胞上，將其破壞並清除（右圖）。<br>知識補給站<br> 利用掃描式電子顯微鏡觀察，自然殺手細胞（橘紅色）<br>接觸腫瘤細胞（淺藍色）。（顏色為電腦套色）<br>自然殺手細胞   natural  killer  cell, NK<br>10 μm<br>第 5 章  防禦　143<br><small>課本PDF第 2 頁，印刷P143（文字抽取原文；以完整頁圖核對）</small></div>", "tb": [["BOOK2", "P143 完整課本頁"]]}, {"id": "b3-c51-l03", "t": "來源與功能：兩種分類不要混用", "sec": "s1", "slide": 4, "sourceSlides": [4], "sourcePages": [], "src": "原PPT第 4 頁；課本 P142–144", "figSpec": {"image": "lineage"}, "txt": "<ul><li>顆粒球包括嗜中性球、嗜酸性球、嗜鹼性球；不是所有吞噬細胞都是顆粒球。</li><li>單核球可分化為巨噬細胞；樹突細胞在教材有多條來源箭頭。</li><li>「同一分化來源」與「執行相似功能」是不同的分組標準。</li></ul><p class=\"think\">NK與T細胞同屬淋巴球，是否因此有完全相同的防禦角色？</p><div class=\"scope-note\">此圖為教材的簡化分化架構；不把每種組織巨噬細胞或樹突細胞都限定為成人血中單核球的單一路徑。</div><div class=\"quote\">5-1.1 <br>白血球的種類<br>造血幹細胞<br>骨髓先驅細胞<br>淋巴先驅細胞<br>分化<br>骨髓中<br>B<br>細胞<br>T<br>細胞<br>自然殺手細胞<br>樹<br>突<br>細胞<br>單核球<br>肥大<br>細胞<br>嗜中性球<br>紅血球<br>巨<br>核<br>細胞<br>巨<br>噬<br>細胞<br>嗜酸性球<br>嗜鹼性球<br>血小板<br>分化<br>分化<br>配合課本 <br>P143<br>顆粒球<small>原PPT第 4 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c51-l04", "t": "NK細胞：淋巴球也能參與先天防禦", "sec": "s1", "slide": 5, "sourceSlides": [5], "sourcePages": [], "src": "原PPT第 5 頁；課本 P142–144", "figSpec": {"image": "nk"}, "txt": "<ul><li>NK可辨識並破壞部分腫瘤細胞或病毒感染細胞，參與先天免疫。</li><li>淋巴球是細胞類別；先天／後天免疫是防禦機制的分類。</li><li>掃描電子顯微照片為電腦套色，10μm尺度線表示該線段的實際長度。</li></ul><p class=\"think\">橘紅色是細胞的天然顏色，還是影像標示？</p><div class=\"scope-note\">NK整合活化與抑制受體訊號；MHC-I降低是一種辨識線索，不是只要缺少MHC-I便必定被殺死的單一開關。<a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC3868343/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote\">  <br>知識補給站<br>自然殺手<br>細胞（<br>NK<br>）<br>       自然殺手細胞是一種參與先天性防禦的淋巴球，能辨識<br>腫瘤細胞<br>及<br>被病毒感染的細胞<br>，並<br>釋放物質破壞目標細胞<br>。在對抗腫瘤細胞時，自然殺手細胞是強而有力的武器，體積雖比腫瘤細胞小，但能黏附在腫瘤細胞上，將其破壞並清除（右圖）。<br>利用掃描式電子顯微鏡觀察，自然殺手細胞（橘紅色）接觸腫瘤細胞（淺藍色）<br>配合課本 <br>P143<br>5<br>10<br> <br>µm<small>原PPT第 5 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c51-l05", "t": "血液檢查：先讀數量、單位與區間", "sec": "s1", "slide": 6, "sourceSlides": [6], "sourcePages": [3], "src": "原PPT第 6 頁；課本 P142–144", "figSpec": {"image": "report"}, "txt": "<ul><li>WBC 15.00×10³/μL即每微升15000個，超出此表3.99–10.3×10³/μL。</li><li>淋巴球61%高於表中19–48%；嗜中性球28%低於表中40–74%。</li><li>紅字代表相對此表參考區間異常，不直接代表某一病原或疾病。</li></ul><p class=\"think\">15.00的數字後面，若漏掉×10³會造成多大差異？</p><div class=\"quote\">5-1.1 <br>白血球的種類<br>◆ <br>下表為<br>血液檢查報告<br>單<br>：<br>（紅<br>字代表<br>異常）（<br>1<br> <br>μL<br>＝<br>0.001 mL<br>；<br>1 dL<br>＝<br>100 <br>mL<br>）<br>配合課本 <br>P144<small>原PPT第 6 頁（完整原文）</small></div><div class=\"quote\">檢測項目<br>結果<br>標準值<br>單位<br>白血球（WBC）<br>15.00 （3.99∼10.3）<br>×10<br>3／μL<br>紅血球（RBC）<br>5.00<br>（男：4.21∼5.9　女：3.78∼5.25）<br>×10<br>6／μL<br>血紅素（Hb）<br>15.40 （男：13.1∼17.2　女：11.0∼15.2）<br>g／dL<br>血小板（Platelet）<br>203.00 （130∼400）<br>×10<br>3／μL<br>嗜中性球（Neutrophil）<br>28.00 （40∼74）<br>％<br>淋巴球（Lymphocyte）<br>61.00 （19∼48）<br>％<br>單核球（Monocyte）<br>6.00<br>（3.4∼9）<br>％<br>嗜酸性球（Eosinophil）<br>5.00<br>（0∼7）<br>％<br>嗜鹼性球（Basophil）<br>0.00<br>（0∼1）<br>％<br> 表5－1　血液檢查報告單，紅字代表異常。（1μL＝0.001 mL；1 dL＝100 mL）<br>健康檢查時可獲得如表 5－1 所示的血液檢查報告<br>單，顯示各種血球的種類與數量。其中，不同種類的白<br>血球在面對病原體時會發揮不同的防禦作用，因此根據<br>白血球數量的變化，可推測人體可能正面臨的外來威脅。<br>例如：當嗜中性球的比例與總數增加時，常見於細菌感<br>染；嗜酸性球上升時，多與寄生蟲感染有關；若淋巴球的<br>比例及總數明顯上升，則可能為病毒感染（如表 5－1 所<br>示）。臨床上，血液檢查報告在判斷感染類型上具有一定<br>參考價值，可結合病史與其他檢查結果進行疾病診斷。<br>144　選修生物 Ⅲ (全)<br><small>課本PDF第 3 頁，印刷P144（文字抽取原文；以完整頁圖核對）</small></div>", "tb": [["BOOK3", "P144 完整課本頁"]]}, {"id": "b3-c51-l06", "t": "百分比與絕對數：讀表再多走一步", "sec": "s1", "slide": 7, "sourceSlides": [7], "sourcePages": [], "src": "原PPT第 7 頁；課本 P142–144", "figSpec": {"image": "report"}, "txt": "<ul><li>某類白血球絕對數＝總WBC×該類比例。</li><li>此例淋巴球為15000×0.61＝9150/μL；嗜中性球為15000×0.28＝4200/μL。</li><li>嗜中性球比例偏低，不能單憑此值說絕對數也偏低；還需對應的絕對數參考區間。</li></ul><p class=\"think\">兩份報告都寫40%，若WBC不同，是否代表相同細胞數？</p><div class=\"scope-note\">教材感染關聯是推測線索；總數、比例、其他資料共同解讀。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK261/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote\">5-1.1 <br>白血球的種類<br>◆ <br>根據白血球數量的變化，可推測人體可能正面臨的外來威脅<br>→ 可能為病毒感染<br>◇ 嗜中性球增加<br>→ 可能為細菌感染<br>◇ 嗜酸性球<br>增加<br>→ 可能為寄生蟲感染<br>◇ 淋巴球增加<br>配合課本 <br>P144<br>◆ 臨床<br>上，血液檢查報告可結合病史與其他檢查結果進行疾病診斷<small>原PPT第 7 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c51-l07", "t": "病原體：種類、尺度與進入途徑", "sec": "s2", "slide": 8, "sourceSlides": [8], "sourcePages": [4], "src": "原PPT第 8 頁；課本 P145", "figSpec": {"image": "pathogens"}, "txt": "<ul><li>病原體可包括病毒、細菌、菌物、原生生物及多細胞寄生蟲等。</li><li>教材三圖尺度分別100nm、1μm、2cm，不能以版面照片大小比較真實大小。</li><li>接觸病原不等同一定發病，入侵與宿主反應也是判斷條件。</li></ul><p class=\"think\">三張照片印得差不多大，為何仍有不同尺度線？</p><div class=\"quote\">  <br>知識補給站<br>病原體<br>       在空氣、食品、飲水、甚至人體內外，有許多會<br>引起疾病的生物或物質<br>，稱為<br>病原體<br>，由<br>病原體感染宿主而引起的疾病<br>即為<br>傳染病<br>。<br>       病原體的種類很多，包括病毒、細菌、菌物、原生生物和多細胞的寄生蟲等，其中針對病毒、細菌及寄生蟲等病原體介紹如下：<br>流行性感冒病毒<br>配合課本 <br>P145<br>100<br> <br>nm<br>8<small>原PPT第 8 頁（完整原文）</small></div><div class=\"quote\">病原體<br>在空氣、食品、飲水、甚至人體內外，有許多會引起疾病的生物或物質，稱為病原體，由病原體感<br>染宿主而引起的疾病即為傳染病。病原體的種類很多，包括病毒、細菌、菌物、原生生物和多細胞的寄<br>生蟲等，其中針對病毒、細菌及寄生蟲等病原體介紹如下：<br>1. 病毒：<br>病毒主要由核酸構成的核心及蛋白質構成的殼體所組成。根據遺傳物質的不同，病毒可分為 DNA 病<br>毒與 RNA 病毒，如天花、B 型肝炎等由 DNA 病毒引起；流行性感冒、愛滋病、新冠肺炎等由 RNA 病<br>毒引起（圖a）。<br>有些病毒在蛋白質殼體之外還有一層組成類似細胞膜的套膜，套膜與殼體上具有醣蛋白，會與宿主<br>細胞表面特定受體結合，進入宿主細胞內。<br>另外，因病毒缺乏酵素系統，所以必須在宿主細胞內進行增殖。此外，病毒可能誘發宿主細胞的基<br>因突變導致癌症，例如：B 型肝炎病毒可能導致肝癌，以及人類乳突病毒可能導致子宮頸癌與頭頸癌。<br>2. 細菌：<br>細菌屬於原核生物，部分種類會引起人類或動、植物的疾病（圖b）。有些細菌侵入宿主的組織或<br>細胞後，會產生毒素使細胞死亡，細菌毒素分為外毒素與內毒素。外毒素為蛋白質，可被細菌分泌到細<br>胞外，毒性較強，內毒素的毒性不及外毒素，多為脂多醣分子，在細菌破裂時被釋出。<br>3. 寄生蟲：<br>部分單細胞原生生物或多細胞動物也可藉由食物、飲水、飛沫、蚊蟲叮咬或傷口入侵並寄生於人<br>體中，造成疾病，通稱為寄生蟲。單細胞生物如由阿米巴原蟲造成的阿米巴痢疾（由受汙染的飲水傳<br>播）、瘧原蟲引發的瘧疾（由蚊蟲叮咬傳播）；而寄生於腸道的蟯蟲、蛔蟲、絛蟲或寄生於肝臟的中華<br>肝吸蟲，會吸取人體消化系統的養分，是常見的多細胞動物寄生蟲（圖c）。<br>知識補給站<br> 病原體。a流行性感冒病毒；b結核桿菌；c絛蟲。（a與b的顏色為電腦套色）<br>100 nm<br>a<br>1 μm<br>b<br>2 cm<br>c<br>第 5 章  防禦　145<br><small>課本PDF第 4 頁，印刷P145（文字抽取原文；以完整頁圖核對）</small></div>", "tb": [["BOOK4", "P145 完整課本頁"]]}, {"id": "b3-c51-l08", "t": "病毒構造：核心、殼體與部分套膜", "sec": "s2", "slide": 9, "sourceSlides": [9, 10], "sourcePages": [], "src": "原PPT第 9–10 頁；課本 P145", "figSpec": {"image": "PPT10S3"}, "txt": "<ul><li>病毒基因體可以是DNA或RNA，外有蛋白質殼體；部分病毒另有套膜。</li><li>流感、HIV與SARS-CoV-2為RNA病毒；腺病毒、天花與B肝病毒為DNA病毒。</li><li>病毒表面的附著蛋白與宿主受體互動；套膜不是所有病毒共同具有的構造。</li></ul><p class=\"think\">腺病毒和具套膜病毒，附著構造一定完全相同嗎？</p><div class=\"scope-note\">教材以醣蛋白示意附著作用；不把所有病毒的殼體附著蛋白都概括成同一種醣蛋白。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK8174/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote\">  <br>知識補給站<br>病原體<br>腺病毒<br>蛋白質殼體<br>醣蛋白<br>DNA<br>◆<br> <br>病毒<br>◇ 構造<br>▪ <br>核心<br>：<br>成<br>分為核酸<br>→ <br>DNA <br>病毒<br>：<br>腺<br>病毒<br>、<br>天花病毒、<br>B <br>型<br>肝炎病毒等<br>▪ <br>殼<br>體<br>：<br>成<br>分為蛋白質<br>▫ 依核酸不同，可<br>分為<br>→ <br>RNA <br>病毒<br>：<br>流行性感冒<br>病毒、人類免疫缺失症病毒（<br>HIV<br>）、<br>新冠<br>肺炎病毒等<br>配合課本 <br>P145<br>9<small>原PPT第 9 頁（完整原文）</small></div><div class=\"quote\">  <br>知識補給站<br>病原體<br>▪ <br>套膜<br>▫ <br>有些病毒<br>有<br>▫ 在殼體之外<br>▫ 組成類似細胞膜<br>新冠<br>病毒（<br>SARS-CoV-2<br>）<br>醣蛋白<br>套膜<br>RNA <br>與<br>蛋白質<br>殼體<br>▪ <br>醣蛋白<br>▫ <br>可<br>與宿主細胞表面特定受體結合，進入宿主細胞內<br>▫ <br>在套膜或殼體上<br>配合課本 <br>P145<br>10<small>原PPT第 10 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c51-l09", "t": "病毒依賴宿主：不能說完全沒有酵素", "sec": "s2", "slide": 11, "sourceSlides": [11], "sourcePages": [], "src": "原PPT第 11 頁；課本 P145", "figSpec": {"image": "PPT11S3"}, "txt": "<ul><li>病毒增殖需要宿主的細胞機制，尤其蛋白質合成依賴宿主核糖體。</li><li>部分病毒可編碼或攜帶聚合酶等酵素；「缺乏酵素系統」不是「沒有任何酵素」。</li><li>某些病毒感染可增加癌症風險，可能涉及病毒蛋白、基因調控或慢性發炎，不是每次感染都必定癌變。</li></ul><p class=\"think\">病毒有自己的聚合酶，是否就可在沒有宿主細胞時獨立製造完整病毒？</p><div class=\"scope-note\">保留教材原文，另限定宿主依賴與致癌機制。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK8181/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a> <a href=\"https://www.cancer.gov/about-cancer/causes-prevention/risk/infectious-agents\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote\">  <br>知識補給站<br>病原體<br>◇ <br>病毒可能誘發宿主細胞的基因突變導致癌症<br>◇ <br>病毒缺乏酵素系統，所以必須在宿主細胞內進行增殖<br>▪ <br>B <br>型肝炎病毒<br>可能導致<br>肝癌<br>▪ <br>人類乳突病毒<br>可能導致<br>子宮頸癌<br>與<br>頭頸癌<br>配合課本 <br>P145<br>11<small>原PPT第 11 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c51-l10", "t": "細菌：原核生物，不全都是病原", "sec": "s2", "slide": 12, "sourceSlides": [12], "sourcePages": [], "src": "原PPT第 12 頁；課本 P145", "figSpec": {"image": "PPT12S3"}, "txt": "<ul><li>細菌為原核生物，部分種類可引起人類或動、植物疾病。</li><li>病毒不是細菌；細菌與真核寄生蟲也不能合併為同一類。</li><li>判讀需要看細胞構造、遺傳物質與生活方式，不能只按名稱或照片外形。</li></ul><p class=\"think\">若一個病原有完整細胞構造，能否直接把它叫病毒？</p><div class=\"quote\">  <br>知識補給站<br>病原體<br>◇ <br>部分種類會引起人類或動、植物的疾病<br>◆<br> <br>細菌<br>◇ <br>分類<br>：<br>原<br>核生物<br>配合課本 <br>P145<br>結核桿菌<br>1<br> <br>µm<br>12<small>原PPT第 12 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c51-l11", "t": "外毒素與內毒素：成分與釋出方式", "sec": "s2", "slide": 13, "sourceSlides": [13], "sourcePages": [], "src": "原PPT第 13 頁；課本 P145", "figSpec": {"image": "PPT13S3"}, "txt": "<ul><li>教材外毒素為分泌至外部的蛋白質；內毒素典型為革蘭氏陰性菌外膜LPS，其脂質A是關鍵毒性部分。</li><li>細菌破裂可釋出LPS，生長時亦可經外膜囊泡等釋出，不限定只有破裂。</li><li>教材毒性強／弱是概括比較，不能推成任何內毒素都無害或所有細菌都同時具有兩者。</li></ul><p class=\"think\">如果未觀察到細菌大量破裂，能否完全排除內毒素釋出？</p><div class=\"scope-note\">釋出途徑補充以細菌外膜囊泡研究為證；不同毒素效應仍須依種類及暴露量討論。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK2422/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote\">  <br>知識補給站<br>病原體<br>◇ 有些細菌侵入宿主的組織或細胞後，會產生毒素<br>外毒素<br>內毒素<br>成　分<br>蛋白質<br>多為脂多醣<br>產生機制<br>由細菌分泌到細胞外<br>在細菌破裂時被釋出<br>毒　性<br>較強<br>較弱<br>◇ 細菌產生的毒素<br>分為外毒素與<br>內毒素<br>：<br>配合課本 <br>P145<br>13<small>原PPT第 13 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c51-l12", "t": "寄生蟲：單細胞與多細胞都可能", "sec": "s2", "slide": 14, "sourceSlides": [14], "sourcePages": [], "src": "原PPT第 14 頁；課本 P145", "figSpec": {"image": "pathogens"}, "txt": "<ul><li>阿米巴原蟲、瘧原蟲為單細胞真核生物；蛔蟲、蟯蟲、絛蟲及吸蟲為多細胞動物。</li><li>阿米巴痢疾可經受汙染飲水傳播，瘧疾有蚊媒途徑。</li><li>各種寄生蟲傳播方式不同，教材列舉的途徑不能套在每個物種上。</li></ul><p class=\"think\">同樣叫寄生蟲，是否代表相同細胞數與傳播方式？</p><div class=\"quote\">  <br>知識補給站<br>病原體<br>▪<br> 單細胞<br>生物<br>：<br>◆ <br>寄生蟲<br>◇ <br>種類<br>：<br>單細胞<br>原生生物或多細胞動物<br>◇ <br>傳播<br>：<br>食物<br>、飲水、飛沫、蚊蟲叮咬或傷口入侵<br>▫ 阿米巴原<br>蟲<br>：<br>阿米巴<br>痢疾；<br>由<br>受汙染的飲水傳播<br>▫ <br>瘧原蟲<br>：<br>瘧疾<br>；<br>由蚊蟲叮咬傳播<br>▫ 蟯蟲、蛔蟲、<br>絛蟲<br>：<br>寄生<br>於腸道<br>▪ 多細胞<br>動物<br>：<br>▫ 中華<br>肝吸蟲<br>：<br>寄生<br>於肝臟<br>配合課本 <br>P145<br>絛蟲<br>2<br> <br>cm<br>14<small>原PPT第 14 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c51-l13", "t": "初級淋巴器官：產生與成熟", "sec": "s3", "slide": 15, "sourceSlides": [15], "sourcePages": [5], "src": "原PPT第 15 頁；課本 P146–147", "figSpec": {"image": "organs"}, "txt": "<ul><li>骨髓與胸腺為初級淋巴器官，是淋巴球生成或發育成熟的重要場所。</li><li>骨髓含造血幹細胞，可生成各類血球；B細胞在骨髓發育成熟。</li><li>初級淋巴器官的分類重點是淋巴球發育，並非泛稱所有血球出現的場所。</li></ul><p class=\"think\">骨髓的造血功能與「初級淋巴器官」定義完全是同一個範圍嗎？</p><div class=\"scope-note\"><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK27092/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote\">5-1.2 <br>淋巴器官<br>初級淋巴器官<br>胸腺<br>骨髓<br>◆ <br>初級淋巴器官<br>◇ 是淋巴球製造或發育成熟的地方<br>骨髓<br>▪ B <br>細胞發育成熟的場所<br>▪ 含<br>造血幹細胞，<br>可分化為所有血球細胞<br>◇ 包括<br>骨髓<br>、<br>胸腺<br>◆ 分為<br>初級淋巴器官<br>與<br>次級淋巴器官<br>配合課本 <br>P146<small>原PPT第 15 頁（完整原文）</small></div><div class=\"quote\">5-1.2 淋巴器官<br>感冒常見的症狀之一就是喉嚨痛，就診時，常聽醫生提到「扁桃腺發炎」（圖 5－<br>2a）或「淋巴結腫大」，這是因為扁桃腺與淋巴結等淋巴器官受到病原體刺激而活化，<br>進而引發明顯的免疫反應。     <br>淋巴器官又可分為初級淋巴器官與次級淋巴器官（圖 5－2b）。初級淋巴器官包括骨<br>髓和胸腺，是淋巴球製造或發育成熟的地方。骨髓含有可分化為所有血球細胞的造血幹細<br>胞，同時也是B 細胞發育成熟的場所。胸腺位於心臟的腹面上方，分為左、右兩葉，骨髓<br>中形成的T 細胞可在胸腺中發育成熟（圖 5－2c）。胸腺從嬰兒期開始發育，至青春期最<br>為發達，成年後則逐漸退化，由脂肪組織等填充取代。<br>初級淋巴器官　primary lymphoid organ<br>骨髓　bone marrow <br>胸腺　thymus<br>a<br>b<br>扁桃腺<br>淋巴結<br>脾臟<br>胸腺<br>骨髓<br>次級淋巴器官<br>初級淋巴器官<br>發炎時的扁桃腺<br>正常的扁桃腺<br>  圖 5－2　<br>人體的淋巴循環系統示意圖。a人體<br>的扁桃腺；b初級淋巴器官以紅色文<br>字表示，次級淋巴器官以綠色文字表<br>示；c在骨髓與胸腺中，可產生成熟<br>B 細胞與T 細胞。<br>146　選修生物 Ⅲ (全)<br><small>課本PDF第 5 頁，印刷P146（文字抽取原文；以完整頁圖核對）</small></div>", "tb": [["BOOK5", "P146 完整課本頁"]]}, {"id": "b3-c51-l14", "t": "胸腺：成熟場所與年齡變化", "sec": "s3", "slide": 16, "sourceSlides": [16], "sourcePages": [], "src": "原PPT第 16 頁；課本 P146–147", "figSpec": {"image": "organs"}, "txt": "<ul><li>胸腺位於心臟腹面上方，分左右兩葉。</li><li>教材描述青春期最為發達，成年後逐漸由脂肪等組織取代。</li><li>退化不等於成年後T細胞全部消失；成熟T細胞可在周邊維持。</li></ul><p class=\"think\">胸腺變小，為何不代表體內立刻沒有成熟T細胞？</p><div class=\"scope-note\">年齡與胸腺功能的補充，區分新T細胞發育與既有成熟細胞的維持。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK27123/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote\">5-1.2 <br>淋巴器官<br>胸腺<br>骨髓<br>▪ 嬰兒期開始發育，至青春期最為發達，成年後則逐漸退化，由脂肪組織等填充取代<br>胸腺<br>▪ 位於心臟的腹面上方<br>▪ 分為左、右兩葉<br>初級淋巴器官<br>配合課本 <br>P146<small>原PPT第 16 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c51-l15", "t": "B與T：共同起源，不同成熟場所", "sec": "s3", "slide": 17, "sourceSlides": [17], "sourcePages": [6], "src": "原PPT第 17 頁；課本 P146–147", "figSpec": {"image": "maturation"}, "txt": "<ul><li>B與T的先驅都可追到骨髓造血幹細胞與淋巴先驅細胞。</li><li>B在骨髓發育成熟；T先驅進入胸腺再發育成熟。</li><li>「來自胸腺」若指成熟場所可成立；若指共同造血起源則需改正。</li></ul><p class=\"think\">原題把T的原始淋巴球說成由胸腺產生，混淆了哪兩件事？</p><div class=\"quote\">▪ 骨髓中形成<br>的 <br>T <br>細胞可在胸腺中發育成熟<br>5-1.2 <br>淋巴器官<br>骨髓<br>造血幹細胞<br>淋巴先驅細胞<br>進入胸腺<br>胸腺<br>分化發育<br>成熟<br>的 <br>T<br> 細胞<br>成熟<br>的 <br>B<br> 細胞<br>分化發育<br>配合課本 <br>P146<br>、<br>147<small>原PPT第 17 頁（完整原文）</small></div><div class=\"quote\">次級淋巴器官包括扁桃腺、淋巴結及脾臟等，是淋巴球執行免疫反<br>應的重要場所。當病原體穿透皮膚或黏膜等，組織中常見的吞噬細胞包<br>括嗜中性球、巨噬細胞及樹突細胞，會先辨識並吞噬病原體，接著進入<br>鄰近的次級淋巴器官（如淋巴結），活化特定淋巴球，並進行大量增殖<br>與分化，引發免疫反應。<br>扁桃腺有助於攔截經由口腔與鼻腔進入的病原體，淋巴結過濾淋巴<br>中的異物，脾臟則負責過濾血液中的異物。當免疫細胞大量聚集並進行<br>活化時，可能導致該部位出現發炎與腫大，如感冒時出現的扁桃腺發炎<br>或淋巴結腫大，即是免疫反應活躍的表現。<br>次級淋巴器官　secondary lymphoid organ<br>扁桃腺　tonsil<br>淋巴結　lymph node<br>脾臟　spleen<br>c<br>淋巴先驅細胞<br>成熟的 B 細胞<br>造血幹細胞<br>進入胸腺<br>骨髓<br>胸腺<br>分<br>化<br>發<br>育<br>成熟的 T 細胞<br>分<br>化<br>發<br>育<br>第 5 章  防禦　147<br><small>課本PDF第 6 頁，印刷P147（文字抽取原文；以完整頁圖核對）</small></div>", "tb": [["BOOK6", "P147 完整課本頁"]]}, {"id": "b3-c51-l16", "t": "次級淋巴器官：不同流體，不同守備", "sec": "s3", "slide": 18, "sourceSlides": [18], "sourcePages": [], "src": "原PPT第 18 頁；課本 P146–147", "figSpec": {"image": "organs"}, "txt": "<ul><li>淋巴結過濾淋巴，脾臟過濾血液，扁桃腺有助攔截口鼻來的病原。</li><li>次級器官是成熟淋巴球遇到抗原、活化及執行免疫反應的重要場所。</li><li>扁桃腺和黏膜淋巴組織也屬次級，不能設成與次級互斥的第三層級。</li></ul><p class=\"think\">若異物主要在血液中，淋巴結與脾臟能直接當作相同過濾器嗎？</p><div class=\"quote\">5-1.2 <br>淋巴器官<br>次級淋巴器官<br>扁桃腺<br>淋巴結<br>◆ <br>次級淋巴器官<br>◇ 包括<br>扁桃腺<br>、<br>淋巴結<br>及<br>脾臟<br>等<br>◇ 是淋巴球執行免疫反應的重要場所<br>脾臟<br>配合課本 <br>P146<br>、<br>147<small>原PPT第 18 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c51-l17", "t": "從入侵到活化：誰把訊息帶進器官？", "sec": "s3", "slide": 19, "sourceSlides": [19, 20], "sourcePages": [], "src": "原PPT第 19–20 頁；課本 P146–147", "figSpec": {"image": "PPT20S3"}, "txt": "<ul><li>組織中的吞噬與先天反應先處理入侵，樹突細胞等可攜帶抗原訊息至引流淋巴結。</li><li>成熟樹突細胞在活化初始T細胞中有重要角色，接著特定淋巴球增殖與分化。</li><li>不把嗜中性球、巨噬細胞、樹突細胞都視為同樣有效啟動初始T細胞的角色。</li></ul><p class=\"think\">細胞清除入侵者，與細胞啟動後天反應，是否完全同一個任務？</p><div class=\"scope-note\">原文「吞噬細胞進入器官並活化」是概括流程；新版以樹突細胞說明典型橋梁，不把所有吞噬細胞或T、B的活化機制等同。<a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC7148618/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote\">◆ 免疫<br>過程<br>：<br>5-1.2 <br>淋巴器官<br>淋巴結<br>脾臟<br>病原體穿透皮膚或黏膜<br>皮膚或黏膜<br>組織中<br>的吞噬細胞<br>辨識並吞噬<br>病原體<br>吞噬細胞<br>進入鄰近的次級淋巴器官<br>◇ 扁桃腺<br>：<br>攔截<br>經由口腔與鼻腔進入的病原體<br>◇ <br>淋巴結<br>：<br>過濾<br>淋巴中的異物<br>◇ <br>脾臟<br>：<br>過濾<br>血液中的異物<br>包括嗜中性球<br>、<br>巨<br>噬細胞及樹突細胞<br>扁桃腺<br>次級淋巴器官<br>配合課本 <br>P146<br>、<br>147<small>原PPT第 19 頁（完整原文）</small></div><div class=\"quote\">5-1.2 <br>淋巴器官<br>淋巴結<br>脾臟<br>吞噬細胞活化次級淋巴器官中特定淋巴球<br>特定淋巴球進行大量增殖與分化，引發免疫反應<br>扁桃腺<br>次級淋巴器官<br>配合課本 <br>P146<br>、<br>147<small>原PPT第 20 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c51-l18", "t": "器官腫大：反應活躍的線索", "sec": "s3", "slide": 21, "sourceSlides": [21], "sourcePages": [], "src": "原PPT第 21 頁；課本 P146–147", "figSpec": {"image": "tonsils"}, "txt": "<ul><li>免疫細胞聚集、活化及發炎可讓扁桃腺或淋巴結腫大。</li><li>器官在免疫反應中變化，不表示它變成血球的共同起源。</li><li>單一部位腫大是現象，仍需情境及其他證據區分原因。</li></ul><p class=\"think\">照片能支持「有發炎表現」，能否單憑照片決定病原種類？</p><div class=\"quote\">       當免疫細胞大量聚集<br>於次級淋巴器官<br>並進行活化時，可能導致該部位出現發炎與腫大，如感冒時出現的扁桃腺發炎或淋巴結腫大，即是免疫反應活躍的表現。<br>5-1.2 <br>淋巴器官<br>正常的扁桃腺<br>發炎時的扁桃腺<br>配合課本 <br>P146<br>、<br>147<small>原PPT第 21 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c51-l19", "t": "三道防線：先建架構，再看合作", "sec": "s4", "slide": 22, "sourceSlides": [22], "sourcePages": [7], "src": "原PPT第 22 頁；課本 P148", "figSpec": {"image": "defense"}, "txt": "<ul><li>第一道皮膜屏障與第二道吞噬、發炎、NK、化學物質等屬先天免疫。</li><li>第三道為後天免疫，包含體液與細胞媒介免疫。</li><li>三道是教學分層；第二與第三可共同啟動，不是第二道完全失敗後才准許第三道開始。</li></ul><p class=\"think\">用「接力賽」比喻三道防線，哪一點容易誤導？</p><div class=\"quote\">5-1.3 <br>免疫反應<br>皮膜屏障<br>第三道防線<br>第一道防線<br>第二道防線<br>免疫反應<br>後天性免疫<br>先天<br>性免疫<br>非專一性防禦<br>專一性防禦<br>體液免疫<br>細胞媒介免疫<br>吞噬作用<br>發炎反應<br>化學<br>物質（補<br>體、干擾素<br>等）<br>自然殺手細胞<br>配合課本 <br>P148<small>原PPT第 22 頁（完整原文）</small></div><div class=\"quote\"> 圖 5－3　人體的免疫反應：先天性免疫及後天性免疫的種類。<br>先天性免疫　innate immunity<br>後天性免疫　adaptive immunity<br>5-1.3 免疫反應<br>人體的免疫反應可分為先天性免疫與後天性免疫。先天性免疫是人體自出生即具<br>備的防禦機制，反應迅速，缺乏針對特定病原體的辨識能力，故又稱為非專一性防<br>禦；後天性免疫則由 T 細胞與 B 細胞主導，對抗原具有專一性與免疫記憶，故又稱<br>為專一性防禦。不同的免疫反應可共同執行複雜且多樣化的防禦，保護人體免於病原<br>體的傷害。<br>先天性免疫與後天性免疫組成三道防線來進行防禦作用，當人體接觸到病原體<br>時，作為第一道防線的皮膜屏障可立即阻擋病原體進入體內。若第一道防線無法阻<br>擋，使病原體入侵，此時第二道防線會透過吞噬作用與發炎反應抵抗病原體，同時第<br>三道防線也會被啟動，以體液免疫與細胞媒介免疫來協同抵禦病原體（圖 5－3）。<br>先天性免疫<br>先天性免疫<br>後天性免疫<br>後天性免疫<br>樹突細胞<br>巨噬細胞<br>嗜中性球<br>自然殺手細胞<br>化學物質<br>( 補體、干擾素等 )<br>吞噬細胞<br>皮膜屏障<br>第一道防線<br>第三道防線<br>第二道防線<br>B 細胞<br>體液免疫<br>漿細胞<br>抗體<br>分泌<br>細胞媒介免疫<br>病原體<br>T 細胞<br>抗原呈現細胞<br>T 細胞作用<br>148　選修生物 Ⅲ (全)<br><small>課本PDF第 7 頁，印刷P148（文字抽取原文；以完整頁圖核對）</small></div>", "tb": [["BOOK7", "P148 完整課本頁"]]}, {"id": "b3-c51-l20", "t": "先天與後天：辨識與記憶的比較", "sec": "s4", "slide": 23, "sourceSlides": [23], "sourcePages": [], "src": "原PPT第 23 頁；課本 P148", "figSpec": {"image": "PPT23S3"}, "txt": "<ul><li>先天辨識常見分子模式，反應較迅速；非專一性不等於沒有任何辨識。</li><li>B、T主導的後天免疫具有抗原專一性與典型免疫記憶。</li><li>初次後天反應和再接觸的反應時間不同，不固定說每次都較慢。</li></ul><p class=\"think\">同是辨識，為何先天辨識模式不等於B、T的特異性受體？</p><div class=\"scope-note\">原「先天無記憶」保留為基本比較；研究中的訓練性免疫有不同機制，不等同B、T抗原專一的克隆記憶，此為延伸。<a href=\"https://www.nature.com/articles/s41577-020-0285-6\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote\">◆ <br>先天性免疫<br>又稱<br>非專一性防禦<br>◆ <br>後天性免疫<br>又稱<br>專一性防禦<br>5-1.3 <br>免疫反應<br>→與生俱來，未針對特定對象，沒有記憶性<br>→需經訓練、活化，針對特定對象，有記憶性<br>補充<small>原PPT第 23 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c51-l21", "t": "整合原圖：細胞來源與免疫任務分開", "sec": "s4", "slide": 24, "sourceSlides": [24], "sourcePages": [], "src": "原PPT第 24 頁；課本 P148", "figSpec": {"image": "defense"}, "txt": "<ul><li>NK是淋巴球但在先天區；B可分化成漿細胞分泌抗體。</li><li>T參與細胞媒介反應，抗原呈現細胞連接先天與後天。</li><li>後天效應也能強化先天清除；同一張圖需分清來源、辨識、活化與效應。</li></ul><p class=\"think\">同學說「所有淋巴球都在第三道」，可用哪個原圖例子反駁？</p><div class=\"quote\">後<br>天性免疫<br>5-1.3 <br>免疫反應<br>先天性免疫<br>皮膜屏障<br>自然殺手細胞<br>樹突細胞<br>嗜中性球<br>巨噬細胞<br>吞噬細胞<br>化學<br>物質<br>（補<br>體、干擾素<br>等）<br>第三道防線<br>細胞媒介免疫<br>B<br>細胞<br>漿細胞<br>抗體<br>分泌<br>T<br> 細胞<br>抗原呈現細胞<br>細菌<br>T<br> 細胞<br>作用<br>第二道防線<br>第一道防線<br>體液免疫<br>配合課本 <br>P148<br>24<small>原PPT第 24 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c51-l22", "t": "原題一：吞噬、顆粒與細胞起源", "sec": "s5", "slide": 25, "sourceSlides": [25], "sourcePages": [], "src": "原PPT第 25 頁；課本 P142–148／原題", "figSpec": {"image": "PPT25S3"}, "txt": "<ul><li>保留原答案B及四個選項。</li><li>嗜鹼性球仍屬白血球；巨噬細胞不屬典型顆粒性白血球。</li><li>T與B共同造血起源在骨髓，T的成熟場所才是胸腺。</li></ul><p class=\"think\">選項C把哪一種功能，誤當哪一種細胞分類？</p><div class=\"quote\">  <br>Question<br>1. <br>白血球是體內重要的免疫細胞，下列有關各種白血球的敘述何者正確<br>？　<br>(<br>A)<br>嗜鹼性球無吞噬功能，不屬於<br>白血球<br><br>(<br>B)<br>樹突細胞可自單核球或骨髓的原始髓細胞分化而<br>來<br><br>(<br>C)<br>巨噬細胞也屬於顆粒性白血球，吞噬能力較強 <br>　<br>(D)<br> <br>B<br> 細胞<br>由來自骨髓的原始淋巴球分化，<br>T <br>細胞則由來自胸腺的原始淋巴球分化。<br>解答<br>：<br>(<br>B)<br> <br>解析<br>：<br>(<br>A)<br>嗜鹼性球雖無吞噬功能，但仍屬於顆粒性白血球<br>。<br>(<br>C)<br>巨噬細胞屬於單核性白血球<br>。<br>(<br>D)<br>淋巴球皆來自骨髓的原始淋巴球分化，<br>B <br>細胞繼續在骨髓發育成熟，<br>T <br>細胞則在胸腺發育成熟。<br>25<small>原PPT第 25 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c51-l23", "t": "原題二：把初級的定義說得更精確", "sec": "s5", "slide": 26, "sourceSlides": [26], "sourcePages": [], "src": "原PPT第 26 頁；課本 P142–148／原題", "figSpec": {"image": "PPT26S3"}, "txt": "<ul><li>原答案A保留，不擅自改答；A的「各種血球」用語比淋巴器官的定義更廣。</li><li>精確定義應聚焦淋巴球生成／發育成熟；胸腺主要負責T成熟，並非所有血球生成。</li><li>脾臟過濾血液；淋巴結常集中在特定區域，而非平均分布。</li></ul><p class=\"think\">將A改寫成不過度概括、又能區分骨髓和胸腺的敘述。</p><div class=\"scope-note\">本原題作定義討論，保留原選項及原答案A，不以含糊用語自動判成科學定義。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK27092/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote\">  <br>Question<br>2. <br>下列有關淋巴器官的敘述，何者正確<br>？　<br>(<br>A)<br>各種血球生成及成熟的部位屬於初級淋巴<br>器官　<br>(<br>B)<br>初級淋巴器官皆可生成<br>血球　<br>(<br>C)<br>次級淋巴器官僅可過濾淋巴中的<br>病原體　<br>(<br>D)<br>淋巴結平均分布在身體各處。<br>解答<br>：<br>(<br>A)<br> <br>解<br>析<br>：<br>(<br>B)<br>初級淋巴器官包括骨髓與胸腺，骨髓可生成各種血球，胸腺負責 <br>T <br>細胞的成熟。<br>(C)<br>次級淋巴器官包括脾臟、淋巴結及扁桃腺，脾臟可過濾血液，淋巴結負責過濾淋巴。<br>(D)<br>淋巴結主要分布於頸部、腋下、鼠蹊部及內臟周圍，並非平均分布。<br>26<small>原PPT第 26 頁（完整原文）</small></div>", "tb": []}], "questions": [{"t": "白血球：依細胞類別分組", "q": "每類放兩張卡，同欄可交換。", "learn": 2, "tag": "cells", "hint": "不要把所有 document.addEventListener('fullscreenchange',fullscreenSync);document.addEventListener('keydown',e=>{if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(document.querySelector('dialog[open]'))return;const fs=document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation');if(fs){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();if(LI>0)showLearn(LI-1);}else if(e.key==='Escape')exitLearnFullscreen();return;}if(PAGE==='show'){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();showStep(1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();showStep(-1);}else if(e.key==='Escape')navigate('intro');else if(e.key==='Home'){SI=0;showRender()}else if(e.key==='End'){SI=DECK.length-1;showRender()}return;}if(PAGE==='learn'&&el('flip')){if(e.key==='ArrowRight'){e.preventDefault();flipStop();flipShow(FI+1)}if(e.key==='ArrowLeft'){e.preventDefault();flipStop();flipShow(FI-1)}}});
el('learn-stage').addEventListener('contextmenu',e=>{if(document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation')){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1)}});
window.addEventListener('resize',fit);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){flipStop();showStopPlay();save();}});new ResizeObserver(fit).observe(el('bar'));
el('slide-text').onclick=()=>openDialog('原PPT第'+DECK[SI][1]+'頁原文',`<p>${esc(CONTENT.pptText[DECK[SI][1]])}</p>`);el('hero-image').src=IMG.nkPhoto;el('video-external').href=typeof VIDEO_VIEW_URL!=='undefined'?VIDEO_VIEW_URL:VIDEO_SRC;applyPreferences();const start=['learn','play','done'].includes(ST.page)?ST.page:'intro';navigate(start);if(!saving)storageNotice();
</script></body></html>

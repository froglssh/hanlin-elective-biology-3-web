const CONTENT={"pptText": {"1": "4-4 \n內分泌系統\n4-4.1 \n激素與人體的內分泌系統\n4-4.2 \n激素的作用機制\n4-4.3 \n內分泌維持恆定的機制\n背面觀", "2": "4-4 \n內分泌系統\n背面觀\n◆ \n心臟\n、\n腎臟\n、\n胃腸道\n及\n胎盤\n等\n器官也具\n內分泌功能\n◆ 內分泌\n腺體或\n組織\n：\n包括\n下視丘\n、\n腦垂腺\n、\n甲狀腺\n、\n副甲狀腺\n、\n腎上腺\n、\n胰島\n、\n性腺\n下視丘\n腦垂腺\n甲狀腺\n副甲狀腺\n腎上腺\n 性腺（卵巢）\n 性腺（睪丸）\n 胰島（胰臟內）\n配合課本 \nP120", "3": "4-4.1 \n激素與人體的內分泌系統\n▪ 若分泌異常，可能導致疾病\n◆ 內分泌腺體或組織的\n特點\n：\n◇ 不具導管，又稱\n無管腺\n◇ 分泌\n激素\n▪ 激素釋出後進入血液，藉循環系統運送至\n目標細胞\n▪ 目標細胞具可和激素結合的\n專一性受體\n▪ \n微量\n即能引發生理反應\n◇\n 反應較慢，但調節範圍廣、效果持久\n內分泌腺甲\n目標細胞乙\n內分泌腺乙\n目標細胞甲\n受體\n配合課本 \nP120\n激素與目標細胞作用方式", "4": "4-4 \n內分泌系統\n◆ 神經系統 \nvs. \n內分泌系統經常協同\n合作\n：\n神經系統\n內分泌系統\n訊息傳遞方式\n神經\n衝動（ 電訊號 ）＋\n神經\n傳導\n物質（ 化學訊號 ）\n激素（ 化學訊號 ）\n訊息傳遞速度\n較快\n較慢\n持續性\n較短暫\n較持久\n例子\n：\n緊張\n時血壓升高\n交感神經興奮\n腎上腺分泌腎上腺素\n補充", "5": "4-4.1 \n激素與人體的內分泌系統\n激素概念的提出\n◆\n \n1902 \n年，\n英國\n生理學家\n貝利士\n與\n史塔冷\n→ 用\n狗做實驗\n，進食後即使切斷與胰臟相連的神經，胰液仍會分泌\n→ 推論腸道會釋放某種化學物質進入血液作用於胰臟\n→ 將此類物質命名為激素\nhormone\n，源自希臘文「激發」，音譯為荷爾蒙\n註\n配合課本 \nP120", "6": "睪丸\n◆ 是間腦的一部分\n4-4.1 \n激素與人體的內分泌系統\n下視丘\n◆ 分泌的\n激素\n：\n1.\n \n調節激素\n，\n例如\n：\n促性腺素\n釋素\n下視丘\n促\n性腺素\n釋素\n腦垂腺前葉\n促\n性腺素\n由血液運送，刺激\n下視丘\n腦垂腺後葉\n腦垂腺前葉\n性腺\n性激素\n由血液運送，刺激\n配合課本 \nP121\n6", "7": "4-4.1 \n激素與人體的內分泌系統\n下視丘\n腦垂腺後葉\n腦垂腺前葉\n2.\n 抗利尿素、催產素\n下視丘\n抗利\n尿素\n催產素\n乳腺\n子宮\n促平滑肌收縮、協助分娩\n促排出乳汁\n腦垂腺後葉\n儲存\n腎臟\n由血液運送，刺激\n再吸收水分，維持體內滲透度恆定\n配合課本 \nP121\n7", "8": "◆ 激素依分泌來源可分為\n腺體內分泌\n與\n神經內分泌\n4-4.1 \n激素與人體的內分泌系統\n→ \n調節激素\n、\n抗利尿素\n、\n催產素\n為\n下視丘中的\n神經細胞所分泌，屬\n神經內分泌\n配合課本 \nP121\n8", "9": "4-4.1 \n激素與人體的內分泌系統\n下視丘\n腦垂腺後葉\n腦垂腺前葉\n腦垂腺\n◆ 位於下視丘下方\n◆ 分為前葉與後葉\n◇\n 由腺體細胞構成\n◇\n 分泌\n激素\n：\n前葉\n1. \n生長激素（\nGH\n）\n→ 促進蛋白質合成、骨骼生長\n→ 分解醣類與脂質以供能\n配合課本 \nP121\n9", "10": "4-4.1 \n激素與人體的內分泌系統\n下視丘\n腦垂腺後葉\n腦垂腺前葉\n3. \n促腎上腺皮質素（\nACTH\n）\n→ 促進腎上腺皮質\n分泌\n\n糖\n皮質素\n4. \n催乳激素（\nPRL\n）\n→ 促進乳腺發育與乳汁合成\n2. \n促甲狀腺素（\nTSH\n）\n→ 促進甲狀腺分泌甲狀腺素\n配合課本 \nP121\n10", "11": "卵巢的橫切面\n發育中的濾泡\n成熟的濾泡\n排卵\n黃體\n黃體退化\n4-4.1 \n激素與人體的內分泌系統\n→ \n男性\n：\n促\n睪丸分泌睪固酮\n5. \n濾泡刺激素（\nFSH\n）\n6. \n黃體成長激素（\nLH\n）\n→ \n女性\n：\n促\n濾泡成熟\n→ \n男性\n：\n精子\n生成\n→ \n女性\n：\n促\n排卵與黃體形成\nFSH\n 和 \nLH n◆ 負回饋\n配合課本 \nP129\n激素的回饋作用與拮抗作用", "40": "抑制\n促進\n目標細胞\n◇ 以甲狀腺素的分泌調節為\n例\n：\n4-4.3 \n內分泌維持恆定的機制\n下視丘\n促甲狀腺素\n釋素（\nTRH\n）\n腦垂腺前葉\n促甲狀腺素\n（\nTSH\n）\n甲狀腺\n甲狀腺素\n配合課本 \nP129", "41": "  \n知識補給站\n正回饋\n◇ \n說明\n：\n當\n激素產生後，會回饋至腺體促使激素再分泌，使激素在短時間內激增\n◇ \n例子\n：\n▪ 哺乳時，嬰兒吸吮的刺激使乳腺分泌更多乳汁，稱為排乳反射\n▪ 分娩時，子宮壁肌肉收縮會不斷刺激催產素分泌，使收縮愈強，直到嬰兒產出\n配合課本 \nP130\n41", "42": "  \n知識補給站\n正回饋\n▪ 排乳反射\n：\n腦垂腺前葉\n催\n乳激素\n促進乳腺\n細胞\n乳汁分泌\n當嬰兒不再吸吮乳頭，乳汁才漸漸停止排出\n吸吮刺激乳頭\n腦垂腺後葉\n催產素\n刺激肌上皮細胞\n收縮\n乳汁排出\n乳腺細胞\n肌上皮細胞\n腦垂腺前葉\n腦垂腺後葉\n下視丘\n感覺神經\n刺激\n抑制\n促進\n配合課本 \nP130\n42", "43": "  \n知識補給站\n正回饋\n腦垂腺前葉\n催\n乳激素\n促進乳腺\n細胞\n乳汁分泌\n當嬰兒不再吸吮乳頭，乳汁才漸漸停止排出\n吸吮刺激乳頭\n腦垂腺後葉\n催產素\n刺激肌上皮細胞\n收縮\n乳汁排出\n乳腺細胞\n肌上皮細胞\n腦垂腺前葉\n腦垂腺後葉\n下視丘\n感覺神經\n刺激\n抑制\n促進\n配合課本 \nP130\n43\n▪ 排乳反射亦為神經及內分泌系統間交互作用的例子\n神經\n腺體\n內分泌\n腺體\n內分泌", "44": "4-4.3 \n內分泌維持恆定的機制\n拮抗作用\n◇ \n說明\n：\n藉\n由生理功能相反的激素維持體內生理環境的恆定\n◇ \n例子\n：\n升\n糖素與胰島素的拮抗作用可維持血糖濃度的恆定\n進食\n空腹\n血糖濃度升高，胰島素分泌增加\n血糖濃度降低，升糖素分泌增加\n血糖基準值\n時間\n80\n90\n100\n110\n120\n130\n140\n150\n血糖\n濃度（葡萄糖     \n\\\n　  血液）\nmg\ndL\n配合課本 \nP131", "45": "胰島\n胰島素\n血糖濃度下降\n胰島\n升糖素\n血糖濃度上升\n◆\n 胰島素和血糖濃度的\n關係\n：\n負回饋\n◆\n 胰島素和升糖素對血糖濃度的\n關係\n：\n4-4.3 \n內分泌維持恆定的機制\n◆\n 升糖素和血糖濃度的\n關係\n：\n負回饋\n拮抗作用\n配合課本 \nP131\n抑制\n促進", "46": "◇ 血糖濃度\n失調\n：\n4-4.3 \n內分泌維持恆定的機制\n▪\n \n胰島素分泌不足\n▪\n \n人體內胰島素受體的敏感性下降，使胰島素無法有效作用\n血糖濃度過\n低\n血糖濃度異常升高，超出腎臟再吸收的上限，導致過多葡萄糖從尿液排出\n糖尿病\n飢餓、暈眩、心跳加速等症狀，嚴重時甚至會發生昏迷或死亡\n配合課本 \nP131", "47": "4-4.3 \n內分泌維持恆定的機制\n協同作用\n◆ \n說明\n：\n不同\n激素各自對同一種生理現象產生影響，從而達到增強整體效應的結果\n◆ 例子\n：\n當\n人體面對壓力時，腎上腺髓質與皮質所分泌的激素均可協助人體應付壓力\n配合課本 \nP132", "48": "  \n知識補給站\n腎上腺\n分泌的激素\n       \n腎上腺髓質\n分泌多種化學活性物質，例如\n：\n多巴胺\n、\n去甲基腎上腺素\n及\n腎上腺素\n，統稱為\n兒茶酚胺\n。\n       \n腎上腺皮質\n可分泌調控醣類生成的\n糖皮質素\n、調控鈉離子再吸收的\n礦物皮質素\n及少量\n雄性激素\n。\n       神經組織產生的兒茶酚胺會在局部組織傳遞訊息，稱之為\n神經傳遞物\n。而腎上腺髓質產生的兒茶酚胺則作為\n激素\n，透過血液循環分布全身，以調節生理反應。\n配合課本 \nP132\n48", "49": "受到緊迫\n因子（驚嚇\n、疼痛、壓力\n等）衝擊\n◆ 短期即時性的壓力反應\n4-4.3 \n內分泌維持恆定的機制\n提升血糖濃度、\n心跳與呼吸\n速率，促進心肌\n與骨骼肌的小動脈舒張使血流量增加、瞳孔放大及支氣管擴張\n下視丘\n腦垂腺後葉\n腦垂腺前葉\n活化\n交感神經系統\n髓質\n皮質\n腎上腺素、去甲基腎上腺素\n脊髓\n腎上腺\n配合課本 \nP132\n、\n133\n下視丘\n交感神經系統\n活化\n腎上腺素\n腎上腺髓質\n去甲基腎上腺素\n分泌", "50": "壓力增大\n◇ 提高\n血糖\n濃度\n◆ \n長期性持續的壓力反應\n下視丘\n腦垂腺後葉\n腦垂腺前葉\n脊髓\n髓質\n皮質\n腎上腺\n4-4.3 \n內分泌維持恆定的機制\n◇ 降低\n血液中淋巴球的數目，導致免疫力降低\n配合課本 \nP132\n、\n133\n下視丘\n促腎上腺皮質素釋\n素（\nCRH\n）\n分泌\n腦垂腺前葉\n促腎上腺皮質\n素（\nACTH\n）\n分泌\n腎上腺皮質\n糖皮質素\n分泌", "51": "       若壓力持續的時間太長或緊迫程度超過身體所能忍受的範圍，則可能對心臟和血管造成負擔，提高心血管疾病的發生率，也會危害免疫系統，增加感染病原體的機會。\n4-4.3 \n內分泌維持恆定的機制\n配合課本 \nP133", "52": "  \n知識補給站\n艾迪森氏病\n       艾迪森氏病為一種罕見的慢性內分泌疾病，\n於 \n1855 \n年由\n英國\n醫師\n艾迪森\n所提出，主因為\n糖皮質素與礦物皮質素分泌不足\n。患者常見症狀為皮膚黑色素沉澱，長期下來易感到疲勞、肌肉無力、食慾喪失、體重減輕、精神躁動或憂鬱，且由於鹽分流失，患者也特別喜好高鹽食品，若未加以治療，最後可能會因低血糖而昏迷致死。\n配合課本 \nP134\n52", "53": "  \n知識補給站\n庫欣氏症候群\n       庫欣氏症候群\n於 \n1932 \n年由\n美國\n的神經外科醫師\n庫欣\n最先發現，起因為\n長期持續性接觸或分泌過多腎上腺皮質素\n所引起，是一種內分泌疾病。患者常見症狀包括月亮臉、水牛肩（下圖）、肌肉無力、骨質疏鬆、粉刺、高血壓、皮膚傷口難癒合、女性患者月經失調等症狀。\n53\n配合課本 \nP134", "54": "  \nQuestion\n1. \n有關內分泌系統調控生理現象，下列敘述哪些正確\n？　\n(\nA)\n內分泌系統不受神經系統的調\n控　\n(\nB)\n黃體素會影響子宮內膜\n厚度　\n(\nC)\n腦垂腺後葉所合成的抗利尿素，可促進水分再\n吸收　\n(\nD)\n腎上腺皮質素可調節體內鈉、鉀離子\n恆定　\n(\nE)\n胰島素促使葡萄糖進入細胞，也會促使細胞內葡萄糖的代謝。\n【106.\n指考修訂\n】\n解\n析\n：\n(\nA)\n內分泌系統與神經系統可以互相協同調節\n。\n(\nC)\n腦垂腺後葉為神經組織，負責儲存下視丘分泌的抗利尿素與催產素，本身不分泌激素。\n解答\n：\n(\nB)(D)\n(E)\n54", "55": "  \nQuestion\n2. \n右圖\n是人體某種激素作用的示意圖，請問關於這類激素的敘述下列何者正確？\n(A)\n圖中的 \ncAMP \n是第一傳訊者，將激素的訊號透過活化酵素影響\n生理　\n\n(\nB)\n此類激素的訊號在細胞內具有放大的\n效果　\n\n(\nC)\n升糖素、腎上腺皮質素屬此類\n激素　\n(\nD)\n此類激素多為非極性分子。\n解答\n：\n(\nB)\n55", "56": "  \nQuestion\n解析\n：\n(\nA) cAMP \n為第二傳訊者，激素本身為第一傳訊者\n。\n\n(\nC)\n腎上腺皮質素可進入細胞膜，受體在細胞內。 \n(D)\n此類激素多為極性分子。\n56", "57": "  \nQuestion\n3. \n右圖是糖皮質素在體內的調控機制，請判斷下列敘述何者正確\n？　\n\n(\nA)\n此回饋控制為正\n回饋　\n(\nB)\n甲為視\n丘　\n(\nC)\n乙為腦垂腺後\n葉　\n(\nD)\n此現象在性腺分泌的激素亦可觀察到。\n解答\n：\n(\nD)\n解析\n：\n(\nA)\n此回饋為負回饋。 \n\n(\nB)\n甲為下視丘\n。\n(\nC)\n乙為腦垂腺前葉。\n57"}, "lessons": [{"id": "b3-c44-l01", "t": "全身的訊號：內分泌不只是一群腺體", "sec": "s1", "slide": 1, "sourceSlides": [1, 2], "sourcePages": [1], "src": "原PPT第 1–2 頁；課本 P120", "figSpec": {"image": "PPT02S3"}, "txt": "<ul><li>下視丘、腦垂腺、甲狀腺、副甲狀腺、腎上腺、胰島及性腺具有內分泌功能。</li><li>心臟、腎臟、胃腸道、胎盤等，也能兼具內分泌功能。</li><li>以「來源→激素→標的→效應」閱讀，不只背腺體的位置。</li></ul><p class=\"think\">胰臟有胰管，為何其中的胰島仍屬內分泌？</p><div class=\"ex\"><h4>兩個系統協同</h4><p>面對環境變化與身體需求，神經系統與內分泌系統經常協同合作。神經系統接收刺激、用電訊號<b>快速</b>反應；內分泌系統用<b>激素</b>進行較慢但持久的化學調節。</p></div><div class=\"ex\"><h4>內分泌系統管什麼</h4><p>包含多種腺體與組織，透過分泌不同激素，調節生長發育、代謝、生殖、行為，並維持恆定。</p></div><div class=\"ex\"><h4>本節三個重點</h4><ul><li>4-4.1 激素與人體的內分泌系統</li><li>4-4.2 激素的作用機制</li><li>4-4.3 內分泌維持恆定的機制</li></ul></div><div class=\"ex\"><h4>深入解說：內分泌系統的範圍</h4><p>傳統內分泌腺有下視丘、腦垂腺、甲狀腺、副甲狀腺、腎上腺、胰島、性腺；但心臟（ANP）、腎臟（EPO）、胃腸道（腸促胰液素等）、胎盤（hCG）、脂肪組織（瘦素）也分泌激素。判斷標準是「<b>細胞分泌的化學訊息分子進入血液，作用於遠方標的</b>」，而不是「是不是專職的腺體」。</p></div><div class=\"ex\"><h4>閱讀激素的四步驟</h4><ul><li>來源：哪個腺體或細胞分泌？</li><li>激素：名稱與化學性質。</li><li>標的：作用在哪些細胞（有專一性受體）？</li><li>效應：造成什麼生理變化？</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>胰臟有胰管，為什麼胰島仍是內分泌？</p><p><b>答：</b>胰島是胰臟內獨立的細胞團，沒有導管，激素直接入血；胰管只運送外分泌的胰液，屬於另一群細胞。</p></div>", "tb": [["BOOK1", "P120 完整課本頁"]]}, {"id": "b3-c44-l02", "t": "血液走遍全身，為何反應有專一性？", "sec": "s1", "slide": 3, "sourceSlides": [3], "sourcePages": [], "src": "原PPT第 3 頁；課本 P120", "figSpec": {"image": "PPT03S3"}, "txt": "<ul><li>內分泌激素釋入血液，不經導管送至器官表面；外分泌則經導管。</li><li>能否回應與標的細胞的專一性受體及後續傳訊有關。</li><li>微量激素可引起反應，不表示濃度越高、反應永遠無限增加。</li></ul><p class=\"think\">同一激素到達兩種細胞，一種不反應，應先查哪個條件？</p><div class=\"ex\"><h4>內分泌腺的特點</h4><p>內分泌腺體或組織<b>不具導管</b>（又稱無管腺）。激素釋出後<b>進入血液</b>，由循環系統運送到全身。</p></div><div class=\"ex\"><h4>專一性</h4><ul><li>血液把激素帶到全身，但只有具有該激素<b>專一性受體</b>的細胞（目標細胞）才會反應。</li><li>微量激素就能引發生理反應。</li></ul></div><div class=\"ex\"><h4>異常會生病</h4><p>激素分泌異常可能導致疾病。例如成人生長激素過多 → 肢端肥大症；兒童期生長激素不足 → 侏儒症。</p></div><div class=\"ex\"><h4>深入解說：運送靠血液，辨識靠受體</h4><p>激素進入血液後會流經全身，但只有表面或內部有<b>專一性受體</b>的目標細胞會反應。若某細胞沒反應，要先檢查：① 有沒有該受體？② 受體後的訊號傳遞是否正常？③ 激素濃度是否足夠？激素濃度極低（常為 10⁻⁹–10⁻¹² M）就足以引發反應，但並不是濃度越高反應無限增加（受體會飽和）。</p></div><div class=\"ex\"><h4>外分泌 vs 內分泌</h4><ul><li>外分泌：有導管，分泌到體表或消化道（汗腺、消化腺）。</li><li>內分泌：無導管，激素入血。</li><li>胰臟同時有兩類。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>生長激素異常的兩個例子？</p><p><b>答：</b>兒童期不足 → 侏儒症；成人過多 → 肢端肥大症（骨端、手腳、下巴等變大）。</p></div>", "tb": []}, {"id": "b3-c44-l03", "t": "神經與內分泌：兩種途徑協同調節", "sec": "s1", "slide": 4, "sourceSlides": [4], "sourcePages": [], "src": "原PPT第 4 頁；課本 P120", "figSpec": {"image": "PPT04S3"}, "txt": "<ul><li>神經訊息包含電訊號及突觸化學傳訊；激素以化學訊號經血液傳遞。</li><li>較快／較慢、較短／較持久是典型比較，不是每種反應的絕對界線。</li><li>緊張時交感神經與腎上腺髓質共同參與，不能說兩系統互不相干。</li></ul><p class=\"think\">腎上腺素也可迅速作用，會推翻整個比較表嗎？</p><div class=\"scope-note\">原比較表完整保留；以典型模式讀表，避免把內分泌定義為一定緩慢。</div><div class=\"ex\"><h4>神經 vs. 內分泌（典型比較）</h4><p></p></div><div class=\"ex\"><h4>比較表</h4><ul><li><b>訊息傳遞方式</b>：神經是神經衝動（電訊號）加神經傳導物質（化學訊號）；內分泌是激素（化學訊號）。</li><li><b>速度</b>：神經較快；內分泌較慢。</li><li><b>持續性</b>：神經較短暫；內分泌較持久。</li></ul></div><div class=\"ex\"><h4>協同的例子</h4><p>緊張時血壓升高：交感神經興奮 → 腎上腺分泌腎上腺素。兩個系統同時參與。</p></div><div class=\"ex\"><h4>小提醒</h4><p>「快／慢、短暫／持久」是典型模式，不是絕對界線；腎上腺素也可迅速作用。</p></div><div class=\"ex\"><h4>深入解說：快慢是典型，不是定義</h4><p>神經：電訊號沿神經元傳導，到突觸轉成化學訊號，作用快（毫秒）、範圍精確、持續短。內分泌：激素經血液循環，作用慢（秒到小時）、範圍廣、持續久。但腎上腺素是激素，卻可在數秒內作用，所以「慢」是典型模式而不是定義。兩套系統在許多調節中同時參與，例如緊張時交感神經＋腎上腺髓質。</p></div><div class=\"ex\"><h4>比較</h4><ul><li>傳遞形式：電＋化學／純化學。</li><li>速度：快／慢。</li><li>持續：短／久。</li><li>範圍：局部、精確／全身、廣泛（靠受體專一）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>為什麼說神經與內分泌是「協同」而非「二選一」？</p><p><b>答：</b>許多反應需要兩者接力，如壓力反應：神經快速啟動、激素持續維持；下視丘更是兩者的接點。</p></div>", "tb": []}, {"id": "b3-c44-l04", "t": "從胰液實驗推論血液中的訊號", "sec": "s1", "slide": 5, "sourceSlides": [5], "sourcePages": [], "src": "原PPT第 5 頁；課本 P120", "figSpec": {"image": "PPT05S3"}, "txt": "<ul><li>原教材以貝利士、史塔冷的狗實驗說明激素概念。</li><li>切斷相關神經後胰液仍分泌，支持神經不是此反應的唯一途徑。</li><li>仍需可轉移的化學物質與血液途徑等證據，不能單憑排除神經就認定任何物質是激素。</li></ul><p class=\"think\">若要進一步支持化學傳訊，可增加哪種比較？</p><div class=\"ex\"><h4>激素的概念（1902）</h4><p>英國生理學家貝利士與史塔冷用狗做實驗：進食後，即使切斷與胰臟相連的神經，<b>胰液仍會分泌</b>。</p></div><div class=\"ex\"><h4>推論</h4><ul><li>神經不是唯一的控制管道。</li><li>腸道可能釋放某種化學物質進入血液，作用於胰臟。</li></ul></div><div class=\"ex\"><h4>命名</h4><p>他們把這類物質稱為<b>激素</b>（hormone，源自希臘文「激發」，音譯「荷爾蒙」），為內分泌學奠定基礎。</p></div><div class=\"ex\"><h4>深入解說：實驗如何排除神經</h4><p>貝利士與史塔冷觀察：食物進入十二指腸後胰液分泌，即使已切斷胰臟的神經，仍然分泌 → 說明<b>神經不是唯一途徑</b>。他們再把腸黏膜加酸研磨，萃取液注入血液，胰液分泌 → 說明腸黏膜產生可經血液運送的化學物質，命名為腸促胰液素（第一個被發現的激素）。</p></div><div class=\"ex\"><h4>實驗邏輯</h4><ul><li>觀察：切斷神經仍分泌。</li><li>假說：腸道釋出經血液運送的化學物質。</li><li>檢驗：把萃取物注入血液，引起胰液分泌。</li><li>結論：化學訊息可經血液傳遞（激素）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>只憑「切斷神經後仍有胰液分泌」就能證明激素存在嗎？</p><p><b>答：</b>不能。還需要證明有可轉移的化學物質（例如萃取液注射的實驗）才支持激素假說。</p></div>", "tb": []}, {"id": "b3-c44-l05", "t": "下視丘：神經與內分泌的接點", "sec": "s2", "slide": 6, "sourceSlides": [6], "sourcePages": [2], "src": "原PPT第 6 頁；課本 P121–125", "figSpec": {"image": "pituitary"}, "txt": "<ul><li>下視丘屬間腦，部分神經元合成調節激素。</li><li>調節激素經血液影響腦垂腺前葉，再作用於其他內分泌腺。</li><li>促性腺素釋素、促性腺素、性激素是不同層級，不可互換名稱。</li></ul><p class=\"think\">圖中哪一段是血液運送，哪一段由前葉再合成激素？</p><div class=\"ex\"><h4>下視丘</h4><p>是<b>間腦</b>的一部分，也是神經系統與內分泌系統的接點。它分泌的激素有兩類。</p></div><div class=\"ex\"><h4>兩類</h4><ul><li><b>調節激素</b>（例如促性腺素釋素）：經血液循環到<b>腦垂腺前葉</b>，調節前葉的激素分泌，進而調控代謝、壓力反應、生殖等。</li><li><b>抗利尿素與催產素</b>：在下視丘合成，經軸突運到<b>腦垂腺後葉</b>儲存與釋放。</li></ul></div><div class=\"ex\"><h4>小結</h4><p>下視丘是「神經內分泌」的例子：由神經元分泌激素。</p></div><div class=\"ex\"><h4>深入解說：下視丘＝神經元＋分泌</h4><p>下視丘的神經元兼有神經與內分泌功能（神經內分泌細胞）。兩條出路：① 合成<b>釋放／抑制激素</b>，經一小段門脈血管運到腦垂腺<b>前葉</b>，調節前葉細胞分泌；② 合成 <b>ADH 與催產素</b>，沿軸突運送到<b>後葉</b>儲存與釋放入血。</p></div><div class=\"ex\"><h4>三個層級（以性腺軸為例）</h4><ul><li>下視丘：促性腺素釋素（GnRH）。</li><li>腦垂腺前葉：促性腺素（FSH、LH）。</li><li>性腺：性激素（睪固酮、動情素、黃體素）。</li><li>不同層級，名稱不可互換。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>「調節激素」與「促性腺素」有何不同？</p><p><b>答：</b>調節激素由下視丘分泌，作用對象是腦垂腺前葉；促性腺素由前葉分泌，作用對象是性腺。</p></div>", "tb": [["BOOK2", "P121 完整課本頁"]]}, {"id": "b3-c44-l06", "t": "ADH與催產素：合成地點與效應", "sec": "s2", "slide": 7, "sourceSlides": [7, 8], "sourcePages": [], "src": "原PPT第 7–8 頁；課本 P121–125", "figSpec": {"image": "PPT07S3"}, "txt": "<ul><li>ADH與催產素由下視丘的神經元合成，經軸突運送至後葉。</li><li>後葉儲存並釋放入血；ADH促進腎臟再吸收水分。</li><li>催產素促進子宮收縮與排乳，和催乳激素促進乳汁合成不同。</li></ul><p class=\"think\">尿量減少時，是腎臟把更多水保留，還是ADH直接變成水？</p><div class=\"ex\"><h4>抗利尿素（ADH）</h4><ul><li>促進腎臟再吸收水分，維持體內滲透壓恆定。</li><li>也能促使小動脈收縮，又稱血管加壓素。</li></ul></div><div class=\"ex\"><h4>催產素</h4><ul><li>促使<b>子宮平滑肌收縮</b>，協助分娩。</li><li>產後促使<b>乳腺排出乳汁</b>。</li></ul></div><div class=\"ex\"><h4>激素依分泌來源分類</h4><p>「腺體內分泌」（如胰島素）與「神經內分泌」（如抗利尿素、催產素、調節激素）。後者由下視丘的神經細胞分泌。</p></div><div class=\"ex\"><h4>深入解說：ADH 與催產素</h4><p><b>ADH（抗利尿素）</b>：促進腎集尿管對水的再吸收，使尿量減少、尿液濃縮；高劑量使小動脈收縮升高血壓（所以又稱血管加壓素）。血液滲透壓上升 → 下視丘滲透壓受器 → ADH 增加。<b>催產素</b>：促進子宮平滑肌收縮（分娩）與乳腺肌上皮細胞收縮（排乳）。兩者結構相似（都是 9 個胺基酸的胜肽），都在下視丘合成。</p></div><div class=\"ex\"><h4>易混淆</h4><ul><li>ADH 促進「腎臟」再吸收水，不是水本身增加。</li><li>催產素管「排乳」；催乳激素（PRL）管「製造乳汁」。</li><li>神經內分泌：由神經元合成與釋放激素。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>尿量減少時，是 ADH 把自己轉成水嗎？</p><p><b>答：</b>不是。ADH 作用於腎臟集尿管，增加水通透性，使更多水被再吸收回血液，尿量就減少。</p></div>", "tb": []}, {"id": "b3-c44-l07", "t": "腦垂腺前葉：多種激素，各有標的", "sec": "s2", "slide": 9, "sourceSlides": [9, 10], "sourcePages": [], "src": "原PPT第 9–10 頁；課本 P121–125", "figSpec": {"image": "PPT10S3"}, "txt": "<ul><li>前葉由腺體細胞構成，受下視丘調節，合成GH、TSH、ACTH、PRL等。</li><li>TSH刺激甲狀腺；ACTH主要促進腎上腺皮質分泌糖皮質素。</li><li>GH促生長與蛋白質合成，也促脂肪利用；不是胰島素式的降血糖訊號。</li></ul><p class=\"think\">「促腎上腺皮質素」和「糖皮質素」是同一物質嗎？</p><div class=\"scope-note\">原GH「分解醣類與脂質」保留在原文；精確補充：GH可降低部分組織葡萄糖利用，不把它寫成普遍促進葡萄糖消耗。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK459247/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>腦垂腺</h4><p>位於下視丘下方，分前葉與後葉。<b>前葉</b>由腺體細胞構成，分泌多種激素，並受下視丘調節。</p></div><div class=\"ex\"><h4>前葉激素</h4><ul><li><b>生長激素（GH）</b>：促進蛋白質合成、骨骼生長，並分解醣類與脂質供能。</li><li><b>促甲狀腺素（TSH）</b>：促進甲狀腺分泌甲狀腺素。</li><li><b>促腎上腺皮質素（ACTH）</b>：促進腎上腺皮質分泌糖皮質素，提高血糖以應對壓力。</li><li><b>催乳激素（PRL）</b>：促進乳腺發育與乳汁合成。</li><li><b>FSH、LH</b>（促性腺素）：見下一張。</li></ul></div><div class=\"ex\"><h4>深入解說：前葉激素＝「促」類與直接作用</h4><p>前葉激素分兩類：<b>促腺激素</b>（TSH、ACTH、FSH、LH）作用於其他內分泌腺，使其分泌自己的激素；<b>直接作用</b>激素（GH、PRL）直接作用於非腺體標的。這就是「下視丘 → 前葉 → 標的腺 → 標的細胞」的多級軸。</p></div><div class=\"ex\"><h4>前葉激素與標的</h4><ul><li>GH：肝、骨、肌肉等；促生長與蛋白質合成。</li><li>TSH：甲狀腺 → 甲狀腺素。</li><li>ACTH：腎上腺皮質 → 糖皮質素。</li><li>PRL：乳腺 → 乳汁合成。</li><li>FSH、LH：性腺。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>「促腎上腺皮質素」與「糖皮質素」是同一種物質嗎？</p><p><b>答：</b>不是。前者（ACTH）由腦垂腺前葉分泌，作用於腎上腺皮質；後者（皮質醇等）由腎上腺皮質分泌。</p></div>", "tb": []}, {"id": "b3-c44-l08", "t": "FSH與LH：配子形成與激素分泌", "sec": "s2", "slide": 11, "sourceSlides": [11], "sourcePages": [], "src": "原PPT第 11 頁；課本 P121–125", "figSpec": {"image": "PPT11S3"}, "txt": "<ul><li>FSH與LH合稱促性腺素，由腦垂腺前葉合成。</li><li>FSH促濾泡成熟及精子生成；LH促排卵、黃體形成及睪固酮分泌。</li><li>卵巢濾泡、黃體與睪丸間質細胞的作用不同。</li></ul><p class=\"think\">若把LH與FSH的男性作用交換，會改錯哪個標的？</p><div class=\"ex\"><h4>促性腺素</h4><p>濾泡刺激素（FSH）與黃體成長激素（LH）合稱促性腺素，作用於生殖腺。</p></div><div class=\"ex\"><h4>女性</h4><ul><li>FSH：促進<b>濾泡成熟</b>。</li><li>LH：促進<b>排卵與黃體形成</b>；FSH、LH 也促進動情素與黃體素的分泌。</li></ul></div><div class=\"ex\"><h4>男性</h4><ul><li>FSH：促進<b>精子生成</b>。</li><li>LH：促進睪丸分泌<b>睪固酮</b>。</li></ul></div><div class=\"ex\"><h4>重點</h4><p>這兩種激素同時影響「配子的形成」與「性激素的分泌」。詳細過程在第 6 章。</p></div><div class=\"ex\"><h4>深入解說：兩個標的，兩種效應</h4><p>FSH 與 LH 都作用於性腺，各自促進<b>配子生成</b>與<b>性激素分泌</b>。女性：FSH 促進濾泡發育；LH 促進排卵、形成黃體，濾泡與黃體再分泌動情素與黃體素。男性：FSH 作用於細精管的支持細胞，促進精子生成；LH 作用於間質細胞，促進睪固酮分泌。</p></div><div class=\"ex\"><h4>男性對照</h4><ul><li>LH → 間質細胞 → 睪固酮。</li><li>FSH → 支持細胞／細精管 → 精子生成。</li><li>不要把兩者的男性作用交換。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>FSH 與 LH 為何合稱「促性腺素」？</p><p><b>答：</b>它們都由前葉分泌，標的是性腺（睪丸、卵巢），調控配子形成與性激素分泌。</p></div>", "tb": []}, {"id": "b3-c44-l09", "t": "後葉不是另一座激素合成工廠", "sec": "s2", "slide": 12, "sourceSlides": [12], "sourcePages": [], "src": "原PPT第 12 頁；課本 P121–125", "figSpec": {"image": "pituitary"}, "txt": "<ul><li>後葉包含下視丘神經元的軸突及末梢。</li><li>ADH和催產素在下視丘合成，在後葉儲存並釋入血。</li><li>「釋放／分泌」有時用來描述入血；判題關鍵是不能寫成後葉自行合成。</li></ul><p class=\"think\">原題說「後葉所合成的ADH」，錯在效應還是來源？</p><div class=\"scope-note\">原解析「後葉本身不分泌」用詞保留；新版明確區分合成、儲存、釋放。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/17-3-the-pituitary-gland-and-hypothalamus\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>腦垂腺後葉</h4><p>是<b>下視丘神經元軸突的延伸</b>，屬神經組織，負責<b>儲存並釋放</b>下視丘分泌的抗利尿素與催產素。</p></div><div class=\"ex\"><h4>常見錯誤</h4><p>後葉本身<b>不合成</b>這兩種激素，它只是儲存與釋放的地方。若說「腦垂腺後葉所合成的抗利尿素」就是錯的。</p></div><div class=\"ex\"><h4>深入解說：合成、儲存、釋放三詞</h4><p>ADH 與催產素的<b>合成</b>在下視丘神經元的細胞本體，沿軸突運送（以載體蛋白包裝）到後葉，<b>儲存</b>在軸突末梢；有訊號時<b>釋放</b>入血。所以後葉像「倉庫與出口」，不是工廠。後葉屬神經組織，不含腺體細胞，與前葉（腺體細胞）截然不同。</p></div><div class=\"ex\"><h4>前後葉比較</h4><ul><li>前葉：腺體細胞；自己合成激素；受下視丘調節激素控制。</li><li>後葉：神經組織；儲存與釋放下視丘激素；受神經衝動控制。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>「後葉所合成的 ADH」錯在哪？</p><p><b>答：</b>錯在來源：ADH 在下視丘合成，後葉只儲存與釋放。ADH 促進水再吸收的功能敘述本身是對的。</p></div>", "tb": []}, {"id": "b3-c44-l10", "t": "甲狀腺：代謝、發育與不同激素", "sec": "s2", "slide": 13, "sourceSlides": [13, 14], "sourcePages": [3], "src": "原PPT第 13–14 頁；課本 P121–125", "figSpec": {"image": "thyroid"}, "txt": "<ul><li>甲狀腺位於氣管腹側；甲狀腺素含碘，參與代謝率、生長及發育。</li><li>分泌不足或過多可能影響生理，但不能用單一症狀反推個人疾病。</li><li>降鈣素也是甲狀腺激素，與含碘的甲狀腺素不同。</li></ul><p class=\"think\">「甲狀腺分泌」是否表示全部都是同一化學種類？</p><div class=\"scope-note\">原教材的歷史疾病名稱保留於原文；教學重點採甲狀腺功能低下／亢進與發育影響的描述。</div><div class=\"ex\"><h4>甲狀腺</h4><p>位於頸部氣管的腹側，分左、右兩葉。</p></div><div class=\"ex\"><h4>甲狀腺素</h4><ul><li>含<b>碘</b>；促進細胞呼吸作用，調節<b>基礎代謝率</b>，參與生長與發育。</li></ul></div><div class=\"ex\"><h4>失調</h4><ul><li>胚胎或嬰兒時期不足：影響神經系統發育，心智與生長遲緩，嚴重稱<b>呆小症</b>。</li><li>成人不足（機能低下）：疲倦、體重增加，嚴重時黏液型水腫。</li><li>過多（機能亢進）：怕熱、心跳加快、體重減輕。</li></ul></div><div class=\"ex\"><h4>另有降鈣素</h4><p>甲狀腺也分泌降鈣素（見下一張）。</p></div><div class=\"ex\"><h4>深入解說：甲狀腺素與碘</h4><p>甲狀腺素（T₄、T₃）含碘，提高細胞的氧氣消耗與基礎代謝率，並與神經與骨骼發育有關。缺碘 → 合成不足 → TSH 因負回饋解除而升高，刺激甲狀腺腫大（地方性甲狀腺腫）。嬰兒期不足可造成呆小症（智能與生長遲緩）。成人亢進：怕熱、心跳快、體重減輕；機能低下：怕冷、疲倦、體重增加。</p></div><div class=\"ex\"><h4>兩種甲狀腺激素</h4><ul><li>甲狀腺素：含碘，提高代謝率。</li><li>降鈣素：不含碘，降低血鈣（見副甲狀腺卡）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>食鹽加碘的目的？</p><p><b>答：</b>提供合成甲狀腺素所需的碘，預防缺碘造成的甲狀腺腫與嬰幼兒發育問題。</p></div>", "tb": [["BOOK3", "P122 完整課本頁"]]}, {"id": "b3-c44-l11", "t": "副甲狀腺：血鈣與骨、腎的調節", "sec": "s2", "slide": 15, "sourceSlides": [15], "sourcePages": [], "src": "原PPT第 15 頁；課本 P121–125", "figSpec": {"image": "thyroid"}, "txt": "<ul><li>副甲狀腺通常四個，位於甲狀腺背側，與甲狀腺是不同腺體。</li><li>PTH促骨的鈣釋出、腎臟保留鈣，提高血鈣。</li><li>教材以PTH和降鈣素作用相反示範拮抗；成人血鈣主要控制不只此兩者，亦涉及活性維生素D。</li></ul><p class=\"think\">血鈣變化與骨鈣存量是同一個指標嗎？</p><div class=\"scope-note\">成人恆定中降鈣素角色相對有限；不把原圖的對稱拮抗當作貢獻必定相等。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/17-5-the-parathyroid-glands\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>副甲狀腺</h4><p>通常有四個，嵌埋於甲狀腺背側表面。</p></div><div class=\"ex\"><h4>血鈣的調節</h4><ul><li><b>副甲狀腺素（PTH）</b>：促進硬骨釋出鈣離子、促進腎臟再吸收鈣離子 → <b>提高</b>血鈣濃度。</li><li><b>降鈣素</b>（甲狀腺分泌）：<b>降低</b>血鈣濃度。</li></ul></div><div class=\"ex\"><h4>拮抗</h4><p>兩者作用相反，共同使血鈣穩定。</p></div><div class=\"ex\"><h4>深入解說：血鈣為何要穩定</h4><p>血鈣影響神經與肌肉的興奮性與凝血。血鈣下降 → 副甲狀腺分泌 <b>PTH</b> → 促使骨釋出鈣、腎臟增加鈣再吸收，並活化維生素 D（促進小腸吸收鈣）→ 血鈣回升。血鈣過高 → 降鈣素促進鈣沉積於骨。教材以兩激素作用相反示範拮抗；成人血鈣調節以 PTH 與維生素 D 為主。</p></div><div class=\"ex\"><h4>分清楚</h4><ul><li>副甲狀腺：四個小腺體，在甲狀腺背面。</li><li>PTH：升血鈣；降鈣素：降血鈣。</li><li>骨中的鈣存量不等於血鈣濃度。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>血鈣過低會有什麼影響？</p><p><b>答：</b>神經肌肉過度興奮，可能出現手腳抽筋、痙攣；嚴重時危及生命。</p></div>", "tb": []}, {"id": "b3-c44-l12", "t": "腎上腺髓質：神經帶動的激素反應", "sec": "s2", "slide": 16, "sourceSlides": [16], "sourcePages": [4], "src": "原PPT第 16 頁；課本 P121–125", "figSpec": {"image": "adrenal"}, "txt": "<ul><li>腎上腺在腎臟上方，髓質在內部，皮質在外層。</li><li>交感神經刺激髓質釋放腎上腺素與去甲基腎上腺素。</li><li>激素經血液作用，可提高血糖並改變心血管等功能。</li></ul><p class=\"think\">位置在同一器官，是否表示皮質與髓質的控制相同？</p><div class=\"ex\"><h4>腎上腺</h4><p>一對，位於腎臟上方，分外層的<b>皮質</b>與內層的<b>髓質</b>，兩者發育來源與激素種類都不同。</p></div><div class=\"ex\"><h4>髓質</h4><ul><li>受<b>交感神經</b>刺激，分泌<b>腎上腺素與去甲基腎上腺素</b>。</li><li>作用：血糖上升、心跳加快、血壓上升，協助因應緊急情境（打鬥或逃跑反應）。</li></ul></div><div class=\"ex\"><h4>重點</h4><p>髓質的反應是神經帶動的激素反應：交感神經 → 髓質 → 激素入血。</p></div><div class=\"ex\"><h4>深入解說：髓質＝特化的交感節後神經元</h4><p>腎上腺髓質由交感神經的節前纖維（釋放 ACh）直接支配，髓質細胞相當於沒有軸突的節後神經元，直接把<b>腎上腺素與去甲基腎上腺素</b>釋放入血。這就是「神經帶動的激素反應」：神經訊號 → 激素 → 全身標的。效果與交感神經類似但更廣、持續更久。</p></div><div class=\"ex\"><h4>皮質與髓質</h4><ul><li>位置：皮質在外，髓質在內。</li><li>來源：皮質為腺體組織；髓質為神經組織特化。</li><li>控制：皮質受 ACTH 等調節；髓質受交感神經控制。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>髓質的激素與交感神經末梢的傳遞物有何關係？</p><p><b>答：</b>兩者化學上都屬兒茶酚胺。神經末梢釋出屬局部傳遞物，髓質入血的則是激素。</p></div>", "tb": [["BOOK4", "P123 完整課本頁"]]}, {"id": "b3-c44-l13", "t": "腎上腺皮質：糖與鹽水的兩種調節", "sec": "s2", "slide": 17, "sourceSlides": [17], "sourcePages": [], "src": "原PPT第 17 頁；課本 P121–125", "figSpec": {"image": "adrenal"}, "txt": "<ul><li>糖皮質素促進糖質新生等代謝，並可抑制發炎及免疫反應。</li><li>礦物皮質素以醛固酮為主，促進鈉再吸收及鉀排出；水分保留受整體腎臟調節影響。</li><li>ACTH主要調節糖皮質素，不把所有皮質激素都當作完全相同的控制軸。</li></ul><p class=\"think\">醛固酮與ADH都能影響水分，但直接調節對象相同嗎？</p><div class=\"scope-note\">醛固酮也受血鉀與腎素－血管張力素系統調控，此為區分ACTH範圍的補充。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>腎上腺皮質</h4><p>分泌<b>糖皮質素</b>與<b>礦物皮質素</b>（人體主要是醛固酮）。</p></div><div class=\"ex\"><h4>兩類激素</h4><ul><li><b>糖皮質素</b>：促進脂肪分解與糖質新生，提高血糖；具抗發炎與抑制免疫的作用。</li><li><b>醛固酮</b>：促進腎臟對鈉離子與水分的再吸收，調節無機鹽與體液恆定。</li></ul></div><div class=\"ex\"><h4>對照</h4><p>一個管「糖」，一個管「鹽與水」。</p></div><div class=\"ex\"><h4>深入解說：糖皮質素與醛固酮</h4><p><b>糖皮質素（皮質醇）</b>：促進脂肪與蛋白質分解、肝臟糖質新生，使血糖上升；高劑量抑制發炎與免疫（故為消炎藥成分）；受 ACTH 調節。<b>醛固酮</b>：作用於腎小管，促進 Na⁺ 再吸收與 K⁺ 排出，水隨之被保留；受腎素－血管張力素系統與血鉀調節。</p></div><div class=\"ex\"><h4>對照</h4><ul><li>糖皮質素：管糖與壓力，抗發炎。</li><li>醛固酮：管鹽（Na⁺／K⁺）與血量。</li><li>ADH：管水，由下視丘合成、後葉釋放。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>醛固酮與 ADH 都影響水，差在哪？</p><p><b>答：</b>ADH 直接調節腎集尿管的水通透性；醛固酮調節 Na⁺ 與 K⁺ 的運送，水隨 Na⁺ 滲透而被保留。兩者控制的直接對象不同。</p></div>", "tb": []}, {"id": "b3-c44-l14", "t": "胰臟與胰島：同器官的兩種分泌", "sec": "s2", "slide": 18, "sourceSlides": [18], "sourcePages": [], "src": "原PPT第 18 頁；課本 P121–125", "figSpec": {"image": "islet"}, "txt": "<ul><li>胰島是胰臟內的內分泌細胞團，激素釋入血。</li><li>分泌胰液的外分泌細胞透過胰管，把消化液送入腸道。</li><li>α細胞、β細胞與胰液細胞不是同一種角色。</li></ul><p class=\"think\">沿圖中的胰管找路，會找到胰島素的正常運送方式嗎？</p><div class=\"ex\"><h4>胰島</h4><p>分布在胰臟中的小型內分泌細胞團，由德國病理學家蘭格漢發現，又稱<b>蘭氏小島</b>。</p></div><div class=\"ex\"><h4>兩種細胞</h4><ul><li><b>α 細胞</b>：分泌升糖素。</li><li><b>β 細胞</b>：分泌胰島素。</li></ul></div><div class=\"ex\"><h4>同一器官兩種分泌</h4><p>胰臟的胰液（外分泌，經導管入十二指腸）與胰島激素（內分泌，入血液）功能不同。兩種激素作用相反，共同維持血糖穩定。</p></div><div class=\"ex\"><h4>深入解說：蘭氏小島</h4><p>胰臟約 99% 是外分泌腺泡（分泌胰液，含消化酵素，經胰管入十二指腸），其間散布約百萬個胰島，內含：<b>α 細胞（升糖素）、β 細胞（胰島素）</b>及少量 δ 細胞（體制素，延伸）。胰島富含微血管，激素可直接入血。</p></div><div class=\"ex\"><h4>看圖技巧</h4><ul><li>有導管通向十二指腸 → 外分泌。</li><li>島狀細胞團、貼近血管 → 內分泌。</li><li>染色後 α、β 細胞可用不同顏色區分。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>沿胰管能找到胰島素嗎？</p><p><b>答：</b>找不到。胰管運送的是胰液；胰島素從胰島細胞直接進入血液。</p></div>", "tb": []}, {"id": "b3-c44-l15", "t": "升糖素：把肝臟儲存轉為供應", "sec": "s2", "slide": 19, "sourceSlides": [19], "sourcePages": [], "src": "原PPT第 19 頁；課本 P121–125", "figSpec": {"image": "islet"}, "txt": "<ul><li>胰島α細胞分泌升糖素，低血糖等情境可促進其分泌。</li><li>升糖素促肝糖分解與糖質新生，提高血液葡萄糖供應。</li><li>肝臟釋出葡萄糖與骨骼肌自己利用肝糖不能混成相同效應。</li></ul><p class=\"think\">為何解釋血糖回升時，教材特別指出肝臟？</p><div class=\"ex\"><h4>升糖素</h4><p>由 α 細胞分泌，受<b>血糖濃度下降</b>刺激（如空腹或運動後）。</p></div><div class=\"ex\"><h4>作用</h4><ul><li>促進肝臟中<b>肝糖水解</b>成葡萄糖。</li><li>促進<b>糖質新生</b>。</li><li>結果：血糖濃度上升。</li></ul></div><div class=\"ex\"><h4>小提醒</h4><p>升糖素把「肝臟儲存」轉成「血中供應」。</p></div><div class=\"ex\"><h4>深入解說：升糖素的調節</h4><p>血糖下降（空腹、運動）→ α 細胞分泌升糖素 → 作用於<b>肝細胞</b>：① 肝糖分解成葡萄糖（糖解）；② 糖質新生（由胺基酸、甘油等合成葡萄糖）→ 葡萄糖釋入血液 → 血糖回升。肌肉的肝糖主要供自己使用，不能直接釋放葡萄糖到血液。</p></div><div class=\"ex\"><h4>機制連結</h4><ul><li>升糖素為水溶性（胜肽類）→ 受體在膜上 → cAMP 路徑。</li><li>升糖素 → cAMP → 酵素級聯 → 肝糖分解，與後面的作用機制卡片相連。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>為什麼說肝臟是血糖的「緩衝庫」？</p><p><b>答：</b>進食後可儲存葡萄糖成肝糖，空腹時又可分解並釋出，使血糖維持穩定。</p></div>", "tb": []}, {"id": "b3-c44-l16", "t": "胰島素：攝取、利用與儲存", "sec": "s2", "slide": 20, "sourceSlides": [20], "sourcePages": [], "src": "原PPT第 20 頁；課本 P121–125", "figSpec": {"image": "islet"}, "txt": "<ul><li>胰島β細胞分泌胰島素，進食後血糖上升可促分泌。</li><li>胰島素促骨骼肌、脂肪細胞攝取葡萄糖；肝臟則增加儲存並降低葡萄糖輸出。</li><li>胰島素和升糖素對血糖作用相反，但兩者的分泌也各受負回饋調節。</li></ul><p class=\"think\">不能把「促葡萄糖進入細胞」理解成所有細胞都需要胰島素才可吸收嗎？</p><div class=\"scope-note\">區分肝臟代謝與肌肉／脂肪GLUT4轉運；不把三種組織的攝取機制全部等同。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK378978/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>胰島素</h4><p>由 β 細胞分泌，受<b>血糖濃度上升</b>刺激（如進食後）。</p></div><div class=\"ex\"><h4>作用</h4><ul><li>促進葡萄糖進入<b>肝臟、肌肉、脂肪細胞</b>儲存與利用。</li><li>促進葡萄糖轉變成肝糖儲存。</li><li>結果：血糖濃度下降。</li></ul></div><div class=\"ex\"><h4>拮抗</h4><p>升糖素與胰島素互為拮抗，共同調節血糖穩定。</p></div><div class=\"ex\"><h4>深入解說：胰島素降低血糖的方式</h4><p>進食後血糖上升 → β 細胞分泌胰島素 → ① 肌肉、脂肪細胞膜上的葡萄糖運輸蛋白（GLUT4）增加，攝取葡萄糖；② 肝臟與肌肉把葡萄糖合成肝糖；③ 肝臟減少葡萄糖輸出；④ 促進脂肪合成。結果血糖下降。血糖回到正常後胰島素分泌減少，是負回饋。</p></div><div class=\"ex\"><h4>重點</h4><ul><li>腦與紅血球攝取葡萄糖不需胰島素。</li><li>肝臟是調節血糖的樞紐。</li><li>胰島素是人體唯一降血糖的激素，升糖素、腎上腺素、糖皮質素等多數都升血糖。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>胰島素與升糖素的分泌，各受什麼刺激？</p><p><b>答：</b>胰島素：血糖上升（進食後）；升糖素：血糖下降（空腹、運動後）。兩者作用相反。</p></div>", "tb": []}, {"id": "b3-c44-l17", "t": "性腺：配子之外的內分泌功能", "sec": "s2", "slide": 21, "sourceSlides": [21, 22, 23], "sourcePages": [5], "src": "原PPT第 21–23 頁；課本 P121–125", "figSpec": {"image": "PPT23S3"}, "txt": "<ul><li>睪丸間質細胞分泌睪固酮，細精管參與精子形成。</li><li>卵巢濾泡及黃體分泌動情素，黃體也分泌黃體素。</li><li>這些激素參與生殖器官、第二性徵及子宮內膜調節；不以單一外觀推斷個人激素。</li></ul><p class=\"think\">何種細胞在合成激素，何種構造在形成配子？</p><div class=\"ex\"><h4>性腺</h4><p>男性的睪丸與女性的卵巢，除了形成精、卵，也能分泌<b>性激素</b>，促進性徵發育，影響生殖行為。</p></div><div class=\"ex\"><h4>睪丸</h4><ul><li><b>間質細胞</b>分泌睪固酮：促進男性生殖器官發育與第二性徵（鬍鬚、低沉的聲音、肌肉量增加）。</li></ul></div><div class=\"ex\"><h4>卵巢</h4><ul><li><b>濾泡細胞</b>與<b>黃體</b>分泌動情素：促進女性第二性徵（乳房發育、皮下脂肪增加）、子宮內膜變化。</li><li><b>黃體</b>分泌黃體素：促進子宮內膜增厚及維持。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>動情素與黃體素的週期性變化，是維持女性生殖功能的重要因子，第 6 章再詳述。</p></div><div class=\"ex\"><h4>深入解說：配子與激素是兩件事</h4><p>睪丸：<b>細精管</b>內的生精細胞形成精子；細精管之間的<b>間質細胞</b>分泌睪固酮。卵巢：<b>濾泡</b>內的卵母細胞發育成卵；濾泡細胞分泌動情素；排卵後濾泡轉為<b>黃體</b>，分泌黃體素與動情素。性激素促進生殖器官發育、第二性徵，並調節子宮內膜週期。</p></div><div class=\"ex\"><h4>對照</h4><ul><li>睪固酮：男性生殖器官與第二性徵。</li><li>動情素：女性第二性徵、子宮內膜增生期。</li><li>黃體素：子宮內膜增厚與維持。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>「形成配子」與「分泌激素」是不是同一種細胞？</p><p><b>答：</b>不是。例如睪丸：細精管產生精子；間質細胞分泌睪固酮。</p></div>", "tb": [["BOOK5", "P124 完整課本頁"]]}, {"id": "b3-c44-l18", "t": "多功能器官：心、腎、胎盤與脂肪", "sec": "s2", "slide": 24, "sourceSlides": [24, 25], "sourcePages": [], "src": "原PPT第 24–25 頁；課本 P121–125", "figSpec": {"image": "PPT25S3"}, "txt": "<ul><li>心房細胞可分泌ANP參與排鈉；腎臟EPO作用於骨髓，促紅血球生成。</li><li>胎盤的hCG、動情素與黃體素協助維持妊娠；脂肪組織的瘦素參與能量調節。</li><li>皮膚與後續代謝共同參與維生素D形成，不是照光後皮膚立刻製成全部活性形式。</li></ul><p class=\"think\">「器官主要功能」能否排除它另有內分泌功能？</p><div class=\"scope-note\">教材寫右心房為ANP來源，不外推成只有右心房可合成；PDF「心房排鈉V」是文字抽取誤碼，圖與PPT為「肽」。</div><div class=\"ex\"><h4>不是專職內分泌，也會分泌激素</h4><p></p></div><div class=\"ex\"><h4>例子</h4><ul><li><b>心臟</b>（右心房細胞）：心房排鈉肽（ANP），抑制腎臟再吸收鈉，增加尿量、降血壓。</li><li><b>腎臟</b>：紅血球生成素（EPO），促進骨髓製造紅血球。</li><li><b>胎盤</b>（懷孕時）：hCG、動情素、黃體素，協助維持妊娠。</li><li><b>脂肪組織</b>：瘦素，參與食慾與能量代謝調控。</li><li><b>皮膚</b>：照陽光後可合成活性維生素 D，促進小腸吸收鈣。</li></ul></div><div class=\"ex\"><h4>結論</h4><p>內分泌系統是廣泛分布、功能多元的系統，不只是傳統腺體。</p></div><div class=\"ex\"><h4>深入解說：不只腺體會分泌激素</h4><p><b>心房</b>：血量過多、心房被拉伸 → 分泌 ANP，使腎臟排鈉利尿、降血壓。<b>腎臟</b>：缺氧 → EPO → 骨髓增加紅血球生成。<b>胎盤</b>：hCG 維持黃體，動情素與黃體素維持妊娠。<b>脂肪組織</b>：瘦素 → 下視丘 → 抑制食慾。<b>皮膚</b>：紫外線使皮膚中前驅物轉成維生素 D 的前身，經肝、腎再活化，促進小腸吸收鈣。</p></div><div class=\"ex\"><h4>連結其他章節</h4><ul><li>ANP：循環與泌尿（2-1、3-2）。</li><li>EPO：血球生成（2-1）。</li><li>hCG、胎盤：生殖（6-x）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>高山訓練後紅血球增加，與哪種激素有關？</p><p><b>答：</b>低氧刺激腎臟分泌 EPO，促進骨髓製造紅血球，提升運氧能力。</p></div>", "tb": []}, {"id": "b3-c44-l19", "t": "統整圖：從腺體追到效應", "sec": "s2", "slide": 26, "sourceSlides": [26, 27, 28, 29, 30], "sourcePages": [6], "src": "原PPT第 26–30 頁；課本 P121–125", "figSpec": {"pair": ["overviewLeft", "overviewRight"]}, "txt": "<ul><li>把原圖4-26跨P124–125的兩部分對照，逐一找來源、激素及效應。</li><li>前葉與後葉、腎上腺皮質與髓質不能只以器官名合併。</li><li>同樣提高血糖不代表同一分子、同一受體或同一控制途徑。</li></ul><p class=\"think\">選一個激素，說出來源與一個標的，再找一個容易混淆的激素。</p><div class=\"ex g\"><h4>圖 4－26　怎麼讀</h4><p>先找腺體 → 激素 → 作用。★ 是國中學過的激素，● 是新學的激素。</p></div><div class=\"ex\"><h4>主要對照</h4><ul><li><b>下視丘</b>：製造後葉釋放的激素，並分泌調節激素。</li><li><b>腦垂腺前葉</b>：GH、ACTH、TSH、FSH、LH、PRL。</li><li><b>腦垂腺後葉（儲存）</b>：ADH、催產素。</li><li><b>甲狀腺</b>：甲狀腺素（調節代謝）、降鈣素（降血鈣）。</li><li><b>副甲狀腺</b>：PTH（升血鈣）。</li><li><b>腎上腺</b>：腎上腺素、去甲基腎上腺素、糖皮質素、礦物皮質素。</li><li><b>胰島</b>：胰島素（促進血糖進入細胞並轉成肝糖）、升糖素（肝糖轉成葡萄糖）。</li><li><b>性腺</b>：睪固酮；動情素、黃體素。</li></ul></div><div class=\"ex\"><h4>深入解說：怎麼讀總整理圖</h4><p>每個激素先找「<b>誰分泌（來源）</b>→ <b>作用對象（標的）</b>→ <b>主要效應</b>」。再依層級分群：下視丘、腦垂腺是「控制中心」，其餘多是「效應腺」。同一個效應（如升血糖）可由多種激素參與，但來源、受體與調節途徑各不相同。</p></div><div class=\"ex\"><h4>學習策略</h4><ul><li>★國中已學：生長激素、胰島素、甲狀腺素、性激素等。</li><li>●本章新學：ADH、催產素、PTH、降鈣素、糖皮質素等。</li><li>自己畫表：激素｜來源｜標的｜效應｜容易混淆處。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>升血糖的激素有哪些？各自來源？</p><p><b>答：</b>升糖素（胰島 α 細胞）、腎上腺素（髓質）、糖皮質素（皮質）、生長激素（前葉）等。降血糖的主要只有胰島素。</p></div>", "tb": [["BOOK5", "P124 完整課本頁"], ["BOOK6", "P125 完整課本頁"]]}, {"id": "b3-c44-l20", "t": "受體位置：作用機制的分類起點", "sec": "s3", "slide": 31, "sourceSlides": [31], "sourcePages": [], "src": "原PPT第 31 頁；課本 P126–127", "figSpec": {"image": "membrane"}, "txt": "<ul><li>專一性受體可位於細胞膜、細胞質或細胞核。</li><li>化學性質影響運送與受體作用方式，但不能把所有胺類激素歸在同一種受體。</li><li>甲狀腺激素與腎上腺素皆為胺類衍生物，受體典型位置不同。</li></ul><p class=\"think\">以化學本質分類與以受體位置分類，是否必定得到同一分組？</p><div class=\"scope-note\">化學三類為保留原網頁的延伸，當章原教材主要依受體位置分兩類。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/17-2-hormones\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>目標細胞與受體</h4><p>激素隨血液運送到全身，具有該激素專一性受體的細胞稱<b>目標細胞</b>。激素與受體結合，引發一系列反應。</p></div><div class=\"ex\"><h4>依受體位置分兩類</h4><ul><li>受體位於<b>細胞膜</b>：多為水溶性激素。</li><li>受體位於<b>細胞內</b>（細胞質或細胞核）：多為脂溶性激素。</li></ul></div><div class=\"ex\"><h4>為什麼這樣分</h4><p>水溶性激素不易通過細胞膜，所以受體在膜上；脂溶性激素可直接通過細胞膜，所以受體在細胞內。</p></div><div class=\"ex\"><h4>深入解說：溶解性決定受體位置</h4><p>水溶性激素（胜肽、蛋白質、多數胺類）無法穿過脂雙層，受體在<b>細胞膜</b>上。脂溶性激素（類固醇、甲狀腺激素）可穿過膜，受體在<b>細胞質或細胞核</b>。這是分類的起點，也解釋了作用速度：膜受體路徑快（秒～分），細胞內受體路徑通常慢（需基因表現，小時）。</p></div><div class=\"ex\"><h4>常見激素分類</h4><ul><li>膜受體：升糖素、胰島素、ADH、腎上腺素、TSH。</li><li>細胞內受體：糖皮質素、醛固酮、性激素、甲狀腺素。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>為什麼脂溶性激素可以直接進入細胞？</p><p><b>答：</b>細胞膜主要由磷脂質雙層構成，脂溶性（非極性）分子能溶於脂質層而擴散通過。</p></div>", "tb": []}, {"id": "b3-c44-l21", "t": "膜受體與cAMP：升糖素的放大接力", "sec": "s3", "slide": 32, "sourceSlides": [32, 33], "sourcePages": [7], "src": "原PPT第 32–33 頁；課本 P126–127", "figSpec": {"image": "membrane"}, "txt": "<ul><li>升糖素是第一傳訊者，與肝細胞膜受體結合，不直接進入細胞作用於DNA。</li><li>ATP經酵素轉換形成cAMP；cAMP是第二傳訊者。</li><li>傳訊級聯可放大訊號，影響肝糖分解；不能把cAMP叫作入血的激素。</li></ul><p class=\"think\">若阻斷產生cAMP的酵素，哪一段接力最先受影響？</p><div class=\"ex\"><h4>受體位於細胞膜</h4><p>大部分水溶性激素（如升糖素、腎上腺素）：不進入細胞，與膜上受體結合。</p></div><div class=\"ex\"><h4>接力步驟</h4><ul><li>激素是<b>第一傳訊者</b>，與膜上受體結合。</li><li>受體活化膜上的特定酵素，產生大量<b>第二傳訊者</b>，如 <b>cAMP</b>（由 ATP 形成）。</li><li>第二傳訊者活化細胞內一系列酵素，調節生理作用。</li></ul></div><div class=\"ex\"><h4>放大效果</h4><p>一個激素分子引發大量第二傳訊者，再活化更多酵素，所以少量激素就能引發明顯反應。以升糖素為例：cAMP 大量形成 → 酵素級聯 → 肝糖分解成葡萄糖，釋放到血液。</p></div><div class=\"ex\"><h4>深入解說：一個激素分子，千百個產物</h4><p>升糖素（第一傳訊者）結合肝細胞膜受體 → 活化膜上的腺苷酸環化酶（酵素）→ 把 ATP 轉成大量 <b>cAMP</b>（第二傳訊者）→ cAMP 活化蛋白激酶 → 活化磷酸化酶 → 肝糖分解成葡萄糖。每一步都是酵素催化，一分子可使下一階段的酵素活化許多分子，形成逐級<b>放大</b>。</p></div><div class=\"ex\"><h4>名詞整理</h4><ul><li>第一傳訊者：激素本身。</li><li>第二傳訊者：細胞內的訊號分子（cAMP、Ca²⁺ 等）。</li><li>放大：少量激素產生大量反應。</li><li>cAMP 不是激素，不入血，只在細胞內。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>若阻斷產生 cAMP 的酵素，哪一步最先受影響？</p><p><b>答：</b>受體後、cAMP 生成這一步；後面的酵素級聯與肝糖分解都無法被啟動。</p></div>", "tb": [["BOOK7", "P126 完整課本頁"]]}, {"id": "b3-c44-l22", "t": "細胞內受體：從訊號到特定蛋白質", "sec": "s3", "slide": 34, "sourceSlides": [34, 35], "sourcePages": [8], "src": "原PPT第 34–35 頁；課本 P126–127", "figSpec": {"image": "intracellular"}, "txt": "<ul><li>類固醇可通過細胞膜，與細胞質或核內受體形成複合體。</li><li>典型基因調控路徑改變特定轉錄，再經轉譯產生蛋白質。</li><li>不需教材圖中的cAMP級聯，不表示無任何調節或只影響單一分子。</li></ul><p class=\"think\">圖中DNA、mRNA、核糖體的順序能否交換？</p><div class=\"ex\"><h4>受體位於細胞內</h4><p>脂溶性激素（如腎上腺皮質素、性激素）：可直接通過細胞膜，與細胞質或細胞核內的受體結合。</p></div><div class=\"ex\"><h4>步驟</h4><ul><li>形成<b>激素－受體複合體</b>。</li><li>複合體不需要第二傳訊者，直接調節特定基因的<b>轉錄</b>。</li><li>mRNA 經<b>轉譯</b>產生特定蛋白質，調控目標細胞的代謝或生理作用。</li></ul></div><div class=\"ex\"><h4>對照</h4><p>膜受體：靠酵素級聯（快）；細胞內受體：靠基因表現（產生新蛋白質）。</p></div><div class=\"ex\"><h4>深入解說：激素進入核內調控基因</h4><p>脂溶性激素進入細胞，與受體結合成<b>激素－受體複合體</b>，進入細胞核與 DNA 特定區域結合，促進或抑制某些基因的轉錄 → 產生特定 mRNA → 在核糖體轉譯為特定蛋白質（酵素、結構蛋白等），改變細胞功能。順序為 DNA → mRNA → 蛋白質，與中心法則一致。</p></div><div class=\"ex\"><h4>與膜受體對照</h4><ul><li>作用速度：膜受體快；細胞內受體慢但持久。</li><li>產物：膜受體 → 既有酵素活性改變；細胞內受體 → 新合成蛋白質。</li><li>第二傳訊者：前者常有；後者不經 cAMP 級聯。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>圖中 DNA、mRNA、核糖體的順序可以交換嗎？</p><p><b>答：</b>不行。必須先轉錄（DNA → mRNA），再由核糖體轉譯成蛋白質。</p></div>", "tb": [["BOOK8", "P127 完整課本頁"]]}, {"id": "b3-c44-l23", "t": "比較表的界線：不是所有膜受體都走cAMP", "sec": "s3", "slide": 36, "sourceSlides": [36], "sourcePages": [], "src": "原PPT第 36 頁；課本 P126–127", "figSpec": {"image": "PPT36S3"}, "txt": "<ul><li>教材比較「膜受體的第二傳訊」與「細胞內受體的基因調控」兩個典型模式。</li><li>胰島素受體為受體酪胺酸激酶；GH主要有JAK–STAT傳訊，不能全部套為G蛋白－cAMP。</li><li>甲狀腺激素作用於核內受體，跨膜涉及轉運蛋白；不套用所有類固醇的自由擴散描述。</li></ul><p class=\"think\">把表中「放大訊號：無」改讀為「沒有本圖的cAMP級聯」，能避免哪種過度推論？</p><div class=\"scope-note\">原PPT表格完整保留；「無放大」只限定所畫的cAMP級聯，不是所有基因調控絕無放大。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK378978/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a> <a href=\"https://pubmed.ncbi.nlm.nih.gov/29487568/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a> <a href=\"https://www.ncbi.nlm.nih.gov/books/NBK285565/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>比較表（典型模式）</h4><p></p></div><div class=\"ex\"><h4>兩種作用機制</h4><ul><li><b>激素種類</b>：膜受體 → 大部分水溶性（升糖素、腎上腺素）；細胞內受體 → 脂溶性（腎上腺皮質素、性腺激素）。</li><li><b>第二傳訊者</b>：膜受體需要（如 cAMP）；細胞內受體不需要。</li><li><b>作用機制</b>：膜受體透過活化酵素；細胞內受體透過調節轉錄。</li><li><b>放大訊號</b>：膜受體「有」；細胞內受體「無」。</li></ul></div><div class=\"ex\"><h4>讀表的界線</h4><p>這是教材的兩個典型模式。表中的「無放大」只是指沒有 cAMP 級聯那種放大，不表示基因調控完全沒有放大；也不是所有膜受體都走 cAMP。</p></div><div class=\"ex\"><h4>深入解說：典型≠全部</h4><p>教材的兩個模式是學習的起點，實際上還有更多：胰島素受體是受體酪胺酸激酶；生長激素受體透過 JAK–STAT；甲狀腺激素雖脂溶性，其受體在核內；有些類固醇也有膜上快速反應。所以「膜受體＝一定 cAMP」「細胞內受體＝絕無放大」都是過度推論。</p></div><div class=\"ex\"><h4>讀表要點</h4><ul><li>表格呈現典型模式，用於比較與記憶。</li><li>「放大：無」＝沒有 cAMP 級聯那種逐級放大。</li><li>遇到新激素時，先查受體位置，再看傳訊路徑。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>把「放大訊號：無」改讀為「沒有本圖的 cAMP 級聯」可避免什麼錯誤？</p><p><b>答：</b>避免推論成「基因調控完全沒有放大」，事實上一個基因可轉錄出許多 mRNA，仍有放大效果。</p></div>", "tb": []}, {"id": "b3-c44-l24", "t": "兩條神經內分泌途徑再比較", "sec": "s4", "slide": 37, "sourceSlides": [37, 38], "sourcePages": [9], "src": "原PPT第 37–38 頁；課本 P128–131", "figSpec": {"image": "neuroAxis"}, "txt": "<ul><li>前葉路徑：下視丘調節激素→血液→前葉→激素→標的。</li><li>後葉路徑：下視丘合成→軸突運送→後葉儲存釋放→血液→標的。</li><li>神經元也能把激素釋入血，和突觸局部傳訊是不同傳送情境。</li></ul><p class=\"think\">「神經內分泌」是否表示激素不經血液？</p><div class=\"ex\"><h4>兩條神經內分泌途徑</h4><p>下視丘透過兩種方式控制內分泌。</p></div><div class=\"ex\"><h4>途徑一：經腦垂腺前葉</h4><ul><li>下視丘分泌<b>調節激素</b>（如促性腺素釋素）→ 血液運送到腦垂腺前葉 → 前葉分泌促性腺素等 → 血液運送 → 刺激性腺 → 性腺分泌性激素。</li></ul></div><div class=\"ex\"><h4>途徑二：經腦垂腺後葉</h4><ul><li>下視丘神經元合成 <b>ADH、催產素</b> → 沿軸突運到後葉儲存 → 需要時釋放到血液 → 作用於腎臟（再吸收水）、子宮與乳腺（收縮、排乳）。</li></ul></div><div class=\"ex\"><h4>差別</h4><p>前葉：下視丘用<b>激素</b>控制前葉細胞；後葉：下視丘神經元直接<b>把激素送到後葉</b>釋放。</p></div><div class=\"ex\"><h4>深入解說：兩條路徑的差別</h4><p>路徑一（前葉）：下視丘神經元釋放調節激素 → 經小血管（門脈）到前葉 → 前葉細胞分泌促激素 → 血液運到標的腺 → 標的腺分泌激素。路徑二（後葉）：下視丘神經元本體合成 ADH／催產素 → 軸突運到後葉 → 釋放入體循環 → 作用於腎、子宮、乳腺。「神經內分泌」是指神經元分泌激素，激素仍然經血液運送。</p></div><div class=\"ex\"><h4>比較</h4><ul><li>前葉路徑：激素控制腺體細胞（多級）。</li><li>後葉路徑：神經元直接將激素送入血（單級）。</li><li>共同點：都起源於下視丘。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>神經內分泌是否表示激素不經血液？</p><p><b>答：</b>不是。神經元分泌的激素仍是釋入血液，隨循環到標的；與突觸的局部釋放不同。</p></div>", "tb": [["BOOK9", "P128 完整課本頁"]]}, {"id": "b3-c44-l25", "t": "負回饋：從末端回到上游", "sec": "s4", "slide": 39, "sourceSlides": [39, 40], "sourcePages": [10], "src": "原PPT第 39–40 頁；課本 P128–131", "figSpec": {"image": "thyroidAxis"}, "txt": "<ul><li>TRH由下視丘釋放，TSH由前葉合成，甲狀腺素由甲狀腺合成。</li><li>甲狀腺素升高會抑制上游TRH、TSH，限制繼續分泌。</li><li>圖中「抑制」箭頭有回路方向；負回饋不等同反應完全停止或值永遠固定。</li></ul><p class=\"think\">其他條件相同時，末端激素下降，上游刺激預期如何改變？</p><div class=\"ex\"><h4>三種恆定機制</h4><p>回饋控制、拮抗作用、協同作用。</p></div><div class=\"ex\"><h4>負回饋</h4><p>激素濃度增高到某個量時，回饋抑制自身的分泌。以甲狀腺素為例（圖 4－30）。</p></div><div class=\"ex\"><h4>甲狀腺素的調節軸</h4><ul><li>甲狀腺素不足 → 下視丘分泌 <b>TRH</b> → 腦垂腺前葉分泌 <b>TSH</b> → 甲狀腺分泌更多甲狀腺素。</li><li>甲狀腺素過高 → 負回饋，<b>抑制下視丘的 TRH 與腦垂腺前葉的 TSH</b> → 甲狀腺素分泌減少。</li></ul></div><div class=\"ex\"><h4>重點</h4><p>負回饋從「末端產物」回到「上游」，抑制上游，使濃度維持在適當範圍。</p></div><div class=\"ex\"><h4>深入解說：負回饋像室溫控制</h4><p>甲狀腺軸：下視丘 TRH → 前葉 TSH → 甲狀腺素。當甲狀腺素過高，會抑制下視丘與前葉 → TRH、TSH 下降 → 甲狀腺素減少；過低則抑制解除，分泌增加。濃度因此在目標範圍內小幅擺盪，而不是固定不變。</p></div><div class=\"ex\"><h4>常見推論題</h4><ul><li>甲狀腺素過低（甲狀腺本身問題）→ TSH、TRH 升高。</li><li>甲狀腺素過高 → TSH 下降。</li><li>前葉問題導致 TSH 過低 → 甲狀腺素也低，但 TRH 可能升高。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>其他條件相同，末端激素下降時，上游刺激如何變化？</p><p><b>答：</b>負回饋抑制解除，上游（TRH、TSH）增加，促使末端激素回升。</p></div>", "tb": [["BOOK10", "P129 完整課本頁"]]}, {"id": "b3-c44-l26", "t": "正回饋：促進偏離，也需要終點", "sec": "s4", "slide": 41, "sourceSlides": [41], "sourcePages": [], "src": "原PPT第 41 頁；課本 P128–131", "figSpec": {"image": "PPT41S3"}, "txt": "<ul><li>分娩中宮頸伸展、催產素與收縮可互相增強。</li><li>此迴路推進事件，不是把子宮收縮拉回基準。</li><li>嬰兒產出、刺激消失是停止條件；正回饋不是永遠增強，也不是「有益」的同義字。</li></ul><p class=\"think\">找出迴路加強的變量，再說明它如何結束。</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/17-2-hormones\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>正回饋</h4><p>某些激素產生後，回饋到腺體促使激素<b>再分泌</b>，使激素在短時間內激增。</p></div><div class=\"ex\"><h4>例子</h4><ul><li><b>分娩</b>：子宮壁肌肉收縮 → 刺激催產素分泌 → 收縮更強 → 直到嬰兒產出。</li><li><b>哺乳（排乳反射）</b>：嬰兒吸吮 → 乳腺分泌更多乳汁。</li></ul></div><div class=\"ex g\"><h4>需要終點</h4><p>正回饋會讓偏離越來越大，所以需要一個「終點」來結束：嬰兒產出、或嬰兒不再吸吮。</p></div><div class=\"ex\"><h4>深入解說：正回饋的結構</h4><p>分娩：胎頭壓迫子宮頸 → 神經訊息到下視丘 → 催產素分泌 → 子宮收縮更強 → 壓迫更強 → 更多催產素……迴路持續加強，直到胎兒產出，刺激消失，才結束。正回饋推動事件走向完成，不是維持穩定，所以需要「終點」。</p></div><div class=\"ex\"><h4>正負回饋比較</h4><ul><li>負回饋：偏離 → 修正，維持穩定。</li><li>正回饋：偏離 → 加強，推動事件完成。</li><li>另一例：排卵前動情素升高 → LH 大量釋放（延伸）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>如何判斷一個迴路是正或負回饋？</p><p><b>答：</b>看結果對起始變化的影響：若加強起始變化即為正回饋；若減弱即為負回饋。不能只看箭頭往上或往下。</p></div>", "tb": []}, {"id": "b3-c44-l27", "t": "乳汁合成與排出：兩種激素接力", "sec": "s4", "slide": 42, "sourceSlides": [42, 43], "sourcePages": [11], "src": "原PPT第 42–43 頁；課本 P128–131", "figSpec": {"image": "lactation"}, "txt": "<ul><li>PRL由前葉合成，促乳汁製造；催產素在下視丘合成、由後葉釋放。</li><li>催產素促乳腺肌上皮細胞收縮，使已有乳汁排出。</li><li>吸吮傳入神經訊息，引發內分泌反應；合成量和當下排出量須分開。</li></ul><p class=\"think\">若有乳汁製造卻不易排出，應先區分哪一段機制？</p><div class=\"ex\"><h4>排乳反射（知識補給站）</h4><p>神經與內分泌系統交互作用的代表。</p></div><div class=\"ex\"><h4>步驟</h4><ul><li>嬰兒吸吮刺激乳頭。</li><li>感覺神經傳入下視丘。</li><li>下視丘分泌激素：促進腦垂腺<b>前葉</b>分泌<b>催乳激素</b> → 促進乳腺<b>製造</b>乳汁；促進腦垂腺<b>後葉</b>釋放<b>催產素</b> → 刺激肌上皮細胞收縮，<b>排出</b>乳汁。</li></ul></div><div class=\"ex\"><h4>兩種激素的分工</h4><p>催乳激素管「合成」，催產素管「排出」。嬰兒不再吸吮，乳汁就漸漸停止排出。</p></div><div class=\"ex\"><h4>深入解說：吸吮的神經內分泌反射</h4><p>嬰兒吸吮 → 乳頭的機械受器 → 感覺神經傳到脊髓、下視丘 → ① 影響前葉，促進 <b>PRL</b> 分泌，促進乳汁<b>製造</b>；② 刺激後葉釋放<b>催產素</b>，使乳腺肌上皮細胞收縮，乳汁被<b>排出</b>。因此乳量取決於吸吮頻繁程度，也有「正回饋」的特色：吸吮越多 → 乳汁越多。</p></div><div class=\"ex\"><h4>分工</h4><ul><li>PRL（前葉）→ 合成。</li><li>催產素（後葉釋放）→ 排出。</li><li>乳汁多但排不出 → 可能是催產素反射受影響。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>為什麼嬰兒不再吸吮，乳汁就逐漸減少？</p><p><b>答：</b>缺少神經刺激，PRL 與催產素的分泌都減少，製造與排出一起下降。</p></div>", "tb": [["BOOK11", "P130 完整課本頁"]]}, {"id": "b3-c44-l28", "t": "血糖曲線：拮抗與負回饋可同時存在", "sec": "s4", "slide": 44, "sourceSlides": [44, 45], "sourcePages": [12], "src": "原PPT第 44–45 頁；課本 P128–131", "figSpec": {"image": "glucose"}, "txt": "<ul><li>進食後血糖升高，胰島素增加，葡萄糖利用及儲存增強。</li><li>空腹下降時升糖素增加，肝臟輸出葡萄糖；兩激素對血糖方向相反。</li><li>各自拉回血糖的迴路是負回饋；比較兩激素效應則是拮抗。</li></ul><p class=\"think\">同一套系統被稱負回饋與拮抗，是矛盾還是觀察層次不同？</p><div class=\"scope-note\">教材約90 mg/dL是示意基準，不作個人診斷界線；曲線非每人的固定餐後數據。</div><div class=\"ex\"><h4>拮抗作用：血糖</h4><p>用相反作用的激素維持恆定，如升糖素與胰島素（圖 4－31）。</p></div><div class=\"ex\"><h4>血糖曲線</h4><ul><li>進食後血糖上升 → β 細胞分泌胰島素增加 → 組織吸收血糖，肝臟與肌肉把葡萄糖轉成肝糖儲存 → 血糖降回正常值（約 <b>90 mg/dL</b>）。</li><li>一段時間後養分消耗、血糖下降 → α 細胞分泌升糖素 → 肝糖轉成葡萄糖釋入血液 → 血糖回升到正常值。</li></ul></div><div class=\"ex\"><h4>兩種描述同時成立</h4><p>胰島素和血糖的關係是負回饋；胰島素和升糖素之間的關係是拮抗。同一個調控裡可以同時有兩種機制。</p></div><div class=\"ex\"><h4>深入解說：同一個調控，兩個層次</h4><p><b>負回饋</b>：血糖 ↔ 胰島素（血糖上升 → 胰島素增加 → 血糖下降 → 胰島素減少）。<b>拮抗</b>：胰島素與升糖素效果相反，分別在血糖過高與過低時作用。兩者不衝突，是觀察層次不同：前者看單一激素與變量的關係，後者看兩種激素之間的關係。</p></div><div class=\"ex\"><h4>讀曲線</h4><ul><li>進食後：血糖 ↑ → 胰島素 ↑ → 血糖回降。</li><li>空腹：血糖 ↓ → 升糖素 ↑ → 血糖回升。</li><li>約 90 mg/dL 為示意基準，不作個人診斷。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>為什麼血糖不會「無限降低」？</p><p><b>答：</b>因為血糖降低時，胰島素分泌減少、升糖素增加，把血糖拉回；兩者形成雙向的負回饋保護。</p></div>", "tb": [["BOOK12", "P131 完整課本頁"]]}, {"id": "b3-c44-l29", "t": "血糖失調：分泌與敏感性要分開", "sec": "s4", "slide": 46, "sourceSlides": [46], "sourcePages": [], "src": "原PPT第 46 頁；課本 P128–131", "figSpec": {"image": "PPT46S3"}, "txt": "<ul><li>胰島素不足與組織對胰島素反應降低，都可能使血糖調節受影響。</li><li>血糖過高時尿糖可增加，但尿糖不能單獨代表激素來源或完整診斷。</li><li>低血糖與高血糖的機制不同，不能都解釋為升糖素太多。</li></ul><p class=\"think\">同樣的血糖結果，為何可能需要不同的機制假說？</p><div class=\"ex\"><h4>血糖失調</h4><p>恆定控制異常時：</p></div><div class=\"ex\"><h4>血糖過高</h4><ul><li>原因一：<b>胰島素分泌不足</b>。</li><li>原因二：胰島素受體<b>敏感性下降</b>，胰島素無法有效作用。</li><li>血糖超過腎臟再吸收上限 → 葡萄糖由尿液排出；長期未控制可能導致糖尿病。</li></ul></div><div class=\"ex\"><h4>血糖過低</h4><ul><li>飢餓、暈眩、心跳加速；嚴重時昏迷或死亡。</li></ul></div><div class=\"ex\"><h4>要分清</h4><p>「分泌不足」是激素量的問題；「敏感性下降」是目標細胞反應的問題，血中胰島素可能並不少。</p></div><div class=\"ex\"><h4>深入解說：兩種機制，同樣高血糖</h4><p>① <b>胰島素分泌不足</b>（如 β 細胞被破壞）：血中胰島素低。② <b>胰島素阻抗</b>（受體敏感性下降）：血中胰島素可能正常甚至偏高，但細胞反應差。當血糖超過腎小管再吸收上限，葡萄糖出現在尿中，並因滲透作用帶走水分，造成多尿、口渴。低血糖則使腦細胞缺乏能量，出現飢餓、發抖、心跳快，嚴重昏迷。</p></div><div class=\"ex\"><h4>分辨</h4><ul><li>分泌不足 → 補充胰島素或促進分泌。</li><li>敏感性下降 → 改善生活型態、增加敏感性。</li><li>尿糖只是線索，不是完整診斷。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>為何血中胰島素偏高仍可能血糖高？</p><p><b>答：</b>標的細胞對胰島素反應下降（胰島素阻抗），需要更多胰島素才能達到相同效果，血糖仍然偏高。</p></div>", "tb": []}, {"id": "b3-c44-l30", "t": "協同與同一物質的不同傳訊身分", "sec": "s5", "slide": 47, "sourceSlides": [47, 48], "sourcePages": [13], "src": "原PPT第 47–48 頁；課本 P132–134", "figSpec": {"image": "adrenalBox"}, "txt": "<ul><li>不同激素可對同一生理現象共同作用，增強整體效應。</li><li>壓力反應中髓質與皮質激素皆可參與能量動員。</li><li>兒茶酚胺在神經局部傳訊可作傳遞物，由髓質入血可作激素；身分與釋放情境有關。</li></ul><p class=\"think\">只看分子名稱，能決定它是激素還是神經傳遞物嗎？</p><div class=\"ex\"><h4>協同作用</h4><p>不同激素各自對同一種生理現象產生影響，使整體效應<b>增強</b>。例如面對壓力時，腎上腺髓質與皮質的激素共同協助因應（「狗急跳牆」）。</p></div><div class=\"ex\"><h4>兒茶酚胺（知識補給站）</h4><p>腎上腺髓質分泌的多巴胺、去甲基腎上腺素、腎上腺素，統稱兒茶酚胺。</p></div><div class=\"ex\"><h4>同一類物質，不同身分</h4><ul><li>神經組織產生的兒茶酚胺：在局部組織傳遞訊息，是<b>神經傳遞物</b>。</li><li>腎上腺髓質產生的：經血液循環到全身，是<b>激素</b>。</li></ul></div><div class=\"ex\"><h4>另外</h4><p>腎上腺皮質分泌糖皮質素、礦物皮質素及少量雄性激素。</p></div><div class=\"ex\"><h4>深入解說：身分由情境決定</h4><p>兒茶酚胺（多巴胺、去甲基腎上腺素、腎上腺素）：在神經末梢釋出到突觸間隙作用於鄰近細胞 → 神經傳遞物；腎上腺髓質釋出入血作用於全身 → 激素。所以不能只看分子名稱判斷，要看<b>釋放位置與傳送方式</b>。協同則如壓力時髓質（快速動員）與皮質（持續供應能量）共同作用。</p></div><div class=\"ex\"><h4>三種訊息分子的傳送</h4><ul><li>神經傳遞物：突觸間隙，短距離。</li><li>激素：血液，長距離。</li><li>局部因子（延伸）：旁分泌，作用於鄰近細胞。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>去甲基腎上腺素在哪兩種情境分別是什麼身分？</p><p><b>答：</b>交感神經末梢釋出時為神經傳遞物；腎上腺髓質入血時為激素。</p></div>", "tb": [["BOOK13", "P132 完整課本頁"]]}, {"id": "b3-c44-l31", "t": "壓力反應：髓質與皮質的不同路徑", "sec": "s5", "slide": 49, "sourceSlides": [49, 50], "sourcePages": [14], "src": "原PPT第 49–50 頁；課本 P132–134", "figSpec": {"image": "stress"}, "txt": "<ul><li>快速途徑經交感神經刺激髓質，釋放腎上腺素等。</li><li>HPA軸由下視丘CRH→前葉ACTH→皮質糖皮質素。</li><li>教材用短期／長期對照；HPA也可在急性壓力啟動，不以事件持續時間作唯一開關。</li></ul><p class=\"think\">哪條途徑需要前葉重新合成激素，再經血液到腎上腺？</p><div class=\"scope-note\">快速交感反應與HPA時間模式是典型比較；HPA亦可在急性壓力啟動。<a href=\"https://pubmed.ncbi.nlm.nih.gov/31249398/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>壓力反應的兩條路徑（圖 4－32）</h4><p>緊迫因子（驚嚇、疼痛、壓力）衝擊下視丘，下視丘活化兩條路徑。</p></div><div class=\"ex\"><h4>短期即時性</h4><ul><li>下視丘活化<b>交感神經</b> → 腎上腺髓質分泌腎上腺素與去甲基腎上腺素。</li><li>提升血糖、加快心跳與呼吸、增加肌肉收縮力量（心肌與骨骼肌的小動脈舒張，血流增加；瞳孔放大、支氣管擴張）。</li></ul></div><div class=\"ex\"><h4>長期持續性</h4><ul><li>下視丘分泌 <b>CRH</b> → 腦垂腺前葉增加 <b>ACTH</b> → 刺激腎上腺皮質分泌<b>糖皮質素</b>。</li><li>提升血糖、抑制發炎；但降低血液淋巴球數目，使免疫力降低。</li></ul></div><div class=\"ex\"><h4>深入解說：兩條壓力路徑</h4><p>① <b>快速</b>：下視丘 → 交感神經 → 腎上腺髓質 → 腎上腺素／去甲基腎上腺素 → 心跳快、血糖升、血流重新分配。② <b>較持久</b>：下視丘 CRH → 前葉 ACTH → 腎上腺皮質 → 糖皮質素 → 升血糖、抑制發炎與免疫（<b>HPA 軸</b>）。HPA 在急性壓力也會啟動，只是效應較慢、持續較久。</p></div><div class=\"ex\"><h4>比較</h4><ul><li>髓質路徑：神經直接控制，秒級。</li><li>皮質路徑：多級激素軸，分鐘到小時。</li><li>共同點：升高血糖，使能量可用。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>哪一條路徑需要前葉重新合成激素？</p><p><b>答：</b>皮質路徑（HPA 軸）：前葉要合成並釋放 ACTH，再經血液到腎上腺皮質。</p></div>", "tb": [["BOOK14", "P133 完整課本頁"]]}, {"id": "b3-c44-l32", "t": "持續壓力：從適應到代價", "sec": "s5", "slide": 51, "sourceSlides": [51], "sourcePages": [], "src": "原PPT第 51 頁；課本 P132–134", "figSpec": {"image": "stress"}, "txt": "<ul><li>壓力反應可動員能量，短期有助因應環境。</li><li>長期或過度啟動可能影響心血管、代謝與免疫。</li><li>不能據一次緊張就推估某人必定發生疾病，需區分情境、時間與資料。</li></ul><p class=\"think\">要研究持續壓力，為何一次量測不足？</p><div class=\"ex\"><h4>壓力持續太久的代價</h4><p>髓質與皮質的分泌有協同作用，使人面對壓力時產生適當反應。</p></div><div class=\"ex\"><h4>但若壓力持續太久、或超出身體所能忍受</h4><ul><li>對心臟與血管造成負擔，提高心血管疾病發生率。</li><li>危害免疫系統，增加感染病原體的機會。</li></ul></div><div class=\"ex\"><h4>小結</h4><p>短期反應是適應；長期過度反應則變成代價。</p></div><div class=\"ex\"><h4>深入解說：適應與代價</h4><p>短期壓力使心跳血壓上升、血糖上升，有助應付挑戰。但長期過度啟動：心血管負荷升高（高血壓、心血管疾病風險）、免疫功能被糖皮質素抑制（易感染）、代謝與睡眠也受影響。所以研究持續壓力，要長期追蹤、多次測量，不能只靠一次。</p></div><div class=\"ex\"><h4>研究設計思路</h4><ul><li>重複測量（如皮質醇的日夜節律）。</li><li>控制變因：睡眠、飲食、藥物。</li><li>比較壓力組與對照組。</li><li>避免從一次緊張推論個人必然生病。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>為何一次量測不足以評估壓力？</p><p><b>答：</b>激素濃度有日夜節律與情境波動，單一時間點可能反映短暫狀態，需要多次、長期的資料。</p></div>", "tb": []}, {"id": "b3-c44-l33", "t": "皮質失調：不足與過量不對稱", "sec": "s5", "slide": 52, "sourceSlides": [52, 53], "sourcePages": [15], "src": "原PPT第 52–53 頁；課本 P132–134", "figSpec": {"image": "diseaseBox"}, "txt": "<ul><li>艾迪森氏病屬原發性腎上腺功能不足，皮質醇不足，亦可能伴醛固酮不足。</li><li>庫欣氏症候群核心為長期糖皮質素過量暴露，可有內源性或外源性來源。</li><li>不把所有腎上腺皮質激素過多都等同庫欣，也不依教材照片或單一症狀判斷個人。</li></ul><p class=\"think\">若末端激素太低，上游刺激是否必定也低？需先假設問題在哪一層。</p><div class=\"scope-note\">課本總結把糖皮質素及礦物皮質素一併概括；新版另限疾病範圍，完整原文未刪。<a href=\"https://www.niddk.nih.gov/health-information/endocrine-diseases/adrenal-insufficiency-addisons-disease/definition-facts\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a> <a href=\"https://www.niddk.nih.gov/health-information/endocrine-diseases/cushings-syndrome\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>腎上腺皮質激素失調（知識補給站）</h4><p>過多與過少都會引起疾病，不是對稱的。</p></div><div class=\"ex\"><h4>艾迪森氏病（分泌不足）</h4><ul><li>糖皮質素與礦物皮質素分泌不足。</li><li>症狀：皮膚黑色素沉澱、疲勞、肌肉無力、食慾喪失、體重減輕、精神躁動或憂鬱；鹽分流失，所以特別喜好高鹽食品；未治療可能因低血糖昏迷致死。</li></ul></div><div class=\"ex\"><h4>庫欣氏症候群（長期過多）</h4><ul><li>長期持續接觸或分泌過多腎上腺皮質素。</li><li>症狀：月亮臉、水牛肩、肌肉無力、骨質疏鬆、粉刺、高血壓、傷口難癒合、女性月經失調。</li></ul></div><div class=\"ex\"><h4>深入解說：不足與過量</h4><p><b>艾迪森氏病</b>：腎上腺皮質功能不足 → 皮質醇低（疲倦、低血糖、食慾差）、醛固酮低（失鈉、低血壓、嗜鹽）；ACTH 因負回饋解除而上升，同時刺激黑色素細胞，造成皮膚色素沉澱。<b>庫欣氏症候群</b>：長期糖皮質素過量（腫瘤，或長期使用外源性類固醇藥物）→ 月亮臉、水牛肩、高血壓、骨質疏鬆、傷口難癒合。</p></div><div class=\"ex\"><h4>推論</h4><ul><li>原發性（腎上腺本身）不足 → ACTH 高。</li><li>腦垂腺問題 → ACTH 低 → 皮質萎縮。</li><li>藥物引起的庫欣症候群：不可自行突然停藥。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>末端激素太低，上游刺激必定也低嗎？</p><p><b>答：</b>不一定。若問題在腎上腺本身，負回饋解除，ACTH 會升高；若問題在前葉，ACTH 才會低。要先判斷病變層級。</p></div>", "tb": [["BOOK15", "P134 完整課本頁"]]}, {"id": "b3-c44-l34", "t": "原題一：合成來源與生理效應", "sec": "s6", "slide": 54, "sourceSlides": [54], "sourcePages": [], "src": "原PPT第 54 頁；課本 P120–134／原題", "figSpec": {"image": "PPT54S3"}, "txt": "<ul><li>保留原題全部選項及答案B、D、E。</li><li>C錯在「後葉所合成」，不是錯在ADH促水再吸收。</li><li>D的腎上腺皮質素是廣稱，包含調節鈉、鉀的礦物皮質素。</li></ul><p class=\"think\">把D的廣稱直接替換成糖皮質素，為何會改變題義？</p><div class=\"ex\"><h4>原題一（106 指考修訂，多選）</h4><p>有關內分泌系統調控生理現象，下列敘述哪些正確？</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 內分泌系統不受神經系統的調控</li><li>(B) 黃體素會影響子宮內膜厚度</li><li>(C) 腦垂腺後葉所合成的抗利尿素，可促進水分再吸收</li><li>(D) 腎上腺皮質素可調節體內鈉、鉀離子恆定</li><li>(E) 胰島素促使葡萄糖進入細胞，也會促使細胞內葡萄糖的代謝</li></ul></div><div class=\"ex\"><h4>答案：(B)(D)(E)</h4><p></p></div><div class=\"ex\"><h4>其他選項</h4><ul><li>(A) 內分泌系統與神經系統可以互相協同調節。</li><li>(C) 腦垂腺後葉是神經組織，負責儲存下視丘分泌的抗利尿素與催產素，本身不分泌激素。（錯在「後葉所合成」，不是錯在 ADH 促進水分再吸收。）</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>(D) 的「腎上腺皮質素」是廣稱，包含調節鈉、鉀的礦物皮質素，不是只指糖皮質素。</p></div><div class=\"ex\"><h4>深入解說：逐項看</h4><p>(A) 內分泌受神經調控（下視丘、交感神經），錯。(B) 黃體素促子宮內膜增厚，正確。(C) 錯在「後葉所合成」；ADH 在下視丘合成。(D) 腎上腺皮質素（廣義）包含調節 Na⁺、K⁺ 的礦物皮質素，正確。(E) 胰島素促進葡萄糖進入細胞並促進代謝與儲存，正確。答案 B、D、E。</p></div><div class=\"ex\"><h4>易錯點</h4><ul><li>廣稱與狹稱：腎上腺皮質素＝糖皮質素＋礦物皮質素（＋少量性激素）。</li><li>合成地點、儲存地點、釋放地點要分清。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>把 D 換成「糖皮質素可調節鈉鉀恆定」，為何不再正確？</p><p><b>答：</b>調節鈉、鉀恆定的主要是礦物皮質素（醛固酮），不是糖皮質素。</p></div>", "tb": []}, {"id": "b3-c44-l35", "t": "原題二：cAMP不是第一傳訊者", "sec": "s6", "slide": 55, "sourceSlides": [55, 56], "sourcePages": [], "src": "原PPT第 55–56 頁；課本 P120–134／原題", "figSpec": {"image": "membrane"}, "txt": "<ul><li>原答案B：圖中傳訊具有放大效果。</li><li>cAMP是第二傳訊者，激素是第一傳訊者。</li><li>升糖素屬圖示模式；腎上腺皮質類固醇典型受體在細胞內。</li></ul><p class=\"think\">若只記「少量引發大反應」，還缺哪個圖中證據？</p><div class=\"ex\"><h4>原題二</h4><p>右圖是人體某種激素作用的示意圖（細胞膜受體、cAMP）。關於這類激素，下列何者正確？</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 圖中的 cAMP 是第一傳訊者，將激素的訊號透過活化酵素影響生理</li><li>(B) 此類激素的訊號在細胞內具有放大的效果</li><li>(C) 升糖素、腎上腺皮質素屬此類激素</li><li>(D) 此類激素多為非極性分子</li></ul></div><div class=\"ex\"><h4>答案：(B)</h4><p></p></div><div class=\"ex\"><h4>其他選項</h4><ul><li>(A) cAMP 是<b>第二</b>傳訊者；激素本身才是第一傳訊者。</li><li>(C) 腎上腺皮質素可進入細胞，受體在細胞內，不屬此類。</li><li>(D) 此類激素多為極性（水溶性）分子。</li></ul></div><div class=\"ex\"><h4>深入解說：圖形判讀</h4><p>圖：激素（第一傳訊者）→ 膜受體 → 產生 cAMP（第二傳訊者）→ 酵素級聯 → 反應。(A) 錯：cAMP 是第二傳訊者。(B) 對：逐級放大。(C) 升糖素屬此類，但腎上腺皮質素為類固醇，受體在細胞內。(D) 此類多為水溶性、極性分子。答案 B。</p></div><div class=\"ex\"><h4>快速判斷法</h4><ul><li>看見「膜受體＋cAMP」→ 水溶性激素。</li><li>看見「進入細胞核、影響轉錄」→ 脂溶性激素。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>只記「少量激素引發大反應」還缺什麼證據？</p><p><b>答：</b>缺少圖中顯示「一個激素分子 → 多個 cAMP → 多個酵素活化」的逐級放大步驟。</p></div>", "tb": []}, {"id": "b3-c44-l36", "t": "原題三：HPA軸的抑制箭頭", "sec": "s6", "slide": 57, "sourceSlides": [57], "sourcePages": [], "src": "原PPT第 57 頁；課本 P120–134／原題", "figSpec": {"image": "PPT57S3"}, "txt": "<ul><li>原答案D，糖皮質素軸為負回饋。</li><li>甲是下視丘，乙是腦垂腺前葉；與視丘、後葉不同。</li><li>性腺軸可見負回饋，但生殖過程也有特定正回饋階段，不把D讀成永遠只有負回饋。</li></ul><p class=\"think\">只看箭頭往上，能否判斷正或負回饋？</p><div class=\"scope-note\">原題D指出性腺可有負回饋；排卵前動情素正回饋為補充，亦供練習第2關對照。<a href=\"https://openstax.org/books/biology-2e/pages/43-4-hormonal-control-of-human-reproduction\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>原題三</h4><p>右圖是糖皮質素在體內的調控機制，下列敘述何者正確？</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 此回饋控制為正回饋</li><li>(B) 甲為視丘</li><li>(C) 乙為腦垂腺後葉</li><li>(D) 此現象在性腺分泌的激素亦可觀察到</li></ul></div><div class=\"ex\"><h4>答案：(D)</h4><p></p></div><div class=\"ex\"><h4>其他選項</h4><ul><li>(A) 此回饋是<b>負回饋</b>。</li><li>(B) 甲是<b>下視丘</b>。</li><li>(C) 乙是腦垂腺<b>前葉</b>。</li></ul></div><div class=\"ex\"><h4>補充</h4><p>性腺軸也可看到負回饋；但生殖過程中也有特定階段的正回饋（例如排卵前的動情素），不能把 (D) 解讀成「永遠只有負回饋」。</p></div><div class=\"ex\"><h4>深入解說：判斷回饋類型</h4><p>圖：甲（下視丘）→ 乙（前葉）→ 腎上腺皮質 → 糖皮質素，糖皮質素再抑制甲、乙，是<b>負回饋</b>（抑制箭頭回到上游）。(B) 甲不是視丘；(C) 乙不是後葉。(D) 性腺軸（下視丘 → 前葉 → 性腺）也有類似的負回饋，答案 D。但排卵前動情素有正回饋，所以不能說性腺軸永遠只有負回饋。</p></div><div class=\"ex\"><h4>檢查清單</h4><ul><li>先認出每個字母代表的構造。</li><li>看箭頭是促進（＋）還是抑制（−）。</li><li>整條迴路的淨效果決定正或負。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>只看箭頭往上，能否判斷正或負回饋？</p><p><b>答：</b>不能。要看迴路是否「加強」起始變化（正）或「抵消」（負），還要辨認抑制或促進。</p></div>", "tb": []}], "questions": [{"t": "化學本質：三類各有特徵", "q": "每類放兩張卡，同類兩格可交換。", "learn": 22, "tag": "signal", "hint": "胺類不能全部分成同一個受體位置。", "why": "化學類別不等同受體機制；胰島素與GH不能全部套用G蛋白－cAMP。", "sub": "原PPT第 36 頁；課本 P126–127", "refs": [{"src": "PPT36S3", "cap": "教材來源圖"}], "legacyQuestion": 1, "kind": "drag", "slots": [{"id": "g0s0", "label": "胜肽／蛋白", "group": 0}, {"id": "g0s1", "label": "胜肽／蛋白", "group": 0}, {"id": "g1s0", "label": "類固醇", "group": 1}, {"id": "g1s1", "label": "類固醇", "group": 1}, {"id": "g2s0", "label": "胺類衍生物", "group": 2}, {"id": "g2s1", "label": "胺類衍生物", "group": 2}], "pieces": [{"id": "ag0s0", "label": "胰島素、升糖素、GH", "group": 0}, {"id": "ag0s1", "label": "典型受體位於細胞膜", "group": 0}, {"id": "ag1s0", "label": "由膽固醇衍生", "group": 1}, {"id": "ag1s1", "label": "典型受體在細胞內", "group": 1}, {"id": "ag2s0", "label": "甲狀腺激素：核內受體", "group": 2}, {"id": "ag2s1", "label": "腎上腺素：膜上受體", "group": 2}], "sol": {"g0s0": "ag0s0", "g0s1": "ag0s1", "g1s0": "ag1s0", "g1s1": "ag1s1", "g2s0": "ag2s0", "g2s1": "ag2s1"}, "p  if(PAGE==='play'&&innerWidth>900){const panel=el('question-panel'),top=panel.getBoundingClientRect().top,fb=el('question-feedback').getBoundingClientRect().height,available=innerHeight-h-top-fb-42;
 const grid=panel.querySelector('.sequence-grid');if(grid){grid.classList.remove('compact-drag');grid.style.removeProperty('--slot-min-height');if(grid.getBoundingClientRect().height>available){grid.classList.add('compact-drag');const rows=Math.ceil(STAGES[QI].slots.length/2),label=Math.max(...[...grid.querySelectorAll('.match-slot label')].map(e=>e.getBoundingClientRect().height+4));const slot=Math.max(44,Math.floor((available-label*rows-8*(rows-1))/rows)-2);grid.style.setProperty('--slot-min-height',slot+'px');const excess=Math.max(0,document.documentElement.scrollHeight-innerHeight);if(excess)grid.style.setProperty('--slot-min-height',Math.max(44,slot-Math.ceil(excess/rows)-2)+'px');}}
 const layout=panel.querySelector('.fill-layout'),rail=panel.querySelector('.reference-rail'),img=rail?.querySelector('img');if(img){const ratio=img.naturalWidth/img.naturalHeight||1;for(let pass=0;pass<3;pass++){const caption=rail.querySelector('p').getBoundingClientRect().height+8,width=Math.min(Math.min(STAGES[QI].imageWidth||440,panel.clientWidth-380),Math.max(80,(available-caption)*ratio));if(Math.abs(rail.getBoundingClientRect().width-width)<.1)break;layout.style.setProperty('--reference-width',width+'px');}}

 const graph=panel.querySelector('.graph-question');if(graph){graph.style.setProperty('--graph-height',Math.max(80,Math.min(245,available-46))+'px');graph.style.setProperty('--stimulus-height',Math.max(55,Math.min(110,available-132))+'px');}
 const choice=panel.querySelector('.choice-layout img');if(choice){choice.style.maxHeight=Math.max(140,available-30)+'px';}
 } });}

el('continue-learn').onclick=()=>navigate('learn',LI);el('back-question').onclick=()=>navigate('play',QI);el('learn-fullscreen').onclick=enterLearnFullscreen;el('fs-exit').onclick=exitLearnFullscreen;

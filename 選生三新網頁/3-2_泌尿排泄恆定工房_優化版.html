const CONTENT={"lessons": [{"id": "b3-c32-l01", "t": "排泄與排遺：先辨物質從哪裡來", "sec": "s1", "slide": 1, "sourceSlides": [1, 2], "sourcePages": [1], "src": "原PPT第 1–2 頁；課本 P76–77", "figSpec": {"image": "waste"}, "txt": "<ul><li>排泄排除細胞代謝產物，如CO₂及含氮廢物；排遺排出消化道未消化吸收的物質。</li><li>蛋白質、核酸分解後的含氮部分，需轉成適合動物與環境的排出形式。</li><li>同一出口或混在同一團排出，不代表廢物來源與生理過程相同。</li></ul><p class=\"think\">鳥類白色尿酸混在糞便裡，為什麼仍屬排泄？</p><div class=\"ex\"><h4>什麼是排泄</h4><p>細胞代謝會產生各種代謝廢物，例如二氧化碳、水、含氮廢物。這些廢物排出體外的過程稱為<b>排泄</b>。</p></div><div class=\"ex\"><h4>廢物從哪裡來</h4><ul><li>醣類、脂質 → 二氧化碳、水。</li><li>蛋白質、核酸 → 二氧化碳、水、<b>含氮廢物</b>等。</li></ul></div><div class=\"ex\"><h4>先分來源</h4><p>排泄排出的是<b>代謝產生</b>的廢物；未消化的食物殘渣（排遺）不是細胞代謝的產物，兩者要區分。</p></div><div class=\"ex\"><h4>深入解說：三種「排出」要分清楚</h4><p>身體排出東西有三種不同概念：<b>排遺</b>（糞便：未被消化吸收的食物殘渣，沒進入過細胞）、<b>排泄</b>（細胞代謝產生的廢物，如 CO₂、水、含氮廢物，經肺、腎、皮膚排出）、<b>分泌</b>（細胞產生有用的物質送出，如消化液、激素）。判斷關鍵是「<b>這個物質是不是細胞代謝的產物</b>」：是 → 排泄；只是路過消化道 → 排遺。</p></div><div class=\"ex\"><h4>廢物從哪裡來</h4><ul><li>醣類、脂質：只含 C、H、O → 代謝產物是 CO₂ 與 H₂O，不含氮。</li><li>蛋白質（含 N）、核酸（含 N）→ 除了 CO₂、H₂O，還有<b>含氮廢物</b>（氨、尿素、尿酸等）。</li><li>因此含氮廢物的量與蛋白質攝取量有關。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>鳥類白色尿酸混在糞便裡，為什麼仍屬排泄？</p><p><b>答：</b>尿酸是蛋白質、核酸<b>代謝</b>產生的含氮廢物，由腎臟排到泄殖腔；糞便（排遺）是未消化的殘渣。兩者只是從同一個開口排出，來源和生理過程不同。</p></div>", "tb": [["BOOK1", "P76 完整課本頁"]]}, {"id": "b3-c32-l02", "t": "氨、尿素、尿酸：水與能量的取捨", "sec": "s1", "slide": 3, "sourceSlides": [3, 4, 5, 6], "sourcePages": [], "src": "原PPT第 3–6 頁；課本 P76–77", "figSpec": {"image": "waste"}, "txt": "<ul><li>氨毒性高、容易溶於水，許多水生動物可快速排到周圍大量水中。</li><li>哺乳類主要在肝臟將氨轉為尿素，再由腎臟排出；降低毒性需要耗能。</li><li>尿酸溶解度低，少水排出有利陸地與卵內環境；製造的能量成本較高。</li></ul><p class=\"think\">把「需要水量」與「製造能量」兩條尺度同時排出順序。</p><div class=\"scope-note\">不把毒性比值當跨物種固定常數；NH₃與NH₄⁺形式及跨膜途徑會隨環境改變。尿酸的排泄與糞便排遺分開理解。</div><div class=\"ex\"><h4>三種含氮廢物</h4><p>動物細胞分解蛋白質與核酸時產生含氮廢物，主要有<b>氨、尿素、尿酸</b>三種型式（圖 3－4）。</p></div><div class=\"ex\"><h4>氨（NH₃）</h4><ul><li>結構最簡單，毒性極高，易溶於水。</li><li>水生生物（硬骨魚、海洋無脊椎動物）以擴散作用把氨釋放到周圍的水中。</li></ul></div><div class=\"ex\"><h4>尿素</h4><ul><li>由氨轉變而來，過程需消耗能量；毒性較氨低，排除所需水分較少。</li><li>大多數哺乳類與兩生類成體：由肝臟把氨轉為尿素，隨尿液排出。</li></ul></div><div class=\"ex\"><h4>尿酸</h4><ul><li>轉變過程消耗的能量最多；毒性最低，幾乎不溶於水，可呈固態結晶排出，耗水最少。</li><li>鳥類、昆蟲、多數爬蟲類：隨糞便排出。</li></ul></div><div class=\"ex g\"><h4>規律</h4><p>從氨 → 尿素 → 尿酸：<b>製造所需能量越來越多，毒性與耗水量越來越少</b>。</p></div><div class=\"ex\"><h4>深入解說：為什麼不同動物選不同廢物</h4><p>氨有劇毒，必須用大量水稀釋；轉成尿素需要耗能（尿素循環消耗 ATP），但毒性低，可以濃縮到較高濃度、少量水排出；轉成尿酸耗能最多，卻幾乎不溶於水，能以白色糊狀固體排出，幾乎不需要水。因此：<b>水多的環境用氨、需要省水但可以接受用水的陸生動物用尿素、極需節水或胚胎在密閉卵殼中的動物用尿酸</b>。</p></div><div class=\"ex\"><h4>三種廢物的取捨</h4><ul><li><b>氨</b>：毒性最大／耗能最少／耗水最多。</li><li><b>尿素</b>：毒性中／耗能中／耗水中。</li><li><b>尿酸</b>：毒性最低／耗能最多／耗水最少。</li><li>鳥類、爬蟲類的卵在殼內發育，若排出尿素或氨會在卵內毒害胚胎，尿酸則可結晶沉積在卵殼內。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>把「需要水量」與「製造能量」兩條尺度同時排出順序。</p><p><b>答：</b>需要水量：氨 ＞ 尿素 ＞ 尿酸；製造所需能量：尿酸 ＞ 尿素 ＞ 氨。兩者的順序剛好相反。</p></div>", "tb": []}, {"id": "b3-c32-l03", "t": "泌尿系統：製造、輸送、儲存與排出", "sec": "s1", "slide": 7, "sourceSlides": [7, 10], "sourcePages": [2], "src": "原PPT第 7–10 頁；課本 P76–77", "figSpec": {"image": "anatomy"}, "txt": "<ul><li>腎臟調整血液成分並形成尿液；輸尿管連接腎臟與膀胱。</li><li>膀胱暫存尿液，尿道將尿液排到體外；輸尿管與尿道位置不同。</li><li>「製造尿素」在肝臟，不能由腎臟排出尿素推論腎臟製造尿素。</li></ul><p class=\"think\">哪個器官是暫存站，哪一條管路位於暫存站之後？</p><div class=\"ex\"><h4>泌尿系統的組成</h4><p>包括<b>腎臟、輸尿管、膀胱、尿道</b>（圖 3－5）。人體藉由泌尿系統排出多餘水分與代謝廢物等物質。</p></div><div class=\"ex\"><h4>各構造的分工</h4><ul><li><b>腎臟</b>：過濾流經的血液，回收有用物質，剩餘形成尿液。</li><li><b>輸尿管</b>：連結腎臟與膀胱，把尿液送入膀胱。</li><li><b>膀胱</b>：具彈性的囊袋，暫時儲存尿液。</li><li><b>尿道</b>：把尿液由膀胱排出體外。</li></ul></div><div class=\"ex\"><h4>尿液走向</h4><p>腎臟 → 輸尿管 → 膀胱 → 尿道 → 體外。</p></div><div class=\"ex\"><h4>深入解說：泌尿系統的「路徑」與「分工」</h4><p>腎臟負責<b>製造</b>尿液；兩條輸尿管利用平滑肌的蠕動把尿液<b>輸送</b>到膀胱（不是靠重力）；膀胱是<b>儲存</b>器官，壁有平滑肌，可擴張；尿道是<b>排出</b>的通道，膀胱出口與尿道上有括約肌，控制排尿。成人膀胱容量約 400～600 mL，約 200～300 mL 時開始有尿意。</p></div><div class=\"ex\"><h4>括約肌的雙重控制</h4><ul><li><b>內括約肌</b>（平滑肌，不隨意）：自動控制。</li><li><b>外括約肌</b>（骨骼肌，隨意）：可由意識控制，所以成人能憋尿。</li><li>嬰兒尚未建立大腦控制，排尿是反射性的。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>哪個器官是暫存站，哪一條管路位於暫存站之後？</p><p><b>答：</b><b>膀胱</b>是暫存站；它之後的管路是<b>尿道</b>。輸尿管在膀胱之前。</p></div>", "tb": [["BOOK2", "P77 完整課本頁"]]}, {"id": "b3-c32-l04", "t": "腎臟剖面：從皮質到腎盂", "sec": "s1", "slide": 8, "sourceSlides": [8, 9, 11], "sourcePages": [], "src": "原PPT第 8–11 頁；課本 P76–77", "figSpec": {"image": "anatomy"}, "txt": "<ul><li>腎臟位於腹腔後側，外有皮質、內有髓質；血管及輸尿管經腎門出入。</li><li>尿液由集尿管流向腎錐體尖端，經腎盞匯入腎盂，再進輸尿管。</li><li>腎臟也參與水鹽、酸鹼與血壓調節，不能只看成廢物過濾器。</li></ul><p class=\"think\">追蹤尿液時，為什麼不把腎動脈接在輸尿管後面？</p><div class=\"scope-note\">原教材常省略腎盞以簡化路徑；補上腎盞不改變尿液由腎臟向膀胱的方向。</div><div class=\"ex\"><h4>腎臟的位置</h4><p>人體有一對腎臟，位於<b>腹腔後側、脊柱兩側</b>。能從血液中濾出含氮廢物（尿素、尿酸）、多餘的水分與電解質，並生成尿液。</p></div><div class=\"ex\"><h4>剖面構造</h4><ul><li><b>腎門</b>：內側中央凹陷處，神經、腎動脈、腎靜脈、輸尿管進出的位置。</li><li>外層是<b>皮質</b>，內層是<b>髓質</b>；髓質由多個<b>腎錐體</b>構成。</li><li>腎錐體朝向中央的<b>腎盂</b>。</li></ul></div><div class=\"ex\"><h4>尿液的出口</h4><p>尿液由腎錐體尖端進入腎盂，再經輸尿管送入膀胱。腎臟的功能包括排除代謝廢物、調節體液滲透壓與酸鹼值，並間接影響血壓。</p></div><div class=\"ex\"><h4>深入解說：沿著尿液的路徑讀剖面圖</h4><p>腎臟剖面像一顆蠶豆：外圈顏色較深的是<b>皮質</b>（含大部分絲球體和近曲小管、遠曲小管），內側顏色較淺、呈條紋狀的是<b>髓質</b>，髓質被分成多個三角形的<b>腎錐體</b>。尿液在腎元和集尿管中形成後，由腎錐體尖端（腎乳頭）滴入<b>腎盞</b>，再匯集於<b>腎盂</b>，最後流入輸尿管。血管（腎動脈、腎靜脈）與輸尿管都從內側的<b>腎門</b>出入。</p></div><div class=\"ex\"><h4>腎臟的功能不只是排廢物</h4><ul><li>排除含氮廢物、調節水與無機鹽（滲透壓）。</li><li>調節血液酸鹼值（H⁺、HCO₃⁻）。</li><li>分泌腎素，影響血壓；分泌紅血球生成素（EPO）刺激造血（補充）。</li><li>活化維生素 D（補充）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>追蹤尿液時，為什麼不把腎動脈接在輸尿管後面？</p><p><b>答：</b>因為腎動脈是<b>血管</b>，輸送血液進腎；輸尿管是<b>尿液</b>的通道，兩者屬於不同系統，不能串在同一路徑。</p></div>", "tb": []}, {"id": "b3-c32-l05", "t": "腎元與集尿管：相連，但不等同", "sec": "s2", "slide": 12, "sourceSlides": [12, 13], "sourcePages": [3], "src": "原PPT第 12–13 頁；課本 P78–80", "figSpec": {"image": "nephron"}, "txt": "<ul><li>腎元包括腎小體與腎小管；腎小體包括絲球體與鮑氏囊。</li><li>腎小管依序為近曲小管、亨耳氏套、遠曲小管，接入集尿管。</li><li>每個腎臟約有百萬腎元是概略量；多個腎元匯入一條集尿管。</li></ul><p class=\"think\">為什麼相同集尿管可接收不同腎元來的濾液？</p><div class=\"scope-note\">集尿管與腎元共同參與尿液調整，但嚴格構造定義不把集尿管當單一腎元的一部分。原圖(b)比例尺為40 µm。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>腎元</h4><p>腎臟的功能單位稱為<b>腎元</b>（圖 3－6），每顆腎臟約有一百萬個腎元。</p></div><div class=\"ex\"><h4>腎元的組成</h4><ul><li><b>腎小體</b>：由<b>絲球體</b>（微血管球）與<b>鮑氏囊</b>組成。</li><li><b>腎小管</b>：依序為<b>近曲小管、亨耳環管、遠曲小管</b>。</li></ul></div><div class=\"ex\"><h4>集尿管</h4><p>許多遠曲小管匯集到<b>集尿管</b>，再通向腎盂。集尿管與腎元相連，但它不屬於單一腎元。</p></div><div class=\"ex\"><h4>功能</h4><p>腎小管與集尿管不只與尿液形成及濃縮有關，也參與體液滲透壓、無機鹽及酸鹼值的恆定。</p></div><div class=\"ex\"><h4>深入解說：腎元的構造分工</h4><p>腎元由兩部分組成：<b>腎小體</b>（負責過濾血液：絲球體是一團微血管，被鮑氏囊像杯子般包住）與<b>腎小管</b>（負責處理濾液：近曲小管 → 亨耳氏套 → 遠曲小管）。許多腎元的遠曲小管匯入一條<b>集尿管</b>，集尿管再把尿液送向腎乳頭。集尿管也參與水的最終調節，但嚴格說不屬於單一腎元。腎小體位於皮質，亨耳氏套往下深入髓質。</p></div><div class=\"ex\"><h4>名稱對照</h4><ul><li>絲球體（微血管球）＋鮑氏囊 ＝ 腎小體。</li><li>近曲小管（大量再吸收）→ 亨耳氏套（濃縮機制）→ 遠曲小管（微調）。</li><li>腎小體 ＋ 腎小管 ＝ 腎元。</li><li>集尿管：匯集多個腎元的濾液。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>為什麼相同集尿管可接收不同腎元來的濾液？</p><p><b>答：</b>因為集尿管是匯集的通道：許多腎元的遠曲小管都通向同一條集尿管，所以它不專屬於某一個腎元。</p></div>", "tb": [["BOOK3", "P78 完整課本頁"]]}, {"id": "b3-c32-l06", "t": "兩條路徑：血液不流入鮑氏囊腔", "sec": "s2", "slide": 14, "sourceSlides": [14], "sourcePages": [], "src": "原PPT第 14 頁；課本 P78–80", "figSpec": {"image": "nephron"}, "txt": "<ul><li>血液：入球小動脈→絲球體→出球小動脈→管周微血管／直血管→靜脈。</li><li>濾液：鮑氏囊腔→近曲小管→亨耳氏套→遠曲小管→集尿管。</li><li>過濾跨越屏障產生濾液；血球主要留在血管，不沿小管進膀胱。</li></ul><p class=\"think\">如果紅血球在正常情況沿小管流走，身體會失去哪種運輸功能？</p><div class=\"ex\"><h4>兩條路徑</h4><p>讀圖 3－6 時，要分清楚<b>血液流動方向</b>與<b>濾液流動方向</b>。</p></div><div class=\"ex\"><h4>血液路徑</h4><ul><li>腎動脈 → 入球小動脈 → 絲球體 → 出球小動脈 → 腎小管周邊微血管網 → 腎靜脈。</li></ul></div><div class=\"ex\"><h4>濾液路徑</h4><ul><li>絲球體濾出 → 鮑氏囊 → 近曲小管 → 亨耳環管 → 遠曲小管 → 集尿管 → 腎盂。</li></ul></div><div class=\"ex g\"><h4>重點</h4><p>血液是在絲球體的微血管內流動，<b>不會流進鮑氏囊腔</b>；進入鮑氏囊的只是被濾過的液體。</p></div><div class=\"ex\"><h4>深入解說：雙路徑的「交會點」在絲球體</h4><p>血液與濾液兩條路徑在絲球體交會：血液在微血管裡流動，其中的水和小分子被濾出，穿過三層屏障（微血管內皮的孔、基底膜、鮑氏囊的足細胞）進入鮑氏囊腔，成為濾液。血液本身仍然在血管中，從出球小動脈離開絲球體，再分支成管周微血管包圍腎小管，這樣腎小管才能把物質回收到血液。<b>兩個微血管網串聯</b>（絲球體與管周微血管），是腎臟血液循環的特色。</p></div><div class=\"ex\"><h4>流向確認</h4><ul><li>血液：腎動脈 → 入球小動脈 → <b>絲球體</b> → 出球小動脈 → 管周微血管 → 腎靜脈。</li><li>濾液：鮑氏囊腔 → 近曲小管 → 亨耳氏套 → 遠曲小管 → 集尿管 → 腎盂。</li><li>出球小動脈離開絲球體後仍是<b>動脈</b>（因為它連接兩個微血管網），含氧量與血壓仍較高。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>如果紅血球在正常情況沿小管流走，身體會失去哪種運輸功能？</p><p><b>答：</b>紅血球負責運氧；若它們經由腎小管流失，血液的運氧能力會下降（也會出現血尿），所以屏障要攔住血球與大分子蛋白質。</p></div>", "tb": []}, {"id": "b3-c32-l07", "t": "過濾：看壓力與屏障，非主動泵出", "sec": "s2", "slide": 15, "sourceSlides": [15, 16], "sourcePages": [4], "src": "原PPT第 15–16 頁；課本 P78–80", "figSpec": {"image": "formation"}, "txt": "<ul><li>絲球體微血管壓力推動水與可過濾溶質跨屏障進鮑氏囊腔。</li><li>血球與多數大分子蛋白質被屏障保留；水、葡萄糖、離子等可被過濾。</li><li>有效濾過壓還受囊腔壓與血漿膠體滲透壓影響，不能只看一條小動脈口徑。</li></ul><p class=\"think\">排除大分子與血球，是否等於能辨認每個小分子「好壞」？</p><div class=\"scope-note\">過濾由壓力推動，是被動的整體流動；維持血壓與細胞功能仍需能量，不代表整個腎臟不耗能。</div><div class=\"ex\"><h4>過濾作用</h4><p>血液經入球小動脈進入絲球體，<b>除了血球和大分子物質外</b>，其他成分被過濾到鮑氏囊，形成<b>濾液</b>。方向：絲球體 → 鮑氏囊。</p></div><div class=\"ex\"><h4>為什麼能過濾</h4><ul><li>入球小動脈與出球小動脈<b>管徑不同</b>，造成壓力差。</li><li>絲球體微血管管壁<b>孔隙多、通透性大</b>。</li><li>方式：被動運輸（不是用 ATP 主動泵出）。</li></ul></div><div class=\"ex\"><h4>能被過濾的是</h4><ul><li>小分子：水、無機鹽、尿素、葡萄糖、胺基酸。</li><li>不能：血球與蛋白質等大分子。</li></ul></div><div class=\"ex\"><h4>深入解說：為什麼絲球體容易過濾</h4><p>過濾需要壓力，而絲球體的壓力比一般微血管高很多（約 55 mmHg）。原因是<b>入球小動脈比較粗、出球小動脈比較細</b>：血液進得多、出得少，血液在絲球體裡「塞車」，壓力升高，把水和小分子擠出微血管。整個過程像擠壓濾茶器：壓力推動，孔洞大小決定誰能過。小分子（水、葡萄糖、胺基酸、尿素、離子）可過，血球與大蛋白過不了。</p></div><div class=\"ex\"><h4>有效過濾壓（補充）</h4><ul><li>促進過濾：絲球體微血管的血壓（向外）。</li><li>阻礙過濾：鮑氏囊腔內的壓力、血漿蛋白造成的膠體滲透壓（向內）。</li><li>淨壓力約 10 mmHg，仍足以每分鐘濾出約 125 mL（每天約 180 L）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>排除大分子與血球，是否等於能辨認每個小分子「好壞」？</p><p><b>答：</b>不是。過濾只看<b>大小</b>，好的（葡萄糖）、壞的（尿素）小分子都被濾過；之後靠再吸收把有用的回收，這是「選擇」發生的地方。</p></div>", "tb": [["BOOK4", "P79 完整課本頁"]]}, {"id": "b3-c32-l08", "t": "再吸收：從管腔回到血液", "sec": "s2", "slide": 17, "sourceSlides": [17], "sourcePages": [], "src": "原PPT第 17 頁；課本 P78–80", "figSpec": {"image": "formation"}, "txt": "<ul><li>再吸收把濾液中的水和溶質回收到血液；近曲小管是大量回收的主要區段。</li><li>葡萄糖在正常負荷下幾乎完全回收；Na⁺梯度支持次級主動運輸。</li><li>水隨滲透梯度移動，離子運輸有主動與被動途徑，不能一律視為被動。</li></ul><p class=\"think\">若濾液中有葡萄糖，為什麼正常尿液常檢測不到？</p><div class=\"scope-note\">近曲小管細胞的Na⁺／K⁺幫浦提供梯度，葡萄糖共同運輸並非每個葡萄糖載體都直接水解ATP。負荷超過回收能力時可出現尿糖。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>再吸收作用</h4><p>把濾液中的物質<b>回收到血液</b>。方向：腎小管、集尿管 → 腎小管周邊微血管網。</p></div><div class=\"ex\"><h4>兩種方式</h4><ul><li><b>葡萄糖與胺基酸</b>：在<b>近曲小管</b>以<b>主動運輸</b>被吸收。</li><li><b>水、無機鹽</b>：在腎小管與集尿管再吸收（被動運輸為主）。</li></ul></div><div class=\"ex\"><h4>結果</h4><p>絕大部分葡萄糖與胺基酸被回收，所以正常人尿液中不易檢出。水分與無機鹽的再吸收比例則會依體內生理狀況調節。</p></div><div class=\"ex\"><h4>深入解說：近曲小管是「回收主力」</h4><p>每天濾出約 180 L 濾液，但最後只排出約 1.5 L 尿液，99% 以上被回收。其中約 65% 的水與鈉在<b>近曲小管</b>回收，葡萄糖與胺基酸幾乎在此全部回收。上皮細胞頂端面對管腔有大量微絨毛（刷狀緣），基底側有許多粒線體（提供 ATP）。回收葡萄糖的方式與小腸吸收類似：基底側的 Na⁺／K⁺ 幫浦建立鈉梯度，頂端的共同運輸蛋白讓葡萄糖搭 Na⁺ 的便車進入細胞（次級主動運輸）。</p></div><div class=\"ex\"><h4>腎閾值與尿糖</h4><ul><li>葡萄糖載體數量有上限，稱為<b>運輸極大值</b>。</li><li>血糖過高（如糖尿病）時，濾出的葡萄糖超過載體處理能力，剩餘的留在小管中，隨尿液排出（尿糖）。</li><li>過量的葡萄糖還會把水拉進尿液（滲透性利尿），所以糖尿病患者多尿、口渴。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>若濾液中有葡萄糖，為什麼正常尿液常檢測不到？</p><p><b>答：</b>因為近曲小管把濾出的葡萄糖<b>幾乎全部回收</b>到血液；尿中檢測到葡萄糖是異常現象（如血糖過高）。</p></div>", "tb": []}, {"id": "b3-c32-l09", "t": "尿素也會再吸收：濃縮不等於全數留下", "sec": "s2", "slide": 18, "sourceSlides": [18, 23], "sourcePages": [], "src": "原PPT第 18–23 頁；課本 P78–80", "figSpec": {"image": "table"}, "txt": "<ul><li>尿素是廢物，卻仍可部分再吸收；部分管段也有尿素循環。</li><li>水大量回收後，尿液尿素濃度可以升高，同時尿素總排出量小於過濾量。</li><li>原PPT「尿素不會被再吸收」應加以釐清；不能因為它是廢物就假定全程單向。</li></ul><p class=\"think\">每日過濾50 g、尿中28 g，差額可以用「零再吸收」解釋嗎？</p><div class=\"scope-note\">原PPT第18頁原句保留在原文頁籤；機制說明依管段與淨收支判讀。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>什麼被再吸收</h4><p>小分子物質依再吸收程度可分類。</p></div><div class=\"ex\"><h4>依物質分</h4><ul><li><b>完全再吸收</b>：葡萄糖、胺基酸。</li><li><b>部分再吸收</b>：水、無機鹽、尿素。</li><li>尿酸、鉀離子：課本表 3－1 顯示尿中濃度遠高於血漿，是因為水分被大量回收（見下一張）。</li></ul></div><div class=\"ex\"><h4>補充</h4><p>尿素在簡報中標示為「部分再吸收」；但尿液中尿素濃度仍遠高於血漿，是因為水的再吸收量更大（見表 3－1 的說明）。</p></div><div class=\"ex\"><h4>深入解說：先看「淨收支」，不要只看有沒有回收</h4><p>尿素每天過濾約 50 g，排出約 28 g，差額 22 g 表示有一部分被<b>再吸收</b>（淨回收）。水被回收得更多（過濾 183 L，排出 1.8 L，回收約 99%），所以尿素在尿液中的<b>濃度</b>反而變得很高，遠高於血漿。這說明：「廢物」也可以被部分回收；「濃度升高」是因為水少了，不代表總量沒有減少。</p></div><div class=\"ex\"><h4>比較兩種回收程度</h4><ul><li>葡萄糖：回收 ≈ 100%（完全）。</li><li>水：回收約 99%（部分，但比例非常高）。</li><li>鈉：回收約 99%。</li><li>尿素：回收約 40～50%（部分）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>每日過濾 50 g、尿中 28 g，差額可以用「零再吸收」解釋嗎？</p><p><b>答：</b>不行。若完全沒有再吸收，排出量應等於過濾量（50 g）；實際少了 22 g，表示有淨再吸收。（排出量 ＝ 過濾量 − 再吸收量 ＋ 分泌量）</p></div>", "tb": []}, {"id": "b3-c32-l10", "t": "亨耳氏套：不同通透性建立梯度", "sec": "s2", "slide": 13, "sourceSlides": [13, 17], "sourcePages": [], "src": "原PPT第 13–17 頁；課本 P78–80", "figSpec": {"image": "nephron"}, "txt": "<ul><li>降支對水通透較高，水可隨髓質滲透梯度離開管腔。</li><li>粗升支回收鹽但不易讓水通過，協助建立髓質滲透梯度。</li><li>集尿管沿著這個梯度通過；能否大量回收水還受ADH影響。</li></ul><p class=\"think\">如果升支同時讓大量水追隨鹽流出，維持梯度會遇到什麼問題？</p><div class=\"scope-note\">此為對舊版逆流機制題的必要補充，不把薄升支與粗升支所有運輸方式視為相同。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>亨耳環管</h4><p>亨耳環管是腎小管的一段，位於近曲小管與遠曲小管之間，位置在髓質深處。</p></div><div class=\"ex\"><h4>課本寫了什麼</h4><p>課本只說明腎小管與集尿管「與尿液的形成及濃縮有關」；水與無機鹽在腎小管、集尿管再吸收，且比例可依生理狀況調節。</p></div><div class=\"ex\"><h4>小提醒</h4><p>課本沒有詳細說明亨耳環管建立濃度梯度的機制（逆流倍增）。若要補充，應與課本內容分開標示，不要寫成課本結論。</p></div><div class=\"ex\"><h4>補充（課外，非課本內容）：逆流倍增如何讓尿液濃縮</h4><p>課本只說腎小管與集尿管「與尿液的濃縮有關」。若想了解機制，可以把亨耳氏套想成一個 U 形管：<b>降支</b>對水容易通過、對鹽不容易 → 水被髓質高滲透壓「拉」出，管內液越走越濃；<b>升支（粗段）</b>對水不通透、但主動把鹽（Na⁺、Cl⁻）送出 → 管內液越走越稀，同時把鹽加到髓質組織液中。這使髓質由外而內形成<b>越來越濃的滲透壓梯度</b>。集尿管穿過這個梯度，在 ADH 存在時水通道增加，水被拉出，尿液濃縮。</p></div><div class=\"ex\"><h4>為什麼要有這個設計</h4><ul><li>陸生動物需要保水，能產生比血漿濃好幾倍的尿（人類最高可達約 1200 mOsm，約為血漿的 4 倍）。</li><li>沙漠鼠的亨耳氏套特別長，可濃縮到更高濃度。</li><li>水生動物（淡水魚）不需濃縮，亨耳氏套短或沒有。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>這段是補充說明；考試或報告時，課本範圍內只要記得「亨耳氏套位於近曲與遠曲之間，與濃縮有關」即可，需要時再分開標示延伸內容。</p></div>", "tb": []}, {"id": "b3-c32-l11", "t": "分泌：從血液加到小管中", "sec": "s2", "slide": 19, "sourceSlides": [19, 20], "sourcePages": [], "src": "原PPT第 19–20 頁；課本 P78–80", "figSpec": {"image": "formation"}, "txt": "<ul><li>分泌是管周血液經上皮將特定物質移入管腔，方向與再吸收相反。</li><li>H⁺、K⁺與部分藥物可經分泌調整排出量；機制依物質及區段而異。</li><li>濾液在腎小管與集尿管持續被改變，不是到達腎盂才突然變成尿液。</li></ul><p class=\"think\">已過濾的物質，還能再分泌嗎？兩者會如何影響排出量？</p><div class=\"scope-note\">教材強調主動分泌作為模型，不把每種物質跨越兩側細胞膜的步驟都說成相同ATP幫浦。</div><div class=\"ex\"><h4>分泌作用</h4><p>把血液中的物質<b>加到腎小管管腔</b>中。方向：腎小管周邊微血管網 → 腎小管、集尿管。</p></div><div class=\"ex\"><h4>要點</h4><ul><li>主要發生在<b>近曲小管與遠曲小管</b>。</li><li>方式：<b>主動運輸</b>。</li><li>分泌的物質：<b>氫離子、鉀離子、藥物</b>（簡報另列尿素）。</li></ul></div><div class=\"ex\"><h4>尿液的成分</h4><p>濾液經過再吸收與分泌後進入集尿管，匯入腎盂形成尿液。正常尿液呈淡黃色，含水、含氮廢物、無機鹽。</p></div><div class=\"ex\"><h4>深入解說：分泌的功能</h4><p>分泌是再吸收的「相反方向」：把管周微血管中的物質主動送進腎小管管腔。功能有三個：①<b>排除過濾沒清乾淨的物質</b>（如 H⁺、K⁺、肌酸酐、部分藥物與毒物，例如青黴素，常需分泌排出，所以半衰期短）；②<b>微調血液成分</b>（K⁺、H⁺ 的恆定）；③<b>增加排出效率</b>：一些與蛋白質結合的物質不易被過濾，需靠分泌才能排除。分泌主要發生在近曲小管與遠曲小管。</p></div><div class=\"ex\"><h4>三種過程總整理（表格式）</h4><ul><li><b>過濾</b>：血液 → 鮑氏囊；被動；看分子大小與壓力。</li><li><b>再吸收</b>：管腔 → 管周血；以主動運輸＋被動（水、離子）為主。</li><li><b>分泌</b>：管周血 → 管腔；主動運輸為主。</li><li>濾液在整個腎小管與集尿管中不斷被改變，並不是到腎盂才變成尿液。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>已過濾的物質，還能再分泌嗎？兩者會如何影響排出量？</p><p><b>答：</b>可以。過濾量與分泌量增加排出量，再吸收量減少排出量；排出量 ＝ 過濾量 − 再吸收量 ＋ 分泌量。</p></div>", "tb": []}, {"id": "b3-c32-l12", "t": "一個收支式：排出＝過濾－回收＋分泌", "sec": "s2", "slide": 15, "sourceSlides": [15, 17, 19], "sourcePages": [], "src": "原PPT第 15–19 頁；課本 P78–80", "figSpec": {"image": "formation"}, "txt": "<ul><li>把同一物質在同一時間範圍的量相加減：尿中排出量＝過濾量－再吸收量＋分泌量。</li><li>只看尿中濃度不足以判斷量；還要乘上尿液體積或流量。</li><li>水回收與溶質回收比例不同，兩者的濃度變化不能互相代替。</li></ul><p class=\"think\">尿中某物濃度高，是「更多總量」還是「更少水」？還缺哪項資料？</p><div class=\"ex\"><h4>一個總整理</h4><p>尿液中某物質的排出量，由三個過程決定：</p></div><div class=\"ex g\"><h4>排出量</h4><ul><li><b>排出量 ＝ 過濾量 － 再吸收量 ＋ 分泌量</b>。</li><li>過濾：絲球體 → 鮑氏囊（被動，看分子大小）。</li><li>再吸收：管腔 → 血液。</li><li>分泌：血液 → 管腔（主動運輸）。</li></ul></div><div class=\"ex\"><h4>怎麼用</h4><p>看到一個物質的箭頭：有沒有被濾過？有沒有被回收？有沒有被加入？三個問題依序回答，就能判斷它在尿中的量。</p></div><div class=\"ex\"><h4>深入解說：用「三問法」判讀任何物質</h4><p>對任何一種物質，依序問：①<b>有沒有被濾過？</b>（大小：血球、大蛋白不會；小分子會）②<b>濾出後有沒有被回收？</b>（葡萄糖幾乎全部；水、鈉大部分；尿素部分；尿酸部分）③<b>有沒有再被加入？</b>（H⁺、K⁺、藥物）。三問答完，就能預測它在尿中的量與濃度。</p></div><div class=\"ex\"><h4>代入練習</h4><ul><li><b>葡萄糖</b>：濾過 ✔、回收 100%、分泌 ✘ → 排出 0。</li><li><b>尿素</b>：濾過 ✔、部分回收、少量分泌 → 排出 < 濾過。</li><li><b>血漿蛋白</b>：濾過幾乎 ✘ → 尿中幾乎 0（若出現蛋白尿，表示過濾屏障受損）。</li><li><b>K⁺</b>：濾過 ✔、大部分回收、遠曲小管與集尿管分泌 → 排出量調節血鉀。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>尿中某物濃度高，是「更多總量」還是「更少水」？還缺哪項資料？</p><p><b>答：</b>兩者都可能。要比較總量，還需要知道<b>尿液體積</b>（或流量）；總量＝濃度 × 體積。</p></div>", "tb": []}, {"id": "b3-c32-l13", "t": "表3-1：三種液體與兩則註解", "sec": "s2", "slide": 21, "sourceSlides": [21, 22], "sourcePages": [5], "src": "原PPT第 21–22 頁；課本 P78–80", "figSpec": {"image": "table"}, "txt": "<ul><li>先讀行列：血漿、鮑氏囊濾液、正常尿液；數值單位是mg/dL。</li><li>正常尿中葡萄糖與胺基酸不易檢測到，是過濾後大量回收，非它們沒有過濾。</li><li>小量小分子蛋白可過濾後再回收；「血球與大蛋白被留住」與此不矛盾。</li></ul><p class=\"think\">如何用兩列濃度區分「不過濾」與「過濾後回收」？</p><div class=\"scope-note\">表中為教材健康成年男性的例示範圍，含兩則註解；保留原數值，作生理模型判讀，不能當個人診斷界線或所有人的固定正常值。</div><div class=\"ex\"><h4>表 3－1　三種液體的濃度（mg／dL）</h4><p>比較血漿、鮑氏囊濾液、正常尿液。</p></div><div class=\"ex\"><h4>蛋白質、葡萄糖、胺基酸</h4><ul><li>蛋白質：血漿 6000～8000；濾液約 200；尿液 0。</li><li>葡萄糖：血漿與濾液同為 70～110；尿液 0。</li><li>胺基酸：血漿與濾液少於 50；尿液 0。</li></ul></div><div class=\"ex\"><h4>為什麼尿裡幾乎沒有</h4><ul><li>蛋白質分子大，不能被過濾進入鮑氏囊。</li><li>葡萄糖、胺基酸能被過濾，但在腎小管中被再吸收。</li><li>註 2：滲出到濾液的小分子蛋白質會在腎小管以<b>胞吞作用</b>再吸收，尿中含量過低，不易檢出。</li></ul></div><div class=\"ex\"><h4>深入解說：怎麼讀表 3－1</h4><p>表格有三欄：<b>血漿、鮑氏囊濾液、正常尿液</b>。比較血漿與濾液，可知「<b>哪些物質有被過濾</b>」：葡萄糖、胺基酸在血漿與濾液濃度相同 → 順利通過過濾屏障；蛋白質在濾液中很低（約 200 對 6000～8000） → 大分子被擋下。再比較濾液與尿液，可知「<b>過濾後怎麼了</b>」：葡萄糖、胺基酸在尿中是 0 → 濾出後全部再吸收，而不是沒過濾。</p></div><div class=\"ex\"><h4>三個推論句型</h4><ul><li>血漿 ≈ 濾液 → 物質自由過濾。</li><li>濾液 ≫ 尿（=0）→ 濾出後被完全再吸收。</li><li>尿 ≫ 血漿 → 水被大量回收（濃縮），或有分泌。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>表中數值是教材提供的健康成年男性示例範圍，用來理解生理原理，不是個人檢驗的判讀標準。註 2：極少量小分子蛋白質過濾出來後，在腎小管以胞吞作用被回收，所以尿中不易檢出。</p></div>", "tb": [["BOOK5", "P80 完整課本頁"]]}, {"id": "b3-c32-l14", "t": "濃度與量：高尿素濃度的兩種解釋", "sec": "s2", "slide": 23, "sourceSlides": [23], "sourcePages": [], "src": "原PPT第 23 頁；課本 P78–80", "figSpec": {"image": "table"}, "txt": "<ul><li>濃度＝物質量／體積；水大量回收可使尿中尿素濃度升高。</li><li>Na⁺、K⁺的尿中濃度反映水與離子的共同調整，不能單憑濃度推定分泌強弱。</li><li>若給定每24小時尿量，再將濃度換成g/L乘體積，才可比較每日量。</li></ul><p class=\"think\">同樣1 g溶在1 L與0.1 L水中，總量與濃度會如何改變？</p><div class=\"ex\"><h4>尿素、尿酸、鉀離子</h4><p>血漿：尿素 5～20、尿酸 2.5～6、鉀離子 12.3～18.3；正常尿液：尿素 800～1333、尿酸 16.7～50、鉀離子 25～125。尿中濃度遠高於血漿。</p></div><div class=\"ex\"><h4>兩個原因</h4><ul><li>這些物質雖然也可能被部分再吸收，但<b>水分被再吸收的量更大</b>，使剩下的濾液被濃縮，濃度上升。</li><li>鉀離子還會在腎小管被分泌到管腔。</li></ul></div><div class=\"ex\"><h4>濃度不等於量</h4><p>「濃度高」是因為水被回收得更多，不代表它的量沒有被回收，要分清「濃度」與「總量」。</p></div><div class=\"ex\"><h4>深入解說：濃度、量與體積的關係</h4><p>濃度 ＝ 物質的量 ÷ 體積。假設 1 g 溶質溶在 1 L 水中，濃度 1 g／L；若水被回收到只剩 0.1 L，溶質仍是 1 g，濃度變成 10 g／L。這就是尿中尿素濃度遠高於血漿的原因：<b>水被回收的比例（約 99%）遠大於尿素被回收的比例（約 50%）</b>，所以尿素被「濃縮」。要比較「一天排了多少」，必須用濃度乘以一天的尿量。</p></div><div class=\"ex\"><h4>計算示範（來自表 3－1 與題目數據）</h4><ul><li>尿素過濾 50 g、排出 28 g，水過濾 183 L、排出 1.8 L。</li><li>血漿中的尿素濃度（假設）約 50 g ÷ 183 L ≈ 0.27 g／L。</li><li>尿中尿素濃度 ≈ 28 g ÷ 1.8 L ≈ 15.6 g／L，是血漿的約 57 倍。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>同樣 1 g 溶在 1 L 與 0.1 L 水中，總量與濃度會如何改變？</p><p><b>答：</b>總量不變（1 g），濃度變成 10 倍（從 1 g／L 到 10 g／L）。</p></div>", "tb": []}, {"id": "b3-c32-l15", "t": "體液分區：三分之二指哪個總量？", "sec": "s3", "slide": 24, "sourceSlides": [24, 25, 26], "sourcePages": [6], "src": "原PPT第 24–26 頁；課本 P81–83", "figSpec": {"image": "fluid"}, "txt": "<ul><li>體液約三分之二在細胞內、三分之一在細胞外；分母是總體液。</li><li>細胞外液包括血漿、組織液與淋巴等；不同膜的選擇通透性維持成分差異。</li><li>圖3-8圓餅圖比較各成分的相對比例，不是內液外液的容積比。</li></ul><p class=\"think\">能否由兩個等大的圓餅圖推定兩區體液各佔一半？</p><div class=\"ex\"><h4>體液分區</h4><p>人體體液分為<b>細胞內液</b>與<b>細胞外液</b>。</p></div><div class=\"ex\"><h4>比例與組成</h4><ul><li>細胞內液約占體液總量的<b>三分之二</b>，例如細胞質液。</li><li>細胞外液約占<b>三分之一</b>，包括血漿、組織液、淋巴。</li></ul></div><div class=\"ex\"><h4>離子分布不同</h4><ul><li>細胞內液：磷酸根、鉀離子、鎂離子等。</li><li>細胞外液：鈉離子、氯離子、碳酸氫根等。</li></ul></div><div class=\"ex\"><h4>為什麼不同</h4><p>細胞對這些物質具有<b>選擇性通透性</b>，造成內外分布差異，有助於維持正常生理作用。腎臟可藉排泄調節體液的水分、無機鹽及酸鹼值。</p></div><div class=\"ex\"><h4>深入解說：體液的兩個「房間」</h4><p>成年人體重約 60% 是水（約 40 L），其中約 2／3 在細胞內（細胞內液，約 25 L）、約 1／3 在細胞外（細胞外液，約 15 L）。細胞外液又分成<b>組織液</b>（約 11 L）與<b>血漿</b>（約 3 L）等。兩個房間的離子組成不同：細胞內以 K⁺、Mg²⁺、磷酸根為主；細胞外以 Na⁺、Cl⁻、HCO₃⁻ 為主。這種差異靠細胞膜上的 Na⁺－K⁺ 幫浦與選擇性通透維持。</p></div><div class=\"ex\"><h4>讀圓餅圖的提醒</h4><ul><li>圖 3－8 的圓餅圖比較的是各<b>成分的相對比例</b>（誰多誰少），不是兩個房間的體積比。</li><li>兩個圓餅等大，不代表細胞內液和細胞外液各占一半。</li><li>選擇題常在這裡設陷阱：記得內液約 2／3、外液約 1／3。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>能否由兩個等大的圓餅圖推定兩區體液各占一半？</p><p><b>答：</b>不能。圓餅圖各自代表「該區域內」的成分比例；兩區體積比（約 2：1）要看文字說明。</p></div>", "tb": [["BOOK6", "P81 完整課本頁"]]}, {"id": "b3-c32-l16", "t": "ADH：合成地與釋放地分開看", "sec": "s3", "slide": 27, "sourceSlides": [27, 29], "sourcePages": [7], "src": "原PPT第 27–29 頁；課本 P81–83", "figSpec": {"image": "adh"}, "txt": "<ul><li>缺水常使血液滲透壓上升，下視丘參與偵測、口渴與調節。</li><li>ADH由下視丘合成，經神經纖維送至腦垂腺後葉儲存與釋放。</li><li>主要增加遠曲小管末段與集尿管的水通透性，使水沿梯度回收。</li></ul><p class=\"think\">「後葉釋放」是否表示「後葉製造」？</p><div class=\"scope-note\">補充：集尿管細胞膜水通道AQP2增加；不是水直接被ADH幫浦搬運，也不把近曲小管當主要ADH調控位置。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/25-8-endocrine-regulation-of-kidney-function\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>滲透壓的調節</h4><p>當人體水分不足、血液滲透壓上升（如流太多汗）：</p></div><div class=\"ex\"><h4>路徑</h4><ul><li>下視丘的<b>滲透壓受器</b>被活化 → 引起<b>口渴</b>，促使喝水。</li><li>同時促進腦垂腺後葉釋放<b>抗利尿素（ADH，又稱血管加壓素）</b>。</li><li>ADH 作用於<b>遠曲小管與集尿管</b>管壁細胞，提高對水的再吸收 → 尿液濃縮，水分排除減少。</li></ul></div><div class=\"ex\"><h4>合成地與釋放地</h4><p>抗利尿素由<b>下視丘合成</b>，暫存並由<b>腦垂腺後葉釋放</b>。ADH 也有使小動脈收縮、血壓上升的作用。</p></div><div class=\"ex\"><h4>深入解說：ADH 的路徑</h4><p>ADH（抗利尿素）是由<b>下視丘</b>的神經分泌細胞合成，沿著細胞的軸突運送到<b>腦垂腺後葉</b>儲存，需要時由後葉釋放到血液。所以「後葉釋放」≠「後葉製造」。ADH 到達腎臟後，作用在遠曲小管末段與集尿管的細胞，使細胞膜上的<b>水通道（AQP2）</b>增加，水依髓質高滲透壓的梯度被吸回血液，尿量減少、尿液變濃。ADH 本身不「搬水」，只是打開通道。</p></div><div class=\"ex\"><h4>缺水時的雙重反應</h4><ul><li>行為：下視丘口渴中樞 → 產生口渴感 → 喝水。</li><li>生理：ADH 釋放增加 → 腎臟留水。</li><li>酒精抑制 ADH 釋放，所以喝酒後尿多，容易脫水。</li><li>尿崩症：ADH 不足或腎臟對 ADH 無反應，大量排出稀尿。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>「後葉釋放」是否表示「後葉製造」？</p><p><b>答：</b>不是。ADH 由<b>下視丘</b>合成，經神經纖維送到<b>後葉</b>儲存與釋放；後葉像倉庫兼出貨口。</p></div>", "tb": [["BOOK7", "P82 完整課本頁"]]}, {"id": "b3-c32-l17", "t": "喝水與缺水：負回饋不是固定開關", "sec": "s3", "slide": 28, "sourceSlides": [28], "sourcePages": [], "src": "原PPT第 28 頁；課本 P81–83", "figSpec": {"image": "adh"}, "txt": "<ul><li>水攝取過多使滲透壓下降時，ADH釋放通常減少，尿液較稀、尿量較多。</li><li>缺水時ADH增加有助留水；喝水及留水使原刺激減弱，形成負回饋。</li><li>尿量亦受血容量、腎功能與其他因素影響；不能只用喝水量推定單一結果。</li></ul><p class=\"think\">反應是增加留水，為何仍稱負回饋？</p><div class=\"ex\"><h4>兩個方向的負回饋</h4><p>調節是雙向的。</p></div><div class=\"ex\"><h4>缺水時</h4><ul><li>血液滲透壓上升 → ADH 增加 → 水的再吸收增加 → 尿少而濃 → 滲透壓回到正常。</li></ul></div><div class=\"ex\"><h4>喝太多水時</h4><ul><li>血液滲透壓下降 → 回饋到下視丘，ADH 的合成與釋放減少。</li><li>遠曲小管與集尿管對水的再吸收減少 → 尿量多而稀 → 排出多餘水分。</li></ul></div><div class=\"ex\"><h4>小提醒</h4><p>負回饋不是固定開關：偏離越大，反應越明顯；回到正常範圍後，反應就減弱。</p></div><div class=\"ex\"><h4>深入解說：雙向的負回饋</h4><p>缺水時：滲透壓 ↑ → ADH ↑ → 留水 → 滲透壓 ↓（回正常）。水喝多時：滲透壓 ↓ → ADH ↓ → 排出稀尿 → 滲透壓 ↑（回正常）。兩個方向的結果都是「把偏離拉回」，所以都是<b>負回饋</b>。反應強度與偏離程度成正比：滲透壓稍微升高，ADH 微幅增加；升得很多，ADH 大量增加。這是「類比式」的調節，不像開關那樣二選一。</p></div><div class=\"ex\"><h4>尿量的其他影響因素</h4><ul><li>血量與血壓：大量失血時，即使滲透壓正常，ADH 也會增加以保留水（容量優先）。</li><li>腎功能：腎臟疾病時調節能力下降。</li><li>藥物與飲料：利尿劑、咖啡因、酒精影響尿量。</li><li>所以不能只由喝水量推測尿量。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>反應是增加留水，為何仍稱負回饋？</p><p><b>答：</b>因為「負回饋」描述的是結果與刺激的關係：留水使滲透壓下降，削弱了原先「滲透壓上升」的刺激，所以是負回饋。</p></div>", "tb": []}, {"id": "b3-c32-l18", "t": "RAAS起點：腎素是酵素", "sec": "s3", "slide": 30, "sourceSlides": [30, 31, 32], "sourcePages": [8], "src": "原PPT第 30–32 頁；課本 P81–83", "figSpec": {"image": "raas"}, "txt": "<ul><li>腎灌流或血壓下降等訊號可促使近絲球體細胞釋放腎素。</li><li>肝臟提供血管收縮素原；腎素切成I，再經ACE等步驟形成活性的II。</li><li>血管收縮素II可使小動脈收縮，並促進醛固酮、口渴及ADH相關反應。</li></ul><p class=\"think\">器官來源、反應先後與真正活性物質，分別要如何標在箭頭上？</p><div class=\"scope-note\">原圖省略I與ACE步驟；補上級聯反應，不能說肝臟直接釋出活性II，也不能把腎素當成直接搬Na⁺的載體。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/25-8-endocrine-regulation-of-kidney-function\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>起點：腎素</h4><p>失血或血壓下降、血量減少時，入球小動脈管壁上的特化細胞釋出<b>腎素</b>（一種酵素）。</p></div><div class=\"ex\"><h4>接下來</h4><ul><li>腎素活化血液中由<b>肝臟</b>製造的<b>血管收縮素原</b>，經一系列轉變成為<b>血管收縮素</b>。</li><li>血管收縮素使小動脈收縮 → 血壓上升。</li><li>同時促進腎上腺皮質分泌<b>醛固酮</b>。</li></ul></div><div class=\"ex\"><h4>此系統名稱</h4><p>腎素—血管收縮素—醛固酮系統，簡稱 <b>RAAS</b>。腎素是酵素，不是激素；是它啟動這條路徑。</p></div><div class=\"ex\"><h4>深入解說：RAAS 是一條「級聯反應」</h4><p>① 血壓／血量下降 → 腎臟入球小動脈的<b>近絲球體細胞</b>釋放<b>腎素</b>（酵素）。② 肝臟持續製造<b>血管收縮素原</b>（血漿蛋白）。③ 腎素把血管收縮素原切成<b>血管收縮素 I</b>（無活性）。④ 肺部血管內皮上的<b>轉化酶（ACE）</b>把 I 轉成<b>血管收縮素 II</b>（活性）。⑤ 血管收縮素 II：使小動脈收縮（升血壓）、刺激腎上腺皮質分泌醛固酮、促進口渴與 ADH。課本圖省略了 I 和 ACE 這一步，但整個級聯順序不變。</p></div><div class=\"ex\"><h4>三個常見混淆</h4><ul><li><b>腎素是酵素</b>，不是激素；它啟動級聯，自己不收縮血管。</li><li>肝臟提供「材料」（血管收縮素原），不直接釋出活性 II。</li><li>降血壓藥「ACE 抑制劑」就是阻斷 I → II 這一步（臨床連結）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>器官來源、反應先後與真正活性物質，分別要如何標在箭頭上？</p><p><b>答：</b>腎臟（腎素）→ 作用在肝臟來的血管收縮素原 → 形成 I → 在肺（ACE）形成活性的 II → 作用於血管、腎上腺皮質。箭頭要標明「來源器官」與「反應物質」。</p></div>", "tb": [["BOOK8", "P83 完整課本頁"]]}, {"id": "b3-c32-l19", "t": "醛固酮：保鈉、排鉀，水間接跟隨", "sec": "s3", "slide": 33, "sourceSlides": [33], "sourcePages": [], "src": "原PPT第 33 頁；課本 P81–83", "figSpec": {"image": "raas"}, "txt": "<ul><li>醛固酮由腎上腺皮質分泌，促進末端腎小管／集尿管的Na⁺回收與K⁺分泌。</li><li>血管收縮素II與血K⁺升高是重要刺激，並非只有腎素一種條件。</li><li>Na⁺保留可支持細胞外液量；實際水回收仍受通透性與滲透梯度影響。</li></ul><p class=\"think\">醛固酮與ADH都能幫助留水，兩者直接作用的目標相同嗎？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/25-8-endocrine-regulation-of-kidney-function\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>醛固酮</h4><p>由<b>腎上腺皮質</b>分泌。刺激來源：血管收縮素；促腎上腺皮質素（由腦垂腺前葉分泌）也可刺激醛固酮分泌。</p></div><div class=\"ex\"><h4>作用</h4><ul><li>活化遠曲小管與集尿管管壁細胞上特定的運輸蛋白，增加<b>鈉離子</b>的再吸收。</li><li>水隨之被間接回收 → 尿量下降、血量與血壓上升。</li></ul></div><div class=\"ex\"><h4>小提醒</h4><p>醛固酮直接作用的是鈉離子再吸收；水分是「間接」跟著回收。課本此處只寫鈉離子。</p></div><div class=\"ex\"><h4>深入解說：醛固酮的作用</h4><p>醛固酮是類固醇激素，由腎上腺<b>皮質</b>分泌，進入遠曲小管末段和集尿管的細胞，促使細胞增加 Na⁺ 通道和 Na⁺－K⁺ 幫浦的數量。結果：Na⁺ 被回收到血液，同時 K⁺ 分泌到尿液，這就是「<b>保鈉排鉀</b>」。Na⁺ 回收後，血液滲透壓上升，水隨之被回收（這部分的水需要 ADH 的水通道配合），因此細胞外液量與血壓上升。</p></div><div class=\"ex\"><h4>醛固酮 vs ADH</h4><ul><li><b>醛固酮</b>：直接作用目標是 <b>Na⁺</b>（也排 K⁺），水是間接跟隨。</li><li><b>ADH</b>：直接作用目標是<b>水</b>（水通道）。</li><li>兩者都使體液增加，但「直接目標」不同，常一起協同。</li><li>刺激醛固酮分泌的因素：血管收縮素 II、血鉀升高、ACTH（腦垂腺前葉）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>醛固酮與 ADH 都能幫助留水，兩者直接作用的目標相同嗎？</p><p><b>答：</b>不同。醛固酮直接促進 <b>Na⁺</b> 再吸收（水間接跟隨）；ADH 直接增加集尿管對<b>水</b>的通透性。</p></div>", "tb": []}, {"id": "b3-c32-l20", "t": "ANP：心房伸展時增加排鈉", "sec": "s3", "slide": 34, "sourceSlides": [34, 35], "sourcePages": [], "src": "原PPT第 34–35 頁；課本 P81–83", "figSpec": {"image": "raas"}, "txt": "<ul><li>血容量增加使心房壁伸展，可促使心房肌細胞釋放心房排鈉肽。</li><li>ANP促進排鈉與排水，並抑制腎素及醛固酮相關作用，協助降低容量與壓力。</li><li>教材以右心房為例；不能推論只有右心房可產生ANP。</li></ul><p class=\"think\">低血容量時大量促進排鈉，會支持原來的恆定目標嗎？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/25-8-endocrine-regulation-of-kidney-function\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>心房排鈉肽（ANP）</h4><p>當血量增加或血壓升高時，<b>右心房細胞</b>分泌 ANP。</p></div><div class=\"ex\"><h4>作用</h4><ul><li>抑制腎素與醛固酮的分泌（抑制 RAAS）。</li><li>促使鈉離子及水分排出 → 尿量增加。</li><li>結果：血量與血壓下降，回到正常。</li></ul></div><div class=\"ex\"><h4>和醛固酮相反</h4><p>醛固酮保鈉保水、提升血壓；ANP 促進排鈉排水、降低血壓。兩者形成對立調節。</p></div><div class=\"ex\"><h4>深入解說：ANP 是 RAAS 的「對手」</h4><p>血量增加時，心房壁被撐大，心房肌細胞釋出<b>心房排鈉肽（ANP）</b>。它的作用方向與 RAAS 相反：①擴張入球小動脈、增加絲球體過濾；②抑制腎素和醛固酮的分泌；③減少集尿管對 Na⁺ 的回收（排鈉）；④Na⁺ 和水一起排出，使血量和血壓降低。因此 ANP 與醛固酮對血量和血壓的作用是<b>相互拮抗</b>。</p></div><div class=\"ex\"><h4>比較兩條路線</h4><ul><li><b>血量低／血壓低</b>：腎素 ↑ → 血管收縮素 II ↑ → 醛固酮 ↑ → 保鈉保水 → 血量 ↑。</li><li><b>血量高／血壓高</b>：心房壁伸展 → ANP ↑ → 抑制 RAAS、排鈉排水 → 血量 ↓。</li><li>兩者各自是負回饋，彼此又拮抗。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>低血容量時大量促進排鈉，會支持原來的恆定目標嗎？</p><p><b>答：</b>不會。低血容量時應保留鈉與水，若促進排鈉會使血量更少，所以這時 ANP 分泌會<b>減少</b>。</p></div>", "tb": []}, {"id": "b3-c32-l21", "t": "三種訊號：滲透壓與血容量可同時改變", "sec": "s3", "slide": 36, "sourceSlides": [36, 37], "sourcePages": [], "src": "原PPT第 36–37 頁；課本 P81–83", "figSpec": {"image": "raas"}, "txt": "<ul><li>ADH主要調整水通透性；RAAS連結血管阻力、Na⁺回收與容量。</li><li>ANP偏向容量過多時的排鈉利尿；不同系統的刺激與標的不可混為一談。</li><li>嚴重低血容量可促進ADH，即使只用滲透壓模型不能完整預測。</li></ul><p class=\"think\">同時缺水與低血壓時，哪些路徑可以合作、哪些反應應減弱？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/25-8-endocrine-regulation-of-kidney-function\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>三種訊號系統</h4><p>抗利尿素（ADH）與 RAAS 都作用在遠曲小管與集尿管，可以<b>協同</b>維持體液的恆定。</p></div><div class=\"ex\"><h4>比較</h4><ul><li><b>抗利尿素</b>：對滲透壓的調節 → 促進水分再吸收。</li><li><b>RAAS（腎素、血管收縮素、醛固酮）</b>：對電解質（以 Na⁺ 為例）的調節 → 促進鈉再吸收，使水分回收。</li><li><b>心房排鈉肽</b>：抑制 RAAS，促進排鈉排水。</li></ul></div><div class=\"ex\"><h4>同時發生</h4><p>像大量流汗，會同時使滲透壓上升、血量下降，因此幾條路徑會同時啟動，要一起判斷。</p></div><div class=\"ex\"><h4>深入解說：同時啟動、一起判斷</h4><p>大量流汗時，同時發生三件事：①<b>滲透壓上升</b>（失水多於失鹽）→ 刺激 ADH；②<b>血量下降、血壓下降</b> → 啟動 RAAS 與交感神經；③ 回心血量減少 → ANP 下降。結果多路徑合作：ADH 與醛固酮讓腎臟保水、保鈉，口渴使人喝水，交感使心跳加快、血管收縮。這提醒我們：生理調節是<b>多重回饋同時進行</b>，要一起判斷，不是孤立地看一個激素。</p></div><div class=\"ex\"><h4>整理成表（背誦版）</h4><ul><li><b>ADH</b>：感測滲透壓（下視丘），作用腎小管遠端與集尿管，目標水。</li><li><b>RAAS</b>：感測血壓／血量（腎臟），作用血管與腎上腺皮質，目標 Na⁺ 與血管阻力。</li><li><b>ANP</b>：感測血量（心房壁），作用腎臟，目標排鈉排水。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>嚴重低血容量時，即使滲透壓不高，身體也會促進 ADH 分泌（容量優先），所以只用「滲透壓」一種模型無法完全預測。</p></div>", "tb": []}, {"id": "b3-c32-l22", "t": "酸鹼的三層防線：緩衝、肺與腎", "sec": "s4", "slide": 38, "sourceSlides": [38], "sourcePages": [9], "src": "原PPT第 38 頁；課本 P84", "figSpec": {"image": "buffer"}, "txt": "<ul><li>動脈血pH典型範圍約7.35–7.45，不是胃液、尿液或所有體液都要同值。</li><li>化學緩衝快速結合或釋放H⁺；肺調整CO₂排出；腎調整淨酸與HCO₃⁻。</li><li>相對反應時間不同，但三者同時參與，不能說腎臟只在長期異常才開始工作。</li></ul><p class=\"think\">把H⁺暫時結合與真正排出體外，效果相同嗎？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/26-4-acid-base-balance\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>酸鹼值的恆定</h4><p>人體血液酸鹼值約 <b>7.35～7.45</b>；異常時可能危及生命。</p></div><div class=\"ex\"><h4>三道防線</h4><ul><li><b>血液緩衝系統</b>：立刻發揮，短期調節。</li><li><b>呼吸運動</b>：改變呼吸頻率，調整 CO₂ 的排出，短期調節。</li><li><b>腎臟</b>：體液酸鹼值長期降低時，分泌 H⁺ 到尿液，並增加 HCO₃⁻ 的再吸收。</li></ul></div><div class=\"ex\"><h4>例子</h4><p>運動後體液酸鹼值降低 → 先由緩衝系統與呼吸加快調節。</p></div><div class=\"ex\"><h4>深入解說：為什麼 pH 要這麼嚴格</h4><p>蛋白質（包括酵素）的電荷與形狀受 pH 影響，pH 稍有改變就會影響酵素活性、離子分布與神經肌肉的功能。血液 pH 低於 7.35 稱為酸中毒、高於 7.45 稱為鹼中毒，低於 6.8 或高於 7.8 可能致命。pH 是 H⁺ 濃度的對數：pH 差 1，H⁺ 濃度差 10 倍，所以 0.1 的變化已相當大。</p></div><div class=\"ex\"><h4>三道防線（時間順序）</h4><ul><li><b>化學緩衝系統</b>（秒級）：血液中的碳酸氫鹽、磷酸鹽、蛋白質，立刻結合或釋出 H⁺。</li><li><b>呼吸調節</b>（分鐘級）：改變通氣量，調整 CO₂ 排出。</li><li><b>腎臟調節</b>（數小時到數天）：排出 H⁺、回收與新生 HCO₃⁻，最持久也最有力。</li><li>三者同時存在，並非「腎臟只在長期異常才開始工作」。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>把 H⁺ 暫時結合與真正排出體外，效果相同嗎？</p><p><b>答：</b>不同。緩衝只是把 H⁺ 暫時結合起來、減小 pH 變化，總酸量並沒有減少；真正移除酸要靠肺（排 CO₂）與腎（排 H⁺）。</p></div>", "tb": [["BOOK9", "P84 完整課本頁"]]}, {"id": "b3-c32-l23", "t": "緩衝方程式：可逆反應不是消滅酸", "sec": "s4", "slide": 39, "sourceSlides": [39, 40], "sourcePages": [], "src": "原PPT第 39–40 頁；課本 P84", "figSpec": {"image": "buffer"}, "txt": "<ul><li>HCO₃⁻＋H⁺ ⇌ H₂CO₃，並與CO₂＋H₂O的反應連結。</li><li>HPO₄²⁻＋H⁺ ⇌ H₂PO₄⁻；蛋白質的可解離基團也能緩衝。</li><li>緩衝可減小pH改變，但容量有限，不能把所有H⁺永久消滅。</li></ul><p class=\"think\">加入酸後，方程式朝哪邊移動，為什麼仍需要肺與腎？</p><div class=\"scope-note\">保留知識補給站全部文字與三個方程式；蛋白質可解離側鏈也參與，不僅是自由胺基與羧基。</div><div class=\"ex\"><h4>血液緩衝系統（知識補給站）</h4><p>包含三組可逆反應，可吸收或釋出 H⁺。</p></div><div class=\"ex\"><h4>三種系統</h4><ul><li><b>碳酸／碳酸氫根</b>：H₂CO₃ ⇌ HCO₃⁻ + H⁺，是主要調節者；HCO₃⁻ 可與過多的 H⁺ 結合成碳酸。</li><li><b>磷酸根</b>：HPO₄²⁻ + H⁺ ⇌ H₂PO₄⁻（鹼性磷酸鹽 Na₂HPO₄ 與酸性磷酸鹽 NaH₂PO₄）。</li><li><b>蛋白質</b>：血漿蛋白、血紅素的胺基與羧基，可結合或釋出 H⁺。</li></ul></div><div class=\"ex\"><h4>重點</h4><p>太酸時向「結合 H⁺」的方向進行，太鹼時向「釋出 H⁺」的方向進行。可逆反應是調整，不是把酸消滅。</p></div><div class=\"ex\"><h4>深入解說：可逆反應如何「吸收」酸</h4><p>碳酸系統是最重要的：CO₂ ＋ H₂O ⇌ H₂CO₃ ⇌ H⁺ ＋ HCO₃⁻。血液變酸（H⁺ 增加）→ 平衡左移，HCO₃⁻ 與 H⁺ 結合成 H₂CO₃，再變成 CO₂ 由肺排出；血液變鹼（H⁺ 減少）→ 平衡右移，H₂CO₃ 解離釋出 H⁺。磷酸鹽與蛋白質緩衝的邏輯相同。血紅素是血液中最多的蛋白質，也是重要的緩衝者。</p></div><div class=\"ex\"><h4>緩衝系統的限制</h4><ul><li>緩衝容量有限，酸加多了，緩衝劑就用完。</li><li>它只是把 pH 的改變「變小」，並不能讓 pH 完全不變。</li><li>因此必須由肺和腎處理根本問題（移除 CO₂、H⁺）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>加入酸後，方程式朝哪邊移動，為什麼仍需要肺與腎？</p><p><b>答：</b>朝「結合 H⁺」的方向（生成 H₂CO₃ 乃至 CO₂）；因為總酸量沒變，必須靠肺排 CO₂、靠腎排 H⁺，緩衝才能再恢復。</p></div>", "tb": []}, {"id": "b3-c32-l24", "t": "肺與腎：不同出口協同處理酸鹼", "sec": "s4", "slide": 41, "sourceSlides": [41, 42], "sourcePages": [], "src": "原PPT第 41–42 頁；課本 P84", "figSpec": {"image": "buffer"}, "txt": "<ul><li>通氣增加可排出較多CO₂，改變碳酸系統平衡；不是直接把H⁺呼出。</li><li>腎可分泌H⁺、回收及新生HCO₃⁻，配合尿中緩衝物排出淨酸。</li><li>尿液pH與動脈血pH不同；酸性尿液不表示血液一定酸性異常。</li></ul><p class=\"think\">呼吸性與代謝性變化，為何不能只用尿液顏色判斷？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/26-4-acid-base-balance\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>肺（呼吸運動）</h4><ul><li>運動後產生大量 CO₂ → 刺激延腦呼吸中樞 → 呼吸頻率與深度增加 → CO₂ 排出加快 → 酸鹼值回升。</li><li>休息後 CO₂ 產生變慢，呼吸頻率隨之減緩。</li></ul></div><div class=\"ex\"><h4>腎臟</h4><ul><li>血液太酸時，腎小管把血液中過多的 H⁺ <b>分泌</b>到尿液。</li><li>並把 HCO₃⁻ <b>再吸收</b>回血液，中和過多的酸。</li></ul></div><div class=\"ex\"><h4>分工</h4><p>肺處理的是 CO₂（呼吸性），反應快；腎處理的是 H⁺ 與 HCO₃⁻，反應慢但持久。出口不同，兩者協同處理。</p></div><div class=\"ex\"><h4>深入解說：肺與腎的分工</h4><p><b>肺</b>：處理的是<b>揮發性酸</b>——CO₂。呼吸加快 → CO₂ 排出增加 → 碳酸系統平衡左移 → H⁺ 減少 → pH 上升。反應在數分鐘內完成。<b>腎</b>：處理的是<b>非揮發性酸</b>（硫酸、磷酸、乳酸、酮體等）。腎小管上皮細胞把 H⁺ 分泌入尿，同時把濾出的 HCO₃⁻ 回收，並製造新的 HCO₃⁻ 進入血液。反應較慢（數小時到數天），但力量最強。</p></div><div class=\"ex\"><h4>呼吸性與代謝性（補充）</h4><ul><li><b>呼吸性</b>：問題出在 CO₂（如換氣不足 → CO₂ 蓄積 → 酸中毒）。</li><li><b>代謝性</b>：問題出在非揮發性酸或 HCO₃⁻（如腹瀉丟失 HCO₃⁻、糖尿病酮酸中毒）。</li><li>肺與腎互相代償：呼吸性問題由腎臟代償，代謝性問題由肺代償。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>呼吸性與代謝性變化，為何不能只用尿液顏色判斷？</p><p><b>答：</b>因為尿液顏色主要反映水量與色素，與血液 pH 無直接關係；酸鹼狀態要靠血液 pH、PCO₂、HCO₃⁻ 等指標判斷。</p></div>", "tb": []}, {"id": "b3-c32-l25", "t": "原題一：先讀共享題幹與四條流向", "sec": "s5", "slide": 43, "sourceSlides": [43, 44], "sourcePages": [], "src": "原PPT第 43–44 頁；課本 P76–84／原題", "figSpec": {"image": "originalPaths"}, "txt": "<ul><li>原題一與二共用甲、乙、丙、丁的示意圖；粗線代表物質沿路的去向。</li><li>原題一答案A：甲有過濾與分泌；乙部分回收、丙完全回收、丁未被過濾。</li><li>要把跨越屏障、回到管周血與加入管腔三種箭頭分別找出。</li></ul><p class=\"think\">未出現在最終尿液的物質，可以完全沒有被過濾嗎？</p><div class=\"ex\"><h4>原題一（111 分科修訂）</h4><p>腎臟是人體的排泄器官。圖中以甲～丁表示四種物質在腎元中的去向（過濾、再吸收、分泌，最後形成尿液）。下列敘述何者正確？</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 物質甲少量經過濾，其他被分泌至尿液</li><li>(B) 物質乙被過濾後完全被再吸收</li><li>(C) 物質丙被過濾，部分被再吸收</li><li>(D) 物質丁被過濾，但不被分泌</li></ul></div><div class=\"ex\"><h4>答案：(A)</h4><p>先把三種箭頭找出來：跨越過濾屏障、回到管周血、加入管腔。</p></div><div class=\"ex\"><h4>其他選項</h4><ul><li>(B) 乙被過濾後<b>部分</b>再吸收，其餘隨尿液排出。</li><li>(C) 丙被過濾後<b>完全</b>再吸收。</li><li>(D) 丁<b>無法被過濾</b>。</li></ul></div><div class=\"ex\"><h4>深入解說：怎麼「讀」這類流向圖</h4><p>題目用四條粗線（甲、乙、丙、丁）代表四種物質各自的去向。讀圖時，先找出三種箭頭：<b>①穿過過濾屏障</b>（進鮑氏囊）、<b>②回到管周血</b>（再吸收）、<b>③從管周血進管腔</b>（分泌）。再比較每種物質的「進入尿液的粗線」是否有變化：甲在過濾時只有少量，但尿中量很多 → 主要靠分泌補充；乙過濾後有回收 → 部分再吸收；丙過濾後完全回收；丁根本沒有過濾（如大分子蛋白質）。因此 (A) 正確。</p></div><div class=\"ex\"><h4>逐項核對</h4><ul><li>(A) 甲：過濾少量＋分泌 → 正確。</li><li>(B) 乙是「部分」再吸收，不是完全。</li><li>(C) 丙是「完全」再吸收，不是部分。</li><li>(D) 丁未被過濾（因此不談分泌）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>未出現在最終尿液的物質，可以完全沒有被過濾嗎？</p><p><b>答：</b>可以，如血漿蛋白質、血球本來就不過濾；但葡萄糖等也不出現在尿中，原因是過濾後完全被再吸收。要看箭頭，不能只看最後結果。</p></div>", "tb": []}, {"id": "b3-c32-l26", "t": "原題二：用數據處理答案欄的矛盾", "sec": "s5", "slide": 45, "sourceSlides": [45], "sourcePages": [], "src": "原PPT第 45 頁；課本 P76–84／原題", "figSpec": {"image": "PPT45S3"}, "txt": "<ul><li>原PPT答案欄寫A（水），但解析寫僅葡萄糖過濾後完全再吸收。</li><li>依表中葡萄糖180 g／0 g以及丙的流向，解析與資料支持D（葡萄糖）。</li><li>保留原答案欄供核對；本題採討論紀錄，不以矛盾的原答案自動判分。</li></ul><p class=\"think\">先列出矛盾，再說明哪個證據支持你的結論。</p><div class=\"scope-note\">原表：葡萄糖180 g→0 g，Na⁺630 g→3.2 g，尿素50 g→28 g，水183 L→1.8 L（每24小時）。尿素差額是淨回收22 g，不等於已知每一管段的總再吸收量。</div><div class=\"ex\"><h4>原題二</h4><p>物質丙最可能是下表中的哪一種？(A) 水　(B) 尿素　(C) 鈉離子　(D) 葡萄糖</p></div><div class=\"ex\"><h4>表中數據（每天）</h4><ul><li>葡萄糖：過濾 180 g，排泄 0。</li><li>鈉離子：過濾 630 g，排泄 3.2 g。</li><li>尿素：過濾 50 g，排泄 28 g。</li><li>水：過濾 183 L，排泄 1.8 L。</li></ul></div><div class=\"ex g\"><h4>答案與矛盾</h4><p>原簡報答案欄寫 (A)，但同一頁的解析說「選項中僅葡萄糖被過濾後完全被再吸收」，且由原題一可知<b>丙是過濾後完全再吸收</b>。依數據（葡萄糖 180 g → 0）與解析，應選 <b>(D) 葡萄糖</b>；簡報答案欄疑為筆誤，請以教師確認為準。</p></div><div class=\"ex\"><h4>其他選項</h4><ul><li>水：部分再吸收。</li><li>尿素：過濾後仍有大量排出，並非完全回收。</li><li>鈉離子：部分再吸收。</li></ul></div><div class=\"ex\"><h4>深入解說：用數據判斷物質</h4><p>表中四項：<b>葡萄糖</b> 180 g → 0；<b>鈉</b> 630 g → 3.2 g；<b>尿素</b> 50 g → 28 g；<b>水</b> 183 L → 1.8 L。先看「過濾後被回收了多少」：鈉與水被回收了 99% 以上，但尿中仍有少量（部分再吸收）；尿素回收了約 44%（部分）；只有葡萄糖<b>回收到 100%</b>（尿中 0）。題目的丙來自原題一圖，是「過濾後完全再吸收」，所以應為<b>葡萄糖（D）</b>。</p></div><div class=\"ex\"><h4>關於答案欄與解析的差異（誠實說明）</h4><ul><li>原簡報的答案欄寫 (A) 水，但同一頁的解析寫「僅葡萄糖被過濾後完全再吸收」，兩者矛盾。</li><li>從數據（葡萄糖 180 g → 0）與原題一圖可知，丙為完全再吸收，故本頁採 <b>(D) 葡萄糖</b>。</li><li>此為教師確認事項；教學時可讓學生練習「發現矛盾 → 用證據裁定」的思考。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>先列出矛盾，再說明哪個證據支持你的結論。</p><p><b>答：</b>矛盾：答案欄是水，解析卻說葡萄糖。證據：表中葡萄糖過濾後尿中為 0（完全回收），水仍有 1.8 L 排出（部分回收），因此丙＝葡萄糖。</p></div>", "tb": []}, {"id": "b3-c32-l27", "t": "原題三：大量流汗時看多條回饋", "sec": "s5", "slide": 46, "sourceSlides": [46, 47], "sourcePages": [], "src": "原PPT第 46–47 頁；課本 P76–84／原題", "figSpec": {"image": "PPT46S3"}, "txt": "<ul><li>原題答案A、D：交感反應及口渴飲水可協助恢復循環容量與血壓。</li><li>低血壓時腎素通常增加；ADH主要作用不在近曲小管。</li><li>低血容量時ANP不是大量增加，亦不能用排鈉利尿協助保留容量。</li></ul><p class=\"think\">把每個選項的刺激、來源、標的與結果串成完整因果鏈。</p><div class=\"ex\"><h4>原題三（111 分科）</h4><p>一人大量出汗，導致血液滲透壓上升、血量減少、血壓下降。下列敘述哪些正確？（多選）</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 交感神經活性增加，心跳加快，血管收縮，血壓回升</li><li>(B) 腎素濃度下降，減少腎小管對鈉的再吸收，降低血液滲透壓</li><li>(C) 抗利尿素濃度上升，使近曲小管對水的再吸收大量增加</li><li>(D) 下視丘口渴中樞受到刺激，產生飲水行為，增加血量</li><li>(E) 心房排鈉肽濃度上升，抑制腎小管對鈉的再吸收</li></ul></div><div class=\"ex\"><h4>答案：(A)(D)</h4><p>交感反應與飲水都有助於恢復血量與血壓。</p></div><div class=\"ex\"><h4>其他選項</h4><ul><li>(B) 血量減少、血壓下降時，<b>腎素濃度上升</b>，增加鈉與水的再吸收。</li><li>(C) 抗利尿素主要作用於<b>遠曲小管與集尿管</b>，不是近曲小管。</li><li>(E) 血量減少時回心血量下降，心房排鈉肽濃度<b>下降</b>。</li></ul></div><div class=\"ex\"><h4>深入解說：從「失水」寫出完整因果鏈</h4><p>大量出汗 → ①血漿水分減少，滲透壓 ↑ → 下視丘滲透壓受器興奮 → <b>口渴中樞</b>（喝水，增加血量，選項 D）＋ ADH 釋放 ↑（作用在<b>遠曲小管與集尿管</b>）。②血量 ↓、血壓 ↓ → 壓力受器反射 → <b>交感神經興奮</b>：心跳加快、血管收縮、血壓回升（選項 A）。③腎臟灌流 ↓ → <b>腎素 ↑</b> → 血管收縮素 II ↑ → 醛固酮 ↑ → 保鈉保水。④回心血量 ↓ → 心房壁伸展 ↓ → <b>ANP ↓</b>。把每個選項放進這條鏈就能判斷。</p></div><div class=\"ex\"><h4>逐項核對</h4><ul><li>(A) 交感活性增加、心跳加快 → 正確。</li><li>(B) 腎素應<b>上升</b>，且上升後是增加鈉的再吸收。</li><li>(C) ADH 作用於遠曲小管與集尿管，不是近曲小管。</li><li>(D) 口渴中樞受刺激，飲水增加血量 → 正確。</li><li>(E) 血量減少時 ANP 下降，不是上升。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>把每個選項的刺激、來源、標的與結果串成完整因果鏈。</p><p><b>答：</b>以 (C) 為例：刺激＝滲透壓上升；來源＝下視丘合成、後葉釋放 ADH；標的＝遠曲小管與集尿管（不是近曲小管）；結果＝水再吸收增加。這樣就能看出 (C) 的錯誤在標的位置。</p></div>", "tb": []}], "questions": [{"t": "含氮廢物的環境取捨", "q": "每類放兩張卡；同類兩格可交換。", "learn": 1, "tag": "waste", "hint": "從水量、毒性與製造位置比較，不以出口判來源。", "why": "氨可快速稀釋；尿素降低毒性；尿酸較省水但製造成本較高。", "sub": "原PPT第 3–6 頁；課本 P76–77", "refs": [{"src": "waste", "cap": "教材來源圖"}], "legacyQuestion": 1, "kind": "drag", "slots": [{"id": "g0s0", "label": "氨", "group": 0}, {"id": "g0s1", "label": "氨", "group": 0}, {"id": "g1s0", "label": "尿素", "group": 1}, {"id": "g1s1", "label": "尿素", "group": 1}, {"id": "g2s0", "label": "尿酸", "group": 2}, {"id": "g2s1", "label": "尿酸", "group": 2}], "pieces": [{"id": "ag0s0", "label": "毒性高，需大量水", "group": 0}, {"id": "ag0s1", "label": "許多水生動物直接排出", "group": 0}, {"id": "ag1s0", "label": "主要在肝臟轉製", "group": 1}, {"id": "ag1s1", "label": "哺乳類主要含氮廢物", "group": 1}, {"id": "ag2s0", "label": "低溶解度，少水排出", "group": 2}, {"id": "ag2s1", "label": "鳥類、昆蟲等常用形式", "group": 2}], "sol": {"g0s0": "ag0s0", "g0s1": "ag0s1", "g1s0": "ag1s0", "g1s1": "ag1s1", "g2s0": "ag2s0", "g2s1": "ag2s1"}, "pre": {}, "id": "b3-c32-q01"}, {"t": "課本圖貼標籤：人體的泌尿系統", "q": "依課本圖3–5，把標籤放回圖上的編號格：腎臟縱剖面的構造， \n】\n解答\n：\n(\nA)(D)\n \n46", "47": "  \nQuestion\n解析\n：\n(B)\n當人體血量減少、血壓下降時，腎素濃度會上升，增加腎小管對鈉離子及水分的再吸收。\n(C)\n抗利尿素主要作用於遠曲小管與集尿管。\n(E)\n心房排鈉肽主要受回心血量增加影響，其作用為降低循環系統中水分及鈉離子含量，進而降低血壓，血量減少，導致回心血減少，心房排鈉肽濃度下降。\n47"}, "originalCount": 1, "legacyCount": 8, "originalPPTQuestions": {"1": {"answer": ["A"], "setup": "第1、2題為題組。腎臟是人體的排泄器官，腎動脈的血液由入球小動脈進入絲球體的微血管，血液中的小分子可在此經由過濾作用進入腎小管的鮑氏囊中形成過濾液。過濾液中有用物質會被再吸收回體內，進入圍繞在腎小管周圍的微血管，血液中過多或有害的物質則會被腎小管分泌至濾液中，最後形成尿液排泄出體外（如下圖）。【111.分科修訂】", "options": ["物質甲少量經過濾，其他被分泌至尿液", "物質乙被過濾後完全被再吸收", "物質丙被過濾，部分被再吸收", "物質丁被過濾，但不被分泌"]}, "2": {"answerField": "A", "supportedAnswer": "D", "sourceConflict": true, "setup": "第1、2題為題組。腎臟是人體的排泄器官，腎動脈的血液由入球小動脈進入絲球體的微血管，血液中的小分子可在此經由過濾作用進入腎小管的鮑氏囊中形成過濾液。過濾液中有用物質會被再吸收回體內，進入圍繞在腎小管周圍的微血管，血液中過多或有害的物質則會被腎小管分泌至濾液中，最後形成尿液排泄出體外（如下圖）。【111.分科修訂】", "options": ["水", "尿素", "鈉離子", "葡萄糖"]}, "3": {"answer": ["A", "D"], "options": ["交感神經活性增加，使得心跳加快，血管收縮，血壓回升", "血液中腎素的濃度下降，減少腎小管對鈉的再吸收，降低血液滲透壓", "血液中抗利尿素的濃度上升，使近曲小管對水的再吸收大量增加，以增加血量", "下視丘的口渴中樞受到刺激，產生飲水行為，增加血量，血壓回升", "血液中的心房排鈉肽濃度上升，抑制腎小管對鈉的再吸收，降低血液滲透壓"]}}, "references": [{"title": "tubule", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption"}, {"title": "hormone", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/25-8-endocrine-regulation-of-kidney-function"}, {"title": "structure", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney"}, {"title": "acid", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/26-4-acid-base-balance"}]};

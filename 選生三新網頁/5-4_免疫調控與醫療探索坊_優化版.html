const CONTENT={"pptText": {"1": "5\n-4 \n免疫\n失調與排斥\n5-4.1 \n過敏\n5-4.2 \n自體免疫疾病\n5-4.3 \n免疫缺失症\n5-4.4 \n器官移植時的排斥作用", "2": "◆ 常見的免疫失調疾病\n包括\n：\n◇ \n過敏\n◇ 自體\n免疫疾病\n◇ \n免疫\n缺失症\n5\n-4 \n免疫\n失調與排斥\n→ 立即性過敏\n→ 全身性紅斑狼瘡\n→ 類風溼性關節炎\n→ 重症肌無力\n→ 第一型糖尿病\n→ 先天免疫\n缺失\n：\n嚴重\n合併性免疫缺失病（\nSCID\n）\n→ 後天免疫\n缺失\n：\n愛滋病\n（\nAIDS\n）\n配合課本 \nP166", "3": "5-4.1 \n過敏\n◆ \n說明\n：\n人體\n對環境中的某些物質產生\n過度\n的\n免疫\n\n反應\n，造成組織\n發炎\n或器官功能異常的現象\n→ \n例如\n：\n花粉、\n塵蟎\n、\n黴菌\n孢子\n◆ \n過敏原\n：\n引起\n過敏的物質\n◆\n \n類型\n：\n有\n多種不同類型，最\n常見\n\n的\n一類為\n立即性過敏反應\n→ \n例\n如\n：\n海鮮\n過敏症造成\n皮膚\n\n紅腫\n出疹\n花粉過敏症造成鼻塞\n、\n\n涕\n淚不止，甚或氣喘\n配合課本 \nP166\n3", "4": "5-4.1 \n過敏\n初次接觸過敏原\n受體\nB\n 細胞\n過敏原\n漿細胞\n◆\n \n過程\n：\n活化、增生、分化\n配合課本 \nP166\n、\n167", "5": "肥大細胞\n分泌抗體\n附著於肥大細胞上\n不會引起過敏反應\n配合課本 \nP166\n、\n167", "6": "再次接觸相同過敏原\n組織胺等發炎介質\n◇ 肥大細胞釋出組織胺等發炎介質\n◇ \n過敏原與肥大細胞上的抗體結合\n配合課本 \nP166\n、\n167", "7": "引起周圍的微血管擴張、通透性增大，造成紅、熱、腫、痛、癢等類似發炎的症狀\n引起過敏反應\n微血管擴張、通透性增加\n紅疹、水腫、發熱、疼痛\n刺激\n神經元\n\n末梢\n疼痛\n平滑肌收縮\n氣喘\n腺體分泌增加\n涕淚不止\n配合課本 \nP166\n、\n167", "8": "  \n知識補給站\n寄生蟲感染與過敏反應的關係，人體內\n的\n\n寄生蟲\n皆是百害無一益嗎？\n       T\nH\n \n會針對寄生蟲、塵蟎及花粉等過敏原產生反應，若人體長期受到寄生蟲寄生，會\n造成 \nT\nH\n \n反應鈍化\n，再受到過敏原刺激時便不會\n引起 \nT\nH\n \n的強烈反應，而能\n降低過敏反應的症狀\n。\n       感染寄生蟲與自身免疫力高低及過敏率的下降有關，例如\n：\n部分研究顯示感染蠕蟲可減少自身免疫性疾病的症狀，然而儘管在許多動物研究皆已證明此點，但目前於人類的臨床試驗卻尚未發現此益處，造成實際應用缺乏療效的可能原因仍待後續研究。\n配合課本 \nP167\n8", "9": "5-4.2 \n自體免疫疾病\n◆ \n說明\n：\n指\n人體內\n的 \nT \n細胞或抗體攻擊自體的細胞，造成患者組織發炎或壞死的免疫異常反應\n◆ 常見的自體免疫\n疾病\n：\n◇ \n全身性紅斑狼瘡\n▪ 產生抗體對抗自體細胞的核酸與蛋白質\n▪ 引起廣泛性發炎，造成組織損害，通常患者鼻梁和兩頰皮膚會有明顯的蝶形紅斑，俗稱「蝴蝶斑」\n配合課本 \nP168", "10": "◇ \n重症肌無力\n◇ \n類風溼性關節炎\n5-4.2 \n自體免疫疾病\n▪ 產生抗體對抗自體的組織，如膠原蛋白等\n▪ \n造成關節組織的慢性損傷，而逐漸失去運動功能\n▪ 產生與骨骼肌細胞乙醯膽鹼受體結合的抗體\n▪ 干擾乙醯膽鹼的正常作用，而導致肌肉逐漸退化\n配合課本 \nP168\n、\n169", "11": "  \n知識補給站\n先天性糖尿病（第一型糖尿病）\n       醫學上稱先天性糖尿病為\n第一型糖尿病（\nT1D\n）\n，是一種自體免疫疾病，\n常發生於兒童或青少年\n，因此過去也被稱為「幼年型糖尿病」。雖然多在青春期前後發病，但成人也可能罹患。\n       其特徵是患者\n產生對抗\n胰臟 \nβ \n細胞\n的抗體\n。\n β \n細胞可分泌胰島素。\n由於胰島素是調節血糖的關鍵激素，\n當 \nβ \n細胞受損後無法分泌足夠胰島素，最終導致血糖失控而升高。\n配合課本 \nP168\n11", "12": "  \n知識補給站\n先天性糖尿病（第一型糖尿病）\n       第一型糖尿病的病因並非單一因素所致，而是\n遺傳因子\n與\n環境因素\n交互作用的結果。\n       在遺傳層面，已知有超過 \n50 \n種基因與本病有關聯，其中位於第 \n6 \n號染色體上的 \nHLA-DQB1\n \n基因（屬於人類白血球抗原 \nMHC \nⅡ \n分子\n區域）與自體免疫反應密切相關。若有家族病史，特別是父母或兄弟姊妹患病，患病的風險明顯提高。\n        然而，遺傳因素雖影響罹病機率，但並不代表一定會發病，在此環境因子也扮演重要角色。\n12\n配合課本 \nP168", "13": "  \n知識補給站\n先天性糖尿病（第一型糖尿病）\n       第一型糖尿病為一種由自體免疫異常引起、具遺傳傾向的慢性疾病，目前尚無法完全預防，但透過早期診斷與適當的胰島素治療，可有效控制病情，並減少併發症。\n配合課本 \nP168\n13", "14": "5-4.3 \n免疫缺失症\n◆ 分為先天性及後天性兩\n類\n：\n◇ \n先天性免疫缺失\n▪\n 某一型的\n嚴重合併性免疫缺失病（\nSCID\n）\n：\n因\n基因缺失而缺乏某種酵素，導致淋巴球嚴重被破壞而喪失免疫功能\n▪\n 基因缺陷或發育不良\n配合課本 \nP169", "15": "人類免疫缺失症病毒（\nHIV\n）\n◇ \n後天性免疫\n缺失\n▪ \n後天性免疫缺失\n症（愛滋病）\n：\n因\n人類免疫缺失症病毒（\nHIV\n）的感染而造成\n5-4.3 \n免疫缺失症\n▪ 可藉體液傳播給他人\n▪ RNA \n病毒\n▪ 免疫功能喪失，患者易因多種病原體感染或癌症而死亡\n▪ 在人體內會\n侵入 \nT\nH\n、單核球及樹突細胞，並在這些免疫細胞內增殖\n▪ \n藥物、輻射線、癌症或病原體感染\n配合課本 \nP169", "16": "  \n知識補給站\n愛滋病患者容易得一般人不易罹患的疾病\n       當免疫力降低到某一程度時，患者才開始出現一些皮膚、黏膜的病徵，例如\n：\n帶狀皰疹、脂漏性皮膚炎、口腔念珠菌感染、潰瘍性單純皰疹等。當淋巴球數目繼續減少時，可能致命的伺機性感染和腫瘤會接連發生，\n例如\n：\n肺\n囊蟲肺炎、全身性非結核分枝桿菌感染、卡波西氏肉瘤等。\n配合課本 \nP169\n16\nAIDS\n的治療策略", "17": "5-4.4 \n器官移植時的排斥作用\n移植組織或器官\n血管\n新生\n：\n受\n贈者的血管增生至捐贈者的組織或器官內\nT \n細胞辨識捐贈者與受贈者細胞\n表面 \nMHC \n分子的差異\n若有差異則會產生免疫反應\n捐贈者與受贈者的\nMHC \n分子\n差異愈大，排斥作用就愈強\n造成新生血管裂解而於移植區產生凝血塊，使血管新生失敗\n移植組織或器官壞死\n◆\n \n過程\n：\n配合課本 \nP170", "18": "5-4.4 \n器官移植時的排斥作用\n◇ 先\n進行 \nMHC \n分子的篩選\n→ 不同\n器官特質不一，各有其\n規定\n◇ 使用免疫抑制藥物以降低排斥作用\n◆ 提高器官移植的\n成功率\n：\n配合課本 \nP170", "19": "免疫系統\n內分泌\n系統\n神經\n系統\n◆\n \n人體\n的先天性免疫與後天性免疫可單一或彼此\n相互協同\n組合，形成既複雜且多樣化的防禦系統，以清除\n異常\n的細胞或\n物質\n◆\n \n免疫系統\n、\n神經系統\n及\n內分泌系統\n合\n為\n人體協調\n作用的三大主軸，共同維持人體內的\n恆定\n配合課本 \nP170", "20": "  \n腦力激盪\n　\n　\n想一想\n，為什麼輸血時需\n比較 \nABO \n血型，但卻不需比較\nMHC \n分子呢？\n配合課本 \nP170\n答\n：\n排斥作用起因於免疫細胞辨識出移植細胞表面帶有不同的主要組織相容性\n複\n合\n體\n（\nMHC\n），而輸血時，所輸入的紅血球表面不帶有任何\n MHC \n分子，故不會引起排斥作用。\n20", "21": "  \nQuestion\n1\n. \n現代環境中充斥著各種過敏原，許多人深受過敏所苦，下列相關敘述何者正確\n？　\n(\nA)\n首次遭遇過敏原就會發生過敏\n現象　\n(\nB)\n每個人的過敏原不盡\n相同　\n(\nC)\n表面具有過敏原抗體的巨噬細胞接觸過敏原後，會釋出組織胺等發炎\n物質　\n(\nD)\n過敏原一定是生物性的物質。\n解答\n：\n(\nB)\n \n解析\n：\n(\nA)\n第二次接觸過敏原才會發生過敏反應\n。\n(\nC)\n表面具有過敏原抗體的肥大細胞接觸過敏原後，會釋出組織胺等發炎介質\n。\n(\nD)\n非生物性的物質如懸浮微粒、藥物等，也可能引發過敏。\n21", "22": "  \nQuestion\n2. \n下列有關免疫失調的狀況配對，哪些正確\n？　\n(\nA)\n抗體攻擊胰島 \nβ \n細胞\n—\n第一型\n糖尿病　\n(\nB)\n抗體攻擊自身平滑肌\n—\n重症肌\n無力　\n(\nC)\n器官捐贈後的排斥作用\n— B \n細胞產生攻擊移植物之\n抗體　\n(\nD)\n免疫功能低下\n—\n全身性紅斑\n狼瘡　\n(\nE)\n抗體攻擊關節膠原蛋白\n—\n類風溼性關節炎。\n解答\n：\n(\nA)(\nE\n)\n \n解析\n：\n(\nB)\n抗體與骨骼肌的乙醯膽鹼受體結合，干擾乙醯膽鹼作用，導致肌肉逐漸退化。\n(C)\n器官排斥主要是胞毒 \nT \n細胞攻擊移植物的細胞所致\n。\n(\nD)\n免疫功能低下為免疫缺失症，全身性紅斑狼瘡患者則會產生對抗自體細胞核酸及蛋白質的抗體，引起全身性發炎。\n22", "23": "  \nQuestion\n3\n. \n免疫功能缺失是一種致命的病況，下列有關免疫功能缺失的敘述何者正確\n？　\n(\nA)\n後天性免疫功能缺失的患者必定是受到 \nHIV \n的\n感染　\n(\nB)\n缺乏關鍵酵素導致先天性免疫功能缺失的患者完全沒有\n白血球　\n(\nC) HIV \n可感染輔助 \nT \n細胞、單核球及樹突細胞，造成免疫功能\n喪失　\n(\nD)\n患者因免疫功能喪失而直接死亡。\n解答\n：\n(\nC)\n \n解\n析\n：\n(\nA)\n後天免疫功能缺失有可能是感染 \nHIV\n、藥物作用、罹患癌症或者受到輻射線影響\n。\n(\nB)\n缺乏特定酵素的先天性免疫功能缺失患者，其淋巴球遭嚴重破壞而喪失相關功能，其他白血球仍具有功能。\n(D)\n缺乏免疫功能易受到感染或發生癌症而死亡。\n23"}, "lessons": [{"id": "b3-c54-l01", "t": "防禦的界線：失調不只有太弱", "sec": "s1", "slide": 1, "sourceSlides": [1, 2], "sourcePages": [1], "src": "原PPT第 1–2 頁；課本 P166–167", "figSpec": {"image": "PPT02S3"}, "txt": "<ul><li>過敏：對某些原本常見的外來物質產生不適當反應。</li><li>自體免疫：反應指向自身組織；免疫缺失：重要防禦功能不足。</li><li>移植排斥：對外來移植物的反應，未必表示原先免疫功能異常。</li><li>不以一條「免疫力強弱」刻度解釋所有問題；看標的、機制與後果。</li></ul><p class=\"think\">把反應變強，是否就能改善本章每一種狀況？</p><div class=\"ex\"><h4>免疫失調</h4><p>免疫系統負責辨識並清除病原體與體內異常細胞，但<b>失調</b>時反而造成健康問題；失調不只有「太弱」，也有「過強」與「攻錯對象」。</p></div><div class=\"ex\"><h4>三大類</h4><ul><li><b>過敏</b>：對無害物質反應過度。</li><li><b>自體免疫疾病</b>：攻擊自身細胞。</li><li><b>免疫缺失症</b>：免疫功能不足。</li></ul></div><div class=\"ex\"><h4>另加</h4><p>本節最後還談<b>器官移植的排斥作用</b>。</p></div>", "tb": [["BOOK1", "P166 完整課本頁"]]}, {"id": "b3-c54-l02", "t": "過敏原：同樣暴露，不同反應", "sec": "s1", "slide": 3, "sourceSlides": [3], "sourcePages": [], "src": "原PPT第 3 頁；課本 P166–167", "figSpec": {"image": "PPT03S3"}, "txt": "<ul><li>花粉、塵蟎、黴菌及某些食物等可能成為過敏原。</li><li>個體的致敏狀態不同，同樣環境不代表每個人都有同樣過敏原。</li><li>過敏有多種類型；本節重點是IgE與肥大細胞的立即型模型。</li><li>看到症狀或某張照片，不能單憑它判定是哪個過敏原。</li></ul><p class=\"think\">「常見」是否等於「每個人都一定反應」？</p><div class=\"scope-note\"><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK10756/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>過敏</h4><p>人體對環境中某些物質產生<b>過度的免疫反應</b>，造成組織發炎或器官功能異常。引起過敏的物質稱為<b>過敏原</b>。</p></div><div class=\"ex\"><h4>要點</h4><ul><li>例：花粉、塵蟎、黴菌孢子。</li><li>最常見的是<b>立即性過敏反應</b>，如海鮮過敏起疹、花粉症鼻塞流淚甚至氣喘。</li><li>過敏原因人而異；非生物性物質（如懸浮微粒、藥物）也可能引發過敏。</li></ul></div>", "tb": []}, {"id": "b3-c54-l03", "t": "第一次路徑：致敏與抗體附著", "sec": "s1", "slide": 4, "sourceSlides": [4, 5], "sourcePages": [2], "src": "原PPT第 4–5 頁；課本 P166–167", "figSpec": {"image": "allergy"}, "txt": "<ul><li>特定B細胞經活化、增生與分化，漿細胞產生相關抗體。</li><li>本圖立即型模型中，IgE經其受體附著於肥大細胞表面。</li><li>致敏使後續反應具備條件；抗體附著與症狀發生是不同事件。</li><li>B細胞、漿細胞、抗體與肥大細胞不是同一個角色。</li></ul><p class=\"think\">抗體已附著，為何不能只據此判定組織胺已大量釋出？</p><div class=\"scope-note\">適用範圍：原文「首次不會過敏」描述典型IgE致敏與再接觸模型，不可推成第一次注意到某物質就絕不反應；可能已有未察覺暴露或交叉致敏。過敏亦有其他型態。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK10756/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote source-correction\">適用範圍：原文「首次不會過敏」描述典型IgE致敏與再接觸模型，不可推成第一次注意到某物質就絕不反應；可能已有未察覺暴露或交叉致敏。過敏亦有其他型態。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK10756/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a><small>原文閱讀前先看來源校正；原文保留供查對</small></div><div class=\"ex\"><h4>第一次接觸：致敏</h4><p>多數人第一次接觸過敏原時<b>沒有明顯過敏症狀</b>，但免疫系統已在準備。</p></div><div class=\"ex\"><h4>步驟</h4><ul><li>B細胞辨識過敏原，活化、增生、分化為<b>漿細胞</b>。</li><li>漿細胞分泌針對該過敏原的抗體。</li><li>這些抗體附著在皮下或黏膜處<b>肥大細胞</b>的表面。</li></ul></div><div class=\"ex\"><h4>結果</h4><p>此時肥大細胞已「裝好武器」，只等相同過敏原再次出現。</p></div>", "tb": [["BOOK2", "P167 完整課本頁"]]}, {"id": "b3-c54-l04", "t": "再次路徑：交聯、活化與釋放", "sec": "s1", "slide": 6, "sourceSlides": [6], "sourcePages": [], "src": "原PPT第 6 頁；課本 P166–167", "figSpec": {"image": "allergy"}, "txt": "<ul><li>相符過敏原再次進入，可交聯肥大細胞表面的IgE。</li><li>肥大細胞活化與脫顆粒，釋放組織胺等物質。</li><li>組織胺可預先存在顆粒中；其他介質可經新合成，不能把全部都稱為預存。</li><li>反應因組織、暴露方式與個體而異，不由示意圖預測個人的嚴重程度。</li></ul><p class=\"think\">過敏原結合抗體，與介質作用於血管，是哪兩段不同的箭頭？</p><div class=\"scope-note\"><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK27112/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>再次接觸：釋放</h4><p>相同過敏原再度進入，與肥大細胞表面的專一性抗體結合。</p></div><div class=\"ex\"><h4>接著</h4><ul><li>肥大細胞被活化。</li><li>釋出<b>組織胺</b>等發炎介質。</li><li>引發周圍組織的過敏症狀。</li></ul></div><div class=\"ex\"><h4>關鍵</h4><p>是「過敏原＋肥大細胞上的抗體」的結合，才觸發釋放。</p></div>", "tb": []}, {"id": "b3-c54-l05", "t": "組織胺效應：四個組織標的", "sec": "s1", "slide": 7, "sourceSlides": [7], "sourcePages": [], "src": "原PPT第 7 頁；課本 P166–167", "figSpec": {"image": "allergy"}, "txt": "<ul><li>微血管擴張、通透性增加，可導致紅、腫及相關不適。</li><li>刺激神經末梢，可涉及疼痛等感覺。</li><li>平滑肌收縮與腺體分泌，分別可涉及呼吸道收縮與流淚、流鼻水。</li><li>一次反應未必出現圖中的全部症狀，局部示意不等於診斷流程。</li></ul><p class=\"think\">圖中同一介質為何可能造成不同器官的症狀？</p><div class=\"ex\"><h4>組織胺的效應</h4><p>組織胺作用在不同組織，造成不同症狀。</p></div><div class=\"ex\"><h4>四個標的</h4><ul><li><b>微血管</b>：擴張、通透性增大 → 紅疹、水腫、發熱。</li><li><b>神經末梢</b>：受刺激 → 疼痛、癢。</li><li><b>平滑肌</b>：收縮 → 氣喘。</li><li><b>腺體</b>：分泌增加 → 涕淚不止。</li></ul></div><div class=\"ex\"><h4>類比</h4><p>症狀很像發炎：紅、熱、腫、痛、癢。</p></div>", "tb": []}, {"id": "b3-c54-l06", "t": "衛生假說：關聯如何成為證據？", "sec": "s1", "slide": 8, "sourceSlides": [8], "sourcePages": [], "src": "原PPT第 8 頁；課本 P166–167", "figSpec": {"image": "hygiene"}, "txt": "<ul><li>教材討論寄生蟲與免疫調節的可能關係，是解釋性假說的脈絡。</li><li>動物結果不能直接證明在人類有相同淨效益；原文亦指出人體效果尚未證實。</li><li>比較族群過敏率，要檢查年齡、環境、生活條件等替代解釋。</li><li>不能據此主張刻意感染寄生蟲、停止衛生措施，或所有益生菌皆有效。</li></ul><p class=\"think\">若兩地暴露與過敏率不同，還需要哪些資料才支持因果？</p><div class=\"scope-note\">益生菌效果依特定菌株、族群及情境而異，不能從一般假說推為通用療效。<a href=\"https://www.nccih.nih.gov/health/probiotics-usefulness-and-safety\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>知識補給站：寄生蟲與過敏</h4><p>TH會針對寄生蟲、塵蟎及花粉等產生反應。長期受寄生蟲寄生可能使TH反應鈍化，再受過敏原刺激時反應較不強烈。</p></div><div class=\"ex\"><h4>讀法</h4><ul><li>有研究顯示感染蠕蟲與自體免疫症狀減少有關。</li><li>動物研究支持此點，但<b>人體臨床試驗尚未發現療效</b>。</li><li>因此是「值得研究的關聯」，不是「寄生蟲有益」的結論。</li></ul></div><div class=\"ex\"><h4>思考</h4><p>關聯要變成證據，需要控制變因與臨床驗證。</p></div>", "tb": []}, {"id": "b3-c54-l07", "t": "自體免疫：先找錯置的標的", "sec": "s2", "slide": 9, "sourceSlides": [9], "sourcePages": [3], "src": "原PPT第 9 頁；課本 P168–169", "figSpec": {"image": "PPT09S3"}, "txt": "<ul><li>免疫細胞與抗體原有辨識自身及外來的調節機制。</li><li>自體免疫時，反應指向自身成分，可造成組織損傷。</li><li>不同疾病的標的、細胞與效應不同，不用單一抗體模型套遍全部。</li><li>過敏與自體免疫都可能有免疫反應，但標的來源不同。</li></ul><p class=\"think\">判讀自體免疫時，為何先問「攻擊什麼」而不是只問「反應多強」？</p><div class=\"scope-note\">機制補充：自體免疫不是所有案例皆只有抗體單獨作用。第一型糖尿病的重要機制涉及T細胞對β細胞的自體免疫；抗體可作相關標記。類風濕性關節炎涉及多種免疫細胞、訊號及自體抗體，不以「抗膠原抗體」概括全部。<a href=\"https://www.niams.nih.gov/health-topics/autoimmune-diseases\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>；<a href=\"https://www.niddk.nih.gov/health-information/diabetes/overview/what-is-diabetes/type-1-diabetes\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>自體免疫疾病</h4><p>T細胞或抗體攻擊<b>自身的細胞</b>，造成組織發炎或壞死。</p></div><div class=\"ex\"><h4>常見例子</h4><ul><li>全身性紅斑狼瘡</li><li>類風溼性關節炎</li><li>重症肌無力</li><li>第一型糖尿病</li></ul></div><div class=\"ex\"><h4>讀題方法</h4><p>先找「被誤攻擊的標的是什麼」，再配對疾病。</p></div>", "tb": [["BOOK3", "P168 完整課本頁"]]}, {"id": "b3-c54-l08", "t": "紅斑性狼瘡：多器官與多證據", "sec": "s2", "slide": 9, "sourceSlides": [9], "sourcePages": [], "src": "原PPT第 9 頁；課本 P168–169", "figSpec": {"image": "lupus"}, "txt": "<ul><li>教材以核酸與核蛋白相關自體抗體及臉部蝶形紅斑為例。</li><li>全身性紅斑狼瘡可能影響多個器官，表現因人而異。</li><li>蝶形紅斑不是每個患者都有，也不是單靠照片即可確診。</li><li>檢測到某抗體與診斷疾病不是等號，要結合臨床證據。</li></ul><p class=\"think\">一張臉部照片與一項抗體檢驗，能否取代完整判斷？</p><div class=\"scope-note\"><a href=\"https://www.niams.nih.gov/health-topics/lupus\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>全身性紅斑狼瘡</h4><p>患者產生抗體對抗自體細胞的<b>核酸與蛋白質</b>，引起廣泛性發炎，造成多處組織損害。</p></div><div class=\"ex\"><h4>特徵</h4><ul><li>標的廣泛，所以影響多個器官。</li><li>常見鼻梁與兩頰的<b>蝶形紅斑</b>（俗稱蝴蝶斑）。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>它是免疫「過度攻擊自己」，不是免疫缺失。</p></div>", "tb": []}, {"id": "b3-c54-l09", "t": "類風濕性關節炎：炎症網絡", "sec": "s2", "slide": 10, "sourceSlides": [10], "sourcePages": [], "src": "原PPT第 10 頁；課本 P168–169", "figSpec": {"image": "ra"}, "txt": "<ul><li>教材以關節發炎、腫脹及損傷說明自體免疫後果。</li><li>原文的抗膠原蛋白配對是簡化，不能代表所有患者的唯一機制。</li><li>免疫細胞、自體抗體與訊號共同涉及發炎及組織變化。</li><li>照片提供構造與症狀觀察，不提供每一種分子的直接測量。</li></ul><p class=\"think\">由關節變形能直接推知是哪一種抗體單獨造成嗎？</p><div class=\"scope-note\">機制補充：自體免疫不是所有案例皆只有抗體單獨作用。第一型糖尿病的重要機制涉及T細胞對β細胞的自體免疫；抗體可作相關標記。類風濕性關節炎涉及多種免疫細胞、訊號及自體抗體，不以「抗膠原抗體」概括全部。<a href=\"https://www.niams.nih.gov/health-topics/autoimmune-diseases\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>；<a href=\"https://www.niddk.nih.gov/health-information/diabetes/overview/what-is-diabetes/type-1-diabetes\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>類風溼性關節炎</h4><p>患者產生抗體對抗自體組織（如<b>膠原蛋白</b>等），造成關節組織的慢性損傷，逐漸失去運動功能。</p></div><div class=\"ex\"><h4>補充</h4><p>課本以抗體攻擊關節組織作簡化說明；實際涉及多種免疫細胞與訊號分子共同參與的慢性發炎。</p></div>", "tb": []}, {"id": "b3-c54-l10", "t": "重症肌無力：接點傳遞受損", "sec": "s2", "slide": 10, "sourceSlides": [10], "sourcePages": [4], "src": "原PPT第 10 頁；課本 P168–169", "figSpec": {"image": "mg"}, "txt": "<ul><li>本圖模型中，自體抗體影響神經肌肉接點的乙醯膽鹼受體。</li><li>神經發出訊號與肌肉成功接收訊號是兩個步驟。</li><li>眼瞼下垂、易疲倦與無力可作教材現象，但不以照片診斷。</li><li>標的是接點相關分子，不是概括攻擊所有平滑肌。</li></ul><p class=\"think\">神經仍可釋放傳遞物質，為何肌肉回應仍可能受損？</p><div class=\"scope-note\">適用範圍：原文「肌肉逐漸退化」應先釐清主要是神經肌肉接點傳遞受損，造成易疲倦與無力，不能與原發肌肉退化畫等號。ACh受體抗體是本圖模型，亦有其他抗體類型。<a href=\"https://www.ninds.nih.gov/sites/default/files/2025-05/myasthenia-gravis.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">NINDS 重症肌無力</a></div><div class=\"quote source-correction\">適用範圍：原文「肌肉逐漸退化」應先釐清主要是神經肌肉接點傳遞受損，造成易疲倦與無力，不能與原發肌肉退化畫等號。ACh受體抗體是本圖模型，亦有其他抗體類型。<a href=\"https://www.ninds.nih.gov/sites/default/files/2025-05/myasthenia-gravis.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">NINDS 重症肌無力</a><small>原文閱讀前先看來源校正；原文保留供查對</small></div><div class=\"ex\"><h4>重症肌無力</h4><p>患者產生抗體與骨骼肌細胞上的<b>乙醯膽鹼受體</b>結合，干擾乙醯膽鹼的正常作用。</p></div><div class=\"ex\"><h4>結果</h4><ul><li>神經訊號無法有效傳到肌肉。</li><li>肌肉容易疲乏無力，眼瞼下垂（圖5－18）。</li></ul></div><div class=\"ex\"><h4>連結</h4><p>回想神經肌肉接點：乙醯膽鹼要與受體結合，肌肉才會收縮。標的是<b>骨骼肌</b>，不是平滑肌。</p></div>", "tb": [["BOOK4", "P169 完整課本頁"]]}, {"id": "b3-c54-l11", "t": "第一型糖尿病：名稱與β細胞", "sec": "s2", "slide": 11, "sourceSlides": [11], "sourcePages": [], "src": "原PPT第 11 頁；課本 P168–169", "figSpec": {"image": "t1d"}, "txt": "<ul><li>β細胞受自體免疫損傷，可使胰島素產生不足，影響血糖調節。</li><li>第一型可在不同年齡出現，並非「生來就有」的同義詞。</li><li>相關自體抗體可提供證據，但不能把主要機制只寫成抗體單獨攻擊。</li><li>不是所有血糖升高都屬第一型，也不以題目內容作個人診斷。</li></ul><p class=\"think\">「遺傳相關」、「先天存在」與「之後發病」是否同一件事？</p><div class=\"scope-note\">機制補充：自體免疫不是所有案例皆只有抗體單獨作用。第一型糖尿病的重要機制涉及T細胞對β細胞的自體免疫；抗體可作相關標記。類風濕性關節炎涉及多種免疫細胞、訊號及自體抗體，不以「抗膠原抗體」概括全部。<a href=\"https://www.niams.nih.gov/health-topics/autoimmune-diseases\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>；<a href=\"https://www.niddk.nih.gov/health-information/diabetes/overview/what-is-diabetes/type-1-diabetes\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"scope-note\">來源校正：P168／PPT11–13把第一型糖尿病冠上「先天性糖尿病」，兩者不能當同義詞。第一型可在不同年齡發病；遺傳相關不等於出生時即患病，也不等於單一基因決定。原文保留供查對。<a href=\"https://www.niddk.nih.gov/health-information/diabetes/overview/what-is-diabetes/type-1-diabetes\" target=\"_blank\" rel=\"noopener noreferrer\">NIDDK 第一型糖尿病</a></div><div class=\"quote source-correction\">來源校正：P168／PPT11–13把第一型糖尿病冠上「先天性糖尿病」，兩者不能當同義詞。第一型可在不同年齡發病；遺傳相關不等於出生時即患病，也不等於單一基因決定。原文保留供查對。<a href=\"https://www.niddk.nih.gov/health-information/diabetes/overview/what-is-diabetes/type-1-diabetes\" target=\"_blank\" rel=\"noopener noreferrer\">NIDDK 第一型糖尿病</a><small>原文閱讀前先看來源校正；原文保留供查對</small></div><div class=\"ex\"><h4>第一型糖尿病（T1D）</h4><p>一種自體免疫疾病：免疫系統誤攻擊胰臟中製造胰島素的<b>β細胞</b>。</p></div><div class=\"ex\"><h4>要點</h4><ul><li>常見於兒童或青少年，過去稱「幼年型糖尿病」，但成人也可能罹患。</li><li>β細胞受損 → 胰島素分泌不足 → 血糖升高。</li></ul></div><div class=\"ex\"><h4>名稱提醒</h4><p>課本稱「先天性糖尿病」，但它是免疫異常所致，並非出生時就必然發病。</p></div>", "tb": []}, {"id": "b3-c54-l12", "t": "遺傳與環境：風險不是命定", "sec": "s2", "slide": 12, "sourceSlides": [12], "sourcePages": [], "src": "原PPT第 12 頁；課本 P168–169", "figSpec": {"image": "PPT12S3"}, "txt": "<ul><li>教材列HLA-DQB1等基因與第一型糖尿病的關聯。</li><li>關聯代表某些背景下風險不同，不表示每位帶有某型者必定發病。</li><li>多基因與環境共同涉及；原「超過50」為教材描述，不當作永遠固定的最新總數。</li><li>不能把單一位點當成所有疾病或個人的確定預言。</li></ul><p class=\"think\">要從關聯走向機制，需要補上何種比較與作用證據？</p><div class=\"scope-note\">來源校正：P168／PPT11–13把第一型糖尿病冠上「先天性糖尿病」，兩者不能當同義詞。第一型可在不同年齡發病；遺傳相關不等於出生時即患病，也不等於單一基因決定。原文保留供查對。<a href=\"https://www.niddk.nih.gov/health-information/diabetes/overview/what-is-diabetes/type-1-diabetes\" target=\"_blank\" rel=\"noopener noreferrer\">NIDDK 第一型糖尿病</a></div><div class=\"quote source-correction\">來源校正：P168／PPT11–13把第一型糖尿病冠上「先天性糖尿病」，兩者不能當同義詞。第一型可在不同年齡發病；遺傳相關不等於出生時即患病，也不等於單一基因決定。原文保留供查對。<a href=\"https://www.niddk.nih.gov/health-information/diabetes/overview/what-is-diabetes/type-1-diabetes\" target=\"_blank\" rel=\"noopener noreferrer\">NIDDK 第一型糖尿病</a><small>原文閱讀前先看來源校正；原文保留供查對</small></div><div class=\"ex\"><h4>遺傳與環境</h4><p>第一型糖尿病的病因不是單一因素，而是<b>遺傳與環境交互作用</b>。</p></div><div class=\"ex\"><h4>內容</h4><ul><li>已知超過 50 種基因與其相關。</li><li>第 6 號染色體上的 <b>HLA-DQB1</b> 屬於 MHC II 區域，與自體免疫反應密切相關。</li><li>有家族病史者風險較高，但不代表一定發病。</li></ul></div><div class=\"ex\"><h4>結論</h4><p>基因決定「風險」，不是「命運」。</p></div>", "tb": []}, {"id": "b3-c54-l13", "t": "血糖恆定：補充與自我調節", "sec": "s2", "slide": 13, "sourceSlides": [13], "sourcePages": [], "src": "原PPT第 13 頁；課本 P168–169", "figSpec": {"image": "PPT13S3"}, "txt": "<ul><li>缺少胰島素時，補充胰島素可協助血糖管理。</li><li>管理疾病與根除自體免疫原因不同；不把控制良好叫作已治癒。</li><li>原文「無法完全預防」是概括；不同疾病階段與條件的研究，不能推成所有人皆可預防或皆無進展。</li><li>本卡比較調節機制，不提供個人劑量、療程或自行停藥判斷。</li></ul><p class=\"think\">恢復某個調節訊號，是否表示原本的免疫失調機制已全消失？</p><div class=\"scope-note\"><a href=\"https://www.niddk.nih.gov/health-information/diabetes/overview/what-is-diabetes/type-1-diabetes\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>血糖恆定與治療</h4><p>β細胞受損後，身體無法靠自身調節血糖。</p></div><div class=\"ex\"><h4>重點</h4><ul><li>胰島素是調節血糖的關鍵激素。</li><li>目前尚無法完全預防。</li><li>早期診斷加適當的<b>胰島素治療</b>，可有效控制病情、減少併發症。</li></ul></div><div class=\"ex\"><h4>連結</h4><p>這是內分泌恆定被破壞，需外部補充來維持。</p></div>", "tb": []}, {"id": "b3-c54-l14", "t": "SCID：細胞存在與功能分開", "sec": "s3", "slide": 14, "sourceSlides": [14], "sourcePages": [], "src": "原PPT第 14 頁；課本 P169", "figSpec": {"image": "scid"}, "txt": "<ul><li>嚴重複合免疫缺失有不同遺傳類型，重要淋巴球的發育或功能受損。</li><li>關鍵酵素缺陷是教材所選例子，不能套成每種SCID的原因。</li><li>可能有B細胞但抗體功能受限；不是所有白血球完全沒有。</li><li>歷史隔離照片說明當時感染防護處境，不代表現代每種治療與預後。</li></ul><p class=\"think\">白血球總數正常，能否保證所有特定免疫功能都完整？</p><div class=\"scope-note\">適用範圍：SCID有不同遺傳類型；關鍵酵素缺陷是其中一類，不能推成所有病例原因相同或所有白血球皆消失。有些類型可存在B細胞但功能受限；歷史照片不代表現今每位患者的結局。<a href=\"https://pubmed.ncbi.nlm.nih.gov/2670851/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>；<a href=\"https://www.nih.gov/news-events/news-releases/gene-therapy-restores-immunity-infants-rare-immunodeficiency-disease\" target=\"_blank\" rel=\"noopener noreferrer\">NIH 特定類型研究</a></div><div class=\"quote source-correction\">適用範圍：SCID有不同遺傳類型；關鍵酵素缺陷是其中一類，不能推成所有病例原因相同或所有白血球皆消失。有些類型可存在B細胞但功能受限；歷史照片不代表現今每位患者的結局。<a href=\"https://pubmed.ncbi.nlm.nih.gov/2670851/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>；<a href=\"https://www.nih.gov/news-events/news-releases/gene-therapy-restores-immunity-infants-rare-immunodeficiency-disease\" target=\"_blank\" rel=\"noopener noreferrer\">NIH 特定類型研究</a><small>原文閱讀前先看來源校正；原文保留供查對</small></div><div class=\"ex\"><h4>免疫缺失症</h4><p>免疫系統功能不全，常危及生命，分<b>先天性</b>與<b>後天性</b>。</p></div><div class=\"ex\"><h4>先天性</h4><ul><li>由基因缺陷或發育不良造成。</li><li>例：某一型<b>嚴重合併性免疫缺失病（SCID）</b>，因基因缺失而缺乏某種酵素，導致<b>淋巴球</b>嚴重被破壞而喪失免疫功能。</li></ul></div><div class=\"ex\"><h4>小心</h4><p>是「淋巴球功能受損」，不是「完全沒有白血球」；其他白血球仍有功能。</p></div>", "tb": []}, {"id": "b3-c54-l15", "t": "後天免疫缺失：HIV以外的原因", "sec": "s3", "slide": 15, "sourceSlides": [15], "sourcePages": [], "src": "原PPT第 15 頁；課本 P169", "figSpec": {"image": "PPT15S3"}, "txt": "<ul><li>藥物、放射線、癌症及感染等可能使免疫功能降低。</li><li>免疫缺失是功能狀態，不能只用單一感染名稱定義全部。</li><li>判讀題目時分清遺傳發育缺陷與後來的功能損害。</li><li>可能的原因不等於每種暴露必定造成同等程度免疫缺失。</li></ul><p class=\"think\">看到免疫功能不足，還要哪些資料才能判定原因？</p><div class=\"ex\"><h4>後天性免疫缺失的原因</h4><p>多因<b>藥物、輻射線、癌症或病原體感染</b>造成。</p></div><div class=\"ex\"><h4>舉例</h4><ul><li>愛滋病（HIV感染）是其中一種。</li><li>不是所有後天免疫缺失都來自HIV。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>「後天性」不等於「HIV」。</p></div>", "tb": []}, {"id": "b3-c54-l16", "t": "HIV：病程、標的與傳播範圍", "sec": "s3", "slide": 15, "sourceSlides": [15], "sourcePages": [], "src": "原PPT第 15 頁；課本 P169", "figSpec": {"image": "PPT15S3"}, "txt": "<ul><li>HIV是RNA病毒，可涉及輔助T細胞、單核球與樹突細胞等標的。</li><li>HIV感染與AIDS階段不同，後者涉及嚴重免疫損傷或特定機會性感染等條件。</li><li>傳播需特定體液與進入途徑，日常握手、共用餐具等不是傳播方式。</li><li>ART可維持病毒抑制與免疫功能；本章不杜撰每年固定下降數值的病程曲線。</li></ul><p class=\"think\">示意圖看得出細胞標的，能否因此推出每個人的固定病程？</p><div class=\"scope-note\">適用範圍：HIV感染不等於已進入AIDS。傳播需特定含病毒體液與進入途徑，握手、共用餐具等日常接觸不是傳播方式。ART可抑制病毒、維持免疫功能；持續病毒量測不到可防止性傳播（U=U），不等於治癒或可泛推所有路徑。<a href=\"https://hivinfo.nih.gov/understanding-hiv/fact-sheets/stages-hiv-infection\" target=\"_blank\" rel=\"noopener noreferrer\">NIH HIV病程</a>；<a href=\"https://hivinfo.nih.gov/understanding-hiv/fact-sheets/understanding-hiv-transmission\" target=\"_blank\" rel=\"noopener noreferrer\">NIH 傳播範圍</a></div><div class=\"ex\"><h4>HIV 與愛滋病</h4><p>HIV 是 <b>RNA 病毒</b>，可藉體液傳播。</p></div><div class=\"ex\"><h4>機制</h4><ul><li>侵入 <b>TH</b>、<b>單核球</b>及<b>樹突細胞</b>，在其內增殖。</li><li>免疫功能逐漸喪失。</li><li>患者易因多種病原體感染或癌症而死亡。</li></ul></div><div class=\"ex\"><h4>範圍</h4><p>感染HIV不等於已進入愛滋病階段；握手、共用餐具等日常接觸不會傳播。</p></div>", "tb": []}, {"id": "b3-c54-l17", "t": "伺機性感染：缺失與死亡的連結", "sec": "s3", "slide": 16, "sourceSlides": [16], "sourcePages": [], "src": "原PPT第 16 頁；課本 P169", "figSpec": {"image": "opportunistic"}, "txt": "<ul><li>免疫功能降低時，一些平常受控制的微生物可能造成嚴重感染。</li><li>教材列口腔念珠菌、肺囊蟲與非結核分枝桿菌等例子。</li><li>卡波西氏肉瘤屬腫瘤例子，不應歸成細菌感染。</li><li>免疫缺失使感染與部分腫瘤風險增加，不把「缺失本身直接致死」作唯一因果。</li></ul><p class=\"think\">「免疫功能受損→感染／腫瘤→嚴重後果」比省略中間步驟多說明了什麼？</p><div class=\"scope-note\">適用範圍：HIV感染不等於已進入AIDS。傳播需特定含病毒體液與進入途徑，握手、共用餐具等日常接觸不是傳播方式。ART可抑制病毒、維持免疫功能；持續病毒量測不到可防止性傳播（U=U），不等於治癒或可泛推所有路徑。<a href=\"https://hivinfo.nih.gov/understanding-hiv/fact-sheets/stages-hiv-infection\" target=\"_blank\" rel=\"noopener noreferrer\">NIH HIV病程</a>；<a href=\"https://hivinfo.nih.gov/understanding-hiv/fact-sheets/understanding-hiv-transmission\" target=\"_blank\" rel=\"noopener noreferrer\">NIH 傳播範圍</a></div><div class=\"ex\"><h4>伺機性感染</h4><p>免疫力降低到某程度，原本不易致病的微生物也會造成疾病。</p></div><div class=\"ex\"><h4>階段</h4><ul><li>先出現皮膚、黏膜症狀（帶狀皰疹、口腔念珠菌感染等）。</li><li>淋巴球繼續減少，出現肺囊蟲肺炎、卡波西氏肉瘤等可能致命的感染與腫瘤。</li></ul></div><div class=\"ex\"><h4>重點</h4><p>患者多是死於這些感染或腫瘤，而非免疫失去功能本身「直接」致死。</p></div>", "tb": []}, {"id": "b3-c54-l18", "t": "移植排斥：外來標的與損傷", "sec": "s4", "slide": 17, "sourceSlides": [17], "sourcePages": [5], "src": "原PPT第 17 頁；課本 P170", "figSpec": {"image": "PPT17S3"}, "txt": "<ul><li>移植物含捐贈者成分，接受者的免疫反應可辨識不同的組織相容性訊息。</li><li>原圖以血管與組織損傷、血栓及壞死串起排斥後果。</li><li>T細胞相關及抗體媒介機制皆可能參與，依情境與時間不同。</li><li>排斥未必表示免疫缺失；也不能把所有器官灌流恢復方式畫成相同。</li></ul><p class=\"think\">原圖的因果鏈在哪些情境適用，哪個步驟需要限定？</p><div class=\"scope-note\">適用範圍：原圖的新生血管流程是一種移植物模型；具血管的實體器官移植可藉血管吻合恢復灌流，不是都等待新生血管長入。移植排斥有T細胞與抗體相關機制，不能限為胞毒T單一路徑。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK10750/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>；<a href=\"https://pubmed.ncbi.nlm.nih.gov/32538534/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote source-correction\">適用範圍：原圖的新生血管流程是一種移植物模型；具血管的實體器官移植可藉血管吻合恢復灌流，不是都等待新生血管長入。移植排斥有T細胞與抗體相關機制，不能限為胞毒T單一路徑。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK10750/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>；<a href=\"https://pubmed.ncbi.nlm.nih.gov/32538534/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a><small>原文閱讀前先看來源校正；原文保留供查對</small></div><div class=\"ex\"><h4>移植排斥</h4><p>移植的組織或器官被受贈者免疫系統視為外來物而攻擊，最終壞死。</p></div><div class=\"ex\"><h4>過程</h4><ul><li>移植初期進行<b>血管新生</b>。</li><li>T細胞辨識捐贈者與受贈者細胞表面 <b>MHC</b> 的差異。</li><li>產生免疫反應 → 新生血管裂解、形成凝血塊 → 移植物壞死。</li></ul></div><div class=\"ex\"><h4>規則</h4><p>MHC 差異越大，排斥越強。</p></div>", "tb": [["BOOK5", "P170 完整課本頁"]]}, {"id": "b3-c54-l19", "t": "HLA配對：降低風險的條件", "sec": "s4", "slide": 18, "sourceSlides": [18], "sourcePages": [], "src": "原PPT第 18 頁；課本 P170", "figSpec": {"image": "PPT18S3"}, "txt": "<ul><li>人類MHC稱HLA；多型性使不同人的組合常有差異。</li><li>並非每個人的每個HLA都必定不同；親屬、相同型別及同卵雙胞胎要分清。</li><li>配對的重要程度與考量依器官及情境而異。</li><li>相近配對可降低某些風險，不保證零排斥或取代全部臨床評估。</li></ul><p class=\"think\">若配對接近卻仍有排斥，是否就推翻配對的價值？</p><div class=\"scope-note\"><a href=\"https://www.niddk.nih.gov/health-information/kidney-disease/kidney-failure/kidney-transplant\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>降低排斥：配對</h4><p>MHC 是細胞的辨識標記，每個人都不同。</p></div><div class=\"ex\"><h4>做法</h4><ul><li>手術前篩選 MHC（HLA）盡量與患者相似的捐贈者。</li><li>不同器官有不同規定。</li></ul></div><div class=\"ex\"><h4>限制</h4><p>配對只能降低風險，不是消除排斥。</p></div>", "tb": []}, {"id": "b3-c54-l20", "t": "免疫抑制：移植物與防禦的平衡", "sec": "s4", "slide": 18, "sourceSlides": [18], "sourcePages": [], "src": "原PPT第 18 頁；課本 P170", "figSpec": {"image": "PPT18S3"}, "txt": "<ul><li>降低免疫反應可協助維持移植物，亦可能提高感染等風險。</li><li>保留移植物與維持防禦是需共同考量的目標。</li><li>不能把藥物名稱當成所有人的固定方案，也不因風險自行停用。</li><li>本卡以教學機制討論權衡，治療安排需按個別情況評估。</li></ul><p class=\"think\">同樣降低免疫反應，為何在移植與免疫缺失情境有不同意義？</p><div class=\"scope-note\"><a href=\"https://www.niddk.nih.gov/health-information/kidney-disease/kidney-failure/kidney-transplant\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>免疫抑制藥物</h4><p>使用藥物降低免疫反應，減少排斥。</p></div><div class=\"ex\"><h4>取捨</h4><p>抑制太多會削弱對感染與腫瘤的防禦，因此要在「保住移植物」與「保留防禦力」之間平衡。</p></div>", "tb": []}, {"id": "b3-c54-l21", "t": "腦力激盪：ABO與MHC別混用", "sec": "s4", "slide": 20, "sourceSlides": [20], "sourcePages": [], "src": "原PPT第 20 頁；課本 P170", "figSpec": {"image": "PPT20S3"}, "txt": "<ul><li>保留原「輸血為何重ABO、器官移植重MHC」題與原答。</li><li>討論成熟紅血球時，ABO等抗原與典型MHC表現須分清。</li><li>紅血球仍可引起抗體媒介溶血；無典型MHC不等於無免疫反應。</li><li>血小板、白血球與其他血液成分不能全部套用成熟紅血球的說法。</li></ul><p class=\"think\">以哪一種血液成分為範圍，才能精確使用原答？</p><div class=\"scope-note\">適用範圍：原答須限定於成熟紅血球的主要特徵，不涵蓋所有血液成分。成熟紅血球無典型MHC表現，但ABO等抗原仍可能造成免疫性溶血反應；血小板與白血球亦涉及HLA。不能推成輸血絕無免疫反應。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK2265/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>；<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK538218/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote source-correction\">適用範圍：原答須限定於成熟紅血球的主要特徵，不涵蓋所有血液成分。成熟紅血球無典型MHC表現，但ABO等抗原仍可能造成免疫性溶血反應；血小板與白血球亦涉及HLA。不能推成輸血絕無免疫反應。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK2265/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>；<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK538218/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a><small>原文閱讀前先看來源校正；原文保留供查對</small></div><div class=\"ex\"><h4>腦力激盪：輸血為何不比 MHC</h4><p>排斥作用起因於免疫細胞辨識到移植細胞表面不同的 MHC。</p></div><div class=\"ex\"><h4>推理</h4><ul><li>輸血輸入的<b>紅血球表面沒有 MHC 分子</b>。</li><li>因此不需要比較 MHC。</li><li>但紅血球表面有 ABO 抗原，所以要比對 ABO。</li></ul></div><div class=\"ex\"><h4>重點</h4><p>ABO 與 MHC 是兩套不同的辨識系統。</p></div>", "tb": []}, {"id": "b3-c54-l22", "t": "恆定：免疫、神經與內分泌協調", "sec": "s4", "slide": 19, "sourceSlides": [19], "sourcePages": [], "src": "原PPT第 19 頁；課本 P170", "figSpec": {"image": "PPT19S3"}, "txt": "<ul><li>免疫系統與神經、內分泌系統共同涉及內部狀態的調節。</li><li>防禦既要有作用，也要有限制與適時停止，避免損傷自身。</li><li>機制與後果要有證據，不能把「維持恆定」當成任何反應都必然有益。</li><li>本章回看四個問題：反應對象、作用者、條件與後果。</li></ul><p class=\"think\">你如何用同一組四個問題比較過敏、自體免疫與移植？</p><div class=\"ex\"><h4>三大協調系統</h4><p>先天性與後天性免疫可單獨或協同作用，形成複雜的防禦系統。</p></div><div class=\"ex\"><h4>三大主軸</h4><ul><li>免疫系統</li><li>神經系統</li><li>內分泌系統</li></ul></div><div class=\"ex\"><h4>總結</h4><p>三者合作，共同維持人體的恆定。</p></div>", "tb": []}, {"id": "b3-c54-l23", "t": "原題一：過敏的情境限定", "sec": "s5", "slide": 21, "sourceSlides": [21], "sourcePages": [], "src": "原PPT第 21 頁；課本 P166–170／原題", "figSpec": {"image": "PPT21S3"}, "txt": "<ul><li>保留完整原題、四個選項、B答案及解析。</li><li>B指出個體過敏原可不同；C將肥大細胞錯寫成巨噬細胞。</li><li>首次接觸的說法需採典型IgE致敏模型，而非第一次察覺暴露的保證。</li></ul><p class=\"think\">哪一選項的核心不依賴「一定、首次」等過度絕對用語？</p><div class=\"scope-note\">適用範圍：原文「首次不會過敏」描述典型IgE致敏與再接觸模型，不可推成第一次注意到某物質就絕不反應；可能已有未察覺暴露或交叉致敏。過敏亦有其他型態。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK10756/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote source-correction\">適用範圍：原文「首次不會過敏」描述典型IgE致敏與再接觸模型，不可推成第一次注意到某物質就絕不反應；可能已有未察覺暴露或交叉致敏。過敏亦有其他型態。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK10756/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a><small>原文閱讀前先看來源校正；原文保留供查對</small></div><div class=\"ex\"><h4>原題一</h4><p>答案 <b>(B)</b>：每個人的過敏原不盡相同。</p></div><div class=\"ex\"><h4>逐項</h4><ul><li>(A) 典型是第二次接觸才發生；此說法只適用於典型致敏模型，不能推成絕對。</li><li>(B) 正確。</li><li>(C) 應是<b>肥大細胞</b>而非巨噬細胞。</li><li>(D) 非生物性物質如懸浮微粒、藥物也可能引發過敏。</li></ul></div>", "tb": []}, {"id": "b3-c54-l24", "t": "原題二：教材配對與現代機制", "sec": "s5", "slide": 22, "sourceSlides": [22], "sourcePages": [], "src": "原PPT第 22 頁；課本 P166–170／原題", "figSpec": {"image": "PPT22S3"}, "txt": "<ul><li>完整保留原題五個選項與A、E答案，不改成另一份原題。</li><li>原解析用胞毒T為移植排斥主軸；但抗體媒介排斥亦存在。</li><li>因此這一題改作來源判讀紀錄，不用舊答案自動判定現代機制的對錯。</li><li>比較A、C、E：疾病配對能提示案例，機制不能只剩唯一細胞或抗體。</li></ul><p class=\"think\">如何同時保持來源忠實與機制正確，而不默默改寫原答案？</p><div class=\"scope-note\">機制補充：自體免疫不是所有案例皆只有抗體單獨作用。第一型糖尿病的重要機制涉及T細胞對β細胞的自體免疫；抗體可作相關標記。類風濕性關節炎涉及多種免疫細胞、訊號及自體抗體，不以「抗膠原抗體」概括全部。<a href=\"https://www.niams.nih.gov/health-topics/autoimmune-diseases\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>；<a href=\"https://www.niddk.nih.gov/health-information/diabetes/overview/what-is-diabetes/type-1-diabetes\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"scope-note\">來源校正：PPT22原第2題答案A、E保留。但C「B細胞產生攻擊移植物之抗體」不能在現代免疫學中一概判錯，因為有抗體媒介排斥；A、E亦為教材的簡化配對。本題改作不自動評分的來源判讀，原答案與解析仍可查對。<a href=\"https://pubmed.ncbi.nlm.nih.gov/32538534/\" target=\"_blank\" rel=\"noopener noreferrer\">移植中的B細胞與抗體機制</a>；<a href=\"https://www.niddk.nih.gov/health-information/diabetes/overview/what-is-diabetes/type-1-diabetes\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"quote source-correction\">來源校正：PPT22原第2題答案A、E保留。但C「B細胞產生攻擊移植物之抗體」不能在現代免疫學中一概判錯，因為有抗體媒介排斥；A、E亦為教材的簡化配對。本題改作不自動評分的來源判讀，原答案與解析仍可查對。<a href=\"https://pubmed.ncbi.nlm.nih.gov/32538534/\" target=\"_blank\" rel=\"noopener noreferrer\">移植中的B細胞與抗體機制</a>；<a href=\"https://www.niddk.nih.gov/health-information/diabetes/overview/what-is-diabetes/type-1-diabetes\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a><small>原文閱讀前先看來源校正；原文保留供查對</small></div><div class=\"ex\"><h4>原題二（多選）</h4><p>原答案為 <b>(A)(E)</b>，以下是逐項說明。</p></div><div class=\"ex\"><h4>逐項</h4><ul><li>(A) 抗體攻擊胰島β細胞：配對第一型糖尿病。</li><li>(B) 重症肌無力的標的是骨骼肌上的乙醯膽鹼受體。</li><li>(C) 原解析以胞毒T細胞為排斥主軸。</li><li>(D) 免疫功能低下是免疫缺失；紅斑狼瘡是自體免疫。</li><li>(E) 抗體攻擊關節膠原蛋白：配對類風溼性關節炎。</li></ul></div><div class=\"ex g\"><h4>機制補充</h4><p>現代研究顯示：第一型糖尿病也涉及T細胞；移植排斥也可有抗體參與。上述答案是依教材簡化模型作答。</p></div>", "tb": []}, {"id": "b3-c54-l25", "t": "原題三：缺失的原因與後果", "sec": "s5", "slide": 23, "sourceSlides": [23], "sourcePages": [], "src": "原PPT第 23 頁；課本 P166–170／原題", "figSpec": {"image": "PPT23S3"}, "txt": "<ul><li>完整保留原題、C答案及解析。</li><li>後天缺失不一定由HIV；部分酵素型缺陷不等於完全沒有白血球。</li><li>HIV細胞標的包含原題所列TH、單核球及樹突細胞。</li><li>歷史題幹「致命」不能當成每位現代患者必然死亡的預言。</li></ul><p class=\"think\">哪個選項把原因、細胞種類與致死後果錯連在一起？</p><div class=\"scope-note\">適用範圍：SCID有不同遺傳類型；關鍵酵素缺陷是其中一類，不能推成所有病例原因相同或所有白血球皆消失。有些類型可存在B細胞但功能受限；歷史照片不代表現今每位患者的結局。<a href=\"https://pubmed.ncbi.nlm.nih.gov/2670851/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>；<a href=\"https://www.nih.gov/news-events/news-releases/gene-therapy-restores-immunity-infants-rare-immunodeficiency-disease\" target=\"_blank\" rel=\"noopener noreferrer\">NIH 特定類型研究</a>；適用範圍：HIV感染不等於已進入AIDS。傳播需特定含病毒體液與進入途徑，握手、共用餐具等日常接觸不是傳播方式。ART可抑制病毒、維持免疫功能；持續病毒量測不到可防止性傳播（U=U），不等於治癒或可泛推所有路徑。<a href=\"https://hivinfo.nih.gov/understanding-hiv/fact-sheets/stages-hiv-infection\" target=\"_blank\" rel=\"noopener noreferrer\">NIH HIV病程</a>；<a href=\"https://hivinfo.nih.gov/understanding-hiv/fact-sheets/understanding-hiv-transmission\" target=\"_blank\" rel=\"noopener noreferrer\">NIH 傳播範圍</a></div><div class=\"ex\"><h4>原題三</h4><p>答案 <b>(C)</b>：HIV 可感染輔助T細胞、單核球及樹突細胞。</p></div><div class=\"ex\"><h4>逐項</h4><ul><li>(A) 後天免疫缺失也可因藥物、癌症、輻射線。</li><li>(B) 只是淋巴球受損，其他白血球仍有功能。</li><li>(C) 正確。</li><li>(D) 是因免疫喪失導致感染或癌症而死亡，不是直接死亡。</li></ul></div>", "tb": []}], "questions": [{"t": "過敏：分清三類角色", "q": "每欄放兩張卡，依典型IgE路徑分類。", "learn": 2, "tag": "allergy", "hint": "將產生、附著與效應分開。", "why": "B路徑產生抗體，肥大細胞帶有表面IgE並可釋放介質，介質作用於不同組織。", "sub": "原PPT第 4–5 頁；課本 P166–167", "refs": [{"src": "allergy", "cap": "教材來源圖"}], "legacyQuestion": 1, "kind": "drag", "slots": [{"id": "g0s0", "label": "B／漿細胞路徑", "group": 0}, {"id": "g0s1", "label": "B／漿細胞路徑", "group": 0}, {"id": "g1s0", "label": "肥大細胞", "group": 1}, {"id": "g1s1", "label": "肥大細胞", "group": 1}, {"id": "g2s0", "label": "效應與條件", "group": 2}, {"id": "g2s1", "label": "效應與條件", "group": 2}], "pieces": [{"id": "ag0s0", "label": "特定B經活化可擴增與分化", "group": 0}, {"id": "ag0s1", "label": "漿細胞產生相關抗體", "group": 0}, {"id": "ag1s0", "label": "表面受體可結合IgE", "group": 1}, {"id": "ag1s1", "label": "活化後可脫顆粒", "group": 1}, {"id": "ag2s0", "label": "組織胺可作用於血管等組織", "group": 2}, {"id": "ag2s1", "label": "再次相符暴露可觸發效應", "group": 2}], "sol": {"g0s0": "ag0s0", "g0s1": "ag0s1", "g1s0": "ag1s0", "g1s1": "ag1s1", "g2s0": "ag2s0", "g2s1": "ag2s1"}, "pre": {}, "id": "b3-c54-q01"}, {"t": "HIV感染等於AIDS嗎？", "q": "何者最精確？", "learn": 15, "tag": "hiv", "hint": "分清病原感染與疾病階段。", "why": "病程有條件與個體差異，感染不等於已達嚴重免疫損傷的AIDS階段。", "sub": "原PPT第 15 頁；課本 P169", "refs": [{"src": "PPT15S3", "cap": "教材來源圖"}], "legacyQuestion": 4, "kind": "single", "opts": [{"t": "HIV感染者必定當天已是AIDS", "ok": false, "tag": "hiv"}, {"t": "感染與AIDS階段不同，ART可抑制病毒並維持免疫功能", "ok": true, "tag": "hiv"}, {"t": "每人每年CD4皆下降固定數量", "ok": false, "tag": "hiv"}, {"t": "HIV只可能進入一種細胞", "ok": false, "tag": "hiv"}], "id": "b3-c54-q04"}, {"t": "第一次察覺接觸", "q": "有人說第一次注意到花粉就出現症狀，何者合理？", "learn": 2, "tag": "allergy", "hint": "第一次注意到與免疫學首次接觸不同。", "why": "可見接觸史不必等於完整免疫暴露史，仍需資料。", "sub": "原PPT第 4–5 頁；課本 P166–167", "refs": [{"src": "allergy", "cap": "教材來源圖"}], "kind": "single", "opts": [{"t": "因此所有致敏模型都錯誤", "ok": false, "tag": "allergy"}, {"t": "因此第一次任何暴露必定過敏", "ok": false, "tag": "allergy"}, {"t": "足以確診所有過敏原", "ok": false, "tag": "allergy"}, {"t": "可能已有未察 ct-sheets/stages-hiv-infection\" target=\"_blank\" rel=\"noopener noreferrer\">NIH HIV病程</a>；<a href=\"https://hivinfo.nih.gov/understanding-hiv/fact-sheets/understanding-hiv-transmission\" target=\"_blank\" rel=\"noopener noreferrer\">NIH 傳播範圍</a>"}, {"pages": [170], "ppt": [17], "note": "適用範圍：原圖的新生血管流程是一種移植物模型；具血管的實體器官移植可藉血管吻合恢復灌流，不是都等待新生血管長入。移植排斥有T細胞與抗體相關機制，不能限為胞毒T單一路徑。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK10750/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>；<a href=\"https://pubmed.ncbi.nlm.nih.gov/32538534/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>"}, {"pages": [170], "ppt": [20], "note": "適用範圍：原答須限定於成熟紅血球的主要特徵，不涵蓋所有血液成分。成熟紅血球無典型MHC表現，但ABO等抗原仍可能造成免疫性溶血反應；血小板與白血球亦涉及HLA。不能推成輸血絕無免疫反應。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK2265/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>；<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK538218/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>"}, {"pages": [168, 170], "ppt": [22], "note": "來源校正：PPT22原第2題答案A、E保留。但C「B細胞產生攻擊移植物之抗體」不能在現代免疫學中一概判錯，因為有抗體媒介排斥；A、E亦為教材的簡化配對。本題改作不自動評分的來源判讀，原答案與解析仍可查對。<a href=\"https://pubmed.ncbi.nlm.nih.gov/32538534/\" target=\"_blank\" rel=\"noopener noreferrer\">移植中的B細胞與抗體機制</a>；<a href=\"https://www.niddk.nih.gov/health-information/diabetes/overview/what-is-diabetes/type-1-diabetes\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>"}]};

for(const id of ['l-prev','fs-prev'])el(id).onclick=()=>LI>0&&showLearn(LI-1);for(const id of ['l-next','fs-next'])el(id).onclick=()=>LI<LEARN.length-1&&showLearn(LI+1);
el('related-slide').onclick=()=>openShow(DECK.findIndex(d=>d[1]===+(LEARN[LI].src.match(/第 (\d+)/)?.[1]||1)));
el('hint-toggle').setAttribute('aria-haspopup','dialog');el('hint-toggle').onclick=()=>{el('hint-toggle').setAttribute('aria-expanded','true');const d=openDialog('思考提示',`<p>${esc(STAGES[QI].hint)}</p>`);d.addEventListener('close',()=>el('hint-toggle').setAttribute('aria-expanded','false'),{once:true});};el('reference-btn').onclick=()=>openReferences(STAGES[QI]);el('question-learn').onclick=()=>{returnQuestion=true;navigate('learn',STAGES[QI].learn)};el('q-jump').onchange=e=>showQuestion(+e.target.value);el('prev-btn').onclick=()=>QI>0&&showQuestion(QI-1);el('skip-btn').onclick=()=>QI<STAGES.length-1?showQuestion(QI+1):navigate('done');el('check-btn').onclick=check;el('reset-btn').onclick=resetQuestion;el('finish-btn').onclick=()=>navigate('done');
el('shsel').innerHTML=[...new Set(DECK.map(d=>d[1]))].map(n=>`<option value="${n}">第 ${n} 頁 · ${esc(DECK.find(d=>d[1]===n)[2].slice(0,22))}</option>`).join('');el('shsel').onchange=e=>{showStopPlay();SI=DECK.findIndex(d=>d[1]===+e.target.value);showRender();};el('shprev').onclick=()=>showStep(-1);el('shnext').onclick=()=>showStep(1);el('shplay').onclick=()=>{if(SPLAY)showStopPlay();else{if(SI===DECK.length-1)SI=0;showRender();SPLAY=setInterval(()=>{if(SI>=DECK.length-1){showStopPlay();return;}SI++;showRender()},2600);el('shplay').textContent='⏸ 暫停';}};el('shfs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else el('show').requestFullscreen?.().catch(()=>{el('shfs').textContent='此瀏覽器不支援原生全螢幕'})};el('shclose').onclick=()=>navigate('intro');
el('theme-toggle').onclick=()=>{ST.theme=ST.theme==='dark'?'light':'dark';applyPreferences();save();};el('font-toggle').onclick=()=>{ST.font=(ST.font+1)%3;applyPreferences();save();fit();};function applyPreferences(){document.documentElement.dataset.theme=ST.theme;document.documentElement.style.setProperty('--text',[20,22,24][ST.font]+'px');document.documentElement.dataset.font=ST.font;el('theme-toggle').setAttribute('aria-pressed',String(ST.theme==='dark'));el('font-toggle').title='文字大小 '+[20,22,24][ST.font]+'px';}
document.addEventListener('fullscreenchange',fullscreenSync);document.addEventListener('keydown',e=>{if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(document.querySelector('dialog[open]'))return;const fs=document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation');if(fs){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();if(LI>0)showLearn(LI-1);}else if(e.key==='Escape')exitLearnFullscreen();return;}if(PAGE==='show'){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();showStep(1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();showStep(-1);}else if(e.key==='Escape')navigate('intro');else if(e.key==='Home'){SI=0;showRender()}else if(e.key==='End'){SI=DECK.length-1;showRender()}return;}if(PAGE==='learn'&&el('flip')){if(e.key==='ArrowRight'){e.preventDefault();flipStop();flipShow(FI+1)}if(e.key==='ArrowLeft'){e.preventDefault();flipStop();flipShow(FI-1)}}});
el('learn-stage').addEventListener('contextmenu',e=>{if(document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation')){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1)}});
window.addEventListener('resize',fit);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){flipStop();showStopPlay();save();}});new ResizeObserver(fit).observe(el('bar'));
el('slide-text').onclick=()=>{const page=DECK[SI][1],correction=CONTENT.sourceCorrections.find(x=>x.ppt.includes(page));openDialog('原PPT第'+page+'頁原文',`${correction?'<div class="scope-note">'+correction.note+'</div>':''}<p>${esc(CONTENT.pptText[page])}</p>`);};el('hero-image').src=IMG.allergy;el('video-external').href=typeof VIDEO_VIEW_URL!=='undefined'?VIDEO_VIEW_URL:VIDEO_SRC;applyPreferences();const start=['learn','play','done'].includes(ST.page)?ST.page:'intro';navigate(start);if(!saving)storageNotice();
</script></body></html>

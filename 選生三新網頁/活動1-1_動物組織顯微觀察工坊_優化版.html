const CONTENT={"lessons": [{"id": "b3-a11-l01", "t": "觀察任務：用特徵建立分類", "sec": "s1", "slide": 1, "sourceSlides": [], "sourcePages": [1], "src": "課本P21", "figSpec": {"image": "step_001"}, "txt": "<h3>觀察與判讀</h3><ul><li>比較形狀、排列、間距、細胞核位置與數量。</li><li>同一器官可能同時包含多種組織。</li><li>先記錄可見特徵，再提出組織名稱與功能推論。</li></ul><p class=\"thinking\"><strong>想一想</strong> 一個深染小點，是否已足以判定細胞種類？</p><div class=\"ex\"><h4>前言與目的</h4><p>科學家解剖比較發現，親緣關係相近的動物有共通性；顯微鏡與組織切片技術讓觀察深入到<b>細胞層次</b>。</p></div><div class=\"ex\"><h4>本活動目的</h4><ul><li>用顯微鏡觀察動物組織的細胞。</li><li>比較各種組織細胞的異同。</li><li>學習辨別不同組織的細胞形態。</li></ul></div><div class=\"ex\"><h4>原理</h4><p>組織細胞的形態常與功能相關。歸納分類時，可從<b>細胞形態、細胞間的連接與排列關係</b>著手。</p></div><div class=\"ex\"><h4>深入解說：為什麼要用特徵分類</h4><p>組織是「形態與功能相近的細胞群，加上它們分泌的細胞間質」。動物有四大基本組織：<b>上皮、結締、肌肉、神經</b>。在顯微鏡下分辨它們，要依序看：① 細胞形狀與大小；② 排列方式（一層或多層、平行或散亂）；③ 細胞間距與間質多寡；④ 細胞核的數量與位置。同一器官常含多種組織，所以一張切片要分區判讀。</p></div><div class=\"ex\"><h4>先描述，後判讀</h4><ul><li>描述：長條、緊密排列、核偏邊緣。</li><li>判讀：這是骨骼肌／上皮。</li><li>推論：功能是收縮／覆蓋。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>一個深染小點，足以判定細胞種類嗎？</p><p><b>答：</b>不足以。深染可能是細胞核，也可能是色素、雜質或切面偏差，要結合細胞形態、排列與位置才能判斷。</p></div>", "tb": [["step_001", "P21完整課本頁"]]}, {"id": "b3-a11-l02", "t": "先低倍定位，再高倍找證據", "sec": "s1", "slide": 3, "sourceSlides": [], "sourcePages": [3], "src": "課本P23", "figSpec": {"image": "step_003"}, "txt": "<h3>觀察與判讀</h3><ul><li>低倍先掃描標本，選擇薄而清楚的代表視野。</li><li>轉高倍前將目標置中，轉換後以細調節輪對焦。</li><li>保留低倍位置圖與高倍特徵圖，避免失去器官脈絡。</li></ul><p class=\"thinking\"><strong>想一想</strong> 高倍看到一小塊上皮，怎樣知道它位在管腔哪一側？</p><div class=\"ex\"><h4>活動一：永久玻片標本的觀察</h4><p>步驟：將玻片置於載物臺，先觀察同一標本的不同組織，再找另一玻片中是否有相似特徵的組織。</p></div><div class=\"ex\"><h4>觀察重點（低倍、高倍都要看）</h4><ul><li>細胞的<b>形態</b>與<b>排列方式</b></li><li>細胞<b>間距</b></li><li><b>細胞核數量</b>與位置（中央或邊緣）</li></ul></div><div class=\"ex\"><h4>記錄</h4><p>畫下並描述觀察結果。</p></div><div class=\"ex\"><h4>深入解說：顯微鏡操作的順序</h4><p>① 低倍（4× 或 10×）：視野大、容易找到目標與整體結構；② 把要看的部位移到視野中央；③ 轉到高倍（40×），只用<b>細調節輪</b>對焦，避免壓壞玻片；④ 必要時調光圈。先低倍後高倍，能保留器官脈絡，知道高倍看到的小區域位於整張切片的哪裡。</p></div><div class=\"ex\"><h4>記錄兩種圖</h4><ul><li>低倍位置圖：器官輪廓、層次。</li><li>高倍特徵圖：單一細胞形態與核。</li><li>兩者並列，才能回溯。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>高倍看到一小塊上皮，怎樣知道它在管腔哪一側？</p><p><b>答：</b>先用低倍看整體：上皮通常位於管腔面（腔側）。回到低倍確認方向，再轉高倍看特徵。</p></div>", "tb": [["step_003", "P23完整課本頁"]]}, {"id": "b3-a11-l03", "t": "測微器：格數不是實際長度", "sec": "s1", "slide": 2, "sourceSlides": [], "sourcePages": [2], "src": "課本P22", "figSpec": {"image": "calibration"}, "txt": "<h3>觀察與判讀</h3><ul><li>目鏡測微器的刻度先以已知長度的載物臺測微器校正。</li><li>每格長度取決於當時的物鏡與光學設定。</li><li>載物臺測微器每格長度以器材標示為準，不一律假設10 μm。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若只記錄「細胞長8格」，缺少哪個換算資訊？</p><div class=\"scope-note\">校正例題為新增教學模型；不是課本原圖，也不是學生實測數據。</div><div class=\"ex\"><h4>量測細胞大小</h4><p>觀察形態後，利用<b>顯微測量技術</b>量測細胞大小，記錄在探討活動紀錄簿。</p></div><div class=\"ex\"><h4>器材</h4><p>需要<b>目鏡測微器</b>與<b>載物臺測微器</b>。目鏡格數要先用載物臺測微器校正，才能換算成實際長度。</p></div><div class=\"ex\"><h4>深入解說：兩把尺的關係</h4><p><b>載物臺測微器</b>是已知長度的標準尺（本身刻度每格長度標示在器材上，常見為 10 μm）；<b>目鏡測微器</b>是裝在目鏡內的尺，格距沒有固定長度，會隨物鏡倍率而變。所以必須用載物臺測微器去「校正」目鏡測微器，求出在該物鏡下每格代表多少 μm。</p></div><div class=\"ex\"><h4>常見錯誤</h4><ul><li>忘記校正就直接用格數。</li><li>換了物鏡仍沿用舊的校正值。</li><li>以為載物臺測微器每格一律 10 μm（以器材標示為準）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>若只記錄「細胞長 8 格」，缺少什麼資訊？</p><p><b>答：</b>缺少「每格的實際長度（校正值）」以及是在哪個物鏡倍率下量的。</p></div>", "tb": [["step_002", "P22完整課本頁"]]}, {"id": "b3-a11-l04", "t": "校正例題：從格數換成μm", "sec": "s1", "slide": 2, "sourceSlides": [], "sourcePages": [2], "src": "課本P22", "figSpec": {"image": "calibration"}, "txt": "<h3>觀察與判讀</h3><ul><li>例題：20個載物臺小格，每格10 μm，與50個目鏡格對齊。</li><li>目鏡每格＝20×10÷50＝4 μm。</li><li>同一設定下，細胞跨7.5格，估計長度＝7.5×4＝30 μm。</li></ul><p class=\"thinking\"><strong>想一想</strong> 換物鏡後，能直接沿用4 μm／格嗎？</p><div class=\"scope-note\">校正值只適用於校正時的光學組合。新增數值供練習，實驗時填自己校正和量測的結果。</div><div class=\"ex\"><h4>如何換算</h4><p>器材清單中的兩種測微器要搭配使用。</p></div><div class=\"ex\"><h4>步驟</h4><ul><li>找兩把尺的刻度對齊的位置。</li><li>用載物臺測微器的已知長度，求出目鏡每格的實際長度。</li><li>細胞佔幾格 × 每格長度 ＝ 細胞大小。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>每換一個物鏡倍率，都要重新校正。</p></div><div class=\"ex\"><h4>深入解說：換算的邏輯</h4><p>把兩尺對齊，找到兩處刻度同時重合的位置：載物臺 20 格＝ 20 × 10 μm ＝ 200 μm，對應目鏡 50 格 → 每格 ＝ 200 ÷ 50 ＝ <b>4 μm</b>。再量細胞佔 7.5 格 → 7.5 × 4 ＝ 30 μm。（此為教學模型的數字，實驗請填自己校正與量測的結果。）每換一個物鏡倍率，視野內的對應關係改變，必須重新校正。</p></div><div class=\"ex\"><h4>步驟</h4><ul><li>① 對齊兩尺並找到重合處。</li><li>② 算出目鏡每格 μm。</li><li>③ 量細胞所佔格數。</li><li>④ 格數 × 每格 μm。</li><li>⑤ 換物鏡要重做①②。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>換物鏡後，能直接沿用 4 μm／格嗎？</p><p><b>答：</b>不行。放大倍率改變，目鏡每格對應的實際長度也變了，要重新用載物臺測微器校正。</p></div>", "tb": [["step_002", "P22完整課本頁"]]}, {"id": "b3-a11-l05", "t": "觀察紀錄：描述與解釋分欄", "sec": "s1", "slide": 3, "sourceSlides": [], "sourcePages": [3], "src": "課本P23", "figSpec": {"image": "step_003"}, "txt": "<h3>觀察與判讀</h3><ul><li>記錄標本名稱、物鏡／總倍率、校正值、量測方向與單位。</li><li>描述可寫「長條、平行、核偏邊緣」；組織名稱屬判讀。</li><li>選多個細胞與視野，記錄範圍及不確定性，不編造數值。</li></ul><p class=\"thinking\"><strong>想一想</strong> 如果一個切面看不到細胞核，是否代表該細胞沒有核？</p><div class=\"ex\"><h4>怎麼記錄</h4><p>探討活動紀錄簿要記錄觀察的結果。</p></div><div class=\"ex\"><h4>建議欄位</h4><ul><li>標本名稱、物鏡倍率</li><li>畫圖與文字描述</li><li>量測結果（格數、校正值、實際長度）</li></ul></div><div class=\"ex\"><h4>分開寫</h4><p>「看到什麼」是描述；「這是哪種組織」是判讀，兩者要分開。</p></div><div class=\"ex\"><h4>深入解說：好的紀錄像證據表</h4><p>每筆紀錄至少包括：標本名稱、物鏡與總放大倍率、校正值、量測方向（長軸／短軸）、單位、樣本數。繪圖要有標示線；描述用中性語言（「長條、平行排列、核位於邊緣」），組織名稱（「骨骼肌」）屬於判讀，另開一欄。不編造數值：沒測到就寫「待測」。</p></div><div class=\"ex\"><h4>描述與判讀欄</h4><ul><li>描述：我看到…</li><li>判讀：因此我認為…</li><li>不確定：還需要…</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>一個切面看不到細胞核，是否代表該細胞沒有核？</p><p><b>答：</b>不一定。切片是薄的平面，可能剛好切過細胞沒有核的部位，所以同一細胞類型要看多個細胞與視野。</p></div>", "tb": [["step_003", "P23完整課本頁"]]}, {"id": "b3-a11-l06", "t": "小腸低倍：由腔面找壁層", "sec": "s2", "slide": 4, "sourceSlides": [], "sourcePages": [4], "src": "課本P24", "figSpec": {"image": "p1_lab_intestinal"}, "txt": "<h3>觀察與判讀</h3><ul><li>先辨識管腔方向與向腔面突出的絨毛。</li><li>依原圖標示比較黏膜層、黏膜下層、平滑肌層與外層位置。</li><li>一個器官的壁有上皮、結締與肌肉等組織共同構成。</li></ul><p class=\"thinking\"><strong>想一想</strong> 為什麼不能把整張小腸切片稱為單一上皮組織？</p><div class=\"ex\"><h4>小腸</h4><p>小腸由內而外分為<b>黏膜層、黏膜下層、平滑肌、漿膜層</b>（圖中所標示），其中黏膜層向腔面突出形成<b>小腸絨毛</b>。</p></div><div class=\"ex\"><h4>觀察重點</h4><p>注意細胞的排列有什麼特色？絨毛表面是一層排列整齊的上皮細胞。</p></div><div class=\"ex\"><h4>深入解說：從腔面往外讀層次</h4><p>小腸壁由內向外：<b>黏膜層</b>（上皮＋固有層，向腔突出成絨毛）、<b>黏膜下層</b>（疏鬆結締組織、血管）、<b>肌肉層</b>（內環肌、外縱肌，平滑肌）、<b>漿膜層</b>（外層結締與間皮）。先找管腔，再由管腔往外依序核對。一個器官的壁由多種組織共同組成，不是單一組織。</p></div><div class=\"ex\"><h4>讀圖提醒</h4><ul><li>先辨管腔方向。</li><li>絨毛向腔面突出。</li><li>層次名稱依原圖標示核對。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>為什麼不能把整張小腸切片稱為單一上皮組織？</p><p><b>答：</b>因為小腸壁含上皮、結締、平滑肌等多種組織，只有絨毛表面那一層是上皮。</p></div>", "tb": [["step_004", "P24完整課本頁"]]}, {"id": "b3-a11-l07", "t": "絨毛與微絨毛：分清尺度", "sec": "s2", "slide": 4, "sourceSlides": [], "sourcePages": [4], "src": "課本P24", "figSpec": {"image": "p1_lab_intestinal"}, "txt": "<h3>觀察與判讀</h3><ul><li>小腸絨毛是含上皮與結締組織的組織層級突起。</li><li>微絨毛是個別上皮細胞頂端的微細突起；不是小腸絨毛內又一層細胞。</li><li>光鏡可辨刷狀緣整體，不能把影像放大當成已解析每根微絨毛。</li></ul><p class=\"thinking\"><strong>想一想</strong> 兩種突起都增大表面積，是否代表它們是同一層級？</p><div class=\"ex\"><h4>小腸絨毛上皮細胞</h4><p>小腸絨毛表面有一層上皮細胞，細胞排列緊密。</p></div><div class=\"ex\"><h4>注意</h4><p>絨毛是組織層級的突起；微絨毛是上皮細胞頂端更細小的突起，兩者尺度不同。</p></div><div class=\"ex\"><h4>深入解說：兩個「絨毛」尺度</h4><p><b>小腸絨毛</b>：由上皮和內部的結締組織（含微血管、乳糜管）構成的手指狀突起，長約 0.5–1 mm，光鏡下清楚可見；<b>微絨毛</b>：絨毛上皮細胞頂端的更細小突起（約 1 μm 長），光鏡下只見模糊的「刷狀緣」，要用電子顯微鏡才能看到每根。兩者一起大幅增加吸收表面積。</p></div><div class=\"ex\"><h4>層級對照</h4><ul><li>組織層級：小腸絨毛。</li><li>細胞層級：微絨毛。</li><li>工具：光學顯微鏡 vs 電子顯微鏡。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>兩種突起都增大表面積，是否為同一層級？</p><p><b>答：</b>不是。絨毛是組織層級的突起，微絨毛是單一細胞頂端的突起，尺度差一千倍左右。</p></div>", "tb": [["step_004", "P24完整課本頁"]]}, {"id": "b3-a11-l08", "t": "骨骼肌：橫紋、排列與核位", "sec": "s2", "slide": 4, "sourceSlides": [], "sourcePages": [4], "src": "課本P24", "figSpec": {"image": "p2_lab_skeletal_muscle"}, "txt": "<h3>觀察與判讀</h3><ul><li>縱切纖維多呈平行長條，可尋找與長軸垂直的橫紋。</li><li>成熟骨骼肌纖維多核，核通常位於周邊。</li><li>單一薄切面不一定包含每個核；橫切面也不直接顯示縱向橫紋。</li></ul><p class=\"thinking\"><strong>想一想</strong> 看不到橫紋，是切面、解析度問題，還是就能判為平滑肌？</p><div class=\"ex\"><h4>骨骼肌</h4><p>觀察項目：是否能觀察到<b>橫紋</b>，以及<b>細胞核位於何處</b>。</p></div><div class=\"ex\"><h4>特徵</h4><ul><li>細胞呈長條形、平行排列。</li><li>具橫紋。</li><li>細胞核多位於細胞邊緣。</li></ul></div><div class=\"ex\"><h4>深入解說：骨骼肌的辨識線索</h4><p>縱切時，骨骼肌纖維呈<b>平行長條</b>，可見與長軸垂直的<b>橫紋</b>（暗帶與明帶，來自肌節中肌絲排列）；一條肌纖維是<b>多核</b>細胞，核位於<b>細胞邊緣</b>（靠近細胞膜）。橫切時變成許多多邊形的圓點，不顯示橫紋。心肌也有橫紋但核位於中央、有分支與間盤；平滑肌無橫紋、核在中央。</p></div><div class=\"ex\"><h4>三種肌肉的核位</h4><ul><li>骨骼肌：多核，核在邊緣。</li><li>心肌：單核（或雙核），核在中央，有分支與間盤。</li><li>平滑肌：單核，核在中央，紡錘形。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>看不到橫紋，就能判為平滑肌嗎？</p><p><b>答：</b>不能。可能是橫切、失焦或解析度不足，需要結合縱切面、核位與排列判斷。</p></div>", "tb": [["step_004", "P24完整課本頁"]]}, {"id": "b3-a11-l09", "t": "脂肪：邊緣細胞核與製片空白", "sec": "s2", "slide": 5, "sourceSlides": [], "sourcePages": [5], "src": "課本P25", "figSpec": {"image": "p3_lab_adipose"}, "txt": "<h3>觀察與判讀</h3><ul><li>白色脂肪細胞的大脂滴將細胞質與核推向邊緣。</li><li>常規石蠟處理可抽提出脂質，留下淡染或空白輪廓。</li><li>空白外觀不表示活細胞內原本沒有物質。</li></ul><p class=\"thinking\"><strong>想一想</strong> 染色、脫水與透明化如何影響最後看到的影像？</p><div class=\"ex\"><h4>脂肪組織</h4><p>觀察項目：細胞核位於何處？</p></div><div class=\"ex\"><h4>討論題</h4><p>與大部分細胞相比，脂肪細胞的核多位於<b>邊緣</b>。可能原因：細胞中央的大脂滴把細胞質與細胞核推擠到邊緣。</p></div><div class=\"ex\"><h4>深入解說：脂肪細胞的外觀</h4><p>白色脂肪細胞的細胞質被一個大<b>脂滴</b>佔據，細胞核與少量細胞質被擠到邊緣，呈「戒指狀」。標準組織切片製作過程用酒精、二甲苯處理，會溶掉脂質，所以脂滴位置在切片上看起來是空白淡染的輪廓。空白不代表活細胞裡原本沒有東西。</p></div><div class=\"ex\"><h4>製片步驟的影響</h4><ul><li>固定→脫水（酒精）→透明化（二甲苯）→包埋→切片→染色。</li><li>脂質在脫水與透明化時被抽提。</li><li>若要保留脂質，需用冰凍切片與脂溶性染劑（延伸）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>染色、脫水與透明化如何影響影像？</p><p><b>答：</b>它們會改變細胞體積、抽提脂質、改變顏色與對比，所以切片看到的影像是「處理後的樣貌」，需考慮製程影響。</p></div>", "tb": [["step_005", "P25完整課本頁"]]}, {"id": "b3-a11-l10", "t": "神經元：本體、核與突起", "sec": "s2", "slide": 5, "sourceSlides": [], "sourcePages": [5], "src": "課本P25", "figSpec": {"image": "p4_lab_neuron"}, "txt": "<h3>觀察與判讀</h3><ul><li>由較大的細胞本體、核及向外突起辨識神經元候選。</li><li>細小深染核不全都可只憑顏色認成神經膠細胞。</li><li>單一切片可能截斷突起，不能只憑長短便確定軸突或樹突。</li></ul><p class=\"thinking\"><strong>想一想</strong> 要確認一條突起的身分，還需要哪些連續位置或標記？</p><div class=\"scope-note\">尼氏體與蛋白質合成相關；不能說所有神經傳導物質都直接由粗糙內質網製造。</div><div class=\"ex\"><h4>脊髓灰質的神經細胞</h4><p>觀察項目：能否觀察到<b>許多突起</b>？</p></div><div class=\"ex\"><h4>特徵</h4><ul><li>細胞本體較大。</li><li>有細胞核。</li><li>向外延伸許多突起。</li></ul></div><div class=\"ex\"><h4>深入解說：神經元的辨識</h4><p>脊髓灰質的運動神經元是多極神經元：<b>細胞本體大</b>、細胞核大而淡染、核仁明顯，細胞質含<b>尼氏體</b>（粗糙內質網與核糖體聚集，染色嗜鹼性，與蛋白質合成旺盛有關），向外伸出多個<b>突起</b>（樹突與一條軸突）。周圍較小、核深染的細胞多為神經膠細胞，但不能只憑顏色判斷。</p></div><div class=\"ex\"><h4>突起的辨認</h4><ul><li>切片可能切斷突起。</li><li>要確認軸突或樹突，需連續切片或特殊染色。</li><li>單一切面看不到全貌。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>要確認一條突起是軸突，還需要什麼？</p><p><b>答：</b>需要追蹤它自細胞本體起的完整路徑（軸丘、髓鞘、末梢），或用特定標記物，單一切面通常不夠。</p></div>", "tb": [["step_005", "P25完整課本頁"]]}, {"id": "b3-a11-l11", "t": "氣管全圖：沿引線核對位置", "sec": "s2", "slide": 6, "sourceSlides": [], "sourcePages": [6], "src": "課本P26", "figSpec": {"image": "p5_fig"}, "txt": "<h3>觀察與判讀</h3><ul><li>先從低倍管腔與壁層定位，再沿原圖引線到a、b、c。</li><li>a為軟骨細胞所在區；b為脂肪細胞；c為管腔側上皮。</li><li>軟骨與脂肪都屬結締組織；同屬一類仍可有不同細胞形態。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若只背「氣管有平滑肌」，能否把圖中的b或c直接寫成肌肉？</p><div class=\"scope-note\">以本張原圖標籤為準：a軟骨、b脂肪、c上皮。器官中存在某種組織，不等於指定子圖拍到該組織。</div><div class=\"ex\"><h4>討論題三：氣管橫切</h4><p>下圖為不同倍率下的氣管橫切構造，要根據前面歸納的各組織細胞特性，判斷圖中 a～c 含有哪種組織細胞。</p></div><div class=\"ex\"><h4>做法</h4><p>先看低倍整體定位，再沿引線到高倍的 a、b、c，對照前面觀察到的細胞特徵。</p></div><div class=\"ex\"><h4>深入解說：氣管壁的組織</h4><p>氣管壁由內而外：<b>黏膜</b>（假複層纖毛柱狀上皮，含杯狀細胞）→ <b>黏膜下層</b>（疏鬆結締、腺體）→ <b>軟骨層</b>（C 形透明軟骨環，維持管腔不塌陷）→ 外膜。軟骨與脂肪都屬<b>結締組織</b>，但細胞形態不同。圖中 a、b、c 以原圖標籤為準：a 軟骨、b 脂肪、c 上皮。</p></div><div class=\"ex\"><h4>讀圖步驟</h4><ul><li>低倍：管腔→各層。</li><li>沿引線到 a、b、c。</li><li>每格寫「是什麼」＋「根據什麼」。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>若只背「氣管有平滑肌」，能把圖中的 b 或 c 直接寫成肌肉嗎？</p><p><b>答：</b>不能。器官裡含有某組織，不代表指定子圖拍到該組織，要依該子圖的細胞形態與位置判讀。</p></div>", "tb": [["step_006", "P26完整課本頁"]]}, {"id": "b3-a11-l12", "t": "氣管a、b、c：名稱要有證據", "sec": "s2", "slide": 6, "sourceSlides": [], "sourcePages": [6], "src": "課本P26", "figSpec": {"pair": ["trachea-a", "trachea-b", "trachea-c"]}, "txt": "<h3>觀察與判讀</h3><ul><li>a：細胞位在豐富基質中，可見陷窩／細胞群，支持軟骨判讀。</li><li>b：大而淡染的細胞輪廓、核偏邊緣，支持脂肪組織判讀。</li><li>c：腔面有緊密細胞層，核高度不一，可配合位置判讀氣管上皮。</li></ul><p class=\"thinking\"><strong>想一想</strong> 兩個15 μm比例尺相同，代表細胞種類一定相同嗎？</p><div class=\"ex\"><h4>判斷與依據</h4><p>要寫出「是什麼」與「根據什麼」。</p></div><div class=\"ex\"><h4>可用的證據</h4><ul><li>細胞形態與大小</li><li>排列與間距</li><li>細胞核的位置與數量</li><li>所在的位置（靠管腔或在壁內）</li></ul></div><div class=\"ex\"><h4>深入解說：三個區域的證據</h4><p><b>a（軟骨）</b>：細胞位在豐富的間質（基質）中，成小群或單獨位於「陷窩」中，細胞間距大；<b>b（脂肪）</b>：細胞大而圓、淡染輪廓，核被擠到邊緣，細胞間距小；<b>c（上皮）</b>：靠管腔側，細胞緊密排列、幾乎無間質，核大小不一，高度不齊（假複層）。</p></div><div class=\"ex\"><h4>寫證據的句型</h4><ul><li>「因為…（形態），所以…（組織）」。</li><li>引用的特徵要能在圖上指出來。</li><li>比例尺相同不代表細胞種類相同。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>兩個 15 μm 比例尺相同，代表細胞種類一定相同嗎？</p><p><b>答：</b>不是。比例尺只說明放大倍率一致；種類要看形態、排列、核位與位置。</p></div>", "tb": [["step_006", "P26完整課本頁"]]}, {"id": "b3-a11-l13", "t": "新鮮切片：薄而透光的取材", "sec": "s3", "slide": 7, "sourceSlides": [], "sourcePages": [7], "src": "課本P27", "figSpec": {"image": "p6_lab_fresh_prep"}, "txt": "<h3>觀察與判讀</h3><ul><li>依課本選雞胸軟骨邊緣可透光處，取少量薄片。</li><li>以載玻片處理標本；載物臺測微器不是切片或染色平台。</li><li>染劑量、吸水與封片依教師示範及實際材料狀態操作。</li></ul><p class=\"thinking\"><strong>想一想</strong> 取到大塊組織，比薄片更容易看清楚細胞嗎？</p><div class=\"ex\"><h4>活動二：新鮮切片標本</h4><p>步驟一：選雞胸軟骨邊緣<b>可透光處</b>，用刀片切取少許薄片。</p></div><div class=\"ex\"><h4>接著</h4><ul><li>放在載玻片上，加 1 滴<b>亞甲藍液</b>。</li><li>用吸水紙吸乾，蓋上蓋玻片。</li><li>將標本置於顯微鏡下觀察。</li></ul></div><div class=\"ex\"><h4>深入解說：為什麼取邊緣薄片</h4><p>顯微鏡是靠光線穿過標本成像，所以標本一定要<b>薄而透光</b>。雞胸軟骨（透明軟骨）邊緣較薄，用刀片刮取少許薄片即可；放在載玻片上，加 1 滴亞甲藍（鹼性染劑，使細胞核染成藍色），用吸水紙吸去多餘染液，再蓋上蓋玻片避免氣泡。載物臺測微器是量尺，不是製片平台。</p></div><div class=\"ex\"><h4>操作順序</h4><ul><li>取材（薄、透光）。</li><li>置於載玻片。</li><li>加 1 滴亞甲藍。</li><li>吸乾多餘液體。</li><li>蓋上蓋玻片（斜蓋避免氣泡）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>取到大塊組織，比薄片更容易看清楚細胞嗎？</p><p><b>答：</b>不會。太厚光線透不過，細胞層層重疊，反而模糊；薄片才容易看到單層細胞。</p></div>", "tb": [["step_007", "P27完整課本頁"]]}, {"id": "b3-a11-l14", "t": "刀片與染劑：安全也是技術", "sec": "s3", "slide": 7, "sourceSlides": [], "sourcePages": [7], "src": "課本P27", "figSpec": {"image": "p6_lab_fresh_prep"}, "txt": "<h3>觀察與判讀</h3><ul><li>在教師示範與監督下，以穩固支撐及固定材料的方式切取。</li><li>手指、身體與他人均避開刀刃行進方向，不朝身體或手指運刀。</li><li>握持非刀刃端；用後依教室規範收進銳器容器，染劑避免接觸眼口。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若材料在手中滑動，下一步應繼續用力還是先停止固定？</p><div class=\"ex\"><h4>器材與安全</h4><p>每組使用單面刀片、鑷子、滴管、吸水紙；染劑為亞甲藍液。</p></div><div class=\"ex\"><h4>提醒</h4><p>單面刀片有刀刃，要在老師示範與監督下使用，手指避開刀刃方向。</p></div><div class=\"ex\"><h4>深入解說：安全是實驗技術的一部分</h4><p>① 刀片只在教師示範與監督下使用；② 切取方向遠離手指與身體；③ 握持非刀刃端；④ 材料滑動時先停下來重新固定，而不是用力硬切；⑤ 用後依規定放入銳器收集容器。亞甲藍染劑也要避免接觸眼睛與口，沾到皮膚用水沖洗。</p></div><div class=\"ex\"><h4>安全檢查</h4><ul><li>刀刃朝向哪裡？</li><li>手指是否在刀路徑上？</li><li>材料是否穩固？</li><li>廢棄物是否分類？</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>材料在手中滑動，下一步該繼續用力還是先停止？</p><p><b>答：</b>先停止並重新固定材料，再繼續。用力硬切容易讓刀片偏移而受傷。</p></div>", "tb": [["step_007", "P27完整課本頁"]]}, {"id": "b3-a11-l15", "t": "排錯：厚度、光線與染色分開", "sec": "s3", "slide": 7, "sourceSlides": [], "sourcePages": [7], "src": "課本P27", "figSpec": {"image": "p6_lab_fresh_prep"}, "txt": "<h3>觀察與判讀</h3><ul><li>影像太暗先確認照明、對焦、薄厚與染色，不只把亮度開到最大。</li><li>厚片可改選更薄邊緣；染色不均、氣泡與失焦應分別處理。</li><li>調整光圈會改變對比與解析條件，不是越小或越大永遠越好。</li></ul><p class=\"thinking\"><strong>想一想</strong> 怎樣每次只調一個條件，才能知道改善原因？</p><div class=\"ex\"><h4>取材要點</h4><p>邊緣可透光處才夠薄，光線才能穿透看清楚細胞。</p></div><div class=\"ex\"><h4>小提醒</h4><p>若太厚、染色不均或有氣泡，影像就不清楚；應重新選更薄的部位。</p></div><div class=\"ex\"><h4>深入解說：一次只改一個條件</h4><p>影像不清楚時，可能的原因有：照明不足、對焦不準、標本太厚、染色不均、有氣泡。排錯要<b>一次只調一個條件</b>：先對焦、再調光圈／亮度、再檢查標本。光圈縮小會增加對比與景深，但降低解析度與亮度，不是越小或越大越好。</p></div><div class=\"ex\"><h4>排錯清單</h4><ul><li>看起來很暗：照明、光圈、標本太厚。</li><li>邊緣模糊：對焦。</li><li>有圓圈氣泡：蓋玻片蓋法。</li><li>顏色不均：染劑量與時間。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>怎樣每次只調一個條件，才能知道改善原因？</p><p><b>答：</b>改變一個條件後立即觀察並記錄結果，有改善才確認該條件是原因；同時改多個條件就無法歸因。</p></div>", "tb": [["step_007", "P27完整課本頁"]]}, {"id": "b3-a11-l16", "t": "新鮮軟骨：核、細胞與間質", "sec": "s3", "slide": 8, "sourceSlides": [], "sourcePages": [8], "src": "課本P28", "figSpec": {"image": "p7_lab_cartilage_obs"}, "txt": "<h3>觀察與判讀</h3><ul><li>先低倍定位，再高倍描述核、細胞輪廓、排列與間質。</li><li>核染得較深有助辨認，不等於深染程度可直接當作細胞活性。</li><li>新鮮、染色或未脫水，不代表已驗證每個細胞仍存活。</li></ul><p class=\"thinking\"><strong>想一想</strong> 要證明細胞存活，僅有一張亞甲藍影像夠嗎？</p><div class=\"ex\"><h4>觀察新鮮軟骨</h4><p>用低倍鏡與高倍鏡觀察。</p></div><div class=\"ex\"><h4>重點</h4><ul><li>細胞的形態與排列。</li><li>間距（緻密或疏鬆）。</li><li>細胞核的數量、位置，以及細胞核占細胞的比例。</li><li>圖中可見：軟骨細胞、細胞核、細胞間質。</li></ul></div><div class=\"ex\"><h4>量測</h4><p>用顯微測微器量測細胞大小並記錄。</p></div><div class=\"ex\"><h4>深入解說：新鮮軟骨的觀察重點</h4><p>透明軟骨由<b>軟骨細胞</b>（位於陷窩內，單獨或 2–4 個成群）與大量<b>間質</b>（膠原纖維與基質）組成，細胞核被亞甲藍染成藍色，間質淡染。觀察要寫：細胞形狀與排列、間距（疏或密）、核數量與位置、核佔細胞比例。用測微器量細胞長軸與短軸，記錄多個細胞的平均。</p></div><div class=\"ex\"><h4>量測要點</h4><ul><li>量長軸與短軸（註明方向）。</li><li>至少量 5–10 個細胞。</li><li>記錄校正值與單位。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>要證明細胞存活，僅有一張亞甲藍影像夠嗎？</p><p><b>答：</b>不夠。亞甲藍染色只顯示細胞核位置，存活要用專門的活性檢測（如活死細胞染色）。</p></div>", "tb": [["step_008", "P28完整課本頁"]]}, {"id": "b3-a11-l17", "t": "永久切片：收縮空隙如何形成", "sec": "s3", "slide": 8, "sourceSlides": [], "sourcePages": [8], "src": "課本P28", "figSpec": {"image": "p7_lab_cartilage_obs"}, "txt": "<h3>觀察與判讀</h3><ul><li>固定、脫水等處理可能使細胞收縮，增大它與周圍基質的分離空隙。</li><li>軟骨陷窩是描述細胞位於基質中的空間，不應把整個陷窩概念等同製片偽影。</li><li>比較可見空隙，不推定所有基質完全不收縮或新鮮標本完全無空隙。</li></ul><p class=\"thinking\"><strong>想一想</strong> 影像中的空白，是原有空間、製程影響，還是兩者交互作用？</p><div class=\"scope-note\">組織學補充：將細胞所在位置（陷窩）與處理後擴大的細胞周邊空隙分開。</div><div class=\"ex\"><h4>討論：細胞外的空腔</h4><p>新鮮軟骨切片與永久玻片標本形態有差異；請問永久玻片標本中，細胞外的空腔是怎麼造成的？</p></div><div class=\"ex\"><h4>思考方向</h4><p>永久玻片要經過固定、脫水、包埋、切片、染色等處理，細胞可能因而收縮，與周圍基質之間出現空隙。</p></div><div class=\"ex\"><h4>深入解說：收縮空隙的形成</h4><p>永久切片的製程：固定（保存結構）→ 脫水（酒精，去除水分）→ 透明化 → 包埋（石蠟）→ 切片 → 染色。脫水使細胞失水體積縮小，而硬而富含基質的軟骨間質收縮較小，所以細胞與基質之間常出現<b>收縮空隙</b>。要區分：<b>陷窩</b>是軟骨細胞所在的正常小腔；<b>被擴大的空隙</b>是製程造成。</p></div><div class=\"ex\"><h4>三種可能</h4><ul><li>原有空間（陷窩）。</li><li>製程使細胞縮小。</li><li>兩者交互作用。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>影像中的空白，怎樣判斷是原有或製程造成？</p><p><b>答：</b>比較新鮮與永久標本；新鮮的細胞通常撐滿陷窩，永久切片的空隙明顯變大，說明至少部分來自製程。</p></div>", "tb": [["step_008", "P28完整課本頁"]]}, {"id": "b3-a11-l18", "t": "比較新鮮與永久：控制差異", "sec": "s3", "slide": 8, "sourceSlides": [], "sourcePages": [8], "src": "課本P28", "figSpec": {"pair": ["p7_lab_cartilage_obs", "trachea-a"]}, "txt": "<h3>觀察與判讀</h3><ul><li>盡量比較相近組織、切向、厚度、倍率與影像條件。</li><li>記錄製片方式、染色及取材部位；不可只看到差異便歸因單一因素。</li><li>圖示可支持提出收縮假說，但不能單靠兩張圖算出脫水收縮百分比。</li></ul><p class=\"thinking\"><strong>想一想</strong> 如果兩張照片取材部位不同，這個混雜因素如何影響結論？</p><div class=\"ex\"><h4>比較新鮮與永久</h4><p>比較圖 1－5 的永久玻片與本活動的新鮮切片圖。</p></div><div class=\"ex\"><h4>比較的原則</h4><p>相同組織、相近倍率下比較；並記錄兩者的製片方式不同。</p></div><div class=\"ex\"><h4>深入解說：比較要控制差異</h4><p>比較新鮮與永久軟骨時，要盡量控制：組織相同、部位相近、切向與厚度、放大倍率、影像條件。並且記錄製片方式與染色。兩者不只一個差異（脫水、固定、包埋、染色），所以只能提出「收縮假說」，不能由兩張圖算出收縮百分比。</p></div><div class=\"ex\"><h4>混雜因素</h4><ul><li>取材部位不同。</li><li>切片厚度不同。</li><li>染色劑不同。</li><li>倍率不同。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>如果兩張照片取材部位不同，這個混雜因素如何影響結論？</p><p><b>答：</b>部位本身可能就有差異（細胞密度、基質量），無法確定差異是否來自製片，結論的可靠性下降。</p></div>", "tb": [["step_008", "P28完整課本頁"]]}, {"id": "b3-a11-l19", "t": "課本討論：分類不是只填名稱", "sec": "s4", "slide": 6, "sourceSlides": [], "sourcePages": [6], "src": "課本P26", "figSpec": {"image": "p5_fig"}, "txt": "<h3>觀察與判讀</h3><ul><li>討論一：比較同一玻片與不同玻片的細胞種類及特徵。</li><li>討論二：分開解釋脂滴造成核偏位與製片造成空白外觀。</li><li>討論三：對a軟骨、b脂肪、c上皮各寫可見證據。</li></ul><p class=\"thinking\"><strong>想一想</strong> 怎樣讓同學只讀你的證據，也能回頭找到相同區域？</p><div class=\"ex\"><h4>活動一討論題</h4><ul><li>每一種標本可看到幾種細胞？歸納並比較各種組織細胞的差異。</li><li>脂肪細胞的核為何多位於邊緣？</li><li>判斷氣管切片 a～c 含哪種組織並寫出依據。</li></ul></div><div class=\"ex\"><h4>小提醒</h4><p>分類不只是填名稱，還要寫出判斷依據。</p></div><div class=\"ex\"><h4>深入解說：討論題的答題骨架</h4><p><b>討論一</b>：每種標本列出看到的細胞種類，歸納形態、排列、核位的差異（可做表格）；<b>討論二</b>：脂肪細胞核偏邊緣——大脂滴擠壓；空白外觀——製片抽提脂質，要分開解釋；<b>討論三</b>：a 軟骨、b 脂肪、c 上皮，各寫「看到什麼＋因此判斷」。分類不只是填名稱，要寫依據。</p></div><div class=\"ex\"><h4>讓別人能複查</h4><ul><li>註明標本與倍率。</li><li>標記區域（上下左右、距管腔遠近）。</li><li>證據句能在圖上找到。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>怎樣讓同學只讀你的證據，也能回頭找到相同區域？</p><p><b>答：</b>在圖上標出位置、倍率與參照構造（如距管腔多遠），並用描述句指出特徵。</p></div>", "tb": [["step_006", "P26完整課本頁"]]}, {"id": "b3-a11-l20", "t": "探究報告：已知、推論與待查", "sec": "s4", "slide": 8, "sourceSlides": [], "sourcePages": [8], "src": "課本P28", "figSpec": {"image": "p7_lab_cartilage_obs"}, "txt": "<h3>觀察與判讀</h3><ul><li>用觀察欄記可見現象，用推論欄寫可能機制。</li><li>量測填自己的格數、校正值與樣本數，無資料就明記待測。</li><li>提出可以比較的條件與重複觀察；修正結論不等於實驗失敗。</li></ul><p class=\"thinking\"><strong>想一想</strong> 哪一個額外觀察最能區分兩種解釋？</p><div class=\"ex\"><h4>整理成報告</h4><p>把活動一、二的觀察整理成報告。</p></div><div class=\"ex\"><h4>建議結構</h4><ul><li>看到的現象（描述）</li><li>推論與解釋</li><li>待查證的問題</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>只填你真的測量到的數據，沒有的就寫待測。</p></div><div class=\"ex\"><h4>深入解說：探究報告的結構</h4><p>① 目的；② 材料與方法（含校正）；③ 結果（描述、量測、圖）；④ 討論（推論＋可能的誤差）；⑤ 結論（不超出證據）。把「觀察」與「推論」分欄；量測要寫自己的格數、校正值與樣本數；沒有資料的欄位寫「待測」。修正結論不等於實驗失敗，是科學的正常過程。</p></div><div class=\"ex\"><h4>提出可比較的條件</h4><ul><li>同一標本多視野重複。</li><li>不同標本相同方法。</li><li>改變單一條件（如新鮮 vs 永久）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>哪一個額外觀察最能區分兩種解釋？</p><p><b>答：</b>能讓兩種解釋預測出不同結果的觀察，例如用冰凍切片（保留脂質）比較有無空白，可區分「原本就空」與「製程抽提」。</p></div>", "tb": [["step_008", "P28完整課本頁"]]}], "questions": [{"t": "形態分類：把證據配回細胞", "q": "將6張特徵卡分到對應類別。", "learn": 7, "tag": "morph", "hint": "比較排列、核位與突起，不只看顏色。", "why": "判讀需多項證據；薄切面未必呈現整個細胞。", "sub": "課本P24", "refs": [{"src": "p2_lab_skeletal_muscle", "cap": "教材來源圖"}], "legacyQuestion": 1, "kind": "drag", "slots": [{"id": "g0s0", "label": "小腸柱狀上皮", "group": 0}, {"id": "g0s1", "label": "小腸柱狀上皮", "group": 0}, {"id": "g1s0", "label": "骨骼肌纖維", "group": 1}, {"id": "g1s1", "label": "骨骼肌纖維", "group": 1}, {"id": "g2s0", "label": "神經元候選", "group": 2}, {"id": "g2s1", "label": "神經元候選", "group": 2}], "pieces": [{"id": "ag0s0", "label": "腔面細胞緊密成層", "group": 0}, {"id": "ag0s1", "label": "細胞較高，核偏基底", "group": 0}, {"id": "ag1s0", "label": "長條纖維平行排列", "group": 1}, {"id": "ag1s1", "label": "可見橫紋、核多在周邊", "group": 1}, {"id": "ag2s0", "label": "較大細胞本體與明顯核", "group": 2}, {"id": "ag2s1", "label": "本體向外延伸突起", "group": 2}], "sol": {"g0s0": "ag0s0", "g0s1": "ag0s1", "g1s0": "ag1s0", "g1s1": "ag1s1", "g2s0": "ag2s0", "g2s1": "ag2s1"}, "pre": {}, "id": "b3-a11-q01"}, {"t": "課本圖貼標籤：小腸切片的層次", "q": "依課本觀察項目（小腸絨毛），把標籤放回圖上的編號格：小腸壁由內到外的層次，以及右圖標示的細胞。", "learn": 5, "tag": "morph", "hint": "小腸壁由腔面往外依序是黏膜層、黏膜下層、平滑肌、漿膜層；右圖框出的是絨毛表面的上皮細胞。", "why": "小腸壁由內而外為黏膜層、黏膜下層、平滑肌與漿膜層；右側高倍圖框出的是小腸絨毛上皮細胞，細胞排列緊密成層。", "sub": "課本 P24 小腸絨毛", "refs": [{"src": "mk_gut", "cap": "小腸絨毛切片（標籤已遮蓋）"}], "kind": "drag", "mask": "mk_gut", "ar": 2.2672, "layout": "side", "slots": [{"id": "s0", "label": "小腸黏膜層", "group": 0, "x": 5.59, "y": 35.05, "v": false, "w": false}, {"id": "s1", "label": "黏膜下層", "group": 1, "x": 6.32, "y": 61.09, "v": false, "w": false}, {"id": "s2", "label": "平滑肌", "group": 2, "x": 5.59, "y": 73.1, "v": false, "w": false}, {"id": "s3", "label": "小腸漿膜層", "group": 3, "x": 5.59, "y": 83.21, "v": false, "w": false}, {"id": "s4", "label": "小腸絨毛上皮細胞", "group": 4, "x": 69.11, "y": 89.95, "v": false, "w": false}], "pieces": [{"id": "a0", "label": "小腸黏膜層", "group": 0}, {"id": "a1", "label": "黏膜下層", "group": 1}, {"id": "a2", "label": "平滑肌", "group": 2}, {"id": "a3", "label": "小腸漿膜層", "group": 3}, {"id": "a4", "label": "小腸絨毛上皮細胞", "group": 4}, {"id": "a5", "label": "神經元", "group": 100}, {"id": "a6", "label": "軟骨細胞", "group": 101}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2", "s3": "a3", "s4": "a4"}, "pre": {"s2": "a2"}}, {"t": "課本圖貼標籤：三種玻片標本", "q": "依課本P24–25三張高倍圖，把標籤放回圖上的編號格：標本名稱與圖中標示的細胞。", "learn": 7, "tag": "morph", "hint": "橫紋與細胞核位置、大型空泡狀細胞與邊緣細胞核、帶突起的大細胞本體，是三種標本的主要證據。", "why": "骨骼肌細胞可見橫紋；脂肪細胞大部分為脂肪滴空泡，細胞核被擠到邊緣；脊髓灰質可見帶突起的神經細胞（神經元）。", "sub": "課本 P24–P25", "refs": [{"src": "mk_spec", "cap": "三種玻片標本（標籤已遮蓋）"}], "kind": "drag", "mask": "mk_spec", "ar": 2.7898, "layout": "side", "slots": [{"id": "s0", "label": "骨骼肌", "group": 0, "x": 4.79, "y": 4.43, "v": false, "w": false}, {"id": "s1", "label": "脂肪組織", "group": 1, "x": 38.49, "y": 4.89, "v": false, "w": false}, {"id": "s2", "label": "脊髓灰質", "group": 2, "x": 72.26, "y": 4.83, "v": false, "w": false}, {"id": "s3", "label": "骨骼肌細胞", "group": 3, "x": 22.18, "y": 13.81, "v": false, "w" 容物抽提及收縮影響分開。", "課本P21–28；圖解17"], "level": ["組織與細胞層級", "器官、組織、細胞與表面突起不能混稱。", "課本P21–28；圖解7"], "measure": ["校正與量測", "器材規格、光學設定、格值和單位缺一不可。", "課本P21–28；圖解4"], "method": ["方法與比較", "定位、取材、控制條件與排錯要有次序。", "課本P21–28；圖解15"], "evidence": ["影像證據的界線", "未見不等於不存在，放大不等於增加解析度。", "課本P21–28；圖解10"], "safety": ["安全取材", "固定材料，手和身體避開刀刃路徑。", "課本P21–28；圖解14"], "record": ["觀察紀錄與誠實", "實測、引用與待測分開，不代填數據。", "課本P21–28；圖解20"]}, "conceptMap": {"morph": 7, "trachea": 10, "artifact": 16, "level": 6, "measure": 3, "method": 14, "evidence": 9, "safety": 13, "record": 19}, "originalCount": 2, "source": {"bookPages": 8, "printedPages": "21–28", "pptPages": null, "presentationKind": "textbook-pages"}, "pptText": {"1": "探討活動 \n－1 動物組織的觀察\n1\n前　言\n　　各種動物的形態看似差別甚大，但科學家透過解剖比較生物體的構造，發現親\n緣關係相近的動物具有共通性，例如：骨骼的排列、器官的種類與分布等。複式顯\n微鏡的發明與組織切片相關技術的發展，使科學家對生物體形態構造的觀察得以達\n到細胞的層次，那麼構成動物體的不同器官，其組織的排列也具有共通性嗎？\n目　的\n　　本活動可透過顯微鏡觀察動物組織的細胞，比較各種組織細胞的異同之處，從\n中學習辨別不同組織的細胞形態。\n原　理　\n　　動物的組織細胞之構造形態往往與功能相關，在分析歸納分類的規則時，可從\n細胞形態、細胞間的連接與排列關係等項目著手。因動物體的器官與構造不只由一\n種組織所構成，因此取樣本製作成切片標本時，通常可一次觀察到多種組織（下\n圖）。組織切片是指以生物組織為材料，將其處理為薄片並放置於玻片上，再使用\n顯微鏡觀察，是觀察生物組織的重要方法。永久玻片標本則是指生物組織經初步製\n備（如灌流、脫水、浸潤）後，再透過固定、包埋、切片、染色等過程製作而成為\n可以永久保存的玻片標本。\n  睪丸組織切片圖，圖中可見 A∼C 三種組\n織，顯示器官不只由一種組織構成。\nA\nB\nC\n100 μm\n第 1 章  動物體的組成與恆定性　21\n", "2": "　　本活動過程可先參考器材建議的永久玻片標本，觀察同一玻片標本中的不\n同組織，記錄細胞的特徵後，進行歸納比較。再以歸納比較後的組織特徵，觀\n察另一玻片中（如小腸或氣管）是否可以找到相似特徵的組織。\n器　材\n每組使用\n 複式顯微鏡\n 載玻片\n 蓋玻片\n 目鏡測微器\n 載物臺測微器\n 鑷子\n 滴管\n 吸水紙\n 單面刀片\n 永久玻片標本：小腸、骨骼肌、脂肪組織、脊髓灰質、氣管\n 新鮮材料：雞胸軟骨\n 染劑：亞甲藍液\n1 臺\n1 片\n1 片\n1 片\n1 片\n1 支\n1 支\n1 張\n 1 片\n各 1 片\n少許\n少許\n22　選修生物 Ⅲ (全)\n", "3": "步　驟\n3\n1 將永久玻片標本置於顯微鏡載物臺進行觀察。\n2\n分別以低倍鏡及高倍鏡觀察同一玻片標本中不同細胞的形態、排列方式、間\n距、細胞核數量及位置（中央或邊緣），畫下並描述觀察到的結果。觀察細胞\n的形態結構後，利用顯微測量技術量測細胞的大小，並記錄在探討活動紀錄簿\n中。\n觀察另一玻片標本，是否可找到與步驟 2 的標本特徵類似的組織與細胞？重複\n步驟 2 的實驗步驟，畫下並描述觀察到的結果。\n活動一\n永久玻片標本的觀察\n第 1 章  動物體的組成與恆定性　23\n", "4": "10 μm\n是否能觀察到橫\n紋，以及細胞核\n位於何處呢？\n60 μm\n骨骼肌細胞\n骨骼肌\n觀察項目\n400 μm\n50 μm\n注意細胞的排列\n有什麼特色呢？\n小腸絨毛\n上皮細胞\n小腸絨毛\n小腸\n黏膜層\n黏膜\n下層\n小腸\n漿膜層\n平滑肌\n24　選修生物 Ⅲ (全)\n", "5": "40 μm\n細胞核位於何\n處呢？\n20 μm\n能否觀察到許\n多突起呢？\n150 μm\n100 μm\n神經細胞\n脂肪細胞\n脂肪組織\n脊髓灰質\n第 1 章  動物體的組成與恆定性　25\n", "6": "b\nc\na\n15 μm\n15 μm\n15 μm\n40 μm\n350 μm\n 討　論\n1  本活動所觀察的每一種永久玻片標本中，可以看到幾種細胞？請歸納並比較各種\n組織細胞的差異。\n2  脂肪細胞與其他大部分細胞相比，細胞核多位於細胞邊緣，造成此現象的可能\n原因為何？\n3  下圖為不同倍率下的氣管橫切構造，試根據第1題歸納出的各種組織細胞特性，\n判斷a∼c含有哪種類型的組織細胞？並寫下判斷的依據。\n26　選修生物 Ⅲ (全)\n", "7": "步　驟\n1\n選擇雞胸軟骨的邊緣可透光處，利用刀片切取少許雞胸軟骨薄片，加入 1 滴亞甲\n藍液後，用吸水紙吸乾並蓋上蓋玻片。\n選擇雞軟骨邊緣可\n透光處\n刮取少許雞軟骨，並置於載玻片上\n亞甲藍液\n2 \n將標本置於顯微鏡下進行觀察。\n活動二\n新鮮切片標本的觀察\n第 1 章  動物體的組成與恆定性　27\n", "8": "3\n4\n分別以低倍鏡及高倍鏡觀察細胞的形態、排列方式、間距（緻密或疏鬆）、細胞\n核數量及位置（中央或邊緣），以及細胞核占細胞的比例，畫下並描述觀察到的\n結果。\n利用顯微測微器量測細胞的大小，並記錄在探討活動紀錄簿中。\n50 μm\n15 μm\n細胞間質\n細胞核\n軟骨細胞\n 討　論\n1  觀察時可發現新鮮軟骨切片與永久玻片標本形態有差異，比較圖 1－5 永久玻片\n標本與本活動的新鮮切片圖，請問在永久玻片標本中，細胞外的空腔是如何造\n成的？\n28　選修生物 Ⅲ (全)\n"}, "sourceCorrections": [], "originalPPTQuestions": {}};

function splitBlock(node,body){

  parts.push(fragment(from,best));from=best;
 }body.replaceChildren();return parts;
}
function paginateReading(){

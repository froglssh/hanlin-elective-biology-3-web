r>▪ 維持某些身體部位的形狀，例如<br>：<br>氣管的軟骨<br>軟<br>骨<br>4-3.1 <br>神經系統對運動的協調<br>配合課本 <br>P115<small>原PPT第9頁完整原文；補充與原文分列。</small></div><div class=\"quote\">◆ <br>關節<br>：<br>4-3.1 <br>神經系統對運動的協調<br>硬骨<br>軟骨<br>韌帶<br>固定關節兩端的硬骨<br>以膝關節為例<br>配合課本 <br>P115<small>原PPT第10頁完整原文；補充與原文分列。</small></div>", "tb": [["book_002", "P115完整課本頁"]]}, {"id": "b3-c43-l04", "t": "一條運動神經元，通向多條肌纖維", "sec": "s2", "slide": 11, "sourceSlides": [11, 19, 20], "sourcePages": [3, 4], "src": "課本P116、117；PPT 11、19、20", "figSpec": {"image": "motor"}, "txt": "<h3>構造與功能</h3><ul><li>體神經運動神經元的細胞本體位於腦幹或脊髓，軸突伸向骨骼肌。</li><li>肌纖維就是骨骼肌細胞；神經末梢與肌纖維形成神經肌肉會合處。</li><li>一條軸突可分枝支配多條肌纖維；依本節模型，一條肌纖維由一條運動神經元支配。</li></ul><p class=\"thinking\"><strong>想一想</strong> 許多軸突分枝是否代表同樣數量的神經元？</p><button class=\"think-answer\" data-think-answer=\"不一定；須追蹤細胞本體與軸突。同一神經元的軸突可以分枝。\">查看參考解答 ↗</button><div class=\"quote\">神經肌肉會合處　neuromuscular junction<br>乙醯膽鹼　acetylcholine, ACh<br>運動終板　motor end plate<br>運動單位　motor unit<br>4-3.2 體神經系統與隨意運動<br>人體的隨意運動由體神經系統控制骨骼肌來達成。體神<br>經系統是周圍神經系統的一部分，負責將中樞神經系統的<br>訊息傳至骨骼肌，進行隨意運動，例如：走路、書寫或說話<br>等。骨骼肌具有明顯的橫紋構造，屬於橫紋肌，同時又因可<br>受意識控制的特性，屬於隨意肌。<br>體神經系統中的運動神經元，其細胞本體位於脊髓或腦<br>幹內，而軸突可延伸至骨骼肌，並與肌纖維形成一種特殊的<br>突觸，稱為神經肌肉會合處。當動作電位傳導至此處時，運<br>動神經元的軸突末梢會釋放乙醯膽鹼（ACh），與肌纖維細<br>胞膜上的受體結合，進而引發肌肉收縮。在肌纖維的細胞膜<br>中，只有與神經末梢接觸的局部區域稱為運動終板（圖4－<br>20），其表面分布大量乙醯膽鹼受體，能有效接收來自神經<br>元的訊號，確保肌肉對刺激產生快速而準確的反應。<br>一條骨骼肌纖維僅由一條運動神經元支配，但一條運動<br>神經元可支配多條肌纖維。一個運動神經元與所支配的所有<br>肌纖維，合稱為一個運動單位，當一個運動神經元產生動作<br>電位時，同一運動單位的肌纖維會一起收縮，故運動單位<br>愈小，支配的肌纖維愈少，動作控制愈精細，例如：彈鋼琴<br>時，眼球與手指的微小移動；反之，運動單位愈大，支配的<br>肌纖維愈多，可產生較大的力量，例如：跳遠時，大腿與軀<br>幹肌肉用於奔跑、跳躍。這種支配方式讓人體能依不同的需<br>求，執行各種運動。 <br>　　提重物與輕物時需要<br>的力量不同，為何每次肢<br>體活動時，肌肉力量的強<br>弱會有所不同呢？<br>腦力激盪<br>116　選修生物 Ⅲ (全)<br><small>課本P116完整原文。</small></div><div class=\"quote\">突觸間隙<br>肌<br>纖<br>維<br>突觸囊泡<br>肌纖維的細胞膜<br>運動終板<br>運動終板<br>乙醯膽鹼<br>乙醯膽鹼<br>肌肉<br>肌腱<br>硬骨<br>a<br>b<br>肌纖維<br>運動神經元<br>受體<br>受體<br> 圖 4－20　<br>運動終板。a每條肌纖維只受一個運動神經元控制；b運動神經元軸突末梢與肌纖維所形成的突觸。<br>（<br> 代表訊號傳遞方向）<br>第 4 章  感應　117<br><small>課本P117完整原文。</small></div><div clas ote\">突觸間隙<br>肌<br>纖<br>維<br>突觸囊泡<br>肌纖維的細胞膜<br>運動終板<br>運動終板<br>乙醯膽鹼<br>乙醯膽鹼<br>肌肉<br>肌腱<br>硬骨<br>a<br>b<br>肌纖維<br>運動神經元<br>受體<br>受體<br> 圖 4－20　<br>運動終板。a每條肌纖維只受一個運動神經元控制；b運動神經元軸突末梢與肌纖維所形成的突觸。<br>（<br> 代表訊號傳遞方向）<br>第 4 章  感應　117<br><small>課本P117完整原文。</small></div><div class=\"quote\">4-3.2 <br>體神經系統與隨意運動<br>突觸囊泡<br>肌纖維的細胞膜<br>突觸間隙<br>肌纖維<br>運動神經元<br>配合課本 <br>P116<br>、<br>117<br>◆ <br>運動神經元的軸突<br>與<br>肌纖維<br>之間<br>形成一種特殊的突觸，稱為<br>神經肌肉會合處<small>原PPT第12頁完整原文；補充與原文分列。</small></div><div class=\"quote\">4-3.2 <br>體神經系統與隨意運動<br>突觸囊泡<br>肌纖維的細胞膜<br>突觸間隙<br>肌纖維<br>受體<br>乙醯膽鹼<br>運動終板<br>◆ 在肌纖維的細胞膜<br>中<br>，只有與神經末梢接觸的局部區域稱為<br>運動終板<br>◆ <br>運動終板<br>表面分布大量<br>乙醯膽鹼受體<br>，能有效接收來自神經元的訊號<br>運動神經元<br>配合課本 <br>P116<br>、<br>117<small>原PPT第13頁完整原文；補充與原文分列。</small></div>", "tb": [["book_003", "P116完整課本頁"], ["book_004", "P117完整課本頁"]]}, {"id": "b3-c43-l06", "t": "從電位到收縮：兩個細胞的接力", "sec": "s2", "slide": 14, "sourceSlides": [14, 15, 16, 17, 18], "sourcePages": [3, 4], "src": "課本P116、117；PPT 14、15、16、17、18", "figSpec": {"image": "junction"}, "txt": "<h3>構造與功能</h3><ul><li>動作電位到達末梢，促使電位敏感型Ca²⁺通道開啟，Ca²⁺進入神經末梢。</li><li>囊泡與膜融合釋放乙醯膽鹼；它跨間隙後與運動終板受體結合。</li><li>終板去極化達閾值可在肌纖維引發動作電位；ACh分解有助終止刺激。</li></ul><p class=\"thinking\"><strong>想一想</strong> 跨越兩細胞間隙的主要訊號是電流還是化學物質？</p><button class=\"think-answer\" data-think-answer=\"此處為化學突觸，ACh跨間隙傳遞；不是釋放Na⁺作為神經傳遞物。\">查看參考解答 ↗</button><div class=\"scope-note\">PPT「化學敏感型鈉離子通道」是簡稱；ACh受體為配體門控陽離子通道，不是只容許Na⁺通過。</div><div class=\"quote\">神經肌肉會合處　neuromuscular junction<br>乙醯膽鹼　acetylcholine, ACh<br>運動終板　motor end plate<br>運動單位　motor unit<br>4-3.2 體神經系統與隨意運動<br>人體的隨意運動由體神經系統控制骨骼肌來達成。體神<br>經系統是周圍神經系統的一部分，負責將中樞神經系統的<br>訊息傳至骨骼肌，進行隨意運動，例如：走路、書寫或說話<br>等。骨骼肌具有明顯的橫紋構造，屬於橫紋肌，同時又因可<br>受意識控制的特性，屬於隨意肌。<br>體神經系統中的運動神經元，其細胞本體位於脊髓或腦<br>幹內，而軸突可延伸至骨骼肌，並與肌纖維形成一種特殊的<br>突觸，稱為神經肌肉會合處。當動作電位傳導至此處時，運<br>動神經元的軸突末梢會釋放乙醯膽鹼（ACh），與肌纖維細<br>胞膜上的受體結合，進而引發肌肉收縮。在肌纖維的細胞膜<br>中，只有與神經末梢接觸的局部區域稱為運動終板（圖4－<br>20），其表面分布大量乙醯膽鹼受體，能有效接收來自神經<br>元的訊號，確保肌肉對刺激產生快速而準確的反應。<br>一條骨骼肌纖維僅由一條運動神經元支配，但一條運動<br>神經元可支配多條肌纖維。一個運動神經元與所支配的所有<br>肌纖維，合稱為一個運動單位，當一個運動神經元產生動作<br>電位時，同一運動單位的肌纖維會一起收縮，故運動單位<br>愈小，支配的肌纖維愈少，動作控制愈精細，例如：彈鋼琴<br>時，眼球與手指的微小移動；反之，運動單位愈大，支配的<br>肌纖維愈多，可產生較大的力量，例如：跳遠時，大腿與軀<br>幹肌肉用於奔跑、跳躍。這種支配方式讓人體能依不同的需<br>求，執行各種運動。 <br>　　提重物與輕物時需要<br>的力量不同，為何每次肢<br>體活動時，肌肉力量的強<br>弱會有所不同呢？<br>腦力激盪<br>116　選修生物 Ⅲ (全)<br><small>課本P116完整原文。</small></div><div class=\"quote\">突觸間隙<br>肌<br>纖<br>維<br>突觸囊泡<br>肌纖維的細胞膜<br>運動終板<br>運動終板<br>乙醯膽鹼<br>乙醯膽鹼<br>肌肉<br>肌腱<br>硬骨<br>a<br>b<br>肌纖維<br>運動神經元<br>受體<br>受體<br> 圖 4－20　<br>運動終板。a每條肌纖維只受一個運動神經元控制；b運動神經元軸突末梢與肌纖維所形成的突觸。<br>（<br> 代表訊號傳遞方向）<br>第 4 章  感應　117<br><small>課本P117完整原文。</small></div><div class=\"quote\">乙醯膽鹼<br>電位敏感型<br>鈣離子通道<br>Ca<br>2+<br>Na<br>+<br>化學敏感型鈉離子通道<br>（可<br>結合神經傳<br>遞<br>物而開啟閘門<br>）<br>突觸囊泡<br>體神經系統<br>的<br>運動<br>神經元<br>運動終板<br>（ 肌纖維<br>的<br>細胞膜 ）<br>4-3.2 <br>體神經系統與隨意運動<br>補充<small>原PPT第14頁完整原文；補充與原文分列。</small></div><div class=\"quote\">Ca<br>2+<br>Na<br>+<br>①<br> 動作<br>電位傳導至軸突末梢<br>4-3.2 <br>體神經系統與隨意運動<br>補充<small>原PPT第15頁完整原文；補充與原文分列。</small></div><div class=\"quote\">Ca<br>2+<br>Na<br>+<br>②<br> 電位敏感型<br>鈣離子通道打開，細胞外<br>的鈣離子流入<br>軸突末梢<br>4-3.2 <br>體神經系統與隨意運動<br>補充<small>原PPT第16頁完整原文；補充與原文分列。</small></div><div class=\"quote\">Na<br>+<br>③<br> 突<br>觸囊泡向軸突末梢移動，與細胞膜融合，並釋出乙醯膽鹼<br>④<br> 乙<br>醯膽鹼擴散於突觸間隙，與位於突觸後神經元細胞膜上的受體結合<br>4-3.2 <br>體神經系統與隨意運動<br>補充<small>原PPT第17頁完整原文；補充與原文分列。</small></div><div class=\"quote\">Ca<br>2+<br>Na<br>+<br>⑤<br> 與<br>受體連結<br>的鈉離子通道<br>開啟，導致突觸後神經元的膜電位產生變化<br>→ 若達到閾值電位，便可在肌纖維引發動作電位，<br>導致肌纖維收縮<br>→ <br>鈉離子通道<br>開啟<br>→ 細胞<br>外鈉離子較<br>多，<br> <br>鈉離子流入<br>細胞<br>→ 引起<br>去極化<br>⑥<br> 突<br>觸間隙處的酵素<br>將<br><br>乙<br>醯膽鹼分解，肌纖維舒張<br>4-3.2 <br>體神經系統與隨意運動<br>補充<small>原PPT第18頁完整原文；補充與原文分列。</small></div>", "tb": [["book_003", "P116完整課本頁"], ["book_004", "P117完整課本頁"]]}, {"id": "b3-c43-l07", "t": "運動單位：一個指令的肌纖維群", "sec": "s3", "slide": 19, "sourceSlides": [19, 20, 21], "sourcePages": [3, 4], "src": "課本P116、117；PPT 19、20、21", "figSpec": {"image": "motor"}, "txt": "<h3>構造與功能</h3><ul><li>一個運動神經元及它支配的全部肌纖維，合稱一個運動單位。</li><li>同單位的肌纖維隨神經元訊號一起收縮，不是每條纖維都需額外指令。</li><li>小運動單位有利精細控制；大單位可使較多纖維一起產生力量。</li></ul><p class=\"thinking\"><strong>想一想</strong> 控制一條手指肌纖維，需要更多神經元嗎？</p><button class=\"think-answer\" data-think-answer=\"依本節模型，單一肌纖維皆由一個運動神經元支配；差別在每個神經元支配幾條肌纖維。\">查看參考解答 ↗</button><div class=\"quote\">神經肌肉會合處　neuromuscular junction<br>乙醯膽鹼　acetylcholine, ACh<br>運動終板　motor end plate<br>運動單位　motor unit<br>4-3.2 體神經系統與隨意運動<br>人體的隨意運動由體神經系統控制骨骼肌來達成。體神<br>經系統是周圍神經系統的一部分，負責將中樞神經系統的<br>訊息傳至骨骼肌，進行隨意運動，例如：走路、書寫或說話<br>等。骨骼肌具有明顯的橫紋構造，屬於橫紋肌，同時又因可<br>受意識控制的特性，屬於隨意肌。<br>體神經系統中的運動神經元，其細胞本體位於脊髓或腦<br>幹內，而軸突可延伸至骨骼肌，並與肌纖維形成一種特殊的<br>突觸，稱為神經肌肉會合處。當動作電位傳導至此處時，運<br>動神經元的軸突末梢會釋放乙醯膽鹼（ACh），與肌纖維細<br>胞膜上的受體結合，進而引發肌肉收縮。在肌纖維的細胞膜<br>中，只有與神經末梢接觸的局部區域稱為運動終板（圖4－<br>20），其表面分布大量乙醯膽鹼受體，能有效接收來自神經<br>元的訊號，確保肌肉對刺激產生快速而準確的反應。<br>一條骨骼肌纖維僅由一條運動神經元支配，但一條運動<br>神經元可支配多條肌纖維。一個運動神經元與所支配的所有<br>肌纖維，合稱為一個運動單位，當一個運動神經元產生動作<br>電位時，同一運動單位的肌纖維會一起收縮，故運動單位<br>愈小，支配的肌纖維愈少，動作控制愈精細，例如：彈鋼琴<br>時，眼球與手指的微小移動；反之，運動單位愈大，支配的<br>肌纖維愈多，可產生較大的力量，例如：跳遠時，大腿與軀<br>幹肌肉用於奔跑、跳躍。這種支配方式讓人體能依不同的需<br>求，執行各種運動。 <br>　　提重物與輕物時需要<br>的力量不同，為何每次肢<br>體活動時，肌肉力量的強<br>弱會有所不同呢？<br>腦力激盪<br>116　選修生物 Ⅲ (全)<br><small>課本P116完整原文。</small></div><div class=\"quote\">突觸間隙<br>肌<br>纖<br>維<br>突觸囊泡<br>肌纖維的細胞膜<br>運動終板<br>運動終板<br>乙醯膽鹼<br>乙醯膽鹼<br>肌肉<br>肌腱<br>硬骨<br>a<br>b<br>肌纖維<br>運動神經元<br>受體<br>受體<br> 圖 4－20　<br>運動終板。a每條肌纖維只受一個運動神經元控制；b運動神經元軸突末梢與肌纖維所形成的突觸。<br>（<br> 代表訊號傳遞方向）<br>第 4 章  感應　117<br><small>課本P117完整原文。</small></div><div class=\"quote\">4-3.2 <br>體神經系統與隨意運動<br>◆ 一條骨骼肌纖維僅由一條運動神經元支配，但一條運動神經元可支配多條肌纖維<br>配合課本 <br>P116<br>、<br>117<small>原PPT第19頁完整原文；補充與原文分列。</small></div><div class=\"quote\">4-3.2 <br>體神經系統與隨意運動<br>◆ 一個運動神經元與所支配的所有肌纖維，合稱為一個<br>運動單位<br>◆ 當一個運動神經元產生動作電位時，同一運動單位的肌纖維會<br>一起<br><br>收縮<br>配合課本 <br>P116<br>、<br>117<small>原PPT第20頁完整原文；補充與原文分列。</small></div><div class=\"quote\">→ 例如<br>：<br>彈鋼琴時，眼球與手指的微小移動<br>4-3.2 <br>體神經系統與隨意運動<br>◆ 運動單位愈小，支配的肌纖維愈少，動作控制愈精細<br>→ <br>例如<br>：<br>跳遠<br>時，大腿與軀幹肌肉用於奔跑、跳躍<br>◆ 運動單位愈大，支配的肌纖維愈多，可產生較大的力量<br>配合課本 <br>P116<small>原PPT第21頁完整原文；補充與原文分列。</small></div>", "tb": [["book_003", "P116完整課本頁"], ["book_004", "P117完整課本頁"]]}, {"id": "b3-c43-l08", "t": "提輕與提重：力量可以調節", "sec": "s3", "slide": 21, "sourceSlides": [21, 22, 23], "sourcePages": [3], "src": "課本P116；PPT 21、22、23", "figSpec": {"image": "motor"}, "txt": "<h3>構造與功能</h3><ul><li>需較大力量時可募集更多運動單位參與，不是每次都動員全部肌纖維。</li><li>PPT補充神經衝動頻率也能調節力量；區分參與單位數與刺激頻率。</li><li>針對課本腦力激盪，先提出神經與肌纖維的解釋，再說明需要的證據。</li></ul><p class=\"thinking\"><strong>想一想</strong> 是否只因單一神經元的動作電位變得更大？</p><button class=\"think-answer\" data-think-answer=\"不宜。應由運動單位募集及神經衝動頻率解釋，不把肌力等同單次電位振幅。\">查看參考解答 ↗</button><div class=\"quote\">神經肌肉會合處　neuromuscular junction<br>乙醯膽鹼　acetylcholine, ACh<br>運動終板　motor end plate<br>運動單位　motor unit<br>4-3.2 體神經系統與隨意運動<br>人體的隨意運動由體神經系統控制骨骼肌來達成。體神<br>經系統是周圍神經系統的一部分，負責將中樞神經系統的<br>訊息傳至骨骼肌，進行隨意運動，例如：走路、書寫或說話<br>等。骨骼肌具有明顯的橫紋構造，屬於橫紋肌，同時又因可<br>受意識控制的特性，屬於隨意肌。<br>體神經系統中的運動神經元，其細胞本體位於脊髓或腦<br>幹內，而軸突可延伸至骨骼肌，並與肌纖維形成一種特殊的<br>突觸，稱為神經肌肉會合處。當動作電位傳導至此處時，運<br>動神經元的軸突末梢會釋放乙醯膽鹼（ACh），與肌纖維細<br>胞膜上的受體結合，進而引發肌肉收縮。在肌纖維的細胞膜<br>中，只有與神經末梢接觸的局部區域稱為運動終板（圖4－<br>20），其表面分布大量乙醯膽鹼受體，能有效接收來自神經<br>元的訊號，確保肌肉對刺激產生快速而準確的反應。<br>一條骨骼肌纖維僅由一條運動神經元支配，但一條運動<br>神經元可支配多條肌纖維。一個運動神經元與所支配的所有<br>肌纖維，合稱為一個運動單位，當一個運動神經元產生動作<br>電位時，同一運動單位的肌纖維會一起收縮，故運動單位<br>愈小，支配的肌纖維愈少，動作控制愈精細，例如：彈鋼琴<br>時，眼球與手指的微小移動；反之，運動單位愈大，支配的<br>肌纖維愈多，可產生較大的力量，例如：跳遠時，大腿與軀<br>幹肌肉用於奔跑、跳躍。這種支配方式讓人體能依不同的需<br>求，執行各種運動。 <br>　　提重物與輕物時需要<br>的力量不同，為何每次肢<br>體活動時，肌肉力量的強<br>弱會有所不同呢？<br>腦力激盪<br>116　選修生物 Ⅲ (全)<br><small>課本P116完整原文。</small></div><div class=\"quote\">→ 例如<br>：<br>彈鋼琴時，眼球與手指的微小移動<br>4-3.2 <br>體神經系統與隨意運動<br>◆ 運動單位愈小，支配的肌纖維愈少，動作控制愈精細<br>→ <br>例如<br>：<br>跳遠<br>時，大腿與軀幹肌肉用於奔跑、跳躍<br>◆ 運動單位愈大，支配的肌纖維愈多，可產生較大的力量<br>配合課本 <br>P116<small>原PPT第21頁完整原文；補充與原文分列。</small></div><div class=\"quote\">  <br>腦力激盪<br>提重物與輕物時需要的力量不同，為何每次肢體活動時，肌肉力量的強弱會有所不同呢？<br>配合課本 <br>P116<br>答<br>：<br>肌肉能夠根據需求產生不同強度的力量，主要透過以下幾個生理<br>機制<br>：<br>1<br>. <br>運動單位募集（<br>motor unit recruitment<br>）：當肌肉需要產生力量時，神經系統會依序動員更多的運動單位來參與收縮，這個「依序啟用」的過程就稱為「運動單位募集」。<br>一個運動單位由一個運動神經元及它所支配的肌纖維群組成。提輕物時，只需少數運動單位參與，只募集小型運動單位，如慢縮肌纖維（<br>TypeⅠ<br>）產生的力量較小，但具有高度耐疲勞能力，適合長時間運動。提重物時，大腦會募集更多運動單位，並募集中型和大型運動單位，如快縮肌纖維（<br>Type Ⅱ<br>）收縮速度快，能產生較大的力量，但較容易疲勞，能因為訓練顯著增加其截面積，使肌肉變得更粗<br>。<br>22<small>原PPT第22頁完整原文；補充與原文分列。</small></div><div class=\"quote\">  <br>腦力激盪<br>提重物與輕物時需要的力量不同，為何每次肢體活動時，肌肉力量的強弱會有所不同呢？<br>配合課本 <br>P116<br>答<br>：<br>2. <br>動作電位頻率調節<br>：<br>透過改變神經衝動的頻率來調整力量，若是低頻刺激，會產生較弱的肌肉收縮（單收縮或不完全強直收縮）；當動作電位的頻率提高，肌纖維的收縮會疊加，甚至達到完全強直收縮，產生最大力量。<br>3. <br>中樞神經系統的調<br>控<br>：<br>大腦<br>皮質的初級運動皮質（<br>M1<br>）會計畫和執行動作，前運動皮質和輔助運動區會規劃力量大小，基底核和小腦則會協調和微調力量輸出。回饋給肌梭（<br>muscle spindle<br>）偵測肌肉長度變化，高基氏腱器官（<br>Golgi tendon organ<br>）偵測肌肉張力，以即時調整力量的大小。<br>23<small>原PPT第23頁完整原文；補充與原文分列。</small></div>", "tb": [["book_003", "P116完整課本頁"]]}, {"id": "b3-c43-l09", "t": "體神經與自律神經：動器和路徑", "sec": "s3", "slide": 24, "sourceSlides": [24, 25, 26], "sourcePages": [1, 3, 5], "src": "課本P114、116、118；PPT 24、25、26", "figSpec": {"image": "network"}, "txt": "<h3>構造與功能</h3><ul><li>體神經傳出路徑由一個運動神經元到骨骼肌，不設自律神經節換接。</li><li>典型自律傳出由節前、節後兩個神經元接力，調控平滑肌、心肌及腺體。</li><li>自律神經節是周圍換接處，不與中樞或動器混同。</li></ul><p class=\"thinking\"><strong>想一想</strong> 兩個神經元的細胞本體都在中樞嗎？</p><button class=\"think-answer\" data-think-answer=\"節前本體在中樞；節後本體位於周圍的自律神經節。\">查看參考解答 ↗</button><div class=\"scope-note\">本節採傳出系統分類。腎上腺髓質為特殊路徑，不能用所有動器一律兩段概括。</div><div class=\"quote\">人體的骨骼提供保護與支點，肌肉則透過收縮牽動骨骼產生<br>動作，如呼吸運動。這一過程需仰賴神經系統的控制與協調，將<br>訊息傳送至正確的肌肉，精準啟動各種隨意或不隨意的反應。<br>4-3.1 神經系統對運動的協調<br>人體的運動反應是維持生理功能的重要一環。根據動器的類<br>型不同，可分為控制隨意運動的體神經系統與控制不隨意運動的<br>自律神經系統（圖4－17）。<br>體神經系統控制骨骼肌，可由大腦意識直接指揮；自律神經<br>系統則調控平滑肌、心肌及腺體，屬於不隨意運動，由除了大腦<br>以外的中樞神經系統控制。<br>這兩種系統雖然各自控制不同類型的動器，但也常合作以維<br>持恆定與對環境的適應。例如：面對高溫環境，體神經系統使人<br>逃離熱源、避免傷害；自律神經系統則使汗腺出汗以降低體溫。<br>-3 肌肉與骨骼<br>4<br> 圖 4－17　人體神經系統的功能組成與訊息傳遞方向<br>內、外在環境刺激<br>感覺受器<br>統<br>系<br>入<br>傳<br>統<br>系<br>出<br>傳<br>中樞神經系統<br>(腦與脊髓)<br>感覺神經<br>動器<br>體神經系統<br>動器<br>動器<br>副交感神經系統<br>交感神經系統<br>自律神經系統<br>運動神經<br>114　選修生物 Ⅲ (全)<br><small>課本P114完整原文。</small></div><div class=\"quote\">神經肌肉會合處　neuromuscular junction<br>乙醯膽鹼　acetylcholine, ACh<br>運動終板　motor end plate<br>運動單位　motor unit<br>4-3.2 體神經系統與隨意運動<br>人體的隨意運動由體神經系統控制骨骼肌來達成。體神<br>經系統是周圍神經系統的一部分，負責將中樞神經系統的<br>訊息傳至骨骼肌，進行隨意運動，例如：走路、書寫或說話<br>等。骨骼肌具有明顯的橫紋構造，屬於橫紋肌，同時又因可<br>受意識控制的特性，屬於隨意肌。<br>體神經系統中的運動神經元，其細胞本體位於脊髓或腦<br>幹內，而軸突可延伸至骨骼肌，並與肌纖維形成一種特殊的<br>突觸，稱為神經肌肉會合處。當動作電位傳導至此處時，運<br>動神經元的軸突末梢會釋放乙醯膽鹼（ACh），與肌纖維細<br>胞膜上的受體結合，進而引發肌肉收縮。在肌纖維的細胞膜<br>中，只有與神經末梢接觸的局部區域稱為運動終板（圖4－<br>20），其表面分布大量乙醯膽鹼受體，能有效接收來自神經<br>元的訊號，確保肌肉對刺激產生快速而準確的反應。<br>一條骨骼肌纖維僅由一條運動神經元支配，但一條運動<br>神經元可支配多條肌纖維。一個運動神經元與所支配的所有<br>肌纖維，合稱為一個運動單位，當一個運動神經元產生動作<br>電位時，同一運動單位的肌纖維會一起收縮，故運動單位<br>愈小，支配的肌纖維愈少，動作控制愈精細，例如：彈鋼琴<br>時，眼球與手指的微小移動；反之，運動單位愈大，支配的<br>肌纖維愈多，可產生較大的力量，例如：跳遠時，大腿與軀<br>幹肌肉用於奔跑、跳躍。這種支配方式讓人體能依不同的需<br>求，執行各種運動。 <br>　　提重物與輕物時需要<br>的力量不同，為何每次肢<br>體活動時，肌肉力量的強<br>弱會有所不同呢？<br>腦力激盪<br>116　選修生物 Ⅲ (全)<br><small>課本P116完整原文。</small></div><div class=\"quote\">4-3.3 自律神經系統與不隨意運動<br>自律神經系統也是周圍神經系統的一部分，負責調控心肌與平滑<br>肌的收縮，以及腺體分泌，如心跳、腸胃蠕動及汗腺分泌等。這些生<br>理反應不受大腦意識控制，因此稱為不隨意運動。<br>自律神經系統分為交感神經系統與副交感神經系統。交感神經<br>系統多在身體處於緊張或壓力狀態時活化，促使心跳加速、支氣管舒<br>張、瞳孔放大及抑制腸胃蠕動，為「打鬥或逃跑反應」作準備；副交<br>感神經系統則在身體放鬆或休息時活化，有助於心跳降低、支氣管收<br>縮、瞳孔縮小及促進消化等，維持「休息與消化狀態」。<br>與體神經系統不同，自律神經系統的訊號傳遞需經過兩個神經<br>元，分別為節前神經元與節後神經元。交感神經系統節前神經元的細<br>胞本體位於中樞神經系統，軸突經周圍神經系統後，會在脊髓旁的交<br>感神經節（圖 4－10）與節後神經元形成突觸，再由節後神經元將訊<br>息傳至動器。副交感神經系統的節前神經元則較長，軸突由中樞神經<br>系統發出後，可延伸至目標器官附近或進入器官內，才與節後神經元<br>形成突觸。這種兩段式的傳遞雖然速度較慢，但能提供更具彈性的調<br>控，使自律神經系統得以因應不同需求，精細地調節生理功能。<br>交感神經系統與副交感神經系統雖然分別作用，但常同時支配<br>同個器官，彼此拮抗，如交感神經系統使心跳加快，副交感神經系統<br>則使心跳減緩。人體有些生理作用則需要兩者協同完成，如副交感<br>神經系統引起陰莖充血、勃起，而交感神經系統則引起射精（圖 4－<br>21）。<br>人體透過交感與副交感神經系統的拮抗與協同作用，持續調節體<br>內環境的恆定，並確保身體在不同狀態下皆能穩定運作。<br>交感神經系統　sympathetic nervous system<br>副交感神經系統　parasympathetic nervous system<br>118　選修生物 Ⅲ (全)<br><small>課本P118完整原文。</small></div><div class=\"quote\">節前<br>神經元<br>節<br>後<br>神經元<br>中樞<br>動器<br>4-3.3 <br>自律神經系統與不隨意運動<br>◆ 自律神經系統的訊號傳遞需經過<br>兩個<br>神經元<br>◆<br> 第一個<br>神經元稱為<br>節前神經元<br>，第二個<br>神經元稱為<br>節後神經元<br>◆ <br>第一個神經元<br>的細胞體位在中樞內，<br>第二個神經元<br>的細胞體在中樞以外<br>◆ 兩個神經元形成<br>突觸處，稱為<br>自律神經節<br>第一個<br>神經元<br>第二個<br>神經元<br>自律<br>神經節<br>補充<br>交感神經系統<small>原PPT第24頁完整原文；補充與原文分 心跳、腸胃蠕動及汗腺分泌等。這些生<br>理反應不受大腦意識控制，因此稱為不隨意運動。<br>自律神經系統分為交感神經系統與副交感神經系統。交感神經<br>系統多在身體處於緊張或壓力狀態時活化，促使心跳加速、支氣管舒<br>張、瞳孔放大及抑制腸胃蠕動，為「打鬥或逃跑反應」作準備；副交<br>感神經系統則在身體放鬆或休息時活化，有助於心跳降低、支氣管收<br>縮、瞳孔縮小及促進消化等，維持「休息與消化狀態」。<br>與體神經系統不同，自律神經系統的訊號傳遞需經過兩個神經<br>元，分別為節前神經元與節後神經元。交感神經系統節前神經元的細<br>胞本體位於中樞神經系統，軸突經周圍神經系統後，會在脊髓旁的交<br>感神經節（圖 4－10）與節後神經元形成突觸，再由節後神經元將訊<br>息傳至動器。副交感神經系統的節前神經元則較長，軸突由中樞神經<br>系統發出後，可延伸至目標器官附近或進入器官內，才與節後神經元<br>形成突觸。這種兩段式的傳遞雖然速度較慢，但能提供更具彈性的調<br>控，使自律神經系統得以因應不同需求，精細地調節生理功能。<br>交感神經系統與副交感神經系統雖然分別作用，但常同時支配<br>同個器官，彼此拮抗，如交感神經系統使心跳加快，副交感神經系統<br>則使心跳減緩。人體有些生理作用則需要兩者協同完成，如副交感<br>神經系統引起陰莖充血、勃起，而交感神經系統則引起射精（圖 4－<br>21）。<br>人體透過交感與副交感神經系統的拮抗與協同作用，持續調節體<br>內環境的恆定，並確保身體在不同狀態下皆能穩定運作。<br>交感神經系統　sympathetic nervous system<br>副交感神經系統　parasympathetic nervous system<br>118　選修生物 Ⅲ (全)<br><small>課本P118完整原文。</small></div><div class=\"quote\">交感神經系統<br>副交感神經系統<br>交感神經系統<br>副交感神經系統<br>拮抗作用<br>協同作用<br>抑制流淚<br>刺激流淚<br>抑制唾液分泌<br>促使唾液分泌<br>使支氣管舒張<br>使支氣管收縮<br>增加心跳速率<br>降低心跳速率<br>促進腎上腺素的釋放<br>抑制胃和胰臟的活動<br>及分泌<br>降低腸道蠕動<br>抑制膀胱收縮<br>引起射精<br>引起勃起<br>促進膀胱收縮<br>促進胃和胰臟的活動<br>及分泌<br>促進膽汁的釋放<br>促進肝糖合成<br>促進葡萄糖的釋放<br>抑制膽汁的釋放<br>瞳孔放大<br>瞳孔縮小<br>促進腸道蠕動<br> 圖 4－21　交感神經與副交感神經系統的分布與作用示意圖，圖中腎上腺沒有副交感神經系統分布。<br>第 4 章  感應　119<br><small>課本P119完整原文。</small></div><div class=\"quote\">▪ 多在身體處於緊張或壓力狀態時活化<br>，為「打鬥或逃跑反應」作準備<br>▪ 促<br>心跳加速<br>、<br>支氣管舒張<br>、<br>瞳孔放大<br>、<br>抑制腸胃蠕動<br>等<br>▪ <br>促<br>心跳降低<br>、<br>支氣管收縮<br>、<br>瞳孔縮小<br>、<br>促進消化<br>等<br>▪ 在身體放鬆或休息時活化<br>，維持「休息與消化狀態」<br>◇ <br>交感神經系統<br>◇ <br>副<br>交感神經系統<br>4-3.3 <br>自律神經系統與不隨意運動<br>◆ <br>交感神經系統<br>與<br>副交感神經系統<br>雖然分別作用，但常同時支配同個器官，彼此<br>拮抗<br>配合課本 <br>P118<small>原PPT第30頁完整原文；補充與原文分列。</small></div><div class=\"quote\">副交感神經系統<br>交感神經系統<br>拮抗作用<br>● 刺激流淚<br>● 瞳孔縮小<br>● 促使唾液分泌<br>● 使支氣管收縮<br>● 降低心跳速率<br>● 促進肝糖合成<br>● 促進膽汁的釋放<br>● 促進胃和胰臟的活動及分泌<br>● 促進腸道蠕動<br>● 促進膀胱收縮<br>● 抑制流淚<br>● 瞳孔放大<br>● 抑制唾液分泌<br>● 使支氣管舒張<br>● 增加心跳速率<br>● 促進葡萄糖的釋放<br>● 抑制膽汁的釋放<br>● 抑制胃和胰臟的活動及分泌<br>● 促進腎上腺素的釋放<br>● 降低腸道蠕動<br>● 抑制膀胱收縮<br>4-3.3 <br>自律神經系統與不隨意運動<br>配合課本 <br>P119<small>原PPT第32頁 ，並確保身體在不同狀態下皆能穩定運作<br>◆ 人體有些生理作用則需要<br>交感神經系統<br>和<br>副交感神經系統<br>協同<br>完成<br>4-3.3 <br>自律神經系統與不隨意運動<br>→ 如<br>副交感神經系統<br>引起<br>陰莖充血<br>、<br>勃起<br>，而<br>交感神經系統<br>則引起<br>射精<br>配合課本 <br>P118<br>拮抗作用與協同作用<small>原PPT第31頁完整原文；補充與原文分列。</small></div><div class=\"quote\">4-3.3 <br>自律神經系統與不隨意運動<br>配合課本 <br>P119<br>協同作用<br>交感神經系統<br>副交感神經系統<br>● 引起射精<br>● 引起勃起<small>原PPT第33頁完整原文；補充與原文分列。</small></div><div class=\"quote\">  <br>Question<br>1. <br>下列有關人體神經系統的敘述，何者正確<br>？　<br>(<br>A)<br>自律神經皆為<br>運動神經　<br>(<br>B)<br>周圍神經系統與中樞神經系統為獨立的兩套系統，互不<br>相連　<br>(<br>C)<br>刺激副交感神經會使瞳孔<br>放大　<br>(<br>D)<br>刺激交感神經會使腸胃蠕動加快、血糖上升<br>。<br>【107.<br>指考修訂<br>】<br>解答<br>：<br>(<br>A<br>)<br> <br>解析<br>：<br>(<br>B)<br>周圍神經系統可接受訊息傳至中樞神經系統，中樞的命令可透過周圍神經系統傳達至動器<br>。<br>(<br>C)<br>刺激交感神經會使瞳孔放大<br>。<br>(<br>D)<br>刺激交感神經會使腸胃蠕動減緩。<br>34<small>原PPT第34頁完整原文；補充與原文分列。</small></div><div class=\"quote\">  <br>Question<br>2<br>. <br>小翰開車時遇到突然衝出來的老奶奶，他趕快腳踩剎車，避免車禍發生。有關參與這個過程的神經系統與肌肉，下列敘述何者正確<br>？　<br>(<br>A)<br>小翰及時阻止車禍發生，仰賴他的反射神經很<br>發達　<br>(<br>B)<br>控制單一手指肌肉纖維的神經元數目，大於控制單一大腿肌肉纖維的神經元<br>數目　<br>(<br>C)<br>控制手指肌肉的單一神經元所控制的肌纖維數目，少於控制大腿肌肉的神經元所控制的肌纖維<br>數目　<br>(<br>D)<br>運動神經元軸突末端釋出鈉離子，引起大腿肌肉收縮。<br>解答<br>：<br>(<br>C)<br> <br>35<br>解<br>析<br>：<br>(<br>A)<br>此過程涉及的是體神經系統，經過大腦判斷，並非反射反應。 <br>(B)<br>單一肌纖維皆僅受一個運動神經元控制。 <br><br>(<br>D)<br>運動神經元軸突末端釋出乙醯膽鹼，與大腿肌肉細胞膜上之受體結合後，促使大腿肌肉收縮。<small>原PPT第35頁完整原文；補充與原文分列。</small></div><div class=\"quote\">  <br>Question<br>3<br>. <br>下列有關自律神經的敘述，何者正確<br>？　<br>(<br>A)<br>自律神經系統包含感覺神經元與運動<br>神經元　<br>(<br>B)<br>交感與副交感神經系統對生理的作用皆屬拮抗<br>作用　<br>(<br>C)<br>遇到緊急狀況時，副交感神經系統會活化應對環境<br>變化　<br>(<br>D)<br>部分臟器或腺體僅受交感神經支配，不受副交感神經調控。<br>解答<br>：<br>(<br>D)<br> <br>解析<br>：<br>(<br>A)<br>自律神經系統皆為運動神經元<br>。<br>(<br>B)<br>交感與副交感神經系統的協調作用可分為拮抗作用與協同作用<br>。<br>(<br>C)<br>交感神經活化可讓個體應對緊急狀況。<br>36<small>原PPT第36頁完整原文；補充與原文分列。</small></div>", "tb": [["book_005", "P118完整課本頁"], ["book_006", "P119完整課本頁"]]}], "questions": [{"t": "圖4–17：把系統名稱貼回原圖", "q": "把三個名稱放回課本圖的空格；有兩張多餘卡。", "learn": 0, "tag": "path", "hint": "追蹤引線、位置與訊息方向 , "pw": 256, "ph": 42, "tray": {"x": 20, "y": 280, "cols": 2, "gapX": 16, "gapY": 12}}, {"kind": "mc", "multi": false, "g": "g2", "title": "骨骼肌滑行學說中肌小節帶區變化判定", "sub": "課本 P117 肌小節收縮分子構造考點", "label": "單選題", "q": "當骨骼肌肌小節在 ATP 與 Ca²⁺ 充足條件下進行強烈等張收縮時，顯微鏡下觀察其明暗帶與各線段變化，何者完全正確？", "hint": "肌凝蛋白長度（A 帶）會改變嗎？細肌絲向中央滑行會使哪幾區縮短？", "ref": ["p5_autonomic_pathway", "課本 P117 肌小節滑行學說"], "opts": [["粗肌絲長度縮短導致 A 帶（暗帶）明顯變窄", "T1"], ["A 帶（暗帶）長度保持不變，I 帶（明帶）與 H 區縮短變窄，兩 Z 線距離拉近", null], ["細肌絲解聚斷裂，導致兩條 Z 線彼此推遠", "T1"], ["肌小節收縮時粗肌絲與細肌絲彼此等長收縮變短，蛋白質分子長度縮水", "T1"]], "ans": [1], "exp": "B正確：根據滑行學說（Sliding filament theory），肌肉收縮是粗肌絲（肌凝蛋白）與細肌絲（肌動蛋白）互相滑行重疊，蛋白質本身長度並未變短！因此代表粗肌絲全長的『A 帶（暗帶）長度恆定不變』；而僅含細肌絲的『I 帶』縮短、僅含粗肌絲的『H 區』變窄甚至消失，相鄰兩條『Z 線』互相靠近使整個肌小節縮短。"}, {"kind": "mc", "multi": false, "g": "g2", "title": "ATP 在橫橋循環中之精確分子角色", "sub": "課本 P117 肌肉能量代謝與橫橋循環", "label": "單選題", "q": "在肌肉收縮的橫橋循環中，『新的 ATP 分子與肌凝蛋白頭部結合』所引發的直接效應為何？若細胞完全缺乏 ATP 會導致何種現象？", "hint": "ATP 結合是讓橫橋結合還是脫離？缺乏 ATP 會產生屍僵嗎？", "ref": ["p5_autonomic_pathway", "課本 P117 橫橋循環與ATP"], "opts": [["促使肌凝蛋白頭部與肌動蛋白緊密結合形成橫橋；缺乏 ATP 會使肌肉極度鬆弛", "T1"], ["促使肌凝蛋白頭部從肌動蛋白上脫離解離；若完全缺乏 ATP 橫橋無法脫落將導致『屍僵』", null], ["促使旋轉素與鈣離子結合；缺乏 ATP 會造成肌漿網自發破裂釋放鈣離子", "T1"], ["促使神經末梢停止釋放乙醯膽鹼；缺乏 ATP 會引起全身神經元過極化", "T1"]], "ans": [1], "exp": "B正確：在橫橋循環中，新的 ATP 結合於肌凝蛋白頭部是促成『橫橋與肌動蛋白脫離解離』的關鍵步驟；隨後 ATP 水解為 ADP 與 Pi 才能使頭部復位充電。動物死亡後呼吸停止、ATP 生成中斷，肌漿網無法將 Ca²⁺ 泵回，且缺乏 ATP 使肌凝蛋白頭部永遠無法與肌動蛋白分開，導致全身肌肉僵硬固定的『屍僵（Rigor mortis）』現象。"}, {"kind": "mc", "multi": true, "g": "g2", "title": "人體骨骼關節與拮抗肌槓桿運作綜合分析", "sub": "課本 P115 骨骼肌肉力學多選考點", "label": "多選題", "q": "關於人體骨骼、關節與骨骼肌之運動力學，下列敘述哪些正確？（應選 3 項）", "hint": "檢核肌肉主動拉、肌腱連骨肌、韌帶連骨骨、滑液囊軟骨保護。", "ref": ["p2_antagonistic_muscles", "課本 P115 骨骼肌拮抗"], "opts": [["骨骼肌只能主動收縮拉引骨骼，無法主動推動骨骼，故肢體運動必由拮抗肌協同完成", null], ["肌腱為緻密結締組織，連接骨骼肌與骨骼；韌帶亦為結締組織，負責連接相鄰骨骼以穩定關節", null], ["滑液關節兩端的關節軟骨由無血管的透明軟骨構成，具備緩衝減磨之關鍵功效", null], ["手臂屈曲時，主動肌肱二頭肌與拮抗肌肱三頭肌皆同時處於強烈縮短收縮狀態", "T1"], ["人體骨骼只具備機械支持與運動槓桿功能，完全不參與體內礦物質鈣磷之恆定代謝", "T1"]], "ans": [0, 1, 2], "exp": "A、B、C正確。D錯：手臂屈肘時肱二頭肌收縮，肱三頭肌必須『舒張放鬆』；E錯：骨骼為人體最大鈣、磷儲存庫，隨時受副甲狀腺素與降鈣素調控釋出或沉積以維持血液鈣磷恆定。"}, {"kind": "mc", "multi": true, "g": "g2", "title": "運動單位概念與運動肌肉收縮力量調控", "sub": "課本 P116 運動單位與精準運動控制", "label": "多選題", "q": "大腦皮質指揮人體肌肉完成精細書寫或劇烈跳躍時，下列關於『運動單位（Motor unit）』與肌力調節之敘述哪些正確？（應選 3 項）", "hint": "檢核運動單位定義（一神經元配多肌纖維）、動作精細度（小運動單位）、力量調節方式。", "ref": ["p3_motor_unit", "課本 P116 運動單位"], "opts": [["一個運動單位是由單一運動神經元及其所支配的所有骨骼肌纖維共同組成", null], ["支配眼球轉動或手部指肌的運動單位較小（支配肌纖維少），動作控制精細度極高", null], ["增加神經衝動發放頻率可誘發肌纖維產生強直收縮，進而增強單一運動單位的收縮張力", null], ["單一條骨骼肌纖維通常可同時接受數十個不同脊髓運動神經元的軸突分枝支配", "T2"], ["人體搬動 10 公斤重物與拿取 1 公克羽毛時，脊髓募集興奮的運動神經元數目完全相同", "T2"]], "ans": [0, 1, 2], "exp": "A、B、C正確。D錯：每一條骨骼肌纖維僅受『單一』運動神經元支配；E錯：拿重物時中樞神經系統會『募集（Recruit）』更多、更大的運動單位參與收縮，產生更大總肌力。"}, {"kind": "mc", "multi": true, "g": "g2", "title": "交感與副交感神經對人體內臟調控之解剖生理分析", "sub": "課本 P118–119 自律神經深入整合", "label": "多選題", "q": "下列關於人體自律神經系統（交感神經與副交感神經）的構造特徵與生理功能，哪些正確？（應選 3 項）", "hint": "檢核交感胸腰脊髓、副交感腦幹薦髓、節前節後長度、神經傳遞物。", "ref": ["p6_sympath_parasympath", "課本 P118 自律神經系統"], "opts": [["交感神經的節前神經元起源於脊髓的胸段與腰段，其節前纖維短、節後纖維長", null], ["副交感神經的節前神經元起源於腦幹與脊髓薦段，其節前纖維長、節後纖維短", null], ["副交感神經興奮會促使心跳減慢、支氣管收縮，並刺激腸胃道蠕動與消化腺分泌", null], ["交感神經與副交感神經的節後神經元末梢皆一律釋放正腎上腺素支配所有效應器官", "T3"], ["人體所有器官（包括汗腺、立毛肌與全身大部分血管）皆同時接受交感與副交感神經雙重支配", "T3"]], "ans": [0, 1, 2], "exp": "A、B、C正確。D錯：副交感神經節後纖維釋放的是『乙醯膽鹼（ACh）』，只有交感節後纖維主要釋放正腎上腺素；E錯：汗腺、立毛肌、腎上腺髓質與大多數小動脈血管僅接受『交感神經單一支配』，無副交感神經分佈。"}], "bookText": ["人體的骨骼提供保護與支點，肌肉則透過收縮牽動骨骼產生\n動作，如呼吸運動。這一過程需仰賴神經系統的控制與協調，將\n訊息傳送至正確的肌肉，精準啟動各種隨意或不隨意的反應。\n4-3.1 神經系統對運動的協調\n人體的運動反應是維持生理功能的重要一環。根據動器的類\n型不同，可分為控制隨意運動的體神經系統與控制不隨意運動的\n自律神經系統（圖4－17）。\n體神經系統控制骨骼肌，可由大腦意識直接指揮；自律神經\n系統則調控平滑肌、心肌及腺體，屬於不隨意運動，由除了大腦\n以外的中樞神經系統控制。\n這兩種系統雖然各自控制不同類型的動器，但也常合作以維\n持恆定與對環境的適應。例如：面對高溫環境，體神經系統使人\n逃離熱源、避免傷害；自律神經系統則使汗腺出汗以降低體溫。\n-3 肌肉與骨骼\n4\n 圖 4－17　人體神經系統的功能組成與訊息傳遞方向\n內、外在環境刺激\n感覺受器\n統\n系\n入\n傳\n統\n系\n出\n傳\n中樞神經系統\n(腦與脊髓)\n感覺神經\n動器\n體神經系統\n動器\n動器\n副交感神經系統\n交感神經系統\n自律神經系統\n運動神經\n114　選修生物 Ⅲ (全)\n", "骨骼肌屬於隨意肌，受大腦意識控制，隨意運動通常\n是由成對的骨骼肌執行，例如：控制手臂屈伸的肱二頭肌\n與肱三頭肌，肱二頭肌收縮時手臂彎曲，屬於屈肌；肱三\n頭肌收縮時手臂伸直，屬於伸肌。當肱二頭肌收縮時肱三\n頭肌舒張，而肱三頭肌收縮時肱二頭肌舒張，此種現象稱\n為拮抗作用（圖4－18）。　\n　　在神經系統的調控下，人體可藉由肌肉牽動骨骼而表\n現各種動作，若只有肌肉而沒有骨骼，將會使身體運作困\n難，甚至無法支撐與直立。骨骼包含硬骨與軟骨，皆屬於\n結締組織。硬骨主要功能為提供肌肉與肌腱附著點，以協\n助人體進行運動、支持與保護體內臟器，此外硬骨中可儲\n存鈣、磷等元素，也可釋放至血液中，以穩定體內無機鹽\n的恆定狀態。軟骨中的鈣質與無機鹽含量較硬骨少，相對\n柔軟且具有彈性，常位於硬骨兩端，主要作用為減少硬骨\n間所產生的磨擦，或是維持某些身體部位的形狀，例如：\n氣管的軟骨。關節是骨與骨之間的連接處，其中關節兩端\n的硬骨會藉由韌帶加以固定（圖4－19）。\n 圖 4－18　\n肌肉的拮抗作用。a手臂彎曲\n時；b手臂伸直時。\n關節　joint\n 圖 4－19　膝關節構造示意圖，骨骼之間以韌帶固定。\n硬骨\n韌帶\n軟骨\n肌腱\n肌腱\n肱三頭肌收縮尺骨\n橈骨\n肱骨\n肱二頭肌舒張\n肱二頭肌收縮\n肱三頭肌舒張\na\nb\n第 4 章  感應　115\n", "神經肌肉會合處　neuromuscular junction\n乙醯膽鹼　acetylcholine, ACh\n運動終板　motor end plate\n運動單位　motor unit\n4-3.2 體神經系統與隨意運動\n人體的隨意運動由體神經系統控制骨骼肌來達成。體神\n經系統是周圍神經系統的一部分，負責將中樞神經系統的\n訊息傳至骨骼肌，進行隨意運動，例如：走路、書寫或說話\n等。骨骼肌具有明顯的橫紋構造，屬於橫紋肌，同時又因可\n受意識控制的特性，屬於隨意肌。\n體神經系統中的運動神經元，其細胞本體位於脊髓或腦\n幹內，而軸突可延伸至骨骼肌，並與肌纖維形成一種特殊的\n突觸，稱為神經肌肉會合處。當動作電位傳導至此處時，運\n動神經元的軸突末梢會釋放乙醯膽鹼（ACh），與肌纖維細\n胞膜上的受體結合，進而引發肌肉收縮。在肌纖維的細胞膜\n中，只有與神經末梢接觸的局部區域稱為運動終板（圖4－\n20），其表面分布大量乙醯膽鹼受體，能有效接收來自神經\n元的訊號，確保肌肉對刺激產生快速而準確的反應。\n一條骨骼肌纖維僅由一條運動神經元支配，但一條運動\n神經元可支配多條肌纖維。一個運動神經元與所支配的所有\n肌纖維，合稱為一個運動單位，當一個運動神經元產生動作\n電位時，同一運動單位的肌纖維會一起收縮，故運動單位\n愈小，支配的肌纖維愈少，動作控制愈精細，例如：彈鋼琴\n時，眼球與手指的微小移動；反之，運動單位愈大，支配的\n肌纖維愈多，可產生較大的力量，例如：跳遠時，大腿與軀\n幹肌肉用於奔跑、跳躍。這種支配方式讓人體能依不同的需\n求，執行各種運動。 \n　　提重物與輕物時需要\n的力量不同，為何每次肢\n體活動時，肌肉力量的強\n弱會有所不同呢？\n腦力激盪\n116　選修生物 Ⅲ (全)\n", "突觸間隙\n肌\n纖\n維\n突觸囊泡\n肌纖維的細胞膜\n運動終板\n運動終板\n乙醯膽鹼\n乙醯膽鹼\n肌肉\n肌腱\n硬骨\na\nb\n肌纖維\n運動神經元\n受體\n受體\n 圖 4－20　\n運動終板。a每條肌纖維只受一個運動神經元控制；b運動神經元軸突末梢與肌纖維所形成的突觸。\n（\n 代表訊號傳遞方向）\n第 4 章  感應　117\n", "4-3.3 自律神經系統與不隨意運動\n自律神經系統也是周圍神經系統的一部分，負責調控心肌與平滑\n肌的收縮，以及腺體分泌，如心跳、腸胃蠕動及汗腺分泌等。這些生\n理反應不受大腦意識控制，因此稱為不隨意運動。\n自律神經系統分為交感神經系統與副交感神經系統。交感神經\n系統多在身體處於緊張或壓力狀態時活化，促使心跳加速、支氣管舒\n張、瞳孔放大及抑制腸胃蠕動，為「打鬥或逃跑反應」作準備；副交\n感神經系統則在身體放鬆或休息時活化，有助於心跳降低、支氣管收\n縮、瞳孔縮小及促進消化等，維持「休息與消化狀態」。\n與體神經系統不同，自律神經系統的訊號傳遞需經過兩個神經\n元，分別為節前神經元與節後神經元。交感神經系統節前神經元的細\n胞本體位於中樞神經系統，軸突經周圍神經系統後，會在脊髓旁的交\n感神經節（圖 4－10）與節後神經元形成突觸，再由節後神經元將訊\n息傳至動器。副交感神經系統的節前神經元則較長，軸突由中樞神經\n系統發出後，可延伸至目標器官附近或進入器官內，才與節後神經元\n形成突觸。這種兩段式的傳遞雖然速度較慢，但能提供更具彈性的調\n控，使自律神經系統得以因應不同需求，精細地調節生理功能。\n交感神經系統與副交感神經系統雖然分別作用，但常同時支配\n同個器官，彼此拮抗，如交感神經系統使心跳加快，副交感神經系統\n則使心跳減緩。人體有些生理作用則需要兩者協同完成，如副交感\n神經系統引起陰莖充血、勃起，而交感神經系統則引起射精（圖 4－\n21）。\n人體透過交感與副交感神經系統的拮抗與協同作用，持續調節體\n內環境的恆定，並確保身體在不同狀態下皆能穩定運作。\n交感神經系統　sympathetic nervous system\n副交感神經系統　parasympathetic nervous system\n118　選修生物 Ⅲ (全)\n", "交感神經系統\n副交感神經系統\n交感神經系統\n副交感神經系統\n拮抗作用\n協同作用\n抑制流淚\n刺激流淚\n抑制唾液分泌\n促使唾液分泌\n使支氣管舒張\n使支氣管收縮\n增加心跳速率\n降低心跳速率\n促進腎上腺素的釋放\n抑制胃和胰臟的活動\n及分泌\n降低腸道蠕動\n抑制膀胱收縮\n引起射精\n引起勃起\n促進膀胱收縮\n促進胃和胰臟的活動\n及分泌\n促進膽汁的釋放\n促進肝糖合成\n促進葡萄糖的釋放\n抑制膽汁的釋放\n瞳孔放大\n瞳孔縮小\n促進腸道蠕動\n 圖 4－21　交感神經與副交感神經系統的分布與作用示意圖，圖中腎上腺沒有副交感神經系統分布。\n第 4 章  感應　119\n"], "pptText": {"1": "4-3 \n肌肉與骨骼\n4-3.1 \n神經系統對運動的協調\n4-3.2 \n體神經系統與隨意運動\n4-3.3 \n自律神經系統與不隨意運動\n       人體的骨骼提供保護與支點，肌肉則透過收縮牽動骨骼產生動作。這一過程需仰賴神經系統的控制與協調，將訊息傳送至正確的肌肉，精準啟動各種隨意或不隨意的反應。", "2": "傳入系統\n周圍神經系統\n傳出系統\n中樞神經系統\n4-3.1 \n神經系統對運動的協調\n內、外在環境的刺激\n◆ 人體神經系統的組成與訊息傳遞\n方向\n：\n感覺神經\n感覺受器\n腦與脊髓\n運動神經\n交感神經系統\n副交感神經系統\n動器\n動器\n配合課本 \nP114\n骨骼肌\n體神經\n系統\n自律神經系統\n平滑肌\n心肌\n腺體", "3": "4-3.1 \n神經系統對運動的協調\n◆ \n體神經\n系統\n◇\n 屬\n周圍神經系統\n◇\n 屬\n運動\n神經\n◇ 將中樞神經系統的訊息傳至骨骼肌，進行\n隨意運動\n◇ \n由\n大腦\n意識指揮\n◇ 動器為\n骨骼肌\n配合課本 \nP114", "4": "◆ \n自律神經\n系統\n◇\n 屬\n周圍神經系統\n◇\n 屬\n運動\n神經\n◇ 將中樞神經系統的訊息傳至平滑肌、心肌或腺體\n，\n\n進行\n不隨意運動\n◇ 由\n除了大腦以外的中樞神經系統\n控制\n◇ 動器為\n平滑肌\n、\n心肌\n或\n腺體\n4-3.1 \n神經系統對運動的協調\n配合課本 \nP114", "5": "4-3.1 \n神經系統對運動的協調\n◆ \n體神經系統\n與\n自律神經系統\n常合作以維持恆定與對環境的適應\n→ \n例如\n：\n面對高溫環境，\n體神經系統\n使人逃離熱源、避免傷害；\n自律神經系統\n則使汗腺出汗以降低體溫\n配合課本 \nP114\n自律\n神經系統", "6": "骨骼肌\n4-3.1 \n神經系統對運動的協調\n◆ 隨意運動通常是由成對的\n骨骼肌\n執行\n● \n骨骼肌\n透過\n肌腱\n附著於骨骼\n● \n肌纖維有\n橫\n紋\n，屬於橫紋肌\n● \n收縮受\n大腦\n意識控制\n，屬於\n隨意肌\n● 骨骼肌細胞\n形狀細長，亦稱為\n肌纖維\n● 一個肌纖維有\n多個\n位於\n細胞邊緣\n的細胞核\n● 數條骨骼肌細胞被\n肌束膜\n包裹形成\n肌束\n10\n \nµm\n骨骼肌細胞\n橫紋\n配合課本 \nP12\n、\n115", "7": "肱骨\n肌腱\n橈骨\n尺骨\n肱三頭肌舒張\n肱三頭肌收縮\n肱二頭肌收縮\n肱二頭肌舒張\n→ 當肱二頭肌收縮時肱三頭肌舒張，而肱三頭肌收縮時肱二頭肌舒張，此現象稱為\n拮抗作用\n→ 肱二頭肌收縮時手臂彎曲，屬於\n屈肌\n→ 肱三頭肌收縮時手臂伸直，屬於\n伸肌\n◆ 以手臂屈伸為\n例\n：\n4-3.1 \n神經系統對運動的協調\n手臂彎曲\n手臂伸直\n配合課本 \nP115", "8": "4-3.1 \n神經系統對運動的協調\n▪ 儲存鈣、磷等元素，也可釋放至血液中，以穩定體內無機鹽的恆定狀態\n◆ \n骨骼\n：\n硬骨\n▪ \n提供\n肌肉與肌腱的附著點\n， 協助人體進行運動\n▪ 支持\n▪ 保護體內臟器\n◇ 屬結締組織\n◇ 包含硬骨與軟骨\n配合課本 \nP115", "9": "▪ 鈣質與無機鹽含量較硬骨少，相對柔軟且具有彈性\n▪ 常位於硬骨兩端，\n可\n減少硬骨間所產生的磨擦\n▪ 維持某些身體部位的形狀，例如\n：\n氣管的軟骨\n軟\n骨\n4-3.1 \n神經系統對運動的協調\n配合課本 \nP115", "10": "◆ \n關節\n：\n4-3.1 \n神經系統對運動的協調\n硬骨\n軟骨\n韌帶\n固定關節兩端的硬骨\n以膝關節為例\n配合課本 \nP115", "11": "4-3.2 \n體神經系統與隨意運動\n運動神經元\n硬骨\n肌腱\n肌肉\n肌纖維\n◆ \n體神經系統中的運動神經元，細胞本體位於脊髓或腦內\n，軸突可延伸至骨骼肌\n配合課本 \nP116\n、\n117", "12": "4-3.2 \n體神經系統與隨意運動\n突觸囊泡\n肌纖維的細胞膜\n突觸間隙\n肌纖維\n運動神經元\n配合課本 \nP116\n、\n117\n◆ \n運動神經元的軸突\n與\n肌纖維\n之間\n形成一種特殊的突觸，稱為\n神經肌肉會合處", "13": "4-3.2 \n體神經系統與隨意運動\n突觸囊泡\n肌纖維的細胞膜\n突觸間隙\n肌纖維\n受體\n乙醯膽鹼\n運動終板\n◆ 在肌纖維的細胞膜\n中\n，只有與神經末梢接觸的局部區域稱為\n運動終板\n◆ \n運動終板\n表面分布大量\n乙醯膽鹼受體\n，能有效接收來自神經元的訊號\n運動神經元\n配合課本 \nP116\n、\n117", "14": "乙醯膽鹼\n電位敏感型\n鈣離子通道\nCa\n2+\nNa\n+\n化學敏感型鈉離子通道\n（可\n結合神經傳\n遞\n物而開啟閘門\n）\n突觸囊泡\n體神經系統\n的\n運動\n神經元\n運動終板\n（ 肌纖維\n的\n細胞膜 ）\n4-3.2 \n體神經系統與隨意運動\n補充", "15": "Ca\n2+\nNa\n+\n①\n 動作\n電位傳導至軸突末梢\n4-3.2 \n體神經系統與隨意運動\n補充", "16": "Ca\n2+\nNa\n+\n②\n 電位敏感型\n鈣離子通道打開，細胞外\n的鈣離子流入\n軸突末梢\n4-3.2 \n體神經系統與隨意運動\n補充", "17": "Na\n+\n③\n 突\n觸囊泡向軸突末梢移動，與細胞膜融合，並釋出乙醯膽鹼\n④\n 乙\n醯膽鹼擴散於突觸間隙，與位於突觸後神經元細胞膜上的受體結合\n4-3.2 \n體神經系統與隨意運動\n補充", "18": "Ca\n2+\nNa\n+\n⑤\n 與\n受體連結\n的鈉離子通道\n開啟，導致突觸後神經元的膜電位產生變化\n→ 若達到閾值電位，便可在肌纖維引發動作電位，\n導致肌纖維收縮\n→ \n鈉離子通道\n開啟\n→ 細胞\n外鈉離子較\n多，\n \n鈉離子流入\n細胞\n→ 引起\n去極化\n⑥\n 突\n觸間隙處的酵素\n將\n\n乙\n醯膽鹼分解，肌纖維舒張\n4-3.2 \n體神經系統與隨意運動\n補充", "19": "4-3.2 \n體神經系統與隨意運動\n◆ 一條骨骼肌纖維僅由一條運動神經元支配，但一條運動神經元可支配多條肌纖維\n配合課本 \nP116\n、\n117", "20": "4-3.2 \n體神經系統與隨意運動\n◆ 一個運動神經元與所支配的所有肌纖維，合稱為一個\n運動單位\n◆ 當一個運動神經元產生動作電位時，同一運動單位的肌纖維會\n一起\n\n收縮\n配合課本 \nP116\n、\n117", "21": "→ 例如\n：\n彈鋼琴時，眼球與手指的微小移動\n4-3.2 \n體神經系統與隨意運動\n◆ 運動單位愈小，支配的肌纖維愈少，動作控制愈精細\n→ \n例如\n：\n跳遠\n時，大腿與軀幹肌肉用於奔跑、跳躍\n◆ 運動單位愈大，支配的肌纖維愈多，可產生較大的力量\n配合課本 \nP116", "22": "  \n腦力激盪\n提重物與輕物時需要的力量不同，為何每次肢體活動時，肌肉力量的強弱會有所不同呢？\n配合課本 \nP116\n答\n：\n肌肉能夠根據需求產生不同強度的力量，主要透過以下幾個生理\n機制\n：\n1\n. \n運動單位募集（\nmotor unit recruitment\n）：當肌肉需要產生力量時，神經系統會依序動員更多的運動單位來參與收縮，這個「依序啟用」的過程就稱為「運動單位募集」。\n一個運動單位由一個運動神經元及它所支配的肌纖維群組成。提輕物時，只需少數運動單位參與，只募集小型運動單位，如慢縮肌纖維（\nTypeⅠ\n）產生的力量較小，但具有高度耐疲勞能力，適合長時間運動。提重物時，大腦會募集更多運動單位，並募集中型和大型運動單位，如快縮肌纖維（\nType Ⅱ\n）收縮速度快，能產生較大的力量，但較容易疲勞，能因為訓練顯著增加其截面積，使肌肉變得更粗\n。\n22", "23": "  \n腦力激盪\n提重物與輕物時需要的力量不同，為何每次肢體活動時，肌肉力量的強弱會有所不同呢？\n配合課本 \nP116\n答\n：\n2. \n動作電位頻率調節\n：\n透過改變神經衝動的頻率來調整力量，若是低頻刺激，會產生較弱的肌肉收縮（單收縮或不完全強直收縮）；當動作電位的頻率提高，肌纖維的收縮會疊加，甚至達到完全強直收縮，產生最大力量。\n3. \n中樞神經系統的調\n控\n：\n大腦\n皮質的初級運動皮質（\nM1\n）會計畫和執行動作，前運動皮質和輔助運動區會規劃力量大小，基底核和小腦則會協調和微調力量輸出。回饋給肌梭（\nmuscle spindle\n）偵測肌肉長度變化，高基氏腱器官（\nGolgi tendon organ\n）偵測肌肉張力，以即時調整力量的大小。\n23", "24": "節前\n神經元\n節\n後\n神經元\n中樞\n動器\n4-3.3 \n自律神經系統與不隨意運動\n◆ 自律神經系統的訊號傳遞需經過\n兩個\n神經元\n◆\n 第一個\n神經元稱為\n節前神經元\n，第二個\n神經元稱為\n節後神經元\n◆ \n第一個神經元\n的細胞體位在中樞內，\n第二個神經元\n的細胞體在中樞以外\n◆ 兩個神經元形成\n突觸處，稱為\n自律神經節\n第一個\n神經元\n第二個\n神經元\n自律\n神經節\n補充\n交感神經系統", "25": "中樞\n動器\n體神經系統\n自律神經系統\n4-3.3 \n自律神經系統與不隨意運動\n◆ 體\n神經系統 \nvs.\n 自律\n神經系統\n配合課本 \nP118", "26": " \n體神經\n系統\n自律神經\n系統\n分\n　\n類\n \n屬於運動神經\n屬於運動神經\n \n隨　意\n可\n否\n路\n　\n徑\n經一個運動神經元到達動\n器\n經兩個運動神經元到達動\n器\n神經節\n無\n通常有\n神經傳導物質\n乙醯膽鹼\n  乙\n醯膽鹼、去甲基腎上腺素、腎上腺素\n動　器\n骨骼肌\n平滑肌、心肌和腺體\n→ 自律神經系統\n兩段式的傳遞雖然速度較慢，但能提供更具彈性的調控，使其得以因應不同需求，精細地調節生理功能\n◆ 體\n神經系統 \nvs.\n 自律\n神經系統\n4-3.3 \n自律神經系統與不隨意運動\n補充", "27": "4-3.3 \n自律神經系統與不隨意運動\n◆ 自律神經系統分為\n交感神經系統\n與\n副交感神經系統\n中樞\n動器\n節前\n神經元\n節\n後\n神經元\n交感\n神經節\n交感神經系統\n中樞\n動器\n節前\n神經元\n節\n後\n神經元\n副交感\n神經節\n副交感神經系統\n配合課本 \nP118", "28": " \n交感神經\n系統\n副\n交感神經\n系統\n發出部位\n \n \n \n神經傳導路徑\n細胞體的位置\n節前神經元\n：\n節後\n神經元\n：\n節前\n神經元\n：\n節後\n神經元\n：\n胸脊髓、腰脊髓\n腦、薦脊髓\n經兩個運動神經元到達動器\n經兩個運動神經元到達動器\n中樞\n                  \n 自律\n神經節 \n　　\n　\n　　　　  \n(\n交感神經節\n)\n                   自律神經\n節\n \n                 \n(\n副交感神經節\n)\n中樞\n4-3.3 \n自律神經系統與不隨意運動\n◆ 交感神經\n系統 \nvs.\n 副\n交感神經系統\n補充", "29": "4-3.3 \n自律神經系統與不隨意運動\n◆ 交感神經\n系統 \nvs.\n 副\n交感神經系統\n \n交感神經\n系統\n副\n交感神經\n系統\n神經纖維\n節前神經元\n：\n節後\n神經元\n：\n節前\n神經元\n：\n節後\n神經元\n：\n神經傳導\n物質\n節前\n神經元\n：\n節後\n神經元\n：\n節前\n神經元\n：\n節後\n神經元\n：\n通常較短\n通常較長\n乙醯膽鹼\n乙醯膽鹼\n長\n短\n乙醯膽鹼\n去甲基腎上腺素、腎上腺素\n補充", "30": "▪ 多在身體處於緊張或壓力狀態時活化\n，為「打鬥或逃跑反應」作準備\n▪ 促\n心跳加速\n、\n支氣管舒張\n、\n瞳孔放大\n、\n抑制腸胃蠕動\n等\n▪ \n促\n心跳降低\n、\n支氣管收縮\n、\n瞳孔縮小\n、\n促進消化\n等\n▪ 在身體放鬆或休息時活化\n，維持「休息與消化狀態」\n◇ \n交感神經系統\n◇ \n副\n交感神經系統\n4-3.3 \n自律神經系統與不隨意運動\n◆ \n交感神經系統\n與\n副交感神經系統\n雖然分別作用，但常同時支配同個器官，彼此\n拮抗\n配合課本 \nP118", "31": "◆ 人體透過交感與副交感神經系統的\n拮抗\n與\n協同\n作用，持續調節體內環境的恆定，並確保身體在不同狀態下皆能穩定運作\n◆ 人體有些生理作用則需要\n交感神經系統\n和\n副交感神經系統\n協同\n完成\n4-3.3 \n自律神經系統與不隨意運動\n→ 如\n副交感神經系統\n引起\n陰莖充血\n、\n勃起\n，而\n交感神經系統\n則引起\n射精\n配合課本 \nP118\n拮抗作用與協同作用", "32": "副交感神經系統\n交感神經系統\n拮抗作用\n● 刺激流淚\n● 瞳孔縮小\n● 促使唾液分泌\n● 使支氣管收縮\n● 降低心跳速率\n● 促進肝糖合成\n● 促進膽汁的釋放\n● 促進胃和胰臟的活動及分泌\n● 促進腸道蠕動\n● 促進膀胱收縮\n● 抑制流淚\n● 瞳孔放大\n● 抑制唾液分泌\n● 使支氣管舒張\n● 增加心跳速率\n● 促進葡萄糖的釋放\n● 抑制膽汁的釋放\n● 抑制胃和胰臟的活動及分泌\n● 促進腎上腺素的釋放\n● 降低腸道蠕動\n● 抑制膀胱收縮\n4-3.3 \n自律神經系統與不隨意運動\n配合課本 \nP119", "33": "4-3.3 \n自律神經系統與不隨意運動\n配合課本 \nP119\n協同作用\n交感神經系統\n副交感神經系統\n● 引起射精\n● 引起勃起", "34": "  \nQuestion\n1. \n下列有關人體神經系統的敘述，何者正確\n？　\n(\nA)\n自律神經皆為\n運動神經　\n(\nB)\n周圍神經系統與中樞神經系統為獨立的兩套系統，互不\n相連　\n(\nC)\n刺激副交感神經會使瞳孔\n放大　\n(\nD)\n刺激交感神經會使腸胃蠕動加快、血糖上升\n。\n【107.\n指考修訂\n】\n解答\n：\n(\nA\n)\n \n解析\n：\n(\nB)\n周圍神經系統可接受訊息傳至中樞神經系統，中樞的命令可透過周圍神經系統傳達至動器\n。\n(\nC)\n刺激交感神經會使瞳孔放大\n。\n(\nD)\n刺激交感神經會使腸胃蠕動減緩。\n34", "35": "  \nQuestion\n2\n. \n小翰開車時遇到突然衝出來的老奶奶，他趕快腳踩剎車，避免車禍發生。有關參與這個過程的神經系統與肌肉，下列敘述何者正確\n？　\n(\nA)\n小翰及時阻止車禍發生，仰賴他的反射神經很\n發達　\n(\nB)\n控制單一手指肌肉纖維的神經元數目，大於控制單一大腿肌肉纖維的神經元\n數目　\n(\nC)\n控制手指肌肉的單一神經元所控制的肌纖維數目，少於控制大腿肌肉的神經元所控制的肌纖維\n數目　\n(\nD)\n運動神經元軸突末端釋出鈉離子，引起大腿肌肉收縮。\n解答\n：\n(\nC)\n \n35\n解\n析\n：\n(\nA)\n此過程涉及的是體神經系統，經過大腦判斷，並非反射反應。 \n(B)\n單一肌纖維皆僅受一個運動神經元控制。 \n\n(\nD)\n運動神經元軸突末端釋出乙醯膽鹼，與大腿肌肉細胞膜上之受體結合後，促使大腿肌肉收縮。", "36": "  \nQuestion\n3\n. \n下列有關自律神經的敘述，何者正確\n？　\n(\nA)\n自律神經系統包含感覺神經元與運動\n神經元　\n(\nB)\n交感與副交感神經系統對生理的作用皆屬拮抗\n作用　\n(\nC)\n遇到緊急狀況時，副交感神經系統會活化應對環境\n變化　\n(\nD)\n部分臟器或腺體僅受交感神經支配，不受副交感神經調控。\n解答\n：\n(\nD)\n \n解析\n：\n(\nA)\n自律神經系統皆為運動神經元\n。\n(\nB)\n交感與副交感神經系統的協調作用可分為拮抗作用與協同作用\n。\n(\nC)\n交感神經活化可讓個體應對緊急狀況。\n36"}, "source": {"bookPages": 6, "printedPages": "114–119", "pptPages": 36, "presentationKind": "pptx-static"}, "sourceCorrections": [{"ppt": [4], "note": "不隨意指不受意識直接控制；自律功能仍受腦及脊髓等中樞調節。"}, {"ppt": [17, 18], "note": "突觸後細胞為肌纖維，不是另一神經元；ACh受體為配體門控陽離子通道。"}, {"ppt": [26, 29], "note": "典型路徑與傳遞物須限定範圍；交感節後多釋放去甲基腎上腺素，汗腺等有例外，腎上腺髓質釋放腎上腺素入血。"}, {"ppt": [34, 36], "note": "原題答案保留。「自律神經皆為運動神經」採本課本傳出分類語境，不擴張為所有文獻定義。"}], "checkedSources": {"nmj": ["OpenStax：神經肌肉會合處與化學突觸", "https://openstax.org/books/anatomy-and-physiology-2e/pages/12-5-communication-between-neurons"], "autonomic": ["OpenStax：自律神經系統", "https://openstax.org/books/anatomy-and-physiology-2e/pages/15-1-divisions-of-the-autonomic-nervous-system"]}};

document.addEventListener('fullscreenchange',fullscreenSync);document.addEventListener('keydown',e=>{if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(document.querySelector('dialog[open]'))return;const fs=document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation');if(fs){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();if(LI>0)showLearn(LI-1);}else if(e.key==='Escape')exitLearnFullscreen();return;}if(PAGE==='show'){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();showStep(1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();showStep(-1);}else if(e.key==='Escape')navigate('intro');else if(e.key==='Home'){SI=0;showRender()}else if(e.key==='End'){SI=DECK.length-1;showRender()}return;}if(PAGE==='learn'&&el('flip')){if(e.key==='ArrowRight'){e.preventDefault();flipStop();flipShow(FI+1)}if(e.key==='ArrowLeft'){e.preventDefault();flipStop();flipShow(FI-1)}}});
el('learn-stage').addEventListener('contextmenu',e=>{if(document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation')){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1)}});
window.addEventListener('resize',fit);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){flipStop();showStopPlay();save();}});new ResizeObserver(fit).observe(el('bar'));
el('slide-text').onclick=()=>{const page=DECK[SI][1];openDialog('原PPT第'+page+'頁原文',`${CONTENT.sourceCorrections.filter(x=>x.ppt.includes(page)).map(x=>'<div class="scope-note">'+esc(x.note)+'</div>').join('')}<p>${esc(CONTENT.pptText[page])}</p>`);};el('hero-image').src=IMG['arm_a'];el('video-external').href=VIDEO_SRC;el('raw-animation').onclick=()=>{const d=openDialog('原始簡報動畫',`<p class="animation-note">原動畫依原PPT製作；配合圖解觀察肌肉、骨骼及神經傳遞。</p><video controls autoplay playsinline style="width:100%" src="${ANIMATION_SRC}"></video>`);d.addEventListener('close',()=>d.querySelector('video')?.pause(),{once:true});};applyPreferences();const start=['learn','play','done'].includes(ST.page)?ST.page:'intro';navigate(start);if(!saving)storageNotice();
</script></body></html>

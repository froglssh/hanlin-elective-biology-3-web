const CONTENT={"lessons": [{"id": "b3-c41-l01", "t": "感應：刺激如何成為反應？", "sec": "s1", "slide": 1, "sourceSlides": [1, 2, 3], "sourcePages": [1], "src": "原PPT第 1–3 頁；課本 P96–98", "figSpec": {"image": "neurons"}, "txt": "<ul><li>受器偵測刺激，神經系統傳遞並整合訊息，肌肉與腺體等動器完成反應。</li><li>神經組織包含神經元與神經膠細胞；膠細胞也參與支持、髓鞘形成及環境調節。</li><li>把受器、中樞與動器接成迴路，才能解釋感覺、決策與反應。</li></ul><p class=\"think\">手碰到熱物時，感受刺激與完成縮手分別需要哪些角色？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/12-2-nervous-tissue\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>感應</h4><p><b>感應</b>是生物感受內、外環境刺激並做出反應的能力，對覓食、避敵及維持體內恆定至關重要。本章以人體的神經系統與內分泌系統為例：先感覺刺激，再由電訊號與化學訊號協同，最後由肌肉與腺體完成反應。</p></div><div class=\"ex\"><h4>神經組織</h4><p>動物有四大組織（結締、肌肉、神經、上皮）。神經組織包含能產生並傳遞<b>電訊號</b>的<b>神經元</b>，以及扮演協助角色的<b>神經膠細胞</b>。</p></div><div class=\"ex\"><h4>本節四個重點</h4><p>細胞膜電位、動作電位、神經元間的訊號傳遞、人體的神經系統。</p></div><div class=\"ex\"><h4>深入解說：感應是一條完整的路徑</h4><p>「感應」不是單一構造的工作，而是<b>受器 → 神經（中樞）→ 動器</b>三個環節接成的迴路。受器把光、熱、壓力、化學物質等刺激轉成電訊號；神經系統傳遞並整合；動器（肌肉、腺體）執行反應。任何一環受損，反應都會改變：受器壞了是「感覺不到」，中樞壞了是「整合錯亂」，動器壞了是「感覺到卻動不了」。</p></div><div class=\"ex\"><h4>神經組織的兩種細胞</h4><ul><li><b>神經元</b>：產生並傳遞電訊號的主角，由細胞本體、樹突、軸突組成。</li><li><b>神經膠細胞</b>：數量多，負責支持、營養、形成髓鞘、維持細胞外環境，並不是「只當填充物」。</li><li>兩者合起來才是完整的神經組織。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>手碰到熱水杯立刻縮手，受器、中樞、動器各是什麼？</p><p><b>答：</b>受器：皮膚的溫度（痛）受器；中樞：脊髓（也會把訊息上傳到腦而感到痛）；動器：手臂的骨骼肌。</p></div>", "tb": [["BOOK1", "P96 完整課本頁"]]}, {"id": "b3-c41-l02", "t": "功能分類：感覺、聯絡與運動", "sec": "s1", "slide": 4, "sourceSlides": [4, 5], "sourcePages": [], "src": "原PPT第 4–5 頁；課本 P96–98", "figSpec": {"image": "neurons"}, "txt": "<ul><li>感覺神經元把受器訊息傳入中樞；運動神經元將中樞訊息傳向動器。</li><li>聯絡神經元參與中樞內訊息整合；不能把每種感覺訊息都當成必然引發動作。</li><li>此分類依訊息方向與功能，和突起數目的形態分類是不同尺度。</li></ul><p class=\"think\">細胞本體位於路徑旁邊，會改變傳入與傳出的判定嗎？</p><div class=\"ex\"><h4>依訊息傳遞方向分三類（圖 4－1）</h4><p>電訊號的方向：刺激 → 受器 → 感覺神經元 → 中樞神經系統（聯絡神經元）→ 運動神經元 → 動器 → 反應。</p></div><div class=\"ex\"><h4>三種神經元</h4><ul><li><b>感覺神經元</b>：把訊息由受器傳入中樞神經系統。</li><li><b>運動神經元</b>：把中樞神經系統的訊息傳往動器。</li><li><b>聯絡神經元</b>：整合訊息，也是中樞神經系統中數量最多的神經元。</li></ul></div><div class=\"ex\"><h4>小提醒</h4><p>分類依據是「傳遞方向」，不是神經元的外形。</p></div><div class=\"ex\"><h4>深入解說：以「訊息方向」命名</h4><p>感覺、聯絡、運動三個名稱是看這個神經元在迴路中<b>把訊息往哪裡送</b>：傳<b>入</b>中樞的是感覺（傳入）神經元，在中樞內部連接的是聯絡神經元，從中樞傳<b>出</b>到動器的是運動（傳出）神經元。只要抓住「入／中／出」，就不會被細胞外形或細胞本體位置干擾。</p></div><div class=\"ex\"><h4>比較三類神經元</h4><ul><li>感覺神經元：受器 → 中樞；細胞本體多在中樞外的神經節。</li><li>聯絡神經元：全在中樞內；人類數量最多，負責整合與複雜思考。</li><li>運動神經元：中樞 → 肌肉／腺體；細胞本體在中樞內（如脊髓腹角）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>簡單反射弧至少要幾個神經元？</p><p><b>答：</b>最少可有感覺與運動兩個（如膝跳反射）；多數反射在中間加入聯絡神經元，路徑較長但可做更多整合。</p></div>", "tb": []}, {"id": "b3-c41-l03", "t": "形態分類：突起數不等於功能", "sec": "s1", "slide": 6, "sourceSlides": [6], "sourcePages": [], "src": "原PPT第 6 頁；課本 P96–98", "figSpec": {"image": "PPT06S3"}, "txt": "<ul><li>多極神經元有多條樹突及一條軸突；運動神經元是常見例子。</li><li>雙極神經元有兩個主要突起；嗅覺受器與視網膜雙極神經元可作例子。</li><li>偽單極神經元的突起再分兩支；背根神經節的感覺神經元是典型例子。</li></ul><p class=\"think\">同屬感覺相關的神經元，是否一定具有相同形態？</p><div class=\"scope-note\">原PPT將視桿、視錐列為雙極例子；須區分感光細胞與視網膜雙極神經元，兩者不是同一細胞。原文保留供核對。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/14-1-sensory-perception\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>依突起數目分類</h4><p>這是另一種分類方式，依突起的多少區分。</p></div><div class=\"ex\"><h4>三種形態</h4><ul><li><b>多極神經元</b>：例如運動神經元。</li><li><b>雙極神經元</b>：例如視網膜的視桿細胞、視錐細胞，以及鼻黏膜的嗅細胞。</li><li><b>偽單極神經元</b>：例如脊髓背根神經節中的感覺神經元。</li></ul></div><div class=\"ex\"><h4>不要混淆</h4><p>形態分類（突起數）與功能分類（感覺、運動、聯絡）是兩個獨立的系統，突起數不能直接決定功能。</p></div><div class=\"ex\"><h4>深入解說：形態分類看「突起數」</h4><p><b>多極</b>：一條軸突加多條樹突（運動神經元、中樞多數神經元）；<b>雙極</b>：兩個主要突起，一端接收、另一端輸出；<b>偽單極</b>：胚胎時為雙極，之後兩突起基部合併成一支再分叉，使細胞本體像掛在傳導路徑旁邊的「側枝」，訊息可直接從周圍突起經過、不必穿過本體。</p></div><div class=\"ex\"><h4>常見混淆</h4><ul><li>形態與功能是<b>兩種獨立分類</b>：感覺神經元可以是雙極（嗅細胞）也可以是偽單極（背根神經節）。</li><li>偽單極的「單」指從本體只長出一條突起；它仍有傳入與傳出方向。</li><li>視網膜中的視桿、視錐是<b>感光細胞</b>（受器），與接在後面的雙極神經元是不同細胞；課本／簡報舉例時需留意此差別。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>背根神經節的感覺神經元為什麼說是「偽單極」？</p><p><b>答：</b>它只有一條從本體伸出的短突起，隨後分叉成往周圍（受器）與往脊髓兩支，外觀像單極，但發育上由雙極合併而來，所以稱「偽」單極。</p></div>", "tb": []}, {"id": "b3-c41-l04", "t": "生物電研究：控制條件與解釋", "sec": "s1", "slide": 7, "sourceSlides": [7, 8, 9], "sourcePages": [2], "src": "原PPT第 7–9 頁；課本 P96–98", "figSpec": {"image": "history"}, "txt": "<ul><li>賈法尼觀察蛙腿抽動；伏打改變金屬組合，提出電流來源的另一種解釋。</li><li>改用相同金屬或鹽水，可檢驗金屬接觸、導體與肌肉反應的關係。</li><li>生物電與一般電學並不互斥；神經組織的電訊號來自跨膜離子流與電位差。</li></ul><p class=\"think\">若蛙腿抽動停止，能直接證明神經細胞沒有電位嗎？</p><div class=\"scope-note\">史實與知識補給站全文保留；本卡重點是觀察、控制變因與機制證據，而不是用一項觀察排除所有解釋。</div><div class=\"ex\"><h4>生物電的研究歷程</h4><p>每一步都在回答「這個現象是不是電造成的」。</p></div><div class=\"ex\"><h4>時間線</h4><ul><li><b>1786 賈法尼</b>：銅鉤把蛙腿掛在鐵梁上，蛙腿不停抽動，稱此現象為「生物電」。</li><li><b>伏打</b>：重複實驗，認為是兩種金屬接觸產生的電流刺激蛙腿；用相同金屬做，蛙腿不抽動；用鹽水取代蛙腿，做出歷史上第一個電池（伏打電池）。</li><li><b>1840 馬陶西</b>：用蛙的坐骨神經與肌肉，證實神經與肌肉可產生並傳導電訊號。</li><li><b>19 世紀末 華勒</b>：每次心跳都伴隨電流。</li><li><b>20 世紀初</b>：偵測到細胞膜內外有微小電位差，稱為膜電位。</li></ul></div><div class=\"ex\"><h4>科學方法</h4><p>伏打用「改變條件」（換成相同金屬、鹽水）來檢驗自己的假說，是對照與控制變因的好例子。霍奇金與赫胥黎因膜電位研究獲 1963 年諾貝爾生理醫學獎。</p></div><div class=\"ex\"><h4>深入解說：從「現象」到「機制」</h4><p>賈法尼看到蛙腿抽動，提出「動物體內有電」；伏打用不同金屬組合與鹽水重複，指出金屬接觸本身也能產電，因此兩人都有部分正確。後來馬陶西直接用神經與肌肉證實生物組織能產生電訊號，霍奇金與赫胥黎進一步量出<b>跨膜電位</b>的變化規律，才使「生物電」成為可量化的機制。這段歷史示範：<b>科學結論要靠控制變因的比較，而不是單一現象</b>。</p></div><div class=\"ex\"><h4>時間線與貢獻</h4><ul><li>1786 賈法尼：蛙腿接觸金屬而抽動，提出「動物電」。</li><li>伏打：換金屬、用鹽水替代蛙腿，發明第一個化學電池。</li><li>1840 馬陶西：神經與肌肉本身能產生並傳導電流。</li><li>19 世紀末 華勒：每次心跳伴隨電訊號（心電圖的源頭）。</li><li>20 世紀初：量到膜內外的電位差；1963 霍奇金與赫胥黎獲諾貝爾獎。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>伏打用「相同金屬」做實驗，目的是什麼？</p><p><b>答：</b>改變一個條件（兩種金屬變相同金屬）來檢驗「兩種不同金屬接觸才產電」的假說；蛙腿不再抽動，支持他的解釋。這是控制變因的例子。</p></div>", "tb": [["BOOK2", "P97 完整課本頁"]]}, {"id": "b3-c41-l05", "t": "量測膜電位：內側相對外側", "sec": "s1", "slide": 10, "sourceSlides": [10], "sourcePages": [3], "src": "原PPT第 10 頁；課本 P96–98", "figSpec": {"image": "measure"}, "txt": "<ul><li>以細胞外電極為參考0 mV，測得內側約−70 mV，表示膜內電位較低。</li><li>烏賊巨大軸突讓電極操作與電位量測較容易，並非所有軸突都有1 mm直徑。</li><li>膜電位是兩側的電位差；負值不表示細胞內完全沒有正離子。</li></ul><p class=\"think\">兩支電極都置於細胞外，是否能直接量到跨膜的−70 mV？</p><div class=\"scope-note\">差異主要集中在膜附近很薄的區域；大部分體液仍接近電中性。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/12-4-the-action-potential\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>怎麼量</h4><p>霍奇金與赫胥黎以<b>烏賊巨大軸突</b>為材料，把電極置入軸突中，另一電極放在細胞外，量測兩側的電位差（圖 4－2b）。</p></div><div class=\"ex\"><h4>讀值的規則</h4><ul><li>約定以<b>細胞膜外側為 0 mV</b>，量的是「內側相對於外側」。</li><li>未受刺激的神經元，細胞膜內的電位比膜外<b>低</b>（膜外帶正電、膜內帶負電）。</li></ul></div><div class=\"ex\"><h4>為什麼用烏賊</h4><p>巨大軸突直徑約 1 mm，電極容易插入，量測方便。</p></div><div class=\"ex\"><h4>深入解說：怎麼讀「−70 mV」</h4><p>電壓計量的永遠是<b>兩點間的差</b>。把細胞外的電極定為 0 mV，插入細胞內的電極讀到 −70 mV，意思是「<b>細胞內側比外側低 70 mV</b>」，並不是細胞內沒有陽離子。實際上只有緊貼膜兩側的一層薄薄的離子分布不對稱，其餘體液仍大致中性。</p></div><div class=\"ex\"><h4>量測要點</h4><ul><li>材料：烏賊巨大軸突（直徑約 1 mm），電極容易插入、受傷小。</li><li>兩個電極缺一不可：一個在膜內、一個在膜外。</li><li>兩支電極都放在細胞外，量到的是 0 mV（沒有跨膜差）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>為什麼不直接用人類神經量測？</p><p><b>答：</b>人類軸突直徑僅數微米，早期技術難以插入電極；烏賊巨大軸突粗大，是理想材料。後來技術進步，才能量測各種細胞。</p></div>", "tb": [["BOOK3", "P98 完整課本頁"]]}, {"id": "b3-c41-l06", "t": "靜止膜電位：不是電位歸零", "sec": "s2", "slide": 11, "sourceSlides": [11, 12], "sourcePages": [], "src": "原PPT第 11–12 頁；課本 P98–100", "figSpec": {"image": "measure"}, "txt": "<ul><li>靜止時仍有膜電位，維持靜止狀態稱極化；「靜止」不代表離子停止移動。</li><li>−70 mV、−50 mV與＋40 mV是本教材的示意值，實際依細胞與條件不同。</li><li>多種細胞都有膜電位；神經及肌肉是本節典型可產生動作電位的細胞。</li></ul><p class=\"think\">把「未受刺激」與「沒有電位差」分開，對讀圖有何幫助？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/12-4-the-action-potential\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>靜止膜電位</h4><p>神經元未受刺激時，細胞膜兩側的電位差稱為<b>靜止膜電位</b>，人類神經元約為 <b>−70 mV</b>。維持在這個狀態稱為<b>極化</b>。</p></div><div class=\"ex\"><h4>常見錯誤</h4><ul><li>靜止膜電位<b>不是 0 mV</b>；0 mV 表示內外電位相同。</li><li>靜止不代表沒有活動，只是膜電位穩定。</li><li><b>所有細胞都有</b>膜電位；只有神經元和肌肉細胞能產生動作電位。</li></ul></div><div class=\"ex\"><h4>深入解說：靜止是「動態平衡」</h4><p>靜止膜電位 −70 mV 是離子<b>持續進出</b>後維持的穩定值：K⁺ 經漏通道緩慢外流，少量 Na⁺ 內漏，鈉鉀幫浦再耗能把它們送回。膜內有帶負電的大分子（蛋白質、核酸、磷酸根）無法跨膜，加上 K⁺ 外流，使膜內相對較負。「靜止」只是電位不變，不是離子不動。</p></div><div class=\"ex\"><h4>關鍵詞</h4><ul><li><b>極化</b>：膜內外存在電位差（維持在靜止狀態）。</li><li><b>靜止膜電位</b>：未受刺激時的膜電位，人類神經元約 −70 mV。</li><li>所有細胞幾乎都有膜電位；神經與肌肉細胞特別能產生動作電位。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>「靜止」是否表示膜內外沒有離子流動？</p><p><b>答：</b>不是。離子仍透過漏通道與幫浦持續移動，只是進出的淨效果平衡，電位維持在 −70 mV。</p></div>", "tb": []}, {"id": "b3-c41-l07", "t": "鈉鉀幫浦：維持梯度的代價", "sec": "s2", "slide": 13, "sourceSlides": [13, 16, 17], "sourcePages": [], "src": "原PPT第 13–17 頁；課本 P98–100", "figSpec": {"image": "PPT17S3"}, "txt": "<ul><li>鈉鉀幫浦消耗ATP，每循環將3 Na⁺移出、2 K⁺移入。</li><li>它維持外高Na⁺、內高K⁺的濃度梯度，並有淨向外正電荷的作用。</li><li>幫浦持續工作；不能把一次動作電位的快速下降直接歸因於幫浦突然加速。</li></ul><p class=\"think\">若ATP長時間不足，離子梯度與訊號能力會如何改變？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/12-4-the-action-potential\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>靜止膜電位的來源（延伸）</h4><p>細胞外主要陽離子是 Na⁺，細胞內主要陽離子是 K⁺。</p></div><div class=\"ex\"><h4>鈉鉀幫浦</h4><ul><li>以<b>耗能</b>（ATP）方式把 <b>3 個 Na⁺ 泵出、2 個 K⁺ 泵入</b>。</li><li>結果：膜內比膜外少一些正電荷，使膜內電位較低。</li><li>靜止膜電位能一直維持，是靠細胞持續花 ATP 建立並維持離子梯度。</li></ul></div><div class=\"ex\"><h4>小結</h4><p>鈉鉀幫浦維持濃度梯度（要耗能）；通道上的離子擴散則決定電位差如何產生（下一張）。</p></div><div class=\"ex\"><h4>深入解說：鈉鉀幫浦的工作</h4><p>鈉鉀幫浦是膜上的蛋白質，<b>消耗 ATP</b>，每次把 <b>3 個 Na⁺ 送出、2 個 K⁺ 送入</b>，兩者都是逆濃度梯度（主動運輸）。這使細胞外 Na⁺ 高、細胞內 K⁺ 高，並因每次多送出 1 個正電荷，讓膜內略偏負。它建立的離子濃度梯度，是動作電位的「能量電池」。</p></div><div class=\"ex\"><h4>濃度分布（示意）</h4><ul><li>Na⁺：細胞外高、細胞內低。</li><li>K⁺：細胞內高、細胞外低。</li><li>幫浦停止（缺氧、缺 ATP）→ 梯度逐漸消失，細胞失去興奮能力。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>動作電位期間通過通道的離子沒有耗 ATP，為什麼細胞還需要幫浦？</p><p><b>答：</b>通道讓離子順濃度梯度擴散，不耗能；但每次動作電位都有少量 Na⁺ 進、K⁺ 出，長期會使梯度變小，所以要靠幫浦耗能恢復。</p></div>", "tb": []}, {"id": "b3-c41-l08", "t": "漏通道：通透性與電化學梯度", "sec": "s2", "slide": 14, "sourceSlides": [14, 15], "sourcePages": [], "src": "原PPT第 14–15 頁；課本 P98–100", "figSpec": {"image": "PPT17S3"}, "txt": "<ul><li>靜止時膜對K⁺的通透性通常高於Na⁺，K⁺外流傾向使膜內電位降低。</li><li>膜內負電又對K⁺形成向內的電力；淨流動取決於濃度與電位共同作用。</li><li>不能自由跨膜的大分子陰離子也參與分布；不是所有K⁺一直流光。</li></ul><p class=\"think\">當濃度驅動與電力相反時，能只用濃度推定淨移動嗎？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/12-4-the-action-potential\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>常開通道</h4><p>細胞膜上有「常開」的鉀離子通道和鈉離子通道（漏通道）。</p></div><div class=\"ex\"><h4>三個因素</h4><ul><li><b>鉀離子常開通道比鈉離子常開通道多</b>：K⁺ 容易擴散到細胞外，Na⁺ 不容易擴散進細胞內。</li><li>細胞內有許多<b>帶負電荷的大分子</b>（如蛋白質），無法自由進出細胞膜。</li><li>鈉鉀幫浦維持內外離子濃度差。</li></ul></div><div class=\"ex\"><h4>結果</h4><p>K⁺ 外流留下負電荷，使膜內電位低於膜外，形成約 −70 mV 的靜止膜電位。</p></div><div class=\"ex\"><h4>深入解說：漏通道決定「負多少」</h4><p>漏通道（鉀漏通道）是<b>常開</b>的，不需刺激。膜對 K⁺ 的通透性遠大於對 Na⁺，因此 K⁺ 順濃度梯度外流較多，帶走正電荷，使膜內變負。K⁺ 外流到一定程度，內負的電性又會把 K⁺ 往回拉，兩股力量平衡的位置就是靜止膜電位。</p></div><div class=\"ex\"><h4>與電位敏感型通道比較</h4><ul><li><b>漏通道</b>：常開，維持靜止電位。</li><li><b>電位敏感型 Na⁺／K⁺ 通道</b>：電位改變到某值才開，負責動作電位。</li><li><b>受體相連通道</b>：與傳遞物結合才開，用在突觸後膜。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>若把膜上的鉀漏通道增加，靜止電位會如何？</p><p><b>答：</b>K⁺ 外流更多，膜內更負，靜止電位更接近 K⁺ 的平衡電位（數值更低，更難達閾值）。</p></div>", "tb": []}, {"id": "b3-c41-l09", "t": "閾值：局部變化如何觸發尖峰", "sec": "s2", "slide": 18, "sourceSlides": [18, 19, 23], "sourcePages": [4], "src": "原PPT第 18–23 頁；課本 P98–100", "figSpec": {"image": "potential"}, "txt": "<ul><li>刺激可先造成局部去極化；達到閾值時，電位敏感型Na⁺通道大量開啟。</li><li>Na⁺流入進一步去極化，又促進更多通道開啟，形成快速上升的正回饋。</li><li>未達閾值仍可有局部電位變化，只是不產生這次動作電位。</li></ul><p class=\"think\">膜電位由−70變成−60 mV，算去極化嗎？一定有尖峰嗎？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/12-4-the-action-potential\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>動作電位</h4><p>神經細胞與肌肉細胞受到足夠刺激時，膜電位會出現快速而短暫的變化，稱為<b>動作電位</b>。</p></div><div class=\"ex\"><h4>起點：去極化到閾值</h4><ul><li>受刺激時膜電位上升，稱<b>去極化</b>。</li><li>若上升到<b>閾值電位（約 −50 mV）</b>，電位敏感型<b>鈉離子通道</b>大量開啟，Na⁺ 湧入細胞，膜電位快速上升（可到約 +40 mV）。</li><li>刺激不夠大，只有局部小變化，不會產生動作電位。</li></ul></div><div class=\"ex\"><h4>小結</h4><p>閾值像是「引爆點」：沒到就沒有動作電位，到了就一發不可收拾。</p></div><div class=\"ex\"><h4>深入解說：閾值與尖峰的啟動</h4><p>刺激使 Na⁺ 流入，膜電位由 −70 mV 往正方向去極化。當到達約 <b>−50 mV 的閾值</b>，大量電位敏感型 Na⁺ 通道同時打開，Na⁺ 湧入造成<b>正回饋</b>：電位越高，開的通道越多，電位更高，快速衝到約 +40 mV 的尖峰。未達閾值，只有局部小波動就回到靜止。</p></div><div class=\"ex\"><h4>讀值</h4><ul><li>靜止：−70 mV；閾值：約 −50 mV；峰值：約 +40 mV。</li><li>閾值是「啟動點」，不是最高點。</li><li>刺激夠大 → 啟動；刺激更大 → 不會讓尖峰更高（見全有全無）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>刺激只讓電位從 −70 變成 −60 mV，會發生什麼？</p><p><b>答：</b>未達閾值 −50 mV，大量 Na⁺ 通道不會打開，不產生動作電位，電位很快回到 −70 mV。</p></div>", "tb": [["BOOK4", "P99 完整課本頁"]]}, {"id": "b3-c41-l10", "t": "再極化：Na⁺失活與K⁺外流", "sec": "s2", "slide": 20, "sourceSlides": [20], "sourcePages": [], "src": "原PPT第 20 頁；課本 P98–100", "figSpec": {"image": "potential"}, "txt": "<ul><li>上升後Na⁺通道失活，K⁺通道延遲開啟，K⁺外流使膜電位下降。</li><li>再極化是電位回落的階段，不表示所有離子濃度立即恢復原樣。</li><li>快速電位變化主要依通道動態；幫浦維持長期梯度。</li></ul><p class=\"think\">把「電位回復」與「每種離子量完全回復」當同一件事，會錯在哪裡？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/12-4-the-action-potential\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>再極化</h4><p>膜電位升到約 +40 mV 後：</p></div><div class=\"ex\"><h4>兩件事同時發生</h4><ul><li>電位敏感型<b>鈉離子通道關閉</b>（失活），Na⁺ 不再流入。</li><li>電位敏感型<b>鉀離子通道打開</b>，K⁺ 由細胞內擴散到細胞外。</li></ul></div><div class=\"ex\"><h4>結果</h4><p>膜電位下降，回到 −70 mV 附近，這個階段稱為<b>再極化</b>。</p></div><div class=\"ex\"><h4>深入解說：再極化的兩個動作</h4><p>到達峰值後，兩件事同時發生：電位敏感型 <b>Na⁺ 通道關閉（失活）</b>，Na⁺ 不再流入；<b>電位敏感型 K⁺ 通道打開</b>，K⁺ 大量外流，帶走正電荷。膜電位因此迅速下降回到靜止值附近，稱為<b>再極化</b>。K⁺ 通道比 Na⁺ 通道開得晚、關得慢，所以才有後面的過極化。</p></div><div class=\"ex\"><h4>上升段與下降段對照</h4><ul><li>上升段：Na⁺ 通道開 → Na⁺ 內流 → 去極化。</li><li>下降段：Na⁺ 通道關、K⁺ 通道開 → K⁺ 外流 → 再極化。</li><li>兩段通道狀態不同，即使電位相同（例如 −50 mV）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>河豚毒素擋住 Na⁺ 通道，與擋住 K⁺ 通道，曲線各卡在哪一段？</p><p><b>答：</b>擋 Na⁺ 通道：上升段不出現，無法達尖峰；擋 K⁺ 通道：尖峰仍可產生，但再極化變慢，尖峰變寬。</p></div>", "tb": []}, {"id": "b3-c41-l11", "t": "過極化與兩段不反應期", "sec": "s2", "slide": 21, "sourceSlides": [21, 22, 24], "sourcePages": [], "src": "原PPT第 21–24 頁；課本 P98–100", "figSpec": {"image": "potential"}, "txt": "<ul><li>K⁺通道關閉較慢，可使電位暫時低於靜止值，再逐漸回復。</li><li>Na⁺通道失活時的絕對不反應期，強刺激也不能產生新的正常尖峰。</li><li>相對不反應期已可再激發，但通常需要更強刺激；不能一律稱完全不反應。</li></ul><p class=\"think\">能否把整個不反應期只畫在過極化的最低點？</p><div class=\"scope-note\">原PPT把不反應期附在過極化附近；補充絕對期從Na⁺失活開始，與相對期的條件不同。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/12-4-the-action-potential\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>過極化</h4><p>鉀離子通道延長打開時間，K⁺ 繼續流出，使膜電位降到<b>靜止膜電位以下</b>，稱為<b>過極化</b>。之後鉀離子通道關閉，膜電位慢慢恢復到極化狀態。</p></div><div class=\"ex\"><h4>不反應期</h4><p>在這段期間，神經元不容易再被激發產生動作電位，稱為<b>不反應期</b>。</p></div><div class=\"ex\"><h4>小提醒</h4><p>過極化期間，需要更強的刺激才能達到閾值；這也限制了動作電位頻率的上限。</p></div><div class=\"ex\"><h4>深入解說：過極化與不反應期</h4><p>K⁺ 通道關得慢，K⁺ 多流出一些，使電位暫時低於 −70 mV，稱為<b>過極化</b>，之後由漏通道與幫浦慢慢回到靜止。在這段期間，神經元較難再被激發，稱<b>不反應期</b>：<b>絕對不反應期</b>內任何強度的刺激都無法再產生動作電位（Na⁺ 通道處於失活狀態）；<b>相對不反應期</b>需要比平常更強的刺激才可能產生。</p></div><div class=\"ex\"><h4>不反應期的功能</h4><ul><li>保證動作電位<b>單向傳導</b>，不會往回傳。</li><li>限制最高頻率，每個尖峰分開、不會融合。</li><li>讓 Na⁺ 通道有時間回到可再開啟的狀態。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>絕對與相對不反應期差在哪？</p><p><b>答：</b>絕對：任何刺激都不能引發；相對：較強的刺激仍可能引發，因為部分 Na⁺ 通道已恢復，但電位較負、離閾值較遠。</p></div>", "tb": []}, {"id": "b3-c41-l12", "t": "完整曲線：先讀座標，再讀通道", "sec": "s2", "slide": 25, "sourceSlides": [25], "sourcePages": [], "src": "原PPT第 25 頁；課本 P98–100", "figSpec": {"image": "potential"}, "txt": "<ul><li>橫軸時間ms、縱軸膜電位mV；閾值線與靜止線意義不同。</li><li>上升段主要Na⁺內流，下降段主要K⁺外流；過極化是低於靜止值。</li><li>同一電位在上升與下降各可能出現一次，但通道狀態不一定相同。</li></ul><p class=\"think\">看到−50 mV，還缺哪項資訊才能判斷它是上升還是回落？</p><div class=\"ex g\"><h4>圖 4－3　讀圖順序</h4><p>先讀座標：橫軸是時間（ms），縱軸是膜電位（mV），虛線是閾值電位（−50 mV）與靜止膜電位（−70 mV）。再讀通道。</p></div><div class=\"ex\"><h4>五個階段</h4><ul><li>1 極化（靜止膜電位 −70 mV）。</li><li>2 去極化（未達閾值前）。</li><li>3 去極化（達閾值後，大量 Na⁺ 進入，上升到約 +40 mV）。</li><li>4 再極化（Na⁺ 不再流入，K⁺ 外流，電位下降）。</li><li>5 過極化（K⁺ 繼續流出，降到 −70 以下，再恢復）。</li></ul></div><div class=\"ex\"><h4>深入解說：讀圖三步驟</h4><p>① 先看座標：橫軸時間（ms）、縱軸膜電位（mV）；② 找兩條基準線：靜止 −70 mV、閾值 −50 mV；③ 看每一段對應的通道：<b>上升＝Na⁺ 內流；下降＝K⁺ 外流</b>。同一個 −50 mV 在上升與下降都會出現，因此要看<b>斜率（上升或下降）</b>才知道是哪個階段。</p></div><div class=\"ex\"><h4>五個階段</h4><ul><li>極化：靜止 −70 mV。</li><li>去極化（未達閾值）：小幅上升，可回復。</li><li>去極化（達閾值）：Na⁺ 大量內流，升到約 +40 mV。</li><li>再極化：Na⁺ 通道關、K⁺ 外流。</li><li>過極化：低於 −70 mV 後回到靜止。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>曲線上看到 −50 mV，還缺什麼資訊才能判斷在哪一階段？</p><p><b>答：</b>需要知道是在<b>上升段還是下降段</b>（斜率方向或時間先後），因為兩段都會經過 −50 mV。</p></div>", "tb": []}, {"id": "b3-c41-l13", "t": "全有全無：幅度與頻率分開", "sec": "s2", "slide": 26, "sourceSlides": [26, 27, 28], "sourcePages": [5], "src": "原PPT第 26–28 頁；課本 P98–100", "figSpec": {"image": "frequency"}, "txt": "<ul><li>在同一神經纖維及相近條件下，達閾值後的單一動作電位幅度大致固定。</li><li>持續較強的刺激可增加尖峰頻率，不是把每個尖峰任意拉高。</li><li>圖中刺激強度軸與膜電位軸不同；閾值是膜電位條件，不能直接比較兩軸的數字。</li></ul><p class=\"think\">同樣200 ms內有4次與8次尖峰，頻率各是多少？</p><div class=\"scope-note\">頻率有不反應期的上限；不把強度與頻率關係外推成無限增加。</div><div class=\"ex\"><h4>全有全無律</h4><p>動作電位的產生是一種<b>全有或全無</b>的反應：刺激沒達到閾值就沒有動作電位；達到了，就會產生固定大小的動作電位。</p></div><div class=\"ex\"><h4>幅度與頻率</h4><ul><li>動作電位的<b>大小不會隨刺激強弱而改變</b>。</li><li>刺激越強，動作電位的<b>頻率越高</b>、產生的數目越多。</li><li>所以動作電位的頻率能代表感覺神經元所受刺激的強度（例如溫度受器）。</li></ul></div><div class=\"ex\"><h4>小提醒</h4><p>不要說「刺激越強，動作電位越大」。強度靠「頻率」表達，不靠「幅度」。</p></div><div class=\"ex\"><h4>深入解說：訊息靠「頻率」編碼</h4><p>動作電位的幅度固定，所以神經元不能用「尖峰大小」表示刺激強弱，而是用<b>單位時間內的尖峰數（頻率）</b>。例如 200 ms 內 4 次尖峰＝20 次／秒，8 次＝40 次／秒；後者代表更強的刺激。頻率有上限，因為每個尖峰後有不反應期，不可能無限提高。</p></div><div class=\"ex\"><h4>全有全無的條件</h4><ul><li>刺激未達閾值 → 無動作電位（全無）。</li><li>刺激達閾值 → 產生固定大小的動作電位（全有）。</li><li>刺激更強 → 幅度不變、頻率升高。</li><li>注意：這是<b>單一神經元／單一纖維</b>的行為；整條神經的反應強度則由參與的纖維數量決定。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>為什麼說「刺激越強，動作電位越大」是錯的？</p><p><b>答：</b>動作電位遵守全有全無律，幅度固定；刺激越強只會讓尖峰頻率增加（及更多神經元被募集），不會讓單一尖峰變大。</p></div>", "tb": [["BOOK5", "P100 完整課本頁"]]}, {"id": "b3-c41-l14", "t": "河豚毒素：從通道連到呼吸", "sec": "s2", "slide": 29, "sourceSlides": [29], "sourcePages": [], "src": "原PPT第 29 頁；課本 P98–100", "figSpec": {"image": "PPT29S3"}, "txt": "<ul><li>電位敏感型Na⁺通道被阻斷，神經與骨骼肌正常興奮傳導可受抑制。</li><li>呼吸肌無法有效工作可造成通氣不足與缺氧；這不是肺泡突然停止擴散的同義說法。</li><li>以通道、電位、運動訊號與肌肉四個環節建立機制鏈。</li></ul><p class=\"think\">若肌肉收縮減弱，如何分辨是通道、突觸還是肌肉本身的問題？</p><div class=\"scope-note\">本卡用於機制理解，不提供河豚食用、處理或中毒處置指引。</div><div class=\"ex\"><h4>腦力激盪：河豚毒素</h4><p>河豚毒素結合在<b>鈉離子通道</b>上，使其失去活性。</p></div><div class=\"ex\"><h4>推理</h4><ul><li>鈉離子通道不能打開 → Na⁺ 無法流入 → 去極化無法達到閾值 → <b>不能產生動作電位</b>。</li><li>神經衝動傳不出去 → 支配呼吸肌（橫膈肌、肋間肌）的運動神經元無法傳送訊號 → 呼吸肌無法收縮 → <b>呼吸運動停止</b>，最後導致死亡。</li></ul></div><div class=\"ex\"><h4>連結</h4><p>這題把前面的通道機制（第 9 張）和 3-1 的呼吸運動連起來。</p></div><div class=\"ex\"><h4>深入解說：建立機制鏈</h4><p>河豚毒素（TTX）專一阻斷電位敏感型 Na⁺ 通道。推論鏈：<b>通道被擋 → Na⁺ 無法內流 → 去極化無法達閾值 → 不產生動作電位 → 運動神經元無法傳出訊號 → 呼吸肌（橫膈、肋間肌）不收縮 → 通氣停止、缺氧</b>。注意死因是「訊號傳不到肌肉」，而不是肺泡本身的氣體擴散出了問題。</p></div><div class=\"ex\"><h4>分辨問題出在哪一環</h4><ul><li><b>通道層</b>：神經不產生尖峰（TTX）。</li><li><b>突觸層</b>：尖峰到末梢，但神經傳遞物不能釋放或受體被擋（如肉毒桿菌毒素、箭毒）。</li><li><b>肌肉層</b>：肌肉本身無法收縮。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>河豚毒素中毒者的意識為何可能仍清醒？</p><p><b>答：</b>毒素主要作用於神經與骨骼肌的 Na⁺ 通道，造成肌肉癱瘓；若尚未影響到腦部缺氧，意識可能暫時保留，但呼吸肌停擺仍可致命。（此為機制討論，非處置指引。）</p></div>", "tb": []}, {"id": "b3-c41-l15", "t": "連續傳導：每一段再生訊號", "sec": "s3", "slide": 30, "sourceSlides": [30, 31, 32], "sourcePages": [6], "src": "原PPT第 30–32 頁；課本 P101–104", "figSpec": {"image": "conduction"}, "txt": "<ul><li>某段Na⁺內流造成局部電流，使鄰近尚可興奮的膜區去極化。</li><li>鄰近區達閾值後再產生動作電位；不是同一批Na⁺從細胞本體跑到末梢。</li><li>正常由起始區朝末梢推進；剛興奮區的不反應期限制立即向後再激發。</li></ul><p class=\"think\">如果從軸突中間人工刺激，傳導方向是否仍只能向末梢？</p><div class=\"scope-note\">局部電流可向兩側擴散；人工刺激中段且兩側可興奮時，可向兩側傳導。這與化學突觸的典型方向性要分開。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/12-4-the-action-potential\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>動作電位如何傳導</h4><p>動作電位沿著神經纖維向軸突末端傳導，是一段接一段「再生」出來的（圖 4－5）。</p></div><div class=\"ex\"><h4>步驟</h4><ul><li>產生動作電位處，鈉離子通道打開，Na⁺ 流入，形成去極化區。</li><li>去極化區的電流流向鄰近區域，使鄰近膜電位升高。</li><li>超過閾值時，鄰近區域的鈉離子通道感應電位改變而打開，引發新的動作電位。</li><li>重複進行，依序向軸突末梢傳導。</li></ul></div><div class=\"ex\"><h4>方向性</h4><p>剛產生過動作電位的區段處於不反應期，所以訊號只能往前傳，不會往回走。</p></div><div class=\"ex\"><h4>深入解說：像骨牌，但每張都會「重新充電」</h4><p>軸突某一小段產生動作電位時，Na⁺ 內流造成膜內正電，電流（局部電流）向鄰近膜流動，使鄰近區域去極化。達閾值後，那裡的 Na⁺ 通道開啟，再產生<b>新的、同樣大小</b>的動作電位。因為每一段都重新產生，所以訊號傳遠也<b>不會衰減</b>。傳的是「電位變化」，不是同一批離子跑完全程。</p></div><div class=\"ex\"><h4>為什麼只往前走</h4><ul><li>剛興奮過的區段 Na⁺ 通道失活，處於不反應期。</li><li>電流雖然向兩側擴散，但後方無法再次被激發。</li><li>正常情況起點在軸丘（軸突起始區），所以朝末梢單向傳導。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>在軸突中段人工刺激，訊息往哪傳？</p><p><b>答：</b>兩側都能傳（兩個方向）。正常體內只往末梢，是因為起點在軸突起始區；但突觸（化學）處則只能單向由前膜到後膜。</p></div>", "tb": [["BOOK6", "P101 完整課本頁"]]}, {"id": "b3-c41-l16", "t": "髓鞘與郎氏結：跳躍不是離子跳飛", "sec": "s3", "slide": 33, "sourceSlides": [33, 34], "sourcePages": [7], "src": "原PPT第 33–34 頁；課本 P101–104", "figSpec": {"image": "myelin"}, "txt": "<ul><li>髓鞘由膠細胞形成，減少跨膜漏流；動作電位主要在郎氏結再生。</li><li>結與結之間有局部電流傳遞，「跳躍」不表示Na⁺穿過空間跳到下一結。</li><li>同類條件下，較大軸突直徑與完整髓鞘有利較快傳導。</li></ul><p class=\"think\">去除髓鞘但保留軸突，為何訊號也可能變慢甚至失敗？</p><div class=\"scope-note\">中樞髓鞘由寡樹突膠細胞形成，周圍髓鞘由許旺細胞形成；兩者不可互換。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/12-2-nervous-tissue\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>影響傳導速率的兩個因素</h4><p><b>軸突直徑</b>與<b>絕緣狀況</b>。直徑越大，傳得越快。</p></div><div class=\"ex\"><h4>髓鞘與郎氏結</h4><ul><li>部分軸突被<b>髓鞘</b>包覆，髓鞘由神經膠細胞形成，具有保護與絕緣作用，可減緩電位衰竭。</li><li>兩段髓鞘之間有間隙，稱<b>郎氏結</b>，這裡仍可發生動作電位。</li><li>動作電位只在郎氏結發生，稱為<b>跳躍傳導</b>，速率比無髓鞘者快。</li></ul></div><div class=\"ex\"><h4>小提醒</h4><p>「跳躍」指的是動作電位發生的位置從一個郎氏結跳到下一個，不是離子跳過去。</p></div><div class=\"ex\"><h4>深入解說：髓鞘如何加速</h4><p>髓鞘像電線的絕緣皮，包裹軸突，使離子難以從膜漏出，電流可沿軸突快速傳到下一個郎氏結。郎氏結處裸露、密集分布電位敏感型 Na⁺ 通道，電位在此再生，因此動作電位「<b>從結跳到結</b>」，稱跳躍傳導，比無髓鞘纖維快數十倍，且耗能較少（只需在結處維持離子梯度）。</p></div><div class=\"ex\"><h4>影響傳導速率的因素</h4><ul><li>軸突直徑：越粗，內部電阻越小，越快。</li><li>髓鞘：有髓鞘比無髓鞘快。</li><li>髓鞘形成細胞：中樞為寡樹突膠細胞，周圍為許旺細胞。</li><li>髓鞘受損（如多發性硬化症）→ 傳導變慢或中斷。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>「跳躍傳導」中被跳過的是什麼？</p><p><b>答：</b>是被髓鞘包覆、不產生動作電位的軸突區段；電流在此以局部電流形式傳到下一結，離子並沒有真的跳過去。</p></div>", "tb": [["BOOK7", "P102 完整課本頁"]]}, {"id": "b3-c41-l17", "t": "兩種信號：電與化學接力", "sec": "s3", "slide": 35, "sourceSlides": [35, 36, 37], "sourcePages": [8], "src": "原PPT第 35–37 頁；課本 P101–104", "figSpec": {"image": "synapse"}, "txt": "<ul><li>軸突中的動作電位是電訊號；典型化學突觸用神經傳遞物跨細胞傳遞。</li><li>突觸包含突觸前、間隙與突觸後構造，不等於只有空隙。</li><li>軸突末梢有囊泡與粒線體等胞器；突觸後可為神經元，也可為肌肉。</li></ul><p class=\"think\">運動終板為何也可視為突觸的一種？</p><div class=\"scope-note\">本節主圖是化學突觸；另有經間隙連接傳遞的電突觸，因此不能說所有神經元間只靠化學物質。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/12-5-communication-between-neurons\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>兩種訊號</h4><p>神經系統使用電訊號與化學訊號。</p></div><div class=\"ex\"><h4>分工</h4><ul><li><b>電訊號</b>：在單一神經元內傳導（例如軸突上的動作電位）。</li><li><b>化學訊號</b>：在神經元間傳遞（例如突觸釋放化學物質）。</li></ul></div><div class=\"ex\"><h4>突觸的三個部分</h4><ul><li>突觸前神經元的<b>軸突末梢</b>。</li><li><b>突觸間隙</b>。</li><li>突觸後神經元的<b>樹突或細胞本體</b>（也可以是肌肉細胞）。</li></ul></div><div class=\"ex\"><h4>突觸前後</h4><p>軸突末梢有許多<b>突觸囊泡</b>，內含神經傳遞物（如乙醯膽鹼、去甲基腎上腺素）；突觸後細胞膜上有<b>受體</b>。</p></div><div class=\"ex\"><h4>深入解說：電＋化學的接力</h4><p>神經元<b>內部</b>用電訊號（動作電位）快速長距離傳導；神經元<b>之間</b>隔著突觸間隙，電訊號無法直接跨越，所以轉換成<b>化學訊號</b>：突觸前釋放神經傳遞物，擴散後與突觸後受體結合，再轉回電位變化。化學傳遞較慢，但可調節（興奮或抑制）、可整合多個輸入。</p></div><div class=\"ex\"><h4>突觸三部分</h4><ul><li>突觸前：軸突末梢（含突觸囊泡、粒線體）。</li><li>突觸間隙：約數十奈米的空隙。</li><li>突觸後：受體所在的樹突、細胞本體，或肌肉、腺體細胞。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>運動終板為什麼也算突觸？</p><p><b>答：</b>它是運動神經元末梢與骨骼肌細胞之間的化學突觸：釋放乙醯膽鹼，與肌肉細胞膜上的受體結合，引起肌肉動作電位。</p></div>", "tb": [["BOOK8", "P103 完整課本頁"]]}, {"id": "b3-c41-l18", "t": "Ca²⁺：囊泡釋放的直接觸發", "sec": "s3", "slide": 38, "sourceSlides": [38, 39, 40], "sourcePages": [], "src": "原PPT第 38–40 頁；課本 P101–104", "figSpec": {"image": "PPT38S3"}, "txt": "<ul><li>動作電位到達末梢，開啟電位敏感型Ca²⁺通道。</li><li>Ca²⁺流入促進囊泡與前膜融合，將神經傳遞物胞吐到間隙。</li><li>軸突上主要Na⁺通道與末梢釋放用Ca²⁺通道，角色不同。</li></ul><p class=\"think\">阻斷末梢Ca²⁺流入，前一段動作電位仍到達時，傳遞會卡在哪裡？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/12-5-communication-between-neurons\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>鈣離子的角色</h4><p>動作電位傳到軸突末梢時，會觸發囊泡釋放。這一步需要鈣離子。</p></div><div class=\"ex\"><h4>順序</h4><ul><li>動作電位傳到軸突末梢。</li><li>電位敏感型<b>鈣離子通道</b>打開，細胞外的 Ca²⁺ 流入軸突末梢。</li><li>Ca²⁺ 觸發突觸囊泡與細胞膜融合，釋出神經傳遞物。</li></ul></div><div class=\"ex\"><h4>為什麼重要</h4><p>Ca²⁺ 是囊泡釋放的直接觸發訊號；沒有 Ca²⁺ 流入，即使動作電位到了，也不會釋放神經傳遞物。</p></div><div class=\"ex\"><h4>深入解說：鈣離子是「開關」</h4><p>動作電位到軸突末梢，使<b>電位敏感型 Ca²⁺ 通道</b>開啟，細胞外高濃度的 Ca²⁺ 順梯度流入。Ca²⁺ 促使囊泡與前膜融合，以胞吐方式把神經傳遞物釋放到間隙。Ca²⁺ 流入量越多，釋放的囊泡越多。</p></div><div class=\"ex\"><h4>兩種通道的分工</h4><ul><li>軸突上：電位敏感型 <b>Na⁺／K⁺</b> 通道 → 傳導動作電位。</li><li>末梢：電位敏感型 <b>Ca²⁺</b> 通道 → 引發釋放。</li><li>Ca²⁺ 被擋時，尖峰到了末梢卻不能釋放傳遞物（傳遞被阻斷）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>把細胞外 Ca²⁺ 去除，神經末梢的動作電位還存在嗎？傳遞還成功嗎？</p><p><b>答：</b>動作電位仍可傳到末梢，但沒有 Ca²⁺ 流入，囊泡無法融合，突觸傳遞失敗。</p></div>", "tb": []}, {"id": "b3-c41-l19", "t": "突觸五步：膜電位到受體", "sec": "s3", "slide": 41, "sourceSlides": [41, 42], "sourcePages": [9], "src": "原PPT第 41–42 頁；課本 P101–104", "figSpec": {"image": "synapse"}, "txt": "<ul><li>動作電位→Ca²⁺流入→胞吐→擴散與受體結合→後膜電位變化。</li><li>神經傳遞物跨越間隙，受體留在後膜；不是囊泡整個流入後神經元。</li><li>後膜產生局部電位變化，再經整合，達閾值才觸發新的動作電位。</li></ul><p class=\"think\">每一次囊泡釋放，是否必然造成後神經元產生一個尖峰？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/12-5-communication-between-neurons\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>突觸傳遞的五步驟（圖 4－7）</h4><p></p></div><div class=\"ex\"><h4>依序</h4><ul><li>1 動作電位傳至軸突末梢。</li><li>2 突觸囊泡向細胞膜接近。</li><li>3 囊泡與細胞膜融合，釋出神經傳遞物。</li><li>4 神經傳遞物擴散通過突觸間隙，與突觸後神經元的<b>受體</b>結合。</li><li>5 與受體相連的離子通道開啟，突觸後神經元的膜電位改變。</li></ul></div><div class=\"ex\"><h4>後續</h4><p>若電位變化達到閾值，就在突觸後神經元引發動作電位，繼續傳遞。例如開啟鈉離子通道，Na⁺ 流入，引起去極化。</p></div><div class=\"ex\"><h4>深入解說：局部電位與動作電位</h4><p>突觸後膜上的電位變化是<b>局部、分級</b>的：傳遞物量越多、結合受體越多，變化越大，且會隨距離衰減，不遵守全有全無。這些電位變化在細胞本體與軸突起始區<b>加總</b>，只有達到閾值，才在軸突上產生動作電位。所以，一次囊泡釋放不必然引發一個尖峰。</p></div><div class=\"ex\"><h4>傳遞後要清除</h4><ul><li>傳遞物與受體解離後，要被酵素分解（如乙醯膽鹼酯酶）或被突觸前膜回收。</li><li>否則突觸後細胞會持續被刺激。</li><li>許多藥物與毒素作用在清除這一步。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>說明突觸傳遞為什麼是單向的。</p><p><b>答：</b>傳遞物只儲存在突觸前囊泡，受體只位於突觸後膜，所以訊息只能由前往後。</p></div>", "tb": [["BOOK9", "P104 完整課本頁"]]}, {"id": "b3-c41-l20", "t": "興奮、抑制與整合：看受體與條件", "sec": "s3", "slide": 43, "sourceSlides": [43, 44], "sourcePages": [], "src": "原PPT第 43–44 頁；課本 P101–104", "figSpec": {"image": "PPT43S3"}, "txt": "<ul><li>Na⁺等陽離子淨流入可造成興奮性局部去極化；K⁺外流常使電位降低。</li><li>Cl⁻通道的效果取決於電位與離子梯度；抑制也可表現為分流，不一定明顯過極化。</li><li>多個輸入可作時間或空間加成；單一未達閾值的輸入仍會影響整合。</li></ul><p class=\"think\">同一種傳遞物在不同細胞產生不同反應，需要檢查哪些條件？</p><div class=\"scope-note\">原PPT「訊號不被傳遞」以未引發動作電位的簡化模型解讀，不表示抑制訊號沒有功能或完全沒有傳達。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/12-5-communication-between-neurons\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>同一種傳遞物，不同結果</h4><p>效果取決於受體連結的離子通道（補充）。</p></div><div class=\"ex\"><h4>三種例子</h4><ul><li>連結<b>鈉離子通道</b>：Na⁺ 流入，去極化，可能引發動作電位（興奮）。</li><li>連結<b>鉀離子通道</b>：K⁺ 流出，過極化，較不易達到閾值。</li><li>連結<b>氯離子通道</b>：Cl⁻ 流入，過極化，較不易達到閾值。</li></ul></div><div class=\"ex\"><h4>整合</h4><p>突觸後神經元可能同時接受多個輸入，各自使電位升高或降低，總和是否達閾值，決定是否產生動作電位。簡報中的「訊號不被傳遞」是簡化說法：沒有引發動作電位，不代表抑制訊號沒有作用。</p></div><div class=\"ex\"><h4>課本的重點</h4><p>化學訊號比電訊號慢，但同一種化學物質在不同細胞會因受體不同而有不同反應。</p></div><div class=\"ex\"><h4>深入解說：結果取決於受體與通道</h4><p>傳遞物本身沒有「興奮」或「抑制」的屬性，<b>效果取決於受體連結哪一種離子通道</b>。連 Na⁺ 通道 → 去極化（興奮）；連 K⁺ 通道（K⁺ 外流）或 Cl⁻ 通道（Cl⁻ 內流）→ 過極化，離閾值更遠（抑制）。同一種乙醯膽鹼在骨骼肌興奮、在心肌減慢，就是受體不同。</p></div><div class=\"ex\"><h4>整合的兩種方式</h4><ul><li><b>空間加成</b>：多個突觸同時輸入，電位相加。</li><li><b>時間加成</b>：同一突觸在短時間內連續輸入，電位疊加。</li><li>興奮與抑制輸入互相抵消或加成，總和達閾值才發射。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>抑制性突觸是否代表「沒有任何訊息傳遞」？</p><p><b>答：</b>不是。抑制性輸入有傳遞，只是使突觸後電位更負、更難達閾值；教材「訊號不被傳遞」是指沒有引發新的動作電位。</p></div>", "tb": []}, {"id": "b3-c41-l21", "t": "系統分區：中樞與周圍", "sec": "s4", "slide": 45, "sourceSlides": [45, 46], "sourcePages": [10], "src": "原PPT第 45–46 頁；課本 P105–107", "figSpec": {"image": "system"}, "txt": "<ul><li>中樞神經系統包含腦與脊髓；周圍神經包含腦神經與脊神經。</li><li>人體有12對腦神經、31對脊神經；對數不是全部神經元的數目。</li><li>神經是纖維束，神經元是細胞；神經節與中樞灰質也需分清位置。</li></ul><p class=\"think\">感覺訊息來回穿過哪些系統邊界？</p><div class=\"ex\"><h4>神經系統的分區</h4><p>人體神經系統分為<b>中樞神經系統</b>與<b>周圍神經系統</b>（圖 4－8）。</p></div><div class=\"ex\"><h4>組成</h4><ul><li>中樞神經系統：<b>腦與脊髓</b>，是指揮中心，整合訊息並發出命令。</li><li>周圍神經系統：<b>12 對腦神經</b>與 <b>31 對脊神經</b>，主要負責傳遞訊息。</li></ul></div><div class=\"ex\"><h4>腦的組成</h4><p>腦包含大腦、小腦、腦幹；腦幹又包含中腦、橋腦、延腦。</p></div><div class=\"ex\"><h4>深入解說：分區看位置</h4><p><b>中樞神經系統（CNS）</b>＝腦＋脊髓，整合與決策；<b>周圍神經系統（PNS）</b>＝腦神經 12 對＋脊神經 31 對，負責與身體各處往返傳遞。訊息路徑通常是：受器 →（PNS 感覺纖維）→ CNS →（PNS 運動纖維）→ 動器。</p></div><div class=\"ex\"><h4>名詞分清</h4><ul><li><b>神經元</b>：一個細胞。</li><li><b>神經</b>：許多神經纖維（軸突）聚集成束，外有結締組織包覆。</li><li><b>神經節</b>：周圍神經中，神經元細胞本體聚集處。</li><li><b>灰質／白質</b>：中樞內細胞本體區／有髓纖維區。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>脊神經 31 對的脊椎分區？</p><p><b>答：</b>頸 8、胸 12、腰 5、薦 5、尾 1（共 31 對）；分區數與脊椎骨數不完全相同（頸椎 7 但頸神經 8 對）。</p></div>", "tb": [["BOOK10", "P105 完整課本頁"]]}, {"id": "b3-c41-l22", "t": "腦的構造：剖面方向與灰白質", "sec": "s4", "slide": 47, "sourceSlides": [47, 48], "sourcePages": [11], "src": "原PPT第 47–48 頁；課本 P105–107", "figSpec": {"image": "brain"}, "txt": "<ul><li>大腦左右半球經胼胝體互相聯繫；側面與背面剖圖的方向不同。</li><li>大腦表面皮質為灰質，內部多為白質；神經元本體與有髓纖維是重要差異。</li><li>灰質仍含突起與膠細胞，白質仍含膠細胞；不能解讀成百分之百單一組成。</li></ul><p class=\"think\">為什麼不能拿腦的灰白質位置直接套到脊髓？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/13-2-the-central-nervous-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>大腦</h4><p>中樞神經系統位於顱腔中，分為大腦、間腦、小腦及腦幹。</p></div><div class=\"ex\"><h4>大腦</h4><ul><li>最膨大，由<b>左、右兩個半球</b>組成，以<b>胼胝體</b>相連、互相傳遞訊息。</li><li>表面的<b>皮質</b>含許多細胞本體，顏色較深，稱<b>灰質</b>；下方的<b>髓質</b>由神經纖維聚集，顏色較淺，稱<b>白質</b>。</li><li>功能：隨意運動、感覺、記憶、語言、思考，是意識中樞。</li></ul></div><div class=\"ex\"><h4>讀剖面圖</h4><p>圖 4－9 有側面和背面兩種剖面，看之前要先確認方向，再找灰質與白質的位置。</p></div><div class=\"ex\"><h4>深入解說：灰質、白質與剖面</h4><p>大腦皮質含大量細胞本體與樹突，顏色較深，稱灰質；內部以有髓鞘軸突為主，顏色較淺，稱白質。<b>胼胝體</b>是大量連接左右半球的白質纖維束。注意：<b>腦是外灰內白，脊髓相反——內灰外白</b>（見脊髓卡）。讀剖面圖先確認是側面、背面還是橫切，再找位置。</p></div><div class=\"ex\"><h4>大腦功能分區（概念）</h4><ul><li>額葉：隨意運動、思考判斷。</li><li>頂葉：體感覺。</li><li>顳葉：聽覺、語言、記憶。</li><li>枕葉：視覺。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>白質為什麼顏色較淺？</p><p><b>答：</b>因為軸突被髓鞘（富含脂質）包覆，髓鞘呈白色；灰質則富含細胞本體，血管豐富，顏色偏灰褐。</p></div>", "tb": [["BOOK11", "P106 完整課本頁"]]}, {"id": "b3-c41-l23", "t": "間腦：感覺中繼與內分泌", "sec": "s4", "slide": 49, "sourceSlides": [49], "sourcePages": [], "src": "原PPT第 49 頁；課本 P105–107", "figSpec": {"image": "brain"}, "txt": "<ul><li>視丘是多種感覺通向大腦皮質的重要中繼站；課本以嗅覺為例外。</li><li>下視丘參與體溫、食慾、口渴與內分泌調節。</li><li>神經內分泌是神經元釋放激素調節身體，連結神經與激素系統。</li></ul><p class=\"think\">缺水時口渴與ADH調節，為何可同時連到下視丘？</p><div class=\"scope-note\">視丘也有運動與注意等功能；「嗅覺例外」指初級嗅覺到皮質的典型途徑，不代表嗅覺完全不與視丘互動。</div><div class=\"ex\"><h4>間腦</h4><p>位於大腦兩個半球之間，包含視丘與下視丘。</p></div><div class=\"ex\"><h4>分工</h4><ul><li><b>視丘</b>：除嗅覺外，其他感覺訊號進入大腦前的中繼站。</li><li><b>下視丘</b>：體溫、食慾、口渴的中樞，並會分泌激素調控生理功能。</li></ul></div><div class=\"ex\"><h4>神經內分泌</h4><p>由神經元分泌激素的現象，稱為<b>神經內分泌</b>（例如 3-2 的抗利尿素由下視丘合成）。</p></div><div class=\"ex\"><h4>深入解說：間腦是「中繼＋調控」</h4><p><b>視丘</b>接收除嗅覺以外的大多數感覺訊息，篩選後送往大腦皮質對應區域。<b>下視丘</b>位於視丘下方，監測體溫、血液滲透壓、血糖等內在狀態，調節體溫、口渴、食慾、睡眠，並透過神經內分泌控制腦垂腺：一部分神經元合成並由後葉釋放<b>抗利尿素（ADH）</b>與催產素，另一部分分泌釋放激素調控前葉。</p></div><div class=\"ex\"><h4>神經與內分泌的橋樑</h4><ul><li>下視丘神經元＝神經細胞 + 分泌激素的能力。</li><li>缺水 → 血液滲透壓上升 → 下視丘渴覺中樞與 ADH 分泌同時活化。</li><li>與 3-2 泌尿排泄章節的水分調節直接連結。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>為什麼說下視丘是神經系統與內分泌系統的接點？</p><p><b>答：</b>它是神經組織，卻能分泌或控制激素的釋放，把神經訊號轉成激素訊號，調控全身。</p></div>", "tb": []}, {"id": "b3-c41-l24", "t": "小腦：協調而非替代全部指令", "sec": "s4", "slide": 50, "sourceSlides": [50], "sourcePages": [], "src": "原PPT第 50 頁；課本 P105–107", "figSpec": {"image": "brain"}, "txt": "<ul><li>小腦參與協調骨骼肌運動、姿勢與動作精準度。</li><li>它整合感覺與運動相關訊息；不等於肌肉收縮的唯一發令處。</li><li>大腦、腦幹與小腦合作，不能把複雜行為都歸給單一部位。</li></ul><p class=\"think\">若能出力卻動作不協調，與完全無法出力的機制差異是什麼？</p><div class=\"ex\"><h4>小腦</h4><p>位於大腦的後下方，也由左、右兩個半球組成，是人體<b>協調骨骼肌運動</b>的重要部位。</p></div><div class=\"ex\"><h4>怎麼理解</h4><p>大腦下達「要動」的命令，小腦負責讓動作順暢、平衡、協調；它不是替代全部指令的構造。</p></div><div class=\"ex\"><h4>深入解說：小腦做「修正與協調」</h4><p>小腦接收來自大腦的運動計畫與來自肌肉、關節、前庭（平衡）的回饋，比較「想做的」與「實際做的」，再修正輸出，讓動作順暢、精準，並維持身體平衡與姿勢。它不發出「要動」的主要命令，這由大腦運動皮質負責。</p></div><div class=\"ex\"><h4>小腦受損的表現</h4><ul><li>動作笨拙、顫抖（尤其在接近目標時）。</li><li>走路步伐不穩、平衡差。</li><li>肌力通常保留（與運動神經／肌肉受損不同）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>喝醉酒走路歪斜與小腦有何關係？</p><p><b>答：</b>酒精抑制小腦與前庭等功能，使動作協調與平衡下降，所以出現步伐不穩、手眼不協調。</p></div>", "tb": []}, {"id": "b3-c41-l25", "t": "腦幹：反射與生命維持", "sec": "s4", "slide": 51, "sourceSlides": [51, 52], "sourcePages": [], "src": "原PPT第 51–52 頁；課本 P105–107", "figSpec": {"image": "brain"}, "txt": "<ul><li>腦幹包含中腦、橋腦與延腦；中腦參與視聽反射及眼球運動。</li><li>橋腦協助呼吸節奏，延腦參與呼吸、循環與吞嚥等反射。</li><li>腦幹連接腦與脊髓；腦垂腺不屬腦幹，小腦也不屬腦幹。</li></ul><p class=\"think\">吸氣、吞嚥與咳嗽為何需要協調，而非三個完全互不相干的開關？</p><div class=\"ex\"><h4>腦幹</h4><p>位於腦的底部，連接大腦與脊髓，體積不大，卻是維持生命功能的關鍵區域。包含三部分，由上而下為中腦、橋腦、延腦。</p></div><div class=\"ex\"><h4>三部分</h4><ul><li><b>中腦</b>：整合視覺與聽覺反射，如瞳孔對光反應、聽覺轉頭反射，並參與眼球運動與姿勢調節。</li><li><b>橋腦</b>：連接中腦與延腦，協助延腦調節吸氣與呼氣的節奏。</li><li><b>延腦</b>：控制呼吸、心跳、血壓調節，以及吞嚥、嘔吐、咳嗽等反射。</li></ul></div><div class=\"ex\"><h4>深入解說：腦幹是「生命基本盤」</h4><p>由上而下：<b>中腦</b>（視、聽反射，瞳孔對光反應，眼球運動）、<b>橋腦</b>（連接小腦與大腦，協助調節呼吸節律）、<b>延腦</b>（呼吸、心跳、血壓中樞，以及吞嚥、嘔吐、咳嗽反射）。腦幹受損常危及生命，所以「腦幹死亡」是判定腦死的重要依據。</p></div><div class=\"ex\"><h4>容易混淆</h4><ul><li>腦幹＝中腦＋橋腦＋延腦；<b>不含</b>間腦、小腦。</li><li>腦垂腺屬內分泌腺，由下視丘控制。</li><li>延腦的呼吸中樞透過脊髓神經控制呼吸肌，連回 3-1 的呼吸運動。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>吞嚥時為什麼不會同時吸氣？</p><p><b>答：</b>延腦協調吞嚥與呼吸中樞：吞嚥時會暫時抑制呼吸、關閉氣管入口（會厭），避免食物進入氣管。</p></div>", "tb": []}, {"id": "b3-c41-l26", "t": "脊髓：雙向通路與反射中樞", "sec": "s4", "slide": 53, "sourceSlides": [53, 54], "sourcePages": [12], "src": "原PPT第 53–54 頁；課本 P105–107", "figSpec": {"image": "spinal"}, "txt": "<ul><li>脊髓位於脊柱保護的椎管中；表層白質、中央灰質。</li><li>白質纖維束有上行及下行通路，連絡腦與身體訊息。</li><li>部分反射可由脊髓迴路迅速完成，仍可把訊息傳向腦，並受腦的調節。</li></ul><p class=\"think\">先縮手後感到疼痛，是否表示大腦完全沒有收到訊息？</p><div class=\"ex\"><h4>脊髓的位置</h4><p>位於脊椎骨組成的脊髓腔中，從延腦下方延伸到背側下方。</p></div><div class=\"ex\"><h4>灰質與白質（與大腦相反）</h4><ul><li><b>白質</b>在表層：由神經纖維組成，顏色較淺。</li><li><b>灰質</b>在中央：由神經元細胞本體聚集，顏色較深。</li></ul></div><div class=\"ex\"><h4>功能</h4><p>脊髓是腦與軀幹、四肢、內臟聯絡訊息的<b>雙向通路</b>，也是排尿反射與許多肢體反射的中樞。</p></div><div class=\"ex\"><h4>深入解說：脊髓既是通道也是反射中樞</h4><p>脊髓與腦之間有<b>上行</b>（感覺傳向腦）與<b>下行</b>（運動命令傳向身體）的纖維束，位於外層白質。中央蝴蝶形灰質含細胞本體與聯絡神經元，許多簡單反射（如縮手、膝跳）直接在脊髓整合完成，反應更快；同時訊息也上傳，所以你「縮手後才感到痛」。</p></div><div class=\"ex\"><h4>與腦的對照</h4><ul><li>腦：外灰內白；脊髓：外白內灰。</li><li>脊髓受傷位置越高，影響的範圍越大（損傷以下的感覺與運動受影響）。</li><li>排尿反射等由脊髓中樞完成，並受腦調節（成人可憋尿）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>縮手反射為什麼比「感到痛」快？</p><p><b>答：</b>反射路徑只經過脊髓，距離短、突觸少；痛覺要上傳到大腦皮質才形成，路徑較長，所以先縮手後才感覺痛。</p></div>", "tb": [["BOOK12", "P107 完整課本頁"]]}, {"id": "b3-c41-l27", "t": "背根、腹根與混合神經", "sec": "s4", "slide": 55, "sourceSlides": [55, 56], "sourcePages": [], "src": "原PPT第 55–56 頁；課本 P105–107", "figSpec": {"image": "spinal"}, "txt": "<ul><li>感覺神經元細胞本體在背根神經節，傳入軸突經背根進入脊髓。</li><li>軀體運動神經元本體位於腹角，軸突經腹根離開。</li><li>背根與腹根合併形成混合脊神經；一束有兩方向，不表示每條軸突同時任意雙向。</li></ul><p class=\"think\">切斷背根與切斷腹根，對感覺輸入及肌肉輸出有何不同？</p><div class=\"ex\"><h4>神經</h4><p>神經是由許多神經纖維聚集成束的構造，分三種。</p></div><div class=\"ex\"><h4>三種神經</h4><ul><li><b>感覺神經</b>：纖維皆由受器傳入中樞。</li><li><b>運動神經</b>：纖維皆由中樞傳出至動器。</li><li><b>混合神經</b>：兼具傳入與傳出纖維，如<b>所有的脊神經</b>。</li></ul></div><div class=\"ex\"><h4>脊神經的路徑（圖 4－10）</h4><ul><li>感覺神經元的細胞本體在<b>背根神經節</b>，傳入軸突經<b>背根</b>進入脊髓背側。</li><li>運動神經元的細胞本體在脊髓灰質的<b>腹角</b>，軸突經<b>腹根</b>離開。</li><li>背根與腹根合併成混合性的脊神經。</li></ul></div><div class=\"ex\"><h4>思考</h4><p>切斷背根 → 失去感覺輸入；切斷腹根 → 失去對肌肉的輸出。</p></div><div class=\"ex\"><h4>深入解說：背根進、腹根出</h4><p>脊神經在靠近脊髓處分成兩根：<b>背根</b>只含感覺纖維（傳入），其上膨大的<b>背根神經節</b>裡是感覺神經元細胞本體；<b>腹根</b>只含運動纖維（傳出），細胞本體在脊髓灰質腹角。兩根合併後的脊神經同時含兩種纖維，稱混合神經。口訣：「<b>背進腹出</b>」。</p></div><div class=\"ex\"><h4>切斷實驗推論</h4><ul><li>切斷背根：該區感覺消失，但肌肉仍可由腦發出命令收縮。</li><li>切斷腹根：感覺仍在，但該區肌肉無法收縮（麻痺）。</li><li>切斷脊神經（兩根合併處以外）：兩者皆失去。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>為什麼說所有脊神經都是混合神經，而腦神經卻不一定？</p><p><b>答：</b>脊神經由背根（感覺）與腹根（運動）合併而成，必含兩種纖維；腦神經則有純感覺（嗅、視、聽）、純運動、與混合三類。</p></div>", "tb": []}, {"id": "b3-c41-l28", "t": "原題一：靜止膜電位的語意", "sec": "s5", "slide": 57, "sourceSlides": [57], "sourcePages": [], "src": "原PPT第 57 頁；課本 P96–107／原題與延伸", "figSpec": {"image": "PPT57S3"}, "txt": "<ul><li>原題答案B：維持靜止膜電位的現象稱極化。</li><li>靜止不是0 mV，未刺激時膜內電位較外側低。</li><li>原解析的「僅神經與肌肉可產生動作電位」是本節典型模型，非跨所有細胞的絕對限制。</li></ul><p class=\"think\">如何用兩電極的位置與讀值反駁A及D？</p><div class=\"ex\"><h4>原題一</h4><p>下列有關膜電位的敘述，何者正確？</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 靜止膜電位表示膜電位為 0 mV 的狀態</li><li>(B) 神經元維持在靜止膜電位的現象稱為極化</li><li>(C) 僅神經元與肌肉細胞具有膜電位</li><li>(D) 未受刺激時的神經元膜內電位較細胞膜外高</li></ul></div><div class=\"ex\"><h4>答案：(B)</h4><p></p></div><div class=\"ex\"><h4>其他選項</h4><ul><li>(A) 靜止膜電位是未受刺激時膜內外的電位差，人類約 −70 mV。</li><li>(C) <b>所有細胞</b>都有膜電位；僅神經元與肌肉細胞可產生動作電位。</li><li>(D) 膜內電位比膜外<b>低</b>。</li></ul></div><div class=\"ex\"><h4>深入解說：逐項釐清</h4><p>(A) 靜止膜電位不是 0 mV，而是 −70 mV，代表膜內外存在電位差。(B) 維持在靜止膜電位的現象稱<b>極化</b>，正確。(C) <b>所有活細胞</b>都有膜電位，只有神經與肌肉細胞（本節典型）能產生動作電位。(D) 膜內比膜外電位<b>低</b>，不是高。</p></div><div class=\"ex\"><h4>易錯觀念</h4><ul><li>「靜止」≠ 電位 0。</li><li>「有膜電位」≠「能產生動作電位」。</li><li>電位比較要說明「相對於哪一側」。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>用兩電極怎麼反駁選項 A 與 D？</p><p><b>答：</b>一極在膜外（設 0 mV），一極插入膜內，讀值為約 −70 mV：不是 0（反駁 A），且內側較外側低（反駁 D）。</p></div>", "tb": []}, {"id": "b3-c41-l29", "t": "原題二：突觸原題與模型界線", "sec": "s5", "slide": 58, "sourceSlides": [58], "sourcePages": [], "src": "原PPT第 58 頁；課本 P96–107／原題與延伸", "figSpec": {"image": "PPT58S3"}, "txt": "<ul><li>原答案C、E；運動終板是突觸，突觸前末梢也有胞器。</li><li>同一神經傳遞物的效果會受受體種類影響；突觸不只是一道空隙。</li><li>E以「當次未達閾值便不產生新動作電位」解讀；局部電位與整合仍可存在。</li></ul><p class=\"think\">若兩次未達閾值的輸入相加後達閾值，E需要加上什麼條件？</p><div class=\"scope-note\">保留原題選項及答案C、E，判分明示依原PPT模型；另以整合題檢查較精確的概念。</div><div class=\"ex\"><h4>原題二（多選）</h4><p>有關突觸的敘述，下列哪些正確？</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 突觸指的是兩個可傳遞訊息神經元間的空隙</li><li>(B) 突觸前神經元的軸突末梢不具任何胞器，僅負責釋出神經傳遞物</li><li>(C) 運動終板也是一種突觸</li><li>(D) 同一種神經傳遞物造成的生理現象必定相同</li><li>(E) 若突觸後神經元接受訊息後的電位變化未達閾值，則訊息無法傳遞</li></ul></div><div class=\"ex\"><h4>答案：(C)(E)</h4><p></p></div><div class=\"ex\"><h4>其他選項</h4><ul><li>(A) 突觸包含突觸前末梢、突觸間隙與突觸後的樹突或細胞本體；突觸後也可以是肌肉細胞。</li><li>(B) 軸突末梢有粒線體等胞器。</li><li>(D) 效果要看受體種類而定。</li></ul></div><div class=\"ex\"><h4>補充</h4><p>(E) 是依本節的簡化模型：該次未達閾值就不會引發新的動作電位。實際上局部電位仍可經整合累加，需要時再補充條件。</p></div><div class=\"ex\"><h4>深入解說：逐項分析</h4><p>(A) 突觸除間隙外，還有前膜與後膜，後膜也可為肌肉。(B) 軸突末梢有粒線體與囊泡，並非沒有胞器。(C) 運動終板是運動神經元與肌肉的突觸，正確。(D) 傳遞物的效果取決於受體。(E) 依簡化模型，未達閾值則不產生新的動作電位，以此判分。</p></div><div class=\"ex\"><h4>延伸思考</h4><ul><li>兩次未達閾值的輸入若在短時間內相加，可能達閾值（時間加成）。</li><li>若多個突觸同時輸入並相加，也可達閾值（空間加成）。</li><li>因此 (E) 在更完整的敘述中要加上「且無加成」。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>(E) 要在什麼條件下才完全成立？</p><p><b>答：</b>需補上「輸入之間沒有時間或空間加成」，且不會累積到閾值；教材以簡化條件作答。</p></div>", "tb": []}, {"id": "b3-c41-l30", "t": "原題三：神經元網絡的匯聚與分支", "sec": "s5", "slide": 59, "sourceSlides": [59, 60], "sourcePages": [], "src": "原PPT第 59–60 頁；課本 P96–107／原題與延伸", "figSpec": {"image": "originalNetwork"}, "txt": "<ul><li>原答案B、C；甲乙可作丙的突觸前神經元，多個輸入不表示閾值成倍。</li><li>鈉離子會影響丁的膜電位；分支或匯聚不能僅憑圖判定中樞專有。</li><li>原題以相似閾值的教材模型比較丙丁；實際閾值受細胞種類與狀態影響。</li></ul><p class=\"think\">如何從圖中的連接方向分辨匯聚與分支？</p><div class=\"ex\"><h4>原題三（107 指考，多選）</h4><p>右圖為人體神經元分布示意圖，下列敘述哪些正確？</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 可引起神經衝動的閾值丙是丁的兩倍</li><li>(B) 甲與乙皆可為丙細胞的突觸前神經元</li><li>(C) 引發丙與丁產生神經衝動的膜電位相似</li><li>(D) 鈉離子對於丁的細胞膜電位不具有影響力</li><li>(E) 這種神經元的相互聯繫是中樞神經專有</li></ul></div><div class=\"ex\"><h4>答案：(B)(C)</h4><p></p></div><div class=\"ex\"><h4>其他選項</h4><ul><li>(A) 人類神經元的閾值電位約 −50 mV，不會差兩倍。</li><li>(D) Na⁺ 是細胞外主要的陽離子，對這些神經元的膜電位都有影響。</li><li>(E) 周圍神經也有相互聯繫。</li></ul></div><div class=\"ex\"><h4>讀圖技巧</h4><p>看連接方向：多個神經元連到同一個神經元是<b>匯聚</b>，一個神經元分支連到多個是<b>分支（發散）</b>。</p></div><div class=\"ex\"><h4>深入解說：讀神經元網絡圖</h4><p>看箭頭或突觸連線：<b>匯聚</b>＝多個突觸前神經元連到同一個突觸後神經元（整合）；<b>分支（發散）</b>＝一個神經元的軸突分支連到多個目標（廣播）。甲、乙都連到丙，所以 (B) 正確；各種神經元的閾值差不多（約 −50 mV），所以 (C) 對、(A) 錯。</p></div><div class=\"ex\"><h4>選項要點</h4><ul><li>(A) 閾值為約 −50 mV，不可能差兩倍。</li><li>(D) Na⁺ 是主要的細胞外陽離子，影響膜電位。</li><li>(E) 周圍神經系統（如神經節）也有神經元互相聯繫。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>匯聚與分支各有什麼生理意義？</p><p><b>答：</b>匯聚使一個神經元整合多種輸入、決定是否發射；分支使一個訊號同時影響多個目標，達到協調或放大。</p></div>", "tb": []}, {"id": "b3-c41-l31", "t": "延伸：自律神經的共同路徑", "sec": "s5", "slide": 45, "sourceSlides": [45, 56], "sourcePages": [], "src": "原PPT第 45–56 頁；課本 P96–107／原題與延伸", "figSpec": {"image": "system"}, "txt": "<ul><li>本卡承接舊版延伸題，超出本節提供的P96–107，不冒稱P118–119已在本次PDF中。</li><li>交感與副交感多經節前、節後神經元連到心肌、平滑肌與腺體。</li><li>交感節前多自胸腰段，副交感多自腦幹與薦段；腎上腺髓質是路徑特例。</li></ul><p class=\"think\">若一個內臟效應器不受兩支共同支配，還能說所有反應都相互拮抗嗎？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/15-1-divisions-of-the-autonomic-nervous-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>延伸：自律神經的路徑</h4><p>（超出本節課本頁，為延伸銜接。）周圍神經系統中支配內臟的運動部分稱自律神經，分<b>交感神經</b>與<b>副交感神經</b>。</p></div><div class=\"ex\"><h4>共同模式</h4><ul><li>從中樞到效應器通常經過兩個神經元：<b>節前神經元</b>與<b>節後神經元</b>。</li><li>效應器是心肌、平滑肌與腺體。</li><li>交感節前神經元多來自胸腰段脊髓；副交感多來自腦幹與薦段脊髓。</li></ul></div><div class=\"ex\"><h4>小心</h4><p>兩者常有相反作用，但並非所有器官都受兩者共同支配，不能說所有反應都拮抗。</p></div><div class=\"ex\"><h4>深入解說：兩神經元接力</h4><p>周圍神經的運動部分分<b>軀體運動神經</b>（支配骨骼肌，中樞到肌肉只有 1 個神經元）與<b>自律神經</b>（支配平滑肌、心肌、腺體，需經<b>節前、節後</b>兩個神經元）。交感神經節前纖維短、節後纖維長；副交感節前纖維長、節後纖維短，神經節靠近或位於目標器官內。</p></div><div class=\"ex\"><h4>對照（延伸）</h4><ul><li>交感：胸腰段脊髓；戰或逃。</li><li>副交感：腦幹與薦段；休息與消化。</li><li>許多器官同時受兩者支配且作用相反（如心跳）；但有些只受交感支配（如多數血管、汗腺）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>為什麼說「交感與副交感互相拮抗」不能套用到所有器官？</p><p><b>答：</b>有些器官只受單一系統支配（如多數血管只受交感），或兩者作用並非單純相反，所以要逐器官判斷。（延伸內容，超出本節課本頁。）</p></div>", "tb": []}, {"id": "b3-c41-l32", "t": "延伸：戰逃反應不是每個器官同一效果", "sec": "s5", "slide": 45, "sourceSlides": [45, 56], "sourcePages": [], "src": "原PPT第 45–56 頁；課本 P96–107／原題與延伸", "figSpec": {"image": "system"}, "txt": "<ul><li>緊急狀態可見心跳加快、瞳孔放大及消化活動降低等交感相關反應。</li><li>腎上腺髓質可釋放兒茶酚胺；人體支氣管舒張的重要途徑包含循環腎上腺素。</li><li>不能把「副交感使某器官相反」外推至所有器官；血管與汗腺等有不同支配特性。</li></ul><p class=\"think\">神經末梢作用與血液中的激素作用，要用哪兩條箭頭區分？</p><div class=\"scope-note\">本卡為舊版概念的延伸銜接，不列作本節原課本或原PPT新增頁。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/15-1-divisions-of-the-autonomic-nervous-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"ex\"><h4>延伸：戰或逃反應</h4><p>緊急狀態（驚嚇、劇烈運動）時，交感神經活性增加。</p></div><div class=\"ex\"><h4>常見反應</h4><ul><li>心跳加快、血壓上升。</li><li>瞳孔放大。</li><li>消化活動降低。</li><li>腎上腺髓質釋放腎上腺素（循環在血液中的激素）。</li></ul></div><div class=\"ex\"><h4>兩條路徑要分清</h4><p>一條是神經末梢釋放神經傳遞物（作用快、局部）；另一條是腎上腺髓質把激素釋放到血液，隨血流作用到全身（作用較廣）。不能把「副交感使某器官相反」套用到所有器官。</p></div><div class=\"ex\"><h4>深入解說：兩條路徑</h4><p>緊急狀態時：①<b>神經路徑</b>：交感神經末梢釋放去甲基腎上腺素，作用快、局部；②<b>激素路徑</b>：交感神經刺激腎上腺髓質，釋放腎上腺素與去甲基腎上腺素進入血液，作用較廣、持續較久。兩者合作，使心跳加快、瞳孔放大、支氣管舒張、肝糖釋出、消化活動減弱，為肌肉提供更多氧與能量。</p></div><div class=\"ex\"><h4>常見反應與目的</h4><ul><li>心跳、血壓上升 → 供應肌肉。</li><li>瞳孔放大 → 蒐集更多視覺訊息。</li><li>消化、排泄活動降低 → 把資源讓給運動。</li><li>血糖上升 → 提供能量。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>神經傳遞物與激素的主要差別是什麼？</p><p><b>答：</b>神經傳遞物由神經末梢釋放到突觸間隙，作用在鄰近目標，速度快；激素由內分泌腺／腎上腺髓質釋放入血液，隨血流作用到全身，範圍廣、持續較久。（延伸內容。）</p></div>", "tb": []}], "questions": [{"t": "通道狀態的三段分類", "q": "每段放兩張卡；同段兩格可交換。", "learn": 11, "tag": "potential", "hint": "分清幫浦維持與一次尖峰的通道變化。", "why": "Na⁺內流促進上升，K⁺外流促進下降；幫浦長期維持梯度，不是下降相的快速開關。", "sub": "原PPT第 25 頁；課本 P98–100", "refs": [{"src": "potential", "cap": "教材來源圖"}], "legacyQuestion": 1, "kind": "drag", "slots": [{"id": "g0s0", "label": "靜止／維持", "group": 0}, {"id": "g0s1", "label": "靜止／維持", "group": 0}, {"id": "g1s0", "label": "去極化上升", "group": 1}, {"id": "g1s1", "label": "去極化上升", "group": 1}, {"id": "g2s0", "label": "再極化／過極化", "group": 2}, {"id": "g2s1", "label": "再極化／過極化", "group": 2}], "pieces": [{"id": "ag0s0", "label": "幫浦維持內高K⁺、外高Na⁺", "group": 0}, {"id": "ag0s1", "label": "膜對K⁺漏通道較通透", "group": 0}, {"id": "ag1s0", "label": "到達閾值啟動快速正回饋", "group": 1}, {"id": "ag1s1", "label": "Na⁺經電位敏感通道流入", "group": 1}, {"id": "ag2s0", "label": "Na⁺通道失活減少內流", "group": 2}, {"id": "ag2s1", "label": "K⁺外流使膜電位下降", "group": 2}], "sol": {"g0s0": "ag0s0", "g0s1": "ag0s1", "g1s0": "ag1s0", "g1s1": "ag1s1", "g2s0": "ag2s0", "g2s1": "ag2s1"}, "pre": {}, "id": "b3-c41-q01"}, {"t": "課本圖貼標籤：反射弧的神經元", "q": "依課本圖4–1，把標籤放回圖上的編號格：三類神經元、中樞、受器、動器與刺激、反應。", "learn": 1, "tag": "neuron", "hint": "感覺神經元把訊號由受器傳入中樞，運動神經元把中樞的指令傳到動器；中間由聯絡神經元連接。", "why": "刺激由受器接收，經感覺神經元傳入中樞神經系統，由聯絡神經元整合，再經運動神經元傳到動器，產生反應。", "sub": "課本 P96–98 圖4–1", "refs": [{"src": "mk_neu", "cap": "反射弧（標籤已遮蓋）"}], "kind": "drag", "mask": "mk_neu", "ar": 2.1378, "layout": "side", "slots": [{"id": "s0", "label": "感覺神經元", "group": 0, "x": 52.62, "y": 6.67, "v": false, "w": false}, {"id": "s1", "label": "運動神經元", "group": 1, "x": 52.62, "y": 94.67, "v": false, "w": false}, {"id": "s2", "label": "聯絡神經元", "group": 2, "x": 3.01, "y": 50.83, "v": true, "w": false}, {"id": "s3", "label": "中樞神經系統", "group": 3, "x": 21.15, "y": 50.67, "v": true, "w": false}, {"id": "s4", "label": "受器", "group": 4, "x": 85.5, "y": 6.67, "v": false, "w": false}, {"id": "s5", "label": "動器", "group": 5, "x": 85.5, "y": 94.56, "v": false, "w": false}, {"id": "s6", "label": "刺激", "group": 6, "x": 96.93, "y": 6.56, "v": false, "w": false}, {"id": "s7", "label": "反應", "group": 7, "x": 96.93, "y": 94.44, "v": false, "w": false}], "pieces": [{"id": "a0", "label": "感覺神經元", "group": 0}, {"id": "a1", "label": "運動神經元", "group": 1}, {"id": "a2", "label": "聯絡神經元", "group": 2}, {"id": "a3", "label": "中樞神經系統", "group": 3}, {"id": "a4", "label": "受器", "group": 4}, {"id": "a5", "label": "動器", "group": 5}, {"id": "a6", "label": "刺激", "group": 6}, {"id": "a7", "label": "反應", "group": 7}, {"id": "a8", "label": "傳入神經元", "group": 100}, {"id": "a9", "labe P107；回看對應圖解；自律神經為延伸"], "signal": ["傳導與突觸", "連結局部電流、髓鞘、Ca²⁺與整合。", "課本 P96–P107；回看對應圖解；自律神經為延伸"], "central": ["中樞與通路", "區分腦部功能、灰白質與神經路徑。", "課本 P96–P107；回看對應圖解；自律神經為延伸"], "extension": ["自律延伸", "分清神經支配、激素與例外。", "課本 P96–P107；回看對應圖解；自律神經為延伸"]}, "conceptMap": {"cell": 1, "potential": 6, "code": 12, "signal": 17, "central": 21, "extension": 30}, "pptText": {"1": "4-1 \n神經\n系統\n4\n-1.1 \n細胞膜電位\n4-1.3 \n神經元間的訊號傳遞\n4-1.\n4\n \n人體的神經系統\n4\n-1.2 \n動作\n電位", "2": "◆ 動物\n有四大\n組織\n：\n結締組織\n肌肉組織\n神經組織\n上皮組織\n4-1 \n神經\n系統\n配合課本 \nP10\n～\n14\n、\n96", "3": "◆\n 神經組織包含\n神經元\n與\n神經膠細胞\n4-1 \n神經\n系統\n配合課本 \nP13\n、\n96\n神經組織\n30\n \nµm\n神經元\n神經膠細胞 \n(\n只能看到細胞核\n)", "4": "神經元\n運動神經元\n感覺神經元\n4-1 \n神經\n系統\n◇\n \n聯絡\n神經元\n：\n可\n整合訊息，同時也是中樞神經系統中數量最多\n的神經元\n◇\n \n感覺\n神經元\n：\n將\n訊息由\n受器傳入中樞神經\n◇\n \n運動\n神經元\n：\n將\n中樞神經\n系統訊息傳\n往動器\n◆ \n種類\n：\n1\n.\n 依\n據\n訊息傳遞方向區分\n→ \n訊息\n傳遞方向\n樹突\n軸突\n細胞本體\n軸突\n細胞本體\n樹突\n配合課本 \nP96", "5": "神經訊息傳遞方向\n感覺神經元\n運動神經元\n聯絡神經元\n受器\n動器\n刺激\n反應\n中樞神經系統\n4-1 \n神經\n系統\n配合課本 \nP96\n、\n97", "6": "偽單極神經元\n多極神經元\n2.\n 依\n據\n突起的數目區分\n◇ \n多極神經元\n，例如\n：\n運動神經元\n◇ \n雙極神經元\n，\n例如\n：\n視網膜\n的視桿細胞、視錐細胞；鼻黏膜的嗅細胞\n◇ \n偽單極神經元\n，\n例如\n：\n脊髓\n背根神經節中的感覺神經元\n軸突\n細胞本體\n樹突\n樹突\n軸突\n細胞本體\n配合課本 \nP96\n6\n雙極神經元\n細胞本體\n樹突\n軸突\n4-1 \n神經\n系統\n補充", "7": "▪ 科學家認為所謂的生物電，其實就是物理學的電流，而生物細胞之間也能透過電訊號傳遞訊息\n神經元能產生並傳遞電訊號，而這類電訊號的研究和電學息息相關\n▪ 用銅鉤把蛙腿掛在鐵梁上時，蛙腿會不停抽動\n◇\n \n1786 \n年，\n義大利\n科學家\n賈法尼\n▪ 當時還無法確認是否為電流所致，故稱此現象為「生物電」\n◇ \n義大利\n物理學家\n伏打\n▪ 重複此實驗，發現將兩種金屬接觸時會產生電流，進而刺激蛙腿抽動\n4\n-1.1 \n細胞膜電位\n配合課本 \nP97", "8": "  \n知識補給站\n  \n賈\n法尼\n與\n伏打\n的科學論戰促成伏打電池的誕生\n       \n義大利\n科學家\n伏打\n對\n賈法尼\n提出的「生物電」理論有不同看法。他認為引起蛙腿抽動的原因是因為兩種不同金屬接觸到蛙腿所導致的電流作用。\n       為了驗證自己的想法，\n伏打\n使用相同材質的金屬重複\n賈法尼\n的實驗，結果發現蛙腿並未產生抽動反應。接著，他進一步以鹽水取代蛙腿作為導體，設計出一個能夠持續產生電流的化學裝置，這便是歷史上第一個電池──伏打電池。\n配合課本 \nP97\n8", "9": "▪ 透過儀器偵測，發現細胞膜內、外存在微小電位差，\n稱為\n\n膜\n電位\n4\n-1.1 \n細胞膜電位\n◇\n \n1840 \n年，\n義大利\n物理學家\n馬陶西\n▪ 用蛙的坐骨神經與肌肉進行實驗，證實神經與肌肉可產生並傳導電訊號\n◇\n \n19 \n世紀末，\n英國\n科學家\n華勒\n▪ 發現每次心跳都伴隨電流的流動\n◇\n \n20 \n世紀初\n▪\n \n英國\n科學家\n霍奇金\n與\n赫胥黎\n對膜電位變化的\n研究，使兩人於 \n1963 \ tion\n2\n. \n有關突觸的敘述，下列哪些正確\n？　\n(\nA)\n突觸指的是兩個可傳遞訊息神經元間的\n空隙　\n(\nB)\n突觸前神經元的軸突末梢不具任何胞器，僅負責釋出神經傳遞\n物　\n(\nC)\n運動終板也是一種突\n觸　\n(\nD)\n同一種神經傳遞物造成的生理現象必定\n相同　\n(\nE)\n若突觸後神經元接受訊息後的\n電\n\n位\n變化未達閾值，則訊息無法傳遞。\n解答\n：\n(\nC\n)(E)\n \n解析\n：\n(\nA)\n突觸是由突觸前神經元軸突末梢、突觸間隙以及突觸後神經元的樹突或細胞本體組成，突觸後亦可以是肌肉細胞。 \n(B)\n軸突末梢仍具有粒線體等胞器\n。\n\n(\nD)\n神經傳遞物的作用要視受器的種類而定，可能會因為受器不同而產生不同反應。\n58", "59": "  \nQuestion\n3. \n右圖為人體神經系統中神經元分布示意圖，下列敘述哪些正確\n？　\n(\nA)\n可引起神經衝動的閾值丙是丁的兩\n倍　\n(\nB)\n甲與乙皆可為丙細胞的突觸前\n神經元　\n(\nC)\n引發丙與丁產生神經衝動的膜電位\n相似　\n(\nD)\n鈉離子對於丁的細胞膜電位不具有\n影響力　\n(\nE)\n這種神經元的相互聯繫是中樞神經專有。 \n【107.\n指考\n】\n解答\n：\n(B\n)(\nC\n)\n \n59", "60": "  \nQuestion\n解析\n：\n(\nA)\n人類的神經元閾值電位約為－\n50 mV\n。 \n\n(\nD)\n鈉離子是細胞外主要的正電荷，對題圖中神經元細胞膜電位皆有影響。 \n(E)\n周圍神經亦有相互聯繫。\n60"}, "originalCount": 2, "legacyCount": 8, "originalPPTQuestions": {"1": {"page": 57, "answer": ["B"], "options": ["靜止膜電位表示膜電位為 0 mV 的狀態", "神經元維持在靜止膜電位的現象稱為極化", "僅神經元與肌肉細胞具有膜電位", "未受刺激時的神經元膜內電位較細胞膜外高"]}, "2": {"page": 58, "answer": ["C", "E"], "options": ["突觸指的是兩個可傳遞訊息神經元間的空隙", "突觸前神經元的軸突末梢不具任何胞器，僅負責釋出神經傳遞物", "運動終板也是一種突觸", "同一種神經傳遞物造成的生理現象必定相同", "若突觸後神經元接受訊息後的電位變化未達閾值，則訊息無法傳遞"], "scope": "原教材未觸發新動作電位模型；局部訊號仍可整合"}, "3": {"page": 59, "answer": ["B", "C"], "options": ["可引起神經衝動的閾值丙是丁的兩倍", "甲與乙皆可為丙細胞的突觸前神經元", "引發丙與丁產生神經衝動的膜電位相似", "鈉離子對於丁的細胞膜電位不具有影響力", "這種神經元的相互聯繫是中樞神經專有"]}}, "references": [{"title": "potential", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/12-4-the-action-potential"}, {"title": "synapse", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/12-5-communication-between-neurons"}, {"title": "tissue", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/12-2-nervous-tissue"}, {"title": "central", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/13-2-the-central-nervous-system"}, {"title": "autonomic", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/15-1-divisions-of-the-autonomic-nervous-system"}, {"title": "retina", "url": "https://openstax.org/books/

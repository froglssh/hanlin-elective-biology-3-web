const CONTENT={"pptText": {"1": "5-2 \n先天性免疫\n5-2.1 \n皮膜屏障\n5-2.2 \n吞噬作用與發炎反應\n病原體\n吞噬細胞", "2": "皮膜屏障\n第三道防線\n第一道防線\n第二道防線\n免疫反應\n後天性免疫\n先天\n性免疫\n非專一性防禦\n專一性防禦\n體液免疫\n細胞媒介免疫\n吞噬作用\n發炎反應\n化學\n物質（補\n體、干擾素\n等）\n自然殺手細胞\n5-2 \n先天性免疫\n第一道防線\n第二道防線\n皮膜屏障\n吞噬作用\n發炎反應\n先天\n性免疫\n非專一性防禦\n自然殺手細胞\n化學\n物質（補\n體、干擾素\n等）\n配合課本 \nP148", "3": "5-2.1 \n皮膜屏障\n◆ \n第一道防線\n◆ 包括\n皮膚\n與\n消化道\n、\n呼吸道\n及\n泌尿\n生殖道\n的\n黏膜\n物理性\n化學性\n生物\n性\n◆ 有\n三種防禦\n方式\n：\n皮膚\n黏膜\n配合課本 \nP149", "4": "5-2.1 \n皮膜屏障\n配合課本 \nP149\n、\n150\n物理性\n化學性\n生物\n性\n淚液\n流淚\n物\n具溶菌酶\n化\n具溶菌酶\n唾液\n化\n黏膜細胞分泌黏液\n物\n黏膜\n胃液\n具鹽酸與酵素\n化\n消化道\n具共生微生物\n生\n氣管\n纖毛柱狀上皮細胞纖毛擺動\n物\n表皮\n表皮為角質化的多層扁平上皮組織，可不斷增生及脫落\n物\n汗液\n共生微生物，可與病原體競爭，阻絕其增生繁殖\n生\n汗液中具溶菌酶\n化\n汗腺與共生菌分泌脂肪酸\n化", "5": "◆ \n第二道防線\n5-2.2 \n吞噬作用與發炎反應\n第二道防線\n吞噬作用\n發炎反應\n自然殺手細胞\n化學\n物質（補\n體、干擾素\n等）\n◆ \n包括\n：\n配合課本 \nP150", "6": "5-2.2 \n吞噬作用與發炎反應\n◆ \n人體中\n主要的\n吞噬細胞\n包括\n嗜中性球\n、\n巨噬細胞\n及\n樹突細胞\n◆ 若病原體突破皮膜屏障入侵體內，可能在感染部位會遭遇\n吞噬細胞\n的攻擊\n吞噬作用\n配合課本 \nP150\n嗜中性球\n4\n \nµm\n6\n \nµm\n巨噬細胞\n6\n \nµm\n15\n \nµm\n樹突細胞\n6\n \nµm\n10\n \nµm", "7": "5-2.2 \n吞噬作用與發炎反應\n吞噬作用\n配合課本 \nP151\n吞噬細胞以偽足包住病原體\n病原體被水解酶分解\n將病原體的碎片排出\n◆ \n過程\n：\n吞噬細胞\n病原體\n吞噬小體\n溶體\n水解酶\n細胞核", "8": "◆ 不同種類的吞噬細胞其主要功能\n不同\n：\n◇ \n嗜中性球\n◇ \n巨噬細胞\n▪ 數量最多\n▪ 最主要的清除者\n▪ 吞噬病原體後可啟動後天性免疫反應\n5-2.2 \n吞噬作用與發炎反應\n吞噬作用\n◇ 樹突細胞\n▪ 吞噬病原體後可啟動後天性免疫反應\n配合課本 \nP151", "9": "②\n5-2.2 \n吞噬作用與發炎反應\n某部位受傷\n引起該\n部位\n：\n▪\n \n微血管擴張，血流量增加\n▪\n \n微血管通透性增大，血漿滲出量增多\n產生紅、熱、腫、痛等現象，稱為發炎反應\n肥大\n細胞\n肥大細胞\n受\n刺激而釋放組織胺等發炎介質\n①\n①\n②\n病原體\n組織胺\n發炎反應\n配合課本 \nP152\n、\n153", "10": "5-2.2 \n吞噬作用與發炎反應\n發炎反應\n①\n②\n更多吞噬細胞到達受傷部位，進行吞噬作用\n③\n③\n發炎反應逐漸減緩\n，受傷組織進行修復\n④\n④\n病原體\n組織胺\n肥大\n細胞\n配合課本 \nP152\n、\n153", "11": "5-2.2 \n吞噬作用與發炎反應\n發炎反應\n◆ 體溫調節\n◇ 負回饋機制\n◇ \n內分泌腺、骨骼肌、皮膚血管及汗腺\n→\n 調整人體的產熱和散熱過程，使體溫保持在相對恆定的水準\n配合課本 \nP152", "12": "▪ 降低某些病原體的感染能力及增殖能力\n◆ 發燒\n◇ 是人體全身性發炎反應所造成的現象之一\n◇ 是對抗感染的保護性生理反應\n▪ \n可\n提高免疫系統的免疫反應能力\n→ \n促使免疫細胞通過血管到達感染部位，使其能更快速參與發炎反應對抗病原體\n→ \n例如\n：\n脊髓\n灰質炎病毒在受熱時增殖能力下降\n5-2.2 \n吞噬作用與發炎反應\n發炎反應\n配合課本 \nP152", "13": "◇ 當體溫過高（\n超過 \n40.5 °C\n）\n時，可能會威脅體內重要蛋白質的結構和功能，進而威脅生命\n◇\n \n機制\n：\n▪ \n病毒或細菌感染時\n病原體分泌物質與發炎介質刺激下視丘\n5-2.2 \n吞噬作用與發炎反應\n發炎反應\n▪ 正常狀態\n下\n：\n下\n視丘的體溫調節中樞，使體溫維持在一定的範圍內\n使下視丘原本的設定點偏移上升\n超過 \n38 °C\n使\n病患在發燒狀態下仍會發抖或覺得冷\n促使體內反應仍朝產熱的方向進行\n體溫持續上升\n配合課本 \nP152", "14": "  \n知識補給站\n干擾素\n◆ 是\n一群抗病毒蛋白\n◆ \n由被病毒感染的細胞所釋放\n◆ \n啟動\n抗\n病毒\n機制（下頁圖）\n配合課本 \nP154\n14", "15": "  \n知識補給站\n干擾素\n配合課本 \nP154\n15\n免疫細胞\n未感染細胞\n被病毒感染的細胞\n干擾素\n已感染細胞\n干擾素\n干擾素\n細胞凋亡\n促使未感染細胞啟動抗病毒蛋白基因表現\n活化巨噬細胞、自然殺手細胞等免疫細胞\n干擾素\n病毒\n分泌干擾素\n擴散到周圍組織\n轉錄\n轉譯\nDNA\n抗\n病毒\n\n蛋白\n基因\nmRNA\n抗病毒蛋白", "16": "  \n知識補給站\n干擾素\n◆ 目前已利用來自人類的干擾素基因，經基因轉殖細菌大量生產，用來治療某些病毒感染的疾病，\n如 \nB \n型肝炎\n及 \nC \n型肝炎\n◆ 同種動物產生的干擾素對病毒沒有專一性\n配合課本 \nP154\n16", "17": "  \n知識補給站\n補體\n◆ 活化後的補體能引起一連串的反應而活化更多的補體，擴大補體的防禦作用（\n下頁圖\n）\n◆ 包括約 \n20 \n種的血漿蛋白\n◆ \n由肝臟合成\n◆ 平常以未活化的型式在血液中流動\n◇ 可由抗原與抗體結合而成的免疫複合物活化\n◆ \n活化\n：\n◇ 由某些特殊病原體直接活化\n配合課本 \nP154\n17", "18": "  \n知識補給站\n補體\n配合課本 \nP154\n18\n調理作用\n補體\n病原體\n溶解作用\n趨化作用\n病原體\n補體\n補體\n病原體\n補體受體\n吞噬細胞\n插入病原體細胞膜，造成病原體細胞膜穿孔並瓦解\n補體黏附在病原體上，與吞噬細胞的受體連接並促進吞噬作用\n吸引吞噬細胞移動到發炎部位，並擴大發炎反應\n補體\n發炎介質\n補體的功能", "19": "  \nQuestion\n1. \n下列何者屬於先天性免疫中的皮膜屏障\n？　\n(\nA)\n皮膜組織損傷時釋放\n組織胺　\n(\nB)\n皮膜組織下方的吞噬細胞進行吞噬\n作用　\n(\nC)\n樹突細胞吞噬病原體後傳遞訊息給\n淋巴球　\n(\nD)\n胃液中的鹽酸與酵素破壞病原體。\n解答\n：\n(\nD)\n解析\n：\n(\nA)(B)\n皮膜屏障為防禦的第一道防線，而發炎反應與吞噬作用屬於第二道防線\n。\n(\nC)\n樹突細胞吞噬病原體後，可傳遞訊息活化後天性免疫。\n19", "20": "  \nQuestion\n2\n. \n有關發炎反應的敘述，下列何者正確\n？　\n(\nA)\n發炎反應是一種細胞的病態反應，對生理有害\n無益　\n(\nB)\n發炎部位的微血管通透性會增加，使吞噬細胞更容易到達受傷\n部位　\n(\nC)\n病原體會釋放組織胺，造成感染部位\n發炎　\n(\nD)\n組織胺是唯一的發炎介質，故使用抗組織胺類的藥物就可以完全消除發炎現象。\n解答\n：\n(\nB)\n解\n析\n：\n(\nA)\n發炎反應可以提高發炎部位的免疫反應，利用免疫細胞對抗可能的感染\n。\n(\nC)\n受傷的組織會釋放組織胺，造成發炎反應\n。\n(\nD)\n組織胺只是其中一種發炎介質。\n20", "21": "  \nQuestion\n3. \n下列有關人體防禦作用第二道防線的敘述，哪些正確\n？　\n \n(A)\n數量最多的吞噬細胞為嗜中性\n球　\n(\nB)\n吞噬細胞將病原體吞入後，主要依賴溶體將之\n分解　\n(\nC)\n唾液、淚液中具有溶菌酶，可殺死\n病原體　\n(\nD)\n發燒是發炎反應造成的生理現象之\n一　\n(\nE)\n體液免疫與細胞媒介免疫可辨認特定病原體而活化。\n解答\n：\n(\nA\n)(B)(D)\n解析\n：\n(\nC)\n唾液、淚液中具有溶菌酶，屬於第一道防線的皮膜屏障\n。\n(\nE)\n體液免疫與細胞媒介免疫屬於第三道防線。\n21"}, "lessons": [{"id": "b3-c52-l01", "t": "第一與第二道：同屬先天，任務不同", "sec": "s1", "slide": 1, "sourceSlides": [1, 2], "sourcePages": [1], "src": "原PPT第 1–2 頁；課本 P149–150", "figSpec": {"image": "PPT02S3"}, "txt": "<ul><li>第一道皮膜屏障在入侵之前或入侵入口降低病原通過。</li><li>第二道包括吞噬、發炎、NK及補體、干擾素等；不是所有防禦都必須由皮膚外面開始。</li><li>第三道為後天的體液與細胞媒介免疫；各道可以重疊啟動並合作。</li></ul><p class=\"think\">一個病原被胃液破壞，和被巨噬細胞吞入，是同一層次的防禦嗎？</p><div class=\"ex\"><h4>先天性免疫的範圍</h4><p>先天性免疫包括<b>第一道防線</b>的皮膜屏障，以及<b>第二道防線</b>的吞噬作用、發炎反應與自然殺手細胞等作用。屬於非專一性防禦，能在病原體入侵初期迅速反應。</p></div><div class=\"ex\"><h4>本節兩段</h4><ul><li>5-2.1 皮膜屏障（第一道）</li><li>5-2.2 吞噬作用與發炎反應（第二道）</li></ul></div><div class=\"ex\"><h4>怎麼分</h4><p>第一道是「擋在外面」；第二道是「已經進入體內後的細胞與分子反應」。兩者同屬先天，任務不同。</p></div><div class=\"ex\"><h4>深入解說：先天免疫的兩段</h4><p>先天性免疫＝<b>與生俱來、非專一性、反應迅速</b>。第一道：在病原進入體內<b>之前或入口處</b>擋住（皮膚、黏膜、分泌物、常在菌）。第二道：病原已突破後，由細胞（吞噬細胞、NK）與分子（補體、干擾素）處理，並引起發炎。判斷時看「<b>病原在哪裡被處理</b>」：還在外界或管腔就是第一道，已進入組織液、血液就是第二道。</p></div><div class=\"ex\"><h4>快速分類</h4><ul><li>胃液殺菌 → 第一道（化學性）。</li><li>巨噬細胞吞噬 → 第二道。</li><li>抗體中和 → 第三道（後天）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>病原被胃液破壞與被巨噬細胞吞入，同一層次嗎？</p><p><b>答：</b>不同。胃腔與外界相通，胃液屬第一道（化學性屏障）；巨噬細胞在組織中處理已入侵的病原，屬第二道。</p></div>", "tb": [["BOOK1", "P149 完整課本頁"]]}, {"id": "b3-c52-l02", "t": "皮膚與黏膜：身體邊界不只在外表", "sec": "s1", "slide": 3, "sourceSlides": [3], "sourcePages": [], "src": "原PPT第 3 頁；課本 P149–150", "figSpec": {"image": "PPT03S3"}, "txt": "<ul><li>皮膚與消化、呼吸、泌尿生殖等管道的黏膜，構成對外環境的屏障。</li><li>管腔雖位於體內，仍可與外界相通；要區分身體位置與組織內部。</li><li>教材分物理性、化學性、生物性三方式；同一部位可同時具多種。</li></ul><p class=\"think\">胃腔在腹部裡，為何胃液防禦仍歸第一道？</p><div class=\"scope-note\">不同黏膜的上皮構造不同；不把所有黏膜都說成角質化複層上皮，或同一種柱狀上皮。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK27105/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>皮膜屏障</h4><p>人體皮膚與外界接觸；消化道、呼吸道、泌尿生殖道的管腔黏膜也與外界接觸，因此皮膜屏障是防堵病原體入侵的<b>第一道防線</b>。</p></div><div class=\"ex\"><h4>防禦方式分三類（圖 5－4）</h4><ul><li><b>物理性</b></li><li><b>化學性</b></li><li><b>生物性</b></li></ul></div><div class=\"ex\"><h4>小提醒</h4><p>皮膜屏障包含「皮膚」與「黏膜」，邊界不只在體表。</p></div><div class=\"ex\"><h4>深入解說：身體的「外面」包含管腔</h4><p>消化道、呼吸道、泌尿生殖道的內腔，雖然在身體裡面，卻與外界相通，管腔壁的黏膜才是真正的「邊界」。皮膚的表皮為角質化複層扁平上皮；呼吸道為有纖毛的柱狀上皮；食道為不角質化的複層扁平上皮，不同部位的構造配合各自的功能。</p></div><div class=\"ex\"><h4>三種防禦方式</h4><ul><li>物理性：阻隔、黏住、移走。</li><li>化學性：酸、酵素、脂肪酸。</li><li>生物性：常在菌競爭。</li><li>同一部位可同時有多種防禦。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>為什麼胃液防禦仍屬第一道？</p><p><b>答：</b>胃腔與外界相通，胃液在病原進入組織之前破壞它，所以屬皮膜屏障。</p></div>", "tb": []}, {"id": "b3-c52-l03", "t": "物理性：阻隔、黏住與移走", "sec": "s1", "slide": 4, "sourceSlides": [4], "sourcePages": [], "src": "原PPT第 4 頁；課本 P149–150", "figSpec": {"image": "PPT04S3"}, "txt": "<ul><li>皮膚角質化上皮及脫落提供阻隔、移除的作用。</li><li>黏液捕捉顆粒，氣管纖毛幫助移動黏液；不把纖毛當成殺菌酵素。</li><li>淚液流動可沖走顆粒；它同時含溶菌酶，亦有化學性作用。</li></ul><p class=\"think\">同樣是淚液，如何用作用機制區分物理性與化學性？</p><div class=\"ex\"><h4>物理性：阻隔、黏住、移走</h4><p></p></div><div class=\"ex\"><h4>例子</h4><ul><li>皮膚表皮是<b>角質化的多層扁平上皮組織</b>，不斷增生並脫落。</li><li>有些黏膜不角質化，但分泌<b>黏液</b>保護（如氣管、腸胃道）。</li><li>氣管黏膜的<b>纖毛柱狀上皮細胞</b>，用纖毛擺動把入侵物向外排出。</li></ul></div><div class=\"ex\"><h4>深入解說：物理性防禦</h4><p>皮膚表層是死亡的角質化細胞，不斷脫落，帶走附著的微生物；氣管黏膜的杯狀細胞分泌<b>黏液</b>黏住灰塵與細菌，纖毛柱狀上皮的纖毛向上擺動，把黏液送到咽部咳出或吞下；淚液、尿液的流動也能沖刷。吸菸會損傷纖毛，削弱這道防線。</p></div><div class=\"ex\"><h4>淚液的雙重角色</h4><ul><li>沖走顆粒：物理性。</li><li>含溶菌酶：化學性。</li><li>同一種分泌物可歸入不同分類，要看討論的作用。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>吸菸者為何易有呼吸道感染？</p><p><b>答：</b>菸害破壞氣管纖毛，黏液與病原不易被清除，使物理性防禦下降。</p></div>", "tb": []}, {"id": "b3-c52-l04", "t": "化學性：辨清溶菌酶的標的", "sec": "s1", "slide": 4, "sourceSlides": [4], "sourcePages": [], "src": "原PPT第 4 頁；課本 P149–150", "figSpec": {"image": "PPT04S3"}, "txt": "<ul><li>淚液、唾液等分泌物中的溶菌酶可破壞某些細菌的細胞壁。</li><li>胃液鹽酸與酵素提供化學防禦；汗液及脂肪酸也可形成不利微生物的環境。</li><li>溶菌酶的典型標的是肽聚醣，不能把它說成專門分解磷脂雙層的酵素。</li></ul><p class=\"think\">有溶菌酶的分泌物，是否因此能保證消滅任何病原？</p><div class=\"scope-note\">細菌外層構造與敏感性不同；「有殺菌作用」不等於對所有病原皆完全有效。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK27105/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>化學性</h4><p>利用分泌物的化學性質殺死或抑制病原體。</p></div><div class=\"ex\"><h4>例子</h4><ul><li>皮膚表面有汗腺與共生菌分泌的脂肪酸，常呈<b>弱酸性</b>，抑制細菌繁殖。</li><li>淚液、唾液、汗液等分泌物含<b>溶菌酶</b>。</li><li>胃液中的<b>鹽酸與酵素</b>。</li></ul></div><div class=\"ex\"><h4>溶菌酶的標的</h4><p>溶菌酶作用於細菌細胞壁，是第一道防線的化學屏障；要記得是「分泌物」中的酵素，不是吞噬細胞的水解酶。</p></div><div class=\"ex\"><h4>深入解說：化學防線</h4><p>皮膚的脂肪酸與汗液使表面呈弱酸性（pH 約 4–6），抑制多數細菌；胃液鹽酸（pH 1.5–3.5）與蛋白酶能殺死多數隨食物進入的微生物；淚液、唾液、汗液中的<b>溶菌酶</b>水解細菌細胞壁的肽聚醣，使菌體破裂。溶菌酶對革蘭氏陽性菌較有效，對外有外膜的陰性菌效果較弱。</p></div><div class=\"ex\"><h4>別混淆</h4><ul><li>溶菌酶：分泌物中的酵素，標的是細菌細胞壁。</li><li>溶體內的水解酶：吞噬細胞內分解病原。</li><li>兩者都是酵素，但位置與用途不同。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>有溶菌酶的分泌物能保證消滅所有病原嗎？</p><p><b>答：</b>不能。溶菌酶只對某些細菌的細胞壁有效，對病毒、真菌或有外膜的細菌效果有限。</p></div>", "tb": []}, {"id": "b3-c52-l05", "t": "生物性：常在菌的競爭作用", "sec": "s1", "slide": 4, "sourceSlides": [4], "sourcePages": [], "src": "原PPT第 4 頁；課本 P149–150", "figSpec": {"image": "PPT04S3"}, "txt": "<ul><li>皮膚、腸道常在菌可競爭空間與養分，降低某些病原定殖。</li><li>常在菌產生的脂肪酸是化學效應；常在菌與病原競爭則是生物性效應。</li><li>分類看所描述的機制，不只看參與者是不是生物。</li></ul><p class=\"think\">「常在菌」這個主詞，能否讓它的所有作用都只能歸生物性？</p><div class=\"ex\"><h4>生物性</h4><p>體表與消化道等部位存在<b>共生微生物</b>（常在菌）。</p></div><div class=\"ex\"><h4>作用</h4><p>病原體一般難以與共生微生物競爭，因此共生微生物能阻絕病原體增生繁殖，這是一種<b>競爭作用</b>。</p></div><div class=\"ex\"><h4>延伸</h4><p>濫用抗生素可能殺死共生菌，削弱這道生物性防線。</p></div><div class=\"ex\"><h4>深入解說：常在菌的競爭</h4><p>皮膚、口腔、腸道、陰道有大量常在菌（共生菌）。它們與病原競爭<b>養分與附著位置</b>，也可產生酸或抗菌物質。若抗生素破壞了腸道菌群，艱難梭菌等病原更易增殖，造成腹瀉。所以：競爭佔據空間＝生物性；產生脂肪酸＝化學性。</p></div><div class=\"ex\"><h4>歸類原則</h4><ul><li>看作用機制，而不是看主角是不是生物。</li><li>競爭空間與養分：生物性。</li><li>分泌酸性物質：化學性。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>濫用抗生素有什麼免疫上的風險？</p><p><b>答：</b>殺死常在菌，削弱生物性防線，並可能篩選出抗藥性病原。</p></div>", "tb": []}, {"id": "b3-c52-l06", "t": "第二道防線：細胞與分子共同守備", "sec": "s2", "slide": 5, "sourceSlides": [5], "sourcePages": [2], "src": "原PPT第 5 頁；課本 P150–151", "figSpec": {"image": "PPT05S3"}, "txt": "<ul><li>吞噬細胞可在組織及循環中參與清除。</li><li>發炎有助招募細胞與分子到局部；NK主要破壞部分受感染或異常宿主細胞。</li><li>補體與干擾素作用方式不同，不是所有化學物質都直接吞噬病原。</li></ul><p class=\"think\">清除病原體、破壞受感染細胞與發送訊號，為何要分開？</p><div class=\"ex\"><h4>第二道防線</h4><p>病原體突破皮膜屏障後，在感染部位會遇到第二道防線。</p></div><div class=\"ex\"><h4>包括</h4><ul><li><b>吞噬作用</b>（吞噬細胞）</li><li><b>發炎反應</b></li><li><b>自然殺手細胞</b></li><li><b>化學物質</b>：補體、干擾素等</li></ul></div><div class=\"ex\"><h4>特色</h4><p>細胞與分子共同守備；都屬非專一性防禦。</p></div><div class=\"ex\"><h4>深入解說：第二道防線的成員</h4><p>① <b>吞噬細胞</b>：吞噬並消化；② <b>發炎反應</b>：血管變化招募細胞、分子；③ <b>NK 細胞</b>：殺死受感染或異常的宿主細胞；④ <b>化學物質</b>：補體（標記、溶解、趨化）、干擾素（通知鄰近細胞抗病毒）。分別對付不同標的：病原體本身、受感染的宿主細胞、病毒擴散。</p></div><div class=\"ex\"><h4>任務分工</h4><ul><li>清除病原體：吞噬細胞、補體。</li><li>破壞被感染細胞：NK、干擾素誘導凋亡。</li><li>發送訊號：干擾素、發炎介質。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>為何要區分「清除病原」「破壞受感染細胞」「發送訊號」？</p><p><b>答：</b>三種任務的對象與機制不同，區分清楚才能判斷某個細胞或分子在防禦中的實際角色。</p></div>", "tb": [["BOOK2", "P150 完整課本頁"]]}, {"id": "b3-c52-l07", "t": "三類吞噬細胞：讀照片也讀尺度", "sec": "s2", "slide": 6, "sourceSlides": [6], "sourcePages": [], "src": "原PPT第 6 頁；課本 P150–151", "figSpec": {"image": "phagocytes"}, "txt": "<ul><li>嗜中性球、巨噬細胞、樹突細胞都可吞噬，但功能分工不完全相同。</li><li>原圖上排為電腦套色的電子顯微照片，下排為光學顯微照片。</li><li>上排尺度線依序4、6、6 μm；下排依序6、15、10 μm。</li><li>上排a、b圖橘紅顆粒為病原體；套色不能當作細胞天然顏色。</li></ul><p class=\"think\">版面上兩張照片差不多大，能否因此判定細胞實際一樣大？</p><div class=\"ex\"><h4>三種主要的吞噬細胞（圖 5－5）</h4><p><b>嗜中性球、巨噬細胞、樹突細胞</b>。</p></div><div class=\"ex\"><h4>讀照片的方法</h4><p>圖上方是電子顯微照片，下方是光學顯微照片；電子顯微照片是電腦套色，不是真正的顏色。要看清楚尺度（比例尺）與細胞形態。</p></div><div class=\"ex\"><h4>深入解說：三種吞噬細胞</h4><p><b>嗜中性球</b>：血中最多，核分葉，壽命短，最先抵達感染處；<b>巨噬細胞</b>：由單核球進入組織分化，大型、壽命長，清除病原與死亡細胞；<b>樹突細胞</b>：有樹枝狀突起，吞噬後攜帶抗原至淋巴結，是最強的抗原呈現細胞。電子顯微照片是掃描／穿透電鏡影像，顏色為人工上色。</p></div><div class=\"ex\"><h4>讀圖要點</h4><ul><li>先找比例尺（μm）。</li><li>電子顯微照片：套色，非真實顏色。</li><li>光學顯微照片：經染色，與真實顏色不同。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>兩張照片印得差不多大，細胞實際就一樣大嗎？</p><p><b>答：</b>不一定。需看各自比例尺（4 μm、6 μm、15 μm 等），放大倍率不同。</p></div>", "tb": []}, {"id": "b3-c52-l08", "t": "吞噬流程：攝入、分解、排出", "sec": "s2", "slide": 7, "sourceSlides": [7], "sourcePages": [3], "src": "原PPT第 7 頁；課本 P150–151", "figSpec": {"image": "phagocytosis"}, "txt": "<ul><li>教材三個編號：偽足包住病原體、病原體被水解酶分解、碎片排出。</li><li>攝入形成吞噬小體，再與溶體作用，使水解酶參與分解。</li><li>偽足負責包圍與攝入；溶體的水解酶負責消化，不能互換。</li><li>核只是圖中構造標示，並非吞噬小體或主要消化場所。</li></ul><p class=\"think\">若能包住病原體但無法分解，最需要再檢查哪一段機制？</p><div class=\"ex\"><h4>吞噬作用（圖 5－6）</h4><p>吞噬細胞以<b>偽足包住病原體</b>並吞入細胞內。</p></div><div class=\"ex\"><h4>流程</h4><ul><li>偽足包住病原體，形成<b>吞噬小體</b>。</li><li>吞噬小體與<b>溶體</b>結合，溶體內的<b>水解酶</b>將病原體分解。</li><li>把病原體的碎片排出細胞。</li></ul></div><div class=\"ex\"><h4>作用</h4><p>有助於清除感染初期的病原體。</p></div><div class=\"ex\"><h4>深入解說：吞噬四步驟</h4><p>① 辨識與黏附（受體認出病原表面分子，或補體／抗體標記）；② <b>偽足</b>延伸包住病原，膜融合形成<b>吞噬小體</b>；③ 吞噬小體與<b>溶體</b>融合，水解酶與活性氧分解病原；④ 無法利用的碎片經胞吐排出（或留下抗原片段呈現給 T 細胞）。偽足管「攝入」，溶體管「消化」。</p></div><div class=\"ex\"><h4>可能的失敗點</h4><ul><li>不能包住：偽足／骨架異常。</li><li>包住了卻不能分解：溶體功能或水解酶缺陷。</li><li>某些病原（如結核菌）能阻止吞噬小體與溶體融合。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>若吞噬細胞包住病原卻不能分解，最需檢查哪一段？</p><p><b>答：</b>吞噬小體與溶體的融合及溶體內水解酶的活性（消化段）。</p></div>", "tb": [["BOOK3", "P151 完整課本頁"]]}, {"id": "b3-c52-l09", "t": "清除與訊息：不同吞噬者的分工", "sec": "s2", "slide": 8, "sourceSlides": [8], "sourcePages": [], "src": "原PPT第 8 頁；課本 P150–151", "figSpec": {"image": "phagocytes"}, "txt": "<ul><li>嗜中性球是成人周邊血白血球中常見、數量最多的一群。</li><li>巨噬細胞是重要清除者，可吞噬病原及細胞碎片。</li><li>巨噬與樹突細胞可提供連接後天免疫的訊息；樹突細胞是活化初始T細胞的重要橋梁。</li></ul><p class=\"think\">「都會吞噬」是否等於「啟動後天免疫的作用完全一樣」？</p><div class=\"scope-note\">教材的數量比較應保留血液與一般成人情境；不推成每個組織或每種狀態都由嗜中性球最多。</div><div class=\"ex\"><h4>不同吞噬細胞的主要功能</h4><p></p></div><div class=\"ex\"><h4>分工</h4><ul><li><b>嗜中性球</b>：人體內<b>數量最多</b>的吞噬細胞，可進行吞噬作用。</li><li><b>巨噬細胞</b>：最主要的清除者，可吞噬病原體、有害物質、損傷的細胞或壞死組織。</li><li><b>巨噬細胞與樹突細胞</b>：吞噬病原體後，還能<b>啟動後天性免疫反應</b>。</li></ul></div><div class=\"ex\"><h4>清除與訊息</h4><p>有些吞噬細胞的工作是「清除」，有些還兼具「傳遞訊息」給後天性免疫的功能。</p></div><div class=\"ex\"><h4>深入解說：清除者與訊息傳遞者</h4><p><b>嗜中性球</b>是血中數量最多的白血球，像「第一批士兵」，吞噬後多半死亡形成膿。<b>巨噬細胞</b>像「清道夫」，清除病原、碎片、衰老細胞。<b>樹突細胞與巨噬細胞</b>還能把抗原呈現給 T 細胞，啟動後天免疫，其中樹突細胞對活化「初始」T 細胞特別重要。</p></div><div class=\"ex\"><h4>功能比較</h4><ul><li>嗜中性球：數量最多，快速抵達。</li><li>巨噬細胞：清除為主，兼呈現抗原。</li><li>樹突細胞：呈現抗原為主。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>「都會吞噬」是否代表啟動後天免疫的能力相同？</p><p><b>答：</b>不同。樹突細胞啟動初始 T 細胞最有效，嗜中性球則主要負責清除。</p></div>", "tb": []}, {"id": "b3-c52-l10", "t": "發炎起點：損傷、介質與局部反應", "sec": "s3", "slide": 9, "sourceSlides": [9], "sourcePages": [4], "src": "原PPT第 9 頁；課本 P152–153", "figSpec": {"image": "inflammation"}, "txt": "<ul><li>損傷與病原刺激可引起局部反應，肥大細胞等釋出組織胺與其他介質。</li><li>組織胺不是由病原體專門製造來啟動此教材模型的物質。</li><li>發炎能協助防禦與修復，也可能在過強或持續時傷害組織。</li><li>沒有病原的組織損傷亦可引起發炎；發炎本身不能證明感染。</li></ul><p class=\"think\">只看到紅腫，能否斷定一定有活病原？</p><div class=\"scope-note\">原模型以感染創傷說明；無菌性發炎是適用範圍的補充。<a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC4315152/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>發炎的起點</h4><p>皮膚受傷產生傷口，病原體可由傷口入侵，引發<b>局部發炎反應</b>。</p></div><div class=\"ex\"><h4>過程（圖 5－7）</h4><ul><li>受傷組織中的<b>肥大細胞</b>被刺激，釋放<b>組織胺</b>等發炎介質。</li><li>發炎介質使附近微血管<b>擴張</b>，血流量增加。</li><li>微血管<b>通透性增大</b>，血漿滲出量增多。</li></ul></div><div class=\"ex\"><h4>結果</h4><p>產生紅、熱、腫、痛，稱為發炎反應。</p></div><div class=\"ex\"><h4>深入解說：發炎的第一步</h4><p>皮膚受傷、病原入侵時，組織中的<b>肥大細胞</b>被刺激而脫顆粒，釋出<b>組織胺</b>等介質；受損細胞也釋出前列腺素、緩激肽等，一起作用於附近的微血管：① 擴張；② 內皮細胞間隙變大，通透性升高。</p></div><div class=\"ex\"><h4>發炎的意義</h4><ul><li>招募細胞與分子到局部。</li><li>限制病原擴散。</li><li>啟動組織修復。</li><li>過強或持續（慢性發炎）可能傷害組織。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>只看到紅腫，能斷定有活病原嗎？</p><p><b>答：</b>不能。無菌性損傷（如扭傷、燙傷）同樣會發炎；需結合其他證據判斷是否感染。</p></div>", "tb": [["BOOK4", "P152 完整課本頁"]]}, {"id": "b3-c52-l11", "t": "紅、熱、腫、痛：追到不同機制", "sec": "s3", "slide": 9, "sourceSlides": [9], "sourcePages": [], "src": "原PPT第 9 頁；課本 P152–153", "figSpec": {"image": "inflammation"}, "txt": "<ul><li>局部血管擴張、血流增加，可造成紅與熱。</li><li>血管通透性增加，血漿成分進入組織，有助形成腫脹。</li><li>疼痛與多種介質及組織壓力有關，不只一個組織胺開關。</li><li>血漿滲出與白血球離開血管是相關但不同的過程。</li></ul><p class=\"think\">如果只把通透性變大用來解釋全部四種徵兆，漏掉了什麼？</p><div class=\"scope-note\">白血球游出涉及黏附、穿越及化學引導；不把它描繪成所有白血球隨血漿被動漏出。疼痛亦涉及前列腺素、緩激肽等介質。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK537187/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>四個現象對應的機制</h4><p></p></div><div class=\"ex\"><h4>追原因</h4><ul><li><b>紅、熱</b>：微血管擴張、血流量增加。</li><li><b>腫</b>：微血管通透性增大，血漿滲出到組織間。</li><li><b>痛</b>：與發炎介質及組織腫脹等刺激有關。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>組織胺是其中一種發炎介質，不是唯一的介質；發炎也不是只有壞處。</p></div><div class=\"ex\"><h4>深入解說：四徵兆的機制</h4><p><b>紅、熱</b>：微血管擴張，血流量增加，局部血液多且溫度較高；<b>腫</b>：通透性增加，血漿蛋白與液體滲出到組織間隙；<b>痛</b>：緩激肽、前列腺素等介質刺激痛覺受器，腫脹壓迫也使人疼痛。白血球離開血管則需黏附、穿越內皮、受化學物質引導，並不是被動隨血漿漏出。</p></div><div class=\"ex\"><h4>對照</h4><ul><li>紅熱 ← 血管擴張。</li><li>腫 ← 通透性增加。</li><li>痛 ← 介質＋壓力。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>若只用「通透性變大」解釋四徵兆，漏掉了什麼？</p><p><b>答：</b>漏掉血管擴張（解釋紅與熱）與疼痛介質（解釋痛）。</p></div>", "tb": []}, {"id": "b3-c52-l12", "t": "招募與修復：把四個編號連起來", "sec": "s3", "slide": 10, "sourceSlides": [10], "sourcePages": [5], "src": "原PPT第 10 頁；課本 P152–153", "figSpec": {"image": "inflammation"}, "txt": "<ul><li>原圖1：介質釋出及局部血管反應。</li><li>原圖2：血漿與更多防禦細胞來到組織；原圖3：吞噬與清除。</li><li>原圖4：清除後反應逐漸減弱，組織修復。</li><li>免疫反應不是只看有沒有變強，也要看何時與如何收束。</li></ul><p class=\"think\">圖中離開血管的箭頭，和傷口修復的箭頭，代表相同階段嗎？</p><div class=\"ex g\"><h4>圖 5－7 四個編號</h4><p>把四個步驟連起來讀。</p></div><div class=\"ex\"><h4>步驟</h4><ul><li>① 皮膚被刺傷，病原體突破皮膜屏障；肥大細胞釋出發炎介質（如組織胺）。</li><li>② 發炎介質引起微血管擴張與通透性增加，造成局部紅腫，並促進吞噬細胞向受傷部位移動。</li><li>③ 更多吞噬細胞到達，進行吞噬作用。</li><li>④ 病原體被清除後，發炎反應減緩，傷口逐漸修復。</li></ul></div><div class=\"ex\"><h4>深入解說：發炎的時間軸</h4><p>① 介質釋出、血管變化；② 血漿與嗜中性球、單核球（後成巨噬細胞）離開血管進入組織；③ 吞噬與清除病原、壞死組織；④ 病原清除後，介質被降解，發炎消退，纖維母細胞等參與組織修復。發炎要有「<b>啟動</b>」也要有「<b>收束</b>」，收束失敗會變成慢性發炎。</p></div><div class=\"ex\"><h4>順序別弄錯</h4><ul><li>先有介質釋出。</li><li>然後血管擴張、通透性增加。</li><li>之後細胞到達並吞噬。</li><li>最後消退與修復。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>圖中離開血管的箭頭與修復箭頭，是同一階段嗎？</p><p><b>答：</b>不是。前者是第 2–3 階段（招募與清除）；後者是第 4 階段（消退與修復）。</p></div>", "tb": [["BOOK5", "P153 完整課本頁"]]}, {"id": "b3-c52-l13", "t": "體溫恆定：回授維持設定範圍", "sec": "s3", "slide": 11, "sourceSlides": [11], "sourcePages": [], "src": "原PPT第 11 頁；課本 P152–153", "figSpec": {"image": "PPT11S3"}, "txt": "<ul><li>內分泌、代謝、皮膚血管與汗腺等共同調節產熱與散熱。</li><li>負回授會使偏離正常範圍的體溫受到調節。</li><li>比較發燒之前，要先區分當下體溫與調節系統的設定點。</li></ul><p class=\"think\">同樣體溫37°C，若設定點改變，調節方向是否相同？</p><div class=\"ex\"><h4>體溫調節</h4><p>人體以<b>負回饋機制</b>進行體溫調節，藉由內分泌腺、骨骼肌、皮膚血管及汗腺等組織器官活動的改變，調整產熱與散熱，使體溫保持在相對恆定的水準。</p></div><div class=\"ex\"><h4>調節中樞</h4><p>正常狀態下，由位於<b>下視丘</b>的體溫調節中樞調節，把體溫維持在一定範圍。</p></div><div class=\"ex\"><h4>深入解說：下視丘＝體溫的恆溫器</h4><p>體溫上升 → 皮膚血管擴張、汗腺出汗 → 散熱；體溫下降 → 皮膚血管收縮、骨骼肌顫抖、甲狀腺素與腎上腺素增加 → 產熱。感測器（皮膚與下視丘的溫度受器）→ 比較器（下視丘）→ 效應器（血管、汗腺、骨骼肌、內分泌腺），典型的負回饋。</p></div><div class=\"ex\"><h4>設定點與實際值</h4><ul><li>設定點：下視丘「想維持」的溫度（約 37 °C）。</li><li>實際值：此刻的體溫。</li><li>調節方向由「實際值 − 設定點」決定。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>體溫 37 °C 但設定點被調到 39 °C，身體會怎樣？</p><p><b>答：</b>實際值低於設定點，身體會增加產熱、減少散熱（發冷、顫抖），直到體溫升高。</p></div>", "tb": []}, {"id": "b3-c52-l14", "t": "發燒效應：防禦價值與限制", "sec": "s3", "slide": 12, "sourceSlides": [12], "sourcePages": [], "src": "原PPT第 12 頁；課本 P152–153", "figSpec": {"image": "PPT12S3"}, "txt": "<ul><li>發燒可為全身性發炎反應的生理表現。</li><li>適度體溫升高可影響免疫細胞功能及部分病原的增殖條件。</li><li>教材以小兒麻痺病毒為例，不能據此推成所有病原對溫度反應都相同。</li><li>有防禦價值不等於體溫愈高愈好，也不表示每次發炎都必有發燒。</li></ul><p class=\"think\">把「可能增強防禦」改成「愈熱愈有益」，越過了哪個限制？</p><div class=\"ex\"><h4>發燒</h4><p>發燒是人體<b>全身性發炎反應</b>造成的現象之一，也是對抗感染的保護性生理反應。</p></div><div class=\"ex\"><h4>好處</h4><ul><li>提高免疫系統的免疫反應能力：高溫促使免疫細胞經血管更快到達感染部位。</li><li>降低某些病原體的感染與增殖能力（例如脊髓灰質炎病毒受熱時增殖能力下降）。</li></ul></div><div class=\"ex\"><h4>限制</h4><p>體溫過高（超過 <b>40.5 ℃</b>）時，可能威脅體內重要蛋白質的結構與功能，進而威脅生命。</p></div><div class=\"ex\"><h4>深入解說：發燒的好處與界線</h4><p>適度升溫可以：加速免疫細胞活動與移動；抑制部分病原增殖（許多病毒、細菌在較高溫下複製較慢）。但體溫過高（超過約 40.5 °C）可能使蛋白質結構受損、傷害腦與其他器官。所以「發燒有保護作用」≠「越熱越好」，也不代表任何發炎都會發燒。</p></div><div class=\"ex\"><h4>臨床提醒</h4><ul><li>嬰幼兒、慢性病者發燒要及早就醫。</li><li>退燒藥的目的是減輕不適，不是消除感染。</li><li>高體溫不一定是發燒（如中暑，設定點未變）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>把「可能增強防禦」改成「愈熱愈有益」，越過了什麼限制？</p><p><b>答：</b>忽略了體溫過高會傷害蛋白質和器官的上限，也忽略了不同病原的差異。</p></div>", "tb": []}, {"id": "b3-c52-l15", "t": "發燒設定點：發冷時仍可能升溫", "sec": "s3", "slide": 13, "sourceSlides": [13], "sourcePages": [], "src": "原PPT第 13 頁；課本 P152–153", "figSpec": {"image": "PPT13S3"}, "txt": "<ul><li>發燒模型中，免疫訊號經下視丘調節，使設定點上升。</li><li>當下體溫低於新的設定點，可感到冷、顫抖並增加產熱，即使相對平常已偏高。</li><li>設定點回落後，身體可增加散熱；不能把整個發燒過程都說成持續散熱不足。</li><li>原文列38°C、40.5°C等概括數字；它們不是保證安全或任何蛋白必定變性的通用門檻。</li></ul><p class=\"think\">發燒與環境過熱造成的高體溫，設定點的差別是什麼？</p><div class=\"scope-note\">發燒涉及設定點改變；高體溫也可能由設定點未升高的過熱造成。此處用於機制比較，數字不作個人健康判斷。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK562334/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>發燒的設定點</h4><p>病毒或細菌感染時，病原體分泌的物質與發炎介質刺激下視丘，使下視丘原本的<b>設定點上升</b>（超過 38 ℃）。</p></div><div class=\"ex\"><h4>為什麼發燒時還會發冷</h4><ul><li>身體以「新的、較高的設定點」為目標。</li><li>實際體溫還低於新設定點 → 身體仍朝產熱的方向反應（發抖、覺得冷）。</li><li>體溫持續上升，直到達到新的設定點。</li></ul></div><div class=\"ex\"><h4>重點</h4><p>發燒不是體溫調節失靈，而是設定點被調高；因此發燒常作為判別健康狀況的重要指標。</p></div><div class=\"ex\"><h4>深入解說：發燒時的「冷」</h4><p>感染時，巨噬細胞釋出的細胞激素（內生性致熱原）使下視丘的設定點升高。此時實際體溫仍低於新設定點，身體會：皮膚血管收縮（手腳冰冷）、顫抖產熱，直到達到新設定點；之後設定點回降，身體反向：血管擴張、大量出汗（退燒時流汗）。</p></div><div class=\"ex\"><h4>發燒 vs 中暑</h4><ul><li>發燒：設定點上升。</li><li>中暑：設定點正常，但散熱不及，體溫超過設定點。</li><li>處理方向不同。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>發燒不是調節失靈，那是什麼？</p><p><b>答：</b>是調節系統的設定點被調高，調節仍正常運作，只是目標溫度改變。</p></div>", "tb": []}, {"id": "b3-c52-l16", "t": "干擾素：宿主的訊息，鄰近細胞的回應", "sec": "s4", "slide": 14, "sourceSlides": [14, 15], "sourcePages": [6], "src": "原PPT第 14–15 頁；課本 P154", "figSpec": {"image": "interferon"}, "txt": "<ul><li>模型中的受感染細胞釋出干擾素，鄰近細胞接收訊號。</li><li>未感染細胞啟動相關基因表現，製造抗病毒蛋白；干擾素本身不等於每一種下游蛋白。</li><li>教材另外示意受感染細胞凋亡、免疫細胞清除力增加等效應。</li><li>典型抗病毒狀態由宿主反應形成，不是干擾素直接把所有病毒水解。</li></ul><p class=\"think\">若阻斷干擾素受體，為何單有外部訊號仍可能無法形成同一反應？</p><div class=\"ex\"><h4>干擾素（知識補給站）</h4><p>是一群<b>抗病毒蛋白</b>，由<b>被病毒感染的細胞</b>釋放。</p></div><div class=\"ex\"><h4>機制（圖）</h4><ul><li>干擾素擴散到周圍組織，與細胞表面受體結合。</li><li>促使<b>未感染細胞</b>啟動抗病毒蛋白基因表現，進入抗病毒狀態。</li><li>誘導已感染細胞進行<b>細胞凋亡</b>。</li><li>活化免疫細胞（如巨噬細胞、自然殺手細胞），增強清除被感染細胞的能力。</li></ul></div><div class=\"ex\"><h4>小提醒</h4><p>訊息是由被感染的細胞發出，鄰近細胞接收後採取防禦行動。</p></div><div class=\"ex\"><h4>深入解說：干擾素的運作</h4><p>病毒入侵細胞 → 細胞偵測到病毒核酸 → 釋出<b>干擾素</b> → 與鄰近細胞的干擾素受體結合 → 鄰近細胞啟動基因，合成<b>抗病毒蛋白</b>（如抑制病毒蛋白合成、降解病毒 RNA）→ 進入抗病毒狀態。同時可誘導受感染細胞凋亡，並活化 NK 與巨噬細胞。</p></div><div class=\"ex\"><h4>重點</h4><ul><li>干擾素是訊號，不直接殺病毒。</li><li>效應由細胞內的抗病毒蛋白產生。</li><li>阻斷干擾素受體 → 鄰細胞收不到訊息 → 不啟動防禦。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>為什麼說干擾素是「宿主的訊息」？</p><p><b>答：</b>它由受感染的宿主細胞釋出，傳給鄰近的宿主細胞，使其提前進入戒備狀態，而不是病原的產物。</p></div>", "tb": [["BOOK6", "P154 完整課本頁"]]}, {"id": "b3-c52-l17", "t": "干擾素範圍：不是一支病毒專用抗體", "sec": "s4", "slide": 16, "sourceSlides": [16], "sourcePages": [], "src": "原PPT第 16 頁；課本 P154", "figSpec": {"image": "interferon"}, "txt": "<ul><li>同物種細胞間的訊號可影響多種病毒相關防禦，不像抗體只依某一抗原特異性理解。</li><li>受體與訊號系統仍有選擇性；非單一病毒專一，不等於任何物種、任何細胞都必定反應。</li><li>干擾素有不同類型與受體，某些免疫細胞也能產生；不能加上「只有被感染細胞才會製造」。</li><li>保留原文基因工程與B、C肝治療舉例，另限定它的時代及適用範圍。</li></ul><p class=\"think\">對病毒不具同樣的抗原專一性，能否推出「不需匹配受體」？</p><div class=\"scope-note\">不同干擾素類型與受體有所差異。<a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC7165917/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a> 原C型肝炎干擾素治療例屬治療發展背景；目前多使用直接作用抗病毒藥物（DAA），原例不當作現行治療選擇。<a href=\"https://www.cdc.gov/hepatitis-c/hcp/clinical-care/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>干擾素的範圍</h4><p>同種動物產生的干擾素對病毒<b>沒有專一性</b>，不是針對某一種病毒的專用抗體。</p></div><div class=\"ex\"><h4>醫療應用</h4><p>目前已利用人類的干擾素基因，經基因轉殖細菌大量生產，用來治療某些病毒感染的疾病，如 B 型與 C 型肝炎。</p></div><div class=\"ex\"><h4>深入解說：非抗原專一，但有物種與受體限制</h4><p>抗體只針對特定抗原，而干擾素對多種病毒都有效，因為抗病毒蛋白針對的是病毒共同的複製過程。干擾素作用仍需細胞上有對應的受體，且通常具<b>物種專一性</b>（人的干擾素作用於人類細胞效果最好）。所以「對病毒沒有專一性」≠「任何物種、任何細胞都反應」。</p></div><div class=\"ex\"><h4>醫療應用</h4><ul><li>利用基因轉殖細菌或細胞大量生產人類干擾素。</li><li>用於治療部分病毒性肝炎（如 B、C 型）；近年 C 肝已有更有效的直接抗病毒藥物（延伸）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>干擾素與抗體在專一性上有何不同？</p><p><b>答：</b>抗體對特定抗原專一；干擾素對各種病毒的複製有廣譜抑制，不需對應某一種病毒。</p></div>", "tb": []}, {"id": "b3-c52-l18", "t": "補體活化：級聯放大與分工", "sec": "s4", "slide": 17, "sourceSlides": [17], "sourcePages": [], "src": "原PPT第 17 頁；課本 P154", "figSpec": {"image": "complement"}, "txt": "<ul><li>教材約20種血漿蛋白、肝臟合成及平時未活化，構成理解補體的簡化模型。</li><li>病原相關辨識或免疫複合體可啟動補體，連結先天與後天防禦。</li><li>某些步驟透過蛋白酶形成級聯與放大，後段亦有膜攻擊複合體的組裝。</li><li>不是所有補體成分都只是同一種酵素原；總數也不應當作不可更動的完整清冊。</li></ul><p class=\"think\">直接由病原啟動與經免疫複合體啟動，是否都一定先靠T細胞辨識？</p><div class=\"scope-note\">補體有辨識、酵素及結構等不同成分；控制機制有助限制對宿主組織的損傷。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK27100/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>補體</h4><p>包括約 <b>20 種血漿蛋白</b>，由<b>肝臟</b>合成，平常以<b>未活化</b>的形式在血液中流動，遇到病原體時被活化。</p></div><div class=\"ex\"><h4>如何活化</h4><ul><li>由抗原與抗體結合而成的<b>免疫複合物</b>活化。</li><li>或由某些特殊病原體直接活化。</li></ul></div><div class=\"ex\"><h4>級聯放大</h4><p>活化後的補體能引起一連串反應，活化更多的補體，擴大防禦作用。補體在先天與後天免疫之間搭橋。</p></div><div class=\"ex\"><h4>深入解說：補體像一連串骨牌</h4><p>補體是約 20 種血漿蛋白，主要由肝臟合成，平時以無活性前驅物存在。病原表面的特殊醣類，或抗原－抗體複合物，會啟動第一個成分，使其成為蛋白酶，切割並活化下一個，如此<b>逐級放大</b>，短時間內產生大量活化產物。有調控蛋白避免傷到自身細胞。</p></div><div class=\"ex\"><h4>連結先天與後天</h4><ul><li>先天：可由病原直接啟動。</li><li>後天：抗體結合後可啟動（抗體增強補體效果）。</li><li>因此補體是橋梁，並不一定需要 T 細胞。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>經免疫複合體啟動補體，一定要先靠 T 細胞辨識嗎？</p><p><b>答：</b>不需要。抗體與抗原結合形成複合體就能啟動補體，T 細胞是協助 B 細胞產生抗體的上游。</p></div>", "tb": []}, {"id": "b3-c52-l19", "t": "補體三效應：溶解、調理、趨化", "sec": "s4", "slide": 18, "sourceSlides": [18], "sourcePages": [], "src": "原PPT第 18 頁；課本 P154", "figSpec": {"image": "complement"}, "txt": "<ul><li>溶解作用：部分成分組裝並影響易感病原膜，使其受損。</li><li>調理作用：包覆與標記病原，使吞噬細胞較容易辨識、攝入。</li><li>趨化及發炎作用：吸引細胞與促進局部反應，和吞噬、溶解本身不同。</li><li>三者是分工效應；不代表每一個補體分子都同時做全部工作。</li></ul><p class=\"think\">病原膜完整但更容易被吞噬，最先支持哪一種效應？</p><div class=\"scope-note\">膜攻擊作用有易感性差異，不宣稱它必定裂解所有微生物；調理依受體與標記協作。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK27100/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>補體的三種防禦作用</h4><p></p></div><div class=\"ex\"><h4>三效應</h4><ul><li><b>溶解作用</b>：插入病原體細胞膜，造成膜穿孔並瓦解。</li><li><b>調理作用</b>：補體黏附在病原體上，與吞噬細胞的受體連接，促進吞噬。</li><li><b>趨化作用</b>：吸引吞噬細胞移動到發炎部位，並擴大發炎反應。</li></ul></div><div class=\"ex\"><h4>記憶方式</h4><p>溶解＝直接殺；調理＝標記讓吞噬細胞好吞；趨化＝呼叫援兵。</p></div><div class=\"ex\"><h4>深入解說：補體的三種效應</h4><p>① <b>溶解</b>：後段成分組裝成膜攻擊複合體，在病原膜上打洞，使其滲透壓失衡而裂解；② <b>調理</b>：補體片段黏在病原表面，吞噬細胞有補體受體，吞噬效率大增；③ <b>趨化與發炎</b>：小片段釋放到周圍，吸引吞噬細胞並促使肥大細胞釋出組織胺。</p></div><div class=\"ex\"><h4>比喻</h4><ul><li>溶解＝直接擊殺。</li><li>調理＝貼上「請吃我」標籤。</li><li>趨化＝廣播呼叫增援。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>病原膜完整但更容易被吞噬，是哪一種效應？</p><p><b>答：</b>調理作用：補體標記病原，並未破壞膜，但提高吞噬細胞的辨識與攝入。</p></div>", "tb": []}, {"id": "b3-c52-l20", "t": "整合防線：以作用對象連起機制", "sec": "s4", "slide": 2, "sourceSlides": [2, 15, 18], "sourcePages": [], "src": "原PPT第 2–18 頁；課本 P154", "figSpec": {"image": "supplement"}, "txt": "<ul><li>皮膜降低通過；吞噬者處理病原與碎片；發炎調節局部招募。</li><li>干擾素傳遞宿主訊號、促進抗病毒狀態；補體提供標記、引導與部分溶解效應。</li><li>同屬先天免疫，不能因此把訊號、酵素消化與標記機制等同。</li><li>證據推論應指出觀察到哪一段，而非只用「免疫力變強」概括。</li></ul><p class=\"think\">一項處理降低病毒複製，還需要哪些資料才能分辨是訊號回應或直接作用？</p><div class=\"ex\"><h4>整合</h4><p>把先天性免疫的機制，以「作用對象」連起來：</p></div><div class=\"ex\"><h4>整理</h4><ul><li>第一道：皮膜屏障 → 阻擋、殺菌、競爭。</li><li>第二道：吞噬細胞 → 吞噬病原體。</li><li>第二道：肥大細胞與發炎 → 招募更多吞噬細胞。</li><li>第二道：NK 細胞 → 破壞腫瘤與被感染的細胞。</li><li>第二道：干擾素 → 對抗病毒；補體 → 溶解、調理、趨化。</li></ul></div><div class=\"ex\"><h4>共同特點</h4><p>都屬非專一性防禦，反應迅速，沒有記憶性。</p></div><div class=\"ex\"><h4>深入解說：把機制放進一張表</h4><p>依「作用對象」整理：病原體（皮膜：阻擋；吞噬細胞：吞噬；補體：溶解、調理）；受感染的宿主細胞（NK：破壞；干擾素：誘導凋亡、使鄰細胞抗病毒）；局部組織（肥大細胞與發炎：招募）。共同特點：非專一、迅速、無（典型）記憶。</p></div><div class=\"ex\"><h4>推論題的做法</h4><ul><li>先指出觀察到哪一段（例如病毒複製下降）。</li><li>再問：是訊號回應（干擾素）還是直接殺死（NK、補體）？</li><li>需要的資料：干擾素濃度、抗病毒蛋白、受體阻斷實驗。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>一項處理降低了病毒複製，還需什麼資料才能分辨機制？</p><p><b>答：</b>需要測量干擾素或抗病毒蛋白的表現、阻斷干擾素受體的對照，才能分辨是訊號回應還是直接作用。</p></div>", "tb": []}, {"id": "b3-c52-l21", "t": "原題一：皮膜屏障與作用位置", "sec": "s5", "slide": 19, "sourceSlides": [19], "sourcePages": [], "src": "原PPT第 19 頁；課本 P149–154／原題", "figSpec": {"image": "PPT19S3"}, "txt": "<ul><li>保留原四個選項及答案D。</li><li>胃液鹽酸與酵素是第一道化學性屏障。</li><li>組織損傷發炎與下方細胞吞噬屬第二道；樹突細胞也可連結後天反應。</li><li>判讀不只看「是不是先天」，也要核對是否在本題問的第一道。</li></ul><p class=\"think\">同為先天防禦，B為何仍不是本題的皮膜屏障？</p><div class=\"ex\"><h4>原題一</h4><p>下列何者屬於先天性免疫中的皮膜屏障？</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 皮膜組織損傷時釋放組織胺</li><li>(B) 皮膜組織下方的吞噬細胞進行吞噬作用</li><li>(C) 樹突細胞吞噬病原體後傳遞訊息給淋巴球</li><li>(D) 胃液中的鹽酸與酵素破壞病原體</li></ul></div><div class=\"ex\"><h4>答案：(D)</h4><p></p></div><div class=\"ex\"><h4>其他選項</h4><ul><li>(A)(B) 發炎反應與吞噬作用屬第二道防線。</li><li>(C) 樹突細胞吞噬後傳遞訊息，可活化後天性免疫。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>同屬先天防禦，並不代表屬於「題目問的那一道」，要核對題幹限定的範圍。</p></div><div class=\"ex\"><h4>深入解說：先看題幹限定</h4><p>題目問的是「<b>皮膜屏障</b>」（第一道）。(A) 組織損傷後釋放組織胺＝發炎（第二道）；(B) 皮膜下方的吞噬細胞＝第二道；(C) 樹突細胞吞噬後傳遞訊息＝連結後天；(D) 胃液中的鹽酸與酵素＝第一道化學性屏障。答案 D。</p></div><div class=\"ex\"><h4>解題策略</h4><ul><li>先圈題幹限定詞：第幾道、先天或後天。</li><li>每個選項標上所屬防線。</li><li>都屬先天也未必都屬第一道。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>B 同屬先天，為何仍不是皮膜屏障？</p><p><b>答：</b>吞噬細胞在皮膜「下方」組織中處理已入侵的病原，已屬第二道。</p></div>", "tb": []}, {"id": "b3-c52-l22", "t": "原題二：發炎並非只有組織胺", "sec": "s5", "slide": 20, "sourceSlides": [20], "sourcePages": [], "src": "原PPT第 20 頁；課本 P149–154／原題", "figSpec": {"image": "PPT20S3"}, "txt": "<ul><li>保留原四個選項及答案B。</li><li>血管變化與細胞招募有助防禦；不可概括發炎有害無益。</li><li>受傷組織中的細胞會釋出多種介質，組織胺不是唯一一種。</li><li>原題的通透性用語為概括模型；血漿滲出與白血球游出仍須分清。</li></ul><p class=\"think\">D使用「唯一、完全」兩個詞，分別造成什麼過度推論？</p><div class=\"ex\"><h4>原題二</h4><p>有關發炎反應的敘述，下列何者正確？</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 發炎反應是一種細胞的病態反應，對生理有害無益</li><li>(B) 發炎部位的微血管通透性會增加，使吞噬細胞更容易到達受傷部位</li><li>(C) 病原體會釋放組織胺，造成感染部位發炎</li><li>(D) 組織胺是唯一的發炎介質，故使用抗組織胺類的藥物就可以完全消除發炎現象</li></ul></div><div class=\"ex\"><h4>答案：(B)</h4><p></p></div><div class=\"ex\"><h4>其他選項</h4><ul><li>(A) 發炎反應可提高局部免疫反應，利用免疫細胞對抗可能的感染。</li><li>(C) 是受傷的組織（肥大細胞）釋放組織胺，不是病原體。</li><li>(D) 組織胺只是其中一種發炎介質；「唯一」與「完全」都是過度推論。</li></ul></div><div class=\"ex\"><h4>深入解說：逐項看</h4><p>(A) 發炎有助防禦，不是「有害無益」。(B) 通透性增加、血流增加，使吞噬細胞與血漿成分更容易抵達，正確。(C) 組織胺由受傷組織的肥大細胞釋放，不是病原。(D) 組織胺只是介質之一，抗組織胺不能「完全」消除發炎。答案 B。</p></div><div class=\"ex\"><h4>過度推論的訊號詞</h4><ul><li>「唯一」「完全」「一定」「皆」常是陷阱。</li><li>要檢查是否有例外或其他因素。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>D 的「唯一」與「完全」分別造成什麼過度推論？</p><p><b>答：</b>「唯一」把多種介質中的一種當成全部；「完全消除」忽略其他介質與機制仍在作用。</p></div>", "tb": []}, {"id": "b3-c52-l23", "t": "原題三：先看題目限定的防線", "sec": "s5", "slide": 21, "sourceSlides": [21], "sourcePages": [], "src": "原PPT第 21 頁；課本 P149–154／原題", "figSpec": {"image": "PPT21S3"}, "txt": "<ul><li>保留原五個選項及多選答案A、B、D。</li><li>溶菌酶確有化學防禦作用，但在本架構歸第一道；不是因它完全沒有防禦作用而排除。</li><li>體液與細胞媒介免疫屬後天第三道，不在本題問的第二道。</li><li>判斷一句話是否正確，還須對照題幹的範圍。</li></ul><p class=\"think\">C為什麼是「敘述與題目範圍不符」，而不是「溶菌酶不存在」？</p><div class=\"ex\"><h4>原題三（多選）</h4><p>下列有關人體防禦作用<b>第二道防線</b>的敘述，哪些正確？</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 數量最多的吞噬細胞為嗜中性球</li><li>(B) 吞噬細胞將病原體吞入後，主要依賴溶體將之分解</li><li>(C) 唾液、淚液中具有溶菌酶，可殺死病原體</li><li>(D) 發燒是發炎反應造成的生理現象之一</li><li>(E) 體液免疫與細胞媒介免疫可辨認特定病原體而活化</li></ul></div><div class=\"ex\"><h4>答案：(A)(B)(D)</h4><p></p></div><div class=\"ex\"><h4>其他選項</h4><ul><li>(C) 溶菌酶確實能殺死病原體，但屬於<b>第一道</b>防線的皮膜屏障，與題目問的第二道範圍不符。</li><li>(E) 體液免疫與細胞媒介免疫屬於第三道防線。</li></ul></div><div class=\"ex\"><h4>深入解說：逐項看</h4><p>(A) 嗜中性球是數量最多的吞噬細胞，正確。(B) 吞噬後由溶體水解酶分解，正確。(C) 溶菌酶屬第一道（分泌物），與第二道不符。(D) 發燒是全身性發炎反應的一種表現，正確。(E) 體液免疫與細胞媒介免疫屬第三道。答案 A、B、D。</p></div><div class=\"ex\"><h4>讀題習慣</h4><ul><li>對照題幹「第二道防線」。</li><li>「敘述正確」與「範圍符合」是兩件事。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>C 為什麼是「範圍不符」而不是「溶菌酶不存在」？</p><p><b>答：</b>溶菌酶確實有殺菌作用，只是分泌物中的溶菌酶屬於第一道防線，題目問的是第二道。</p></div>", "tb": []}], "questions": [{"t": "第一道：依機制分類", "q": "將六張卡放到對應作用；同欄兩格可交換。", "learn": 3, "tag": "barrier", "hint": "看卡片指定的作用，不只看它出現在哪個部位。", "why": "物理移除、分泌物化學作用及菌群競爭是三種分類；同一部位可以兼有多種。", "sub": "原PPT第 4 頁；課本 P149–150", "refs": [{"src": "PPT04S3", "cap": "教材來源圖"}], "legacyQuestion": 1, "kind": "drag", "slots": [{"id": "g0s0", "label": "物理性", "group": 0}, {"id": "g0s1", "label": "物理性", "group": 0}, {"id": "g1s0", "label": "化學性", "group": 1}, {"id": "g1s1", "label": "化學性", "group": 1}, {"id": "g2s0", "label": "生物性", "group": 2}, {"id": "g2s1", "label": "生物性", "group": 2}], "pieces": [{"id": "ag0s0", "label": "黏液捕捉，纖毛移動顆粒", " function splitBlock(node,body){

  parts.push(fragment(from,best));from=best;

}
function paginateReading(){

const CONTENT={"lessons": [{"id": "b3-a41-l01", "t": "一對肌肉，如何帶動關節", "sec": "s1", "slide": 1, "sourceSlides": [1, 2], "sourcePages": [1, 3], "src": "課本P135、137；PPT 1、2", "figSpec": {"image": "movement"}, "txt": "<h3>觀察與機制</h3><ul><li>活動從肌肉附著位置與動作結果建立連結，不只背肌肉名稱。</li><li>離體雞翅用手施力，能檢驗拉力傳遞；不能直接證明神經訊號或活體收縮過程。</li><li>先固定視角並定義屈伸，再比較外側與內側牽拉。</li></ul><p class=\"thinking\"><strong>想一想</strong> 看到翅膀移動，能否推論雞翅仍在接收神經指令？</p><div class=\"ex\"><h4>前言</h4><p>骨骼肌接收到神經訊號就會<b>收縮</b>，牽動骨骼產生運動。肌肉與骨骼如何搭配？有哪些構造協助？</p></div><div class=\"ex\"><h4>目的</h4><p>用<b>雞翅</b>探討肌肉與骨骼的分布與連結：觀察肌肉附著位置與關節構造，了解運動時的相互作用，以及如何透過<b>拮抗作用</b>使骨骼移動。</p></div>", "tb": [["step_001", "P135完整課本頁"], ["step_003", "P137完整課本頁"]]}, {"id": "b3-a41-l02", "t": "連接鏈：肌肉、肌腱、骨與關節", "sec": "s1", "slide": 3, "sourceSlides": [3], "sourcePages": [1], "src": "課本P135；PPT 3", "figSpec": {"image": "ppt_003"}, "txt": "<h3>觀察與機制</h3><ul><li>肌肉產生張力，肌腱把力傳給骨骼，關節容許相對運動。</li><li>韌帶通常連骨與骨，協助穩定並限制活動範圍；不是主動收縮的馬達。</li><li>外觀白亮不是充分證據，應追蹤兩端連接對象。</li></ul><p class=\"thinking\"><strong>想一想</strong> 兩條白色帶狀構造，如何判斷哪條是肌腱？</p><div class=\"ex\"><h4>原理</h4><p>肌肉兩端具有<b>肌腱</b>。肌腱屬結締組織，使肌肉附著於骨骼上，並承受張力；骨骼也是結締組織，主要功能為支持。</p></div><div class=\"ex\"><h4>鏈結</h4><ul><li>肌肉 —肌腱→ 骨骼</li><li>骨骼 —韌帶→ 骨骼（關節處）</li></ul></div><div class=\"ex\"><h4>做法</h4><p>觀察肌腱或韌帶與骨骼連接的相對位置，實際操控，了解肌肉如何影響骨骼移動，並觀察肌肉間的拮抗。</p></div>", "tb": [["step_001", "P135完整課本頁"]]}, {"id": "b3-a41-l03", "t": "器材與準備：保留可檢驗的連接", "sec": "s1", "slide": 4, "sourceSlides": [4], "sourcePages": [1], "src": "課本P135；PPT 4", "figSpec": {"image": "materials"}, "txt": "<h3>觀察與機制</h3><ul><li>每組三節翅、手套、解剖盤、解剖用具與擦手紙；依教師示範準備。</li><li>保留肌肉、肌腱和關節，才能比較相同標本的兩側作用。</li><li>實驗材料不再食用，結束後清潔器具與桌面、洗手；廢棄物依學校規範處理。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若一開始就切斷肌腱，後續牽拉結果還代表完整連動嗎？</p><div class=\"ex\"><h4>每組器材</h4><p>實驗手套、餐巾紙或擦手紙、解剖盤、解剖用具、新鮮雞翅（三節翅）1 個。</p></div><div class=\"ex\"><h4>提醒</h4><p>保留肌腱與關節的連接，才能檢驗「誰連到誰」。</p></div>", "tb": [["step_001", "P135完整課本頁"]]}, {"id": "b3-a41-l04", "t": "步驟一：剝皮而不破壞深層", "sec": "s2", "slide": 5, "sourceSlides": [5], "sourcePages": [2], "src": "課本P136；PPT 5", "figSpec": {"image": "prep"}, "txt": "<h3>觀察與機制</h3><ul><li>依教材將雞翅置於盤中，觀察外表再去除表皮。</li><li>提起表皮、淺層分離，避免深切肌肉與肌腱；刀剪方向依教師示範。</li><li>原課本洗淨步驟照錄；教室操作應在指定區域避免濺水與污染，遵守教師流程。</li></ul><p class=\"thinking\"><strong>想一想</strong> 如何記錄「剝皮成功」與「深層構造完整」是兩件事？</p><div class=\"ex\"><h4>步驟 1：剝皮</h4><p>將新鮮雞翅洗淨放在解剖盤，觸摸表面的感覺；用解剖刀或剪刀去除表皮，小心不要傷到肌肉。</p></div><div class=\"ex\"><h4>安全</h4><p>解剖刀要銳利，也要小心別剪到裡面的肌肉；使用利刃時特別注意安全，避免受傷。</p></div>", "tb": [["step_002", "P136完整課本頁"]]}, {"id": "b3-a41-l05", "t": "步驟二：三節翅的定位", "sec": "s2", "slide": 6, "sourceSlides": [6], "sourcePages": [2], "src": "課本P136；PPT 6", "figSpec": {"image": "wing"}, "txt": "<h3>觀察與機制</h3><ul><li>最小一節定為第三節（翅尖），向身體方向依序第二節、第一節。</li><li>第一節為翅根，第二節為翅中；先用標籤與關節位置建立方向。</li><li>外觀照片不是X光，不能由未剝離的表面直接數清全部骨骼。</li></ul><p class=\"thinking\"><strong>想一想</strong> 同學旋轉標本後，你能用什麼定位而不只說左邊右邊？</p><div class=\"ex\"><h4>步驟 2：三節定位</h4><p>把最小的一節當第三節，其他依序是第二、第一節。</p></div><div class=\"ex\"><h4>三節</h4><ul><li>第一節（翅根）</li><li>第二節（翅中）</li><li>第三節（翅尖）</li></ul></div><div class=\"ex\"><h4>問題</h4><p>對照人體手臂圖解（圖 4－18），雞翅三節構造是否與人類手臂類似？</p></div>", "tb": [["step_002", "P136完整課本頁"]]}, {"id": "b3-a41-l06", "t": "同源對照：上臂、前臂與手部", "sec": "s2", "slide": 6, "sourceSlides": [6], "sourcePages": [2], "src": "課本P136；PPT 6", "figSpec": {"image": "wing"}, "txt": "<h3>觀察與機制</h3><ul><li>第一節對應上臂肱骨；第二節對應前臂橈骨與尺骨。</li><li>第三節對應腕、掌與指的特化構造；不把整個翅尖簡化為一根掌骨。</li><li>同源指共同演化來源，不表示外形、功能、骨數與比例完全相同；本活動引用課本圖4–18作對照。</li></ul><p class=\"thinking\"><strong>想一想</strong> 只見形狀相似，是否足以單獨證明同源？</p><div class=\"ex\"><h4>同源對照</h4><p>第一節對應上臂，第二節對應前臂，第三節對應手部。</p></div><div class=\"ex\"><h4>提醒</h4><p>這是結構上的類比，用來幫助辨識關節與肌肉位置。</p></div>", "tb": [["step_002", "P136完整課本頁"]]}, {"id": "b3-a41-l07", "t": "步驟三：外側牽拉的結果", "sec": "s3", "slide": 7, "sourceSlides": [7, 9], "sourcePages": [3], "src": "課本P137；PPT 7、9", "figSpec": {"image": "outer"}, "txt": "<h3>觀察與機制</h3><ul><li>教材左圖圈出第一節外側肌肉，箭頭標示手動牽拉方向。</li><li>在教材視角下，外側牽拉使翅膀伸展；活體簡化模型以外側伸肌作用解釋。</li><li>手向左拉不是所有標本都往左動；應比較關節夾角變化。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若旋轉照片，伸展的判準會跟著改變嗎？</p><div class=\"ex\"><h4>步驟 3：拉動外側肌肉</h4><p>按捏或拉動第一節骨骼不同側的肌肉，觀察翅膀如何移動，兩側肌肉是否相互拮抗。</p></div><div class=\"ex\"><h4>討論一（雞翅彎曲或伸展）</h4><p>彎曲時：外側肌肉舒張、內側肌肉收縮；伸展時：外側肌肉收縮、內側肌肉舒張。</p></div><div class=\"ex\"><h4>小技巧</h4><p>肌肉黏滑不易固定時，可用餐巾紙輔助。</p></div>", "tb": [["step_003", "P137完整課本頁"]]}, {"id": "b3-a41-l08", "t": "步驟三：內側牽拉的結果", "sec": "s3", "slide": 7, "sourceSlides": [7, 9], "sourcePages": [3], "src": "課本P137；PPT 7、9", "figSpec": {"image": "inner"}, "txt": "<h3>觀察與機制</h3><ul><li>教材右圖圈出第一節內側肌肉，牽拉可使翅膀彎曲。</li><li>在教材模型中內側為屈肌作用；以實際附著位置與角度變化核對。</li><li>黏滑時以擦手紙增加摩擦力，避免誤拉別條組織。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若標本整體滑動而關節角度不變，能算成功屈曲嗎？</p><div class=\"ex\"><h4>拉動內側肌肉</h4><p>同樣操作內側肌肉，與外側比較。</p></div><div class=\"ex\"><h4>預期</h4><p>內側肌肉收縮時，翅膀朝與外側相反的方向彎曲；兩邊動作方向相反。</p></div>", "tb": [["step_003", "P137完整課本頁"]]}, {"id": "b3-a41-l09", "t": "拮抗：拉力的方向相反", "sec": "s3", "slide": 7, "sourceSlides": [7, 9], "sourcePages": [3], "src": "課本P137；PPT 7、9", "figSpec": {"pair": ["outer", "inner"]}, "txt": "<h3>觀察與機制</h3><ul><li>活體入門模型：屈曲時內側收縮、外側舒張；伸展時相反。</li><li>肌肉產生拉力，舒張不等於主動把骨骼推回去；回復涉及另一側肌肉或外力。</li><li>延伸：穩定姿勢時可有共同活化，不把「拮抗」解讀成任何時刻只准一條肌肉有張力。</li></ul><p class=\"thinking\"><strong>想一想</strong> 維持姿勢時沒有移動，是否代表所有肌肉都沒有施力？</p><div class=\"ex\"><h4>拮抗作用</h4><p>兩部位的肌肉彼此為<b>拮抗肌</b>，共同控制關節活動。</p></div><div class=\"ex\"><h4>重點</h4><p>肌肉只能「拉」不能「推」，所以需要成對、拉力方向相反的肌肉。</p></div>", "tb": [["step_003", "P137完整課本頁"]]}, {"id": "b3-a41-l10", "t": "步驟四：沿連接尋找關節", "sec": "s4", "slide": 8, "sourceSlides": [8], "sourcePages": [3], "src": "課本P137；PPT 8", "figSpec": {"image": "movement"}, "txt": "<h3>觀察與機制</h3><ul><li>分離肌肉後追蹤肌腱到骨骼，尋找骨與骨連結的關節。</li><li>記錄施力構造、附著位置、固定骨與移動骨，避免只記「動了」。</li><li>課本未提供軟骨或韌帶顯微照片，不能把表面白色組織直接宣稱已完成組織鑑定。</li></ul><p class=\"thinking\"><strong>想一想</strong> 要把白色構造辨認為韌帶，還需要觀察它接到哪裡？</p><div class=\"ex\"><h4>步驟 4：找關節</h4><p>把第一節的肌肉彼此分離，尋找<b>關節</b>（兩塊骨骼連結處）以及<b>肌腱與骨骼連接</b>的位置。</p></div><div class=\"ex\"><h4>記錄</h4><p>觀察拉動不同肌肉造成的動作差異，記錄相對應的肌腱、骨骼與關節的移動情形與位置變化。可藉由<b>韌帶</b>找到關節處，注意關節處骨骼如何相連。</p></div>", "tb": [["step_003", "P137完整課本頁"]]}, {"id": "b3-a41-l11", "t": "起點、止點與相對運動", "sec": "s4", "slide": 9, "sourceSlides": [9], "sourcePages": [3], "src": "課本P137；PPT 9", "figSpec": {"image": "ppt_009"}, "txt": "<h3>觀察與機制</h3><ul><li>教材以較穩定端稱起點、較常移動端稱止點，便於描述。</li><li>施力使附著點趨近、帶動跨關節骨骼；固定條件影響哪一端移動。</li><li>起止點是解剖命名，不表示起點在所有姿勢都絕對不動。</li></ul><p class=\"thinking\"><strong>想一想</strong> 換固定另一端後，原本較穩定的骨頭可能動嗎？</p><div class=\"ex\"><h4>起點與止點</h4><p>每條肌肉兩端都透過肌腱與骨骼連接。</p></div><div class=\"ex\"><h4>分辨</h4><ul><li><b>起點</b>：附著在較穩定、不易移動的骨頭。</li><li><b>止點</b>：附著在會隨肌肉收縮而移動的骨頭。</li></ul></div><div class=\"ex\"><h4>動作</h4><p>肌肉收縮時，拉動止點靠近起點，使關節彎曲或伸展。</p></div>", "tb": [["step_003", "P137完整課本頁"]]}, {"id": "b3-a41-l12", "t": "改變附著：先看是否跨關節", "sec": "s4", "slide": 10, "sourceSlides": [10], "sourcePages": [3], "src": "課本P137；PPT 10", "figSpec": {"image": "ppt_010"}, "txt": "<h3>觀察與機制</h3><ul><li>本活動簡化模型把肌肉兩端改接同一塊骨，不再直接牽動第二塊骨繞該關節屈伸。</li><li>改接其他骨時，需看關節軸、拉力作用線與力臂，不能一概說一定反向。</li><li>力矩依拉力與垂直力臂而定；作用線穿過轉軸時對該軸力矩為零。</li></ul><p class=\"thinking\"><strong>想一想</strong> 都接在不同骨上，就一定能使指定關節轉動嗎？</p><div class=\"scope-note\">「同骨不動」限定此肌肉對指定關節的直接作用，不代表整個標本永遠無任何位移。</div><div class=\"ex\"><h4>討論二：改變肌腱位置</h4><p>若把肌腱連到別的地方，翅膀會怎樣運動？</p></div><div class=\"ex\"><h4>答案</h4><ul><li>連在<b>同一塊骨骼</b>上：骨骼無法彎曲，肌肉怎麼伸縮都不會產生動作。</li><li>連在<b>其他骨骼</b>上：視兩骨骼的相對位置而定。</li></ul></div><div class=\"ex\"><h4>判斷</h4><p>要看肌肉是否「跨過關節」。</p></div>", "tb": [["step_003", "P137完整課本頁"]]}, {"id": "b3-a41-l13", "t": "肌腱與韌帶：連接比外觀可靠", "sec": "s4", "slide": 11, "sourceSlides": [11, 12], "sourcePages": [1, 3], "src": "課本P135、137；PPT 11、12", "figSpec": {"image": "ppt_011"}, "txt": "<h3>觀察與機制</h3><ul><li>肌腱通常肌連骨、傳力；韌帶通常骨連骨、穩定關節。</li><li>兩者多含膠原纖維；排列、彈性、形狀和血液供應依部位而異。</li><li>原PPT把韌帶概括為較鬆散、更具彈性，僅可作部分比較，不適用所有韌帶；本活動無組織切片可證明纖維排列。</li></ul><p class=\"thinking\"><strong>想一想</strong> 一條較扁的白帶是否就一定是韌帶？</p><div class=\"ex\"><h4>討論三：肌腱與韌帶</h4><p>兩者皆為結締組織，但不同。</p></div><div class=\"ex\"><h4>差異</h4><ul><li><b>連接對象</b>：肌腱連肌肉與骨骼；韌帶連骨骼與骨骼。</li><li><b>功能</b>：肌腱產生動作；韌帶穩定關節、防止過度活動或脫位。</li><li><b>排列</b>：肌腱膠原纖維排列整齊，耐拉力；韌帶較鬆散、彈性高。</li><li><b>強度</b>：肌腱較硬，抗拉力強；韌帶較有彈性。</li><li><b>外觀</b>：肌腱細長、白色有光澤（如阿基里斯腱）；韌帶扁平或帶狀（如膝關節十字韌帶）。</li></ul></div><div class=\"ex\"><h4>判斷法</h4><p>不要只看外觀，要看它連在哪兩個構造之間。</p></div>", "tb": [["step_001", "P135完整課本頁"], ["step_003", "P137完整課本頁"]]}, {"id": "b3-a41-l14", "t": "觀察紀錄：讓別人能重做", "sec": "s5", "slide": 8, "sourceSlides": [8, 9, 10], "sourcePages": [3], "src": "課本P137；PPT 8、9、10", "figSpec": {"pair": ["outer", "inner"]}, "txt": "<h3>觀察與機制</h3><ul><li>以相同視角與固定位置比較兩側牽拉，先試小幅度且避免破壞組織。</li><li>記錄拉哪一側、往哪拉、哪塊骨固定、關節角度變大或變小；失敗與不確定也記錄。</li><li>外力大小、標本損傷與夾持位置都可能影響結果，單張照片不能決定所有因果。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若兩次拉力差很多，能只把角度差歸因於肌肉不同嗎？</p><div class=\"ex\"><h4>怎麼寫紀錄</h4><p>讓別人照著你的紀錄能重做。</p></div><div class=\"ex\"><h4>要寫</h4><ul><li>拉動的是哪一塊肌肉（位置、方向）。</li><li>對應的肌腱連在哪塊骨。</li><li>關節的動作方向與幅度。</li></ul></div>", "tb": [["step_003", "P137完整課本頁"]]}, {"id": "b3-a41-l15", "t": "模型設計：兩條拉索與一個支點", "sec": "s5", "slide": 13, "sourceSlides": [13], "sourcePages": [3], "src": "課本P137；PPT 13", "figSpec": {"image": "ppt_013"}, "txt": "<h3>觀察與機制</h3><ul><li>筷子或紙板代表骨，接點代表可轉動關節，兩條橡皮筋或拉索代表相反方向作用。</li><li>比較跨關節與同骨附著、改變作用線，固定其他條件後觀察角度。</li><li>橡皮筋被拉長後回彈不等於活體神經控制或主動肌肉收縮；模型應列出能表示與無法表示的部分。</li></ul><p class=\"thinking\"><strong>想一想</strong> 要把「我做的模型會動」提升成可檢驗的模型，你會比較哪兩種配置？</p><div class=\"ex\"><h4>延伸活動：做模型</h4><p>設計模型模擬雞翅運動（筷子、橡皮筋或紙片，材料不限），比較模型與真正雞翅的異同。</p></div><div class=\"ex\"><h4>設計想法</h4><p>兩條拉索（代表一對拮抗肌）＋一個支點（關節）。比較時要想：橡皮筋能「推」嗎？真正的肌肉如何由神經控制？</p></div>", "tb": [["step_003", "P137完整課本頁"]]}, {"id": "b3-a41-l16", "t": "整合：由證據建立解釋", "sec": "s5", "slide": 1, "sourceSlides": [1, 2, 3, 8, 9, 10, 11, 12, 13], "sourcePages": [1, 2, 3], "src": "課本P135、136、137；PPT 1、2、3、8、9、10、11、12、13", "figSpec": {"image": "movement"}, "txt": "<h3>觀察與機制</h3><ul><li>連接對象回答是什麼；牽拉方向與角度回答如何運作。</li><li>模型預測、雞翅觀察與活體生理分開，不把任何一種證據無限延伸。</li><li>回看三題討論與延伸活動，說明現有證據與還需觀察的項目。</li></ul><p class=\"thinking\"><strong>想一想</strong> 「看到動作」與「解釋機制」之間還缺哪條連接證據？</p><div class=\"ex\"><h4>整合</h4><p>由證據建立解釋：</p></div><div class=\"ex\"><h4>串起來</h4><ul><li>肌肉經肌腱連到骨骼，收縮時拉動止點靠近起點。</li><li>韌帶連接骨骼，穩定關節。</li><li>成對的拮抗肌讓關節能雙向運動。</li></ul></div>", "tb": [["step_001", "P135完整課本頁"], ["step_002", "P136完整課本頁"], ["step_003", "P137完整課本頁"]]}], "questions": [{"t": "課本圖貼標籤：定位三節翅", "q": "依課本照片（P136），把名稱放回三條引線的編號格：翅根、翅中、翅尖。", "learn": 4, "tag": "position", "hint": "先找最小的一節（翅尖），再向身體方向依序追蹤；不用畫面左右當固定的解剖方向。", "why": "雞翅由身體側往外依序為第一節（翅根）、第二節（翅中）、第三節（翅尖）；定位時依引線所指位置判斷，不依畫面左右。", "sub": "課本 P136 照片", "refs": [{"src": "mk_wing", "cap": "三節翅（標籤已遮蓋）"}], "kind": "drag", "mask": "mk_wing", "ar": 1.6938, "layout": "side", "slots": [{"id": "s0", "label": "第一節（翅根）", "group": 0, "x": 17.47, "y": 88.63, "v": false, "w": false}, {"id": "s1", "label": "第二節（翅中）", "group": 1, "x": 51.41, "y": 8.14, "v": false, "w": false}, {"id": "s2", "label": "第三節（翅尖）", "group": 2, "x": 84.59, "y": 8.14, "v": false, "w": false}], "pieces": [{"id": "a0", "label": "第一節（翅根）", "group": 0}, {"id": "a1", "label": "第二節（翅中）", "group": 1}, {"id": "a2", "label": "第三節（翅尖）", "group": 2}, {"id": "a3", "label": "第四節（翅掌）", "group": 100}, {"id": "a4", "label": "第三節（翅根）", "group": 101}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2"}, "pre": {"s1": "a1"}}, {"t": "課本圖：外側與內側", "q": "把牽拉部位貼到兩張原照片。", "learn": 8, "tag": "antagonism", "hint": "用肌肉所在側定位，注意兩圖姿勢不同。", "why": "對照原照片圈出的肌肉與牽拉箭頭。", "sub": "課本P137；PPT 7、9", "refs": [{"src": "outer", "cap": "教材來源圖"}], "legacyQuestion": 3, "kind": "drag", "slots": [{"id": "g0s0", "label": "照片甲", "group": 0}, {"id": "g1s0", "label": "照片乙", "group": 1}], "pieces": [{"id": "ag0s0", "label": "第一節外側肌肉", "group": 0}, {"id": "ag1s0", "label": "第一節內側肌肉", "group": 1}, {"id": "distractor0", "label": "第一節肌腱", "group": 99}, {"id": "distractor1", "label": "骨與骨間韌帶", "group": 99}], "sol": {"g0s0": "ag0s0", "g1s0": "ag1s0"}, "pre": {}, "organCards": [{"image": "outer-quiz", "slot": "g0s0", "label": "照片甲"}, {"image":  6, "kind": "multi", "opts": [{"t": "為快速去除表皮，應使用解剖刀垂直用力深切入關節內部將整塊肌肉剔除", "ok": false, "tag": "procedure"}, {"t": "剝除雞翅表皮時，應提起皮膚並使解剖剪平貼皮下前進，避免剪斷深層肌肉與白色肌腱", "ok": true, "tag": "procedure"}, {"t": "實驗完成後的生鮮雞翅經水洗後，可直接帶回教室烹煮食用以避免浪費食材", "ok": false, "tag": "procedure"}, {"t": "生鮮雞肉可能附著沙門氏桿菌等病原菌，操作全程應配戴手套，實驗後確實清潔消毒", "ok": true, "tag": "procedure"}, {"t": "牽拉肌肉時若表面黏滑不易固定，可使用餐巾紙或擦手紙包裹輔助增加摩擦力", "ok": true, "tag": "procedure"}], "fig": "prep", "figCaption": "教材原圖（完整標示）", "id": "b3-a41-q17"}, {"t": "關節處軟骨、韌帶與肌腱之結構功能對比", "q": "在雞翅肘關節處仔細分離並觀察相關構造，下列敘述哪些完全正確？（應選 3 項）", "learn": 12, "tag": "connective", "hint": "檢核關節軟骨面光滑無血管、韌帶骨連骨穩定、肌腱肌連骨傳力。", "why": "肌腱通常肌連骨並傳力，韌帶通常骨連骨並協助穩定；關節軟骨可減少摩擦。外觀不是充分證據，彈性和纖維排列依部位而異。", "sub": "原網頁延伸題7；課本P135、137；PPT 11、12", "refs": [{"src": "movement", "cap": "教材來源圖"}], "legacyQuestion": 7, "kind": "multi", "opts": [{"t": "骨骼兩端相接處被覆平滑光亮的透明軟骨，可大幅減少骨與骨之間的摩擦磨損", "ok": true, "tag": "connective"}, {"t": "關節軟骨內部富含緻密微血管網，受傷後數小時內即可快速完全癒合再生", "ok": false, "tag": "connective"}, {"t": "韌帶直接連接相鄰兩塊骨骼，緊繃固定於關節周圍以防止異常位移或脫臼", "ok": true, "tag": "connective"}, {"t": "肌腱與韌帶皆是由疏鬆結締組織構成，內部充滿大量液滴以提供肌肉彈性", "ok": false, "tag": "connective"}, {"t": "肌腱為肌肉肉質部的緻密結締組織延續，跨越關節附著於骨骼以傳導收縮力量", "ok": true, "tag": "connective"}], "fig": "movement", "figCaption": "教材原圖（完整標示）", "id": "b3-a41-q18"}, {"t": "骨骼肌牽拉骨骼運動之拮抗協同原理解析", "q": "藉由拉動雞翅內側與外側肌腱觀察關節連動，結合骨骼肌生理學，下列敘述哪些正確？（應選 3 項）", "learn": 8, "tag": "antagonism", "hint": "檢核肌肉主動拉不能推、成對拮抗、一縮一舒、跨關節附著。", "why": "骨骼提供支持，肌腱傳力，屈伸需要相反方向的作用；原題延伸至拍翅，但完整飛行涉及多個關節與肌群。拮抗肌也可共同活化以穩定姿勢，不能把舒張解釋為主動推骨。", "sub": "原網頁延伸題8；課本P137；PPT 7、9", "refs": [{"src": "movement", "cap": "教材來源圖"}], "legacyQuestion": 8, "kind": "multi", "opts": [{"t": "骨骼肌舒張時能主動向外推斥骨骼，因此即使切斷伸肌，單靠屈肌推斥也能伸直翅膀", "ok": false, "tag": "antagonism"}, {"t": "當手臂維持屈曲姿勢時，屈肌與伸肌的肌小節皆同時縮短至原本的一半長度", "ok": false, "tag": "antagonism"}, {"t": "拉動第一節內側肌腱時翅膀折疊彎曲，此側肌肉在功能上相當於人類手臂的屈肌（如肱二頭肌）", "ok": true, "tag": "antagonism"}, {"t": "拉動第一節外側肌腱時翅膀展開伸直，此側肌肉在功能上相當於人類手臂的伸肌（如肱三頭肌）", "ok": true, "tag": "antagonism"}, {"t": "活體鳥類飛行時，翅膀內外側拮抗肌群交替收縮與舒張，產生規律有力的拍翅動作", "ok": true, "tag": "antagonism"}], "fig": "movement", "figCaption": "教材原圖（完整標示）", "id": "b3-a41-q19"}, {"t": "討論一：屈伸與附著", "q": "不同部位肌肉的肌腱連接位置會導致肌肉收縮時產生不同的作用，當雞翅彎曲或伸展時，第一節外側肌肉與內側肌肉分別為收縮或舒張？肌肉兩端的肌腱與骨骼連接關係為何？", "learn": 8, "tag": "antagonism", "hint": "記錄觀察、解釋與所需證據；本題不自動評分。", "why": "完整原題保存；個人文字只保存，不自動評分。", "sub": "課本P137；PPT 7、9", "refs": [{"src": "movement", "cap": "教材來源圖"}], "kind": "reflection", "fig": "movement", "reflectionLabel": "我的觀察／解釋／預測", "reflectionPlaceholder": "尚未實作可記錄預測及待觀察項目；勿填造實測結果。", "reviewPrompts": ["屈伸時兩側作用", "附著關係", "離體與活體證據界線"], "originalBookDiscussion": "P137討論1", "id": "b3-a41-q20"}, {"t": "討論二：改變肌腱位置", "q": "若把肌腱的位置改到別的地方，例如：連在相同或其他不同的骨骼上，預測雞翅將會如何運動？", "learn": 11, "tag": "lever", "hint": "記錄觀察、解釋與所需證據；本題不自動評分。", "why": "完整原題保存；個人文字只保存，不自動評分。", "sub": "課本P137；PPT 10", "refs": [{"src": "movement", "cap": "教材來源圖"}], "kind": "reflection", "fig": "movement", "reflectionLabel": "我的觀察／解釋／預測", "reflectionPlaceholder": "尚未實作可記錄預測及待觀察項目；勿填造實測結果。", "reviewPrompts": ["同骨或跨關節", "作用線與轉軸", "你的條件與預測"], "originalBookDiscussion": "P137討論2", "id": "b3-a41-q21"}, {"t": "討論三：肌腱與韌帶", "q": "試判斷並寫出韌帶與肌腱有哪些差異？", "learn": 12, "tag": "connective", "hint": "記錄觀察、解釋與所需證據；本題不自動評分。", "why": "完整原題保存；個人文字只保存，不自動評分。", "sub": "課本P135、137；PPT 11、12", "refs": [{"src": "ppt_011", "cap": "教材來源圖"}], "kind": "reflection", "fig": "ppt_011", "reflectionLabel": "我的觀察／解釋／預測", "reflectionPlaceholder": "尚未實作可記錄預測及待觀察項目；勿填造實測結果。", "reviewPrompts": ["連接對象", "力學功能", "觀察限制"], "originalBookDiscussion": "P137討論3", "id": "b3-a41-q22"}, {"t": "延伸：設計雞翅模型", "q": "試設計一個模型，模擬雞翅的運動（可利用筷子與橡皮筋或紙片等，材料不限）。比較模型與真正的雞翅有何異同？", "learn": 14, "tag": "model", "hint": "記錄觀察、解釋與所需證據；本題不自動評分。", "why": "完整原題保存；個人文字只保存，不自動評分。", "sub": "課本P137；PPT 13", "refs": [{"src": "ppt_013", "cap": "教材來源圖"}], "kind": "reflection", "fig": "ppt_013", "reflectionLabel": "我的觀察／解釋／預測", "reflectionPlaceholder": "尚未實作可記錄預測及待觀察項目；勿填造實測結果。", "reviewPrompts": ["材料映射", "對照配置與量測", "模型的能力與限制"], "originalBookDiscussion": "P137延伸活動", "id": "b3-a41-q23"}], "tags": {"position": ["三節翅定位", "回看連接、條件與圖像證據。", "課本P136；PPT 6"], "homology": ["同源對照", "回看連接、條件與圖像證據。", "課本P136；PPT 6"], "connective": ["肌腱與韌帶", "回看連接、條件與圖像證據。", "課本P135、137；PPT 11、12"], "force": ["拉力傳遞", "回看連接、條件與圖像證據。", "課本P135；PPT 3"], "procedure": ["操作與保留", "回看連接、條件與圖像證據。", "課本P136；PPT 5"], "antagonism": ["拮抗與屈伸", "回看連接、條件與圖像證據。", "課本P137；PPT 7、9"], "lever": ["附著與力矩", "回看連接、條件與圖像證據。", "課本P137；PPT 10"], "evidence": ["觀察與推論", "回看連接、條件與圖像證據。", "課本P137；PPT 8、9、10"], "model": ["模型與限制", "回看連接、條件與圖像證據。", "課本P137；PPT 13"]}, "conceptMap": {"position": 4, "homology": 5, "connective": 12, "force": 1, "procedure": 3, "antagonism": 8, "lever": 11, "evidence": 13, "model": 14}, "originalCount": 4, "source": {"bookPages": 3, "printedPages": "135–137", "pptPages": 13, "presentationKind": "pptx-static"}, "pptText": {"1": "探討活動 \n4-\n1 \n肌肉與骨骼的運作\n       當骨骼肌接收到神經訊號時即會收縮，可牽動骨骼而產生運動，肌肉與骨骼如何搭配運作，又有哪些構造協助呢？\n前言\n1\n配合課本 \nP135", "2": "探討活動 \n4-\n1 \n肌肉與骨骼的運作\n       本活動利用雞翅探討肌肉與骨骼的分布與連結，藉由觀察肌肉附著的位置與關節構造，了解運動時骨骼與肌肉間的相互作用，以及如何透過拮抗作用使骨骼移動。\n目的\n2\n配合課本 \nP135", "3": "探討活動 \n4-\n1 \n肌肉與骨骼的運作\n       \n肌肉\n兩端具有\n肌腱\n，\n肌腱\n屬於\n結締組織\n，可使肌肉附著於骨骼上，並可承受張力，\n骨骼\n也是\n結締組織\n，主要功能為支持。活動過程中可經由肌腱或韌帶在與骨骼連接時的相對位置，透過實際操控，了解肌肉如何影響骨骼的移動，並藉由觀察雞翅的運動，了解肌肉彼此間的\n拮抗作用\n。\n原理\n3\n配合課本 \nP135", "4": "探討活動 \n4-\n1 \n肌肉與骨骼的運作\n每組使用\n實驗手套\n1 \n雙\n餐巾紙或擦手紙\n適量\n解剖盤\n1 \n個\n解剖用具\n1 \n組\n新鮮的雞\n翅（ 三節翅 ）\n1 \n個\n4\n配合課本 \nP135\n器材", "5": "探討活動 \n4-\n1 \n肌肉與骨骼的運作\n將新鮮雞翅洗淨後置於解剖盤中，觸摸雞翅感受表面的感覺。用解剖刀或剪刀去除雞翅的表皮，小心不要傷到肌肉。\n1\n註\n解剖刀需銳利，並小心不要剪到裡面的肌肉；使用利刃時需特別注意安全，以免受傷。\n5\n配合課本 \nP136\n步驟", "6": "探討活動 \n4-\n1 \n肌肉與骨骼的運作\n2\n第一節\n（ 翅根 ）\n第二節\n（ 翅中 ）\n第三節\n（ 翅尖 ）\n如下圖，把最小的一節當成第三節，其他依序當作第二、一節，對照人體手臂圖解（\n圖 \n4\n \n–18\n），雞翅的三節構造是否與人類手臂類似？\n6\n配合課本 \nP136", "7": "探討活動 \n4-\n1 \n肌肉與骨骼的運作\n按捏或拉動第一節骨骼不同側的肌肉，觀察翅膀如何移動？是否相互拮抗？\n3\n註\n按捏時，若肌肉黏滑不易固定，可用餐巾紙或擦手紙輔助。\n往左拉動第一節外側肌肉\n往左拉動第一節內側肌肉\n7\n配合課本 \nP137", "8": "探討活動 \n4-\n1 \n肌肉與骨骼的運作\n將第一節的肌肉彼此分離，尋找關節（兩塊骨骼連結處）以及肌腱與骨骼連接的位置。觀察拉動不同肌肉造成的動作差異，並記錄相對應的肌腱、骨骼與關節之移動情形以及位置變化。\n4\n註\n可藉由韌帶找到關節處，注意關節處的骨骼如何相連。\n8\n配合課本 \nP137", "9": "探討活動 \n4-\n1 \n肌肉與骨骼的運作\n討論\n不同部位肌肉的肌腱連接位置會導致肌肉收縮時產生不同的作用，當雞翅彎曲或伸展時，第一節外側肌肉與內側肌肉分別為收縮或舒張？肌肉兩端的肌腱與骨骼連接關係為何？\n答\n：\n(1)\n當雞翅彎曲時，第一節外側肌肉舒張、內側肌肉收縮，拉動骨骼產生彎曲動作；反之，當雞翅伸展時，第一節外側肌肉收縮、內側肌肉舒張。這表示兩部位的肌肉彼此為拮抗肌，共同控制關節活動。\n(2)\n每條肌肉的兩端都透過肌腱與骨骼連接。一端附著在較穩定、不易移動的骨頭上，稱為起點（\norigin\n）；另一端則附著在會隨肌肉收縮而移動的骨頭上，稱為止點（\ninsertion\n）。當肌肉收縮時，會拉動止點靠近起點，使關節產生彎曲或伸展的動作。\n9\n配合課本 \nP137", "10": "探討活動 \n4-\n1 \n肌肉與骨骼的運作\n2. \n若把肌腱的位置改到別的地方，例如\n：\n連在相同或其他不同的骨骼上，預測雞翅將會如何運動？\n答\n：\n若\n肌腱連接位置改變，例如\n：\n當連接在同一骨骼上，因骨骼無法伸展彎曲，故不論肌肉如何伸縮，皆不會產生動作；當連接在其他不同的骨骼上，則運動情況需視兩骨骼的相對位置而定。\n10\n配合課本 \nP137", "11": "探討活動 \n4-\n1 \n肌肉與骨骼的運作\n答\n：\n肌腱（\ntendon\n）與韌帶（\nligament\n）皆為結締組織，但功能與結構有所不同，說明\n如下\n：\n(1)\n連接對象不同\n：\n肌腱連接肌肉與骨骼，將肌肉的收縮力量傳遞至骨骼；韌帶則連接骨骼與骨骼，穩定關節並限制活動範圍。\n(2)\n功能\n不同\n：\n肌腱\n負責動作產生；韌帶則防止關節過度活動或脫位。\n(3)\n組織排列\n不同\n：\n肌腱\n的膠原纖維排列整齊、方向一致，能有效承受拉力；韌帶纖維較鬆散，彈性較高，可適應多方向拉扯\n。\n3. \n試判斷並寫出韌帶與肌腱有哪些差異？\n11\n配合課本 \nP137", "12": "探討活動 \n4-\n1 \n肌肉與骨骼的運作\n答\n：\n(\n4)\n強度與彈性不同：肌腱通常較韌帶硬，且更能抗拉力，能承受並傳遞肌肉收縮時的強大力量；韌帶則較具彈性，以便同時維持關節的穩定與靈活度。\n(5)\n外觀不同：肌腱細長，常呈白色並帶有光澤，如阿基里斯腱；韌帶則為扁平或帶狀，如膝關節的十字韌帶\n。\n3. \n試判斷並寫出韌帶與肌腱有哪些差異？\n12\n配合課本 \nP137", "13": "探討活動 \n4-\n1 \n肌肉與骨骼的運作\n　   試設計一個模型，模擬雞翅的運動（可利用筷子與橡皮筋或紙片等，材料不限）。比較模型與真正的雞翅有何異同？\n延伸活動\n13\n配合課本 \nP137"}, "sourceCorrections": [{"ppt": [7, 9], "note": "手動牽拉離體標本不等於活體神經引發收縮；拮抗模型可有共同活化，不能概括整個拍翅。"}, {"ppt": [10], "note": "同骨附著不屈伸限定此肌肉對指定關節的直接作用；異骨附著需看作用線及力臂。"}, {"ppt": [11, 12], "note": "肌腱與韌帶性質依部位而異，不能概括所有韌帶纖維皆鬆散、更有彈性；辨識優先看連接對象。"}]};

function splitBlock(node,body){

}

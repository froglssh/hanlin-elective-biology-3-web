const CONTENT={"pptText": {"1": "4-2 \n體內的受器\n4\n-2.1 \n光受器\n4\n-2.2 \n溫度受器\n4\n-2.3 \n痛覺受器\n4-2.4 \n機械受器\n4-2.5 \n化學受器\n1", "2": "4\n-2.1 \n光受器\n◆ 人眼的\n構造\n：\n角膜\n虹\n膜\n水晶體\n視網膜\n配合課本 \nP109\n認識眼睛的結構與\n功能", "3": "4\n-2.1 \n光受器\n◆ 視網膜的解剖\n構造\n：\n視神經纖維\n多種神經元\n光受器\n色素上皮細胞\n視網膜\n光線前進方向\n神經衝動傳導方向\n配合課本 \nP109", "4": "4\n-2.1 \n光受器\n◆ 光受\n器\n：\n視\n桿細胞、視錐細胞\n視桿細胞\n視錐細胞\n細胞核\n感光區域\n視網膜\n配合課本 \nP109", "5": "  \n知識補給站\n人類的光受器與眼睛構造\n視桿細胞\n視錐細胞\n細胞核\n感光區域\n◆ 光受\n器\n：\n視\n桿細胞、視錐細胞\n◇ 皆是\n特化的神經元\n視桿細胞\n▪ \n對光\n的敏感度較高，\n即使光線較弱也可活化，可偵測夜間或暗室的微弱光線\n▪ 負責\n明暗視覺\n▪ \n無法辨色\n▪ 主要負責察覺物體的大小、移動等\n配合課本 \nP108\n、\n109\n5", "6": "  \n知識補給站\n人類的光受器與眼睛構造\n視桿細胞\n視錐細胞\n細胞核\n感光區域\n▪ 分為藍錐、綠錐及紅錐細胞\n，可分別偵測特定範圍波長的光波\n▪ \n需較\n強的光線才能活化\n▪ 負責\n色覺\n▪ \n對影像的敏銳度很高\n視錐細胞\n配合課本 \nP108\n、\n109\n6", "7": "  \n知識補給站\n人類的光受器與眼睛構造\n \n視桿細胞\n視錐細胞\n數\n　\n目\n多\n少\n光量敏感度\n高\n低\n辨色力\n無法區分顏色\n \n藍錐、綠錐及紅錐細胞\n，可分別偵測特定範圍波長的光波\n影像敏感度\n弱\n強\n◆ 視桿細胞、視錐細胞的\n整理\n：\n補充\n7", "8": "  \n知識補給站\n人類的光受器與眼睛構造\n8\n◆ \n黃斑\n：\n視網膜\n正後方的一個橢圓形黃色區域\n盲點\n黃斑\n中央窩\n◆ \n中央\n窩\n：\n黃斑\n中央的一個凹陷，是視錐細胞最密集處，因此也是視覺解析度最佳的位置\n◆ \n盲點\n：\n視神經\n纖維傳出眼球的區域不含視桿細胞與視錐細胞，不具感光作用\n配合課本 \nP108\n、\n109", "9": "◆ \n產生\n視\n覺的過程\n：\n光\n光受器\n（視\n桿細胞\n、\n\n　視\n錐\n細胞）\n4\n-2.1 \n光受器\n經盲點出眼球\n視丘\n大腦\n視覺區\n產生視覺\n光受器接受光刺激後，會產生膜電位的改變，並釋出化學物質，藉此將訊息傳給神經細胞\n配合課本 \nP108\n、\n109\n視網膜\n視神經\n（神經纖維\n \n 集合）\n神經細胞\n神經細胞\n（多種神經元）", "10": "4\n-2.2 \n溫度受器\n◆ \n位於體內與體表皮膚\n◆ 為\n感覺神經元的末梢\n◆ 依接受的刺激類型可分為\n熱覺\n與\n冷覺\n兩類\n神經末梢\n（\n溫度\n受器\n或痛覺受\n器）\n毛囊\n巴\n氏小\n體（機械\n受\n器）\n◆ \n可感測外界和體表溫度的\n相對變化\n◆ \n化學物質如辣椒素、薄荷醇，也會刺激\n溫度\n\n受\n器引發熱或清涼的感覺\n配合課本 \nP110", "11": "4\n-2.3 \n痛覺受器\n◆ 為\n感覺神經元末梢\n◆ 當受到刺激，\n如受傷或發炎\n，痛覺受器會將訊號傳入脊髓，再上傳至腦中，使人體感受到疼痛\n，故痛覺代表一種\n警訊\n◆ 若不釐清疾病根源與進行適當治療，僅吃止痛藥緩解症狀，則因病源未除，疼痛就容易持續復發\n配合課本 \nP110\n神經末梢\n（溫度\n受器或\n痛覺受\n器\n）\n毛囊\n巴\n氏小\n體（機械\n受\n器）", "12": "4-2.4 \n機械受器\n◆ 受到\n推\n、\n拉\n或\n壓\n等\n機械力量\n刺激時，便會將環境中或體內機械力的變化轉換成神經訊號傳至大腦\n巴氏小體\n◆ \n位於皮膚\n◆ 包括\n巴氏小體\n、\n聽覺受器\n配合課本 \nP111\n神經末梢\n（溫度\n受器或痛覺受\n器）\n毛囊\n巴\n氏小\n體（\n機械\n受\n器\n）", "13": "4-2.4 \n機械受器\n聽覺受器\n鼓膜\n外耳\n中耳\n內耳\n耳蝸\n◆ \n耳朵的構造\n◆ \n聽覺受器位於耳蝸\n配合課本 \nP111\n認識\n耳的構造與\n功能", "14": "4-2.4 \n機械受器\n耳蝸\n覆膜\n毛細胞\n神經纖維\n淋巴\n聽覺受器\n◆ \n聽覺受器由覆膜、毛細胞\n組成\n◆ \n耳蝸內有淋巴\n配合課本 \nP111\n聽覺\n作用原理", "15": "耳蝸\n外耳\n中耳\n4-2.4 \n機械受器\n◆ \n產生\n聽\n覺的過程\n：\n聲波\n聲波振動耳蝸內的淋巴，淋巴傳遞波動導致覆膜震動而刺激毛\n細胞產生訊號\n淋巴\n覆膜\n毛細胞\n聽神經\n視丘\n大腦聽覺區\n產生聽覺\n配合課本 \nP111", "16": "4-2.5 \n化學受器\n◆ 包括\n味覺受器\n、\n嗅覺受器\n◆ \n味蕾\n：\n由\n支持細胞、多個不同的味細胞組成\n味\n覺受器\n味蕾\n味細胞\n支持細胞\n感覺神經元的樹突\n配合課本 \nP112\n10\n \nµm\n味蕾", "17": "◆ 可偵測食物中不同\n化學分子\n的刺激\n◆ 有\n酸\n、\n甜\n、\n苦\n、\n鹹\n及\n鮮味\n五種味覺\n4-2.5 \n化學受器\n◆ 當特定的味細胞受到特定的化學分子刺激時，會將訊號傳至大腦進而產生特定的味覺\n配合課本 \nP112\n味蕾\n味細胞\n支持細胞\n感覺神經元的樹突\n10\n \nµm\n味蕾", "18": "味蕾\n◆ \n產生味覺的\n過程\n：\n味細胞\n感覺神經\n視丘\n大腦味覺區\n4-2.5 \n化學受器\n味蕾\n味細胞\n支持細胞\n感覺神經元的樹突\n產生味覺\n接受化學分子\n的\n刺激，引起味細胞膜電位的改變，釋出神經傳遞物質\n配合課本 \nP112\n味\n覺\n的機制", "19": "  \n腦力激盪\n味細胞可受酸、甜、苦、鹹及鮮味五種味覺刺激，試問日常飲食中的辣味從何而來\n?\n除了味覺，人類對食物滋味的判斷與感受還\n包括哪些\n感覺作用呢\n?\n配合課本 \nP112\n19\n答\n：\n嚴格來說，辣味並不是一種味覺，辣味不是由味細胞進行辨識，而是熱覺和痛覺共同形成的混合感覺；除了味覺以外，人類對食物滋味的判斷與感受還包括嗅覺與溫覺，故食物的香味可以促進食慾，此外在食用冷、熱食感受到的滋味也會不同。", "20": "嗅球\n神經元細胞本體\n硬骨\n嗅神經\n幹細胞\n嗅細胞\n支持細胞\n4-2.5 \n化學受器\n嗅覺受器\n◆ \n位於鼻腔上方一小塊嗅黏膜中\n◆ 嗅黏膜包括\n支持細胞\n、\n嗅細胞\n、\n幹細胞\n嗅黏膜\n配合課本 \nP113", "21": "◇ \n樹突末梢\n分叉並裸露於鼻腔中\n◇\n 是一種\n特化的神經元\n4-2.5 \n化學受器\n◇ 為嗅覺受器\n嗅細胞\n嗅球\n神經元細胞本體\n硬骨\n嗅神經\n幹細胞\n嗅細胞\n支持細胞\n嗅黏膜\n配合課本 \nP113", "22": "4-2.5 \n化學受器\n支持細胞\n◇ 屬於上皮細胞，可分泌黏液\n嗅球\n神經元細胞本體\n硬骨\n嗅神經\n幹細胞\n嗅細胞\n支持細胞\n幹細胞\n◇ \n每 \n1\n～\n2\n 個\n月\n會\n分裂產生新的嗅細胞取代暴露於環境中，或是因為上呼吸道感染而受損的嗅細胞\n嗅球\n神經元細胞本體\n硬骨\n嗅神經\n幹細胞\n嗅細胞\n支持細胞\n嗅黏膜\n配合課本 \nP113", "23": "嗅\n細胞\n◆ \n產生嗅覺的過程\n：\n嗅神經\n在嗅球轉換下一\n組\n神經元\n大腦嗅覺區\n4-2.5 \n化學受器\n產生\n嗅覺\n細胞膜上的受體可與溶於鼻腔黏液的特定化學分子結合，進而辨識氣味，目前已知可偵測上千種化學分子\n嗅球\n神經元細胞本體\n硬骨\n嗅神經\n幹細胞\n嗅細胞\n支持細胞\n嗅球\n神經元細胞本體\n硬骨\n嗅神經\n幹細胞\n嗅細胞\n支持細胞\n嗅黏膜\n配合課本 \nP113\n嗅覺的機制", "24": "  \nQuestion\n1\n.\n 有關\n人體視網膜上感光細胞的敘述，下列何者正確？ \n(A)\n視桿細胞對光比較敏感，色彩敏銳度\n最高　\n(\nB)\n波長相同的光線刺激綠、藍和紅三種視錐細胞；產生的動作電位頻率\n相同　\n(\nC)\n感光細胞的感光色素蛋白質鑲嵌於感光細胞的細胞膜\n上　\n(\nD)\n視錐細胞和視桿細胞的感光區都具有感光色素蛋白質。\n解答\n：\n(D)\n解析\n：\n(\nA)\n色彩敏銳度是視錐細胞高。\n(B)\n不同種類細胞對相同波長刺激的反應不同。\n(C)\n感光色素蛋白質位於「視盤」上，為已內摺特化的細胞膜，故不再單稱「細胞膜」。\n24", "25": "  \nQuestion\n2\n.\n \n下列\n哪些感覺細胞可接受機械性的刺激\n？　\n(\nA)\n視錐\n細胞　\n(\nB)\n聽覺的毛\n細胞　\n(\nC)\n味\n細胞　\n(\nD)\n皮下的觸覺\n細胞　\n(\nE)\n皮下的壓覺細胞。\n解\n答\n：\n(B)(D)(E)\n解析\n：\n(\nA)\n光受器。\n(C)\n化學受器。\n25", "26": "  \nQuestion\n3\n.\n \n下列\n哪些是由神經細胞特化直接作為受器？　\n(A)\n毛細胞　\n(B)\n味細胞　\n(C)\n嗅細胞　\n(D)\n溫度受器　\n(E)\n痛覺。\n解答\n：\n(C)(D)(E)\n解析\n：\n(A)(B)\n為皮膜細胞特\n化。\n26"}, "lessons": [{"id": "b3-c42-l01", "t": "受器：刺激到知覺的第一站", "sec": "s1", "slide": 1, "sourceSlides": [1], "sourcePages": [1], "src": "原PPT第 1 頁；課本 P108–109", "figSpec": {"image": "PPT01S3"}, "txt": "<ul><li>受器把光、溫度、機械力或化學分子造成的變化，轉換成可由神經系統處理的訊息。</li><li>受器接受刺激、中樞整合訊息、動器完成反應，是不同環節；有刺激不表示必然產生可察覺的知覺。</li><li>本節比較光、溫度、痛覺、機械與化學受器；分類依刺激與構造，不能只依身體部位。</li></ul><p class=\"think\">耳朵與皮膚接受的刺激不同，為什麼都可能有機械受器？</p><div class=\"ex\"><h4>從刺激到反應</h4><p>環境變動造成<b>刺激</b>。動物用不同的<b>感覺受器</b>接受刺激，由神經元傳遞訊號；訊號傳到中樞神經系統後，依刺激種類與強弱整合，最後由<b>動器</b>產生反應或行為。</p></div><div class=\"ex\"><h4>本節五類受器</h4><ul><li>4-2.1 光受器</li><li>4-2.2 溫度受器</li><li>4-2.3 痛覺受器</li><li>4-2.4 機械受器</li><li>4-2.5 化學受器</li></ul></div>", "tb": [["BOOK1", "P108 完整課本頁"]]}, {"id": "b3-c42-l02", "t": "眼球：光從哪裡進入？", "sec": "s1", "slide": 2, "sourceSlides": [2], "sourcePages": [2], "src": "原PPT第 2 頁；課本 P108–109", "figSpec": {"image": "eye"}, "txt": "<ul><li>角膜與水晶體參與屈光，把光聚焦到視網膜；角膜是主要屈光構造，水晶體可調節曲度。</li><li>虹膜改變瞳孔大小，控制進光量；瞳孔是開口，不能當成感光細胞。</li><li>光受器位於視網膜，視神經則傳出訊息；水晶體沒有代替視網膜感光。</li></ul><p class=\"think\">調焦與調整進光量各涉及哪個構造？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/14-1-sensory-perception\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>光線進入眼球的路徑</h4><p>人眼構造中，光線依序通過：<b>角膜 → 虹膜（瞳孔）→ 水晶體 →</b> 到達後方的<b>視網膜</b>。</p></div><div class=\"ex\"><h4>各構造的角色</h4><p>角膜與水晶體負責折射、聚焦；虹膜調節進光量；視網膜上有光受器，把光轉換成神經訊號。</p></div>", "tb": [["BOOK2", "P109 完整課本頁"]]}, {"id": "b3-c42-l03", "t": "視網膜：兩種箭頭不是同方向", "sec": "s1", "slide": 3, "sourceSlides": [3], "sourcePages": [], "src": "原PPT第 3 頁；課本 P108–109", "figSpec": {"image": "eyeFull"}, "txt": "<ul><li>沿黃色箭頭追蹤光：先穿過多種神經元所在區，再抵達靠色素上皮的光受器。</li><li>沿紅色箭頭追蹤訊息：光受器影響後續神經元，訊息再由視神經纖維傳出。</li><li>圖中光線與神經訊息方向相反；不要把接近入射光的細胞直接當成最先感光者。</li></ul><p class=\"think\">若只看光線方向，會把視神經纖維與光受器的角色搞混嗎？</p><div class=\"ex\"><h4>視網膜的層次（圖 4－11b）</h4><p>視網膜由光受器、多種神經元與視神經纖維等組成。</p></div><div class=\"ex\"><h4>兩個方向不同</h4><ul><li><b>光的前進方向</b>：先穿過視神經纖維與多種神經元，最後到達後方的光受器。</li><li><b>神經衝動傳導方向</b>：從光受器 → 多種神經元 → 視神經纖維（朝眼球內側傳出）。</li></ul></div><div class=\"ex\"><h4>小提醒</h4><p>兩種箭頭方向相反，讀圖時要分清楚。感光區在光受器細胞靠近色素上皮細胞的一端。</p></div>", "tb": []}, {"id": "b3-c42-l04", "t": "視桿細胞：微光下的明暗", "sec": "s1", "slide": 4, "sourceSlides": [4, 5], "sourcePages": [], "src": "原PPT第 4–5 頁；課本 P108–109", "figSpec": {"image": "rods"}, "txt": "<ul><li>視桿與視錐都是特化神經元，圖中感光區域與細胞核分開。</li><li>視桿對弱光較敏感，適合暗室與夜間的明暗判讀；無法提供三色錐系統的色覺辨識。</li><li>對光敏感與影像解析度不是同一件事；低照度下看得見不表示可精確辨色。</li></ul><p class=\"think\">夜裡能察覺輪廓，卻難辨花瓣顏色，該怎麼解釋？</p><div class=\"ex\"><h4>光受器</h4><p>視網膜上的光受器可偵測光的強弱與波長，並轉換成神經訊號。有<b>視桿細胞</b>與<b>視錐細胞</b>兩種，都是特化的神經元。</p></div><div class=\"ex\"><h4>視桿細胞</h4><ul><li>對光的敏感度<b>高</b>，即使光線很弱也能活化。</li><li>負責<b>明暗視覺</b>，可偵測夜間或暗室的微弱光線。</li><li><b>無法辨色</b>；主要察覺物體大小、移動。</li></ul></div>", "tb": []}, {"id": "b3-c42-l05", "t": "視錐細胞：色覺來自相對反應", "sec": "s1", "slide": 6, "sourceSlides": [6, 7], "sourcePages": [], "src": "原PPT第 6–7 頁；課本 P108–109", "figSpec": {"image": "PPT07S3"}, "txt": "<ul><li>視錐通常需要較強照明，能支持色覺與較精細的影像判讀。</li><li>教材稱藍、綠、紅錐；三類對波長的敏感範圍重疊，並非每類只接收單一顏色。</li><li>相同波長對三類的反應不必相同；腦比較相對活動形成色覺。</li></ul><p class=\"think\">只知道一類視錐變化，能把刺激波長與光量完全分開嗎？</p><div class=\"scope-note\"><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK11059/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>視錐細胞</h4><ul><li>分為<b>藍錐、綠錐、紅錐</b>三種，各自偵測特定範圍的波長。</li><li>需要<b>較強的光線</b>才能活化。</li><li>負責色覺，對影像的敏銳度很高。</li></ul></div><div class=\"ex\"><h4>兩種光受器比較</h4><ul><li>數目：視桿多、視錐少。</li><li>光量敏感度：視桿高、視錐低。</li><li>辨色力：視桿無法分辨顏色、視錐可以。</li><li>影像敏銳度：視桿弱、視錐強。</li></ul></div><div class=\"ex\"><h4>色覺怎麼來</h4><p>色覺來自三種視錐細胞反應強弱的<b>相對比較</b>，由大腦處理後成為色彩知覺。</p></div>", "tb": []}, {"id": "b3-c42-l06", "t": "黃斑、中央窩與盲點", "sec": "s1", "slide": 8, "sourceSlides": [8], "sourcePages": [], "src": "原PPT第 8 頁；課本 P108–109", "figSpec": {"image": "PPT08S3"}, "txt": "<ul><li>黃斑是視網膜後方區域，中央窩位於其中央，視錐密集而視覺解析度佳。</li><li>盲點是視神經纖維傳出眼球處，缺少視桿與視錐，因此不能在此感光。</li><li>中央窩「解析度佳」與視桿「弱光敏感」指不同能力，不可混稱最敏感。</li></ul><p class=\"think\">把小字影像落在中央窩與盲點，預期結果有何不同？</p><div class=\"scope-note\">中央窩與黃斑不是相同大小的構造；教材中央窩指視錐密集區，不把整片黃斑說成只有視錐。</div><div class=\"ex\"><h4>三個位置</h4><ul><li><b>黃斑</b>：視網膜正後方的橢圓形黃色區域。</li><li><b>中央窩</b>：黃斑中央的凹陷，<b>視錐細胞最密集</b>，因此視覺解析度最佳。</li><li><b>盲點</b>：視神經纖維傳出視網膜的區域，沒有視桿與視錐細胞，不具感光作用。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>看東西時要「正對」目標，是讓影像落在中央窩；盲點是因為這裡沒有光受器，並不是眼睛壞掉。</p></div>", "tb": []}, {"id": "b3-c42-l07", "t": "視覺路徑：先轉換，再由腦辨識", "sec": "s1", "slide": 9, "sourceSlides": [9], "sourcePages": [], "src": "原PPT第 9 頁；課本 P108–109", "figSpec": {"image": "PPT09S3"}, "txt": "<ul><li>光受器產生膜電位改變，透過化學訊息影響視網膜其他神經元。</li><li>視神經是神經纖維集合，由盲點出眼球；本教材路徑經視丘到大腦視覺區。</li><li>視網膜先處理訊息，大腦形成知覺；不是光線沿視神經一路照入大腦。</li></ul><p class=\"think\">視神經受影響與水晶體混濁，訊息鏈中受影響的環節相同嗎？</p><div class=\"ex\"><h4>視覺的產生</h4><p>光 → 光受器（視桿、視錐）→ 視網膜神經元 → 視神經 → 經盲點離開眼球 → 視丘 → 大腦視覺區 → 產生視覺。</p></div><div class=\"ex\"><h4>光受器做了什麼</h4><p>光受器接受光刺激後，膜電位改變，並釋出化學物質，把訊息傳給下一級神經細胞。</p></div><div class=\"ex\"><h4>重點</h4><p>視覺是由大腦形成的知覺。視神經是神經纖維的集合，傳送的是神經訊息，不是光。</p></div>", "tb": []}, {"id": "b3-c42-l08", "t": "延伸：照光為何可使光受器過極化？", "sec": "s1", "slide": 9, "sourceSlides": [9], "sourcePages": [], "src": "原PPT第 9 頁；課本 P108–109", "figSpec": {"image": "rods"}, "txt": "<ul><li>脊椎動物視桿、視錐以漸變電位反應，不能說每個光受器都以動作電位頻率編碼。</li><li>暗中cGMP維持部分陽離子通道開啟；照光後cGMP下降、通道關閉，光受器過極化。</li><li>光受器的麩胺酸釋放減少；後續雙極細胞反應依受體與迴路而異，不能一律說全部被解除抑制。</li></ul><p class=\"think\">為何「收到刺激」不一定等於去極化？</p><div class=\"scope-note\">承接原網頁機制延伸；課本只要求膜電位改變，cGMP與ON/OFF迴路不冒稱原PPT新增內容。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK10806/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>延伸：照光與過極化</h4><p>視桿、視錐在黑暗中處於較為去極化的狀態；照光後反而<b>過極化</b>。</p></div><div class=\"ex\"><h4>機制（延伸）</h4><ul><li>黑暗中，細胞內 cGMP 維持部分陽離子通道開啟。</li><li>照光後，cGMP 下降，通道關閉，膜電位下降（過極化）。</li><li>光受器釋出的神經傳遞物減少，影響後續的雙極細胞。</li></ul></div><div class=\"ex\"><h4>觀念</h4><p>「收到刺激」不一定就是去極化；課本只要求知道光刺激會讓膜電位改變。</p></div>", "tb": []}, {"id": "b3-c42-l09", "t": "溫度受器：相對變化與身體狀態", "sec": "s2", "slide": 10, "sourceSlides": [10], "sourcePages": [3], "src": "原PPT第 10 頁；課本 P110", "figSpec": {"image": "skin"}, "txt": "<ul><li>溫度受器包括感覺神經元末梢，分布於體表與體內；教材用冷覺、熱覺兩類說明。</li><li>冷熱感與當下溫度、溫度變化及先前適應有關，並非只與某個固定體表溫度比較。</li><li>有些體內溫度訊息參與恆定，未必成為每次都能察覺的皮膚感覺。</li></ul><p class=\"think\">同一杯溫水，先碰冷水或溫水後的感覺是否必然相同？</p><div class=\"scope-note\">原課文「低於體表活化冷覺、高於體表活化熱覺」保留，當作簡化情境；不外推成所有溫度通道的唯一切換點。</div><div class=\"ex\"><h4>溫度受器</h4><p>位於體內與體表皮膚，是<b>感覺神經元的末梢</b>（圖 4－12），依刺激類型分為<b>熱覺</b>與<b>冷覺</b>兩類。</p></div><div class=\"ex\"><h4>感測的是相對變化</h4><ul><li>外界溫度低於體表 → 活化<b>冷覺受器</b>。</li><li>外界溫度高於體表 → 活化<b>熱覺受器</b>。</li></ul></div><div class=\"ex\"><h4>小提醒</h4><p>溫度受器感測的是「相對於體表的變化」，不是某個固定的溫度；身體狀態不同，感覺也不同。</p></div>", "tb": [["BOOK3", "P110 完整課本頁"]]}, {"id": "b3-c42-l10", "t": "辣與涼：化學分子也可啟動溫感通道", "sec": "s2", "slide": 10, "sourceSlides": [10], "sourcePages": [], "src": "原PPT第 10 頁；課本 P110", "figSpec": {"image": "PPT10S3"}, "txt": "<ul><li>辣椒素可啟動與熱、傷害性刺激相關的TRPV1通道；薄荷醇可啟動冷敏感TRPM8。</li><li>分子引起灼熱或清涼感，不代表食物或組織實際溫度必定升高或降低。</li><li>刺激可按化學來源描述，也可按參與的溫痛感知系統描述；兩種分類尺度不要混用。</li></ul><p class=\"think\">要檢驗薄荷使人覺得涼，為何須同時量溫度與記錄感覺？</p><div class=\"scope-note\">通道名稱為機制補充；不把教材的冷、熱兩類等同只有兩種分子受器。<a href=\"https://www.nobelprize.org/prizes/medicine/2021/advanced-information/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>辣與涼</h4><p>有些化學物質也會刺激溫度受器：<b>辣椒素</b>引起熱覺，<b>薄荷醇</b>引起清涼感。</p></div><div class=\"ex\"><h4>延伸</h4><ul><li>辣椒素可啟動與熱、傷害性刺激相關的 TRPV1 通道；薄荷醇可啟動冷敏感的 TRPM8 通道。</li><li>這些分子引起灼熱或清涼的感覺，並不代表食物或組織的實際溫度真的升高或降低。</li></ul></div><div class=\"ex\"><h4>對照</h4><p>要驗證「薄荷使人覺得涼」，需要同時量測溫度和記錄受試者的感覺，才能分清兩者。</p></div>", "tb": []}, {"id": "b3-c42-l11", "t": "痛覺：傷害訊號與主觀經驗分開", "sec": "s2", "slide": 11, "sourceSlides": [11], "sourcePages": [], "src": "原PPT第 11 頁；課本 P110", "figSpec": {"image": "skin"}, "txt": "<ul><li>傷害性感受末梢可回應強烈機械、熱或化學刺激；受傷與發炎可促進訊息傳入。</li><li>體幹與肢體典型路徑經脊髓上傳至腦形成疼痛；頭面部的路徑則涉及三叉神經等。</li><li>疼痛有保護意義，但主觀疼痛強弱不等於損傷程度；也不能說所有痛覺都沒有適應或調節。</li></ul><p class=\"think\">快速縮手與意識到疼痛，在哪些層級可能分開處理？</p><div class=\"scope-note\">原文的治療段落完整保留供教材閱讀；本卡聚焦生理機制，不把疼痛單一指標當作疾病判斷。</div><div class=\"ex\"><h4>痛覺受器</h4><p>也是<b>感覺神經元的末梢</b>。受傷或發炎時受到刺激，把訊號傳入<b>脊髓</b>，再上傳到腦，產生痛覺。</p></div><div class=\"ex\"><h4>痛覺的意義</h4><p>痛覺是一種<b>警訊</b>，提醒身體哪裡出了問題。只吃止痛藥緩解症狀、沒處理病因，疼痛容易復發，病情也可能加重。</p></div><div class=\"ex\"><h4>延伸觀念</h4><p>受器傳入的是傷害訊號；疼痛的主觀感受由腦整合形成，兩者不完全相同。</p></div>", "tb": []}, {"id": "b3-c42-l12", "t": "巴氏小體：構造把力量轉成訊息", "sec": "s3", "slide": 12, "sourceSlides": [12], "sourcePages": [4], "src": "原PPT第 12 頁；課本 P111", "figSpec": {"image": "pacinian"}, "txt": "<ul><li>巴氏小體是有層狀包囊的感覺神經末梢，感受機械力量與振動變化。</li><li>照片箭頭指出小體，尺度為30 µm；文字抽取誤作mm時，以原圖尺度為準。</li><li>機械受器不限皮膚，耳內毛細胞也以構造變形接受刺激。</li></ul><p class=\"think\">顯微照片中的同心層與箭頭，提供了什麼判讀證據？</p><div class=\"scope-note\">巴氏小體對快速變化及振動敏感；不能把它說成所有輕觸或持續壓力的唯一受器。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/14-1-sensory-perception\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>機械受器</h4><p>皮膚下分布許多機械受器，如<b>巴氏小體</b>（圖 4－12、4－13）。受到推、拉、壓等機械力量時，把力的變化<b>轉換成神經訊號</b>傳到大腦。</p></div><div class=\"ex\"><h4>機械受器的例子</h4><ul><li>皮下的觸覺、壓覺細胞（如巴氏小體）。</li><li>聽覺受器：耳蝸中的毛細胞。</li></ul></div><div class=\"ex\"><h4>構造的意義</h4><p>巴氏小體的層狀包覆構造，讓力量能被神經末梢感受。重點是把機械力量轉成訊號。</p></div>", "tb": [["BOOK4", "P111 完整課本頁"]]}, {"id": "b3-c42-l13", "t": "耳的構造：外耳、中耳、內耳", "sec": "s3", "slide": 13, "sourceSlides": [13], "sourcePages": [], "src": "原PPT第 13 頁；課本 P111", "figSpec": {"image": "PPT13S3"}, "txt": "<ul><li>外耳接收聲波，鼓膜振動再傳至中耳聽小骨。</li><li>中耳把機械振動耦合到內耳液體；聽覺受器位於耳蝸。</li><li>鼓膜、聽小骨、耳蝸毛細胞與聽神經功能不同，鼓膜不是直接產生知覺的中樞。</li></ul><p class=\"think\">若鼓膜仍會振動，能直接推出毛細胞與聽神經一定正常嗎？</p><div class=\"ex\"><h4>耳朵的三部分</h4><p>耳朵分為<b>外耳、中耳、內耳</b>；聽覺受器位於內耳的<b>耳蝸</b>。</p></div><div class=\"ex\"><h4>聲音進入的路徑</h4><p>聲波 → 外耳 → 鼓膜 → 中耳 → 內耳（耳蝸）。</p></div>", "tb": []}, {"id": "b3-c42-l14", "t": "毛細胞：偏折才是受器的刺激", "sec": "s3", "slide": 14, "sourceSlides": [14], "sourcePages": [], "src": "原PPT第 14 頁；課本 P111", "figSpec": {"image": "ear"}, "txt": "<ul><li>耳蝸液體波動帶動基底膜，毛細胞纖毛相對覆膜偏折，促進機械敏感通道的變化。</li><li>毛細胞是特化感覺上皮細胞；受器電位影響傳遞物釋放，再作用於感覺神經。</li><li>覆膜是參與機械耦合的結構，不是能自己發出神經訊號的細胞。</li></ul><p class=\"think\">毛細胞與傳入神經元之間，還需要哪種傳訊環節？</p><div class=\"scope-note\">原PPT「覆膜、毛細胞組成聽覺受器」為整組構造的描述；真正轉換訊號的細胞為毛細胞。<a href=\"https://www.nidcd.nih.gov/health/how-do-we-hear\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>聽覺受器的構造</h4><p>由<b>覆膜</b>與<b>毛細胞</b>組成。耳蝸內充滿<b>淋巴</b>。</p></div><div class=\"ex\"><h4>怎麼被刺激</h4><p>聲波使耳蝸內的淋巴波動 → 覆膜震動 → 毛細胞受覆膜刺激而偏折，產生訊號。</p></div><div class=\"ex\"><h4>小提醒</h4><p>毛細胞是特化的上皮細胞，不是神經元；它產生訊號後，由與它相連的神經纖維傳到大腦。</p></div>", "tb": []}, {"id": "b3-c42-l15", "t": "聽覺路徑：空氣振動到神經訊息", "sec": "s3", "slide": 15, "sourceSlides": [15], "sourcePages": [], "src": "原PPT第 15 頁；課本 P111", "figSpec": {"image": "PPT15S3"}, "txt": "<ul><li>聲波→外耳→鼓膜與中耳→耳蝸液體及受器構造→毛細胞→聽神經。</li><li>訊息經腦幹多個中繼站、視丘，再到大腦聽覺相關皮質；教材圖是精簡路徑。</li><li>聲波與神經訊息的物理形式不同，不能說空氣振動沿神經直接進腦。</li></ul><p class=\"think\">把鼓膜振動與聽神經電訊號分別量測，能幫助定位哪些環節？</p><div class=\"ex\"><h4>聽覺的產生</h4><p>聲波 → 外耳 → 中耳 → 耳蝸內的淋巴波動 → 覆膜震動 → 毛細胞產生訊號 → 聽神經 → 視丘 → 大腦聽覺區 → 產生聽覺。</p></div><div class=\"ex\"><h4>重點</h4><p>聲音在不同構造中，形式不斷轉換：空氣振動 → 淋巴波動 → 神經訊號。</p></div>", "tb": []}, {"id": "b3-c42-l16", "t": "延伸：音高與音量不是同一變量", "sec": "s3", "slide": 15, "sourceSlides": [15], "sourcePages": [], "src": "原PPT第 15 頁；課本 P111", "figSpec": {"image": "ear"}, "txt": "<ul><li>耳蝸基底膜不同部位對頻率的反應不同：近基部偏高頻、近頂部偏低頻。</li><li>位置編碼協助辨識音高；音量增強還涉及活動強度與更多受器參與。</li><li>同一音高可有不同音量，不把頻率與聲波振幅互換。</li></ul><p class=\"think\">同為400 Hz，音量變大是否表示音高必定升高？</p><div class=\"scope-note\">承接原網頁頻率題延伸；來源P111未完整講述基底膜調諧，不以P111冒充此段全部內容。<a href=\"https://www.nidcd.nih.gov/health/how-do-we-hear\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>延伸：音高與音量</h4><p>音高與聲波頻率有關，音量與振幅有關，兩者不同。</p></div><div class=\"ex\"><h4>延伸機制</h4><ul><li>耳蝸內不同位置對不同頻率反應不同：靠近基部偏高頻、靠近頂端偏低頻。</li><li>音量增強時，受器活動增強，更多受器參與。</li></ul></div><div class=\"ex\"><h4>例子</h4><p>同為 400 Hz 的聲音，音量變大並不代表音高升高。</p></div>", "tb": []}, {"id": "b3-c42-l17", "t": "延伸：前庭受器與平衡", "sec": "s3", "slide": 13, "sourceSlides": [13], "sourcePages": [], "src": "原PPT第 13 頁；課本 P111", "figSpec": {"image": "PPT13S3"}, "txt": "<ul><li>前庭系統以毛細胞偵測頭部運動；半規管主要感受旋轉，橢圓囊與球囊感受直線加速度及重力。</li><li>半規管內有液體，前庭囊有耳石參與作用；不要把耳石移到所有半規管內。</li><li>前庭訊息與視覺、本體覺共同支持姿勢與眼動；不等同耳蝸的音高判讀。</li></ul><p class=\"think\">閉眼站立時，還有哪些訊息來源能協助平衡？</p><div class=\"scope-note\">保留原網頁前庭概念作延伸；本次課本/PPT主講聽覺，圖是耳構造定位，非前庭受器完整原圖。<a href=\"https://www.nidcd.nih.gov/health/balance-disorders\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>延伸：前庭與平衡</h4><p>內耳除了耳蝸，還有<b>前庭系統</b>，也用毛細胞偵測頭部的運動。</p></div><div class=\"ex\"><h4>分工</h4><ul><li><b>半規管</b>：主要感受旋轉。</li><li><b>橢圓囊與球囊</b>：感受直線加速度與重力，內有耳石參與。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>前庭訊息與視覺、本體覺共同支持姿勢與眼動，不等同於耳蝸對音高的判讀。本卡超出本節課本內容，為延伸。</p></div>", "tb": []}, {"id": "b3-c42-l18", "t": "味蕾：一個構造包含多種細胞", "sec": "s4", "slide": 16, "sourceSlides": [16], "sourcePages": [5], "src": "原PPT第 16 頁；課本 P112–113", "figSpec": {"image": "taste"}, "txt": "<ul><li>味蕾包含多個味細胞及支持細胞；圖4-15a示意構造，b為顯微染色照片。</li><li>食物分子先溶於唾液，經味孔接觸受器細胞；不是整塊食物進入味蕾。</li><li>味細胞是特化上皮細胞，和接收其訊息的感覺神經元樹突不同。</li></ul><p class=\"think\">如何從引線分清味細胞、支持細胞與感覺神經元？</p><div class=\"ex\"><h4>化學受器</h4><p>能偵測特定化學分子，例如味細胞與嗅細胞。</p></div><div class=\"ex\"><h4>味蕾</h4><p>位於舌頭，由<b>支持細胞</b>與<b>多個不同的味細胞</b>組成。味細胞接受食物中的化學分子；味細胞下方連接感覺神經元的樹突。</p></div><div class=\"ex\"><h4>小提醒</h4><p>一個味蕾包含多種細胞，而不是只有一種。</p></div>", "tb": [["BOOK5", "P112 完整課本頁"]]}, {"id": "b3-c42-l19", "t": "五種味覺：不是五塊舌頭區域", "sec": "s4", "slide": 17, "sourceSlides": [17], "sourcePages": [], "src": "原PPT第 17 頁；課本 P112–113", "figSpec": {"image": "taste"}, "txt": "<ul><li>本教材五種基本味覺為酸、甜、苦、鹹、鮮；辣不是第六種基本味覺。</li><li>不同味細胞辨識不同化學刺激，不把一個味蕾說成只能辨一種味。</li><li>多種味覺細胞分布於不同含味蕾部位，不能用舌尖只甜、舌根只苦的排他地圖。</li></ul><p class=\"think\">若同一部位能察覺甜與鹹，會反駁哪種舌頭地圖？</p><div class=\"scope-note\"><a href=\"https://www.nidcd.nih.gov/health/taste-disorders\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>五種味覺</h4><p>味細胞可偵測<b>酸、甜、苦、鹹、鮮</b>五種味覺。</p></div><div class=\"ex\"><h4>特定對應</h4><p>特定的味細胞受到特定的化學分子刺激時，把訊號傳到大腦，產生特定的味覺。</p></div><div class=\"ex\"><h4>常見誤解</h4><p>舌頭並不是分成五塊「酸甜苦鹹鮮區」；各種味覺的受器分布在舌上各處的味蕾中。</p></div>", "tb": []}, {"id": "b3-c42-l20", "t": "味覺路徑：受器電位再接力", "sec": "s4", "slide": 18, "sourceSlides": [18], "sourcePages": [], "src": "原PPT第 18 頁；課本 P112–113", "figSpec": {"image": "PPT18S3"}, "txt": "<ul><li>味細胞受刺激產生電位變化與傳訊，感覺神經把訊息帶往中樞。</li><li>本教材路徑經視丘至大腦味覺區；完整路徑也有腦幹中繼。</li><li>延伸機制：酸、鹹與離子通道相關；甜、苦、鮮常透過G蛋白受體，不能說所有味覺只用同一機制。</li></ul><p class=\"think\">味細胞沒有長軸突到大腦，訊息如何继續傳遞？</p><div class=\"scope-note\">離子通道／G蛋白受體為原網頁延伸的精確化；不把味覺與嗅覺共通特徵寫成「全部使用G蛋白受體」。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/14-1-sensory-perception\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>味覺的產生</h4><p>化學分子 → 味細胞膜電位改變 → 釋出神經傳遞物 → 感覺神經 → 視丘 → 大腦味覺區 → 產生味覺。</p></div><div class=\"ex\"><h4>重點</h4><p>味細胞不是神經元，要靠神經傳遞物把訊號交給感覺神經元，所以是「受器電位再接力」。</p></div>", "tb": []}, {"id": "b3-c42-l21", "t": "食物風味：味、嗅、溫痛與質地", "sec": "s4", "slide": 19, "sourceSlides": [19], "sourcePages": [], "src": "原PPT第 19 頁；課本 P112–113", "figSpec": {"image": "PPT19S3"}, "txt": "<ul><li>辣椒素的灼熱感涉及溫痛感知，薄荷的涼感亦不同於五種基本味覺。</li><li>風味結合味覺、嗅覺、冷熱與口腔質地；香味可經鼻腔或口腔後方的通路到嗅覺系統。</li><li>比較鼻塞前後的風味，不等同證明甜味受器已受損；先區分測量的感覺。</li></ul><p class=\"think\">要比較嗅覺對風味的貢獻，哪些條件應保持相同？</p><div class=\"scope-note\">原腦力激盪全文及參考答保留；新討論不要求吃辣、極熱／極冷或刺激性物質。<a href=\"https://www.nidcd.nih.gov/health/taste-disorders\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>腦力激盪：辣味從哪裡來</h4><p>嚴格來說，<b>辣味不是味覺</b>，不是由味細胞辨識，而是<b>熱覺與痛覺共同形成的混合感覺</b>。</p></div><div class=\"ex\"><h4>食物滋味的組成</h4><ul><li>味覺（酸甜苦鹹鮮）。</li><li><b>嗅覺</b>：食物的香味可促進食慾。</li><li><b>溫覺</b>：吃冷食、熱食，滋味也不同。</li><li>另外還有口腔對質地的感覺。</li></ul></div><div class=\"ex\"><h4>小提醒</h4><p>鼻塞時覺得食物沒味道，是因為嗅覺貢獻減少；不是味覺受器壞了。要比較嗅覺的貢獻，其他條件要保持相同。</p></div>", "tb": []}, {"id": "b3-c42-l22", "t": "嗅黏膜：嗅細胞本身是神經元", "sec": "s4", "slide": 20, "sourceSlides": [20, 21], "sourcePages": [6], "src": "原PPT第 20–21 頁；課本 P112–113", "figSpec": {"image": "smell"}, "txt": "<ul><li>嗅黏膜位於鼻腔上方，包含嗅細胞、支持細胞與幹細胞。</li><li>嗅細胞是特化神經元，樹突末端的纖毛浸在黏液中，與溶解的氣味分子接觸。</li><li>嗅細胞軸突形成嗅神經進入嗅球；支持細胞不等同氣味訊號的傳入神經元。</li></ul><p class=\"think\">為何「裸露於鼻腔」不能解讀為受器完全乾燥、沒有黏液？</p><div class=\"ex\"><h4>嗅覺受器</h4><p>位於鼻腔上方一小塊稱為<b>嗅黏膜</b>的上皮中，由<b>嗅細胞、支持細胞、幹細胞</b>組成。</p></div><div class=\"ex\"><h4>嗅細胞</h4><ul><li>是一種特化的<b>神經元</b>。</li><li>樹突末梢分叉並裸露在鼻腔中。</li><li>樹突細胞膜上的受體，可與溶於鼻黏液的特定化學分子結合，辨識氣味；已知可偵測上千種化學分子。</li></ul></div><div class=\"ex\"><h4>支持細胞</h4><p>屬於上皮細胞，分泌黏液。</p></div>", "tb": [["BOOK6", "P113 完整課本頁"]]}, {"id": "b3-c42-l23", "t": "嗅細胞更新：時間不是每顆同一倒數", "sec": "s4", "slide": 22, "sourceSlides": [22], "sourcePages": [], "src": "原PPT第 22 頁；課本 P112–113", "figSpec": {"image": "smell"}, "txt": "<ul><li>支持細胞與相關腺體協助上皮環境，黏液提供分子接觸受器的介質。</li><li>幹細胞可形成新的嗅細胞；課本1–2個月是概略教材描述，不是每顆細胞精確相同的壽命。</li><li>更新能力不等同感染或損傷後一定完全恢復；本節辨認細胞角色。</li></ul><p class=\"think\">幹細胞與嗅細胞的功能，為何不能互換？</p><div class=\"ex\"><h4>嗅細胞會更新</h4><p>嗅細胞直接暴露在環境中，容易受損（例如上呼吸道感染）。</p></div><div class=\"ex\"><h4>幹細胞</h4><p>每 <b>1～2 個月</b>就分裂產生新的嗅細胞，取代舊的或受損的嗅細胞。</p></div><div class=\"ex\"><h4>小提醒</h4><p>「1～2 個月」是整體的更新週期，不是每個嗅細胞都在固定時間同時換新。</p></div>", "tb": []}, {"id": "b3-c42-l24", "t": "嗅覺路徑：「不經視丘」的範圍", "sec": "s4", "slide": 23, "sourceSlides": [23], "sourcePages": [], "src": "原PPT第 23 頁；課本 P112–113", "figSpec": {"image": "PPT23S3"}, "txt": "<ul><li>氣味分子→嗅細胞受體與電位變化→嗅神經→嗅球中繼→初級嗅覺皮質。</li><li>初級嗅覺路徑不需先經視丘中繼，是教材與其他典型感覺路徑的對照。</li><li>高階嗅覺處理仍可與視丘互動；不能說嗅覺訊息在所有階段完全不涉及視丘。</li></ul><p class=\"think\">把「不需先經」改成「永遠不經」，會多加哪個未受支持的主張？</p><div class=\"scope-note\"><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC2706104/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>嗅覺的產生</h4><p>嗅細胞受體結合氣味分子 → 訊號經<b>嗅神經</b>進入<b>嗅球</b>並形成突觸 → 傳到下一組神經元 → 大腦嗅覺區 → 產生嗅覺。</p></div><div class=\"ex\"><h4>特色</h4><p>嗅覺訊息<b>不經視丘</b>，直接傳到大腦嗅覺區；其他感覺（除嗅覺外）都要先經視丘中繼。</p></div>", "tb": []}, {"id": "b3-c42-l25", "t": "原題一：視盤膜與感光電位的語意", "sec": "s5", "slide": 24, "sourceSlides": [24], "sourcePages": [], "src": "原PPT第 24 頁；課本 P108–113／原題討論", "figSpec": {"image": "PPT24S3"}, "txt": "<ul><li>原PPT答案D完整保留：視桿、視錐的感光區都有感光色素。</li><li>原B用動作電位頻率描述視錐，不精確；光受器以漸變電位反應，三類相對敏感度不同。</li><li>原C與解析把「視盤膜」和「細胞膜」分開，但視盤由膜特化形成，視錐視盤仍可與外段質膜連續，措辭有歧義。</li></ul><p class=\"think\">改寫C時應如何指明外段視盤、一般質膜與細胞類型？</p><div class=\"scope-note\">原題、四選項、答案D及解析均未改寫；本版設為證據討論，不據歧義C強制判錯。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK11522/pdf/Bookshelf_NBK11522.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>原題一</h4><p>有關人體視網膜上感光細胞的敘述，下列何者正確？</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 視桿細胞對光比較敏感，色彩敏銳度最高</li><li>(B) 波長相同的光線刺激綠、藍和紅三種視錐細胞，產生的動作電位頻率相同</li><li>(C) 感光細胞的感光色素蛋白質鑲嵌於感光細胞的細胞膜上</li><li>(D) 視錐細胞和視桿細胞的感光區都具有感光色素蛋白質</li></ul></div><div class=\"ex\"><h4>答案：(D)</h4><p></p></div><div class=\"ex\"><h4>其他選項</h4><ul><li>(A) 色彩敏銳度高的是<b>視錐細胞</b>。</li><li>(B) 不同種視錐細胞對相同波長的反應不同。</li><li>(C) 原解析：感光色素蛋白質位於「視盤」，視盤是內摺特化的細胞膜，所以不再單稱「細胞膜」。（此選項措辭有歧義，請教師確認。）</li></ul></div>", "tb": []}, {"id": "b3-c42-l26", "t": "原題二、三：刺激類型與細胞本質", "sec": "s5", "slide": 25, "sourceSlides": [25, 26], "sourcePages": [], "src": "原PPT第 25–26 頁；課本 P108–113／原題討論", "figSpec": {"image": "PPT26S3"}, "txt": "<ul><li>原題二答案B、D、E：聽覺毛細胞、皮下觸覺及壓覺細胞接受機械刺激。</li><li>原題三答案C、D、E：嗅細胞及溫度、痛覺神經末梢屬神經元直接特化。</li><li>毛細胞與味細胞是特化上皮細胞；光受器也屬特化神經元，但未出現在原題三選項中。</li></ul><p class=\"think\">按接受刺激分類與按細胞來源分類，會得到相同分組嗎？</p><div class=\"ex\"><h4>原題二（多選）</h4><p>下列哪些感覺細胞可接受機械性的刺激？(A) 視錐細胞 (B) 聽覺的毛細胞 (C) 味細胞 (D) 皮下的觸覺細胞 (E) 皮下的壓覺細胞</p></div><div class=\"ex\"><h4>答案：(B)(D)(E)</h4><p>(A) 是光受器，(C) 是化學受器。</p></div><div class=\"ex\"><h4>原題三（多選）</h4><p>下列哪些是由神經細胞特化直接作為受器？(A) 毛細胞 (B) 味細胞 (C) 嗅細胞 (D) 溫度受器 (E) 痛覺</p></div><div class=\"ex\"><h4>答案：(C)(D)(E)</h4><p>(A)(B) 是上皮細胞特化。嗅細胞本身是神經元，溫度受器與痛覺受器是感覺神經元的末梢。</p></div><div class=\"ex\"><h4>分類尺度</h4><p>「依接受的刺激分類」和「依細胞來源分類」是兩種不同的分法，分組結果不同。</p></div>", "tb": []}], "questions": [{"t": "刺激能量分類", "q": "每類放兩個例子，同類兩格可交換。", "learn": 0, "tag": "cell", "hint": "按受器接受的刺激分類，不按器官名稱分類。", "why": "光受器轉換光；毛細胞與巴氏小體接受機械作用；味與嗅辨識化學分子。", "sub": "原PPT第 1 頁；課本 P108–109", "refs": [{"src": "PPT01S3", "cap": "教材來源圖"}], "legacyQuestion": 2, "kind": "drag", "slots": [{"id": "g0s0", "label": "光刺激", "group": 0}, {"id": "g0s1", "label": "光刺激", "group": 0}, {"id": "g1s0", "label": "機械力", "group": 1}, {"id": "g1s1", "label": "機械力", "group": 1}, {"id": "g2s0", "label": "化學分子", "group": 2}, {"id": "g2s1", "label": "化學分子", "group": 2}], "pieces": [{"id": "ag0s0", "label": "視桿察覺微光", "group": 0}, {"id": "ag0s1", "label": "視錐參與辨色", "group": 0}, {"id": "ag1s0", "label": "耳蝸毛細胞受偏折", "group": 1}, {"id": "ag1s1", "label": "巴氏小體感受振動", "group": 1}, {"id": "ag2s0", "label": "味細胞辨識鮮味分子", "group": 2}, {"id": "ag2s1", "label": "嗅細胞接觸黏液中氣味", "group": 2}], "sol": {"g0s0": "ag0s0", "g0s1": "ag0s1", "g1s0": "ag1s0", "g1s1": "ag1s1", "g2s0": "ag2s0", "g2s1": "ag2s1"}, "pre": {}, "id": "b3-c42-q02"}, {"t": "眼球：構造與角色", "q": "哪些符合眼球圖？（選3項）", "learn": 1, "tag": "vision", "hint": "依引線找位置，不只靠名稱猜。", "why": "調焦、進光量、感光及傳出訊息各由不同構造參與；虹膜是平滑肌。", "sub": "原PPT第 2 頁；課本 P108–109", "refs": [{"src": "eye", "cap": "教材來源圖"}], "legacyQuestion": 7, "kind": "multi", "opts": [{"t": "角膜與水晶體參與屈光", "ok": true, "tag": "vision"}, {"t": "虹膜是由意識控制的骨骼肌", "ok": false, "tag": "vision"}, {"t": "中央窩視錐密集、解析度佳", "ok": true, "tag": "vision"}, {"t": "光先由脈絡膜反彈到感光細胞", "ok": false, "tag": "vision"}, {"t": "盲點缺少光受器", "ok": true, "tag": "vision"}], "fig": "eye", "figCaption": "教材完整原圖", "id": "b3-c42-q07"}, {"t": "課本圖貼標籤：眼球的構造", "q": "依課本圖4–11(a)，把標籤放回圖上的編號格：眼球前方構造、中央窩、黃斑與盲點。", "learn": 3, "tag": "eye", "hint": "由前到後：角膜、虹膜與水晶體；視網膜上有黃斑（中央有中央窩）

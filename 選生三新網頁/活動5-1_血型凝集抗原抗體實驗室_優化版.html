const CONTENT={"lessons": [{"id": "b3-a51-l01", "t": "看見凝集，提出可檢驗的問題", "sec": "s1", "slide": 1, "sourceSlides": [1, 2], "sourcePages": [1], "src": "課本P171；PPT 1、2", "figSpec": {"image": "reaction"}, "txt": "<h3>觀察與機制</h3><ul><li>比較不同試劑與血液的反應，連結抗原、抗體與可見凝集。</li><li>教材提供操作示例，不是本班實測結果；班級比例需依實際紀錄計算。</li><li>網頁可用圖像完成探究；採血與真人樣本僅依教師及學校核可流程。</li></ul><p class=\"thinking\"><strong>想一想</strong> 沒有看到凝集，是否就表示這份血液沒有任何抗原？</p><div class=\"ex\"><h4>前言</h4><p>醫院輸血常需配對血型。輸錯血型時，血液會產生什麼反應？</p></div><div class=\"ex\"><h4>本活動要探討</h4><ul><li>不同血清混合不同血液，是否產生<b>凝集</b>？</li><li>抗體的作用是否具有<b>專一性</b>？</li><li>抗體是否需達到一定的量才有顯著作用？</li></ul></div>", "tb": [["step_001", "P171完整課本頁"]]}, {"id": "b3-a51-l02", "t": "A、B抗原與血清中的抗體", "sec": "s1", "slide": 3, "sourceSlides": [3, 19], "sourcePages": [1, 4], "src": "課本P171、174；PPT 3、19", "figSpec": {"image": "ppt_019"}, "txt": "<h3>觀察與機制</h3><ul><li>A型紅血球具有A抗原，B型具有B抗原；AB型兼具兩者，O型缺少A、B抗原。</li><li>典型成人A型血清有抗B、B型有抗A；AB型缺少抗A與抗B，O型有兩者。</li><li>這些名稱限於ABO系統：O型不是沒有任何抗原，AB型也不是沒有任何抗體。</li></ul><p class=\"thinking\"><strong>想一想</strong> 同樣稱為A型的人，其他血型抗原必定相同嗎？</p><div class=\"ex\"><h4>原理</h4><p>紅血球表面具有 A、B 抗原。根據血液與血清是否凝集，可分成 A、B、AB、O 四種血型。</p></div><div class=\"ex\"><h4>四種血型</h4><ul><li><b>A 型</b>：紅血球有 A 抗原；血清有 B 抗體。</li><li><b>B 型</b>：紅血球有 B 抗原；血清有 A 抗體。</li><li><b>AB 型</b>：紅血球有 A、B 抗原；血清無抗 A、抗 B 抗體。</li><li><b>O 型</b>：紅血球無 A、B 抗原；血清有抗 A、抗 B 抗體。</li></ul></div>", "tb": [["step_001", "P171完整課本頁"], ["step_004", "P174完整課本頁"]]}, {"id": "b3-a51-l03", "t": "抗A與抗B：試劑不是抗原", "sec": "s1", "slide": 4, "sourceSlides": [4, 6], "sourcePages": [1, 2], "src": "課本P171、172；PPT 4、6", "figSpec": {"image": "reagent_plate"}, "txt": "<h3>觀察與機制</h3><ul><li>抗A試劑含能辨識A抗原的抗體；抗B試劑含能辨識B抗原的抗體。</li><li>課本以淺藍與淺黃區分兩種試劑；實際辨識以產品標籤為準，顏色不是通用規則。</li><li>玻片分區、標示試劑與樣本，才能把反應對回正確條件。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若只看到一團凝集，卻不知道加入哪種試劑，可以定型嗎？</p><div class=\"ex\"><h4>試劑</h4><p>全班使用：<b>抗 A 血清</b>（含 A 抗體，淺藍色）、<b>抗 B 血清</b>（含 B 抗體，淺黃色），以及用生理食鹽水稀釋 10 倍的抗 A、抗 B 血清。</p></div><div class=\"ex\"><h4>提醒</h4><p>試劑是含抗體的血清，不是抗原。抗 A 血清能與有 A 抗原的紅血球反應。</p></div>", "tb": [["step_001", "P171完整課本頁"], ["step_002", "P172完整課本頁"]]}, {"id": "b3-a51-l04", "t": "器材、紀錄與樣本處理", "sec": "s1", "slide": 5, "sourceSlides": [5, 7, 8], "sourcePages": [1, 2], "src": "課本P171、172；PPT 5、7、8", "figSpec": {"image": "ppt_005"}, "txt": "<h3>觀察與機制</h3><ul><li>核對玻片、標籤、滴管、牙籤、顯微鏡與教師提供的材料。</li><li>課本記70%酒精，舊延伸題記75%；兩者原文分開保存，不把差異當本活動的新結論。</li><li>採血器具不共用或重複使用；尖銳物依核可銳器容器處理，原課本玻璃罐敘述保留作來源。</li></ul><p class=\"thinking\"><strong>想一想</strong> 哪些標籤若漏寫，會使後面的結果無法追溯？</p><div class=\"ex\"><h4>每組器材（兩人一組）</h4><p>載玻片 2、採血針 2、細字油性筆、滴管、小標籤紙 4、牙籤 4、消毒脫脂棉花、複式顯微鏡、70% 乙醇。</p></div><div class=\"ex\"><h4>安全</h4><p>每支採血針限一人使用，用完置入玻璃罐集中處理；用酒精棉消毒指尖，滴血後壓住傷口 1～2 分鐘止血。</p></div>", "tb": [["step_001", "P171完整課本頁"], ["step_002", "P172完整課本頁"]]}, {"id": "b3-a51-l05", "t": "步驟一：先分區，再加試劑", "sec": "s2", "slide": 6, "sourceSlides": [6], "sourcePages": [2], "src": "課本P172；PPT 6", "figSpec": {"image": "reagent_plate"}, "txt": "<h3>觀察與機制</h3><ul><li>清潔並分隔玻片，依教材左側標抗A、右側標抗B。</li><li>每區加入相應試劑；位置只是本次配置，判讀始終依標籤。</li><li>不同樣本及試劑保持可追溯，避免把顏色、左右與血型混為一談。</li></ul><p class=\"thinking\"><strong>想一想</strong> 把玻片轉180度後，抗A的位置應如何確認？</p><div class=\"ex\"><h4>步驟 1</h4><p>載玻片擦乾淨，用油性筆在中央畫一條線；左、右兩邊角落貼小標籤，分別註明<b>抗 A</b>、<b>抗 B</b>。把抗 A、抗 B 血清各滴 1 滴在對應位置。</p></div><div class=\"ex\"><h4>重點</h4><p>先分區、標清楚，再加試劑，避免混淆。</p></div>", "tb": [["step_002", "P172完整課本頁"]]}, {"id": "b3-a51-l06", "t": "步驟二、三：樣本與污染控制", "sec": "s2", "slide": 7, "sourceSlides": [7, 8], "sourcePages": [2], "src": "課本P172；PPT 7、8", "figSpec": {"pair": ["sampling", "sample_add"]}, "txt": "<h3>觀察與機制</h3><ul><li>教材示範清潔、取樣與血滴置於試劑旁；網頁閱讀不等於取得採血操作資格。</li><li>真人採樣由核可流程處理，可改用模擬材料學習判讀。</li><li>各樣本清楚編號，避免滴管及器具交叉接觸。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若樣本混入另一人的血液，原本的定型推論還成立嗎？</p><div class=\"ex\"><h4>步驟 2、3：採血</h4><p>用乙醇棉花擦拭指尖消毒，以採血針扎刺指尖，擠出鮮血，分別滴 1 滴在抗 A 與抗 B 血清旁，再以酒精棉壓住傷口。</p></div><div class=\"ex\"><h4>污染控制</h4><p>採血針一人一支、用後集中處理。不要讓別人的血液碰到自己的傷口。</p></div>", "tb": [["step_002", "P172完整課本頁"]]}, {"id": "b3-a51-l07", "t": "步驟四：各區獨立混合", "sec": "s2", "slide": 9, "sourceSlides": [9], "sourcePages": [3], "src": "課本P173；PPT 9", "figSpec": {"image": "mixing"}, "txt": "<h3>觀察與機制</h3><ul><li>依課本以不同牙籤分別混勻兩區，避免將抗A與抗B帶到另一區。</li><li>混合、等待時間與血液試劑比例都需一致並記錄。</li><li>混合不是凝集：是否出現可辨識的細胞聚集，仍需觀察。</li></ul><p class=\"thinking\"><strong>想一想</strong> 同一根牙籤先後攪兩區，會引入什麼解釋上的困難？</p><div class=\"ex\"><h4>步驟 4：混合</h4><p>迅速用牙籤把血液與血清混合；抗 A、抗 B 血清各用<b>一支牙籤</b>。</p></div><div class=\"ex\"><h4>原因</h4><p>共用牙籤會把一區的試劑帶到另一區，造成結果判讀錯誤。</p></div>", "tb": [["step_003", "P173完整課本頁"]]}, {"id": "b3-a51-l08", "t": "步驟五：肉眼與低倍觀察", "sec": "s2", "slide": 10, "sourceSlides": [10], "sourcePages": [3], "src": "課本P173；PPT 10", "figSpec": {"image": "reaction"}, "txt": "<h3>觀察與機制</h3><ul><li>教材玻片左區較均勻、右區可見顆粒狀聚集；右側顯微示例呈細胞群聚。</li><li>依本圖標籤，抗A陰性、抗B陽性，在試劑與對照有效時支持B型。</li><li>低倍示例沒有提供細胞計數或可靠尺度，不從圖推算細胞數、大小或抗體濃度。</li></ul><p class=\"thinking\"><strong>想一想</strong> 圖中的聚集證據與「所以是B型」之間，需要哪些條件？</p><div class=\"ex\"><h4>步驟 5：觀察</h4><p>靜置 <b>3 分鐘</b>後，在低倍顯微鏡下觀察是否發生<b>凝集反應</b>。</p></div><div class=\"ex\"><h4>判讀</h4><p>凝集：紅血球聚成團塊；未凝集：紅血球均勻分散。</p></div>", "tb": [["step_003", "P173完整課本頁"]]}, {"id": "b3-a51-l09", "t": "四種模式：兩個試劑一起看", "sec": "s3", "slide": 11, "sourceSlides": [11, 15, 16], "sourcePages": [4], "src": "課本P174；PPT 11、15、16", "figSpec": {"image": "result_table"}, "txt": "<h3>觀察與機制</h3><ul><li>抗A陽性、抗B陰性支持A型；相反支持B型。</li><li>兩者陽性支持AB型；兩者陰性在有效檢測條件下支持O型。</li><li>陽性表示該條件出現凝集；陰性不等於樣本沒有細胞或沒有任何抗原。</li></ul><p class=\"thinking\"><strong>想一想</strong> 為什麼不能只靠一個試劑判定四種血型？</p><div class=\"ex\"><h4>步驟 6：全班統計</h4><p>與其他同學比較凝集結果，統計各結果占全班的比例。</p></div><div class=\"ex\"><h4>四種結果</h4><ul><li>只有抗 A 凝集 → A 型</li><li>只有抗 B 凝集 → B 型</li><li>抗 A、抗 B 都凝集 → AB 型</li><li>都不凝集 → O 型</li></ul></div><div class=\"ex\"><h4>討論二</h4><p>表格欄位：抗 A 血清、抗 B 血清、占全班人數比例、產生反應的抗原類型、推測血型。（√＝有凝集；×＝無凝集）</p></div>", "tb": [["step_004", "P174完整課本頁"]]}, {"id": "b3-a51-l10", "t": "專一性與交聯：凝集如何形成", "sec": "s3", "slide": 3, "sourceSlides": [3, 14], "sourcePages": [1, 4], "src": "課本P171、174；PPT 3、14", "figSpec": {"image": "micro"}, "txt": "<h3>觀察與機制</h3><ul><li>抗體辨識相應抗原，並可跨連不同紅血球，形成可見細胞群聚。</li><li>抗A不等於A抗原；抗體與抗原是不同角色。</li><li>凝集是細胞聚集，凝血則涉及凝血反應與纖維蛋白；兩者可能並存但不是同義詞。</li></ul><p class=\"thinking\"><strong>想一想</strong> 抗體只結合一個細胞，是否已足以形成肉眼可見群聚？</p><div class=\"ex\"><h4>討論一：凝集代表什麼</h4><p>出現凝集，代表<b>抗體與紅血球上的抗原結合</b>，把紅血球黏連成團。</p></div><div class=\"ex\"><h4>回答</h4><ul><li>血清中引發凝集的物質是<b>抗體</b>。</li><li>A 型血只在抗 A 血清凝集，是因為抗 A 抗體只能辨識 A 抗原（專一性）；B 型同理。</li></ul></div>", "tb": [["step_001", "P171完整課本頁"], ["step_004", "P174完整課本頁"]]}, {"id": "b3-a51-l11", "t": "步驟七：十倍稀釋的預測", "sec": "s4", "slide": 12, "sourceSlides": [12, 17], "sourcePages": [3, 4], "src": "課本P173、174；PPT 12、17", "figSpec": {"image": "ppt_012"}, "txt": "<h3>觀察與機制</h3><ul><li>教材延伸比較原試劑與十倍稀釋試劑；稀釋後試劑濃度為原來的十分之一。</li><li>降低抗體濃度可能使可見凝集減弱；是否發生與程度需依實測條件判斷。</li><li>原教材未提供定量結果，不把反應必定慢十倍或必定不凝集列作答案。</li></ul><p class=\"thinking\"><strong>想一想</strong> 預測較弱與實際觀察較弱，應分別記在哪一欄？</p><div class=\"ex\"><h4>步驟 7：十倍稀釋</h4><p>徵求 A 型與 B 型同學自願者，重複上述步驟，但使用 10 倍稀釋的抗血清，觀察。</p></div><div class=\"ex\"><h4>討論三</h4><p>血清稀釋後抗體量減少，與抗原接觸的機率降低，較不易產生或觀察到凝集。可知抗原抗體反應<b>受濃度影響</b>。</p></div>", "tb": [["step_003", "P173完整課本頁"], ["step_004", "P174完整課本頁"]]}, {"id": "b3-a51-l12", "t": "公平比較：控制條件與證據", "sec": "s4", "slide": 12, "sourceSlides": [12, 17], "sourcePages": [3, 4], "src": "課本P173、174；PPT 12、17", "figSpec": {"image": "ppt_017"}, "txt": "<h3>觀察與機制</h3><ul><li>比較因素為抗血清濃度，其他如樣本、比例、時間與觀察方法盡量一致。</li><li>十倍稀釋是濃度比，不代表血滴體積、反應時間或凝集顆粒大小均差十倍。</li><li>設定觀察尺度並重複比較；陰性結果應核對試劑、樣本及對照。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若稀釋組同時少加一半血液，差異可以只歸因於濃度嗎？</p><div class=\"ex\"><h4>公平比較</h4><p>比較稀釋與未稀釋時，要控制其他條件。</p></div><div class=\"ex\"><h4>控制</h4><ul><li>同一人的血液。</li><li>相同滴數與混合方式。</li><li>相同靜置時間與觀察倍率。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>結果要依實際觀察描述，不要預設答案。</p></div>", "tb": [["step_003", "P173完整課本頁"], ["step_004", "P174完整課本頁"]]}, {"id": "b3-a51-l13", "t": "步驟八：混合血液有兩個方向", "sec": "s4", "slide": 13, "sourceSlides": [13, 18, 19], "sourcePages": [3, 4], "src": "課本P173、174；PPT 13、18、19", "figSpec": {"image": "ppt_018"}, "txt": "<h3>觀察與機制</h3><ul><li>課本混合血液為教師示範選做，不供學生任意交換真人樣本。</li><li>A、B全血混合，需同時考慮各方血清抗體與另一方紅血球抗原。</li><li>不是任何不同ABO組合、任何混合比例都必定可見凝集；同ABO也不代表其他血型完全相容。</li></ul><p class=\"thinking\"><strong>想一想</strong> 只知道兩份血型不同，還缺哪些成分與條件資訊？</p><div class=\"ex\"><h4>步驟 8（選做，建議由老師操作）</h4><p>取 A 型和 B 型同學各一滴血混合；另取同血型的兩位同學各一滴血混合，觀察。</p></div><div class=\"ex\"><h4>討論四</h4><ul><li>不同血型的血混合，會因抗體與抗原作用而發生<b>凝集</b>。</li><li>B 型血液中有 A 抗體，會與 A 型血球上的 A 抗原結合；反之亦然。</li><li>同血型混合不會凝集。</li></ul></div><div class=\"ex\"><h4>安全</h4><p>不可由學生操作，避免別人的血液汙染自己的傷口。</p></div>", "tb": [["step_003", "P173完整課本頁"], ["step_004", "P174完整課本頁"]]}, {"id": "b3-a51-l14", "t": "只有血清：反向定型的線索", "sec": "s5", "slide": 20, "sourceSlides": [20], "sourcePages": [4], "src": "課本P174；PPT 20", "figSpec": {"image": "ppt_020"}, "txt": "<h3>觀察與機制</h3><ul><li>未知血清分別與已知A型、B型紅血球反應，可探查抗A、抗B的存在。</li><li>典型成人ABO模型：凝集已知A細胞代表有抗A；凝集已知B細胞代表有抗B。</li><li>這是教學中的初步推論；臨床須配合正反定型、一致性與必要檢查，不能直接據網頁輸血。</li></ul><p class=\"thinking\"><strong>想一想</strong> 反向定型測的是未知樣本的抗原，還是抗體？</p><div class=\"ex\"><h4>討論五：只有病患血清</h4><p>能追蹤血型：<b>血清</b>中的抗體類型可推測血型。</p></div><div class=\"ex\"><h4>需要材料</h4><p>各類血型的紅血球做凝集試驗。例：A 型血清有 B 抗體，會辨識 B 型紅血球上的 B 抗原。</p></div>", "tb": [["step_004", "P174完整課本頁"]]}, {"id": "b3-a51-l15", "t": "全血、血漿與血清", "sec": "s5", "slide": 21, "sourceSlides": [21], "sourcePages": [4], "src": "課本P174；PPT 21", "figSpec": {"image": "ppt_021"}, "txt": "<h3>觀察與機制</h3><ul><li>全血含血球與血漿；血漿保留纖維蛋白原等凝血因子。</li><li>血清是血液凝固後取得的液體，纖維蛋白原等因子被消耗或改變，抗體仍可存在。</li><li>原PPT以去除纖維蛋白原簡化說明；不能把血清說成去除所有蛋白質的水。</li></ul><p class=\"thinking\"><strong>想一想</strong> 血清沒有紅血球，為何仍可參與凝集反應？</p><div class=\"ex\"><h4>全血、血漿、血清</h4><p>三者成分不同。</p></div><div class=\"ex\"><h4>比較</h4><ul><li><b>全血</b>：細胞（白血球、紅血球、血小板）＋血漿成分。</li><li><b>血漿</b>：含血漿蛋白（包括纖維蛋白原、凝血因子）、抗體、激素等。</li><li><b>血清</b>：去除纖維蛋白原等凝血因子的血漿，仍含抗體。</li></ul></div>", "tb": [["step_004", "P174完整課本頁"]]}, {"id": "b3-a51-l16", "t": "輸血成分：紅血球與血漿要分開", "sec": "s5", "slide": 22, "sourceSlides": [22], "sourcePages": [4], "src": "課本P174；PPT 22", "figSpec": {"image": "ppt_022"}, "txt": "<h3>觀察與機制</h3><ul><li>紅血球輸注主要比較供者紅血球抗原與受者抗體；血漿則重視供者抗體與受者紅血球。</li><li>O型缺少A、B紅血球抗原；AB型血漿通常缺少抗A、抗B，兩種理由不能交換。</li><li>此為ABO教學模型，實際還需Rh等血型與配合試驗，不能將全血、紅血球、血漿通稱萬用。</li></ul><p class=\"thinking\"><strong>想一想</strong> 「O型能給所有人」這句話，至少省略了哪個成分與條件？</p><div class=\"ex\"><h4>討論六：為何輸同型血</h4><p>不同血型互輸，例如 A 型輸給 B 型：B 型血漿有 A 抗體，遇到 A 型紅血球上的 A 抗原，會凝集並可能造成血管阻塞。</p></div><div class=\"ex\"><h4>補充</h4><ul><li>O 型紅血球沒有 A、B 抗原，可輸給其他血型的紅血球。</li><li>O 型血漿仍有抗 A、抗 B 抗體。</li><li>AB 型血漿沒有抗 A、抗 B 抗體，可接受任何血型的紅血球。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>輸血要看「紅血球」與「血漿」兩部分，不是整袋看。</p></div>", "tb": [["step_004", "P174完整課本頁"]]}, {"id": "b3-a51-l17", "t": "凝集、凝血、溶血：分清機制", "sec": "s5", "slide": 22, "sourceSlides": [22, 23], "sourcePages": [4], "src": "課本P174；PPT 22、23", "figSpec": {"image": "ppt_023"}, "txt": "<h3>觀察與機制</h3><ul><li>凝集是紅血球被抗體跨連；凝血形成纖維蛋白網；溶血是紅血球受損而釋出血紅素。</li><li>不相容的ABO紅血球輸注可引發嚴重免疫性溶血，並可能造成循環與腎臟損傷。</li><li>腎損傷涉及多種機制，不以血紅素結晶堵塞作唯一解釋；原文與補充說明分開。</li></ul><p class=\"thinking\"><strong>想一想</strong> 細胞聚在一起，是否足以證明已形成纖維蛋白血塊？</p><div class=\"ex\"><h4>三個名詞要分清</h4><p>凝集、凝血、溶血，機制不同。</p></div><div class=\"ex\"><h4>比較</h4><ul><li><b>凝集</b>：抗體使帶抗原的紅血球黏成團。</li><li><b>凝血</b>：血小板與凝血因子形成血塊。</li><li><b>溶血</b>：紅血球破裂。</li></ul></div><div class=\"ex\"><h4>輸錯血型</h4><p>可能引發嚴重系統性免疫反應，出現凝集、血栓形成，嚴重可致命。</p></div>", "tb": [["step_004", "P174完整課本頁"]]}, {"id": "b3-a51-l18", "t": "班級統計：從紀錄回到解釋", "sec": "s5", "slide": 15, "sourceSlides": [15, 16], "sourcePages": [4], "src": "課本P174；PPT 15、16", "figSpec": {"image": "discussions"}, "txt": "<h3>觀察與機制</h3><ul><li>先記抗A與抗B反應，再推論ABO型別，最後以有效樣本為分母計算班級比例。</li><li>未參與、無法判讀與對照失敗另行標註；不編造缺少的樣本數。</li><li>班級便利樣本不直接代表全臺族群比例，個人血型紀錄依課堂隱私規範處理。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若四型人數加總少於檢測人數，應先查什麼？</p><div class=\"ex\"><h4>班級統計</h4><p>回到紀錄寫解釋：</p></div><div class=\"ex\"><h4>步驟</h4><ul><li>整理四種結果的人數與比例。</li><li>每種結果對應什麼抗原（A、B、AB、無）。</li><li>推測血型並說明依據。</li></ul></div>", "tb": [["step_004", "P174完整課本頁"]]}], "questions": [{"t": "課本圖貼標籤：抗血清玻片", "q": "依課本照片，把標籤放回玻片上的編號格：左右兩區分別滴加哪一種抗血清（三張照片：試劑、混合前、反應後）。", "learn": 2, "tag": "plate", "hint": "每張玻片左側滴抗 A 血清、右側滴抗 B 血清；同名標籤可用在不同照片的對應位置。", "why": "抗 A 血清含抗 A 抗體，會與帶 A 抗原的紅血球凝集；抗 B 血清含抗 B 抗體，會與帶 B 抗原的紅血球凝集。玻片左右兩區的試劑固定，才能比較兩區的反應。", "sub": "課本 P171–173 照片", "refs": [{"src": "mk_plate", "cap": "抗血清玻片（標籤已遮蓋）"}], "kind": "drag", "mask": "mk_plate", "ar": 1.4254, "layout": "side", "slots": [{"id": "s0", "label": "抗 A", "group": 0, "x": 9.08, "y": 20.07, "v": false, "w": false}, {"id": "s1", "label": "抗 B", "group": 1, "x": 41.77, "y": 18.97, "v": false, "w": false}, {"id": "s2", "label": "抗 A", "group": 0, "x": 58.73, "y": 20.72, "v": false, "w": false}, {"id": "s3", "label": "抗 B", "group": 1, "x": 89.15, "y": 20.94, "v": false, "w": false}, {"id": "s4", "label": "抗 A", "group": 0, "x": 9.0, "y": 70.61, "v": false, "w": false}, {"id": "s5", "label": "抗 B", "group": 1, "x": 41.08, "y": 70.61, "v": false, "w": false}], "pieces": [{"id": "a0", "label": "抗 A", "group": 0}, {"id": "a1", "label": "抗 B", "group": 1}, {"id": "a2", "label": "抗 A", "group": 0}, {"id": "a3", "label": "抗 B", "group": 1}, {"id": "a4", "label": "抗 A", "group": 0}, {"id": "a5", "label": "抗 B", "group": 1}, {"id": "a6", "label": "抗 AB", "group": 100}, {"id": "a7", "label": "抗 Rh", "group": 101}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2", "s3": "a3", "s4": "a4", "s5": "a5"}, "pre": {"s0": "a0"}}, {"t": "原圖判讀：哪一區凝集", "q": "將觀察結果貼回兩張課本局部圖。", "learn": 7, "tag": "evidence", "hint": "比較分散均勻與聚集成團。", "why": "教材此例抗A陰性、抗B陽性；圖像是示例，不是本班實測。", "sub": "課本P173；PPT 10", "refs": [{"src": "reaction", "cap": "教材來源圖"}], "legacyQuestion": 2, "kind": "drag", "slots": [{"id": "g0s0", "label": "抗A區", "group": 0}, {"id": "g1s0", "label": "抗B區", "group": 1}], "pieces": [{"id": "ag0s0", "label": "較均勻，未見明顯凝集", "group": 0}, {"id": "ag1s0", "label": "顆粒聚集，呈凝集陽性", "group": 1}, {"id": "distractor0", "label": "已證明形成纖維蛋白網", "group": 99}, {"id": "distractor1 pecificity": 9, "typing": 8, "procedure": 3, "concentration": 10, "evidence": 11, "reverse": 13, "components": 15, "mechanism": 16}, "originalCount": 7, "source": {"bookPages": 4, "printedPages": "171–174", "pptPages": 23, "presentationKind": "pptx-static"}, "pptText": {"1": "探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n前言\n       醫院輸血時常需要進行血型的配對，你知道自己是什麼血型嗎？當輸錯血型時，血液會產生什麼反應？\n1\n配合課本 \nP171", "2": "目的\n       經過前述章節的學習，本活動將透過不同血清混合不同血液是否產生凝集現象，從而探討抗體的作用原理，並了解抗體的作用是否具有專一性？抗體是否需達到一定的量才會有顯著作用？\n2\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n配合課本 \nP171", "3": "原理\n       紅血球表面\n具有 \nA\n、\nB \n抗原，根據血液與血清是否會產生凝集反應，可將血液\n分為 \nA\n、\nB\n、\nAB \n及 \nO \n型等四種血型。混合不同血清及不同血液後，於顯微鏡下觀察反應的差異，藉以探討不同血液混合後的免疫反應。\n3\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n配合課本 \nP171", "4": "全班使用\n抗 \nA\n 血清（含 \nA\n 抗體）（淺藍色）\n1\n 瓶\n抗 \nB\n 血清（含 \nB\n 抗體）（淺黃色）\n1\n 瓶\n10\n 倍\n生理食鹽水稀釋\n抗 \nA\n 血清\n1\n 瓶\n10\n 倍\n生理食鹽水稀釋\n抗 \nB\n 血清\n1\n 瓶\n4\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n配合課本 \nP171\n器材", "5": "每組\n使用（兩\n人一\n組）\n載玻片\n2\n 片\n牙籤\n4\n 支\n採血針\n2\n 支\n消毒脫脂棉花\n少許\n細字油性筆\n1\n 支\n複式顯微鏡\n1\n 臺\n滴管\n1\n 支\n70\n%\n 乙醇\n少許\n小標籤紙\n4\n 張\n5\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n配合課本 \nP171", "6": "步驟\n1\n將載玻片擦拭乾淨後，用油性筆於中央畫一條線，在左、右兩邊角落各貼\n上 \n1\n 張小標\n籤，分別註明\n抗 \nA\n、\n抗 \nB \n。再將\n抗 \nA\n、\n抗 \nB \n血清分別\n加 \n1 \n滴在註明\n抗 \nA\n 或抗 \nB \n的玻片上。\n6\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n配合課本 \nP172", "7": "用沾過乙醇的棉花擦拭指尖完成消毒後，以採血針扎刺指尖。\n2\n註\n每支採血針限一人使用，用完的採\n血針即置入玻璃罐集中處理。\n7\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n配合課本 \nP172", "8": "擠出鮮血分別\n滴 \n1 \n滴血液在\n抗 \nA \n與\n抗 \nB \n血清旁，滴完血後再以酒精棉壓在指尖傷口\n上 \n1\n～\n2 \n分鐘消毒並止血。\n3\n8\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n配合課本 \nP172", "9": "迅速用牙籤將血液與血清混合，\n抗 \nA \n或\n抗 \nB \n血清要各\n使用 \n1 \n支牙籤。\n4\n9\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n配合課本 \nP173", "10": "靜\n置 \n3 \n分鐘後在低倍顯微鏡下觀察是否有凝集反應的發生。\n5\n10\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n配合課本 \nP173", "11": "與其他同學的凝集反應比較，並統計不同的凝集反應結果在全班同學中所占的比例。（可分為僅\n抗 \nA \n血清或抗\nB \n血清凝集、\n抗 \nA \n血清與\n抗 \nB \n血清皆凝集、\n抗 \nA\n 血清\n與\n抗 \nB \n血清皆不凝集\n等 \n4 \n種結果）。\n6\n11\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n配合課本 \nP173", "12": "徵求 \nA \n血型同學\n及 \nB \n血型同學自願者，重複上述步驟，但\n使用 \n10 \n倍稀釋抗血清，觀察會發生什麼現象。\n7\n12\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n配合課本 \nP173\n＊", "13": "取 \nA \n型\n及 \nB \n型同學各一滴血液混合，另取同血型的兩位同學各一滴血液混合，觀察會發生什麼現象。\n8\n＊\n註\n「＊」為選做步驟，先將甲同學的血液滴在一玻片上，再將乙同學的血液以乾淨的滴管吸取後，與甲同學的血液混合（建議由老師操作，不可由學生操作，以免別人的血液汙染自己的傷口）。\n13\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n配合課本 \nP173", "14": "討論\n1. \n參考課本\n圖 \n5\n－\n13\n，想一想，出現凝集的現象代表什麼意義？血清中具有什麼物質可引發凝集反應？\n為何 \nA \n型的血液只在\n抗 \nA \n血清中發生凝集反應、\nB \n型的血液只在\n抗 \nB \n血清中發生凝集反應？\n答\n：\n(1\n)\n抗原與抗體結合，產生凝集反應。\n(2\n)\n已知血球表面具有抗原，故推測血清中應具有抗體。\n(3\n)\n因血清中具有抗體，\nA \n型血液有 \nA \n抗原、無 \nB \n抗原，故僅與抗 \nA \n血清中的抗體結合發生凝集反應；\nB \n型血液有 \nB \n抗原、無 \nA \n抗原，故僅與抗 \nB\n 血清\n中的抗體結合發生凝集反應。\n14\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n配合課本 \nP174", "15": "2. \n統計全班同學的結果，並整理如下表，推測不同的凝集反應可能各自對應何種血型？\n15\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n配合課本 \nP174\n抗\n A \n血清\n√\n\n√\n\n抗\n B \n血清\n \n\n√\n√\n \n\n占全班人數比例\n \n \n \n \n產生反應的抗原類型\n \n \n \n \n推測血型（\nA\n、\nB\n、\nAB\n、\nO\n）\n \n \n \n \n註\n√\n \n代表有凝集反應發生，\n×\n 代表沒有凝集反應發生。", "16": "答\n：\n註\n√\n \n代表有凝集反應發生，\n×\n 代表沒有凝集反應發生。\n16\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n配合課本 \nP174\n抗\n A \n血清\n√\n\n√\n\n抗\n B \n血清\n \n\n√\n√\n \n\n占全班人數比例\n請同學依照實際結果計算填寫\n產生反應的抗原類型\nA \n抗原\nB \n抗原\nA \n抗原\n、\n \nB \n抗原\n\n推測血型（\nA\n、\nB\n、\nAB\n、\nO\n）\nA\nB\nAB\nO", "17": "3. \n請說明\n步驟 \n7 \n的結果，並討論為何會有這樣的結果出現？\n答\n：\n請\n同學依據實際觀察結果進行說明。由於血清稀釋後抗體量減少，與抗原接觸的機率降低，故較不易產生與觀察到凝集現象。可知抗原與抗體的反應亦會受到濃度的影響。\n17\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n配合課本 \nP174", "18": "4. \n步驟 \n8 \n中，當不同血型的血液混合後，會產生什麼反應？為何會出現這樣的結果？\n答\n：\n(1)\n不同血型的血液混合，會因抗體與抗原的作用而產生凝集反應。\n(2\n)\n由前述討論可知血球表面具有抗原，當不同血型（如 \nA \n型與 \nB \n型）的血液混合時，可見凝集反應的產生，推測 \nB \n型的血液中具有 \nA \n抗體，會\n與 \nA \n型血球上的 \nA \n抗原結合產生反應；反之推測 \nA \n型的血液中則具有 \nB \n抗體。血液中具有不同的抗原與抗體，可組成不同的血型：\n18\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n配合課本 \nP174", "19": "①\n \nA \n型血液的紅血球表面具有 \nA \n抗原，血清中具有 \nB \n抗體。\n②\n \nB \n型血液的紅血球表面具有 \nB \n抗原，血清中具有 \nA \n抗體。\n③\n \nAB \n型血液的紅血球表面同時有 \nA \n抗原與 \nB \n抗原，血清中不會產生對抗 \nA\n 抗原\n與 \nB \n抗原的抗體。\n④\n \nO \n型血液的紅血球表面不具有 \nA \n抗原與 \nB \n抗原，血清中則會產生對抗 \nA\n 抗原\n與 \nB \n抗原的抗體。\n19\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n配合課本 \nP174", "20": "5. \n若醫院中只有某病患的血清，是否可追蹤出他的血型？需要什麼材料？\n答\n：\n(1\n)\n血清（\nserum\n）是\n指去除\n纖維蛋白原的血漿，由前述討論可知血液中具有抗體，故可藉由抗體的類型推測病患的血型為何。\n(2\n)\n需各類血型的血球做凝集試驗。如 \nA \n型的血清中具有 \nB \n抗體，可辨識 \nB \n型紅血球上的 \nB \n抗原，\nB \n型的血清中具有 \nA \n抗體，可辨識 \nA \n型紅血球上的 \nA\n 抗原\n。\n20\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n配合課本 \nP174", "21": "▼全\n血、血漿及血清成分之區別（＋表示含有此成分）。\n21\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n項目\n細胞\n（白血球\n、紅血球、血小板）\n血漿蛋白\n（含纖維蛋白原、凝血因子）\n血漿蛋白\n（不含纖維蛋白原等凝血因子）\n抗體\n \n激素\n \n其他（水、\n萄糖、脂質、電解質、非蛋白氮等）\n全血\n\n\n \n\n\n\n血漿\n \n\n \n\n\n\n血清\n \n \n\n\n\n\n補充", "22": "6. \n為何輸血時一般只採用相同血型？如果輸血時輸錯血型\n，可能\n會發生什麼事？\n答\n：\n(1\n)\n同血型不易產生溶血現象，所以輸血時一般會採用相同的血型。若不同血型互相輸血，如將 \nA \n型血輸給 \nB \n型的人，因 \nB \n型血漿中有 \nA \n抗體，遇到 \nA \n型紅血球表面的 \nA \n抗原，會發生凝血並造成血管阻塞等反應，反之亦然。只有 \nO \n型紅血球上沒有會引發反應的抗原，可以輸給其他血型的人，但 \nO \n型血漿中仍有 \nA\n、\nB \n抗體，因此若將其血液中的抗體分離的話，\nO \n型血的人是全適捐血者。\nAB \n型的紅血球上有 \nA\n、\nB \n抗原，不得輸給不同血型的人，而血漿內沒有辨識的抗體，可接受任何血型的紅血球。\n22\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原與抗體反應的基本模式\n配合課本 \nP174", "23": "(2\n)\n若輸血液時輸錯血型，會造成極嚴重的系統性免疫反應，可能引發凝集反應，\n導致血栓形成，\n嚴重可能致命。\n23\n探討活動 \n5\n-\n1 \n藉由 \nABO\n 血型的鑑定探討\n\n抗原\n與抗體反應的基本模式\n配合課本 \nP174"}, "sourceCorrections": [{"ppt": [3, 19], "note": "ABO名稱只指A、B抗原及相應抗體；O型不是沒有任何抗原，AB型不是沒有任何抗體。"}, {"ppt": [7, 8], "note": "採血依教師及學校核可流程；不共用器具，尖銳物使用核可銳器容器，來源舊處置敘述另行保留。"}, {"ppt": [12, 17], "note": "十倍稀釋可能減弱可見凝集；未提供定量結果，不能斷言時間、顆粒大小必有固定差異。"}, {"ppt": [18], "note": "混合血液需分清雙方血清抗體與紅血球抗原；不同ABO組合不等於任何條件都可見凝集。"}, {"ppt": [20, 21]  "mc", "multi": false, "g": "g2", "title": "凝集反應（Agglutination）與血液凝固之本質區別", "sub": "課本 P173 討論 1 凝集機制本質", "label": "單選題", "q": "在生物學中，『凝集反應』與『血液凝固』是截然不同的生理生化現象。下列敘述何者完全正確？", "hint": "凝集反應是抗原抗體結合，血液凝固是纖維蛋白形成血塊。", "ref": ["p3_agglutination_nature", "課本 P173 凝集現象本質"], "opts": [["凝集反應是由血小板釋放凝血因子形成纖維蛋白網羅紅血球的生理止血過程", "T1"], ["凝集反應為特異性抗原與抗體結合交聯成網狀沉澱，與血液凝固之酵素級聯反應本質不同", null], ["血液凝固是由抗 A 或抗 B 抗體直接水解紅血球細胞膜所引起的病理現象", "T1"], ["兩者皆必須仰賴高濃度維生素 K 與鈣離子的催化才能順利發生", "T1"]], "ans": [1], "exp": "B正確：凝集反應（Agglutination）屬於免疫學上的『抗原—抗體特異性結合反應』，抗體（如多價 IgM）藉由結合相鄰紅血球表面的抗原，將細胞交聯成肉眼可見的立體網狀團塊，不依賴凝血酵素；而『血液凝固（Coagulation）』則是人體血管破裂時，血小板活化並啟動凝血因子級聯反應，最終凝血酶將可溶性纖維蛋白原催化轉變為不溶性纖維蛋白網形成血塊的生理止血歷程。A、C、D均混淆了兩者本質。"}, {"kind": "mc", "multi": false, "g": "g2", "title": "醫院僅取得未知血清時推求病患血型之邏輯", "sub": "課本 P173 討論 5 反向定型邏輯", "label": "單選題", "q": "若某急診病患昏迷且手邊僅有該病患已分離出的『血清（無紅血球）』，檢驗師若欲鑑定其 ABO 血型，應採取下列何種實驗設計邏輯？", "hint": "用已知的紅血球去測病患血清中的抗體！", "ref": ["p3_blood_type_table", "課本 P173 未知血清推求血型"], "opts": [["直接將抗 A 與抗 B 診斷血清滴入該病患血清中，觀察兩者是否凝固", "T2"], ["取已知血型的標準 A 型與標準 B 型紅血球，分別與病患血清混合並觀察是否凝集", null], ["將病患血清加熱至 100℃，檢測是否會變性凝結為白色沉澱", "T2"], ["將病患血清滴在濾紙上，以紫外線照射觀察是否有抗體螢光反應", "T2"]], "ans": [1], "exp": "B正確：此為臨床檢驗上的『反向定型（Reverse grouping）』。病患血清中含有天然抗體（未知的抗 A 或抗 B）。檢驗師需取已知血型的標準 A 型紅血球（具 A 抗原）及標準 B 型紅血球（具 B 抗原），分別滴加病患血清。若使 B 紅血球凝集而 A 紅血球不凝集，表示血清含抗 B 抗體，推知病患為 A 型血；若兩者皆不凝集，表示血清不含抗 A 亦不含抗 B，推知病患為 AB 型血，以此類推。A錯：血清與血清混合（皆為抗體）無法引發血球凝集反應。"}, {"kind": "mc", "multi": true, "g": "g2", "title": "探討活動5-1實驗操作規範與防止交叉污染之細節", "sub": "課本 P171–172 實驗操作步驟與安全", "label": "多選題", "q": "進行『探討活動 5-1 ABO 血型鑑定』實驗時，為確保人身安全與實驗結果精準性，下列操作規範哪些正確？（應選 3 項）", "hint": "檢核採血針單人使用、酒精風乾、牙籤分開攪拌、血清滴管懸空。", "ref": ["p1_blood_sampling_safety", "課本 P171–172 實驗步驟"], "opts": [["每支採血針嚴格限制一人使用一次，使用後立即投入防穿刺醫療銳器收集盒中", null], ["指尖擦拭 75% 酒精消毒後，應靜待酒精完全揮發風乾，以防扎刺刺痛與紅血球溶血", null], ["混合抗 A 與抗 B 血清時，必須分別使用兩支獨立的牙籤，嚴禁共用同一牙籤攪拌", null], ["為求環保節省，全班同學應輪流共用同一支採血針直至刀片鈍化為止", "T1"], ["抗 A 血清與抗 B 血清滴管吸頭應直接插進學生的指尖鮮血中攪拌混合以節省玻片", "T1"]], "ans": [0, 1, 2], "exp": "A、B、C正確。D錯：採血針絕對不可重複共用，共用採血針有極高機率透過血液傳播 B 肝、C 肝及 HIV 等嚴重傳染病；E錯：血清試劑滴管嚴禁碰觸人體血液，否則會使整瓶診斷抗血清遭受血液污染而失效變質。"}, {"kind": "mc", "multi": true, "g": "g2", "title": "抗體濃度稀釋對凝集反應影響之科學探究判讀", "sub": "課本 P172 步驟 6 稀釋抗血清探究", "label": "多選題", "q": "在步驟 6 中，同學使用生理食鹽水將抗 A 及抗 B 血清進行 10 倍稀釋後重複實驗。關於此探究活動之現象與結論，下列敘述哪些正確？（應選 3 項）", "hint": "檢核抗體濃度稀釋後的凝集速度、凝塊大小、特異性是否改變與抗體濃度閾值。", "ref": ["p2_dilution_and_crossmatch", "課本 P172 抗血清稀釋探究"], "opts": [["使用 10 倍稀釋的抗血清時，紅血球凝集反應之出現速度通常比原液明顯延緩", null], ["顯微鏡下可觀察到稀釋後的凝集塊體積較原液小，且團塊質地較為鬆散", null], ["實驗證實抗原抗體結合交聯成肉眼可見凝塊需要抗體達到一定的效價濃度閾值", null], ["抗血清稀釋 10 倍後，A 型血液會突然轉變為與抗 B 血清產生強烈凝集反應", "T2"], ["只要將抗血清無限稀釋至單一分子，其凝集速度與巨觀團塊大小均完全不受任何影響", "T2"]], "ans": [0, 1, 2], "exp": "A、B、C正確。D錯：抗體的『專一性』由抗原結合位（Fab）立體結構決定，稀釋僅改變抗體分子濃度，絕不會改變抗體的抗原特異性，A 型血液絕不可能因此與抗 B 結合；E錯：抗體濃度過低時，無法跨分子有效橋接足夠的紅血球形成晶格網，凝集反應將徹底消失（假陰性）。"}, {"kind": "mc", "multi": true, "g": "g2", "title": "輸錯血型引發急性血管內溶血之免疫病理分析", "sub": "課本 P173 討論 6 輸血原則與溶血危害素養題", "label": "多選題", "q": "若醫療人員不慎將 A 型血液輸給了體內含有抗 A 抗體的 B 型病患，病患體內可能引發致命的急性溶血反應。下列相關病理歷程哪些正確？（應選 3 項）", "hint": "檢核受血者抗體攻擊供血者紅血球、補體活化血管內溶血、游離血紅素阻塞腎小管。", "ref": ["p3_transfusion_rules", "課本 P173 輸血原則與急性溶血"], "opts": [["B 型受血者體內的天然抗 A 抗體會迅速結合於輸入的 A 型紅血球表面", null], ["抗原抗體複合物強烈活化血漿中的補體系統，在輸入的紅血球膜上形成 MAC 引發溶血", null], ["大量破裂紅血球釋出的游離血紅素隨血液流至腎臟，可能堵塞腎小管導致急性腎衰竭", null], ["輸入的外來 A 型紅血球會主動分泌消化酵素，在五分鐘內將病患大腦徹底溶解", "T3"], ["輸錯血只會使病患體溫短暫下降至 20℃，不會對心血管或腎臟造成任何實質危害", "T3"]], "ans": [0, 1, 2], "exp": "A、B、C正確。D錯：紅血球無細胞核亦無分泌酵素機能，致死原因為免疫溶血反應而非紅血球主動分泌酵素；E錯：急性溶血性輸血反應（AHTR）是嚴重的醫療災難，伴隨高燒、寒顫、血紅素尿、急性腎衰竭、彌散性血管內凝血（DIC）與休克，致死率極高。"}]};

function splitBlock(node,body){

}

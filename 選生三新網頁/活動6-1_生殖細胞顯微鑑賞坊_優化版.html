const CONTENT={"lessons": [{"id": "b3-a61-l01", "t": "一張切片，如何推論配子形成", "sec": "s1", "slide": 1, "sourceSlides": [1, 2, 3], "sourcePages": [1], "src": "課本P193；PPT 1、2、3", "figSpec": {"image": "testis_pair"}, "txt": "<h3>觀察與機制</h3><ul><li>本活動以永久玻片觀察睪丸與卵巢，利用位置與形態比較發育階段。</li><li>同一張切片的不同細胞不是同一細胞的連續錄影；排序是結合形態與既有研究的推論。</li><li>先記直接觀察，再寫解釋與不確定之處。</li></ul><p class=\"thinking\"><strong>想一想</strong> 看到兩種大小的細胞，就能知道哪一個先形成嗎？</p><div class=\"ex\"><h4>前言</h4><p>動物生長時，生殖腺逐漸發育成熟。哪些構造與配子產生有關？如何形成配子？</p></div><div class=\"ex\"><h4>目的</h4><p>用<b>永久玻片標本</b>觀察卵巢與睪丸中不同位置的細胞，依構造或相對位置推論配子形成過程。</p></div><div class=\"ex\"><h4>原理</h4><p>卵巢：由濾泡細胞的大小、外圍濾泡的形態變化、中央生殖細胞的形態推論卵的發育。睪丸：依精子的形態變化大致排序，推論精子的發育階段先後。</p></div><div class=\"ex\"><h4>深入解說：由靜態切片推論動態過程</h4><p>永久玻片是固定的一瞬間，同一張切片中不同位置的細胞處於不同階段。把它們依形態與位置排序，是結合既有研究的推論，而不是追蹤同一細胞的連續錄影。睪丸看精子發育由管壁往管腔的順序；卵巢看濾泡的大小、層數與濾泡腔來推論卵的發育。記錄時先寫直接觀察，再寫解釋與不確定之處。</p></div><div class=\"ex\"><h4>兩個觀察系統</h4><ul><li>睪丸：細精管，由外向內排序。</li><li>卵巢：濾泡，由層數與空腔排序。</li><li>共通：先觀察、後推論。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>看到兩種大小的細胞，就能知道哪一個先形成嗎？</p><p><b>答：</b>不能。大小只是線索之一，還要結合位置、核形與其他特徵，並且是一種推論。</p></div>", "tb": [["step_001", "P193完整課本頁"]]}, {"id": "b3-a61-l02", "t": "器材與觀察流程：低倍定位再高倍", "sec": "s1", "slide": 4, "sourceSlides": [4, 5, 6], "sourcePages": [1, 2], "src": "課本P193、194；PPT 4、5、6", "figSpec": {"image": "ppt_004"}, "txt": "<h3>觀察與機制</h3><ul><li>核對永久玻片標本、複式顯微鏡與標本編號。</li><li>先以低倍尋找完整構造、置中，再依儀器規範轉高倍、細調焦距。</li><li>永久玻片呈現固定切面；本活動不涉及活體取樣，也不由固定切片測量游動速度。</li></ul><p class=\"thinking\"><strong>想一想</strong> 為何一開始就用高倍，反而容易找不到完整細精管？</p><div class=\"ex\"><h4>器材</h4><p>複式顯微鏡 1 臺、雄鼠（或兔）睪丸永久玻片 1 片、雌鼠（或兔）卵巢永久玻片 1 片。</p></div><div class=\"ex\"><h4>流程</h4><p>先用<b>低倍鏡</b>定位，再換<b>高倍鏡</b>看細部。</p></div><div class=\"ex\"><h4>深入解說：低倍到高倍的流程</h4><p>先核對標本編號，用低倍鏡找到完整構造並移到視野中央，再轉高倍鏡、細調焦距。一開始就用高倍視野小，容易迷失方向，找不到完整的細精管或濾泡。永久玻片是固定的切面，不涉及活體取樣，也不能由固定切片量測精子游動速度。</p></div><div class=\"ex\"><h4>步驟</h4><ul><li>① 低倍定位。</li><li>② 置中。</li><li>③ 轉高倍。</li><li>④ 細調對焦。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>一開始就用高倍有什麼問題？</p><p><b>答：</b>視野太小，看不到整體，不易找到完整的細精管或濾泡，也容易壓壞玻片。</p></div>", "tb": [["step_001", "P193完整課本頁"], ["step_002", "P194完整課本頁"]]}, {"id": "b3-a61-l03", "t": "標尺：照片大小不等於實際大小", "sec": "s1", "slide": 6, "sourceSlides": [6], "sourcePages": [2], "src": "課本P194；PPT 6", "figSpec": {"image": "testis_pair"}, "txt": "<h3>觀察與機制</h3><ul><li>教材低倍照片附100 μm標尺，高倍附30 μm標尺。</li><li>估算實長＝構造在圖上的長度÷同圖標尺長度×標尺代表值。</li><li>照片放大時構造和標尺一起變大，實際長度不變；不同圖不能直接比螢幕直徑。</li></ul><p class=\"thinking\"><strong>想一想</strong> 同一張照片放大兩倍，細精管真的長大兩倍嗎？</p><div class=\"ex\"><h4>標尺</h4><p>圖中標示的長度（μm）才是實際大小。</p></div><div class=\"ex\"><h4>提醒</h4><p>照片放大倍數不同時，不能直接用「圖上的大小」比較，要用比例尺換算。</p></div><div class=\"ex\"><h4>深入解說：比例尺的用法</h4><p>教材低倍照片附 100 μm 標尺，高倍附 30 μm 標尺。估算實長＝構造在圖上的長度 ÷ 標尺在圖上的長度 × 標尺代表值。照片放大時構造和標尺一起變大，實際長度不變，所以不同圖不能直接比較螢幕上的直徑。</p></div><div class=\"ex\"><h4>步驟</h4><ul><li>① 量標尺在圖上的長。</li><li>② 量構造在圖上的長。</li><li>③ 比值 × 標尺代表值。</li><li>④ 單位換算（1 mm＝1000 μm）。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>同一張照片放大兩倍，細精管真的長大兩倍嗎？</p><p><b>答：</b>不會。實際大小沒變，變大的只是圖像；標尺也同樣放大，比值不變。</p></div>", "tb": [["step_002", "P194完整課本頁"]]}, {"id": "b3-a61-l04", "t": "低倍睪丸：盤曲管道的切面", "sec": "s2", "slide": 5, "sourceSlides": [5, 8], "sourcePages": [2, 3], "src": "課本P194、195；PPT 5、8", "figSpec": {"image": "testis_low"}, "txt": "<h3>觀察與機制</h3><ul><li>低倍可見許多圓形、橢圓形或較長的細精管切面。</li><li>同一盤曲管道被不同方向截切，可形成不同外形，不必推論為不同種類器官。</li><li>比較較完整、接近橫切的管段，較適合描述由管壁到管腔的位置。</li></ul><p class=\"thinking\"><strong>想一想</strong> 長橢圓形切面是否一定代表細精管正處於較晚發育期？</p><div class=\"ex\"><h4>活動一步驟 1：睪丸低倍</h4><p>找找看是否有圓形或橢圓形的<b>細精管</b>切面。</p></div><div class=\"ex\"><h4>討論一：形狀為何不同</h4><p>細精管是<b>立體纏繞</b>的管子。切片時刀片與管子接觸的方向不同：近乎垂直時切面呈圓形，斜切則呈橢圓形。</p></div><div class=\"ex\"><h4>深入解說：細精管的切面</h4><p>細精管是立體盤曲的長管，切片時被切到的方向不同：近乎垂直管軸為圓形，斜切為橢圓，縱切為長條。所以同一器官內會看到各種形狀的切面，不必推論為不同種類。描述管壁到管腔的位置時，選較完整、接近橫切的管段最合適。</p></div><div class=\"ex\"><h4>切面形狀</h4><ul><li>圓形：橫切。</li><li>橢圓形：斜切。</li><li>長條：縱切。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>長橢圓形切面一定代表細精管在較晚發育期嗎？</p><p><b>答：</b>不一定。形狀主要由切向決定，與發育階段無必然關係。</p></div>", "tb": [["step_002", "P194完整課本頁"], ["step_003", "P195完整課本頁"]]}, {"id": "b3-a61-l05", "t": "高倍細精管：從管壁走向管腔", "sec": "s2", "slide": 6, "sourceSlides": [6], "sourcePages": [2], "src": "課本P194；PPT 6", "figSpec": {"image": "testis_high"}, "txt": "<h3>觀察與機制</h3><ul><li>外側管壁鄰近基底區，內側為管腔；先建立方向再比較細胞。</li><li>靠管腔可見細長、絲狀構造，教材連結精子尾部；外緣細胞核形與大小不同。</li><li>切面方向、固定及染色會影響外觀，單看深染不能決定染色體數。</li></ul><p class=\"thinking\"><strong>想一想</strong> 畫面上下改變後，哪個特徵仍可用來定位管腔？</p><div class=\"ex\"><h4>步驟 2：高倍</h4><p>選一個較完整的細精管切面，轉高倍鏡觀察。</p></div><div class=\"ex\"><h4>問題</h4><ul><li>接近中央管腔處是否看到<b>絲狀構造</b>？細胞有何特徵？</li><li>接近管壁外緣的細胞有何特徵？</li></ul></div><div class=\"ex\"><h4>規則</h4><p>細胞從管壁外緣向管腔依序成熟。</p></div><div class=\"ex\"><h4>深入解說：由管壁走向管腔</h4><p>先確定方向：外側是管壁（基底區），內側是管腔。細胞由外向內依序成熟：靠外緣的細胞較大、核圓；靠管腔可見細長絲狀構造（教材連結到精子尾部）。切面方向、固定與染色都會影響外觀，所以「深染」不能直接決定染色體數。</p></div><div class=\"ex\"><h4>定位</h4><ul><li>先找管腔。</li><li>再分外緣與內緣。</li><li>最後比較細胞形態。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>畫面上下改變後，哪個特徵仍可用來定位管腔？</p><p><b>答：</b>管腔是管內中央的空間，絲狀尾部朝向管腔；不依賴畫面上下。</p></div>", "tb": [["step_002", "P194完整課本頁"]]}, {"id": "b3-a61-l06", "t": "a到e：以形態與位置排序", "sec": "s2", "slide": 7, "sourceSlides": [7, 9], "sourcePages": [3], "src": "課本P195；PPT 7、9", "figSpec": {"image": "sperm_cells"}, "txt": "<h3>觀察與機制</h3><ul><li>原PPT給出的教材排序為(b)→(a)→(c)→(d)→(e)。</li><li>(b)較靠管壁，(e)可見細長尾部；核形、凝縮程度及相對位置共同支持排序。</li><li>此圖示例不等於每張切片都能清楚辨認所有中間階段；次級精母細胞因階段短而較少見。</li></ul><p class=\"thinking\"><strong>想一想</strong> 如果只剩單一細胞局部圖，哪些排序證據會消失？</p><div class=\"ex\"><h4>步驟 3：a～e 排序</h4><p>注意細胞核大小、染色體形態與位置，判斷 a～e 的生成順序。</p></div><div class=\"ex\"><h4>答案</h4><p>(b) → (a) → (c) → (d) → (e)。理由：(a) 有核膜消失的特徵，推測正進行減數分裂；(e) 可見精子鞭毛；精子生成是由管壁往管腔依序進行。</p></div><div class=\"ex\"><h4>深入解說：a 到 e 的排序</h4><p>教材排序為 (b)→(a)→(c)→(d)→(e)。證據：(b) 最靠管壁（精原／初級精母細胞）；(a) 核膜消失，推測正在減數分裂；(c) 為減數分裂後的小細胞；(d) 細胞開始變形；(e) 可見細長的尾部（精子）。次級精母細胞階段很短，在切片中較少見。若只有單一細胞局部圖，位置證據就消失，排序會變困難。</p></div><div class=\"ex\"><h4>排序證據</h4><ul><li>位置：外 → 內。</li><li>核形：圓 → 凝縮 → 細長。</li><li>鞭毛：無 → 有。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>單一細胞的局部圖，會失去哪些排序證據？</p><p><b>答：</b>失去相對位置（離管壁遠近）與周圍細胞的比較，只剩形態一項。</p></div>", "tb": [["step_003", "P195完整課本頁"]]}, {"id": "b3-a61-l07", "t": "減數分裂與變態：兩種改變", "sec": "s2", "slide": 7, "sourceSlides": [7, 9], "sourcePages": [3], "src": "課本P195；PPT 7、9", "figSpec": {"image": "sperm_cells"}, "txt": "<h3>觀察與機制</h3><ul><li>一般生成順序為精原細胞→初級精母細胞→次級精母細胞→精細胞→精子。</li><li>減數分裂使染色體套數由2n降為n；精細胞再經形態改變形成精子。</li><li>精細胞變成精子不是再做一次減數分裂；套數與DNA量也不完全同義。</li></ul><p class=\"thinking\"><strong>想一想</strong> 細胞核變細長，是否必定代表染色體套數再次減半？</p><div class=\"ex\"><h4>兩種改變</h4><p>精子形成過程包含兩種不同的改變。</p></div><div class=\"ex\"><h4>分辨</h4><ul><li><b>減數分裂</b>：染色體數減半，核膜消失（如 a）。</li><li><b>變態（分化）</b>：精細胞形成鞭毛、細胞外形改變成精子（如 d、e）。</li></ul></div><div class=\"ex\"><h4>深入解說：兩種改變</h4><p>精子形成包含兩種不同的過程：<b>減數分裂</b>（精原細胞→初級精母細胞→次級精母細胞→精細胞，染色體套數由 2n 降為 n）與<b>變態／精子形成</b>（精細胞形成鞭毛、細胞質縮減，成為精子）。精細胞變成精子不再做減數分裂；細胞核變細長也不代表染色體套數再次減半。</p></div><div class=\"ex\"><h4>兩階段</h4><ul><li>減數分裂：2n → n。</li><li>變態：形態改變，染色體套數不變。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>細胞核變細長，必定代表染色體套數再次減半嗎？</p><p><b>答：</b>不是。核變細長是精子形成的形態變化，染色體套數已在減數分裂時減半。</p></div>", "tb": [["step_003", "P195完整課本頁"]]}, {"id": "b3-a61-l08", "t": "精子外形與功能：觀察的界線", "sec": "s2", "slide": 9, "sourceSlides": [9], "sourcePages": [3], "src": "課本P195；PPT 9", "figSpec": {"image": "sperm_e"}, "txt": "<h3>觀察與機制</h3><ul><li>教材可見較集中的頭部與細長尾部；頭部與遺傳物質相關，尾部運動有助前進。</li><li>中節粒線體與ATP供應屬生理延伸，不能宣稱本張光學切片已看清粒線體排列。</li><li>由永久玻片可描述形態，游動能力及受精能力需要其他檢驗。</li></ul><p class=\"thinking\"><strong>想一想</strong> 見到尾部，就能量出這個精子的游速嗎？</p><div class=\"ex\"><h4>討論二：精子外形的意義</h4><p>精子有較大的頭部與細長的尾部。</p></div><div class=\"ex\"><h4>意義</h4><ul><li>頭部主要含遺傳物質。</li><li>尾部是<b>鞭毛</b>，擺動使精子前進。</li></ul></div><div class=\"ex\"><h4>界線</h4><p>光學顯微鏡看到的是外形；詳細的功能（如頂體反應）不能只憑切片看出。</p></div><div class=\"ex\"><h4>深入解說：外形與功能的界線</h4><p>精子有集中的頭部（含遺傳物質）與細長的尾部（鞭毛，擺動使精子前進）。中節有粒線體提供 ATP，頭部前端有頂體；但這些要靠電子顯微鏡才看得清楚，光學切片只能描述外形。游動能力及受精能力需要其他檢驗，不能憑一張固定切片推論。</p></div><div class=\"ex\"><h4>可看 vs 不可看</h4><ul><li>可看：頭、尾的外形。</li><li>不可看（光鏡）：粒線體排列、頂體反應。</li><li>需活體：游速。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>見到尾部，就能量出這個精子的游速嗎？</p><p><b>答：</b>不能。固定切片不能反映游動；游速要活體觀察。</p></div>", "tb": [["step_003", "P195完整課本頁"]]}, {"id": "b3-a61-l09", "t": "低倍卵巢：在整體中找濾泡", "sec": "s3", "slide": 10, "sourceSlides": [10], "sourcePages": [4], "src": "課本P196；PPT 10", "figSpec": {"image": "ovary_low"}, "txt": "<h3>觀察與機制</h3><ul><li>低倍卵巢可見多種大小的濾泡及其他組織，先定位再挑選局部。</li><li>濾泡由卵母細胞及周圍細胞構成；卵巢中不是每個圓形輪廓都是卵子。</li><li>同一切片同時出現不同階段，不能當成某一濾泡的時間追蹤。</li></ul><p class=\"thinking\"><strong>想一想</strong> 低倍圖中最大的圓形構造，就一定是最成熟的卵母細胞嗎？</p><div class=\"ex\"><h4>活動二步驟 1：卵巢低倍</h4><p>放大觀察，可看到許多圓形或橢圓形的構造，稱為<b>濾泡</b>。試著比較這些構造的差異。</p></div><div class=\"ex\"><h4>方法</h4><p>先在整張切片中找濾泡，再逐個比較大小、層數、有無空腔。</p></div><div class=\"ex\"><h4>深入解說：卵巢的整體</h4><p>低倍下卵巢有許多圓形或橢圓形的<b>濾泡</b>，大小不一，還有其他組織。先在整張切片中定位，再挑選局部觀察。濾泡由卵母細胞及周圍細胞組成，不是每個圓形輪廓都是卵子。同一張切片同時出現不同階段，並不是追蹤同一個濾泡。</p></div><div class=\"ex\"><h4>觀察順序</h4><ul><li>全張定位。</li><li>挑選濾泡。</li><li>比較大小、層數、有無空腔。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>低倍圖中最大的圓形構造，就一定是最成熟的卵母細胞嗎？</p><p><b>答：</b>不一定。它可能是大的濾泡腔或濾泡，而不是卵母細胞本身。</p></div>", "tb": [["step_004", "P196完整課本頁"]]}, {"id": "b3-a61-l10", "t": "高倍濾泡：三個角色一起辨認", "sec": "s3", "slide": 11, "sourceSlides": [11], "sourcePages": [4], "src": "課本P196；PPT 11", "figSpec": {"pair": ["follicle", "follicle_diagram"]}, "txt": "<h3>觀察與機制</h3><ul><li>照片與示意圖對照：發育中的卵母細胞、周圍濾泡細胞、濾泡腔。</li><li>濾泡腔是濾泡內含液體的空間，不是卵母細胞的細胞核。</li><li>示意圖強調關係，不能將圖上每個細胞數當作照片的實測。</li></ul><p class=\"thinking\"><strong>想一想</strong> 如何分辨大的濾泡腔與卵母細胞內的小核區？</p><div class=\"ex\"><h4>步驟 2：高倍濾泡</h4><p>濾泡通常呈橢圓形。</p></div><div class=\"ex\"><h4>三個角色</h4><ul><li><b>濾泡細胞</b>：許多排列緊密的細胞圍繞在外。</li><li><b>卵母細胞</b>：位於濾泡中央。</li><li><b>濾泡腔</b>：成熟濾泡形成明顯的空腔。</li></ul></div><div class=\"ex\"><h4>深入解說：三個角色</h4><p>高倍下的濾泡包含：<b>卵母細胞</b>（位於中央或偏一側）、<b>濾泡細胞</b>（圍繞在外，隨發育由單層變多層）、<b>濾泡腔</b>（含液體的空間，成熟濾泡才明顯）。濾泡腔不是細胞核；卵母細胞內另有細胞核。示意圖強調關係，不要把圖上的細胞數當作照片的實測。</p></div><div class=\"ex\"><h4>分辨</h4><ul><li>腔：空白、無細胞。</li><li>卵母細胞：大細胞，有核。</li><li>濾泡細胞：小細胞，成層。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>如何分辨濾泡腔與卵母細胞內的核區？</p><p><b>答：</b>濾泡腔位於濾泡細胞之間，是無細胞的空間；核區在卵母細胞內，被細胞質包圍。</p></div>", "tb": [["step_004", "P196完整課本頁"]]}, {"id": "b3-a61-l11", "t": "濾泡發育：層數與空腔是線索", "sec": "s3", "slide": 15, "sourceSlides": [15, 16], "sourcePages": [6], "src": "課本P198；PPT 15、16", "figSpec": {"image": "follicles_all"}, "txt": "<h3>觀察與機制</h3><ul><li>先比較周圍細胞：薄層→立方形單層→多層，再比較濾泡腔出現及擴大。</li><li>原PPT排序為(C)→(A)→(E)→(D)→(B)。</li><li>各圖標尺不同，先看結構再按同圖標尺估算；不以螢幕圖片大小排序。</li></ul><p class=\"thinking\"><strong>想一想</strong> 為什麼E圖看起來大，仍不能只憑畫面尺寸把它排在最後？</p><div class=\"ex\"><h4>討論四：濾泡發育排序</h4><p>判斷濾泡是否成熟的標準：</p></div><div class=\"ex\"><h4>線索</h4><ul><li><b>濾泡腔</b>的大小：無 → 小 → 大。</li><li><b>濾泡細胞</b>的數目與層數：少 → 多、1 層 → 多層。</li></ul></div><div class=\"ex\"><h4>答案</h4><p>(A)(C)(E) 無濾泡腔，依層數排為 (C)(1 層且薄) → (A)(1 層立方) → (E)(多層)；(B)(D) 有腔，(B) 比 (D) 大。順序：<b>(C) → (A) → (E) → (D) → (B)</b>。</p></div><div class=\"ex\"><h4>深入解說：濾泡發育排序</h4><p>先比較周圍細胞：薄層→立方形單層→多層；再比較濾泡腔：無→小→大。教材排序為 (C)→(A)→(E)→(D)→(B)：(A)(C)(E) 無腔，依層數排為 (C)→(A)→(E)；(B)(D) 有腔，(B) 的腔比 (D) 大。各圖標尺不同，先看結構，再按同圖標尺估算，不要靠螢幕上圖片的大小排序。</p></div><div class=\"ex\"><h4>兩個線索</h4><ul><li>濾泡細胞層數：1 → 多。</li><li>濾泡腔：無 → 小 → 大。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>E 圖看起來大，為什麼不能只憑畫面尺寸排在最後？</p><p><b>答：</b>各圖放大倍率不同，畫面大小不能代表實際大小；腔的有無才是更可靠的線索。</p></div>", "tb": [["step_006", "P198完整課本頁"]]}, {"id": "b3-a61-l12", "t": "黃體：排卵後的組織轉變", "sec": "s3", "slide": 12, "sourceSlides": [12, 14], "sourcePages": [5, 6], "src": "課本P197、198；PPT 12、14", "figSpec": {"image": "corpus_pair"}, "txt": "<h3>觀察與機制</h3><ul><li>本教材黃體示例較充實，組成細胞大型，與具明顯濾泡腔及卵母細胞的濾泡不同。</li><li>黃體由排卵後濾泡組織轉變，具有內分泌功能，不是更大的卵母細胞。</li><li>不同時期黃體可能保留中央腔或血塊；不能把永遠無空腔、只由一種細胞組成當通則。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若一個疑似黃體仍有中央腔，應直接否定還是找更多特徵？</p><div class=\"ex\"><h4>步驟 3：黃體</h4><p>在濾泡周圍找橢圓形但體積更大、細胞更大型的構造。</p></div><div class=\"ex\"><h4>討論二（答案）</h4><p>成熟濾泡中央有明顯的空腔和卵母細胞，且有分層；卵巢邊緣的大構造像是只由一種細胞構成，沒有分層、中央沒有卵細胞，這是<b>黃體</b>。</p></div><div class=\"ex\"><h4>深入解說：黃體</h4><p>排卵後，濾泡剩下的組織轉變成<b>黃體</b>，由大型的細胞組成，具有內分泌功能（分泌黃體素與雌激素），不是更大的卵母細胞。黃體與具有明顯濾泡腔及卵母細胞的濾泡不同：沒有卵母細胞、沒有分層。不同時期的黃體可保留中央腔或血塊，所以不能把「永遠無空腔」當作通則。</p></div><div class=\"ex\"><h4>濾泡 vs 黃體</h4><ul><li>濾泡：有卵母細胞、有腔、分層。</li><li>黃體：大型細胞為主、無卵母細胞。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>疑似黃體仍有中央腔，應直接否定嗎？</p><p><b>答：</b>不要。可再找其他特徵（大型細胞、無卵母細胞），早期黃體可能保留腔或血塊。</p></div>", "tb": [["step_005", "P197完整課本頁"], ["step_006", "P198完整課本頁"]]}, {"id": "b3-a61-l13", "t": "看不到卵母細胞：先想切片位置", "sec": "s4", "slide": 11, "sourceSlides": [11, 14], "sourcePages": [4, 6], "src": "課本P196、198；PPT 11、14", "figSpec": {"image": "follicle"}, "txt": "<h3>觀察與機制</h3><ul><li>濾泡是立體構造，薄切片未穿過卵母細胞所在位置，就可能看不到它。</li><li>具腔濾泡的卵母細胞通常偏一側；不必切過濾泡幾何中心才看得到。</li><li>不在此切面不等於器官裡不存在；也需考慮發育、退化與標本品質。</li></ul><p class=\"thinking\"><strong>想一想</strong> 如何用連續切片檢查「此平面沒切到」的解釋？</p><div class=\"ex\"><h4>討論三：看不到卵母細胞</h4><p>濾泡是<b>立體</b>構造。切片時切的位置靠近濾泡邊緣，就不一定切到中央的卵母細胞。</p></div><div class=\"ex\"><h4>結論</h4><p>看不到卵母細胞，不代表沒有，先想切片位置。</p></div><div class=\"ex\"><h4>深入解說：切片與立體</h4><p>濾泡是球形的立體構造，薄切片只切到其中一個平面；如果切位靠近濾泡邊緣，可能沒有穿過卵母細胞所在位置，就看不到它。具腔濾泡的卵母細胞通常偏一側，不必切過濾泡中心才看得到。看不到不等於不存在；還要考慮發育階段、退化濾泡與標本品質。可用連續切片檢驗「這個平面沒切到」的解釋。</p></div><div class=\"ex\"><h4>可能原因</h4><ul><li>切位沒穿過。</li><li>濾泡退化。</li><li>標本品質。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>如何檢驗「只是這個平面沒切到」？</p><p><b>答：</b>用連續切片，看相鄰切面是否出現卵母細胞。</p></div>", "tb": [["step_004", "P196完整課本頁"], ["step_006", "P198完整課本頁"]]}, {"id": "b3-a61-l14", "t": "鼠、兔與人：避免物種混用", "sec": "s4", "slide": 13, "sourceSlides": [13], "sourcePages": [1, 6], "src": "課本P193、198；PPT 13", "figSpec": {"image": "ovary_low"}, "txt": "<h3>觀察與機制</h3><ul><li>鼠常有多個濾泡共同發育，多胎生是教材的比較重點。</li><li>原PPT把鼠與兔都說成每4～5天排卵一次；此概括不適用兔，兔屬誘發排卵動物。</li><li>人類也可能自然多排卵；不能把多個濾泡或多胎完全歸因於用藥，更不能只看切片診斷疾病。</li></ul><p class=\"thinking\"><strong>想一想</strong> 同樣可能多胎，是否代表鼠與兔的排卵調節完全相同？</p><div class=\"ex\"><h4>討論一：為何常見多個成熟濾泡</h4><p>鼠或兔約 <b>4～5 天</b>排卵一次，且每次排多顆（一胎可產多隻），所以容易同時看到多個成熟濾泡。</p></div><div class=\"ex\"><h4>對照</h4><p>人類每月只排卵一次，多數只排一顆，不容易同時看到多顆成熟濾泡。不要把鼠、兔的結果直接套用到人類。</p></div><div class=\"ex\"><h4>深入解說：物種不要混用</h4><p>教材比較的重點：鼠常有多個濾泡共同發育，多胎；人類通常每個週期只排一顆。教材（簡報）曾把鼠與兔概括為每 4–5 天排卵一次，此敘述不適用兔，兔屬<b>誘發排卵</b>動物，需交配刺激才排卵。人類也可能自然多排卵，多胎並非全由藥物造成，也不能只看切片就診斷疾病。</p></div><div class=\"ex\"><h4>比較</h4><ul><li>鼠：週期短，多顆排卵。</li><li>兔：誘發排卵。</li><li>人：通常單卵排卵。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>同樣多胎，代表鼠與兔排卵調節相同嗎？</p><p><b>答：</b>不是。鼠為自發排卵，兔為誘發排卵，機制不同。</p></div>", "tb": [["step_001", "P193完整課本頁"], ["step_006", "P198完整課本頁"]]}, {"id": "b3-a61-l15", "t": "兩套排序：有來源，也有條件", "sec": "s4", "slide": 9, "sourceSlides": [9, 16], "sourcePages": [3, 6], "src": "課本P195、198；PPT 9、16", "figSpec": {"pair": ["sperm_cells", "follicles_all"]}, "txt": "<h3>觀察與機制</h3><ul><li>細精管序列(b)→(a)→(c)→(d)→(e)，濾泡序列(C)→(A)→(E)→(D)→(B)。</li><li>第一組合併位置與細胞形態；第二組看周圍細胞層數及濾泡腔。</li><li>排序為教材代表性模型，個別切面大小與染色深淺不足以獨立證明全部發育過程。</li></ul><p class=\"thinking\"><strong>想一想</strong> 你能分別指出兩組排序最有力的一項圖像證據嗎？</p><div class=\"ex\"><h4>兩套排序</h4><p>精子排序依「核的變化與有無鞭毛」；濾泡排序依「濾泡腔與濾泡細胞層數」。</p></div><div class=\"ex\"><h4>提醒</h4><p>排序是依據切片靜態影像推論的先後，不是追蹤同一個細胞的真實發育過程。</p></div><div class=\"ex\"><h4>深入解說：兩套排序的證據</h4><p>睪丸序列 (b)→(a)→(c)→(d)→(e)：依位置、核形與鞭毛。卵巢序列 (C)→(A)→(E)→(D)→(B)：依濾泡細胞層數與濾泡腔。這是教材的代表性模型；個別切面的大小與染色深淺不足以獨立證明整個發育過程，仍需配合其他研究。</p></div><div class=\"ex\"><h4>最有力的圖像證據</h4><ul><li>睪丸：鞭毛的有無與位置。</li><li>卵巢：濾泡腔的有無與大小。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>排序可以視為追蹤同一細胞的真實發育嗎？</p><p><b>答：</b>不行。切片是靜態的，排序是依多個細胞的形態推論的先後。</p></div>", "tb": [["step_003", "P195完整課本頁"], ["step_006", "P198完整課本頁"]]}, {"id": "b3-a61-l16", "t": "觀察與推論：把證據寫完整", "sec": "s5", "slide": 3, "sourceSlides": [3, 7, 16], "sourcePages": [2, 3, 6], "src": "課本P194、195、198；PPT 3、7、16", "figSpec": {"image": "testis_high"}, "txt": "<h3>觀察與機制</h3><ul><li>可記錄核形、相對位置、細胞層及空腔；推論則附上理由與限制。</li><li>粗糙深染不單獨證明同源染色體正在聯會；需結合分期、染色或其他證據。</li><li>無法判讀的細胞可標待核，不強迫每個輪廓都有確定名稱。</li></ul><p class=\"thinking\"><strong>想一想</strong> 「核深染」與「正在前期Ⅰ聯會」之間，缺哪些證據？</p><div class=\"ex\"><h4>觀察與推論分開寫</h4><p>把「看到什麼」和「推論什麼」分欄寫。</p></div><div class=\"ex\"><h4>範例</h4><ul><li>觀察：a 細胞核膜消失、e 有鞭毛。</li><li>推論：a 正在減數分裂，e 為成熟精子，生成順序由外向內。</li></ul></div><div class=\"ex\"><h4>深入解說：證據要完整</h4><p>觀察欄記錄：核形、相對位置、細胞層數、空腔；推論欄寫理由與限制。粗糙深染的核不能單獨證明同源染色體正在聯會，需要結合分期、特殊染色或其他證據。無法判讀的細胞可標「待核」，不必強迫每個輪廓都有名稱。</p></div><div class=\"ex\"><h4>範例</h4><ul><li>觀察：核深染。</li><li>推論：可能進入減數分裂前期。</li><li>限制：需染色確認。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>「核深染」與「正在前期 I 聯會」之間缺哪些證據？</p><p><b>答：</b>缺染色體形態、聯會結構（如電子顯微鏡）以及分期的其他依據。</p></div>", "tb": [["step_002", "P194完整課本頁"], ["step_003", "P195完整課本頁"], ["step_006", "P198完整課本頁"]]}, {"id": "b3-a61-l17", "t": "標尺實作：比值比倍率可靠", "sec": "s5", "slide": 6, "sourceSlides": [6, 12, 15], "sourcePages": [2, 5, 6], "src": "課本P194、197、198；PPT 6、12、15", "figSpec": {"pair": ["testis_low", "corpus_high"]}, "txt": "<h3>觀察與機制</h3><ul><li>100 μm＝0.1 mm；30 μm＝0.03 mm，先核對單位再估算。</li><li>同一圖中構造若長2倍標尺，估算實長即為標尺代表值的2倍。</li><li>照片裁切與顯示縮放會改變螢幕長度；標尺須隨圖一起保留，不從此照片猜物鏡倍率。</li></ul><p class=\"thinking\"><strong>想一想</strong> 把照片縮為一半但保留標尺，估算結果應如何變化？</p><div class=\"ex\"><h4>用標尺比較大小</h4><p>要比較濾泡、黃體大小，用比例尺換算實際長度，比只看照片放大倍率可靠。</p></div><div class=\"ex\"><h4>做法</h4><p>量圖上長度 ÷ 比例尺長度 × 標示的 μm。</p></div><div class=\"ex\"><h4>深入解說：標尺的換算</h4><p>100 μm＝0.1 mm；30 μm＝0.03 mm，先核對單位再估算。若圖上某構造長是標尺的 2 倍，估算實長就是標尺代表值的 2 倍。照片被縮放或裁切時，標尺必須隨圖保留，否則無法換算；不能從螢幕大小猜物鏡倍率。</p></div><div class=\"ex\"><h4>步驟</h4><ul><li>量標尺長。</li><li>量構造長。</li><li>比值 × 標尺值。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>照片縮小一半但保留標尺，估算結果如何變化？</p><p><b>答：</b>不變。構造與標尺同比縮小，比值不變。</p></div>", "tb": [["step_002", "P194完整課本頁"], ["step_005", "P197完整課本頁"], ["step_006", "P198完整課本頁"]]}, {"id": "b3-a61-l18", "t": "整合紀錄：讓判讀可以回查", "sec": "s5", "slide": 1, "sourceSlides": [1, 2, 8, 9, 13, 14, 16], "sourcePages": [1, 3, 6], "src": "課本P193、195、198；PPT 1、2、8、9、13、14、16", "figSpec": {"image": "follicles_all"}, "txt": "<h3>觀察與機制</h3><ul><li>記錄標本、視野、尺度、直接觀察與發育推論，必要時附位置草圖。</li><li>七題討論完整保留；沒有自行觀察的結果，寫來源示例或待測，不偽造實驗。</li><li>靜態圖、形態排序與生理功能是不同層次，寫出能說明與尚不能說明的部分。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若別組不同意你的排序，你能提供哪個位置或形態證據？</p><div class=\"ex\"><h4>整合</h4><p>生殖腺產生配子：雄性為<b>睪丸</b>，雌性為<b>卵巢</b>。</p></div><div class=\"ex\"><h4>觀察到的構造</h4><ul><li>睪丸：許多細精管，內含精原細胞、精母細胞、精細胞和精子。</li><li>卵巢：不同發育階段、大小不一的濾泡及黃體。</li></ul></div><div class=\"ex\"><h4>記錄</h4><p>讓別人能依你的紀錄回到同一個視野查證。</p></div><div class=\"ex\"><h4>深入解說：讓判讀可回查</h4><p>記錄：標本編號、視野位置、尺度、直接觀察、發育推論，必要時附位置草圖，讓別人能回到同一視野查證。七題討論完整保留；沒有自行觀察的結果，寫「來源示例」或「待測」，不偽造實驗。靜態圖、形態排序與生理功能是不同層次，要分清楚「能說明」與「尚不能說明」的部分。</p></div><div class=\"ex\"><h4>檢查</h4><ul><li>位置有標嗎？</li><li>尺度有嗎？</li><li>推論的限制有寫嗎？</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>別組不同意你的排序，你能提供哪個證據？</p><p><b>答：</b>指出視野中的相對位置與形態特徵（如鞭毛、核膜、濾泡腔），並說明這些證據支持哪一種順序。</p></div>", "tb": [["step_001", "P193完整課本頁"], ["step_003", "P195完整課本頁"], ["step_006", "P198完整課本頁"]]}], "questions": [{"t": "課本圖：低倍與高倍", "q": "把觀察方式貼回課本兩張細精管照片。", "learn": 2, "tag": "scale", "hint": "先看視野範圍，再看同圖標尺。", "why": "左圖100 μm、右圖30 μm標尺；視野與構造細節不同，放大不改變實際大小。", "sub": "課本P194；PPT 6", "refs": [{"src": "testis_pair", "cap": "教材來源圖"}], "kind": "drag", "slots": [{"id": "g0s0", "label": "照片左", "group": 0}, {"id": "g1s0", "label": "照片右", "group": 1}], "pieces": [{"id": "ag0s0", "label": "低倍：找整體切面", "group": 0}, {"id": "ag1s0", "label": "高倍：看管壁細胞", "group": 1}, {"id": "distractor0", "label": "電子顯微鏡活體錄影", "group": 99}, {"id": "distractor1", "label": "直接測量游速", "group": 99}], "sol": {"g0s0": "ag0s0", "g1s0": "ag1s0"}, "pre": {}, "labelImage": "testis_pair-quiz", "imageLabels": [{"x": 23, "y": 94, "w": 40}, {"x": 73, "y": 94, "w": 40}], "id": "b3-a61-q01"}, {"t": "a到e：把先後貼回原圖", "q": "依原PPT，為(a)～(e)貼上生成順序。", "learn": 5, "tag": "sperm", "hint": "(b)靠外緣，(e)具尾部；回看來源完整圖。", "why": "教材序列(b)→(a)→(c)→(d)→(e)，須搭配原圖相對位置與核形。", "sub": "課本P195；PPT 7、9", "refs": [{"src": "sperm_cells", "cap": "教材來源圖"}], "legacyQuestion": 1, "kind": "drag", "slots": [{ 回看相對位置、形態及證據限制。", "課本P196、198；PPT 11、14"], "species": ["物種差異", "回看相對位置、形態及證據限制。", "課本P193、198；PPT 13"], "evidence": ["觀察與推論", "回看相對位置、形態及證據限制。", "課本P194、195、198；PPT 3、7、16"]}, "conceptMap": {"position": 4, "scale": 16, "sperm": 5, "meiosis": 6, "follicle": 10, "corpus": 11, "section": 12, "species": 13, "evidence": 15}, "originalCount": 10, "source": {"bookPages": 6, "printedPages": "193–198", "pptPages": 16, "presentationKind": "pptx-static"}, "pptText": {"1": "探討活動 \n6-1\n \n生殖腺與生殖細胞的觀察\n前言\n       動物隨著生長的過程，生殖腺也會逐漸發育成熟。動物體的生殖器官中，哪些構造與配子的產生有關？如何形成配子？\n配合課本 \nP193\n1", "2": "探討活動 \n6\n-\n1\n \n生殖腺與生殖細胞的觀察\n       本活動透過永久玻片標本觀察卵巢與睪丸中不同位置的細胞，並依據其構造或相對位置推論配子的形成過程。\n目的\n2\n配合課本 \nP193", "3": "探討活動 \n6-1\n \n生殖腺與生殖細胞的觀察\n       在觀察鼠或兔生殖腺標本的過程中，可根據卵巢內濾泡細胞的大小、外圍濾泡的形態變化以及中央生殖細胞的形態等，來推論生殖細胞可能的發育過程。而根據精子的形態變化，同樣可大致進行排序，推論精子的發育階段先後。\n原理\n3\n配合課本 \nP193", "4": "探討活動 \n6\n-\n1\n \n生殖腺與生殖細胞的觀察\n每組使用\n複式顯微鏡\n1\n 臺\n雄鼠或兔的睪丸永久玻片標本\n1\n 片\n雌鼠\n或兔\n的卵巢永久\n玻片標本\n1\n 片\n4\n配合課本 \nP193\n器材", "5": "探討活動 \n6\n-\n1 \n生殖腺與生殖細胞的觀察\n活動一 \n雄鼠睪丸的觀察\n步驟\n1\n將雄鼠的睪丸玻片標本放在顯微鏡下，以低倍鏡進行觀察，找找看是否有圓形或橢圓形的細精管構造？（管狀構造切面請參見「探討活動 \n3\n－\n1 \n腎臟的觀察」活動二\n討論 \n3.\n 的\n圖）\n5\n配合課本 \nP194", "6": "探討活動 \n6-1 \n生殖腺與生殖細胞的觀察\n2\n選擇一個較完整的細精管切面，並轉換成高倍鏡進行觀察。在接近中央管腔處，是否能看到絲狀的構造？此處的細胞有什麼特徵？接著觀察接近管壁外緣的細胞，這些細胞有什麼特徵？\n活動一 \n雄鼠睪丸的觀察\n6\n配合課本 \nP194\n低倍鏡下畫面\n100\n \nµm\n高倍鏡下畫面\n30\n \nµm", "7": "探討活動 \n6-1 \n生殖腺與生殖細胞的觀察\n15\n \nµm\n以高倍鏡觀察管壁的細胞，參照下圖所示，能否觀察\n到 \n(a)\n～\n(e)\n五\n種形態的細胞？注意細胞核的大小、染色體形態與位置，\n判斷 \n(a)\n～\n(\ne)\n 在\n細精管中的生成順序應為何？\n3\n活動一 \n雄鼠睪丸的觀察\n(a)\n(b)\n(c)\n(d)\n(e)\n7\n配合課本 \nP195", "8": "探討活動 \n6-1 \n生殖腺與生殖細胞的觀察\n活動一 \n雄鼠睪丸的觀察\n討論\n1. \n視野下的細精管，有的呈圓形、有的呈長橢圓形，為何細精管的形狀會有這麼大的差異？\n答\n：\n因\n睪丸中的細精管為立體纏繞的結構，製作切片標本時，會\n因刀片與\n細精管接觸的部位不同而產生不同的切面。若截切時刀片與管子近乎垂直，則切面較呈圓形，若刀片斜切管子，則切面較呈橢圓。（可參考「探討活動 \n3\n－\n1 \n腎臟的觀察」活動二\n討論 \n3.\n 圖片\n）\n8\n配合課本 \nP195", "9": "探討活動 \n6-1 \n生殖腺與生殖細胞的觀察\n活動一 \n雄鼠睪丸的觀察\n2. \n觀察精子外形，想想看，這樣的形態有何意義？\n3. \n如步驟 \n3 \n觀察睪丸的玻片標本，\n判斷 \n(a)\n～\n(e) \n在細精管中的生成順序應為何？\n答\n：\n簡單\n觀察精子的外形，可見其具有較大的頭部以及細長的尾部，頭部主要為遺傳物質，尾部則為鞭毛，可藉由擺動使精子前進。\n答\n：\n因\n圖\n (a) \n有核膜消失的特徵，推測正在進行減數分裂，而圖\n (e) \n可觀察到精子的鞭毛，故可判斷精子的生成是由細精管壁往管腔依序進行，故順序為\n (b) \n→\n (a) \n→\n (c) \n→\n (d) \n→\n (e)\n。\n9\n配合課本 \nP195", "10": "探討活動 \n6-1 \n生殖腺與生殖細胞的觀察\n活動二 雌\n鼠卵巢的觀察\n步驟\n1\n將雌鼠的卵巢切片標本放在顯微鏡下進行觀察，\n參照右圖\n所示，可觀察到許多圓形或橢圓形的構造，稱為濾泡。試著比較這些構造的差異。\n10\n配合課本 \nP196\n200\n \nµm", "11": "探討活動 \n6-1 \n生殖腺與生殖細胞的觀察\n110\n \nµm\n活動二 雌\n鼠卵巢的觀察\n以高倍鏡觀察濾泡，特徵如下圖所示。濾泡通常呈橢圓形，由許多排列緊密的濾泡細胞圍繞著中央的卵母細胞，且成熟濾泡會形成一個明顯的空腔。試著對照圖片，是否能找到相似的構造？是否能觀察到卵母細胞？\n2\n發育中的卵母細胞\n濾泡腔\n濾泡細胞\n11\n配合課本 \nP196", "12": "探討活動 \n6-1 \n生殖腺與生殖細胞的觀察\n活動二 雌\n鼠卵巢的觀察\n在濾泡周圍，試著找找看有沒有同樣呈橢圓形，但體積比濾泡還大或組成細胞更大型的其他構造？此構造與濾泡有何差異？\n3\n12\n配合課本 \nP197\n300\n \nµm\n35\n \nµm", "13": "探討活動 \n6-1 \n生殖腺與生殖細胞的觀察\n活動二 雌\n鼠卵巢的觀察\n討論\n1. \n顯微鏡低倍觀察卵巢的切片標本時，常會發現多個橢圓形的成熟濾泡，這代表什麼意義呢？\n答\n：\n鼠\n或兔為 \n4\n～\n5 \n天排卵一次，且每次會排出多顆（故一胎可產下多隻子代），較容易同時觀察到多顆成熟濾泡。而人類每月只排卵一次，且多數只排卵一顆，除非是施打了排卵針，否則較難同時看到多顆成熟濾泡。\n13\n配合課本 \nP198", "14": "探討活動 \n6-1 \n生殖腺與生殖細胞的觀察\n活動二 雌\n鼠卵巢的觀察\n2. \n在卵巢邊緣可觀察到比濾泡還要大的構造，此構造在形態上與濾泡有何差異？\n答\n：\n成熟的濾\n泡中央具有明顯的空腔\n，且可見中央具有卵母細胞，\n構造也可見明顯的分層；在卵巢邊緣觀察到的構造則像是僅由一種細胞構成，不具有構造上的分層\n，且中央沒有卵細胞，\n為黃體。\n3. \n為何有些濾泡可以觀察到中間的卵母細胞，有些卻無法？\n答\n：\n因\n濾泡為立體的構造，製作切片時因為截切的位置不同，若切的位置靠近濾泡邊緣，就不一定皆能觀察到較靠近中央的卵母細胞。\n14\n配合課本 \nP198", "15": "探討活動 \n6-1 \n生殖腺與生殖細胞的觀察\n活動二 雌\n鼠卵巢的觀察\n4. \n以下為活動中可能觀察到的構造，根據細胞形態與大小，試判斷並排列發育的先後順序應為何？\n(A)\n(B)\n(C)\n(D)\n(E)\n15\n配合課本 \nP198\n40\n \nµm\n130\n \nµm\n40\n \nµm\n130\n \nµm\n80\n \nµm", "16": "探討活動 \n6-1 \n生殖腺與生殖細胞的觀察\n活動二 雌\n鼠卵巢的觀察\n4. \n以下為活動中可能觀察到的構造，根據細胞形態與大小，試判斷並排列發育的先後順序應為何？\n16\n配合課本 \nP198\n答\n：\n濾泡成熟與否可由以下標準\n判斷\n：\n(1) \n濾泡腔的大小（無→小→大）。\n(2) \n周圍濾泡細胞的數目（少→多）與分層（\n1 \n層→多層）。\n而 \n(\nA)\n、\n(C)\n、\n(E\n)\n 皆\n無濾泡腔，再由周圍濾泡細胞的層數，順序為 \n(C)\n（\n1 \n層且薄）→ \n(A)\n（\n1 \n層且立方）→ \n(E)\n（多層）。\n(B)\n、\n(D) \n皆有濾泡腔，\n(B) \n比 \n(\nD) \n大。\n故濾泡的發育順序為 \n(C) → (A) → (E) → (D) → (B)\n。"}, "sourceCorrections": [{"ppt": [7, 9], "note": "教材字母順序保留(b)→(a)→(c)→(d)→(e)；核深染或核膜不清不能單獨證明特定減數分裂期，次級精母細胞不易見。"}, {"ppt": [13], "note": "原文把鼠與兔都說成每4～5天排卵一次不適用兔；兔為誘發排卵。人類也可能自然多排卵。"}, {"ppt": [14], "note": "黃體可有中央腔，不限單一細胞類型；具腔濾泡卵母細胞通常偏側，未見可能因切片位置。"}, {"ppt": [15, 16], "note": "濾泡順序(C)→(A)→(E)→(D)→(B)依細胞層及腔判讀；不同標尺圖不直接比畫面大小。"}], "originalLegacyQuestions": [{"kind": "drag", "g": "g1", "title": "睪丸細精管向心分化細胞層級盤", "sub": "課本 P194–195 細精管各層細胞特徵", "label": "分類題 · 拖放", "q": "請將下列細精管各位置之生殖細胞形態與特徵描述卡，拖曳至正確欄位中。", "hint": "基底外緣：精原細胞、幹細胞特性；中間層：初級精母體積最大粗線斑駁核、次級精母；管腔游離緣：精細胞、精子絲狀鞭毛。每欄 2 張卡。", "vb": [600, 480], "note": "三欄各放置 2 張細胞特徵卡", "slots": [{"id": "ba0", "x": 24, "y": 55, "w": 158, "h": 50, "ans": "ba_spermatogonia"}, {"id": "ba1", "x": 24, "y": 120, "w": 158, "h": 50, "ans": "ba_stem"}, {"id": "me0", "x": 218, "y": 55, "w": 158, "h": 50, "ans": "me_primary"}, {"id": "me1", "x": 218, "y": 120, "w": 158, "h": 50, "ans": "me_synapsis"}, {"id": "lu0", "x": 412, "y": 55, "w": 158, "h": 50, "ans": "lu_spermatid"}, {"id": "lu1", "x": 412, "y": 120, "w": 158, "h": 50, "ans": "lu_flagella"}], "pieces": [{"id": "ba_spermatogonia", "t": "緊貼管壁基底膜，細胞體積較小且細胞核圓形深染", "v": "ba_spermatogonia"}, {"id": "ba_stem", "t": "具幹細胞特性，經有絲分裂持續自我補充並分化為精母細胞", "v": "ba_stem"}, {"id": "me_primary", "t": "位於基底層內側，細胞體積為生殖細胞中最大者", "v": "me_primary"}, {"id": "me_synapsis", "t": "細胞核內可見同源染色體聯會粗絲狀構造，進行減數分裂 I", "v": "me_synapsis"}, {"id": "lu_spermatid", "t": "靠近中央管腔，細胞體積明顯變小，核圓形深染即將變態", "v": "lu_spermatid"}, {"id": "lu_flagella", "t": "游離於管腔中，呈現蝌蚪狀頭部並拖曳著細長絲狀鞭毛", "v": "lu_flagella"}], "pw": 256, "ph": 42, "tray": {"x": 20, "y": 280, "cols": 2, "gapX": 16, "gapY": 12}}, {"kind": "drag", "g": "g1", "title": "卵巢切片各級濾泡與黃體顯微鑑別盤", "sub": "課本 P196–198 卵巢微觀構造鑑別", "label": "分類題 · 拖放", "q": "請將下列關於卵巢切片中不同構造的顯微形態與生理描述卡，放置於正確欄位中。", "hint": "早期與生長：微小約35-40μm、單層或多層顆粒無腔；成熟濾泡：巨大約130μm、大濾泡腔與卵丘；黃體：實心結節達300μm、無卵分泌黃體素。每欄 2 張卡。", "vb": [600, 480], "note": "三欄各放置 2 張構造特性卡", "slots": [{"id": "ef0", "x": 24, "y": 55, "w": 158, "h": 50, "ans": "ef_primordial"}, {"id": "ef1", "x": 24, "y": 120, "w": 158, "h": 50, "ans": "ef_cortex"}, {"id": "mf0", "x": 218, "y": 55, "w": 158, "h": 50, "ans": "mf_antrum"}, {"id": "mf1", "x": 218, "y": 120, "w": 158, "h": 50, "ans": "mf_cumulus"}, {"id": "cl0", "x": 412, "y": 55, "w": 158, "h": 50, "ans": "cl_solid"}, {"id": "cl1", "x": 412, "y": 120, "w": 158, "h": 50, "ans": "cl_progest"}], "pieces": [{"id": "ef_primordial", "t": "直徑約 35～40 μm，由單層扁平或立方顆粒細胞包覆卵母細胞", "v": "ef_primordial"}, {"id": "ef_cortex", "t": "大量密集分佈於卵巢外周皮質最淺層，尚未形成液體空腔", "v": "ef_cortex"}, {"id": "mf_antrum", "t": "中央具巨大透明濾泡腔，內部充滿富含雌激素之濾泡液", "v": "mf_antrum"}, {"id": "mf_cumulus", "t": "卵母細胞偏居濾泡一側，被卵丘顆粒細胞托起形成基座", "v": "mf_cumulus"}, {"id": "cl_solid", "t": "直徑可達 300 μm 以上，無中央濾泡腔，由深染實心細胞組成", "v": "cl_solid"}, {"id": "cl_progest", "t": "由排卵後破裂濾泡壁轉變而來，專門分泌大量黃體素與動情素", "v": "cl_progest"}], "pw": 256, "ph": 42, "tray": {"x": 20, "y": 280, "cols": 2, "gapX": 16, "gapY": 12}}, {"kind": "drag", "g": "g1", "title": "顯微觀察實驗原理與討論思維盤", "sub": "課本 P195、P198 實驗討論題思維", "label": "分類題 · 拖放", "q": "請將下列實驗觀察現象的成因與生物學解釋卡，歸入正確的思考範疇中。", "hint": "切片幾何：三維球體截面未切中赤道面、彎曲管壁橫斜切面多樣；物種繁殖：鼠兔為多胎生見多個成熟濾泡；配子適應：精子蝌蚪狀丟棄胞質利游動。每欄 2 張卡。", "vb": [600, 480], "note": "三欄各放置 2 張實驗思維卡", "slots": [{"id": "cg0", "x": 24, "y": 55, "w": 158, "h": 50, "ans": "cg_oocyte_miss"}, {"id": "cg1", "x": 24, "y": 120, "w": 158, "h": 50, "ans": "cg_tubule_shape"}, {"id": "sr0", "x": 218, "y": 55, "w": 158, "h": 50, "ans": "sr_multi_litter"}, {"id": "sr1", "x": 218, "y": 120, "w": 158, "h": 50, "ans": "sr_synchro"}, {"id": "ga0", "x": 412, "y": 55, "w": 158, "h": 50, "ans": "ga_streamline"}, {"id": "ga1", "x": 412, "y": 120, "w": 158, "h": 50, "ans": "ga_mitochondria"}], "pieces": [{"id": "cg_oocyte_miss", "t": "切片厚度僅數微米，未切過球狀濾泡赤道面則無法觀察到卵核", "v": "cg_oocyte_miss"}, {"id": "cg_tubule_shape", "t": "細精管高度立體彎曲盤繞，微切刀橫切呈圓形、斜切呈長橢圓形", "v": "cg_tubule_shape"}, {"id": "sr_multi_litter", "t": "雌鼠切片常可見多個成熟濾泡，反映其多胎生繁殖之生理特徵", "v": "sr_multi_litter"}, {"id": "sr_synchro", "t": "多個濾泡在促性腺激素刺激下同步成熟排卵，以孕育多隻幼仔", "v": "sr_synchro"}, {"id": "ga_streamline", "t": "精子丟棄多餘細胞質減輕自重，呈流線蝌蚪狀利於快速游動", "v": "ga_streamline"}, {"id": "ga_mitochondria", "t": "中節螺旋緊密排列特化粒線體，專為尾部鞭毛擺動提供 ATP", "v": "ga_mitochondria"}], "pw": 256, "ph": 42, "tray": {"x": 20, "y": 280, "cols": 2, "gapX": 16, "gapY": 12}}, {"kind": "mc", "multi": false, "g": "g2", "title": "卵巢切片中部分濾泡未見卵母細胞之幾何原理解析", "sub": "課本 P198 討論 3 顯微切片立體原理", "label": "單選題", "q": "以顯微鏡觀察雌鼠卵巢切片標本時，常發現某些體積龐大且具濾泡腔的濾泡截面中，中央卻『看不到』卵母細胞。下列何者為造成此現象最合理的科學原因？", "hint": "思考三維立體球形濾泡與薄層切片的幾何交集。", "ref": ["p6_lab_summary_discussion", "課本 P198 討論 3"], "opts": [["該濾泡受到放射線照射突變，卵母細胞已被完全蒸發消失", "T1"], ["濾泡為三維立體球狀構造，切片刀僅切到濾泡外圍邊緣，未切過中央卵母細胞所在平面", null], ["卵母細胞已主動溶解周圍所有濾泡細胞並偽裝為結締組織", "T1"], ["顯微鏡物鏡倍率不足導致光學繞射干涉將卵母細胞完全隱形", "T1"]], "ans": [1], "exp": "B正確：成熟濾泡是一個直徑達 100～300 微米以上的立體球體，而病理切片厚度通常僅有 5～8 微米。當切片刀切過球體正中央赤道面時，才能同時切到濾泡腔與卵母細胞；若切片刀剛好切在球體的邊緣偏側（切線邊緣），其截面僅會包含外圍的濾泡細胞層與少許濾泡液，因此在二維顯微視野中便無法看到卵母細胞。"}, {"kind": "mc", "multi": false, "g": "g2", "title": "細精管管壁各生殖細胞在顯微鏡下之向心排列順序", "sub": "課本 P195 步驟 3 造精向心順序", "label": "單選題", "q": "在高倍鏡下由細精管管壁外緣（基底膜）朝向中央管腔游離緣依次觀察，生殖細胞成熟演進的正確順序應為下列何者？", "hint": "精原細胞 → 初級精母細胞 → 次級精母細胞 → 精細胞 → 精子。", "ref": ["p3_spermatogenesis_cells", "課本 P195 細精管管壁細胞觀察"], "opts": [["精子 → 精細胞 → 次級精母細胞 → 初級精母細胞 → 精原細胞", "T1"], ["精原細胞 → 初級精母細胞 → 次級精母細胞 → 精細胞 → 精子", null], ["精細胞 → 精原細胞 → 初級精母細胞 → 精子 → 次級精母細胞", "T1"], ["初級精母細胞 → 精原細胞 → 精子 → 精細胞 → 次級精母細胞", "T1"]], "ans": [1], "exp": "B正確：細精管內精子發生呈向心式分化。最外緣緊貼基底膜為具幹細胞特性的精原細胞（2n）；向內一層為體積最大的初級精母細胞（2n）；接著為完成減數分裂 I 的次級精母細胞（n）；再向管腔靠近為圓形小核的精細胞（n）；最內側游離於管腔中央游離緣的則是已長出鞭毛的成熟精子（n）。"}, {"kind": "mc", "multi": true, "g": "g2", "title": "雄性睪丸切片與生殖細胞顯微鑑別重點分析", "sub": "課本 P194–195 活動一 實驗重點", "label": "多選題", "q": "進行雄性哺乳動物睪丸切片之顯微觀察時，下列相關敘述哪些正確？（應選 3 項）", "hint": "檢核細精管橫斜切面形狀、初級精母染色質粗線狀、間質細胞位置、精子鞭毛游離方向。", "ref": ["p2_testis_low_high", "課本 P194–195 雄鼠睪丸觀察"], "opts": [["視野中細精管呈現圓形、長橢圓形或條狀，是由於盤曲管道受切片刀不同角度截切所致", null], ["初級精母細胞體積巨大，細胞核內染色質粗糙斑駁，反映其正在進行前期 I 同源聯會", null], ["在相鄰細精管之間的疏鬆結締組織三角形間隙中，可觀察到成群聚集的間質細胞", null], ["管腔中央的絲狀構造為神經膠細胞突起，負責在管腔中傳遞神經衝動刺激造精", "T1"], ["基底膜上的精原細胞為單倍體細胞（n），管腔中的精子則為四倍體細胞（4n）", "T1"]], "ans": [0, 1, 2], "exp": "A、B、C正確。D錯：管腔中央的絲狀構造是成熟精子的『鞭毛（尾部）』，並非神經突起；E錯：基底膜上的精原細胞是二倍體幹細胞（2n），管腔中的精子則是經過減數分裂後的單倍體配子（n）。"}, {"kind": "mc", "multi": true, "g": "g2", "title": "雌性卵巢切片中各級濾泡與黃體顯微鑑識深入對比", "sub": "課本 P196–198 活動二 卵巢切片重點", "label": "多選題", "q": "觀察雌鼠卵巢切片標本時，下列各項顯微構造特徵與生理意義之配對，哪些正確？（應選 3 項）", "hint": "檢視皮質與髓質分佈、成熟濾泡的濾泡腔與卵丘、黃體實體組織、多胎生動物濾泡表現。", "ref": ["p4_ovary_follicle_micro", "課本 P196–198 卵巢切片顯微特徵"], "opts": [["卵巢皮質區主要分佈各發育階段之濾泡，中央髓質區則富含血管、神經與疏鬆結締組織", null], ["成熟濾泡具有充盈液體的巨大濾泡腔，卵母細胞偏居一側由卵丘顆粒細胞所支撐", null], ["黃體為排卵後破裂濾泡轉化形成之實心腺體組織，切片中無濾泡腔且細胞深染富含微血管", null], ["低倍鏡下若觀察到多個成熟濾泡，即可百分之百斷定該隻動物罹患嚴重卵巢腫瘤病變", "T2"], ["初級濾泡內部含有成熟的單倍體受精卵，正處於有絲分裂末期準備著床", "T2"]], "ans": [0, 1, 2], "exp": "A、B、C正確。D錯：雌鼠或兔為多胎生動物，同一切片中同時出現多個成熟濾泡為正常的生理繁殖現象（討論 1），絕非腫瘤；E錯：初級濾泡內部包含的是暫停於減數分裂第一期前期的二倍體『初級卵母細胞（2n）』，絕非受精卵。"}, {"kind": "mc", "multi": true, "g": "g2", "title": "生殖腺切片微米標尺與顯微測量科學素養", "sub": "課本 P194–198 顯微尺度分析素養題", "label": "多選題", "q": "本探討活動標本圖片均附有微米標尺（Scale bar）。結合顯微測量與細胞尺度概念，下列推論哪些合理？（應選 3 項）", "hint": "檢核精細胞與初級精母尺寸對比、成熟濾泡與黃體尺寸、微米與毫米換算、顯微鏡視野直徑。", "ref": ["p6_follicle_stages_ae", "課本 P194–198 顯微標尺分析"], "opts": [["成熟濾泡（直徑約 130～200 μm）與黃體（直徑可達 300 μm）均顯著大於單個精原細胞（約 10～15 μm）", null], ["初級精母細胞（直徑約 15～20 μm）在光學顯微鏡下的截面積顯著大於變態完成後的精細胞核", null], ["顯微照片中的 100 μm 標尺長度代表 0.1 毫米，可用以定量估算細精管管徑約為 200～300 μm", null], ["單隻人類精子的頭部長度約為 500 μm（即半毫米），肉眼不藉助顯微鏡即可清晰看見", "T3"], ["卵母細胞周圍的透明帶厚度超過 1 毫米，在 40 倍低倍鏡下呈現巨大黑色圓環", "T3"]], "ans": [0, 1, 2], "exp": "A、B、C正確。D錯：精子頭部長度僅約 4～5 微米（μm），肉眼絕不可見，必須藉助 400 倍高倍顯微鏡才能辨析；E錯：透明帶厚度僅約 10～15 微米（0.01～0.015 毫米），絕不可能達到 1 毫米。"}]};

function splitBlock(node,body){
 // Range fragments keep inline emphasis and every character when a long paragraph needs another page.
 const length=node.textContent.length;if(!length)return [node];const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT),texts=[];let n,offset=0;while(n=walker.nextNode()){texts.push({node:n,start:offset,end:offset+n.length});offset+=n.length;}

  parts.push(fragment(from,best));from=best;

}
function paginateReading(){

function fitLessonTable(){if(!tableState)return;const {table,rows,pager}=tableState,canvas=table.closest('.figure-canvas');rows.forEach(r=>r.hidden=false);if(innerWidth<=900){tableState.count=rows.length;tableState.index=0;}else{const head=table.rows[0].getBoundingClientRect().height,room=canvas.clientHeight-head-2;let height=0,count=0;for(const row of rows){const h=row.getBoundingClientRect().height;if(height+h>room&&count)break;height+=h;count++;}tableState.count=Math.max(1,count);tableState.index=Math.max(0,Math.min(Math.ceil(rows.length/tableState.count)-1,tableState.index));}

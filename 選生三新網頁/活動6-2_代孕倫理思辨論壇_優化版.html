99完整原文；案例與法律為教材敘事，查核說明見教學重點</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>　　同學在進行討論之前，不妨先看看以下案例<br>：<br>2008 <br>年，一名<br>印度<br>代理孕母替一對<br>日本<br>夫妻進行代孕，但在孩子出生前，<br>日本<br>父母便離婚了，因此孩子一出生便遭到遺棄。代理孕母與日本母親皆不願撫養，而<br>日本<br>父親雖想留下孩子，卻因為<br>印度<br>法律規定單身人士不能進行收養，導致孩子的合法父母與國籍歸屬一直遲遲無法判定。<br>       <br>2014 <br>年，一名<br>泰國<br>代理孕母為一對<br>澳洲<br>夫婦生下一對雙胞胎，但其中一名嬰兒卻因患有唐氏症而被拒絕接收，這名被遺棄的嬰兒最終由代理孕母自行扶養。<br>5<br>配合課本 <br>P199<small>原PPT第5頁完整原文；參考論點不代表現行法或唯一答案</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>       由上述案例可知代理孕母的實行可能衍生許多問題，因涉及層面極廣，包括倫理、法律、心理、宗教等層次，且因各國歷史、文化和價值觀的差異，世界各地的立法規範皆不盡相同。<br>6<br>配合課本 <br>P200<small>原PPT第6頁完整原文；參考論點不代表現行法或唯一答案</small></div>", "tb": [["step_001", "P199完整課本頁"]]}, {"id": "b3-a62-l06", "t": "臺灣：現行法與修法提案分開", "sec": "s2", "slide": 4, "sourceSlides": [4, 13], "sourcePages": [1, 3], "src": "課本P199、201；PPT 4、13", "figSpec": {"image": "ppt_004"}, "txt": "<h3>概念與論證</h3><ul><li>此次查核的《人工生殖法》第2條仍以妻可自行孕育為受術夫妻定義，未建立國內代孕施術制度。</li><li>提案、委員會審查、三讀、公布及施行是不同階段；看到草案不能說已開放。</li><li>討論制度時，分別檢查孕者健康、兒童地位、委託者需求、監管及救濟。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若新聞說「草案通過」，還需知道哪個機關及哪個程序？</p><div class=\"scope-note\">查核2026-10-10；全國法規資料庫當次標示整編截止115-10-02。現行法、草案及倫理主張分列，課堂使用前可再開來源確認。</div><p>查核：2026-10-10。<a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0070024\" target=\"_blank\" rel=\"noopener noreferrer\">人工生殖法：第2、11、12條 ↗</a>；<a href=\"https://ppg.ly.gov.tw/ppg/bills/202110186750000/details\" target=\"_blank\" rel=\"noopener noreferrer\">立法院：人工生殖法修正草案議案 ↗</a></p><div class=\"quote\">探討活動 <br>－2 代理孕母的倫理與法律問題<br>前　言<br>　　近代隨著人工生殖科學技術的發展，讓許多不孕症夫妻得以透過捐精或是代理<br>孕母的方式擁有自己的小孩，但其中卻涉及許多倫理與法律的問題。在科技發展的<br>同時，想一想是否所有的科學技術發展都是有益而無害的？<br>目　的<br>　　透過討論了解代理孕母的議題究竟存在哪些爭議。<br>背　景<br>　　以生殖科技協助不孕夫妻生子的醫<br>學，稱為生殖輔助醫學。其中試管嬰兒是<br>以人工方式取得精子與卵，在體外受精並<br>培育成胚胎後（如右圖），再將胚胎移植<br>回母體子宮而懷孕、生產。就技術而言，<br>「母體子宮」可由其他婦女代勞，也就是<br>代理孕母，這對於子宮有缺陷的婦女而<br>言，是完成傳宗接代心願的唯一希望。我<br>國在民國85 年開始草擬人工生殖法，首<br>度將代理孕母列入討論，歷經多年爭論，人工生殖法終於在民國96 年完成立法，<br>但是有關代理孕母的相關法條仍被排除在外。後續的法案修正，代理孕母多次被討<br>論，但也仍被擱置，可見其爭議性無法獲得共識。<br>　　同學在進行討論之前，不妨先看看以下案例：2008 年，一名印度代理孕母替一<br>對日本夫妻進行代孕，但在孩子出生前，日本父母便離婚了，因此孩子一出生便遭<br>到遺棄。代理孕母與日本母親皆不願撫養，而日本父親雖想留下孩子，卻因為印度<br>法律規定單身人士不能進行收養，導致孩子的合法父母與國籍歸屬一直遲遲無法判<br>定。2014 年，一名泰國代理孕母為一對澳洲夫婦生下一對雙胞胎，但其中一名嬰兒<br>卻因患有唐氏症而被拒絕接收，這名被遺棄的嬰兒最終由代理孕母自行扶養。<br> 將卵和精子取出後，除了置於試管內使卵<br>受精以外，亦可利用顯微操作技術，在顯<br>微鏡下將單一精子注入卵內受精。<br>6<br>第 6 章  生殖　199<br><small>課本P199完整原文；案例與法律為教材敘事，查核說明見教學重點</small></div><div class=\"quote\">探討活動 <br>討　論<br>1  很多人批評為了繁殖高產乳量的乳牛或複製動物（含胚胎、器官），而進行動物<br>的代理孕母生產是不人道的，那麼若是為了金錢被迫成為代理孕母，是否貶低人<br>類的生育尊嚴？是否貶低女性的地位？<br>2  請就代理孕母懷胎分娩、對所生子女的情感等種種倫理與法律層面進行討論。<br>1  你認為代理孕母是否有權與長大後的孩子相認？請說明理由。若可以，則孩<br>子與孕母相認的時間點（年紀）以何時為宜？理由為何？<br>2  代理孕母在我國還不合法，相關議題在部分國家亦有所討論，為何代理孕母<br>在國內遲遲未能合法化？<br>3  若於產檢過程中發現胎兒異常，但引產又有風險的狀況下，代理孕母能否拒<br>絕引產或流產？<br>4  代理孕母和委託人是否有權單方面決定終止妊娠？<br>3  代理孕母一般只是提供子宮的代孕者，與腹中胎兒沒有血緣關係，但若代理孕母<br>是胎兒的外婆，仍有直系血親的血緣，是否可能衍生倫理上的問題與爭議？<br>第 6 章  生殖　201<br><small>課本P201完整原文；案例與法律為教材敘事，查核說明見教學重點</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>       就技術而言，「母體子宮」可由其他婦女代勞，也就是代理孕母，這對於子宮有缺陷的婦女而言，是完成傳宗接代心願的唯一希望。<br>       我國在<br>民國<br> <br>85 <br>年開始草擬<br>人工生殖法<br>，首度將代理孕母列入討論，歷經多年爭論，<br>人工生殖法<br>終於在<br>民國<br> <br>96 <br>年完成立法<br>，但是有關代理孕母的相關法條仍被排除在外。後續的法案修正，代理孕母多次被討論，但也仍被擱置，可見其爭議性無法獲得共識。<br>4<br>配合課本 <br>P199<small>原PPT第4頁完整原文；參考論點不代表現行法或唯一答案</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>(2<br>)<br> 代理孕母<br>在我國還不合法，相關議題在部分國家亦有所討論，為何代理孕母在國內遲遲未能合法化？<br>答<br>：<br>代理孕母<br>牽涉的範圍極廣，支持代孕的一方認為人生而自由，國家及法律應保障人民生育的權利，且代孕也是不孕者唯一可行的生殖方式，亦應保障不孕夫妻尋求生育的權利。反對代孕的一方則認為代孕會衍生許多問題，如法律方面對於親屬關係的界定、宗教與社會上則是認為代孕行為違反天性與倫理，且有物化女性之疑。若代理孕母欲合法化，則需嚴謹的法規與配套加以約束，在東方國家亦有倫理與道德層面等諸多問題有待解決。<br>13<br>配合課本 <br>P201<small>原PPT第13頁完整原文；參考論點不代表現行法或唯一答案</small></div>", "tb": [["step_001", "P199完整課本頁"], ["step_003", "P201完整課本頁"]]}, {"id": "b3-a62-l07", "t": "英國例子：合法不等於契約可強制", "sec": "s2", "slide": 7, "sourceSlides": [7], "sourcePages": [2], "src": "課本P200；PPT 7", "figSpec": {"image": "ppt_007"}, "txt": "<h3>概念與論證</h3><ul><li>英國政府說明代孕可依法進行，但代孕協議不能直接強制執行，給付限合理開銷。</li><li>出生時孕者具法律母親身分，法律親子關係需經親權命令或收養轉移。</li><li>課本國際分類為背景概述；不得據此推論所有地方的資格、仲介與親權均相同。</li></ul><p class=\"thinking\"><strong>想一想</strong> 「合約簽了」和「出生後法律父母確立」為何不能畫等號？</p><div class=\"scope-note\">本例適用英國所述制度；照護指引另限定英格蘭與威爾斯。不用未核對的全球國家分類作計分題。</div><p>查核：2026-10-10。<a href=\"https://www.gov.uk/legal-rights-when-using-surrogates-and-donors/overview\" target=\"_blank\" rel=\"noopener noreferrer\">英國政府：代孕與法律親子關係 ↗</a></p><div class=\"quote\">　　由上述案例可知代理孕母的實行可能衍生許多問題，因涉及層面極廣，包括倫<br>理、法律、心理、宗教等層次，且因各國歷史、文化和價值觀的差異，世界各地的<br>立法規範皆不盡相同。例如：在法國與德國，代孕被視為損害女性尊嚴而遭到完全<br>禁止；在英國則把代孕視為女性贈予另一位女性的行為，稱之為「利他主義」；美<br>國 加州、俄羅斯及烏克蘭則是允許商業代孕，並將此視為追求女性獨立精神的表<br>現；部分國家則至今仍沒有法律對此進行監管，例如：肯亞與奈及利亞，這種差異<br>甚至導致代孕行業「醫療旅遊」現象的盛行。<br>200　選修生物 Ⅲ (全)<br><small>課本P200完整原文；案例與法律為教材敘事，查核說明見教學重點</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>       例如<br>：<br>在<br>法國<br>與<br>德國<br>，代孕被視為損害女性尊嚴而遭到完全禁止；在<br>英國<br>則把代孕視為女性贈予另一位女性的行為，稱之為「利他主義」；<br>美國<br> <br>加州<br>、<br>俄羅斯<br>及<br>烏克蘭<br>則是允許商業代孕，並將此視為追求女性獨立精神的表現；部分國家則至今仍沒有法律對此進行監管，例如：<br>肯亞<br>與<br>奈及利亞<br>，這種差異甚至導致代孕行業「醫療旅遊」現象的盛行。<br>7<br>配合課本 <br>P200<small>原PPT第7頁完整原文；參考論點不代表現行法或唯一答案</small></div>", "tb": [["step_002", "P200完整課本頁"]]}, {"id": "b3-a62-l08", "t": "三方權益：不是只有兩份簽名", "sec": "s3", "slide": 6, "sourceSlides": [6, 8], "sourcePages": [2, 3], "src": "課本P200、201；PPT 6、8", "figSpec": {"image": "process"}, "txt": "<h3>概念與論證</h3><ul><li>孕者：健康、醫療同意、資訊、隱私與公平待遇；委託者：成家需求、資訊及照顧責任。</li><li>兒童：照顧、身分、國籍與免受歧視；不能只把他當作契約的交付結果。</li><li>同一爭點常涉及多方，不把權益硬分成互不相干的單一格。</li></ul><p class=\"thinking\"><strong>想一想</strong> 孩子尚不能簽約，制度應如何使其利益被納入？</p><p>查核：2026-10-10。<a href=\"https://www.ohchr.org/sites/default/files/crc.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">聯合國：兒童權利公約 ↗</a></p><div class=\"quote\">　　由上述案例可知代理孕母的實行可能衍生許多問題，因涉及層面極廣，包括倫<br>理、法律、心理、宗教等層次，且因各國歷史、文化和價值觀的差異，世界各地的<br>立法規範皆不盡相同。例如：在法國與德國，代孕被視為損害女性尊嚴而遭到完全<br>禁止；在英國則把代孕視為女性贈予另一位女性的行為，稱之為「利他主義」；美<br>國 加州、俄羅斯及烏克蘭則是允許商業代孕，並將此視為追求女性獨立精神的表<b >4  代理孕母和委託人是否有權單方面決定終止妊娠？<br>3  代理孕母一般只是提供子宮的代孕者，與腹中胎兒沒有血緣關係，但若代理孕母<br>是胎兒的外婆，仍有直系血親的血緣，是否可能衍生倫理上的問題與爭議？<br>第 6 章  生殖　201<br><small>課本P201完整原文；案例與法律為教材敘事，查核說明見教學重點</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>討論<br>1. <br>很多人批評為了繁殖高產乳量的乳牛或複製動物（含胚胎、器官），而進行動物的代理孕母生產是不人道的，那麼若是為了金錢被迫成為代理孕母，是否貶低人類的生育尊嚴？是否貶低女性的地位？<br>8<br>配合課本 <br>P201<small>原PPT第8頁完整原文；參考論點不代表現行法或唯一答案</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>答<br>：<br>代理孕母是指女性代替他人懷孕與生產，常用於協助不孕夫婦。當涉及金錢交換，尤其在經濟弱勢族群中，容易引發道德爭議。<br>(1) <br>有些人認為，當生育變成有償服務或交易對象，會使原本屬於生命延續、親情連結的過程被商品化。這可能讓生育不再是自主的選擇，而是經濟條件所迫的手段，從而影響生育行為的尊嚴與倫理價值。<br>(2) <br>若女性因經濟困境而被迫成為代理孕母，有可能造成：<br>① 身體自主權遭到削弱：懷孕過程不再基於自由意願，而是受到外在壓力控制。<br>② 將女性身體視為工具或子宮出租的傾向，可能強化性別刻板印象與弱勢地位。<br>9<br>配合課本 <br>P201<small>原PPT第9頁完整原文；參考論點不代表現行法或唯一答案</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>10<br>配合課本 <br>P201<br>答<br>：<br>然而<br>，也有支持者認為，只要是在充分知情、自由選擇、不受剝削的情況下，女性有權決定是否擔任代理孕母，這本身也是身體自主的一種表現<br>。<br>結論<br>：<br>代理孕母<br>制度是否貶低生育尊嚴與女性地位，端視是否建立在自由意志、公平條件及尊重身體自主的前提下。這個議題沒有單一標準答案，需要在倫理、法律及社會面向中持續討論與審慎規範<br>。<small>原PPT第10頁完整原文；參考論點不代表現行法或唯一答案</small></div>", "tb": [["step_003", "P201完整課本頁"]]}, {"id": "b3-a62-l10", "t": "身世、相認與隱私：不同層次", "sec": "s3", "slide": 11, "sourceSlides": [11, 12], "sourcePages": [3], "src": "課本P201；PPT 11、12", "figSpec": {"image": "ppt_011"}, "txt": "<h3>概念與論證</h3><ul><li>知悉身世、取得來源資訊、實際聯絡及法律親子身分，應分開討論。</li><li>成年是部分教材的提議，不是所有兒童在此前都不需年齡適切資訊。</li><li>相認安排需考量兒童意願、發展、隱私、各方期待與當地制度，不一律指定18歲。</li></ul><p class=\"thinking\"><strong>想一想</strong> 願意告知出生方式，是否代表必須安排立即見面？</p><div class=\"scope-note\">PPT第12頁所述烏克蘭禁止相認等概括未核實，不作現行法定論。</div><p>查核：2026-10-10。<a href=\"https://www.ohchr.org/sites/default/files/crc.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">聯合國：兒童權利公約 ↗</a></p><div class=\"quote\">探討活動 <br>討　論<br>1  很多人批評為了繁殖高產乳量的乳牛或複製動物（含胚胎、器官），而進行動物<br>的代理孕母生產是不人道的，那麼若是為了金錢被迫成為代理孕母，是否貶低人<br>類的生育尊嚴？是否貶低女性的地位？<br>2  請就代理孕母懷胎分娩、對所生子女的情感等種種倫理與法律層面進行討論。<br>1  你認為代理孕母是否有權與長大後的孩子相認？請說明理由。若可以，則孩<br>子與孕母相認的時間點（年紀）以何時為宜？理由為何？<br>2  代理孕母在我國還不合法，相關議題在部分國家亦有所討論，為何代理孕母<br>在國內遲遲未能合法化？<br>3  若於產檢過程中發現胎兒異常，但引產又有風險的狀況下，代理孕母能否拒<br>絕引產或流產？<br>4  代理孕母和委託人是否有權單方面決定終止妊娠？<br>3  代理孕母一般只是提供子宮的代孕者，與腹中胎兒沒有血緣關係，但若代理孕母<br>是胎兒的外婆，仍有直系血親的血緣，是否可能衍生倫理上的問題與爭議？<br>第 6 章  生殖　201<br><small>課本P201完整原文；案例與法律為教材敘事，查核說明見教學重點</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>2. <br>請就代理孕母懷胎分娩、對所生子女的情感等種種倫理與法律層面進行討論。<br>(1<br>)<br> 你<br>認為代理孕母是否有權與長大後的孩子相認？請說明理由。若可以，則孩子與孕母相認的時間點（年紀）以何時為宜？理由為何？<br>答<br>：<br>請<br>依所處立場（正方：同意／反<br>方<br>：<br>反對<br>）提出論述<br>。<br><br>參考<br>如下：<br>①<br> <br>正方<br>：<br>代理孕母<br>與孩子皆有彼此相認的權利，若雙方皆同意，不應阻止兩方相認。相認的時間點如成年以後<br>（<br>18 <br>歲），此時孩子身心發展完全，民法上為可對自我行為負責的完全人，有判斷能力及可分辨是非，能清楚生育與撫養的區別。孩子成年後再憑自己的意願選擇是否與孕母相認，亦可減少孕母對家庭可能造成的影響。<br>11<br>配合課本 <br>P201<small>原PPT第11頁完整原文；參考論點不代表現行法或唯一答案</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>②<br> <br>反方<br>：<br>否<br>，代理孕母至今仍存在許多議題，包括對傳統家庭模式的衝擊、社會人倫關係的界定等，代孕母親的出現，有可能使家庭的關係惡化，使孩子成為日後夫妻感情不合的導火索。再者一般人對懷胎十月、經歷產痛生下來才有親生的感覺，在此情況下，代孕母親是否能<br>割捨親情？孩子與代孕母親以及原本母親之間的關係應如何認定？面對複雜的倫理關係，是否會影響孩子的成長？目前合法代孕的國家如烏克蘭，亦禁止孕母與孩子建立過於親密的關係，如親自哺乳、與孩子相認等，孕母的相關資訊也會藉由代孕機構嚴密保護，以減少後續衍生的問題。<br>12<br>配合課本 <br>P201<small>原PPT第12頁完整原文；參考論點不代表現行法或唯一答案</small></div>", "tb": [["step_003", "P201完整課本頁"]]}, {"id": "b3-a62-l11", "t": "醫療決策：先認清接受處置的人", "sec": "s4", "slide": 14, "sourceSlides": [14, 15], "sourcePages": [3], "src": "課本P201；PPT 14、15", "figSpec": {"image": "ppt_014"}, "txt": "<h3>概念與論證</h3><ul><li>人工流產或引產的身體處置由孕者承受，不能由付款或照顧意願取代其醫療同意。</li><li>委託者的意願可參與溝通；具體處置須依孕者狀況、法律、醫療評估及有效同意。</li><li>不能把「拒絕就必定獨自扶養或違約賠償」當通則，法律地位及責任需另案查核。</li></ul><p class=\"thinking\"><strong>想一想</strong> 如果雙方意見不同，哪些事項可協商，哪些不能只憑合約決定？</p><div class=\"scope-note\">PPT列舉正反論點供檢視，不作強制施術的法律依據。</div><p>查核：2026-10-10。<a href=\"https://www.gov.uk/government/publications/having-a-child-through-surrogacy/care-in-surrogacy-guidance-for-the-care-of-surrogates-and-intended-parents-in-surrogate-births-in-england-and-wales\" target=\"_blank\" rel=\"noopener noreferrer\">英格蘭及威爾斯：代孕照護指引 ↗</a></p><div class=\"quote\">探討活動 <br>討　論<br>1  很多人批評為了繁殖高產乳量的乳牛或複製動物（含胚胎、器官），而進行動物<br>的代理孕母生產是不人道的，那麼若是為了金錢被迫成為代理孕母，是否貶低人<br>類的生育尊嚴？是否貶低女性的地位？<br>2  請就代理孕母懷胎分娩、對所生子女的情感等種種倫理與法律層面進行討論。<br>1  你認為代理孕母是否有權與長大後的孩子相認？請說明理由。若可以，則孩<br>子與孕母相認的時間點（年紀）以何時為宜？理由為何？<br>2  代理孕母在我國還不合法，相關議題在部分國家亦有所討論，為何代理孕母<br>在國內遲遲未能合法化？<br>3  若於產檢過程中發現胎兒異常，但引產又有風險的狀況下，代理孕母能否拒<br>絕引產或流產？<br>4  代理孕母和委託人是否有權單方面決定終止妊娠？<br>3  代理孕母一般只是提供子宮的代孕者，與腹中胎兒沒有血緣關係，但若代理孕母<br>是胎兒的外婆，仍有直系血親的血緣，是否可能衍生倫理上的問題與爭議？<br>第 6 章  生殖　201<br><small>課本P201完整原文；案例與法律為教材敘事，查核說明見教學重點</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>(3<br>)<br> 若<br>於產檢過程中發現胎兒異常，但引產又有風險的狀況下，代理孕母能否拒絕引產或流產？<br>答<br>：<br>①<br> <br>正方<br>：<br>能<br>，代理孕母出於自願同意代孕行為，在引產或流產可能危及生命的情況下，應保有決定是否引產的權利，但需承擔後續責任，例如<br>：胎兒出生<br>後需自行撫養，以及負擔違約的責任等。<br>②<br> <br>反方<br>：<br>否<br>，代孕<br>的胎兒出生<br>後是由委託代孕的父母撫養，故應以後者的意見為主，若發現胎兒異常時有權利終止懷孕，<br>避免胎兒出生<br>後給家庭帶來撫養上的負擔<br>，但需<br>負擔引產手術期間可能造成的風險。<br>14<br>配合課本 <br>P201<small>原PPT第14頁完整原文；參考論點不代表現行法或唯一答案</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>(4<br>)<br> 代理孕母<br>和委託人是否有權單方面決定終止妊娠？<br>答<br>：<br>①<br> <br>正方<br>：<br>能<br>，代理孕母是出於自願同意代孕行為，若因不得已的原因需終止妊娠，應尊重其決定；委託人因孩子出生後主要是由其撫養，若因其判斷後續無法撫養孩子，欲終止妊娠，則應以其意見為主。但無論是由哪方提出終止妊娠，提出方皆應負擔違約的責任。<br>15<br>配合課本 <br>P201<small>原PPT第15頁完整原文；參考論點不代表現行法或唯一答案</small></div>", "tb": [["step_003", "P201完整課本頁"]]}, {"id": "b3-a62-l12", "t": "24週：完整條文比口號重要", "sec": "s4", "slide": 16, "sourceSlides": [16], "sourcePages": [3], "src": "課本P201；PPT 16", "figSpec": {"image": "ppt_016"}, "txt": "<h3>概念與論證</h3><ul><li>PPT只引用一般24週規則後推成全面禁止，省略了條文的醫療行為例外。</li><li>現行施行細則第15條設一般週數規則及醫療行為例外，不能只讀前半句。</li><li>例外也不是任何人可自行要求無條件施術；個案須由專業人員依適用規範評估。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若刪掉條文的「但」字後半句，推論會如何改變？</p><div class=\"scope-note\">2026-10-10查核；此為條文閱讀練習，不代替個人醫療處置判斷。</div><p>查核：2026-10-10。<a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0070002\" target=\"_blank\" rel=\"noopener noreferrer\">優生保健法施行細則：第15條 ↗</a></p><div class=\"quote\">探討活動 <br>討　論<br>1  很多人批評為了繁殖高產乳量的乳牛或複製動物（含胚胎、器官），而進行動物<br>的代理孕母生產是不人道的，那麼若是為了金錢被迫成為代理孕母，是否貶低人<br>類的生育尊嚴？是否貶低女性的地位？<br>2  請就代理孕母懷胎分娩、對所生子女的情感等種種倫理與法律層面進行討論。<br>1  你認為代理孕母是否有權與長大後的孩子相認？請說明理由。若可以，則孩<br>子與孕母相認的時間點（年紀）以何時為宜？理由為何？<br>2  代理孕母在我國還不合法，相關議題在部分國家亦有所討論，為何代理孕母<br>在國內遲遲未能合法化？<br>3  若於產檢過程中發現胎兒異常，但引產又有風險的狀況下，代理孕母能否拒<br>絕引產或流產？<br>4  代理孕母和委託人是否有權單方面決定終止妊娠？<br>3  代理孕母一般只是提供子宮的代孕者，與腹中胎兒沒有血緣關係，但若代理孕母<br>是胎兒的外婆，仍有直系血親的血緣，是否可能衍生倫理上的問題與爭議？<br>第 6 章  生殖　201<br><small>課本P201完整原文；案例與法律為教材敘事，查核說明見教學重點</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>②<br> <br>反方<br>：<br>是否<br>可單方面決定終止妊娠，應於雙方契約訂定時即列入考量，針對不同的情況，可能會有不同的規範內容，以雙方達成的共識為主。此外也應考慮其他層面的問題，<br>例如<br>：<br>法律方面<br>：<br>各國<br>對於人工流產皆有相關規定，以臺灣為例，<br>《<br>優生保健法施行細則<br>》<br>第 <br>15 <br>條<br>規定<br>：<br>「人工流產<br>應於妊娠 <br>24 <br>週內施行。」故 <br>24 <br>週以後禁止終止妊娠。宗教倫理<br>方面<br>：<br>有些<br>人認為胎兒一旦成形即視為獨立的生命，故不應於懷孕後再因個人的要求而扼殺生命，剝奪其生存的權利。<br>16<br>配合課本 <br>P201<small>原PPT第16頁完整原文；參考論點不代表現行法或唯一答案</small></div>", "tb": [["step_003", "P201完整課本頁"]]}, {"id": "b3-a62-l13", "t": "外婆代孕：親緣、角色與自由", "sec": "s4", "slide": 17, "sourceSlides": [17, 18], "sourcePages": [3], "src": "課本P201；PPT 17、18", "figSpec": {"image": "process"}, "txt": "<h3>概念與論證</h3><ul><li>若使用女兒與其伴侶的配子，外婆不是本次卵子提供者，但仍與孩子有原有親緣。</li><li>親屬互助可能增加支持，也可能帶來難以拒絕的情感壓力；兩者都需要檢視。</li><li>家庭稱謂、醫療風險、照顧分工與資訊揭露可討論，不能斷言必有認同混亂或必無爭議。</li></ul><p class=\"thinking\"><strong>想一想</strong> 怎樣讓親屬真正可以拒絕，而不失去家庭支持？</p><div class=\"scope-note\">妊娠代孕不等於近親配子結合，也不能保證胎兒「完全健康」。</div><div class=\"quote\">探討活動 <br>討　論<br>1  很多人批評為了繁殖高產乳量的乳牛或複製動物（含胚胎、器官），而進行動物<br>的代理孕母生產是不人道的，那麼若是為了金錢被迫成為代理孕母，是否貶低人<br>類的生育尊嚴？是否貶低女性的地位？<br>2  請就代理孕母懷胎分娩、對所生子女的情感等種種倫理與法律層面進行討論。<br>1  你認為代理孕母是否有權與長大後的孩子相認？請說明理由。若可以，則孩<br>子與孕母相認的時間點（年紀）以何時為宜？理由為何？<br>2  代理孕母在我國還不合法，相關議題在部分國家亦有所討論，為何代理孕母<br>在國內遲遲未能合法化？<br>3  若於產檢過程中發現胎兒異常，但引產又有風險的狀況下，代理孕母能否拒<br>絕引產或流產？<br>4  代理孕母和委託人是否有權單方面決定終止妊娠？<br>3  代理孕母一般只是提供子宮的代孕者，與腹中胎兒沒有血緣關係，但若代理孕母<br>是胎兒的外婆，仍有直系血親的血緣，是否可能衍生倫理上的問題與爭議？<br>第 6 章  生殖　201<br><small>課本P201完整原文；案例與法律為教材敘事，查核說明見教學重點</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>3. <br>代理孕母一般只是提供子宮的代孕者，與腹中胎兒沒有血緣關係，但若代理孕母是胎兒的外婆，仍有直系血親的血緣，是否可能衍生倫理上的問題與爭議？<br>答<br>：<br>請<br>依所處立場（<br>正方<br>：<br>不會<br>／反<br>方<br>：<br>會<br>）提出論述<br>。<br><br>參考如下<br>：<br>(1<br>)<br> 正方<br>：<br>若<br>代理孕母為胎兒的外婆，與胎兒本身具有直系血緣關係，對於胎兒而言，孕母同樣也是疼愛他的長輩，故較不會有倫理上的問題。如英國禁止商業性質的代孕，但卻鼓勵由母親、姊妹、親友等人擔任代理孕母，如此一來代孕者不需要與孩子切斷關係，對孩子而言也多一個疼愛者，而非爭奪者。<br>17<br>配合課本 <br>P201<small>原PPT第17頁完整原文；參考論點不代表現行法或唯一答案</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>(2<br>)<br> 反方<br>：<br>雖<br>是直系血緣關係的親屬，但孩子出生後，仍可能存在與代孕母親與原生母親之間的關係應如何釐清的爭議，反而會使關係更加混亂，<br>例如<br>：<br>孩子<br>應該叫孕母「媽媽」還是「外婆」？應該叫原本的母親「姊姊」還是「媽媽」？在其他親戚眼中，又會如何看待三者間的關係？<br>18<br>配合課本 <br>P201<small>原PPT第18頁完整原文；參考論點不代表現行法或唯一答案</small></div>", "tb": [["step_003", "P201完整課本頁"]]}, {"id": "b3-a62-l14", "t": "從立場走向可回應的論證", "sec": "s5", "slide": 9, "sourceSlides": [9, 10, 13], "sourcePages": [3], "src": "課本P201；PPT 9、10、13", "figSpec": {"image": "ppt_010"}, "txt": "<h3>概念與論證</h3><ul><li>先說主張與適用條件，再給證據，說明證據如何支持理由。</li><li>辨認事實、價值判斷與制度提議；不同類型需要不同的支持。</li><li>回應反方最有力的理由，說出哪些新證據會讓你修正立場。</li></ul><p class=\"thinking\"><strong>想一想</strong> 你的立場有哪些前提？如果前提不成立，結論是否也需調整？</p><div class=\"quote\">探討活動 <br>討　論<br>1  很多人批評為了繁殖高產乳量的乳牛或複製動物（含胚胎、器官），而進行動物<br>的代理孕母生產是不人道的，那麼若是為了金錢被迫成為代理孕母，是否貶低人<br>類的生育尊嚴？是否貶低女性的地位？<br>2  請就代理孕母懷胎分娩、對所生子女的情感等種種倫理與法律層面進行討論。<br>1  你認為代理孕母是否有權與長大後的孩子相認？請說明理由。若可以，則孩<br>子與孕母相認的時間點（年紀）以何時為宜？理由為何？<br>2  代理孕母在我國還不合法，相關議題在部分國家亦有所討論，為何代理孕母<br>在國內遲遲未能合法化？<br>3  若於產檢過程中發現胎兒異常，但引產又有風險的狀況下，代理孕母能否拒<br>絕引產或流產？<br>4  代理孕母和委託人是否有權單方面決定終止妊娠？<br>3  代理孕母一般只是提供子宮的代孕者，與腹中胎兒沒有血緣關係，但若代理孕母<br>是胎兒的外婆，仍有直系血親的血緣，是否可能衍生倫理上的問題與爭議？<br>第 6 章  生殖　201<br><small>課本P201完整原文；案例與法律為教材敘事，查核說明見教學重點</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>答<br>：<br>代理孕母是指女性代替他人懷孕與生產，常用於協助不孕夫婦。當涉及金錢交換，尤其在經濟弱勢族群中，容易引發道德爭議。<br>(1) <br>有些人認為，當生育變成有償服務或交易對象，會使原本屬於生命延續、親情連結的過程被商品化。這可能讓生育不再是自主的選擇，而是經濟條件所迫的手段，從而影響生育行為的尊嚴與倫理價值。<br>(2) <br>若女性因經濟困境而被迫成為代理孕母，有可能造成：<br>① 身體自主權遭到削弱：懷孕過程不再基於自由意願，而是受到外在壓力控制。<br>② 將女性身體視為工具或子宮出租的傾向，可能強化性別刻板印象與弱勢地位。<br>9<br>配合課本 <br>P201<small>原PPT第9頁完整原文；參考論點不代表現行法或唯一答案</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>10<br>配合課本 <br>P201<br>答<br>：<br>然而<br>，也有支持者認為，只要是在充分知情、自由選擇、不受剝削的情況下，女性有權決定是否擔任代理孕母，這本身也是身體自主的一種表現<br>。<br>結論<br>：<br>代理孕母<br>制度是否貶低生育尊嚴與女性地位，端視是否建立在自由意志、公平條件及尊重身體自主的前提下。這個議題沒有單一標準答案，需要在倫理、法律及社會面向中持續討論與審慎規範<br>。<small>原PPT第10頁完整原文；參考論點不代表現行法或唯一答案</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>(2<br>)<br> 代理孕母<br>在我國還不合法，相關議題在部分國家亦有所討論，為何代理孕母在國內遲遲未能合法化？<br>答<br>：<br>代理孕母<br>牽涉的範圍極廣，支持代孕的一方認為人生而自由，國家及法律應保障人民生育的權利，且代孕也是不孕者唯一可行的生殖方式，亦應保障不孕夫妻尋求生育的權利。反對代孕的一方則認為代孕會衍生許多問題，如法律方面對於親屬關係的界定、宗教與社會上則是認為代孕行為違反天性與倫理，且有物化女性之疑。若代理孕母欲合法化，則需嚴謹的法規與配套加以約束，在東方國家亦有倫理與道德層面等諸多問題有待解決。<br>13<br>配合課本 <br>P201<small>原PPT第13頁完整原文；參考論點不代表現行法或唯一答案</small></div>", "tb": [["step_003", "P201完整課本頁"]]}, {"id": "b3-a62-l15", "t": "制度設計：寫出落實與救濟", "sec": "s5", "slide": 6, "sourceSlides": [6, 10, 13], "sourcePages": [2, 3], "src": "課本P200、201；PPT 6、10、13", "figSpec": {"image": "process"}, "txt": "<h3>概念與論證</h3><ul><li>以自主、避免傷害、公平及兒童利益比較制度，不只問開放或禁止。</li><li>提出獨立諮詢、醫療保險、親權程序或申訴時，還要問由誰負責、誰付費、如何執行。</li><li>比較方案的受益者、風險承擔者及排除效果，並記錄未解爭點。</li></ul><p class=\"thinking\"><strong>想一想</strong> 一條好聽的保障條款，如何確認它實際保護了最弱勢的一方？</p><div class=\"quote\">　　由上述案例可知代理孕母的實行可能衍生許多問題，因涉及層面極廣，包括倫<br>理、法律、心理、宗教等層次，且因各國歷史、文化和價值觀的差異，世界各地的<br>立法規範皆不盡相同。例如：在法國與德國，代孕被視為損害女性尊嚴而遭到完全<br>禁止；在英國則把代孕視為女性贈予另一位女性的行為，稱之為「利他主義」；美<br>國 加州、俄羅斯及烏克蘭則是允許商業代孕，並將此視為追求女性獨立精神的表<br>現；部分國家則至今仍沒有法律對此進行監管，例如：肯亞與奈及利亞，這種差異<br>甚至導致代孕行業「醫療旅遊」現象的盛行。<br>200　選修生物 Ⅲ (全)<br><small>課本P200完整原文；案例與法律為教材敘事，查核說明見教學重點</small></div><div class=\"quote\">探討活動 <br>討　論<br>1  很多人批評為了繁殖高產乳量的乳牛或複製動物（含胚胎、器官），而進行動物<br>的代理孕母生產是不人道的，那麼若是為了金錢被迫成為代理孕母，是否貶低人<br>類的生育尊嚴？是否貶低女性的地位？<br>2  請就代理孕母懷胎分娩、對所生子女的情感等種種倫理與法律層面進行討論。<br>1  你認為代理孕母是否有權與長大後的孩子相認？請說明理由。若可以，則孩<br>子與孕母相認的時間點（年紀）以何時為宜？理由為何？<br>2  代理孕母在我國還不合法，相關議題在部分國家亦有所討論，為何代理孕母<br>在國內遲遲未能合法化？<br>3  若於產檢過程中發現胎兒異常，但引產又有風險的狀況下，代理孕母能否拒<br>絕引產或流產？<br>4  代理孕母和委託人是否有權單方面決定終止妊娠？<br>3  代理孕母一般只是提供子宮的代孕者，與腹中胎兒沒有血緣關係，但若代理孕母<br>是胎兒的外婆，仍有直系血親的血緣，是否可能衍生倫理上的問題與爭議？<br>第 6 章  生殖　201<br><small>課本P201完整原文；案例與法律為教材敘事，查核說明見教學重點</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>       由上述案例可知代理孕母的實行可能衍生許多問題，因涉及層面極廣，包括倫理、法律、心理、宗教等層次，且因各國歷史、文化和價值觀的差異，世界各地的立法規範皆不盡相同。<br>6<br>配合課本 <br>P200<small>原PPT第6頁完整原文；參考論點不代表現行法或唯一答案</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>10<br>配合課本 <br>P201<br>答<br>：<br>然而<br>，也有支持者認為，只要是在充分知情、自由選擇、不受剝削的情況下，女性有權決定是否擔任代理孕母，這本身也是身體自主的一種表現<br>。<br>結論<br>：<br>代理孕母<br>制度是否貶低生育尊嚴與女性地位，端視是否建立在自由意志、公平條件及尊重身體自主的前提下。這個議題沒有單一標準答案，需要在倫理、法律及社會面向中持續討論與審慎規範<br>。<small>原PPT第10頁完整原文；參考論點不代表現行法或唯一答案</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>(2<br>)<br> 代理孕母<br>在我國還不合法，相關議題在部分國家亦有所討論，為何代理孕母在國內遲遲未能合法化？<br>答<br>：<br>代理孕母<br>牽涉的範圍極廣，支持代孕的一方認為人生而自由，國家及法律應保障人民生育的權利，且代孕也是不孕者唯一可行的生殖方式，亦應保障不孕夫妻尋求生育的權利。反對代孕的一方則認為代孕會衍生許多問題，如法律方面對於親屬關係的界定、宗教與社會上則是認為代孕行為違反天性與倫理，且有物化女性之疑。若代理孕母欲合法化，則需嚴謹的法規與配套加以約束，在東方國家亦有倫理與道德層面等諸多問題有待解決。<br>13<br>配合課本 <br>P201<small>原PPT第13頁完整原文；參考論點不代表現行法或唯一答案</small></div>", "tb": [["step_002", "P200完整課本頁"], ["step_003", "P201完整課本頁"]]}, {"id": "b3-a62-l16", "t": "完整討論：以理由評閱，不評立場", "sec": "s5", "slide": 8, "sourceSlides": [8, 11, 13, 14, 15, 16, 17, 18], "sourcePages": [3], "src": "課本P201；PPT 8、11、13、14、15、16、17、18", "figSpec": {"image": "discussions"}, "txt": "<h3>概念與論證</h3><ul><li>課本第1題、第2題四小題及第3題全文保留，分關閱讀與記錄。</li><li>以論點清楚、來源可查、概念區分、反駁與尊重評閱，不以支持或反對給分。</li><li>不需透露自己或家人的健康與生育史；可選擇暫不表態，先提出待查證據。</li></ul><p class=\"thinking\"><strong>想一想</strong> 如何在不同意對方時，準確重述對方最強的理由？</p><div class=\"quote\">探討活動 <br>討　論<br>1  很多人批評為了繁殖高產乳量的乳牛或複製動物（含胚胎、器官），而進行動物<br>的代理孕母生產是不人道的，那麼若是為了金錢被迫成為代理孕母，是否貶低人<br>類的生育尊嚴？是否貶低女性的地位？<br>2  請就代理孕母懷胎分娩、對所生子女的情感等種種倫理與法律層面進行討論。<br>1  你認為代理孕母是否有權與長大後的孩子相認？請說明理由。若可以，則孩<br>子與孕母相認的時間點（年紀）以何時為宜？理由為何？<br>2  代理孕母在我國還不合法，相關議題在部分國家亦有所討論，為何代理孕母<br>在國內遲遲未能合法化？<br>3  若於產檢過程中發現胎兒異常，但引產又有風險的狀況下，代理孕母能否拒<br>絕引產或流產？<br>4  代理孕母和委託人是否有權單方面決定終止妊娠？<br>3  代理孕母一般只是提供子宮的代孕者，與腹中胎兒沒有血緣關係，但若代理孕母<br>是胎兒的外婆，仍有直系血親的血緣，是否可能衍生倫理上的問題與爭議？<br>第 6 章  生殖　201<br><small>課本P201完整原文；案例與法律為教材敘事，查核說明見教學重點</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>討論<br>1. <br>很多人批評為了繁殖高產乳量的乳牛或複製動物（含胚胎、器官），而進行動物的代理孕母生產是不人道的，那麼若是為了金錢被迫成為代理孕母，是否貶低人類的生育尊嚴？是否貶低女性的地位？<br>8<br>配合課本 <br>P201<small>原PPT第8頁完整原文；參考論點不代表現行法或唯一答案</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>2. <br>請就代理孕母懷胎分娩、對所生子女的情感等種種倫理與法律層面進行討論。<br>(1<br>)<br> 你<br>認為代理孕母是否有權與長大後的孩子相認？請說明理由。若可以，則孩子與孕母相認的時間點（年紀）以何時為宜？理由為何？<br>答<br>：<br>請<br>依所處立場（正方：同意／反<br>方<br>：<br>反對<br>）提出論述<br>。<br><br>參考<br>如下：<br>①<br> <br>正方<br>：<br>代理孕母<br>與孩子皆有彼此相認的權利，若雙方皆同意，不應阻止兩方相認。相認的時間點如成年以後<br>（<br>18 <br>歲），此時孩子身心發展完全，民法上為可對自我行為負責的完全人，有判斷能力及可分辨是非，能清楚生育與撫養的區別。孩子成年後再憑自己的意願選擇是否與孕母相認，亦可減少孕母對家庭可能造成的影響。<br>11<br>配合課本 <br>P201<small>原PPT第11頁完整原文；參考論點不代表現行法或唯一答案</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>(2<br>)<br> 代理孕母<br>在我國還不合法，相關議題在部分國家亦有所討論，為何代理孕母在國內遲遲未能合法化？<br>答<br>：<br>代理孕母<br>牽涉的範圍極廣，支持代孕的一方認為人生而自由，國家及法律應保障人民生育的權利，且代孕也是不孕者唯一可行的生殖方式，亦應保障不孕夫妻尋求生育的權利。反對代孕的一方則認為代孕會衍生許多問題，如法律方面對於親屬關係的界定、宗教與社會上則是認為代孕行為違反天性與倫理，且有物化女性之疑。若代理孕母欲合法化，則需嚴謹的法規與配套加以約束，在東方國家亦有倫理與道德層面等諸多問題有待解決。<br>13<br>配合課本 <br>P201<small>原PPT第13頁完整原文；參考論點不代表現行法或唯一答案</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>(3<br>)<br> 若<br>於產檢過程中發現胎兒異常，但引產又有風險的狀況下，代理孕母能否拒絕引產或流產？<br>答<br>：<br>①<br> <br>正方<br>：<br>能<br>，代理孕母出於自願同意代孕行為，在引產或流產可能危及生命的情況下，應保有決定是否引產的權利，但需承擔後續責任，例如<br>：胎兒出生<br>後需自行撫養，以及負擔違約的責任等。<br>②<br> <br>反方<br>：<br>否<br>，代孕<br>的胎兒出生<br>後是由委託代孕的父母撫養，故應以後者的意見為主，若發現胎兒異常時有權利終止懷孕，<br>避免胎兒出生<br>後給家庭帶來撫養上的負擔<br>，但需<br>負擔引產手術期間可能造成的風險。<br>14<br>配合課本 <br>P201<small>原PPT第14頁完整原文；參考論點不代表現行法或唯一答案</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>(4<br>)<br> 代理孕母<br>和委託人是否有權單方面決定終止妊娠？<br>答<br>：<br>①<br> <br>正方<br>：<br>能<br>，代理孕母是出於自願同意代孕行為，若因不得已的原因需終止妊娠，應尊重其決定；委託人因孩子出生後主要是由其撫養，若因其判斷後續無法撫養孩子，欲終止妊娠，則應以其意見為主。但無論是由哪方提出終止妊娠，提出方皆應負擔違約的責任。<br>15<br>配合課本 <br>P201<small>原PPT第15頁完整原文；參考論點不代表現行法或唯一答案</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>②<br> <br>反方<br>：<br>是否<br>可單方面決定終止妊娠，應於雙方契約訂定時即列入考量，針對不同的情況，可能會有不同的規範內容，以雙方達成的共識為主。此外也應考慮其他層面的問題，<br>例如<br>：<br>法律方面<br>：<br>各國<br>對於人工流產皆有相關規定，以臺灣為例，<br>《<br>優生保健法施行細則<br>》<br>第 <br>15 <br>條<br>規定<br>：<br>「人工流產<br>應於妊娠 <br>24 <br>週內施行。」故 <br>24 <br>週以後禁止終止妊娠。宗教倫理<br>方面<br>：<br>有些<br>人認為胎兒一旦成形即視為獨立的生命，故不應於懷孕後再因個人的要求而扼殺生命，剝奪其生存的權利。<br>16<br>配合課本 <br>P201<small>原PPT第16頁完整原文；參考論點不代表現行法或唯一答案</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>3. <br>代理孕母一般只是提供子宮的代孕者，與腹中胎兒沒有血緣關係，但若代理孕母是胎兒的外婆，仍有直系血親的血緣，是否可能衍生倫理上的問題與爭議？<br>答<br>：<br>請<br>依所處立場（<br>正方<br>：<br>不會<br>／反<br>方<br>：<br>會<br>）提出論述<br>。<br><br>參考如下<br>：<br>(1<br>)<br> 正方<br>：<br>若<br>代理孕母為胎兒的外婆，與胎兒本身具有直系血緣關係，對於胎兒而言，孕母同樣也是疼愛他的長輩，故較不會有倫理上的問題。如英國禁止商業性質的代孕，但卻鼓勵由母親、姊妹、親友等人擔任代理孕母，如此一來代孕者不需要與孩子切斷關係，對孩子而言也多一個疼愛者，而非爭奪者。<br>17<br>配合課本 <br>P201<small>原PPT第17頁完整原文；參考論點不代表現行法或唯一答案</small></div><div class=\"quote\">探討活動 <br>6-<br>2<br> <br>代理孕母的倫理與法律問題<br>(2<br>)<br> 反方<br>：<br>雖<br>是直系血緣關係的親屬，但孩子出生後，仍可能存在與代孕母親與原生母親之間的關係應如何釐清的爭議，反而會使關係更加混亂，<br>例如<br>：<br>孩子<br>應該叫孕母「媽媽」還是「外婆」？應該叫原本的母親「姊姊」還是「媽媽」？在其他親戚眼中，又會如何看待三者間的關係？<br>18<br>配合課本 <br>P201<small>原PPT第18頁完整原文；參考論點不代表現行法或唯一答案</small></div>", "tb": [["step_003", "P201完整課本頁"]]}], "questions": [{"t": "課本圖貼標籤：技術與妊娠的環節", "q": "依課本示意圖（P199），把名稱放回圖上的編號格：配子來源、體外操作與培養、顯微注射，以及妊娠者與胚胎。", "learn": 1, "tag": "technology", "hint": "由左而右：配子來自委託者或提供者，在體外受精並培養，再把胚胎移植到妊娠者的子宮。", "why": "這張示意圖只說明技術環節：配子的來源、體外操作（含 ICSI）與胚胎培養，以及妊娠與分娩；圖片不能判定法律親子關係或合法性。", "sub": "課本 P199 圖（無文字標籤，標示位置）", "refs": [{"src": "mk_proc", "cap": "技術環節"}], "kind": "drag", "mask": "mk_proc", "ar": 1.1528, "layout": "side", "slots": [{"id": "s0", "label": "卵子", "group": 0, "x": 13.48, "y": 29.18, "v": false, "w": false}, {"id": "s1", "label": "精子", "group": 1, "x": 25. 58, "h": 50, "ans": "sm_exploit"}, {"id": "sm1", "x": 218, "y": 120, "w": 158, "h": 50, "ans": "sm_abort_right"}, {"id": "pr0", "x": 412, "y": 55, "w": 158, "h": 50, "ans": "pr_infertility"}, {"id": "pr1", "x": 412, "y": 120, "w": 158, "h": 50, "ans": "pr_divorce_breach"}], "pieces": [{"id": "cr_gammy", "t": "患唐氏症雙胞胎嬰兒遭委託方拒收棄養，生命淪為被挑選之商品", "v": "cr_gammy"}, {"id": "cr_identity", "t": "孩童長大後是否享有知曉自身出生真相與尋求代孕母相認之人權", "v": "cr_identity"}, {"id": "sm_exploit", "t": "經濟貧困底層女性為生計出賣健康與子宮，面臨階級剝削與物化", "v": "sm_exploit"}, {"id": "sm_abort_right", "t": "產檢發現胎兒異常時，代孕母基於自身身體完整性享有引產決定權", "v": "sm_abort_right"}, {"id": "pr_infertility", "t": "為子宮嚴重病變或先天缺失的不孕夫妻提供擁有遺傳骨肉之可能", "v": "pr_infertility"}, {"id": "pr_divorce_breach", "t": "委託夫妻於懷孕期間離異拒絕認領，引發嬰兒無國籍與撫養糾紛", "v": "pr_divorce_breach"}], "pw": 256, "ph": 42, "tray": {"x": 20, "y": 280, "cols": 2, "gapX": 16, "gapY": 12}}, {"kind": "mc", "multi": false, "g": "g2", "title": "傳統代孕與妊娠代孕之核心遺傳學差異判定", "sub": "課本 P199 生殖輔助醫學概念", "label": "單選題", "q": "現代生殖醫學通常將代理孕母區分為『傳統代孕』與『妊娠代孕』。下列關於兩者核心技術與遺傳關係的比較，何者完全正確？", "hint": "注意卵子是由誰提供？代孕母是否具有基因遺傳關係？", "ref": ["p1_art_surrogacy_intro", "課本 P199 代理孕母背景"], "opts": [["傳統代孕的胎兒與代孕母無遺傳關聯，而妊娠代孕則有直接血緣關係", "T1"], ["傳統代孕由代孕母提供卵子（具遺傳關聯）；妊娠代孕由委託夫妻提供配子（代孕母無遺傳關聯）", null], ["兩者均完全不需要使用男性的精子，純粹藉由幹細胞無性生殖克隆完成", "T1"], ["妊娠代孕是指代孕母在體外提供子宮，由機器進行懷胎生產", "T1"]], "ans": [1], "exp": "B正確：傳統代孕（Traditional surrogacy）是代孕者同時提供『卵子與子宮』，以人工授精受孕，代孕者為胎兒的遺傳學親生母親；而妊娠代孕（Gestational surrogacy）則是使用委託夫妻（或捐贈者）的精卵於體外受精（IVF）培育為胚胎後再植入代孕母子宮，代孕母僅提供子宮懷胎，與胎兒『完全沒有任何基因遺傳關聯』。"}, {"kind": "mc", "multi": false, "g": "g2", "title": "代孕過程中胎兒異常時醫療自主權之倫理位階", "sub": "課本 P201 討論 2（3） 身體自主權思辨", "label": "單選題", "q": "若代理孕母在懷孕中期的產檢過程中發現胎兒患有先天缺陷，委託人依合約要求立即進行人工流產，但引產手術對代孕母具有重大生命健康風險，此時代孕母拒絕引產。依據生命倫理與法律原則，下列判斷何者最合理？", "hint": "任何合約均不得凌駕於人身生命健康與身體自主權之上。", "ref": ["p3_parental_rights_termination", "課本 P201 討論 2（3）"], "opts": [["委託人支付了金錢，享有對代孕母身體的完全所有權，醫院應強制逮捕代孕母施行動手術", "T1"], ["代孕母是承擔手術侵入風險的活體主體，基於不可讓渡的身體自主權，有權拒絕危及生命的引產手術", null], ["胎兒已具有完全民事行為能力，應由胎兒簽署委託書授權律師決定", "T1"], ["法院應立即沒收代孕母的公民權並強制由人工智慧直接代行簽署手術同意書", "T1"]], "ans": [1], "exp": "B正確：在現代法律與生命倫理學中，『人身自由與身體完整自主權』屬於最高位階之基本人權。代孕合約本質上不得約定侵犯他人生命健康危險之強制條款；進行引產手術承受麻醉與手術生命風險者是代理孕母本人，因此代孕母享有絕對之知情同意權，有權拒絕危及其自身安全之侵入性醫療操作。"}, {"kind": "mc", "multi": true, "g": "g2", "title": "跨國商業代孕所引發之法律糾紛與人權爭點分析", "sub": "課本 P199–200 案例與國際現象分析", "label": "多選題", "q": "探討 2008 年日印代孕案與 2014 年泰澳甘米案等國際跨國代孕實例，下列相關反思哪些正確？（應選 3 項）", "hint": "檢核跨國親權認定障礙、缺陷棄養商品化批判、無國籍兒童困境、各國修法禁令。", "ref": ["p1_international_cases_abandonment", "課本 P199–200 跨國代孕案例"], "opts": [["委託夫妻若在懷孕期間離異或反悔，極易導致代孕出生的新生兒面臨無人認領之撫養危機", null], ["泰澳甘米案反映商業代孕將新生命視為可挑選、退貨之商品，嚴重違背兒童最佳利益原則", null], ["各國對代孕合法性與收養資格之法律衝突，可能導致跨國出生的嬰兒陷入無國籍法律困境", null], ["泰國在甘米案發生後，立即修法宣布全球所有外國人均可在泰國免費無限次代孕", "T1"], ["跨國代孕契約只要雙方私下簽名，在全世界任何國家均自動具有強制執行的絕對法律效力", "T1"]], "ans": [0, 1, 2], "exp": "A、B、C正確。D錯：泰國在甘米案後震驚朝野，隨即嚴格立法全面禁止外國人赴泰進行商業代孕；E錯：多數國家（如法、德、西班牙等）視代孕合約違反公序良俗而自始絕對無效，跨國代孕合約在許多司法管轄區完全不受法律保護。"}, {"kind": "mc", "multi": true, "g": "g2", "title": "反對商業代理孕母制度之倫理學與社會學論點", "sub": "課本 P200–201 倫理批判核心論述", "label": "多選題", "q": "許多社會學家、女性主義者與法學家對『商業代理孕母』持強烈批判態度。下列哪些屬於其核心論點？（應選 3 項）", "hint": "檢視身體機能商品化、階級貧富剝削、懷胎情感割裂、物化女性生殖能力。", "ref": ["p3_surrogacy_ethics_dignity", "課本 P200–201 倫理爭議剖析"], "opts": [["商業代孕將女性子宮與懷胎機能商品化，如同出租身體器官，實質上貶低了人性尊嚴", null], ["高額金錢誘因可能使經濟弱勢底層女性在生計逼迫下『非自願』承擔高風險妊娠，造成階級剝削", null], ["強行切斷代孕母在懷胎十月中與胎兒建立的神經內分泌與心理情感連結，易對孕母造成心理創傷", null], ["商業代孕會導致人類精子與卵子在體外受精時發生百分之百不可逆的染色體三倍體突變", "T2"], ["開放代孕後所有自然懷孕的已婚婦女均會被法律強制剝奪對親生子女的扶養權", "T2"]], "ans": [0, 1, 2], "exp": "A、B、C正確。D錯：代孕使用的是標準體外受精技術，染色體突變與是否商業代孕無關；E錯：開放代孕僅規範代孕契約，絕不可能影響或剝奪一般自然生育婦女的親權。"}, {"kind": "mc", "multi": true, "g": "g2", "title": "親屬代孕倫理衝擊與台灣人工生殖法制思維", "sub": "課本 P199、P201 討論 3 與台灣法制素養", "label": "多選題", "q": "探討代理孕母在我國的立法可行性及『親屬代孕』（如外婆替女兒代孕）之倫理困境，下列論述哪些合理？（應選 3 項）", "hint": "檢核外婆代孕之輩分角色混淆、民法分娩者為母原則衝擊、台灣現行法排除代孕現狀。", "ref": ["p3_parental_rights_termination", "課本 P199、P201 討論 3"], "opts": [["外婆替女兒代孕會使代孕者同時兼具『分娩母親』與『外婆』雙重身分，易引發家庭角色與倫理混淆", null], ["我國民法傳統上採『分娩者為母』之法律推定，若無特別立法規範，代孕所生子女親權判定將產生重大爭端", null], ["我國現行《人工生殖法》完成立法時，因社會對代孕爭議無法凝聚共識，仍將代理孕母排除在外", null], ["外婆替女兒代孕在遺傳學上會使胎兒的 DNA 與全人類完全不相容而無法存活", "T3"], ["立法院已正式立法強制規定所有不孕症夫妻必須出國尋求跨國商業代孕方能辦理戶籍", "T3"]], "ans": [0, 1, 2], "exp": "A、B、C正確。D錯：外婆僅提供子宮懷胎（若使用女兒女婿的胚胎），胎兒基因全來自女兒女婿，遺傳上完全正常健康；E錯：我國法律絕無強制出國代孕之荒謬規定，台灣現行人工生殖法尚未開放代孕。"}], "pptText": {"1": "探討活動 \n6-\n2\n \n代理孕母的倫理與法律問題\n前言\n　近代隨著人工生殖科學技術的發展，讓許多不孕症夫妻得以透過捐精或是代理孕母的方式擁有自己的小孩，但其中卻涉及許多倫理與法律的問題。在科技發展的同時，想一想是否所有的科學技術發展都是有益而無害的？\n配合課本 \nP199\n1\n助你好\n孕", "2": "探討活動 \n6-\n2\n \n代理孕母的倫理與法律問題\n目的\n透過討論了解代理孕母的議題究竟存在哪些爭議。\n2\n配合課本 \nP199", "3": "探討活動 \n6-\n2\n \n代理孕母的倫理與法律問題\n背景\n       以生殖科技協助不孕夫妻生子的醫學，稱為生殖輔助醫學。其中試管嬰兒是以人工方式取得精子與卵，在體外受精並培育成胚胎後（如右圖），再將胚胎移植回母體子宮而懷孕、生產。\n將卵和精子取出後，除了置於試管內使卵受精以外，亦可利用顯微操作技術，在顯微鏡下將單一精子注入卵內受精。\n3\n配合課本 \nP199", "4": "探討活動 \n6-\n2\n \n代理孕母的倫理與法律問題\n       就技術而言，「母體子宮」可由其他婦女代勞，也就是代理孕母，這對於子宮有缺陷的婦女而言，是完成傳宗接代心願的唯一希望。\n       我國在\n民國\n \n85 \n年開始草擬\n人工生殖法\n，首度將代理孕母列入討論，歷經多年爭論，\n人工生殖法\n終於在\n民國\n \n96 \n年完成立法\n，但是有關代理孕母的相關法條仍被排除在外。後續的法案修正，代理孕母多次被討論，但也仍被擱置，可見其爭議性無法獲得共識。\n4\n配合課本 \nP199", "5": "探討活動 \n6-\n2\n \n代理孕母的倫理與法律問題\n　　同學在進行討論之前，不妨先看看以下案例\n：\n2008 \n年，一名\n印度\n代理孕母替一對\n日本\n夫妻進行代孕，但在孩子出生前，\n日本\n父母便離婚了，因此孩子一出生便遭到遺棄。代理孕母與日本母親皆不願撫養，而\n日本\n父親雖想留下孩子，卻因為\n印度\n法律規定單身人士不能進行收養，導致孩子的合法父母與國籍歸屬一直遲遲無法判定。\n       \n2014 \n年，一名\n泰國\n代理孕母為一對\n澳洲\n夫婦生下一對雙胞胎，但其中一名嬰兒卻因患有唐氏症而被拒絕接收，這名被遺棄的嬰兒最終由代理孕母自行扶養。\n5\n配合課本 \nP199", "6": "探討活動 \n6-\n2\n \n代理孕母的倫理與法律問題\n       由上述案例可知代理孕母的實行可能衍生許多問題，因涉及層面極廣，包括倫理、法律、心理、宗教等層次，且因各國歷史、文化和價值觀的差異，世界各地的立法規範皆不盡相同。\n6\n配合課本 \nP200", "7": "探討活動 \n6-\n2\n \n代理孕母的倫理與法律問題\n       例如\n：\n在\n法國\n與\n德國\n，代孕被視為損害女性尊嚴而遭到完全禁止；在\n英國\n則把代孕視為女性贈予另一位女性的行為，稱之為「利他主義」；\n美國\n \n加州\n、\n俄羅斯\n及\n烏克蘭\n則是允許商業代孕，並將此視為追求女性獨立精神的表現；部分國家則至今仍沒有法律對此進行監管，例如：\n肯亞\n與\n奈及利亞\n，這種差異甚至導致代孕行業「醫療旅遊」現象的盛行。\n7\n配合課本 \nP200", "8": "探討活動 \n6-\n2\n \n代理孕母的倫理與法律問題\n討論\n1. \n很多人批評為了繁殖高產乳量的乳牛或複製動物（含胚胎、器官），而進行動物的代理孕母生產是不人道的，那麼若是為了金錢被迫成為代理孕母，是否貶低人類的生育尊嚴？是否貶低女性的地位？\n8\n配合課本 \nP201", "9": "探討活動 \n6-\n2\n \n代理孕母的倫理與法律問題\n答\n：\n代理孕母是指女性代替他人懷孕與生產，常用於協助不孕夫婦。當涉及金錢交換，尤其在經濟弱勢族群中，容易引發道德爭議。\n(1) \n有些人認為，當生育變成有償服務或交易對象，會使原本屬於生命延續、親情連結的過程被商品化。這可能讓生育不再是自主的選擇，而是經濟條件所迫的手段，從而影響生育行為的尊嚴與倫理價值。\n(2) \n若女性因經濟困境而被迫成為代理孕母，有可能造成：\n① 身體自主權遭到削弱：懷孕過程不再基於自由意願，而是受到外在壓力控制。\n② 將女性身體視為工具或子宮出租的傾向，可能強化性別刻板印象與弱勢地位。\n9\n配合課本 \nP201", "10": "探討活動 \n6-\n2\n \n代理孕母的倫理與法律問題\n10\n配合課本 \nP201\n答\n：\n然而\n，也有支持者認為，只要是在充分知情、自由選擇、不受剝削的情況下，女性有權決定是否擔任代理孕母，這本身也是身體自主的一種表現\n。\n結論\n：\n代理孕母\n制度是否貶低生育尊嚴與女性地位，端視是否建立在自由意志、公平條件及尊重身體自主的前提下。這個議題沒有單一標準答案，需要在倫理、法律及社會面向中持續討論與審慎規範\n。", "11": "探討活動 \n6-\n2\n \n代理孕母的倫理與法律問題\n2. \n請就代理孕母懷胎分娩、對所生子女的情感等種種倫理與法律層面進行討論。\n(1\n)\n 你\n認為代理孕母是否有權與長大後的孩子相認？請說明理由。若可以，則孩子與孕母相認的時間點（年紀）以何時為宜？理由為何？\n答\n：\n請\n依所處立場（正方：同意／反\n方\n：\n反對\n）提出論述\n。\n\n參考\n如下：\n①\n \n正方\n：\n代理孕母\n與孩子皆有彼此相認的權利，若雙方皆同意，不應阻止兩方相認。相認的時間點如成年以後\n（\n18 \n歲），此時孩子身心發展完全，民法上為可對自我行為負責的完全人，有判斷能力及可分辨是非，能清楚生育與撫養的區別。孩子成年後再憑自己的意願選擇是否與孕母相認，亦可減少孕母對家庭可能造成的影響。\n11\n配合課本 \nP201", "12": "探討活動 \n6-\n2\n \n代理孕母的倫理與法律問題\n②\n \n反方\n：\n否\n，代理孕母至今仍存在許多議題，包括對傳統家庭模式的衝擊、社會人倫關係的界定等，代孕母親的出現，有可能使家庭的關係惡化，使孩子成為日後夫妻感情不合的導火索。再者一般人對懷胎十月、經歷產痛生下來才有親生的感覺，在此情況下，代孕母親是否能\n割捨親情？孩子與代孕母親以及原本母親之間的關係應如何認定？面對複雜的倫理關係，是否會影響孩子的成長？目前合法代孕的國家如烏克蘭，亦禁止孕母與孩子建立過於親密的關係，如親自哺乳、與孩子相認等，孕母的相關資訊也會藉由代孕機構嚴密保護，以減少後續衍生的問題。\n12\n配合課本 \nP201", "13": "探討活動 \n6-\n2\n \n代理孕母的倫理與法律問題\n(2\n)\n 代理孕母\n在我國還不合法，相關議題在部分國家亦有所討論，為何代理孕母在國內遲遲未能合法化？\n答\n：\n代理孕母\n牽涉的範圍極廣，支持代孕的一方認為人生而自由，國家及法律應保障人民生育的權利，且代孕也是不孕者唯一可行的生殖方式，亦應保障不孕夫妻尋求生育的權利。反對代孕的一方則認為代孕會衍生許多問題，如法律方面對於親屬關係的界定、宗教與社會上則是認為代孕行為違反天性與倫理，且有物化女性之疑。若代理孕母欲合法化，則需嚴謹的法規與配套加以約束，在東方國家亦有倫理與道德層面等諸多問題有待解決。\n13\n配合課本 \nP201", "14": "探討活動 \n6-\n2\n \n代理孕母的倫理與法律問題\n(3\n)\n 若\n於產檢過程中發現胎兒異常，但引產又有風險的狀況下，代理孕母能否拒絕引產或流產？\n答\n：\n①\n \n正方\n：\n能\n，代理孕母出於自願同意代孕行為，在引產或流產可能危及生命的情況下，應保有決定是否引產的權利，但需承擔後續責任，例如\n：胎兒出生\n後需自行撫養，以及負擔違約的責任等。\n②\n \n反方\n：\n否\n，代孕\n的胎兒出生\n後是由委託代孕的父母撫養，故應以後者的意見為主，若發現胎兒異常時有權利終止懷孕，\n避免胎兒出生\n後給家庭帶來撫養上的負擔\n，但需\n負擔引產手術期間可能造成的風險。\n14\n配合課本 \nP201", "15": "探討活動 \n6-\n2\n \n代理孕母的倫理與法律問題\n(4\n)\n 代理孕母\n和委託人是否有權單方面決定終止妊娠？\n答\n：\n①\n \n正方\n：\n能\n，代理孕母是出於自願同意代孕行為，若因不得已的原因需終止妊娠，應尊重其決定；委託人因孩子出生後主要是由其撫養，若因其判斷後續無法撫養孩子，欲終止妊娠，則應以其意見為主。但無論是由哪方提出終止妊娠，提出方皆應負擔違約的責任。\n15\n配合課本 \nP201", "16": "探討活動 \n6-\n2\n \n代理孕母的倫理與法律問題\n②\n \n反方\n：\n是否\n可單方面決定終止妊娠，應於雙方契約訂定時即列入考量，針對不同的情況，可能會有不同的規範內容，以雙方達成的共識為主。此外也應考慮其他層面的問題，\n例如\n：\n法律方面\n：\n各國\n對於人工流產皆有相關規定，以臺灣為例，\n《\n優生保健法施行細則\n》\n第 \n15 \n條\n規定\n：\n「人工流產\n應於妊娠 \n24 \n週內施行。」故 \n24 \n週以後禁止終止妊娠。宗教倫理\n方面\n：\n有些\n人認為胎兒一旦成形即視為獨立的生命，故不應於懷孕後再因個人的要求而扼殺生命，剝奪其生存的權利。\n16\n配合課本 \nP201", "17": "探討活動 \n6-\n2\n \n代理孕母的倫理與法律問題\n3. \n代理孕母一般只是提供子宮的代孕者，與腹中胎兒沒有血緣關係，但若代理孕母是胎兒的外婆，仍有直系血親的血緣，是否可能衍生倫理上的問題與爭議？\n答\n：\n請\n依所處立場（\n正方\n：\n不會\n／反\n方\n：\n會\n）提出論述\n。\n\n參考如下\n：\n(1\n)\n 正方\n：\n若\n代理孕母為胎兒的外婆，與胎兒本身具有直系血緣關係，對於胎兒而言，孕母同樣也是疼愛他的長輩，故較不會有倫理上的問題。如英國禁止商業性質的代孕，但卻鼓勵由母親、姊妹、親友等人擔任代理孕母，如此一來代孕者不需要與孩子切斷關係，對孩子而言也多一個疼愛者，而非爭奪者。\n17\n配合課本 \nP201", "18": "探討活動 \n6-\n2\n \n代理孕母的倫理與法律問題\n(2\n)\n 反方\n：\n雖\n是直系血緣關係的親屬，但孩子出生後，仍可能存在與代孕母親與原生母親之間的關係應如何釐清的爭議，反而會使關係更加混亂，\n例如\n：\n孩子\n應該叫孕母「媽媽」還是「外婆」？應該叫原本的母親「姊姊」還是「媽媽」？在其他親戚眼中，又會如何看待三者間的關係？\n18\n配合課本 \nP201"}, "bookText": ["探討活動 \n－2 代理孕母的倫理與法律問題\n前　言\n　　近代隨著人工生殖科學技術的發展，讓許多不孕症夫妻得以透過捐精或是代理\n孕母的方式擁有自己的小孩，但其中卻涉及許多倫理與法律的問題。在科技發展的\n同時，想一想是否所有的科學技術發展都是有益而無害的？\n目　的\n　　透過討論了解代理孕母的議題究竟存在哪些爭議。\n背　景\n　　以生殖科技協助不孕夫妻生子的醫\n學，稱為生殖輔助醫學。其中試管嬰兒是\n以人工方式取得精子與卵，在體外受精並\n培育成胚胎後（如右圖），再將胚胎移植\n回母體子宮而懷孕、生產。就技術而言，\n「母體子宮」可由其他婦女代勞，也就是\n代理孕母，這對於子宮有缺陷的婦女而\n言，是完成傳宗接代心願的唯一希望。我\n國在民國85 年開始草擬人工生殖法，首\n度將代理孕母列入討論，歷經多年爭論，人工生殖法終於在民國96 年完成立法，\n但是有關代理孕母的相關法條仍被排除在外。後續的法案修正，代理孕母多次被討\n論，但也仍被擱置，可見其爭議性無法獲得共識。\n　　同學在進行討論之前，不妨先看看以下案例：2008 年，一名印度代理孕母替一\n對日本夫妻進行代孕，但在孩子出生前，日本父母便離婚了，因此孩子一出生便遭\n到遺棄。代理孕母與日本母親皆不願撫養，而日本父親雖想留下孩子，卻因為印度\n法律規定單身人士不能進行收養，導致孩子的合法父母與國籍歸屬一直遲遲無法判\n定。2014 年，一名泰國代理孕母為一對澳洲夫婦生下一對雙胞胎，但其中一名嬰兒\n卻因患有唐氏症而被拒絕接收，這名被遺棄的嬰兒最終由代理孕母自行扶養。\n 將卵和精子取出後，除了置於試管內使卵\n受精以外，亦可利用顯微操作技術，在顯\n微鏡下將單一精子注入卵內受精。\n6\n第 6 章  生殖　199\n", "　　由上述案例可知代理孕母的實行可能衍生許多問題，因涉及層面極廣，包括倫\n理、法律、心理、宗教等層次，且因各國歷史、文化和價值觀的差異，世界各地的\n立法規範皆不盡相同。例如：在法國與德國，代孕被視為損害女性尊嚴而遭到完全\n禁止；在英國則把代孕視為女性贈予另一位女性的行為，稱之為「利他主義」；美\n國 加州、俄羅斯及烏克蘭則是允許商業代孕，並將此視為追求女性獨立精神的表\n現；部分國家則至今仍沒有法律對此進行監管，例如：肯亞與奈及利亞，這種差異\n甚至導致代孕行業「醫療旅遊」現象的盛行。\n200　選修生物 Ⅲ (全)\n", "探討活動 \n討　論\n1  很多人批評為了繁殖高產乳量的乳牛或複製動物（含胚胎、器官），而進行動物\n的代理孕母生產是不人道的，那麼若是為了金錢被迫成為代理孕母，是否貶低人\n類的生育尊嚴？是否貶低女性的地位？\n2  請就代理孕母懷胎分娩、對所生子女的情感等種種倫理與法律層面進行討論。\n1  你認為代理孕母是否有權與長大後的孩子相認？請說明理由。若可以，則孩\n子與孕母相認的時間點（年紀）以何時為宜？理由為何？\n2  代理孕母在我國還不合法，相關議題在部分國家亦有所討論，為何代理孕母\n在國內遲遲未能合法化？\n3  若於產檢過程中發現胎兒異常，但引產又有風險的狀況下，代理孕母能否拒\n絕引產或流產？\n4  代理孕母和委託人是否有權單方面決定終止妊娠？\n3  代理孕母一般只是提供子宮的代孕者，與腹中胎兒沒有血緣關係，但若代理孕母\n是胎兒的外婆，仍有直系血親的血緣，是否可能衍生倫理上的問題與爭議？\n第 6 章  生殖　201\n"], "sources": {"art": {"title": "人工生殖法：第2、11、12條", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0070024", "checked": "2026-10-10"}, "abortion": {"title": "優生保健法施行細則：第15條", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0070002", "checked": "2026-10-10"}, "uk": {"title": "英國政府：代孕與法律親子關係", "url": "https://www.gov.uk/legal-rights-when-using-surrogates-and-donors/overview", "checked": "2026-10-10"}, "care": {"title": "英格蘭及威爾斯：代孕照護指引", "url": "https://www.gov.uk/government/publications/having-a-child-through-surrogacy/care-in-surrogacy-guidance-for-the-care-of-surrogates-and-intended-parents-in-surrogate-births-in-england-and-wales", "checked": "2026-10-10"}, "hfea": {"title": "HFEA：妊娠型與傳統型代孕", "url": "https://www.hfea.gov.uk/treatments/explore-all-treatments/surrogacy/", "checked": "2026-10-10"}, "crc": {"title": "聯合國：兒童權利公約", "url": "https://www.ohchr.org/sites/default/files/crc.pdf", "checked": "2026-10-10"}, "bill": {"title": "立法院：人工生殖法修正草案議案", "url": "https://ppg.ly.gov.tw/ppg/bills/202110186750000/details", "checked": "2026-10-10"}, "court": {"title": "澳洲人權委員會：2016兒童權利報告（案例）", "url": "https://humanrights.gov.au/__data/assets/file/0023/45437/AHRC_CRR_2016.pdf", "checked": "2026-10-10"}}};

 const length=node.textContent.length;if(!length)return [node];const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT),texts=[];let n,offset=0;while(n=walker.nextNode()){texts.push({node:n,start:offset,end:offset+n.length});offset+=n.length;}
 function fragment(a,b){const range=document.createRange(),start=texts.find(t=>t.end>a),end=texts.find(t=>t.end>=b);range.setStart(start.node,a-start.start);range.setEnd(end.node,b-end.start);const clone=node.cloneNode(false);clone.append(range.cloneContents());return clone;}
 const parts=[];let from=0;while(from<length){let lo=from+1,hi=length,best=lo;while(lo<=hi){const mid=(lo+hi)>>1,c=fragment(from,mid);body.replaceChildren(c);if(body.scrollHeight<=body.clientHeight+1){best=mid;lo=mid+1;}else hi=mid-1;}
  if(best<length){const s=node.textContent.slice(from,best),breakAt=Math.max(s.lastIndexOf('。'),s.lastIndexOf('；'),s.lastIndexOf('，'));if(breakAt>Math.max(20,s.length*.55))best=from+breakAt+1;}
  parts.push(fragment(from,best));from=best;
 }body.replaceChildren();return parts;
}
function paginateReading(){
 if(!READING)return;const i=READING.tab,g=READING.groups[i];if(g.notes)return;const pane=el('reading-pane-'+i),body=pane.querySelector('.reading-body'),pager=pane.querySelector('.reading-pager');pager.hidden=false;
 const key=[i,body.clientWidth,body.clientHeight,ST.font,innerWidth>900].join(':');if(READING.cache===key){renderReading();return;}
 const pages=[[]];body.replaceChildren();
 if(innerWidth<=900){pages[0]=g.nodes.map(x=>x.cloneNode(true));}
 else for(const original of g.nodes){let node=original.cloneNode(true);body.append(node);if(body.scrollHeight<=body.clientHeight+1){pages.at(-1).push(node);continue;}node.remove();if(pages.at(-1).length){pages.push([]);body.replaceChildren();}body.append(node);if(body.scrollHeight<=body.clientHeight+1){pages.at(-1).push(node);continue;}
  body.replaceChildren();const parts=splitBlock(original,body);for(const part of parts){if(pages.at(-1).length)pages.push([]);pages.at(-1).push(part);}body.replaceChildren(...pages.at(-1));
 }
 READING.pages[i]=pages;READING.cache=key;READING.indices[i]=Math.min(READING.indices[i],pages.length-1);renderReading();
}
function renderReading(){if(!READING)return;const i=READING.tab,pages=READING.pages[i];if(!pages)return;const pane=el('reading-pane-'+i),j=READING.indices[i];pane.querySelector('.reading-body').replaceChildren(...pages[j].map(x=>x.cloneNode(true)));const pager=pane.querySelector('.reading-pager');pager.hidden=pages.length<2;pager.querySelector('span').textContent=`${j+1} / ${pages.length} 頁`;const b=pager.querySelectorAll('button');b[0].disabled=j===0;b[1].disabled=j===pages.length-1;bindZoom(pane);}

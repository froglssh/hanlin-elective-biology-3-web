const CONTENT={"lessons": [{"id": "b3-c31-l01", "t": "呼吸的四個尺度：通氣不是細胞呼吸", "sec": "s1", "slide": 1, "sourceSlides": [1, 5], "sourcePages": [1], "src": "原PPT第 1–5 頁；課本 P70–71", "figSpec": {"image": "PPT05S3"}, "txt": "<ul><li>通氣是空氣進出肺；氣體交換是氧與二氧化碳跨呼吸表面擴散。</li><li>血液運輸連接肺與組織；細胞呼吸才是在細胞內利用養分取得能量。</li><li>吸入氧不等於每個細胞已取得氧；仍需交換、運輸與組織擴散。</li></ul><p class=\"think\">從肺泡到粒線體，途中要跨哪些表面與運輸環節？</p><div class=\"quote\">3-1 <br>呼吸系統<br>3-1.1 <br>人體的呼吸構造<br>3<br>-1.2 <br>人體呼吸運動的原理<br>1<small>原PPT第 1 頁（完整原文）</small></div><div class=\"quote\">◇ <br>呼吸作用<br>：<br>細胞分解小分子有機物以獲得能量的一系列化學反應<br>3-1 <br>呼吸系統<br>◆ <br>呼吸<br>通常指的是<br>呼吸運動<br>，與<br>呼吸作用<br>的意思不同<br>◇ <br>呼吸運動<br>：<br>包含吸氣與呼氣的動作，是人體吸入氧氣並排出二氧化碳的過程<br>→ 例如<br>：<br>葡萄糖的有氧呼吸<br>細胞<br>C<br>6<br>H<br>12<br>O<br>6<br> + 6O<br>2<br> → 6CO<br>2<br> + 6H<br>2<br>O +<br>能量<br>配合課本 <br>P70 <br>、<br>71<small>原PPT第 5 頁（完整原文）</small></div><div class=\"quote\">-1 呼吸系統<br>3<br>生物體需持續獲取能量以維持體內環境的恆定。細胞主要藉由呼吸作<br>用獲得能量，而身體透過呼吸運動協助氣體交換，為呼吸作用提供原料與<br>排出代謝廢物。動物經由飲水與進食攝取物質，並進行新陳代謝以維持正<br>常機能與形成身體構造，過程中會產生代謝廢物，其中的含氮廢物需透過<br>排泄系統排除，以維持體內環境的恆定。<br>呼吸通常指的是呼吸運動，與呼吸作用的意思不同。呼吸作用是<br>指細胞分解小分子有機物以獲得能量的一系列化學反應，過程通常需<br>要消耗氧氣，並產生二氧化碳。呼吸運動包含吸氣與呼氣的動作，是<br>人體吸入氧氣並排出二氧化碳的過程。<br>3-1.1 人體的呼吸構造<br>人體的呼吸系統由鼻腔、咽、喉、氣管、支氣管及肺所組成（圖 <br>3－1a）。鼻腔中的鼻黏膜富含微血管，可調節吸入空氣的溫度與溼<br>度，並過濾灰塵等異物。咽是呼吸道與消化道的交接處，喉位於氣管<br>的上方，內有聲帶可震動發聲。氣管由平滑肌與 C 型軟骨構成，其中<br>軟骨可維持氣管管腔，管壁上皮細胞會分泌黏液，可黏附過濾空氣中<br>的異物。氣管下方分支為左、右兩條支氣管，再經由多次分支形成小<br>支氣管，其末端膨大成為肺泡囊。肺泡囊上具有許多肺泡，其表面密<br>布微血管（圖 3－1b），是人體與外界進行氣體交換的主要區域。<br>肺位於胸腔內，右肺為三葉，左肺為二葉。由於肺本身不具肌<br>肉，無法自行擴張與收縮，其呼吸運動需藉助胸腔內壓力的變化來進<br>行。胸腔壁的內表面與肺的外表面各有一層胸膜包覆，兩層胸膜間內<br>含少量液體，可提供潤滑作用，減少肺與胸腔內壁間的摩擦。<br>呼吸運動　respiratory movement<br>肺泡　alveolus<br>70　選修生物 Ⅲ (全)<br><small>課本PDF第 1 頁，印刷P70（文字抽取原文；以完整頁圖核對）</small></div>", "tb": [["BOOK1", "P70 完整課本頁"]]}, {"id": "b3-c31-l02", "t": "濕潤的呼吸表面：同功能，不同管路", "sec": "s1", "slide": 2, "sourceSlides": [2, 3, 4], "sourcePages": [2], "src": "原PPT第 2–4 頁；課本 P70–71", "figSpec": {"image": "animals"}, "txt": "<ul><li>氣體先溶於呼吸表面的水層，再跨薄膜擴散；較大面積有助交換。</li><li>蚯蚓經濕潤皮膚交換，氧再由循環系統帶到組織。</li><li>昆蟲氣管由氣門分枝到組織附近，氧通常不靠血淋巴大量運送。</li></ul><p class=\"think\">昆蟲和蚯蚓都沒有肺，是否表示氧的運輸路徑相同？</p><div class=\"scope-note\">氣囊是氣管的擴大部位；精細末端氣管與組織接近。教材「末端氣囊」是簡化，不把氣囊與所有交換末端當同一構造。</div><div class=\"quote\">  <br>知識補給站<br>蚯蚓與蝗蟲的呼吸構造<br>       動物體與環境進行氣體交換的構造稱為<br>呼吸面<br>。由於氧氣與二氧化碳必須先<br>溶解在水中<br>，才能較容易進出細胞，因此呼吸面必須保持<br>潮溼<br>。陸生動物因生活環境較乾燥，為了維持氣體交換的效率，演化出各種不同的呼吸構造。<br>2<br>配合課本 <br>P71<small>原PPT第 2 頁（完整原文）</small></div><div class=\"quote\">  <br>知識補給站<br>蚯蚓與蝗蟲的呼吸構造<br>       蚯蚓主要呼吸構造為<br>皮膚<br>，皮膚表皮由<br>單層細胞<br>構成，可<br>分泌黏液<br>以保持溼潤，有利氧氣及二氧化碳<br>擴散<br>進出體表下的微血管，再藉由血液循環系統循環全身進行氣體交換。<br>心臟<br>血管<br>皮膚<br>配合課本 <br>P71<br>3<small>原PPT第 3 頁（完整原文）</small></div><div class=\"quote\">  <br>知識補給站<br>蚯蚓與蝗蟲的呼吸構造<br>       昆蟲的呼吸構造為<br>氣管系<br>，氣管<br>開口於體表<br>，往內部則延伸出許多分支，其<br>末梢封閉而潮溼<br>，是氣體交換的場所。有些昆蟲在耗氧量較大的器官附近，氣管的末端會膨大成<br>氣囊<br>，可以儲存空氣。<br>氣門<br>氣管<br>體壁<br>組織細胞<br>氣囊<br>氣管分支<br>（ 支氣管 ）<br>配合課本 <br>P71<br>4<small>原PPT第 4 頁（完整原文）</small></div><div class=\"quote\">蚯蚓與蝗蟲的呼吸構造<br>動物體與環境進行氣體交換的構造稱為呼吸面。由於氧氣與二氧化碳必須先溶解在水中，才能較容<br>易進出細胞，因此呼吸面必須保持潮溼。陸生動物因生活環境較乾燥，為了維持氣體交換的效率，演化出<br>各種不同的呼吸構造。<br>知識補給站<br> 蚯蚓主要呼吸構造為皮膚，皮膚表皮由單層<br>細胞構成，可分泌黏液以保持溼潤，有利氧<br>氣及二氧化碳擴散進出體表下的微血管，再<br>藉由血液循環系統循環全身進行氣體交換。<br> 昆蟲的呼吸構造為氣管系，氣管開口於體<br>表，往內部則延伸出許多分支，其末梢封閉<br>而潮溼，是氣體交換的場所。有些昆蟲在耗<br>氧量較大的器官附近，氣管的末端會膨大成<br>氣囊，可以儲存空氣。<br>血管<br>心臟<br>皮膚<br>組織細胞<br>氣管<br>氣管分支<br>（支氣管）<br>氣門<br>體壁<br>氣囊<br>a<br>咽<br>喉<br>胸腔<br>橫膈<br>鼻腔<br>口<br>氣管<br>肺<br>支氣管<br>微血管<br>小支氣管<br>動脈<br>（減氧血）<br>靜脈<br>（充氧血）<br>b<br>肺泡<br>肺泡囊<br>微血管包覆的肺泡囊<br> 圖 3－1　<br>人體的呼吸系統。a呼吸道與肺；b肺泡構造<br>（<br> 代表血液流動方向）。<br>第 3 章  呼吸與排泄　71<br><small>課本PDF第 2 頁，印刷P71（文字抽取原文；以完整頁圖核對）</small></div>", "tb": [["BOOK2", "P71 完整課本頁"]]}, {"id": "b3-c31-l03", "t": "從鼻到肺泡：追蹤空氣走的路", "sec": "s1", "slide": 6, "sourceSlides": [6, 7], "sourcePages": [], "src": "原PPT第 6–7 頁；課本 P70–71", "figSpec": {"image": "tract"}, "txt": "<ul><li>鼻腔→咽→喉→氣管→支氣管→細支氣管→肺泡。</li><li>鼻腔協助溫暖、濕潤及過濾；不是主要與血液交換氣體的位置。</li><li>導氣區與交換區功能不同；沿路遇到的構造不能都稱為肺泡。</li></ul><p class=\"think\">空氣進入氣管後，何時才接近 r>◇ 肺<br>：<br>▪ 位於胸腔內<br>▪ 右肺為三葉，左肺為<br><br>二葉<br>▪<br> 不具肌肉，無法自行擴張與收縮，呼吸運動需藉助胸腔內壓力的變化來進行<br>1<br>2<br>3<br>1<br>2<br>配合課本 <br>P70 <br>、<br>71<br>呼吸<br>之間<br>-<br>肺臟<small>原PPT第 9 頁（完整原文）</small></div><div class=\"quote\">肺<br>胸腔<br>橫膈<br>3-1.1 <br>人體的呼吸構造<br>◆ <br>胸腔壁的內表面與肺的外表面各有一層胸膜包覆<br>◆ <br>兩層胸膜間內含少量液體，可提供潤滑作用，減少肺與胸腔內壁間的摩擦<br>肺<br>胸膜<br>胸腔壁<br>液體<br>配合課本 <br>P70 <br>、<br>71<small>原PPT第 11 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c31-l06", "t": "肺泡與微血管：短距離、大面積", "sec": "s1", "slide": 10, "sourceSlides": [10], "sourcePages": [], "src": "原PPT第 10 頁；課本 P70–71", "figSpec": {"image": "alveoli"}, "txt": "<ul><li>肺泡與微血管相鄰，薄壁使擴散距離短。</li><li>氧依分壓梯度由肺泡進血；二氧化碳依自身分壓梯度反向擴散。</li><li>表面活性物質降低肺泡表面張力；它不是血紅素，也不主動泵送氧。</li></ul><p class=\"think\">薄壁與大量微血管各改變氣體交換的哪一項條件？</p><div class=\"scope-note\">交換屏障還包括兩側基底膜等；不能把「單層」理解為只跨一片完全沒有其他結構的膜。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/22-1-organs-and-structures-of-the-respiratory-system\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"quote\">3-1.1 <br>人體的呼吸構造<br>肺<br>胸腔<br>橫膈<br>◇ 肺<br>：<br>▪<br> 由<br>肺泡<br>組成<br>▫<br> 小支氣管末端膨大成為肺泡囊，肺泡囊上具有許多肺泡<br>▫ 單層扁平上皮細胞<br>▫ 表面密布微血管<br>▫<br> 人體與外界進行氣體交換的主要區域<br>動脈（ 減氧血 ）<br>靜脈（ 充氧血 ）<br>小支氣管<br>肺泡囊<br>肺泡<br>微血管包覆的肺泡囊<br>配合課本 <br>P70 <br>、<br>71<small>原PPT第 10 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c31-l07", "t": "呼吸肌與胸廓：先看肌肉，再看空氣", "sec": "s2", "slide": 12, "sourceSlides": [12], "sourcePages": [3], "src": "原PPT第 12 頁；課本 P72–73", "figSpec": {"image": "PPT12S3"}, "txt": "<ul><li>肋骨、胸骨與脊柱形成胸廓；肋間肌與橫膈改變容積。</li><li>橫膈收縮下降，外肋間肌收縮使肋骨上舉、外展。</li><li>肌肉先改變胸肺容積，再造成肺泡與外界的壓差。</li></ul><p class=\"think\">「空氣先流入把肺撐大」能否解釋正常吸氣的起始原因？</p><div class=\"quote\">3-1.1 <br>人體的呼吸構造<br>◆ <br>胸腔<br>的構造<br>：<br>肋骨<br>胸骨<br>肋間肌<br>橫膈肌<br>◇<br> <br>肋骨架<br>：<br>◇<br> <br>呼吸肌<br>：<br>▪ <br>胸骨<br>▪ <br>肋骨<br>▪ <br>脊椎骨<br>▪<br> <br>肋間肌<br>▪<br> <br>橫膈肌<br>配合課本 <br>P72 <br>、<br>74<small>原PPT第 12 頁（完整原文）</small></div><div class=\"quote\">3-1.2 人體呼吸運動的原理<br>呼吸運動造成的肺內壓力改變，是氣體進出肺部的原因。<br>一般而言，在定溫條件下，壓力與體積會相互影響，當胸腔體<br>積變大時，肺的體積隨之變大，導致肺內壓力變小，進而影響<br>空氣的流動方向（圖 3－2）。當肺內壓力低於大氣壓力時，空<br>氣流入肺內，稱為吸氣；反之，則為呼氣。　<br>人體與呼吸運動有關的肌肉稱為呼吸肌，主要為肋間肌與<br>橫膈肌，吸氣時，橫膈肌收縮，使橫膈向下位移，增加胸腔的<br>上下徑；同時肋間肌收縮，使肋骨和胸骨上舉向前、肋骨架往<br>外擴，增加胸腔的左右徑與前後徑。兩者共同擴大胸腔體積，<br>使肺內壓力低於大氣壓力，外界空氣流入肺內（圖 3－2a）。<br>吸氣需要呼吸肌收縮，一般的呼氣則藉呼吸肌被動地放<br>鬆完成。呼氣時，橫膈肌舒張，使橫膈回復原位，同時肋間肌<br>舒張，帶動肋骨與胸骨下移，使胸腔體積縮小、肺內壓力增<br>加，肺內氣體流出體外（圖 3－2b）。劇烈運動後、咳嗽、打<br>噴嚏、大笑及唱歌時，除主要呼吸肌放鬆外，其他肌肉（如腹<br>肌）會用力收縮，使腹腔壓力增加，將橫膈快速向上方胸腔推<br>擠，進而增加呼氣的強度與深度，造成強力呼氣。<br>肋間肌　intercostal muscle<br>橫膈肌　diaphragm muscle<br>72　選修生物 Ⅲ (全)<br><small>課本PDF第 3 頁，印刷P72（文字抽取原文；以完整頁圖核對）</small></div>", "tb": [["BOOK3", "P72 完整課本頁"]]}, {"id": "b3-c31-l08", "t": "吸氣：把因果鏈排成順序", "sec": "s2", "slide": 13, "sourceSlides": [13], "sourcePages": [], "src": "原PPT第 13 頁；課本 P72–73", "figSpec": {"image": "mechanics"}, "txt": "<ul><li>吸氣肌收縮→胸肺擴大→肺泡內壓暫低於大氣壓→空氣流入。</li><li>圖中的負值是相對大氣壓，並非絕對壓力小於零。</li><li>吸氣末氣流暫停時，肺泡壓可回到大氣壓，但容積仍較大。</li></ul><p class=\"think\">若兩側壓力已相等，還會持續有同方向淨氣流嗎？</p><div class=\"scope-note\"><a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/22-3-the-process-of-breathing\" target=\"_blank\" rel=\"noopener noreferrer\">機制參考：OpenStax</a></div><div class=\"quote\">3<br>-1.2 <br>人體呼吸運動的原理<br>◆ 呼吸運動造成的肺內壓力改變，是氣體進出肺部的原因<br>肋骨<br>胸骨<br>肋間肌<br>橫膈肌<br>◇ <br>吸氣<br>胸腔體積擴大，肺<br><br>內部壓力<br>變小<br>① <br>肋間肌<br>收縮<br>② <br>橫<br>膈肌收縮<br>→ <br>肋骨、胸骨上舉<br>→ 胸腔左右徑、前後徑增加<br>→ <br>橫膈扁平、向下 <br>→ 胸腔上下徑增加<br>空氣由外界流入肺內<br>配合課本 <br>P72<small>原PPT第 13 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c31-l09", "t": "安靜呼氣：舒張與彈性回縮", "sec": "s2", "slide": 14, "sourceSlides": [14, 15], "sourcePages": [], "src": "原PPT第 14–15 頁；課本 P72–73", "figSpec": {"image": "mechanics"}, "txt": "<ul><li>安靜呼氣時吸氣肌舒張，肺與胸廓的彈性回縮使容積下降。</li><li>肺泡內壓暫高於大氣壓，空氣向外流。</li><li>安靜呼氣通常是被動過程；不能推成所有呼氣都沒有主動肌肉。</li></ul><p class=\"think\">說肺縮小是「重力把空氣壓出」，會漏掉什麼關鍵機制？</p><div class=\"quote\">3<br>-1.2 <br>人體呼吸運動的原理<br>◇ <br>呼氣<br>胸腔體積縮小，肺內部壓力<br>變大<br>① <br>肋間肌<br>舒張<br>② <br>橫<br>膈肌舒張<br>→ <br>肋骨、胸骨下降<b 與延腦：節律與修飾", "sec": "s3", "slide": 23, "sourceSlides": [23], "sourcePages": [], "src": "原PPT第 23 頁；課本 P74", "figSpec": {"image": "PPT23S3"}, "txt": "<ul><li>腦幹網路參與基本呼吸節律與整合；橋腦協助調整節律模式。</li><li>大腦皮質可在一定範圍改變呼吸，如說話或短暫屏氣。</li><li>化學訊號仍持續作用，意識調整不代表能無限取消生理需求。</li></ul><p class=\"think\">自動節律和自主控制可以同時存在嗎？</p><div class=\"quote\">◆<br> <br>橋腦<br>的<br>呼吸調節中樞<br>：<br>調節延腦送出神經衝動的頻率<br>◆ <br>大腦<br>：<br>意識可調控延腦，例如<br>：<br>暫停呼吸<br>小腦<br>間腦<br>大腦<br>延腦<br>橋腦<br>中腦<br>腦幹<br>3<br>-1.2 <br>人體呼吸運動的原理<br>補充<small>原PPT第 23 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c31-l15", "t": "氧的運輸：分壓不等於總含氧量", "sec": "s4", "slide": 24, "sourceSlides": [24, 25], "sourcePages": [6], "src": "原PPT第 24–25 頁；課本 P75", "figSpec": {"image": "PPT25S3"}, "txt": "<ul><li>少量氧溶於血液，主要氧與紅血球的血紅素可逆結合。</li><li>肺的較高PO₂有利結合；組織較低PO₂有利釋放。</li><li>PO₂反映溶解氧的分壓；同樣PO₂下，血紅素量不同仍可能有不同含氧量。</li></ul><p class=\"think\">只量分壓，是否能知道一份血液總共攜帶多少氧？</p><div class=\"quote\">  <br>知識補給站<br>O<br>2<br> 運輸的過程<br>◆ 血液中的 <br>O<br>2<br> <br>運輸主要有兩種方式<br>：<br>(2<br>)<br> 大部分<br>的 <br>O<br>2<br> <br>和紅血球內的<br>血紅素<br>結合運輸<br>：<br>Hb<br> <br>+ O<br>2 <br> <br>←→<br> HbO<br>2<br>血紅素<br>氧合血紅素<br>(1<br>)<br> <br>少量<br>的 <br>O<br>2<br> 直接溶解在血漿中<br>配合課本 <br>P75<br>24<small>原PPT第 24 頁（完整原文）</small></div><div class=\"quote\">  <br>知識補給站<br>O<br>2<br> 運輸的過程<br>◆ 影響<br>血紅素與<br> <br>O<br>2<br> 的結合率的因素<br>：<br>◇<br> <br>P<br>O<br>2<br>部<br>　<br>位<br>P<br>O<br>2<br>反應式<br>肺泡<br>微血管<br>組織<br>微血管<br>較<br>高<br>Hb<br>＋<br>O<br>2<br> <br>→<br> HbO<br>2<br>較<br>低<br>HbO<br>2<br> <br>→<br> <br>Hb<br>＋<br>O<br>2<br>配合課本 <br>P75<br>25<small>原PPT第 25 頁（完整原文）</small></div><div class=\"quote\">O2 運輸的過程<br>  血液中的 O2 運輸主要有兩種方式：少量 O2 會直接溶解在血漿中，大部分的 O2 會與紅血球內的血紅<br>素結合，形成氧合血紅素（HbO2）。<br>血管中的氧分壓是決定 O2 與血紅素結合的最重<br>要因素。在肺部，微血管的氧分壓高，血紅素容易<br>與 O2 結合；而在組織微血管中，氧分壓較低，血紅<br>素則釋放 O2 供細胞利用。<br>當血液酸鹼值下降或二氧化碳分壓上升時，<br>血紅素對 O 2 親和力下降，氧合血紅素解離曲線<br>（ODC）右移，有利於氧合血紅素釋放 O2 ；反之，<br>血液酸鹼值增加或二氧化碳分壓降低時，則有利於<br>血紅素與 O2 結合，因而能有更多血紅素攜帶 O2 。<br>CO2 運輸的過程<br>細胞代謝產生的 CO2 擴散進入血液後，約 7% 的 CO2 會直接溶解在血漿中，約 2 與判斷氣流方向是同一個問題嗎？</p><div class=\"quote\">  <br>Question<br>1. <br>下列有關呼吸運動的敘述，何者正確？　<br>(A)<br>主要是依賴肺臟肌肉來完成　<br>(B)<br>吸氣時的胸腔是呈現正壓而引入空氣　<br>(C)<br>可協助靜脈血液回流到胸腔　<br>(D)<br>呼氣時橫膈肌與肋間肌收縮，將空氣自肺內擠出。<br>【107.<br>指考修訂<br>】<br>解答<br>：<br>(C)<br> <br>解析<br>：<br>(A)<br>肺臟內部無肌肉。<br>(B)<br>吸氣時胸腔呈現負壓而引入空氣。<br>(D)<br>呼氣時橫膈肌、肋間肌舒張，胸腔體積縮小、壓力增加，使空氣流出肺臟。<br>32<small>原PPT第 32 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c31-l21", "t": "原題二：甲乙曲線與A、B、C", "sec": "s5", "slide": 33, "sourceSlides": [33, 34], "sourcePages": [], "src": "原PPT第 33–34 頁；課本 P70–75／原題", "figSpec": {"image": "originalPressure"}, "txt": "<ul><li>甲為肺內壓，乙為胸膜腔壓；原題正答C、E。</li><li>A→B為吸氣、B→C為呼氣；判斷依甲與大氣壓之差。</li><li>乙一直負壓不等於全程吸氣；吸氣末與呼氣末甲可回相對0。</li></ul><p class=\"think\">若乙始終在0以下，為何B→C仍可有空氣流出？</p><div class=\"quote\">  <br>Question<br>2<br>. <br>右圖是呼吸系統的肺內壓力以及胸腔內壓力，請根據右圖判斷下列敘述哪些正確？　<br>(A)<br>甲是胸腔內壓力，乙是肺內壓力　<br><br>(B)<br>因為胸腔的壓力改變造成體積變化，引導氣體流入及流出肺部　<br>(C)<br>肺內壓力的變化與氣體進入肺部有關　<br>(D)<br>此過程乙的壓力一直低於大氣壓力，故從 <br>A → C <br>皆為吸氣　<br>(E) A → B <br>為吸氣過程，<br>B <br>→ <br>C <br>為呼氣過程。<br>解答<br>：<br>(C)(E)<br> <br>33<small>原PPT第 33 頁（完整原文）</small></div><div class=\"quote\">  <br>Question<br>解析<br>：<br>(A)<br>甲為肺內壓力，乙為胸腔內壓力。<br>(B)<br>因為胸腔的體積變化造成壓力變化，引導氣體進出肺部。<br>(D)<br>乙是胸腔內壓力，持續低於大氣壓，有利肺泡保持有氣體的狀態，且 <br>A <br>→ <br>B<br> 為吸氣過程，<br>B <br>→ <br>C <br>為呼氣過程。<br>34<small>原PPT第 34 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c31-l22", "t": "原題三之一：飽和度差的單位", "sec": "s5", "slide": 35, "sourceSlides": [35, 36], "sourcePages": [], "src": "原PPT第 35–36 頁；課本 P70–75／原題", "figSpec": {"image": "originalHbMb"}, "txt": "<ul><li>題圖讀值：PO₂從100降至40 mmHg，Hb飽和度約由95%降至80%。</li><li>差為15個百分點，相當於全部Hb結合位點容量的15%；沿用原題15%的答案。</li><li>若分母改成起初已結合的氧，才是15／95約15.8%，兩者問法不同。</li></ul><p class=\"think\">用15%回答前，先說清楚相對哪一個分母。</p><div class=\"scope-note\">原圖下方另印有「肌紅蛋白」文字，容易與曲線主標示混淆；本題依上方「肌紅素」虛線及「血紅素」實線判讀，不由重複文字推定額外曲線。</div><div class=\"quote\">  <br>Question<br>3.<br> 肌紅素主要存在於心肌和骨骼肌中，與血紅<br>素<br>同樣均具有攜帶氧氣的功能。右圖呈現兩種蛋白質在不同氧分壓下與氧氣的結合率。請依據該圖判斷下列問題可以得知或推論的資訊。<br>35<small>原PPT第 35 頁（完整原文）</small></div><div class=\"quote\">  <br>Question<br>(<br>1<br>)<br> 當<br>氧分壓由 <br>100 mmHg <br>降為 <br>40 mmHg <br>時，多少百分比的氧合血紅素可釋出氧氣？<br>(2<br>)<br> 肌<br>紅素與血紅素何者比較容易放出氧氣？根據右圖寫下判斷的依據，以及在生理上的意義為何？<br>(3<br>)<br> 氧氣<br>主要以什麼形式在體內運送？二氧化碳主要以什麼形式在體內運送？<br>36<small>原PPT第 36 頁（完整原文）</small></div>", "tb": []}, {"id": "b3-c31-l23", "t": "原題三之二：用圖說明儲氧與釋氧", "sec": "s5", "slide": 37, "sourceSlides": [37], "sourcePages": [], "src": "原PPT第 37 頁；課本 P70–75／原題", "figSpec": {"image": "originalHbMb"}, "txt": "<ul><li>原答案：Hb較容易釋氧；Mb在相同PO₂下仍有較高飽和度，有助肌肉儲氧。</li><li>Hb主要在血液運氧，Mb主要位於肌肉；不能把兩者都說成紅血球內主運輸蛋白。</li><li>主要運輸形式：氧為HbO₂；CO₂為血漿HCO₃⁻。</li></ul><p class=\"think\">寫下曲線證據，再把證據連到血液運輸與肌肉儲氧的分工。</p><div class=\"quote\">  <br>Question<br>解答<br>：<br>(1)15<br>％；<br>(2)<br>血紅素。隨著氧分壓下降，肌紅素與氧氣結合飽和度僅緩緩下降，即不易釋出氧氣或較易結合氧氣。有助於肌肉儲存氧氣；<br>(3)<br>氧氣<br>：<br>氧合血紅素（<br>HbO<br>2<br>），二氧化碳<br>：<br>碳酸氫根離子（<br>HCO<br>3<br>－<br>）<br>解析<br>：<br>(1)<br>氧分壓 <br>100 mmHg <br>的氧合飽和度是 <br>95<br>％，氧分壓 <br>40<br> <br>mmHg <br>的氧合飽和度是 <br>80<br>％，可釋出 <br>95<br>－<br>80<br>＝<br>15<br>（％）的攜氧量。<br>(3)<br>氣體在血液中運輸，氧氣主要在紅血球中與血紅素結合運輸，二氧化碳主要形成碳酸氫根離子在血漿中運輸。<br>37<small>原PPT第 37 頁（完整原文）</small></div>", "tb": []}], "questions": [{"t": "課本圖貼標籤：人體的呼吸系統", "q": "依課本圖3–1，把標籤放回圖上的編號格：呼吸道、胸腔構造與肺泡。", "learn": 2, "tag": "structure", "hint": "(a)由上往下是空氣走的路：鼻腔→咽→喉→氣管→支氣管→肺；(b)放大圖是肺泡囊與包覆的微血管。", "why": "空氣依序經鼻腔、咽、喉、氣管與支氣管進入肺；肺泡囊由許多肺泡組成，外有微血管包覆進行氣體交換；橫膈位於胸腔下緣。", "sub": "課本 P70 圖3–1", "refs": [{"src": "mk_tract", "cap": "呼吸系統（標籤已遮蓋）"}], "kind": "drag", "mask": "mk_tract", "ar": 1.5692, "layout": "side", "slots": [{"id": "s0", "label": "鼻腔", "group": 0, "x": 47.45, "y": 24.77, "v": false, "w": false}, {"id": "s1", "label": "咽", "group": 1, "x": 17.45, "y": 28.41, "v": false, "w": false}, {"id": "s2", "label": "喉", "group": 2, "x": 17.45, "y": 37.44, "v": false, "w": false}, {"id": "s3", "label": "氣管", "group": 3, "x": 47.45, "y": 42.05, "v": false, "w": false}, {"id": "s4", "label": "胸腔", "group": 4, "x": 12.78, "y": 62.05, "v": false, "w : "  \nQuestion\n(\n1\n)\n 當\n氧分壓由 \n100 mmHg \n降為 \n40 mmHg \n時，多少百分比的氧合血紅素可釋出氧氣？\n(2\n)\n 肌\n紅素與血紅素何者比較容易放出氧氣？根據右圖寫下判斷的依據，以及在生理上的意義為何？\n(3\n)\n 氧氣\n主要以什麼形式在體內運送？二氧化碳主要以什麼形式在體內運送？\n36", "37": "  \nQuestion\n解答\n：\n(1)15\n％；\n(2)\n血紅素。隨著氧分壓下降，肌紅素與氧氣結合飽和度僅緩緩下降，即不易釋出氧氣或較易結合氧氣。有助於肌肉儲存氧氣；\n(3)\n氧氣\n：\n氧合血紅素（\nHbO\n2\n），二氧化碳\n：\n碳酸氫根離子（\nHCO\n3\n－\n）\n解析\n：\n(1)\n氧分壓 \n100 mmHg \n的氧合飽和度是 \n95\n％，氧分壓 \n40\n \nmmHg \n的氧合飽和度是 \n80\n％，可釋出 \n95\n－\n80\n＝\n15\n（％）的攜氧量。\n(3)\n氣體在血液中運輸，氧氣主要在紅血球中與血紅素結合運輸，二氧化碳主要形成碳酸氫根離子在血漿中運輸。\n37"}, "originalCount": 3, "legacyCount": 8, "originalPPTQuestions": {"1": [2], "2": [2, 4], "3": {"setup": "肌紅素主要存在於心肌和骨骼肌中，與血紅素同樣均具有攜帶氧氣的功能。右圖呈現兩種蛋白質在不同氧分壓下與氧氣的結合率。請依據該圖判斷下列問題可以得知或推論的資訊。", "subquestions": ["當氧分壓由100 mmHg降為40 mmHg時，多少百分比的氧合血紅素可釋出氧氣？", "肌紅素與血紅素何者比較容易放出氧氣？根據右圖寫下判斷的依據，以及在生理上的意義為何？", "氧氣主要以什麼形式在體內運送？二氧化碳主要以什麼形式在體內運送？"], "answer": "15%；血紅素較易釋氧、肌紅素助儲氧；HbO₂、HCO₃⁻"}}, "references": [{"title": "breathing", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/22-3-the-process-of-breathing"}, {"title": "gas", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/22-5-transport-of-gases"}, {"title": "structure", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/22-1-organs-and-structures-of-the-respiratory-system"}]};

el('related-slide').onclick=()=>openShow(DECK.findIndex(d=>d[1]===+(LEARN[LI].src.match(/第 (\d+)/)?.[1]||1)));
el('hint-toggle').setAttribute('aria-haspopup','dialog');el('hint-toggle').onclick=()=>{el('hint-toggle').setAttribute('aria-expanded','true');const d=openDialog('思考提示',`<p>${esc(STAGES[QI].hint)}</p>`);d.addEventListener('close',()=>el('hint-toggle').setAttribute('aria-expanded','false'),{once:true});};el('reference-btn').onclick=()=>openReferences(STAGES[QI]);el('question-learn').onclick=()=>{returnQuestion=true;navigate('learn',STAGES[QI].learn)};el('q-jump').onchange=e=>showQuestion(+e.target.value);el('prev-btn').onclick=()=>QI>0&&showQuestion(QI-1);el('skip-btn').onclick=()=>QI<STAGES.length-1?showQuestion(QI+1):navigate('done');el('check-btn').onclick=check;el('reset-btn').onclick=resetQuestion;el('finish-btn').onclick=()=>navigate('done');
el('shsel').innerHTML=[...new Set(DECK.map(d=>d[1]))].map(n=>`<option value="${n}">第 ${n} 頁 · ${esc(DECK.find(d=>d[1]===n)[2].slice(0,22))}</option>`).join('');el('shsel').onchange=e=>{showStopPlay();SI=DECK.findIndex(d=>d[1]===+e.target.value);showRender();};el('shprev').onclick=()=>showStep(-1);el('shnext').onclick=()=>showStep(1);el('shplay').onclick=()=>{if(SPLAY)showStopPlay();else{if(SI===DECK.length-1)SI=0;showRender();SPLAY=setInterval(()=>{if(SI>=DECK.length-1){showStopPlay();return;}SI++;showRender()},2600);el('shplay').textContent='⏸ 暫停';}};el('shfs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else el('show').requestFullscreen?.().catch(()=>{el('shfs').textContent='此瀏覽器不支援原生全螢幕'})};el('shclose').onclick=()=>navigate('intro');
el('theme-toggle').onclick=()=>{ST.theme=ST.theme==='dark'?'light':'dark';applyPreferences();save();};el('font-toggle').onclick=()=>{ST.font=(ST.font+1)%3;applyPreferences();save();fit();};function applyPreferences(){document.documentElement.dataset.theme=ST.theme;document.documentElement.style.setProperty('--text',[20,22,24][ST.font]+'px');document.documentElement.dataset.font=ST.font;el('theme-toggle').setAttribute('aria-pressed',String(ST.theme==='dark'));el('font-toggle').title='文字大小 '+[20,22,24][ST.font]+'px';}
document.addEventListener('fullscreenchange',fullscreenSync);document.addEventListener('keydown',e=>{if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(document.querySelector('dialog[open]'))return;const fs=document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation');if(fs){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();if(LI>0)showLearn(LI-1);}else if(e.key==='Escape')exitLearnFullscreen();return;}if(PAGE==='show'){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();showStep(1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();showStep(-1);}else if(e.key==='Escape')navigate('intro');else if(e.key==='Home'){SI=0;showRender()}else if(e.key==='End'){SI=DECK.length-1;showRender()}return;}if(PAGE==='learn'&&el('flip')){if(e.key==='ArrowRight'){e.preventDefault();flipStop();flipShow(FI+1)}if(e.key==='ArrowLeft'){e.preventDefault();flipStop();flipShow(FI-1)}}});
el('learn-stage').addEventListener('contextmenu',e=>{if(document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation')){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1)}});
window.addEventListener('resize',fit);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){flipStop();showStopPlay();save();}});new ResizeObserver(fit).observe(el('bar'));
el('slide-text').onclick=()=>openDialog('原PPT第'+DECK[SI][1]+'頁原文',`<p>${esc(CONTENT.pptText[DECK[SI][1]])}</p>`);el('hero-image').src=IMG.tract;el('video-external').href=typeof VIDEO_VIEW_URL!=='undefined'?VIDEO_VIEW_URL:VIDEO_SRC;applyPreferences();const start=['learn','play','done'].includes(ST.page)?ST.page:'intro';navigate(start);if(!saving)storageNotice();
</script></body></html>

const CONTENT={"lessons": [{"id": "b3-a21-l01", "t": "任務：用構造解釋單向血流", "sec": "s1", "slide": 1, "sourceSlides": [1, 2, 3, 4], "sourcePages": [1], "src": "課本P56；PPT 1、2、3、4", "figSpec": {"image": "step_001"}, "txt": "<h3>觀察與推論</h3><ul><li>觀察豬心外形、血管、瓣膜與心腔，建立構造與功能的連結。</li><li>灌水是離體模型；水壓來自外部，不代表心肌正在收縮。</li><li>先記錄所見，再以流向與壓差提出可檢驗的解釋。</li></ul><p class=\"thinking\"><strong>想一想</strong> 水能通過，是否就證明活體心臟的所有功能？</p><div class=\"quote\">探討活動 <br>－1 心臟的觀察<br>2<br>前　言<br>　　西元 2 世紀，希臘醫師加倫解剖許多動物的心臟，認為心臟在舒張時吸收血<br>液，動脈收縮才將血液送出心臟，此論點影響歐洲千年之久，直到 1628 年才由英<br>國醫師哈維確認心臟收縮是推動血液循環的原動力。現在我們已清楚心臟由心肌構<br>成，而推動血液循環的原動力主要是透過其週期性收縮與舒張。<br>　　心臟是如何推動單向血流循環的呢？心臟具有哪些特別的構造？又具有何生理<br>意義？<br>目　的<br>　　本活動目的在探究豬心的外部形態與內部構造，進而推論心臟的結構如何確保<br>血液單向流動，並提供血液運行的適當動力。<br>原　理<br>　　透過心臟的解剖觀察，探究心臟如何推動單向的血液循環，活動中可藉由自上<br>大靜脈與肺動脈注水的方式，觀察血液在不同血管的流向，解剖時觀察血管與心臟<br>間、心房與心室間的構造，可知是否有影響液體流動的構造，並透過觀察如瓣膜構<br>造與腱索的相對位置等，了解血液的單向流動方式。心臟表面遍布血管，但因大部<br>分的血管埋在肌肉中無法直接觀察到，因此可藉由插入深色塑膠軟管或是注射黑色<br>溶液等方式，觀察心臟表面血管的分布與血液流向。<br>器　材<br> 實驗手套<br> 深色塑膠軟管（直徑約 2 mm）或粗釣魚線（7 號或 8 號）<br> 滴管或注射針筒<br> 解剖盤<br> 解剖用具<br> 新鮮的豬心<br> 黑色食用色素溶液（或黑色鋼筆墨水）<br>1 雙<br> 20 cm <br>1 支<br>1 個<br>1 組<br>1 顆<br>適量<br>每組使用<br>56　選修生物 Ⅲ (全)<br><small>課本P56完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>前言<br>　　西元 <br>2<br> 世紀，<br>希臘<br>醫師<br>加倫<br>解剖許多動物的心臟，認為心臟在舒張時吸收血液，動脈收縮才將血液送出心臟，此論點影響<br>歐洲<br>千年之久，直到 <br>1628<br> 年才由<br>英國<br>醫師<br>哈維<br>確認心臟收縮是推動血液循環的原動力。<br>1<br>配合課本 <br>P56<small>原PPT第1頁完整抽取原文；科學補充見教學重點</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>       現在我們已清楚心臟由心肌構成，而推動血液循環的原動力主要是透過其週期性收縮與舒張。　<br>       心臟是如何推動單向血流循環的呢？心臟具有哪些特別的構造？又具有何生理意義？<br>2<br>配合課本 <br>P56<small>原PPT第2頁完整抽取原文；科學補充見教學重點</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>目的<br>　　本活動目的在探究豬心的外部形態與內部構造，進而推論心臟的結構如何確保血液單向流動，並提供血液運行的適當動力。<br>3<br>配合課本 <br>P56<small>原PPT第3頁完整抽取原文；科學補充見教學重點</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>原理<br>◆ 透過心臟的解剖觀察，探究心臟如何推動單向的血液循環<br>◇ 藉由自上大靜脈與肺動脈注水的方式，觀察血液在不同血管的流向<br>◇ 解剖時觀察血管與心臟間、心房與心室間的構造，可知是否有影響液體流動的構造，並透過觀察如瓣膜構造與腱索的相對位置等，了解血液的單向流動方式<br>◇ 心臟表面遍布血管，但因大部分的血管埋在肌肉中無法直接觀察到，因此可藉由插入深色塑膠軟管或注射黑色溶液等方式，觀察心臟表面血管的分布與血液流向<br>4<br>配合課本 <br>P56<small>原PPT第4頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_001", "P56完整課本頁"]]}, {"id": "b3-a21-l02", "t": "器材與安全：觀察前的準備", "sec": "s1", "slide": 5, "sourceSlides": [5], "sourcePages": [1], "src": "課本P56；PPT 5", "figSpec": {"image": "step_001"}, "txt": "<h3>觀察與推論</h3><ul><li>依教師指導使用實驗手套、解剖盤與解剖用具，標本不供食用。</li><li>刀剪與手指避開切割路徑，先固定標本；廢棄物與清潔依教室規範處理。</li><li>取材來源、殘端完整性與原有破損先拍照記錄，避免把損傷當正常構造。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若瓣膜已被市場取材剪破，灌水結果還能怎樣解釋？</p><div class=\"quote\">探討活動 <br>－1 心臟的觀察<br>2<br>前　言<br>　　西元 2 世紀，希臘醫師加倫解剖許多動物的心臟，認為心臟在舒張時吸收血<br>液，動脈收縮才將血液送出心臟，此論點影響歐洲千年之久，直到 1628 年才由英<br>國醫師哈維確認心臟收縮是推動血液循環的原動力。現在我們已清楚心臟由心肌構<br>成，而推動血液循環的原動力主要是透過其週期性收縮與舒張。<br>　　心臟是如何推動單向血流循環的呢？心臟具有哪些特別的構造？又具有何生理<br>意義？<br>目　的<br>　　本活動目的在探究豬心的外部形態與內部構造，進而推論心臟的結構如何確保<br>血液單向流動，並提供血液運行的適當動力。<br>原　理<br>　　透過心臟的解剖觀察，探究心臟如何推動單向的血液循環，活動中可藉由自上<br>大靜脈與肺動脈注水的方式，觀察血液在不同血管的流向，解剖時觀察血管與心臟<br>間、心房與心室間的構造，可知是否有影響液體流動的構造，並透過觀察如瓣膜構<br>造與腱索的相對位置等，了解血液的單向流動方式。心臟表面遍布血管，但因大部<br>分的血管埋在肌肉中無法直接觀察到，因此可藉由插入深色塑膠軟管或是注射黑色<br>溶液等方式，觀察心臟表面血管的分布與血液流向。<br>器　材<br> 實驗手套<br> 深色塑膠軟管（直徑約 2 mm）或粗釣魚線（7 號或 8 號）<br> 滴管或注射針筒<br> 解剖盤<br> 解剖用具<br> 新鮮的豬心<br> 黑色食用色素溶液（或黑色鋼筆墨水）<br>1 雙<br> 20 cm <br>1 支<br>1 個<br>1 組<br>1 顆<br>適量<br>每組使用<br>56　選修生物 Ⅲ (全)<br><small>課本P56完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>器材<br>每組使用<br>實驗手套<br>1<br> 雙<br>深色塑膠軟管（直徑約 <br>2<br> <br>mm<br>）或粗釣魚線（<br>7<br> 號或 <br>8<br> 號）<br>20<br> <br>cm<br>滴管或注射針筒<br>1<br> 支<br>解剖盤<br>1<br> 個<br>解剖用具<br>1<br> 組<br>新鮮的豬心<br>1<br> 顆<br>黑色食用色素溶液（或黑色鋼筆墨水）<br>適量<br>5<br>配合課本 <br>P56<small>原PPT第5頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_001", "P56完整課本頁"]]}, {"id": "b3-a21-l03", "t": "建立方位：左右屬於動物本身", "sec": "s1", "slide": 6, "sourceSlides": [6], "sourcePages": [2], "src": "課本P57；PPT 6", "figSpec": {"image": "p2_lab_external_views"}, "txt": "<h3>觀察與推論</h3><ul><li>左右以動物本身為準，不以觀察者左右命名。</li><li>腹面朝向自己且方位正確時，動物左側通常在觀察者右側。</li><li>課本心臟示意圖是人類心臟，用來與豬心比較；照片與示意圖不能完全等同。</li></ul><p class=\"thinking\"><strong>想一想</strong> 把標本翻到背面後，能直接沿用原來畫面左右嗎？</p><div class=\"quote\">觸摸並比較左心室與右心室，何者的肌肉層較厚？為什麼？試著判斷及分辨心臟<br>的腹面與背面。<br>2<br>腹面觀<br>背面觀<br>將豬心清洗乾淨後放在解剖<br>盤上。豬心的大小、形態與<br>人體的心臟十分相似，對照<br>右圖，分辨心臟的左右側、<br>心房與心室。觸摸及按壓心<br>房與心室，感覺有什麼不<br>同？何者的肌肉層較厚？<br>1<br>步　驟<br>e：\u0001以下心臟示意圖皆為人類的心臟，<br>以便與豬心做對比。<br>右心房<br>左心房<br>左心室<br>心尖<br>右心室<br>活動一<br>豬心外部形態的觀察<br>第 2 章  循環與消化　57<br><small>課本P57完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動一 豬心外部形態的觀察<br>1<br>將豬心清洗乾淨後放在解剖盤上。豬心的大小、形態與人體的心臟十分相似，對照右圖，分辨心臟的左右側、心房與心室。觸摸及按壓心房與心室，感覺有什麼不同？何者的肌肉層較厚？<br>註<br>以下心臟示意圖皆為人類的心臟，以便與豬心做對比。<br>左心房<br>左心室<br>右心房<br>右心室<br>6<br>配合課本 <br>P57<br>步驟<small>原PPT第6頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_002", "P57完整課本頁"]]}, {"id": "b3-a21-l04", "t": "腹背面：以多個線索交叉定位", "sec": "s1", "slide": 7, "sourceSlides": [7], "sourcePages": [2], "src": "課本P57；PPT 7", "figSpec": {"image": "p2_lab_external_views"}, "txt": "<h3>觀察與推論</h3><ul><li>先依課本照片確認心尖、心房、心室與大血管位置。</li><li>前室間溝在兩心室之間，冠狀溝在房室交界；兩者不可混稱。</li><li>不要只靠斜線方向或按壓硬度判腹背面；標本旋轉、脂肪覆蓋與損傷都會干擾。</li></ul><p class=\"thinking\"><strong>想一想</strong> 你能指出第二個獨立線索支持同一方位嗎？</p><div class=\"quote\">觸摸並比較左心室與右心室，何者的肌肉層較厚？為什麼？試著判斷及分辨心臟<br>的腹面與背面。<br>2<br>腹面觀<br>背面觀<br>將豬心清洗乾淨後放在解剖<br>盤上。豬心的大小、形態與<br>人體的心臟十分相似，對照<br>右圖，分辨心臟的左右側、<br>心房與心室。觸摸及按壓心<br>房與心室，感覺有什麼不<br>同？何者的肌肉層較厚？<br>1<br>步　驟<br>e：\u0001以下心臟示意圖皆為人類的心臟，<br>以便與豬心做對比。<br>右心房<br>左心房<br>左心室<br>心尖<br>右心室<br>活動一<br>豬心外部形態的觀察<br>第 2 章  循環與消化　57<br><small>課本P57完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>觸摸並比較左心室與右心室，何者的肌肉層較厚？為什麼？試著判斷及分辨心臟的腹面與背面。<br>2<br>腹面觀<br>背面觀<br>活動一 豬心外部形態的觀察<br>7<br>配合課本 <br>P57<small>原PPT第7頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_002", "P57完整課本頁"]]}, {"id": "b3-a21-l05", "t": "大血管：從連到哪個心腔判斷", "sec": "s1", "slide": 8, "sourceSlides": [8], "sourcePages": [3], "src": "課本P58；PPT 8", "figSpec": {"image": "p3_lab_great_vessels"}, "txt": "<h3>觀察與推論</h3><ul><li>主動脈由左心室發出，肺動脈由右心室發出。</li><li>上、下大靜脈通入右心房；肺靜脈通入左心房。</li><li>動脈與靜脈依離心或回心方向區分，不能用含氧量或照片顏色命名。</li></ul><p class=\"thinking\"><strong>想一想</strong> 肺動脈含氧較低，為什麼仍叫動脈？</p><div class=\"quote\">找找看連結心臟的血管以及心臟表面分布的血管，辨識主動脈、上大靜脈、下大<br>靜脈、肺動脈與肺靜脈各位於何處，說明判斷的理由，並比較動脈與靜脈的管壁<br>厚度。<br>3<br>下大靜脈<br>上大靜脈<br>主動脈<br>肺動脈<br>肺靜脈<br>討　論<br>1  請整理並量化你所觀察到的心房與心室之肌肉壁厚度，比較各組紀錄結果，並討<br>論其功能的差異。<br>58　選修生物 Ⅲ (全)<br><small>課本P58完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>找找看連結心臟的血管以及心臟表面分布的血管，辨識主動脈、上大靜脈、下大靜脈、肺動脈與肺靜脈各位於何處，說明判斷的理由，並比較動脈與靜脈的管壁厚度。<br>3<br>活動一 豬心外部形態的觀察<br>肺動脈<br>主動脈<br>上大靜脈<br>肺靜脈<br>下大靜脈<br>8<br>配合課本 <br>P58<small>原PPT第8頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_003", "P58完整課本頁"]]}, {"id": "b3-a21-l06", "t": "管壁、厚度與實測紀錄", "sec": "s1", "slide": 9, "sourceSlides": [9, 10], "sourcePages": [3], "src": "課本P58；PPT 9、10", "figSpec": {"image": "p9_lab_left_ventricle_thickness"}, "txt": "<h3>觀察與推論</h3><ul><li>動脈管壁通常較厚，靜脈通常較薄易塌；以連通位置加上管壁特徵判定。</li><li>在相當切面與位置量肌肉層，記錄mm、重複次數與範圍，避開脂肪與腱索。</li><li>PPT參考表是教材資料，不是本組實測；左心室壁較厚與體循環所需壓力較高有關。</li></ul><p class=\"thinking\"><strong>想一想</strong> 固定3倍或固定120 mmHg，能直接套到每一顆豬心嗎？</p><div class=\"scope-note\">PPT第9、10頁標示配合課本P59，但量測討論實際位在課本P58；以課本原頁為準。參考數字不代填個人結果。</div><div class=\"quote\">找找看連結心臟的血管以及心臟表面分布的血管，辨識主動脈、上大靜脈、下大<br>靜脈、肺動脈與肺靜脈各位於何處，說明判斷的理由，並比較動脈與靜脈的管壁<br>厚度。<br>3<br>下大靜脈<br>上大靜脈<br>主動脈<br>肺動脈<br>肺靜脈<br>討　論<br>1  請整理並量化你所觀察到的心房與心室之肌肉壁厚度，比較各組紀錄結果，並討<br>論其功能的差異。<br>58　選修生物 Ⅲ (全)<br><small>課本P58完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>1. <br>請整理並量化你所觀察到的心房與心室之肌肉壁厚度，比較各組紀錄結果，並討論其功能的差異。<br>討論<br>活動一 豬心外部形態的觀察<br>9<br>配合課本 <br>P59<small>原PPT第9頁完整抽取原文；科學補充見教學重點</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動一 豬心外部形態的觀察<br>心室在心房的下方，且心室舒張時的低壓也有助於血液由心房流入心室，因此心房的肌肉壁很薄。心室必須將血液送離開心臟，完成特定的循環路徑再流回心臟，路程較遠，需要較大的壓力，因此心室肌肉壁的厚度遠大於心房。<br>答<br>：<br>10<br>左心房<br>左心室<br>右心房<br>右心室<br>肌肉<br>壁厚度<br>薄<br>（約 <br>3<br>～<br>8 mm<br>）<br>最厚<br>（約 <br>22<br>～<br>26 mm<br>）<br>薄<br>（約 <br>3<br>～<br>8 mm<br>）<br>厚<br>（約 <br>5<br>～<br>9 mm<br>）<br>功　能<br>接受來自肺靜脈的血液<br>將血液泵入主動脈<br>接受來自上、下大靜脈的血液<br>將血液泵入肺動脈<br>配合課本 <br>P59<small>原PPT第10頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_003", "P58完整課本頁"]]}, {"id": "b3-a21-l07", "t": "順向灌水：先預測再操作", "sec": "s2", "slide": 11, "sourceSlides": [11], "sourcePages": [4], "src": "課本P59；PPT 11", "figSpec": {"image": "p4_lab_perfusion_experiment"}, "txt": "<h3>觀察與推論</h3><ul><li>低流量由上大靜脈注水，控制右心房其他入口的漏水。</li><li>預期路徑：右心房→三尖瓣→右心室→肺動脈瓣→肺動脈。</li><li>分別記錄預測、實際出口與漏水；不要用高壓掩蓋辨認或密封問題。</li></ul><p class=\"thinking\"><strong>想一想</strong> 如果水從下大靜脈流出，你會先檢查什麼？</p><div class=\"quote\">步　驟<br>將豬心的上大靜脈接在水龍頭下方後壓緊，並將連接右心房的其他靜脈用手指捏<br>住，打開水龍頭（注意調小水流量，以免水花飛濺）觀察水最後會從哪一條血管<br>流出來？這條血管的名稱為何？<br>1<br>灌水<br>上大靜脈<br>主動脈<br>肺動脈<br>同步驟 1，改由肺動脈灌水進入右心室，觀察水是否會從連接右心房的靜脈流出<br>來？<br>2<br>灌水<br>上大靜脈<br>主動脈<br>肺動脈<br>活動二<br>豬心內部血液流向的觀察<br>討　論<br>1  根據觀察結果，由肺動脈灌水入右心室，水會從連接右心房的靜脈流出來嗎？為<br>什麼？<br>第 2 章  循環與消化　59<br><small>課本P59完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動<br>二<br> 豬心<br>內部血液流向<br>的觀察<br>將豬心的上大靜脈接在水龍頭下方後壓緊，並將連接右心房的其他靜脈用手指捏住，打開水龍頭（注意調小水流量，以免水花飛濺）觀察水最後會從哪一條血管流出來？這條血管的名稱為何？<br>1<br>灌水<br>上大靜脈<br>主動脈<br>肺動脈<br>11<br>配合課本 <br>P59<small>原PPT第11頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_004", "P59完整課本頁"]]}, {"id": "b3-a21-l08", "t": "逆向灌水：半月瓣的作用", "sec": "s2", "slide": 12, "sourceSlides": [12, 13], "sourcePages": [4], "src": "課本P59；PPT 12、13", "figSpec": {"image": "p4_lab_perfusion_experiment"}, "txt": "<h3>觀察與推論</h3><ul><li>由肺動脈朝右心室方向灌水，與正常射血方向相反。</li><li>瓣膜完整且壓差適當時，肺動脈半月瓣關閉，限制水倒流入右心室。</li><li>若有漏水，應檢查標本損傷、密封與壓力，不能直接推翻瓣膜功能。</li></ul><p class=\"thinking\"><strong>想一想</strong> 即使水沒到右心房，也能推論水已經進入右心室嗎？</p><div class=\"scope-note\">課本「由肺動脈灌水進入右心室」描述操作目標，不保證水已通過瓣膜。原PPT第13頁的肺循環路徑是活體正常循環，不是離體豬心灌水的實際去向。</div><div class=\"quote\">步　驟<br>將豬心的上大靜脈接在水龍頭下方後壓緊，並將連接右心房的其他靜脈用手指捏<br>住，打開水龍頭（注意調小水流量，以免水花飛濺）觀察水最後會從哪一條血管<br>流出來？這條血管的名稱為何？<br>1<br>灌水<br>上大靜脈<br>主動脈<br>肺動脈<br>同步驟 1，改由肺動脈灌水進入右心室，觀察水是否會從連接右心房的靜脈流出<br>來？<br>2<br>灌水<br>上大靜脈<br>主動脈<br>肺動脈<br>活動二<br>豬心內部血液流向的觀察<br>討　論<br>1  根據觀察結果，由肺動脈灌水入右心室，水會從連接右心房的靜脈流出來嗎？為<br>什麼？<br>第 2 章  循環與消化　59<br><small>課本P59完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動<br>二<br> 豬心<br>內部血液流向<br>的觀察<br>同步驟 <br>1<br>，改由肺動脈灌水進入右心室，觀察水是否會從連接右心房的靜脈流出來？<br>2<br>上大靜脈<br>主動脈<br>肺動脈<br>灌水<br>12<br>配合課本 <br>P59<small>原PPT第12頁完整抽取原文；科學補充見教學重點</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動<br>二<br> 豬心<br>內部血液流向<br>的觀察<br>1. <br>根據觀察結果，由肺動脈灌水入右心室，水會從連接右心房的靜脈流出來嗎？為什麼？<br>討論<br>答<br>：<br>(1) <br>不會。<br>(2) <br>因心室與動脈間有瓣膜阻擋，血液（水流）流動方向應為肺動脈→肺→肺靜脈→左心房。<br>13<br>配合課本 <br>P59<small>原PPT第13頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_004", "P59完整課本頁"]]}, {"id": "b3-a21-l09", "t": "瓣膜開閉：壓差推動的被動構造", "sec": "s2", "slide": 14, "sourceSlides": [14], "sourcePages": [5], "src": "課本P60；PPT 14", "figSpec": {"image": "p5_lab_semilunar_coronary"}, "txt": "<h3>觀察與推論</h3><ul><li>瓣膜依兩側壓差與形態被動開閉，不是像肌肉自行收縮。</li><li>心室壓力高於動脈時半月瓣可開啟；反向壓差促使關閉。</li><li>離體灌水檢驗通路與防逆流，不能測量活體收縮力或完整循環。</li></ul><p class=\"thinking\"><strong>想一想</strong> 外部水壓和活體心肌產生的壓力，哪裡相同、哪裡不同？</p><div class=\"quote\">步　驟<br>從主動脈及肺動脈的管腔上方俯視，可看見與心臟交接處的瓣膜，稱為半月<br>瓣。觀察主動脈與肺動脈靠近半月瓣附近，何者可以看見兩個開口？<br>1<br> 肺動脈基部的瓣膜<br> 主動脈基部的瓣膜<br> 靠近半月瓣附近可以看見兩個開口（箭頭所指處）<br>活動三<br>豬心內部構造的觀察<br>60　選修生物 Ⅲ (全)<br><small>課本P60完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動三 豬心<br>內部構造<br>的觀察<br>從主動脈及肺動脈的管腔上方俯視，可看見與心臟交接處的瓣膜，稱為半月瓣。觀察主動脈與肺動脈靠近半月瓣附近，何者可以看見兩個開口？<br>1<br>主動脈基部的瓣膜<br>靠近半月瓣附近可以看見兩個開口（箭頭所指處）<br>14<br>配合課本 <br>P60<br>肺動脈基部的瓣膜<small>原PPT第14頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_005", "P60完整課本頁"]]}, {"id": "b3-a21-l10", "t": "排錯：把漏水與通路分開", "sec": "s2", "slide": 11, "sourceSlides": [11, 12], "sourcePages": [4], "src": "課本P59；PPT 11、12", "figSpec": {"image": "p4_lab_perfusion_experiment"}, "txt": "<h3>觀察與推論</h3><ul><li>每次只改注水入口，盡量維持相近水流與密封方式。</li><li>記錄瓣膜是否完整、其他殘端是否漏水以及實際出口。</li><li>不強行提高水壓或捅穿瓣膜；用重複觀察與對照修正結論。</li></ul><p class=\"thinking\"><strong>想一想</strong> 兩次實驗入口、水流和密封都改了，能只歸因於入口差異嗎？</p><div class=\"quote\">步　驟<br>將豬心的上大靜脈接在水龍頭下方後壓緊，並將連接右心房的其他靜脈用手指捏<br>住，打開水龍頭（注意調小水流量，以免水花飛濺）觀察水最後會從哪一條血管<br>流出來？這條血管的名稱為何？<br>1<br>灌水<br>上大靜脈<br>主動脈<br>肺動脈<br>同步驟 1，改由肺動脈灌水進入右心室，觀察水是否會從連接右心房的靜脈流出<br>來？<br>2<br>灌水<br>上大靜脈<br>主動脈<br>肺動脈<br>活動二<br>豬心內部血液流向的觀察<br>討　論<br>1  根據觀察結果，由肺動脈灌水入右心室，水會從連接右心房的靜脈流出來嗎？為<br>什麼？<br>第 2 章  循環與消化　59<br><small>課本P59完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動<br>二<br> 豬心<br>內部血液流向<br>的觀察<br>將豬心的上大靜脈接在水龍頭下方後壓緊，並將連接右心房的其他靜脈用手指捏住，打開水龍頭（注意調小水流量，以免水花飛濺）觀察水最後會從哪一條血管流出來？這條血管的名稱為何？<br>1<br>灌水<br>上大靜脈<br>主動脈<br>肺動脈<br>11<br>配合課本 <br>P59<small>原PPT第11頁完整抽取原文；科學補充見教學重點</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動<br>二<br> 豬心<br>內部血液流向<br>的觀察<br>同步驟 <br>1<br>，改由肺動脈灌水進入右心室，觀察水是否會從連接右心房的靜脈流出來？<br>2<br>上大靜脈<br>主動脈<br>肺動脈<br>灌水<br>12<br>配合課本 <br>P59<small>原PPT第12頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_004", "P59完整課本頁"]]}, {"id": "b3-a21-l11", "t": "左心順向通路：延伸預測", "sec": "s2", "slide": 8, "sourceSlides": [8], "sourcePages": [3], "src": "課本P58；PPT 8", "figSpec": {"image": "p3_lab_great_vessels"}, "txt": "<h3>觀察與推論</h3><ul><li>依連通關係預測：肺靜脈→左心房→二尖瓣→左心室→主動脈瓣→主動脈。</li><li>這是依解剖延伸的模型預測；課本P59核心操作是右心的順、逆向灌水。</li><li>能否觀察到出口受取材完整性、密封及壓差影響，不把預測寫成已測結果。</li></ul><p class=\"thinking\"><strong>想一想</strong> 如何設計一個操作，區分漏水和真正通過主動脈？</p><div class=\"quote\">找找看連結心臟的血管以及心臟表面分布的血管，辨識主動脈、上大靜脈、下大<br>靜脈、肺動脈與肺靜脈各位於何處，說明判斷的理由，並比較動脈與靜脈的管壁<br>厚度。<br>3<br>下大靜脈<br>上大靜脈<br>主動脈<br>肺動脈<br>肺靜脈<br>討　論<br>1  請整理並量化你所觀察到的心房與心室之肌肉壁厚度，比較各組紀錄結果，並討<br>論其功能的差異。<br>58　選修生物 Ⅲ (全)<br><small>課本P58完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>找找看連結心臟的血管以及心臟表面分布的血管，辨識主動脈、上大靜脈、下大靜脈、肺動脈與肺靜脈各位於何處，說明判斷的理由，並比較動脈與靜脈的管壁厚度。<br>3<br>活動一 豬心外部形態的觀察<br>肺動脈<br>主動脈<br>上大靜脈<br>肺靜脈<br>下大靜脈<br>8<br>配合課本 <br>P58<small>原PPT第8頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_003", "P58完整課本頁"]]}, {"id": "b3-a21-l12", "t": "半月瓣：保留原形再觀察", "sec": "s3", "slide": 14, "sourceSlides": [14, 15], "sourcePages": [5, 6], "src": "課本P60、61；PPT 14、15", "figSpec": {"image": "p5_lab_semilunar_coronary"}, "txt": "<h3>觀察與推論</h3><ul><li>由管腔俯視主動脈及肺動脈基部，觀察袋狀瓣葉。</li><li>向下剪動脈壁時避開瓣膜與開口，依教師示範固定材料。</li><li>兩處半月瓣通常各有3片瓣葉；沒有房室瓣的腱索、乳頭肌連接。</li></ul><p class=\"thinking\"><strong>想一想</strong> 先剪破瓣膜再做逆向灌水，會失去什麼證據？</p><div class=\"quote\">步　驟<br>從主動脈及肺動脈的管腔上方俯視，可看見與心臟交接處的瓣膜，稱為半月<br>瓣。觀察主動脈與肺動脈靠近半月瓣附近，何者可以看見兩個開口？<br>1<br> 肺動脈基部的瓣膜<br> 主動脈基部的瓣膜<br> 靠近半月瓣附近可以看見兩個開口（箭頭所指處）<br>活動三<br>豬心內部構造的觀察<br>60　選修生物 Ⅲ (全)<br><small>課本P60完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">從主動脈或肺動脈向下剪開動脈壁，注意<br>不要剪到瓣膜，直到露出全部的半月瓣。<br>觀察半月瓣的形態與數量，並注意開口與<br>半月瓣的相對位置。從形態想一想，此處<br>的瓣膜為何會稱為半月瓣？<br>取一段直徑 2 mm 的深色塑膠管（或粗釣魚線）插入步驟 1 觀察到的兩個開口<br>中，觀察管線會通到何處？也可用注射針筒或滴管吸取黑色食用色素溶液（或黑<br>色鋼筆墨水）注入開口，觀察黑色溶液會流到何處。<br>2<br>3<br> 利用深色塑膠管插入開口中，觀察開口會通往何處。<br> 利用注射針筒或滴管將黑色溶液注入開口之中，觀察黑色溶液的分布。<br>第 2 章  循環與消化　61<br><small>課本P61完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動三 豬心<br>內部構造<br>的觀察<br>從主動脈及肺動脈的管腔上方俯視，可看見與心臟交接處的瓣膜，稱為半月瓣。觀察主動脈與肺動脈靠近半月瓣附近，何者可以看見兩個開口？<br>1<br>主動脈基部的瓣膜<br>靠近半月瓣附近可以看見兩個開口（箭頭所指處）<br>14<br>配合課本 <br>P60<br>肺動脈基部的瓣膜<small>原PPT第14頁完整抽取原文；科學補充見教學重點</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動三 豬心<br>內部構造<br>的觀察<br>從主動脈或肺動脈向下剪開動脈壁，注意不要剪到瓣膜，直到露出全部的半月瓣。觀察半月瓣的形態與數量，並注意開口與半月瓣的相對位置。從形態想一想，此處的瓣膜為何會稱為半月瓣？<br>2<br>15<br>配合課本 <br>P61<small>原PPT第15頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_005", "P60完整課本頁"], ["step_006", "P61完整課本頁"]]}, {"id": "b3-a21-l13", "t": "兩個開口：主動脈與冠狀動脈", "sec": "s3", "slide": 14, "sourceSlides": [14, 16, 17, 18], "sourcePages": [5, 6], "src": "課本P60、61；PPT 14、16、17、18", "figSpec": {"image": "p5_lab_semilunar_coronary"}, "txt": "<h3>觀察與推論</h3><ul><li>主動脈根部可見通往左、右冠狀動脈的開口。</li><li>肺動脈基部沒有這一對冠狀動脈開口，不把兩種動脈混同。</li><li>細軟管或食用色素追蹤須輕柔，不強行穿刺；觀察到哪裡就記到哪裡。</li></ul><p class=\"thinking\"><strong>想一想</strong> 色素只沿一段血管分布，能宣稱看見全部微血管網嗎？</p><div class=\"quote\">步　驟<br>從主動脈及肺動脈的管腔上方俯視，可看見與心臟交接處的瓣膜，稱為半月<br>瓣。觀察主動脈與肺動脈靠近半月瓣附近，何者可以看見兩個開口？<br>1<br> 肺動脈基部的瓣膜<br> 主動脈基部的瓣膜<br> 靠近半月瓣附近可以看見兩個開口（箭頭所指處 div>", "tb": [["step_007", "P62完整課本頁"]]}, {"id": "b3-a21-l16", "t": "右心室切開：避開中膈與瓣膜", "sec": "s3", "slide": 22, "sourceSlides": [22, 23], "sourcePages": [8], "src": "課本P63；PPT 22、23", "figSpec": {"image": "p8_lab_right_ventricle_dissect"}, "txt": "<h3>觀察與推論</h3><ul><li>依課本箭頭與順序，沿右心室側邊切開並掀起心室壁。</li><li>避免切在心室中膈，保留三尖瓣、腱索與乳頭肌的相對位置。</li><li>操作先由教師示範，使用固定支撐，手與他人避開刀剪路徑。</li></ul><p class=\"thinking\"><strong>想一想</strong> 切開中膈後發現左右相通，能說標本原本就有缺損嗎？</p><div class=\"quote\">用手摸摸心室中膈處（左心室肌肉較厚較硬、右心室肌肉較軟），沿著心室中膈<br>靠右心室邊緣剪開或切開右心室壁。（圖中黑色箭頭表示剪開或切開的方向，數<br>字 1∼3 表示順序，虛線為掀開心室壁處）e： 注意不要切在中膈處。<br>5<br>心室中膈<br>掀開右心室，觀察心室內壁是否光<br>滑？左、右心室是否相通？觀察右心<br>室與右心房相接處的瓣膜（箭頭所指<br>處），此處瓣膜共有幾片？瓣膜是否<br>有條狀構造與心室內壁突出的肌肉連<br>接？<br>6<br>右心室內壁<br>上大靜脈<br>右心房<br>往上掀開<br>起點<br>三尖瓣<br>下大靜脈<br>左心室<br>左心房<br>肺動脈<br>主動脈<br>半月瓣<br>3<br>2<br>1<br>第 2 章  循環與消化　63<br><small>課本P63完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動三 豬心<br>內部構造<br>的觀察<br>5<br>用手摸摸心室中膈處（左心室肌肉較厚較硬、右心室肌肉較軟），沿著心室中膈靠右心室邊緣剪開或切開右心室壁。（下頁圖中黑色箭頭表示剪開或切開的方向，數字 <br>1<br>～<br>3 <br>表示順序，虛線為掀開心室壁處）<br>註<br>注意不要切在中膈處。<br>22<br>配合課本 <br>P63<small>原PPT第22頁完整抽取原文；科學補充見教學重點</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動三 豬心<br>內部構造<br>的觀察<br>心室中膈<br>三尖瓣<br>右心房<br>上大靜脈<br>下大靜脈<br>主動脈<br>肺動脈<br>左心房<br>半月瓣<br>左心室<br>起點<br>1<br>2<br>3<br>往上掀開<br>23<br>配合課本 <br>P63<small>原PPT第23頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_008", "P63完整課本頁"]]}, {"id": "b3-a21-l17", "t": "房室瓣：腱索不是開門拉繩", "sec": "s3", "slide": 24, "sourceSlides": [24], "sourcePages": [8], "src": "課本P63；PPT 24", "figSpec": {"image": "p8_lab_right_ventricle_dissect"}, "txt": "<h3>觀察與推論</h3><ul><li>右房室交界為三尖瓣，左房室交界為二尖瓣。</li><li>腱索把瓣葉連到乳頭肌，心室收縮時協助防止瓣葉向心房翻脫。</li><li>瓣葉開閉主要由壓差驅動；乳頭肌不是主動把房室瓣拉開。</li></ul><p class=\"thinking\"><strong>想一想</strong> 剪斷腱索最直接影響的是開啟能力，還是抗翻脫的穩定性？</p><div class=\"quote\">用手摸摸心室中膈處（左心室肌肉較厚較硬、右心室肌肉較軟），沿著心室中膈<br>靠右心室邊緣剪開或切開右心室壁。（圖中黑色箭頭表示剪開或切開的方向，數<br>字 1∼3 表示順序，虛線為掀開心室壁處）e： 注意不要切在中膈處。<br>5<br>心室中膈<br>掀開右心室，觀察心室內壁是否光<br>滑？左、右心室是否相通？觀察右心<br>室與右心房相接處的瓣膜（箭頭所指<br>處），此處瓣膜共有幾片？瓣膜是否<br>有條狀構造與心室內壁突出的肌肉連<br>接？<br>6<br>右心室內壁<br>上大靜脈<br>右心房<br>往上掀開<br>起點<br>三尖瓣<br>下大靜脈<br>左心室<br>左心房<br>肺動脈<br>主動脈<br>半月瓣<br>3<br>2<br>1<br>第 2 章  循環與消化　63<br><small>課本P63完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動三 豬心<br>內部構造<br>的觀察<br>掀開右心室，觀察心室內壁是否光滑？左、右心室是否相通？觀察右心室與右心房相接處的瓣膜（箭頭所指處），此處瓣膜共有幾片？瓣膜是否有條狀構造與心室內壁突出的肌肉連接？<br>6<br>右心室內壁<br>24<br>配合課本 <br>P63<small>原PPT第24頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_008", "P63完整課本頁"]]}, {"id": "b3-a21-l18", "t": "心房與左心室：比較厚度與通路", "sec": "s3", "slide": 25, "sourceSlides": [25, 26, 27, 28], "sourcePages": [9, 10], "src": "課本P64、65；PPT 25、26、27、28", "figSpec": {"image": "p9_lab_left_ventricle_thickness"}, "txt": "<h3>觀察與推論</h3><ul><li>依圖掀開左心室壁，辨認二尖瓣與主動脈出口。</li><li>心房壁通常比心室壁薄；左心室自由壁通常比右心室厚。</li><li>肺靜脈入口應在實際豬心逐一觀察；不把人類典型4條強套所有豬心殘端。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若取材時兩條血管已剪成共同殘端，入口數如何記錄才誠實？</p><div class=\"quote\">從右心房的側邊剪開右心房，觀察心房與心室肌肉壁的厚度是否有差異？<br>7 <br>右心室壁<br>右心房壁<br>參考下圖，橫向剪開左心室。（圖中黑色箭頭表示剪開或切開的方向，數字 1∼2 <br>表示順序，虛線為掀開心室壁處）<br>8 <br>主動脈<br>半月瓣<br>肺動脈<br>肺靜脈<br>左心房<br> <br>向下掀開<br>二尖瓣<br>1<br>2<br>起點<br>64　選修生物 Ⅲ (全)<br><small>課本P64完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">討　論<br>1  心臟供給全身血液，但心臟本身的血液由哪些血管供應？心臟表面分布許多細小<br>的動脈與靜脈，試著找到並列出這些動靜脈的血液由哪裡來？<br>2  試探討心臟在結構上有何特色，使血液單向流動，並提供血液運行的適當動力。<br>3  根據觀察，左、右心房與左、右心室間是否相通？若相通，在動物體身上會產生<br>何種症狀或現象？<br>掀開左心室，觀察心室內壁是否光滑？並比較左、右心室肌肉壁的厚度。左心室<br>與左心房交界處的瓣膜共有幾片？<br>9 <br>沿著心房邊緣剪開左心房，觀察肺靜脈在左心房的入口共有幾個？<br>10 <br>左心室壁<br>右心室壁<br>第 2 章  循環與消化　65<br><small>課本P65完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動三 豬心<br>內部構造<br>的觀察<br>從右心房的側邊剪開右心房，觀察心房與心室肌肉壁的厚度是否有差異？<br>7<br>右心室壁<br>右心房壁<br>25<br>配合課本 <br>P64<small>原PPT第25頁完整抽取原文；科學補充見教學重點</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動三 豬心<br>內部構造<br>的觀察<br>參考<br>右<br>圖，橫向剪開左心室。（圖中黑色箭頭表示剪開或切開的方向，數字 <br>1<br>～<br>2<br> 表示順序，虛線為掀開心室壁處）<br>8<br>二尖瓣<br>半月瓣<br>主動脈<br>肺動脈<br>肺靜脈<br>左心房<br>1<br>2<br>起點<br>往下掀開<br>26<br>配合課本 <br>P64<small>原PPT第26頁完整抽取原文；科學補充見教學重點</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動三 豬心<br>內部構造<br>的觀察<br>掀開左心室，觀察心室內壁是否光滑？並比較左、右心室肌肉壁的厚度。左心室與左心房交界處的瓣膜共有幾片？<br>9<br>右心室壁<br>左心室壁<br>27<br>配合課本 <br>P65<small>原PPT第27頁完整抽取原文；科學補充見教學重點</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動三 豬心<br>內部構造<br>的觀察<br>10<br>沿著心房邊緣剪開左心房，觀察肺靜脈在左心房的入口共有幾個？<br>28<br>配合課本 <br>P65<small>原PPT第28頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_009", "P64完整課本頁"], ["step_010", "P65完整課本頁"]]}, {"id": "b3-a21-l19", "t": "中膈與心腔：正常連通的界線", "sec": "s4", "slide": 31, "sourceSlides": [31], "sourcePages": [10], "src": "課本P65；PPT 31", "figSpec": {"image": "step_010"}, "txt": "<h3>觀察與推論</h3><ul><li>正常出生後，左、右心房及左、右心室沒有直接開放的通道。</li><li>同側心房與心室則透過房室口連通；不要把「不相通」套到全部四腔。</li><li>中膈缺損的影響與壓差、大小和位置有關，不能只說必定缺氧或發紺。</li></ul><p class=\"thinking\"><strong>想一想</strong> 發現小孔時，怎樣先排除操作造成的破口？</p><div class=\"scope-note\">原PPT第31頁用充氧血與減氧血混合概括缺損影響。常見心室缺損初期可由高壓左室分流到右室，增加肺循環負荷，並非一律立即發紺；本活動不做疾病診斷。</div><div class=\"quote\">討　論<br>1  心臟供給全身血液，但心臟本身的血液由哪些血管供應？心臟表面分布許多細小<br>的動脈與靜脈，試著找到並列出這些動靜脈的血液由哪裡來？<br>2  試探討心臟在結構上有何特色，使血液單向流動，並提供血液運行的適當動力。<br>3  根據觀察，左、右心房與左、右心室間是否相通？若相通，在動物體身上會產生<br>何種症狀或現象？<br>掀開左心室，觀察心室內壁是否光滑？並比較左、右心室肌肉壁的厚度。左心室<br>與左心房交界處的瓣膜共有幾片？<br>9 <br>沿著心房邊緣剪開左心房，觀察肺靜脈在左心房的入口共有幾個？<br>10 <br>左心室壁<br>右心室壁<br>第 2 章  循環與消化　65<br><small>課本P65完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動三 豬心<br>內部構造<br>的觀察<br>3. <br>根據觀察，左、右心房與左、右心室間是否相通？若相通，在動物體身上會產生何種症狀或現象？<br>答<br>：<br>左心都是充氧血，右心都是減氧血，彼此完全不相通。若相通，會造成充氧血與減氧血混合，而降低氣體運輸效能及氣體交換的效率。<br>31<br>配合課本 <br>P65<small>原PPT第31頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_010", "P65完整課本頁"]]}, {"id": "b3-a21-l20", "t": "厚度量測：公平比較的設計", "sec": "s4", "slide": 9, "sourceSlides": [9, 10, 27], "sourcePages": [3, 10], "src": "課本P58、65；PPT 9、10、27", "figSpec": {"image": "p9_lab_left_ventricle_thickness"}, "txt": "<h3>觀察與推論</h3><ul><li>比較相當高度與部位的自由壁，排除中膈、脂肪與乳頭肌造成的偏差。</li><li>每部位重複量測，保留原始值、mm單位、平均或範圍與照片位置。</li><li>數值未測就寫待測；不同大小、處理與切面的豬心不能用固定值代替。</li></ul><p class=\"thinking\"><strong>想一想</strong> 左室量在乳頭肌上，右室量在薄壁處，會造成什麼偏差？</p><div class=\"quote\">找找看連結心臟的血管以及心臟表面分布的血管，辨識主動脈、上大靜脈、下大<br>靜脈、肺動脈與肺靜脈各位於何處，說明判斷的理由，並比較動脈與靜脈的管壁<br>厚度。<br>3<br>下大靜脈<br>上大靜脈<br>主動脈<br>肺動脈<br>肺靜脈<br>討　論<br>1  請整理並量化你所觀察到的心房與心室之肌肉壁厚度，比較各組紀錄結果，並討<br>論其功能的差異。<br>58　選修生物 Ⅲ (全)<br><small>課本P58完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">討　論<br>1  心臟供給全身血液，但心臟本身的血液由哪些血管供應？心臟表面分布許多細小<br>的動脈與靜脈，試著找到並列出這些動靜脈的血液由哪裡來？<br>2  試探討心臟在結構上有何特色，使血液單向流動，並提供血液運行的適當動力。<br>3  根據觀察，左、右心房與左、右心室間是否相通？若相通，在動物體身上會產生<br>何種症狀或現象？<br>掀開左心室，觀察心室內壁是否光滑？並比較左、右心室肌肉壁的厚度。左心室<br>與左心房交界處的瓣膜共有幾片？<br>9 <br>沿著心房邊緣剪開左心房，觀察肺靜脈在左心房的入口共有幾個？<br>10 <br>左心室壁<br>右心室壁<br>第 2 章  循環與消化　65<br><small>課本P65完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>1. <br>請整理並量化你所觀察到的心房與心室之肌肉壁厚度，比較各組紀錄結果，並討論其功能的差異。<br>討論<br>活動一 豬心外部形態的觀察<br>9<br>配合課本 <br>P59<small>原PPT第9頁完整抽取原文；科學補充見教學重點</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動一 豬心外部形態的觀察<br>心室在心房的下方，且心室舒張時的低壓也有助於血液由心房流入心室，因此心房的肌肉壁很薄。心室必須將血液送離開心臟，完成特定的循環路徑再流回心臟，路程較遠，需要較大的壓力，因此心室肌肉壁的厚度遠大於心房。<br>答<br>：<br>10<br>左心房<br>左心室<br>右心房<br>右心室<br>肌肉<br>壁厚度<br>薄<br>（約 <br>3<br>～<br>8 mm<br>）<br>最厚<br>（約 <br>22<br>～<br>26 mm<br>）<br>薄<br>（約 <br>3<br>～<br>8 mm<br>）<br>厚<br>（約 <br>5<br>～<br>9 mm<br>）<br>功　能<br>接受來自肺靜脈的血液<br>將血液泵入主動脈<br>接受來自上、下大靜脈的血液<br>將血液泵入肺動脈<br>配合課本 <br>P59<small>原PPT第10頁完整抽取原文；科學補充見教學重點</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動三 豬心<br>內部構造<br>的觀察<br>掀開左心室，觀察心室內壁是否光滑？並比較左、右心室肌肉壁的厚度。左心室與左心房交界處的瓣膜共有幾片？<br>9<br>右心室壁<br>左心室壁<br>27<br>配合課本 <br>P65<small>原PPT第27頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_003", "P58完整課本頁"], ["step_010", "P65完整課本頁"]]}, {"id": "b3-a21-l21", "t": "冠狀供血：用路徑回答討論", "sec": "s4", "slide": 29, "sourceSlides": [29], "sourcePages": [10], "src": "課本P65；PPT 29", "figSpec": {"image": "p7_lab_coronary_circulation"}, "txt": "<h3>觀察與推論</h3><ul><li>用箭頭表示血液由主動脈基部進入冠狀動脈，再到心肌微血管。</li><li>多數靜脈血經冠狀竇回右心房，區分供血與回流。</li><li>以原圖與自己追蹤的區段支持答案，不把未見細節寫成親眼所見。</li></ul><p class=\"thinking\"><strong>想一想</strong> 如果冠狀動脈開口已剪掉，還可以記錄哪些證據？</p><div class=\"quote\">討　論<br>1  心臟供給全身血液，但心臟本身的血液由哪些血管供應？心臟表面分布許多細小<br>的動脈與靜脈，試著找到並列出這些動靜脈的血液由哪裡來？<br>2  試探討心臟在結構上有何特色，使血液單向流動，並提供血液運行的適當動力。<br>3  根據觀察，左、右心房與左、右心室間是否相通？若相通，在動物體身上會產生<br>何種症狀或現象？<br>掀開左心室，觀察心室內壁是否光滑？並比較左、右心室肌肉壁的厚度。左心室<br>與左心房交界處的瓣膜共有幾片？<br>9 <br>沿著心房邊緣剪開左心房，觀察肺靜脈在左心房的入口共有幾個？<br>10 <br>左心室壁<br>右心室壁<br>第 2 章  循環與消化　65<br><small>課本P65完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動三 豬心<br>內部構造<br>的觀察<br>討論<br>心臟供給全身血液，但心臟本身的血液由哪些血管供應？心臟表面分布許多細小的動脈與靜脈，試著找到並列出這些動靜脈的血液由哪裡來？<br>29<br>配合課本 <br>P65<br>答<br>：<br>(1)<br>心臟本身的血液由冠狀動脈供應。<br>(2)<br>心臟表面的動、靜脈中血液由冠狀循環而來，路徑如下<br>：<br>右心房<br>冠狀<br>動脈<br>小動脈<br>心臟<br>微血管<br>小靜脈<br>冠狀竇<br> 主動脈<br>（基部<br>）<small>原PPT第29頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_010", "P65完整課本頁"]]}, {"id": "b3-a21-l22", "t": "動力與方向：兩種功能分開", "sec": "s4", "slide": 30, "sourceSlides": [30], "sourcePages": [10], "src": "課本P65；PPT 30", "figSpec": {"image": "p8_lab_right_ventricle_dissect"}, "txt": "<h3>觀察與推論</h3><ul><li>心肌收縮建立壓力，推動血液；瓣膜依壓差限制逆流。</li><li>腱索乳頭肌穩定房室瓣，冠狀循環供應心肌所需物質。</li><li>離體觀察可辨構造與測試水流，不能直接證明標本能產生正常心輸出量。</li></ul><p class=\"thinking\"><strong>想一想</strong> 幫浦、單向閥與供能管線，各對應到心臟哪種構造？</p><div class=\"quote\">討　論<br>1  心臟供給全身血液，但心臟本身的血液由哪些血管供應？心臟表面分布許多細小<br>的動脈與靜脈，試著找到並列出這些動靜脈的血液由哪裡來？<br>2  試探討心臟在結構上有何特色，使血液單向流動，並提供血液運行的適當動力。<br>3  根據觀察，左、右心房與左、右心室間是否相通？若相通，在動物體身上會產生<br>何種症狀或現象？<br>掀開左心室，觀察心室內壁是否光滑？並比較左、右心室肌肉壁的厚度。左心室<br>與左心房交界處的瓣膜共有幾片？<br>9 <br>沿著心房邊緣剪開左心房，觀察肺靜脈在左心房的入口共有幾個？<br>10 <br>左心室壁<br>右心室壁<br>第 2 章  循環與消化　65<br><small>課本P65完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動三 豬心<br>內部構造<br>的觀察<br>2. <br>試探討心臟在結構上有何特色，使血液單向流動，並提供血液運行的適當動力。<br>答<br>：<br>心臟分為左、右心室與左、右心房，在心房與心室之間以及心室與動脈之間具有瓣膜，可防止血液逆流，維持血液單向流動；心臟主要由心肌構成，且表面遍布血管，具有專屬的循環系統（冠狀循環）供應心肌養分，使其可如同幫浦一般不斷收縮、舒張，以推動血液流動。<br>30<br>配合課本 <br>P65<small>原PPT第30頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_010", "P65完整課本頁"]]}, {"id": "b3-a21-l23", "t": "證據分欄：所見、推論與待測", "sec": "s4", "slide": 29, "sourceSlides": [29, 30, 31], "sourcePages": [10], "src": "課本P65；PPT 29、30、31", "figSpec": {"image": "step_010"}, "txt": "<h3>觀察與推論</h3><ul><li>所見寫位置、形態、出口與實測數字，推論寫機制與限制。</li><li>比較預測和實際結果，記錄漏水與破損，不刪掉不符合預期的資料。</li><li>報告附來源、照片方位與單位；借用教材數值必須標示為參考。</li></ul><p class=\"thinking\"><strong>想一想</strong> 一張構造照片，可以支持多大的功能結論？</p><div class=\"quote\">討　論<br>1  心臟供給全身血液，但心臟本身的血液由哪些血管供應？心臟表面分布許多細小<br>的動脈與靜脈，試著找到並列出這些動靜脈的血液由哪裡來？<br>2  試探討心臟在結構上有何特色，使血液單向流動，並提供血液運行的適當動力。<br>3  根據觀察，左、右心房與左、右心室間是否相通？若相通，在動物體身上會產生<br>何種症狀或現象？<br>掀開左心室，觀察心室內壁是否光滑？並比較左、右心室肌肉壁的厚度。左心室<br>與左心房交界處的瓣膜共有幾片？<br>9 <br>沿著心房邊緣剪開左心房，觀察肺靜脈在左心房的入口共有幾個？<br>10 <br>左心室壁<br>右心室壁<br>第 2 章  循環與消化　65<br><small>課本P65完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動三 豬心<br>內部構造<br>的觀察<br>討論<br>心臟供給全身血液，但心臟本身的血液由哪些血管供應？心臟表面分布許多細小的動脈與靜脈，試著找到並列出這些動靜脈的血液由哪裡來？<br>29<br>配合課本 <br>P65<br>答<br>：<br>(1)<br>心臟本身的血液由冠狀動脈供應。<br>(2)<br>心臟表面的動、靜脈中血液由冠狀循環而來，路徑如下<br>：<br>右心房<br>冠狀<br>動脈<br>小動脈<br>心臟<br>微血管<br>小靜脈<br>冠狀竇<br> 主動脈<br>（基部<br>）<small>原PPT第29頁完整抽取原文；科學補充見教學重點</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動三 豬心<br>內部構造<br>的觀察<br>2. <br>試探討心臟在結構上有何特色，使血液單向流動，並提供血液運行的適當動力。<br>答<br>：<br>心臟分為左、右心室與左、右心房，在心房與心室之間以及心室與動脈之間具有瓣膜，可防止血液逆流，維持血液單向流動；心臟主要由心肌構成，且表面遍布血管，具有專屬的循環系統（冠狀循環）供應心肌養分，使其可如同幫浦一般不斷收縮、舒張，以推動血液流動。<br>30<br>配合課本 <br>P65<small>原PPT第30頁完整抽取原文；科學補充見教學重點</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動三 豬心<br>內部構造<br>的觀察<br>3. <br>根據觀察，左、右心房與左、右心室間是否相通？若相通，在動物體身上會產生何種症狀或現象？<br>答<br>：<br>左心都是充氧血，右心都是減氧血，彼此完全不相通。若相通，會造成充氧血與減氧血混合，而降低氣體運輸效能及氣體交換的效率。<br>31<br>配合課本 <br>P65<small>原PPT第31頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_010", "P65完整課本頁"]]}, {"id": "b3-a21-l24", "t": "整合回顧：從一顆心到一份報告", "sec": "s4", "slide": 3, "sourceSlides": [3, 30], "sourcePages": [1, 10], "src": "課本P56、65；PPT 3、30", "figSpec": {"pair": ["p3_lab_great_vessels", "p8_lab_right_ventricle_dissect"]}, "txt": "<h3>觀察與推論</h3><ul><li>用大血管連通關係建立兩側血流路徑。</li><li>用半月瓣、房室瓣與腱索解釋單向流動的構造基礎。</li><li>用厚度量測與實驗限制完成自己的證據紀錄，不代填實測結果。</li></ul><p class=\"thinking\"><strong>想一想</strong> 你最有把握的結論與仍需驗證的結論，各是什麼？</p><div class=\"quote\">探討活動 <br>－1 心臟的觀察<br>2<br>前　言<br>　　西元 2 世紀，希臘醫師加倫解剖許多動物的心臟，認為心臟在舒張時吸收血<br>液，動脈收縮才將血液送出心臟，此論點影響歐洲千年之久，直到 1628 年才由英<br>國醫師哈維確認心臟收縮是推動血液循環的原動力。現在我們已清楚心臟由心肌構<br>成，而推動血液循環的原動力主要是透過其週期性收縮與舒張。<br>　　心臟是如何推動單向血流循環的呢？心臟具有哪些特別的構造？又具有何生理<br>意義？<br>目　的<br>　　本活動目的在探究豬心的外部形態與內部構造，進而推論心臟的結構如何確保<br>血液單向流動，並提供血液運行的適當動力。<br>原　理<br>　　透過心臟的解剖觀察，探究心臟如何推動單向的血液循環，活動中可藉由自上<br>大靜脈與肺動脈注水的方式，觀察血液在不同血管的流向，解剖時觀察血管與心臟<br>間、心房與心室間的構造，可知是否有影響液體流動的構造，並透過觀察如瓣膜構<br>造與腱索的相對位置等，了解血液的單向流動方式。心臟表面遍布血管，但因大部<br>分的血管埋在肌肉中無法直接觀察到，因此可藉由插入深色塑膠軟管或是注射黑色<br>溶液等方式，觀察心臟表面血管的分布與血液流向。<br>器　材<br> 實驗手套<br> 深色塑膠軟管（直徑約 2 mm）或粗釣魚線（7 號或 8 號）<br> 滴管或注射針筒<br> 解剖盤<br> 解剖用具<br> 新鮮的豬心<br> 黑色食用色素溶液（或黑色鋼筆墨水）<br>1 雙<br> 20 cm <br>1 支<br>1 個<br>1 組<br>1 顆<br>適量<br>每組使用<br>56　選修生物 Ⅲ (全)<br><small>課本P56完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">討　論<br>1  心臟供給全身血液，但心臟本身的血液由哪些血管供應？心臟表面分布許多細小<br>的動脈與靜脈，試著找到並列出這些動靜脈的血液由哪裡來？<br>2  試探討心臟在結構上有何特色，使血液單向流動，並提供血液運行的適當動力。<br>3  根據觀察，左、右心房與左、右心室間是否相通？若相通，在動物體身上會產生<br>何種症狀或現象？<br>掀開左心室，觀察心室內壁是否光滑？並比較左、右心室肌肉壁的厚度。左心室<br>與左心房交界處的瓣膜共有幾片？<br>9 <br>沿著心房邊緣剪開左心房，觀察肺靜脈在左心房的入口共有幾個？<br>10 <br>左心室壁<br>右心室壁<br>第 2 章  循環與消化　65<br><small>課本P65完整抽取原文；位置以原圖為準</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>目的<br>　　本活動目的在探究豬心的外部形態與內部構造，進而推論心臟的結構如何確保血液單向流動，並提供血液運行的適當動力。<br>3<br>配合課本 <br>P56<small>原PPT第3頁完整抽取原文；科學補充見教學重點</small></div><div class=\"quote\">探討活動 <br>2-1<br> 心臟的觀察<br>活動三 豬心<br>內部構造<br>的觀察<br>2. <br>試探討心臟在結構上有何特色，使血液單向流動，並提供血液運行的適當動力。<br>答<br>：<br>心臟分為左、右心室與左、右心房，在心房與心室之間以及心室與動脈之間具有瓣膜，可防止血液逆流，維持血液單向流動；心臟主要由心肌構成，且表面遍布血管，具有專屬的循環系統（冠狀循環）供應心肌養分，使其可如同幫浦一般不斷收縮、舒張，以推動血液流動。<br>30<br>配合課本 <br>P65<small>原PPT第30頁完整抽取原文；科學補充見教學重點</small></div>", "tb": [["step_001", "P56完整課本頁"], ["step_010", "P65完整課本頁"]]}], "questions": [{"t": "大血管：特徵與連通", "q": "把6張卡放回對應類別。", "learn": 4, "tag": "vessels", "hint": "以流向和連通位置為主，不只看管壁。", "why": "冠狀血管是專屬循環的一部分，也包含 10", "reflectionLabel": "所見／推論／量測或待測／限制", "reflectionPlaceholder": "請寫自己的結果，未量測寫待測；比較教材說法與實際觀察。", "reviewPrompts": ["是否附具體位置、現象或量測", "是否區分觀察與機制推論", "是否說明破損、密封或切面限制"], "originalBookDiscussion": "課本P65討論3", "id": "b3-a21-q25"}], "tags": {"orientation": ["解剖方位", "以動物本身左右定位，前室間溝與冠狀溝不可混稱。", "課本P56–65；圖解4"], "vessels": ["大血管與連通", "動靜脈依離心回心方向，結合通入或發出的心腔判定。", "課本P56–65；圖解5"], "perfusion": ["灌水與模型界線", "逆向半月瓣關閉；異常漏水先查標本、密封及壓力。", "課本P56–65；圖解8"], "valves": ["壓差與瓣膜", "壓差驅動開閉，腱索乳頭肌穩定房室瓣。", "課本P56–65；圖解17"], "coronary": ["心肌供血與回流", "主動脈冠狀開口供血，多數靜脈血經冠狀竇回右房。", "課本P56–65；圖解14"], "measure": ["厚度量測與負荷", "同部位同切面、mm與重複；厚度不等於固定流量倍數。", "課本P56–65；圖解20"], "method": ["控制與排錯", "控制水流、密封與切面，一次只改待比較因素。", "課本P56–65；圖解10"], "safety": ["保留構造與安全", "固定標本，保留中膈瓣膜，刀剪路徑避開手指與他人。", "課本P56–65；圖解16"], "evidence": ["觀察與推論", "避免由局部模型推論完整活體功能或疾病。", "課本P56–65；圖解23"], "record": ["實測與待測", "保留破損與不確定性，參考資料不可代填實測。", "課本P56–65；圖解23"]}, "conceptMap": {"orientation": 3, "vessels": 4, "perfusion": 7, "valves": 16, "coronary": 13, "measure": 19, "method": 9, "safety": 15, "evidence": 22, "record": 22}, "originalCount": 5, "source": {"bookPages": 10, "printedPages": "56–65", "pptPages": 31, "presentationKind": "pptx-static"}, "pptText": {"1": "探討活動 \n2-1\n 心臟的觀察\n前言\n　　西元 \n2\n 世紀，\n希臘\n醫師\n加倫\n解剖許多動物的心臟，認為心臟在舒張時吸收血液，動脈收縮才將血液送出心臟，此論點影響\n歐洲\n千年之久，直到 \n1628\n 年才由\n英國\n醫師\n哈維\n確認心臟收縮是推動血液循環的原動力。\n1\n配合課本 \nP56", "2": "探討活動 \n2-1\n 心臟的觀察\n       現在我們已清楚心臟由心肌構成，而推動血液循環的原動力主要是透過其週期性收縮與舒張。　\n       心臟是如何推動單向血流循環的呢？心臟具有哪些特別的構造？又具有何生理意義？\n2\n配合課本 \nP56", "3": "探討活動 \n2-1\n 心臟的觀察\n目的\n　　本活動目的在探究豬心的外部形態與內部構造，進而推論心臟的結構如何確保血液單向流動，並提供血液運行的適當動力。\n3\n配合課本 \nP56", "4": "探討活動 \n2-1\n 心臟的觀察\n原理\n◆ 透過心臟的解剖觀察，探究心臟如何推動單向的血液循環\n◇ 藉由自上大靜脈與肺動脈注水的方式，觀察血液在不同血管的流向\n◇ 解剖時觀察血管與心臟間、心房與心室間的構造，可知是否有影響液體流動的構造，並透過觀察如瓣膜構造與腱索的相對位置等，了解血液的單向流動方式\n◇ 心臟表面遍布血管，但因大部分的血管埋在肌肉中無法直接觀察到，因此可藉由插入深色塑膠軟管或注射黑色溶液等方式，觀察心臟表面血管的分布與血液流向\n4\n配合課本 \nP56", "5": "探討活動 \n2-1\n 心臟的觀察\n器材\n每組使用\n實驗手套\n1\n 雙\n深色塑膠軟管（直徑約 \n2\n \nmm\n）或粗釣魚線（\n7\n 號或 \n8\n 號）\n20\n \ncm\n滴管或注射針筒\n1\n 支\n解剖盤\n1\n 個\n解剖用具\n1\n 組\n新鮮的豬心\n1\n 顆\n黑色食用色素溶液（或黑色鋼筆墨水）\n適量\n5\n配合課本 \nP56", "6": "探討活動 \n2-1\n 心臟的觀察\n活動一 豬心外部形態的觀察\n1\n將豬心清洗乾淨後放在解剖盤上。豬心的大小、形態與人體的心臟十分相似，對照右圖，分辨心臟的左右側、心房與心室。觸摸及按壓心房與心室，感覺有什麼不同？何者的肌肉層較厚？\n註\n以下心臟示意圖皆為人類的心臟，以便與豬心做對比。\n左心房\n左心室\n右心房\n右心室\n6\n配合課本 \nP57\n步驟", "7": "探討活動 \n2-1\n 心臟的觀察\n觸摸並比較左心室與右心室，何者的肌肉層較厚？為什麼？試著判斷及分辨心臟的腹面與背面。\n2\n腹面觀\n背面觀\n活動一 豬心外部形態的觀察\n7\n配合課本 \nP57", "8": "探討活動 \n2-1\n 心臟的觀察\n找找看連結心臟的血管以及心臟表面分布的血管，辨識主動脈、上大靜脈、下大靜脈、肺動脈與肺靜脈各位於何處，說明判斷的理由，並比較動脈與靜脈的管壁厚度。\n3\n活動一 豬心外部形態的觀察\n肺動脈\n主動脈\n上大靜脈\n肺靜脈\n下大靜脈\n8\n配合課本 \nP58", "9": "探討活動 \n2-1\n 心臟的觀察\n1. \n請整理並量化你所觀察到的心房與心室之肌肉壁厚度，比較各組紀錄結果，並討論其功能的差異。\n討論\n活動一 豬心外部形態的觀察\n9\n配合課本 \nP59", "10": "探討活動 \n2-1\n 心臟的觀察\n活動一 豬心外部形態的觀察\n心室在心房的下方，且心室舒張時的低壓也有助於血液由心房流入心室，因此心房的肌肉壁很薄。心室必須將血液送離開心臟，完成特定的循環路徑再流回心臟，路程較遠，需要較大的壓力，因此心室肌肉壁的厚度遠大於心房。\n答\n：\n10\n左心房\n左心室\n右心房\n右心室\n肌肉\n壁厚度\n薄\n（約 \n3\n～\n8 mm\n）\n最厚\n（約 \n22\n～\n26 mm\n）\n薄\n（約 \n3\n～\n8 mm\n）\n厚\n（約 \n5\n～\n9 mm\n）\n功　能\n接受來自肺靜脈的血液\n將血液泵入主動脈\n接受來自上、下大靜脈的血液\n將血液泵入肺動脈\n配合課本 \nP59", "11": "探討活動 \n2-1\n 心臟的觀察\n活動\n二\n 豬心\n內部血液流向\n的觀察\n將豬心的上大靜脈接在水龍頭下方後壓緊，並將連接右心房的其他靜脈用手指捏住，打開水龍頭（注意調小水流量，以免水花飛濺）觀察水最後會從哪一條血管流出來？這條血管的名稱為何？\n1\n灌水\n上大靜脈\n主動脈\n肺動脈\n11\n配合課本 \nP59", "12": "探討活動 \n2-1\n 心臟的觀察\n活動\n二\n 豬心\n內部血液流向\n的觀察\n同步驟 \n1\n，改由肺動脈灌水進入右心室，觀察水是否會從連接右心房的靜脈流出來？\n2\n上大靜脈\n主動脈\n肺動脈\n灌水\n12\n配合課本 \nP59", "13": "探討活動 \n2-1\n 心臟的觀察\n活動\n二\n 豬心\n內部血液流向\n的觀察\n1. \n根據觀察結果，由肺動脈灌水入右心室，水會從連接右心房的靜脈流出來嗎？為什麼？\n討論\n答\n：\n(1) \n不會。\n(2) \n因心室與動脈間有瓣膜阻擋，血液（水流）流動方向應為肺動脈→肺→肺靜脈→左心房。\n13\n配合課本 \nP59", "14": "探討活動 \n2-1\n 心臟的觀察\n活動三 豬心\n內部構造\n的觀察\n從主動脈及肺動脈的管腔上方俯視，可看見與心臟交接處的瓣膜，稱為半月瓣。觀察主動脈與肺動脈靠近半月瓣附近，何者可以看見兩個開口？\n1\n主動脈基部的瓣膜\n靠近半月瓣附近可以看見兩個開口（箭頭所指處）\n14\n配合課本 \nP60\n肺動脈基部的瓣膜", "15": "探討活動 \n2-1\n 心臟的觀察\n活動三 豬心\n內部構造\n的觀察\n從主動脈或肺動脈向下剪開動脈壁，注意不要剪到瓣膜，直到露出全部的半月瓣。觀察半月瓣的形態與數量，並注意開口與半月瓣的相對位置。從形態想一想，此處的瓣膜為何會稱為半月瓣？\n2\n15\n配合課本 \nP61", "16": "探討活動 \n2-1\n 心臟的觀察\n活動三 豬心\n內部構造\n的觀察\n取一段直徑 \n2 mm \n的深色塑膠管（或粗釣魚線）插入步驟 \n1 \n觀察到的兩個開口中，觀察管線會通到何處？也可用注射針筒或滴管吸取黑色食用色素溶液（或黑色鋼筆墨水）注入開口，觀察黑色溶液會流到何處。\n3\n16\n配合課本 \nP61", "17": "探討活動 \n2-1\n 心臟的觀察\n活動三 豬心\n內部構造\n的觀察\n17\n配合課本 \nP61\n利用深色塑膠管插入開口中，觀察開口會通往何處。", "18": "探討活動 \n2-1\n 心臟的觀察\n活動三 豬心\n內部構造\n的觀察\n18\n配合課本 \nP61\n利用注射針筒或滴管將黑色溶液注入開口之中，觀察黑色溶液的分布。", "19": "探討活動 \n2-1\n 心臟的觀察\n活動三 豬心\n內部構造\n的觀察\n步驟 \n1 \n中觀察到的兩個開口連接左、右冠狀動脈，自冠狀動脈延伸分支成小動脈，再形成心臟微血管網，最後匯聚成許多條小靜脈。大多數小靜脈的血液會注入位於心臟背面、心房與心室間一條最大的靜脈中，稱為冠狀竇。剪開冠狀竇，找找看冠狀竇最後注入何處？\n4\n19\n配合課本 \nP62", "20": "探討活動 \n2-1\n 心臟的觀察\n活動三 豬心\n內部構造\n的觀察\n左冠狀動脈\n主動脈\n肺動脈\n左心室\n上大靜脈\n右心房\n右冠狀動脈\n右心室\n主動脈\n肺動脈\n肺靜脈\n左心室\n上大靜脈\n下大靜脈\n右心房\n冠狀竇\n右心室\n20\n(a)\n(b)\n配合課本 \nP62\n心臟表面的血管。\n(a)\n由腹面可觀察到左、右冠狀動脈；\n(b)\n由背面可觀察到冠狀竇。", "21": "探討活動 \n2-1\n 心臟的觀察\n活動三 豬心\n內部構造\n的觀察\n21\n配合課本 \nP62\n剪開冠狀竇，可觀察到許多小靜脈的開口。\n由右心房內側觀察，可見冠狀竇開口位於下大靜脈旁。\n上大靜脈開口\n下\n大靜脈開口\n冠狀竇\n開口", "22": "探討活動 \n2-1\n 心臟的觀察\n活動三 豬心\n內部構造\n的觀察\n5\n用手摸摸心室中膈處（左心室肌肉較厚較硬、右心室肌肉較軟），沿著心室中膈靠右心室邊緣剪開或切開右心室壁。（下頁圖中黑色箭頭表示剪開或切開的方向，數字 \n1\n～\n3 \n表示順序，虛線為掀開心室壁處）\n註\n注意不要切在中膈處。\n22\n配合課本 \nP63", "23": "探討活動 \n2-1\n 心臟的觀察\n活動三 豬心\n內部構造\n的觀察\n心室中膈\n三尖瓣\n右心房\n上大靜脈\n下大靜脈\n主動脈\n肺動脈\n左心房\n半月瓣\n左心室\n起點\n1\n2\n3\n往上掀開\n23\n配合課本 \nP63", "24": "探討活動 \n2-1\n 心臟的觀察\n活動三 豬心\n內部構造\n的觀察\n掀開右心室，觀察心室內壁是否光滑？左、右心室是否相通？觀察右心室與右心房相接處的瓣膜（箭頭所指處），此處瓣膜共有幾片？瓣膜是否有條狀構造與心室內壁突出的肌肉連接？\n6\n右心室內壁\n24\n配合課本 \nP63", "25": "探討活動 \n2-1\n 心臟的觀察\n活動三 豬心\n內部構造\n的觀察\n從右心房的側邊剪開右心房，觀察心房與心室肌肉壁的厚度是否有差異？\n7\n右心室壁\n右心房壁\n25\n配合課本 \nP64", "26": "探討活動 \n2-1\n 心臟的觀察\n活動三 豬心\n內部構造\n的觀察\n參考\n右\n圖，橫向剪開左心室。（圖中黑色箭頭表示剪開或切開的方向，數字 \n1\n～\n2\n 表示順序，虛線為掀開心室壁處）\n8\n二尖瓣\n半月瓣\n主動脈\n肺動脈\n肺靜脈\n左心房\n1\n2\n起點\n往下掀開\n26\n配合課本 \nP64", "27": "探討活動 \n2-1\n 心臟的觀察\n活動三 豬心\n內部構造\n的觀察\n掀開左心室，觀察心室內壁是否光滑？並比較左、右心室肌肉壁的厚度。左心室與左心房交界處的瓣膜共有幾片？\n9\n右心室壁\n左心室壁\n27\n配合課本 \nP65", "28": "探討活動 \n2-1\n 心臟的觀察\n活動三 豬心\n內部構造\n的觀察\n10\n沿著心房邊緣剪開左心房，觀察肺靜脈在左心房的入口共有幾個？\n28\n配合課本 \nP65", "29": "探討活動 \n2-1\n 心臟的觀察\n活動三 豬心\n內部構造\n的觀察\n討論\n心臟供給全身血液，但心臟本身的血液由哪些血管供應？心臟表面分布許多細小的動脈與靜脈，試著找到並列出這些動靜脈的血液由哪裡來？\n29\n配合課本 \nP65\n答\n：\n(1)\n心臟本身的血液由冠狀動脈供應。\n(2)\n心臟表面的動、靜脈中血液由冠狀循環而來，路徑如下\n：\n右心房\n冠狀\n動脈\n小動脈\n心臟\n微血管\n小靜脈\n冠狀竇\n 主動脈\n（基部\n）", "30": "探討活動 \n2-1\n 心臟的觀察\n活動三 豬心\n內部構造\n的觀察\n2. \n試探討心臟在結構上有何特色，使血液單向流動，並提供血液運行的適當動力。\n答\n：\n心臟分為左、右心室與左、右心房，在心房與心室之間以及心室與動脈之間具有瓣膜，可防止血液逆流，維持血液單向流動；心臟主要由心肌構成，且表面遍布血管，具有專屬的循環系統（冠狀循環）供應心肌養分，使其可如同幫浦一般不斷收縮、舒張，以推動血液流動。\n30\n配合課本 \nP65", "31": "探討活動 \n2-1\n 心臟的觀察\n活動三 豬心\n內部構造\n的觀察\n3. \n根據觀察，左、右心房與左、右心室間是否相通？若相通，在動物體身上會產生何種症狀或現象？\n答\n：\n左心都是充氧血，右心都是減氧血，彼此完全不相通。若相通，會造成充氧血與減氧血混合，而降低氣體運輸效能及氣體交換的效率。\n31\n配合課本 \nP65"}, "sourceCorrections": [{"ppt": [9, 10], "note": "頁碼對照：量測討論實際位在課本P58；原PPT標P59。表內數值為教材參考，非本組實測。"}, {"ppt": [13], "note": "科學補充：逆向灌水受肺動脈瓣阻擋，不能先假定水已進入右室；原文肺動脈→肺→肺靜脈→左房描述活體正常路徑，並非離體豬心的水流去向。"}, {"ppt": [31], "note": "範圍補充：中膈缺損的分流受壓差與大小等條件影響，常見左向右分流可增加肺循環負荷，並非一律立即發紺；此活動不作疾病診斷。"}], "originalPPTQuestions": {}};

for(const id of ['l-prev','fs-prev'])el(id).onclick=()=>LI>0&&showLearn(LI-1);for(const id of ['l-next','fs-next'])el(id).onclick=()=>LI<LEARN.length-1&&showLearn(LI+1);
el('related-slide').onclick=()=>openShow(DECK.findIndex(d=>d[1]===+(LEARN[LI].slide||1)));
el('hint-toggle').setAttribute('aria-haspopup','dialog');el('hint-toggle').onclick=()=>{el('hint-toggle').setAttribute('aria-expanded','true');const d=openDialog('思考提示',`<p>${esc(STAGES[QI].hint)}</p>`);d.addEventListener('close',()=>el('hint-toggle').setAttribute('aria-expanded','false'),{once:true});};el('reference-btn').onclick=()=>openReferences(STAGES[QI]);el('question-learn').onclick=()=>{returnQuestion=true;navigate('learn',STAGES[QI].learn)};el('q-jump').onchange=e=>showQuestion(+e.target.value);el('prev-btn').onclick=()=>QI>0&&showQuestion(QI-1);el('skip-btn').onclick=()=>QI<STAGES.length-1?showQuestion(QI+1):navigate('done');el('check-btn').onclick=check;el('reset-btn').onclick=resetQuestion;el('finish-btn').onclick=()=>navigate('done');
el('shsel').innerHTML=[...new Set(DECK.map(d=>d[1]))].map(n=>`<option value="${n}">PPT第${n}頁 · ${esc(DECK.find(d=>d[1]===n)[2].slice(0,22))}</option>`).join('');el('shsel').onchange=e=>{showStopPlay();SI=DECK.findIndex(d=>d[1]===+e.target.value);showRender();};el('shprev').onclick=()=>showStep(-1);el('shnext').onclick=()=>showStep(1);el('shplay').onclick=()=>{if(SPLAY)showStopPlay();else{if(SI===DECK.length-1)SI=0;showRender();SPLAY=setInterval(()=>{if(SI>=DECK.length-1){showStopPlay();return;}SI++;showRender()},2600);el('shplay').textContent='⏸ 暫停';}};el('shfs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else el('show').requestFullscreen?.().catch(()=>{el('shfs').textContent='此瀏覽器不支援原生全螢幕'})};el('shclose').onclick=()=>navigate('intro');
el('theme-toggle').onclick=()=>{ST.theme=ST.theme==='dark'?'light':'dark';applyPreferences();save();};el('font-toggle').onclick=()=>{ST.font=(ST.font+1)%3;applyPreferences();save();fit();};function applyPreferences(){document.documentElement.dataset.theme=ST.theme;document.documentElement.style.setProperty('--text',[20,22,24][ST.font]+'px');document.documentElement.dataset.font=ST.font;el('theme-toggle').setAttribute('aria-pressed',String(ST.theme==='dark'));el('font-toggle').title='文字大小 '+[20,22,24][ST.font]+'px';}
document.addEventListener('fullscreenchange',fullscreenSync);document.addEventListener('keydown',e=>{if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(document.querySelector('dialog[open]'))return;const fs=document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation');if(fs){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();if(LI>0)showLearn(LI-1);}else if(e.key==='Escape')exitLearnFullscreen();return;}if(PAGE==='show'){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();showStep(1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();showStep(-1);}else if(e.key==='Escape')navigate('intro');else if(e.key==='Home'){SI=0;showRender()}else if(e.key==='End'){SI=DECK.length-1;showRender()}return;}if(PAGE==='learn'&&el('flip')){if(e.key==='ArrowRight'){e.preventDefault();flipStop();flipShow(FI+1)}if(e.key==='ArrowLeft'){e.preventDefault();flipStop();flipShow(FI-1)}}});
el('learn-stage').addEventListener('contextmenu',e=>{if(document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation')){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1)}});
window.addEventListener('resize',fit);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){flipStop();showStopPlay();save();}});new ResizeObserver(fit).observe(el('bar'));
el('slide-text').onclick=()=>{const page=DECK[SI][1];openDialog('原PPT第'+page+'頁原文',`${CONTENT.sourceCorrections.filter(x=>x.ppt.includes(page)).map(x=>'<div class="scope-note">'+esc(x.note)+'</div>').join('')}<p>${esc(CONTENT.pptText[page])}</p>`);};el('hero-image').src=IMG['p3_lab_great_vessels'];el('video-external').href=typeof VIDEO_VIEW_URL!=='undefined'?VIDEO_VIEW_URL:VIDEO_SRC;applyPreferences();const start=['learn','play','done'].includes(ST.page)?ST.page:'intro';navigate(start);if(!saving)storageNotice();
</script></body></html>

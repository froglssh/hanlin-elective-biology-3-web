": [["step_002", "P86完整課本頁"], ["step_003", "P87完整課本頁"]]}, {"id": "b3-a31-l05", "t": "輸尿管探查：可達深處的界線", "sec": "s1", "slide": 7, "sourceSlides": [7], "sourcePages": [2], "src": "課本P86；PPT 7", "figSpec": {"image": "p1_kidney_gross_anatomy"}, "txt": "<h3>觀察與推論</h3><ul><li>依教師示範以鈍頭工具輕探輸尿管，遇阻即停，不能穿破組織。</li><li>少量低壓注水可檢查與腎盂的連通，先留意漏水、殘端與灌入阻力。</li><li>離體逆向注水不等於活體輸尿管蠕動，也不能由無法持續灌水推論腎臟完全密閉。</li></ul><p class=\"thinking\"><strong>想一想</strong> 水從切口漏出，能證明那是正常尿液出口嗎？</p><div class=\"quote\">步　驟<br>將新鮮的腎臟置於解剖盤中，觸摸腎臟的表面，將感覺記錄下來。<br>1<br>以解剖用具將脂肪組織剔除乾淨，觀察腎臟側邊的管狀構造，利用管壁的特性判<br>斷何者為腎動脈、腎靜脈或輸尿管，並說明理由。<br>2<br>以鑷子或塑膠滴管插入輸尿管中，能否通到腎臟深處？改用滴管或去除針頭的注<br>射針筒將水從輸尿管注入，能否不斷的灌水？<br>e： 注意操作時不可太過用力而插破組織。<br>3<br>活動一<br>豬腎臟的觀察<br>86　選修生物 Ⅲ (全)<br><small>課本P86完整抽取原文；圖中文字與尺度以原圖為準</small></div><div class=\"quote\">探討活動 <br>3-<br>1 <br>腎臟<br>的觀察<br>活動一 豬腎臟的觀察<br>以鑷子或塑膠滴管插入輸尿管中，能否通到腎臟深處？改用滴管或去除針頭的注射針筒將水從輸尿管注入，能否不斷的灌水？<br>3<br>註<br>注意操作時不可太過用力而插破組織。<br>7<br>配合課本 <br>P86<small>原PPT第7頁完整抽取原文；補充說明見教學重點</small></div>", "tb": [["step_002", "P86完整課本頁"]]}, {"id": "b3-a31-l06", "t": "動脈注墨：追蹤血管分布", "sec": "s2", "slide": 8, "sourceSlides": [8], "sourcePages": [3], "src": "課本P87；PPT 8", "figSpec": {"image": "p2_coronal_section"}, "txt": "<h3>觀察與推論</h3><ul><li>確認腎動脈後，低壓緩慢注入課本指定深色溶液，按示範固定接口。</li><li>比較注入前後表面與剖面的黑色分布，記錄入口、注入量及漏出位置。</li><li>染黑支持灌流到達的區段；深淺還受溶液、壓力、破損與阻塞影響，不能換算血流百分比。</li></ul><p class=\"thinking\"><strong>想一想</strong> 同樣的皮質黑斑，能直接證明90%的血流到皮質嗎？</p><div class=\"quote\">將腎臟從腎門對邊處縱向對切，觀察黑色液體的分布。腎臟切開後，可看到明顯<br>分為內、外兩層，分別是髓質與皮質；中央為中空構造，稱為腎盂。觀察皮質與<br>髓質是否皆有黑色溶液分布。<br>5<br>腎動脈<br>腎靜脈<br>輸尿管<br>（組成髓質）<br>腎錐體<br>皮質<br>髓質<br>腎盂<br>利用注射針筒，將黑色食用色素溶液（或黑色鋼筆墨水）注入腎動脈中，觀察腎<br>臟表面有何變化？參考圖 3－6，這些被墨水染色的構造可能是什麼？<br>e： 可利用橡皮筋或縫衣線將動脈綁緊，以防黑色食用色素溶液（或黑色鋼筆<br>墨水）溢出。<br>4<br>第 3 章  呼吸與排泄　87<br><small>課本P87完整抽取原文；圖中文字與尺度以原圖為準</small></div><div class=\"quote\">探討活動 <br>3-<br>1 <br>腎臟<br>的觀察<br>活動一 豬腎臟的觀察<br>利用注射針筒，將黑色食用色素溶液（或黑色鋼筆墨水）注入腎動脈中，觀察腎臟表面有何變化？參考圖 <br>3<br>－<br>6<br>，這些被墨水染色的構造可能是<br>什麼？<br>4<br>註<br>可利用橡皮筋或縫衣線將動脈綁緊，以防黑色食用色素溶液（或黑色鋼筆墨水）溢出。<br>8<br>配合課本 <br>P87<small>原PPT第8頁完整抽取原文；補充說明見教學重點</small></div>", "tb": [["step_003", "P87完整課本頁"]]}, {"id": "b3-a31-l07", "t": "縱切剖面：皮質、髓質與腎盂", "sec": "s2", "slide": 9, "sourceSlides": [9], "sourcePages": [3], "src": "課本P87；PPT 9", "figSpec": {"image": "renal_diagram"}, "txt": "<h3>觀察與推論</h3><ul><li>依課本由腎門對邊縱向對切，固定標本並控制刀向。</li><li>外側皮質、內側髓質與中央腎盂需用位置、紋理和連通共同辨認。</li><li>腎盂是收集尿液的空腔；腎竇中的白色脂肪不全是腎盂，不能只靠白色命名。</li></ul><p class=\"thinking\"><strong>想一想</strong> 怎樣用連通到輸尿管來補強腎盂判定？</p><div class=\"quote\">將腎臟從腎門對邊處縱向對切，觀察黑色液體的分布。腎臟切開後，可看到明顯<br>分為內、外兩層，分別是髓質與皮質；中央為中空構造，稱為腎盂。觀察皮質與<br>髓質是否皆有黑色溶液分布。<br>5<br>腎動脈<br>腎靜脈<br>輸尿管<br>（組成髓質）<br>腎錐體<br>皮質<br>髓質<br>腎盂<br>利用注射針筒，將黑色食用色素溶液（或黑色鋼筆墨水）注入腎動脈中，觀察腎<br>臟表面有何變化？參考圖 3－6，這些被墨水染色的構造可能是什麼？<br>e： 可利用橡皮筋或縫衣線將動脈綁緊，以防黑色食用色素溶液（或黑色鋼筆<br>墨水）溢出。<br>4<br>第 3 章  呼吸與排泄　87<br><small>課本P87完整抽取原文；圖中文字與尺度以原圖為準</small></div><div class=\"quote\">探討活動 <br>3-<br>1 <br>腎臟<br>的觀察<br>活動一 豬腎臟的觀察<br>將腎臟從腎門對邊處縱向對切，觀察黑色液體的分布。腎臟切開後，可看到明顯分為內、外兩層，分別是髓質與皮質；中央為中空構造，稱為腎盂。觀察皮質與髓質是否皆有黑色溶液分布。<br>5<br>髓質<br>腎錐體<br>（ 組成髓質 ）<br>腎盂<br>皮質<br>腎動脈<br>腎靜脈<br>輸尿管<br>9<br>配合課本 <br>P87<small>原PPT第9頁完整抽取原文；補充說明見教學重點</small></div>", "tb": [["step_003", "P87完整課本頁"]]}, {"id": "b3-a31-l08", "t": "腎錐體條紋：大體線索與微觀限制", "sec": "s2", "slide": 10, "sourceSlides": [10], "sourcePages": [4], "src": "課本P88；PPT 10", "figSpec": {"image": "p3_tissue_sectioning"}, "txt": "<h3>觀察與推論</h3><ul><li>腎錐體組成髓質，尖端腎乳頭朝向尿液收集腔。</li><li>放大鏡可見直線條紋；平行管道與血管排列是其構造基礎。</li><li>單憑白色細紋，不能逐條鑑定成亨耳環、集尿管或直血管，需顯微證據。</li></ul><p class=\"thinking\"><strong>想一想</strong> 哪些構造肉眼可見，哪些只能由顯微觀察補充？</p><div class=\"quote\">參考步驟 5 圖示，觀察髓質中是否有許多錐狀構造？此即為腎錐體。以放大鏡觀<br>察腎錐體，是否有許多直線形的白色細小紋路？<br>6<br> 以高倍顯微鏡觀察<br>選擇腎臟外層被染成黑色的部位，利用解剖刀切取約 2 cm×1 cm 的腎臟組織，<br>並以餐巾紙或擦手紙包裹，夾在兩片載玻片中間，再以刀片切取薄片後置於載玻<br>片上，以滴管滴一滴清水後蓋上蓋玻片，置於顯微鏡下進行觀察。<br>7<br>2cm<br>1cm<br>刀片<br>餐巾紙包裹組織<br>載玻片<br>88　選修生物 Ⅲ (全)<br><small>課本P88完整抽取原文；圖中文字與尺度以原圖為準</small></div><div class=\"quote\">探討活動 <br>3-<br>1 <br>腎臟<br>的觀察<br>活動一 豬腎臟的觀察<br>參考步驟 <br>5 <br>圖示，觀察髓質中是否有許多錐狀構造？此即為腎錐體。以放大鏡觀察腎錐體，是否有許多直線形的白色細小紋路？<br>6<br>10<br>配合課本 <br>P88<small>原PPT第10頁完整抽取原文；補充說明見教學重點</small></div>", "tb": [["step_004", "P88完整課本頁"]]}, {"id": "b3-a31-l09", "t": "徒手薄切：保留尺寸與切片品質", "sec": "s2", "slide": 11, "sourceSlides": [11, 12, 13], "sourcePages": [4], "src": "課本P88；PPT 11、12、13", "figSpec": {"image": "p3_tissue_sectioning"}, "txt": "<h3>觀察與推論</h3><ul><li>取皮質染黑處約2 cm×1 cm組織塊，以紙包裹並夾在兩片載玻片間。</li><li>由教師示範使用單面刀片切薄片，滴清水、蓋蓋玻片，避免氣泡與重疊。</li><li>2 cm×1 cm是取材塊平面大小，不是切片厚度；以透光與可辨性評估，不宣稱徒手達固定微米厚度。</li></ul><p class=\"thinking\"><strong>想一想</strong> 切片不透光時，要先處理厚度、重疊還是直接升高倍率？</p><div class=\"quote\">參考步驟 5 圖示，觀察髓質中是否有許多錐狀構造？此即為腎錐體。以放大鏡觀<br>察腎錐體，是否有許多直線形的白色細小紋路？<br>6<br> 以高倍顯微鏡觀察<br>選擇腎臟外層被染成黑色的部位，利用解剖刀切取約 2 cm×1 cm 的腎臟組織，<br>並以餐巾紙或擦手紙包裹，夾在兩片載玻片中間，再以刀片切取薄片後置於載玻<br>片上，以滴管滴一滴清水後蓋上蓋玻片，置於顯微鏡下進行觀察。<br>7<br>2cm<br>1cm<br>刀片<br>餐巾紙包裹組織<br>載玻片<br>88　選修生物 Ⅲ (全)<br><small>課本P88完整抽取原文；圖中文字與尺度以原圖為準</small></div><div class=\"quote\">探討活動 <br>3-<br>1 <br>腎臟<br>的觀察<br>活動一 豬腎臟的觀察<br>7<br>選擇腎臟外層被染成黑色的部位，利用解剖刀切取約 <br>2 cm× 1 cm <br>的腎臟組織，並以餐巾紙或擦手紙包裹，夾在兩片載玻片中間，再以刀片切取薄片後置於載玻片上，以滴管滴一滴清水後蓋上蓋玻片，置於顯微鏡下進行觀察。<br>11<br>配合課本 <br>P88<small>原PPT第11頁完整抽取原文；補充說明見教學重點</small></div><div class=\"quote\">探討活動 <br>3-<br>1 <br>腎臟<br>的觀察<br>活動一 豬腎臟的觀察<br>2cm<br>1cm<br>載玻片<br>餐巾紙包裹組織<br>刀片<br>配合課本 <br>P88<br>12<small>原PPT第12頁完整抽取原文；補充說明見教學重點</small></div><div class=\"quote\">探討活動 <br>3-<br>1 <br>腎臟<br>的觀察<br>活動一 豬腎臟的觀察<br>13<br>配合課本 <br>P88<br>以高倍顯微鏡觀察<small>原PPT第13頁完整抽取原文；補充說明見教學重點</small></div>", "tb": [["step_004", "P88完整課本頁"]]}, {"id": "b3-a31-l10", "t": "新鮮鏡檢：黑團與周圍管網", "sec": "s2", "slide": 14, "sourceSlides": [14, 15], "sourcePages": [5], "src": "課本P89；PPT 14、15", "figSpec": {"image": "p4_glomerulus_fresh"}, "txt": "<h3>觀察與推論</h3><ul><li>先低倍尋找較薄透光部位，再切換高倍微調焦；記錄目鏡、物鏡與尺度。</li><li>皮質中染黑的團狀構造可與絲球體微血管團比對，附近可見血管網。</li><li>墨水團、組織重疊與沉澱需比較形態；一張黑團照片不能證明整個腎元功能正常。</li></ul><p class=\"thinking\"><strong>想一想</strong> 你會用位置、大小與連續管網中的哪些證據辨認絲球體？</p><div class=\"quote\">尋找黑色團狀構造，注意大小或形態有什麼明顯差異。參考圖 3－6，這些被黑<br>色溶液染色的團狀構造是什麼？觀察並繪圖記錄黑色構造的形態，並注意是否可<br>觀察到管狀構造？<br>8<br>討　論<br>1  本活動可清楚觀察到腎臟的外觀與構造，根據腎臟的構造，請問尿液最後經由腎<br>臟的哪一個部位流入輸尿管？共有幾條管狀構造進出腎門？這些管狀構造的名稱<br>及功能為何？如何分辨其差異？<br>2  根據步驟 8 的腎臟皮質切片觀察，在動脈注射黑色溶液後會出現許多團狀構造，<br>團狀構造附近可觀察到黑色的網狀構造，這些構造可能為何種血管？根據液體會<br>由壓力大往壓力小的方向流動，由此推論血液的流動方向可能為何？<br>40 μm<br>100 μm<br>40 μm<br>第 3 章  呼吸與排泄　89<br><small>課本P89完整抽取原文；圖中文字與尺度以原圖為準</small></div><div class=\"quote\">探討活動 <br>3-<br>1 <br>腎臟<br>的觀察<br>活動一 豬腎臟的觀察<br>8<br>尋找黑色團狀構造，注意大小或形態有什麼明顯差異。參考圖 <br><br>3<br>－<br>6<br>，這些被黑色溶液染色的團狀構造是什麼？觀察並繪圖記錄黑色構造的形態，並注意是否可觀察到管狀構造？<br>14<br>配合課本 <br>P89<small>原PPT第14頁完整抽取原文；補充說明見教學重點</small></div><div class=\"quote\">探討活動 <br>3-<br>1 <br>腎臟<br>的觀察<br>活動一 豬腎臟的觀察<br>15<br>配合課本 <br>P89<br>100<br> <br>µm<br>40<br> <br>µm<br>40<br> <br>µm<small>原PPT第15頁完整抽取原文；補充說明見教學重點</small></div>", "tb": [["step_005", "P89完整課本頁"]]}, {"id": "b3-a31-l11", "t": "血液路徑：絲球體前後都是小動脈", "sec": "s2", "slide": 17, "sourceSlides": [17], "sourcePages": [5], "src": "課本P89；PPT 17", "figSpec": {"image": "p4_glomerulus_fresh"}, "txt": "<h3>觀察與推論</h3><ul><li>概念路徑：腎動脈分支→入球小動脈→絲球體→出球小動脈。</li><li>出球後形成管周微血管或與近髓質腎元相關的直血管，最後回腎靜脈。</li><li>功能上的方向結合解剖與壓差知識推論；靜態染色圖不能單獨測得流速、壓力或完整連續路徑。</li></ul><p class=\"thinking\"><strong>想一想</strong> 只見兩條染黑細管，如何避免把入口出口猜反？</p><div class=\"quote\">尋找黑色團狀構造，注意大小或形態有什麼明顯差異。參考圖 3－6，這些被黑<br>色溶液染色的團狀構造是什麼？觀察並繪圖記錄黑色構造的形態，並注意是否可<br>觀察到管狀構造？<br>8<br>討　論<br>1  本活動可清楚觀察到腎臟的外觀與構造，根據腎臟的構造，請問尿液最後經由腎<br>臟的哪一個部位流入輸尿管？共有幾條管狀構造進出腎門？這些管狀構造的名稱<br>及功能為何？如何分辨其差異？<br>2  根據步驟 8 的腎臟皮質切片觀察，在動脈注射黑色溶液後會出現許多團狀構造，<br>團狀構造附近可觀察到黑色的網狀構造，這些構造可能為何種血管？根據液體會<br>由壓力大往壓力小的方向流動，由此推論血液的流動方向可能為何？<br>40 μm<br>100 μm<br>40 μm<br>第 3 章  呼吸與排泄　89<br><small>課本P89完整抽取原文；圖中文字與尺度以原圖為準</small></div><div class=\"quote\">探討活動 <br>3-<br>1 <br>腎臟<br>的觀察<br>活動一 豬腎臟的觀察<br>2. <br>根據步驟 <br>8 <br>的腎臟皮質切片觀察，在動脈注射黑色溶液後會出現許多團狀構造，團狀構造附近可觀察到黑色的網狀構造，這些構造可能為何種血管？根據液體會由壓力大往壓力小的方向流動，由此推論血液的流動方向可能為何？<br>答<br>：<br>(1<br>)<br> <br>① 團狀構造<br>：<br>可能是絲球體。<br>② 黑色的網狀<br>構造<br>：<br>可能<br>是入球小動脈、出球小動脈，或是周圍微血管網染黑顯現的網狀分布。<br>(2) <br>血液流動<br>方向<br>為<br>：<br>腎<br>小動脈→入球小動脈→絲球體→出球小動脈 <br>→ ① <br>在皮質淺層形成周圍微血管（<br>peritubular<br> capillaries<br>）、② 深入髓質形成直血管（<br>vasa recta<br>）→腎小靜脈→腎靜脈。<br>17<br>配合課本 <br>P89<small>原PPT第17頁完整抽取原文；補充說明見教學重點</small></div>", "tb": [["step_005", "P89完整課本頁"]]}, {"id": "b3-a31-l12", "t": "尿液路徑：與血液通路分開", "sec": "s2", "slide": 16, "sourceSlides": [16], "sourcePages": [5], "src": "課本P89；PPT 16", "figSpec": {"image": "renal_diagram"}, "txt": "<h3>觀察與推論</h3><ul><li>濾液先進鮑氏囊腔，再經腎小管各段調整，與血管腔不同。</li><li>經集尿管至腎乳頭、腎盞、腎盂，再由輸尿管送往膀胱；腎盞為路徑補充。</li><li>大體觀察可確認腎盂與輸尿管連通，不能看到每一條完整腎元，也不能說腎靜脈運送尿液。</li></ul><p class=\"thinking\"><strong>想一想</strong> 哪一段是可直接觀察，哪一段要靠切片和知識連接？</p><div class=\"quote\">尋找黑色團狀構造，注意大小或形態有什麼明顯差異。參考圖 3－6，這些被黑<br>色溶液染色的團狀構造是什麼？觀察並繪圖記錄黑色構造的形態，並注意是否可<br>觀察到管狀構造？<br>8<br>討　論<br>1  本活動可清楚觀察到腎臟的外觀與構造，根據腎臟的構造，請問尿液最後經由腎<br>臟的哪一個部位流入輸尿管？共有幾條管狀構造進出腎門？這些管狀構造的名稱<br>及功能為何？如何分辨其差異？<br>2  根據步驟 8 的腎臟皮質切片觀察，在動脈注射黑色溶液後會出現許多團狀構造，<br>團狀構造附近可觀察到黑色的網狀構造，這些構造可能為何種血管？根據液體會<br>由壓力大往壓力小的方向流動，由此推論血液的流動方向可能為何？<br>40 μm<br>100 μm<br>40 μm<br>第 3 章  呼吸與排泄　89<br><small>課本P89完整抽取原文；圖中文字與尺度以原圖為準</small></div><div class=\"quote\">探討活動 <br>3-<br>1 <br>腎臟<br>的觀察<br>活動一 豬腎臟的觀察<br>討論<br>1. <br>本活動可清楚觀察到腎臟的外觀與構造，根據腎臟的構造，請問尿液最後經由腎臟的哪一個部位流入輸尿管？共有幾條管狀構造進出腎門？這些管狀構造的名稱及功能為何？如何分辨其差異？<br>答<br>：<br>(1<br>)<br> 尿液<br>最後經由腎盂流入輸尿管。<br>(2<br>)<br> 共有<br>三條管子，分別為輸尿管、腎動脈及腎靜脈。<br>(3<br>)<br> 輸尿管<br>將尿液輸送至膀胱，腎動脈將血液送入腎臟，<br><br>腎靜脈則將過濾後的血液送出。<br>(4<br>)<br> 可<br>藉由管徑粗細、管壁彈性及血管相對位置判斷。<br>16<br>配合課本 <br>P89<small>原PPT第16頁完整抽取原文；補充說明見教學重點</small></div>", "tb": [["step_005", "P89完整課本頁"]]}, {"id": "b3-a31-l13", "t": "永久切片低倍：先找區域", "sec": "s3", "slide": 18, "sourceSlides": [18, 19], "sourcePages": [6], "src": "課本P90；PPT 18、19", "figSpec": {"image": "p5_permanent_slide_low"}, "txt": "<h3>觀察與推論</h3><ul><li>先用低倍定位皮質與髓質，再選典型視野觀察。</li><li>正常腎小體位在皮質；腎小管不同段分布於皮質與髓質。</li><li>單一視野沒有腎小體，不足以證明就是髓質；皮質髓放線也可呈直行管道。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若只有一小塊管道視野，還需要什麼定位證據？</p><div class=\"quote\">皮質<br>髓質<br>皮質<br>髓質<br>1 mm<br>低倍<br>高倍<br>步　驟<br>將腎臟的永久玻片標本置於顯微鏡下，先用低倍鏡觀察 : "s4", "slide": 25, "sourceSlides": [25], "sourcePages": [5, 8], "src": "課本P89、92；PPT 25", "figSpec": {"pair": ["p4_glomerulus_fresh", "p5_permanent_slide_low"]}, "txt": "<h3>觀察與推論</h3><ul><li>新鮮切片以灌流血管較醒目；永久切片較薄且經製片染色，管壁更容易分辨。</li><li>新鮮材料的邊緣可能看見透明腎小管，是否可見受厚度、重疊與對比影響。</li><li>未染黑不等於不存在，也不能證明濾過屏障完整；溶液成分、破損與漏染都需考慮。</li></ul><p class=\"thinking\"><strong>想一想</strong> 如果換成可溶性色素，能直接沿用墨水顆粒的推論嗎？</p><div class=\"quote\">尋找黑色團狀構造，注意大小或形態有什麼明顯差異。參考圖 3－6，這些被黑<br>色溶液染色的團狀構造是什麼？觀察並繪圖記錄黑色構造的形態，並注意是否可<br>觀察到管狀構造？<br>8<br>討　論<br>1  本活動可清楚觀察到腎臟的外觀與構造，根據腎臟的構造，請問尿液最後經由腎<br>臟的哪一個部位流入輸尿管？共有幾條管狀構造進出腎門？這些管狀構造的名稱<br>及功能為何？如何分辨其差異？<br>2  根據步驟 8 的腎臟皮質切片觀察，在動脈注射黑色溶液後會出現許多團狀構造，<br>團狀構造附近可觀察到黑色的網狀構造，這些構造可能為何種血管？根據液體會<br>由壓力大往壓力小的方向流動，由此推論血液的流動方向可能為何？<br>40 μm<br>100 μm<br>40 μm<br>第 3 章  呼吸與排泄　89<br><small>課本P89完整抽取原文；圖中文字與尺度以原圖為準</small></div><div class=\"quote\">討　論<br>1  透過活動一可觀察到腎臟區分為皮質和髓質，在活動一觀察到的團狀構造（絲球<br>體）分布在皮質或髓質？而活動二觀察到的管狀構造（腎小管）主要分布在皮質<br>或髓質？<br>2 新鮮切片是否能看到如此活動的管狀構造（腎小管）？為什麼？<br>3  由步驟 3 可觀察到不同形狀的管狀切面，參考下圖圖解想一想，腎臟內部若具有<br>許多管狀構造，這些管狀構造可能的分布形態為何？<br>30 mm<br> a腎小管的顯微切片標本，可與b管狀構造的不同切面示意圖對照。<br>a<br>b<br>92　選修生物 Ⅲ (全)<br><small>課本P92完整抽取原文；圖中文字與尺度以原圖為準</small></div><div class=\"quote\">探討活動 <br>3-<br>1 <br>腎臟<br>的觀察<br>活動<br>二<br> 腎臟中腎元的觀察<br>2. <br>新鮮切片是否能看到如此活動的管狀構造（腎小管）？為什麼？<br>答<br>：<br>(1<br>)<br> <br>視<br>情況，可能可於邊緣較透光處觀察到。<br>(2<br>)<br> <br>注射<br>深色溶液後被染色的部分為血管分布位置，可以觀察到絲球體與微血管網。因操作過程中，深色溶液可能使周圍組織被染色，故腎小管雖並非血流通過處，但在新鮮切片標本的邊緣較透光處，仍可能可以觀察到呈透明狀的腎小管，相較之下不像微血管一樣可被明顯觀察到，因此還需視操作當下的染色或切片情形而定。<br>25<br>配合課本 <br>P92<small>原PPT第25頁完整抽取原文；補充說明見教學重點</small></div>", "tb": [["step_005", "P89完整課本頁"], ["step_008", "P92完整課本頁"]]}, {"id": "b3-a31-l18", "t": "切面幾何：二維如何呈現三維", "sec": "s4", "slide": 26, "sourceSlides": [26, 27], "sourcePages": [8], "src": "課本P92；PPT 26、27", "figSpec": {"image": "section_geometry"}, "txt": "<h3>觀察與推論</h3><ul><li>同一管道橫切可呈圓形，斜切可呈橢圓，縱切可呈長條。</li><li>曲小管在皮質迂迴，髓質部分管段則較直且平行；不是整個腎臟所有管道都纏繞。</li><li>切面形狀還受變形與切向影響，單張照片不能重建完整三維連通，需連續切片。</li></ul><p class=\"thinking\"><strong>想一想 ages": [5, 8], "src": "課本P89、92；PPT 16、17、24、25、27", "figSpec": {"pair": ["renal_diagram", "corpuscle_detail"]}, "txt": "<h3>觀察與推論</h3><ul><li>大體建立區域與尿液出口，灌流提供血管分布線索，顯微觀察辨認腎小體與管道。</li><li>分開血液路徑與濾液路徑，再以構造連結過濾、再吸收和分泌概念。</li><li>本活動未直接測得過濾率、精確灌流比例或葡萄糖回收率，報告不代填這些數據。</li></ul><p class=\"thinking\"><strong>想一想</strong> 哪一項結論最有直接證據，哪一項仍需要功能實驗？</p><div class=\"quote\">尋找黑色團狀構造，注意大小或形態有什麼明顯差異。參考圖 3－6，這些被黑<br>色溶液染色的團狀構造是什麼？觀察並繪圖記錄黑色構造的形態，並注意是否可<br>觀察到管狀構造？<br>8<br>討　論<br>1  本活動可清楚觀察到腎臟的外觀與構造，根據腎臟的構造，請問尿液最後經由腎<br>臟的哪一個部位流入輸尿管？共有幾條管狀構造進出腎門？這些管狀構造的名稱<br>及功能為何？如何分辨其差異？<br>2  根據步驟 8 的腎臟皮質切片觀察，在動脈注射黑色溶液後會出現許多團狀構造，<br>團狀構造附近可觀察到黑色的網狀構造，這些構造可能為何種血管？根據液體會<br>由壓力大往壓力小的方向流動，由此推論血液的流動方向可能為何？<br>40 μm<br>100 μm<br>40 μm<br>第 3 章  呼吸與排泄　89<br><small>課本P89完整抽取原文；圖中文字與尺度以原圖為準</small></div><div class=\"quote\">討　論<br>1  透過活動一可觀察到腎臟區分為皮質和髓質，在活動一觀察到的團狀構造（絲球<br>體）分布在皮質或髓質？而活動二觀察到的管狀構造（腎小管）主要分布在皮質<br>或髓質？<br>2 新鮮切片是否能看到如此活動的管狀構造（腎小管）？為什麼？<br>3  由步驟 3 可觀察到不同形狀的管狀切面，參考下圖圖解想一想，腎臟內部若具有<br>許多管狀構造，這些管狀構造可能的分布形態為何？<br>30 mm<br> a腎小管的顯微切片標本，可與b管狀構造的不同切面示意圖對照。<br>a<br>b<br>92　選修生物 Ⅲ (全)<br><small>課本P92完整抽取原文；圖中文字與尺度以原圖為準</small></div><div class=\"quote\">探討活動 <br>3-<br>1 <br>腎臟<br>的觀察<br>活動一 豬腎臟的觀察<br>討論<br>1. <br>本活動可清楚觀察到腎臟的外觀與構造，根據腎臟的構造，請問尿液最後經由腎臟的哪一個部位流入輸尿管？共有幾條管狀構造進出腎門？這些管狀構造的名稱及功能為何？如何分辨其差異？<br>答<br>：<br>(1<br>)<br> 尿液<br>最後經由腎盂流入輸尿管。<br>(2<br>)<br> 共有<br>三條管子，分別為輸尿管、腎動脈及腎靜脈。<br>(3<br>)<br> 輸尿管<br>將尿液輸送至膀胱，腎動脈將血液送入腎臟，<br><br>腎靜脈則將過濾後的血液送出。<br>(4<br>)<br> 可<br>藉由管徑粗細、管壁彈性及血管相對位置判斷。<br>16<br>配合課本 <br>P89<small>原PPT第16頁完整抽取原文；補充說明見教學重點</small></div><div class=\"quote\">探討活動 <br>3-<br>1 <br>腎臟<br>的觀察<br>活動一 豬腎臟的觀察<br>2. <br>根據步驟 <br>8 <br>的腎臟皮質切片觀察，在動脈注射黑色溶液後會出現許多團狀構造，團狀構造附近可觀察到黑色的網狀構造，這些構造可能為何種血管？根據液體會由壓力大往壓力小的方向流動，由此推論血液的流動方向可能為何？<br>答<br>：<br>(1<br>)<br> <br>① 團狀構造<br>：<br>可能是絲球體。<br>② 黑色的網狀<br>構造<br>：<br>可能<br>是入球小動脈、出球小動脈，或是周圍微血管網染黑顯現的網狀分布。<br>(2) <br>血液流動<br>方向<br>為<br>：<br>腎<br>小動脈→入球小動脈→絲球體→出球小動脈 <br>→ ① <br>在皮質淺層形成周圍微血管（<br>peritubular<br> capillaries<br>）、② 深入髓質形成直血管（<br>vasa recta<br>）→腎小靜脈→腎靜脈。<br>17<br>配合課本 <br>P89<small>原PPT第17頁完整抽取原文；補充說明見教學重點</small></div><div class=\"quote\">探討活動 <br>3-<br>1 <br>腎臟<br>的觀察<br>活動<br>二<br> 腎臟中腎元的觀察<br>討論<br>1. <br>透過活動一可觀察到腎臟區分為皮質和髓質，在活動一觀察到的團狀構造（絲球體）分布在皮質或髓質？而活動二觀察到的管狀構造（腎小管）主要分布在皮質或髓質？<br>答<br>：<br>(1<br>)<br> <br>絲<br>球體位於皮質。<br>(2<br>)<br> <br>腎<br>小管在皮質及髓質內均可看到。<br>24<br>配合課本 <br>P92<small>原PPT第24頁完整抽取原文；補充說明見教學重點</small></div><div class=\"quote\">探討活動 <br>3-<br>1 <br>腎臟<br>的觀察<br>活動<br>二<br> 腎臟中腎元的觀察<br>2. <br>新鮮切片是否能看到如此活動的管狀構造（腎小管）？為什麼？<br>答<br>：<br>(1<br>)<br> <br>視<br>情況，可能可於邊緣較透光處觀察到。<br>(2<br>)<br> <br>注射<br>深色溶液後被染色的部分為血管分布位置，可以觀察到絲球體與微血管網。因操作過程中，深色溶液可能使周圍組織被染色，故腎小管雖並非血流通過處，但在新鮮切片標本的邊緣較透光處，仍可能可以觀察到呈透明狀的腎小管，相較之下不像微血管一樣可被明顯觀察到，因此還需視操作當下的染色或切片情形而定。<br>25<br>配合課本 <br>P92<small>原PPT第25頁完整抽取原文；補充說明見教學重點</small></div><div class=\"quote\">探討活動 <br>3-<br>1 <br>腎臟<br>的觀察<br>活動<br>二<br> 腎臟中腎元的觀察<br>答<br>：<br>由於管狀構造並非整齊排列，或是固定一個方向延伸，而是彎彎曲曲、以立體纏繞的結構分布在腎臟之中，且皮質及髓質皆會出現，因此切片時可能會同時切到不同部位的管子，在顯微鏡下可同時觀察到不同形狀的切面。<br>27<br>配合課本 <br>P92<small>原PPT第27頁完整抽取原文；補充說明見教學重點</small></div>", "tb": [["step_005", "P89完整課本頁"], ["step_008", "P92完整課本頁"]]}], "questions": [{"t": "腎門三管：特徵與功能", "q": "將6張卡放回對應的主要管道。", "learn": 3, "tag": "hilum", "hint": "結合方向、管壁與連通。", "why": "三類主要管道不等於實物必恰有三個殘端；單憑顏色或大小不足定名。", "sub": "課本P86、87；PPT 6、9", "refs": [{"src": "renal_diagram", "cap": "教材來源圖"}], "legacyQuestion": 1, "kind": "drag", "slots": [{"id": "g0s0", "label": "腎動脈", "group": 0}, {"id": "g0s1", "label": "腎動脈", "group": 0}, {"id": "g1s0", "label": "腎靜脈", "group": 1}, {"id": "g1s1", "label": "腎靜脈", "group": 1}, {"id": "g2s0", "label": "輸尿管", "group": 2}, {"id": "g2s1", "label": "輸尿管", "group": 2}], "pieces": [{"id": "ag0s0", "label": "將血液送入腎臟", "group": 0}, {"id": "ag0s1", "label": "管壁通常較厚富彈性", "group": 0}, {"id": "ag1s0", "label": "將血液帶離腎臟", "group": 1}, {"id": "ag1s1", "label": "通常較薄、未充盈時易塌", "group": 1}, {"id": "ag2s0", "label": "與腎盂連通", "group": 2}, {"id": "ag2s1", "label": "將尿液送往膀胱", "group": 2}], "sol": {"g0s0": "ag0s0", "g0s1": "ag0s1", "g1s0 e": {"bookPages": 8, "printedPages": "85–92", "pptPages": 27, "presentationKind": "pptx-static"}, "pptText": {"1": "探討活動 \n3-\n1 \n腎臟\n的觀察\n前言\n       腎臟是泌尿系統中最主要的器官，可製造尿液與調節體液的恆定，進一步影響人體的血壓。腎臟是如何形成尿液？腎臟的內部構造又是什麼樣子呢？\n1\n配合課本 \nP85", "2": "探討活動 \n3-\n1 \n腎臟\n的觀察\n目的\n       本活動透過腎臟的解剖與顯微觀察，探討腎臟如何形成尿液。\n2\n配合課本 \nP85", "3": "探討活動 \n3-\n1 \n腎臟\n的觀察\n原理\n       觀察腎臟外觀，可發現有血管（腎動脈與腎靜脈）進出腎臟，故推測尿液的形成可能來自於血液。因腎臟內的血管分布難以直接用肉眼判斷，故可以注射深色溶液的方式，了解血流在腎臟的流向與分布。接著再透過顯微鏡觀察腎臟的細部構造，綜合所有的觀察結果，可建立腎臟構造及尿液形成途徑的初步概念。\n3\n配合課本 \nP85", "4": "探討活動 \n3-\n1 \n腎臟\n的觀察\n每組使用\n實驗手套\n1\n 雙\n載玻片\n2\n 片\n解剖盤\n1\n 個\n蓋玻片\n1\n 片\n解剖用具\n1\n 組\n放大鏡\n1\n 個\n餐巾紙或擦手紙\n適量\n橡皮筋或縫衣線\n1\n 條\n單面刀片\n1\n 片\n腎臟永久玻片標本\n1\n 片\n滴管或注射針筒\n1\n 支\n新鮮的豬腎\n1\n 個\n複式顯微鏡\n1\n 臺\n黑色食用色素溶液\n\n（ 或黑色鋼筆墨水 ）\n適量\n4\n配合課本 \nP85\n器材", "5": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動一 豬腎臟的觀察\n步驟\n1\n將新鮮的腎臟置於解剖盤中，觸摸腎臟的表面，將感覺記錄下來。\n5\n配合課本 \nP86", "6": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動一 豬腎臟的觀察\n以解剖用具將脂肪組織剔除乾淨，觀察腎臟側邊的管狀構造，利用管壁的特性判斷何者為腎動脈、腎靜脈或輸尿管，並說明理由。\n2\n6\n配合課本 \nP86", "7": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動一 豬腎臟的觀察\n以鑷子或塑膠滴管插入輸尿管中，能否通到腎臟深處？改用滴管或去除針頭的注射針筒將水從輸尿管注入，能否不斷的灌水？\n3\n註\n注意操作時不可太過用力而插破組織。\n7\n配合課本 \nP86", "8": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動一 豬腎臟的觀察\n利用注射針筒，將黑色食用色素溶液（或黑色鋼筆墨水）注入腎動脈中，觀察腎臟表面有何變化？參考圖 \n3\n－\n6\n，這些被墨水染色的構造可能是\n什麼？\n4\n註\n可利用橡皮筋或縫衣線將動脈綁緊，以防黑色食用色素溶液（或黑色鋼筆墨水）溢出。\n8\n配合課本 \nP87", "9": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動一 豬腎臟的觀察\n將腎臟從腎門對邊處縱向對切，觀察黑色液體的分布。腎臟切開後，可看到明顯分為內、外兩層，分別是髓質與皮質；中央為中空構造，稱為腎盂。觀察皮質與髓質是否皆有黑色溶液分布。\n5\n髓質\n腎錐體\n（ 組成髓質 ）\n腎盂\n皮質\n腎動脈\n腎靜脈\n輸尿管\n9\n配合課本 \nP87", "10": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動一 豬腎臟的觀察\n參考步驟 \n5 \n圖示，觀察髓質中是否有許多錐狀構造？此即為腎錐體。以放大鏡觀察腎錐體，是否有許多直線形的白色細小紋路？\n6\n10\n配合課本 \nP88", "11": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動一 豬腎臟的觀察\n7\n選擇腎臟外層被染成黑色的部位，利用解剖刀切取約 \n2 cm× 1 cm \n的腎臟組織，並以餐巾紙或擦手紙包裹，夾在兩片載玻片中間，再以刀片切取薄片後置於載玻片上，以滴管滴一滴清水後蓋上蓋玻片，置於顯微鏡下進行觀察。\n11\n配合課本 \nP88", "12": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動一 豬腎臟的觀察\n2cm\n1cm\n載玻片\n餐巾紙包裹組織\n刀片\n配合課本 \nP88\n12", "13": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動一 豬腎臟的觀察\n13\n配合課本 \nP88\n以高倍顯微鏡觀察", "14": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動一 豬腎臟的觀察\n8\n尋找黑色團狀構造，注意大小或形態有什麼明顯差異。參考圖 \n\n3\n－\n6\n，這些被黑色溶液染色的團狀構造是什麼？觀察並繪圖記錄黑色構造的形態，並注意是否可觀察到管狀構造？\n14\n配合課本 \nP89", "15": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動一 豬腎臟的觀察\n15\n配合課本 \nP89\n100\n \nµm\n40\n \nµm\n40\n \nµm", "16": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動一 豬腎臟的觀察\n討論\n1. \n本活動可清楚觀察到腎臟的外觀與構造，根據腎臟的構造，請問尿液最後經由腎臟的哪一個部位流入輸尿管？共有幾條管狀構造進出腎門？這些管狀構造的名稱及功能為何？如何分辨其差異？\n答\n：\n(1\n)\n 尿液\n最後經由腎盂流入輸尿管。\n(2\n)\n 共有\n三條管子，分別為輸尿管、腎動脈及腎靜脈。\n(3\n)\n 輸尿管\n將尿液輸送至膀胱，腎動脈將血液送入腎臟，\n\n腎靜脈則將過濾後的血液送出。\n(4\n)\n 可\n藉由管徑粗細、管壁彈性及血管相對位置判斷。\n16\n配合課本 \nP89", "17": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動一 豬腎臟的觀察\n2. \n根據步驟 \n8 \n的腎臟皮質切片觀察，在動脈注射黑色溶液後會出現許多團狀構造，團狀構造附近可觀察到黑色的網狀構造，這些構造可能為何種血管？根據液體會由壓力大往壓力小的方向流動，由此推論血液的流動方向可能為何？\n答\n：\n(1\n)\n \n① 團狀構造\n：\n可能是絲球體。\n② 黑色的網狀\n構造\n：\n可能\n是入球小動脈、出球小動脈，或是周圍微血管網染黑顯現的網狀分布。\n(2) \n血液流動\n方向\n為\n：\n腎\n小動脈→入球小動脈→絲球體→出球小動脈 \n→ ① \n在皮質淺層形成周圍微血管（\nperitubular\n capillaries\n）、② 深入髓質形成直血管（\nvasa recta\n）→腎小靜脈→腎靜脈。\n17\n配合課本 \nP89", "18": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動\n二\n 腎臟中腎元的觀察\n步驟\n1\n將腎臟的永久玻片標本置於顯微鏡下，先用低倍鏡觀察找出靠近外圍的皮質，能否看到與活動一新鮮材料顯微切片類似的團狀構造？髓質能觀察到此構造嗎？\n低倍\n皮質\n髓質\n18\n配合課本 \nP90\n1\n \nmm", "19": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動\n二\n 腎臟中腎元的觀察\n19\n配合課本 \nP90\n高倍\n250\n \nµm\n皮質\n髓質", "20": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動\n二\n 腎臟中腎元的觀察\n2\n改用高倍鏡觀察團狀構造，在團狀構造的周圍能否找到一圈扁平薄層的構造（箭頭所指處）？這層構造應屬於何種組織？\n20\n配合課本 \nP91\n30\n \nµm", "21": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動\n二\n 腎臟中腎元的觀察\n3\n觀察團狀構造附近的管狀切面，其管壁各有幾層細胞？這些管狀切面的形狀都相同嗎？\n21\n配合課本 \nP91", "22": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動\n二\n 腎臟中腎元的觀察\n4\n根據管壁的差異，可大致分為兩種不同的管狀構造，這兩種管狀構造數量一樣多嗎？\n22\n配合課本 \nP91\n30\n \nµm\n1\n2", "23": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動\n二\n 腎臟中腎元的觀察\n5\n轉回低倍鏡，觀察髓質，找出縱向直行的管狀構造，是否可通至腎臟內層？再改用高倍鏡觀察其管壁各有幾層細胞？\n23\n配合課本 \nP91\n30\n \nµm\n亨耳環管", "24": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動\n二\n 腎臟中腎元的觀察\n討論\n1. \n透過活動一可觀察到腎臟區分為皮質和髓質，在活動一觀察到的團狀構造（絲球體）分布在皮質或髓質？而活動二觀察到的管狀構造（腎小管）主要分布在皮質或髓質？\n答\n：\n(1\n)\n \n絲\n球體位於皮質。\n(2\n)\n \n腎\n小管在皮質及髓質內均可看到。\n24\n配合課本 \nP92", "25": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動\n二\n 腎臟中腎元的觀察\n2. \n新鮮切片是否能看到如此活動的管狀構造（腎小管）？為什麼？\n答\n：\n(1\n)\n \n視\n情況，可能可於邊緣較透光處觀察到。\n(2\n)\n \n注射\n深色溶液後被染色的部分為血管分布位置，可以觀察到絲球體與微血管網。因操作過程中，深色溶液可能使周圍組織被染色，故腎小管雖並非血流通過處，但在新鮮切片標本的邊緣較透光處，仍可能可以觀察到呈透明狀的腎小管，相較之下不像微血管一樣可被明顯觀察到，因此還需視操作當下的染色或切片情形而定。\n25\n配合課本 \nP92", "26": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動\n二\n 腎臟中腎元的觀察\n3. \n由步驟 \n3 \n可觀察到不同形狀的管狀切面，參考下圖圖解想一想，腎臟內部若具有許多管狀構造，這些管狀構造可能的分布形態為何？\n(a)\n腎小管的顯微切片標本，可與\n(b)\n管狀構造的不同切面示意圖對照。\n(a)\n(b)\n26\n配合課本 \nP92\n30\n \nµm", "27": "探討活動 \n3-\n1 \n腎臟\n的觀察\n活動\n二\n 腎臟中腎元的觀察\n答\n：\n由於管狀構造並非整齊排列，或是固定一個方向延伸，而是彎彎曲曲、以立體纏繞的結構分布在腎臟之中，且皮質及髓質皆會出現，因此切片時可能會同時切到不同部位的管子，在顯微鏡下可同時觀察到不同形狀的切面。\n27\n配合課本 \nP92"}, "sourceCorrections": [{"ppt": [16], "note": "三條管子指三類主要管道；實際分支殘端數需依標本記錄。"}, {"ppt": [18, 19, 20, 22, 23, 26], "note": "顯微尺度以原圖µm標尺為準；PDF文字抽取中的µ字形可能被辨為m。"}, {"ppt": [27], "note": "三維形態需區分：皮質曲小管迂迴，髓質部分管段較直且平行；不能概括所有腎內管道都纏繞。"}], "originalPPTQuestions": {}};

for(const id of ['l-prev','fs-prev'])el(id).onclick=()=>LI>0&&showLearn(LI-1);for(const id of ['l-next','fs-next'])el(id).onclick=()=>LI<LEARN.length-1&&showLearn(LI+1);
el('related-slide').onclick=()=>openShow(DECK.findIndex(d=>d[1]===+(LEARN[LI].slide||1)));
el('hint-toggle').setAttribute('aria-haspopup','dialog');el('hint-toggle').onclick=()=>{el('hint-toggle').setAttribute('aria-expanded','true');const d=openDialog('思考提示',`<p>${esc(STAGES[QI].hint)}</p>`);d.addEventListener('close',()=>el('hint-toggle').setAttribute('aria-expanded','false'),{once:true});};el('reference-btn').onclick=()=>openReferences(STAGES[QI]);el('question-learn').onclick=()=>{returnQuestion=true;navigate('learn',STAGES[QI].learn)};el('q-jump').onchange=e=>showQuestion(+e.target.value);el('prev-btn').onclick=()=>QI>0&&showQuestion(QI-1);el('skip-btn').onclick=()=>QI<STAGES.length-1?showQuestion(QI+1):navigate('done');el('check-btn').onclick=check;el('reset-btn').onclick=resetQuestion;el('finish-btn').onclick=()=>navigate('done');
el('shsel').innerHTML=[...new Set(DECK.map(d=>d[1]))].map(n=>`<option value="${n}">PPT第${n}頁 · ${esc(DECK.find(d=>d[1]===n)[2].slice(0,22))}</option>`).join('');el('shsel').onchange=e=>{showStopPlay();SI=DECK.findIndex(d=>d[1]===+e.target.value);showRender();};el('shprev').onclick=()=>showStep(-1);el('shnext').onclick=()=>showStep(1);el('shplay').onclick=()=>{if(SPLAY)showStopPlay();else{if(SI===DECK.length-1)SI=0;showRender();SPLAY=setInterval(()=>{if(SI>=DECK.length-1){showStopPlay();return;}SI++;showRender()},2600);el('shplay').textContent='⏸ 暫停';}};el('shfs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else el('show').requestFullscreen?.().catch(()=>{el('shfs').textContent='此瀏覽器不支援原生全螢幕'})};el('shclose').onclick=()=>navigate('intro');
el('theme-toggle').onclick=()=>{ST.theme=ST.theme==='dark'?'light':'dark';applyPreferences();save();};el('font-toggle').onclick=()=>{ST.font=(ST.font+1)%3;applyPreferences();save();fit();};function applyPreferences(){document.documentElement.dataset.theme=ST.theme;document.documentElement.style.setProperty('--text',[20,22,24][ST.font]+'px');document.documentElement.dataset.font=ST.font;el('theme-toggle').setAttribute('aria-pressed',String(ST.theme==='dark'));el('font-toggle').title='文字大小 '+[20,22,24][ST.font]+'px';}
document.addEventListener('fullscreenchange',fullscreenSync);document.addEventListener('keydown',e=>{if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(document.querySelector('dialog[open]'))return;const fs=document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation');if(fs){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();if(LI>0)showLearn(LI-1);}else if(e.key==='Escape')exitLearnFullscreen();return;}if(PAGE==='show'){if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();showStep(1);}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();showStep(-1);}else if(e.key==='Escape')navigate('intro');else if(e.key==='Home'){SI=0;showRender()}else if(e.key==='End'){SI=DECK.length-1;showRender()}return;}if(PAGE==='learn'&&el('flip')){if(e.key==='ArrowRight'){e.preventDefault();flipStop();flipShow(FI+1)}if(e.key==='ArrowLeft'){e.preventDefault();flipStop();flipShow(FI-1)}}});
el('learn-stage').addEventListener('contextmenu',e=>{if(document.fullscreenElement===el('learn-stage')||el('learn-stage').classList.contains('presentation')){e.preventDefault();if(LI<LEARN.length-1)showLearn(LI+1)}});
window.addEventListener('resize',fit);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){flipStop();showStopPlay();save();}});new ResizeObserver(fit).observe(el('bar'));
el('slide-text').onclick=()=>{const page=DECK[SI][1];openDialog('原PPT第'+page+'頁原文',`${CONTENT.sourceCorrections.filter(x=>x.ppt.includes(page)).map(x=>'<div class="scope-note">'+esc(x.note)+'</div>').join('')}<p>${esc(CONTENT.pptText[page])}</p>`);};el('hero-image').src=IMG['renal_diagram'];el('video-external').href=typeof VIDEO_VIEW_URL!=='undefined'?VIDEO_VIEW_URL:VIDEO_SRC;applyPreferences();const start=['learn','play','done'].includes(ST.page)?ST.page:'intro';navigate(start);if(!saving)storageNotice();
</script></body></html>

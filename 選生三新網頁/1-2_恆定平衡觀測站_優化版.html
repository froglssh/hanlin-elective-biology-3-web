const CONTENT={"lessons": [{"id": "b3-c12-l01", "t": "恆定：在變動中維持可運作的範圍", "src": "課本 P16；原PPT第 1 頁", "slide": 1, "sourcePages": [], "sec": "s1", "figSpec": {"image": "PPT01S3"}, "txt": "<ul><li>恆定是體內環境的<b>動態穩定</b>，不是數值永遠不變。</li><li>先找被調節的變數，再找刺激、反應與結果。</li><li>本節連結器官分工、回饋方向及系統整合。</li></ul><p class=\"think\">血糖略有波動，是否就表示失去恆定？</p><div class=\"ex\"><h4>本節的主題</h4><p>動物體的各種組織經過整合，構成<b>器官與器官系統</b>；系統之間<b>分工協調</b>，維持動物體的<b>恆定</b>與運作。本節要回答：恆定的生理意義是什麼？恆定被破壞時會發生什麼事？</p></div><div class=\"ex\"><h4>本節的兩大段落</h4><ul><li>1-2.1 恆定概念的發展與重要性</li><li>1-2.2 恆定的維持與調節</li></ul></div><div class=\"ex\"><h4>看圖時</h4><p>圖上的橫軸（時間）與縱軸（血糖值）要一起讀；曲線上下波動不一定是失去恆定，重點是<b>是否維持在可運作的範圍</b>。</p></div>", "tb": []}, {"id": "b3-c12-l02", "t": "器官分工：物質如何抵達細胞？", "src": "課本 P16；原PPT第 2 頁", "slide": 2, "sourcePages": [1], "sec": "s1", "figSpec": {"image": "systems"}, "txt": "<ul><li>呼吸系統交換O₂與CO₂；消化系統吸收養分和水。</li><li>循環系統運送物質，將組織代謝廢物送往相關器官。</li><li>泌尿系統排出部分代謝廢物並調節水與無機鹽。圖中的箭頭須連同方向、物質和器官一起讀。</li></ul><p class=\"think\">循環系統停止運送時，只有心臟受到影響嗎？</p><div class=\"ex g\"><h4>圖 1－6　四個系統的功能聯繫</h4><p>細胞要生存，需要養分、水與氧氣，也要把廢物送走。這些工作由消化、呼吸、循環與泌尿系統<b>分工合作</b>完成。</p></div><div class=\"ex\"><h4>各系統負責的物質</h4><ul><li><b>消化系統</b>：食物、飲水進入，吸收<b>養分與水</b>。</li><li><b>呼吸系統</b>：交換 O₂ 與 CO₂。</li><li><b>循環系統</b>：把養分、水、O₂、激素送到各器官的組織細胞，並帶走新陳代謝廢物。</li><li><b>泌尿系統</b>：排出水、無機鹽與新陳代謝廢物，形成尿液。</li></ul></div><div class=\"ex\"><h4>結論</h4><p>動物體藉由器官系統之間的分工協調，維持恆定與運作。讀箭頭時要同時看<b>方向、物質、器官</b>三項。</p></div>", "tb": [["BOOK1", "P16 完整課本頁"]]}, {"id": "b3-c12-l03", "t": "伯納：細胞周圍的內在環境", "src": "課本 P17；原PPT第 3 頁", "slide": 3, "sourcePages": [], "sec": "s1", "figSpec": {"image": "PPT03S3"}, "txt": "<ul><li>依本課教材，伯納於1857年提出內在環境概念；直接圍繞細胞的是<b>組織液</b>。</li><li>血漿與組織液同屬細胞外液；細胞內液位於細胞膜內側。</li><li>內外環境有物質交換；相對穩定並不表示與外界隔絕。</li></ul><p class=\"think\">消化道管腔裡的食物，已經成為細胞周圍的內在環境了嗎？</p><div class=\"ex\"><h4>伯納（1857 年）</h4><p>科學家伯納首先提出：「生物擁有一個固定的<b>內在環境</b>，生物的生理功能就是要維持這個內在環境的穩定。」</p></div><div class=\"ex\"><h4>什麼是「內在環境」</h4><p>指<b>圍繞在細胞周圍的組織液</b>，可提供細胞適宜的生活環境。</p></div><div class=\"ex\"><h4>他的觀察</h4><p>即使外在環境的條件改變，內在環境仍會維持穩定；而且只有內在環境穩定，細胞才能正常運作。</p></div><div class=\"ex\"><h4>小提醒</h4><p>相對穩定不代表與外界隔絕，內外環境之間仍有物質交換。</p></div>", "tb": []}, {"id": "b3-c12-l04", "t": "坎能：恆定不是靜止的平衡", "src": "課本 P17；原PPT第 4 頁", "slide": 4, "sourcePages": [2], "sec": "s1", "figSpec": {"image": "PPT04S3"}, "txt": "<ul><li>依本課教材，坎能於1932年將此概念命名為恆定。</li><li>體溫、體液組成、血液酸鹼值、氣體分壓及血糖等，各有適合運作的範圍。</li><li>同一變數的適當範圍須連同測量條件判讀，不把某一時刻的數字當作所有情況的唯一標準。</li></ul><p class=\"think\">可否用一張餐後血糖圖，推算所有人的空腹血糖？</p><div class=\"ex\"><h4>坎能（1932 年）</h4><p>科學家坎能把伯納的概念命名為「<b>恆定</b>」（homeostasis），指動物體藉由各種機制調控體內環境的<b>動態穩定</b>，以維持正常生理作用。</p></div><div class=\"ex\"><h4>恆定的目的</h4><p>各種構造與系統協調運作，目的都與維持恆定有關，用來延續生物體的生存。</p></div><div class=\"ex\"><h4>哪些數值要維持穩定</h4><p>體溫、體液的組成、血液酸鹼值、激素濃度、氣體分壓及血糖濃度等，都維持在各自適當的範圍內。</p></div><div class=\"ex\"><h4>恆定的用處</h4><p>掌握恆定的概念，能理解生理機制「如何運作」與「為何運作」；在臨床上，偵測生理數值是否脫離恆定狀態，是醫學診斷的基礎。</p></div>", "tb": [["BOOK2", "P17 完整課本頁"]]}, {"id": "b3-c12-l05", "t": "體溫上升：散熱反應削弱刺激", "src": "課本 P17；原PPT第 5 頁", "slide": 5, "sourcePages": [], "sec": "s2", "figSpec": {"image": "PPT05S3"}, "txt": "<ul><li>教材以約36–37.5℃說明一般體溫範圍；量測部位、時間及活動會影響測得數值。</li><li>核心體溫偏高時，皮膚血管擴張增加散熱，汗液蒸發可帶走熱。</li><li>反應結果使原先偏高的體溫下降，屬於<b>負回饋</b>。</li></ul><p class=\"think\">若空氣非常潮濕，大量流汗是否一定能有效散熱？</p><div class=\"scope-note\">只看到汗水並不能量出散熱效果；此圖是教材機制示意。高熱危害涉及多種生理功能，不能只以單一溫度宣稱所有酵素立即變性。</div><div class=\"ex\"><h4>以體溫為例</h4><p>人體的正常體溫範圍約 <b>36～37.5 ℃</b>。體溫過高會破壞酵素，影響正常生理作用，導致中暑、休克甚至死亡。</p></div><div class=\"ex g\"><h4>體溫上升時的調節</h4><ul><li>血管擴張，增加散熱</li><li>汗腺增加汗液分泌</li><li>結果：體溫下降，回到正常範圍</li></ul></div><div class=\"ex\"><h4>結果的意義</h4><p>調節的結果使原先偏高的體溫下降，也就是削弱了原本的刺激，屬於<b>負回饋</b>。</p></div><div class=\"ex\"><h4>小提醒</h4><p>長期暴露在極端環境，可能超出體溫控制機制的能力，因此恆定不等於無限的保護。</p></div>", "tb": []}, {"id": "b3-c12-l06", "t": "體溫下降：保溫與產熱", "src": "課本 P17；原PPT第 6 頁", "slide": 6, "sourcePages": [], "sec": "s2", "figSpec": {"image": "PPT06S3"}, "txt": "<ul><li>皮膚血管收縮可減少皮膚散熱；骨骼肌顫抖可增加產熱。</li><li>調節使偏低的體溫回升，同樣是負回饋；<b>升高數值不等於正回饋</b>。</li><li>極端環境可能超出調節能力，不能把恆定理解成無限的防護。</li></ul><p class=\"think\">為何散熱和產熱方向相反，卻都可能是負回饋？</p><div class=\"scope-note\">原文「血管與肌肉收縮將血液集中」要拆開理解：皮膚血管收縮減少散熱，骨骼肌顫抖主要是產熱。低溫可降低反應速率，不等同所有酵素被低溫變性。</div><div class=\"ex\"><h4>以體溫為例</h4><p>暴露在極低溫時，酵素活性低落、代謝遲緩，可能造成意識不清、心跳停止（課本稱失溫）。</p></div><div class=\"ex g\"><h4>體溫下降時的調節</h4><ul><li>血管與肌肉收縮，把血液集中</li><li>肌肉顫抖產熱</li><li>促進食慾，獲得更多能量以提高體溫</li><li>結果：體溫回升，回到正常範圍</li></ul></div><div class=\"ex\"><h4>一樣是負回饋</h4><p>散熱與產熱的方向相反，但結果都是削弱刺激（讓偏離的體溫回到正常範圍），所以都是負回饋。數值「升高」並不等於正回饋。</p></div>", "tb": []}, {"id": "b3-c12-l07", "t": "三種調節：先問正在比較什麼", "src": "課本 P18；原PPT第 7 頁", "slide": 7, "sourcePages": [3], "sec": "s3", "figSpec": {"image": "PPT07S3"}, "txt": "<ul><li>回饋比較<b>結果對原刺激的影響</b>。</li><li>拮抗與協同比較<b>兩種調節機制對同一變數的作用方向</b>。</li><li>同一血糖調節情境可以同時包含負回饋與拮抗，兩者不是互斥分類。</li></ul><p class=\"think\">胰島素與升糖素互為拮抗，是否表示它們是正回饋？</p><div class=\"ex\"><h4>三種調節機制</h4><p>生物體發展出許多調節機制來維持恆定，包含<b>回饋控制、拮抗作用、協同作用</b>。詳細內容在第 4 章。</p></div><div class=\"ex\"><h4>三者在比較什麼</h4><ul><li><b>回饋</b>：調節的結果對原來的刺激有什麼影響（削弱或增強）。</li><li><b>拮抗</b>：兩種調節機制對同一變數的作用方向相反。</li><li><b>協同</b>：兩種調節機制對同一變數的作用方向相同。</li></ul></div><div class=\"ex\"><h4>小提醒</h4><p>這三種分類不互斥。同一個血糖調節情境，可以同時有負回饋，也有拮抗。</p></div>", "tb": [["BOOK3", "P18 完整課本頁"]]}, {"id": "b3-c12-l08", "t": "回饋迴路：回到範圍後仍持續偵測", "src": "課本 P18；原PPT第 8 頁", "slide": 8, "sourcePages": [], "sec": "s3", "figSpec": {"image": "PPT08S3"}, "txt": "<ul><li>受器偵測變動，控制機制整合訊息，動器執行反應。</li><li>下游結果影響上游調節，才構成回饋關係。</li><li>回到適當範圍並非所有反應立即歸零；監測與基礎生理活動仍持續。</li></ul><p class=\"think\">只有「激素造成結果」的一支箭頭，足以證明回饋嗎？</p><div class=\"ex\"><h4>什麼是回饋</h4><p>根據某個<b>下游</b>生理狀態的變化，引發<b>上游</b>的調節，稱為回饋。例如體溫過高或過低時，體內機制啟動，使體溫恢復正常範圍。</p></div><div class=\"ex\"><h4>回到範圍之後呢</h4><p>即使已回到正常體溫，體內的細胞仍會<b>持續偵測</b>體溫的變動，作為繼續調節的依據。</p></div><div class=\"ex\"><h4>三個角色</h4><p>受器偵測變動，控制機制整合訊息，動器執行反應；下游結果會影響上游，才構成回饋。</p></div>", "tb": []}, {"id": "b3-c12-l09", "t": "負與正：看結果削弱還是增強刺激", "src": "課本 P18；原PPT第 9 頁", "slide": 9, "sourcePages": [], "sec": "s3", "figSpec": {"image": "PPT09S3"}, "txt": "<ul><li>負回饋削弱原刺激帶來的偏離，常用於維持變數的穩定範圍。</li><li>正回饋增強原刺激；教材以哺乳為例，延伸可用分娩時子宮頸受壓—催產素—收縮的迴路說明。</li><li>正、負表示迴路方向，不表示好壞、數值升降或是否正常。</li></ul><p class=\"think\">比較「低血糖後升糖」與「子宮收縮後更強的收縮」。哪一個削弱原刺激？</p><div class=\"scope-note\">正回饋可參與正常生理事件，不能只憑正負判斷有益或有害；其迴路可因刺激移除或事件完成而終止。延伸依據：<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/1-5-homeostasis\" target=\"_blank\" rel=\"noopener noreferrer\">OpenStax 回饋教材</a>。</div><div class=\"ex\"><h4>兩種回饋</h4><ul><li><b>負回饋</b>：調節的結果<b>削弱</b>刺激帶來的影響。例如體溫升高，調節最終讓體溫下降。</li><li><b>正回饋</b>：調節的結果<b>增強</b>刺激帶來的影響。例如哺乳，詳細機制在 4-4 補充。</li></ul></div><div class=\"ex\"><h4>負回饋的目的</h4><p>讓生理狀態維持在特定範圍內、更趨穩定。體溫、血糖濃度、無機鹽濃度、激素濃度都可以透過負回饋維持恆定。</p></div><div class=\"ex\"><h4>小提醒</h4><p>正、負是指<b>迴路的方向</b>（削弱或增強），不是好壞，也不是數值升降。</p></div>", "tb": []}, {"id": "b3-c12-l10", "t": "血糖拮抗：比較同一變數", "src": "課本 P19；原PPT第 10 頁", "slide": 10, "sourcePages": [], "sec": "s4", "figSpec": {"image": "glucose"}, "txt": "<ul><li>胰島素促進肝糖儲存及相關組織利用葡萄糖，產生降血糖效果。</li><li>升糖素促進<b>肝臟</b>肝糖分解及葡萄糖釋放，產生升血糖效果。</li><li>兩種激素對血糖的作用方向相反，因此互為拮抗。</li></ul><p class=\"think\">「胰島素」與「血糖下降的結果」是否是原課本所說的兩種拮抗機制？</p><div class=\"ex\"><h4>拮抗作用</h4><p>在恆定調節時，若不同調節機制之間<b>互為相反</b>，稱為拮抗作用。例子：胰臟胰島分泌的<b>胰島素</b>與<b>升糖素</b>。</p></div><div class=\"ex\"><h4>兩種激素的作用</h4><ul><li><b>胰島素</b>：刺激肝臟與肌肉吸收血糖，形成肝糖儲存，<b>降低</b>血糖濃度。</li><li><b>升糖素</b>：促進肝糖分解，釋放葡萄糖到血液中，<b>提升</b>血糖濃度。</li></ul></div><div class=\"ex\"><h4>結論</h4><p>在「血糖濃度」的調節上，胰島素與升糖素互為拮抗（圖 1－7）。注意拮抗比較的是<b>兩種機制</b>，不是「激素」和「結果」。</p></div>", "tb": []}, {"id": "b3-c12-l11", "t": "高與低：兩側都是負回饋", "src": "課本 P19；原PPT第 11 頁", "slide": 11, "sourcePages": [4], "sec": "s4", "figSpec": {"image": "glucose"}, "txt": "<ul><li>血糖偏高→胰島素作用→血糖下降，削弱偏高刺激。</li><li>血糖偏低→升糖素作用→血糖上升，削弱偏低刺激。</li><li>圖1–7的灰色帶為正常範圍示意，沒有提供可通用的精確診斷切點。</li></ul><p class=\"think\">低血糖後數值升高，為何仍是負回饋？</p><div class=\"scope-note\">肌肉肝糖主要供肌肉自身利用；此處升糖素使葡萄糖釋入血液的教材箭頭指肝臟，不把肌肉肝糖當作相同的供血糖來源。</div><div class=\"ex g\"><h4>圖 1－7　血糖的負回饋</h4><p>血糖受刺激而偏離正常值範圍時，負回饋會啟動以削弱刺激。圖中灰色帶是正常值範圍的示意。</p></div><div class=\"ex\"><h4>兩個方向</h4><ul><li>血糖<b>高於</b>正常範圍 → 刺激胰島分泌胰島素 → 肝臟吸收血糖形成肝糖、細胞利用血糖 → 血糖降低，回到正常值。</li><li>血糖<b>低於</b>正常範圍 → 刺激胰島分泌升糖素 → 促進肝糖分解為葡萄糖 → 血糖升高，回到正常值。</li></ul></div><div class=\"ex\"><h4>為什麼兩邊都是負回饋</h4><p>低血糖後血糖升高，也是把偏離的數值拉回範圍、削弱了原本的刺激，所以仍是負回饋。</p></div>", "tb": [["BOOK4", "P19 完整課本頁"]]}, {"id": "b3-c12-l12", "t": "協同抗壓：同向功能不等於同一時程", "src": "課本 P19；原PPT第 12 頁", "slide": 12, "sourcePages": [], "sec": "s4", "figSpec": {"image": "PPT12S3"}, "txt": "<ul><li>課本以腎上腺髓質因應較短期壓力、皮質參與持續壓力調節，說明共同抗壓。</li><li>髓質與皮質的作用、時間及機制不同，不表示所有效果都完全相同。</li><li>在本節簡化分類中，兩者共同支持抗壓功能，稱為協同作用。</li></ul><p class=\"think\">兩種機制作用時間不同，是否就不能協同？</p><div class=\"ex\"><h4>協同作用</h4><p>若不同調節機制都使生理狀態往<b>相同方向</b>調節，稱為協同作用。</p></div><div class=\"ex\"><h4>例子：面臨壓力時</h4><ul><li><b>腎上腺髓質</b>分泌激素，使心跳加快、血壓上升、呼吸道擴張，因應<b>短期</b>壓力。</li><li>壓力持續較長時，<b>腎上腺皮質</b>也分泌激素，提高血糖濃度，協助抗壓。</li></ul></div><div class=\"ex\"><h4>結論</h4><p>腎上腺髓質與腎上腺皮質的關係稱為協同作用。兩者作用的時間與方式不同，但共同支持抗壓。</p></div>", "tb": []}, {"id": "b3-c12-l13", "t": "一日血糖：先讀座標與用餐條件", "src": "課本 P19；原PPT第 13 頁", "slide": 13, "sourcePages": [], "sec": "s5", "figSpec": {"image": "curve"}, "txt": "<ul><li>橫軸是0–24小時，縱軸是血糖mg/dL；已知12時及18時用餐。</li><li>用餐後曲線有上升、峰值及回落。圖像只能支持近似區間，不提供逐分鐘或精確峰值資料。</li><li>曲線回落與負回饋調節相容，但不能由曲線直接量出胰島素濃度。</li></ul><p class=\"think\">用餐時刻、峰值時刻和開始分泌激素的時刻，是否相同？</p><div class=\"ex\"><h4>腦力激盪的題目</h4><p>某成年女性一日血糖變化如圖，固定在中午 12:00 與晚上 18:00 用餐。請查資料並判斷：血糖是否在正常範圍？哪些時間區間正在進行回饋控制？屬於正回饋還是負回饋？</p></div><div class=\"ex g\"><h4>怎麼讀這張圖</h4><p>橫軸是 0～24 小時，縱軸是血糖值（mg/dL）。先標出<b>用餐時間</b>，再看用餐後曲線的<b>上升、峰值與回落</b>。</p></div><div class=\"ex\"><h4>小提醒</h4><p>曲線只能看出大致的變化趨勢，不能直接讀出胰島素濃度，也不能得到逐分鐘的精確數值。</p></div>", "tb": []}, {"id": "b3-c12-l14", "t": "案例推論：曲線不能代替醫學診斷", "src": "課本 P19；原PPT第 14 頁", "slide": 14, "sourcePages": [], "sec": "s5", "figSpec": {"image": "curve"}, "txt": "<ul><li>可以比較用餐前後的變化及回落趨勢；監測與調節不只在峰值後才開始。</li><li>原PPT14提供參考答案；其中「0–13時未進食」與12時用餐條件重疊，不能照抄成精確時序。</li><li>確認血糖狀態還需要量測方式、是否空腹、餐後間隔及適當檢驗；一張示意曲線不足以確認個人健康。</li></ul><p class=\"think\">如果只能再問一項資料，你會問量測方式、用餐內容，還是餐後採血時間？說明理由。</p><div class=\"scope-note\">現行參考資料把空腹檢驗與標準葡萄糖耐受試驗分開；不能拿一般餐後整日曲線直接套成同一診斷條件。<a href=\"https://www.niddk.nih.gov/health-information/diabetes/overview/tests-diagnosis\" target=\"_blank\" rel=\"noopener noreferrer\">NIDDK：血糖檢驗與診斷</a>。</div><div class=\"ex\"><h4>參考答案（原簡報第 14 頁）</h4><p>健康成年人的一日血糖會因進食、活動、年齡等稍有波動，只要維持在合理範圍內，就是正常的代謝現象。</p></div><div class=\"ex\"><h4>網路查到的兩種常見範圍</h4><ul><li>空腹血糖約 74～106 mg/dL</li><li>飯後 2 小時血糖應小於 140 mg/dL</li></ul></div><div class=\"ex\"><h4>曲線解讀</h4><ul><li>未進食時，血糖在約 75～100 mg/dL 間波動，屬於空腹範圍。</li><li>午餐、晚餐後血糖提高，進入飯後階段，但沒有超過 140 mg/dL。</li><li>約 15 時與 21 時血糖達到高峰，胰島素大量分泌，血糖下降、逐漸回到正常。</li></ul></div><div class=\"ex\"><h4>回饋的類型</h4><p>血糖上升 → 胰島素作用 → 血糖下降，是典型的<b>負回饋</b>。要確認個人是否健康，還需要空腹與否、餐後時間等條件，一張示意圖不能當診斷依據。</p></div>", "tb": []}, {"id": "b3-c12-l15", "t": "整合四階段：感測、接收、修正、回復", "src": "課本 P20；原PPT第 15 頁", "slide": 15, "sourcePages": [5], "sec": "s6", "figSpec": {"image": "integration"}, "txt": "<ul><li>依圖1–8，身體感測失恆→控制中心接收訊息→各系統調節與修正→回到恆定。</li><li>神經、內分泌與免疫系統參與聯繫和整合；循環提供物質運送。</li><li>不同迴路可由不同部位整合，並非每項調節都要先送到大腦。</li></ul><p class=\"think\">血糖調節的感測與分泌可以由胰島細胞完成，是否仍符合調節迴路？</p><div class=\"ex g\"><h4>圖 1－8　恆定的四個階段</h4><p>動物體的恆定要靠各個器官的合作；器官之間又藉由<b>循環、免疫、神經、內分泌</b>四個系統的聯繫與整合，來面對內外環境的變動。</p></div><div class=\"ex\"><h4>四個階段</h4><ul><li>階段 1：身體感測到失恆狀態</li><li>階段 2：體內控制中心接收訊息</li><li>階段 3：控制中心藉由各個系統進行調節與修正</li><li>階段 4：失恆狀態回到恆定</li></ul></div><div class=\"ex\"><h4>各系統的角色</h4><p>恆定協調主要靠免疫、神經與內分泌系統的聯繫與整合；循環系統除了居中聯繫，還供應組織養分並帶走代謝廢物。後面的章節會逐一探討這些系統。</p></div>", "tb": [["BOOK5", "P20 完整課本頁"]]}, {"id": "b3-c12-l16", "t": "原題一：追蹤抑制箭頭", "src": "課本 P18–19；原PPT第 16 頁", "slide": 16, "sourcePages": [], "sec": "s6", "figSpec": {"image": "originalLoop"}, "txt": "<ul><li>甲激素造成乙結果；乙結果沿回傳箭頭抑制甲激素。</li><li>這是負回饋：若甲為胰島素可產生降血糖結果；若甲為升糖素可產生升血糖結果。</li><li>原PPT題一正答為A、B、D。拮抗比較兩種調節機制，不是把甲和乙當成兩種激素。</li></ul><p class=\"think\">如果刪掉回傳的抑制箭頭，還能直接確定負回饋嗎？</p><div class=\"ex\"><h4>原題一（原簡報第 16 頁）</h4><p>關於右圖（甲激素造成乙結果，乙結果又回頭抑制甲激素），下列哪些正確？（多選）</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 若甲激素為胰島素，則乙結果為血糖濃度下降</li><li>(B) 若甲激素為升糖素，則乙結果為血糖濃度上升</li><li>(C) 乙結果對甲激素正回饋</li><li>(D) 乙結果對甲激素負回饋</li><li>(E) 甲激素與乙結果互相拮抗</li></ul></div><div class=\"ex\"><h4>答案：(A)(B)(D)</h4><p>乙結果抑制甲激素，削弱了原本的作用，所以是<b>負回饋</b>，(C) 錯。</p></div><div class=\"ex\"><h4>(E) 為什麼錯</h4><p>拮抗是指<b>兩種激素</b>對同一個生理作用相反，例如胰島素降血糖、升糖素升血糖；甲激素與乙結果不是兩種激素，不能稱拮抗。</p></div>", "tb": []}, {"id": "b3-c12-l17", "t": "原題二：系統圖與物質線索", "src": "課本 P16；原PPT第 17 頁", "slide": 17, "sourcePages": [], "sec": "s6", "figSpec": {"image": "originalSystems"}, "txt": "<ul><li>依構造可辨識甲消化、乙循環、丙呼吸、丁泌尿；丁的腎臟過濾血液形成尿液。</li><li>原題(1)問維持血液組成的主要系統，按此圖和原題意選丁（D）；其他系統也有貢獻。</li><li>原題(2)假設物質為含氮廢物，四個選項中蛋白質代謝可產生，選B。</li></ul><p class=\"think\">圖中的物質箭頭和題幹對a的稱呼，有沒有需要澄清之處？</p><div class=\"scope-note\">圖a箭頭畫在消化道往循環的方向，呈現吸收物質；原題(2)卻稱a為代謝廢物。保留原題和答案B，按其「若為含氮廢物」的假設分類，不把圖中吸收箭頭教成排泄箭頭。</div><div class=\"ex\"><h4>原題二（原簡報第 17 頁）</h4><p>右圖為人體各系統之間的相關圖，甲、乙、丙、丁為系統代號，a、b、c、d 為進或出血管的相關物質。</p></div><div class=\"ex\"><h4>問題</h4><ul><li>(1) 維持人體血液組成恆定的主要系統為何？(A) 甲 (B) 乙 (C) 丙 (D) 丁</li><li>(2) 若代謝廢物 a 為含氮廢物，則其應來自何種分子的代謝？(A) 醣類 (B) 蛋白質 (C) 脂質 (D) 礦物質</li></ul></div><div class=\"ex\"><h4>答案</h4><p>(1) <b>(D)</b>；(2) <b>(B)</b>。</p></div><div class=\"ex\"><h4>(1) 解析</h4><p>丁是泌尿系統，藉由<b>過濾血液形成尿液</b>，維持血液組成的恆定。</p></div>", "tb": []}, {"id": "b3-c12-l18", "t": "證據與範圍：答案背後的限定", "src": "課本 P16；原PPT第 18 頁", "slide": 18, "sourcePages": [], "sec": "s6", "figSpec": {"image": "originalSystems"}, "txt": "<ul><li>原PPT18指出丁藉過濾血液形成尿液；蛋白質與核酸代謝皆可產生含氮廢物。</li><li>原題沒有核酸選項，因此B為給定選項中的正答，不表示所有含氮廢物只來自蛋白質。</li><li>以可見構造、箭頭方向與題幹條件作答，遇到來源衝突則留下範圍說明。</li></ul><p class=\"think\">如何用一句話區分「原題最佳選項」與「所有可能的生理來源」？</p><div class=\"ex\"><h4>(2) 解析</h4><p>含氮廢物來自<b>蛋白質與核酸</b>的代謝。本題選項沒有核酸，所以選 (B) 蛋白質。</p></div><div class=\"ex\"><h4>怎麼作答</h4><p>依<b>可見的構造、箭頭方向與題幹條件</b>作答：先辨認甲消化、乙循環、丙呼吸、丁泌尿，再判斷物質的來源或去向。</p></div><div class=\"ex\"><h4>小提醒</h4><p>(B) 是「題目選項中」最合適的答案，並不表示所有含氮廢物只來自蛋白質。</p></div>", "tb": []}], "questions": [{"t": "體液分室：辨識細胞膜內外", "q": "把六張描述放入相應體液分室；同一類兩格可交換。", "learn": 2, "tag": "environment", "hint": "先找血管與細胞膜的界線，勿把細胞內液當成內在環境。", "why": "血漿及組織液屬細胞外液；組織液是多數細胞直接接觸的環境。血漿不等於完整血液，血液還有血球等有形成分。", "sub": "課本 P17；原PPT第 3 頁", "refs": [{"src": "BOOK2", "cap": "對應完整課本頁"}], "legacyQuestion": 1, "kind": "drag", "slots": [{"id": "g0s0", "label": "血漿", "group": 0}, {"id": "g0s1", "label": "血漿", "group": 0}, {"id": "g1s0", "label": "組織液", "group": 1}, {"id": "g1s1", "label": "組織液", "group": 1}, {"id": "g2s0", "label": "細胞內液", "group": 2}, {"id": "g2s1", "label": "細胞內液", "group": 2}], "pieces": [{"id": "ag0s0", "label": "位於血管內的細胞外液", "group": 0}, {"id": "ag0s1", "label": "隨循環流動，運送溶解物質", "group": 0}, {"id": "ag1s0", "label": "直接圍繞多數組織細胞", "group": 1}, {"id": "ag1s1", "label": "與細胞及血漿交換物質", "group": 1}, {"id": "ag2s0", "label": "位於細胞膜內側", "group": 2}, {"id": "ag2s1", "label": "提供細胞內代謝的液體環境", "group": 2}], "sol": {"g0s0": "ag0s0", "g0s1": "ag0s1", "g1s0": "ag1s0", "g1s1": "ag1s1", "g2s0": "ag2s0", "g2s1": "ag2s1"}, "pre": {}, "id": "b3-c12-q01"}, {"t": "課本圖貼標籤：器官系統間的功能聯繫", "q": "依課本圖1–6，把標籤放回圖上的編號格：各系統名稱，以及箭頭上運送的物質。", "learn": 1, "tag": "integration", "hint": "先用器官圖認出系統；再看箭頭方向：往細胞是運送養分、氧與激素，離開細胞是帶走代謝廢物。", "why": "循環系統居中，把消化吸收的養分、水，呼吸交換的O₂，運往各器官的組織細胞，並帶回激素與新陳代謝廢物；泌尿系統排出水、無機鹽與含氮廢物形成尿液。", "sub": "課本 P16 圖1–6；原PPT第 2 頁", "refs": [{"src": "mk_sys", "cap": "圖1–6（標籤已遮蓋）"}], "kind": "drag", "mask": "mk_sys", "ar": 1.0051, "layout": "side", "slots": [{"id": "s0", "label": "呼吸系統", "group": 0, "x": 65.75, "y": 12.34, "v": false, "w": false}, {"id": "s1", "label": "消化系統", "group": 1, "x": 21.75, "y": 41.21, "v": false, "w": false}, {"id": "s2", "label": "循環系統", "group": 2, "x": 53.81, "y": 41.21, "v": false, "w": false}, {"id": "s3", "label": "泌尿系統", "group": 3, "x": 88.4, "y": 41.21, "v": false, "w": false}, {"id": "s4", "label": "各器官的組織細胞", "group": 4, "x": 53.76, "y": 80.37, "v": false, "w": false}, {"id": "s5", "label": "養分、水", "group": 5, "x": 38.12, "y": 50.99, "v": false, "w": false}, {"id": "s6", "label": "水、無機鹽、新陳代謝廢物", "group": 6, "x": 69.84, "y": 49.75, "v": false, "w": false}, {"id": "s7", "label": "激素、水、養分、O₂", 與副交感以心跳速率為此處比較範圍，不將所有器官作用一概而論。", "sub": "課本 P19；原PPT第 12 頁", "refs": [{"src": "BOOK4", "cap": "對應完整課本頁"}], "legacyQuestion": 3, "kind": "drag", "slots": [{"id": "g0s0", "label": "拮抗", "group": 0}, {"id": "g0s1", "label": "拮抗", "group": 0}, {"id": "g0s2", "label": "拮抗", "group": 0}, {"id": "g1s0", "label": "協同", "group": 1}, {"id": "g1s1", "label": "協同", "group": 1}, {"id": "g1s2", "label": "協同", "group": 1}], "pieces": [{"id": "ag0s0", "label": "對同一變數產生相反方向作用", "group": 0}, {"id": "ag0s1", "label": "胰島素降血糖、升糖素升血糖", "group": 0}, {"id": "ag0s2", "label": "交感加快心跳、副交感減慢心跳", "group": 0}, {"id": "ag1s0", "label": "共同支持同向功能", "group": 1}, {"id": "ag1s1", "label": "腎上腺髓質與皮質共同抗壓", "group": 1}, {"id": "ag1s2", "label": "兩種調節機制都支持血糖上升", "group": 1}], "sol": {"g0s0": "ag0s0", "g0s1": "ag0s1", "g0s2": "ag0s2", "g1s0": "ag1s0", "g1s1": "ag1s1", "g1s2": "ag1s2"}, "pre": {}, "id": "b3-c12-q03"}, {"t": "內在環境：直接接觸細胞的介質", "q": "依本課內在環境概念，下列何者最適當？", "learn": 2, "tag": "environment", "hint": "先問細胞膜的內側還是外側。", "why": "本課以組織液說明細胞直接接觸的內在環境；細胞內液位於細胞膜內，不能混同。", "sub": "課本 P17；原PPT第 3 頁", "refs": [{"src": "PPT03S3", "cap": "教材原圖"}], "legacyQuestion": 4, "kind": "single", "opts": [{"t": "專指細胞內液，永遠不變", "ok": false, "tag": "environment"}, {"t": "組織液圍繞細胞，與血漿同屬細胞外液", "ok": true, "tag": "environment"}, {"t": "多數深部細胞直接與外界空氣交換物質", "ok": false, "tag": "environment"}, {"t": "內在環境完全隨外界溫度線性變化", "ok": false, "tag": "environment"}], "id": "b3-c12-q04"}, {"t": "體溫偏高：辨識回饋閉迴路", "q": "運動後體溫上升，哪一項調節敘述正確？", "learn": 4, "tag": "feedback", "hint": "以原先偏高體溫為刺激，追蹤散熱後的變化。", "why": "皮膚血管擴張及排汗反應促進散熱，降溫結果削弱偏高刺激，屬負回饋。體溫調節的重要中樞為下視丘；不能因看到數值下降就單獨判定負回饋，還須辨識原刺激。", "sub": "課本 P17；原PPT第 5 頁", "refs": [{"src": "PPT05S3", "cap": "教材原圖"}], "legacyQuestion": 5, "kind": "single", "opts": [{"t": "大腦皮質使骨骼肌顫抖，增加產熱", "ok": false, "tag": "feedback"}, {"t": "皮膚血管收縮，增加散熱", "ok": false, "tag": "feedback"}, {"t": "皮膚血管擴張及排汗散熱，削弱偏高刺激", "ok": true, "tag": "feedback"}, {"t": "散熱使偏高刺激增強，屬正回饋", "ok": false, "tag": "feedback"}], "id": "b3-c12-q05"}, {"t": "血糖調節：激素與動器", "q": "關於血糖恆定，下列哪些正確？（選3項）", "learn": 10, "tag": "glucose", "hint": "分開分泌來源、肝臟反應及對血糖的影響。", "why": "前述β細胞、胰島素及肝臟升糖素作用正確。兩激素對血糖效果相反；偏低血糖時升糖素作用使血糖回升，並非增加降糖作用。", "sub": "課本 P19；原PPT第 11 頁", "refs": [{"src": "glucose", "cap": "教材原圖"}], "legacyQuestion": 6, "kind": "multi", "opts": [{"t": "胰島素與升糖素都升血糖，互為協同", "ok": false, "tag": "glucose"}, {"t": "血糖偏高可刺激胰島β細胞分泌胰島素", "ok": true, "tag": "glucose"}, {"t": "血糖偏低時應增加胰島素使血糖更低", "ok": false, "tag": "glucose"}, {"t": "胰島素促進相關組織攝取及肝臟儲存葡萄糖", "ok": true, "tag": "glucose"}, {"t": "升糖素可促進肝臟肝糖分解並釋出葡萄糖", "ok": true, "tag": "glucose"}], "fig": "glucose", "figCaption": "課本原圖", "id": "b3-c12-q06"}, {"t": "回饋比較：方向與生理意義", "q": "下列對回饋的理解哪些正確？（選3項）", "learn": 8, "tag": "feedback", "hint": "正、負表示迴路方向，不是好、壞。", "why": "削弱偏離、體溫與血糖負回饋及分娩正回饋的敘述正確。正回饋放大原刺激，不能用「正常生理」判成負回饋。回饋分類須追蹤完整迴路。", "sub": "課本 P18；原PPT第 9 頁", "refs": [{"src": "PPT09S3", "cap": "教材原圖"}], "legacyQuestion": 7, "kind": "multi", "opts": [{"t": "負回饋結果削弱原先的偏離", "ok": true, "tag": "feedback"}, {"t": "正回饋比負回饋更能使數值穩定收斂", "ok": false, "tag": "feedback"}, {"t": "體溫及血糖恆定常仰賴負回饋", "ok": true, "tag": "feedback"}, {"t": "哺乳射乳一定屬負回饋", "ok": false, "tag": "feedback"}, {"t": "分娩時子宮頸受壓與更強收縮可構成正回饋", "ok": true, "tag": "feedback"}], "id": "b3-c12-q07"}, {"t": "系統合作：運送與調節", "q": "依圖1–8及本節概念，哪些敘述正確？（選3項）", "learn": 14, "tag": "integration", "hint": "圖中央的系統不是彼此隔離的四個盒子。", "why": "神經傳訊、標的細胞及循環運送的敘述正確。激素經血液運送不代表每個細胞都會反應；免疫系統也參與清除與組織環境維持。", "sub": "課本 P20；原PPT第 15 頁", "refs": [{"src": "integration", "cap": "教材原圖"}], "legacyQuestion": 8, "kind": "multi", "opts": [{"t": "免疫系統平時與組織環境維持完全無關", "ok": false, "tag": "integration"}, {"t": "各器官獨立運作，不需要聯繫整合", "ok": false, "tag": "integration"}, {"t": "神經系統可快速傳遞調節訊息", "ok": true, "tag": "integration"}, {"t": "內分泌激素經循環運送，作用取決於標的細胞", "ok": true, "tag": "integration"}, {"t": "循環系統運送氧、養分、激素及部分免疫細胞", "ok": true, "tag": "integration"}], "fig": "integration", "figCaption": "課本原圖", "id": "b3-c12-q08"}, {"t": "課本圖貼標籤：血糖的拮抗調節", "q": "依課本圖1–7，把標籤放回圖上的編號格：血糖偏高與偏低時的刺激、激素與作用結果。", "learn": 9, "tag": "glucose", "hint": "上半是血糖高於正常值，下半是低於正常值；兩側都是負回饋，結果都使血糖回到正常範圍。", "why": "血糖偏高→胰島素→肝臟吸收血糖形成肝糖、細胞利用血糖→降血糖；血糖偏低→升糖素→促進肝糖分解為葡萄糖→升血糖。兩側都是負回饋，胰島素與升糖素效果相反，互為拮抗。", "sub": "課本 P19 圖1–7；原PPT第 11 頁", "refs": [{"src": "mk_glu", "cap": "圖1–7（標籤已遮蓋）"}], "kind": "drag", "mask": "mk_glu", "ar": 2.0973, "layout": "side", "slots": [{"id": "s0", "label": "胰島素", "group": 0, "x": 71.91, "y": 10.11, "v": false, "w": false}, {"id": "s1", "label": "升糖素", "group": 1, "x": 71.91, "y": 87.95, "v": false, "w": false}, {"id": "s2", "label": "降血糖", "group": 2, "x": 94.07, "y": 20.32, "v": false, "w": false}, {"id": "s3", "label": "升血糖", "group": 3, "x": 94.07, "y": 78.16, "v": false, "w": false}, {"id": "s4", "label": "高於正常值範圍", "group": 4, "x": 18.09, "y": 10.11, "v": false, "w": false}, {"id": "s5", "label": "低於正常值範圍", "group": 5, "x": 33.32, "y": 88.05, "v": false, "w": false}, {"id": "s6", "label": "互為拮抗", "group": 6, "x": 94.07, "y": 49.19, "v": false, "w": false}, {"id": "s7", "label": "肝臟吸收血糖形成肝糖", "group": 7, "x": 81.16, "y": 24.76, "v": false, "w": false}, {"id": "s8", "label": "促進肝糖分解為葡萄糖", "group": 8, "x": 81.16, "y": 69.78, "v": false, "w": false}], "pieces": [{"id": "a0", "label": "胰島素", "group": 0}, {"id": "a1", "label": "升糖素", "group": 1}, {"id": "a2", "label": "降血糖", "group": 2}, {"id": "a3", "label": "升血糖", "group": 3}, {"id": "a4", "label": "高於正常值範圍", "group": 4}, {"id": "a5", "label": "低於正常值範圍", "group": 5}, {"id": "a6", "label": "互為拮抗", "group": 6}, {"id": "a7", "label": "肝臟吸收血糖形成肝糖", "group": 7}, {"id": "a8", "label": "促進肝糖分解為葡萄糖", "group": 8}, {"id": "a9", "label": "甲狀腺素", "group": 100}, {"id": "a10", "label": "正回饋", "group": 101}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2", "s3": "a3", "s4": "a4", "s5": "a5", "s6": "a6", "s7": "a7", "s8": "a8"}, "pre": {"s2": "a2"}}, {"t": "一日血糖曲線：證據與限制", "q": "依原曲線和12時、18時用餐條件，逐項判讀。", "learn": 12, "tag": "evidence", "hint": "將圖上可見的證據，和需要額外資料的推論分開。", "why": "原曲線是教材示意；生理調節持續進行，曲線本身不提供激素量或醫學診斷。", "sub": "課本  "opts": [{"t": "若甲激素為胰島素，則乙結果為血糖濃度下降", "ok": true, "tag": "feedback"}, {"t": "若甲激素為升糖素，則乙結果為血糖濃度上升", "ok": true, "tag": "feedback"}, {"t": "乙結果對甲激素正回饋", "ok": false, "tag": "feedback"}, {"t": "乙結果對甲激素負回饋", "ok": true, "tag": "feedback"}, {"t": "甲激素與乙結果互相拮抗", "ok": false, "tag": "feedback"}], "fig": "originalLoop", "figCaption": "原PPT原圖", "originalPPTQuestion": "1", "id": "b3-c12-q12"}, {"t": "原題二(1)：維持血液組成", "q": "右圖甲、乙、丙、丁為系統代號。維持人體血液組成恆定的主要系統為何？", "learn": 16, "tag": "integration", "hint": "由圖中的腎臟及尿液出口辨識系統。", "why": "保留原PPT答案D。丁為泌尿系統，腎臟藉血液過濾及後續處理形成尿液，調節水與溶質。這不表示其他系統對血液組成毫無貢獻。", "sub": "課本 P16；原PPT第 17 頁", "refs": [{"src": "originalSystems", "cap": "教材原圖"}], "kind": "single", "opts": [{"t": "甲", "ok": false, "tag": "integration"}, {"t": "乙", "ok": false, "tag": "integration"}, {"t": "丙", "ok": false, "tag": "integration"}, {"t": "丁", "ok": true, "tag": "integration"}], "fig": "originalSystems", "figCaption": "原PPT原圖", "originalPPTQuestion": "2.1", "id": "b3-c12-q13"}, {"t": "原題二(2)：含氮廢物的來源", "q": "依原題假設：若代謝廢物a為含氮廢物，則其應來自何種分子的代謝？", "learn": 17, "tag": "integration", "hint": "題幹是假設條件；先檢查四種分子是否含氮。", "why": "保留原PPT答案B；蛋白質代謝可產生含氮廢物，核酸也是可能來源，但未列於此題選項。圖a箭頭位於消化道吸收方向，與題幹「代謝廢物a」稱呼不一致；此小題按「若為含氮廢物」的假設分類，不將a的吸收箭頭解釋成排泄。", "sub": "課本 P16；原PPT第 18 頁", "refs": [{"src": "originalSystems", "cap": "教材原圖"}], "kind": "single", "opts": [{"t": "醣類", "ok": false, "tag": "integration"}, {"t": "蛋白質", "ok": true, "tag": "integration"}, {"t": "脂質", "ok": false, "tag": "integration"}, {"t": "礦物質", "ok": false, "tag": "integration"}], "fig": "originalSystems", "figCaption": "原PPT原圖", "originalPPTQuestion": "2.2", "id": "b3-c12-q14"}, {"t": "證據紀錄：曲線支持什麼？", "q": "用原血糖曲線寫下可見證據、機制推論及仍需取得的資料。", "learn": 13, "tag": "evidence", "hint": "用餐條件與曲線趨勢是證據，激素濃度及個人診斷需要更多資料。", "why": "本題保存思考紀錄，不自動判分。", "sub": "課本 P19；原PPT第 14 頁", "refs": [{"src": "curve", "cap": "原PPT13 血糖曲線"}, {"src": "BOOK4", "cap": "課本P19 完整頁"}], "kind": "reflection", "fig": "curve", "reflectionLabel": "你的證據與推論", "reflectionPlaceholder": "可 ，作為繼續調節體溫的依據\n配合課本 \nP18", "9": "◆ \n回饋\n可分為\n負回饋\n與\n正回饋\n1-2.2 \n恆定的維持與調節\n回饋控制\n→ 例如\n：\n體溫升高時，調節的機制最終讓體溫下降\n◇\n 調節方向\n：\n調節的結果\n削弱\n刺激帶來的影響\n◇ 目的\n：\n為使生理狀態維持在某一特定範圍內，使生理\n狀態\n\n更\n趨於穩定\n→ 例如\n：\n人體的\n溫度\n、血糖濃度、無機鹽濃度、激素濃度等\n負回饋\n正回饋\n◇\n 調節方向\n：\n調節的結果\n增強\n刺激帶來的影響\n◇ 詳細機制與實例將在課本 \n4-4\n 內分泌補充說明\n配合課本 \nP18", "10": "1-2.2 \n恆定的維持與調節\n拮抗作用\n◆ 在進行恆定調節時，若不同調節的機制之間互為\n相反\n，稱為\n拮抗作用\n◇ 例如\n：\n胰島素\n可\n刺激肝臟與肌肉吸收血糖，形成肝糖後儲存\n→ \n在「\n血糖濃度\n」的調節上，\n胰島素\n與\n升糖素\n互為\n拮抗\n降低\n血糖濃度\n升糖素\n會\n促進肝糖分解，釋放葡萄糖於血液中\n升高\n血糖濃度\n配合課本 \nP19", "11": "1-2.2 \n恆定的維持與調節\n正常值範圍\n血糖值\n時間\n肝臟吸收血糖形成肝糖\n細胞利用血糖\n高於正常值範圍\n刺激胰島分泌\n胰島素\n降血糖\n互\n為拮抗\n升血糖\n刺激胰島分泌\n升糖素\n刺激肝糖分解為葡萄糖\n促使\n血糖濃度升高\n回到正常值\n低於正常值範圍\n促使\n血糖濃度降低\n回到正常值\n引發負\n回饋\n引發\n負\n回饋\n配合課本 \nP19", "12": "→ \n腎上腺髓質\n和\n腎上腺皮質\n的關係稱為\n協同作用\n1-2.2 \n恆定的維持與調節\n協同作用\n◆ 若不同調節的機制均使生理狀態往\n相同\n方向\n調節，稱為\n協同作用\n◇ 例如\n：\n在面臨壓力時，\n腎上腺髓質分泌激素\n使心跳加快、血壓上升\n、呼吸道擴張，以\n因應短期的壓力\n若壓力時間持續較長，\n腎上腺皮質也會隨之分泌激素\n提高血糖濃度協助抗壓\n配合課本 \nP19", "13": "  \n腦力激盪\n右圖為某成年女性一日血糖的變化，已知她固定在中午\n12\n：\n00 \n和晚上\n18\n：\n00 \n用餐，請查找資料並根據所學判斷她的血糖是否為正常值？哪些時間區間正在進行回饋控制呢？這樣的回饋控制屬於正回饋或負回饋呢？\n配合課本 \nP19\n13", "14": "  \n腦力激盪\n配合課本 \nP19\n14\n答\n：\n健康\n成年人（無糖尿病）的一日血糖會因進食、活動與年齡等因素稍有波動，但只要維持在合理範圍內，就是正常的代謝現象。上搜尋到正常血糖範圍有 \n2 \n種\n：\n①\n \n空腹\n血糖約為\n \n74\n～\n106\n \nmg/\ndL\n②\n 飯後 \n2\n 小時血糖\n：\n應小於 \n140\n \nmg/\ndL\n◆ \n一日血糖變化觀察（某成年女性案例）\n：\n①\n \n0\n～\n13\n \n小時\n：\n未進食時\n,\n血糖在 \n75\n～\n100\n \nmg/\ndL\n 間波動，屬於正常空腹範圍。\n②\n \n12\n \n時後與 \n18\n 時後\n：\n進食午餐與晚餐後\n,\n血糖提高，進入飯後血糖階段，但都未超過 \n140 mg/\ndL\n，保持在健康範圍內。\n③ \n15\n \n時與 \n21\n 時\n：\n飯後血糖達到高峰，體內胰島素開始大量分泌，血糖因此下降，逐漸回歸正常。\n→ 這就是典型的「負回饋調控機制」\n——\n當血糖上升，胰島素發揮作用，將它拉回平衡。", "15": "階段 \n4\n調節失恆狀態\n回到恆定\n階段 \n3\n控制中心藉由各個系統進行調節與修正\n階段 \n2\n體內控制中心接收訊息\n◆ 動物體的恆定\n需\n\n要\n仰賴各個\n器官\n\n的\n合作\n1-2.2 \n恆定的維持與調節\n恆定狀態\n失去恆定\n階段 \n1\n身體感測到\n失恆狀態\n◆ 各器官又需要\n藉\n\n由\n循環系統\n、\n免\n\n疫\n系統\n、\n神經\n系\n\n統\n及\n內分泌\n系統\n\n的\n聯繫與整合\n，\n\n以\n面對內在與\n外\n\n在\n環境的變動\n配合課本 \nP20\n循環系統\n免疫系統\n神經系統\n內分泌系統", "16": "  \nQuestion\n1.\n下列有關右圖的敘述，哪些正確？ \n(A)\n若甲激素為胰島素，則乙結果為血糖濃度下降　\n(B)\n若甲激素為升糖素，則乙結果為血糖濃度上升　\n\n(C)\n乙結果對甲激素正回饋　\n(D)\n乙結果對甲激素負回饋　\n(E)\n甲激素與乙結果互相拮抗。\n解答\n：\n(A)(B)(D)\n解析\n：\n(\nC)\n乙\n結果抑制甲激素，應為負回饋。\n(E)\n拮抗是指兩種激素對同一個生理作用相反，例如\n：\n胰島素可降低血糖濃度，與升糖素功能相反，兩者即為彼此拮抗。\n16", "17": "  \nQuestion\n2.\n右圖為人體各系統之間的相關圖，其中甲、乙、丙、丁為系統代號，\na\n、\nb\n、\nc\n、\nd \n為在此進或出血管的相關物質，則據此回答下列問題\n：\n(1)\n維持人體血液組成恆定的主要系統為何？　\n(A)\n甲\n　\n(B)\n乙\n　\n(\nC)\n丙　\n(D)\n丁。\n(\n2)\n若代謝廢物 \na \n為含氮廢物，則其應來自何種分子的代謝？\n\n(A)\n醣類　\n(B)\n蛋白質　\n(C)\n脂質 \n(D)\n礦物質。\n解\n答\n：\n(\n1)(D)\n；\n(2)(B)\n17", "18": "  \nQuestion\n解析\n：\n(1)\n \n(D)\n藉過濾血液以形成尿液。\n(2)\n \n(B)\n蛋白質與核酸代謝後會產生含氮廢物。\n18"}, "originalCount": 1, "legacyCount": 8, "originalPPTQuestions": {"1": [0, 1, 3], "2.1": [3], "2.2": [1]}, "references": [{"title": "OpenStax：恆定與回饋", "url": "https://openstax.org/books/anatomy-and-physiology-2e/pages/1-5-homeostasis"}, {"title": "NIDDK：血糖檢驗與診斷", "url": "https://www.niddk.nih.gov/health-information/diabetes/overview/tests-diagnosis"}]};

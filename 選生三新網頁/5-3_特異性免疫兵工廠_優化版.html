疫苗\n◇ 發明\n史\n：\n▪\n \n16\n～\n17 \n世紀\n▫ \n用\n天花病人的結痂製成粉末\n，\n來預防天花感染\n▪\n \n1796 \n年，\n英國\n醫師\n簡納\n▫ \n用\n受到牛痘病毒感染者所產生的水泡膿液，來製成天花疫苗\n▫ \n聯合國世界衛生組織\n推動天花撲滅計畫，在 \n1979 \n年宣布澈底撲滅天花\n▪\n \n20 \n世紀時\n疫苗\n在\n臺灣\n，小兒麻痺於\n民國\n \n40\n～\n50 \n年時曾\n為流行高峰，但在廣泛接種疫苗後，小兒麻痺的病例大幅下降，並於\n民國\n \n89 \n年根除。\n配合課本 \nP162", "36": "  \n知識補給站\n現代疫苗技術的發展\n       在\n簡納\n發明疫苗之後，自此開啟了免疫學研究的大門，而現代疫苗的技術則一直\n等到 \n1879\n 年\n由\n法國\n微生物學家\n巴斯德\n發現減毒疫苗的原理後才建立。\n簡納\n配合課本 \nP162\n36", "37": "  \n知識補給站\n現代疫苗技術的發展\n       \n巴斯德\n從患者身上取出病毒母株，將其毒性減弱後進行繁殖，再製作成疫苗注入人體內。\n       這種減毒疫苗的原理目前已廣泛應用在卡介苗、水痘疫苗、德國麻疹疫苗、腮腺炎疫苗等。\n       傳統疫苗可分為\n減毒疫苗\n、\n不活化疫苗\n及\n類毒素疫苗\n三類，現今則已發展出\n基因工程疫苗\n，如\n重組蛋白疫苗\n、\n病毒載體疫苗\n及\n核酸疫苗\n等。\n配合課本 \nP162\n37", "38": "5-3.4 \n免疫記憶性與疫苗\n◇ \n疫苗成分\n：\n▪ 病原體的\n抗原\n▪ 能\n引起\n體內產生\n免疫反應\n的\n物質\n◇ \n原理\n：\n▪ 利用淋巴球的\n專一性\n、\n記憶性\n，產生特定的淋巴球記憶細胞\n▪ 當相同病原體入侵時，記憶細胞能迅速啟動免疫反應\n配合課本 \nP162", "39": "  \n腦力激盪\n　　歷史上\n天花疫情曾造成人類浩劫，但自從人類接種牛痘疫苗後，如今天花已消聲匿跡。牛痘與天花為不同病毒造成的疾病，為何可利用牛痘疫苗預防天花呢？\n配合課本 \nP162\n答\n：\n由於牛痘病毒具有與天花病毒相似的抗原，曾經感染牛痘病毒的人類，其免疫系統因而產生的抗體不僅可針對牛痘病毒，也能有效對抗天花病毒。有效接種者一旦感染天花，免疫系統就可迅速製造針對天花病毒的抗體，以阻止天花病毒進一步入侵身體。不過現時用作天花疫苗的牛痘病毒，和在野外找到的牛痘病毒，其實已經是兩個不同的病毒種類。\n39", "40": "  \n知識補給站\nM \n痘\n病毒（\nMpox\n virus\n）\nM\n痘病毒\n細胞受體蛋白\n吞入\n融合\n釋出\n◆ \n發現\n：\n1958 \n年，首次從研究用猴子身上發現，又稱猴痘\n◆ \n構造\n：\nDNA \n病毒，具套膜\n◆ 感染\n途徑\n：\n人\n畜或人人間接觸傳染，或長時間面對面的飛沫感染\n◆ \n分類\n：\n痘\n病毒科，正痘病毒屬\n透過胞吞作用進入細胞內\n囊泡內環境酸化\n：\n病毒蛋白質殼體改變，並與囊泡膜融合\n病毒核心被釋出到細胞質，開始進行病毒感染週期\n配合課本 \nP163\n40", "41": "  \n知識補給站\nM \n痘病毒\n（\nMpox\n virus\n）\n◇ \n潛伏期\n：\n約 \n6\n～\n13 \n天，此時沒有傳染力\n◇ \n前期\n：\n發燒\n、肌肉痛、淋巴結腫大\n◇ \n出疹\n期\n：\n發燒 \n1\n～\n3 \n天後，開始出現皮膚病灶，此時傳染力最強，持續至全身疹子均結痂脫落為止\n◆ \n疫苗\n：\n接種\n天花疫苗\n預防 \nM \n痘的有效性\n為 \n85\n%\n◆ 疾病\n進程\n：\n配合課本 \nP163\n41", "42": "0\n10\n0\n10\n1\n10\n2\n10\n3\n10\n4\n7\n14\n21\n28\n35\n42\n49\n56\n時間（天）\n血清中抗體的相對濃度\n對 \nA\n 抗原\n的初級免疫反應\n第 \n1\n 次接觸 \nA\n 抗原\n5-3.4 \n免疫記憶性與疫苗\n◆ 人體第一次\n接觸 \nA\n 抗原\n時\n→ 體內會產生\n對抗 \nA\n 抗原\n的專一性免疫反應，稱為初級免疫反應\n配合課本 \nP164", "43": "10\n0\n10\n1\n10\n2\n10\n3\n10\n4\n時間（天）\n血清中抗體的相對濃度\n對 \nA\n 抗原\n的初級免疫反應\n第 \n1\n 次接觸 \nA\n 抗原\n5-3.4 \n免疫記憶性與疫苗\n→ 體內會產生更快速、更強烈且更持久的專一性免疫反應，稱為次級免疫反應\n◆ \n當\n再次遭遇相同\n的 \nA\n 抗原\n時\n第 \n2\n 次接觸 \nA\n 抗原\n對 \nA\n 抗原\n的次級免疫反應\n記憶性\n配合課本 \nP164\n0\n7\n14\n21\n28\n35\n42\n49\n56", "44": "10\n0\n10\n1\n10\n2\n10\n3\n10\n4\n時間（天）\n血清中抗體的相對濃度\n對 \nA\n 抗原\n的初級免疫反應\n第 \n1\n 次接觸 \nA\n 抗原\n5-3.4 \n免疫記憶性與疫苗\n◆ 再次\n接觸 \nA \n抗原的同時，若首次接觸\n到 \nB \n抗原\n→ 對人體\n而言 \nB \n抗原僅能誘發初級免疫反應\n第 \n1\n 次接觸 \nB\n 抗原\n對 \nA\n 抗原\n的次級免疫反應\n對 \nB\n 抗原\n的初級免疫反應\n配合課本 \nP164\n專一性\n0\n7\n14\n21\n28\n35\n42\n49\n56\n第 \n2\n 次接觸 \nA\n 抗原", "45": "▪\n \n例如\n：\n流\n感病毒疫苗需每年施打\n5-3.4 \n免疫記憶性與疫苗\n◆ \n效\n期\n：\n▪ 有些疫苗只要接種一次便可終生免疫無需再施打，但有些疫苗卻得每年重新施打\n每年的二月前後，\n聯合國世界衛生組織\n與全球的流感疫苗專家會根據當年與前幾年全世界的流感病毒株流行狀況，推測北半球下一個流感季節可能流行的病毒株，然後建議全世界的疫苗廠以這些病毒株製造流感疫苗。\n→ 因為每年流行的流感病毒株可能會不一樣，故流感疫苗也必須每年重新評估是否需要更動\n配合課本 \nP164\n疫苗接種\nUP\n群體免疫\n來", "46": "5-3.4 \n免疫記憶性與疫苗\n \n抗體來源\n產生方法\n使用目的\n免疫力的特性\n主動免疫\n被動免疫\n◆ 主動\n免疫 \nvs.\n 被動免疫\n：\n配合課本 \nP164\n自己產生\n外來的\n感染\n、\n\n疫苗\n接種\n免疫血清、母體\n用於預防\n用於治療\n抗體產生慢，有記憶細胞的產生\n抗體獲得快\n，無記憶細胞的產生", "47": "  \n知識補給站\n狂犬病疫苗的預防接種\n　　狂犬病\n是由狂犬病病毒引起\n的\n：\n◆\n \n一種神經性疾病\n◆ \n通常在哺乳類動物之間傳播\n◆ \n會藉由染病動物的唾液、抓傷或咬傷而感染人類\n　　若\n人類暴露於病毒的威脅下，\n例如\n：\n被\n染病的狗或蝙蝠咬傷，除了可施打狂犬病抗體進行\n被動免疫\n，抑制病毒的生長與擴散，亦可施打狂犬病疫苗，誘發人體的\n主動免疫\n。\n配合課本 \nP165\n47\n狂犬病的狂野\nQA", "48": "  \n知識補給站\n狂犬病疫苗的預防接種\n　　為\n何在被狂犬病帶原的動物咬傷後才施打疫苗呢？一般疫苗需提前施打，約經過一個星期的時間作用，才可使人體的免疫系統形成記憶細胞，預防未來可能入侵的病原體。\n　　由於\n狂犬病病毒增生較慢，若不幸被咬傷，病毒感染肌肉細胞後慢慢增生，直到擴散至神經細胞，且由周圍神經系統蔓延至中樞神經系統並感染腦部後才會發病，此過程約\n需 \n2 \n個月的時間，因此若於被咬傷後再施打抗體與疫苗，時間還來得及。\n48\n配合課本 \nP165", "49": "  \n知識補給站\n狂犬病疫苗的預防接種\n　　狂犬病\n疫苗為減毒疫苗，疫苗的製作方法\n從 \n19 \n世紀\n巴斯德\n成功治癒狂犬病患者後便一直延續至今，未再經過改良。因減毒疫苗是使用有活性但毒性減弱的狂犬病病毒製成，施打後有病毒活化或突變、導致疾病重新爆發的可能，因此施打時具有一定的風險，一般不建議貿然施打。\n　　疫苗\n對人類及其他動物都相當有效，犬類接種動物狂犬病疫苗更有助於避免狂犬病傳播給人類，所以現在很多國家和地區皆有要求寵物主人需為寵物犬接種狂犬病疫苗的強制規定。\n配合課本 \nP165\n49", "50": "  \nQuestion\n1. \n下列有關\n輔助 \nT \n細胞\n與胞\n毒 \nT \n細胞\n的功能，哪些正確\n？　\n(\nA)\n胞\n毒 \nT \n細胞\n也參與體液免疫\n作用　\n(\nB)\n輔助 \nT \n細胞\n可與受感染的細胞結合使其\n瓦解　\n(\nC)\n輔助 \nT \n細胞\n分泌的細胞介素可活化胞\n毒 \nT \n細胞　\n(\nD)\n輔助 \nT \n細胞\n可具有免疫記憶\n性　\n(\nE)\n胞\n毒 \nT \n細胞\n主要依賴胞吞作用以清除受感染細胞\n。\n解答\n：\n(\nC\n)(\nD)\n \n解\n析\n：\n(\nA)\n胞\n毒 \nT\n 細胞\n參與細胞媒介免疫，\nB\n 細胞\n參與體液免疫\n。\n(\nB)\n輔助 \nT\n 細胞\n可與抗原呈現細胞呈現的抗原辨認，活化後分泌細胞介素調節免疫\n。\n(\nE)\n胞\n毒 \nT\n 細胞\n主要依賴釋放穿孔蛋白和顆粒酶破壞受感染細胞。\n50", "51": "  \nQuestion\n解答\n：\n(\nC)\n \n2\n. \n右圖\n是人體免疫作用的圖示，就圖中的代號判斷，下列敘述何者正確\n？　\n\n(A)\n甲細胞辨識的抗原與乙細胞受體所辨識的抗原完全\n不同　\n(B)\n此活化過程屬於細胞媒介\n免疫\n\n(C)\n丙為來自甲細胞分化的漿\n細胞　\n(D)\n圖中的物質丁可辨認數種不同抗原。\n51", "52": "  \nQuestion\n解析\n：\n甲\n為 \nB \n細胞，乙為輔助 \nT \n細胞，丙為漿細胞，物質丁為抗體\n。\n(\nA) B \n細胞辨識抗原後，可以將部分抗原呈現給輔助 \nT \n細胞\n。\n(\nB)\n此活化過程屬於體液免疫\n。\n(\nD)\n丁為抗體，單一抗原所活化產生的抗體僅可辨識單一抗原。\n52", "53": "  \nQuestion\n3\n. \n下列有關主要組織相容性\n複合體\n（\nMHC\n）的敘述，何者正確\n？　\n(\nA)\n是一種病原體被吞噬細胞吞噬後殘留在細胞內的構造 \n　\n(\nB)\n可與抗原形成\n抗原\n－\nMHC \n複合體，呈現於細胞膜表面 \n　\n(\nC)\n可將病原體完整呈現於細胞膜\n上　\n(\nD)\n所有的吞噬細胞都可透過 \nMHC \n將抗原呈現給輔助 \nT \n細胞。\n解答\n：\n(\nB)\n \n解析\n：\n(A)\n是一種抗原呈現細胞可合成的膜蛋白\n。\n(C)\n病原體被吞噬分解後，小片段的抗原可與 \nMHC \n結合呈現於細胞膜上\n。\n(D)\n僅有抗原呈現細胞（如巨噬細胞、樹突細胞及 \nB \n細胞）可透過 \nMHC \n將抗原呈現給輔助 \nT \n細胞。\n53"}, "lessons": [{"id": "b3-c53-l01", "t": "第三道防線：細胞與抗體的分工", "sec": "s1", "slide": 1, "sourceSlides": [1, 2, 3], "sourcePages": [1], "src": "原PPT第 1–3 頁；課本 P155–157", "figSpec": {"image": "PPT03S3"}, "txt": "<ul><li>後天性免疫主要由T、B淋巴球參與，具有多樣性、專一性與記憶性。</li><li>細胞媒介免疫由T細胞相關作用執行；體液免疫的重要效應分子是B細胞分化後所產生的抗體。</li><li>第三道不是先天完全停止之後才開始；兩者可重疊並合作。</li></ul><p class=\"think\">同為淋巴球，為何要分成以細胞作用和抗體作用兩條路？</p><div class=\"ex\"><h4>第三道防線</h4><p>病原體突破皮膜屏障與先天性免疫後，由<b>淋巴球</b>啟動的<b>後天性（特異性）免疫</b>。特色是專一、多樣、有記憶。</p></div><div class=\"ex\"><h4>兩條路徑</h4><ul><li><b>細胞媒介免疫</b>：T細胞直接作用於受感染細胞。</li><li><b>體液免疫</b>：B細胞分化的漿細胞分泌抗體，在體液中作用。</li></ul></div><div class=\"ex\"><h4>先抓分工</h4><p>T細胞管「細胞」，抗體管「體液中的抗原」；輔助T細胞則兩邊都要協調。</p></div>", "tb": [["BOOK1", "P155 完整課本頁"]]}, {"id": "b3-c53-l02", "t": "抗原來源：外來物不等於完整病原", "sec": "s1", "slide": 4, "sourceSlides": [4], "sourcePages": [], "src": "原PPT第 4 頁；課本 P155–157", "figSpec": {"image": "antigens"}, "txt": "<ul><li>病原體、毒素、花粉等都可能提供抗原；可涉及多種分子成分。</li><li>B細胞受體可以直接辨識抗原的特定部位；本節常規T細胞模型辨識的是肽段與MHC的複合體。</li><li>不能把「抗原」只理解成整隻細菌，也不能把每一種抗原都當成具有同一種活化方式。</li></ul><p class=\"think\">B與T細胞都具專一性，是否表示它們看到的抗原形式相同？</p><div class=\"scope-note\">原文「與T細胞受體結合」是概括說法；以下按教材的肽段–MHC模型限定。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK26926/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>抗原</h4><p>能被淋巴球的受體或抗體專一辨識，並引發免疫反應的物質，多為蛋白質、多醣等大分子。</p></div><div class=\"ex\"><h4>來源</h4><ul><li>病原體表面或其產物（細菌、病毒、毒素）。</li><li>花粉、異體組織、移植器官等外來物。</li><li>自身異常細胞（如癌細胞）的異常分子。</li></ul></div><div class=\"ex\"><h4>小提醒</h4><p>淋巴球辨識的是病原體上的<b>一小段結構（表位）</b>，不是整個病原體。</p></div>", "tb": []}, {"id": "b3-c53-l03", "t": "抗原處理：攝入、切割與呈現", "sec": "s1", "slide": 5, "sourceSlides": [5, 6], "sourcePages": [2], "src": "原PPT第 5–6 頁；課本 P155–157", "figSpec": {"image": "presentation"}, "txt": "<ul><li>病原進入細胞後被酵素分解，產生抗原片段。</li><li>MHC是宿主的呈現分子；與片段結合後顯示在細胞表面。</li><li>碎片排出與抗原呈現是不同箭頭，不能把排出碎片當成T細胞看到的全部訊息。</li><li>巨噬、樹突及B細胞是重要的專業抗原呈現細胞；樹突細胞原本即具有呈現能力。</li></ul><p class=\"think\">MHC是病原留下的殘骸，還是宿主用來呈現的分子？</p><div class=\"scope-note\">「轉變成APC」在原圖指呈現中的功能狀態，不是生成新細胞類型。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK26926/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>抗原呈現細胞（APC）</h4><p>巨噬細胞、樹突細胞與B細胞等，能攝入抗原、處理後呈現給T細胞。</p></div><div class=\"ex\"><h4>步驟</h4><ul><li><b>攝入</b>：以吞噬或胞吞攝入病原體。</li><li><b>切割</b>：在細胞內分解成小片段。</li><li><b>結合</b>：片段與<b>MHC</b>分子結合。</li><li><b>呈現</b>：抗原－MHC複合體運送到細胞膜表面。</li></ul></div><div class=\"ex\"><h4>重點</h4><p>T細胞看到的是「片段＋MHC」，不是完整病原體。</p></div>", "tb": [["BOOK2", "P156 完整課本頁"]]}, {"id": "b3-c53-l04", "t": "T細胞活化：辨識之外還要訊號", "sec": "s1", "slide": 7, "sourceSlides": [7], "sourcePages": [3], "src": "原PPT第 7 頁；課本 P155–157", "figSpec": {"image": "helper"}, "txt": "<ul><li>特定輔助T細胞辨識APC表面抗原–MHC複合體。</li><li>教材以細胞介素表示活化與調節訊號，不應簡化成看見抗原就一定完成活化。</li><li>初始T細胞活化亦涉及共同刺激；抗原辨識、共同刺激與細胞激素各有角色。</li></ul><p class=\"think\">如果只有受體結合，為何不能保證完整活化？</p><div class=\"scope-note\">共同刺激是補充範圍；原圖只畫部分訊號，不必把全部未畫成分當成不存在。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK26827/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>T細胞活化</h4><p>T細胞受體辨識抗原－MHC複合體，是活化的第一步；還需要<b>共同刺激訊號</b>與<b>細胞介素</b>。</p></div><div class=\"ex\"><h4>兩個條件</h4><ul><li>專一辨識：受體與抗原－MHC相符。</li><li>額外訊號：沒有第二訊號，活化不完整。</li></ul></div><div class=\"ex\"><h4>為什麼要多一道關卡</h4><p>避免單憑一次辨識就啟動強烈免疫，降低誤傷自身的風險。</p></div>", "tb": [["BOOK3", "P157 完整課本頁"]]}, {"id": "b3-c53-l05", "t": "輔助T：擴增、協調與留下記憶", "sec": "s1", "slide": 8, "sourceSlides": [8, 9, 10], "sourcePages": [], "src": "原PPT第 8–10 頁；課本 P155–157", "figSpec": {"image": "helper"}, "txt": "<ul><li>活化後T細胞增生，其中一些形成記憶細胞。</li><li>輔助T細胞藉細胞介素等訊號協助胞毒T、B細胞相關反應。</li><li>記憶TH再次遇到相符抗原可更迅速反應；不是所有T細胞都分泌抗體。</li><li>細胞介素是多種訊號的統稱，不能把每個訊號、受體與效應都當成相同。</li></ul><p class=\"think\">輔助T細胞多了，和血中某一抗體多了，為何不是同一種量？</p><div class=\"ex\"><h4>輔助T細胞（TH）</h4><p>辨識APC上與MHC II結合的抗原後活化、增生，並分泌<b>細胞介素</b>。</p></div><div class=\"ex\"><h4>作用</h4><ul><li>促進自身與其他TH細胞增生。</li><li>活化<b>胞毒T細胞</b>（細胞媒介免疫）。</li><li>協助<b>B細胞</b>活化分化（體液免疫）。</li><li>部分分化為<b>記憶T細胞</b>。</li></ul></div><div class=\"ex\"><h4>角色</h4><p>TH不直接殺病原體，是免疫反應的「指揮協調者」。</p></div>", "tb": []}, {"id": "b3-c53-l06", "t": "MHC兩型：呈現對象不同", "sec": "s1", "slide": 11, "sourceSlides": [11], "sourcePages": [], "src": "原PPT第 11 頁；課本 P155–157", "figSpec": {"image": "PPT11S3"}, "txt": "<ul><li>本節模型：MHC I廣泛見於具核細胞，對應胞毒T細胞；MHC II主要見於專業APC，對應輔助T細胞。</li><li>被感染或異常細胞可呈現內部來源片段，供效應胞毒T辨識。</li><li>B細胞能作APC，但不是所有吞噬細胞在任何狀態下都同樣擅長活化初始T。</li><li>成熟哺乳類紅血球無核，不能套入「所有細胞都一樣表現」的全稱說法。</li></ul><p class=\"think\">為何辨認胞毒T標的時，不能只看到「MHC」就忽略分子類型？</p><div class=\"scope-note\">原文「MHC II僅APC」為入門模型；主要分布與誘導性表現應分清。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK26926/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>MHC 的兩型</h4><p>MHC是宿主細胞自己合成的膜蛋白，負責把抗原片段送到細胞膜表面。</p></div><div class=\"ex\"><h4>比較</h4><ul><li><b>MHC I</b>：幾乎所有有核細胞都有；呈現給<b>胞毒T細胞</b>。</li><li><b>MHC II</b>：主要在抗原呈現細胞；呈現給<b>輔助T細胞</b>。</li></ul></div><div class=\"ex\"><h4>口訣</h4><p>I 對 TC（胞毒）、II 對 TH（輔助）。</p></div>", "tb": []}, {"id": "b3-c53-l07", "t": "胞毒T：先分初始活化與效應辨識", "sec": "s2", "slide": 12, "sourceSlides": [12], "sourcePages": [4], "src": "原PPT第 12 頁；課本 P158", "figSpec": {"image": "cytotoxic"}, "txt": "<ul><li>原圖把受感染細胞的抗原–MHC辨識與輔助T的細胞介素並列。</li><li>感染細胞可成為已活化胞毒T的標的；初始CD8 T活化通常需專業APC與共同刺激。</li><li>所以不能由原圖推成任何受感染細胞都能獨自活化初始胞毒T。</li></ul><p class=\"think\">活化一群新兵，與效應細胞找到標的，是同一情境嗎？</p><div class=\"scope-note\">這是原圖適用情境的補充，保留原文與流程。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK26926/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a>；<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK26827/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>胞毒T細胞（TC）</h4><p>專門對付被感染的細胞或癌細胞，負責細胞媒介免疫。</p></div><div class=\"ex\"><h4>兩階段</h4><ul><li><b>初始活化</b>：辨識APC或受感染細胞上的抗原－MHC I，並接受TH的細胞介素協助。</li><li><b>效應作用</b>：活化後辨識目標細胞的抗原－MHC I，進行攻擊。</li></ul></div><div class=\"ex\"><h4>注意</h4><p>胞毒T不是吞噬者，它是用「釋放物質」殺細胞。</p></div>", "tb": [["BOOK4", "P158 完整課本頁"]]}, {"id": "b3-c53-l08", "t": "胞毒T擴增：效應與記憶分支", "sec": "s2", "slide": 13, "sourceSlides": [13, 16], "sourcePages": [], "src": "原PPT第 13–16 頁；課本 P158", "figSpec": {"image": "cytotoxic"}, "txt": "<ul><li>活化的特定胞毒T可增生，形成具效應的群體與記憶細胞。</li><li>克隆擴增是相符細胞數量增加，不是每個細胞臨時改造受體去配合所有抗原。</li><li>再次遇到相符抗原，記憶胞毒T可較快反應。</li></ul><p class=\"think\">數量增加與辨識範圍擴大，為何不能畫成同一箭頭？</p><div class=\"ex\"><h4>活化後的分支</h4><p>TC活化後快速<b>增生</b>，產生大量相同專一性的細胞。</p></div><div class=\"ex\"><h4>兩種後代</h4><ul><li><b>效應TC</b>：執行攻擊，壽命較短。</li><li><b>記憶TC</b>：留存體內，再次遇到相同抗原時反應更快。</li></ul></div><div class=\"ex\"><h4>對應</h4><p>「增生」是選擇擴增，「記憶」是留種備用。</p></div>", "tb": []}, {"id": "b3-c53-l09", "t": "胞毒T效應：穿孔蛋白與顆粒酶", "sec": "s2", "slide": 14, "sourceSlides": [14, 15], "sourcePages": [], "src": "原PPT第 14–15 頁；課本 P158", "figSpec": {"image": "cytotoxic"}, "txt": "<ul><li>胞毒T與適合的標的接合，釋出穿孔蛋白與顆粒酶。</li><li>穿孔蛋白協助顆粒酶作用，顆粒酶可啟動細胞凋亡。</li><li>主要目標是受感染、癌化或外來移植相關宿主細胞，不是把胞毒T畫成吞噬細菌的巨噬細胞。</li><li>凋亡常有助限制組織損傷，但不能保證任何免疫反應都完全無發炎或副作用。</li></ul><p class=\"think\">清除被感染的宿主細胞，與中和細胞外病毒，有何不同？</p><div class=\"ex\"><h4>殺傷方式</h4><p>效應TC結合目標細胞後，釋放兩類蛋白質。</p></div><div class=\"ex\"><h4>步驟</h4><ul><li><b>穿孔蛋白</b>：在目標細胞膜上形成孔洞。</li><li><b>顆粒酶</b>：經孔洞進入，誘導目標細胞凋亡。</li></ul></div><div class=\"ex\"><h4>結果</h4><p>被感染細胞死亡，病毒失去複製場所；TC可繼續尋找下一個目標。</p></div>", "tb": []}, {"id": "b3-c53-l10", "t": "B細胞辨識：選中相符的一群", "sec": "s3", "slide": 17, "sourceSlides": [17], "sourcePages": [5], "src": "原PPT第 17 頁；課本 P159–161", "figSpec": {"image": "bcell"}, "txt": "<ul><li>體內不同B細胞具有不同受體；抗原與其中相符受體結合。</li><li>B受體可接觸天然抗原；T受體在本節模型讀取肽段–MHC。</li><li>選中相符B細胞，不代表當場已生成大量抗體或所有B細胞都被同樣活化。</li></ul><p class=\"think\">抗原進入前是否就有多種B細胞受體，還是抗原替所有細胞指定同一受體？</p><div class=\"ex\"><h4>B細胞辨識</h4><p>每個B細胞膜上有大量同一種<b>抗體型的受體</b>，能直接辨識天然狀態的抗原。</p></div><div class=\"ex\"><h4>流程</h4><ul><li>抗原與相符的B細胞受體結合（選中這一群）。</li><li>B細胞攝入抗原、處理並以MHC II呈現。</li><li>接受TH協助後活化、增生。</li></ul></div><div class=\"ex\"><h4>克隆選擇</h4><p>不是抗原「教」B細胞產生抗體，而是從原有多樣的B細胞中<b>選出相符者</b>擴增。</p></div>", "tb": [["BOOK5", "P159 完整課本頁"]]}, {"id": "b3-c53-l11", "t": "B與TH協作：同來源不必同表位", "sec": "s3", "slide": 18, "sourceSlides": [18, 19], "sourcePages": [], "src": "原PPT第 18–19 頁；課本 P159–161", "figSpec": {"image": "bcell"}, "txt": "<ul><li>B細胞攝入抗原、處理後經MHC II呈現肽段。</li><li>相符的輔助T辨識呈現的訊息，提供協助B細胞活化的訊號。</li><li>B受體與T受體可辨識同一來源抗原的不同形式與部位；不是「完全不同來源」也不是「必定完全相同表位」。</li><li>教材描繪依賴T細胞的蛋白抗原路徑；不是所有B反應都同樣依賴T細胞。</li></ul><p class=\"think\">為何B細胞先結合抗原，又需要把部分片段呈現出來？</p><div class=\"scope-note\">連結辨識與共同刺激是機制補充，原圖流程保留。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK26827/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>B與TH的合作</h4><p>B細胞呈現抗原－MHC II，由已活化的TH辨識，TH分泌細胞介素協助B細胞活化。</p></div><div class=\"ex\"><h4>要點</h4><ul><li>TH與B細胞辨識的是<b>同一病原來源</b>的抗原。</li><li>兩者辨識的表位<b>不一定相同</b>：B辨識天然抗原，TH辨識處理後的肽段。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>「同來源」不等於「同一個表位」。</p></div>", "tb": []}, {"id": "b3-c53-l12", "t": "漿細胞與記憶B：分工不是互換", "sec": "s3", "slide": 20, "sourceSlides": [20, 23], "sourcePages": [], "src": "原PPT第 20–23 頁；課本 P159–161", "figSpec": {"image": "bcell"}, "txt": "<ul><li>活化B細胞擴增後，可形成漿細胞與記憶B細胞。</li><li>漿細胞大量分泌抗體；記憶B細胞可在再次接觸相符抗原時迅速擴增、分化。</li><li>抗體是蛋白質，不能直接變成記憶細胞；記憶B也不能與所有長期分泌抗體的漿細胞混為一談。</li></ul><p class=\"think\">持續存在的抗體與持續存在的記憶B細胞，為何是不同觀察指標？</p><div class=\"scope-note\"><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK27158/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>B細胞的兩種後代</h4><p>活化增生後的B細胞分化為兩群。</p></div><div class=\"ex\"><h4>分工</h4><ul><li><b>漿細胞</b>：大量合成並分泌抗體，是抗體工廠，壽命較短。</li><li><b>記憶B細胞</b>：長期存在，再次遇到相同抗原時迅速增生分化。</li></ul></div><div class=\"ex\"><h4>不能互換</h4><p>漿細胞負責「現在」的抗體供應，記憶B細胞負責「未來」的快速反應。</p></div>", "tb": []}, {"id": "b3-c53-l13", "t": "抗體四效應：結合不等於吞噬", "sec": "s3", "slide": 21, "sourceSlides": [21, 22], "sourcePages": [6], "src": "原PPT第 21–22 頁；課本 P159–161", "figSpec": {"image": "antibody"}, "txt": "<ul><li>中和：與病毒或毒素結合，降低感染或毒性作用。</li><li>凝集：多個病原被交聯；沉澱：可溶性抗原形成複合體。</li><li>增強吞噬：抗體包覆可使吞噬者更容易辨識與攝入；抗體本身不會長出偽足。</li><li>有些抗體亦可連結補體；不是每一類抗體、每個效應都完全相同。</li></ul><p class=\"think\">病原聚成一團與病原膜被裂解，是否是同一機制？</p><div class=\"ex\"><h4>抗體的作用</h4><p>抗體是Y形蛋白質，能專一結合抗原，但本身不直接吞噬或殺死病原體。</p></div><div class=\"ex\"><h4>四種效應</h4><ul><li><b>中和</b>：結合毒素或病毒，使其無法作用或感染細胞。</li><li><b>凝集</b>：使病原體聚集成團，利於清除。</li><li><b>促進吞噬</b>：標記病原體，讓吞噬細胞更易吞噬。</li><li><b>活化補體</b>：引發補體作用破壞病原體。</li></ul></div><div class=\"ex\"><h4>一句話</h4><p>抗體負責「結合與標記」，清除多由其他免疫成員完成。</p></div>", "tb": [["BOOK6", "P160 完整課本頁"]]}, {"id": "b3-c53-l14", "t": "兩條路比較：看效應者與標的", "sec": "s3", "slide": 24, "sourceSlides": [24], "sourcePages": [], "src": "原PPT第 24 頁；課本 P159–161", "figSpec": {"image": "PPT24S3"}, "txt": "<ul><li>體液免疫的重要效應者是抗體，常作用於細胞外可及的抗原。</li><li>細胞媒介免疫重要效應者包括胞毒T，對適合的宿主細胞標的作用。</li><li>兩者均有專一性與記憶，亦可由輔助T協調。</li><li>不能把「B細胞屬體液」推成B完全不參與細胞間呈現與協作。</li></ul><p class=\"think\">同樣防禦病毒，在哪個空間、由哪一效應者工作？</p><div class=\"ex\"><h4>細胞媒介 vs 體液免疫</h4><p>比較時抓住兩點：<b>效應者</b>與<b>標的</b>。</p></div><div class=\"ex\"><h4>比較</h4><ul><li><b>細胞媒介</b>：效應者是TC；標的是受感染細胞、癌細胞、移植細胞。</li><li><b>體液</b>：效應者是抗體；標的是體液中的抗原與胞外病原體。</li><li>兩者都需要<b>TH</b>協助。</li></ul></div><div class=\"ex\"><h4>補充</h4><p>病毒在細胞外時由抗體對付，進入細胞後由TC對付。</p></div>", "tb": []}, {"id": "b3-c53-l15", "t": "黏膜取樣：M細胞把訊息送到下方", "sec": "s3", "slide": 25, "sourceSlides": [25, 26], "sourcePages": [7], "src": "原PPT第 25–26 頁；課本 P159–161", "figSpec": {"image": "mucosa"}, "txt": "<ul><li>M細胞將腸腔材料攝入並跨上皮轉送；APC再處理與呈現給T細胞。</li><li>原圖1–2為攝入與胞吐，3為抗原呈現，這些箭頭不能互換。</li><li>M細胞是特殊上皮細胞，不是專門分泌大量抗體的漿細胞。</li><li>這是腸道相關淋巴組織模型，不代表所有黏膜每一處都均勻有同一構造。</li></ul><p class=\"think\">抗原從腸腔進入與抗體回到腸腔，方向與目的相同嗎？</p><div class=\"scope-note\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/9612256/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>黏膜免疫的入口</h4><p>腸道等黏膜表面面積大、接觸外界多，需要專門的偵測機制。</p></div><div class=\"ex\"><h4>M細胞</h4><ul><li>位於腸道黏膜上皮，將腸腔中的抗原<b>運送到上皮下方</b>。</li><li>下方有淋巴球與抗原呈現細胞，接收訊息啟動免疫。</li></ul></div><div class=\"ex\"><h4>比喻</h4><p>M細胞像是「取樣窗口」，把腸腔內的樣本交給下方的免疫細胞。</p></div>", "tb": [["BOOK7", "P161 完整課本頁"]]}, {"id": "b3-c53-l16", "t": "黏膜回應：抗體由下方向腸腔", "sec": "s3", "slide": 27, "sourceSlides": [27, 28], "sourcePages": [], "src": "原PPT第 27–28 頁；課本 P159–161", "figSpec": {"image": "mucosa"}, "txt": "<ul><li>原圖4–6：TH訊號、B活化與漿細胞形成；7–8：抗體跨上皮轉運後與抗原作用。</li><li>漿細胞在下方分泌抗體，上皮負責轉運；兩者不是同一細胞。</li><li>先天清除與後天抗體可以互相協作。</li><li>原「約70%在黏膜」是教材概括，不據此當作任何人的固定比例或直接測量值。</li></ul><p class=\"think\">轉運抗體的上皮細胞，是否因此就是抗體的合成者？</p><div class=\"scope-note\">黏膜抗體的重要代表為分泌型IgA；比例、分布與反應隨部位及狀態不同。<a href=\"https://www.ncbi.nlm.nih.gov/books/NBK6628/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>黏膜回應</h4><p>B細胞活化後分化為漿細胞，所分泌的抗體（主要為<b>IgA</b>）被運送穿過上皮，進入腸腔。</p></div><div class=\"ex\"><h4>特點</h4><ul><li>抗體由下方向<b>腸腔</b>釋出。</li><li>在黏膜表面結合抗原，阻止病原體附著與入侵。</li></ul></div><div class=\"ex\"><h4>意義</h4><p>黏膜是病原體最常入侵的入口，先在這裡攔截最有效率。</p></div>", "tb": []}, {"id": "b3-c53-l17", "t": "多樣性：先有多種，後選中特定", "sec": "s4", "slide": 29, "sourceSlides": [29, 30], "sourcePages": [], "src": "原PPT第 29–30 頁；課本 P162–165", "figSpec": {"image": "PPT30S3"}, "txt": "<ul><li>不同淋巴球的受體多樣，為辨識不同抗原提供基礎。</li><li>相符抗原選擇及擴增適合的一群，並非一個細胞可同時辨識所有病原。</li><li>多樣性描述整體受體組合，專一性描述特定受體的結合範圍。</li></ul><p class=\"think\">整個班會多種語言，是否表示每一個人都會全部語言？</p><div class=\"ex\"><h4>多樣性</h4><p>人體淋巴球的抗原受體種類極多，足以辨識各種可能的抗原。</p></div><div class=\"ex\"><h4>順序</h4><ul><li><b>先有多種</b>：抗原出現前，已有各式各樣的淋巴球存在。</li><li><b>後選中特定</b>：抗原只選擇受體相符的那群去增生。</li></ul></div><div class=\"ex\"><h4>誤區</h4><p>抗原不會「改造」淋巴球去配合它。</p></div>", "tb": []}, {"id": "b3-c53-l18", "t": "專一性：辨識也容許交叉反應", "sec": "s4", "slide": 31, "sourceSlides": [31, 32], "sourcePages": [], "src": "原PPT第 31–32 頁；課本 P162–165", "figSpec": {"image": "PPT32S3"}, "txt": "<ul><li>特定T受體在本節辨識相符肽段–MHC；特定抗體與相符抗原部位結合。</li><li>「有專一性」不是「永遠絕不與任何相似抗原交叉反應」。</li><li>抗體圖形可協助理解配對，但不當作分子實際尺度與全部化學特性的測量。</li></ul><p class=\"think\">相似抗原引起交叉反應，是否必然推翻所有專一性？</p><div class=\"scope-note\">配合牛痘／天花原討論題理解交叉保護；不把簡化配對圖推為一對一的絕對定律。</div><div class=\"ex\"><h4>專一性</h4><p>一種淋巴球受體或抗體通常只辨識特定的抗原表位。</p></div><div class=\"ex\"><h4>補充</h4><ul><li>專一性不是絕對；結構相似的表位可能發生<b>交叉反應</b>。</li><li>這也是某些疫苗能提供部分跨保護的基礎。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>「一種抗體對一種抗原」是方便理解的簡化。</p></div>", "tb": []}, {"id": "b3-c53-l19", "t": "免疫記憶：回應更快但有適用範圍", "sec": "s4", "slide": 33, "sourceSlides": [33, 34], "sourcePages": [8], "src": "原PPT第 33–34 頁；課本 P162–165", "figSpec": {"image": "PPT34S3"}, "txt": "<ul><li>部分T、B細胞成為記憶群體，再遇到相符抗原時可更快反應。</li><li>抗體反應可更強且持久，但程度受抗原、時間與個體等條件影響。</li><li>記憶B、記憶T與長壽命漿細胞共同涉及長期防禦，不能只問「血中抗體此刻多不多」。</li></ul><p class=\"think\">第二次遇到另一個完全無關抗原，能否直接叫做它的次級反應？</p><div class=\"scope-note\"><a href=\"https://www.ncbi.nlm.nih.gov/books/NBK27158/\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>免疫記憶</h4><p>記憶B與記憶T細胞讓再次接觸同一抗原時，反應更快、更強、更持久。</p></div><div class=\"ex\"><h4>範圍</h4><ul><li>記憶針對的是<b>特定抗原</b>。</li><li>抗原變異後，原有記憶可能保護不足。</li><li>保護時間因疾病與疫苗而異。</li></ul></div><div class=\"ex\"><h4>結論</h4><p>記憶不是萬能，它對「相同或相似的抗原」才有效。</p></div>", "tb": [["BOOK8", "P162 完整課本頁"]]}, {"id": "b3-c53-l20", "t": "疫苗史：證據、時間與地域", "sec": "s4", "slide": 35, "sourceSlides": [35], "sourcePages": [], "src": "原PPT第 35 頁；課本 P162–165", "figSpec": {"image": "jenner"}, "txt": "<ul><li>原教材記錄1796年簡納與牛痘／天花故事；人痘接種史不可當作今日實作活動。</li><li>天花根除：1979年專家委員會完成認證，1980年世界衛生大會正式宣布。</li><li>臺灣2000年小兒麻痺消除成就是地域性結果，不能推成世界已無野生小兒麻痺病毒。</li></ul><p class=\"think\">認證與正式宣布為何可有不同年份？</p><div class=\"scope-note\">保留原1979年敘述並區分事件。<a href=\"https://www.who.int/news-room/detail/13-12-2019-who-commemorates-the-40th-anniversary-of-smallpox-eradication\" target=\"_blank\" rel=\"noopener noreferrer\">WHO 天花根除歷史</a>；<a href=\"https://www.cdc.gov/mmwr/preview/mmwrhtml/mm5001a1.htm\" target=\"_blank\" rel=\"noopener noreferrer\">CDC 西太平洋2000年認證</a></div><div class=\"ex\"><h4>疫苗發展史</h4><p>疫苗概念來自對感染後獲得保護的觀察。</p></div><div class=\"ex\"><h4>里程碑</h4><ul><li><b>1796 年</b>：英國的<b>詹納（Jenner）</b>發現接種牛痘可預防天花。</li><li><b>1879 年</b>：法國的<b>巴斯德（Pasteur）</b>發展減毒疫苗的概念。</li><li>天花後來被世界衛生組織宣布已被根除。</li></ul></div><div class=\"ex\"><h4>重點</h4><p>這些發現建立在觀察與實驗證據上，並非一次定案。</p></div>", "tb": []}, {"id": "b3-c53-l21", "t": "疫苗種類：病原不全是病毒", "sec": "s4", "slide": 36, "sourceSlides": [36, 37], "sourcePages": [], "src": "原PPT第 36–37 頁；課本 P162–165", "figSpec": {"image": "PPT37S3"}, "txt": "<ul><li>傳統可分減毒、不活化及類毒素等；現代亦有重組蛋白、載體與核酸等平台。</li><li>減毒不等於不活化；類毒素針對毒素抗原，而非把整隻病原當成相同成分。</li><li>巴斯德相關減毒史包括雞霍亂細菌；卡介苗亦是細菌性疫苗，不能概括每種疫苗都取病毒母株。</li><li>疫苗提供抗原或引導產生抗原的資訊，平台與適用範圍需分清。</li></ul><p class=\"think\">若看到「減毒」二字，就判定所有疫苗都是減毒病毒，漏掉了什麼？</p><div class=\"scope-note\">原文概括「病毒母株」須限定。<a href=\"https://www.pasteur.fr/en/whats-new/latest-news/features/louis-pasteur-universal-legacy\" target=\"_blank\" rel=\"noopener noreferrer\">Institut Pasteur 歷史資料</a>；<a href=\"https://www.cdc.gov/pinkbook/hcp/table-of-contents/chapter-1-principles-of-vaccination.html\" target=\"_blank\" rel=\"noopener noreferrer\">CDC 疫苗原理</a></div><div class=\"ex\"><h4>疫苗的種類</h4><p>疫苗的目的是讓免疫系統接觸抗原卻不致病。</p></div><div class=\"ex\"><h4>常見類型</h4><ul><li><b>減毒疫苗</b>：活的但毒性減弱的病原。</li><li><b>不活化疫苗</b>：殺死的病原。</li><li><b>類毒素疫苗</b>：失去毒性但保留抗原性的毒素。</li><li><b>基因工程疫苗</b>：只用病原的特定抗原成分。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>病原不全是病毒，也包括細菌與其毒素。</p></div>", "tb": []}, {"id": "b3-c53-l22", "t": "疫苗原理：讓自身形成反應與記憶", "sec": "s4", "slide": 38, "sourceSlides": [38], "sourcePages": [], "src": "原PPT第 38 頁；課本 P162–165", "figSpec": {"image": "PPT38S3"}, "txt": "<ul><li>疫苗刺激自身主動反應，形成相符的效應與記憶。</li><li>保護效果與持續時間會受抗原變化、免疫反應衰減及其他條件影響。</li><li>不能把疫苗定義成外來現成抗體，也不能保證每種疫苗一次接種即終生免疫。</li></ul><p class=\"think\">血清帶來現成抗體與疫苗誘發自身反應，起效與記憶為何不同？</p><div class=\"scope-note\"><a href=\"https://www.cdc.gov/pinkbook/hcp/table-of-contents/chapter-1-principles-of-vaccination.html\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>疫苗原理</h4><p>接種疫苗是讓身體<b>自己</b>產生免疫反應與記憶。</p></div><div class=\"ex\"><h4>過程</h4><ul><li>疫苗提供抗原，引發初級免疫反應。</li><li>產生抗體與記憶細胞。</li><li>日後遇到真病原，發生更快更強的次級免疫反應。</li></ul></div><div class=\"ex\"><h4>關鍵</h4><p>疫苗給的是「抗原」，不是現成的抗體。</p></div>", "tb": []}, {"id": "b3-c53-l23", "t": "腦力激盪：牛痘為何能交叉保護？", "sec": "s4", "slide": 39, "sourceSlides": [39], "sourcePages": [], "src": "原PPT第 39 頁；課本 P162–165", "figSpec": {"image": "PPT39S3"}, "txt": "<ul><li>保留原腦力激盪題與原答，核心是相關病毒間存在相似抗原。</li><li>牛痘與天花不是同一病毒，交叉反應不表示任何病毒之間都能交叉保護。</li><li>原答亦提醒疫苗使用株與野外牛痘病毒分類不同；不要把名稱相似當成完全相同。</li></ul><p class=\"think\">如何同時說明「專一性」與「相似抗原的交叉反應」？</p><div class=\"ex\"><h4>腦力激盪：牛痘與天花</h4><p>牛痘病毒與天花病毒的抗原結構相似。</p></div><div class=\"ex\"><h4>推理</h4><ul><li>接種牛痘後產生針對牛痘抗原的抗體與記憶細胞。</li><li>這些抗體或細胞也能辨識結構相似的天花抗原（<b>交叉反應</b>）。</li><li>因此牛痘能提供對天花的保護。</li></ul></div><div class=\"ex\"><h4>連結</h4><p>這正是前面「專一性並非絕對」的實例。</p></div>", "tb": []}, {"id": "b3-c53-l24", "t": "M痘入胞：原圖是一條示意路徑", "sec": "s4", "slide": 40, "sourceSlides": [40], "sourcePages": [9], "src": "原PPT第 40 頁；課本 P162–165", "figSpec": {"image": "mpox"}, "txt": "<ul><li>原圖標示DNA病毒、套膜及正痘病毒屬。</li><li>示意受體結合、吞入、囊泡變化、融合與核心釋出到細胞質。</li><li>圖是感染機制模型；不能只從圖推成所有痘病毒在所有細胞都只有同一入胞路徑。</li></ul><p class=\"think\">入胞方向的箭頭，能否單獨證明何時具有人際傳染力？</p><div class=\"scope-note\">來源校正：原文「潛伏期沒有傳染力」過度絕對。CDC記錄部分clade II感染者可能在症狀前1–4天傳播，但比例仍不確定；不能推成人人都會。原85%來自歷史天花疫苗的觀察研究，不是每種現行疫苗或每個人的固定保護率。<a href=\"https://www.cdc.gov/monkeypox/signs-symptoms/\" target=\"_blank\" rel=\"noopener noreferrer\">CDC 症狀與傳播範圍</a>；<a href=\"https://cdn.who.int/media/docs/default-source/scientific-advisory-group-on-the-origins-of-novel-pathogens/sago_monkeypox-statement_final_21.pdf?download=true&sfvrsn=c9e5b8a_1\" target=\"_blank\" rel=\"noopener noreferrer\">WHO 歷史估計背景</a></div><div class=\"quote source-correction\">來源校正：原文「潛伏期沒有傳染力」過度絕對。CDC記錄部分clade II感染者可能在症狀前1–4天傳播，但比例仍不確定；不能推成人人都會。原85%來自歷史天花疫苗的觀察研究，不是每種現行疫苗或每個人的固定保護率。<a href=\"https://www.cdc.gov/monkeypox/signs-symptoms/\" target=\"_blank\" rel=\"noopener noreferrer\">CDC 症狀與傳播範圍</a>；<a href=\"https://cdn.who.int/media/docs/default-source/scientific-advisory-group-on-the-origins-of-novel-pathogens/sago_monkeypox-statement_final_21.pdf?download=true&sfvrsn=c9e5b8a_1\" target=\"_blank\" rel=\"noopener noreferrer\">WHO 歷史估計背景</a><small>原文閱讀前先看來源校正；原文保留供查對</small></div><div class=\"ex\"><h4>M痘感染的示意路徑</h4><p>原圖以簡化示意說明病毒入侵細胞的大致過程。</p></div><div class=\"ex\"><h4>閱讀方式</h4><ul><li>病毒附著在宿主細胞表面。</li><li>進入細胞後利用宿主資源複製。</li><li>新病毒釋出並感染其他細胞。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>圖是示意，不是每個步驟的精確分子機制。</p></div>", "tb": [["BOOK9", "P163 完整課本頁（含來源校正段落）"]]}, {"id": "b3-c53-l25", "t": "M痘資料：傳播範圍與歷史估計", "sec": "s4", "slide": 41, "sourceSlides": [41], "sourcePages": [], "src": "原PPT第 41 頁；課本 P162–165", "figSpec": {"image": "PPT41S3"}, "txt": "<ul><li>疾病進程與無症狀狀態不是同一種傳播判斷。</li><li>原「沒有傳染力」應用目前資料限定，不能只以看不見症狀判定必無傳播。</li><li>原85%保護估計有歷史研究背景，不能取代不同疫苗、族群與研究的實際結果。</li></ul><p class=\"think\">哪個證據才能支持特定疫苗在特定族群的保護率？</p><div class=\"scope-note\">來源校正：原文「潛伏期沒有傳染力」過度絕對。CDC記錄部分clade II感染者可能在症狀前1–4天傳播，但比例仍不確定；不能推成人人都會。原85%來自歷史天花疫苗的觀察研究，不是每種現行疫苗或每個人的固定保護率。<a href=\"https://www.cdc.gov/monkeypox/signs-symptoms/\" target=\"_blank\" rel=\"noopener noreferrer\">CDC 症狀與傳播範圍</a>；<a href=\"https://cdn.who.int/media/docs/default-source/scientific-advisory-group-on-the-origins-of-novel-pathogens/sago_monkeypox-statement_final_21.pdf?download=true&sfvrsn=c9e5b8a_1\" target=\"_blank\" rel=\"noopener noreferrer\">WHO 歷史估計背景</a></div><div class=\"quote source-correction\">來源校正：原文「潛伏期沒有傳染力」過度絕對。CDC記錄部分clade II感染者可能在症狀前1–4天傳播，但比例仍不確定；不能推成人人都會。原85%來自歷史天花疫苗的觀察研究，不是每種現行疫苗或每個人的固定保護率。<a href=\"https://www.cdc.gov/monkeypox/signs-symptoms/\" target=\"_blank\" rel=\"noopener noreferrer\">CDC 症狀與傳播範圍</a>；<a href=\"https://cdn.who.int/media/docs/default-source/scientific-advisory-group-on-the-origins-of-novel-pathogens/sago_monkeypox-statement_final_21.pdf?download=true&sfvrsn=c9e5b8a_1\" target=\"_blank\" rel=\"noopener noreferrer\">WHO 歷史估計背景</a><small>原文閱讀前先看來源校正；原文保留供查對</small></div><div class=\"ex\"><h4>M痘資料</h4><p>這頁整理疾病的傳播範圍與歷史估計。</p></div><div class=\"ex\"><h4>閱讀資料時</h4><ul><li>先看資料的<b>時間與地區</b>。</li><li>數字多為估計值，會隨監測更新。</li><li>疫苗保護力等數字須註明來源與條件。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>最新疫情與疫苗資訊請以衛生主管機關的公告為準。</p></div>", "tb": []}, {"id": "b3-c53-l26", "t": "初級曲線：先讀橫軸、縱軸與事件", "sec": "s4", "slide": 42, "sourceSlides": [42], "sourcePages": [10], "src": "原PPT第 42 頁；課本 P162–165", "figSpec": {"image": "memory"}, "txt": "<ul><li>橫軸是時間，縱軸是抗體相對濃度的對數刻度10⁰–10⁴。</li><li>圖中第0天首次接觸A，先有延遲再上升、下降；不能以畫面高度作等差濃度。</li><li>教材曲線與第0–6天敘述為示意情境，不是所有人的固定日程或絕對抗體數。</li></ul><p class=\"think\">10¹到10²與10²到10³在圖上同樣高，實際增量相同嗎？</p><div class=\"ex\"><h4>初級免疫反應曲線</h4><p>先看橫軸（時間）、縱軸（抗體濃度）與標示的事件（第一次接觸抗原）。</p></div><div class=\"ex\"><h4>特徵</h4><ul><li>抗原進入後有一段<b>潛伏期</b>才偵測到抗體。</li><li>抗體量上升較慢、峰值較低。</li><li>之後逐漸下降。</li></ul></div><div class=\"ex\"><h4>原因</h4><p>需要經過選擇、增生與分化，所以較慢。</p></div>", "tb": [["BOOK10", "P164 完整課本頁"]]}, {"id": "b3-c53-l27", "t": "次級曲線：同一抗原再出現", "sec": "s4", "slide": 43, "sourceSlides": [43], "sourcePages": [], "src": "原PPT第 43 頁；課本 P162–165", "figSpec": {"image": "memory"}, "txt": "<ul><li>圖第28天再次接觸A，A反應較快、峰值較高、維持較久。</li><li>比較延遲、峰高與持續時間，不能只說「有抗體」就認定為次級反應。</li><li>反應型態與記憶群體及其他條件有關；這張圖不是單一個人的診斷資料。</li></ul><p class=\"think\">只把峰值放大，是否已完整表現記憶的三種變化？</p><div class=\"ex\"><h4>次級免疫反應曲線</h4><p>同一抗原再次出現時的反應。</p></div><div class=\"ex\"><h4>與初級比較</h4><ul><li>潛伏期<b>更短</b>。</li><li>抗體上升<b>更快</b>、峰值<b>更高</b>。</li><li>持續時間<b>更長</b>。</li></ul></div><div class=\"ex\"><h4>原因</h4><p>記憶細胞已存在，可以迅速增生分化為漿細胞。</p></div>", "tb": []}, {"id": "b3-c53-l28", "t": "同時A、B：記憶是抗原相關", "sec": "s4", "slide": 44, "sourceSlides": [44], "sourcePages": [], "src": "原PPT第 44 頁；課本 P162–165", "figSpec": {"image": "memory"}, "txt": "<ul><li>第28天是第二次A、第一次B；A呈次級，B呈初級。</li><li>同一身體、同一時間仍可同時有不同反應型態。</li><li>這支持專一性與記憶性，不能推出遇過A就對所有B有相同次級反應。</li></ul><p class=\"think\">兩條曲線都在第28天之後，為何不能都叫次級？</p><div class=\"ex\"><h4>同時有 A、B 兩種抗原</h4><p>先接觸抗原A，之後再同時接觸A與B。</p></div><div class=\"ex\"><h4>結果</h4><ul><li>對A：產生次級免疫反應。</li><li>對B：因為是第一次接觸，仍是初級免疫反應。</li></ul></div><div class=\"ex\"><h4>結論</h4><p>免疫記憶是針對<b>各別抗原</b>的，彼此不會互相取代。</p></div>", "tb": []}, {"id": "b3-c53-l29", "t": "流感與效期：記憶不等於株別永遠不變", "sec": "s4", "slide": 45, "sourceSlides": [45], "sourcePages": [], "src": "原PPT第 45 頁；課本 P162–165", "figSpec": {"image": "PPT45S3"}, "txt": "<ul><li>原文說明流行株可能改變，疫苗組成需依監測重新評估。</li><li>保護也可隨時間下降，記憶的存在不能保證任何時期對每個變異株完全相同。</li><li>本卡解釋抗原變化與保護持續性，不提供某季或某個人的接種時程。</li></ul><p class=\"think\">若沒有足夠跨反應，過去的記憶為何仍可能需要新的抗原刺激？</p><div class=\"scope-note\">保留原每年二月北半球評估背景；疫苗平台與保護持續時間並不全同。<a href=\"https://www.cdc.gov/pinkbook/hcp/table-of-contents/chapter-1-principles-of-vaccination.html\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"ex\"><h4>流感疫苗為何需每年評估</h4><p>流行的病毒株可能改變，疫苗組成需依監測結果重新評估。</p></div><div class=\"ex\"><h4>原因</h4><ul><li>抗原變化使舊記憶可能無法完全辨識新株。</li><li>保護力也可能隨時間下降。</li><li>每年二月前後，世界衛生組織根據全球監測推測北半球流行株。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>有些疫苗接種一次可長期保護，有些需追加；實際接種請依衛生單位建議。</p></div>", "tb": []}, {"id": "b3-c53-l30", "t": "主動與被動：來源和用途分開", "sec": "s4", "slide": 46, "sourceSlides": [46], "sourcePages": [11], "src": "原PPT第 46 頁；課本 P162–165", "figSpec": {"image": "PPT46S3"}, "txt": "<ul><li>主動：自身反應產生抗體與記憶；來源可為感染或疫苗刺激。</li><li>被動：取得外來現成抗體，如母體轉移或免疫球蛋白；轉移本身不生成對應記憶。</li><li>被動通常較快但有時效；主動通常需要時間，保護持續時間仍有差異。</li><li>原比較表「主動預防／被動治療」是簡化，不宜當作互斥用途；暴露後也可能搭配兩者。</li></ul><p class=\"think\">比較抗體來源時，為何不能只問它在暴露之前還是之後使用？</p><div class=\"scope-note\"><a href=\"https://www.cdc.gov/pinkbook/hcp/table-of-contents/chapter-1-principles-of-vaccination.html\" target=\"_blank\" rel=\"noopener noreferrer\">機制與範圍參考</a></div><div class=\"scope-note\">來源校正：P165／PPT49將現代人用狂犬病疫苗寫為減毒、未經改良，這不符合現行資料。現代人用疫苗為不活化疫苗；暴露後免疫可同時運用外來抗體及主動反應。潛伏期長短不能當作可等待的保證，暴露後措施需及時專業評估。本卡比較免疫機制。<a href=\"https://www.who.int/publications/m/item/inactivated-rabies-vaccine-for-human-use-annex-2-trs-no-941\" target=\"_blank\" rel=\"noopener noreferrer\">WHO 人用不活化狂犬病疫苗</a>；<a href=\"https://www.cdc.gov/rabies/hcp/clinical-care/post-exposure-prophylaxis.html\" target=\"_blank\" rel=\"noopener noreferrer\">CDC 暴露後預防原理</a></div><div class=\"quote source-correction\">來源校正：P165／PPT49將現代人用狂犬病疫苗寫為減毒、未經改良，這不符合現行資料。現代人用疫苗為不活化疫苗；暴露後免疫可同時運用外來抗體及主動反應。潛伏期長短不能當作可等待的保證，暴露後措施需及時專業評估。本卡比較免疫機制。<a href=\"https://www.who.int/publications/m/item/inactivated-rabies-vaccine-for-human-use-annex-2-trs-no-941\" target=\"_blank\" rel=\"noopener noreferrer\">WHO 人用不活化狂犬病疫苗</a>；<a href=\"https://www.cdc.gov/rabies/hcp/clinical-care/post-exposure-prophylaxis.html\" target=\"_blank\" rel=\"noopener noreferrer\">CDC 暴露後預防原理</a><small>原文閱讀前先看來源校正；原文保留供查對</small></div><div class=\"ex\"><h4>主動免疫與被動免疫</h4><p>差別在<b>抗體從哪裡來</b>，而不是用在暴露前或暴露後。</p></div><div class=\"ex\"><h4>比較</h4><ul><li><b>主動免疫</b>：自身產生抗體與記憶（感染後或接種疫苗）；產生較慢，有記憶。</li><li><b>被動免疫</b>：取得現成抗體（免疫血清、母體傳給胎兒）；作用快，無記憶、有時效。</li></ul></div><div class=\"ex\"><h4>補充</h4><p>暴露後有時會兩者併用：先用現成抗體應急，同時用疫苗誘發自身反應。</p></div>", "tb": [["BOOK11", "P165 完整課本頁（含來源校正段落）"]]}, {"id": "b3-c53-l31", "t": "狂犬病案例：保留原文，明確校正", "sec": "s4", "slide": 47, "sourceSlides": [47, 48, 49], "sourcePages": [], "src": "原PPT第 47–49 頁；課本 P162–165", "figSpec": {"image": "PPT47S3"}, "txt": "<ul><li>外來抗體可提供被動作用，疫苗誘發自身主動反應；兩者在機制上可以互補。</li><li>PPT49「減毒且從未改良」與現代人用不活化疫苗資料不符。</li><li>PPT48概括約兩個月，不能推出可等待或對所有暴露都足夠的固定期限。</li><li>原動畫與課本仍完整保留供查對；教師應先讀校正再播放原段落。</li></ul><p class=\"think\">如何保留來源可追溯性，同時避免學生把已知錯誤背成正確知識？</p><div class=\"scope-note\">來源校正：P165／PPT49將現代人用狂犬病疫苗寫為減毒、未經改良，這不符合現行資料。現代人用疫苗為不活化疫苗；暴露後免疫可同時運用外來抗體及主動反應。潛伏期長短不能當作可等待的保證，暴露後措施需及時專業評估。本卡比較免疫機制。<a href=\"https://www.who.int/publications/m/item/inactivated-rabies-vaccine-for-human-use-annex-2-trs-no-941\" target=\"_blank\" rel=\"noopener noreferrer\">WHO 人用不活化狂犬病疫苗</a>；<a href=\"https://www.cdc.gov/rabies/hcp/clinical-care/post-exposure-prophylaxis.html\" target=\"_blank\" rel=\"noopener noreferrer\">CDC 暴露後預防原理</a></div><div class=\"quote source-correction\">來源校正：P165／PPT49將現代人用狂犬病疫苗寫為減毒、未經改良，這不符合現行資料。現代人用疫苗為不活化疫苗；暴露後免疫可同時運用外來抗體及主動反應。潛伏期長短不能當作可等待的保證，暴露後措施需及時專業評估。本卡比較免疫機制。<a href=\"https://www.who.int/publications/m/item/inactivated-rabies-vaccine-for-human-use-annex-2-trs-no-941\" target=\"_blank\" rel=\"noopener noreferrer\">WHO 人用不活化狂犬病疫苗</a>；<a href=\"https://www.cdc.gov/rabies/hcp/clinical-care/post-exposure-prophylaxis.html\" target=\"_blank\" rel=\"noopener noreferrer\">CDC 暴露後預防原理</a><small>原文閱讀前先看來源校正；原文保留供查對</small></div><div class=\"ex\"><h4>狂犬病案例</h4><p>狂犬病病毒由咬傷等途徑進入，潛伏期可較長，但<b>暴露後須盡快就醫評估</b>。</p></div><div class=\"ex\"><h4>免疫學重點</h4><ul><li>施打狂犬病抗體：被動免疫，抑制病毒擴散。</li><li>施打狂犬病疫苗：誘發主動免疫。</li><li>兩者可互補。</li></ul></div><div class=\"ex g\"><h4>校正提醒</h4><p>原頁面稱人用狂犬病疫苗為「減毒疫苗」；現行人用疫苗為<b>不活化疫苗</b>，請以現行資料為準。</p></div>", "tb": []}, {"id": "b3-c53-l32", "t": "原題一：TH、TC的角色", "sec": "s5", "slide": 50, "sourceSlides": [50], "sourcePages": [], "src": "原PPT第 50 頁；課本 P155–160／原題", "figSpec": {"image": "helper"}, "txt": "<ul><li>保留原五個選項及多選答案C、D。</li><li>TH的協調與TC的直接細胞效應不可互換。</li><li>TH可有記憶性；TC主要依穿孔蛋白與顆粒酶作用，不是吞噬者。</li></ul><p class=\"think\">兩種細胞都叫T，為何不能因此將功能混用？</p><div class=\"ex\"><h4>原題一（多選）</h4><p>比較輔助T與胞毒T的功能，答案為 <b>(C)(D)</b>。</p></div><div class=\"ex\"><h4>逐項</h4><ul><li>(A) 胞毒T參與細胞媒介免疫，體液免疫是B細胞。</li><li>(B) 使受感染細胞瓦解的是胞毒T。</li><li>(C) 正確：TH分泌細胞介素可活化TC。</li><li>(D) 正確：TH可有免疫記憶。</li><li>(E) 胞毒T靠穿孔蛋白與顆粒酶，不是胞吞作用。</li></ul></div>", "tb": []}, {"id": "b3-c53-l33", "t": "原題二：甲乙丙丁的分工", "sec": "s5", "slide": 51, "sourceSlides": [51, 52], "sourcePages": [], "src": "原PPT第 51–52 頁；課本 P155–160／原題", "figSpec": {"image": "PPT51S3"}, "txt": "<ul><li>保留原四個選項及答案C。</li><li>依原解析：甲B、乙TH、丙漿細胞、丁抗體，屬體液免疫路徑。</li><li>B所辨識天然抗原與TH辨識肽段–MHC形式不同；這不等於兩者來源完全無關。</li><li>原「單一抗原僅辨識單一抗原」屬簡化，另以相似表位交叉反應限定。</li></ul><p class=\"think\">圖中產生抗體的是甲的分化後代，還是乙直接分泌？</p><div class=\"ex\"><h4>原題二</h4><p>圖中甲為B細胞、乙為輔助T細胞、丙為漿細胞、丁為抗體；答案 <b>(C)</b>。</p></div><div class=\"ex\"><h4>逐項</h4><ul><li>(A) B細胞可將抗原呈現給TH，兩者辨識的並非完全無關。</li><li>(B) 這是體液免疫。</li><li>(C) 正確：丙是甲分化的漿細胞。</li><li>(D) 單一抗體只辨識特定抗原。</li></ul></div>", "tb": []}, {"id": "b3-c53-l34", "t": "原題三：MHC是宿主的呈現分子", "sec": "s5", "slide": 53, "sourceSlides": [53], "sourcePages": [], "src": "原PPT第 53 頁；課本 P155–160／原題", "figSpec": {"image": "presentation"}, "txt": "<ul><li>保留原四個選項及答案B。</li><li>MHC與處理後片段形成複合體，並非原病原完整貼在膜上。</li><li>原D用所有吞噬細胞全稱，超出本模型的專業APC分工。</li></ul><p class=\"think\">把MHC當成病原構造，會如何誤讀抗原處理圖？</p><div class=\"ex\"><h4>原題三：MHC</h4><p>答案 <b>(B)</b>。</p></div><div class=\"ex\"><h4>逐項</h4><ul><li>(A) MHC是APC合成的膜蛋白，不是病原殘留物。</li><li>(B) 正確：與抗原結合成複合體呈現在細胞膜上。</li><li>(C) 呈現的是小片段，不是完整病原體。</li><li>(D) 只有專業APC（巨噬細胞、樹突細胞、B細胞）能呈現給TH。</li></ul></div>", "tb": []}], "questions": [{"t": "免疫成員：按主要角色分類", "q": "每欄放兩張卡，依本節作用分類。", "learn": 13, "tag": "effector", "hint": "分清訊號、細胞作用與抗體來源。", "why": "TH協調；TC細胞效應；B分化出漿細胞與記憶B。", "sub": "原PPT第 24 頁；課本 P159–161", "refs": [{"src": "PPT24S3", "cap": "教材來源圖"}], "legacyQuestion": 1, "kind": "drag", "slots": [{"id": "g0s0", "label": "輔助T細胞", "group": 0}, {"id": "g0s1", "label": "輔助T細胞", "group": 0}, {"id": "g1s0", "label": "胞毒T細胞", "group": 1}, {"id": "g1s1", "label": "胞毒T細胞", "group": 1}, {"id": "g2s0", "label": "B細胞分化路徑", "group": 2}, {"id": "g2s1", "label": "B細胞分化路徑", "group": 2}], "pieces": [{"id": "ag0s0", "label": "提供協調其他淋巴球的訊號", "group": 0}, {"id": "ag0s1", "label": "有些可形成記憶TH", "group": 0}, {"id": "ag1s0", "label": "釋出穿孔蛋白與顆粒酶", "group": 1}, {"id": "ag1s1", "label": "可作用於適合的受感染宿主細胞", "group": 1}, {" let fitPending=false;
function fit(){if(fitPending)return;fitPending=true;requestAnimationFrame(()=>{fitPending=false;const bar=el('bar'),h=bar.classList.contains('hidden')?0:Math.ceil(bar.getBoundingClientRect().height);if(document.documentElement.style.getPropertyValue('--barh')!==h+'px')document.documentElement.style.setProperty('--barh',h+'px');
 if(PAGE==='learn')fitLesson();
 if(PAGE==='play'&&innerWidth<=900)el('question-panel').querySelectorAll('.mask-wrap').forEach(m=>m.style.width='');
 if(PAGE==='play'&&innerWidth>900){const panel=el('question-panel'),top=panel.getBoundingClientRect().top,fb=el('question-feedback').getBoundingClientRect().height,available=innerHeight-h-top-fb-42;
 const grid=panel.querySelector('.sequence-grid');if(grid){grid.classList.remove('compact-drag');grid.style.removeProperty('--slot-min-height');if(grid.getBoundingClientRect().height>available){grid.classList.add('compact-drag');const rows=Math.ceil(STAGES[QI].slots.length/2),label=Math.max(...[...grid.querySelectorAll('.match-slot label')].map(e=>e.getBoundingClientRect().height+4));const slot=Math.max(44,Math.floor((available-label*rows-8*(rows-1))/rows)-2);grid.style.setProperty('--slot-min-height',slot+'px');const excess=Math.max(0,document.documentElement.scrollHeight-innerHeight);if(excess)grid.style.setProperty('--slot-min-height',Math.max(44,slot-Math.ceil(excess/rows)-2)+'px');}}
 const layout=panel.querySelector('.fill-layout'),rail=panel.querySelector('.reference-rail'),img=rail?.querySelector('img');if(img){const ratio=img.naturalWidth/img.naturalHeight||1;for(let pass=0;pass<3;pass++){const caption=rail.querySelector('p').getBoundingClientRect().height+8,width=Math.min(Math.min(STAGES[QI].imageWidth||440,panel.clientWidth-380),Math.max(80,(available-caption)*ratio));if(Math.abs(rail.getBoundingClientRect().width-width)<.1)break;layout.style.setProperty('--reference-width',width+'px');}}
 const match=panel.querySelector('.matching-figure img');if(match){match.style.maxHeight=Math.max(140,available-30)+'px';}

 const graph=panel.querySelector('.graph-question');if(graph){graph.style.setProperty('--graph-height',Math.max(80,Math.min(245,available-46))+'px');graph.style.setProperty('--stimulus-height',Math.max(55,Math.min(110,available-132))+'px');}
 const choice=panel.querySelector('.choice-layout img');if(choice){choice.style.maxHeight=Math.max(140,available-30)+'px';}
 } });}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{returnQuestion=PAGE==='play'&&b.dataset.page==='learn';navigate(b.dataset.page)});
el('continue-learn').onclick=()=>navigate('learn',LI);el('back-question').onclick=()=>navigate('play',QI);el('learn-fullscreen').onclick=enterLearnFullscreen;el('fs-exit').onclick=exitLearnFullscreen;
for(const id of ['l-prev','fs-prev'])el(id).onclick=()=>LI>0&&showLearn(LI-1);for(const id of ['l-next','fs-next'])el(id).onclick=()=>LI<LEARN.length-1&&showLearn(LI+1);

el('hint-toggle').setAttribute('aria-haspopup','dialog');el('hint-toggle').onclick=()=>{el('hint-toggle').setAttribute('aria-expanded','true');const d=openDialog('思考提示',`<p>${esc(STAGES[QI].hint)}</p>`);d.addEventListener('close',()=>el('hint-toggle').setAttribute('aria-expanded','false'),{once:true});};el('reference-btn').onclick=()=>openReferences(STAGES[QI]);el('question-learn').onclick=()=>{returnQuestion=true;navigate('learn',STAGES[QI].learn)};el('q-jump').onchange=e=>showQuestion(+e.target.value);el('prev-btn').onclick=()=>QI>0&&showQuestion(QI-1);el('skip-btn').onclick=()=>QI<STAGES.length-1?showQuestion(QI+1):navigate('done');el('check-btn').onclick=check;el('reset-btn').onclick=resetQuestion;el('finish-btn').onclick=()=>navigate('done');

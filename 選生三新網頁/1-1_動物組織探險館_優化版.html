const CONTENT={"lessons": [{"id": "b3-c11-l01", "t": "一個器官，多種組織協作", "src": "課本 P8、P9；原PPT第 1 頁", "slide": 1, "sourcePages": [1], "sec": "s1", "figSpec": {"image": "hierarchy"}, "txt": "<ul><li>細胞與細胞間質共同構成組織，不能只把組織看成同一種細胞的堆積。</li><li>多種組織合作形成器官；器官再組成系統。</li><li>本節以緊密排列、收縮、訊息傳遞及細胞間質辨識四類組織。</li></ul><p class=\"think\">思考：胃能消化食物，是否表示胃只有一種組織？</p><div class=\"ex\"><h4>本節要學什麼</h4><p>動物的器官看似單一，其實由<b>不同的組織</b>共同組成。本節依構造與功能，把動物組織分成<b>上皮、肌肉、神經、結締</b>四大類（課本 1-1.1～1-1.4）。</p></div><div class=\"ex\"><h4>從解剖到顯微鏡</h4><p>早期科學家從解剖認識動物，肉眼看得到的解剖構造就是各種<b>器官</b>。顯微鏡發展後，確認<b>細胞</b>是構成生物體的基本單位；再觀察器官切片，又發現細胞有多種形態與構造。</p></div><div class=\"ex\"><h4>組織怎麼來</h4><p><b>功能與形態相似的細胞</b>加上<b>細胞間質</b>，會聚集成特定單位，稱為<b>組織</b>。這種現象普遍存在於各種動物器官中。</p></div><div class=\"ex\"><h4>課本的提問</h4><p>不同的器官，是否會有相似的組織？一個器官又是由多少種組織構成？帶著這兩個問題，繼續看後面幾張圖。</p></div><div class=\"ex\"><h4>恆定的概念</h4><p>器官會彼此協同運作。法國生理學家<b>伯納</b>（Claude Bernard, 1813–1878）與美國生理學家<b>坎能</b>（Walter B. Cannon, 1871–1945）觀察後提出：各種器官與系統<b>協同合作</b>，以維持體內穩定狀態，這就是「<b>恆定</b>」概念。</p></div><div class=\"ex\"><h4>為什麼能用其他動物來學人體</h4><p>動物雖因適應環境而構造有差異，但<b>維持生存的基本原則相似</b>。所以了解其他動物的構造與功能，可以奠定我們認識人體的基礎。</p></div>", "tb": [["BOOK1", "P8 完整課本頁"], ["BOOK2", "P9 完整課本頁"]]}, {"id": "b3-c11-l02", "t": "從生活中的器官，提出觀察問題", "src": "原簡報導入；原PPT第 2 頁", "slide": 2, "sourcePages": [2], "sec": "s1", "figSpec": {"flip": [2]}, "txt": "<ul><li>原簡報用黑白切的俗名引入動物器官。</li><li>先區分食材俗名、器官名稱與組織種類。</li><li>食材外觀只能提示來源，組織判讀仍需切片與構造證據。</li></ul><p class=\"think\">思考：只看一盤食材，哪些資訊可以知道，哪些還不能？</p><p class=\"scope-note\">判讀提醒：原PPT導入對應課本P6–7；本次提供的PDF從P8開始，導入以原PPT為來源。</p><div class=\"ex\"><h4>導入情境</h4><p>午餐時間，到小吃攤點一碗滷肉飯和一盤「黑白切」。想一想：這些食材分別來自豬的<b>哪一個器官</b>？</p></div><div class=\"ex\"><h4>盤中有哪些食材（俗稱）</h4><ul><li>軟管、管頭、腰尺、腰子、大腸頭、生腸</li><li>天梯、脆管、肝連、豬肚、粉腸、小肚</li></ul></div><div class=\"ex\"><h4>這張圖要提醒什麼</h4><p>我們平常吃的許多食材，其實就是動物的<b>器官</b>。下一張會把每盤食材連回豬體內的位置，練習從「名稱」走向「構造」。</p></div><div class=\"ex\"><h4>小提醒</h4><p>食材俗稱會因地區而異，這裡只用來引起動機，不是正式的解剖名稱。</p></div>", "tb": []}, {"id": "b3-c11-l03", "t": "名稱與位置：器官不等於組織", "src": "原簡報導入；原PPT第 3 頁", "slide": 3, "sourcePages": [3], "sec": "s1", "figSpec": {"flip": [3]}, "txt": "<ul><li>原簡報把食道、胃、腸、腎臟、氣管等位置與食材連結。</li><li>同一器官可能有上皮、結締、肌肉與神經組織。</li><li>不同器官也能具有相同基本組織類型。</li></ul><p class=\"think\">思考：氣管與小腸都有上皮，為什麼功能不同？</p><p class=\"scope-note\">判讀提醒：食材俗稱可能因地區而異；本卡按原PPT展示，不把俗稱當普遍的解剖命名。</p><div class=\"ex\"><h4>怎麼讀這張圖</h4><p>圖中每盤食材都用虛線連到豬體內的器官位置，請由「食材 → 器官 → 所屬系統」逐一對照。</p></div><div class=\"ex\"><h4>依原簡報連線整理</h4><ul><li>軟管 → 食道；管頭 → 氣管；天梯 → 上顎</li><li>腰子 → 腎臟；腰尺 → 脾臟；小肚 → 膀胱</li><li>豬肚 → 胃；粉腸 → 小腸；大腸頭 → 直腸</li><li>生腸 → 輸卵管；肝連 → 橫膈肌；脆管 → 大動脈</li></ul></div><div class=\"ex\"><h4>器官不等於組織</h4><p>圖中的食道、胃、小腸、腎臟、氣管……都是<b>器官</b>。每個器官都由<b>多種組織</b>構成，不同器官也可能含有相同類型的組織，這正是本節要探討的重點。</p></div>", "tb": []}, {"id": "b3-c11-l04", "t": "組織的定義：細胞加上間質", "src": "課本 P8；原PPT第 4 頁", "slide": 4, "sourcePages": [4], "sec": "s1", "figSpec": {"image": "hierarchy"}, "txt": "<ul><li>形態與功能相關的細胞加上細胞間質，形成組織。</li><li>神經組織有神經元與神經膠細胞，組織未必只含一種細胞。</li><li>觀察切片時要同時找細胞與細胞外的材料。</li></ul><p class=\"think\">思考：若只看到很多細胞核，能立即判定組織類型嗎？</p><div class=\"ex\"><h4>組織的定義</h4><p>功能與形態彼此相似的<b>細胞</b>，加上<b>細胞間質</b>，會聚集成特定單位，稱為<b>組織</b>。</p></div><div class=\"ex\"><h4>為什麼要加上「細胞間質」</h4><p>組織不只是同一種細胞的堆積。細胞之間還有<b>細胞分泌的衍生物</b>，也就是細胞間質，它同樣是組織的一部分。不同組織的間質多寡差異很大，後面會看到結締組織的間質特別豐富。</p></div><div class=\"ex\"><h4>在顯微鏡下看見什麼</h4><p>觀察器官切片時，可以發現<b>細胞有多種形態與構造</b>。形態與功能相似的細胞會聚在一起，形成可以辨認的組織。</p></div><div class=\"ex\"><h4>想一想</h4><p>不同的器官是否會有相似的組織？一個器官是由多少種組織構成的？（下一張用「胃」來回答。）</p></div>", "tb": [["BOOK1", "P8 完整課本頁"]]}, {"id": "b3-c11-l05", "t": "細胞、組織與胃：逐層放大", "src": "課本 P8；原PPT第 5 頁", "slide": 5, "sourcePages": [5], "sec": "s1", "figSpec": {"image": "hierarchy"}, "txt": "<ul><li>圖1–1依序呈現上皮細胞、上皮組織與胃。</li><li>胃壁示意標出黏膜層、黏膜下層、平滑肌與漿膜層。</li><li>胃是器官，胃壁的層次與四類基本組織是不同分類角度。</li></ul><p class=\"think\">思考：黏膜層能不能直接等同單一上皮組織？</p><p class=\"scope-note\">判讀提醒：P8的圖1–1跨頁延伸；原裁圖右緣的虛線是與P9續圖的連接，不是切掉的構造。完整P8與P9都可查看。</p><div class=\"ex g\"><h4>圖 1－1　動物體的組成層次</h4><p>由左到右逐層放大：<b>細胞 → 組織 → 器官</b>。圖中以上皮細胞、上皮組織與胃為例，帶你看清楚層層之間的關係。</p></div><div class=\"ex\"><h4>細胞</h4><p>細胞是生物體的基本組成，例如<b>上皮細胞</b>。</p></div><div class=\"ex\"><h4>組織</h4><p>細胞經過<b>分化</b>後，構造與功能相似的細胞形成組織，例如<b>上皮組織</b>。</p></div><div class=\"ex\"><h4>器官</h4><p>不同組織形成器官。以<b>胃</b>為例，是由結締組織、肌肉組織、神經組織等構成。</p></div><div class=\"ex\"><h4>胃壁的層次</h4><p>圖中胃壁的剖面由內而外標示：<b>黏膜層、黏膜下層、平滑肌、漿膜層</b>。每一層含有不同的組織，合作完成胃的功能。</p></div>", "tb": [["BOOK1", "P8 完整課本頁"]]}, {"id": "b3-c11-l06", "t": "器官系統與個體：協調維持恆定", "src": "課本 P9、P8；原PPT第 6 頁", "slide": 6, "sourcePages": [6], "sec": "s1", "figSpec": {"flip": [6]}, "txt": "<ul><li>胃、腸與其他器官合作形成消化系統。</li><li>不同系統協調，使整個個體得以生存。</li><li>恆定是維持可運作的內在狀態，不表示所有數值永遠不變。</li></ul><p class=\"think\">思考：只有消化系統工作，個體就能維持生存嗎？</p><div class=\"ex\"><h4>器官系統</h4><p>許多器官聚集在一起，形成具有<b>特定生理功能</b>的器官系統，例如<b>消化系統</b>（胃、腸等器官合作）。</p></div><div class=\"ex\"><h4>個體</h4><p>不同的器官系統<b>彼此協調運作</b>，個體才得以生存。</p></div><div class=\"ex\"><h4>完整的組成層次</h4><ul><li>細胞 → 組織 → 器官 → 器官系統 → 個體</li><li>每往上一層，就是更多、更複雜的構造合作。</li></ul></div><div class=\"ex\"><h4>什麼是恆定</h4><p>體內各器官與系統協同合作，維持<b>體內穩定的狀態</b>，稱為恆定（伯納與坎能提出）。恆定是維持在可運作的範圍，並不是任何數值都永遠不變。</p></div><div class=\"ex\"><h4>課本留給後面的問題</h4><p>體內各種生理狀態是如何維持恆定的呢？這個問題會在本冊後面的章節逐步回答。</p></div>", "tb": [["BOOK2", "P9 完整課本頁"], ["BOOK1", "P8 完整課本頁"]]}, {"id": "b3-c11-l07", "t": "四類基本組織：用證據比較", "src": "課本 P9；原PPT第 7 頁", "slide": 7, "sourcePages": [7], "sec": "s1", "figSpec": {"flip": [7]}, "txt": "<ul><li>上皮以緊密細胞排列形成被覆與內襯。</li><li>肌肉產生收縮；神經元與膠細胞共同支持協調。</li><li>結締組織通常有豐富間質，功能包含連結、支持、儲存與運輸。</li></ul><p class=\"think\">思考：脂肪組織間質少，為什麼仍屬結締組織？</p><p class=\"scope-note\">判讀提醒：通常不是全部：脂肪組織的細胞間質較少，不能只用間質多少作唯一分類標準。</p><div class=\"ex\"><h4>四大類</h4><p>科學家長期研究與歸類，把動物組織分成<b>上皮組織、肌肉組織、神經組織、結締組織</b>四類。不同組織中的細胞，形態與功能也不盡相同。</p></div><div class=\"ex\"><h4>一句話辨識</h4><ul><li><b>上皮組織</b>：細胞緊密排列，被覆體表與器官內襯。</li><li><b>肌肉組織</b>：由肌細胞組成，能收縮，帶動肢體與臟器活動。</li><li><b>神經組織</b>：神經元接收、傳遞訊號，神經膠細胞支持神經元。</li><li><b>結締組織</b>：細胞加上大量細胞間質，負責連結、支持等功能。</li></ul></div><div class=\"ex\"><h4>學習路線</h4><p>接下來依序學習：1-1.1 上皮 → 1-1.2 肌肉 → 1-1.3 神經 → 1-1.4 結締。每一類都要記得「<b>看什麼構造，推什麼功能</b>」。</p></div><div class=\"ex\"><h4>小提醒</h4><p>結締組織「通常」間質多，但脂肪組織的間質較少，所以不能只用間質多寡當成唯一的分類標準。</p></div>", "tb": [["BOOK2", "P9 完整課本頁"]]}, {"id": "b3-c11-l08", "t": "上皮分類：先看層數，再看形狀", "src": "課本 P10、P11；原PPT第 8 頁", "slide": 8, "sourcePages": [8], "sec": "s2", "figSpec": {"pair": ["squamous", "columnar"]}, "txt": "<ul><li>層數與扁平、立方、柱狀形態是不同判讀軸。</li><li>先找自由表面與基底膜，再看細胞排列和細胞核。</li><li>多層扁平上皮按表面細胞形態命名，底層細胞不必全是扁平。</li></ul><p class=\"think\">思考：多層上皮中，是否每個細胞都接觸基底膜？</p><p class=\"scope-note\">判讀提醒：多層上皮主要由基底層細胞接觸基底膜，不能說所有上皮細胞皆直接貼基底膜。<a href=\"https://histology.leeds.ac.uk/home/tissue_types/epithelia/epi_stratified/\" target=\"_blank\" rel=\"noopener noreferrer\">延伸：里茲大學多層上皮教材</a>。</p><div class=\"ex\"><h4>什麼是上皮組織</h4><p>上皮組織由<b>一或多層緊密排列</b>的細胞組成，被覆於動物體表與部分器官的內襯，並藉由<b>基底膜</b>與下方的結締組織相連。</p></div><div class=\"ex\"><h4>基底膜</h4><p>基底膜是一層富含<b>蛋白質與多醣類</b>的構造，把上皮和結締組織連在一起。看圖時，先找到基底膜，就能判斷哪一側是上皮的底部。</p></div><div class=\"ex\"><h4>兩個分類依據</h4><p><b>形態</b>：扁平、立方或柱狀。<b>層數</b>：一層或多層。命名時把兩者合起來，如單層扁平上皮、多層扁平上皮、單層立方上皮、單層柱狀上皮；多層上皮以表面細胞的形態命名。</p></div><div class=\"ex\"><h4>功能</h4><p>上皮細胞的功能多與<b>阻隔、保護、吸收、分泌、排泄、感覺</b>有關。</p></div><div class=\"ex g\"><h4>圖 1－2　上皮組織簡介</h4><p>課本以五個例子示範：單層扁平上皮、多層扁平上皮、單層立方上皮、纖毛柱狀上皮、單層柱狀上皮。每張切片都標有<b>基底膜</b>與比例尺（50、40、20、10 µm）。</p></div>", "tb": [["BOOK3", "P10 完整課本頁"], ["BOOK4", "P11 完整課本頁"]]}, {"id": "b3-c11-l09", "t": "上皮的位置、極性與營養", "src": "課本 P10、P11；原PPT第 9 頁", "slide": 9, "sourcePages": [9], "sec": "s2", "figSpec": {"image": "squamous"}, "txt": "<ul><li>上皮覆蓋體表或部分器官內襯，自由面與基底面具有方向性。</li><li>基底膜是細胞外構造，不是細胞膜，也不是血管。</li><li>典型上皮本身無血管，主要由下方結締組織供應養分並擴散至細胞。</li></ul><p class=\"think\">思考：沒有血管，是否就代表上皮無法得到氧與養分？</p><p class=\"scope-note\">判讀提醒：血管內襯稱內皮；氣管內襯稱上皮。原PPT9寫「氣管內皮」，本卡釐清術語。<a href=\"https://histology.leeds.ac.uk/home/tissue_types/connective/con_basal_lam/\" target=\"_blank\" rel=\"noopener noreferrer\">延伸：基底膜</a>。</p><div class=\"ex\"><h4>位置</h4><p>上皮組織分布在兩類地方：<b>體表</b>，如皮膚表皮；<b>部分器官的內襯</b>，如呼吸道與血管內皮。</p></div><div class=\"ex\"><h4>名稱要留意</h4><p>血管內襯習慣稱為<b>內皮</b>，氣管內襯稱為上皮。原簡報寫「氣管內皮」，課本的說法是「呼吸道與血管內皮」，可視為同一類位置舉例。</p></div><div class=\"ex\"><h4>基底膜在哪裡</h4><p>上皮與下方的結締組織之間，隔著<b>基底膜</b>。它是細胞外的構造，不是細胞膜，也不是血管。</p></div><div class=\"ex\"><h4>兩個面</h4><p>上皮細胞一面朝向<b>體表或管腔</b>，另一面貼著<b>基底膜</b>，因此有明確的方向性。</p></div><div class=\"ex\"><h4>補充：養分從哪裡來</h4><p>典型的上皮組織本身沒有血管，養分由下方的結締組織供應，再擴散到上皮細胞。</p></div>", "tb": [["BOOK3", "P10 完整課本頁"], ["BOOK4", "P11 完整課本頁"]]}, {"id": "b3-c11-l10", "t": "薄與多層：交換和保護的取捨", "src": "課本 P10；原PPT第 10 頁", "slide": 10, "sourcePages": [10], "sec": "s2", "figSpec": {"pair": ["squamousSingle", "squamousMulti"], "stack": true}, "txt": "<ul><li>肺泡氣體交換面以單層扁平上皮縮短擴散距離。</li><li>皮膚表皮的多層扁平上皮提供耐磨與屏障功能。</li><li>照片和立體示意圖可互相對照，示意厚度不是實測倍率。</li></ul><p class=\"think\">思考：把肺泡交換面換成厚的多層上皮，交換會受什麼限制？</p><p class=\"scope-note\">判讀提醒：本節描述肺泡的交換面；不推論肺泡所有細胞都只有同一形態。</p><div class=\"ex\"><h4>單層扁平上皮：肺泡</h4><p>肺泡由<b>單層扁平上皮細胞</b>圍繞而成，可進行<b>氣體交換</b>。細胞又薄又只有一層，氣體擴散的距離短，適合交換。</p></div><div class=\"ex\"><h4>多層扁平上皮：皮膚表皮</h4><p>皮膚表皮由<b>多層扁平上皮細胞</b>構成，可形成<b>保護的屏障</b>。細胞層層堆疊，較耐磨損，也能阻隔外界。</p></div><div class=\"ex\"><h4>表皮衍生物</h4><p>鱗片、毛髮、指甲及蹄爪等都是表皮衍生物，具有<b>保護、禦寒或協助捕食</b>的功能。</p></div><div class=\"ex g\"><h4>讀圖：上下對照</h4><p>上圖是單層扁平上皮，下圖是多層扁平上皮，比例尺都是 50 µm，且都標示基底膜。比較兩張圖的<b>細胞層數</b>，就能看出「薄」與「厚」的差別。</p></div><div class=\"ex\"><h4>結構與功能的取捨</h4><p>想要快速交換，就需要<b>薄而單層</b>；想要保護耐磨，就需要<b>多層</b>。上皮的構造和功能是互相對應的。</p></div>", "tb": [["BOOK3", "P10 完整課本頁"]]}, {"id": "b3-c11-l11", "t": "腎小管：立方上皮支持運輸", "src": "課本 P11；原PPT第 11 頁", "slide": 11, "sourcePages": [11], "sec": "s2", "figSpec": {"image": "cuboidal"}, "txt": "<ul><li>細胞圍繞管腔，外側由基底膜與下方組織相接。</li><li>腎小管許多段具有單層立方上皮，參與吸收與分泌。</li><li>名稱、管腔、細胞核及形狀要一起比對，不能只記顏色。</li></ul><p class=\"think\">思考：環形切面中的中央空白，是管腔還是細胞內空間？</p><p class=\"scope-note\">判讀提醒：腎小管不同段落的上皮有差異；本圖示範單層立方上皮，不說所有段落皆相同。</p><div class=\"ex\"><h4>腎小管</h4><p>腎小管由<b>單層立方上皮細胞</b>組成，具有<b>吸收和分泌</b>的功能。</p></div><div class=\"ex g\"><h4>讀圖步驟</h4><p>圖中比例尺為 40 µm。先找<b>管腔</b>（細胞圍成的空腔），再看細胞是否排成<b>單層</b>，最外側是<b>基底膜</b>。立方上皮細胞的高度和寬度相近，細胞核多半在細胞中央附近。</p></div><div class=\"ex\"><h4>為什麼適合吸收與分泌</h4><p>立方上皮細胞比扁平上皮厚，細胞內可容納較多胞器，適合進行吸收與分泌這類活動。</p></div><div class=\"ex\"><h4>小提醒</h4><p>腎小管不同段落的上皮並不完全相同，本圖示範的是單層立方上皮。</p></div>", "tb": [["BOOK4", "P11 完整課本頁"]]}, {"id": "b3-c11-l12", "t": "柱狀上皮：纖毛與微絨毛分工", "src": "課本 P11；原PPT第 12 頁", "slide": 12, "sourcePages": [12], "sec": "s2", "figSpec": {"pair": ["ciliated", "intestinal"], "stack": true}, "txt": "<ul><li>氣管內襯的纖毛推送表面黏液及被黏住的物質。</li><li>小腸的單層柱狀上皮負責吸收、分泌；微絨毛增加吸收面積。</li><li>纖毛、微絨毛與小腸絨毛是不同尺度的構造。</li></ul><p class=\"think\">思考：「小腸不具纖毛」與「沒有表面特化」是同一意思嗎？</p><p class=\"scope-note\">判讀提醒：氣管典型為偽複層纖毛柱狀上皮，核的位置高低不等不代表真正多層；原課本使用纖毛柱狀上皮稱呼。微絨毛延伸為補充，不冒充此圖直接量到的長度。</p><div class=\"ex\"><h4>纖毛柱狀上皮：氣管</h4><p>氣管內襯的纖毛柱狀上皮細胞，<b>纖毛可單向擺動</b>，有助於把表面的物質向外推動排出。</p></div><div class=\"ex\"><h4>單層柱狀上皮：小腸</h4><p>小腸絨毛由<b>不具纖毛</b>的單層柱狀上皮細胞構成，與物質的<b>吸收和分泌</b>有關。</p></div><div class=\"ex g\"><h4>兩張圖一起比</h4><p>兩者都是柱狀細胞，差別在<b>表面特化</b>：氣管細胞表面有纖毛，負責推送；小腸細胞表面沒有纖毛，負責吸收與分泌。比例尺分別為 20 µm（氣管）與 10 µm（小腸）。</p></div><div class=\"ex\"><h4>補充：微絨毛</h4><p>小腸上皮細胞表面有<b>微絨毛</b>，可增加吸收面積。微絨毛、纖毛與小腸絨毛是三種不同尺度的構造，不要混為一談。</p></div>", "tb": [["BOOK4", "P11 完整課本頁"]]}, {"id": "b3-c11-l13", "t": "從構造推功能，也要留意範圍", "src": "課本 P10、P11；原PPT第 13 頁", "slide": 13, "sourcePages": [13], "sec": "s2", "figSpec": {"pair": ["squamousSingle", "ciliated"], "stack": true}, "txt": "<ul><li>單層與薄交換面有利擴散，多層表面有利耐磨。</li><li>腎小管與腸道可參與吸收、分泌；氣管纖毛有方向性推送。</li><li>上皮也可具有排泄或感覺功能，不能將全類組織只配一種功能。</li></ul><p class=\"think\">思考：只見單層柱狀形態，還需哪些資訊才知道是腸道或其他器官？</p><p class=\"scope-note\">判讀提醒：原PPT13把黏膜概括為多層扁平；黏膜上皮依器官不同，小腸為單層柱狀，不能概括全部黏膜。</p><div class=\"ex\"><h4>從構造推測功能</h4><p>看形態與層數就能推測用途：<b>薄而單層</b>利於物質交換；<b>多層</b>利於阻隔與保護；<b>立方、柱狀</b>常與吸收、分泌有關；<b>纖毛</b>能推送物質。</p></div><div class=\"ex\"><h4>依功能整理</h4><ul><li>物質交換：肺泡、微血管（單層扁平上皮）</li><li>吸收與分泌：腎小管（單層立方上皮）、腸道（單層柱狀上皮）</li><li>阻隔、保護：皮膚（多層扁平上皮）</li><li>推送：氣管（纖毛柱狀上皮）</li><li>其他：排泄（汗腺）、感覺（味蕾）</li></ul></div><div class=\"ex\"><h4>使用時的範圍提醒</h4><p>原簡報把「黏膜」概括為多層扁平上皮，但黏膜上皮會因器官而不同，例如小腸黏膜是單層柱狀上皮。判斷時要連同<b>器官位置</b>一起看，不要把所有黏膜都當成同一種。</p></div><div class=\"ex\"><h4>想一想</h4><p>同樣是單層柱狀上皮，要知道它是腸道還是其他器官，還需要哪些資訊？（位置、表面構造、周圍組織。）</p></div>", "tb": [["BOOK3", "P10 完整課本頁"], ["BOOK4", "P11 完整課本頁"]]}, {"id": "b3-c11-l14", "t": "肌肉組織：收縮與器官活動", "src": "課本 P12；原PPT第 14 頁", "slide": 14, "sourcePages": [14], "sec": "s3", "figSpec": {"image": "muscles"}, "txt": "<ul><li>骨骼肌、心肌、平滑肌皆能收縮，分布與調控不同。</li><li>肌細胞又稱肌纖維，不能把肌纖維當成結締纖維。</li><li>橫紋與隨意性是兩個不同判讀軸。</li></ul><p class=\"think\">思考：看見橫紋，就能判定是隨意肌嗎？</p><div class=\"ex\"><h4>組成與功能</h4><p>肌肉組織主要由<b>肌細胞</b>（又稱<b>肌纖維</b>）組成。受到神經系統與激素的刺激，肌肉會<b>收縮</b>，帶動肢體與臟器的活動。</p></div><div class=\"ex\"><h4>三種肌肉</h4><p>依肌肉細胞的結構與功能，分成<b>骨骼肌、心肌、平滑肌</b>三類。</p></div><div class=\"ex\"><h4>兩種分類方式</h4><ul><li>依意識控制：<b>隨意肌</b>（骨骼肌）與<b>不隨意肌</b>（心肌、平滑肌）。</li><li>依顯微鏡下有無明暗橫紋：<b>橫紋肌</b>（骨骼肌、心肌）與非橫紋肌（平滑肌）。</li></ul></div><div class=\"ex g\"><h4>圖 1－3　肌肉組織簡介</h4><p>每種肌肉都附有顯微照片、細胞示意圖與特徵說明。三張照片的比例尺不同（5、15、40 µm），因此不能用照片上看起來的大小比較細胞的實際大小。</p></div>", "tb": [["BOOK5", "P12 完整課本頁"]]}, {"id": "b3-c11-l15", "t": "骨骼肌：多核、橫紋與牽動骨骼", "src": "課本 P12；原PPT第 15 頁", "slide": 15, "sourcePages": [15], "sec": "s3", "figSpec": {"image": "skeletal"}, "txt": "<ul><li>典型骨骼肌纖維長圓柱形，多個細胞核位於周邊。</li><li>顯微鏡下可見明暗交替橫紋。</li><li>多數透過肌腱連接骨骼，收縮產生動作，屬隨意肌。</li></ul><p class=\"think\">思考：一張切片只看見一個核，能排除多核骨骼肌嗎？</p><p class=\"scope-note\">判讀提醒：切片方向與範圍會影響可見核數；不能由一個截面直接推整條肌纖維核數。</p><div class=\"ex\"><h4>分布與功能</h4><p>骨骼肌大部分透過<b>肌腱</b>附著在骨骼上，例如手臂的肱二頭肌。收縮時產生動作，屬於可由大腦意識控制的<b>隨意肌</b>。</p></div><div class=\"ex\"><h4>構造特徵</h4><p>一個骨骼肌細胞有<b>多個細胞核</b>，位於細胞<b>邊緣</b>；在顯微鏡下可見<b>明暗交替的橫紋</b>，所以屬於<b>橫紋肌</b>。</p></div><div class=\"ex g\"><h4>怎麼讀這張顯微圖</h4><p>先找平行排列的<b>橫紋</b>，再找靠近細胞邊緣的<b>長橢圓形細胞核</b>。同時有橫紋、多核且靠邊，就可判斷為骨骼肌。</p></div><div class=\"ex\"><h4>和後面的連結</h4><p>肌腱屬於緻密結締組織（1-1.4），骨骼肌與結締組織在運動中緊密合作。</p></div>", "tb": [["BOOK5", "P12 完整課本頁"]]}, {"id": "b3-c11-l16", "t": "心肌：橫紋、分支與同步", "src": "課本 P12；原PPT第 16 頁", "slide": 16, "sourcePages": [16], "sec": "s3", "figSpec": {"image": "cardiac"}, "txt": "<ul><li>心肌主要位於心臟，為不隨意的橫紋肌。</li><li>細胞分支連接，核通常位於中央。</li><li>閏盤中的連接有助機械結合與電訊號溝通。</li></ul><p class=\"think\">思考：心肌與骨骼肌皆有橫紋，如何再找區別？</p><p class=\"scope-note\">判讀提醒：教材以單核示例；心肌細胞通常一核、也可能雙核。閏盤並未在本課本裁圖清楚標示，不能聲稱已由圖辨出。<a href=\"https://histology.leeds.ac.uk/home/tissue_types/muscle/muscle_cell_junctions/\" target=\"_blank\" rel=\"noopener noreferrer\">延伸：心肌細胞連接</a>。</p><div class=\"ex\"><h4>分布與功能</h4><p>心肌構成<b>心臟</b>，收縮時協助把血液推送到全身。</p></div><div class=\"ex\"><h4>構造特徵</h4><p>每個心肌細胞含<b>一個細胞核</b>；有橫紋，屬於<b>橫紋肌</b>；是不受大腦意識控制的<b>不隨意肌</b>。</p></div><div class=\"ex g\"><h4>怎麼讀這張顯微圖</h4><p>先看橫紋（表示橫紋肌），再看細胞核：心肌是單核、位於細胞中央，細胞呈<b>分叉</b>並彼此連成網狀，這是和骨骼肌最容易區分的地方。</p></div><div class=\"ex\"><h4>和骨骼肌比較</h4><p>兩者都有橫紋；但骨骼肌多核、靠邊、受意識控制，心肌單核、居中、不受意識控制。</p></div>", "tb": [["BOOK5", "P12 完整課本頁"]]}, {"id": "b3-c11-l17", "t": "平滑肌：管壁內的活動", "src": "課本 P12；原PPT第 17 頁", "slide": 17, "sourcePages": [17], "sec": "s3", "figSpec": {"image": "smooth"}, "txt": "<ul><li>典型細胞呈紡錘形、中央單核，沒有橫紋。</li><li>位於消化道、血管、泌尿生殖道等具有肌肉的管壁。</li><li>收縮為不隨意活動，不表示完全不受神經或激素調節。</li></ul><p class=\"think\">思考：腸壁會蠕動，是否代表整個腸壁只有平滑肌？</p><div class=\"ex\"><h4>分布與功能</h4><p>平滑肌位於<b>除心臟外</b>具肌肉的臟器壁中，如消化道、泌尿生殖道及血管。收縮可維持臟器的活動。</p></div><div class=\"ex\"><h4>構造特徵</h4><p>一個細胞核；<b>沒有橫紋</b>，不屬於橫紋肌；是不隨意肌。細胞呈兩端尖、中間粗的紡錘形。</p></div><div class=\"ex g\"><h4>怎麼讀這張顯微圖</h4><p>比例尺 40 µm。找到細胞核（位於細胞中央），再確認<b>看不到明暗橫紋</b>，就能與骨骼肌、心肌區分。</p></div><div class=\"ex\"><h4>想一想</h4><p>消化道、血管壁為什麼需要平滑肌？（它們需要持續、不由意識控制的收縮。）</p></div>", "tb": [["BOOK5", "P12 完整課本頁"]]}, {"id": "b3-c11-l18", "t": "三類肌肉：用多個特徵辨識", "src": "課本 P12；原PPT第 18 頁", "slide": 18, "sourcePages": [18], "sec": "s3", "figSpec": {"flip": [18]}, "txt": "<ul><li>同時檢查形狀、核數與位置，以及有無橫紋。</li><li>心肌與平滑肌都不隨意；骨骼肌與心肌都有橫紋。</li><li>結合分布位置，避免用單一特徵排除相似類型。</li></ul><p class=\"think\">思考：有中央核且不隨意，還要哪項特徵才能區分心肌與平滑肌？</p><p class=\"scope-note\">判讀提醒：三圖比例尺不同，不用顯示在螢幕上的大小比較細胞實際大小。原PPT單核是本課教材的典型簡化。</p><div class=\"ex\"><h4>辨識順序</h4><p>先看<b>有沒有橫紋</b>：沒有，是平滑肌；有，再看<b>核數與位置</b>與<b>細胞形狀</b>，分辨骨骼肌與心肌。</p></div><div class=\"ex\"><h4>骨骼肌</h4><ul><li>形狀：圓柱形</li><li>細胞核：多核，位於細胞邊緣</li><li>橫紋：有（橫紋肌）</li><li>控制：隨意肌</li></ul></div><div class=\"ex\"><h4>心肌</h4><ul><li>形狀：分叉圓柱，構成網狀</li><li>細胞核：單核，位於細胞中央</li><li>橫紋：有（橫紋肌）</li><li>控制：不隨意肌</li></ul></div><div class=\"ex\"><h4>平滑肌</h4><ul><li>形狀：紡錘形</li><li>細胞核：單核，位於細胞中央</li><li>橫紋：無</li><li>控制：不隨意肌</li></ul></div><div class=\"ex\"><h4>小提醒</h4><p>單核、多核是本課教材的典型描述。三張圖的比例尺不同，不能用圖上看起來的大小比較細胞。</p></div>", "tb": [["BOOK5", "P12 完整課本頁"]]}, {"id": "b3-c11-l19", "t": "調控與疲勞：比較而不絕對化", "src": "課本 P12；原PPT第 19 頁", "slide": 19, "sourcePages": [19], "sec": "s3", "figSpec": {"flip": [19]}, "txt": "<ul><li>骨骼肌受體神經的運動支配；心肌與多種平滑肌受自主神經調節。</li><li>心肌有節律活動；平滑肌常能維持較持久的張力。</li><li>原表的強弱、疲勞為概括比較，不是每種肌纖維的固定數值。</li></ul><p class=\"think\">思考：耐力活動中的骨骼肌，是否一定很快疲勞？</p><p class=\"scope-note\">判讀提醒：心肌不需每次由自主神經命令才開始跳動；神經可調節心率與收縮。原PPT19不能推論所有骨骼肌皆易疲勞或平滑肌永遠較弱。</p><div class=\"ex\"><h4>分布位置</h4><ul><li>骨骼肌：通常附著在骨骼上</li><li>心肌：心臟</li><li>平滑肌：內臟和血管</li></ul></div><div class=\"ex\"><h4>神經支配</h4><ul><li>骨骼肌：隨意肌</li><li>心肌：不隨意肌</li><li>平滑肌：不隨意肌</li></ul></div><div class=\"ex\"><h4>收縮特性</h4><ul><li>骨骼肌：收縮力強但易疲勞</li><li>心肌：具節律性</li><li>平滑肌：收縮力弱但較持久</li></ul></div><div class=\"ex\"><h4>構造與功能的對應</h4><p>骨骼肌牽動骨骼，需要強而快的動作；心肌規律收縮，持續推送血液；平滑肌在管壁內，維持長時間的緩慢活動。</p></div><div class=\"ex\"><h4>小提醒</h4><p>表中的強弱、疲勞是概括比較，並不是每條肌纖維的固定數值。心肌不需要每次由神經下令才跳動，神經只是調節心率與收縮。</p></div>", "tb": [["BOOK5", "P12 完整課本頁"]]}, {"id": "b3-c11-l20", "t": "神經切片：可見的核與突起", "src": "課本 P13；原PPT第 20 頁", "slide": 20, "sourcePages": [20], "sec": "s4", "figSpec": {"image": "nervous"}, "txt": "<ul><li>神經組織含神經元與多種神經膠細胞。</li><li>染色照片中的細胞本體、核、突起與周圍小核要分開找。</li><li>照片和手繪示意為不同表現方式，黃色、藍色是示意配色。</li></ul><p class=\"think\">思考：照片裡看到膠細胞的核，就表示看見完整膠細胞嗎？</p><div class=\"ex\"><h4>神經組織的組成</h4><p>神經組織由<b>神經細胞</b>（神經元）與<b>神經膠細胞</b>組成。</p></div><div class=\"ex g\"><h4>圖 1－4a　顯微染色照片</h4><p>比例尺 30 µm。圖中可看到神經元的<b>細胞本體</b>、細胞核與<b>細胞突起</b>；神經膠細胞則<b>只能看到細胞核</b>。</p></div><div class=\"ex\"><h4>看圖技巧</h4><p>染色切片中散布的許多小細胞核，有不少屬於神經膠細胞，因為它的細胞輪廓在這種染色下看不清楚。先找較大的細胞本體與突起，再找小核。</p></div><div class=\"ex g\"><h4>對照手繪圖</h4><p>圖 1－4b 的手繪示意圖用<b>黃色</b>表示神經元，<b>藍色</b>表示包覆其軸突的神經膠細胞，可以與照片互相對照。</p></div>", "tb": [["BOOK6", "P13 完整課本頁"]]}, {"id": "b3-c11-l21", "t": "神經元：接收、整合與傳出", "src": "課本 P13；原PPT第 21 頁", "slide": 21, "sourcePages": [21], "sec": "s4", "figSpec": {"image": "nervous"}, "txt": "<ul><li>細胞本體內有細胞核和多種胞器。</li><li>典型教材模型由樹突接收、細胞本體整合、軸突往外傳遞。</li><li>軸突末梢與其他細胞連結；神經訊號不同於血液搬運物質。</li></ul><p class=\"think\">思考：細胞核位於軸突末梢，與位於本體，哪一說法符合本圖？</p><p class=\"scope-note\">判讀提醒：本圖是典型多極神經元模型，訊號方向不能直接概括所有神經元型態與全部情況。</p><div class=\"ex\"><h4>神經元的功能</h4><p>神經元就是神經細胞，可<b>接收與傳遞訊號</b>，連結受器與動器進行協調。</p></div><div class=\"ex\"><h4>構造</h4><p>神經元由一個<b>細胞本體</b>和細胞膜向外延伸的許多<b>突起</b>組成。細胞本體內有<b>細胞核</b>與多種胞器。</p></div><div class=\"ex\"><h4>兩種突起</h4><p><b>樹突</b>：接收來自受器或其他神經元傳入的訊號。<b>軸突</b>（又稱神經纖維）：可產生動作電位（第 4 章詳談），把訊號傳向動器或其他神經元。</p></div><div class=\"ex g\"><h4>訊號的方向</h4><p>神經訊號由<b>樹突</b>傳入細胞本體，再由<b>軸突</b>傳出，最後到軸突末梢。圖 1－4b 以箭頭標出「神經訊號傳入」與「傳出」。</p></div>", "tb": [["BOOK6", "P13 完整課本頁"]]}, {"id": "b3-c11-l22", "t": "神經膠細胞：支持也參與調節", "src": "課本 P13；原PPT第 22 頁", "slide": 22, "sourcePages": [22], "sec": "s4", "figSpec": {"image": "nervous"}, "txt": "<ul><li>膠細胞參與代謝支持、生長發育、修補與微環境調節。</li><li>部分形成髓鞘，保護軸突並增加傳導速度；不是所有膠細胞都形成髓鞘。</li><li>中樞的寡樹突膠細胞、周圍的許旺細胞為延伸例子。</li></ul><p class=\"think\">思考：不以神經元方式產生、傳導動作電位，等於完全不參與訊息調節嗎？</p><p class=\"scope-note\">判讀提醒：原PPT22「數目遠多於神經元」不是所有物種、區域的通則。原研究測得成年男性腦的神經元與非神經元總數相近；非神經元也不全等於膠細胞。<a href=\"https://pubmed.ncbi.nlm.nih.gov/19226510/\" target=\"_blank\" rel=\"noopener noreferrer\">延伸：Azevedo等，2009</a>。</p><div class=\"ex\"><h4>神經膠細胞</h4><p>神經組織中除了神經元，還有多種神經膠細胞，數目遠多於神經元。</p></div><div class=\"ex\"><h4>功能</h4><p>協助神經元的<b>代謝、生長、發育</b>及<b>損傷後的修補</b>，以維持神經元功能的完整。</p></div><div class=\"ex\"><h4>例子：髓鞘</h4><p>有些神經膠細胞會形成<b>髓鞘</b>，包覆軸突，可<b>保護神經元</b>，並<b>增加神經訊號的傳導速度</b>。</p></div><div class=\"ex g\"><h4>讀圖</h4><p>圖 1－4b 中藍色的神經膠細胞包覆黃色神經元的軸突，標示出髓鞘與膠細胞的細胞核。</p></div><div class=\"ex\"><h4>小提醒</h4><p>神經膠細胞不是以神經元的方式產生與傳導動作電位，但不表示它對神經系統沒有調節作用。</p></div>", "tb": [["BOOK6", "P13 完整課本頁"]]}, {"id": "b3-c11-l23", "t": "結締組織：從細胞間質找線索", "src": "課本 P14、P15；原PPT第 23 頁", "slide": 23, "sourcePages": [23], "sec": "s5", "figSpec": {"image": "connective"}, "txt": "<ul><li>細胞加上細胞外間質構成，常以間質特性支持不同功能。</li><li>纖維與纖維以外的基質都屬間質，細胞核不是間質。</li><li>疏鬆、緻密、骨、軟骨、脂肪與血液共享此分類脈絡。</li></ul><p class=\"think\">思考：血液是流動的，為何仍可稱作組織？</p><p class=\"scope-note\">判讀提醒：來源的「纖維蛋白」在此指組織纖維的蛋白質，不全等於凝血時形成的纖維蛋白fibrin。</p><div class=\"ex\"><h4>結締組織的功能</h4><p>結締組織在動物體內的主要功能是<b>連結或聯絡器官的組織</b>。</p></div><div class=\"ex\"><h4>組成</h4><p>通常由<b>細胞</b>與<b>大量細胞間質</b>組成。細胞間質是細胞分泌的衍生物，所以判斷結締組織時，要特別注意「細胞之間有什麼」。</p></div><div class=\"ex\"><h4>六大類</h4><ul><li>疏鬆結締組織</li><li>緻密結締組織</li><li>硬骨</li><li>軟骨</li><li>脂肪組織</li><li>血液</li></ul></div><div class=\"ex g\"><h4>圖 1－5　結締組織簡介</h4><p>課本逐一展示六類結締組織的切片，並標出<b>細胞（核）</b>與<b>細胞間質</b>（如纖維蛋白、血漿）。讀圖時先比較「細胞多還是間質多」，再看間質的性質。</p></div>", "tb": [["BOOK7", "P14 完整課本頁"], ["BOOK8", "P15 完整課本頁"]]}, {"id": "b3-c11-l24", "t": "疏鬆結締：連接、填充與營養", "src": "課本 P14；原PPT第 24 頁", "slide": 24, "sourcePages": [24], "sec": "s5", "figSpec": {"image": "loose"}, "txt": "<ul><li>相較緻密結締，纖維較疏，纖維以外的間質較多。</li><li>連接組織、填充空隙，提供營養與支持。</li><li>腸繫膜幫助固定內部臟器；要用排列證據而非只記所在器官。</li></ul><p class=\"think\">思考：纖維較少，是否就代表毫無支持功能？</p><div class=\"ex\"><h4>特性</h4><p>疏鬆結締組織的<b>細胞和纖維蛋白都少</b>，纖維蛋白以外的細胞間質較多。</p></div><div class=\"ex g\"><h4>讀圖</h4><p>比例尺 50 µm。可看到少數細胞核、細疏的<b>纖維蛋白</b>，以及大片的細胞間質。</p></div><div class=\"ex\"><h4>功能與分布</h4><p>協助<b>連接不同的組織</b>、<b>填充組織空隙</b>，並提供營養與支持。例如<b>腸繫膜</b>，可協助隔離與固定內部臟器的位置。</p></div><div class=\"ex\"><h4>和緻密結締組織比較</h4><p>疏鬆結締纖維少、間質多；下一張的緻密結締則是纖維多、其他間質少。</p></div>", "tb": [["BOOK7", "P14 完整課本頁"]]}, {"id": "b3-c11-l25", "t": "緻密結締：肌腱與韌帶分開", "src": "課本 P14；原PPT第 25 頁", "slide": 25, "sourcePages": [25], "sec": "s5", "figSpec": {"image": "dense"}, "txt": "<ul><li>較多密集纖維有助承受拉力。</li><li>肌腱連接骨骼肌與骨骼；韌帶連接相鄰骨骼。</li><li>照片上常難見完整細胞界限，可先辨纖維母細胞的細胞核。</li></ul><p class=\"think\">思考：把韌帶寫成肌肉連骨骼，會混淆哪兩種構造？</p><p class=\"scope-note\">判讀提醒：本圖為典型緻密排列；其他部位還有緻密不規則結締，不能把全部緻密結締都限定平行纖維。</p><div class=\"ex\"><h4>特性</h4><p>緻密結締組織的<b>纖維蛋白多</b>，細胞與纖維蛋白以外的細胞間質少。</p></div><div class=\"ex g\"><h4>讀圖</h4><p>比例尺 20 µm。可見緊密排列的<b>纖維蛋白</b>，以及夾在其中的<b>纖維母細胞的細胞核</b>（細胞界限不明顯）。</p></div><div class=\"ex\"><h4>分布與功能</h4><p>例如<b>肌腱</b>與<b>韌帶</b>。肌腱連接相鄰的骨骼肌與骨骼；韌帶連接相鄰的骨骼。</p></div><div class=\"ex\"><h4>記憶方式</h4><p><b>肌腱</b>連「肌肉—骨骼」，<b>韌帶</b>連「骨骼—骨骼」。</p></div>", "tb": [["BOOK7", "P14 完整課本頁"]]}, {"id": "b3-c11-l26", "t": "硬骨：細胞與礦化間質", "src": "課本 P15、P14；原PPT第 26 頁", "slide": 26, "sourcePages": [26], "sec": "s5", "figSpec": {"image": "bone"}, "txt": "<ul><li>間質含鈣鹽與膠原蛋白，提供硬度與韌性。</li><li>骨細胞所在位置與周圍間質分開辨認。</li><li>支持、保護與配合肌肉活動，不等於硬骨沒有活細胞。</li></ul><p class=\"think\">思考：硬的材料中仍有細胞，與完全無生命的礦物有何不同？</p><p class=\"scope-note\">判讀提醒：圖示可見同心層的骨元，但不是所有骨組織每一區都呈骨元。</p><div class=\"ex\"><h4>特性</h4><p>硬骨的細胞間質是<b>富含鈣鹽與膠原蛋白的硬骨質</b>，所以質地堅硬。</p></div><div class=\"ex g\"><h4>讀圖</h4><p>比例尺 20 µm。圖中標出<b>硬骨細胞所在位置</b>與<b>細胞間質</b>，可以看到細胞被堅硬的間質包圍。</p></div><div class=\"ex\"><h4>功能與分布</h4><p>具有<b>支持、保護及協助運動</b>的功能，例如大腿腿骨、肋骨。</p></div><div class=\"ex\"><h4>結構與功能</h4><p>堅硬的間質使骨骼能支撐身體、保護內部器官，並作為肌肉附著的支點。</p></div>", "tb": [["BOOK8", "P15 完整課本頁"], ["BOOK7", "P14 完整課本頁"]]}, {"id": "b3-c11-l27", "t": "軟骨：支持與減少摩擦", "src": "課本 P15、P14；原PPT第 27 頁", "slide": 27, "sourcePages": [27], "sec": "s5", "figSpec": {"image": "cartilage"}, "txt": "<ul><li>軟骨細胞分布在富有彈性的細胞間質中。</li><li>關節面軟骨可減少摩擦、分散壓力。</li><li>耳殼、氣管與鼻端的軟骨提供支持，不能將軟骨等同硬骨。</li></ul><p class=\"think\">思考：結構比較時，為何需分開看細胞與間質？</p><div class=\"ex\"><h4>特性</h4><p>軟骨由<b>軟骨細胞</b>及其分泌的細胞間質組成，含軟骨素、葡萄糖胺等，<b>富有彈性</b>。</p></div><div class=\"ex g\"><h4>讀圖</h4><p>比例尺 40 µm。圖中標出<b>軟骨細胞</b>、<b>細胞核</b>與<b>細胞間質</b>。</p></div><div class=\"ex\"><h4>功能與分布</h4><p>硬骨兩端的軟骨可<b>減少關節間的摩擦與壓力</b>；耳殼、氣管及鼻端的軟骨則具有<b>支持</b>的功能。</p></div><div class=\"ex\"><h4>和硬骨比較</h4><p>兩者都由細胞與細胞間質組成。硬骨的間質含鈣鹽、堅硬；軟骨的間質含軟骨素，富有彈性。</p></div>", "tb": [["BOOK8", "P15 完整課本頁"], ["BOOK7", "P14 完整課本頁"]]}, {"id": "b3-c11-l28", "t": "脂肪組織：細胞也能占大部分", "src": "課本 P15、P14；原PPT第 28 頁", "slide": 28, "sourcePages": [28], "sec": "s5", "figSpec": {"image": "adipose"}, "txt": "<ul><li>細胞富含脂肪，核常被推向周邊；間質相對較少。</li><li>儲存能量、緩衝壓力、保溫與保護臟器。</li><li>染色標本的脂滴位置可呈空白，不能把空白當作全是間質。</li></ul><p class=\"think\">思考：看見大片白區，如何依細胞邊界與核判讀？</p><div class=\"ex\"><h4>特性</h4><p>脂肪組織<b>富含脂肪</b>，細胞間質較少。</p></div><div class=\"ex g\"><h4>讀圖</h4><p>比例尺 20 µm。圖中標出<b>脂肪細胞</b>、<b>細胞核</b>、<b>脂肪</b>與<b>細胞間質</b>：細胞的大部分空間被脂肪占據，細胞核被擠向一側。</p></div><div class=\"ex\"><h4>功能與分布</h4><p>儲存能量、緩衝壓力、保溫及保護臟器。分布於全身皮下與臟器之間。</p></div><div class=\"ex\"><h4>為什麼仍屬結締組織</h4><p>它的間質雖少，但仍具有結締組織「連結、支持、保護」的角色，所以不能只用間質多寡來分類。</p></div>", "tb": [["BOOK8", "P15 完整課本頁"], ["BOOK7", "P14 完整課本頁"]]}, {"id": "b3-c11-l29", "t": "血液：液態間質與分工", "src": "課本 P15、P14；原PPT第 29 頁", "slide": 29, "sourcePages": [29], "sec": "s5", "figSpec": {"image": "blood"}, "txt": "<ul><li>血漿是液態細胞間質，紅血球、白血球與血小板為可見的有形成分。</li><li>血液參與物質運送、協調及防禦。</li><li>哺乳類成熟紅血球無核；血小板是細胞碎片，不能說三者都是完整有核細胞。</li></ul><p class=\"think\">思考：血漿與紅血球各提供什麼組織分類證據？</p><p class=\"scope-note\">判讀提醒：原教材將血小板一起列入血球；精確稱呼為血液有形成分，不改動原圖標籤。</p><div class=\"ex\"><h4>特性</h4><p>血液分成<b>血球</b>（紅血球、白血球、血小板）與<b>血漿</b>兩部分，其中血漿就是<b>細胞間質</b>。</p></div><div class=\"ex g\"><h4>讀圖</h4><p>比例尺 20 µm。圖中標示紅血球、白血球、血小板與血漿，可以看到細胞懸浮在液態間質中。</p></div><div class=\"ex\"><h4>分布與功能</h4><p>分布在循環系統中，功能包括<b>運送物質、協調及防禦</b>。</p></div><div class=\"ex\"><h4>間質不一定是固體</h4><p>硬骨的間質堅硬、軟骨的間質有彈性，而血液的間質是<b>液態的血漿</b>，同樣屬於結締組織。</p></div>", "tb": [["BOOK8", "P15 完整課本頁"], ["BOOK7", "P14 完整課本頁"]]}, {"id": "b3-c11-l30", "t": "器官協作：把四類組織串起", "src": "課本 P8、P12、P13、P14、P15；原PPT第 30 頁", "slide": 30, "sourcePages": [30], "sec": "s5", "figSpec": {"pair": ["hierarchy", "connective"], "stack": true}, "txt": "<ul><li>胃的上皮形成內襯並參與分泌與保護。</li><li>平滑肌收縮、神經調節、結締提供連接與支持，共同完成器官功能。</li><li>功能可能重疊，組織種類不能只靠功能字詞作唯一判準。</li></ul><p class=\"think\">思考：要解釋胃能蠕動又能分泌，最少需比較哪些構造？</p><div class=\"ex\"><h4>結締組織的功能整理</h4><p>連結或聯絡器官中的組織、儲存、支持、營養與廢物運輸、保護。</p></div><div class=\"ex\"><h4>六類結締組織各負責什麼</h4><ul><li>疏鬆結締：連接、填充、提供營養</li><li>緻密結締：肌腱連肌肉與骨，韌帶連骨與骨</li><li>硬骨：支持、保護、協助運動</li><li>軟骨：減少摩擦，並支持</li><li>脂肪組織：儲存能量、緩衝、保溫</li><li>血液：運送物質、協調、防禦</li></ul></div><div class=\"ex\"><h4>回到胃：四類組織合作</h4><p>以胃為例：<b>上皮組織</b>形成內襯，參與分泌與保護；<b>平滑肌</b>收縮，使胃蠕動；<b>神經組織</b>調節活動；<b>結締組織</b>提供連接與支持。四類組織各司其職，才能完成胃的功能。</p></div><div class=\"ex\"><h4>小提醒</h4><p>功能可能重疊，不能只靠功能字詞判斷組織類別，仍要回到<b>構造</b>（細胞形態、間質、有無橫紋等）核對。</p></div>", "tb": [["BOOK1", "P8 完整課本頁"], ["BOOK5", "P12 完整課本頁"], ["BOOK6", "P13 完整課本頁"], ["BOOK7", "P14 完整課本頁"], ["BOOK8", "P15 完整課本頁"]]}, {"id": "b3-c11-l31", "t": "原題一：標本失去標籤，怎麼判讀？", "src": "課本 P11、P12、P13、P15；原PPT第 31 頁", "slide": 31, "sourcePages": [31], "sec": "s6", "figSpec": {"image": "originalQuestion"}, "txt": "<ul><li>先觀察甲的橫紋、乙的脂肪空間、丙的上皮排列與丁的突起。</li><li>原題圖為教材示意，並非本班顯微實測照片。</li><li>儀器、細胞核位置與表面特化都要由證據核對。</li></ul><p class=\"think\">思考：原題的哪個敘述能與圖中的結構一致？</p><p class=\"scope-note\">判讀提醒：可在原文頁核對第31頁完整題文與答案，並對照第32頁解析。</p><div class=\"ex\"><h4>原題一（原簡報第 31 頁）</h4><p>右圖是小翰在實驗室觀察到的四種永久玻片標本，但玻片說明貼紙已剝落。請就圖判斷下列敘述何者正確？</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 使用解剖顯微鏡就可清楚看見甲圖中的細胞橫紋</li><li>(B) 乙圖中，脂肪在細胞中占比最高</li><li>(C) 丙圖中的細胞具有纖毛，可擺動排除異物</li><li>(D) 可在丁圖的突起中發現細胞核</li></ul></div><div class=\"ex\"><h4>解題方法</h4><p>先判斷四張圖各是哪一種組織：<b>甲看橫紋</b>、<b>乙看脂肪占據的空間</b>、<b>丙看上皮細胞的排列與表面</b>、<b>丁看突起</b>。辨認完再逐項核對，答案與解析在下一張。</p></div><div class=\"ex\"><h4>小提醒</h4><p>本題的圖是教材示意圖，不是本班實際拍攝的顯微照片。</p></div>", "tb": [["BOOK4", "P11 完整課本頁"], ["BOOK5", "P12 完整課本頁"], ["BOOK6", "P13 完整課本頁"], ["BOOK8", "P15 完整課本頁"]]}, {"id": "b3-c11-l32", "t": "原題一解析：觀察與推論分開", "src": "課本 P11、P12、P13、P15；原PPT第 32 頁", "slide": 32, "sourcePages": [32], "sec": "s6", "figSpec": {"image": "originalQuestion"}, "txt": "<ul><li>原解答為B：乙示脂肪細胞，脂肪占細胞大部分空間。</li><li>丙為小腸上皮，不能把微絨毛當作排異物的纖毛。</li><li>丁的核位於本體；甲的細橫紋需適當複式顯微鏡及解析力。</li></ul><p class=\"think\">思考：哪一項是圖上可見，哪一項需要器官來源或功能知識？</p><div class=\"ex\"><h4>答案：(B)</h4><p>先辨認四張標本：<b>甲 骨骼肌細胞</b>、<b>乙 脂肪細胞</b>、<b>丙 小腸絨毛上皮細胞</b>、<b>丁 神經細胞</b>。</p></div><div class=\"ex\"><h4>逐項解析</h4><ul><li>(A) 錯：解剖顯微鏡倍率不足，無法清楚看到骨骼肌細胞的橫紋。</li><li>(B) 對：乙是脂肪細胞，脂肪占據細胞的大部分空間。</li><li>(C) 錯：丙是小腸絨毛上皮細胞，沒有纖毛。</li><li>(D) 錯：細胞核位於細胞本體，不在突起中。</li></ul></div><div class=\"ex\"><h4>這題在練習什麼</h4><p>把「圖上看得到的證據」（橫紋、脂肪、有無纖毛、核的位置）和「需要器官來源或儀器知識才能判斷的內容」分開，再逐項核對。</p></div>", "tb": [["BOOK4", "P11 完整課本頁"], ["BOOK5", "P12 完整課本頁"], ["BOOK6", "P13 完整課本頁"], ["BOOK8", "P15 完整課本頁"]]}, {"id": "b3-c11-l33", "t": "原題二：結締功能的辨別", "src": "課本 P14、P15；原PPT第 33 頁", "slide": 33, "sourcePages": [33], "sec": "s6", "figSpec": {"image": "specialized"}, "txt": "<ul><li>原答案為D：脂肪組織儲存油脂並保護臟器。</li><li>收縮產生運動以肌肉為主，形成髓鞘是部分神經膠細胞功能。</li><li>基底膜相關功能需依組織層次解釋，不能由一句話否定其他細胞的分泌角色。</li></ul><p class=\"think\">思考：如果問器官功能，而非組織主要功能，答案如何改寫？</p><div class=\"ex\"><h4>原題二（原簡報第 33 頁）</h4><p>下列何者為<b>結締組織</b>的功能？</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 分泌基底膜與其他組織連結</li><li>(B) 可收縮產生運動</li><li>(C) 形成髓鞘保護神經纖維</li><li>(D) 儲存油脂，保護臟器</li></ul></div><div class=\"ex\"><h4>答案：(D)</h4><p>脂肪組織屬於結締組織，可<b>儲存油脂並保護臟器</b>。</p></div><div class=\"ex\"><h4>逐項解析</h4><ul><li>(A) 屬於上皮組織的功能。</li><li>(B) 屬於肌肉組織的功能。</li><li>(C) 屬於神經組織中神經膠細胞的功能。</li></ul></div><div class=\"ex\"><h4>這題在練習什麼</h4><p>把功能對回<b>四類組織</b>：上皮（分泌、與結締連結）、肌肉（收縮）、神經（神經膠細胞形成髓鞘）、結締（儲存、支持、保護）。</p></div>", "tb": [["BOOK7", "P14 完整課本頁"], ["BOOK8", "P15 完整課本頁"]]}, {"id": "b3-c11-l34", "t": "原題三：小心「皆」「所有」「僅」", "src": "課本 P10、P12、P13、P14；原PPT第 34 頁", "slide": 34, "sourcePages": [34], "sec": "s6", "figSpec": {"pair": ["squamousMulti", "nervous"]}, "txt": "<ul><li>原題答案為C、D；組織內可有多種細胞。</li><li>上皮可一層或多層；心肌、平滑肌不受意識隨意控制。</li><li>神經元與膠細胞的典型角色不同，不能把神經組織每種細胞當成神經元。</li></ul><p class=\"think\">思考：為何原題選D，仍不能把膠細胞說成完全無訊息作用？</p><p class=\"scope-note\">判讀提醒：原PPT解析「神經膠細胞無法傳遞訊號」為簡化；本節應理解為不負責以神經元方式產生及傳導動作電位，不否認膠細胞的細胞間訊息與調節作用。</p><div class=\"ex\"><h4>原題三（原簡報第 34 頁）</h4><p>下列有關動物組織的敘述，哪些正確？（多選）</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 上皮組織皆由一層上皮細胞組成</li><li>(B) 所有的肌肉組織都可受大腦控制</li><li>(C) 結締組織中的細胞通常疏鬆地排列於細胞間質中</li><li>(D) 神經組織中的細胞不一定可以傳遞訊號</li><li>(E) 組成單一組織的細胞種類僅有一種</li></ul></div><div class=\"ex\"><h4>答案：(C)(D)</h4><p>(C) 結締組織由細胞與大量細胞間質組成，細胞散布在間質中。(D) 神經膠細胞不像神經元那樣傳遞訊號，而是協助神經元生長、發育等。</p></div><div class=\"ex\"><h4>錯誤選項的解析</h4><ul><li>(A) 有些上皮組織是由多層上皮細胞組成。</li><li>(B) 僅骨骼肌可由大腦意識控制。</li><li>(E) 組織由功能、構造相似的細胞組成，如神經組織就有神經細胞與神經膠細胞，並非只有一種細胞。</li></ul></div><div class=\"ex\"><h4>留意「皆」「所有」「僅」</h4><p>選項出現「皆、所有、僅」這類絕對字眼時，通常要找例外：多層上皮、心肌與平滑肌、含多種細胞的組織，都是例外。</p></div>", "tb": [["BOOK3", "P10 完整課本頁"], ["BOOK5", "P12 完整課本頁"], ["BOOK6", "P13 完整課本頁"], ["BOOK7", "P14 完整課本頁"]]}], "questions": [{"t": "課本圖貼標籤：動物體的組成層次", "q": "依課本圖1–1，把標籤放回圖上的編號格：三個組成層次，以及胃壁由內而外的四層構造。", "learn": 4, "tag": "level", "hint": "左到右由小到大：單一細胞、細胞群、器官；右側胃壁切面由內往外依序是黏膜層、黏膜下層、平滑肌、漿膜層。", "why": "細胞→組織→器官；胃壁由內而外為黏膜層、黏膜下層、平滑肌、漿膜層。胃是器官，胃壁分層與四類基本組織是不同的分類角度。", "sub": "課本 P8 圖1–1；原PPT第 5 頁", "refs": [{"src": "mk_hier", "cap": "圖1–1（標籤已遮蓋）"}], "kind": "drag", "mask": "mk_hier", "ar": 2.1307, "layout": "side", "slots": [{"id": "s0", "label": "細胞", "group": 0, "x": 11.5, "y": 13.85, "v": false}, {"id": "s1", "label": "組織", "group": 1, "x": 36.25, "y": 13.85, "v": false}, {"id": "s2", "label": "器官", "group": 2, "x": 74.0, "y": 13.85, "v": false}, {"id": "s3", "label": "黏膜層", "group": 3, "x": 74.65, "y": 55.13, "v": false}, {"id": "s4", "label": "黏膜下層", "group": 4, "x": 75.62, "y": 76.17, "v": false}, {"id": "s5", "label": "平滑肌", "group": 5, "x": 74.75, "y": 85.49, "v": false}, {"id": "s6", "label": "漿膜層", "group": 6, "x": 74.8, "y": 94.55, "v": false}], "pieces": [{"id": "a0", "label": "細胞", "group": 0}, {"id": "a1", "label": "組織", "group": 1}, {"id": "a2", "label": "器官", "group": 2}, {"id": "a3", "label": "黏膜層", "group": 3}, {"id": "a4", "label": "黏膜下層", "group": 4}, {"id": "a5", "label": "平滑肌", "group": 5}, {"id": "a6", "label": "漿膜層", "group": 6}, {"id": "a7", "label": "器官系統", "group": 100}, {"id": "a8", "label": "結締組織", "group": 101}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2", "s3": "a3", "s4": "a4", "s5": "a5", "s6": "a6"}, "pre": {"s0": "a0"}}, {"t": "三類組織的特徵分類", "q": "將六張特徵卡放入上皮、肌肉或結締欄位；同欄兩格可交換。", "learn": 6, "tag": "level", "hint": "依特徵分類；本題選三類作比較，動物基本組織共四類。", "why": "動物基本組織有上皮、肌肉、神經與結締四類，本題比較其中三類。同類兩格順序不影響判分。", "sub": "課本 P9；原PPT第 7 頁", "refs": [{"src": "BOOK2", "cap": "P9 完整課本頁"}], "legacyQuestion": 1, "kind": "drag", "slots": [{"id": "s0", "label": "上皮組織", "group": 0}, {"id": "s1", "l 肝連\n豬肚\n粉腸\n小肚\n1-1 \n動物組織的構造與功能\n配合課本 \nP6\n、\n7", "4": "◆ \n功能與形態彼此相似的細胞\n加上\n細胞間質\n會聚集為特定單位，稱為\n組織\n→ 想一想，不同的器官是否會有相似的組織？一個器官是由多少種組織構成的呢？\n◆ 在顯微鏡下觀察器官切片，可發現細胞有多種形態與構造\n1-1 \n動物組織的構造與功能\n配合課本 \nP8", "5": "器　官\n不同組織形成器官，如胃是由結締組織、肌肉組織、神經組織等構成\n組　織\n細胞分化後，構造與功能相似的細胞形成組織，如上皮組織\n1-1 \n動物組織的構造與功能\n細　胞\n細胞為生物體的基本組成，如上皮細胞\n◆ 動物體的組成可分為\n細胞\n、\n組織\n、\n器官\n及\n器官系統\n等層次\n黏膜層\n黏膜下層\n平滑肌\n漿膜層\n配合課本 \nP8", "6": "器官系統\n許多器官聚集，形成具特定生理功能的器官系統，如消化系統\n1-1 \n動物組織的構造與功能\n個　體\n不同系統間彼此協調運作，使個體得以生存\n配合課本 \nP9", "7": "◆ 動物組織分為\n上皮組織\n、\n肌肉組織\n、\n神經\n組織\n及\n結締組織\n四類\n1-1 \n動物組織的構造與功能\n結締組織\n肌肉組織\n神經組織\n上皮組織\n配合課本 \nP9\n～\n13", "8": "1-1.1 \n上皮組織\n◆\n 形態\n：\n◇ \n扁平、立方或柱狀\n◇ \n一層或多層細胞\n◇ \n藉由一層富含蛋白質與多醣類的基底膜和結締組織相連\n單層扁平上皮\n多層扁平上皮\n單層立方上皮\n◇ \n通常排列緊密\n基底膜\n基底膜\n基底膜\n配合課本 \nP10\n、\n11\n單層柱狀上皮\n基底膜\n纖毛柱狀上皮\n基底膜", "9": "◇\n 部分器官\n內襯\n，\n例如\n：\n呼吸道（氣管內皮）、血管內皮\n◆ \n位置\n：\n◇ \n體\n表\n，例如\n：\n皮膚表皮\n皮膚表皮\n氣管內皮\n1-1.1 \n上皮組織\n配合課本 \nP10\n、\n11", "10": "扁平上皮\n1-1.1 \n上皮組織\n◆ \n簡介\n：\n肺泡\n由\n單層扁平上皮\n細胞圍繞而成，可進行\n氣體交換\n。\n皮膚表皮\n由\n多層扁平上皮\n細胞構成，可形成\n保護\n的屏障。表皮衍生物如鱗片、毛髮、指甲與蹄爪等，具有保護、禦寒或協助捕食的功能。\n配合課本 \nP10\n10\n單層扁平上皮\n基底膜\n50\n \nµm\n多層扁平上皮\n基底膜\n50\n \nµm", "11": "立方上皮\n腎小管\n由\n單層立方上皮\n細胞組成，有\n吸收\n和\n分泌\n的功能。\n1-1.1 \n上皮組織\n配合課本 \nP11\n單層立方上皮\n基底膜\n40\n \nµm", "12": "柱狀上皮\n小腸絨毛\n由不具纖毛的\n單層柱狀上皮\n細胞構成，與物質的\n吸收\n和\n分泌\n有關。\n1-1.1 \n上皮組織\n氣管\n的\n纖毛柱狀上皮\n細胞的纖毛可單向擺動，有助於\n將表面物質向外推動排出\n。\n配合課本 \nP11\n單層柱狀上皮\n基底膜\n10\n \nµm\n纖毛柱狀上皮\n基底膜\n20\n \nµm", "13": "◇ \n物質交換\n：\n肺泡\n（ \n單層扁平上皮組織 \n）\n、\n微血管\n（ \n單層扁平上皮組織 \n）\n◆ \n功能\n：\n1-1.1 \n上皮組織\n◇ \n分泌\n：\n腎小管\n（ \n單\n層\n立方\n上皮\n組織\n \n）、\n腸道\n（ \n單\n層柱\n狀上皮組織 \n）\n \n◇\n \n阻隔\n、\n保護\n：\n皮膚\n（ \n多層扁平\n上皮\n組織\n \n）\n、黏膜\n（ \n多層扁平\n上皮\n組織\n \n）\n◇ \n吸收\n：\n腎小管\n（ \n單\n層\n立方\n上皮\n組織\n \n）、\n腸道\n（ \n單\n層柱\n狀上皮組織 \n）\n \n◇\n \n推送\n：\n氣管\n（ \n纖毛柱狀\n上皮\n組織\n \n）\n \n◇ \n另外，上皮組織還有\n排泄\n（ 汗腺\n \n）、\n感覺\n（ 味蕾\n \n）等功能\n配合課本 \nP10\n、\n11", "14": "◆\n \n主要由肌\n細胞\n（肌纖維）\n組成\n1-1.2 \n肌肉\n組織\n◆\n 種類\n：\n骨骼肌、心肌及平滑肌\n◆\n \n功能\n：\n神經系統與激素刺激\n後會引起肌肉收縮，帶動肢體與臟器的活動\n骨骼肌\n心肌\n平滑肌\n配合課本 \nP12", function readingBlocks(node){

  if(child.nodeType===3){if(child.textContent.trim()){const p=document.createElement('p');p.textContent=child.textContent;blocks.push(p);}continue;}
  if(child.matches('ul,ol'))for(const li of child.children){const list=document.createElement(child.tagName);list.append(li.cloneNode(true));blocks.push(list);}
  else blocks.push(child.cloneNode(true));
 }return blocks;
}

function splitBlock(node,body){
 // Range fragments keep inline emphasis and every character when a long paragraph needs another page.
 const length=node.textContent.length;if(!length)return [node];const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT),texts=[];let n,offset=0;while(n=walker.nextNode()){texts.push({node:n,start:offset,end:offset+n.length});offset+=n.length;}

 const parts=[];let from=0;while(from<length){let lo=from+1,hi=length,best=lo;while(lo<=hi){const mid=(lo+hi)>>1,c=fragment(from,mid);body.replaceChildren(c);if(body.scrollHeight<=body.clientHeight+1){best=mid;lo=mid+1;}else hi=mid-1;}
  if(best<length){const s=node.textContent.slice(from,best),breakAt=Math.max(s.lastIndexOf('。'),s.lastIndexOf('；'),s.lastIndexOf('，'));if(breakAt>Math.max(20,s.length*.55))best=from+breakAt+1;}
  parts.push(fragment(from,best));from=best;

}
function paginateReading(){
 if(!READING)return;const i=READING.tab,g=READING.groups[i];if(g.notes)return;const pane=el('reading-pane-'+i),body=pane.querySelector('.reading-body'),pager=pane.querySelector('.reading-pager');pager.hidden=false;

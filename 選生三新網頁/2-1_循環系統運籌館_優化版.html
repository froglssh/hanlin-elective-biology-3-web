const CONTENT={"lessons": [{"id": "b3-c21-l01", "t": "循環：把器官分工連成運輸網", "sec": "s1", "slide": 1, "sourceSlides": [1, 2], "sourcePages": [1], "src": "原PPT第 1–2 頁；課本 P32–35", "figSpec": {"image": "overview"}, "txt": "<ul><li>心血管循環運送氧、養分、激素與部分廢物，協助不同器官合作。</li><li>淋巴循環回收組織液，也參與免疫與脂質運送。</li><li>本節依六個主題，追蹤物質的來源、路徑與返回位置。</li></ul><p class=\"think\">物質到達血液後，是否就已經進入所有細胞？</p><div class=\"ex\"><h4>循環系統的任務</h4><p>循環系統在人體內負責運輸<b>養分、氣體及代謝廢物</b>等物質，協助不同器官系統運作，與各種恆定作用息息相關。</p></div><div class=\"ex\"><h4>兩大部分</h4><ul><li><b>心血管循環系統</b>：心臟、血管、血液。心臟規律地收縮與舒張，推動血液在血管中循環。</li><li><b>淋巴循環系統</b>：淋巴器官（如淋巴結）、淋巴管、淋巴。具有回收組織液、免疫等功能。</li></ul></div><div class=\"ex\"><h4>為什麼需要循環系統</h4><p>動物要從環境取得養分並排除廢物。食物中的養分多為大分子，必須先消化成小分子才能吸收；而大部分動物的細胞並未直接接觸外界，因此要靠循環系統運輸。</p></div><div class=\"ex\"><h4>本節六個主題</h4><ul><li>2-1.1 心臟的構造</li><li>2-1.2 血液循環</li><li>2-1.3 心搏週期</li><li>2-1.4 血管與血壓</li><li>2-1.5 血液與淋巴的組成</li><li>2-1.6 淋巴循環</li></ul></div><div class=\"ex\"><h4>深入解說：為什麼需要循環系統</h4><p>物質靠<b>擴散</b>移動只適合很短的距離（擴散時間與距離平方成正比）。體型小、體壁薄的動物（如水螅）細胞離環境很近，不需要循環系統；體型變大後，大多數細胞離環境太遠，必須有一套<b>主動推動體液的運輸網</b>，才能把養分、氧送到每個細胞，並把廢物帶走。循環系統就是為了解決「距離太遠、擴散太慢」而演化出的構造。</p></div><div class=\"ex\"><h4>兩個系統分工</h4><ul><li><b>心血管循環</b>：心臟當泵、血管當管道、血液當載體，速度快，負責主要的運輸。</li><li><b>淋巴循環</b>：把滲出微血管的組織液收集回血液，並參與免疫與脂質運送。</li><li>兩者在鎖骨下靜脈處相連，淋巴液最終回到血液中。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>物質到達血液後，是否就已經進入所有細胞？</p><p><b>答：</b>還沒有。血液只是運輸工具，物質還要穿過<b>微血管壁</b>進入組織液，再穿過<b>細胞膜</b>才進入細胞內。</p></div>", "tb": [["BOOK1", "P32 完整課本頁"]]}, {"id": "b3-c21-l02", "t": "三種體液：跨越哪一道界線？", "sec": "s1", "slide": 3, "sourceSlides": [3, 4], "sourcePages": [], "src": "原PPT第 3–4 頁；課本 P32–35", "figSpec": {"image": "overview"}, "txt": "<ul><li>血漿在血管內；組織液圍繞組織細胞；進入淋巴管後稱為淋巴液。</li><li>微血管壁與細胞膜是不同的界線，血漿不等於完整血液。</li><li>簡單動物可依擴散等方式交換物質；構造與體型會影響運輸需求。</li></ul><p class=\"think\">一個氧分子離開微血管後，還需經過什麼才到細胞內？</p><div class=\"ex g\"><h4>圖 2－1　兩個系統的關係</h4><p>血液經心臟加壓，在血管中流動；<b>血漿</b>滲出微血管，形成<b>組織液</b>；組織液被<b>微淋管</b>回收後，經淋巴結過濾，最後由淋巴管帶回<b>靜脈</b>。</p></div><div class=\"ex\"><h4>三種體液</h4><ul><li><b>血液（血漿）</b>：在血管內。</li><li><b>組織液</b>：圍繞組織細胞。</li><li><b>淋巴</b>：組織液進入淋巴管之後稱為淋巴。</li></ul></div><div class=\"ex\"><h4>不同生物怎麼運輸物質（知識補給站）</h4><ul><li>單細胞生物：靠跨膜運輸、胞吞與胞吐；胞內物質靠細胞質流動（胞質循流）。</li><li>水螅等體制簡單的動物：體壁只有數層細胞，細胞膜直接與環境交換物質，再靠擴散與細胞質流動。</li><li>體制複雜的動物：常發展出含心臟、血管的循環系統。</li></ul></div><div class=\"ex\"><h4>深入解說：一個氧分子的旅程</h4><p>氧分子從血液到粒線體，要依序經過：<b>紅血球內的血紅素釋出 → 血漿 → 微血管壁（內皮細胞）→ 組織液 → 細胞膜 → 細胞質 → 粒線體</b>。前面的「血漿」到「組織液」是跨越微血管壁；後面「組織液」到「細胞內」是跨越細胞膜。血漿、組織液、淋巴成分相近，但所處位置不同，因此名字不同。</p></div><div class=\"ex\"><h4>三種體液比較</h4><ul><li><b>血漿</b>：在血管內，蛋白質含量最高。</li><li><b>組織液</b>：在細胞之間，由血漿滲出形成，成分與血漿相似但蛋白質較少。</li><li><b>淋巴</b>：進入淋巴管的組織液，成分與組織液相似，含較多淋巴球。</li></ul></div><div class=\"ex\"><h4>比較不同動物</h4><p>單細胞生物靠細胞膜直接和環境交換；水螅等體壁僅數層細胞的動物也不需循環；體制複雜、體型大的動物才發展出心臟與血管。這說明<b>構造複雜度與體型、代謝需求</b>相關，但不是「高等／低等」的單一排序。</p></div>", "tb": []}, {"id": "b3-c21-l03", "t": "開放與封閉：看微血管是否連成網", "sec": "s1", "slide": 5, "sourceSlides": [5, 6, 7, 8], "sourcePages": [2], "src": "原PPT第 5–8 頁；課本 P32–35", "figSpec": {"image": "openclosed"}, "txt": "<ul><li>開放式循環的血淋巴可流入血腔，直接接觸組織；蝗蟲是教材例子。</li><li>封閉式循環以微血管連接動脈與靜脈；血液與組織液有界線。</li><li>蚯蚓與人體皆屬封閉式；不能把兩類排成單一高低等序列。</li></ul><p class=\"think\">心臟與血管的存在，足以判定封閉式嗎？</p><div class=\"scope-note\">原網頁「血腫」是錯詞，應區分血腔（循環空間）與血腫（局部出血累積）。循環類型的功能須連同生物的呼吸方式及生活條件比較。</div><div class=\"ex\"><h4>兩類循環系統</h4><p>動物的循環系統依<b>微血管的有無</b>，分為開放式循環與封閉式循環。</p></div><div class=\"ex\"><h4>開放式循環（如蝗蟲）</h4><ul><li>具心臟、血管，<b>不具微血管</b>。</li><li>心臟收縮時，血液經血管直接流入組織間隙，與體細胞交換物質。</li><li>心臟舒張時產生吸力，把組織間隙的體液由心孔送回心臟。</li><li>體液難以區分血液、組織液或淋巴，稱為<b>血淋巴</b>。</li></ul></div><div class=\"ex\"><h4>封閉式循環（如蚯蚓、人類）</h4><ul><li>具心臟、血管、<b>微血管</b>。</li><li>血液在微血管處與全身組織交換物質。</li><li>整個循環過程血液都在心臟或血管中，與組織液有明顯區隔。</li></ul></div><div class=\"ex g\"><h4>圖 知識補給站</h4><p>圖中箭頭表示血液流動方向。蝗蟲的血淋巴由背血管前方及側血管流入體腔，與組織液混合後流回心臟；蚯蚓的血液則在密閉的管中流動，不與組織液或淋巴混合。</p></div><div class=\"ex\"><h4>深入解說：兩種循環的差別在哪裡</h4><p>關鍵問題只有一個：<b>血液離開心臟後，是否一直在血管內流動？</b>開放式循環（如蝗蟲）的血管末端是開口的，體液流入體腔直接浸泡組織，血液、組織液混在一起，稱為血淋巴；封閉式循環（如蚯蚓、人類）的血液始終在由心臟、動脈、微血管、靜脈連成的封閉管道內，血液與組織液分開，兩者交換物質要穿過微血管壁。</p></div><div class=\"ex\"><h4>兩類循環的取捨</h4><ul><li>開放式：構造簡單，壓力低、流速慢，但氧由<b>氣管系統</b>直接送到組織（昆蟲），不依賴血液運氧。</li><li>封閉式：壓力高、流速快、可以靠血管收縮分配血流，適合高代謝需求的動物。</li><li>不要把兩者排成「低等→高等」，它們是不同生活方式的適應。</li></ul></div><div class=\"ex\"><h4>術語提醒</h4><p>開放式循環的空腔稱為<b>血腔</b>（體液流動的空間）；局部出血累積才叫<b>血腫</b>，兩者不可混用。</p></div>", "tb": [["BOOK2", "P33 完整課本頁"]]}, {"id": "b3-c21-l04", "t": "心臟的位置：圖上的左右是誰的左右？", "sec": "s1", "slide": 9, "sourceSlides": [9], "sourcePages": [3], "src": "原PPT第 9 頁；課本 P32–35", "figSpec": {"image": "PPT09S3"}, "txt": "<ul><li>心臟位於胸腔兩肺之間，略偏左，不是整顆都在左肺下。</li><li>正面觀看人體時，圖左常是受觀察者的右側。</li><li>先標出上、下大靜脈，再確認右心房，避免以紙面左右猜腔室。</li></ul><p class=\"think\">解剖圖左側的心房一定是左心房嗎？</p><div class=\"ex\"><h4>心臟的位置</h4><p>心臟位於<b>胸腔中央</b>，心尖略偏左，位於左、右肺之間、橫膈之上（圖 2－2）。</p></div><div class=\"ex g\"><h4>讀解剖圖的方法</h4><p>解剖圖通常是從正面看，圖左側其實是受觀察者的<b>右側</b>。不要用紙面的左右猜腔室，先找<b>上、下大靜脈</b>，確認右心房，再判斷其他腔室。</p></div><div class=\"ex\"><h4>組成</h4><p>心臟主要由<b>心肌</b>構成。</p></div><div class=\"ex\"><h4>深入解說：心臟的位置與保護</h4><p>心臟位於<b>縱隔腔</b>內（胸骨後方、兩肺之間），由胸骨、肋骨與脊柱保護，下方是橫膈。心尖朝向左下方，所以我們常覺得心臟在「左邊」，心跳最容易在左胸摸到，其實心臟大約有三分之二在身體中線左側，另一部分在中線右側。心臟外面包著<b>心包膜</b>，含少量液體，減少心臟跳動時的摩擦。（縱隔腔與心包膜為課外補充。）</p></div><div class=\"ex\"><h4>讀解剖圖的三步驟</h4><ul><li>①先確定圖是<b>從正面</b>看（觀察者面對人體）。</li><li>②找到<b>上、下大靜脈</b>，它們接的是<b>右心房</b>。</li><li>③再往下找右心室，用「對面」原則找出左側的腔室，避免用紙面左右猜測。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>解剖圖左側的心房一定是左心房嗎？</p><p><b>答：</b>不一定。多數圖是從正面看，圖的左側是受觀察者的<b>右側</b>，必須用上、下大靜脈等標誌物來確認。</p></div>", "tb": [["BOOK3", "P34 完整課本頁"]]}, {"id": "b3-c21-l05", "t": "四個腔室：接收與泵送", "sec": "s1", "slide": 10, "sourceSlides": [10, 11], "sourcePages": [], "src": "原PPT第 10–11 頁；課本 P32–35", "figSpec": {"image": "heart"}, "txt": "<ul><li>右心房接收體循環回流；左心房接收肺靜脈回流。</li><li>右心室泵往肺；左心室泵往全身，肌肉壁較厚。</li><li>左右心室長期泵出的血量相當；較厚不表示每次一定泵出更多血。</li></ul><p class=\"think\">左心室較厚，反映較大的血量還是較高的泵送壓力？</p><div class=\"ex\"><h4>內部分隔</h4><p>心臟內部由<b>心室中膈</b>區分為左、右兩部分，左右不相通。</p></div><div class=\"ex\"><h4>心房（上半部）</h4><ul><li>肌肉壁薄，收集來自靜脈的血液。</li><li>右心房連接上、下大靜脈。</li><li>左心房連接肺靜脈。</li></ul></div><div class=\"ex\"><h4>心室（下半部）</h4><ul><li>肌肉較厚，收縮力較強，把血液推入動脈。</li><li>右心室連接肺動脈。</li><li>左心室連接主動脈。左心室的肌肉壁最厚，是收縮力最強的腔室（圖 2－3b）。</li></ul></div><div class=\"ex\"><h4>特化的心肌</h4><p>右心房壁上，靠近上大靜脈基部，有一處稱為<b>節律點</b>（圖中標示），之後的心搏週期會用到。</p></div><div class=\"ex\"><h4>深入解說：心壁厚度與工作負荷</h4><p>心房只需要把血液擠進正下方的心室，距離短、阻力小，所以壁薄；心室要把血液「推出去」，尤其<b>左心室</b>要把血液送到全身（體循環阻力高），所以肌肉壁最厚、收縮力最強；右心室只需要把血液送到近在咫尺的肺（肺循環阻力較低），壁較薄。<b>厚度反映的是需要克服的壓力，而不是每次輸出血量</b>：長期而言左、右心室每分鐘輸出的血量必須相等，否則血液會積在肺或體循環。</p></div><div class=\"ex\"><h4>腔室與血管連接（背誦版）</h4><ul><li><b>右心房</b>：接上、下大靜脈（還有冠狀竇）。</li><li><b>右心室</b>：接肺動脈。</li><li><b>左心房</b>：接肺靜脈。</li><li><b>左心室</b>：接主動脈。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>左心室較厚，反映較大的血量，還是較高的泵送壓力？</p><p><b>答：</b>反映<b>較高的泵送壓力</b>。左右心室每次輸出血量大致相等，但左心室要克服體循環更高的阻力。</p></div>", "tb": []}, {"id": "b3-c21-l06", "t": "四組瓣膜：壓差決定開閉", "sec": "s1", "slide": 12, "sourceSlides": [12, 13], "sourcePages": [4], "src": "原PPT第 12–13 頁；課本 P32–35", "figSpec": {"image": "valves"}, "txt": "<ul><li>右房室瓣為三尖瓣；左房室瓣為二尖瓣，腱索防止瓣片翻入心房。</li><li>主動脈瓣與肺動脈瓣為半月瓣；各有三個小瓣片。</li><li>瓣膜依兩側壓差開閉；四組合計通常有11小瓣片，兩種計數不能混用。</li></ul><p class=\"think\">瓣膜本身會像心肌一樣主動把血液推走嗎？</p><div class=\"scope-note\">腱索與乳頭肌主要維持房室瓣的位置，不是拉開瓣膜的馬達。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/19-1-heart-anatomy\" target=\"_blank\" rel=\"noopener noreferrer\">心臟構造參考</a>。</div><div class=\"ex\"><h4>瓣膜的功能</h4><p>心房與心室之間、心室與動脈之間都有<b>瓣膜</b>，隨心肌收縮與舒張開啟或關閉，防止血液逆流，維持血液<b>單向流動</b>。</p></div><div class=\"ex\"><h4>兩種瓣膜</h4><ul><li><b>房室瓣</b>（心房與心室間）：以腱索和心肌相連。左側為<b>二尖瓣</b>（兩片小瓣），右側為<b>三尖瓣</b>（三片小瓣）。</li><li><b>半月瓣</b>（心室與動脈間）：兩個心室與動脈之間各一組，都由三片小瓣組成。</li></ul></div><div class=\"ex g\"><h4>圖 2－3c　橫切面俯視</h4><p>從上方俯視，可同時看到四組瓣膜：三尖瓣、二尖瓣、主動脈的半月瓣、肺動脈的半月瓣。</p></div><div class=\"ex\"><h4>深入解說：瓣膜如何知道何時開、何時關</h4><p>瓣膜沒有肌肉，也沒有神經，它完全是<b>被動</b>地依兩側的壓力差開閉：房室瓣的「上游」（心房）壓力大於「下游」（心室）時打開，反之關閉；半月瓣的「上游」（心室）壓力大於動脈時打開，反之關閉。血液一旦想倒流，就會把瓣片推合，因此瓣膜保證血液只能單向前進。</p></div><div class=\"ex\"><h4>二尖瓣、三尖瓣與腱索</h4><ul><li>房室瓣的瓣片邊緣連著細小的<b>腱索</b>，腱索連到心室壁上的<b>乳頭肌</b>。</li><li>心室收縮、壓力升高時，乳頭肌同時收縮，拉住腱索，防止瓣片被推翻到心房內。</li><li>腱索與乳頭肌是「拉住瓣膜」的固定裝置，不是「打開瓣膜」的馬達。</li></ul></div><div class=\"ex\"><h4>瓣片數量</h4><ul><li>二尖瓣 2 片＋三尖瓣 3 片＋主動脈半月瓣 3 片＋肺動脈半月瓣 3 片，共 <b>11 片</b>瓣片。</li><li>但瓣膜只有<b>4 組</b>——「組」與「片」是不同的計數單位，不要混用。</li></ul></div>", "tb": [["BOOK4", "P35 完整課本頁"]]}, {"id": "b3-c21-l07", "t": "體循環：由左心室回到右心房", "sec": "s2", "slide": 14, "sourceSlides": [14], "sourcePages": [5], "src": "原PPT第 14 頁；課本 P36–37", "figSpec": {"image": "circuits"}, "txt": "<ul><li>左心室→主動脈→全身組織微血管→大靜脈→右心房。</li><li>組織微血管是交換場所，氧與養分離開血液，部分廢物進入血液。</li><li>動脈與靜脈以相對心臟的流向命名，不以含氧量命名。</li></ul><p class=\"think\">充氧血經組織交換後，為何還叫靜脈血？</p><div class=\"ex\"><h4>體循環的路徑</h4><p>左心室收縮時，<b>充氧血</b>進入主動脈，經分支注入各器官，在器官的微血管完成物質交換後成為<b>減氧血</b>，再由各處靜脈匯集到上、下大靜脈，回到右心房。</p></div><div class=\"ex\"><h4>路徑口訣</h4><ul><li>左心室 → 主動脈 → 體微血管 → 上、下大靜脈 → 右心房</li></ul></div><div class=\"ex g\"><h4>供應範圍</h4><p>體循環供應全身的組織與器官。圖中分成「頭部、胸部及上肢」與「腹部及下肢」兩大微血管網。</p></div><div class=\"ex\"><h4>深入解說：為什麼叫「充氧血／減氧血」比較準</h4><p>動脈、靜脈是依<b>血流方向相對於心臟</b>命名：離開心臟的是動脈，回到心臟的是靜脈。而「充氧血／減氧血」描述的是<b>含氧量</b>。體循環的動脈裡是充氧血、靜脈裡是減氧血；但肺循環剛好相反——肺動脈是減氧血，肺靜脈是充氧血。所以「動脈＝充氧血」只是體循環的巧合，不能當成通則。</p></div><div class=\"ex\"><h4>體循環的功能</h4><ul><li>在<b>組織微血管</b>處釋出 O₂、養分、激素，並接收 CO₂ 與代謝廢物。</li><li>氧被用掉後血液變成減氧血，匯集到上、下大靜脈，回右心房。</li><li>體循環壓力高（主動脈約 120 mmHg），才能把血液送到頭頂與腳趾。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>充氧血經組織交換後，為何叫靜脈血？</p><p><b>答：</b>因為它已<b>返回心臟</b>的方向，管道是靜脈；同時氧已被組織取走，變成減氧血。命名是看流向，不是看含氧量。</p></div>", "tb": [["BOOK5", "P36 完整課本頁"]]}, {"id": "b3-c21-l08", "t": "肺循環：由右心室回到左心房", "sec": "s2", "slide": 15, "sourceSlides": [15, 16], "sourcePages": [], "src": "原PPT第 15–16 頁；課本 P36–37", "figSpec": {"image": "circuits"}, "txt": "<ul><li>右心室→肺動脈→肺微血管→肺靜脈→左心房。</li><li>肺動脈主要運送減氧血，肺靜脈主要運送充氧血。</li><li>兩迴路串聯；肺循環與體循環壓力不同，但不是兩份互不往來的血液。</li></ul><p class=\"think\">一顆紅血球從右心室回到右心室，會依序通過哪些部位？</p><div class=\"ex\"><h4>肺循環的路徑</h4><p>由上、下大靜脈回到右心房的<b>減氧血</b>進入右心室；右心室收縮時，血液流入肺動脈，在肺泡微血管與肺泡組織間交換氣體，成為<b>充氧血</b>，再經肺靜脈流入左心房。</p></div><div class=\"ex\"><h4>路徑口訣</h4><ul><li>右心室 → 肺動脈 → 肺微血管 → 肺靜脈 → 左心房</li></ul></div><div class=\"ex\"><h4>兩個循環的共通點</h4><p>兩種循環都依循「<b>心室 → 動脈 → 微血管 → 靜脈 → 心房</b>」的基本路徑。左、右心室不相通，可以有效區隔肺循環的充氧血與體循環的減氧血，避免混合。</p></div><div class=\"ex\"><h4>小提醒</h4><p>肺動脈運送的是減氧血，肺靜脈運送的是充氧血，不能用「動脈＝充氧血」來判斷。</p></div><div class=\"ex\"><h4>深入解說：肺循環在做什麼</h4><p>右心室把從全身回來的減氧血送到肺。血液流經肺泡周圍的微血管時，<b>CO₂ 擴散進肺泡、O₂ 擴散進血液</b>，血液轉為充氧血，再經肺靜脈送回左心房，進入左心室準備送往全身。因此肺循環的任務是「換氣」，體循環的任務是「供應」。</p></div><div class=\"ex\"><h4>兩個循環其實是串聯</h4><ul><li>人體只有一條連續的路：右心 → 肺 → 左心 → 全身 → 右心。</li><li>所以一顆紅血球走完一圈，要<b>兩次通過心臟</b>：這稱為雙循環。</li><li>心室中膈把左右分開，防止減氧血與充氧血混合，是溫血動物維持高代謝的重要條件。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>一顆紅血球從右心室出發，再回到右心室，依序經過哪些部位？</p><p><b>答：</b>右心室 → 肺動脈 → 肺微血管 → 肺靜脈 → 左心房 → 左心室 → 主動脈 → 體微血管 → 上／下大靜脈 → 右心房 → 右心室。</p></div>", "tb": []}, {"id": "b3-c21-l09", "t": "冠狀循環：心肌也需要供血", "sec": "s2", "slide": 17, "sourceSlides": [17, 18], "sourcePages": [6], "src": "原PPT第 17–18 頁；課本 P36–37", "figSpec": {"image": "coronary"}, "txt": "<ul><li>主動脈起始處分出冠狀動脈，供應心肌。</li><li>主要回流：冠狀微血管→冠狀靜脈→冠狀竇→右心房。</li><li>圖的腹面與背面要分開辨認；冠狀竇主要位於背面。</li></ul><p class=\"think\">心室裡充滿血，為何心肌還需要冠狀動脈？</p><div class=\"ex\"><h4>冠狀循環</h4><p>冠狀循環是專門供應<b>心臟本身</b>的血液循環，屬於體循環的一部分。</p></div><div class=\"ex\"><h4>路徑</h4><ul><li>主動脈基部發出<b>冠狀動脈</b></li><li>小動脈</li><li>心臟微血管網</li><li>小靜脈</li><li><b>冠狀竇</b>（冠狀靜脈的一部分）</li><li>右心房，與其他體循環的減氧血會合</li></ul></div><div class=\"ex g\"><h4>讀圖</h4><p>圖 2－5 分腹面觀與背面觀，標出冠狀動脈、冠狀竇及其分支。冠狀竇位在心臟的背面。</p></div><div class=\"ex\"><h4>深入解說：為什麼心肌要有自己的血管</h4><p>心室腔雖然裝滿血，但心壁很厚，心腔中血液的氧與養分<b>很難擴散進入厚厚的心肌</b>（擴散只適合極短距離）。心肌又是人體最不停歇的肌肉，耗氧量很大，因此必須靠<b>冠狀動脈</b>深入心肌內，在心肌細胞間形成微血管網，直接供應氧與養分。冠狀動脈從主動脈基部分出，是體循環的第一批分支。</p></div><div class=\"ex\"><h4>冠狀循環路徑</h4><ul><li>主動脈基部 → 冠狀動脈 → 小動脈 → 心肌的微血管網 → 小靜脈 → 冠狀竇 → 右心房。</li><li>冠狀竇位於心臟<b>背面</b>，把大部分心臟本身的減氧血帶回右心房。</li><li>讀圖時注意<b>腹面與背面</b>要分開辨認，才不會把冠狀竇當成腹面構造。</li></ul></div>", "tb": [["BOOK6", "P37 完整課本頁"]]}, {"id": "b3-c21-l10", "t": "冠狀灌流：舒張期的重要性", "sec": "s2", "slide": 19, "sourceSlides": [19, 20], "sourcePages": [], "src": "原PPT第 19–20 頁；課本 P36–37", "figSpec": {"image": "PPT19S3"}, "txt": "<ul><li>心肌收縮會壓迫肌內血管，使左心室冠狀灌流在舒張期尤其重要。</li><li>冠狀供血不足可造成心肌缺氧，嚴重時導致心肌梗塞。</li><li>「瓣膜打開遮住冠狀開口」不是可靠的生理機制。</li></ul><p class=\"think\">若心跳很快、舒張時間縮短，冠狀灌流會面臨什麼限制？</p><div class=\"scope-note\">課本P38及原PPT19的「半月瓣遮住開口」保留在原文區，教學採心肌壓迫與灌流壓解釋；不宣稱收縮期血流完全為零。<a href=\"https://pubmed.ncbi.nlm.nih.gov/3793666/\" target=\"_blank\" rel=\"noopener noreferrer\">冠狀血管壓迫的實驗研究</a>。</div><div class=\"ex\"><h4>冠狀動脈何時充血（知識補給站）</h4><p>冠狀動脈的開口位於主動脈基部兩個半月瓣的<b>後方</b>。</p></div><div class=\"ex\"><h4>兩個時期</h4><ul><li><b>左心室收縮</b>：半月瓣打開，遮擋這兩個開口，大部分血液經主動脈泵出心臟。</li><li><b>左心室舒張</b>：半月瓣關閉，開口不再被遮擋，部分血液流入冠狀動脈，進入冠狀循環。</li></ul></div><div class=\"ex\"><h4>心肌梗塞（知識補給站）</h4><p>冠狀動脈內壁若堆積脂肪，血管失去彈性、管壁變厚變硬、管徑變窄而可能阻塞。阻塞後心肌缺血、缺氧；心肌因此受損，就稱為<b>心肌梗塞</b>。國人十大死因中，心血管疾病都名列前茅。</p></div><div class=\"ex\"><h4>深入解說：課本說法與較完整的生理解釋</h4><p>課本的知識補給站用「瓣膜遮住冠狀動脈開口」說明為何舒張期較容易灌流。較完整的解釋是：心室收縮時，心肌會<b>強力擠壓肌肉內的冠狀血管</b>（尤其左心室），使血流減少；心室舒張時，肌肉放鬆、壓迫解除，主動脈壓力又維持在高位，血液便大量流入冠狀動脈。因此<b>左心室的冠狀灌流主要發生在舒張期</b>。課本圖示可用來記憶「舒張期灌流」，但機制以「心肌壓迫＋灌流壓」理解較為可靠。（此段為補充說明。）</p></div><div class=\"ex\"><h4>心肌梗塞的連結</h4><ul><li>冠狀動脈內壁堆積脂肪斑塊（粥狀硬化），管徑變窄、血管失去彈性。</li><li>斑塊破裂或血栓使血管被完全堵住，下游的心肌缺血缺氧而壞死。</li><li>心跳過快時，舒張期被縮短，灌流時間減少，已經狹窄的心肌更容易缺氧。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>心跳很快時，冠狀灌流會面臨什麼限制？</p><p><b>答：</b>心跳加快主要縮短<b>舒張期</b>，而舒張期正是左心室冠狀灌流的主要時間，所以供血時間不足，心肌需氧又增加，容易缺氧。</p></div>", "tb": []}, {"id": "b3-c21-l11", "t": "竇房結：節律與神經調節", "sec": "s3", "slide": 21, "sourceSlides": [21, 27], "sourcePages": [7], "src": "原PPT第 21–27 頁；課本 P38–39", "figSpec": {"image": "PPT21S3"}, "txt": "<ul><li>竇房結位於右心房近上大靜脈處，可自行產生節律性電訊號。</li><li>神經及激素可調節心跳；交感作用通常加快，副交感作用通常減慢。</li><li>教材75次／分是週期示例，不是所有人的固定心跳。</li></ul><p class=\"think\">神經使心跳加快，是否表示沒有神經就完全不能產生心跳？</p><div class=\"ex\"><h4>節律點</h4><p>位置在<b>右心房壁</b>、靠近上大靜脈基部，是<b>特化的心肌組織</b>，可自發性地產生規律的電位變化，經傳導後引起心房與心室的收縮與舒張，使心臟規律搏動，稱為<b>心搏週期</b>。</p></div><div class=\"ex\"><h4>心搏頻率</h4><p>心搏頻率由節律點決定。休息時，成人每分鐘約 <b>75</b> 次，每次心搏約 <b>0.8</b> 秒。</p></div><div class=\"ex\"><h4>心搏頻率的調節</h4><ul><li>運動、發燒、緊張時，心搏頻率加快。</li><li><b>交感神經</b>興奮、<b>腎上腺素</b>分泌，作用於節律點，使心搏加快。</li><li><b>副交感神經</b>興奮，作用於節律點，使心搏減慢。</li></ul></div><div class=\"ex\"><h4>深入解說：心臟為什麼能自己跳</h4><p>節律點（竇房結）是特化的心肌，細胞膜電位會<b>自動、週期性</b>地上升到門檻，不需要外來刺激就產生電訊號。電訊號先傳遍兩個心房使它們收縮，再經房室結（短暫延遲，讓心房把血擠完）與浦金氏纖維，迅速傳遍心室，使心室收縮。因此即使切斷全部神經，心臟仍會跳（如移植後的心臟）。（房室結、浦金氏纖維為課外補充。）</p></div><div class=\"ex\"><h4>神經與激素如何調節</h4><ul><li><b>交感神經</b>與<b>腎上腺素</b>：加快節律點放電頻率，心跳變快、收縮變強（運動、緊張時）。</li><li><b>副交感神經</b>（迷走神經）：減慢節律點放電，心跳變慢（休息時）。</li><li>休息時成人約 75 次／分是參考數值，運動員常更低。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>神經使心跳加快，是否表示沒有神經就完全不能產生心跳？</p><p><b>答：</b>不是。節律點自己就能產生節律，神經只是<b>調節快慢</b>。</p></div>", "tb": [["BOOK7", "P38 完整課本頁"]]}, {"id": "b3-c21-l12", "t": "心室收縮：先關閉，再射血", "sec": "s3", "slide": 22, "sourceSlides": [22], "sourcePages": [], "src": "原PPT第 22 頁；課本 P38–39", "figSpec": {"image": "PPT22S3"}, "txt": "<ul><li>心室壓力上升，使房室瓣關閉，形成第一心音的重要來源。</li><li>壓力超過動脈後，半月瓣才開啟，血液射入動脈。</li><li>收縮初期可有兩類瓣膜都關閉的等容收縮期。</li></ul><p class=\"think\">「心室正在收縮」足以確定半月瓣已開啟嗎？</p><div class=\"scope-note\">原教材以射血時的瓣膜狀態概括收縮；延伸需補上等容期。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/19-3-cardiac-cycle\" target=\"_blank\" rel=\"noopener noreferrer\">心搏週期參考</a>。</div><div class=\"ex\"><h4>心搏週期的分期</h4><p>依心室的收縮與舒張，分為<b>收縮期</b>（心縮期）與<b>舒張期</b>（心舒期）。收縮期較短，舒張期較長。</p></div><div class=\"ex\"><h4>收縮期：心室收縮、心房舒張</h4><ul><li>房室瓣關閉，防止血液逆流回心房；瓣膜受血液撞擊，產生<b>第一心音</b>。</li><li>心室壓力上升，半月瓣打開，血液由心室泵入動脈。</li><li>同時心房舒張，血液由靜脈流入心房。</li></ul></div><div class=\"ex\"><h4>順序重點</h4><p>先<b>關閉房室瓣</b>，再<b>打開半月瓣射血</b>。</p></div><div class=\"ex\"><h4>深入解說：收縮期的順序</h4><p>心室開始收縮時，心室內壓力迅速升高，先高於心房 → <b>房室瓣被推合（第一心音，「噗」）</b>；此時半月瓣尚未打開，心室成為密閉空間，壓力繼續上升。直到心室壓力高過主動脈／肺動脈壓力 → <b>半月瓣打開，血液射入動脈</b>。教材簡化成「房室瓣關閉、半月瓣開啟」，順序要記得是<b>先關房室瓣，再開半月瓣</b>。</p></div><div class=\"ex\"><h4>同時發生的事</h4><ul><li>心房此時處於舒張狀態，靜脈血持續流入心房，為下一次充填做準備。</li><li>射血量就是心搏量：典型成人每次約 70 mL。</li><li>兩個心室同時收縮，右心室送往肺，左心室送往全身。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>心室「正在收縮」不等於半月瓣一定已打開——收縮初期壓力還在建立，只有壓力超過動脈壓，半月瓣才開。</p></div>", "tb": []}, {"id": "b3-c21-l13", "t": "心室舒張：關閉與充填的先後", "sec": "s3", "slide": 23, "sourceSlides": [23, 24], "sourcePages": [], "src": "原PPT第 23–24 頁；課本 P38–39", "figSpec": {"image": "PPT23S3"}, "txt": "<ul><li>心室壓力下降，半月瓣關閉，形成第二心音的重要來源。</li><li>早期等容舒張時兩類瓣膜都閉合；之後房室瓣開啟。</li><li>心室多數充填是被動流入，心房收縮在舒張末期補充充填。</li></ul><p class=\"think\">聽到第二心音時，房室瓣一定已經打開嗎？</p><div class=\"ex\"><h4>舒張期有兩個階段</h4><p>心室舒張、心房先舒張後收縮。</p></div><div class=\"ex\"><h4>第一階段：心室、心房都舒張</h4><ul><li>心室壓力低於主動脈壓力時，半月瓣迅速關閉，瓣膜震動與血液衝擊產生<b>第二心音</b>。</li><li>房室瓣打開，血液由靜脈流入心房，再流入心室。</li></ul></div><div class=\"ex\"><h4>第二階段：心室舒張、心房收縮</h4><ul><li>心房把剩餘的血液注入心室。</li></ul></div><div class=\"ex\"><h4>聽診心音</h4><p>透過聽診心音，可以推測瓣膜關閉功能是否正常，了解心臟搏動是否發生病變。</p></div><div class=\"ex\"><h4>深入解說：舒張期的兩個重點</h4><p>心室收縮結束後，心室壓力快速下降，低於動脈壓力時，動脈中的血液想倒流 → <b>半月瓣被推合（第二心音，「搭」）</b>。此後房室瓣因心室壓力低於心房而打開，血液從心房流入心室。大約七成的充填發生在這一段，是被動流入；舒張末期，心房收縮再把剩下的血擠入心室（約佔最後三成）。</p></div><div class=\"ex\"><h4>心音的記憶</h4><ul><li><b>第一心音</b>：房室瓣關閉，標誌心室收縮開始。</li><li><b>第二心音</b>：半月瓣關閉，標誌心室舒張開始。</li><li>心臟雜音：常因瓣膜關不緊（逆流）或打不開（狹窄），聽診時可發現。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>聽到第二心音時，房室瓣一定已打開嗎？</p><p><b>答：</b>不一定。第二心音是半月瓣關閉的聲音，之後還有一小段「兩種瓣膜都關」的時間，心室壓力再降低到比心房低時，房室瓣才打開。</p></div>", "tb": []}, {"id": "b3-c21-l14", "t": "0.8秒週期：把時間與事件對上", "sec": "s3", "slide": 25, "sourceSlides": [25, 26], "sourcePages": [8], "src": "原PPT第 25–26 頁；課本 P38–39", "figSpec": {"image": "cycle"}, "txt": "<ul><li>75次／分的示例：一個週期60÷75＝0.8秒。</li><li>教材分心房心室全舒張0.4秒、心房收縮0.1秒、心室收縮0.3秒。</li><li>這是簡化模型，不能套成任何心跳速率都固定相同秒數。</li></ul><p class=\"think\">心跳加快後，一個週期仍會是0.8秒嗎？</p><div class=\"ex g\"><h4>圖 2－6　以每分鐘心搏 75 次為例</h4><p>一個心搏週期約 0.8 秒。圖中每三欄為一個心搏週期，各欄標出瓣膜運作、血液流向與心音。</p></div><div class=\"ex\"><h4>時間分配</h4><ul><li>心室收縮（收縮期）：0.3 秒</li><li>心室舒張、心房舒張：0.4 秒</li><li>心室舒張、心房收縮：0.1 秒</li></ul></div><div class=\"ex\"><h4>每個階段的瓣膜</h4><ul><li>收縮期：房室瓣關閉、半月瓣開啟，血流心室 → 動脈。</li><li>舒張期前段：房室瓣開啟、半月瓣關閉，血流靜脈 → 心房 → 心室。</li><li>舒張期後段：房室瓣開啟、半月瓣關閉，心房 → 心室。</li></ul></div><div class=\"ex\"><h4>結論</h4><p>收縮期 0.3 秒，舒張期 0.4 + 0.1 = 0.5 秒，舒張期比收縮期長。</p></div><div class=\"ex\"><h4>深入解說：怎麼算出 0.8 秒</h4><p>每分鐘 75 次 → 每次所需時間＝60 秒 ÷ 75 次＝<b>0.8 秒</b>。把這 0.8 秒拆成三段：心房、心室都舒張 0.4 秒；心房收縮、心室舒張 0.1 秒；心室收縮 0.3 秒。可知心臟一個週期中，<b>休息（舒張）的時間比工作（收縮）的時間長</b>：舒張期共 0.5 秒、收縮期 0.3 秒，所以心臟能夠整天工作而不疲勞。</p></div><div class=\"ex\"><h4>心跳加快時會怎樣</h4><ul><li>週期縮短（如 120 次／分，一個週期只有 0.5 秒）。</li><li>縮短的主要是<b>舒張期</b>，收縮期變化較小。</li><li>舒張期過短時，心室充填不足、冠狀灌流時間也減少，這是跑得太快會頭暈、胸悶的原因之一。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>心跳加快後，一個週期仍會是 0.8 秒嗎？</p><p><b>答：</b>不會。週期＝60 ÷ 心跳次數，次數越多，週期越短；0.8 秒只是 75 次／分的示例。</p></div>", "tb": [["BOOK8", "P39 完整課本頁"]]}, {"id": "b3-c21-l15", "t": "心電圖：電活動先於機械反應", "sec": "s3", "slide": 28, "sourceSlides": [28, 29], "sourcePages": [], "src": "原PPT第 28–29 頁；課本 P38–39", "figSpec": {"image": "ecg"}, "txt": "<ul><li>P波反映心房去極化；QRS波群反映心室去極化；T波反映心室再極化。</li><li>電活動引發後续機械反應，波形不是直接量測收縮力量或血量。</li><li>教材異常示例可用於辨識節律差異，不能憑單張圖自我診斷。</li></ul><p class=\"think\">T波代表再極化，是否等於心室已完成全部舒張？</p><div class=\"scope-note\">原PPT將波形簡寫為收縮／舒張，須區分電與機械事件。<a href=\"https://openstax.org/books/anatomy-and-physiology-2e/pages/19-3-cardiac-cycle\" target=\"_blank\" rel=\"noopener noreferrer\">電活動與心搏事件參考</a>。</div><div class=\"ex\"><h4>心電圖</h4><p>心搏週期中，心肌收縮前、後會有<b>電位變化</b>。把電極貼在體表，可測量傳到體表的電位變化，稱為心電圖（ECG 或 EKG）。</p></div><div class=\"ex\"><h4>正常心電圖的三個波</h4><ul><li><b>P 波</b>：心房收縮的電位變化</li><li><b>QRS 複合波</b>：心室收縮的電位變化</li><li><b>T 波</b>：心室舒張的電位變化</li></ul></div><div class=\"ex\"><h4>心律不整</h4><p>心搏週期不正常時，心電圖會出現異常，稱為心律不整。例如<b>心房震顫</b>患者的心房無法正常收縮，缺乏 P 波，QRS 複合波也沒有規律性。醫師可藉心電圖診斷異常原因。</p></div><div class=\"ex\"><h4>深入解說：為什麼心電圖會先於收縮</h4><p>心肌細胞要先<b>去極化</b>（電位改變）才會收縮，所以電活動比機械收縮早一步發生。心電圖上：<b>P 波</b>是心房去極化，接著心房收縮；<b>QRS 複合波</b>是心室去極化（振幅大），接著心室收縮；<b>T 波</b>是心室再極化，之後心室舒張。課本把波形直接寫成「收縮／舒張的電位變化」，是簡化說法，正式說法是電活動先、機械反應後。</p></div><div class=\"ex\"><h4>心電圖能看出什麼</h4><ul><li>心跳速率與規律性（兩個 R 波的間隔）。</li><li>傳導是否正常（P 波到 QRS 波的時間）。</li><li>缺血、梗塞時 ST 段與 T 波會改變（課外補充）。</li><li>心房震顫：心房不規則顫動，P 波消失，心室收縮不規則。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>心電圖不是直接量收縮力量或血量，也不能由一張示意圖自我診斷，診斷需醫師判讀。</p></div>", "tb": []}, {"id": "b3-c21-l16", "t": "三種血管：構造支持哪種功能？", "sec": "s4", "slide": 30, "sourceSlides": [30, 31, 32], "sourcePages": [9], "src": "原PPT第 30–32 頁；課本 P40–41", "figSpec": {"image": "vessels"}, "txt": "<ul><li>動脈送離心臟，壁較厚且富彈性；彈性回縮有助維持血流。</li><li>比較壁厚與管徑要在相近等級的血管間比較。</li><li>微血管總橫截面積大，是低流速與交換功能的重要條件。</li></ul><p class=\"think\">能用一條小動脈的管徑，代表所有動脈都比所有靜脈細嗎？</p><div class=\"ex\"><h4>三種血管</h4><p>人體的血管分成<b>動脈、靜脈、微血管</b>。</p></div><div class=\"ex\"><h4>動脈</h4><ul><li>功能：把血液由心臟送到器官。</li><li>多層平滑肌與結締組織，彈性纖維發達、聚集成<b>彈性膜</b>，彈性較佳。</li><li>可承受心臟收縮時的血流壓力；心臟舒張時，管壁回彈，把血液送到器官。</li><li>管壁較厚、管徑較小。</li></ul></div><div class=\"ex\"><h4>動脈血液的動力</h4><p>來自<b>心室的收縮</b>與<b>動脈管壁彈性的恢復力</b>。</p></div><div class=\"ex g\"><h4>圖 2－7</h4><p>比較動脈、靜脈、微血管的橫剖面；動脈的中層有彈性膜與平滑肌，外層為結締組織。</p></div><div class=\"ex\"><h4>深入解說：三種血管的構造對照功能</h4><p><b>動脈</b>要承受心室射出的高壓，所以壁厚、有彈性膜：心室收縮時管壁被撐大，儲存一部分能量；心室舒張時管壁彈回，繼續推動血液，使血流在舒張期不致中斷。<b>靜脈</b>血壓低，不需要厚壁，但管腔大、可容納大量血液（靜脈是「血液庫」），再靠瓣膜與肌肉擠壓回流。<b>微血管</b>只有單層內皮，專門做交換。</p></div><div class=\"ex\"><h4>快速對照</h4><ul><li>動脈：厚、彈性強、管徑相對小、無瓣膜。</li><li>靜脈：薄、彈性弱、管徑大、較大靜脈有瓣膜。</li><li>微血管：最薄、只有內皮與基底膜、數量最多。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>能用一條小動脈的管徑，代表所有動脈都比所有靜脈細嗎？</p><p><b>答：</b>不能。比較要在相近層級的血管間進行：主動脈很粗，小靜脈很細。課本的比較是整體趨勢，不是每一條的絕對大小。</p></div>", "tb": [["BOOK9", "P40 完整課本頁"]]}, {"id": "b3-c21-l17", "t": "微血管：交換的薄壁", "sec": "s4", "slide": 33, "sourceSlides": [33, 34], "sourcePages": [], "src": "原PPT第 33–34 頁；課本 P40–41", "figSpec": {"image": "exchange"}, "txt": "<ul><li>微血管壁以內皮及基底膜為主要構造，距離短利於交換。</li><li>氧與二氧化碳等可依濃度差移動；水的移動還涉及壓力與屏障。</li><li>不同器官微血管通透性不同，不將圖中間隙套成全身都一樣。</li></ul><p class=\"think\">氣體擴散與整體液體濾出，是同一個機制嗎？</p><div class=\"ex\"><h4>微血管的構造</h4><p>由<b>單層扁平的內皮細胞</b>與<b>基底膜</b>構成，管壁最薄、細胞間隙大。</p></div><div class=\"ex\"><h4>位置與功能</h4><p>連接動脈與靜脈，分布在各組織細胞之間，是血液與組織細胞<b>進行物質交換</b>的場所。</p></div><div class=\"ex\"><h4>交換什麼</h4><ul><li>血液 → 組織細胞：水、氧氣、葡萄糖、胺基酸</li><li>組織細胞 → 血液：水、二氧化碳、廢物</li></ul></div><div class=\"ex g\"><h4>圖</h4><p>圖 2－7 的微血管縱剖面取自卵巢，比例尺 30 µm。</p></div><div class=\"ex\"><h4>深入解說：微血管為什麼適合交換</h4><p>①<b>壁最薄</b>：僅單層扁平內皮與基底膜，擴散距離短；②<b>數量極多</b>：總表面積非常大（全身微血管展開約數千平方公尺）；③<b>血流最慢</b>：血液停留時間長，物質有充分時間交換；④<b>與幾乎每個細胞相鄰</b>：細胞離微血管通常不超過幾個細胞的距離。這四項合起來使交換既快又完整。</p></div><div class=\"ex\"><h4>跨過微血管壁的方式（概略）</h4><ul><li>氣體與脂溶性小分子：直接擴散穿過內皮細胞。</li><li>水與小分子溶質：經過細胞間隙或胞飲運輸，受壓力與濃度共同影響。</li><li>大分子（如血漿蛋白）通常不易濾出，這是維持膠體滲透壓的重要條件。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>氣體擴散與整體液體濾出，是同一個機制嗎？</p><p><b>答：</b>不是。氣體是依濃度差<b>擴散</b>；液體濾出還與血壓、血漿蛋白的滲透力等有關，是不同的機制。</p></div>", "tb": []}, {"id": "b3-c21-l18", "t": "血流分配：不是每條微血管都一直開放", "sec": "s4", "slide": 35, "sourceSlides": [35, 36], "sourcePages": [12], "src": "原PPT第 35–36 頁；課本 P40–41", "figSpec": {"image": "PPT35S3"}, "txt": "<ul><li>教材以微血管前括約肌說明局部血流分配。</li><li>組織活動與代謝條件改變，可影響局部血流。</li><li>圖中的括約肌是簡化模型，不表示每一器官微血管都有相同構造。</li></ul><p class=\"think\">運動時不同組織都需要同比例增加血流嗎？</p><div class=\"ex\"><h4>括約肌控制血流</h4><p>小動脈與微血管交界處有<b>括約肌</b>，能控制微血管網的充血量。括約肌<b>收縮</b>時，微血管不充血；<b>舒張</b>時，微血管充血。</p></div><div class=\"ex\"><h4>什麼是括約肌（知識補給站）</h4><p>括約肌是分布在管腔壁的<b>環狀肌</b>：收縮時關閉管腔，舒張時開放管腔，用來控制物質通過。</p></div><div class=\"ex\"><h4>身體中的括約肌</h4><p>消化道的賁門、幽門、迴腸與盲腸交界處、肛門，泌尿系統的膀胱、尿道，以及眼睛的虹膜等部位，都有括約肌。</p></div><div class=\"ex\"><h4>深入解說：血流是依需求分配的</h4><p>全身的血量有限（成人約 5 L），不可能所有微血管同時全開。小動脈與微血管交界處的<b>微血管前括約肌</b>收縮，血液就繞過這個網路；舒張，血液就流入。運動時，骨骼肌的括約肌舒張、血流增加；而消化道的血流則相對減少。飯後則相反，消化道血流增加。這樣身體能把有限的血液優先配給最需要的器官。</p></div><div class=\"ex\"><h4>括約肌是什麼</h4><ul><li>括約肌是<b>環狀肌</b>，圍繞管腔：收縮＝管腔關閉，舒張＝管腔開放。</li><li>身體中的例子：賁門、幽門、肛門、尿道、虹膜（控制瞳孔）等。</li><li>微血管前括約肌受局部代謝產物（如 CO₂ 增加）與神經影響。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>運動時不同組織都需要同比例增加血流嗎？</p><p><b>答：</b>不需要。血流依各組織的代謝需求<b>重新分配</b>：活動中的骨骼肌大幅增加，腦的血流大致維持，消化道的血流會減少。</p></div>", "tb": [["BOOK12", "P43 完整課本頁"]]}, {"id": "b3-c21-l19", "t": "靜脈回流：外力與瓣膜合作", "sec": "s4", "slide": 37, "sourceSlides": [37, 38], "sourcePages": [], "src": "原PPT第 37–38 頁；課本 P40–41", "figSpec": {"image": "PPT38S3"}, "txt": "<ul><li>靜脈將血液送回心臟，壓力較低。</li><li>骨骼肌收縮及呼吸壓力變化有助回流；部分靜脈瓣膜限制逆流。</li><li>瓣膜本身不是泵，也不是所有大型靜脈都具有瓣膜。</li></ul><p class=\"think\">若沒有肌肉收縮，只有瓣膜，會主動推血嗎？</p><div class=\"ex\"><h4>靜脈的構造</h4><p>平滑肌與結締組織比動脈少，彈性纖維少，<b>不形成彈性膜</b>，彈性較差；管壁較薄、管徑較大。較大的靜脈有<b>瓣膜</b>，防止血液逆流。</p></div><div class=\"ex\"><h4>靜脈血液回心臟的動力</h4><ul><li>管壁旁<b>骨骼肌收縮</b>，擠壓靜脈。</li><li><b>吸氣時胸腔內的負壓</b>，幫助靜脈血流回心臟。</li><li><b>靜脈瓣</b>防止血液逆流。</li></ul></div><div class=\"ex\"><h4>和動脈比較</h4><p>動脈靠心臟收縮與管壁回彈送血；靜脈沒有彈性膜，主要靠外力加上瓣膜。</p></div><div class=\"ex\"><h4>深入解說：靜脈回流的「三個幫手」</h4><p>靜脈壓很低，血液要逆著重力從下肢回到心臟並不容易，靠三項機制：①<b>骨骼肌幫浦</b>——肌肉收縮擠壓靜脈，把血往上擠；②<b>瓣膜</b>——肌肉放鬆後，瓣膜關閉，血液不能倒退；③<b>呼吸幫浦</b>——吸氣時胸腔壓力降低（負壓），靜脈血被「吸」向心臟。長時間站立不動時，這三項幫手停工，血液容易積在下肢，造成腿腫、頭暈。</p></div><div class=\"ex\"><h4>瓣膜失效的後果</h4><ul><li>靜脈瓣膜功能不佳 → 血液倒流、積在淺層靜脈 → <b>靜脈曲張</b>。</li><li>久坐、久站、懷孕都是風險因素。</li><li>建議：適時活動小腿肌肉、抬腿、穿彈性襪。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>沒有肌肉收縮，只有瓣膜，會主動推血嗎？</p><p><b>答：</b>不會。瓣膜只是單向閥，防止逆流，並沒有推動血液的力量，推力來自肌肉擠壓與呼吸時的壓力變化。</p></div>", "tb": []}, {"id": "b3-c21-l20", "t": "速度、流量與壓力：三個不同量", "sec": "s4", "slide": 39, "sourceSlides": [39], "sourcePages": [], "src": "原PPT第 39 頁；課本 P40–41", "figSpec": {"image": "PPT39S3"}, "txt": "<ul><li>血流速度是距離／時間；體積流量是體積／時間。</li><li>在同一串聯循環的穩定狀態，總流量相近，速度隨總橫截面積改變。</li><li>微血管總橫截面積最大，平均流速最低，不是單條管徑最大。</li></ul><p class=\"think\">微血管流速慢，是否表示整個微血管網每分鐘運送最少的血量？</p><div class=\"ex\"><h4>怎麼讀這張比較表</h4><p>橫向比較動脈、微血管、靜脈，每一列是一項特徵。</p></div><div class=\"ex\"><h4>管壁與管腔</h4><ul><li>管壁厚度：動脈最厚，靜脈其次，微血管最薄。</li><li>管腔大小：靜脈最大，動脈其次，微血管最小。</li><li>管壁彈性：動脈較大，靜脈較小，微血管無。</li></ul></div><div class=\"ex\"><h4>截面積、流速與瓣膜</h4><ul><li>總截面積：微血管最大，靜脈其次，動脈最小。</li><li>血流速度：動脈最快，靜脈其次，微血管最慢。</li><li>瓣膜：動脈、微血管無，較大靜脈有。</li></ul></div><div class=\"ex\"><h4>小提醒</h4><p>速度、流量、壓力是三個不同的量；微血管流速最慢，正好利於物質交換。</p></div><div class=\"ex\"><h4>深入解說：流速與總截面積的關係</h4><p>在一條串聯的管路中，單位時間流過每個橫切面的血量（流量）必須相等。血流速度＝流量 ÷ 總橫切面積。主動脈只有一條，總截面積小，流速最快；分支成微血管後，<b>微血管的總截面積遠大於主動脈</b>，所以流速最慢；匯集成靜脈後，總截面積變小，流速又回升。就像河流匯入寬闊的湖泊，水流會變慢。</p></div><div class=\"ex\"><h4>三個容易混淆的量</h4><ul><li><b>速度</b>：距離／時間，微血管最慢。</li><li><b>流量</b>：體積／時間，各段串聯時總流量相等。</li><li><b>壓力</b>：血液對管壁的力，沿動脈 → 微血管 → 靜脈逐漸下降。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>微血管流速慢，是否表示整個微血管網每分鐘運送的血量最少？</p><p><b>答：</b>不是。微血管網的<b>總流量</b>等於心輸出量，與其他部位相同；每條微血管很細、流量小，但數量非常多。</p></div>", "tb": []}, {"id": "b3-c21-l21", "t": "血壓曲線：讀位置與脈動幅度", "sec": "s4", "slide": 40, "sourceSlides": [40, 41, 45], "sourcePages": [10], "src": "原PPT第 40–45 頁；課本 P40–41", "figSpec": {"image": "pressure"}, "txt": "<ul><li>收縮壓與舒張壓是動脈壓力波動的高、低值。</li><li>血壓沿循環路徑下降；肺循環壓力通常低於體循環。</li><li>靜脈端壓力低仍可有血流；課本120／80是示例，非個人診斷規則。</li></ul><p class=\"think\">曲線靠近零，能否直接說靜脈血液完全停止？</p><div class=\"ex\"><h4>什麼是血壓</h4><p>血液在血管中流動時，施於血管壁的壓力稱為<b>血壓</b>。</p></div><div class=\"ex\"><h4>兩種血壓</h4><ul><li><b>收縮壓</b>：心室收縮，血液泵入動脈使血管擴張時，在動脈量測到的血壓。</li><li><b>舒張壓</b>：心室舒張，血壓下降，血液因血管彈性回縮而流動時所維持的血壓。</li></ul></div><div class=\"ex g\"><h4>圖 2－8　血管系統的壓力變化</h4><p>在體循環中，血壓由大到小依序為：主動脈 → 小動脈 → 微血管 → 小靜脈與靜脈，靜脈血壓已接近零。縱軸約 120、80、40、0 mmHg。</p></div><div class=\"ex\"><h4>血壓要恆定</h4><p>血壓會依年齡、情緒、活動狀況或疾病而變動，但必須維持恆定：過低有休克甚至死亡的危險，過高則易引發中風、心臟病等。</p></div><div class=\"ex\"><h4>深入解說：血壓為什麼沿著血管下降</h4><p>血液流動需要克服血管壁的摩擦阻力，每經過一段，就會損失一點壓力。<b>小動脈與微血管的阻力最大</b>（管徑小），壓力在這裡下降得最多；到靜脈時壓力已接近零，這樣的低壓用大量的靜脈容量、瓣膜與肌肉幫浦就足夠。肺循環的血管短而粗、阻力小，所以壓力比體循環低很多。</p></div><div class=\"ex\"><h4>血壓的讀法</h4><ul><li><b>收縮壓</b>（如 120）：心室收縮時，動脈壓力的高值。</li><li><b>舒張壓</b>（如 80）：心室舒張時，動脈壓力的低值，由血管彈性回縮維持。</li><li>兩者差稱為<b>脈壓</b>；動脈變硬時，脈壓增大。</li><li>120/80 mmHg 是示例，臨床判斷要依專業標準與多次測量。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>曲線靠近零，能直接說靜脈血液完全停止嗎？</p><p><b>答：</b>不能。靜脈壓雖然接近零，但仍有「微小壓力差」推動血液前進，加上肌肉擠壓與呼吸幫浦，血液仍持續流回心臟。</p></div>", "tb": [["BOOK10", "P41 完整課本頁"]]}, {"id": "b3-c21-l22", "t": "心輸出量：兩個因素相乘", "sec": "s4", "slide": 42, "sourceSlides": [42], "sourcePages": [], "src": "原PPT第 42 頁；課本 P40–41", "figSpec": {"image": "PPT42S3"}, "txt": "<ul><li>心輸出量＝每搏輸出量×心跳速率。</li><li>70 mL／次×75次／分＝5250 mL／分，是計算示例。</li><li>平均動脈壓還與周邊阻力相關；心跳加快不保證輸出量等比例上升。</li></ul><p class=\"think\">心跳太快使充填不足，每搏輸出量下降時，總輸出量一定增加嗎？</p><div class=\"scope-note\">公式中的兩個量都可能變動，不能固定其中一項而忘記條件；此處是生理量的計算練習。</div><div class=\"ex\"><h4>血壓由什麼決定</h4><p>血壓與<b>心輸出量</b>及<b>周邊血管阻力</b>的乘積成正比。</p></div><div class=\"ex\"><h4>心輸出量</h4><ul><li>每分鐘由心臟輸入主動脈的血量。</li><li>心輸出量 ＝ 心搏量 × 心搏頻率。</li><li>心搏量愈大、心搏頻率愈高，心輸出量愈大，血壓愈高。</li></ul></div><div class=\"ex\"><h4>周邊血管阻力</h4><ul><li>血液流經血管時所產生的阻力。</li><li>與血管管徑和硬化程度有關。</li><li>管徑愈小、硬化程度愈大，阻力愈大，血壓愈高。</li></ul></div><div class=\"ex\"><h4>深入解說：血壓的「公式」</h4><p>血壓 ∝ 心輸出量 × 周邊阻力。可以想成水龍頭接水管：水龍頭開得大（心輸出量大）、水管出口捏小（阻力大），水管內的壓力就高。<b>心輸出量＝每搏輸出量（心搏量）× 心跳速率</b>，若心搏量 70 mL、心跳 75 次／分，則心輸出量＝70 × 75＝5250 mL／分（約 5.25 L／分），接近全身血量，也就是全身血液大約每分鐘循環一圈。</p></div><div class=\"ex\"><h4>讓血壓升高的因素</h4><ul><li>心搏量增加（血量增加、心肌收縮力增強）。</li><li>心跳速率增加。</li><li>周邊阻力增加（血管收縮、血管硬化、血液黏稠）。</li><li>血量增加，如攝取過多鹽分造成水分滯留。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>心跳太快使充填不足，每搏輸出量下降時，總輸出量一定增加嗎？</p><p><b>答：</b>不一定。心輸出量是兩個量的乘積；心跳加快但心搏量下降太多，總輸出量反而可能降低。</p></div>", "tb": []}, {"id": "b3-c21-l23", "t": "血壓負回饋：先追蹤刺激", "sec": "s4", "slide": 43, "sourceSlides": [43, 44], "sourcePages": [], "src": "原PPT第 43–44 頁；課本 P40–41", "figSpec": {"image": "baroreflex"}, "txt": "<ul><li>血壓下降→壓受器放電減少→延腦整合。</li><li>交感作用增加可提升心跳與收縮力，並增加相關血管阻力。</li><li>反應削弱原先低血壓刺激，屬負回饋；嚴重失血可能超過補償能力。</li></ul><p class=\"think\">血壓被調升，為何仍然是負回饋？</p><div class=\"ex\"><h4>血壓的感測</h4><p>人體的<b>主動脈與頸動脈</b>有壓力受器，可感測血壓變化，並把訊息傳到腦幹<b>延腦</b>的心血管調節中樞，再由神經系統調節（圖 2－9）。</p></div><div class=\"ex\"><h4>血壓下降（例如大量失血）</h4><ul><li>心搏頻率與心肌收縮力增加，提高心輸出量。</li><li>動脈平滑肌收縮，縮小管徑，增加周邊血管阻力。</li><li>結果：血壓升高。</li></ul></div><div class=\"ex\"><h4>血壓上升時</h4><p>會降低心搏頻率，降低心輸出量，促使血壓降低。這些都是削弱刺激的<b>負回饋</b>。</p></div><div class=\"ex g\"><h4>反射的順序</h4><p>刺激（血壓變化）→ 受器（壓力受器）→ 感覺神經 → 中樞（延腦）→ 運動神經 → 動器（心臟、血管）→ 血壓調節。</p></div><div class=\"ex\"><h4>深入解說：壓力反射的步驟</h4><p>以<b>血壓突然下降</b>（站起來太快）為例：①頸動脈與主動脈的壓力受器被拉伸減少 → ②傳向延腦的訊號<b>減少</b> → ③延腦判斷「血壓偏低」，增加交感神經輸出、減少副交感輸出 → ④心跳加快、收縮增強，小動脈收縮 → ⑤血壓回升。血壓偏高時則相反。整個迴路在幾秒內完成，所以健康的人站起來不會昏倒。</p></div><div class=\"ex\"><h4>為什麼這是負回饋</h4><ul><li>刺激：血壓偏低。</li><li>反應：血壓上升。</li><li>結果削弱了原本的刺激，所以是負回饋。</li><li>「把血壓拉高」不等於正回饋，要看它有沒有把偏離拉回。</li></ul></div><div class=\"ex\"><h4>限制</h4><p>嚴重失血時，補償機制可能來不及或超出能力範圍，仍會休克；恆定調節有其極限。</p></div>", "tb": []}, {"id": "b3-c21-l24", "t": "血液組成：兩個百分比的分母", "sec": "s5", "slide": 46, "sourceSlides": [46, 52], "sourcePages": [11], "src": "原PPT第 46–52 頁；課本 P42–43", "figSpec": {"image": "PPT46S3"}, "txt": "<ul><li>全血約55%是血漿，約45%是有形成分，教材值為示例。</li><li>血漿中約92%是水、8%是溶質；分母是血漿，不是全血。</li><li>血球及血小板和血漿溶質承擔不同功能。</li></ul><p class=\"think\">「92%」是否表示全血中有92%是水？</p><div class=\"ex\"><h4>血液由兩部分組成</h4><p><b>血球</b>約占血液體積的 45％；<b>血漿</b>約占 55％。兩個百分比都是對「整體血液體積」而言。</p></div><div class=\"ex\"><h4>血球的種類</h4><p>紅血球、白血球、血小板。</p></div><div class=\"ex\"><h4>血漿的成分</h4><p>血漿略呈淡黃色，由 <b>92％ 的水</b>與 <b>8％ 的溶質</b>組成。溶質包括蛋白質、無機鹽、有機養分、激素、氣體及新陳代謝廢物等。</p></div><div class=\"ex\"><h4>血液與物質運輸</h4><p>消化道吸收的水、養分，肺泡的氧氣，都要靠血液運送到全身；細胞的代謝廢物也靠血液送到肺、腎臟等器官排出。</p></div><div class=\"ex\"><h4>深入解說：兩個百分比的分母</h4><p>血液有兩種「百分比」，分母不一樣：<b>血球約占血液體積 45%、血漿約占 55%</b>，分母是整份血液；而<b>血漿中 92% 是水、8% 是溶質</b>，分母是血漿。因此全血中水的比例約是 55% × 92% ≈ 51%，不是 92%。把血液離心，可看到上層淡黃色血漿、底層紅色血球，中間有薄薄一層白血球與血小板。</p></div><div class=\"ex\"><h4>離心後的三層（課外補充）</h4><ul><li>上層：血漿（約 55%）。</li><li>中間：薄薄的灰白色層（白血球與血小板，不到 1%）。</li><li>底層：紅血球（約 45% 的大部分）。</li><li>血球容積比（hematocrit）過低可能是貧血。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>「92%」是否表示全血中有 92% 是水？</p><p><b>答：</b>不是。92% 是<b>血漿</b>裡水的比例，全血還包含約 45% 的血球，所以水只占全血約一半。</p></div>", "tb": [["BOOK11", "P42 完整課本頁"]]}, {"id": "b3-c21-l25", "t": "造血：由幹細胞分化", "sec": "s5", "slide": 47, "sourceSlides": [47], "sourcePages": [], "src": "原PPT第 47 頁；課本 P42–43", "figSpec": {"image": "blood"}, "txt": "<ul><li>紅骨髓的造血幹細胞可產生不同血液成分。</li><li>紅血球、白血球與血小板的形成路徑不同。</li><li>血小板是巨核細胞的碎片，不能當成完整有核細胞。</li></ul><p class=\"think\">圖中分枝表示血球互相轉換，還是不同分化路徑？</p><div class=\"ex\"><h4>血球的來源</h4><p>紅血球、白血球、血小板都由<b>骨髓內的造血幹細胞</b>分裂、分化而來（圖 2－10）。</p></div><div class=\"ex\"><h4>分化的去向</h4><ul><li>造血幹細胞 → 紅血球</li><li>造血幹細胞 → 白血球</li><li>造血幹細胞 → 巨核細胞 → 血小板</li></ul></div><div class=\"ex\"><h4>血小板的來源</h4><p>血小板是<b>巨核細胞的細胞質碎片</b>，本身不是完整的細胞。</p></div><div class=\"ex\"><h4>深入解說：幹細胞的特性</h4><p>造血幹細胞具有兩個能力：<b>自我更新</b>（分裂後仍留有幹細胞）和<b>分化</b>（變成特化的血球）。分化是單向的：一旦分化成紅血球，就不會變回白血球，圖上的分枝表示<b>不同的分化路徑</b>，而不是成熟血球互相轉換。成人的造血主要在<b>紅骨髓</b>（如骨盆、胸骨、椎骨），骨髓移植就是移植造血幹細胞。</p></div><div class=\"ex\"><h4>血球壽命（課外補充）</h4><ul><li>紅血球約 120 天，老化後由脾臟與肝臟清除。</li><li>血小板約 7～10 天。</li><li>白血球壽命差異很大，從數小時到數年。</li><li>因此骨髓必須持續製造新血球，每秒製造數百萬個紅血球。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>血小板為什麼不是完整的細胞？</p><p><b>答：</b>因為它是巨核細胞細胞質裂解形成的<b>碎片</b>，沒有細胞核，不能分裂。</p></div>", "tb": []}, {"id": "b3-c21-l26", "t": "紅血球：構造與氣體運送", "sec": "s5", "slide": 48, "sourceSlides": [48], "sourcePages": [], "src": "原PPT第 48 頁；課本 P42–43", "figSpec": {"image": "PPT48S3"}, "txt": "<ul><li>人類成熟紅血球為雙凹圓盤且無細胞核，增加氣體交換效率。</li><li>血紅素參與氧運輸，亦参與部分CO₂運輸與緩衝。</li><li>多數CO₂以碳酸氫根形式運送；不把所有CO₂都歸於血紅素。</li></ul><p class=\"think\">人類成熟紅血球無核，能否推成所有動物紅血球都無核？</p><div class=\"ex\"><h4>紅血球的構造</h4><p>人類的紅血球在發育過程中會<b>排出細胞核</b>，成熟時呈<b>雙凹圓盤狀</b>，細胞質內充滿<b>血紅素</b>（圖 2－11，比例尺 3 µm）。</p></div><div class=\"ex\"><h4>血紅素的功能</h4><ul><li>運輸 O₂、CO₂。</li><li>可和 H⁺ 結合，具酸鹼緩衝的功能。</li></ul></div><div class=\"ex\"><h4>數量</h4><p>每 mm³ 約有 5×10⁶～6×10⁶ 個。</p></div><div class=\"ex\"><h4>深入解說：紅血球的構造與功能</h4><p>成熟的哺乳類紅血球排出了細胞核與大多數胞器，把空間讓給<b>血紅素</b>（一個紅血球約含 2.7 億個血紅素分子）；雙凹圓盤的形狀使<b>表面積與體積比</b>更大，氣體擴散距離更短，並且容易變形，能擠過比自己還細的微血管。血紅素含有鐵，能與 O₂ 可逆地結合：在肺部（O₂ 多）結合，在組織（O₂ 少）釋出。</p></div><div class=\"ex\"><h4>運輸 CO₂ 的方式（補充）</h4><ul><li>約 70% 以碳酸氫根（HCO₃⁻）形式溶在血漿。</li><li>約 20～25% 與血紅素的胺基結合。</li><li>約 5～10% 直接溶於血漿。</li><li>血紅素也能與 H⁺ 結合，幫助維持血液 pH 穩定。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>人類成熟紅血球無核，能推及所有動物嗎？</p><p><b>答：</b>不能。哺乳類的紅血球無核，但魚類、兩生類、爬蟲類與鳥類的紅血球都有細胞核。</p></div>", "tb": []}, {"id": "b3-c21-l27", "t": "白血球與血小板：防禦和止血", "sec": "s5", "slide": 49, "sourceSlides": [49, 50, 51], "sourcePages": [], "src": "原PPT第 49–51 頁；課本 P42–43", "figSpec": {"image": "PPT51S3"}, "txt": "<ul><li>白血球具有細胞核，主要參與防禦；不同種類作用不同。</li><li>血小板参與止血與凝血；其為細胞碎片。</li><li>教材數量範圍用於比較數量級，不以單一數字診斷健康。</li></ul><p class=\"think\">白血球較少，是否表示它的生理功能較不重要？</p><div class=\"ex\"><h4>白血球</h4><ul><li>有多種類型，透過不同方式清除癌細胞、病原體或其他外來異物。</li><li>有細胞核，形狀略圓，是三種血球中最大的。</li><li>每 mm³ 約 5×10³～1×10⁴ 個。</li><li>防禦功能在第 5 章詳述。</li></ul></div><div class=\"ex\"><h4>血小板</h4><ul><li>是巨核細胞的細胞質碎片，無細胞核，形狀不規則、最小。</li><li>血管受損時，血小板活化成不規則形狀，參與<b>凝血反應</b>。</li><li>每 mm³ 約 2.5×10⁵～4×10⁵ 個。</li></ul></div><div class=\"ex\"><h4>小結</h4><p>紅血球：運送氧與二氧化碳；白血球：防禦；血小板：凝血。</p></div><div class=\"ex\"><h4>深入解說：「數量少」不代表「不重要」</h4><p>白血球每 mm³ 約 5000～10000 個，遠少於紅血球，但它們是<b>防禦的主力</b>。重要性不能只看數量：許多免疫細胞平時只是巡邏，感染時會快速增殖。血小板雖小，在血管破裂時能迅速聚集成血小板栓，是止血的第一道防線。</p></div><div class=\"ex\"><h4>凝血的簡化流程（補充）</h4><ul><li>血管受損 → 血管收縮、血小板黏附並活化。</li><li>血小板聚集成栓子，封住傷口。</li><li>血漿中的凝血因子被活化，將可溶性的纖維蛋白原變成不溶的纖維蛋白，纖維網把血球網住形成血塊。</li><li>缺乏凝血因子，例如血友病，輕微的傷口也會長時間流血。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>白血球較少，是否表示它的生理功能較不重要？</p><p><b>答：</b>不是。數量不等於重要性；白血球負責防禦，是免疫反應的主體（第 5 章）。</p></div>", "tb": []}, {"id": "b3-c21-l28", "t": "血漿：溶質也是功能的一部分", "sec": "s5", "slide": 53, "sourceSlides": [53], "sourcePages": [], "src": "原PPT第 53 頁；課本 P42–43", "figSpec": {"image": "PPT53S3"}, "txt": "<ul><li>血漿運送養分、離子、激素與廢物。</li><li>血漿蛋白參與液體分布、緩衝、凝血與免疫。</li><li>蛋白量改變可影響液體交換，但組織積液也可能有其他原因。</li></ul><p class=\"think\">如果只保留水，能維持血漿的全部功能嗎？</p><div class=\"ex\"><h4>血漿蛋白</h4><p>血漿中的蛋白質稱為<b>血漿蛋白</b>，功能不只一種。</p></div><div class=\"ex\"><h4>血漿的四項功能</h4><ul><li>運輸物質：運送養分、廢物、氣體等。</li><li>維持體液滲透度和 pH 值的恆定：大部分血漿蛋白及無機鹽類具有此功能。</li><li>凝血反應：有些血漿蛋白參與凝血。</li><li>防禦病原體：有些血漿蛋白參與防禦作用。</li></ul></div><div class=\"ex\"><h4>結論</h4><p>血漿不只是「液體」，溶質本身就是功能的一部分。</p></div><div class=\"ex\"><h4>深入解說：血漿蛋白的種類與工作</h4><p>血漿蛋白大致可分為：<b>白蛋白</b>（最多，維持膠體滲透壓，也是運輸載體）、<b>球蛋白</b>（含抗體，參與免疫；也運輸脂質、金屬）與<b>纖維蛋白原</b>（參與凝血）。血漿蛋白無法輕易穿過微血管壁，因此留在血管內「吸水」，與血壓把水推出微血管的力量互相抗衡，維持血管內外水量的平衡。（種類與膠體滲透壓為課外補充。）</p></div><div class=\"ex\"><h4>血漿的四項功能（對應課本）</h4><ul><li>運輸：養分、廢物、氣體、激素。</li><li>維持滲透壓與 pH：血漿蛋白與無機鹽。</li><li>凝血：纖維蛋白原等。</li><li>防禦：抗體等。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>如果只保留水，能維持血漿的全部功能嗎？</p><p><b>答：</b>不能。血漿的功能大多來自溶質：蛋白質、離子、養分、激素等，單純的水無法運輸養分、凝血或防禦。</p></div>", "tb": []}, {"id": "b3-c21-l29", "t": "淋巴入口：盲端與單向瓣片", "sec": "s6", "slide": 54, "sourceSlides": [54, 55], "sourcePages": [], "src": "原PPT第 54–55 頁；課本 P43–44", "figSpec": {"image": "exchange"}, "txt": "<ul><li>微淋巴管起始端為盲端，內皮重疊形成可让組織液進入的入口。</li><li>盲端描述末端沒有接另一血管，不是整面管壁完全封死。</li><li>淋巴器官與淋巴液、淋巴管共同構成此系統。</li></ul><p class=\"think\">盲端若被理解成完全密封，組織液如何進入？</p><div class=\"ex\"><h4>淋巴循環系統的組成</h4><p>主要由<b>淋巴器官、淋巴管、淋巴</b>組成。淋巴器官（如胸腺、脾臟、淋巴結、骨髓）與免疫有關，第 5 章詳述。</p></div><div class=\"ex\"><h4>怎麼形成淋巴</h4><p>血漿滲出微血管進入組織間成為組織液，會被一端<b>封閉的盲管</b>回收，這些盲管稱為<b>微淋管</b>（圖 2－12），再匯聚成較大的淋巴管。</p></div><div class=\"ex\"><h4>微淋管的特點</h4><ul><li>是最小的淋巴管，一端封閉、另一端連結成較大的淋巴管。</li><li>由單層內皮細胞構成。</li><li>內皮細胞部分交疊，形成狹縫狀開口。</li></ul></div><div class=\"ex\"><h4>深入解說：淋巴管的「單向入口」</h4><p>微淋管的內皮細胞像屋瓦一樣<b>部分重疊</b>，組織液壓力升高時，重疊的邊緣被推開，液體可進入管內；管內壓力升高時，邊緣被壓緊，液體不會倒流出去，所以構成<b>單向活門</b>。「盲端」的意思是這一端沒有連接到另一條血管，並非管壁完全封閉，否則組織液就進不去了。</p></div><div class=\"ex\"><h4>淋巴器官（課本列舉）</h4><ul><li><b>胸腺</b>：T 細胞成熟的地方。</li><li><b>脾臟</b>：過濾血液、清除老化紅血球、儲存免疫細胞。</li><li><b>淋巴結</b>：過濾淋巴，內有大量淋巴球。</li><li><b>骨髓</b>：造血，也是 B 細胞發育的地方。</li></ul></div>", "tb": []}, {"id": "b3-c21-l30", "t": "組織液回收：不要背固定九成／一成", "sec": "s6", "slide": 57, "sourceSlides": [57], "sourcePages": [], "src": "原PPT第 57 頁；課本 P43–44", "figSpec": {"image": "exchange"}, "txt": "<ul><li>血管與組織間液體交換受壓力、蛋白及屏障性質共同影響。</li><li>淋巴回流對回收濾出液體和蛋白十分重要。</li><li>「動脈端出、靜脈端進」是經典簡圖，不是所有組織的固定比例。</li></ul><p class=\"think\">為何淋巴阻塞會使組織液更容易累積？</p><div class=\"scope-note\">現代修正Starling模型指出多數組織在穩定狀態下仍有淨濾出；再吸收可為短暫或特定組織現象。保留教材原文，並限定简圖範圍，不加90%／10%固定數字。<a href=\"https://pubmed.ncbi.nlm.nih.gov/20200043/\" target=\"_blank\" rel=\"noopener noreferrer\">微血管液體交換研究綜述</a>。</div><div class=\"ex\"><h4>淋巴的來源</h4><p>部分血漿滲出微血管成為組織液；部分組織液滲回微血管，部分進入微淋管成為淋巴。</p></div><div class=\"ex\"><h4>淋巴的成分</h4><ul><li>成分和組織液相似。</li><li>在淋巴器官中含有較多白血球，可清除淋巴中的病原體。</li></ul></div><div class=\"ex g\"><h4>圖 2－12</h4><p>滲出的血漿成為組織液，細胞直接與組織液交換物質；透過微淋管與微血管的回收，組織液成為淋巴，或再次成為血漿。小動脈與微血管交界的括約肌可控制微血管網的充血量。</p></div><div class=\"ex\"><h4>深入解說：組織液的來去</h4><p>血液流經微血管時，血壓把部分血漿「擠」出管壁成為組織液；其中的大部分在微血管靜脈端回到血管，其餘進入微淋管成為淋巴。課本用簡圖呈現「動脈端出、靜脈端進」，重點是理解：<b>組織液不是死水，而是持續產生、持續回收</b>，每天流出的淋巴量約 2～4 L。具體的比例會因組織不同而不同，所以不要背固定比例。</p></div><div class=\"ex\"><h4>水腫的成因（補充）</h4><ul><li>淋巴管阻塞或淋巴結被切除（如手術、絲蟲感染）→ 淋巴回流受阻 → 組織液積聚。</li><li>血漿蛋白過少（營養不良、肝腎疾病）→ 膠體滲透壓降低 → 水滯留在組織。</li><li>微血管壓力過高（心衰竭）→ 濾出增加。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>為何淋巴阻塞會使組織液更容易累積？</p><p><b>答：</b>因為組織液濾出後主要靠微血管與淋巴回收；淋巴被堵住，回收途徑減少，液體與蛋白質就留在組織間隙中。</p></div>", "tb": []}, {"id": "b3-c21-l31", "t": "兩條大管：依身體區域回到靜脈", "sec": "s6", "slide": 56, "sourceSlides": [56, 58], "sourcePages": [13], "src": "原PPT第 56–58 頁；課本 P43–44", "figSpec": {"image": "lymph"}, "txt": "<ul><li>右上半身主要經右淋巴管，回到右側鎖骨下靜脈附近。</li><li>其餘身體區域主要經胸管，回到左側鎖骨下靜脈附近。</li><li>淋巴回到靜脈後，才隨血液經上大靜脈進入右心房。</li></ul><p class=\"think\">左下肢的淋巴會經右淋巴管還是胸管？</p><div class=\"ex\"><h4>淋巴的路徑</h4><p>組織液經微淋管收集後，引流到附近的淋巴管，最後匯聚到左、右淋巴總管，再分別匯入左、右<b>鎖骨下靜脈</b>，由上大靜脈回到右心房。</p></div><div class=\"ex\"><h4>兩條最大的淋巴管</h4><ul><li><b>右淋巴總管</b>：收集身體右上側的淋巴，匯入右鎖骨下靜脈。</li><li><b>左淋巴總管（胸管）</b>：人體最主要的淋巴管，收集身體左上側與下半身的淋巴，匯入左鎖骨下靜脈。</li></ul></div><div class=\"ex\"><h4>淋巴管的構造</h4><p>淋巴管遍布全身，內有瓣膜，可防止淋巴逆流（圖 2－13）。</p></div><div class=\"ex\"><h4>深入解說：記憶淋巴引流的分區</h4><p>淋巴總管匯入的位置要記兩個：<b>右淋巴總管</b>只收集<b>右上身</b>（右頭頸、右上肢、右胸）；<b>左淋巴總管（胸管）</b>收集<b>其餘全部</b>（左上身＋整個下半身），所以胸管負責約四分之三的身體。兩者都匯入鎖骨下靜脈，進入上大靜脈後回到右心房。因此，左下肢的淋巴經<b>胸管</b>回流，不是右淋巴總管。</p></div><div class=\"ex\"><h4>小腸的乳糜管（補充）</h4><ul><li>小腸絨毛內的中央有微淋管，稱為<b>乳糜管</b>。</li><li>脂肪消化後的脂溶性養分（脂肪酸、甘油酯、脂溶性維生素）多由乳糜管吸收，經淋巴再進入血液。</li><li>這就是課本說淋巴能「運輸脂溶性養分」的原因（2-2 會再談）。</li></ul></div>", "tb": [["BOOK13", "P44 完整課本頁"]]}, {"id": "b3-c21-l32", "t": "淋巴流動：回收、防禦、脂質運送", "sec": "s6", "slide": 59, "sourceSlides": [59, 60], "sourcePages": [], "src": "原PPT第 59–60 頁；課本 P43–44", "figSpec": {"image": "lymph"}, "txt": "<ul><li>肌肉收縮、呼吸及管壁活動協助淋巴流動，瓣膜限制逆流。</li><li>教材PPT59「防止血液逆流」在此應讀為淋巴液逆流。</li><li>淋巴回收液體與蛋白、参與免疫，並運送小腸吸收的部分脂質。</li></ul><p class=\"think\">右淋巴管阻塞，會影響全身所有區域的淋巴回收嗎？</p><div class=\"ex\"><h4>淋巴為什麼會流動</h4><p>淋巴循環沒有像心臟一樣的動力來源，動力與機制和靜脈相似。</p></div><div class=\"ex\"><h4>淋巴的流動力</h4><ul><li>管壁旁骨骼肌收縮，擠壓淋巴管。</li><li>吸氣時胸腔的負壓，有利淋巴匯入胸腔的淋巴總管。</li><li>瓣膜防止淋巴逆流。</li></ul></div><div class=\"ex\"><h4>淋巴循環的功能</h4><ul><li>回收組織液。</li><li>清除淋巴中的病原體。</li><li>運輸脂溶性養分。</li></ul></div><div class=\"ex\"><h4>小提醒</h4><p>若淋巴管阻塞，組織液無法順利送回靜脈，會堆積在組織間隙，造成嚴重水腫。</p></div><div class=\"ex\"><h4>深入解說：淋巴的「三種工作」</h4><p>淋巴循環的功能可以濃縮成三句話：<b>回收</b>（把濾出的組織液和蛋白質送回血液）、<b>防禦</b>（淋巴流經淋巴結時，病原體被巨噬細胞與淋巴球攔截）、<b>運脂</b>（小腸吸收的脂溶性養分走淋巴）。淋巴沒有像心臟的泵，動力來源與靜脈相似：骨骼肌收縮擠壓、呼吸的胸腔壓力變化，加上瓣膜防止逆流；另外，淋巴管壁的平滑肌也會自行節律收縮。</p></div><div class=\"ex\"><h4>淋巴結腫大的意義</h4><ul><li>感染時，鄰近的淋巴結內淋巴球大量增殖，因此腫大、壓痛（如感冒時頸部淋巴結）。</li><li>癌細胞也可能轉移到淋巴結，醫師會檢查附近淋巴結。</li><li>這是淋巴系統「過濾與防禦」功能的臨床例子。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>原簡報中「防止血液逆流」的字眼，在淋巴管應讀為「防止<b>淋巴</b>逆流」。</p></div>", "tb": []}, {"id": "b3-c21-l33", "t": "原題一：用流向驗證瓣膜", "sec": "s6", "slide": 61, "sourceSlides": [61, 62], "sourcePages": [], "src": "原PPT第 61–62 頁；課本 P43–44", "figSpec": {"image": "originalHeart"}, "txt": "<ul><li>Ⅰ為二尖瓣；Ⅱ為左心室；Ⅲ為三尖瓣；Ⅳ為右心室。</li><li>原題正答D：左心室承擔體循環泵送，肌肉層最厚。</li><li>向肺動脈灌水時，半月瓣限制水倒流入右心室。</li></ul><p class=\"think\">為何不能由血管名稱中的「動脈」就認定充氧血？</p><div class=\"ex\"><h4>原題一（原簡報第 61 頁；111 年分科修訂）</h4><p>根據心臟解剖圖，下列敘述何者正確？</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 三尖瓣膜（Ⅲ）可防充氧血逆流回右心房</li><li>(B) 將水灌入上、下大靜脈，水會從左心房流入左心室</li><li>(C) 將水灌入肺動脈，水會從右心房流入右心室（Ⅳ）</li><li>(D) 因為要將血液打入主動脈送至全身，所以左心室（Ⅱ）的肌肉層最厚</li></ul></div><div class=\"ex\"><h4>答案：(D)</h4><p>先辨認：Ⅰ 二尖瓣膜、Ⅱ 左心室、Ⅲ 三尖瓣膜、Ⅳ 右心室。左心室要把血液打到全身，肌肉層最厚。</p></div><div class=\"ex\"><h4>其他選項</h4><ul><li>(A) 右心房、右心室的血液是減氧血，不是充氧血。</li><li>(B) 水灌入上、下大靜脈，會由右心房流入右心室。</li><li>(C) 水灌入肺動脈，會被半月瓣阻擋，由肺動脈流出。</li></ul></div><div class=\"ex\"><h4>深入解說：解剖圖題的「辨認三步」</h4><p>①<b>辨認腔室與瓣膜</b>：Ⅰ二尖瓣、Ⅱ左心室、Ⅲ三尖瓣、Ⅳ右心室。②<b>用血液路徑檢查灌水方向</b>：水灌入上、下大靜脈 → 右心房 → 經三尖瓣到右心室（不是左心）；灌入肺動脈 → 半月瓣擋住 → 水不會倒流入右心室。③<b>用功能推構造</b>：要送到全身，所以左心室肌肉最厚。</p></div><div class=\"ex\"><h4>逐項檢核</h4><ul><li>(A) 三尖瓣在右側，右心的血液是減氧血，不是充氧血。</li><li>(B) 灌入大靜脈的水走右心，不會直接進入左心。</li><li>(C) 灌入肺動脈：半月瓣阻擋，水不會流回右心室。</li><li>(D) 左心室肌肉層最厚，正確。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>為何不能由血管名稱中的「動脈」就認定是充氧血？</p><p><b>答：</b>因為動脈、靜脈是依<b>流向</b>命名；肺動脈運送減氧血、肺靜脈運送充氧血，是反例。</p></div>", "tb": []}, {"id": "b3-c21-l34", "t": "原題二：逐列核對血管比較表", "sec": "s6", "slide": 63, "sourceSlides": [63], "sourcePages": [], "src": "原PPT第 63 頁；課本 P43–44", "figSpec": {"image": "vessels"}, "txt": "<ul><li>原題正答D：動脈送離心臟、微血管大多接小動脈與小靜脈、靜脈送回心臟。</li><li>A把微血管平滑肌厚度列為次之不正確；B把微血管流速列為次之不正確。</li><li>C把心臟半月瓣當作動脈固有瓣膜；静脈瓣膜的分布也須有限定。</li></ul><p class=\"think\">「管壁厚」、「流速快」、「壓力高」能否全部用同一個排名代替？</p><div class=\"ex\"><h4>原題二（原簡報第 63 頁）</h4><p>下表為動脈、微血管、靜脈的比較，何者正確？</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 平滑肌厚度：最厚、次之、最薄</li><li>(B) 血流速度：最快、次之、最慢</li><li>(C) 瓣膜：靠近心臟端具有、無、較大靜脈具有</li><li>(D) 流向：將血液送離心臟、大多由小動脈流向小靜脈、將血液送回心臟</li></ul></div><div class=\"ex\"><h4>答案：(D)</h4><p>動脈送血離開心臟，微血管大多由小動脈流向小靜脈，靜脈把血液送回心臟。</p></div><div class=\"ex\"><h4>其他選項</h4><ul><li>(A) 微血管不具平滑肌。</li><li>(B) 微血管的血流速度最慢，不是「次之」。</li><li>(C) 動脈沒有瓣膜；半月瓣是心室與動脈之間的瓣膜，屬於心臟的瓣膜。</li></ul></div><div class=\"ex\"><h4>深入解說：逐列核對血管比較表</h4><p>讀比較表，每一列都要驗證。<b>平滑肌厚度</b>：動脈最厚、靜脈次之、微血管沒有平滑肌（A 錯）。<b>血流速度</b>：動脈最快、靜脈次之、微血管最慢（B 錯）。<b>瓣膜</b>：動脈沒有（心臟的半月瓣屬心臟構造），微血管沒有，較大靜脈有（C 錯）。<b>流向</b>：動脈離心、微血管由小動脈到小靜脈、靜脈回心（D 對）。</p></div><div class=\"ex\"><h4>歸納出的比較表（背誦版）</h4><ul><li>管壁厚度：動脈 ＞ 靜脈 ＞ 微血管。</li><li>管徑：靜脈 ＞ 動脈 ＞ 微血管。</li><li>總截面積：微血管 ＞ 靜脈 ＞ 動脈。</li><li>流速：動脈 ＞ 靜脈 ＞ 微血管。</li><li>血壓：動脈 ＞ 微血管 ＞ 靜脈。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>「管壁厚」、「流速快」、「壓力高」能用同一個排名代替嗎？</p><p><b>答：</b>不能。三個量各自有不同排序（例如靜脈壁比微血管厚，但靜脈壓卻比微血管低），要逐項分開判斷。</p></div>", "tb": []}, {"id": "b3-c21-l35", "t": "原題三：11瓣片與4組瓣膜", "sec": "s6", "slide": 64, "sourceSlides": [64], "sourcePages": [], "src": "原PPT第 64 頁；課本 P43–44", "figSpec": {"image": "coronary"}, "txt": "<ul><li>豬心原題正答B、D、E：左心室厚、主動脈彈性、通常11小瓣片。</li><li>右心房另有冠狀竇開口，不能只數上、下大靜脈。</li><li>冠狀竇主要位於背面；「11片」指小瓣片，不是11組瓣膜。</li></ul><p class=\"think\">記錄解剖觀察時，要如何把瓣膜「組」與瓣片「片」分開？</p><div class=\"ex\"><h4>原題三（原簡報第 64 頁）</h4><p>下列有關豬心觀察實驗的敘述，哪些正確？（多選）</p></div><div class=\"ex\"><h4>選項</h4><ul><li>(A) 在右心房僅可觀察到兩個靜脈的開口</li><li>(B) 左心室的肌肉最厚</li><li>(C) 在心臟的腹面可觀察到冠狀竇</li><li>(D) 最有彈性的血管是主動脈</li><li>(E) 可觀察到心臟共有 11 片瓣膜</li></ul></div><div class=\"ex\"><h4>答案：(B)(D)(E)</h4><p>左心室肌肉最厚；主動脈的彈性膜發達，最有彈性；瓣膜共 11 片（二尖瓣 2 片、三尖瓣 3 片、兩組半月瓣各 3 片）。</p></div><div class=\"ex\"><h4>其他選項</h4><ul><li>(A) 右心房上除了兩個大靜脈，還有冠狀竇的開口。</li><li>(C) 冠狀竇位於心臟的背面，不是腹面。</li></ul></div><div class=\"ex\"><h4>深入解說：豬心實驗的觀察重點</h4><p>豬心與人類心臟構造相似，常用於解剖。觀察時要找：①右心房的<b>上、下大靜脈開口與冠狀竇開口</b>，不止兩個；②左心室壁最厚；③主動脈壁彈性最大，用手拉有回彈感；④瓣膜共 <b>11 片瓣片</b>（二尖瓣 2＋三尖瓣 3＋兩組半月瓣各 3）。⑤冠狀竇在心臟背面，腹面看不到。</p></div><div class=\"ex\"><h4>陷阱辨析</h4><ul><li>(A)「僅可觀察到兩個靜脈開口」：忽略了冠狀竇開口。</li><li>(C)「腹面看到冠狀竇」：冠狀竇在背面。</li><li>(E)「11 片瓣膜」：這裡的 11 是<b>瓣片</b>數，若說成「瓣膜」則共 4 組；題目以課本計數為準。</li></ul></div><div class=\"ex\"><h4>自我檢核</h4><p><b>問：</b>記錄解剖觀察時，如何把瓣膜「組」與瓣片「片」分開？</p><p><b>答：</b>先數<b>幾組</b>（4 組：二尖瓣、三尖瓣、兩組半月瓣），再數每組<b>幾片</b>（2、3、3、3），合計 11 片，並在紀錄中標明單位。</p></div>", "tb": []}], "questions": [{"t": "運輸網分類", "q": "把六張描述放到對應系統；同類兩格可交換。", "learn": 2, "tag": "systems", "hint": "注意微血管、血腔與盲端的差異。", "why": "開放與封閉區分血液循環架構；淋巴是人體另一路回收網。血腔不是病理性血腫。", "sub": "原PPT第 5–8 頁；課本 P32–35", "refs": [{"src": "openclosed", "cap": "教材原圖"}], "legacyQuestion": 1, "kind": "drag", "slots": [{"id": "g0s0", "label": "開放式循環", "group": 0}, {"id": "g0s1", "label": "開放式循環", "group": 0}, {"id": "g1s0", "label": "封閉式循環", "group": 1}, {"id": "g1s1", "label": "封閉式循環", "group": 1}, {"id": "g2s0", "label": "淋巴循環", "group": 2}, {"id": "g2s1", "label": "淋巴循環", "group": 2}], "pieces": [{"id": "ag0s0", "label": "血淋巴可流入血腔", "group": 0}, {"id": "ag0s1", "label": "蝗蟲血淋巴由心孔回流", "group": 0}, {"id": "ag1s0", "label": "微血管接通動脈與靜脈", "group": 1}, {"id": "ag1s1", "label": "血液與組織液有界線", "group": 1}, {"id": "ag2s0", "label": "組織液進入微淋巴管", "group": 2}, {"id": "ag2s1", "label": "經大淋巴管回到靜脈", "group": 2}], "sol": {"g0s0": "ag0s0", "g0s1": "ag0s1", "g1s0": "ag1s0", "g1s1": "ag1s1", "g2s0": "ag2s0", "g2s1": "ag2s1"}, "pre": {}, "id": "b3-c21-q01"}, {"t": "課本圖貼標籤：心臟的構造", "q": "依課本圖2–2(a)，把標籤放回圖上的編號格：血管、腔室、瓣膜與節律點。", "learn": 4, "tag": "heart", "hint": "先分左右（圖上的左右是人體的左右），再依血流：大靜脈→右心房→右心室；肺靜脈→左心房→左心室→主動脈。", "why": "右心房接收上、下大靜脈的血，經三尖瓣入右心室；左心房接收肺靜脈的血，經二尖瓣入左心室，再由左心室泵入主動脈；節律點位於右心房壁，心室中膈隔開左右心室。", "sub": "課本 P32–33 圖2–2(a)", "refs": [{"src": "mk_heart", "cap": "心臟縱切面（標籤已遮蓋）"}], "kind": "drag", "mask": "mk_heart", "ar": 1.5045, "layout": "side", "slots": [{"id": "s0", "label": "主動脈", "group": 0, "x": 77.58, "y": 20.99, "v": false, "w": false}, {"id": "s1", "label": "上大靜脈", "group": 1, "x": 17.58, "y": 33.51, "v": false, "w": false}, {"id": "s2", "label": "節律點", "group": 2, "x": 16.45, "y": 50.45, "v": false, "w": false}, {"id": "s3", "label": "右心房", "group": 3, "x": 16.45, "y": 56.14, "v": false, "w": false}, {"id": "s4", "label": "三尖瓣（房室瓣）", "group": 4, "x": 16.55, "y": 70.52, "v": false, "w": false}, {"id": "s5", "label": "右心室", "group": 5, "x": 16.45, "y": 78.49, "v": false, "w": false}, {"id": "s6", "label": "左心房", "group": 6, "x": 77.58, "y": 53.71, "v": false, "w": false}, {"id": "s7", "label": "二尖瓣（房室瓣）", "group": 7, "x": 77.75, "y": 62.13, "v": false, "w": false}, {"id": "s8", "label": "左心室", "group": 8, "x": 77.58, "y": 78.31, "v": false, "w": false}, {"id": "s9", "label": "心室中膈", "group": 9, "x": 76.53, "y": 96.06, "v": false, "w": false}], "pieces": [{"id": "a0", "label": "主動脈", "group": 0}, {"id": "a1", "label": "上大靜脈", "group": 1}, {"id": "a2", "label": "節律點", "group": 2}, {"id": "a3", "label": "右心房", "group": 3}, {"id": "a4", "label": "三尖瓣（房室瓣）", "group": 4}, {"id": "a5", "label": "右心室", "group": 5}, {"id": "a6", "label": "左心房", "group": 6}, {"id": "a7", "label": "二尖瓣（房室瓣）", "group": 7}, {"id": "a8", "label": "左心室", "group": 8}, {"id": "a9", "label": "心室中膈", "group": 9}, {"id": "a10", "label": "冠狀動脈", "group": 100}, {"id": "a11", "label": "房室結", "group": 101}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2", "s3": "a3", "s4": "a4", "s5": "a5", "s6": "a6", "s7": lood", "hint": "把細胞與細胞碎片分開，再核對百分比。", "why": "人類成熟紅血球無核，白血球有核，血小板為碎片；血浆百分比與全血百分比不能直接混用。", "sub": "原PPT第 49–51 頁；課本 P42–43", "refs": [{"src": "blood", "cap": "教材原圖"}], "kind": "fill", "fig": "blood", "figCaption": "教材原圖", "imageWidth": 820, "rows": [{"id": "r1", "q": "人類成熟紅血球", "o": ["無核，血紅素參與氣體運送", "有大細胞核，形成抗體", "是巨核細胞碎片"], "tag": "blood"}, {"id": "r2", "q": "白血球", "o": ["有核，參與防禦", "全部無核且双凹", "主要負责運送絕大多數氧"], "tag": "blood"}, {"id": "r3", "q": "血小板", "o": ["巨核細胞碎片，参與止血", "完整成熟紅血球", "無任何凝血功能"], "tag": "blood"}, {"id": "r4", "q": "血漿92%為水的分母", "o": ["血漿本身", "完整全血", "只有紅血球"], "tag": "blood"}], "id": "b3-c21-q14"}, {"t": "血漿蛋白與液體分布", "q": "模型中血漿蛋白降低，其他條件先維持相同，哪項推論較合理？", "learn": 29, "tag": "lymph", "hint": "把液體交換與淋巴回流一起考慮。", "why": "血漿蛋白参與液體分布；降低時可影響淨濾出與淋巴回收負荷，不用固定静脈再吸收比例推論，也不能單憑此條件診斷個人的積液原因。", "sub": "原PPT第 57 頁；課本 P43–44", "refs": [{"src": "exchange", "cap": "教材原圖"}], "legacyQuestion": 5, "kind": "single", "opts": [{"t": "液體更易淨濾出，淋巴回收負荷可能增加", "ok": true, "tag": "lymph"}, {"t": "所有組織液立即轉成血球", "ok": false, "tag": "lymph"}, {"t": "靜脈壓力一定增加到與動脈相同", "ok": false, "tag": "lymph"}, {"t": "微淋巴管會自動變成動脈", "ok": false, "tag": "lymph"}], "id": "b3-c21-q05"}, {"t": "課本圖貼標籤：淋巴循環的匯入位置", "q": "依課本圖2–13，把標籤放回圖上的編號格：兩條淋巴總管與匯入的靜脈。", "learn": 30, "tag": "lymph", "hint": "橘紅底色是身體右上半部，藍底色是其餘部分；兩區的淋巴各由不同的淋巴總管匯入同側鎖骨下靜脈。", "why": "右上半身的淋巴由右淋巴總管匯入右鎖骨下靜脈；其餘部分的淋巴由胸管（左淋巴總管）匯入左鎖骨下靜脈，再進入上大靜脈回心臟。", "sub": "課本 P43 圖2–13", "refs": [{"src": "mk_lymph", "cap": "淋巴循環（標籤已遮蓋）"}], "kind": "drag", "mask": "mk_lymph", "ar": 0.8833, "layout": "side", "slots": [{"id": "s0", "label": "右鎖骨下靜脈", "group": 0, "x": 12.12, "y": 30.21, "v": false, "w": false}, {"id": "s1", "label": "右淋巴總管", "group": 1, "x": 13.92, "y": 37.33, "v": false, "w": false}, {"id": "s2", "label": "上大靜脈", "group": 2, "x": 82.64, "y": 30.75, "v": false, "w": false}, {"id": "s3", "label": "左鎖骨下靜脈", "group": 3, "x": 82.55, "y": 25.0, "v": false, "w": false}, {"id": "s4", "label": "左淋巴總管（胸管）", "group": 4, "x": 84.34, "y": 38.75, "v": false, "w": false}], "pieces": [{"id": "a0", "label": "右鎖骨下靜脈", "group": 0}, {"id": "a1", "label": "右淋巴總管", "group": 1}, {"id": "a2", "label": "上大靜脈", "group": 2}, {"id": "a3", "label": "左鎖骨下靜脈", "group": 3}, {"id": "a4", "label": "左淋巴總管（胸管）", "group": 4}, {"id": "a5", "label": "主動脈", "group": 100}, {"id": "a6", "label": "頸靜脈", "group": 101}], "sol": {"s0": "a0", "s1": "a1", "s2": "a2", "s3": "a3", "s4": "a4"}, "pre": {"s2": "a2"}}, {"t": "淋巴回收的範圍", "q": "下列關於淋巴循環哪些正確？（選3項）", "learn": 30, "tag": "lymph", "hint": "盲端不等於整面管壁完全密封。", "why": "入口、區域與驅動力的敘述正確。右淋巴管主要收集右上半身；瓣膜限制逆流而非主動泵。", "sub": "原PPT第 56–58 頁；課本 P43–44", "refs": [{"src": "lymph", "cap": "教材原圖"}], "legacyQuestion": 8, "kind": "multi", "opts": [{"t": "右淋巴管收集全身的全部淋巴", "ok": false, "tag": "lymph"}, {"t": "盲端微淋巴管可由重疊內皮入口接收組織液", "ok": true, "tag": "lymph"}, {"t": "瓣膜像心室一樣主動泵送淋巴", "ok": false, "tag": "lymph"}, {"t": "左下肢淋巴主要經胸管回流", "ok": true, "tag": "lymph"}, {"t": "肌肉與呼吸有助淋巴流動", "ok": true, "tag": "lymph"}], "fig": "lymph", "figCaption": "教材原圖", "id": "b3-c21-q08"}, {"t": "淋巴：入口、分區與回流", "q": "逐一判讀淋巴路徑與液體回收。", "learn": 30, "tag": "lymph", "hint": "依身體區域與靜脈回流追蹤。", "why": "右上半身與其他區域的主要淋巴管不同；淋巴回到静脈才隨血液回心。原模型須限定，不加入固定回收比例。", "sub": "原PPT第 56–58 頁；課本 P43–44", "refs": [{"src": "lymph", "cap": "教材原圖"}], "kind": "fill", "fig": "lymph", "figCaption": "教材原圖", "imageWidth": 820, "rows": [{"id": "r1", "q": "右上肢的主要淋巴路徑", "o": ["右淋巴管→右側靜脈附近", "胸管→左心室", "直接進入肺動脈"], "tag": "lymph"}, {"id": "r2", "q": "左下肢的主要淋巴路徑", "o": ["胸管→左側靜脈附近", "右淋巴管→右心室", "直接進入主動脈"], "tag": "lymph"}, {"id": "r3", "q": "回到静脈之後", "o": ["隨血液經上大靜脈回右心房", "立即進入左心室", "仍永久留在獨立淋巴迴路"], "tag": "lymph"}, {"id": "r4", "q": "淋巴瓣膜的功能", "o": ["限制淋巴逆流", "主動製造氧氣", "防止紅血球再極化"], "tag": "lymph"}, {"id": "r5", "q": "組織液交換模型", "o": ["淋巴回流重要，不背固定90／10比例", "所有組織固定九成由靜脈吸收", "靜脈端永遠沒有任何淨濾出"], "tag": "lymph"}], "id": "b3-c21-q15"}, {"t": "原題一：心臟構造", "q": "根據心臟解剖圖（如右圖），下列敘述何者正確？", "learn": 32, "tag": "heart", "hint": "以圖中的血管連接和瓣膜流向核對。", "why": "原PPT61–62正答D。Ⅰ二尖瓣、Ⅱ左心室、Ⅲ三尖瓣、Ⅳ右心室。A把右側血液稱充氧血；B静脈灌水先入右側；C肺動脈

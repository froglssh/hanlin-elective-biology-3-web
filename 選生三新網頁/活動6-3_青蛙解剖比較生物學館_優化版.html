const CONTENT={"lessons": [{"id": "b3-a63-l01", "t": "從外形走向系統：觀察任務", "sec": "s1", "slide": 1, "sourceSlides": [1, 2, 3], "sourcePages": [1], "src": "課本P202；PPT 1、2、3", "figSpec": {"image": "external"}, "txt": "<h3>觀察與理解</h3><ul><li>先記位置、形狀、顏色與相鄰構造，再連結功能；推論需有可見證據。</li><li>以外部、循環、呼吸、消化、泌尿生殖五條路線觀察，最後與人體比較。</li><li>示意圖凸顯關係，照片呈現實體；標本受姿勢、季節與處理影響，不必與圖完全同色。</li></ul><p class=\"thinking\"><strong>想一想</strong> 你如何讓另一組同學根據紀錄找到同一器官？</p><div class=\"ex\"><h4>前言</h4><p>透過觀察與比較蛙的外部形態與內部構造，連貫前面章節，釐清各<b>器官系統</b>的相對位置、組成及生理功能。</p></div><div class=\"ex\"><h4>目的與原理</h4><p>對蛙的各系統分別系統性觀察，記錄外形、內部結構與其他器官的相對位置，再與人體比較，並了解差異如何對應不同的生態習性或生理功能。蛙體內有循環、消化、呼吸、泌尿及生殖系統，依步驟依序找出各系統。</p></div>", "tb": [["step_001", "P202完整課本頁"]]}, {"id": "b3-a63-l02", "t": "3R與動物福利：先選觀察方法", "sec": "s1", "slide": 4, "sourceSlides": [4, 5, 6], "sourcePages": [1, 2], "src": "課本P202、203；PPT 4、5、6", "figSpec": {"image": "ppt_005"}, "txt": "<h3>觀察與理解</h3><ul><li>替代：先評估模型、影像及既有標本能否達成學習目的。</li><li>減少：在足夠學習證據前提下共用資料，避免重複使用動物；優化：降低不適、改善照護與操作。</li><li>實作由教師依課綱、校內審查及適用規範安排；不把有課程需求當作免除照護責任。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若影片足以學會辨識器官，還有哪些目標必須用實體達成？</p><div class=\"scope-note\">《動物保護法》對科學應用、機構審查及高中以下課程另有規定；適用範圍需依實際活動確認。</div><p>查核 2026-10-10：<a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=M0060027\" target=\"_blank\" rel=\"noopener noreferrer\">動物保護法第15、16、18條 ↗</a></p><div class=\"ex\"><h4>動物實驗倫理與規範</h4><p>動物實驗往往難以避免，但必須遵循倫理準則；所有步驟須經單位的<b>實驗動物照護及使用委員會（IACUC）</b>審查同意。</p></div><div class=\"ex\"><h4>3R 原則</h4><ul><li><b>替代</b>（replacement）：用其他方法取代動物實驗。</li><li><b>減少</b>（reduction）：盡量降低使用的動物數量。</li><li><b>優化</b>（refinement）：改進程序，降低動物承受的不適與痛苦。</li></ul></div>", "tb": [["step_001", "P202完整課本頁"], ["step_002", "P203完整課本頁"]]}, {"id": "b3-a63-l03", "t": "器材與麻醉：時間不是充分證據", "sec": "s1", "slide": 7, "sourceSlides": [7], "sourcePages": [2, 3], "src": "課本P203、204；PPT 7", "figSpec": {"image": "ppt_007"}, "txt": "<h3>觀察與理解</h3><ul><li>器材分為觀察、固定、紀錄與教師操作用途，先確認完整性及清潔。</li><li>原教材有固定濃度與浸泡時間；麻醉深度仍受物種、個體、溫度等影響，不能只看時間或不動。</li><li>活體侵入操作需由具資格人員依核定流程監測、確認適當麻醉深度並處理後續照護；影像觀察可達成辨識任務。</li></ul><p class=\"thinking\"><strong>想一想</strong> 「沒有移動」與「已達適當麻醉深度」為何不同？</p><div class=\"scope-note\">保留原步驟作來源閱讀；本網頁不把原配方當成可自行執行的麻醉處方。</div><p>查核 2026-10-10：<a href=\"https://az.research.umich.edu/animalcare/guidelines/guidelines-amphibian-anesthesia-analgesia-and-surgery/\" target=\"_blank\" rel=\"noopener noreferrer\">密西根大學：兩生類麻醉、止痛與手術指引 ↗</a></p><div class=\"ex\"><h4>每組器材</h4><p>蛙 1 隻、細玻璃管或細吸管、實驗手套、解剖盤、解剖用具、有蓋廣口瓶、大頭針、針筒、餐巾紙、黑色食用色素溶液、丁香油溶液（或苯氧基乙醇）。</p></div><div class=\"ex\"><h4>步驟 1：麻醉</h4><p>配 1～2% 丁香油溶液，將蛙置入浸泡 10～20 分鐘使其麻醉；可加 12.5% DMSO 作界面活性劑，讓丁香油更易滲入皮膚。</p></div><div class=\"ex\"><h4>提醒</h4><p>浸泡時間是參考；要確認蛙已麻醉（失去反應）才能進行下一步，不能只看時間。</p></div>", "tb": [["step_002", "P203完整課本頁"], ["step_003", "P204完整課本頁"]]}, {"id": "b3-a63-l04", "t": "外部地圖：背腹、前後與感覺構造", "sec": "s2", "slide": 8, "sourceSlides": [8], "sourcePages": [3], "src": "課本P204；PPT 8", "figSpec": {"image": "external"}, "txt": "<h3>觀察與理解</h3><ul><li>以蛙本身的前後、背腹及左右定位，避免把畫面左右當動物左右。</li><li>找到鼻孔、眼、鼓膜、前肢與後肢；用相鄰位置建立辨識理由。</li><li>外皮與環境交換水分及氣體，也有保護功能；單看外形不能量出交換速率。</li></ul><p class=\"thinking\"><strong>想一想</strong> 從側面照片，你能直接看到哪一側？哪些構造被遮蔽？</p><div class=\"ex\"><h4>步驟 2：外部形態</h4><p>把蛙擦去多餘水分放到解剖盤，觀察外表有哪些構造？前後肢有何差異？並判斷性別。</p></div><div class=\"ex\"><h4>圖中標示的構造</h4><ul><li>眼睛、鼻孔、鼓膜</li><li>皮膚、前肢、後肢</li><li>雄蛙的鳴囊</li></ul></div>", "tb": [["step_003", "P204完整課本頁"]]}, {"id": "b3-a63-l05", "t": "雌雄外觀：多項線索交叉判讀", "sec": "s2", "slide": 9, "sourceSlides": [9, 12], "sourcePages": [3, 4], "src": "課本P204、205；PPT 9、12", "figSpec": {"image": "sex"}, "txt": "<h3>觀察與理解</h3><ul><li>教材以婚墊、鳴囊及體型引導觀察；不同物種、季節與成熟度可能不同。</li><li>記錄實際看到的特徵，不能只用大小或照片顏色判定所有蛙的性別。</li><li>外觀推論可和生殖腺及管道交叉檢查；看不清應保留不確定。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若看不到鳴囊，是否足以判定一定是雌蛙？</p><div class=\"scope-note\">婚墊與鳴囊並非每種雄蛙都同樣明顯；抱接特徵有助固定，但不保證受精成功。</div><div class=\"ex\"><h4>討論一：外觀分辨性別</h4><p>可以，用多項線索交叉判讀。</p></div><div class=\"ex\"><h4>雄蛙 vs 雌蛙</h4><ul><li><b>體型</b>：雄蛙較小、顏色較深；雌蛙較大、顏色較淺。</li><li><b>前肢</b>：雄蛙較粗壯，前肢內掌常有肉突（婚墊）；雌蛙沒有。</li><li><b>鳴囊</b>：雄蛙鳴囊皮膚較鬆弛、顏色較深。</li><li><b>吻端</b>：雄蛙較長而尖，雌蛙較鈍圓。</li></ul></div>", "tb": [["step_003", "P204完整課本頁"], ["step_004", "P205完整課本頁"]]}, {"id": "b3-a63-l06", "t": "四肢與頭部：形態支持的功能", "sec": "s2", "slide": 10, "sourceSlides": [10], "sourcePages": [4], "src": "課本P205；PPT 10", "figSpec": {"pair": ["limbs", "head"]}, "txt": "<h3>觀察與理解</h3><ul><li>比較前後肢趾數、蹼及長度；後肢形態可連結推進、跳躍和游泳。</li><li>頭部鼻孔、眼與鼓膜位置各支持不同感覺與通氣任務。</li><li>「適於某種活動」是功能推論，不能僅憑一張圖推算速度或聽力範圍。</li></ul><p class=\"thinking\"><strong>想一想</strong> 哪個特徵支持游泳推進？還需要什麼資料比較能力？</p><div class=\"ex\"><h4>四肢與頭部</h4><p>前肢的趾部腹面可見外掌瘤；後肢的趾部腹面可見外蹠瘤，趾間有<b>蹼</b>。</p></div><div class=\"ex\"><h4>頭部</h4><p>可見鼻孔、眼、鼓膜。形態支持功能：蹼有利游泳、後肢強壯利跳躍。</p></div>", "tb": [["step_004", "P205完整課本頁"]]}, {"id": "b3-a63-l07", "t": "口腔原圖：攝食與通氣的交會", "sec": "s2", "slide": 11, "sourceSlides": [11], "sourcePages": [4], "src": "課本P205；PPT 11", "figSpec": {"image": "mouth"}, "txt": "<h3>觀察與理解</h3><ul><li>找到內鼻孔、牙齒、耳咽管、咽、聲門與舌；這些開口通往不同構造。</li><li>圖示蛙的舌附著於前方，細齒有助固定獵物；不是哺乳類臼齒式咀嚼。</li><li>聲門連向肺；耳咽管連向中耳，不能把所有口腔開口都當氣管。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若以開口位置作辨識，你會先找哪一個固定參照點？</p><div class=\"scope-note\">齒與舌的細節有物種差異；本頁依教材標本，不外推所有兩生類。</div><div class=\"ex\"><h4>步驟 3：口腔</h4><p>打開蛙口，觀察牙齒、舌、聲門等。</p></div><div class=\"ex\"><h4>口腔的構造</h4><ul><li>內鼻孔</li><li>牙齒</li><li>舌</li><li>聲門（通往肺）</li><li>耳咽管、咽</li></ul></div><div class=\"ex\"><h4>意義</h4><p>攝食與通氣的通道在口腔交會。</p></div>", "tb": [["step_004", "P205完整課本頁"]]}, {"id": "b3-a63-l08", "t": "體壁與器官：保留相對位置", "sec": "s3", "slide": 13, "sourceSlides": [13, 14, 15], "sourcePages": [5], "src": "課本P206；PPT 13、14、15", "figSpec": {"image": "opening"}, "txt": "<h3>觀察與理解</h3><ul><li>先比較皮膚與肌肉層，再理解器官在體腔中的相對位置；分層觀察有助保留關係。</li><li>教材提醒避開腹中靜脈，說明切開位置會影響出血及可見度。</li><li>實作由教師依核定流程進行；觀察者記下移動、翻開了哪些構造，避免把處理後位置當原位。</li></ul><p class=\"thinking\"><strong>想一想</strong> 翻起肝臟後才看見的器官，在紀錄中應如何標示？</p><div class=\"ex\"><h4>活動二：循環系統的開腹</h4><p>用大頭針固定四肢，把蛙仰釘在解剖盤；用鑷子輕輕拉起皮膚，自體中央剪開；自腹部中央略偏左處避開大血管，沿直線向前剪開肌肉層至前肢附近，再向左、右剪開並釘住腹壁（依圖中數字順序）。</p></div><div class=\"ex\"><h4>提醒</h4><p>保留器官的相對位置，再拍照記錄。</p></div>", "tb": [["step_005", "P206完整課本頁"]]}, {"id": "b3-a63-l09", "t": "心臟兩個視角：三腔與靜脈竇", "sec": "s3", "slide": 16, "sourceSlides": [16, 17], "sourcePages": [6], "src": "課本P207；PPT 16、17", "figSpec": {"image": "heart"}, "txt": "<h3>觀察與理解</h3><ul><li>腹面與背面是同一顆心臟的不同視角；左右心房與單一心室構成三個主要腔室。</li><li>背面的靜脈竇接收大靜脈回流，再流入右心房；肺靜脈匯入左心房。</li><li>圖中紅藍色是示意標記；不能用處理後照片的顏色直接判定血液含氧量。</li></ul><p class=\"thinking\"><strong>想一想</strong> 為何從腹面看不完整的血管，背面可能較容易追蹤？</p><div class=\"ex\"><h4>步驟 4：觀察心臟</h4><p>最明顯的是正在搏動的心臟。觀察腔室數目、形狀、表面血管，找出主動脈、上下大靜脈、肺動脈與肺靜脈。</p></div><div class=\"ex\"><h4>蛙心的特徵（圖）</h4><ul><li>左心房、右心房、一個心室</li><li>明顯的<b>靜脈竇</b></li></ul></div>", "tb": [["step_006", "P207完整課本頁"]]}, {"id": "b3-a63-l10", "t": "血流連線：回流與輸出分開", "sec": "s3", "slide": 18, "sourceSlides": [18, 19, 20], "sourcePages": [6], "src": "課本P207；PPT 18、19、20", "figSpec": {"image": "heart"}, "txt": "<h3>觀察與理解</h3><ul><li>體循環回流經大靜脈、靜脈竇至右心房；肺回流經肺靜脈至左心房。</li><li>兩心房血液進入單一心室，再經動脈幹分向各動脈弓；肺皮循環供應肺與皮膚。</li><li>單一心室不代表全部血液必定均勻混合；皮膚交換也影響回流血的含氧狀態。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若追蹤肺回流，你應從哪個心房開始辨認？</p><div class=\"scope-note\">不以「完全混血」概括蛙的循環；不能把所有進右心房的血都寫成純缺氧血。</div><div class=\"ex\"><h4>討論一：循環路徑</h4><p>蛙心：二心房一心室。</p></div><div class=\"ex\"><h4>回流</h4><ul><li>肺氣體交換後的充氧血 → 肺靜脈 → 左心房。</li><li>皮膚交換的充氧血與全身組織的減氧血 → 上、下大靜脈 → 右心房。</li></ul></div><div class=\"ex\"><h4>輸出</h4><ul><li>左右心房的血液一起流入單一心室，部分混合。</li><li>動脈幹分支：氧濃度較高的血送往全身；氧濃度較低的送往皮膚與肺。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>步驟 5：可從主動脈注墨觀察血管分布（可留待所有器官觀察完後做）。</p></div>", "tb": [["step_006", "P207完整課本頁"]]}, {"id": "b3-a63-l11", "t": "肺與聲門：構造和觀察方法", "sec": "s3", "slide": 21, "sourceSlides": [21, 22, 23, 24], "sourcePages": [7], "src": "課本P208；PPT 21、22、23、24", "figSpec": {"image": "lung"}, "txt": "<h3>觀察與理解</h3><ul><li>圖示肺為成對囊狀器官，表面有血管，經聲門與口咽部連通。</li><li>蛙肺內壁有分隔與褶襞，增加交換表面；不能說只是完全光滑的空袋。</li><li>教材以充氣觀察膨脹；若需示範，由教師使用適當機械裝置，不以口對管吹氣接觸標本。</li></ul><p class=\"thinking\"><strong>想一想</strong> 膨脹能證明通道連通，是否也已測出氣體交換效率？</p><div class=\"scope-note\">無哺乳類型的肺泡，不等於完全沒有內部分隔；效率比較需先定義指標與條件。</div><p>查核 2026-10-10：<a href=\"https://pubmed.ncbi.nlm.nih.gov/32651399/\" target=\"_blank\" rel=\"noopener noreferrer\">蛙肺電顯：肺壁與分隔的原始研究 ↗</a></p><div class=\"ex\"><h4>活動三：肺臟</h4><p>由心臟出發，順著肺動脈與肺靜脈找到肺。</p></div><div class=\"ex\"><h4>步驟</h4><ul><li>打開口腔，找到<b>聲門</b>。</li><li>用細吸管插入喉頭聲門處（小心不要插入食道），向內吹氣。</li><li>觀察肺的膨脹及肺壁上微血管分布。</li></ul></div><div class=\"ex\"><h4>觀察</h4><p>肺呈中空囊狀，表面遍布微血管。蛙的肺泡結構、大小和人體不同。</p></div>", "tb": [["step_007", "P208完整課本頁"]]}, {"id": "b3-a63-l12", "t": "正壓通氣：口腔底把氣體送入肺", "sec": "s3", "slide": 25, "sourceSlides": [25], "sourcePages": [7], "src": "課本P208；PPT 25", "figSpec": {"image": "lung"}, "txt": "<h3>觀察與理解</h3><ul><li>口腔底降低可使外界空氣進入口咽腔；送氣入肺時需配合鼻孔及聲門的開閉。</li><li>口腔底上升提高壓力，把空氣推入肺；與人類藉胸腔擴張降低肺壓的方式不同。</li><li>蛙沒有哺乳類肌肉質橫膈；不能把單一標本骨骼概括成所有兩生類完全沒有肋骨。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若鼻孔在加壓時仍開放，氣流方向會受到什麼影響？</p><p>查核 2026-10-10：<a href=\"https://journals.biologists.com/jeb/article/154/1/537/5967/Breathing-in-Rana-Pipiens-the-Mechanism-of\" target=\"_blank\" rel=\"noopener noreferrer\">Rana pipiens口腔與肺通氣研究 ↗</a></p><div class=\"ex\"><h4>呼吸運動的差異</h4><p>蛙具有胸骨，但沒有肋骨與<b>橫膈</b>（體腔無胸腹之分）。</p></div><div class=\"ex\"><h4>比較</h4><ul><li>蛙：以口加壓，把氣體壓入肺——<b>正壓呼吸</b>。</li><li>人：改變胸腔體積與壓力，使氣體被動流入、流出——<b>負壓呼吸</b>。</li></ul></div>", "tb": [["step_007", "P208完整課本頁"]]}, {"id": "b3-a63-l13", "t": "消化原圖：管道、腺體與支撐", "sec": "s4", "slide": 26, "sourceSlides": [26, 27], "sourcePages": [8], "src": "課本P209；PPT 26、27", "figSpec": {"image": "digest"}, "txt": "<h3>觀察與理解</h3><ul><li>依食物流向辨認食道、胃、小腸、大腸及泄殖腔；肝臟、膽囊與胰臟為相關附屬構造。</li><li>肝製造膽汁、膽囊儲存膽汁；脾臟雖位於附近，主要屬免疫及血液相關器官。</li><li>腸繫膜支撐腸道並容納血管；照片中器官可能翻開，需對照示意圖的連接。</li></ul><p class=\"thinking\"><strong>想一想</strong> 器官在腹腔中彼此相鄰，是否就一定屬於同一系統？</p><div class=\"ex\"><h4>活動四：消化系統</h4><p>依序找出食道、胃、肝臟、膽囊、胰臟、小腸、大腸，觀察相對位置與形態。</p></div><div class=\"ex\"><h4>圖中的構造</h4><ul><li>食道、胃、小腸、大腸</li><li>肝臟、膽囊、胰臟</li><li>脾臟、腸繫膜、脂肪體</li></ul></div><div class=\"ex\"><h4>討論</h4><p>各器官的比例與人類有何不同？可能的生理與生態原因？</p></div>", "tb": [["step_008", "P209完整課本頁"]]}, {"id": "b3-a63-l14", "t": "肝門循環：血管名稱看流向", "sec": "s4", "slide": 28, "sourceSlides": [28, 29], "sourcePages": [8], "src": "課本P209；PPT 28、29", "figSpec": {"image": "digest"}, "txt": "<h3>觀察與理解</h3><ul><li>肝門靜脈把消化道等區域的回流血送入肝；肝動脈提供動脈血，肝靜脈把血帶離肝。</li><li>動脈與靜脈依相對心臟的流向命名，不能只用含氧高低分類。</li><li>腸吸收的物質有不同運輸路徑；不可把人體所有營養素一概寫成全經肝門靜脈。</li></ul><p class=\"thinking\"><strong>想一想</strong> 「門靜脈」為何能連接兩個微血管床？</p><div class=\"ex\"><h4>肝門循環</h4><p>觀察腸繫膜處的血管是否匯聚成一條大型靜脈進入肝臟——這條就是<b>肝門靜脈</b>。再在肝臟找到肝動脈與肝靜脈。</p></div><div class=\"ex\"><h4>命名原則</h4><p>血管名稱看流向：流向肝臟的稱肝門靜脈（連接兩個微血管床），離開肝臟的稱肝靜脈。</p></div>", "tb": [["step_008", "P209完整課本頁"]]}, {"id": "b3-a63-l15", "t": "蛙與人：比較機制，不排高低", "sec": "s4", "slide": 30, "sourceSlides": [30, 31, 32, 33], "sourcePages": [8, 10], "src": "課本P209、211；PPT 30、31、32、33", "figSpec": {"image": "ppt_031"}, "txt": "<h3>觀察與理解</h3><ul><li>人類心臟二心房二心室；教材蛙二心房一心室，比較重點是分流關係。</li><li>人以胸腔擴張負壓吸氣，蛙以口腔泵正壓通氣；兩者皆需要壓力差與交換表面。</li><li>相對大小需標尺或體型校正；生活方式與代謝需求可形成假說，不能從圖直接得出因果。</li></ul><p class=\"thinking\"><strong>想一想</strong> 如何設計公平比較，避免只憑「較大」就說功能較強？</p><div class=\"scope-note\">不以「原始、落後」替代形態與功能分析；人體位置描述也需統一視角。</div><div class=\"ex\"><h4>討論：蛙與人</h4><p>比較機制，不排高低。</p></div><div class=\"ex\"><h4>循環</h4><ul><li>人：二心房二心室，充氧血與減氧血區隔，運送效率高。</li><li>蛙：二心房一心室，無法完全區隔。</li></ul></div><div class=\"ex\"><h4>呼吸</h4><ul><li>人：肺＋肋骨、肋間肌、橫膈，負壓呼吸。</li><li>蛙：肺構造簡單、無肋骨橫膈，正壓呼吸；還會用皮膚交換氣體。</li></ul></div><div class=\"ex\"><h4>消化</h4><ul><li>人：口腔→咽→食道→胃→小腸→大腸→肛門。</li><li>蛙：口腔→食道→胃→小腸→大腸→泄殖腔→泄殖孔。</li></ul></div>", "tb": [["step_008", "P209完整課本頁"], ["step_010", "P211完整課本頁"]]}, {"id": "b3-a63-l16", "t": "泌尿生殖原圖：共用出口的界線", "sec": "s5", "slide": 34, "sourceSlides": [34, 35, 36], "sourcePages": [9], "src": "課本P210；PPT 34、35、36", "figSpec": {"image": "uro"}, "txt": "<h3>觀察與理解</h3><ul><li>腎臟近背側，腎上腺貼近腎臟；膀胱是可伸展的儲尿構造，空時不易辨認。</li><li>雌蛙卵巢、輸卵管與雄蛙睪丸的位置和形態不同；本圖用不同顏色標系統。</li><li>泄殖腔接收消化、泌尿與生殖通道；泄殖孔是體外開口，不能把腔室等同所有管道。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若膀胱空而塌陷，你會用哪些相鄰構造尋找？</p><div class=\"scope-note\">課本「尿道（泄殖腔）」標字需釐清：泄殖腔是共同腔室，不等於人類的尿道。</div><p>查核 2026-10-10：<a href=\"https://programs.clarendoncollege.edu/programs/NatSci/Biology/Zoology/zoo%20online%20outlines/Frog_Lab%20-%20short.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Clarendon College：蛙構造觀察圖 ↗</a></p><div class=\"ex\"><h4>活動五：泌尿與生殖</h4><p>移除大部分器官後，近背部可找到<b>腎臟</b>。找出腎上腺、輸尿管、膀胱與尿道，記錄位置、形狀與大小。</p></div><div class=\"ex\"><h4>技巧</h4><p>蛙受驚嚇會排尿，常找不到膀胱；可泡水，膀胱會因浮力漂起。生殖系統與泌尿系統共用向外開口（<b>泄殖孔</b>、泄殖腔）。</p></div><div class=\"ex\"><h4>腎臟比較</h4><p>蛙的腎臟扁平長條狀，位於脊柱兩側；腹面淡黃色線狀為腎上腺；前端黃白色指狀突起是脂肪體。人的腎臟為蠶豆狀。</p></div>", "tb": [["step_009", "P210完整課本頁"]]}, {"id": "b3-a63-l17", "t": "雌蛙排卵：卵巢與輸卵管並非直連", "sec": "s5", "slide": 37, "sourceSlides": [37, 38], "sourcePages": [9, 10], "src": "課本P210、211；PPT 37、38", "figSpec": {"image": "uro"}, "txt": "<h3>觀察與理解</h3><ul><li>成熟卵由卵巢排入體腔，再由輸卵管前端漏斗收集，沿輸卵管移動。</li><li>輸卵管末端膨大部分可暫存卵，教材稱子宮；與哺乳類著床及胎盤妊娠功能不同。</li><li>後續通向泄殖腔及泄殖孔；不把尿膀胱當作必經的卵儲存或排出站。</li></ul><p class=\"thinking\"><strong>想一想</strong> 同樣叫「子宮」，是否就代表相同的生殖功能？</p><p>查核 2026-10-10：<a href=\"https://embryology.med.unsw.edu.au/embryology/index.php?title=Book_-_The_Frog_Its_Reproduction_and_Development_3\" target=\"_blank\" rel=\"noopener noreferrer\">UNSW胚胎學：蛙的生殖與發育原典 ↗</a></p><div class=\"ex\"><h4>雌蛙</h4><p>找出卵巢，注意位置、形狀與顏色。</p></div><div class=\"ex\"><h4>構造</h4><ul><li>卵巢位於腎臟外側，由許多黑白各半的卵組成。</li><li>輸卵管呈彎曲的白色細管，前端喇叭狀開口、後端膨大為子宮。</li><li>卵巢與輸卵管並非直接相連。</li></ul></div><div class=\"ex\"><h4>討論一</h4><p>雌蛙生殖系統受生殖週期影響較大，生殖季卵巢充滿卵；體外受精、子代多，所以雌蛙體型較大。</p></div>", "tb": [["step_009", "P210完整課本頁"], ["step_010", "P211完整課本頁"]]}, {"id": "b3-a63-l18", "t": "雄蛙排精：尿生殖管道的關係", "sec": "s5", "slide": 39, "sourceSlides": [39], "sourcePages": [9, 10], "src": "課本P210、211；PPT 39", "figSpec": {"image": "uro"}, "txt": "<h3>觀察與理解</h3><ul><li>教材所述雄蛙：精子由睪丸經輸精細管進入腎內相關管道，再經尿生殖管道至泄殖腔。</li><li>雄性的輸尿管可兼運精液；雌性的輸卵管則是另一條管道，不能說蛙都沒有專用生殖管。</li><li>原PPT把膀胱插入卵與精子路徑，應修正；膀胱連於泄殖腔，不是配子必經站。</li></ul><p class=\"thinking\"><strong>想一想</strong> 相鄰或共用出口，為何不等於都先經過膀胱？</p><div class=\"scope-note\">原PPT第39頁保留作來源檢核；本頁及計分題採查核後路徑。細節依物種，不一概代表所有兩生類。</div><p>查核 2026-10-10：<a href=\"https://scholarworks.uark.edu/jaas/vol76/iss1/6/\" target=\"_blank\" rel=\"noopener noreferrer\">木蛙雄性泌尿生殖管道原始研究 ↗</a>；<a href=\"https://embryology.med.unsw.edu.au/embryology/index.php?title=Book_-_The_Frog_Its_Reproduction_and_Development_3\" target=\"_blank\" rel=\"noopener noreferrer\">UNSW胚胎學：蛙的生殖與發育原典 ↗</a>；<a href=\"https://programs.clarendoncollege.edu/programs/NatSci/Biology/Zoology/zoo%20online%20outlines/Frog_Lab%20-%20short.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Clarendon College：蛙構造觀察圖 ↗</a></p><div class=\"ex\"><h4>雄蛙</h4><p>找出睪丸，注意位置、形狀與顏色。</p></div><div class=\"ex\"><h4>討論一（雄蛙）</h4><ul><li>雄蛙體型較小，生殖季要吸引雌蛙，所以鳴囊發達。</li><li>前肢較粗，前肢內掌的肉突可幫助假交配時攀附雌蛙。</li></ul></div><div class=\"ex\"><h4>泌尿與生殖</h4><p>生殖與泌尿系統在尿道（泄殖腔）處會合，向外開口共用。</p></div>", "tb": [["step_009", "P210完整課本頁"], ["step_010", "P211完整課本頁"]]}, {"id": "b3-a63-l19", "t": "脂肪體：能量儲備與季節證據", "sec": "s5", "slide": 40, "sourceSlides": [40], "sourcePages": [10], "src": "課本P211；PPT 40", "figSpec": {"image": "uro"}, "txt": "<h3>觀察與理解</h3><ul><li>圖中的黃色指狀脂肪體鄰近生殖腺，是蛙重要的脂質儲存部位。</li><li>可支持非攝食期維持及生殖等能量需求；變化受物種、季節、性別與營養狀態影響。</li><li>蛙不像人類具有發達的皮下保溫脂肪層，不等於皮膚或其他組織完全沒有脂質。</li></ul><p class=\"thinking\"><strong>想一想</strong> 要檢驗脂肪體和生殖的關係，需要哪些不同時期樣本？</p><div class=\"scope-note\">不把秋冬儲脂、冬眠及初春繁殖套用所有物種；相關變化仍不直接證明因果。</div><p>查核 2026-10-10：<a href=\"https://pubmed.ncbi.nlm.nih.gov/8907147/\" target=\"_blank\" rel=\"noopener noreferrer\">蛙脂肪體超微構造原始研究 ↗</a></p><div class=\"ex\"><h4>討論三：脂肪體</h4><p>蛙沒有皮下脂肪組織。脂肪儲存在<b>脂肪體</b>：位於腎臟前端，黃白色指狀突起。</p></div><div class=\"ex\"><h4>功能推論</h4><p>蛙是外溫動物，脂肪體主要不是保溫。位置靠近生殖器官，推測主要功能是儲存養分，並與生殖腺發育有關。</p></div>", "tb": [["step_010", "P211完整課本頁"]]}, {"id": "b3-a63-l20", "t": "觀察紀錄：可見、推論與待查", "sec": "s5", "slide": 41, "sourceSlides": [41], "sourcePages": [10], "src": "課本P211；PPT 41", "figSpec": {"image": "digest"}, "txt": "<h3>觀察與理解</h3><ul><li>圖上標位置和視角；紀錄器官形狀、相鄰構造、尺度與標本狀態。</li><li>分欄寫「直接觀察」「功能推論」「待查資料」；查不到或看不清不勉強填答案。</li><li>照片不直接顯示血液流速、氣體交換率或受精成功；需其他方法取得證據。</li></ul><p class=\"thinking\"><strong>想一想</strong> 哪些內容是你真的看見，哪些只是根據課本預期？</p><div class=\"ex\"><h4>怎麼寫紀錄</h4><p>三欄：</p></div><div class=\"ex\"><h4>欄位</h4><ul><li><b>可見</b>：實際看到的位置、形狀、顏色。</li><li><b>推論</b>：根據可見現象推測的功能。</li><li><b>待查</b>：沒觀察清楚、需要查資料的部分。</li></ul></div>", "tb": [["step_010", "P211完整課本頁"]]}, {"id": "b3-a63-l21", "t": "完整討論：五個系統串連比較", "sec": "s5", "slide": 12, "sourceSlides": [12, 19, 20, 24, 30, 37, 38, 39, 40, 41], "sourcePages": [4, 6, 7, 8, 10], "src": "課本P205、207、208、209、211；PPT 12、19、20、24、30、37、38、39、40、41", "figSpec": {"image": "step_010"}, "txt": "<h3>觀察與理解</h3><ul><li>八個課本討論完整保留，從性別、循環、呼吸到脂肪及整體比較。</li><li>回答至少包含一個可見特徵、對應功能、與人體比較，以及推論限制。</li><li>沒有實作可用教材影像提出預測，清楚標示資料來源；個人文字不自動判分。</li></ul><p class=\"thinking\"><strong>想一想</strong> 同一個構造能否同時連結兩個系統的功能？</p><div class=\"ex\"><h4>完整討論：五個系統串連比較</h4><p>題目重點：</p></div><div class=\"ex\"><h4>各系統</h4><ul><li>外部：性別差異與繁殖行為的關係。</li><li>循環：二心房一心室與血液混合。</li><li>呼吸：正壓呼吸與皮膚呼吸。</li><li>消化：器官比例與食性。</li><li>泌尿生殖：共用出口與繁殖週期。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>每個差異都試著連到生態習性或生理功能，而不是只列出不同。</p></div>", "tb": [["step_004", "P205完整課本頁"], ["step_006", "P207完整課本頁"], ["step_007", "P208完整課本頁"], ["step_008", "P209完整課本頁"], ["step_010", "P211完整課本頁"]]}, {"id": "b3-a63-l22", "t": "提出報告：讓比較可被回查", "sec": "s5", "slide": 2, "sourceSlides": [2, 41], "sourcePages": [1, 10], "src": "課本P202、211；PPT 2、41", "figSpec": {"image": "digest"}, "txt": "<h3>觀察與理解</h3><ul><li>選一個系統提出可回答的比較問題，繪製位置或流向圖，標出來源頁碼。</li><li>以觀察支持結論，說明視角、尺度、季節及標本處理的限制；列一個替代解釋。</li><li>用3R重新檢視資料取得方式，報告不要求再增加活體操作。</li></ul><p class=\"thinking\"><strong>想一想</strong> 如果另組得到不同觀察，你會先核對哪項條件？</p><div class=\"ex\"><h4>討論四：口頭或書面報告</h4><p>選擇蛙的任一器官系統，說明包含哪些器官，與人體相同系統的器官在外觀、構造、生理功能上有何差別。</p></div><div class=\"ex\"><h4>報告結構</h4><ul><li>系統包含哪些器官。</li><li>與人類的差異。</li><li>可能的生理與生態原因。</li><li>實驗倫理（3R）是否落實。</li></ul></div>", "tb": [["step_001", "P202完整課本頁"], ["step_ 吸入空氣？", "ref": ["p7_respiratory_lungs", "課本 P208 蛙肺臟構造與呼吸運動"], "opts": [["蛙體內具有發達的肌肉質橫膈膜，收縮時使胸腔體積擴大產生負壓吸氣", "T1"], ["蛙完全缺乏肋骨與橫膈膜，主要藉由口腔底部上下升降產生『正壓』吞氣入肺", null], ["蛙的肺臟由數億個微小微觀肺泡緻密組成，氣體交換表面積大於同體積人類", "T1"], ["蛙的聲門永遠處於完全敞開狀態，無法阻止水或食物掉入氣管", "T1"]], "ans": [1], "exp": "B正確：青蛙骨骼中完全缺乏肋骨，且體內不具備橫膈膜（A錯），因此無法像哺乳動物般利用胸廓擴張產生負壓吸氣。蛙採取特殊的『正壓呼吸（吞氣機制）』：先降下口腔底自鼻孔吸入氣體於口咽部，接著關閉外鼻孔並上升口腔底，產生高於大氣壓的正壓將氣體強行壓入囊狀肺臟中。C錯：蛙肺僅為簡單中空囊袋，無緻密真肺泡；D錯：聲門為具肌肉開閉之裂縫。"}, {"kind": "mc", "multi": true, "g": "g2", "title": "蛙心臟與大血管解剖特徵之深入剖析", "sub": "課本 P207 循環系統重點", "label": "多選題", "q": "解剖青蛙並觀察其正在搏動的心臟與循環血管，下列相關敘述哪些正確？（應選 3 項）", "hint": "檢核三腔室組成、動脈幹分支、靜脈竇位置與匯入、動脈血部分混合現象。", "ref": ["p6_heart_circulation", "課本 P207 蛙心臟示意圖"], "opts": [["蛙的心臟由二心房（左心房、右心房）與單一心室共同組成，屬於三腔心臟", null], ["心室前端發出粗大的動脈幹，分支為頸動脈弓、體動脈弓與肺皮動脈弓", null], ["背面薄壁膨大的靜脈竇接收全身各大靜脈回流血液，隨後注入右心房", null], ["左心房與右心房之間具有完全相通之巨大永久卵圓孔，兩心房永不分開", "T1"], ["蛙心室收縮時產生的充氧血與缺氧血百分之百完全隔絕，絕無任何混血", "T1"]], "ans": [0, 1, 2], "exp": "A、B、C正確。D錯：左心房（接肺靜脈充氧血）與右心房（接靜脈竇缺氧血）之間被完整的房間隔完全分開，互不相通；E錯：蛙僅具有單一心室，充氧血與缺氧血在心室內部會產生部分混合（不完全雙循環）。"}, {"kind": "mc", "multi": true, "g": "g2", "title": "蛙口腔攝食構造與消化附屬臟器實體辨別", "sub": "課本 P205、P209 口腔與消化系統", "label": "多選題", "q": "觀察青蛙的頭部口腔與腹腔消化器官時，下列解剖構造與功能特徵的配對，哪些正確？（應選 3 項）", "hint": "檢視舌根在前倒生、鋤骨齒、三葉肝臟與膽囊、腸繫膜肝門脈循環。", "ref": ["p4_frog_external_mouth", "課本 P205、P209 消化系統觀察"], "opts": [["蛙舌根著生於下頜前端、舌尖游離向後分叉，捕食時能瞬間向前翻彈黏住獵物", null], ["口腔頂部具有一對微小的鋤骨齒，主要功能為防止吞入之活體昆蟲滑動掙脫", null], ["腸繫膜內密布的小靜脈匯聚成粗大的肝門靜脈，將腸道吸收之養分優先送至肝臟", null], ["青蛙具有咀嚼磨碎獵物之強大臼齒，進食時先在口腔內細嚼慢嚥後再吞下", "T2"], ["膽囊為位於胰臟內部之深紫色長條構造，專門分泌大量鹽酸活化胃蛋白酶", "T2"]], "ans": [0, 1, 2], "exp": "A、B、C正確。D錯：蛙齒（上頜齒與鋤骨齒）細小如砂紙，不具咀嚼功能，僅起固定防滑作用，蛙進食時均為囫圇吞下；E錯：膽囊為位於肝葉之間的圓球狀墨綠色囊袋，儲存膽汁，分泌鹽酸的是胃壁黏膜腺體。"}, {"kind": "mc", "multi": true, "g": "g2", "title": "兩生類兩棲生態適應與脂肪生理之綜合探究", "sub": "課本 P204–211 演化適應綜合題", "label": "多選題", "q": "結合青蛙的解剖觀察與水陸兩棲生態習性，下列科學推論與分析哪些完全合理？（應選 3 項）", "hint": "檢核婚墊在抱接時之功用、脂肪體能量儲存而非皮下脂肪、皮膚呼吸與保濕、眼瞬膜水下保護。", "ref": ["p10_comparative_discussion", "課本 P204–211 討論總結"], "opts": [["雄蛙前肢第一指之婚墊，在假交配抱接時能防止滑脫，確保精卵在水中同步排出", null], ["蛙缺乏皮下隔熱脂肪，可避免阻礙皮膚微血管與外界水陸環境之氣體擴散與熱交換", null], ["生殖腺前端的指狀脂肪體在秋冬儲存大量脂質，為冬眠代謝與初春配子發育供能", null], ["青蛙眼部的瞬膜是一層堅硬不透明之骨板，在陸地上用以完全遮蔽陽光防止失明", "T3"], ["青蛙的大頭針解剖剪開體壁時，必須沿著腹部正中央正中線深處大力剪斷腹中靜脈", "T3"]], "ans": [0, 1, 2], "exp": "A、B、C正確。D錯：瞬膜為半透明之薄膜下眼瞼，在水中拉起可保護角膜同時維持水下視力，並非不透明骨板；E錯：腹部正中央正中線深處有粗大的腹中靜脈，解剖剪開時必須『略偏腹中線左側』避開該大血管，以免大出血遮蔽術野。"}], "bookText": ["探討活動 \n－3 蛙外部形態及內部構造的觀察\n前　言\n　　透過對蛙外部形態與內部構造的觀察與比較，可連貫前述章節內容，釐清各器\n官系統的相對位置、組成及其生理功能，從中學習辨別不同器官系統形態的異同。\n目　的\n　　本活動透過解剖操作，對蛙的各個器官系統分別進行系統性的觀察，記錄各構\n造外形、內部結構與其他器官的相對位置後，比較和人體的器官系統及所連結的生\n理功能有何差異，並了解這些差異如何對應到不同的生態習性或生理功能。\n原　理\n　　因動物體由各種不同的器官系統構成，所以解剖時需以系統性的觀察方式進\n行，並作整體的討論。以本活動為例，蛙的體內具有循環系統、消化系統、呼吸系\n統、泌尿系統及生殖系統等，參考步驟依序找出各個器官系統後再分別進行探討，\n並與人體的器官系統進行比較，進而探討這些差異在生理與生態習性上的關係。\n動物實驗倫理與規範\n　　為了解生物的構造與功能以及人體疾病的機轉及治療方法，動物實驗往往不可\n避免，但是在進行動物實驗之前，科學家必須遵循相關的動物倫理準則，且所有相\n關實驗步驟均須透過所屬單位「實驗動物照護及使用委員會」（Institutional Animal \nCare and Use Committee, IACUC）審查同意後方能進行實驗。動物實驗須遵循所\n謂 3R 原則：替代（replacement）、減少（reduction）及優化（refinement）。所謂\n替代即用其他可達到實驗目的的方法替代動物實驗；減少即如果必須進行動物實\n驗，實驗者應盡量降低所使用之動物數量，優化則是透過改進實驗程序，降低實驗\n中動物所承受的不適及痛苦。\n6\n202　選修生物 Ⅲ (全)\n", "器　材\n每組使用\n蛙 \n1 隻\n細玻璃管或細吸管 \n1 支\n實驗手套 \n1 雙\n解剖盤 \n1 個\n解剖用具 \n1 組\n有蓋廣口瓶 \n1 個\n大頭針 \n1 盒\n針筒 \n1 個\n餐巾紙或擦手紙 \n適量\n黑色食用色素溶液（或黑色鋼筆墨水） \n適量\n丁香油溶液（或苯氧基乙醇） \n適量\n第 6 章  生殖　203\n", "步　驟\n配製 1∼2％ 丁香油溶液，將蛙置入並浸泡 10∼20 分鐘，使其麻醉。\n1\ne： 可加入12.5％二甲基亞（DMSO）作為界面活性劑，使丁香油更易滲透入\n蛙的皮膚。\n將蛙以餐巾紙或擦手紙擦去多餘水分後，放置於解剖盤中，觀察其外部形態、外\n表有哪些構造？前後肢有何差異？並判斷其性別。\n2\na雄蛙\n鳴囊\n鼓膜\nb雌蛙\n眼睛\n鼻孔\n鼓膜\n皮膚\n後肢\n前肢\n 蛙的身體構造示意圖\n活動一\n蛙外部形態的觀察\n204　選修生物 Ⅲ (全)\n", " a蛙左前肢的趾部腹面構造；\nb蛙左後肢的趾部腹面構造。\n外掌瘤\n趾\na\nb\n蹼\n外蹠瘤\n打開蛙口，觀察其口腔內部牙齒、舌、聲門等構造。\n3\n 蛙口腔中的各種構造\n 蛙頭部的外形構造\n鼻孔\n眼\n鼓膜\n內鼻孔\n牙齒\n耳咽管\n聲門\n舌\n咽\n討　論\n1  根據觀察，是否可由外觀分辨蛙的性別？雄蛙與雌蛙的外觀有哪些差異？\n第 6 章  生殖　205\n", "以大頭針固定蛙的四肢，將蛙仰釘在解剖盤中的固定板上。\n1\n以鑷子輕輕將皮膚拉起，自體中央剪開皮膚。（圖中紅色箭頭表示剪開的方向，\n數字 1∼5 為剪開的順序）\n2\n自蛙體腹部中央略偏左處，避開大血\n管，沿直線向前剪開肌肉層，直剪至\n前肢附近，再於已剪開之兩端分別向\n左、右剪開，並將剪開的腹壁釘在解剖\n盤上。\n3\n1\n2\n4\n3\n5\n活動二\n蛙循環系統的觀察\n步　驟\n206　選修生物 Ⅲ (全)\n", "觀察蛙的內部構造，一眼看到最明顯的器官就是正在搏動的心臟。觀察心臟的腔\n室數目、心臟形狀、心臟表面有幾條血管、血管走向如何？找出主動脈與上、下\n大靜脈，及肺動脈與肺靜脈等循環系統的器官各位於何處？與其他生物的生理功\n能差異為何？\n從主動脈利用注射針筒注入黑色食用色素溶液（或黑色鋼筆墨水），觀察血管的\n分布。（此部分可待觀察完所有器官系統後再進行）\n4\n5\n心臟\na\nb\n右心房\n右心房\n肺靜脈\n靜脈竇\n心室\n下大靜脈\n左心房\n主動脈\n上大靜脈\n上大靜脈\n 蛙的心臟示意圖。a腹面觀；b背面觀。\n討　論\n1  根據觀察，畫出或以文字說明蛙的心臟構造、血管與肺部連結而成的循環路徑為何？\n第 6 章  生殖　207\n", "肺動脈\n肺臟\n微血管\n內鼻孔\n牙齒\n聲門\n 蛙肺臟的構造示意圖\n觀察蛙的內部構造，由心臟出發，順著肺動脈與肺靜脈可找出肺臟，其構造如下\n圖所示。打開蛙的口腔，找到「聲門」，用細吸管插入蛙喉頭的聲門處（小心不\n要插入食道），向內吹氣，觀察肺的膨脹及肺壁上微血管的分布。觀察蛙的胸腔\n組成、肺泡結構及大小和人體有何不同？在呼吸運動的機制上有哪些差異？\n1\n肺臟\n活動三\n蛙呼吸系統的觀察\n步　驟\n討　論\n1  根據觀察，畫出或以文字說明蛙的呼吸系統分為哪些部分？蛙的肺部具有什麼特\n徵？蛙是否具有橫膈呢？\n208　選修生物 Ⅲ (全)\n", "膽囊\n肝臟\n胃\n小腸\n大腸\n脾臟\n 蛙的消化系統示意圖（紅色字）\n大腸\n脾臟\n腸繫膜\n肝臟\n膽囊\n胰臟\n小腸\n胃\n食道\n脂肪體\n步　驟\n觀察消化系統中的肝門脈循環，試著找找看腸繫膜處的血管是否匯聚成一條大型\n靜脈，並且進入肝臟？此條靜脈即為肝門靜脈。\n2\n請依據學過的消化系統概念，依序找出食道、胃、肝臟、膽囊、胰臟、小腸、大\n腸等構造，觀察其相對位置與形態。消化系統各器官的比例與人類有何不同？在\n生理與生態上的可能原因為何？\n1\n在肝臟處找到肝動脈與肝靜脈。\n3\n活動四\n蛙消化系統的觀察（含部分循環系統）\n討　論\n1  根據活動二∼四的觀察，探討蛙的循環系統、呼吸系統及消化系統與人類有何不\n同？各器官的位置與形態大小和人類有何差異？在生理與生態上的可能原因為何？\n第 6 章  生殖　209\n", "步　驟\n若為雌蛙則找出卵巢，為雄蛙則找出睪丸，注意器官的位置、形狀及顏色。觀察\n蛙的生殖系統，其向外開口位於何處？與泌尿系統彼此間的關聯為何？\n2\n移除大部分的器官後，於靠近背部的地方可找到蛙的腎臟。蛙腎臟的構造如下圖\n所示，試著找到腎上腺、輸尿管、膀胱與尿道等構造，並請記錄其位置、形狀與\n大小。\n1\ne： 蛙受到驚嚇會排尿，所以常會找不到膀胱位於何處。建議可泡水，膀胱將會\n順著水的浮力漂起來。\n卵巢\n脂肪體\n大靜脈\n腎上腺\n輸尿管\n泄殖孔\n背大動脈\n小腸\n大腸\n膀胱\n腎臟\n子宮\n輸卵管\n輸卵管\n開口\n睾丸\n雌\n蛙\n雄\n蛙\n尿道\n（泄殖腔）\n 雌蛙、雄蛙的泌尿系統（紅色字）與生殖系統（藍色字）\n活動五\n蛙泌尿系統與生殖系統的觀察\n210　選修生物 Ⅲ (全)\n", "討　論\n1  根據觀察，判斷雄蛙與雌蛙生殖系統構造的差異，與外觀上的差異有何關聯？\n2  承上題，蛙的生殖系統中各器官的位置與人類有何不同？泌尿系統與生殖系統間\n的關係為何？在生理與生態上的可能原因為何？\n3  蛙具有皮下脂肪組織嗎？若無，則其脂肪儲存於何處？人類的脂肪組織分布於皮\n下，具有保暖與保護臟器的功能，蛙的脂肪可能具有什麼功能呢？ \n4  選擇蛙的任一器官系統，說明此器官系統包含哪些器官？與人體相同器官系統的\n器官在外觀、構造和生理功能上有何差別？（口頭或書面報告）\n第 6 章  生殖　211\n"], "pptText": {"1": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n前言\n       透過對蛙外部形態與內部構造的觀察與比較，可連貫前述章節內容，釐清各器官系統的相對位置、組成及其生理功能，從中學習辨別不同器官系統形態的異同。\n配合課本 \nP202\n1", "2": "探討活動 \n6-\n3\n \n蛙\n外部形態\n及內部構造的觀察\n目的\n      本活動透過解剖操作，對蛙的各個器官系統分別進行系統性的觀察，記錄各構造外形、內部結構與其他器官的相對位置後，比較和人體的器官系統及所連結的生理功能有何差異，並了解這些差異如何對應到不同的生態習性或生理功能。\n2\n配合課本 \nP202", "3": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n原理\n       因動物體由各種不同的器官系統構成，所以解剖時需以系統性的觀察方式進行，並作整體的討論。以本活動為例，蛙的體內具有\n循環系統\n、\n消化系統\n、\n呼吸系統\n、\n泌尿系統\n及\n生殖系統\n等，參考步驟依序找出各個器官系統後再分別進行探討，並與人體的器官系統進行比較，進而探討這些差異在生理與生態習性上的關係。\n3\n配合課本 \nP202", "4": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n　　為了解生物的構造與功能以及人體疾病的機轉及治療方法，動物實驗往往不可避免，但是在進行動物實驗之前，科學家必須遵循相關的動物倫理準則，且所有相關實驗步驟均須透過所屬單位「實驗動物照護及使用委員會」（\nInstitutional Animal\n \nCare and Use Committee, IACUC\n）審查同意後方能進行實驗。\n動物實驗倫理與規範\n4\n配合課本 \nP202", "5": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n　　動物實驗須遵循所謂 \n3R \n原則\n：\n替代（\nreplacement\n）\n、\n減少（\nreduction\n）\n及\n優化（\nrefinement\n）\n。\n◆ 優\n化\n：\n透過\n改進實驗程序，降低實驗中動物所承受的不適\n及\n\n痛苦\n◆ \n減少\n：\n如果\n必須進行動物實驗，實驗者應盡量降低所使用\n之\n\n動物\n數量\n◆ \n替代\n：\n用\n其他可達到實驗目的的方法替代動物實驗\n5\n配合課本 \nP202", "6": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n每組使用\n蛙\n1\n 隻\n針筒\n1\n 個\n細玻璃管或細吸管\n1\n 支\n餐巾紙或擦手紙\n適量\n實驗手套\n1\n 雙\n黑色食用色素\n溶液（或\n黑色鋼筆\n墨水）\n適量\n解剖盤\n1\n 個\n丁香油\n溶液（或\n苯氧基\n乙醇）\n適量\n解剖用具\n1\n 組\n有蓋廣口瓶\n1\n 個\n大頭針\n1\n 盒\n6\n配合課本 \nP203\n器材", "7": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動一 \n蛙外部形態的觀察\n步驟\n1\n配製 \n1\n～\n2\n％ 丁香油溶液，將蛙置入並浸泡 \n10\n～\n20 \n分鐘，使其麻醉。\n註\n可加入\n12.5\n％ 二甲基\n亞碸（\nDMSO\n）作為界面活性劑，使丁香油更易滲透入蛙的皮膚。\n7\n配合課本 \nP204", "8": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n將蛙以餐巾紙或擦手紙擦去多餘水分後，放置於解剖盤中，觀察其外部形態、外表有哪些構造？前後肢有何差異？並判斷其\n性別。\n2\n皮膚\n鼓膜\n眼睛\n鼻孔\n活動一 \n蛙外部形態的觀察\n後肢\n前肢\n8\n配合課本 \nP204", "9": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n雄蛙\n鼓膜\n鳴囊\n雌蛙\n活動一 \n蛙外部形態的觀察\n9\n配合課本 \nP204", "10": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n蛙頭部的外形構造\n鼻孔\n眼\n鼓膜\n蛙左後肢的趾部腹面構造\n趾\n蛙左前肢的趾部腹面構造\n活動一 \n蛙外部形態的觀察\n外掌瘤\n蹼\n10\n配合課本 \nP205\n外蹠瘤", "11": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n打開蛙口，觀察其口腔內部牙齒、舌、聲門等構造。\n內鼻孔\n牙齒\n耳咽管\n咽\n聲門\n舌\n活動一 \n蛙外部形態的觀察\n3\n11\n配合課本 \nP205", "12": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n討論\n1. \n根據觀察，是否可由外觀分辨蛙的性別？雄蛙與雌蛙的外觀有哪些差異？\n活動一 \n蛙外部形態的觀察\n答\n：\n可以\n，雄蛙與雌蛙外觀上的差異可藉由以下幾點\n判斷\n：\n(1\n)\n 體型\n：\n雄\n蛙一般體型較小，顏色較深；雌蛙體型較大，顏色較淺。\n(2\n)\n 前肢\n：\n雄\n蛙的前肢一般會較粗壯，有的在前肢內掌可觀察到肉突（俗稱婚墊），雌蛙則否。\n(3\n)\n 鳴囊\n：\n雄\n蛙因求偶時需鼓囊鳴叫，故鳴囊皮膚會較鬆弛，顏色也較深，雌蛙則否。\n(4\n)\n 其他\n：\n一般而言\n雄蛙的吻端較長而尖，雌蛙的吻端較鈍圓。\n12\n配合課本 \nP205", "13": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動二 \n蛙循環系統的觀察\n步驟\n1\n以大頭針固定蛙的四肢，將蛙仰釘在解剖盤中的固定板上。\n13\n配合課本 \nP206", "14": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n以鑷子輕輕將皮膚拉起，自體中央剪開皮膚。（圖中紅色箭頭表示剪開的方向，數字 \n1\n～\n5 \n為剪開的順序）\n活動二 \n蛙循環系統的觀察\n2\n14\n配合課本 \nP206", "15": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n自蛙體腹部中央略偏左處，避開大血管，沿直線向前剪開肌肉層，直剪至前肢附近，再於已剪開之兩端分別向左、右剪開，並將剪開的腹壁釘在解剖盤上。\n3\n活動二 \n蛙循環系統的觀察\n15\n配合課本 \nP206", "16": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n(a)\n(b)\n蛙的心臟示意圖\n。\n(a)\n腹面\n觀\n；\n(b)\n背面\n觀。\n觀察蛙的內部構造，一眼看到最明顯的器官就是正在搏動的心臟。觀察心臟的腔室數目、心臟形狀、心臟表面有幾條血管、血管走向如何？找出主動脈與上、下大靜脈，及肺動脈與肺靜脈等循環系統的器官各位於何處？與其他生物的生理功能差異為何？\n4\n右心房\n右心房\n肺靜脈\n靜脈竇\n上大靜脈\n主動脈\n上大靜脈\n左心房\n心室\n下大靜脈\n活動二 \n蛙循環系統的觀察\n16\n配合課本 \nP207", "17": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n心臟\n活動二 \n蛙循環系統的觀察\n17\n配合課本 \nP207", "18": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n從主動脈利用注射針筒注入黑色食用色素溶液（或黑色鋼筆墨水），觀察血管的分布。（此部分可待觀察完所有器官系統後再進行）\n5\n活動二 \n蛙循環系統的觀察\n18\n配合課本 \nP207", "19": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動二 \n蛙循環系統的觀察\n討論\n1. \n根據觀察，畫出或以文字說明蛙的心臟構造、血管與肺部連結而成的循環路徑為何？\n答\n：\n蛙的心臟具有左心房、右心房與一個心室。\n(1) \n肺部進行氣體交換後的充氧血，由肺靜脈流入左心房。\n(2) \n皮膚交換來的充氧血與全身組織流回的減氧血，則由上、下大靜脈進入右心房。\n19\n配合課本 \nP207", "20": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動二 \n蛙循環系統的觀察\n20\n配合課本 \nP207\n答\n：\n左、右心房的血液會一起流入單一\n心\n\n室，在\n心室中部分\n混合。心室\n中的\n血\n\n液\n再\n由動脈\n幹分支\n輸出\n：\n(1) \n氧濃度較高的血液被送往全身\n組\n\n織，供應\n氧氣與養分。\n(2) \n氧濃度較低的血液則被分流至\n皮\n\n膚\n與肺部，進行氣體交換。\n經過交換\n後\n：\n肺部\n的充氧血會再\n回流\n\n至\n左心房；皮膚的充氧血則回流至\n右\n\n心房\n；全身組織的減氧血同樣回流\n至\n\n右\n心房，完成一次循環。", "21": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動\n三\n \n蛙呼吸系統的觀察\n觀察蛙的內部構造，由心臟出發，順著肺動脈與肺靜脈可找出肺臟，其構造\n如下頁圖\n所示。打開蛙的口腔，找到「聲門」，用細吸管插入蛙喉頭的聲門處（小心不要插入食道），向內吹氣，觀察肺的膨脹及肺壁上微血管的分布。觀察蛙的胸腔組成、肺泡結構及大小和人體有何不同？在呼吸運動的機制上有哪些差異？\n1\n21\n配合課本 \nP208\n步驟", "22": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n蛙肺臟的構造示意圖\n活動\n三\n \n蛙呼吸系統的觀察\n內鼻孔\n牙齒\n聲門\n肺動脈\n肺臟\n微血管\n22\n配合課本 \nP208", "23": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動\n三\n \n蛙呼吸系統的觀察\n肺臟\n23\n配合課本 \nP208", "24": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動\n三\n \n蛙呼吸系統的觀察\n討論\n根據觀察，畫出或以文字說明蛙的呼吸系統分為哪些部分？蛙的肺部具有什麼特徵？蛙是否具有橫膈呢？\n答\n：\n請\n同學依照實際觀察結果作答。參考\n如下\n：\n(1) \n蛙的呼吸道連接鼻腔與口腔，具有左、右肺。\n(2) \n蛙肺的構造非常簡單，僅由兩個薄壁囊狀的構造構成，並無肺泡，因此氣體交換的效率不夠好，另需皮膚作為氣體交換的介面。\n24\n配合課本 \nP208", "25": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動\n三\n \n蛙呼吸系統的觀察\n討論\n根據觀察，畫出或以文字說明蛙的呼吸系統分為哪些部分？蛙的肺部具有什麼特徵？蛙是否具有橫膈呢？\n答\n：\n(3) \n蛙具有胸骨，不具肋骨，且無橫膈（體腔無胸腹之分）。故蛙的呼吸運動屬於以口加壓，將氣體壓入肺的正壓呼吸，和人體以改變胸腔體積與壓力，使氣體被動流入、流出的負壓呼吸不同。\n25\n配合課本 \nP208", "26": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動\n四\n \n蛙消化系統的\n觀察（含部分循環系統）\n步驟\n1\n請依據學過的消化系統概念，依序找出食道、胃、肝臟、膽囊、胰臟、小腸、大腸等構造，觀察其相對位置與形態。消化系統各器官的比例與人類有何不同？在生理與生態上的可能原因為何？\n26\n配合課本 \nP209", "27": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動\n四\n \n蛙消化系統的觀察（含部分循環系統\n）\n肝臟\n膽囊\n胰臟\n小腸\n脾臟\n腸繫膜\n食道\n胃\n大腸\n膽囊\n脾臟\n大腸\n小腸\n胃\n肝臟\n脂肪體\n27\n配合課本 \nP209\n蛙的消化系統示意圖（紅色字）", "28": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n觀察消化系統中的肝門脈循環，試著找找看腸繫膜處的血管是否匯聚成一條大型靜脈，並且進入肝臟？此條靜脈即為肝門靜脈。\n2\n活動\n四\n \n蛙消化系統的觀察（含部分循環系統\n）\n28\n配合課本 \nP209", "29": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動\n四\n \n蛙消化系統的觀察（含部分循環系統\n）\n在肝臟處找到肝動脈與肝靜脈。\n3\n29\n配合課本 \nP209", "30": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動\n四\n \n蛙消化系統的觀察（含部分循環系統\n）\n討論\n1. \n根據活動\n二～四\n的觀察，探討蛙的循環系統、呼吸系統及消化系統與人類有何不同？各器官的位置與形態大小和人類有何差異？在生理與生態上的可能原因為何？\n30\n配合課本 \nP209", "31": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動\n四\n \n蛙消化系統的觀察（含部分循環系統\n）\n答\n：\n(\n1\n)\n \n①\n \n循環系統\n：\n人類\n的心臟分為二心房二心室，左、右心臟並不相通，可區隔充氧血與減氧血，氧氣運送效率較高；蛙的心臟為二心房一心室，無法區隔充氧血與減氧血，氧氣輸送效率較差。\n②\n \n呼吸系統\n：\n人類\n利用肺呼吸，並藉由肋骨、肋間肌及橫膈的運動改變胸腔體積，產生肺內外的壓力差，屬於負壓呼吸；蛙的肺部構造簡單，呼吸效率差，且不具有肋骨與橫膈，屬於正壓呼吸。除了肺以外，蛙亦會利用\n皮膚進行氣體交換。\n③\n \n消化系統\n：\n人類\n的消化道為口腔→咽→食道→胃→小腸→大腸→肛門；蛙的消化道為口腔→食道→胃→小腸→大腸→泄殖腔→泄殖孔。\n31\n配合課本 \nP209", "32": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動\n四\n \n蛙消化系統的觀察（含部分循環系統\n）\n(2\n)\n 因\n體型的差異，蛙的器官皆較人類的小許多，器官形態與人類亦有所差異，請同學依照實際觀察結果作答。參考\n如下\n：\n①\n \n心臟\n：\n人類\n的心臟具有二心房二心室；蛙的心臟為二心房一心室，由外觀可見明顯的靜脈竇。\n②\n \n肺臟\n：\n與\n人類的肺不同，蛙的肺呈中空囊狀，表面遍布微血管。\n③\n \n腎臟\n：\n人類\n的腎臟呈蠶豆狀，約拳頭大小，位於腰部兩側後方，腎臟上方具有脂肪組織與腎上腺；蛙的腎臟為扁平長條狀構造，位於脊柱兩側，腎臟腹面的淡黃色線狀構造為腎上腺，腎臟前端則有黃白色的指狀突起（脂肪體）。\n32\n配合課本 \nP209", "33": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動\n四\n \n蛙消化系統的觀察（含部分循環系統\n）\n(3\n)\n 人類\n與蛙在生理與生態上存在許多差異，由上述討論可知蛙的循環系統運送氧氣的效率較差，且肺部並不發達\n，需\n藉由皮膚進行氣體交換，故\n生存在潮溼環境，\n以維持皮膚表面的溼潤。\n33\n配合課本 \nP209", "34": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動\n五\n \n蛙泌尿系統與生殖系統的觀察\n移除大部分的器官後，於靠近背部的地方可找到蛙的腎臟。蛙腎臟的構造\n如下頁圖\n所示，試著找到腎上腺、輸尿管、膀胱與尿道等構造，並請記錄其位置、形狀與大小。\n步驟\n1\n註\n蛙受到驚嚇會排尿，所以常會找不到膀胱位於何處。建議可泡水，膀胱將會順著水的浮力漂起來。\n34\n配合課本 \nP210", "35": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n雌蛙\n雄蛙\n活動\n五\n \n蛙泌尿系統與生殖系統的觀察\n腎臟\n小腸\n背大動脈\n大腸\n輸尿管\n膀胱\n尿道（泄殖腔）\n泄殖孔\n睪丸\n卵巢\n輸卵管\n輸卵管\n開口\n子宮\n脂肪體\n大靜脈\n腎上腺\n35\n配合課本 \nP210\n與生殖系統（藍色字）\n雌\n蛙\n、雄蛙的泌尿系統（紅色字）", "36": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動\n五\n \n蛙泌尿系統與生殖系統的觀察\n若為雌蛙則找出卵巢，為雄蛙則找出睪丸，注意器官的位置、形狀及顏色。觀察蛙的生殖系統，其向外開口位於何處？與泌尿系統彼此間的關聯為何？\n2\n36\n配合課本 \nP210", "37": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動\n五\n \n蛙泌尿系統與生殖系統的觀察\n討論\n1. \n根據觀察，判斷雄蛙與雌蛙生殖系統構造的差異，與外觀上的差異有何關聯？\n答\n：\n雌\n蛙的生殖系統受生殖週期影響形態差異較大，由於蛙為體外受精、子代數量較多，在生殖季期間，卵巢需要製造許多的卵排出，因此雌蛙體型較大，才足以容納這些待排出的卵；雄蛙體型較小，生殖季時需吸引雌蛙注意，故具有發達的鳴囊，此外雄蛙具有較粗的前肢，前肢內掌具有肉突，可幫助雄蛙在進行假交配時能夠攀附於雌蛙身上。\n37\n配合課本 \nP211", "38": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動\n五\n \n蛙泌尿系統與生殖系統的觀察\n2. \n承上題，蛙的生殖系統中各器官的位置與人類有何不同？泌尿系統與生殖系統間的關係為何？在生理與生態上的可能原因為何？\n答\n：\n(\n1\n)\n 人類\n的卵巢大小較為固定，左、右卵巢藉由輸卵管連接子宮（\n1 \n個）；蛙的卵巢位於腎臟外側，由許多黑白各半的卵組成，輸卵管呈彎曲的白色細管，前端膨大呈喇叭狀，後端膨大為子宮（\n2 \n個）。因具有明顯的繁殖週期，因此在生殖季時可見雌蛙的卵巢充滿黑白各半的卵，占滿大部分體腔。\n38\n配合課本 \nP211", "39": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動\n五\n \n蛙泌尿系統與生殖系統的觀察\n(2\n)\n 蛙\n無專門輸送精子與卵的管道，因此雄蛙精子的排出與尿液排出的路徑相同；雌蛙兩側的子宮連接至泄殖腔，接著藉由泄殖孔排出卵。\n雌蛙（卵\n）\n：\n卵巢\n→輸卵管→子宮→膀胱→泄殖腔\n→\n\n泄\n殖孔→體外。\n雄蛙（精子\n）\n：\n睪丸\n→腎臟→輸尿管→膀胱→泄殖腔→泄殖孔→體外。\n(3\n)\n 因\n蛙為體外受精，故雄蛙僅需有一管道足夠將精子排出體外就好，不需額外發育出專供生殖細胞排出的通道；而雌蛙由於卵體積較大，故仍有輸卵管、子宮等構造，協助將卵送至泄殖腔再排出體外。\n39\n配合課本 \nP211", "40": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動\n五\n \n蛙泌尿系統與生殖系統的觀察\n3. \n蛙具有皮下脂肪組織嗎？若無，則其脂肪儲存於何處？人類的脂肪組織分布於皮下，具有保暖與保護臟器的功能，蛙的脂肪可能具有什麼功能呢？\n答\n：\n(\n1\n)\n 蛙\n不具有皮下脂肪組織。\n(2\n)\n 蛙\n的脂肪體位於腎臟前端，呈黃白色的指狀突起。\n(3\n)\n 蛙為外溫\n動物，故其\n脂肪體的主要功能並非協助保持體溫，且脂肪\n體的分布位置靠近生殖器官，故推測其主要功能為儲存養分\n，並與\n生殖腺的發育有關。\n40\n配合課本 \nP211", "41": "探討活動 \n6-\n3\n \n蛙外部形態及內部構造的觀察\n活動\n五\n \n蛙泌尿系統與生殖系統的觀察\n4. \n選擇蛙的任一器官系統，說明此器官系統包含哪些器官？與人體相同器官系統的器官在外觀、構造和生理功能上有何差別？（口頭或書面報告）\n答\n：\n請\n同學依分組報告結果作答。\n41\n配合課本 \nP211"}, "source": {"bookPages": 10, "printedPages": "202–211", "pptPages": 41, "presentationKind": "pptx-static"}, "sourceCorrections": [{"ppt": [7], "note": "固定配方與時間不等於確認麻醉深度；活體操作依合格人員與核定流程。"}, {"ppt": [12, 37], "note": "雌雄外觀判讀限定物種、季節及成熟度，不只靠體型或單一線索。"}, {"ppt": [19, 20, 31], "note": "單一心室不等於完全均勻混血；肺皮循環需納入皮膚交換。"}, {"ppt": [24, 25, 31, 32, 33], "note": "肺有內部分隔與褶襞；不概括所有兩生類無肋骨，也不以原始落後替代機制比較。"}, {"ppt": [38, 39], "note": "雌蛙卵由卵巢入體腔再入輸卵管；雄蛙精子經腎內相關管道與尿生殖管道。兩者皆不以膀胱為必經站；雌蛙有輸卵管。"}, {"ppt": [40], "note": "重要脂儲備為脂肪體；不等於皮膚完全無脂質，季節變化依物種條件。"}], "checkedSources": {"lung_structure": ["蛙肺電顯：肺壁與分隔的原始研究", "https://pubmed.ncbi.nlm.nih.gov/32651399/"], "law": ["動物保護法第15、16、18條", "https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=M0060027"], "anesthesia": ["密西根大學：兩生類麻醉、止痛與手術指引", "https://az.research.umich.edu/animalcare/guidelines/guidelines-amphibian-anesthesia-analgesia-and-surgery/"], "breathing": ["Rana pipiens口腔與肺通氣研究", "https://journals.biologists.com/jeb/article/154/1/537/5967/Breathing-in-Rana-Pipiens-the-Mechanism-of"], "uro": ["木蛙雄性泌尿生殖管道原始研究", "https://scholarworks.uark.edu/jaas/vol76/iss1/6/"], "egg": ["UNSW胚胎學：蛙的生殖與發育原典", "https://embryology.med.unsw.edu.au/embryology/index.php?title=Book_-_The_Frog_Its_Reproduction_and_Development_3"], "fat": ["蛙脂肪體超微構造原始研究", "https://pubmed.ncbi.nlm.nih.gov/8907147/"], "atlas": ["Clarendon College：蛙構造觀察圖", "https://programs.clarendoncollege.edu/programs/NatSci/Biology/Zoology/zoo%20online%20outlines/Frog_Lab%20-%20short.pdf"]}};

function splitBlock(node,body){

}

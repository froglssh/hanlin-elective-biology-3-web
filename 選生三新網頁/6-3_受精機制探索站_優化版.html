const CONTENT={"pptText": {"1": "6-3 \n受精過程\n◆ 受精\n作用\n：\n◇ 精子與卵結合的過程\n配合課本 \nP186\n1", "2": "6-3 \n受精過程\n◇ \n位置\n：\n通常\n發生於輸卵管前端\n輸卵管\n卵巢\n子宮\n配合課本 \nP182\n、\n186", "3": "◇ \n過程\n：\n6-3 \n受精過程\n精子靠近次級卵母細胞，穿過外層的\n放射冠細胞\n頂體\n精子頭部分泌\n頂體蛋白\n，溶解次級卵母細胞的\n透明帶\n當一隻精子穿過透明帶，細胞膜與次級卵母細胞融合的瞬間，次級卵母細胞的\n表面結構發生改變\n，抑制其他精子進入\n僅精子的頭部進入次級卵母細胞，待次級卵母細胞完成減數分裂第二階段後，精核與卵核融合，形成\n受精卵\n精核\n卵核\n細胞質\n細胞膜\n細胞間隙\n透明帶\n濾泡細胞\n放射冠\n第二極體\n配合課本 \nP187\n胚胎由受精至著床的主要變化", "4": "  \n知識補給站\n次級卵母細胞外圍的構造\n　\n　\n次級\n卵母細胞的外圍具有放射冠與透明帶。\n　\n　\n放射\n冠為濾泡時期包裹在其最外層的濾泡細胞，在接近排卵時會受到激素刺激逐漸膨脹且結構變得鬆散，可協助次級卵母細胞脫離濾泡，進入輸卵管中。\n　\n　\n透明\n帶則是包圍在次級卵母細胞外圍的一層醣蛋白，其作用為保護次級卵母\n細胞\n，可\n阻隔異種精子，僅允許同種的精子進入並完成受精。\n配合課本 \nP186\n4", "5": "  \nQuestion\n1\n. \n有關受精的過程，下列敘述何者正確\n？　\n(\nA)\n受精後，次級卵母細胞才進行減數分裂第二\n階段　\n(\nB)\n受精時，精子的頭部及中節會進入次級卵母細胞，尾部留在卵\n外　\n(\nC)\n精子受精時會先利用頂體的酵素分解最外層的透明帶，再穿過放射冠細胞進入卵\n內　\n(\nD)\n可能會有兩個以上的精子同時進入卵內，除最先完成受精的精核外，其餘精核皆會被吸收代謝。\n解答\n：\n(\nA)\n5", "6": "  \nQuestion\n解析\n：\n(B\n)\n受精時，僅精子的頭部進入卵內。\n(C)\n受精時，精子會先穿過放射冠細胞，再利用頂體的酵素分解透明帶而進入卵內\n。\n(D)\n僅第一個精子進入細胞核。第一個精子的細胞膜與卵之細胞膜融合時，卵的結構會改變，抑制其他精子進入，避免多重受精。\n6"}, "lessons": [{"id": "b3-c63-l01", "t": "受精：從配子相遇到新基因組", "sec": "s1", "slide": 1, "sourceSlides": [1], "sourcePages": [1], "src": "原PPT第 1 頁；課本 P186–187", "figSpec": {"image": "PPT01S3"}, "txt": "<h3>教學重點</h3><ul><li>受精是精子與卵結合的過程，不是單一步驟。</li><li>配子相遇、穿越外被、膜融合、卵活化與遺傳物質結合各有判讀證據。</li><li>本節聚焦正常人類／哺乳類模型；圖是示意，不是顯微照片。</li></ul><p class=\"thinking\"><strong>想一想</strong> 只看兩個細胞靠近，能否判定已完成受精？</p><div class=\"scope-note\">證據範圍：本教材示意圖未提供獲能固定時長、必需精子數、微小溫差或臨床閾值；不從圖中補造數據。受精能力涉及多個步驟，個別構造外觀不能保證成功，也不以本頁提供個人醫療判定。</div><div class=\"ex\"><h4>受精作用</h4><p><b>精子與卵結合</b>的過程稱為受精作用，最後形成<b>受精卵</b>，重新組成雙套的遺傳訊息。</p></div><div class=\"ex\"><h4>本節重點</h4><ul><li>受精在哪裡發生</li><li>精子如何穿過外被</li><li>如何避免多重受精</li><li>精核與卵核如何結合</li></ul></div>", "tb": [["book1", "P186 完整課本頁"]]}, {"id": "b3-c63-l02", "t": "在哪裡相遇？輸卵管與子宮", "sec": "s1", "slide": 2, "sourceSlides": [2], "sourcePages": [], "src": "原PPT第 2 頁；課本 P186–187", "figSpec": {"image": "PPT02S3"}, "txt": "<h3>教學重點</h3><ul><li>原教材寫通常發生於輸卵管前端。</li><li>輸卵管、卵巢與子宮是不同構造；場所不能只靠「都在女性體內」分類。</li><li>受精與後續子宮著床是不同事件；不由此圖量出精確距離。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若把受精位置放在子宮，會混淆哪兩個過程？</p><div class=\"ex\"><h4>受精的位置</h4><p>通常發生於女性<b>輸卵管前端</b>。</p></div><div class=\"ex\"><h4>對照</h4><p>排卵後次級卵母細胞經輸卵管喇叭狀開口進入輸卵管（見 6-1），在此與精子相遇；之後受精卵到子宮著床。</p></div>", "tb": []}, {"id": "b3-c63-l03", "t": "外圍的兩層：細胞與醣蛋白", "sec": "s1", "slide": 4, "sourceSlides": [4], "sourcePages": [], "src": "原PPT第 4 頁；課本 P186–187", "figSpec": {"pair": ["coats-box", "structure"]}, "txt": "<h3>教學重點</h3><ul><li>放射冠由濾泡細胞組成。</li><li>透明帶為卵母細胞外的醣蛋白層，不等同細胞膜。</li><li>原補給站完整保留；可用構造局部圖核對由外向內的層次。</li></ul><p class=\"thinking\"><strong>想一想</strong> 透明帶與放射冠，哪個是多個細胞，哪個不是？</p><div class=\"scope-note\">範圍補充：頂體反應與透明帶穿越不是只由單一蛋白決定；小鼠體外研究也觀察到頂體反應在接觸透明帶之前開始。不能把小鼠或舊模型的ZP3敘述當作所有人類受精的唯一開關。<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://pubmed.ncbi.nlm.nih.gov/21383182/\">機制與範圍參考</a></div><div class=\"ex\"><h4>次級卵母細胞外圍的兩層</h4><p>外圍具有<b>放射冠</b>與<b>透明帶</b>，由外而內排列。</p></div><div class=\"ex\"><h4>比較</h4><ul><li><b>放射冠</b>：濾泡時期最外層的<b>濾泡細胞</b>；接近排卵時受激素刺激而膨脹、變鬆散，協助卵脫離濾泡進入輸卵管。</li><li><b>透明帶</b>：一層<b>醣蛋白</b>，保護卵母細胞，並阻隔異種精子，僅允許同種精子進入。</li></ul></div><div class=\"ex\"><h4>記法</h4><p>放射冠＝細胞；透明帶＝醣蛋白。</p></div>", "tb": []}, {"id": "b3-c63-l04", "t": "穿過外被，不等於完成膜融合", "sec": "s1", "slide": 3, "sourceSlides": [3], "sourcePages": [], "src": "原PPT第 3 頁；課本 P186–187", "figSpec": {"image": "full-process"}, "txt": "<h3>教學重點</h3><ul><li>由外向內：放射冠、透明帶、細胞間隙、卵母細胞膜。</li><li>精子可已穿過透明帶，仍未與卵母細胞膜融合。</li><li>位置圖提供路徑，不能單靠一張圖保證後續成功。</li></ul><p class=\"thinking\"><strong>想一想</strong> 「進入透明帶內側」與「進入胞質」怎麼區分？</p><div class=\"ex\"><h4>四個步驟的順序</h4><p>精子靠近次級卵母細胞後，依序是：</p></div><div class=\"ex\"><h4>步驟</h4><ul><li>① 穿過放射冠細胞</li><li>② 頂體蛋白溶解透明帶</li><li>③ 精子與卵細胞膜融合，卵的表面改變</li><li>④ 精子頭部進入，卵完成減數分裂第二階段，精核與卵核融合</li></ul></div><div class=\"ex g\"><h4>提醒</h4><p>穿過外被，並不等於已經完成膜融合。</p></div>", "tb": []}, {"id": "b3-c63-l05", "t": "步驟一：穿過放射冠細胞", "sec": "s2", "slide": 3, "sourceSlides": [3], "sourcePages": [], "src": "原PPT第 3 頁；課本 P186–187", "figSpec": {"image": "full-process"}, "txt": "<h3>教學重點</h3><ul><li>先找圖6-6的①及外層濾泡細胞。</li><li>放射冠層在透明帶外側；精子運動與周圍環境共同影響穿越。</li><li>不要把透明帶當最外層，也不猜造必需多少精子協同。</li></ul><p class=\"thinking\"><strong>想一想</strong> 為何原圖①在透明帶之外？</p><div class=\"scope-note\">證據範圍：本教材示意圖未提供獲能固定時長、必需精子數、微小溫差或臨床閾值；不從圖中補造數據。受精能力涉及多個步驟，個別構造外觀不能保證成功，也不以本頁提供個人醫療判定。</div><div class=\"ex\"><h4>步驟一：穿過放射冠細胞</h4><p>精子們穿過位於次級卵母細胞外層的放射冠細胞。</p></div><div class=\"ex\"><h4>要點</h4><p>此時精子尚未接觸卵的細胞膜；放射冠細胞比透明帶更外層。</p></div>", "tb": []}, {"id": "b3-c63-l06", "t": "步驟二：頂體反應與透明帶", "sec": "s2", "slide": 3, "sourceSlides": [3], "sourcePages": [], "src": "原PPT第 3 頁；課本 P186–187", "figSpec": {"image": "full-process"}, "txt": "<h3>教學重點</h3><ul><li>找頂體與②；原教材以頂體蛋白作用於透明帶說明穿越。</li><li>頂體位於精子頭部，與卵的皮層顆粒不同。</li><li>酵素作用、運動及辨識相互配合，不能用一項解釋全部。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若已到達透明帶，但無法穿越，哪一段還缺少證據？</p><div class=\"scope-note\">範圍補充：頂體反應與透明帶穿越不是只由單一蛋白決定；小鼠體外研究也觀察到頂體反應在接觸透明帶之前開始。不能把小鼠或舊模型的ZP3敘述當作所有人類受精的唯一開關。<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://pubmed.ncbi.nlm.nih.gov/21383182/\">機制與範圍參考</a></div><div class=\"ex\"><h4>步驟二：頂體反應</h4><p>精子頭部的<b>頂體</b>分泌<b>頂體蛋白</b>（富含酵素）。</p></div><div class=\"ex\"><h4>作用</h4><p>溶解透明帶，為精子進入次級卵母細胞開通道路。順序：先穿過放射冠，再分解透明帶。</p></div>", "tb": []}, {"id": "b3-c63-l07", "t": "步驟三：兩個細胞的膜相遇", "sec": "s2", "slide": 3, "sourceSlides": [3], "sourcePages": [], "src": "原PPT第 3 頁；課本 P186–187", "figSpec": {"image": "full-process"}, "txt": "<h3>教學重點</h3><ul><li>穿越透明帶後，精子膜才能接近卵母細胞膜。</li><li>兩膜融合與胞質相通，不等同先進入卵核。</li><li>原圖③的表面變化與限制多精進入相關。</li></ul><p class=\"thinking\"><strong>想一想</strong> 哪個層次正在融合：透明帶、細胞膜，還是核膜？</p><div class=\"scope-note\">來源差異：原圖與原PPT以「僅頭部進入」簡化。人類研究指出精子粒線體亦可隨受精進入卵母細胞，不能由母系粒線體DNA遺傳反推中節完全不進入。原圖與原題保留，補充與原文分列。<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.nature.com/articles/s41588-023-01505-9\">機制與範圍參考</a></div><div class=\"ex\"><h4>步驟三：膜融合</h4><p>當一隻精子頭部的膜與次級卵母細胞的細胞膜<b>融合</b>。</p></div><div class=\"ex\"><h4>意義</h4><p>這是精子與卵真正「接觸成為一體」的起點，也是啟動後續反應的訊號。</p></div>", "tb": []}, {"id": "b3-c63-l08", "t": "卵活化：由接觸走向細胞反應", "sec": "s2", "slide": 3, "sourceSlides": [3], "sourcePages": [], "src": "原PPT第 3 頁；課本 P186–187", "figSpec": {"image": "structure"}, "txt": "<h3>教學重點</h3><ul><li>融合相關訊號能啟動卵活化，並促使次級卵母細胞完成Ⅱ。</li><li>鈣離子訊號與皮層顆粒分泌可作機制補充，不是圖中直接量測結果。</li><li>IZUMO1–JUNO研究支持膜辨識的重要性；並非這一對蛋白單獨完成全部融合。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若膜接觸已發生，還需哪些結果才能支持卵已活化？</p><div class=\"scope-note\">機制補充：卵活化後的皮層顆粒分泌與透明帶修飾有助限制多精；小鼠研究支持ovastacin切割ZP2。物種與證據層次須分清，不能描述成永久不破的硬殼，也不把海膽的電性快阻直接套到人類。<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC3317803/\">機制與範圍參考</a>；<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.nature.com/articles/nature13203\">機制與範圍參考</a></div><div class=\"ex\"><h4>卵的活化</h4><p>膜融合後，卵不再只是被動等待，而是啟動一連串細胞反應。</p></div><div class=\"ex\"><h4>包括</h4><ul><li>表面結構改變（防止其他精子進入）。</li><li>恢復並完成減數分裂第二階段。</li></ul></div>", "tb": []}, {"id": "b3-c63-l09", "t": "防止多精：改變後續進入機會", "sec": "s2", "slide": 3, "sourceSlides": [3], "sourcePages": [], "src": "原PPT第 3 頁；課本 P186–187", "figSpec": {"image": "full-process"}, "txt": "<h3>教學重點</h3><ul><li>正常模型限制額外精子與卵再次融合。</li><li>原教材用表面結構改變說明；機制補充包含卵膜與透明帶層面的變化。</li><li>不是先讓多隻進入，再任意挑出一個精核。</li></ul><p class=\"thinking\"><strong>想一想</strong> 降低後續進入與消化已進入的精核，是同一機制嗎？</p><div class=\"scope-note\">機制補充：卵活化後的皮層顆粒分泌與透明帶修飾有助限制多精；小鼠研究支持ovastacin切割ZP2。物種與證據層次須分清，不能描述成永久不破的硬殼，也不把海膽的電性快阻直接套到人類。<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC3317803/\">機制與範圍參考</a>；<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.nature.com/articles/nature13203\">機制與範圍參考</a></div><div class=\"ex\"><h4>防止多重受精</h4><p>第一隻精子的膜與卵膜融合時，次級卵母細胞的<b>表面結構會改變</b>，抑制其他精子進入。</p></div><div class=\"ex\"><h4>意義</h4><p>避免多重受精，確保受精卵染色體組成正常（2n）。</p></div>", "tb": []}, {"id": "b3-c63-l10", "t": "步驟四：完成Ⅱ與第二極體", "sec": "s3", "slide": 3, "sourceSlides": [3], "sourcePages": [], "src": "原PPT第 3 頁；課本 P186–187", "figSpec": {"image": "structure"}, "txt": "<h3>教學重點</h3><ul><li>排卵時次級卵母細胞已在Ⅱ中期停滯。</li><li>活化後完成Ⅱ，形成卵及第二極體；姐妹染色分體分離。</li><li>第二極體是卵母細胞分裂產物，不是另一隻精子，也不等於植物極核。</li></ul><p class=\"thinking\"><strong>想一想</strong> 原圖標出第二極體，能支持哪個分裂事件已完成？</p><div class=\"scope-note\">時序補充：正常排卵釋出的是已進入減數分裂Ⅱ、停在中期的次級卵母細胞；受精相關活化使它完成Ⅱ，不是受精後才開始整個Ⅱ。多年停滯發生於初級卵母細胞的Ⅰ前期，不能移到次級卵母細胞。<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.ncbi.nlm.nih.gov/books/NBK9901/\">機制與範圍參考</a></div><div class=\"ex\"><h4>步驟四：完成減數分裂</h4><p>受精後，次級卵母細胞迅速完成<b>減數分裂第二階段</b>。</p></div><div class=\"ex\"><h4>產物</h4><p>形成 1 個<b>卵</b>與 1 個<b>第二極體</b>（小，會凋亡）。</p></div>", "tb": []}, {"id": "b3-c63-l11", "t": "n與C：指定細胞和時點", "sec": "s3", "slide": 3, "sourceSlides": [3], "sourcePages": [], "src": "原PPT第 3 頁；課本 P186–187", "figSpec": {"image": "structure"}, "txt": "<h3>教學重點</h3><ul><li>精子通常為n、1C；Ⅱ中期次級卵母細胞為n、2C。</li><li>完成Ⅱ後卵的母方基因組為n、1C，不能把極體DNA也加進同一細胞。</li><li>正常雙親各貢獻一套；總量是否已複製須指定時點。</li></ul><table><thead><tr><th>指定單位／時點</th><th>套數</th><th>DNA</th></tr></thead><tbody><tr><td>精子</td><td>n</td><td>1C</td></tr><tr><td>Ⅱ中期次級卵母細胞</td><td>n</td><td>2C</td></tr><tr><td>完成Ⅱ，母方原核複製前</td><td>n</td><td>1C</td></tr><tr><td>雙親各一套，合計複製前</td><td>2n</td><td>2C</td></tr></tbody></table><p class=\"thinking\"><strong>想一想</strong> 為何單套的次級卵母細胞仍有2C DNA？</p><div class=\"scope-note\">時序補充：正常排卵釋出的是已進入減數分裂Ⅱ、停在中期的次級卵母細胞；受精相關活化使它完成Ⅱ，不是受精後才開始整個Ⅱ。多年停滯發生於初級卵母細胞的Ⅰ前期，不能移到次級卵母細胞。<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.ncbi.nlm.nih.gov/books/NBK9901/\">機制與範圍參考</a></div><div class=\"ex\"><h4>n 與 C 要指定細胞與時間</h4><p>受精過程中不同時點的染色體套數與 DNA 量不同。</p></div><div class=\"ex\"><h4>舉例</h4><ul><li>排卵時的次級卵母細胞：n。</li><li>受精後完成第二階段：卵 n。</li><li>精核（n）與卵核（n）結合 → 受精卵 2n。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>比較時一定要先說清楚是「哪個細胞、哪個時點」。</p></div>", "tb": []}, {"id": "b3-c63-l12", "t": "兩個原核，如何結合遺傳訊息？", "sec": "s3", "slide": 3, "sourceSlides": [3], "sourcePages": [], "src": "原PPT第 3 頁；課本 P186–187", "figSpec": {"image": "structure"}, "txt": "<h3>教學重點</h3><ul><li>精核形成雄原核，卵方形成雌原核，各帶一套核基因組。</li><li>雙親染色體並非逐條「黏成一條」，也不是受精再減半。</li><li>原核形成與首次有絲分裂是不同時點。</li></ul><p class=\"thinking\"><strong>想一想</strong> 看見兩個原核，是否代表已經分成兩個細胞？</p><div class=\"scope-note\">機制補充：哺乳類可先見父、母兩個原核；其核膜在首次有絲分裂前解體，雙親染色體參與分裂。教材「核融合」表示親代遺傳物質結合，不宜想成兩個完整核膜直接熔成一個。<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.ncbi.nlm.nih.gov/books/NBK10055/\">機制與範圍參考</a></div><div class=\"ex\"><h4>兩個核的結合</h4><p>僅精子的頭部進入卵內，<b>精核</b>與<b>卵核</b>融合。</p></div><div class=\"ex\"><h4>結果</h4><ul><li>各帶來單套（n）染色體。</li><li>結合為雙套（2n）的受精卵。</li><li>父母雙方的遺傳訊息因此結合。</li></ul></div>", "tb": []}, {"id": "b3-c63-l13", "t": "精子進入與粒線體遺傳要分開", "sec": "s3", "slide": 3, "sourceSlides": [3], "sourcePages": [], "src": "原PPT第 3 頁；課本 P186–187", "figSpec": {"image": "full-process"}, "txt": "<h3>教學重點</h3><ul><li>原圖強調頭部與核遺傳物質進入，但屬簡化。</li><li>細胞內容物進入與其DNA能否傳給後代，是不同層次。</li><li>不能用母系粒線體DNA遺傳證明精子中節永不進入卵。</li></ul><p class=\"thinking\"><strong>想一想</strong> 原圖、細胞追蹤與後代DNA，各回答什麼問題？</p><div class=\"scope-note\">來源差異：原圖與原PPT以「僅頭部進入」簡化。人類研究指出精子粒線體亦可隨受精進入卵母細胞，不能由母系粒線體DNA遺傳反推中節完全不進入。原圖與原題保留，補充與原文分列。<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.nature.com/articles/s41588-023-01505-9\">機制與範圍參考</a></div><div class=\"ex\"><h4>進入的是哪些部分</h4><p>課本與原題強調：<b>僅精子的頭部</b>進入卵內。</p></div><div class=\"ex\"><h4>延伸</h4><p>後代的粒線體遺傳，是另一個層次的問題，需和「精子哪些部分進入卵」分開討論；本節依課本，只說頭部（含細胞核）進入。</p></div>", "tb": []}, {"id": "b3-c63-l14", "t": "完整原圖：四步驟與全部標誌", "sec": "s3", "slide": 3, "sourceSlides": [3], "sourcePages": [2], "src": "原PPT第 3 頁；課本 P186–187", "figSpec": {"image": "full-process"}, "txt": "<h3>教學重點</h3><ul><li>依①②③④順序追蹤外被穿越、膜融合與後續事件。</li><li>核對頂體、放射冠、透明帶、細胞膜、細胞質與第二極體。</li><li>此圖將先後事件畫在同一個卵上；不表示同時有四隻精子完成融合。</li></ul><p class=\"thinking\"><strong>想一想</strong> 如何用編號避免把連續示意誤讀為同時多精受精？</p><div class=\"scope-note\">原題用語補充：A的「進行第二階段」依原教材理解為完成Ⅱ，並非排卵時尚未進入Ⅱ；原答案A保留。B及原解析「僅頭部」屬教材簡化，不作人類細胞內容物進入範圍的普遍結論。原解析D的「進入細胞核」不可照字面理解：精子與卵母細胞膜融合後內容物進入胞質，再形成原核。<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.ncbi.nlm.nih.gov/books/NBK9901/\">機制與範圍參考</a>；<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.nature.com/articles/s41588-023-01505-9\">機制與範圍參考</a></div><div class=\"ex\"><h4>完整原圖的四個步驟</h4><p>結合課本圖 6－6 閱讀，每個標示都對應一個步驟。</p></div><div class=\"ex\"><h4>圖中標示</h4><ul><li>濾泡細胞／放射冠</li><li>透明帶</li><li>細胞質與細胞膜</li><li>卵核、精核、頂體、第二極體</li></ul></div>", "tb": [["book2", "P187 完整課本頁"]]}, {"id": "b3-c63-l15", "t": "干預模型：卡在哪個步驟？", "sec": "s4", "slide": 3, "sourceSlides": [3], "sourcePages": [], "src": "原PPT第 3 頁；課本 P186–187", "figSpec": {"image": "full-process"}, "txt": "<h3>教學重點</h3><ul><li>把穿越、融合、活化及基因組事件各自當作可觀察指標。</li><li>某步驟被繞過或成功，不保證全部後續正常。</li><li>比較相同條件的對照與干預，分清假說與臨床處置。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若直接把精子送入胞質，哪些證據仍要另外檢查？</p><div class=\"scope-note\">證據範圍：本教材示意圖未提供獲能固定時長、必需精子數、微小溫差或臨床閾值；不從圖中補造數據。受精能力涉及多個步驟，個別構造外觀不能保證成功，也不以本頁提供個人醫療判定。</div><div class=\"ex\"><h4>如果某一步被阻擋</h4><p>這是用來檢查理解的思考模型。</p></div><div class=\"ex\"><h4>推理</h4><ul><li>頂體蛋白失效 → 無法穿過透明帶。</li><li>膜無法融合 → 卵不被活化。</li><li>表面不改變 → 可能多重受精。</li></ul></div><div class=\"ex\"><h4>提醒</h4><p>這是依據流程的推理，不是對真實臨床案例的診斷。</p></div>", "tb": []}, {"id": "b3-c63-l16", "t": "示意圖與研究證據的界線", "sec": "s4", "slide": 3, "sourceSlides": [3], "sourcePages": [], "src": "原PPT第 3 頁；課本 P186–187", "figSpec": {"image": "PPT03S3"}, "txt": "<h3>教學重點</h3><ul><li>圖能支持構造關係和教材步驟。</li><li>精確時間、所需數量、分子唯一性與成功率需要另外的觀察或實驗。</li><li>研究先指定物種與條件，不把小鼠、海膽及人類混成一套。</li></ul><p class=\"thinking\"><strong>想一想</strong> 若要證明某蛋白必需，為何只看箭頭還不夠？</p><div class=\"scope-note\">範圍補充：頂體反應與透明帶穿越不是只由單一蛋白決定；小鼠體外研究也觀察到頂體反應在接觸透明帶之前開始。不能把小鼠或舊模型的ZP3敘述當作所有人類受精的唯一開關。<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://pubmed.ncbi.nlm.nih.gov/21383182/\">機制與範圍參考</a></div><div class=\"ex\"><h4>示意圖的界線</h4><p>課本與動畫都是<b>示意圖</b>。</p></div><div class=\"ex\"><h4>怎麼讀</h4><p>它能幫助我們理解順序與主要構造，但不能直接當成真實大小、速度或全部分子機制的證據。</p></div>", "tb": []}, {"id": "b3-c63-l17", "t": "原題：依教材模型判讀", "sec": "s4", "slide": 5, "sourceSlides": [5], "sourcePages": [], "src": "原PPT第 5 頁；課本 P186–187", "figSpec": {"image": "PPT05S3"}, "txt": "<h3>教學重點</h3><ul><li>保留原題完整A–D與原答案A。</li><li>先核對外被順序、單精正常模型及減數分裂完成。</li><li>原題用語有簡化，作答後須回看機制補充。</li></ul><p class=\"thinking\"><strong>想一想</strong> 原題A的「進行」在正常排卵時點應如何精確理解？</p><div class=\"scope-note\">原題用語補充：A的「進行第二階段」依原教材理解為完成Ⅱ，並非排卵時尚未進入Ⅱ；原答案A保留。B及原解析「僅頭部」屬教材簡化，不作人類細胞內容物進入範圍的普遍結論。原解析D的「進入細胞核」不可照字面理解：精子與卵母細胞膜融合後內容物進入胞質，再形成原核。<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.ncbi.nlm.nih.gov/books/NBK9901/\">機制與範圍參考</a>；<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.nature.com/articles/s41588-023-01505-9\">機制與範圍參考</a></div><div class=\"ex\"><h4>原題：受精的過程</h4><p>答案 <b>(A)</b>：受精後，次級卵母細胞才進行減數分裂第二階段。</p></div><div class=\"ex\"><h4>逐項</h4><ul><li>(A) 正確。</li><li>(B) 僅精子頭部進入。</li><li>(C) 順序顛倒：應先穿過放射冠，再分解透明帶。</li><li>(D) 第一隻精子融合後即抑制其他精子，避免多重受精。</li></ul></div>", "tb": []}, {"id": "b3-c63-l18", "t": "原解析：回到胞質與原核", "sec": "s4", "slide": 6, "sourceSlides": [6], "sourcePages": [], "src": "原PPT第 6 頁；課本 P186–187", "figSpec": {"image": "PPT06S3"}, "txt": "<h3>教學重點</h3><ul><li>原解析完整保留，不把原答案暗中改掉。</li><li>原解析D的「進入細胞核」屬不精確用語；應分清膜融合、進入胞質與原核。</li><li>以明確限定條件寫出更精確的機制說明。</li></ul><p class=\"thinking\"><strong>想一想</strong> 如何保留原題資訊，同時指出它的機制簡化？</p><div class=\"scope-note\">原題用語補充：A的「進行第二階段」依原教材理解為完成Ⅱ，並非排卵時尚未進入Ⅱ；原答案A保留。B及原解析「僅頭部」屬教材簡化，不作人類細胞內容物進入範圍的普遍結論。原解析D的「進入細胞核」不可照字面理解：精子與卵母細胞膜融合後內容物進入胞質，再形成原核。<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.ncbi.nlm.nih.gov/books/NBK9901/\">機制與範圍參考</a>；<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.nature.com/articles/s41588-023-01505-9\">機制與範圍參考</a></div><div class=\"ex\"><h4>原解析整理</h4><p>回到細胞質與原核的描述。</p></div><div class=\"ex\"><h4>重點</h4><ul><li>僅精子的頭部進入卵內。</li><li>先穿過放射冠，再用頂體酵素分解透明帶。</li><li>第一個精子的細胞膜與卵膜融合時，卵的結構改變，抑制其他精子。</li></ul></div>", "tb": []}], "questions": [{"t": "受精事件：階段歸位", "q": "將6張事件卡分到三個階段。", "learn": 13, "tag": "sequence", "hint": "先分辨外部路徑與融合後的卵反應。", "why": "正常模型中事件有先後，膜融合不是第一個外被穿越步驟。", "sub": "原PPT第 3 頁；課本 P186–187", "refs": [{"src": "full-process", "cap": "教材來源圖"}], "legacyQuestion": 1, "kind": "drag", "slots": [{"id": "g0s0", "label": "穿越外被", "group": 0}, {"id": "g0s1", "label": "穿越外被", "group": 0}, {"id": "g1s0", "label": "融合與活化", "group": 1}, {"id": "g1s1", "label": "融合與活化", "group": 1}, {"id": "g2s0", "label": "分裂完成與基因組", "group": 2}, {"id": "g2s1", "label": "分裂完成與基因組", "group": 2}], "pieces": [{"id": "ag0s0", "label": "穿過放射冠", "group": 0}, {"id": "ag0s1", "label": "穿越透明帶", "group": 0}, {"id": "ag1s0", "label": "精卵細胞膜融合", "group": 1}, {"id": "ag1s1", "label": "卵活化及皮層顆粒反應", "group": 1}, {"id": "ag2s0", "label": "完成Ⅱ並排第二極體", "group": 2}, {"id": "ag2s1", "label": "形成父母原核", "group": 2}], "sol": {"g0s0": "ag0s0", "g0s1": "ag0s1", "g1s0": "ag1s0", "g1s1": "ag1s1", "g2s0": "ag2s0", "g2s1": "ag2s1"}, "pre": {}, "id": "b3-c63-q01"}, {"t": "外層構造：組成與角色", "q": "依原補給站和圖，分類6張特性卡。", "learn": 2, "tag": "coats", "hint": "每組2張，區分細胞、基質和膜。", "why": "透明帶不是濾泡細胞或脂質細胞膜。", "sub": "原PPT第 4 頁；課本 P186–187", "refs": [{"src": "coats-box", "cap": "教材來源圖"}], "legacyQuestion": 2, "kind": "drag", "slots": [{"id": "g0s0", "label": "放射冠", "group": 0}, {"id": "g0s1", "label": "放射冠", "group": 0}, {"id": "g1s0", "label": "透明帶", "group": 1}, {"id": "g1s1", "label": "透明帶", "group": 1}, {"id": "g2s0", "label": "卵母細胞膜", "group": 2}, {"id": "g2s1", "label": "卵母細胞膜", "group": 2}], "pieces": [{"id": "ag0s0", "label": "濾泡細胞構成", "group": 0}, {"id": "ag0s1", "label": "位於透明帶外側", "group": 0}, {"id": "ag1s0", "label": "非細胞性的醣蛋白層", "group": 1}, {"id": "ag1s1", "label": "包圍卵母細胞外圍", "group": 1}, {"id": "ag2s0", "label": "包圍卵細胞質", "group": 2}, {"id": "ag2s1", "label": "可與精子細胞膜融合", "group": 2}], "sol": {"g0s0": "ag0s0", "g0s1": "ag0s1", "g1s0": "ag1s0", "g1s1": "ag1s1", "g2s0": "ag2s0", "g2s1": "ag2s1"}, "pre": {}, "id": "b3-c63-q02"}, {"t": "課本圖貼標籤：受精過程", "q": "依課本圖6–6，把標籤放回圖上的編號格：卵與外圍構造、頂體、精核與卵核，以及四個步驟的說明。", "learn": 5, "tag": "fert", "hint": "精子先穿過放射冠，頂體反應溶解透明帶，與卵細胞膜融合並抑制其他精子，最後精核與卵核融合。", "why": "精子穿過放射冠細胞，頂體分泌頂體蛋白溶解透明帶；一隻精子與次級卵母細胞膜融合後，卵表面改變以抑制其他精子進入；精子頭部進入，次級卵母細胞完成減數分裂第二階段並釋出第二極體，精核與卵核融合形成受精卵。", "sub": "課本 P186–187 圖6–6", "refs": [{"src": "mk_fert", "cap": "受精過程（標籤已遮蓋）"}], "kind": "drag", "mask": "mk_fert", "ar": 0.825, "layout": "side", "slots": [{"id": "s0", "label": "頂體", "group": 0, "x": 6.27, "y": 34.42, "v": false, "w": false}, {"id": "s1", "label": "精核", "group": 1, "x": 80.27, "y": 67.25, "v": false, "w": false}, {"id": "s2", "label": "卵核", "group": 2, "x": 48.96, "y": 70.19, "v": false, "w": false}, {"id": "s3", "label": "細胞質", "group": 3, "x": 81.2, "y": 72.98, "v": false, "w": false}, {"id": "s4", "label": "細胞膜", "group": 4, "x": 49.89, "y": 75.72, "v": false, "w": false}, {"id": "s5", "label": "第二極體", "group": 5, "x": 82.2, "y": 79.05, "v": false, "w": false}, {"id": "s6", "label": "細胞間隙", "group": 6, "x": 50.88, "y": 81.73, "v": false, "w": false}, {"id": "s7", "label": "透明帶", "group": 7, "x": 81.2, "y": 84.39, "v": false, "w": false}, {"id": "s8", "label": "濾泡細胞", "group": 8, "x": 50.88, "y": 87.26, "v": false, "w": false}, {"id": "s9", "label": "放射冠", "group": 9, "x": 80.83, "y": 93.09, "v": false, "w": false}, {"id": "s10", "label": "靠近並穿過放射冠", "group": 10, "x": 25.9, "y": 19.12, "v": false, "w": false}, {"id": "s11", "label": "頂體反應溶解透明帶", "group": 11, "x": 49.88, "y": 24.26, "v": false, "w": false}, {"id": "s12", "label": "融合並抑制其他精子", "group": 12, "x": 78.91, "y": 26.51, "v": false, "w": false}, {"id": "s13", "label": "精核卵核融合成受精卵", "group": 13, "x": 88.03, "y": 50.74, "v": false, "w": false}], "pieces": [{"id": "a0", "label": "頂體", "group": 0}, {"id": "a1", "label": "精核", "group": 1}, {"id": "a2", "label": "卵核", "group": 2}, {"id": "a3", "label": "細胞質", "group": 3}, {"id": "a4", "label": "細胞膜", "group": 4}, {"id": "a5", "label": "第二極體", "group": 5}, {"id": "a6", "label": "細胞間隙", "group": 6}, {"id": "a7", "label": "透明帶", "group": 7}, {"id": "a8", "label": "濾泡細胞", "grou
